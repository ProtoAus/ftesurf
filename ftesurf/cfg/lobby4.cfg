// ---------------------------------------------------------------------------
//  cfg/lobby4.cfg -- the BHOP (EASY) lobby.  QC build 57.
//  See cfg/lobby1.cfg for why the port is the identity and why they are spaced
//  by ten; only the three per-lobby values live here.
//
//  THE MAPS are Momentum tiers 1 and 2 (data/mapmeta.txt column 3) out of the
//  bhop maps that have both a BSP and an online zone file.  Left out on
//  purpose: the seven with a data/mapdeps.txt line -- bhop_ambience, _angst,
//  _everfast, _futile, _hades, _oldhoppers2, _stref_amazon -- which need CS:GO
//  or TF2 content and draw untextured for most players; bhop_aberrant and
//  bhop_avantura, which have no tier; and bhop_canals, whose Momentum gamemode
//  is 12, not bhop.  bhop_bowling's tier 1 is a submitter's suggestion
//  (mapmeta tsrc "sugg"), not a ranked tier.  cfg/lobby5.cfg takes tiers 3-6.
//
//  THE RCON PASSWORD IS INHERITED, AND IT IS IN THE REPOSITORY.  run.sh execs
//  cfg/lobby.cfg for every instance, and that file still carries a literal
//  rcon_password; lobby_local.cfg holds only the surfd shared secret, so nothing
//  overrides it.  Forwarding UDP 27540 therefore hands anyone who reads the
//  public repo an rcon channel to this lobby, exactly as it already does for
//  27510-27530.  MOVE rcon_password INTO cfg/lobby_local.cfg (mode 0600, off
//  repo) AND ROTATE IT BEFORE THESE PORTS ARE FORWARDED -- the value in git
//  history is burned and must not be reused.  surfd/mkadminpw.py says the same.
//
//  NO PHYSICS HERE, AND NONE IS NEEDED.  The engine loads cfg/mode_bhop.cfg on
//  every map load for a bhop map (SV_LoadGamemodeRuleset, sv_phys.c).  The Pi
//  has no data/mapmeta.txt, so the gamemode comes from the bhop_ name prefix,
//  which is right for every map below.  Leaving a map restores only the cvars
//  mode_bhop.cfg names, and cfg/lobby.cfg sets none of them.
// ---------------------------------------------------------------------------
set sv_port     27540
set hostname    "FTESurf -- bhop (easy)"

set lobby_maps  "bhop_eazy bhop_goldsrc2 bhop_alt_kuutio bhop_orgrimmar bhop_bowling bhop_dimensional bhop_monster_jam bhop_tripportals"
set lobby_cycle 1800
