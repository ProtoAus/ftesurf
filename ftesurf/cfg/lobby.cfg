// cfg/lobby.cfg -- Patch 270.  Turns a server into a public lobby.
//
// NOT auto-exec'd.  Run it explicitly:  fteqw-svarm64 ... +exec cfg/lobby.cfg +map surf_x
//
// DELIBERATELY NOT NAMED server.cfg, and this is the whole reason the file has
// this name instead of the obvious one.  SV_ExecInitialConfigs (sv_main.c:6650-
// 6665) is an if/else ladder:
//
//     if      cfg/server.cfg exists -> exec it
//     else if server.cfg     exists -> exec it
//     else if quake.rc       exists -> exec it
//     else if cfg/default.cfg exists -> exec it
//
// FTESurf has no server.cfg, so today cfg/default.cfg is what runs.  Creating a
// cfg/server.cfg would SILENTLY STOP cfg/default.cfg from being exec'd and take
// pm_physicsmode 1, pm_ticrate 0.015, sv_bigcoords 1 and sv_airaccelerate 150
// with it -- on a listen server as well as a dedicated one, so it would change
// single-player too.  An explicitly-exec'd file cannot do that to anyone.

// ---------------------------------------------------------------------------
// The lobby itself.  See sv_lobby.qc.
//
// `set`, not a bare assignment, and it is load-bearing.  This file is exec'd
// before the map, and every lobby_* cvar (like rec_enable beside it) is created
// by registercvar in worldspawn -- which has not run yet.  A bare `lobby_enable
// 1` at this point is "Unknown command" and is silently dropped.  `set` creates
// the cvar, and registercvar does not overwrite one that already exists, so the
// value set here survives the map load.
// ---------------------------------------------------------------------------

set lobby_enable    1
set lobby_avatars   1

// Players pass through each other.  Implemented as a two-bit dimension split,
// NOT as dimension_solid 0 -- the one-bit version reads as correct and silently
// stops every trigger on the map from firing.  sv_lobby.qc carries the proof.
set lobby_nocollide 1

// Pose updates per second.  The engine's own entity lerp covers the gap, so
// this is a bandwidth dial and not a smoothness one.  Set it to 5 and to 30 and
// count `Update` lines in cl_shownet 3 -- the count must follow.
//
// EXCEPT ABOVE A SPEED, AND THE SPEED IS  cl_lerp_maxdistance * lobby_av_rate.
//
// Found in Patch 278 and it is a defect in the shipped avatar system, not in
// anything new.  CL_LinkPacketEntities computes
//     maxdist = cl_lerp_maxdistance * cl_lerp_maxdistance      (cl_ents.c:4883)
// and then, at cl_ents.c:5013,
//     if (DotProduct(move, move) > maxdist || ...) isnew = true;
// whose own comment reads "disable lerping (and indirectly trails)".  `move` is
// the distance between two CONSECUTIVE RECEIVED poses, so at this rate it is
// speed/15.  cl_lerp_maxdistance defaults to 200 (cl_main.c:124), so:
//
//     200 * 15 = 3000 ups.  Above that an avatar is NOT INTERPOLATED -- it
//     steps 15 times a second -- and any .traileffectnum on it is skipped
//     entirely (the isnew branch at cl_ents.c:5921-5926 `continue`s).
//
// Surf speeds live above 3000 routinely, so this is the normal case and not an
// edge one.  The header essay in sv_lobby.qc says interpolation is free and
// cites cl_lerp_maxinterval; it is only half the story and this is the other
// half.
//
// Two ways up, and they multiply:
//   * raise cl_lerp_maxdistance on the CLIENT (it is a client cvar; 512 covers
//     6400 ups at this rate).  Costs: a genuine teleport shorter than that gets
//     smeared instead of snapped, for every entity, not just avatars.
//   * raise lobby_av_rate here.  30 doubles the ceiling to 6000 ups and doubles
//     the pose bandwidth.  Server-side, so it needs nothing from the client.
set lobby_av_rate   15
set lobby_av_alpha  1

// 0 = you do not see your own body.  Your own avatar is dropped for you in
// SV_Snapshot_BuildQ1 (sv_ents.c:4213), so it costs you nothing to network.
// Set 1 to put your own body back -- the only way to check your own pose and
// duck swap with one client, from ghost mode.
set lobby_av_self   0

// ---------------------------------------------------------------------------
// PER-PLAYER COLOUR (Patch 278).
//
// Every avatar is drawn from the same one-material model with the same flat
// green texture, so without this a lobby is a room full of identical boxes.
// .colormod tints the model per entity: 3 bytes on the frame it changes and
// zero after, and one multiply in the shader.  Free, in every sense that
// matters.
//
// 0 turns it off and gives back exactly today's flat green -- it writes the
// engine's identity value rather than white, so the field is not even flagged
// as changed.  That is the falsifier for the whole feature.
//
// A PLAYER PICKS THEIR OWN with
//     setinfo lobbycolor <1-12>
// from the client console.
//
// IT DOES NOT PERSIST, and do not assume otherwise -- an earlier draft of this
// comment claimed it did.  InfoBuf_WriteToFile is the only thing that writes
// setinfo lines into a config and it is gated on cfg_save_infos (cmd.c:4496),
// which the engine defaults to 1 but FTESurf sets to 0 in BOTH cfg/default.cfg
// (:25) and the saved ftesurf.cfg (:693).  So a setinfo lasts the session.
// topcolor and bottomcolor look like counter-examples in ftesurf.cfg and are
// not: those are CVAR_USERINFO cvars saved by the cvar path, and there is no
// way to make a new name CVAR_USERINFO from QC.
//
// To keep a colour, put the setinfo line in your own autoexec.
//
// 1..12 are, in order:
//     1 red        2 orange   3 yellow    4 chartreuse
//     5 green      6 spring   7 cyan      8 azure
//     9 blue      10 violet  11 magenta  12 rose
// 0 or unset means the server chooses.  A colour somebody else already has is
// declined silently and you keep the one you were given -- there is nowhere
// sensible to print an error to, and being told "taken" every second would be
// worse than being the wrong colour.
//
// Unpicked players get their colour from their player SLOT, strided by 5 round
// the twelve so consecutive joiners look nothing alike, and rotated by a random
// per-map offset so slot 1 is not red forever.  Nobody in a lobby of 12 or
// fewer shares a colour.  Above 12 they necessarily do.
set lobby_av_colors 1

// ---------------------------------------------------------------------------
// PER-PLAYER EFFECTS (Patch 278).  OFF FOR EVERYONE UNTIL THEY ASK.
//
// A player turns their OWN effects on with
//     setinfo lobbyfx <mask>
//         1 = speed trail   2 = floating motes   4 = self-lit belt
//     so 3 = trail + motes, 7 = everything.
// and, like lobbycolor above, it lasts the session unless they autoexec it.
//
// The effects match the player's colour: tools/mkavatarfx.py generates twelve
// coloured copies of each block into particles/ftesurf_avatar.cfg from the same
// palette sv_lobby.qc uses, because a particle effect carries its colour in the
// template and there is no per-entity tint for particles the way colormod is
// for models.
//
// YOU CANNOT SEE YOUR OWN.  lobby_av_self 0 means your avatar is never sent to
// you at all, so turning your effects on shows you nothing -- you are choosing
// how you look to other people.  Set lobby_av_self 1 and use ghost mode to
// check your own.
//
// THE TRAIL IS DISTANCE-SPACED, NOT TIMED: one particle every 16 units
// TRAVELLED (`step` in the generated blocks -- p_script.c:1418-1425 sets
// countspacing and count=1/n).  A standing player emits nothing, and the cost
// rises with speed rather than with the clock, which is what makes it
// affordable at all.  About 56 live particles per player at 2000 ups against
// r_part_maxparticles' 65536.
//
// ...but see the note on lobby_av_rate above: above cl_lerp_maxdistance *
// lobby_av_rate the engine drops the trail entirely, along with the
// interpolation.  THIS WAS 3000 ups AND SAID SO HERE -- an engine default of
// 200 times a 15 Hz pose rate, i.e. invisible in exactly the speed range the
// trail was meant for.  Patch 275 sets cl_lerp_maxdistance 512 in
// cfg/default.cfg, which lifts it to 7680 ups; the cost is written up there
// (a real teleport shorter than 512 units now smears into a slide).  Raise
// lobby_av_rate if you need more than that.
//
// lobby_av_fx 0 is the master off switch and beats every opt-in.
set lobby_av_fx     1

// How many players may carry particles at once, counted in join order.  0 is a
// real setting -- effects allowed, nobody gets them -- and is how you take the
// particles away without taking the switch away.  The colour is not capped;
// colour is identity and costs nothing per frame.
set lobby_av_fxmax  8

// ---------------------------------------------------------------------------
// Multiplayer basics.
// ---------------------------------------------------------------------------

// sv_playerslots wins over maxclients (sv_init.c:1401).  cfg/default.cfg sets
// it to 2, for a reason that has nothing to do with multiplayer: with ONE slot
// the engine freezes the whole simulation whenever the console or menu owns the
// keyboard.  Its own comment says this is the knob that goes up for lobbies.
set sv_playerslots  32

// Voice.  Entirely engine-side and effectively free -- Opus, routed through the
// server, already implemented.  Clients need +voip bound or cl_voip_send 1.
set sv_voip         1
set sv_voip_echo    0

// Recording is a solo-practice feature and must stay off in a lobby: the .rec
// buffers are per-player QC strings (~1.5 MB per 3-minute run), the files land
// on the SERVER's disk, and two players who tie collide on the filename.
//
// Patch 270 Stage 2 made this the belt to lobby_norec's braces: SV_RecEnabled
// now refuses in a lobby whatever this says, so the line is no longer the only
// thing between 32 players and 50 MB of QC string table.  Kept because it is
// the switch a person reading this file will look for.
set rec_enable      0

// ---------------------------------------------------------------------------
// PATCH 270, STAGE 2 -- the features that were written for one player.
//
// All four default to 1 already (sv_main.qc), so these lines change nothing.
// They are here because each one is a thing a person WILL want to turn off to
// see what happens, and because a config file is where you look for the list of
// what a lobby switches off.  Every one is ANDed with lobby_enable, so none of
// them can affect a single-player session.
//
// The full reasoning for each is at the Lobby_No* accessors in sv_lobby.qc.
// The one-line version of each failure, since all four are silent:
//
//   lobby_nopb 0       best.pb has no player dimension and is rewritten WHOLE.
//                      One stranger's finish overwrites the host's entire
//                      history for that map, and every player is shown that
//                      stranger's time as their own personal best.
//   lobby_norec 0      32 concurrent recordings as QC strings, on a machine
//                      with no swap.  The failure is the OOM killer.
//   lobby_nosaveloc 0  One shared save-point list.  Player A's delete-all
//                      removes player B's practice points mid-section.
//   lobby_retrigger 0  The first player through a trigger_once removes it for
//                      everyone behind them.  841 library trigger_onces wire
//                      an output, so on those maps that is the map's own
//                      progression logic disappearing for whoever is slower.
// ---------------------------------------------------------------------------
set lobby_nopb      1
set lobby_norec     1
set lobby_nosaveloc 1
set lobby_retrigger 1

// Per-player trigger touch state.  NOT lobby-gated, because with one player it
// is one bit and is indistinguishable from the shared version it replaces --
// which is also how it is falsified.  0 restores build 51's single toucher per
// trigger, one shared trigger_multiple `wait` gate, and one shared func_bhop
// landing count.
set vbsp_mp         1

// Not public yet -- this is a direct-connect test server.  sv_public 2 / a
// broker name is Stage 5, and note that mapcluster subservers never heartbeat
// at all (net_master.c:604), which is why the picker's player counts have to
// come from surfd rather than from any master.
set sv_public       0

set hostname        "FTESurf lobby (patch 270)"

// ---------------------------------------------------------------------------
// MAP ROTATION.  Patch 275.
//
// lobby_maps   -- the rotation, space separated, in order.  Empty = never
//                 rotate, which is the default and is what every listen server
//                 gets.
// lobby_cycle  -- seconds on each map.  0 = off.  FLOORED AT 60 in QC, because
//                 "lobby_cycle 30" reads as thirty MINUTES to anyone who has
//                 just read this comment, and thirty seconds would changelevel
//                 the server out from under a run.  1800 is the half hour.
//
// Two warnings go out on the way, at sixty seconds and at ten, and both name
// the destination -- "the map is changing" without saying to what is the thing
// that makes people leave instead of waiting.  An EMPTY lobby rotates silently;
// there is nobody to warn and the log line every half hour is just noise.
//
// CHANGING MAP BY HAND STILL WORKS AND DOES NOT FIGHT THE ROTATION.  From an
// rcon console:  rcon changelevel surf_lux.  The rotation looks up where it
// currently IS in the list each time rather than keeping an index, so an admin
// moving the server by hand just means the next automatic change follows on
// from wherever they put it.  Land somewhere off the list entirely and the
// rotation resumes at the top rather than giving up.
//
// A one-entry list does not rotate.  That is deliberate: changing to the map
// you are already on is a reload, not a rotation, and it would kick everyone
// off the map they are playing for no gain.
//
// PER-LOBBY VALUES ARE NOT SET HERE.  cfg/lobby1.cfg, lobby2.cfg and lobby3.cfg
// set the list, the port and the hostname for the tier-1, tier-2 and tier-3
// lobbies; this file holds only what all three share.
// ---------------------------------------------------------------------------
set lobby_maps      ""
set lobby_cycle     0

// ---------------------------------------------------------------------------
// The directory heartbeat (surfd), which is what puts this server in the map
// picker's "public lobbies" section with a live player count.
//
// DELIBERATELY EMPTY HERE.  The real values live in cfg/lobby_local.cfg on the
// server itself, which is mode 0600, is NOT in this repository, and is exec'd
// straight after this file by run.sh.  lobby_master_key is a shared secret that
// stops strangers injecting fake lobbies into the directory, and a shared
// secret in a version-controlled file is not a secret.
//
// The master server cannot do this job, and that is worth stating so it is not
// re-proposed: SV_Heartbeat (net_master.c:604) returns immediately for any
// subserver, so once lobbies are mapcluster children they never advertise
// themselves to any master at all.
//
// With lobby_master empty a server sends nothing anywhere -- which is what
// keeps every single-player listen server, running this same progs, silent.
set lobby_master      ""
set lobby_master_key  ""
set lobby_master_rate 5

// ---------------------------------------------------------------------------
// rcon, so the A/B can be driven from a client console instead of a restart.
//
// LAN-only test server: sv_public 0, not advertised anywhere, and rcon over
// UDP is plaintext -- fine here, NOT fine once this is reachable from outside.
// Stage 5 must replace this with something that is not a shared secret in a
// version-controlled file before the server is ever public.
// ---------------------------------------------------------------------------
set rcon_password "surf270lan"
