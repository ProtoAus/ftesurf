// P385PIB -- Patch 385's live-lobby target B (see p385pia.cfg): circles while A
// watches it, then spectates A mid-walk, prints `viewpos` inside its own hold,
// leaves with ESC and walks on.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p385pib
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
set name "p385piB"
setinfo lobbycolor 0
setinfo lobbyfx 0
waitms 8000
connect 192.168.1.102:27510
waitms 25000
menu_restart
waitms 500
ui_close
waitms 500
cl_yawspeed 140
echo ^5p385pib: circling
+forward
+left
waitms 26000
echo ^5p385pib: H spectate A mid-walk
spectate p385piA
-forward
-left
waitms 1500
cmd viewpos
waitms 6000
cmd viewpos
echo ^5p385pib: X esc
vote key 27 1
vote key 27 0
waitms 4000
echo ^5p385pib: walking on
+forward
+left
waitms 6000
-forward
-left
echo ^5p385pib: DONE
waitms 1000
quit
