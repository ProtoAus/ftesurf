// H2 eye -- is the player standing at the same height inside the carve window as
// outside it?  This is the actual pass/fail for Patch 213, and it is a WITHIN-BUILD
// test so it does not depend on comparing two executables.
//
// PM_PortalCSG's window only accepts a player whose origin is within ~16 units in
// front of the portal plane -- for portal_hub_exit (plane y -520, facing -y) that is
// y >= -536.125.  So:
//
//     y -560  is OUTSIDE the window.  The carve cannot touch this player.
//     y -528  is INSIDE it.           This is where the floor was being deleted.
//
// Both stand on the same flat doorway floor at z 96, 32 units apart.
//
// THE VIEW IS DELIBERATELY SIDE-ON (yaw 180, looking down -x).  The two positions
// differ only along y, which is now perpendicular to the view axis, so moving
// between them produces HORIZONTAL parallax and no vertical shift whatsoever.  Any
// VERTICAL movement between the two frames is therefore eye height and nothing else
// -- and a sink of 36 units at this focal length is hundreds of pixels, not a
// judgement call.
//
// Expected, if the fix works: the two frames sit at the same height.
// Expected, if the floor is still being carved: the inside-the-window frame is
// dramatically lower, because the player fell to about z 60 and stayed there.

cfg_save_auto 0
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "h2_eye"
scr_sshot_type png
cl_yieldcpu 0
cl_maxfps 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0
r_voidvis 1
vbsp_portal_render 1

waitms 2500
map surf_kitsune
waitmap 240
waitms 8000
sv_cheats 1

echo "@@@ H2E outside the window (y -560)"
setpos 0 -560 184 0 180 0
waitms 4000
screenshot_mega h2e_outside 1280 720
waitms 600

echo "@@@ H2E inside the window (y -528)"
setpos 0 -528 184 0 180 0
waitms 4000
screenshot_mega h2e_inside 1280 720
waitms 600

// And back out again, to show it is repeatable and not a one-off settle.
echo "@@@ H2E outside again (y -560)"
setpos 0 -560 184 0 180 0
waitms 4000
screenshot_mega h2e_outside2 1280 720
waitms 600

echo "@@@ H2E DONE"
waitms 1000
quit
