// Patch 817 review round 1: an off-profile step after the attempt began reaches a save
// cut from the kept attempt, and a load after the arm takes a start latch.
// tools/p817failrewind.py --prof grades it.
cfg_save_auto 0
name P817
fs_cache 0
log_enable 1
log_dir logs
log_name p817prof
cl_idlefps 0
cl_maxfps 1000
vid_fullscreen 0
waitms 3000
connect 127.0.0.1:27561
waitmap 60
waitms 8000
menu_restart
ui_close
hud_trail 1
rec_savelock 1
cl_slpredict 1
hud_rewind_chase 0
waitms 1000
cmd zone_goto 0
waitms 400
+forward
waitms 2800
-forward
waitms 800
echo ==== P817 BOX ====
cmd timer
waitms 400
m_accel 1
waitms 600
m_accel 0
waitms 600
cmd timer
echo ==== P817 S ====
rewind
waitms 500
rewind seek -0.6
waitms 200
rewind key 115
waitms 300
rewind key 115 up
waitms 1500
saveloc
echo ==== P817 LOAD ====
+sl_hold
waitms 900
-sl_hold
waitms 300
cmd timer
waitms 500
echo ==== P817 END ====
quit
