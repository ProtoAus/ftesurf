// Patch 502 predictions: A proves a running recorder and growing trail.
// B saves at A, grows an abandoned tail, loads: prefix survives, tail vanishes,
// clock runs and class is segmented. C rewinds and resumes: same invariants.
// D saves/loads in replay; E opens scores and replaces an open replay.
// Dedicated control additionally grades countdown, camera height and key-ups.
cfg_save_auto 0
fs_cache 0 // dedicated control shares freshly written loose prefixes with another process
log_enable 1
log_dir logs
log_name p502segments
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
run_resume 0
waitms 5000
map surf_dune
waitmap 60
waitms 8000
menu_restart
ui_close
hud_trail 1
hud_trail_prev 1
hud_trail_fade 2
rec_savelock 1
cl_slpredict 1
hud_rewind_chase 0
waitms 1000
echo ==== P502 A ====
say !m
waitms 2500
+forward
waitms 1100
cmd timer
trail
sl_save
waitms 500
-forward
waitms 700
trail
waitms 2300
echo ==== P502 B ====
trail
sl_load
waitms 600
trail
cmd timer
waitms 1300
trail
cmd timer
echo ==== P502 C ====
+duck
waitms 600
rewind
waitms 300
rewind
waitms 500
rewind seek -0.1
waitms 100
rewind status
screenshot p502-camera-duck.png
rewind seek -1.0
waitms 100
rewind status
screenshot p502-camera-stand.png
rewind save
waitms 800
rewind go
waitms 1000
-duck
trail
cmd timer
waitms 3500
echo ==== P502 C RELEASE ====
trail
cmd timer
rewind status
waitms 500
echo ==== P502 C ADVANCE ====
cmd timer
waitms 200
// Replace the implicit TIMED go row without deleting the explicit S row.
rewind
waitms 300
rewind
waitms 200
rewind seek -0.4
rewind go
waitms 3500
trail
cmd timer
echo ==== P502 D ====
replay data/saves/surf_dune/save002/run.rec
waitms 900
replay seek 0.5
sl_save
cmd sl_list // a later ack must not steal the save event's visual prefix
waitms 800
trail
saveloc
vote key 9 1
+showscores
waitms 400
scores status
-showscores
vote key 9 0
waitms 100
scores status
scores open
waitms 400
scores status
replay data/saves/surf_dune/save001/run.rec
waitms 800
replay status
+sl_hold
waitms 800
replay status
saveloc
cmd viewpos
cmd timer
trail
waitms 200
-sl_hold
echo ==== P502 END ====
quit
