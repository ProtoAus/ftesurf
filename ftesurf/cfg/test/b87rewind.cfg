cfg_save_auto 0
// BUILD 87 -- the recorder recounts after a save-state rewind.
//
// SV_RecRewind cut the body back to the save's mark but carried rec_rec_in (and
// the v7-v9 counts and sentinels) across, so the trailer over-counted <inputs>
// on every resumed file since v6, and v9's <row> would name rows the file no
// longer has.  SV_RecRecount now recounts every row-bound record from the kept
// prefix.  Observed through `cmd timer`'s new "rec rows" line, so no finish is
// needed (a scripted finish is a noclip flight, and the load moves the aim).
// BUFFERED: a stream cannot rewind.
//
// READS: B right after the save, C after walking on, D right after the load,
//        E after walking on from the load.
// PRE-REGISTERED
//   1  in_C > in_B (rows accrue while walking).
//   2  in_D <= in_B and in_D < in_C: the count is the kept prefix's.  Without
//      the fix rec_rec_in only ever grows, so in_D >= in_C -- the control is
//      the old code's own monotonicity.
//   3  in_E > in_D (recording continues from the recount).
//   4  `rec lines` after the load equals the mark, below C's.
// FALSIFIED IF: in_D >= in_C.
log_enable 1
log_dir logs
log_name b87rewind
developer 0
sv_cheats 0
set rec_enable 1
set rec_stream 0
set rec_runarchive 1
cl_idlefps 0
cl_maxfps 100
waitms 6000
map bhop_eazy
waitmap 45
waitms 3000
cmd sl_delall
cmd zone_goto 0
waitms 1000
setpos -352 -352 144 0 335.3 0
waitms 1000
echo ================================ B87REWIND A -- jump to start
+jump
waitms 700
-jump
waitms 500
+forward
waitms 600
-forward
waitms 400
cmd sl_save
echo ================================ B87REWIND B -- right after the save
cmd timer
waitms 300
+forward
waitms 900
-forward
waitms 400
echo ================================ B87REWIND C -- walked on
cmd timer
waitms 300
cmd sl_last
waitms 800
echo ================================ B87REWIND D -- after the load
cmd timer
waitms 300
+forward
waitms 600
-forward
waitms 400
echo ================================ B87REWIND E -- walked on from the load
cmd timer
waitms 500
echo ================================ B87REWIND done
waitms 500
quit
