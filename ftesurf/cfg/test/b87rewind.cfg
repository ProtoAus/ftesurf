//   B in 220 (565 lines)   C in 367 (859)   D in 301 (734)   E in 418 (966)
//   1  HELD (367 > 220).   3  HELD (418 > 301).
//   2  in_D < in_C HELD -- 301 against 367, where the old code's monotone count
//      would read >= 448.  in_D <= in_B FAILED (301 > 220): the D read comes
//      800 ms after the load and 81 rows accrued in that window (565 + 169 lines
//      = 734).  A harness-timing error, not the recorder's.
//   4  HELD in effect: 734 lines = the mark (~565) + the post-load rows.
//   Also seen: the load re-writes the floor records (ride 1 -> 2, pm 0 -> 1,
//   pe re-based), exactly what clearing the sentinels is for.
