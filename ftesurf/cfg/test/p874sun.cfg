// Patch 874 sun check: the sun prints its visibility ("env_sun: visible" / "hidden by <surface>")
// whenever it changes.  Untargeted suns keep CSun's (0,0,1): look straight up from each spawn.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name runlines_smoke
con_notifytime 0
cl_idlefps 0
cl_maxfps 100
vid_vsync 0
vid_fullscreen 0
vid_width 1280
vid_height 720
sv_public 0
set run_resume 0
developer 1
log_developer 1
scr_sshot_type png
waitms 1500

map surf_mom_training
waitmap 120
waitms 6000
menu_restart
ui_close
waitms 500
echo ==== S1 surf_mom_training up ====
noclip
setpos 0 0 64 -89 0 0
waitms 1500
screenshot p874s_mom
waitms 2500
noclip

map bhop_forevertranslucent
waitmap 120
waitms 6000
echo ==== S2 bhop_forevertranslucent up ====
noclip
setpos 64 -40 97 -89 180 0
waitms 1500
screenshot p874s_ft
waitms 2500
noclip

map bhop_eazy
waitmap 120
waitms 6000
echo ==== S3 bhop_eazy at the env_sun ====
noclip
setpos 896 320 512 -20.2 19.4 0
waitms 1500
screenshot p874s_eazy
waitms 2500
echo RUNLINES COMPLETE
quit
