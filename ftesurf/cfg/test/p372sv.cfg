// P372SV -- time limit and votes, dedicated server half (clients p372vb.cfg, then
// p372va.cfg).  From C:\FTESurf, with cfg/test/p360sf.zones.json copied to
// ftesurf/maps/zones/local/surf_666.json (remove it after) and no stub:
//   C:\FTEQuake\fteqwsv64.exe +set sv_port 27642 +set sv_public 0 +exec cfg/test/p372sv.cfg
// S = this cfg's first waitms; the clients run about 5 s ahead of it (p371).
//   surf_666:  nominations, !extend refused then passed, an end-of-map vote tied
//              (bhop_HeLL wins), a run holds the change, !rtv forces it (S+0..S+200)
//   bhop_HeLL: !rtv with nothing decided -> the map vote -> bhop_eazy (S+200..)
//   bhop_eazy: a vote open when an admin changelevels (no stale keys on the next
//              map), then lobby_vote 0 on surf_utopia: the control (no vote at all)
// PREDICTIONS / RESULTS: in p372va.cfg (the server's log lines are named there).
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p372sv
developer 1
exec cfg/lobby/lobby.cfg
sv_cheats 0
sv_guidkey "ftesurf-p372-probe-3"
set lobby_maps "surf_666 bhop_eazy surf_utopia bhop_HeLL"
set lobby_cycle 1800
set lobby_cycle_hold 30
set lobby_vote_time 20
set lobby_vote_cooldown 30
set lobby_extend_time 120
set lobby_rtv_delay 60
set run_resume_min 1
set run_resume_countdown 1
map surf_666
waitms 90000
echo ==== server S+90: lobby_cycle 150 (the end-of-map vote, after the cooldown) ====
set lobby_cycle 150
waitms 30000
echo ==== server S+120: lobby_cycle 60 (the deadline, then the hold) ====
set lobby_cycle 60
waitms 70000
echo ==== server S+190: lobby_cycle 1800 (the held deadline stands; no vote at the next map's start) ====
set lobby_cycle 1800
waitms 10000
echo ==== server S+200: lobby_rtv_delay 10 ====
set lobby_rtv_delay 10
waitms 50000
echo ==== server S+250: lobby_cycle 150 (a vote opens at once) ====
set lobby_cycle 150
waitms 7000
set lobby_cycle 1800
waitms 11000
echo ==== server S+268: an admin changelevel with the vote open ====
changelevel surf_utopia
waitms 17000
echo ==== server S+285: lobby_vote 0, lobby_cycle 60 (the control) ====
set lobby_vote 0
set lobby_cycle 60
waitms 75000
quit
