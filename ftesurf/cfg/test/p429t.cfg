// P429T -- the WATCHED player (server p429sv.cfg, watcher p429w.cfg started ~8 s
// after this one, from a -homedir with its own qkey).
//
// PRE-REGISTERED PREDICTIONS (screenshots ftesurf/screenshots/p429_*; `user`
// prints this client's view of its own userinfo):
//  S1 before the watcher asks (t~20 s): no *specby, no panel (p429_before).
//  S2 while watched (t~40 s): `*specby` = the watcher's entnum (2), and a
//     "Spec:" box with P429W under it at the right, under the map info
//     (p429_during).
//  S3 after `spectate off` (t~62 s): *specby gone, no panel (p429_after).
//  S4 `hud_specby 0` while watched hides the panel (p429_off, t~46 s) and the
//     key stays.
// FALSIFIED IF the panel shows with no watcher, misses one, or outlives them.
// RESULT 2026-09-22 (Windows fteqwsv64, watcher from a -homedir with its own
//   qkey): S1-S4 held.  `user P429T` printed no *specby at S1 and S3, `*specby 2`
//   at S2 and S4; the four crops show the box only in p429_during.  Two
//   watchers at once were not run (the list path is the same loop).
cfg_save_auto 0
log_enable 1
log_dir logs
developer 1
cl_idlefps 0
cl_maxfps 100
rate  2000000
drate 5000000
vid_fullscreen 0
name "P429T"
waitms 4000
connect 127.0.0.1:27636
waitms 3000
menu_restart
waitms 1000
ui_close
waitms 12000
echo p429t: S1
user P429T
screenshot p429_before
waitms 20000
echo p429t: S2
user P429T
screenshot p429_during
waitms 3000
set hud_specby 0
waitms 1500
screenshot p429_off
echo p429t: S4
user P429T
set hud_specby 1
waitms 15000
echo p429t: S3
user P429T
screenshot p429_after
waitms 1000
echo p429t: done
quit
