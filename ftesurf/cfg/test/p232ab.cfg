// Patch 232, A/B on one map in one session: surf_rise's ivy displacement with
// $vertexcolor/$vertexalpha ignored, then honoured.
//
// hl2_vertexcolor is the switch, and it exists for exactly this -- the same reason
// hl2_translucent, hl2_bumpmap, hl2_envmap and hl2_animated do.  0 reproduces every
// build before P232 (the keys parsed and dropped); 1 is the new default.
//
//   soniccolours/ivy_blendmodulate  WorldVertexTransition, $translucent 1, $nocull 1,
//                                   $vertexcolor 1, $vertexalpha 1, no $basetexture2,
//                                   painted onto a DISPLACEMENT -- the only surface
//                                   class that carries a vertex alpha other than 1.0
//                                   (mod_vbsp.c:2361 vs :2432).
//
//     hl2_vertexcolor 0  ->  program "vmt/transition#NOBLEND"
//     hl2_vertexcolor 1  ->  program "vmt/transition#VERTEXCOL#VERTEXALPHA#NOBLEND"
//
// Two vantages each, from the same setpos, so the four screenshots pair up:
//     000/001 = off        002/003 = on
//
// The banner is suppressed for the comparison: fs_missingwarn 0.  surf_rise has four
// unresolved prop materials (props_canaveral folding chairs, which are in no pack --
// verified against all five), and a red HUD banner across the middle of both shots
// helps nobody compare foliage.

log_enable 1
log_name p232ab
developer 1
cfg_save_auto 0
cl_idlefps 0
sv_cheats 1
fs_missingwarn 0

wait 200
echo ^5=== p232ab: BEFORE (hl2_vertexcolor 0) ===
hl2_vertexcolor 0
map surf_rise
waitmap 900
wait 180
echo ^5(expect: vmt/transition#NOBLEND -- no VERTEX args)
r_showshader soniccolours/ivy_blendmodulate
waitms 500
setpos -645 -1484 400 10 180 0
wait 60
screenshot
waitms 800
setpos -845 -1284 400 10 270 0
wait 60
screenshot
waitms 800

echo ^5=== p232ab: AFTER (hl2_vertexcolor 1) ===
hl2_vertexcolor 1
map surf_rise
waitmap 900
wait 180
echo ^5(expect: vmt/transition#VERTEXCOL#VERTEXALPHA#NOBLEND)
r_showshader soniccolours/ivy_blendmodulate
waitms 500
setpos -645 -1484 400 10 180 0
wait 60
screenshot
waitms 800
setpos -845 -1284 400 10 270 0
wait 60
screenshot
waitms 800

echo ^5=== p232ab done ===
wait 30
quit
