// ===========================================================================
//  P441PI -- the post-deploy connect check for Patches 441 and 442.
//    ftesurf64.exe -WindowStyle Minimized +exec cfg/test/p441pi.cfg
//    (cwd C:\FTESurf; log ftesurf/logs/p441pi.log.  Port 27540 is lobby 4; any of
//    27510..27620 works.)
//
//  WHY A CONNECT AND NOT A JOURNAL.  A lobby runs the PI's progs, so the only thing
//  that proves the deployed pair is this build is a line the deployed progs print and
//  an older pair cannot.  p438pi and p440pi established the shape; this file's
//  fingerprint is better than either, because Patch 441's gate gives a NEW answer to
//  a command those two already send.
//
//  WHAT EACH LINE PROVES
//   `sl_replay 900`  THE FINGERPRINT.  Patch 441 gates it on sv_cheats, and a lobby
//                    runs sv_cheats 0, so a 441+ SERVER progs answers
//                    `save: sl_replay needs sv_cheats 1`.  A 438..440 progs answers
//                    `save: replay event for slot 900` instead, and a pre-438 one
//                    prints `Unknown command`.  Three builds, three answers, and only
//                    the first can come from the pair just deployed.
//   `cmd viewpos`    Patch 435's second line (`velocity x y z  horizontal N`), and
//                    with Patch 442 the horizontal figure is beside a full-vector
//                    reading in `sl_list`; standing still it is 0 either way, so this
//                    is a fleet-intact check rather than a 442 fingerprint.
//   `scores lines`   Patch 437's builder summary -- 0 drawn is right with no row
//                    lined; the line existing is the check.
//   `replay status`  the viewer answers, so the csprogs loaded and CSQC is alive.
//   NO `Unknown command`, no QC fault (PR_StackTrace's `<file>.qc:<line>:` frame
//   line -- NOT the string `QC error`, which the engine never prints: 0 hits across
//   1550 logs, which is why p438view's old check could not fail).
//
//  A 442 FINGERPRINT IS NOT AVAILABLE FROM A CLIENT and this file says so rather than
//  implying one: SL_RowSpeed only shows itself through `sl_list`, which needs a saved
//  row on that lobby under this player's certificate.  The server half of 442 is one
//  line inside the Patch 435 gate, and cfg/test/p442jump.cfg is where it is measured.
//
//  RESULT (2026-09-26, after the a6bd548 deploy -- qwprogs 3096b6f5468bee3a, csprogs
//  d7c5a6aef4f6f961, all 12 lobbies restarted, nobody on).  Joined lobby 4 on 27540,
//  bhop_eazy, `FTESurf CSQC loaded`:
//    `save: sl_replay needs sv_cheats 1`   <- Patch 441's gate, the fingerprint: this
//                                            line cannot come from a 438..440 progs,
//                                            which answer `replay event for slot 900`
//    `velocity 0.0000 0.0000 0.0000  horizontal 0.0000` under the `setpos` line (435)
//    `lines: 0 drawn, 0 segments last frame` (437)
//    `replay: nothing loaded` (the viewer answers, so CSQC is alive)
//  Zero occurrences of `Unknown command`, zero QC faults, zero `Bad rcon`.
log_enable 1
log_dir logs
log_name p441pi
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
wait 600
connect 192.168.1.102:27540
waitms 22000
echo === p441pi handles
cmd sl_replay 900
waitms 900
cmd viewpos
waitms 800
scores lines
waitms 800
replay status
waitms 800
echo === p441pi done
quit
