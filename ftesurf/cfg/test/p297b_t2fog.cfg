cfg_save_auto 0
// Patch 297 investigation -- IS THE 3D SKYBOX FOG REACHING THE RENDERER?
//
// Lex on surf_tensor2: "on CS:S you can't see anything besides foggy building,
// but in mine, all of the build windows are black and very visable, and the town
// building are 'bright black'."
//
// tensor2's sky_camera (ent 445) carries, verbatim from the entity lump:
//     origin -5824 14720 1920   scale 256
//     fogenable 1   fogstart 3000   fogend 6000   fogcolor 41 66 90
// cl_fog.qc's Fog_EmitSky divides both distances by the sky_camera scale, which
// is what Source does too (viewrender.cpp Enable3dSkyboxFog), so the emitted
// command should be
//     skyroomfog 23.4375 0.160784 0.258824 0.352941 1 11.7188
// i.e. fog STARTS at 11.7 units and is SOLID past 23.4 units in skybox space.
// Skybox buildings are hundreds of units out, so in Source they are a flat wall
// of 41 66 90 -- which is exactly the CS:S screenshot.  Seeing them clearly
// means that fog is not being applied.
//
// WHAT THIS RUN ANSWERS, from the log alone, no vantage needed:
//   1. does the parser see it?      -> "fog: sky_camera fog 3000..6000 scale 256"
//   2. does a controller exist?     -> "fog: 1 controller, start on master_fog"
//   3. what got emitted?            -> the skyroomfog/fog localcmd lines
//   4. does the renderer hold it?   -> the readbacks below
// If 1 and 2 print but the skyroom still draws unfogged, the break is between
// cl.fog[FOGTYPE_SKYROOM] and R_DrawSkyroom's guard (gl_warp.c:368).
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000
wait 200

developer 1
log_developer 1
log_enable 1
log_dir logs
log_name p297b_t2fog
cl_maxfps 0
cl_idlefps 0
sv_cheats 1
con_notifylines 0
con_notifytime 0.01

echo ^5=== loading surf_tensor2 -- watch for the two `fog:` lines
map surf_tensor2
waitmap 600
waitms 9000
waitms 3000

echo ^5=== cvar readback ===
vbsp_fog
r_fog_linear
r_skyfog
vbsp_skyroom
r_sky_forcedepth
echo ^5=== fog state readback (no args should print current) ===
fog
skyroomfog
waitms 500

echo ^5=== the same two maps' controllers, for contrast: fantasy has NO sky_camera
map surf_fantasy
waitmap 600
waitms 9000
waitms 3000

echo ^5=== END OF RUN ===
waitms 500
quit
