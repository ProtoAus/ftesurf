// MEASURED 2026-09-19 -- Debian rig as surf, Xvfb :87, portable build
// linux-build-387 (7cb1179f1) and pre-387 (23f1ce06b).  Relative slave id 6
// ("Xvfb mouse").  OUTCOME (a): the XI1 device route is a bypass.
//   387:      MOTION 200 'm' at devid 0 = "Xvfb mouse", injected 0/-1 (ACCEPTED,
//             not rejected, not counted); BUTTON 50 key (25 x +/- 178) at devid
//             0 (ACCEPTED as real MOUSE1).  The " XTEST pointer" name check does
//             not see events posted AS a named physical slave.
//   pre-387:  MOTION 200 'm', BUTTON 75 key -- accepted too (mechanism valid).
// So XTestFakeDeviceMotionEvent/XTestFakeDeviceButtonEvent against the real
// slave's id is NOT caught by Patch 387.  arm B of p387inj (same build) DOES
// reject xdotool's core XTEST, so this isolates the XI1-device route.
// CEILING: the patch catches CORE XTEST requests only.  hidcheck's XTEST note
// and the ENGINE_PATCHES ceiling say so.
