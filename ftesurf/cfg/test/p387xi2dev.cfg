cfg_save_auto 0
// P387XI2DEV -- arm X (bypass review SHOULD 2): inject through the XI1
// XTestFakeDevice* calls named at the PHYSICAL relative slave, not the core
// XTEST slave xdotool drives. If the server posts them as that device, the raw
// event carries the real mouse's id, the " XTEST pointer" name check misses,
// and Patch 387 cannot reject them.
// Debian rig as surf, Xvfb :87, patched build, x11 (see p387inj.cfg's launch):
//   the driver reads `xinput list` for the relative slave id (Xvfb: "Xvfb
//   mouse"), gates on "Grabbed mouse", opens the journal, then runs the helper
//   `p387xtc <id> motion 200` and `p387xtc <id> button 25`.
//
// PRE-REGISTERED
//   X   the helper's 200 motions + 25 clicks: EITHER
//       (a) they land as `m`/`+`/`-` records at the physical slave's devid,
//           injected stays -1/0 -- the XI1-device route is a bypass the name
//           check cannot see, so the ceiling must read "core XTEST requests
//           only"; OR
//       (b) they are rejected (0 `m`) and counted in `i` -- the server routes
//           XTestFakeDevice* through the XTEST slave too, and the claim holds.
//   CONTROL (must accept): the same helper on the PRE-387 build lands as `m`;
//     if it shows no motion, the server did not deliver device events at all
//     and arm X is VOID (says nothing about the patch).
//   REFERENCE: arm B of p387inj (same build) rejects+counts xdotool's core
//     XTEST motion. So (a) here isolates the XI1-device route specifically.

exec cfg/test/_quiet.cfg

developer 2
log_developer 1
cl_maxfps 100
cl_idlefps 0
sv_cheats 0
m_filter 0
m_accel 0
cl_nocsqc 0
r_drawviewmodel 0

wait 200
map bhop_eazy
waitmap 600
waitms 5000
closemenu
ui_close
echo ^5=== P387XI2DEV READY
waitms 12000

echo ^5=== P387XI2DEV ARM X MOTION
in_rawmice
cmd timer
in_journal_begin
waitms 5000
in_journal_end data/p387_xXm.hid
waitms 1000

echo ^5=== P387XI2DEV ARM X BUTTON
in_journal_begin
waitms 5000
in_journal_end data/p387_xXb.hid
waitms 1000
cmd timer

echo ^5=== P387XI2DEV END OF RUN
waitms 1000
quit

