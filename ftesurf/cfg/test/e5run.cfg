cfg_save_auto 0
// E5 -- THE MEASUREMENT.  Can re-simulation cross a continuous trigger_push?
//
// Captured by cfg/test/e5push.cfg on surf_ecosystem; measured here with
// engine Patch 328's `pm_recsim`, the same harness that measured E3 and build
// 83 and with nothing added for this experiment -- which is the point.  Build 83
// taught it one record.  This asks what it still cannot read.
//
// THE SUBJECT.  data/e5trace.part -- FTESURF-REC 7, flags 0, startjit
// 2.0000 (-0.5707 -1.9822 0), 394 samples, 176 `in` rows, and ZERO `warp`
// records.  Zero is CORRECT and is itself a finding: surf_ecosystem's pad is a
// continuous trigger_push, and build 83 records only the SF_PUSH_ONCE arm --
// which exists exactly once in 1310 maps, on an unzoned minigame map.
//
// WHAT THE INDEPENDENT WITNESS SAW.  `run_bv_debug 1` printed, during the run:
//
//   basevel: paid #1 [AddOutput 0] '-1700.000000 -0.000149 0.000000'
//                                  -> speed 1972.8 (h +1712.8, v +0.0)
//
// and the recording's own samples agree with it to the decimal: at t=0.0000
// velocity steps from (-260, 0, 766.1) to (-1972.8, -0, 754.1), |dv| 1712.79.
// The file records the CONSEQUENCE and never the EVENT -- E3's sentence exactly,
// in a different currency.
//
// AND THERE ARE TWO INVISIBILITIES HERE, NOT ONE, which is the part that was not
// guessable and is why the plan refused to guess it.  Comparing each sample's
// actual displacement against what its own recorded velocity can explain:
//
//     before the pad      gap 0.07 u        (rounding)
//     the cash-out tick   gap 20.17 u       = 1344.6 u/s unexplained
//     after the pad       gap -0.03 u       (rounding)
//
//   (a) THE CASH-OUT, a discrete velocity impulse in PlayerPreThink.  A
//       `warp`-shaped record carries it, and carries it COMPLETELY, because
//       `warp` states post-event ORIGIN as well as velocity.
//   (b) THE RIDE, pmove.basevelocity moving the player DURING the move while
//       `.velocity` -- the thing recorded -- deliberately does not contain it.
//       That is the 20.17 u.  It is not an event; it is a parameter with a
//       DURATION, and no instantaneous record can express it.
//
// THE CONTROL IS INSIDE THE FILE, and it is what makes the arm mean anything.
// The run's first ~0.4 s is ordinary movement on the same map, in the same file,
// through the same tool: its gap is 0.07 u, so re-simulation MUST reproduce it.
// If arm 3 were already diverging before the pad, the divergence would say
// nothing about the carrier -- it would say the harness cannot read this map.
// So the pre-registration is about WHERE it diverges, not whether.
//
// rec_enable 0 SO THE LIVE RECORDER CANNOT OVERWRITE THE TRACE BEING MEASURED.
// Loading a map arms nothing here, but the streaming recorder writes
// data/parts/0.rec on any run that starts, and the subject was captured to that
// path before being copied to data/e5trace.part.  This is the second guard.
//
// PRE-REGISTERED:
//
//   1  The subject prints `FTESURF-REC 7`, `startjit 2 ...`, and ZERO warp
//      records -- and, because it is v7, pm_recsim must report that silence as
//      a STATEMENT ("nothing imposed state") rather than as an absence.  That
//      report is now WRONG on this file and the wrongness is the finding: a v7
//      file with no warps does not mean nothing imposed state, it means nothing
//      imposed state THAT BUILD 83 RECORDS.
//   2  Arm 1, the tick arithmetic, is exact -- it is a property of the file and
//      the carrier cannot touch it.  If arm 1 is not exact, something unrelated
//      is broken and every other number here is suspect.
//   3  Arm 2, the pinned loop, snaps to the sample every packet, so it papers
//      over the cash-out by construction -- exactly as it papered over the
//      teleports in E3.  Its median should sit near the file's own 0.005 u
//      printing floor EXCEPT at the pad.
//   4  Arm 3, the OPEN LOOP, diverges AT THE PAD and not before.
//
// FALSIFIED IF: arm 3 diverges before the pad (the harness cannot read this map
//      and nothing here is attributable); or arm 1 is inexact; or arm 3 crosses
//      the pad unharmed, which would mean the carrier is somehow already in the
//      file and this whole experiment is misconceived.
log_enable 1
log_dir logs
log_name e5run
developer 0
set rec_enable 0
set rec_stream 0

waitms 6000
map surf_ecosystem
waitmap 60
waitms 4000

echo ================================ E5RUN -- subject: e5trace.part
pm_recsim data/e5trace.part
waitms 3000

echo ================================ E5RUN -- done
waitms 1000
quit
