// Patch 396 -- common client prologue for the p396* arms (exec'd by each arm).
// Command line sets p396_fps, p396_delay, cl_predict_angleexact, cl_predict_angledebug
// and log_name; C0 (the shipped exe) has no angle cvars, so `set` makes inert ones.
// The prederr lines and the predtrace verdict (rendered frames per command) gate the arm.
cfg_save_auto 0
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0
menu_restart
waitms 1500
connect 127.0.0.1:27666
waitms 25000
echo ^5=== p396 prologue: connected
cl_trigdebug 1
cl_prederror 2
cl_delay_packets $p396_delay
cl_maxfps $p396_fps
echo ^5=== p396 cvars: fps $cl_maxfps delay $cl_delay_packets exact $cl_predict_angleexact debug $cl_predict_angledebug netfps $cl_netfps extrap $cl_predict_extrapolate c2spps $cl_c2spps
waitms 1000
cl_predtrace -300
waitms 3000
cmd noclip
waitms 800
