// Patch 340 post-deploy verification against a LIVE Pi lobby: the shipped
// csprogs must run the chatbox, the customizer and the room list against the
// real server (sv_guidkey set there, so *phash is real), and idle quietly --
// the p339pi shape with the new surfaces on top.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p340pi
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0
wait 600
connect 192.168.1.102:27510
waitms 25000
menu_restart
waitms 500
ui_close
waitms 500
cl_prederror 2
echo === identity on a keyed lobby (cl_pcolour 1..12, hash on the panel):
cl_pcolour
cmd say p340pi chatbox check
waitms 1500
screenshot p340pi_chat
hud_player open
waitms 800
screenshot p340pi_custom
hud_player close
scores open
waitms 1500
screenshot p340pi_players
scores close
echo === trig census + idle:
trig_dump
waitms 8000
cmd viewpos
waitms 800
echo === p340pi done
quit
