// Patch 417 -- WHO MAY ASK A CLIENT TO SIGN, and the refusal path.
//
// p417sign.cfg proves a receipt is written when there is a run to write one
// about.  This arm proves the two things that arm cannot see:
//
//   THE COMMAND REACHES THE SERVER AT ALL when the player runs it, and a
//   receipt with no run behind it is refused there, by name.  This is also the
//   arm that found the crash -- a `rec_sign` that took its arguments and then
//   stopped writing the log mid-command is what a missing printf argument looks
//   like from outside.
//
//   A SERVER MAY NOT ASK.  The review's worst finding: every command CSQC can
//   reach through localcmd is also reachable from a server's stufftext, so any
//   server could mint the key file on a client that had never played a ranked
//   run, read back its public key, and -- by relaying a nonce taken from a real
//   server -- have a victim's client sign a statement the attacker then posted
//   as their own run's receipt.  `rec_sign` now refuses anything arriving at
//   RESTRICT_SERVER.  The engine's own `stuffcmd` console command drives
//   exactly that path on a listen server, which is what makes this testable at
//   all.
//
// Run from C:\FTESurf:
//   ./ftesurf64.exe -WindowStyle Minimized +exec cfg/test/p417probe.cfg
//
// PRE-REGISTERED PREDICTIONS
//  P1  `rec_pubkey` prints a 64-character key, and the same one on every run:
//      the key is made once and read back from `fskey` after that.
//  P2  bare `rec_sign` prints its usage line -- the command exists and is
//      entered, which is the control for P3 meaning anything.
//  P3  `rec_sign <32 hex> 123 - 0` typed as a CONSOLE command reaches the
//      SERVER and is refused there with `receipt refused -- no run id or no
//      nonce`.  A client-side failure would print nothing at all, which is what
//      the first three runs of this arm did.
//  P4  the SAME command delivered by `stuffcmd` prints, on the CLIENT,
//      `rec_sign: a server asked this client to sign a run receipt. Refused.`
//      and produces NO server line at all -- nothing was signed, so nothing
//      came back.  P3 is the control that makes this a refusal rather than a
//      broken path, and the printed line is what makes it a measurement rather
//      than an absence.
//  P5  the config runs to `probe done` and quits.  It did not, before the
//      printf fix.
// FALSIFIED IF P3's refusal is missing (the command never arrived), if P4
//   produces a refusal line of its own (the client signed for a server), or if
//   the log stops before `probe done` (the client died on the way).
log_enable 1
log_dir logs
log_name p417probe
developer 1
cl_idlefps 0
cl_maxfps 100
waitms 5000
map bhop_eazy
waitmap 45
waitms 3000
echo ======== probe: rec_pubkey
rec_pubkey
waitms 500
echo ======== probe: bare rec_sign (usage?)
rec_sign
waitms 500
echo ======== probe: CONSOLE rec_sign -- expect a server refusal
rec_sign 0123456789abcdef0123456789abcdef 123 - 0
waitms 2000
echo ======== probe: STUFFED rec_sign -- expect silence
stuffcmd Proto rec_sign 0123456789abcdef0123456789abcdef 123 - 0
waitms 2000
echo ======== probe done
quit

// RESULT (2026-09-21, post-review build):
//   ALL FIVE HELD.
//   P1  `run signing key: cd480caf1e71aa8ec4494d990c4b627705e256a493a85a5e783
//       34ac15e159ac8`, the same on every run of every arm today.
//   P2  `rec_sign <nonce> <ticks> <viewpath|-> <journalled 0|1> -- signs this
//       run's evidence`.
//   P3  console form: `timer: receipt refused -- no run id or no nonce`.
//   P4  stuffed form: `rec_sign: a server asked this client to sign a run
//       receipt. Refused.` on the client, and NOTHING on the server.  The two
//       lines are four seconds apart in one log, same command, same arguments,
//       different caller -- which is the whole of the fix.
//   P5  `======== probe done`.
//
//   BEFORE THE PRINTF FIX this log ended at the echo before the first rec_sign
//   with no further output: the client had died inside the command.
