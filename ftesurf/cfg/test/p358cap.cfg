// PATCH 358 subject capture (ftesurf64.exe +exec cfg/test/p358cap.cfg).
// bhop_monster_jam: jump start in the start zone, noclip flight (+jump held:
// teleport bypass) to 10547 -361 5444, walk NW across displacement #89's seam
// (snag03/04), then noclip flight to above END and down into it.  Noclip and
// setpos taint it; it lands as data/runs/bhop_monster_jam/main/cheat.rec.
// setpos 23.2 123.7 read back as 23.0 123.0 (viewpos), so the angles are whole
// degrees.  The leg keys are the flight direction in the view frame; noclip
// speed is fixed (1040 u/s), so a leg's length is its duration.  Leg 1 landed
// within ~11 u of its aim; leg 3's keys came from a recon walk end and ended
// 72 u off in y, still inside END's hull test.  Recompute from the viewpos
// lines if the map or start moves.
// 2026-09-18: FINISHED 0:27.860, 2987 samples; copied to data/p358seam.rec and
// the previous cheat.rec/.view restored.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p358cap
developer 0
sv_cheats 0
cl_idlefps 0
cl_maxfps 100
sensitivity 0
cl_run 0
// smartjump 0: +jump in noclip is BUTTON_JUMP only (teleport bypass, no upmove)
cl_smartjump 0
in_speedbutton 0

set rec_enable 1
set rec_stream 1
set rec_runarchive 1
set pm_trisoup_bevels 1
set pm_rotatedboxhulls 1
set pm_portalcsg_scanall 1

waitms 6000
map bhop_monster_jam
waitmap 120
waitms 8000

echo ================================ P358CAP start zone
cmd zone_goto 0
waitms 1500
setpos 640 -2304 3777 23 124 0
waitms 2000
cmd viewpos
cmd timer
waitms 500
+jump
waitms 700
-jump
waitms 1500
echo ================================ P358CAP after the start jump
cmd timer
cmd viewpos
waitms 300

echo ================================ P358CAP leg 1
cl_backspeed 1067
cl_sidespeed 2325
noclip
waitms 300
+jump; +back; +moveright
waitms 9839
-back; -moveright; -jump
waitms 300
cmd viewpos
noclip
waitms 1500
echo ================================ P358CAP landed
cmd viewpos
waitms 300

echo ================================ P358CAP seam walk
cl_forwardspeed 450
+forward
waitms 250
cmd viewpos
waitms 250
cmd viewpos
waitms 250
cmd viewpos
waitms 250
cmd viewpos
waitms 250
cmd viewpos
waitms 250
cmd viewpos
-forward
waitms 800
cmd viewpos
force_centerview
waitms 300
cmd viewpos
cmd timer
waitms 300

echo ================================ P358CAP leg 3 -- level, to above END
cl_forwardspeed 1371
cl_sidespeed 1877
noclip
waitms 300
+jump; +forward; +moveleft
waitms 8939
-forward; -moveleft
waitms 200
cmd viewpos
echo ================================ P358CAP descend into END
// CL_BaseMove takes the up/down speed from cl_backspeed (1067 here).
+movedown
waitms 750
-movedown; -jump
waitms 500
cmd viewpos
echo ================================ P358CAP after END.  Expect FINISHED.
cmd timer
waitms 2500
echo ================================ P358CAP done
quit
