// PATCH264B -- final verification of Patch 264.
//
// Three things changed since patch264.cfg ran:
//   * SH_SLAB 8 -> 16 with a separate SH_EDGE 2.  At 8 the monolith listing
//     printed grid / mpa45 / mpa45 and CUT tools/toolsskybox at off=-8.031, a
//     thirty-second of a unit outside the window.  Expect FOUR candidates now.
//   * prv->surfaces[].c.name is lowercased to match texinfo->texture->name.
//     Before: "side=SURF_MINIGOLF/G nearpoint=surf_minigolf/grid" -- two
//     spellings of one surface.  Expect them to AGREE now, which is the only
//     way "they disagree" can mean anything.
//   * the census line says "generation(s)" rather than "material(s)".
//
// waitms 2500 after every setpos, not 1200.  hit=nothing is trace->fraction>=1
// and the trace starts at r_refdef.vieworg, which is a RENDER value: a setpos
// that has not yet been through a rendered frame leaves it at the PREVIOUS
// position.  That is what produced four hit=nothing lines in the patch264 run
// while another engine was competing for the GPU, and it has been seen on an
// older build too, so it is a property of the harness and not of this patch.

log_enable 1
log_dir "logs"
log_name "patch264b"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
con_notifylines 0
developer 1
log_developer 1

wait 200
map surf_monolith
waitmap 2400
waitms 10000

sv_cheats 1
waitms 300
noclip
waitms 500

echo ^5=== 1a: bonus 4 -- expect FOUR candidates, ending in tools/toolsskybox ===
setpos -11125 -5511 15936 -89 178 0
waitms 2500
shader_here A_userpaste_up
waitms 1200

echo ^5=== 1b: the probe column ===
setpos -13500 -5400 15936 -89 178 0
waitms 2500
shader_here B_probecol_up
waitms 1200

echo ^5=== 1c: CONTROL -- floor. one candidate, side= and nearpoint= must AGREE ===
setpos -10975.05 -5482.11 15936.03 89 178 0
waitms 2500
shader_here D_control_down
waitms 1200

echo ^5=== 2: surf_bikini_bottom -- the original report, expect 1 generation ===
map surf_bikini_bottom
waitmap 2400
waitms 10000
waitms 1200

echo ^5=== 3: surf_era -- both spellings ship, expect NO census line at all ===
map surf_era
waitmap 2400
waitms 10000
waitms 1200

echo ^5=== patch264b done ===
wait 30
quit
