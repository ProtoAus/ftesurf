// ===========================================================================
//  P475TRAIL -- Patch 475: your own run's line, drawn live (cl_trail.qc).
//    python tools/p475trail.py      (runs this, then grades the log and PNGs)
//
//  The line is a picture and nothing else, so the arm grades PIXELS as well as
//  the counters: a counter says what it meant to draw (Patch 451).
//
//  PRE-REGISTERED
//   T1  a run on the clock (`cmd timer` says running) and `trail` reports the
//       live slot on with > 50 samples.
//   T2  `say !m` cancels the run: the line is KEPT -- on 1, and two reports a
//       second apart hold the same count (it stopped growing at the cancel).
//   T3  the next run starts: the old line is the fading slot (prev on 1, under
//       2 s into a 2 s fade); 3 s later it is gone (prev on 0).
//   T4  the second run cancelled at the start box -- the clock stops, the view
//       faces down the course along the line -- then the same pose with
//       hud_trail 1 and 0: they differ in far more pixels than two 0 shots do.
//  CONTROL: a csprogs without cl_trail.qc answers `Unknown command` to `trail`
//  and T4's two shots differ only by scene noise.
//
//  RESULT (2026-10-03, this PC, surf_dune):
//    fixed   csprogs 7AA2DD878BDC665A: 7 of 7 -- T1 235 samples on the clock;
//            T2 256 then 256 a second after the cancel; T3 the old run 0.22 s
//            into its 2 s fade, gone 3 s later; T4 821 pixels between the line
//            on and off, 0 between two off shots; no unknown command or fault.
//    control 48D1E28C63E5EE52 (Patch 474, no cl_trail.qc): 6 fail -- `trail`
//            unknown, T4 16 pixels.
//  The first two runs of this arm failed on the ARM: T2 compared against a
//  count taken while the run was still on the clock, and T4's "control" pair
//  differed by 17k pixels of scrolling notify text and the fps counter.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p475trail
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
set run_resume 0
waitms 5000
map surf_dune
waitmap 60
waitms 8000
menu_restart
ui_close
waitms 1500
set hud_trail 1
set hud_trail_prev 1
set hud_trail_fade 2

echo ==== P475 T0 ====
trail
waitms 300

echo ==== P475 T1 ====
say !m
waitms 3000
+forward
waitms 2500
-forward
waitms 1200
cmd timer
waitms 600
trail
waitms 300

echo ==== P475 T2 ====
say !m
waitms 2500
trail
waitms 1000
trail
waitms 300

echo ==== P475 T3 ====
+forward
waitms 900
trail
waitms 300
waitms 3000
echo ==== P475 T3b ====
trail
waitms 300
-forward
waitms 1200

echo ==== P475 T4 ====
say !m
waitms 3000
trail
// The shots must differ by the line alone: the notify lines scroll and the
// fps counter moves between any two frames (17k pixels measured).
con_notifylines 0
show_fps 0
waitms 600
screenshot p475_on
waitms 900
set hud_trail 0
waitms 900
screenshot p475_off
waitms 900
screenshot p475_off2
waitms 900

echo ==== P475 END ====
quit
