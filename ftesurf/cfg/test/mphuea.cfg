// MPHUEA -- hypothesis A for the mouse-pad hue report: which SOURCE branch does a
// LIVE player take, and can +forward light the live strafe test?
//   ftesurf64.exe -WindowStyle Minimized +exec cfg/test/mphuea.cfg
// `vote key <scan> <0|1>` runs CSQC_InputEvent, so Keys_Edge believes the key.
// `mousepad` prints src (1 = MPS_LIVE, 2 = REPLAY, 3 = SPEC) and the live A/D read.
//
// PREDICTIONS (registered before the run):
//  A0 idle:       src 1, a0 d0.            A1 W (119) held: src 1, a0 d0  <- the report says otherwise
//  A2 A (97):     a1 d0.                   A3 D (100) alone: a0 d1.
//  A4 A+D:        a1 d1.                   A5 all up: a0 d0.
//  A6 TAB (+showscores) + W: src STILL 1 (spc_hud is not set by the board).
// `spectate status` prints spc_hud for a live player: expected 0 in every arm.
//
// RESULTS 2026-09-20 15:16 (logs/mphuea.log; logs/dbg_mousehue.log is the same arms from the
//  first pass): AS PREDICTED, and the report is NOT reproduced.  src is 1 (MPS_LIVE) in all 9
//  prints, scoreboard up included, so a live player never takes the replay or spectate branch;
//  `spectate status` reads stat 0 throughout.  M1 (W held) reads `a0 d0` -- +forward does not
//  light the strafe test, before or after Patch 404.  M2 a -> a1 d0, M3 d -> a0 d1, M4 a+d ->
//  a1 d1, M5 s -> a0 d0, M6 W with the mouse moving -> a0 d0 and the dot still moves.
//  Both masks were checked by reading rather than measured here and are in correct FSI order:
//  Rec_ViewKeys writes bit = 2^FSK (cl_replay.qc:227-247) and the pose byte keeps bits 4 and 8
//  through its 6-bit pack (sv_pose.qc:151-153), so no off-by-N can put FWD inside LEFT|RIGHT.
//
//  SO THE ORIGINAL REPORT ("the hue changes on +forward, or on both A and D") was not the mouse
//  pad at all: it is the KEY BLOCK's Patch 399 yellow (KEY_FORCED, cl_hud.qc:4422-4434), and its
//  two cases are exactly the two the report names:
//    +forward -- run_ps_release arms on the jump edge from a standing start and drops the frame
//      input_movevalues_x <= 0, i.e. the moment W is let go (cl_main.qc:877-915, run_prestrafe
//      defaults 1), so the yellow W tracks +forward exactly.  cl_hud.qc:4569-4571.
//    both A and D -- the override tint is gated on `ka && kd && cl_iDrive`.  cl_hud.qc:4587-4593.
//  The pad's own colour was working; it simply could not tell A from D, which is what Patch 404
//  changes.  Kept as the negative result -- this is the cfg that stopped a day being spent
//  looking for a bug in Keys_Held, which is sound.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name mphuea
developer 0
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
sv_port 27649
sv_public 0
sv_cheats 0
set run_resume 0
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_conautoscale 0
vid_conwidth 1280
vid_conheight 720
waitms 5000
map bhop_eazy
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 500
hud_scale 2
set hud_keys 1
set hud_mouse 1
set hud_mouse_x -1
set hud_mouse_y -1
set cl_iDrive 1
set hud_mouse_trail 1
echo ==== A0 idle ====
waitms 400
mousepad
spectate status
echo ==== A1 W down ====
vote key 119 1
waitms 400
mousepad
spectate status
echo ==== A1b W held + mouse move ====
spectate look 409.0909 0
waitms 60
spectate look 409.0909 0
waitms 300
mousepad
echo ==== A2 W up, A down ====
vote key 119 0
vote key 97 1
waitms 400
mousepad
echo ==== A3 A up, D down ====
vote key 97 0
vote key 100 1
waitms 400
mousepad
echo ==== A4 A down as well (A+D) ====
vote key 97 1
waitms 400
mousepad
echo ==== A5 all up ====
vote key 97 0
vote key 100 0
waitms 400
mousepad
echo ==== A6 TAB held, then W ====
vote key 9 1
waitms 300
vote key 119 1
waitms 400
mousepad
spectate status
vote key 119 0
vote key 9 0
waitms 300
mousepad
echo ==== END ====
waitms 300
quit
