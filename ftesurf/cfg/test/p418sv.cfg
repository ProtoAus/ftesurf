// Patch 418 -- THE SERVER HALF of the evidence upload.  Runs as a DEDICATED
// server; p418cl.cfg is the client that connects to it.
//
// Two processes, because the thing being tested exists only when the recording
// is somewhere else: Rec_ViewEnd drops the client's angle sidecar whenever
// `Rec_ServerIsRemote()`, and a listen server can never reach that branch.  So
// every earlier arm in this family measured the local case by construction.
//
// Start this one FIRST, from C:\FTESurf:
//   C:\FTEQuake\fteqwsv64.exe +set sv_port 27696 +set sv_public 0
//     +set log_enable 1 +set log_dir logs +set log_name p418sv
//     +map bhop_eazy +exec cfg/test/p418sv.cfg
// then p418cl.cfg in a client.
//
// sv_cheats 1 because the client's route is b352fin.cfg's -- setpos and noclip,
// which a server refuses to a remote client otherwise.  The run is cheated and
// that is irrelevant here: a receipt and an upload happen for a cheated run
// exactly as for a clean one.
developer 1
sv_cheats 1
set rec_enable 1
set rec_runarchive 1
set run_evidence_ul 1
set sv_playerslots 4
waitms 120000
quit
