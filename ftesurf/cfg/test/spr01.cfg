// SPR01 -- does the sprite walk find what the offline census says is there?
//
// The offline numbers, read from the maps' own decompressed entity lumps:
//
//   surf_rise         1 env_sprite                     (the plan's own control)
//   bhop_rpg        819 env_sprite + 43 oriented       densest in the library
//   surf_grotto     464 point_spotlight                densest for shafts
//   bhop_murder     208 env_sprite_oriented + 182 spr
//   bhop_collective   ~ every material unresolvable    the "no material" path
//   bhop_futile       0 of every sprite class          the CONTROL: no lines
//
// What must be true: the "sprites:"/"spotlights:" lines agree with those, the
// four sprite numbers sum to the total, and futile prints neither line.
//
// vbsp_sprite_debug dumps the material table with the size drawgetimagesize
// returned for each -- which is the one number the whole size model rests on,
// and the one thing that cannot be checked by reading the source.

log_enable 1
log_dir "logs"
log_name "spr01"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
sv_cheats 1

wait 200
vbsp_sprites 1
vbsp_spotlights 1

echo ^5=================== surf_rise: expect 1 sprite ====================
map surf_rise
waitmap 1800
waitms 4000
vbsp_sprite_debug 1
waitms 600

echo ^5=================== bhop_rpg: 819 + 43, the densest =================
map bhop_rpg
waitmap 1800
waitms 4000
vbsp_sprite_debug 1
waitms 600

echo ^5=================== surf_grotto: 464 light shafts ===================
map surf_grotto
waitmap 1800
waitms 4000
vbsp_sprite_debug 1
waitms 600

echo ^5=================== bhop_murder: 208 oriented =======================
map bhop_murder
waitmap 1800
waitms 4000
vbsp_sprite_debug 1
waitms 600

echo ^5=================== bhop_collective: unresolvable materials =========
developer 1
log_developer 1
map bhop_collective
waitmap 1800
waitms 4000
developer 0
log_developer 0

echo ^5=================== bhop_futile: CONTROL, no sprite lines ===========
map bhop_futile
waitmap 1800
waitms 4000

echo ^5=== spr01 done ===
wait 30
quit
