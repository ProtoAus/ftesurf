// Private overlay (tools/runlines_smoke.py), as a listen server or with --dedicated --map surf_kitsune:
//   python tools/runlines_smoke.py ftesurf/cfg/test/runlines_seglive.cfg --output-dir <owned root>
//   python tools/test_runlines_seglive.py <rig>/ftesurf/logs/runlines_smoke.log
//       --control-log <the same arm on a build with the Board_LiveMoved call compiled out>
// Patch 616: the LIVE Segments column at a teleport.  All of it in surf_kitsune's spawn room, which
// has no zone, so the run timer never clears the column.  A plain jump; a jump moved 250 u up in
// mid-air; a body moved 200 u up off the floor; the same again, put back on the floor 0.3 s into
// the fall; a third such fall saved 0.2 s in and loaded from 200 u along the floor; and the room's
// own door, which lifts a body walking into it 300 u onto the floor above, with a jump there.
// Each stage prints the column.
cfg_save_auto 0
name RunlinesControl
log_enable 1
log_dir logs
log_name runlines_smoke
con_notifytime 0
cl_idlefps 0
cl_maxfps 100
rec_savelock 1
sv_public 0
sv_port 27612
waitms 2000
map surf_kitsune
waitmap 60
waitms 6000
menu_restart
ui_close
// The break lines (cl_board.qc Board_LiveMoved) are the subject printing its own action.
set cl_trigdebug 1
// ...and the engine printing the frame rate it really drew at, which cl_maxfps only caps.
cl_predtrace -200
cmd viewpos
// The column has to see the floor before the first jump leaves it: without this wait the jump
// rides the batch that closed the menu (two of three dedicated runs read it as no hop, 5 u low).
waitms 500
echo ==== JUMP ====
+jump
waitms 100
-jump
waitms 1500
replay seq live
echo ==== MIDAIR ====
+jump
waitms 250
cmd setpos 0 -1280 397
-jump
waitms 2500
replay seq live
echo ==== DROP ====
cmd setpos 0 -1280 297
waitms 2500
cmd viewpos
replay seq live
echo ==== STOP ====
cmd setpos 0 -1280 297
waitms 300
cmd setpos 0 -1280 96
waitms 1500
replay seq live
echo ==== LOAD ====
// The load key's own pair (cl_saveloc.qc SaveLoc_LoadKey): load, hold, release.
cmd setpos 0 -1280 297
waitms 200
sl_save
waitms 1500
+forward
waitms 800
-forward
waitms 600
sl_load
+sl_hold
waitms 500
-sl_hold
waitms 1500
replay seq live
echo ==== DOOR ====
// The spawn faces away from the door (yaw 90), 704 u from it.
+back
waitms 3400
-back
waitms 1000
cmd viewpos
replay seq live
echo ==== DOORJUMP ====
+jump
waitms 100
-jump
waitms 1500
replay seq live
echo RUNLINES COMPLETE
waitms 100
quit
