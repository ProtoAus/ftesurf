hud_watch_path
hud_lines_board
hud_edit lines
waitms 500
screenshot screenshots/runlines_ui.png
hud_edit off
hud_trail 0
hud_watch_path 1
hud_lines_board 0
hud_trail
hud_watch_path
hud_lines_board
lines help
echo RUNLINES COMPLETE
waitms 100
quit
