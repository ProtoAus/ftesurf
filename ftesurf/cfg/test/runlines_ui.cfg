// Private overlay only: tools/runlines_smoke.py
cfg_save_auto 0
name RunlinesControl
log_enable 1
log_dir logs
log_name runlines_smoke
cl_idlefps 0
cl_maxfps 100
con_notifytime 0
waitms 1500
map surf_dune
waitmap 60
waitms 6000
menu_restart
ui_close
lines help
hud_trail 1
hud_watch_path 0
hud_lines_board 1
