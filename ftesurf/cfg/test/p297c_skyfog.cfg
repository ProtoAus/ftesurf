cfg_save_auto 0
// Patch 297 -- DOES THE SKYROOM FOG DO ANYTHING?
//
// Established already, all by measurement or citation:
//   - the QC parses tensor2's sky_camera and emits the right command; the
//     renderer HOLDS it: "Current skyroomfog 23.4375 (... bias 11.7188)".
//   - Source divides the distances by the sky_camera scale exactly as we do --
//     viewrender.cpp:4572-4580, scale = 1/m_skybox3d.scale.
//   - the nearest skybox-room face is 264 units from the sky_camera and the
//     median is 3510, against a fog END of 23.4 units.  So ONE HUNDRED PERCENT
//     of that geometry is beyond the fog end and MUST render as flat fog colour.
//     That is what the CS:S screenshot shows and what ours does not.
//
// THE A/B, which needs no particular vantage -- only sky pixels in frame:
//   ARM 1  default            -- skyroom drawn, skyroom fog live
//   ARM 2  skyroomfog 0       -- skyroom drawn, fog explicitly OFF
//   ARM 3  vbsp_skyroom 0     -- skyroom NOT drawn at all (identifies which
//                               pixels are skyroom in the first place)
//   ARM 4  back to default    -- repeat control for ARM 1
//
// READ IT LIKE THIS:
//   ARM1 == ARM2  -> the skyroom fog is inert.  That is the bug, and it is in
//                    the handoff between cl.fog[FOGTYPE_SKYROOM] and the
//                    surfaces, not in the numbers.
//   ARM1 != ARM2  -> the fog works, and what Lex sees out the window is NOT
//                    skyroom geometry -- ARM3 then says what it is.
//   ARM1 == ARM3  -> no skyroom pixels in frame at all; the vantage is wrong
//                    and nothing else in this run means anything.
// ARM4 vs ARM1 is the noise floor every comparison above is judged against.
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000
wait 200

developer 1
log_developer 1
log_enable 1
log_dir logs
log_name p297c_skyfog
cl_maxfps 0
cl_idlefps 0
sv_cheats 1
con_notifylines 0
con_notifytime 0.01
r_drawviewmodel 0

map surf_tensor2
waitmap 600
waitms 9000
waitms 3000
noclip
waitms 1000

// High above the spawn, looking out and slightly down: maximum sky in frame.
alias vhigh "setpos -11776 -13632 13680 0 90 0; waitms 2500"
alias vup   "setpos -11776 -13632 13680 -25 90 0; waitms 2500"

// ---- ARM 1: default ----
echo ^5=== ARM 1: default (skyroom on, skyroom fog live)
vhigh
screenshot p297c_a1_default_h
vup
screenshot p297c_a1_default_u

// ---- ARM 2: skyroom fog OFF ----
skyroomfog 0
echo ^5=== ARM 2: skyroomfog 0 -- if this matches ARM 1, the fog was never doing anything
vhigh
screenshot p297c_a2_nofog_h
vup
screenshot p297c_a2_nofog_u

// ---- ARM 3: no skyroom at all ----
vbsp_skyroom 0
echo ^5=== ARM 3: vbsp_skyroom 0 -- identifies which pixels are skyroom
vhigh
screenshot p297c_a3_noskyroom_h
vup
screenshot p297c_a3_noskyroom_u

// ---- ARM 4: repeat control ----
vbsp_skyroom 1
skyroomfog 23.4375 0.160784 0.258824 0.352941 1 11.7188
echo ^5=== ARM 4: restored -- repeat control for ARM 1
vhigh
screenshot p297c_a4_repeat_h
vup
screenshot p297c_a4_repeat_u

echo ^5=== END OF RUN ===
waitms 500
quit
