// P467MILK -- the milk menu harness (src/menu/m_milk.qc, MM_BootTick).
// Launch: ftesurf64.exe +set milk_bootcheck <1|3> +set log_name <n> +exec test/p467milk.cfg
// 1 flies every station and photographs it, then quits; 3 photographs one
// station twice, 6 s apart, to prove the sim is not frozen (diff the pair).
// JPEG, because a 2256x1380 PNG blocks the main thread ~2 s per shot and the
// harness steps are timed.
cfg_save_auto 0
// Pin every milk cvar the shots depend on -- ftesurf.cfg archives the player's own.
set milk_menu 1
set milk_quality 2
set milk_trails 1
set milk_react 1
set milk_menumusic auto
volume 0                    // the laptop owner is in the room; analysis taps pre-volume
// volume scales SFX only; music is musicvolume*mastervolume, BEFORE the snd_vis tap, and the
// analysis is level-normalised -- so a whisper is enough for the visuals to see the beat.
set musicvolume 0.02
log_enable 1
log_dir "logs"
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
scr_sshot_type jpg
scr_sshot_compression 92
