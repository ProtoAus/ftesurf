// real lobby (exec lobby.cfg: streamed, no PB).  Stub POSTs, both runs:
//   A  legs 1 (43 ticks), 2 (60), 4 (35), then leg 0 (300); NO leg 3.
//      timer: after S2 "prime 1 launch 260", after S3 "prime 0 launch -1".
//      results wrank: *wrank "surf_666 0 0 300 1 3 17 1 20000 0",
//      *srank "surf_666 0 4 35 1 3 17 1 20000 0" -- both answered (state 1,
//      not the 2/3 predicted; the substance holds).  reccheck: stageposts 3.
//   J  legs 1, 2, 4 + main; leg 1's record "stagepost 0 51 121" -- launch is
//      the takeoff speed (121 < 260).
//   H  leg 1 + main only; timer past S2 "prime 0 launch 260 tk -1".
//   E  leg 1 only; "kept data/evidence/surf_666/<runid>.rec (1 posted
//      stage(s))" (lobby: runid ...-p27631, streamed); reccheck 0 faults,
//      stageposts 1, abandoned 88.
//   C1 "prime 0 launch 260 cap 200": main only.  C2 prime 0: main only.
//   All five real recordings: reccheck 0 faults.  NOTE the plain (non-lobby)
//   server writes local stage PBs into data/runs/surf_666 -- back that folder up
//   before a run and restore it after (the lobby run writes none).
