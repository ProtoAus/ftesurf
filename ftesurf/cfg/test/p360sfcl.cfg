// P360SFCL -- stage fill-in, client half (server: p360sfsv.cfg, zones
// cfg/test/p360sf.zones.json, stub `b65stub.py cert 8131`).
//
// FIXTURE (surf_666 start room, floor z 15360, walked +y at ~260 u/s):
//   START y -14288..-14150      seg 0 -> leg 1
//   S2    y -13950..-13800      box, walked through: a primed walk-out
//   S3    y -13550..-13450      floats at z +20..+60: the hull hits it, the
//                               feet point is never inside -> flown through
//   S4    y -13250..-13100      box
//   END   y -12950..-12800
//
// PREDICTIONS (pre-registered):
//   A  walk: stage posts for legs 1, 2, 4 and NOT 3; the main submit (leg 0).
//      `cmd timer` after S2 exit: "stage fill: prime 1 launch ~260 tk 0".
//      After S3: prime 0 launch -1.  Finish: `results wrank` shows *srank for
//      leg 4 and *wrank for leg 0, both answered (state 2/3, #3 of 17).
//      The run's .rec: reccheck 0 faults, stageposts 3.
//   J  jump out of START after the dwell: leg 1 posts; timer at exit shows
//      tk 1 and launch = the takeoff speed (< 260).
//   H  jump taps every 100 ms from before S2 to the end: only leg 1 posts
//      (its prime was the walk-out); legs 2-4 do not (tk -1).
//   E  abandon after the leg-1 post (zone_goto back into START): server prints
//      "kept data/evidence/surf_666/<runid>.rec (1 posted stage(s))";
//      reccheck on it: 0 faults, stageposts 1, abandoned N.
//   C1 run_stagecap 200: the A walk posts NO stage, still posts leg 0.
//   C2 run_prestrafe_time 30: the A walk posts NO stage, still posts leg 0.
// FALSIFIER: leg 3 posted in A, any stage post in C1/C2, or legs 2-4 in H.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p360sfcl
developer 1
cl_idlefps 0
cl_maxfps 100
rate  2000000
drate 5000000
vid_fullscreen 0
waitms 6000
connect 127.0.0.1:27631
waitms 12000
set rec_terms 1
echo ^5==== A: walk the fixture ====
cmd zone_goto 0 90 0
waitms 2000
cmd timer
+forward
waitms 2000
echo ^5--- A: after S2 exit ---
cmd timer
waitms 1000
echo ^5--- A: after S3 ---
cmd timer
waitms 3000
-forward
waitms 2000
echo ^5--- A: finished ---
cmd timer
results wrank
waitms 1000
echo ^5==== J: jump out of START ====
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 120
+jump
waitms 60
-jump
waitms 700
echo ^5--- J: airborne out of START ---
cmd timer
waitms 5200
