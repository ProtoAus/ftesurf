// cfg_save_auto 0: this run sets archived cvars; never let it write them into ftesurf.cfg
cfg_save_auto 0
// p659rain -- rain as Source draws it (Patch 659).  tools/p659rain.py grades it.
// surf_tensor2's spawn stands in spawn_rain01: 800 streaks a second over a box 5,632 by 3,200,
// each 1 unit wide and 80 long.  The gamedir needs this patch's bake of the map
// (`python tools/pcf.py --map surf_tensor2 --gamedir <gamedir>`); the grader says if it has not.
//   A  looking 25 degrees up at the sky over the far building: emit_list, two shots 2.5 s
//      apart (a1, a2), then emit_list and r_partinfo again: how many drops were made between
//      the two, and how many the engine holds
//   N  vbsp_emit_psys 0 and 4 s for what was falling to land: the same view bare (a0)
//   R  vid_restart takes the shader and the map's blocks: 12 s on, the rain must be falling again
// The streaks are what differs between a shot of A and a0.
log_dir "logs"
log_name "p659rain"
log_enable 1
developer 1
log_developer 1
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000
cl_maxfps 100
cl_idlefps 0
sv_cheats 1
r_bloom 0
con_notifylines 0
scr_sshot_type png
fov 90
wait 200
map surf_tensor2
waitmap 600
waitms 2000
menu_restart
ui_close
set hud_speed 0
set hud_energy 0
set hud_keys 0
noclip
setpos -11776 -13632 13800 -25 90 0
waitms 8000
echo ^5=== A rain
emit_list
screenshot p659rain_a1
waitms 2500
screenshot p659rain_a2
waitms 800
emit_list
r_partinfo
echo ^5=== N none
set vbsp_emit_psys 0
waitms 4000
r_partinfo
screenshot p659rain_a0
waitms 800
set vbsp_emit_psys 1
echo ^5=== R restart
vid_restart
waitms 12000
emit_list
r_partinfo
waitms 300
echo RIGDONE
quit
