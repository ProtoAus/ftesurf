// Patch 338 -- IO mirror, instrumented.  trig_dump prints the gate state
// regardless of cl_trigdebug: #56 push_prevent_backtrack_t1 must read OFF
// before the walk, ON after walking east through the *218 enabler, and OFF
// again ~0.05 s after leaving it.  trig_at probes locate both volumes.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p338c
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0
wait 600
connect 127.0.0.1:27666
waitms 15000
cl_prederror 2
cl_trigdebug 1
echo === dump 1 (pre-walk):
trig_dump
waitms 400
echo === probe the corridor:
trig_at -8128 11328 30
waitms 300
trig_at -7648 11328 30
waitms 300
cmd setpos -8320 11328 40 0 0 0
waitms 600
cmd noclip
waitms 500
cmd noclip
waitms 1500
echo === on the ground here?
trig_here
waitms 400
echo === walk east 6 s:
+forward
waitms 9000
-forward
waitms 400
echo === dump 2 (mid, inside *217 zone):
trig_dump
waitms 400
echo === walk west 6 s back out:
+back
waitms 9000
-back
waitms 1500
echo === dump 3 (after leaving, grace passed):
trig_dump
waitms 400
echo === p338c done
quit
