cfg_save_auto 0
// Why is the HUD not drawing on a live lobby?  Ask, do not guess.
//
// Three cuts of b64live.cfg all came back `cols 0` -- Scores_Draw never ran --
// and I have now guessed twice (menu_restart, then togglemenu) and been wrong
// twice.  cl_main.qc:1360 already prints the deciding value behind
// `ui_bootcheck >= 3`, so this asks it rather than inferring it from a picture.
//
// THE ONE NUMBER THAT MATTERS IS notmenu.  CSQC_UpdateView gates its entire 2D
// pass on it; if it reads 1 then the menu is NOT the cause and the fault is
// somewhere else entirely, which is worth knowing before touching the config
// again.
//
// `set`, not a bare assignment -- see screenshot-the-ui: a bare ui_bootcheck
// line before menu.dat initialises parses as a command and silently does
// nothing.  It can be armed late because m_draw tests it every frame.
log_enable 1
log_dir logs
log_name b64notmenu
waitms 5000
set ui_bootcheck 3

menu_restart
waitms 1500

connect play.proto.bar:27540
waitms 18000

echo ==== A: as connected, no menu handling at all ====
waitms 2500

echo ==== B: after togglemenu ====
togglemenu
waitms 2500

echo ==== C: after a second togglemenu (if B opened one, this closes it) ====
togglemenu
waitms 2500

echo ==== END ====
disconnect
waitms 1000
log_enable 0
waitms 500
quit
