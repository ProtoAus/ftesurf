// Build 71: after shipping the working tree, does a client that JOINS a lobby
// get the HUD editor back?
//
// THE THING BEING TESTED IS A DOWNLOAD, not a local file.  On connect, FTE
// fetches the server's csprogs.dat into ftesurf_downloads/csprogsvers/ and runs
// THAT instead of the client's own -- which is the whole reason the HUD work
// vanished online while being perfectly present on disk.  So the only honest
// test is to connect to a real lobby and ask the downloaded progs what they
// have.
//
// cfg_save_auto 0 IS PROTECTING REAL USER DATA HERE, not just tidiness.  This
// runs in the MAIN gamedir (the point is to exercise the real client path), and
// hud_edit persists its layout as `seta hud_*` into ftesurf.cfg on a clean quit
// -- 90 of those lines exist right now.  A run that saved would overwrite a
// hand-made layout with whatever this config happened to leave set.
//
// PREDICTION:
//   arm 1  ui_join reports lobby_dir https://play.proto.bar, ui_play_online 1
//   arm 2  joins a real lobby (play.proto.bar:275N0), NOT a local map
//   arm 3  `hud_edit` is a known command and toggles -- on the pre-deploy
//          csprogs it would still exist, so the REAL tell is arm 4
//   arm 4  `hud_edit help` (or the editor's own status) names elements that
//          only exist in the uncommitted work
//
// FALSIFIED IF: "Unknown command" for hud_edit; or any PR_ExecuteProgram /
// runaway / QC fault line; or the client ends up on a local map.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name b71hud
developer 1

name "^3Lex HudCheck"

waitms 40000
menu_restart
waitms 4000

echo ^5==== b71hud arm 1: configuration ====
ui_join
waitms 500

echo ^5==== b71hud arm 2: join a real lobby ====
ui_join surf_aesthetic
waitms 2000
ui_join
waitms 14000

echo ^5==== b71hud arm 3: where did I land ====
status
waitms 2000

echo ^5==== b71hud arm 4: the HUD editor, from the DOWNLOADED progs ====
hud_edit
waitms 2000
hud_edit
waitms 1000

echo ^5==== b71hud: done ====
disconnect
waitms 2000
quit
