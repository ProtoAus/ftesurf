// Patch 279, probe M -- the particle COLOUR, measured where the shield cannot
// contaminate it.
//
// Every previous shot of the portal has the combine shield directly behind the
// particles, and the shield's crackle web is itself a field of bright isolated
// pixels -- so "the mean colour of the bright pixels in the doorway" was
// measuring the shield, not the particles, and reported white either way.
//
// The shield is a THIN PLATE facing +/-Y (submodel *19 is 96 x 8 x 128).  Seen
// edge-on from +X it is eight units of nothing, while the particle sphere is
// 64 units in every direction and still fully in view.  Same particles, no web.

vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000
cl_maxfps 0
sv_cheats 1

map surf_tensor2
waitmap 600
waitms 9000
noclip
vbsp_sprites 0
vbsp_sprite_debug 2
waitms 1200

// x = -11576 is 200 units +X of the portal; yaw 180 looks back along -X.
setpos -11576 -10816 13744 0 180 0
waitms 3500
r_partinfo
waitms 800
screenshot p279m_edge_x
waitms 900
screenshot p279m_edge
waitms 900
quit
