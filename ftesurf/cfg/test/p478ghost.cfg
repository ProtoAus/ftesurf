// p478ghost.cfg -- Patch 478: a ghost begun in an armed start box starts no run
// where it ends.  Driven and graded by tools/p478ghost.py on surf_dune, whose
// start box is y 449..769 (the hull leaves it past 785); `!r` stands the body at
// y 650 facing +y, so +forward runs at the box's edge and off the ramp below.
//   G1  +forward 0.55 s and `ghost` with the hull still in the box (y ~760);
//       the body coasts across the hull line unattended (a 0.4 s run coasted
//       722 -> 774, so ~55 u).  Before 478 the state stayed ARMED (the ghost
//       branch skips the start test) and the unghost started a CLEAN clock
//       wherever the ghost ended; now leaving the box as a ghost disarms it
//       (`idle` while still ghosted), and says so.  (A typed `cmd rec_ghost
//       1` cannot walk it out instead: the client follows the server's ghost
//       and sends empty moves.)
//   G3  the same shape through another door: a Multi-Session resume phase.
//       A ~3 s run parked by a map reload (run_resume 1, min 1 s), then
//       `cmd ms_resume` and, inside its 3 s countdown, `say !r` and `cmd
//       rec_retry`.  Before 478 the `!r` armed the start while SV_MsFrame held
//       the body at the park point, and the retry wrote and restored that
//       ARMED state there -- the first packet began a CLEAN run from the park
//       point (driven: "retry -- back where you were", then running, clean).
//       Now both are refused ("wait for the resume to finish") and the resume
//       applies.  The driver parks data/saves/surf_dune and
//       data/resume/surf_dune for the run.
//   G4  the reverse order: the run G3 resumed parked again (a reload), then
//       `cmd rec_retry; cmd ms_resume` in one packet.  The accept is refused
//       while the retry's restart is pending, and the slot is offered again
//       after it; before 478 r3 the accept claimed it, the restart skipped
//       the abort, and the claim stood alone.
//   G5  a `kill` in a resume countdown on bhop_eazy, whose 16 spawns are all
//       in its start box: the respawn arms the box (round 3 scanned the
//       latches at the spawn in SV_MsAbort, and it never armed).
//   The driver parks data/saves and data/resume for both maps.
//   G2  control: a ghost in the box with the body still keeps the arm, and
//       +forward after the unghost starts a clean run as ever -- primed for
//       its stage-1 post (`stage fill: prime 1`; before 478 the ghost's flag
//       stood into the start and read `prime 0`).
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p478ghost
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
set run_resume 0
waitms 5000
map surf_dune
waitmap 60
waitms 8000
menu_restart
ui_close
waitms 1500

echo ==== P478 G1 ====
say !r
waitms 2500
cmd timer
waitms 800
+forward
waitms 550
cmd viewpos
ghost
-forward
waitms 2500
cmd viewpos
waitms 300
cmd timer
waitms 800
ghost
waitms 1000
cmd viewpos
waitms 300
cmd timer
waitms 800

echo ==== P478 G2 ====
say !r
waitms 2500
ghost
waitms 1500
ghost
waitms 1000
cmd timer
waitms 800
+forward
waitms 1400
-forward
waitms 300
cmd timer
waitms 800

echo ==== P478 G3 ====
set run_resume 1
set run_resume_min 1
set run_resume_countdown 3
say !r
waitms 2500
+forward
waitms 2000
-forward
waitms 1500
cmd timer
waitms 800
echo ==== P478 G3P ====
map surf_dune
waitmap 60
waitms 6000
menu_restart
ui_close
waitms 1500
cmd ms_resume
waitms 600
say !r
waitms 400
cmd rec_retry
waitms 12000
echo ==== P478 G3A ====
cmd viewpos
waitms 300
cmd timer
waitms 1000
echo ==== P478 G4 ====
map surf_dune
waitmap 60
waitms 6000
menu_restart
ui_close
waitms 1500
cmd rec_retry; cmd ms_resume
waitms 12000
echo ==== P478 G4A ====
cmd timer
waitms 1000

echo ==== P478 G5 ====
map bhop_eazy
waitmap 60
waitms 6000
menu_restart
ui_close
waitms 1500
cmd zone_goto 0
waitms 1000
setpos -352 -352 144 0 335.3 0
waitms 1000
+jump
waitms 700
-jump
waitms 1800
cmd timer
waitms 800
echo ==== P478 G5P ====
map bhop_eazy
waitmap 60
waitms 6000
menu_restart
ui_close
waitms 1500
cmd ms_resume
waitms 600
say !r
waitms 300
kill
waitms 2500
echo ==== P478 G5A ====
cmd viewpos
waitms 300
cmd timer
waitms 1000
set run_resume 0

echo ==== P478 END ====
quit
