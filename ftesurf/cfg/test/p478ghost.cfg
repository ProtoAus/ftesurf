// p478ghost.cfg -- Patch 478: a ghost begun in an armed start box starts no run
// where it ends.  Driven and graded by tools/p478ghost.py on surf_dune, whose
// start box is y 449..769 (the hull leaves it past 785); `!r` stands the body at
// y 650 facing +y, so +forward runs at the box's edge and off the ramp below.
//   G1  +forward 0.55 s and `ghost` with the hull still in the box (y ~760);
//       the body coasts across the hull line unattended (a 0.4 s run coasted
//       722 -> 774, so ~55 u).  Before 478 the state stayed ARMED (the ghost
//       branch skips the start test) and the unghost started a CLEAN clock
//       wherever the ghost ended; now leaving the box as a ghost disarms it
//       (`idle` while still ghosted), and says so.  (A typed `cmd rec_ghost
//       1` cannot walk it out instead: the client follows the server's ghost
//       and sends empty moves.)
//   G3  the same shape through another door: a Multi-Session resume phase.
//       A ~3 s run parked by a map reload (run_resume 1, min 1 s), then
//       `cmd ms_resume` and, inside its 3 s countdown, `say !r` and `cmd
//       rec_retry`.  Before 478 the `!r` armed the start while SV_MsFrame held
//       the body at the park point, and the retry wrote and restored that
//       ARMED state there -- the first packet began a CLEAN run from the park
//       point (driven: "retry -- back where you were", then running, clean).
//       Now both are refused ("wait for the resume to finish") and the resume
//       applies.  The driver parks data/saves/surf_dune and
//       data/resume/surf_dune for the run.
//   G4  the reverse order: the run G3 resumed parked again (a reload), then
//       `cmd rec_retry; cmd ms_resume` in one packet.  The accept is refused
//       while the retry's restart is pending, and the slot is offered again
//       after it; before 478 r3 the accept claimed it, the restart skipped
//       the abort, and the claim stood alone.
//   G5  a `kill` in a resume countdown on bhop_eazy, whose 16 spawns are all
//       in its start box: the respawn arms the box (round 3 scanned the
//       latches at the spawn in SV_MsAbort, and it never armed).
//   The driver parks data/saves and data/resume for both maps.
//   G2  control: a ghost in the box with the body still keeps the arm, and
//       +forward after the unghost starts a clean run as ever -- primed for
//       its stage-1 post (`stage fill: prime 1`; before 478 the ghost's flag
//       stood into the start and read `prime 0`).
//   G8  round 5: idle outside the box, `setpos` 100 u up inside it and `sl_save`
//       in one packet -- the row holds azone -1 mid-air in the box.  Loading it
//       arms nothing (the gate wants grounded); before, the stale -1 armed it.
//   G6  round 6: a slow, grounded save in the box loaded with `rec_ghost 1` in
//       the same packet -- the gate's arm waits out the ghost.  The unghost
//       arms nothing, so the load's practice stands; before, the unghost armed
//       the box and zeroed it (a modified client steers a ghost: speed built
//       in the box, unjudged, started clean).
//   G7  round 6: the same, then `retry` under the ghost: the point holds the
//       unghost's latches, and the restore arms nothing either.
//   G10 round 7: running, `setpos` into the box and a save in one packet --
//       the row runs with azone -1 in START.  Loaded, it keeps running (the
//       load takes the start latch where it stands); before, the stale latch
//       re-armed the START at the load, zeroing every taint.
//   G9  round 7: a save and a load under a ghost are refused -- a ghost's
//       running row kept stale latches, and a load under it rewound the
//       recording below the window's `ghost 1`.
//   G11 round 7: a running run, `ghost`, `setpos` into the box, unghost: the
//       run ends ("back in the start as a ghost") and the box does not arm --
//       round 6's refresh left it running in the box, and before 478 the
//       entry re-armed the box clean.
//   G12 round 7, older than 478: `!s 1` (a stage run), `setpos` near the top
//       of stage 2's box (it finishes, its handover pending, the body falling
//       through the box's 256 u), `setpos` out of it 0.3 s later: no stage-2
//       run starts -- the handover's arm re-read the class as clean and began
//       the next stage wherever the setpos put the body.  (`!s 2` is a run
//       from stage 2 on, not a stage run; the box is mid-air, and a body left
//       in it falls out the bottom into the handover, as `!s 2` would start.)
//   G13 round 8: a full run, `ghost`, then setpos into stage 2's box and unghost
//       in one packet: the split fires at re-attach (seg 1), as pm_verify
//       replays it -- round 7 took the event latch and the split never came.
//       Before G12: after the stage sections `!r` restarts their stage leg.
//   G15 round 8, older than 478: `!s 1`, setpos above stage 2's box: the body
//       falls through it, stage 1 finishes, the handover starts stage 2 -- and
//       stage 2 is cheated too (the setpos's taint carries over the handover).
//   G16 round 8: a running stage-1 row written behind a setpos into stage 2's
//       box (its event latch stale), loaded: no finish, still stage 1
//       (startseg 0) -- before, the load finished stage 1 and the handover
//       began stage 2.
//   G14 round 8: a running run, `ghost`, setpos into the start box, then a
//       map reload: no paused run is offered -- the park's unghost ended the
//       run, and the slot it then wrote was refused at every connect.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p478ghost
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
set run_resume 0
waitms 5000
map surf_dune
waitmap 60
waitms 8000
menu_restart
ui_close
waitms 1500

echo ==== P478 G1 ====
say !r
waitms 2500
cmd timer
waitms 800
+forward
waitms 550
cmd viewpos
ghost
-forward
waitms 2500
cmd viewpos
waitms 300
cmd timer
waitms 800
ghost
waitms 1000
cmd viewpos
waitms 300
cmd timer
waitms 800

