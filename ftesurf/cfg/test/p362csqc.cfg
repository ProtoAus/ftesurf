// Patch 362: a join with no cached copy of the server's csprogs must still load CSQC.
// Run: <client>.exe +set log_name <n> +set p362_target <host:port> +exec cfg/test/p362csqc.cfg
// The driver prepares downloads/csprogsvers/<server crc>.dat before each arm:
//   none    -- absent (a player whose local csprogs.dat is not the server's)
//   corrupt -- present with the wrong bytes (P282's re-pull path)
//   good    -- present and right (control: the path that always worked)
// Pass: "FTESurf CSQC loaded" and `timer` prints "cl stats".
// Fail: "csqc: no client game" and `timer` is an Unknown command.
cfg_save_auto 0
log_enable 1
log_dir logs
developer 1
set csqc_warnfail 1
set cl_download_csprogs 1
set cl_download_csprogs_selfheal 1
name "^3Lex P362 test"
cl_idlefps 0
cl_maxfps 100
waitms 25000
echo ======== P362 connect $p362_target
connect $p362_target
waitms 30000
echo ======== P362 serverinfo
serverinfo
echo ======== P362 client csqc
timer
echo ======== P362 done
waitms 1000
quit
