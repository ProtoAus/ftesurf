// B43PVS2 -- did the .view2 eye fix it?
//
// b43pvs proved the diagnosis:
//     baseline      entities 324 (brush 0) -> 3 (brush 0) -> 0 (brush 0)
//     sv_nopvs 1    entities 268 (brush 41) -> 107 (brush 41) -> 104 (brush 41)
//     r_novis 1     entities 217 (brush 0)                     -- fixed nothing
// Forty-one brush entities on surf_fiellu, invisible during a replay because the
// server was culling them against a body pinned where the key was pressed.
//
// The fix spawns one invisible marker, moves it to the replay camera on a
// throttle, and points the client's .view2 at it -- an engine hook that already
// exists (sv_ents.c:4382) and unions a second origin into the PVS.
//
// SO THE PASS CONDITION IS EXACTLY THE NUMBER sv_nopvs PRODUCED, WITHOUT
// sv_nopvs: `brush 41` in arm 1 and arm 3, `brush 0` in arm 2.
//
// ARM 2 IS THE POINT.  rec_watch_pvs 0 restores build 42 byte for byte, so if
// arm 1 and arm 2 agree the fix is not doing anything and the numbers in arm 1
// came from somewhere else.  A one-armed "it works now" run cannot tell those
// apart, and this project has been caught by exactly that before.
//
// The entity counts come from the r_speeds-adjacent developer line
// ("entities N (brush M) -- world counts are r_speeds"), which is why
// developer 1 AND log_developer 1 are both set: engine Con_DPrintf does not
// reach the log with developer alone.
//
// Single process, single map load.

log_enable 1
log_dir "logs"
log_name "b43pvs2"
developer 1
log_developer 1
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
sv_cheats 1
fs_missingwarn 0

hud_watch_path 0
hud_watch_info 0

wait 200
echo ^5=== b43pvs2: surf_fiellu, does the .view2 eye restore the entities? ===

map surf_fiellu
waitmap 1800
waitms 3000

replay data/runs/surf_fiellu/main/0003991_pb.rec
waitms 800
replay pause

// Each arm seeks the same three ticks.  The waits are generous on purpose: the
// eye is published on a throttle and the server needs a snapshot after it, so a
// count taken too early would read the PREVIOUS position's entity set and look
// like a partial fix.
echo ^5=== b43pvs2 ARM 1: rec_watch_pvs 1 (the fix) -- expect brush 41 ===
rec_watch_pvs 1
waitms 1000
replay seek 12
waitms 1000
replay seek 35
waitms 1000
replay seek 52
waitms 1000
screenshot b43pvs2_a1_t52

echo ^5=== b43pvs2 ARM 2: rec_watch_pvs 0 (build 42) -- expect brush 0 ===
rec_watch_pvs 0
waitms 1500
replay seek 12
waitms 1000
replay seek 35
waitms 1000
replay seek 52
waitms 1000
screenshot b43pvs2_a2_t52

echo ^5=== b43pvs2 ARM 3: rec_watch_pvs 1 again -- must return to brush 41 ===
rec_watch_pvs 1
waitms 1500
replay seek 12
waitms 1000
replay seek 35
waitms 1000
replay seek 52
waitms 1000
screenshot b43pvs2_a3_t52

// And the ghost, which has the same defect and the same eye.  Not a full arm --
// just enough to prove the second caller reaches the same code and that the two
// modes hand the eye over cleanly rather than leaving one behind.
echo ^5=== b43pvs2: ghost, the other caller ===
replay stop
waitms 600
cmd rec_ghost 1
waitms 1500
cmd rec_ghost 0
waitms 600

echo ^5=== b43pvs2: done ===
waitms 400
quit
