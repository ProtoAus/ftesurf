// Engine Patch 321 / QC build 73: does the world model actually carry the map's
// hash, and can QC see both sides of the comparison?
//
// THE SAME CONFIG IS BOTH ARMS.  The only thing that changes between them is
// which fteplug_hl2_x64.dll is on disk:
//
//   arm A   the plugin as it was -- VBSP_ComputeChecksum(mod, ...) writing onto
//           the LAST SUBMODEL
//   arm B   Patch 321 -- VBSP_ComputeChecksum(wmod, ...)
//
// ...and the engine is the SAME BINARY in both, carrying the two new infokey
// keys.  That is what makes this a test of one token rather than of a build.
//
// WHY THE CONTROL HAS TO BE A REAL ARM AND NOT AN ARGUMENT.  Before the fix the
// server compared its zero against the client's zero and AGREED, so from
// outside, "the check passed because the map matches" and "the check passed
// because neither side computed anything" are the same observation.  Arm A is
// what makes them different observations: it must print an EMPTY `ours`, and if
// it prints a hash then the premise of Patch 321 is wrong and the patch should
// not land.
//
// PREDICTION, registered before either arm was run:
//   arm A   mapcrc: ours ""          theirs ""          nomap 0  would 0
//   arm B   mapcrc: ours "676de275"  theirs "676de275"  nomap 0  would 0
//
// 676de275 is what tools' independent reading of the spec says bhop_eazy.bsp
// hashes to -- md4 of the whole file, folded to 32 bits the way
// hashfunc_terminate_uint folds it -- computed WITHOUT running the engine, from
// mod_vbsp.c/plugin.c/sha1.c rather than from the engine's own answer.  See
// scratchpad/mapcrc.py, which self-tests its MD4 against RFC 1320 first.
//
// FALSIFIED IF: arm A prints a hash (nothing was broken, so nothing is fixed);
//          or arm B prints "" (the fix did not reach the world model);
//          or arm B's hash is not 676de275 (the engine and the spec disagree,
//          and then the number means nothing whatever it is);
//          or either arm reports nomap 1 (the two subjects of one key are not
//          reading the same map on a LISTEN server, where they are by
//          construction the same model_t -- that would be a bug in the keys).
//
// `theirs` is the weaker half of this harness and is recorded as such: on a
// listen server the client and the server share one model_t, so agreement is
// not evidence that a real client computes the same number over a network.  The
// arm that tests THAT is against the Pi, with a deliberately altered local copy.
cfg_save_auto 0
log_enable 1
log_dir logs
developer 0

waitms 5000

map bhop_eazy
waitmap 45
waitms 4000

echo ================================ P321 -- mapcrc, both subjects
cmd timer
waitms 2000

echo ================================ P321 done
waitms 500
quit
