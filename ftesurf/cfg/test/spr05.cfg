// SPR05 -- VOID.  ITS NUMBERS MEAN NOTHING.  Kept only so the mistake is on
// record; the real measurement is SPR06.
//
// `timerefresh` calls R_RenderView() in a loop (gl_rmisc.c:462-490) and never
// runs CSQC_UpdateView, so nothing R_BeginPolygon queues is in the scene it
// times -- both arms below timed the identical sprite-free frame.  It also
// takes the frame count as its SECOND argument, so every `timerefresh 512`
// here ran 128 frames with finish=512.  The tell was in the result: the arm
// with 425 extra additive quads came out FASTER than the arm without them.
//
// ---- everything below this line is the original, wrong, config -------------
//
// What do the sprites actually cost?
//
// surf_grotto, the densest point_spotlight map in the library (464), from the
// same camera as SPR03, where 425 of the 464 pass the cull.  The plan asks for
// this to be measured rather than assumed, and the assumption in the plan was
// wrong in the reassuring direction already: "24k polys" is the LIBRARY total,
// and the worst single map is 862.
//
// METHOD, from what four wasted benchmark runs taught this project:
//   * timerefresh single samples spread 14x.  Five per arm, best wins -- every
//     source of noise here can only ADD time.
//   * INTERLEAVED, never in blocks, or drift lands entirely on one arm.
//   * the first pass of each map pays for texture and shader uploads; there is
//     a warm-up pass before any sample is taken.
//   * vbsp_spotlights is read at map LOAD, so each arm needs its own retry --
//     toggling it between samples would measure the same scene twice.
//
// The camera is re-set after every retry because noclip does not survive a
// respawn, and a fallen camera is a different scene.

log_enable 1
log_dir "logs"
log_name "spr05"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
sv_cheats 1
rec_retry 1
vbsp_sprites 1
r_speeds 0

wait 200
vbsp_spotlights 1
map surf_grotto
waitmap 1800
waitms 5000
noclip
waitms 300
setpos 2324 -1998 3388 13.5 0.0 0
waitms 1500

echo ^5=== WARM-UP (discard) ===
timerefresh 512
waitms 500

echo ^5=== A1 spotlights ON ===
timerefresh 512
waitms 400
vbsp_spotlights 0
retry
waitmap 1800
waitms 4000
noclip
setpos 2324 -1998 3388 13.5 0.0 0
waitms 1200
echo ^5=== B1 spotlights OFF ===
timerefresh 512
waitms 400

vbsp_spotlights 1
retry
waitmap 1800
waitms 4000
noclip
setpos 2324 -1998 3388 13.5 0.0 0
waitms 1200
echo ^5=== A2 spotlights ON ===
timerefresh 512
waitms 400
vbsp_spotlights 0
retry
waitmap 1800
waitms 4000
noclip
setpos 2324 -1998 3388 13.5 0.0 0
waitms 1200
echo ^5=== B2 spotlights OFF ===
timerefresh 512
waitms 400

vbsp_spotlights 1
retry
waitmap 1800
waitms 4000
noclip
setpos 2324 -1998 3388 13.5 0.0 0
waitms 1200
echo ^5=== A3 spotlights ON ===
timerefresh 512
waitms 400
vbsp_spotlights 0
retry
waitmap 1800
waitms 4000
noclip
setpos 2324 -1998 3388 13.5 0.0 0
waitms 1200
echo ^5=== B3 spotlights OFF ===
timerefresh 512
waitms 400

vbsp_spotlights 1
retry
waitmap 1800
waitms 4000
noclip
setpos 2324 -1998 3388 13.5 0.0 0
waitms 1200
echo ^5=== A4 spotlights ON ===
timerefresh 512
waitms 400
vbsp_spotlights 0
retry
waitmap 1800
waitms 4000
noclip
setpos 2324 -1998 3388 13.5 0.0 0
waitms 1200
echo ^5=== B4 spotlights OFF ===
timerefresh 512
waitms 400

vbsp_spotlights 1
retry
waitmap 1800
waitms 4000
noclip
setpos 2324 -1998 3388 13.5 0.0 0
waitms 1200
echo ^5=== A5 spotlights ON ===
timerefresh 512
waitms 400
vbsp_spotlights 0
retry
