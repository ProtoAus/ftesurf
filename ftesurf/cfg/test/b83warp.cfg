cfg_save_auto 0
// BUILD 83 -- DOES THE FORMAT NOW CARRY THE EVENT, AND NOT ONLY ITS CONSEQUENCE?
//
// WHY THIS EXISTS.  Experiment E3 (engine Patch 327, `pm_recsim`) replayed a real
// recording's input trace back through the mover that wrote it.  The mover
// reproduced the run exactly -- 1307 of 1324 packets at the file's own %.2f
// printing floor -- and the fifteen that failed were the finding:
//
//     TEN WERE trigger_teleport.  ~250 u of position with velocity preserved
//     EXACTLY, landing on the run's own start coordinates.  THE RECORDING
//     RECORDED THE CONSEQUENCE AND NEVER THE EVENT.
//
// So an open-loop re-simulation died at the first teleport (row 149 of 1340) and
// everything after it was noise, and a verifier could not tell a legitimate stage
// teleport from a cheat that moved the player, because those are the same bytes.
//
// Build 83 adds the event: a `warp` record written by the handler that imposed
// the state, and a `startjit` header key for the randomized start -- which is the
// same class of event, applied by the server, one instant earlier.
//
// THIS FILE CAPTURES.  cfg/test/b83run.cfg replays and measures.
//
// ---------------------------------------------------------------------------
// PRE-REGISTERED, and written before the binary was run:
//
//   A  A part file at data/parts/0.rec, header `FTESURF-REC 7`, carrying
//      `instart`, `mapcrc` and a `startjit` key.
//   B  `startjit 2 <dx> <dy> 0` with dx,dy in [-2,2] and dz EXACTLY 0.  The rule
//      is horizontal; a non-zero dz would mean the writer grew a component the
//      checker does not know about.  All-zero is a LEGAL outcome (every
//      candidate blocked) and is reported, not faulted -- but on an open bhop
//      start it should be rare, so an all-zero here is worth a second look.
//   C  At least one `warp ... tele ...` record, because the E3 run fell off this
//      map ten times with the same script.  Each carries nine fields.
//   D  reccheck.py passes the part file with 0 faults, and its `end` trailer --
//      if the run is finished, which this one is not -- would carry six fields.
//   E  The run is NOT voided and NOT tainted by the displacement: `cmd timer`
//      reads `running` after the start, and the class stays clean.  This is the
//      arm that catches the re-arm cancel, which does not fire on the tick the
//      jitter is applied but on the NEXT packet -- so it has to be read AFTER
//      several more packets, not immediately.
//
// FALSIFIED IF: no part file; or the header says 6; or `startjit` is absent
//      while run_startjitter is 2; or dz is non-zero; or the timer reads
//      `stopped`/`armed` mid-run (the nudge cancelled the attempt); or reccheck
//      faults.
//
// THE MEASUREMENT PROPER IS NOT HERE.  Whether the format now carries enough to
// cross a teleport is pm_recsim's arm 3, and it is measured in b83run.cfg
// against a CONTROL -- the build-82 recording kept at data/e3trace.rec, which is
// v6, has no warp records, and must STILL die at row 149 under the same binary.
// A tool that got looser rather than better-informed would improve both.
// ---------------------------------------------------------------------------

cfg_save_auto 0
log_enable 1
log_dir logs
log_name b83warp
developer 0
sv_cheats 0

// `set`, not a bare assignment: these register in worldspawn, so before the
// first map load a bare `rec_stream 1` is Unknown command and the default
// silently stands -- which produces a MISSING FILE, i.e. the same symptom arm
// A's failure produces.
set rec_enable 1
set rec_stream 1
set rec_runarchive 1

// THE RULE UNDER TEST, set explicitly rather than inherited.  default.cfg ships
// 2 and so does cfg/lobby/lobby.cfg; pinning it here means this file states the rule
// its own measurements were taken under, which is the same argument the header
// key makes.
set run_startjitter 2

cl_yawspeed 210

waitms 6000
map bhop_eazy
waitmap 45
waitms 3000

echo ================================ B83 ARM E -- armed, not started.
cmd timer
waitms 500

cmd zone_goto 0
waitms 1000
setpos -352 -352 144 0 335.3 0
waitms 1500

// ---------------------------------------------------------------------------
// The run starts HERE, on the jump.  Nothing below may warp or noclip: setpos
// voids nothing but TAINTS via SV_TimerCheat, and noclip changes pm_type, which
// is not in the file.  Both are used only BEFORE the jump that starts the clock.
// ---------------------------------------------------------------------------
alias hop  "+jump;waitms 70;-jump;waitms 110"
alias goL  "+moveleft;-moveright;+left;-right"
alias goR  "-moveleft;+moveright;-left;+right"
alias cyc  "goL;hop;hop;goR;hop;hop"

+forward
+jump
waitms 120
-jump
waitms 120

// ARM E, FIRST READ.  Deliberately not immediate: the re-arm cancel this rule
// could trip fires on the packet AFTER the displacement, not on the same one.
cyc
echo ================================ B83 ARM E -- after the first cycle.  Expect RUNNING.
cmd timer
waitms 200

cyc
cyc
cyc
cyc
echo ================================ B83 ARM E -- mid-run.  Expect RUNNING.
cmd timer
cyc
cyc
cyc
cyc
cyc
echo ================================ B83 ARM E -- mid-run 2.  Expect RUNNING.
cmd timer
cyc
cyc
cyc
cyc
cyc
echo ================================ B83 ARM E -- mid-run 3.  Expect RUNNING.
cmd timer
cyc
cyc
cyc
cyc
cyc

-forward
-moveleft
-moveright
-left
-right
waitms 500

echo ================================ B83 ARM E -- last read before quit.
cmd timer
waitms 500

echo ================================ B83 capture done -- quitting WITHOUT finishing.
waitms 500
quit

// ============================================================================
// MEASURED 2026-09-15, bhop_eazy, QC build 83 + engine Patch 328.
//
// THE FIRST RUN OF THIS FILE FAILED ARM B, AND THE FAILURE IS THE MOST USEFUL
// THING IN IT.  The header read:
//
//     startjit 2.0000 0.0000 0.0000 0.0000
//
// -- the rule in force at 2 units and NOTHING APPLIED.  Legal by the grammar
// (every candidate blocked) and wrong here: bhop_eazy's start is open air.
//
// THE CAUSE WAS A PREDICATE CHOSEN FOR THE WRONG QUESTION.  SV_RunStartJitter
// refused any candidate that was INSIDE the start box, reasoning that the start
// fires when the hull LEAVES the box so a candidate back inside would re-arm.
// That is true of a walk-out start and false of the other kind: bhop_eazy starts
// the clock ON THE JUMP, with the player standing squarely in the box.  Every
// candidate is "inside", all four tries are refused, and the rule applies
// nothing -- on every bhop map, on every run, forever.
//
// IT WAS ALSO THE WRONG PREDICATE TWICE OVER.  The re-arm cancel fires from the
// arm scan, which asks SV_ZoneOcc (run_t_hullocc, i.e. run_zone_hull >= 2 -- a
// POINT test at the shipped ruleset); the refusal asked SV_ZoneIn
// (run_t_hullevt, >= 1 -- the HULL).  So even on a walk-out start it refused a
// band one hull-width wide in which nothing bad happens.
//
// THE FIX IS THE INVARIANT AND NOT THE POSITION: a candidate must not CHANGE
// whether the player occupies the start zone, because the cancel fires on
// `az != e.run_t_azone` -- on the answer moving, not on where the player is.
//
//   AND THIS IS THE THREE-STATE HEADER EARNING ITS KEEP ON ITS FIRST OUTING.
//   A writer that omitted the key when nothing was applied would have produced
//   a file indistinguishable from one written with the rule switched off, and
//   the feature would have shipped INERT with every test passing -- the exact
//   failure `registercvar beside the read` and sv_mapcheck are both about.  The
//   zero is what said so.
//
// SECOND RUN, after the fix:
//
//   ARM A  data/parts/0.rec, 273,997 bytes, FTESURF-REC 7, header carrying
//          `instart 607 607`, `mapcrc 676de275`, `zonesrc online`,
//          `zonecrc c50cfd70`, `zonerule 1 1 0`.  1750 `in` rows, 1887 samples.
//   ARM B  `startjit 2.0000 1.6462 1.0044 0.0000` -- inside the rule on both
//          axes, dz EXACTLY 0.
//   ARM C  TEN `warp <pk> <mt> tele ...` records, all nine fields, all to
//          -352 -352 66, which is this map's "you fell off" reset.  My scripted
//          bhop is still bad and still falls off ten times.
//   ARM D  reccheck.py: `ok`, 0 faults, reading
//          `startjit 2 (1.6462 1.0044 0)` and `warps tele x10`.
//   ARM E  `timer: running` at all five mid-run reads, `flags 0`, class clean.
//          THE DISPLACEMENT NEITHER VOIDED NOR TAINTED THE RUN, which is the
//          arm that catches the re-arm cancel -- and it is read after several
//          more packets, not on the tick of the nudge, because the cancel fires
//          on the NEXT packet and would be invisible to a same-tick test.
//
// The `flags 0` matters for the same reason it did in E3: a rule measured
// against a tainted recording would be easy to wave away.
//
// THE REPLAY MEASUREMENT IS IN b83run.cfg, with the build-82 recording as a
// control that is REQUIRED TO STILL FAIL.
// ============================================================================
