// SPR04 -- the orientation test that a symmetric sprite cannot do.
//
// kz_anubis' digits proved the plane, the scale and the placement, and proved
// nothing about the two ways a quad can be WRONG while still being in the right
// place: mirrored left-to-right, and flipped top-to-bottom.  A seven-segment
// "0" is symmetric in both axes, so it looks identical all four ways.
//
// bhop_murder is a quote map.  Nearly a hundred of its env_sprite_oriented are
// TEXT -- "start", "no jump", "climb", "stop" -- and text is asymmetric in both
// axes at once.  Readable means the right/up basis, the yaw+180 and the V
// direction are all correct simultaneously; anything wrong is unmistakable.
//
// new/cypress.vmt is here as the second witness: 57 trees, and a tree with its
// trunk at the top would be just as obvious.
//
// Every camera is 200-320 units along the sprite's AUTHORED forward, which is
// where Source puts the viewer.

log_enable 1
log_dir "logs"
log_name "spr04"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
sv_cheats 1
vbsp_sprites 1
vbsp_spotlights 1
hud_debug 0
hud_keys 0
hud_speed 0

wait 200
map bhop_murder
waitmap 1800
waitms 5000
noclip
waitms 400

setpos 32 -480 -196 -90.0 180.0 0
waitms 1500
screenshot spr04_start

setpos 14037 5155 -1460 0 135.0 0
waitms 1500
screenshot spr04_nojump

setpos 13584 8376 -1848 0 -90.0 0
waitms 1500
screenshot spr04_climb

setpos 15 7391 44 0 75.0 0
waitms 1500
screenshot spr04_stop

setpos 11952 9196 304 0 90.0 0
waitms 1500
screenshot spr04_cypress

echo ^5=== spr04 done ===
wait 30
quit
