// One-shot menu/CSQC handoff smoke. A successful menu close MUST retain its ticket.
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
cl_netfps 100
s_volume 0
log_enable 1
log_dir logs
log_name runlines_smoke
developer 1
log_developer 1
menu_restart
waitms 300
set fs_eventfog_map surf_666
set fs_eventfog_serial 1
set fs_eventfog_until 999999
fs_eventfog_map
menu_cmd ui_close
fs_eventfog_map
map surf_666
waitms 18000
cmd maxfog status
fs_eventfog_map
fs_eventfog_until
fog
waitms 1500
cmd maxfog status
fs_eventfog_map
fs_eventfog_until
fog
waitms 1000
cmd maxfog 0
waitms 2000
cmd maxfog status
waitms 1000
fog
echo RUNLINES COMPLETE
quit
