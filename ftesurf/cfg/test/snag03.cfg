// SNAG03 -- Patch 258 A/B on the reproduced snag.
//
// bhop_monster_jam, displacement #89, walking north-west across the seam.  With
// the old plane set the player wedges at roughly 10529.1 -324.1 5357.3 against
// `4 edge p3p1`, normal 0.506 -0.759 0.411 -- z below PMSrc_Standable(), so the
// step-down is refused too and the player cannot move at all.  An exact SAT test
// puts the box 0.11 units CLEAR of that triangle, separated along edge2-cross-Y,
// one of the nine bevels that were never built.
//
// pm_trisoup_bevels is not map-latched, so both passes run in ONE map load from
// the same setpos -- no reload, and none of the "map x twice does not reload"
// trap.  Pass A is the old behaviour exactly; pass B is the fix.
//
// WHAT DECIDES IT: the origin run_eyeinfo prints at the end of each pass.  Pass A
// should stop at the wedge; pass B should be well past it.  If both stop in the
// same place the bevels are not reaching this trace and nothing else in the log
// matters.  Watch also for `via plane 4 edge p3p1` disappearing from pass B --
// if it is still there, the plane set did not change.

log_enable 1
log_dir "logs"
log_name "snag03"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
con_notifylines 0
developer 1
log_developer 1

wait 200
map bhop_monster_jam
waitmap 1800
waitms 8000
sv_cheats 1
waitms 400
pm_dispprobe 1

echo ^5=== PASS A: pm_trisoup_bevels 0 (the old 11-plane set) ===
pm_trisoup_bevels 0
waitms 200
setpos 10547.7 -363.1 5379.2 0 123.7 0
waitms 1500
cmd run_eyeinfo
waitms 800
+forward
waitms 3000
-forward
waitms 800
echo ^5--- A final position ---
cmd run_eyeinfo
waitms 1000
screenshot
waitms 600

echo ^5=== PASS B: pm_trisoup_bevels 1 (nine edge x axis bevels) ===
pm_trisoup_bevels 1
waitms 200
setpos 10547.7 -363.1 5379.2 0 123.7 0
waitms 1500
cmd run_eyeinfo
waitms 800
+forward
waitms 3000
-forward
waitms 800
echo ^5--- B final position ---
cmd run_eyeinfo
waitms 1000
screenshot
waitms 600

echo ^5=== snag03 done ===
pm_dispprobe 0
wait 30
quit
