// MS1QUIT -- Multi-Session across processes (listen), 1 of 3.  Driver:
// scratchpad run_quit.ps1.  Zones as ms1listen.cfg.
//   1 (this): run 2 s, `quit`.  A listen quit runs no ClientDisconnect; QC
//     SV_Shutdown parks the run (why server).
//   2 (ms1quit2): a NEW process on the same map is offered it; !resume, finish:
//     a v10 .rec, `pauses server`, `sessions 1`, 0 faults.
//   3 (ms1quit3): slot 1 re-parked with its `day` aged past run_resume_days:
//     the worldspawn sweep (a nested-wildcard search) removes it -- no offer and
//     no "dropped -- it expired" line.  If the search does not match, the offer
//     check drops it instead WITH that line: the two outcomes are told apart.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name ms1quit
developer 1
cl_idlefps 0
cl_maxfps 100
sv_port 27631
set run_resume_min 1
waitms 5000
map surf_666
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 500
set rec_terms 1
set rec_stream 0
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 2000
-forward
waitms 300
cmd timer
quit

