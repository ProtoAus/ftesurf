// P432PROF -- measurement: where the run line's QC time goes (profile_csqc over 10 s
// of the p432perf whole-run view, paused, path on).  Divide by the `draws` the
// two `replay status` lines bracket (the minimized window renders few frames).
// RESULT (2026-09-22, before the stride levels): 615 draws, Line_Draw 3.517 s total =
//  5.7 ms a draw profiled (p432bench's unprofiled figure was 3.7): Line_Feed, the strip
//  and Line_Emit each about a quarter.
log_enable 1
log_dir "logs"
log_name "p432prof"
developer 0
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0
set run_resume 0
sv_public 0
sv_port 27685
set lobby_dir ""
set pr_enable_profiling 1

wait 200
map surf_rookie
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 1000
replay online 47
replay pause
replay seek 20
waitms 1000
replay status
profile_csqc
waitms 10000
echo ^5=== p432prof ===
profile_csqc
replay status
replay stop
quit
