// cfg_save_auto 0: this run sets archived cvars (vid_*, cl_maxfps); never let it write them into ftesurf.cfg (cl_main.c:2535)
cfg_save_auto 0
// Patch 294f -- REDO of 294e, whose arm 2 was void.
//
// WHAT WENT WRONG IN 294e.  Its arms were  map surf_fantasy / map surf_fantasy /
// map surf_boreas, and the second one is trap 1 in my own notes: FTE keeps the
// world model, so Mod_LoadVBSP never runs on a repeat of the SAME map.  The log
// proves it -- arm 2 printed "props: 23 spawned" (entities respawned) but NO
// "props: N of 2345 lit from VRAD's baked vertex lighting" line and NO texdiag
// PROPLIGHT line, because neither is produced by anything except a real load.
// hl2_lt_vhv12 1 was therefore never read and arm 2 measured arm 1 again.
//
// THE FIX IS THE ORDER.  Every consecutive pair below is a DIFFERENT map, so
// every arm is a real Mod_LoadVBSP.  That also lets fantasy-on and fantasy-off
// sit in ONE process, which is the comparison that matters.
//
// WHAT 294e DID ESTABLISH (both arms valid):
//   fantasy, vhv12 0 : 0 of 2345 baked, 292 at the hl2_lt_min floor
//                      PROPLIGHT mean 55.3 61.9 53.9
//   boreas,  vhv12 1 : 1587 of 1587 baked, 1276 kept per-vertex
//                      PROPLIGHT mean 177.8 183.3 193.4
// Boreas' baked props sit at 177.8 -- 3.2x fantasy's fallback.  So the baked
// path is not intrinsically dark, and "props are dark" is specific to the
// 12-byte files, not to baking.
//
// PREDICTIONS, WRITTEN BEFORE THE RUN (trap 20 -- the control arm's expected
// number goes down first, or it cannot fail):
//   ARM 1 fantasy vhv12 1 : census MUST read 2345 of 2345.  Mean UNKNOWN -- that
//         is the whole point.  The stored-byte mean of fantasy's own .vhv files
//         is 35.82/255 over 469 sampled props.  If the engine mean lands near
//         35.8 the pipeline is faithful and the FILES are dim; if it lands far
//         below, the loss is in the pipeline (baked_scale / vcgain / retint).
//   ARM 2 boreas vhv12 0  : census MUST read 1587 of 1587 and the mean MUST be
//         177.8 183.3 193.4, unchanged from 294e arm 3.  boreas ships 4-byte
//         files, which the 12-byte gate must not touch in either state.  Any
//         movement here is a regression and fails the run.
//   ARM 3 fantasy vhv12 0 : census MUST read 0 of 2345 and the mean MUST be
//         55.3 61.9 53.9, reproducing 294e arm 1.  This is the canary: it
//         proves this process agrees with the last one, which is what licenses
//         comparing arm 1 against anything measured there.
//
// PROPLIGHT is a whole-map census over all N props, not a pixel measurement, so
// it is immune to the vantage/animation floor problems and is directly
// comparable across processes.  The screenshots are secondary.
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000
wait 200

developer 1
log_developer 1
log_enable 1
log_dir logs
log_name p294f_proplevel
cl_maxfps 0
cl_idlefps 0
sv_cheats 1
con_notifylines 0
con_notifytime 0.01
con_notifytime_error 0.01
r_drawentities 1
r_texdiag 1

// Lex's own save-locks on surf_fantasy (data/saves/surf_fantasy).
alias lex1 "setpos -9921.6426 -13870.3916 6350.7290 0.7910 -48.8123 0; waitms 2000"
alias lex2 "setpos -8047.4780 -13422.3525 5602.3896 27.4438 153.7427 0; waitms 2000"
alias lex3 "setpos -7821.1230 -13608.8525 4073.5354 -3.3179 41.3910 0; waitms 2000"

// ---------------- ARM 1: fantasy, BAKED (the missing number) ----------------
hl2_lt_vhv12 1
echo ^5=== p294f ARM 1: surf_fantasy vhv12 1 -- baked; expect census 2345 of 2345
map surf_fantasy
waitmap 600
waitms 9000
waitms 3000
noclip
waitms 1000
lex1
cmd viewpos
screenshot p294f_on_lex1
lex2
screenshot p294f_on_lex2
lex3
screenshot p294f_on_lex3

// ---------------- ARM 2: boreas CONTROL, gate OFF ----------------
// Different map => real reload.  Expected: identical to 294e arm 3.
hl2_lt_vhv12 0
echo ^5=== p294f ARM 2: surf_boreas vhv12 0 -- CONTROL; expect 1587 of 1587, mean 177.8 183.3 193.4
map surf_boreas
waitmap 600
waitms 9000
waitms 3000
noclip
waitms 1000
setpos 9440 -15488 3741 0 90 0
waitms 2000
screenshot p294f_ctl_boreas

// ---------------- ARM 3: fantasy, FALLBACK -- the canary ----------------
// Different map from arm 2 => real reload.  Must reproduce 294e arm 1 exactly.
hl2_lt_vhv12 0
echo ^5=== p294f ARM 3: surf_fantasy vhv12 0 -- canary; expect 0 of 2345, mean 55.3 61.9 53.9
map surf_fantasy
waitmap 600
waitms 9000
waitms 3000
noclip
waitms 1000
lex1
screenshot p294f_off_lex1
lex2
screenshot p294f_off_lex2
lex3
screenshot p294f_off_lex3

echo ^5=== END OF RUN ===
waitms 500
quit
