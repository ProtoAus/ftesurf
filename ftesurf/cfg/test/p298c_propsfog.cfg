cfg_save_auto 0
// Patch 298c -- ARE THE UNFOGGED SKYROOM OBJECTS STATIC PROPS, AND ARE PROPS
//               FOGGED ANYWHERE AT ALL?
//
// THE CHAIN SO FAR, all at Lex's own save011 vantage:
//   p298  A2/A3 -- skyroom fog works and saturates; painting it magenta turned
//         MOST of the town magenta, and `end 1u` was indistinguishable from the
//         map's real `end 23.4375 / start 11.7188`.  So the Patch 254 linear
//         mapping is correct and the numbers are already delivering full fog.
//         BUT a specific subset stayed PURE BLACK through both magenta arms --
//         the church-and-town cluster centre-right and the block at far left.
//         Those are exactly Lex's "bright black" buildings.
//   p298  A5 -- r_fastsky 1 removed the town, so it is skyroom geometry.
//   p298  A7 -- main-view fog painted green did NOT touch the town, so it is on
//         the skyroom fog path, correctly.
//   p298b B4 -- r_drawentities 0 removed the ENTIRE town, fogged and unfogged
//         alike.  So BOTH sets are entities and the split is WITHIN entities.
//         (B2's r_fullbright is discarded: it changed nothing anywhere in the
//         frame, so it is an inert control here, not evidence.)
//
// THE HYPOTHESIS NOW.  r_drawentities 0 removes static props AND brush-model
// submodels together, which is why B4 could not separate them.  If the black set
// is prop_static and the magenta set is brush entities, then the fault is not
// about the skyroom at all: it is that STATIC PROPS ARE NEVER FOGGED, which
// would show on every fogged map in the library, not just this window.
//
// THE DISCRIMINATOR.  hl2_propdist culls static props that declare no fade
// distance of their own and touches nothing else -- mod_vbsp.c:8429-8437, read
// live every frame in VBSP_PrepareFrame against refdef->vieworg, no map reload.
// Inside the skyroom pass vieworg IS the sky_camera, and the nearest skyroom
// face is 264u from it, so `hl2_propdist 1` culls every static prop in there.
// Props that set their own fade distance survive, so this is a one-way test:
// what DISAPPEARS is certainly a prop; what remains is not certainly a brush.
//
// PRE-REGISTERED, judged against C3 and C5b, the two repeat controls:
//   C2 removes the BLACK cluster and leaves the rest -> the unfogged set is
//      static props.  Fault located: props take no fog.
//   C2 removes the MAGENTA buildings and leaves the black -> the reverse, and my
//      hypothesis is backwards; the black ones are brush entities and it is
//      brush-entity shading that is broken, which would tie to fault 4.
//   C2 removes BOTH or NEITHER -> the prop/brush split is not the axis at all
//      and I need a different instrument.
//
// C6 IS THE ONE THAT MATTERS BEYOND THIS MAP.  At save008, a completely
// different stage, with the MAIN view fog painted magenta at end 1u: every
// surface past 1 unit must become flat magenta.  Anything still showing its own
// texture is a surface the fog never reached.  If props stand out there too,
// this is a library-wide fault and the window is just where Lex happened to
// notice it.  C6a is its baseline; without it C6b proves nothing.
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000
wait 200

developer 1
log_developer 1
log_enable 1
log_dir logs
log_name p298c_propsfog
cl_maxfps 0
cl_idlefps 0
sv_cheats 1
con_notifylines 0
con_notifytime 0.01
r_drawviewmodel 0

map surf_tensor2
waitmap 600
waitms 9000
waitms 3000
noclip
waitms 1000

// save011 -- the window with the fault.  save008 -- a different stage entirely.
alias vwin   "setpos -7563.2915 10425.6309 -974.1351 1.9775 -0.39 0; waitms 2000"
alias vstage "setpos -10751.1777 9562.7969 -9789.3184 -0.0934 89.4342 0; waitms 2000"

// ---- C1: baseline ----
echo ^5=== C1: shipped defaults
vwin
prop_census
screenshot p298c_c1_default

// ---- C2: cull static props ----
hl2_propdist 1
echo ^5=== C2: hl2_propdist 1 -- every fade-less static prop culled
vwin
prop_census
screenshot p298c_c2_noprops

// ---- C3: repeat control for C1 ----
hl2_propdist 0
echo ^5=== C3: hl2_propdist 0 -- repeat control, must reproduce C1
vwin
screenshot p298c_c3_repeat

// ---- C4/C5: the same question under MAGENTA fog ----
// C4 minus C5 is the prop set, in a colour that cannot be misread.
skyroomfog 1 1 0 1 1 0
hl2_propdist 1
echo ^5=== C4: magenta skyroom fog, props culled
vwin
screenshot p298c_c4_magenta_noprops

hl2_propdist 0
echo ^5=== C5: magenta skyroom fog, props back -- must reproduce p298 A2
vwin
screenshot p298c_c5_magenta_props

// ---- C6: the library-wide question, at a different stage, MAIN view fog ----
skyroomfog 23.4375 0.160784 0.258824 0.352941 1 11.7188
echo ^5=== C6a: save008, a different stage, untouched -- baseline for C6b
vstage
screenshot p298c_c6a_stage_default

fog 1 1 0 1 1 0
echo ^5=== C6b: MAIN fog magenta end 1u -- anything not magenta is unfogged
vstage
screenshot p298c_c6b_stage_magenta

echo ^5=== END OF RUN ===
waitms 500
quit
