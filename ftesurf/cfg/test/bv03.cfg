// BV03 -- trigger_push's exit cash-out, and the Patch 246/248 regressions.
//
// PART 1, the push.  Patch 249 changed trigger_push in four ways:
//   - a class gate (spawnflags bit 1 or bit 64), which 100 instances in 39
//     maps fail, and which was not being tested at all;
//   - the within-command accumulate across OVERLAPPING volumes;
//   - the one-unit origin lift on an upward push;
//   - the k_flMaxEntitySpeed clamp on a PUSH_ONCE.
// and, through .run_basevel, gave it the exit cash-out it never had.
//
// surf_kitsune *64 is the probe: speed 2000, pushdir "0 270 0" (yaw 270, so
// straight along -Y), spawnflags 1, no filter, no StartDisabled.  Volume is
// x 9360..9752, y 3392..3776, z -4000..-3550.
//
// Expected: the player is carried out along -Y and, on the first command
// after the volume stops re-arming the carrier, collects
//     2000 * (1 + 0.015 * 0.5) = 2015.0
// as real velocity.  Before this patch a horizontal push left NOTHING behind
// on exit -- the carrier was added before the move and subtracted after, and
// then thrown away.  That is why surf boosters felt dead.
//
// PART 2, the regressions.  Nothing in Patch 249 should move any of these:
//     surf_rise      overlays: 103 of 105 placed, sprites 1 of 1
//     bhop_canals    decals 81 of 416, overlays 41 of 53
//     bhop_arcane    1122 func_bhop, overlays 5 of 5
//     surf_kitsune   target case: 28
// The entity-I/O layer is the part most at risk: SV_ApplyInput now folds
// input names to lower case before dispatching, so every input in the library
// goes through a changed line.  bhop_arcane's five secrets and kitsune's
// SecretTeleporter button are the ones that would show it.

log_enable 1
log_dir "logs"
log_name "bv03"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0

wait 200

echo ^5=================== surf_kitsune: trigger_push 2000 along -Y ========
map surf_kitsune
waitmap 1800
waitms 6000
sv_cheats 1
run_bv_debug 1
pm_ticrate
waitms 300
setpos 9556 3584 -3775
waitms 2500
screenshot bv03_push
waitms 500
cmd ent_census
waitms 1500

echo ^5=================== surf_rise: overlays + sprites ===================
run_bv_debug 0
map surf_rise
waitmap 1800
waitms 5000
cmd ent_census
waitms 1500

echo ^5=================== bhop_canals: decals + overlays ==================
map bhop_canals
waitmap 1800
waitms 5000
cmd ent_census
waitms 1500

echo ^5=================== bhop_arcane: func_bhop + secrets =================
map bhop_arcane
waitmap 1800
waitms 5000
cmd ent_census
waitms 1500

echo ^5=== bv03 done ===
wait 30
quit
