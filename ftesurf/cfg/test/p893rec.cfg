// Patch 893 recording arm: p882rec.cfg's lody-bonus attempt at cl_netfps 23 with cl_netfps_snap 0, set
// after the load: commands of 43-44 ms on 15 ms ticks, so the carry is never zero -- every part must
// still run one tick (consecutive rows' <mt> step by 1, never 2)
// (affliction's 15 ms ticks: 50 ms commands of three or four ticks, each run tick by tick), replayed in the session: `pin 73/73 ... EXACT REPLAY` with the open loop never
// past 1u.  The rows are one per tick, a later part's flagged fl 8.  No `quit`: the harness times
// the client out so the attempt stays in the retained rig to be read.
//   python tools/runlines_smoke.py ftesurf/cfg/test/p893rec.cfg --mount --timeout 400 \
//     --ssqc <qwprogs> --csqc <csprogs> --mqc <menu> --client <exe> --output-dir <task root>/artifacts
cfg_save_auto 0
log_enable 1
log_dir logs
log_name runlines_smoke
con_notifytime 0
cl_idlefps 0
cl_maxfps 100
vid_vsync 0
vid_fullscreen 0
vid_width 1280
vid_height 720
sv_public 0
set run_resume 0
set rec_stream 1
developer 1
log_developer 1
waitms 1500

map surf_affliction
waitmap 120
waitms 6000
menu_restart
ui_close
waitms 500
cl_netfps_snap 0
cl_netfps 23
waitms 300
echo ==== R1 lody bonus start ====
say !b 5
waitms 2500
cmd viewpos
cmd timer
waitms 300
echo ==== R2 walk out, then hold jump ====
setpos -8320 15104 12700 0 225 0
waitms 1500
+forward
waitms 1500
cmd timer
+jump
waitms 3000
-jump
-forward
waitms 500
cmd timer
cmd viewpos
waitms 500
echo ==== R3 replay the failed attempt while it is kept ====
pm_recsim data/parts/0-fail.rec
waitms 3000
echo RUNLINES COMPLETE
waitms 600000
