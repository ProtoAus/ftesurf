// BUILD 25 stage 1 -- the final regression pass, against the deployed progs.
//
// Everything the earlier passes established, once more on the build that ships,
// plus the two console-font defaults and the cvars.  Nothing here creates a
// file: the save states and the fixtures are already gone and this must not put
// any back.

developer 1
log_developer 1
cfg_save_auto 0

wait 200
map surf_aesthetic
waitmap 90

echo ""
echo "=== the new cvars, with their (default) annotations ==="
hud_seq_board
hud_watch_info
con_textsize
con_textfont
cl_maxfps
rec_savelock
wait 5
echo ""

echo "=== serverinfo maxfps ==="
serverinfo
wait 5
echo ""

echo "=== the save list is empty and the removed commands are gone ==="
cmd sl_list
wait 5
cmd sl_loadlast
wait 3
cmd sl_dellast
wait 3
echo ""

echo "=== the timer report, with the ramp line ==="
cmd timer
wait 5
echo ""

echo "=== selftests ==="
pm_selftest
wait 10
zone_selftest
wait 10
echo ""

echo "=== b25f done ==="
wait 20
quit
