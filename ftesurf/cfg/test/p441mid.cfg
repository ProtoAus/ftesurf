cfg_save_auto 0

// ===========================================================================
//  P441MID -- rec_enable turned off UNDER a recording run, then a failed rewind.
//    python tools/p441void.py --arm mid
//  The fixtures and the staging are in cfg/test/p441void.cfg's header.  No zones
//  fixture: nothing here asks a zone a question.
//
//  THE DEFECT, AND IT IS PATCH 441'S OWN.  441 gated the void on SV_RecEnabled()
//  -- "is this server writing .rec files at all" -- to stop it cancelling honest
//  runs on a server that records nothing (p441norec).  An independent review of
//  that patch found the gate answers the wrong question: SV_RecEnabled() is about
//  the SERVER's configuration NOW, and the invariant Patch 434 enforces is about
//  THIS RUN's recorder.  The two part company the moment the cvar moves under a
//  run that is already recording:
//    - rec_enable is read at SV_RecOpen (sv_timer.qc:4410) and nowhere per-sample,
//      so a live buffer keeps taking samples after `rec_enable 0`;
//    - SV_RecRewind then returns FALSE at its own `if (!SV_RecEnabled())`
//      (sv_timer.qc:5988) on the cold path;
//    - so the else branch runs with SV_RecEnabled() FALSE: no void, and
//      SV_RecDiscard throws the live recording away.
//  A RUNNING attempt then carries on with no buffer and no stream behind it,
//  posting splits and filing a finish with nothing to replay -- which is verbatim
//  the defect Patch 434 exists to prevent, reachable through 441's own gate.
//
//  THE FIX.  `SV_RecEnabled() || hadrec`: void when the server records at all, or
//  when THIS RUN held a recorder when the load began.  The first clause is what
//  stops a SECOND load of the same row from letting the run continue
//  (cfg/test/p441twice.cfg); the second is this arm.  It is `hadrec` and not
//  `wasrec` because `wasrec` is captured below the Patch 360 discard, which clears
//  TF_RECORDING, so it reads FALSE for any run that has posted a stage -- round 2
//  shipped that mistake and the next review round found it.
//
//  ARMS, in log order:
//   C1  leave the start box: `timer: running`, `recording 1`.
//   C2  THE PREMISE, and the reason this arm exists rather than a paragraph:
//       `rec_enable 0` while that run is recording, then `cmd timer` must STILL
//       read `recording 1`.  If it reads 0 the cvar stopped the live recorder and
//       there is nothing here to lose -- the finding would be theoretical and this
//       arm would be measuring p441norec's branch again.
//   S   SUBJECT: load row 1, whose serial is -1 (so the warm rewind cannot apply)
//       and whose run.rec does not exist.  The rewind fails inside the
//       !SV_RecEnabled() return above.
//
//  PRE-REGISTERED PREDICTIONS
//   C1  `timer: running`, `recording 1`.
//   C2  `timer: running`, `recording 1` -- after `rec_enable 0`.
//   S   CONTROL (FTESurf 20f25a1, Patch 441 as first committed): NO cancel line,
//       `timer: running`, `recording 0`, `recorder: buffer -1` -- the clock still
//       counting past the restored 0:05.000 with its recorder discarded.
//   S   FIXED: `run cancelled (the save's recording could not be restored)`,
//       `timer: idle`, the clock held at 0:05.000, `stopped 1`.
//  FALSIFIED IF C2 reads `recording 0` (see above -- the premise is gone and the
//   subject means nothing), or S reads `running` on the fixed build, or S reads
//   `idle` on the control build (then 441's first cut did not have this defect and
//   the review's finding does not reproduce).
//  NOTE THE CONTROL IS NOT HEAD~: a build from before Patch 441 voids here too,
//   because its gate was `st == TS_RUNNING` alone.  The control that isolates this
//   is 441 itself, so the worktree goes at 20f25a1.
//
//  RESULT (2026-09-26, both builds, driver exit 0 each way; qwprogs
//   B4D995701EAA1761 fixed / 3786B7D1D3341D4B control -- the control is Patch 441
//   AS FIRST COMMITTED (20f25a1), built in a worktree, which is the build whose
//   predicate this arm exists to falsify.  Logs kept as
//   ftesurf/logs/p441mid.log.fixed and .control.)
//   C1 `timer: running`, `recording 1`.
//   C2 THE PREMISE, after `rec_enable 0`: still `timer: running`, `recording 1`,
//      `recorder: buffer 17`.  The cvar does not stop a live recorder, so there is
//      something here to lose.  Both builds.
//   S  CONTROL: NO cancel line, `timer: running`, the clock past the restored
//      0:05.000 and counting (0:06.610 on disk), `recorder: buffer -1`,
//      `practice 1`, `class: segmented`.
//      A RUNNING attempt with its recorder discarded -- Patch 434's own defect,
//      through Patch 441's own gate.
//   S  FIXED: `run cancelled (the save's recording could not be restored)`,
//      `timer: idle`, clock held at 0:05.000, `stopped 1`, slot 901.
//   The discriminating fields are `cancel`, `state` and `clock`.  `recorder: buffer
//   -1` is NOT one of them -- it reads -1 on both builds, because the void discards
//   the recorder too -- and an audit of these arms caught this file presenting it as
//   the headline.
//   AND WHAT THE FIXED SIDE DOES NOT SHOW: `rec_enable 0` prints nothing, so no line
//   in the fixed log says SV_RecEnabled() was FALSE when the void fired.  C2's
//   `recording 1` is equally what an unlanded cvar would read.  The cvar landing is
//   proved by the CONTROL run -- which is the build that only asks SV_RecEnabled(),
//   and it did not cancel -- so this arm's conclusion is a cross-build inference and
//   not a single-run measurement.  Grading something SV_RecEnabled-derived on the
//   fixed side would close it; nothing the server prints today exposes it.
log_enable 1
log_dir logs
log_name p441mid
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
sv_port 27694
sv_cheats 0
set run_resume 0
vid_fullscreen 0
waitms 5000
map bhop_eazy
waitmap 2400
waitms 3000
menu_restart
ui_close
waitms 1200

echo ==== C0 the list ====
cmd sl_list
waitms 800

echo ==== C1 leave the start box: must read running / recording 1 ====
+forward
waitms 1500
-forward
waitms 700
cmd timer
waitms 800

echo ==== C2 rec_enable 0 UNDER the running recorder: must still read recording 1 ====
rec_enable 0
waitms 600
cmd timer
waitms 800

echo ==== S SUBJECT: load row 1 with the server's recorder switched off ====
// One gesture -- see p441void.cfg: `sl_goto` is itself the load.
cmd sl_goto 1
waitms 1600
echo ---- CONTROL: no cancel, running, buffer -1.  FIXED: cancelled, idle ----
cmd timer
waitms 800

quit
