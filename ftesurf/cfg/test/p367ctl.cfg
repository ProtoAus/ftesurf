// P367CTL -- control for p367verify.cfg: an engine before Patch 367 (here
// ftesurf64_p362.exe, which carries 364's refusal) on S1.  Predicted and seen:
// "VERIFY data/p367/b.rec REFUSE a newer format (this verifier reads FTESURF-REC 9)".
//   ftesurf64_p362.exe +exec cfg/test/p367ctl.cfg
log_enable 1
log_dir logs
log_name p367ctl
cl_idlefps 0
cl_maxfps 100
set rec_enable 0
waitms 5000
map surf_666
waitmap 1800
waitms 2000
echo ==== control: 364-era engine on S1
pm_verify data/p367/b.rec
waitms 500
quit
