// Patch 827: Line_End redoes only what new samples touch.
// tools/runlines_smoke.py ftesurf/cfg/test/p827lines.cfg --csqc <build>/csprogs.dat
// VOY: three opens of a 9,100-line replay, each one whole Line_End; `lines native` after
// each prints how long it took (whole ms), which prices the instruction counts.
// DUNE: a short run off the start, so the live line's Line_End runs every 16 samples;
// `lines native` must count those as "from where the last stopped".
cfg_save_auto 0
log_enable 1
log_dir logs
log_name runlines_smoke
con_notifytime 0
cl_idlefps 0
cl_maxfps 250
vid_fullscreen 0
vid_winmaximize 0
vid_width 1280
vid_height 720
sv_public 0
set run_resume 0
waitms 2000
map surf_voyager
waitmap 60
waitms 5000
menu_restart
ui_close
set hud_lines_demo 0
echo ==== P827 VOY ====
replay cfg/test/p492voy.rec
waitms 2500
replay status
lines native
replay cfg/test/p492voy.rec
waitms 2500
lines native
replay cfg/test/p492voy.rec
waitms 2500
lines native
replay stop
waitms 500
map surf_dune
waitmap 60
waitms 5000
menu_restart
ui_close
hud_trail 1
echo ==== P827 DUNE ====
lines native
cmd zone_goto 0
waitms 400
+forward
waitms 2800
-forward
waitms 800
trail
lines native
echo RUNLINES COMPLETE
quit
