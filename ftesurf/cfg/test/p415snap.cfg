// cfg_save_auto 0 FIRST: this run sets archived cvars and must never write them
// into ftesurf.cfg (cl_main.c:2535).
cfg_save_auto 0

// ===========================================================================
//  P415SNAP -- a save taken IN THE AIR must not give `!r` free height.
//    ftesurf64.exe -WindowStyle Minimized +exec cfg/test/p415snap.cfg
//    (cwd MUST be C:\FTESurf)
//
//  WHY A SECOND FILE.  p415reset.cfg proves `!r` lands on the save and that the
//  placement zeroes velocity.  It CANNOT prove the ground snap, because bhop_eazy
//  starts the clock ON JUMP -- so a mid-air save there has ticks > 0 and the
//  picker rejects it for the wrong reason.  surf_cement starts ON LEAVE and its
//  start box is 320 units tall (z 9216..9536), so a jump inside it stays at
//  ticks 0 and is exactly the case that matters.
//
//  THE HOLE THIS CLOSES.  Patch 415 takes only a save's ORIGIN, which kills the
//  stored-velocity prespeed its first cut had.  Height is the same exploit wearing
//  a different hat: park the player 200 units up with velocity zeroed and gravity
//  supplies the speed instead, repeatably, with the same invisibility -- seed
//  0 0 0, no lead-in, no warp record in the run's own file.  Build 47 deleted
//  SV_ZoneDest's unconditional +1 unit lift because "a start position that is not
//  the one you settle at is wrong twice over"; an unsnapped save point reopens
//  that at up to 250 units and lets the player pick the number.
//
//  So SV_SaveLocPickInZone ground-snaps the chosen point and hull-tests it, with
//  SV_ZoneDest's shape and a REFUSAL instead of its fall-back-to-itself: a mapper
//  put their destination somewhere the player fits, a save carries no such
//  warrant.
//
//  PRE-REGISTERED
//   G1  On the floor in the start box, clock 0:00.000, class clean.  Note the z.
//   G2  `+jump` and save WHILE RISING.  `cmd viewpos` must show a z materially
//       above G1's, and `cmd sl_list` must show that row with `--` for the time
//       (ticks 0).  If the row is timed, surf_cement does not start on leave after
//       all and G3 proves nothing -- say so, do not report it as a pass.
//   G3  `!m` back to the floor, then `!r`.  It must say "on your save", and the
//       landing z must be G1's FLOOR z, not G2's airborne z.
//  FALSIFIED IF G3 lands at G2's height (no snap), or does not say "on your save"
//  (the snap refused a point it should have taken -- check which, the refusal and
//  the snap are different branches).
//
//  RESULT 2026-09-20.  ALL THREE ARMS HOLD.
//
//    G1  `!m -- start of the map (stage1, -5888 12800 13312)`
//        setpos -5888.0 12800.0 13312.0, clock 0:00.000, class clean.
//        13312 IS THE FLOOR.
//    G2  `+jump`, saved 200 ms later at
//          setpos -5888.0 12800.0 13359.3
//        i.e. 47.3 units up, and the row reads
//          1 slot 001  -5888 12800 13359   0 u/s  yaw 0  standing  --  stage 1
//        `--` for the time, so ticks 0 and the picker will take it.  surf_cement
//        does start on leave, as required.
//    G3  `!m` back to 13312, then
//          !r -- start of the map (your save, -5888 12800 13312)
//          setpos -5888.0 12800.0 13312.0
//        THE FLOOR, not 13359.3.  class clean.  47 units of free height denied,
//        and the bracket names the save rather than the zone's destination.
//
//  THE 0 u/s IN G2's ROW IS NOT A CONTRADICTION: sl_list prints
//  `vlen([v_x, v_y, 0])`, the HORIZONTAL speed, and a straight-up jump has none.
//  The z is what says airborne.  Worth writing down because it reads at first
//  glance like the save was taken standing.
//
//  SCALE, from the shipped zone files (537 of them, 1771 START regions across
//  main and bonus tracks): median start-zone height 352 units, mean 416, max
//  2760 (surf_desolate bonus 3; surf_bossfight 2736, surf_legends 2687,
//  surf_eclipse 2000).  84% are at least 256 tall.  The clock starts when the
//  HULL leaves the box, so the off-clock drop available is the height plus 62.
//  From the authored `bottom + 2` that is 62 units -> 315 u/s; from the top of a
//  median zone, 414 units -> 814 u/s; from the top of surf_eclipse, 2062 units
//  -> 1816 u/s.  And SV_StartCapClamp cannot see any of it: its own essay says
//  "IT ONLY EVER TOUCHES THE CARRIER, never .velocity ... under your own power
//  you are not this rule's business, at any speed."  A fall is .velocity.  So
//  the 290 u/s cap on a pad-boosted start has no counterpart for a gravity-
//  boosted one, which is exactly why this has to be refused at the placement.
//
//  SV_ZoneDest's default arm already made this choice for the map's own
//  destination -- "feet a little above `bottom` rather than at the centre
//  height: a start zone is typically 256 units tall and dropping the player in
//  at 128 just means a fall" -- so an unsnapped save point would have handed the
//  player a lever the mapper is not given.
log_enable 1
log_dir logs
log_name p415snap
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
sv_port 27660
sv_cheats 0
set run_resume 0
set run_starthop 0
vid_fullscreen 0
waitms 5000
map surf_cement
waitmap 2400
waitms 3000
menu_restart
ui_close
waitms 1200

echo ==== G1 on the floor of the start box ====
zone_list
waitms 600
say !m
waitms 2200
echo ---- THIS z is the floor ----
cmd viewpos
cmd timer
waitms 800

echo ==== G2 jump, and save WHILE RISING ====
+jump
waitms 200
cmd viewpos
cmd sl_save
waitms 100
-jump
waitms 1400
echo ---- the saved row: z must be above G1 and the time must read -- ----
cmd sl_list
cmd timer
waitms 800

echo ==== G3 back to the floor, then !r ====
say !m
waitms 2200
cmd viewpos
waitms 400
say !r
waitms 2200
echo ---- this z must be G1's floor, NOT G2's height ----
cmd viewpos
cmd timer
waitms 1000

echo ==== END ====
waitms 800
quit
