// Patch 386 rig (d)(3): is the portable Linux x86_64 build bit-identical to Windows and the Pi?
// Main arms run p322det.cfg (unchanged) on bhop_eazy; this file is the sensitivity probe and
// the pre-registration for all of them.  Linux = Debian 13 rig, /home/surf/rig-post (386 build
// 23f1ce06b); Windows = fteqwsv64 3ee3baf4d in a scratch stage-0.1.10; Pi = live fteqw-svarm64.
//   L-sv  fteqw-sv64 -nohome +set sv_port 27690 ... +map bhop_eazy +exec cfg/test/p322det.cfg
//   L-cl  rig-run.sh <install> x11 p386det_lcl cfg/test/p322det.cfg   (listen server)
//   W-sv  fteqwsv64 -nohome, same +args, cwd = scratch stage
//   Pi    fteqw-svarm64 +set sv_port 27691 ... +exec cfg/p322det.cfg (copied in, then deleted)
// Probe arms: <sv> ... +map <m> +wait +wait +wait [+pm_trisoup_bevels 0] +exec cfg/test/p386det.cfg
//   A plain +command, not +set: +set runs before default.cfg, which sets the cvar to 1
//   (p358trace.cfg).  One Linux arm uses +set anyway (S0b) to measure that.
// PRE-REGISTERED 2026-09-19, before any arm ran:
//   P1 control: mapcrc 676de275 on every bhop_eazy arm.  If not, read nothing else.
//   P2 L-sv, L-cl, W-sv, Pi all print libm 5e749b8a83b44107, trace f7958b04dbcd1008,
//      mover 3d136f8de25c9c2c, tick 93e8615d81c26325 (Patch 325's Windows = Pi values),
//      tickcensus 90/135/60 ok.
//   S0 the bevels-0 arms print pm_trisoup_bevels "0" before pm_dettest, the others "1".
//      S0b (+set pm_trisoup_bevels 0) prints "1": default.cfg overwrote it.
//   S1 bhop_eazy, bevels 0 (L-sv, W-sv): the task predicts the trace hash changes.  By reading
//      it will NOT: bhop_eazy's LUMP_DISPINFO is empty, it has no solid props, and the bevels
//      apply only to box traces against triangles (com_bih.c:712, :935).  Unchanged = vacuous
//      control on this map, not a determinism failure.
//   S2 bhop_monster_jam (dispinfo 23056 bytes), L-sv and W-sv at bevels 1 and 0: trace(0) !=
//      trace(1) on each, and L-sv == W-sv at each value.  mapcrc and libm do not move with the
//      cvar.  Reference p358trace.cfg:22 (Windows, 2026-09-18): 507c8b94f2e56ef7 at 1,
//      2158fa44d1cf01a5 at 0.  Pi too if the map is on it.
// FALSIFIED IF: P2 differs on any arm while P1 holds, or S2 moves on one platform but not
// the other or to a different value.
// RESULT 2026-09-19 (logs/linux/p386det_*.log; the Windows ones copied there as p386det_wsv*):
//   P1, P2 HELD: L-sv, L-cl, W-sv and Pi print the same 17 pm_dettest lines (4 traces, 5 ticks,
//      census 90/135/60 ok, mapcrc 676de275, libm 5e749b8a83b44107, trace f7958b04dbcd1008,
//      mover 3d136f8de25c9c2c, tick 93e8615d81c26325) -- diffed line by line, 0 differences.
//   S0 held.  S0b FAILED: +set stuck on fteqw-sv64 (reads "0", trace 2158fa44d1cf01a5): the
//      dedicated server re-queues every +set after its config exec (sv_main.c:6700-6717,
//      COM_ParsePlusSets(true)).  p358's note is wrong for the dedicated server; client unmeasured.
//   S1: the task's prediction FAILED and the by-reading one held -- bevels 0 leaves bhop_eazy's
//      trace at f7958b04dbcd1008 on L-sv, W-sv and Pi.  Vacuous control on this map.
//   S2 HELD: bhop_monster_jam mapcrc 2f44cdf5, L-sv == W-sv: 507c8b94f2e56ef7 at 1,
//      2158fa44d1cf01a5 at 0 (= p358's values); mover 3f31fed0eb19b33e at both.
//   Pi on bhop_monster_jam: 6713a57c5f6aed98 at 1, 4ab28b25ee4e966c at 0 -- NOT Windows'.
//      Cause is content, not the architecture: game/hl2 on the Pi is empty, 33 "Unable to load
//      models" lines, .phy faces 2142 against Windows' 6048.  L-sv with hl2 removed from
//      fs_addons.txt prints 6713a57c5f6aed98 / 4ab28b25ee4e966c, the Pi's values bit for bit,
//      with the same 33 lines and 2142 faces (p386det_lsv_mj{1,0}nohl2).  bhop_monster_jam is in lobby4's
//      rotation, so there the Pi's static props are not solid and HL2 clients' are.
cfg_save_auto 0
log_enable 1
log_dir logs
developer 0
waitms 4000
echo ================================ P386 trace cvars
pm_trisoup_bevels
pm_rotatedboxhulls
pm_portalcsg_scanall
echo ================================ P386 probe
pm_dettest
waitms 2000
echo ================================ P386 done
waitms 500
quit
