// H12 -- what are the hl2_* and portal cvars ACTUALLY set to on this map?
//
// Asked directly, and it is overdue: every conclusion in this investigation has
// assumed defaults without reading them.  Two of these could explain the black
// portal on their own:
//
//   hl2_favour_ldr    surf_kitsune ships LIGHTING_HDR (lump 53, 133967 bytes) and
//                     NO LIGHTING (lump 8 absent).  A setting that prefers LDR has
//                     nothing to prefer.
//   r_portalmaxviews  Patch 206's cap.  A portal past the budget is refused, and
//                     GLBE_GenerateBatchTextures ignores GLR_DrawPortal's return
//                     value -- so a refusal leaves the FBO on its black clear
//                     (gl_backend.c:6160) and the quad paints that black.
//   r_refract_fbo     Patch 210's own comment says the read/write sides disagreed
//                     here and the symptom was a black doorway.
//
// Naming a cvar with no argument makes FTE print its value, so this is just a
// list.  cvarlist first for anything not thought of.

cfg_save_auto 0
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "h12"
cl_yieldcpu 0
con_notifytime 0

waitms 2500
map surf_kitsune
waitmap 240
waitms 8000
sv_cheats 1

echo "@@@ H12 ---- cvarlist hl2 ----"
cvarlist hl2
waitms 500
echo "@@@ H12 ---- cvarlist portal ----"
cvarlist portal
waitms 500
echo "@@@ H12 ---- named individually ----"
hl2_favour_ldr
hl2_translucent
hl2_water
hl2_refract
hl2_novis
hl2_areaportals
hl2_hidetools
hl2_cubemaps
hl2_envmap
hl2_bumpmap
hl2_animated
hl2_dither_alpha
hl2_displacement_scale
r_portalfbo
r_refract_fbo
r_portalrecursion
r_portalmaxviews
r_portalscissor
r_refractreflect_scale
r_novis
map_noareas
r_voidvis
r_blendsort
gl_overbright
r_lightmap
r_fullbright
vbsp_portal_render
vbsp_portal_dist
waitms 1000

echo "@@@ H12 DONE"
waitms 1000
quit
