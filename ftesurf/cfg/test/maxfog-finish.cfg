// Existing P856 walkable finish rig. Synthetic OFFLINE fixture, not rank/IJ proof.
// Predictions: auto-ticket is consumed; three full posts have smaxfog 1,0,0.
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
cl_netfps 100
vid_vsync 0
s_volume 0
rate 2000000
drate 5000000
log_enable 1
log_dir logs
log_name runlines_smoke
developer 0
set rec_terms 1
set rec_upload 0
set name FogFixture
set fs_eventfog_map surf_666
set fs_eventfog_serial 1
set fs_eventfog_until 999999
map surf_666
waitms 18000
menu_restart
waitms 300
menu_cmd ui_close
cmd maxfog status
fs_eventfog_map
fs_eventfog_until
waitms 1200
echo ==== MAXFOG WHOLE RUN ====
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 6000
-forward
waitms 3000
cmd timer
cmd maxfog status
waitms 2000
echo ==== MAXFOG DISABLED MIDRUN ====
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 1200
cmd maxfog 0
waitms 1000
cmd maxfog status
waitms 3800
-forward
waitms 3000
cmd timer
waitms 2000
echo ==== MAXFOG ENABLED LATE ====
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 1200
cmd maxfog 1
waitms 4800
-forward
waitms 3000
cmd timer
cmd maxfog status
waitms 2000
cmd maxfog 0
waitms 2000
cmd maxfog status
waitms 1000
fog
waterfog
skyroomfog
echo RUNLINES COMPLETE
quit
