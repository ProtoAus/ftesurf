// SEAM01 -- Patch 251 stage 3: $seamless_scale and $bumpmap2 on surf_demise.
//
// WHY THIS MAP.  A full-library scan (all 1310 maps, not the 200-map sample the
// implementation notes quote) puts surf_demise near the top of both lists: 13
// materials carrying $seamless_scale and 6 carrying $bumpmap2, and ALL SIX of the
// $bumpmap2 ones also carry $envmap, which is the condition for the second normal
// map to be visible at all in transition.glsl.  Between them those materials own
// 1221 and 1147 world faces -- essentially the whole of the map's terrain.  It is
// also the map the original report came from.
//
// AIMING.  Every one of those faces is a DISPLACEMENT, so trap 7 applies: a camera
// placed from the base quad's own vertices lands somewhere else entirely, because
// the displacement is deformed thousands of units off the brush face.  These
// positions come from the real displaced vertices, reconstructed the way
// mod_vbsp.c:2321-2338 does it, and each is 700 units back at 35 degrees above the
// horizontal looking at the centroid.  shader_here at each stop names what the
// crosshair actually found, so the aim is checked by the output and not trusted.
//
// BOTH CVARS ARE CVAR_SHADERSYSTEM, so they invalidate every shader and apply on
// the next frame.  That means one map load can carry the whole A/B and the "map x
// twice does not reload" trap is sidestepped -- but it also means the census line
// printed at LOAD reflects the cvar values as they were at load, which is why they
// are set before `map` and the second half toggles them live.
//
// WHAT TO EXPECT, stated before the run so a null result cannot be reinterpreted:
//   - the census line "N $seamless_scale material(s) at hl2_seamless 1, M $bumpmap2"
//   - hl2_seamless 0 -> 1 should change a LARGE fraction of any frame containing
//     terrain: the material stops using its UVs and projects from world position,
//     so the texture scale and orientation both change.  A few percent would mean
//     it is not reaching these surfaces.
//   - hl2_bumpmap2 0 -> 1 should change only where the cubemap reflection lands,
//     because transition.glsl consults the normal for nothing else. A SMALL diff
//     is the correct result here, and a zero diff is a failure.

log_enable 1
log_dir "logs"
log_name "seam01"
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 0
vid_fullscreen 0
developer 1
log_developer 1
con_notifytime 0
con_notifylines 0
con_notifytime_error 0

wait 200

hl2_seamless 1
hl2_bumpmap2 1
map surf_demise
waitmap 1800
waitms 12000
sv_cheats 1
waitms 400
noclip
waitms 400

echo ^5########## vantage A -- rock_cliff_to_rockjungle, the main terrain #####
setpos -1027.6 924.1 3380.6 35.00 45.00 0
waitms 2500
shader_here seamA
waitms 400
light_here seamA
waitms 400
developer 0
waitms 2000
screenshot seam01_a_both_on
waitms 900

echo ^5---------- hl2_seamless 0 ----------------------------------------------
hl2_seamless 0
waitms 4000
screenshot seam01_a_seam_off
waitms 900

echo ^5---------- hl2_seamless 1, hl2_bumpmap2 0 ------------------------------
hl2_seamless 1
waitms 3000
hl2_bumpmap2 0
waitms 4000
screenshot seam01_a_bump_off
waitms 900

echo ^5---------- both back on (proves the toggles changed state) -------------
hl2_bumpmap2 1
waitms 4000
screenshot seam01_a_both_on2
waitms 900

echo ^5########## vantage B -- rock_cliff_to_moss2 ############################
developer 1
setpos 9235.6 -4034.9 13436.4 35.00 45.00 0
waitms 2500
shader_here seamB
waitms 400
developer 0
waitms 2000
screenshot seam01_b_both_on
waitms 900
hl2_seamless 0
waitms 4000
screenshot seam01_b_seam_off
waitms 900
hl2_seamless 1
waitms 3000
hl2_bumpmap2 0
waitms 4000
screenshot seam01_b_bump_off
waitms 900
hl2_bumpmap2 1
waitms 3000

echo ^5########## vantage C -- moss1_to_moss2 #################################
developer 1
setpos 938.8 -1264.1 13407.1 35.00 45.00 0
waitms 2500
shader_here seamC
waitms 400
developer 0
waitms 2000
screenshot seam01_c_both_on
waitms 900
hl2_seamless 0
waitms 4000
screenshot seam01_c_seam_off
waitms 900
hl2_seamless 1
waitms 3000

echo ^5########## the key census: these should no longer be reported ##########
developer 1
hl2_vmtkeys 1
vmt_keys
waitms 1000

echo ^5=== seam01 done ===
wait 30
quit
