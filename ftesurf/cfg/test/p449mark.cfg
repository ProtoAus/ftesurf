// P449MARK -- Patch 449: the run line's marks are the edges of Board_KindOf, the
// same three-state contact function the Segments column runs on.  This arm dumps
// the mark table the draw pass reads (`replay marks`) for seven fixtures; the
// grading is tools/p449mark.py, which parses the same .rec files itself.
//
// A replay opened for a map other than the loaded one stops itself within a
// frame, so status and marks run in the SAME batch as the open, never after a
// wait.  (Six of seven fixtures printed nothing the first time this was run.)
//
// PRE-REGISTERED
//  B1 every mark p449mark.py derives from the file is in the table, with the same
//     kind, sub, t (1e-4), speed (0.01) and vz (0.01), and none extra.
//  B2 containment: every `seq` row boundary has a mark at the same tick.  The
//     reverse count -- marks with no row, i.e. contacts under SEG_MINTIME -- is
//     registered per fixture, not asserted to be zero.
//  B3 gigapede bonus_4 shadow: 7 stitch marks, one per `resume` record, and the
//     file's 7 tele breaks sit on the same samples.
//  B5 bhop_monster_jam save010: 127437 samples, so the point array halves once
//     (ln_step 2) and half the samples never reach it.  Every mark is still
//     derived and still matches the file -- marks are indexed by their own
//     position, not by a point, and are classified above the decimation return.
//  B4 bhop_monster_jam cheat: the cap fires.  `marks 4096, peaks cut` and the
//     structural marks (land/leave/jump/stitch) still match the file exactly.
log_enable 1
log_dir "logs"
log_name p449mark
set hud_lines_edge 0            // Patch 628: this arm grades the last-contact stamp (tools/p449mark.py)
developer 0
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0
set run_resume 0
sv_public 0
sv_port 27711
set lobby_dir ""
set hud_watch_skipidle 0
set hud_watch_path 1

wait 200
map surf_rookie
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 1000

echo ^5=== p449mark FIXTURE data/online/surf_rookie/main/08m26.580s_proto_r47.rec ===
replay data/online/surf_rookie/main/08m26.580s_proto_r47.rec
waitms 2000
replay status
replay marks 0
replay seq
waitms 300

echo ^5=== p449mark FIXTURE data/online/surf_aesthetic/main/01m01.515s_player_r3.rec ===
replay data/online/surf_aesthetic/main/01m01.515s_player_r3.rec
replay status
replay marks 0
replay seq
waitms 300

echo ^5=== p449mark FIXTURE data/runs/surf_aesthetic/main/0005191_pb.rec ===
replay data/runs/surf_aesthetic/main/0005191_pb.rec
replay status
replay marks 0
replay seq
waitms 300

echo ^5=== p449mark FIXTURE data/runs/surf_beginner/main/0003828_pb.rec ===
replay data/runs/surf_beginner/main/0003828_pb.rec
replay status
replay marks 0
replay seq
waitms 300

echo ^5=== p449mark FIXTURE data/runs/surf_4am/main/cheat.rec ===
replay data/runs/surf_4am/main/cheat.rec
replay status
replay marks 0
replay seq
waitms 300

echo ^5=== p449mark FIXTURE data/runs/surf_gigapede/bonus_4/0001250_shadow.rec ===
replay data/runs/surf_gigapede/bonus_4/0001250_shadow.rec
replay status
replay marks 0
replay seq
waitms 300

echo ^5=== p449mark FIXTURE data/runs/bhop_monster_jam/main/cheat.rec ===
replay data/runs/bhop_monster_jam/main/cheat.rec
replay status
replay marks 0
replay seq
waitms 300

echo ^5=== p449mark FIXTURE data/saves/bhop_monster_jam/save010/run.rec ===
replay data/saves/bhop_monster_jam/save010/run.rec
replay status
replay marks 0
replay seq
waitms 300

replay stop
waitms 300
quit
