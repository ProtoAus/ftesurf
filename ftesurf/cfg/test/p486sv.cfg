// p486sv.cfg -- the dedicated server half of the Patch 486 consumer arm.
//
// Started from C:\FTESurf as its cwd (the basedir IS the cwd, and a shell left in
// ftesurf/ produces no log at all):
//
//   Start-Process C:\FTESurf\fteqwsv64.exe -WorkingDirectory C:\FTESurf \
//     -ArgumentList '+set','sv_port','27601','+exec','cfg/test/p486sv.cfg'
//
// THE BINARY IS PRE-484 ON PURPOSE and that is a property of this arm, not a
// shortcut. fteqwsv64.exe here is Sep 28, so it has no in_jrn484_* cvars and no
// IN_Journal_CheckIdentity. It does not need them: the identity is computed in
// the CLIENT's engine, and what the server contributes is the CSEv_injrn_ffffff
// handler in qwprogs.dat plus the `cmd timer` print in the same file. Both are
// QC, deployed to ftesurf/ by build.ps1, and both VMs are shared with the client
// on a loopback join. So a server binary that predates the engine half still
// exercises the whole consumer.
//
// sv_public 0 or it heartbeats to public masters.
cfg_save_auto 0
sv_public 0
log_enable 1
log_dir logs
log_name p486sv
developer 1
log_developer 1

map surf_rookie
