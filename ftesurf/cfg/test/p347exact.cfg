cfg_save_auto 0
// PATCH 347 + QC BUILD 87 -- does a v9 recording replay EXACTLY?
//
// Run twice, same cfg, log name from the command line:
//   before  ftesurf64_p344.exe  +set log_name p347pre  +exec p347exact
//   after   ftesurf64.exe       +set log_name p347post +exec p347exact
//
// THE CLAIM UNDER TEST.  Same-binary replay of the mover is bit-exact (client
// prediction depends on it), so if FTESURF-REC 9 carries every input the mover
// took -- the pin, the exact seed with pm_source's carried state, %.9g warps
// and rides bound by <row>, the usercmd's own angles, the ground flag the
// engine read -- then an open-loop replay must reproduce EVERY sample's %.2f
// text, to the end of the file.  b83 (v7, same scripted route) died at row 817.
//
// SUBJECTS (captured by b87warp.cfg / b87ride.cfg on this build's QC):
//   S1  data/b87warp.part  bhop_eazy, 1683 rows, 7 `warp tele`, 56 `pe`
//   S2  data/b87ride.part  surf_ecosystem, 155 rows, 1 `pe`
// NEGATIVE CONTROLS, derived from S1 by one edit each (the replay must SEE it):
//   N1  p347_warp001.part  first warp origin x moved 0.01 u
//   N2  p347_pin999.part   pmpin airaccelerate 1000 -> 999
//   N3  p347_pe.part       the 4th `pe` digest xor 1 (row 197)
//   N4  p347_grav799.part  pmpin gravity 800 -> 799 (added after the first run --
//       see RESULT: N2 turned out to be physically inert)
//   X1  p347_warpulp.part  first warp velocity x moved ONE ulp -- exploratory:
//       %.2f samples may be too coarse to see it before the next teleport
//       re-imposes velocity.  Recorded either way.
// v6-v8 CONTROLS: b85ride, e5trace, b83trace, e3trace, surf_trance and
//   surf_kitsune PBs must print arm 1-3 lines identical to p345post.log -- the
//   exact path is taken only when the file carries `seed` and a full pin.
//
// PRE-REGISTERED
//   1  S1, S2 print "EXACT REPLAY"; ARM 1 all exact; ARM 4 "N of N packets
//      reproduce the file's own %.2f text"; physents all match; portals 0/0.
//   2  N1 and N2: ARM 4 reports >= 1 mismatch, first at or after the edited
//      point (N1: the packet after row 226; N2: early -- a bhop run strafes).
//   3  N3: physents report exactly 1+ mismatching rows starting at row 197,
//      and ARM 4 stays exact (the digest is checked, never applied).
//   4  Controls identical to p345post on every ARM/DIVERGED/seed/warp line.
//   5  BEFORE (p344 exe): S1/S2 read as v9 by a v8 reader -- no EXACT line;
//      recorded, not predicted in detail.
//
// FALSIFIED IF: S1 or S2 has any ARM 4 mismatch (the format is still short of
//      state, or the replay is not the server's move); N1 or N2 stays exact
//      (the check is blind); N3 moves ARM 4; any control moves.
log_enable 1
log_dir logs
developer 0
set rec_enable 0
set rec_stream 0
cl_idlefps 0
cl_maxfps 100

waitms 6000
map bhop_eazy
waitmap 45
waitms 4000
echo ================================ P347 S1 b87warp.part
pm_recsim data/b87warp.part
waitms 2000
echo ================================ P347 N1 p347_warp001.part (must mismatch)
pm_recsim data/p347_warp001.part
waitms 2000
echo ================================ P347 N2 p347_pin999.part (must mismatch)
pm_recsim data/p347_pin999.part
waitms 2000
echo ================================ P347 N4 p347_grav799.part (must mismatch)
pm_recsim data/p347_grav799.part
waitms 2000
echo ================================ P347 N3 p347_pe.part (physents must flag row 197)
pm_recsim data/p347_pe.part
waitms 2000
echo ================================ P347 X1 p347_warpulp.part (exploratory)
pm_recsim data/p347_warpulp.part
waitms 2000
echo ================================ P347 C4 b83trace.part
pm_recsim data/b83trace.part
waitms 2000
echo ================================ P347 C5 e3trace.rec
pm_recsim data/e3trace.rec
waitms 2000

map surf_ecosystem
waitmap 60
waitms 4000
echo ================================ P347 S2 b87ride.part
pm_recsim data/b87ride.part
waitms 2000
echo ================================ P347 C0 b85ride.part
pm_recsim data/b85ride.part
waitms 2000
echo ================================ P347 C1 e5trace.part
pm_recsim data/e5trace.part
waitms 2000

map surf_trance
waitmap 60
waitms 4000
echo ================================ P347 C2 surf_trance v7
pm_recsim data/runs/surf_trance/main/0010929_pb.rec
waitms 4000

map surf_kitsune
waitmap 60
waitms 4000
echo ================================ P347 C3 surf_kitsune v7
pm_recsim data/runs/surf_kitsune/main/0009998_pb.rec
waitms 4000

echo ================================ P347 done
waitms 1000
quit
