// Patch 420 -- THE ANGLE CROSS-CHECK against a real v9 pair, over a real
// connection.  Needs p418sv.cfg's dedicated server already up on 27696:
//
//   C:\FTEQuake\fteqwsv64.exe +set sv_port 27696 +set sv_public 0
//     +set log_enable 1 +set log_dir logs +set log_name p420sv
//     +map bhop_eazy +exec cfg/test/p418sv.cfg
//   ./ftesurf64.exe -WindowStyle Minimized +exec cfg/test/p420live.cfg
//
// WHY THIS ARM EXISTS.  reccheck's angle join was measured over 339 .rec/.view
// pairs, and EVERY v9 PAIR AMONG THEM HAS A NAILED-DOWN CAMERA -- the whole
// 416/417/418 family drives the route with setpos and noclip and never turns.
// So the join's honest residual was measured on v6-v8 files, where the .rec
// column is .v_angle, and NEVER ONCE on v9's input_angles, which is a different
// quantity read out of a different place.  A threshold carried across that gap
// on the assumption they behave alike is a threshold nobody measured.
//
// The route is p418cl.cfg's, with one insert: the camera sweeps for nine
// seconds INSIDE the run, then setpos restores the exact position and heading
// so the flight to the end zone is unchanged.  +left/+right are the point --
// they have no usercmd button bit and feed CL_AdjustAngles directly, so the
// server sees only the resulting angles, which is exactly the path under test.
//
// PRE-REGISTERED PREDICTIONS
//  A1  the run's .rec is v9 and its `in` rows carry a swept yaw -- several
//      hundred degrees of travel, not the 0 every earlier fixture recorded.
//  A2  reccheck reports the pair `ok` with `angle_off` UNDER 5% past 3x, and
//      NOT `BLIND`.  Both halves matter: a pass that says BLIND is the arm
//      failing to arm itself.
//  A3  the v9 residual distribution is no worse than the v6-v8 one measured on
//      the corpus (p99 of the normalised statistic at or under 0.21).
//  A4  rcptcheck on the run's receipt reports the signature VALID, the .view
//      matching the signed digest, AND the sidecar's angles being the
//      recording's angles -- the three questions in one command.
//  CONTROL: the same pair with the sidecar rotated 5 degrees must FAIL, or
//      "it passed" means nothing.  Run by tools/reccheck.py --tamper-view.
// FALSIFIED IF the camera does not sweep, if the honest pair lands over the
//   threshold, or if --tamper-view cannot make it fail.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p420live
developer 1
cl_idlefps 0
cl_maxfps 100
cl_yawspeed 140
cl_pitchspeed 150
set rec_enable 1
set rec_hid 1
set rec_upload 1
name "^3P420"

waitms 6000
connect 127.0.0.1:27696
waitms 12000

echo ================================ P420 CL -- aim and start
cmd zone_goto 0
waitms 1500
setpos -352 -352 144 0 335.3 0
waitms 1500
+jump
waitms 700
-jump
waitms 2000
cmd timer

echo ================================ P420 CL -- sweep the camera inside the run
+left
waitms 1500
-left
+right
waitms 3000
-right
+left
waitms 1500
-left
+lookup
waitms 800
-lookup
+lookdown
waitms 1600
-lookdown
+lookup
waitms 800
-lookup
waitms 500

echo ================================ P420 CL -- restore the route's heading
setpos -352 -352 144 0 335.3 0
waitms 1500

echo ================================ P420 CL -- fly to the end zone
noclip
waitms 500
+forward
waitms 1500
waitms 2900
waitms 2000
-forward
waitms 1500
cmd timer
waitms 3000

echo ================================ P420 CL done
waitms 1000
quit

