// engine a72183e6b / patch 419, qcbuild 88):
//   ALL FOUR HELD, and A3 held by a wider margin than it claimed.
//   A1  data/runs/bhop_eazy/main/cheat.rec, v9, 1740 `in` rows over 1753 ticks,
//       1257 DEGREES OF CAMERA TRAVEL.  Every other v9 pair in this tree
//       records 0.
//   A2  1736 of 1740 moves found a frame at their tick (4 did not -- the
//       sidecar is per rendered frame and the client was at 99.06/s against a
//       100 Hz mover).  `0.00% of joined moves past 3x the tick's sweep,
//       longest run 0`.  Not BLIND.
//   A3  PREDICTED p99 of the normalised statistic at or under 0.21, the
//       corpus's v6-v8 figure.  MEASURED: the raw residual is p50 0.003,
//       p99 0.007, MAX 0.007 degrees -- the print rounding (%.2f) plus the
//       16-bit wire quantum and nothing else, across 1257 degrees of sweep.
//       The normalised worst is 0.0x.  v9's `in` angles are input_angles,
//       i.e. SHORT2ANGLE of the very short the client sent, so they do not
//       merely track the rendered angle -- they ARE it.  v6-v8's .v_angle
//       reached 2.52 degrees on surf_kitsune.  The thresholds carried over
//       from that corpus are, for a v9 file, about 400x looser than they need
//       to be; tightening them wants a v9 corpus with more than this one run
//       in it, which is the P419 lesson about setting a number from n=1.
//   A4  rcptcheck on 20260921-153755-0.rcpt, one command, all three questions:
//       `signature VALID`, `.view matches the committed digest (55589 bytes)`,
//       `the sidecar's angles are the recording's angles`.
//   CONTROL (reccheck --tamper-view on the same pair): a whole-run rotation is
//       missed at 0.5, 1 and 2 degrees and CAUGHT from 3 up; a spliced block is
//       caught at 10% of the run and missed at 5%, which is the fraction rule's
//       boundary on a run this short (250 consecutive moves is 14% of 1740 and
//       2.5% of surf_kitsune).  The pair is only "ok" because a rotation of 3
//       degrees would have made it fail.
//
//   AND ONE THING THIS ARM FOUND WITHOUT LOOKING FOR IT.  The run wrote
//   data/runs/bhop_eazy/main/cheat.rec at 15:38 and cheat.view beside it is
//   still the one from 05:17 -- because Patch 418 STAGES the sidecar under the
//   nonce and uploads it to data/evidence/ instead of writing it beside the
//   recording.  So a `cheat.rec`/`cheat.view` pair in data/runs is now a
//   recording next to an OLDER run's sidecar, and the angle check does not
//   catch it: both runs have a nailed-down camera, so the pair reads BLIND.
//   Joining by NAME is what makes that possible; rcptcheck joins by RUNID and
//   got the right file.
//   CHECKED ON THE FLEET BEFORE CLAIMING IT MATTERS THERE, and it does not:
//   `find data/runs -name '*.view'` on the Pi returns 0.  A lobby's clients are
//   all remote, so every sidecar goes to data/evidence under its nonce and no
//   .view is ever written into data/runs at all.  This is a DEVELOPMENT BOX
//   shape -- one tree that has been played both locally (listen server, sidecar
//   beside the .rec) and remotely.  Left as it is; a checker that joins by name
//   on this box should know it.
