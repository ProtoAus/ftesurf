// FTESurf Patch 182 non-regression check for the steam: resolver.
//
// This machine has ONE Steam library, so the multi-library case P182 exists to
// fix cannot be reached here -- that is covered by the standalone parser tests.
// What this checks is that hoisting the parser out of the unix-only branch did
// not break the path everyone actually takes:
//   * boot resolves the steam: lines in fs_addons.txt (CS:S, HL2)
//   * FS_Addon_MountHD's per-line "<spec>_hd" probe still fails QUIETLY -- that
//     is the resolve-FAILURE path, and it now runs the new vdf parse twice per
//     absent pack, so a crash or a leak there would show up at boot
//   * fs_automount still resolves and mounts CS:GO for a map that needs it
//
// Deliberately no `fs_load`: it PERSISTS by appending to fs_addons.txt, and a
// test must not rewrite the user's mount list.
fs_loadstats 1
developer 0
waitms 4000
echo "=== P182 steam: resolver non-regression ==="
echo "--- mounted after boot ---"
fs_loadlist
waitms 500
echo "--- automount: surf_tensor2 needs CS:GO ---"
map surf_tensor2
waitms 30000
echo "--- mounted after the map ---"
fs_loadlist
waitms 500
echo "=== P182 DONE ==="
waitms 1000
quit
