// FTESurf Patch 197 -- the P186 asset-cache rework, end to end.
//
// What has to be shown, in order, in one session:
//   0. fs_cache_clear works with NO cache searchpath mounted (P197 removed the global mount,
//      so both commands now open a throwaway handle over the directory instead). It also
//      wipes P186's old flat tree, so nothing below can be a leftover.
//   1. Visit 1 mounts TF2, harvests, and says it needs one more visit.
//   2. Visit 2 mounts TF2 again and PROVES the map -- by comparing name sets, not by the
//      cache outranking the pack, because on this visit there is no cache mounted at all.
//      It must copy ZERO files: everything it sees is already known.
//   3. Visit 3 must mount the cache directory INSTEAD of TF2. The tells are the searchpath
//      count in the fs_loadstats line (13-ish, not 17), the absence of the
//      "fs_automount: ... needs" line, and the sky report -- sky_dustbowl_01 exists nowhere
//      but TF2 and the cache, so six resolved faces with TF2 unmounted is the whole feature
//      working.
//   4. flocate says which searchpath actually served each file, which is the only direct
//      evidence about ORDER, and order is the thing P186 got wrong.
//   5. surf_monotony needs BOTH TF2 and CS:GO, so it must produce TWO cache directories --
//      the namespacing that P186's one flat tree could not do.
//   6. Exit clean (Patch 196; this run is also a regression test for that).
//
// cfg_save_auto 0 first: fs_assetcache is CVAR_ARCHIVE and a P186 test run once archived
// "1" into ftesurf.cfg, which silently invalidated a whole control arm.

cfg_save_auto 0
log_name p197
developer 0
fs_loadstats 1
fs_automount 1
fs_autounmount 1
scr_sshot_type png
waitms 4000

echo "=== P197 0. purge, with no cache searchpath in existence ==="
fs_cache_info
fs_cache_clear
fs_cache_info
fs_assetcache 1
waitms 1000

echo "=== P197 1. surf_utopia visit 1 -- mounts TF2, harvests, unproven ==="
map surf_utopia
waitmap 240
waitms 14000
fs_cache_info

echo "=== P197 2a. bhop_aberrant, drops TF2 ==="
map bhop_aberrant
waitmap 240
waitms 8000

echo "=== P197 2b. surf_utopia visit 2 -- mounts TF2, must prove, must copy 0 ==="
map surf_utopia
waitmap 240
waitms 14000

echo "=== P197 3a. bhop_aberrant again ==="
map bhop_aberrant
waitmap 240
waitms 8000

echo "=== P197 3b. surf_utopia visit 3 -- must mount the CACHE, not TF2 ==="
map surf_utopia
waitmap 240
waitms 14000
fs_cache_info
echo "--- 4. where do the cached files actually come from? ---"
flocate materials/concrete/computerwall001.vmt
flocate materials/skybox/sky_dustbowl_01_hdrside.vtf
echo "--- and a mod file must still come from the mod ---"
flocate default.cfg
screenshot_mega p197_cached 1280 720

echo "=== P197 5. surf_monotony -- two packs, so two cache directories ==="
map surf_monotony
waitmap 300
waitms 25000
fs_cache_info

echo "=== P197 DONE ==="
waitms 2000
quit
