// P376SV -- server half of p376cl.cfg (p375sv.cfg's setup: lobby cfg, zones, stub).
// rt1sv.cfg's setup: lobby cfg, zones cfg/test/p360sf.zones.json as
// maps/zones/local/surf_666.json (DELETE AFTER), stub `b65stub.py cert 8131`,
// whose POST lines are the record.  Back up and clear data/runs/surf_666 and
// data/saves/surf_666 first; the saves are read after the run.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p376sv
developer 1
exec cfg/lobby/lobby.cfg
sv_cheats 0
set lobby_master "http://127.0.0.1:8131"
sv_guidkey "ftesurf-rt1-probe"
sv_maxrate         0
sv_maxdownloadrate 0
set lobby_master_key  "stub-key-not-a-real-one"
set lobby_master_rate 30
set run_resume 0
map surf_666
waitms 70000
quit
// RESULT: see p375cl.cfg.
