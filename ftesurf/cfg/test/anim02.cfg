log_enable 1
log_dir "logs"
log_name "anim02"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
// ANIM02 -- does vmt/animated actually CYCLE, or just pick a different still?
//
// anim01 proved the ROUTING (vmt/transition -> vmt/animated, diffusemap ->
// $2darray) and showed 86% of pixels change when the cvar flips.  Neither of
// those proves the flipbook advances: picking frame 7 instead of frame 0 once
// would look identical to both tests.  Two shots 700ms apart in anim01 differed
// by 0.04%, which is the reading that prompted this.
//
// Six shots ~250ms apart at 24fps should each be ~6 frames further on.  If the
// consecutive diffs are ~0, e_time is not reaching the shader and the default
// must NOT be flipped.
wait 200
map surf_demise
waitmap 1800
waitms 9000
sv_cheats 1
cl_maxfps 0
con_notifylines 0
hl2_animated 1
waitms 4000
setpos -2944 7552 4865 90 0 0
waitms 2000
screenshot anim02_t0
waitms 250
screenshot anim02_t1
waitms 250
screenshot anim02_t2
waitms 250
screenshot anim02_t3
waitms 250
screenshot anim02_t4
waitms 250
screenshot anim02_t5
waitms 600
echo ^5=== anim02 done ===
wait 30
quit
