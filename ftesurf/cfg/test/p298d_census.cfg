cfg_save_auto 0
// Patch 298d -- PER-PROP FACTS.  Text only, no screenshots, no hypothesis.
//
// WHERE THE INVESTIGATION ACTUALLY IS.  At Lex's save011 window vantage:
//   - the town is 13 static props (prop_census: "13 drawn", 217 PVS culled).
//   - hl2_propdist 1 removes ALL of them, black and fogged alike (p298c C2/C4,
//     verified on the image, not just the file size).
//   - skyroom fog saturates and paints MOST of them magenta, but a specific
//     subset -- the church-and-town cluster and the far-left block -- stays pure
//     BLACK through every fog arm, main-view fog included (p298 A7).  So those
//     props receive NO fog in any configuration.
//   - the fog handoff is clean: nothing overwrites r_refdef.globalfog between
//     R_DrawSkyroom's CL_BlendFog (gl_warp.c:394) and the draw, and the uniform
//     reads r_refdef.globalfog directly (gl_backend.c:4256).  So the only way a
//     surface can ignore it is that its program has no fog code compiled in.
//
// AND HERE IS WHY I AM NOT GUESSING AGAIN.  The obvious cause was $nofog ->
// #NOFOG (mat_vmt.c:1951/2347).  I pulled all eight skybox-building VMTs out of
// hl2_misc_dir.vpk: NOT ONE of them sets $nofog.  Worse for every material-level
// theory, hill_cluster.vmt (the BLACK church cluster) and gov_upscale.vmt (a
// FOGGED one) are the same material to the letter -- both plain VertexLitGeneric
// with $color, $baseTexture, $selfIllum 0, $translucent 0, $alpha 1, both
// stamped "generated by MAYA ... -- theo".  Two identical materials, opposite
// behaviour.  So the difference is NOT in the VMT, and I have now killed three
// hypotheses in a row by assuming it was somewhere and checking.
//
// The models in the skyroom, from the map's own model list:
//   row_hill_cluster        -> hill_cluster.vmt        BLACK
//   row_upscale             -> gov_upscale.vmt         fogged
//   row_industrial_cluster  -> industrial.vmt          ($alphatest 1)
//   long_building001a       -> long_building001a.vmt   ($envmap env_cubemap)
//   project_building02/03   -> project_building0N.vmt  ($envmap env_cubemap)
//   buildingskybox_002a     -> buildingsheet_03a.vmt   ($envmap env_cubemap)
//
// WHAT THIS RUN DOES: asks the engine what it actually did with each of them,
// one model at a time, and lets the difference name itself.  prop_census <part
// of a model name> reports the per-prop record -- origin, lighting source and
// level, fade, skin, verdict.  Whatever separates row_hill_cluster from
// row_upscale is the fault, and if nothing does, the fault is not per-prop and I
// need to be looking at the batch/permutation instead.
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000
wait 200

developer 1
log_developer 1
log_enable 1
log_dir logs
log_name p298d_census
cl_maxfps 0
cl_idlefps 0
sv_cheats 1
con_notifylines 0
con_notifytime 0.01
r_drawviewmodel 0

map surf_tensor2
waitmap 600
waitms 9000
waitms 3000
noclip
waitms 1000

setpos -7563.2915 10425.6309 -974.1351 1.9775 -0.39 0
waitms 2500

echo ^5=== WHOLE-MAP CENSUS AT THE WINDOW ===
prop_census
waitms 500

echo ^5=== THE BLACK ONE ===
prop_census row_hill_cluster
waitms 500

echo ^5=== A FOGGED ONE WITH THE IDENTICAL MATERIAL ===
prop_census row_upscale
waitms 500

echo ^5=== THE REST OF THE SKYROOM TOWN ===
prop_census row_industrial_cluster
waitms 500
prop_census long_building001a
waitms 500
prop_census project_building02_skybox
waitms 500
prop_census project_building03_skybox
waitms 500
prop_census buildingskybox_002a
waitms 500

echo ^5=== END OF RUN ===
waitms 500
quit
