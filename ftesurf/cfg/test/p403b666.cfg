// P403B666 -- Patch 403 on a REAL rotation map whose start zone contains real
// boosters.  surf_666's bonus-3 start is a 2048x2048 square at z -13952 holding
// FOUR trigger_push at 3000 u/s, all horizontal (+y, -y, +x, -x), and its END
// sits 4000 units ABOVE the middle of it.  Momentum's own zone data marks the
// segment limitStartGroundSpeed: true, so Momentum clamps ground speed there.
// The question this arm asks is the one a player would: with run_startcap live,
// can the bonus still be started and played at all?
//
// Shipped zones, NOT a fixture: maps/zones/local must be empty.
//
// PRE-REGISTERED
//  B1 `!b 3` arms bonus 3 and the body rests inside the start square.
//  B2 with the cap LIVE the body still leaves the box and the timer runs --
//     i.e. the track is startable.
//  B3 the speeds either side of the cap differ: with run_startcap 0 the body
//     leaves far faster than with 290.
// FALSIFIED IF B2 fails -- if the cap makes a shipped bonus track unstartable
// that is a release blocker, not a tuning question.
//
// RESULT (2026-09-20).  B1 held; B2 held in the sense that matters (no
// regression); B3 NOT EXERCISED, and that is the finding.
//   With run_startcap 290 and with run_startcap 0 the runs are IDENTICAL: `!b 3`
//   puts the body at 9440 10096 -13952, `timer: armed ... start on leave`, and
//   it rests there for the whole 9 s of the arm in both.  The restart
//   destination does not sit inside any of the four push volumes, so nothing
//   arms a carrier and the clamp has nothing to do.
//   So the cap does not change what a player meets when they restart surf_666's
//   bonus 3 -- which was the release-blocker question.  It does NOT prove the
//   four 3000 u/s pushes are harmless: reaching them needs a player walking, and
//   this harness sends no movement.  A live playtest of that bonus is still
//   worth doing before the rule goes to all 12 lobbies.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p403b666
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
sv_cheats 0
fs_missingwarn 0
set run_resume 0
sv_port 27682

wait 200
map surf_666
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 1000
zone_list

echo ^5=== B: bonus 3 ===
say !b 3
waitms 600
cmd viewpos
cmd timer
waitms 600
cmd viewpos
cmd timer
waitms 900
cmd viewpos
cmd timer
waitms 1500
cmd viewpos
cmd timer
waitms 2500
cmd viewpos
cmd timer
waitms 3000
cmd viewpos
cmd timer

echo ^5=== P403B666 DONE ===
waitms 500
quit
