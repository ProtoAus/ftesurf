// Patch 746: a whole run's PB as the ghost of a stage, cut where it left that stage's box.
// Private overlay, listen server:
//   python tools/runlines_smoke.py ftesurf/cfg/test/raceghost_stage.cfg
//       --put data/runs/surf_kitsune/main/0009998_pb.rec=<a surf_kitsune PB .rec>
//   python tools/test_raceghost.py <live rig>/ftesurf --pb <that .rec> --stage <this rig>/ftesurf
// Stage runs of stages 2 and 7 (`!s`), on your run's clock and then each stage; stage 7's
// PB failed once and went back into its box, so the start that counts is its second
// (the file's `stagestart 6` records: 1965, then 2468).
// Kitsune's stage boxes are its start box 2048 u along x: raceghost_live.cfg's way out.
cfg_save_auto 0
name RaceGhostStage
log_enable 1
log_dir logs
log_name runlines_smoke
cl_idlefps 0
cl_maxfps 100
con_notifytime 0
waitms 2000
map surf_kitsune
waitmap 60
waitms 5000
menu_restart
ui_close
hud_ghost 1
hud_ghost_sync 0
hud_ghost_pb 1
hud_ghost_offset 0
say !s 2
waitms 1000
+moveright
waitms 800
-moveright
waitms 300
+forward
waitms 1750
echo ==== S2RUN ====
raceghost
cmd timer
-forward
waitms 300
hud_ghost_sync 1
hud_ghost_offset 1
say !s 2
waitms 1000
+moveright
waitms 800
-moveright
waitms 300
+forward
waitms 1750
echo ==== S2STAGE ====
raceghost
-forward
waitms 300
hud_ghost_sync 0
hud_ghost_offset 0
say !s 7
waitms 1000
+moveright
waitms 800
-moveright
waitms 300
+forward
waitms 1750
echo ==== S7RUN ====
raceghost
cmd timer
-forward
waitms 300
// A ticked board line as the ghost: the same file, so with the PB on it is one ghost.
hud_ghost_pb 0
scores lineat 1 data/runs/surf_kitsune/main/0009998_pb.rec
waitms 4000
say !s 2
waitms 1000
+moveright
waitms 800
-moveright
waitms 300
+forward
waitms 1750
echo ==== LINE2 ====
raceghost
-forward
waitms 300
hud_ghost_pb 1
say !s 2
waitms 1000
+moveright
waitms 800
-moveright
waitms 300
+forward
waitms 1750
echo ==== DEDUPE ====
raceghost
-forward
waitms 300
hud_ghost_pb 0
hud_ghost_lines 0
say !s 2
waitms 1000
+moveright
waitms 800
-moveright
waitms 300
+forward
waitms 1750
echo ==== NOLINES ====
raceghost
-forward
waitms 300
echo RUNLINES COMPLETE
waitms 100
quit
