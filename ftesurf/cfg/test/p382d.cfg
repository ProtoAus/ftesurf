// P382D -- Patch 382, the exits that need a second player to leave or a map to
// change: listen host A (entnum 1) on surf_666 in lobby mode + p382e.cfg (B,
// entnum 2, who spectates A and is kicked).  NEEDS Patch 380's engine.
// Setup as p382a.cfg (zones; back up data/runs, data/saves AND data/resume/
// surf_666 -- B's runs are parked there).  Run, together:
//   cd C:\FTESurf; .\ftesurf64.exe -WindowStyle Minimized +exec cfg/test/p382d.cfg
//   cd C:\FTESurf; C:\FTEQuake\ftesurf64.exe -WindowStyle Minimized +exec cfg/test/p382e.cfg
// Two timelines: B's arms are scheduled around A's (p382e.cfg lists them, each
// with >= 25 s of margin); read the logs' timestamps, not this arithmetic.
// B's parked recordings: data/resume/surf_666/@<B's guid>/save000/run.rec, one at
// a time (each park is resumed (RES) or `ms_discard`ed before the next).  COPY EACH
// between arms (the next park overwrites it): the log line "resume: parked
// p382e's run ... (<why>, recording stream)" marks the moment.
//
// PRE-REGISTERED (A's log is the server's; B's sprints are in logs/p382e.log)
//  L   (B) "released (load)"; B's finished file holds no `spec` and no 32768.
//      While held, B's `sl_save` and `sl_hold` "save: stop spectating first";
//      then B's `sl_hold` + `rec_spec 1` "let go of the save-lock key first".
//  SRV `map surf_666` with B held: "released (server)" BEFORE "resume: parked
//      p382e's run ... (server, ...)"; run.rec ends `spec 0 ... server`, then
//      `pause <mt> <carry> <t> server` whose <mt> <carry> are the edge's.
//  MSR (B) held with a standing offer (SRV's park): `ms_resume` "resume: stop
//      spectating first".
//  RES (B) released, then `ms_resume`: the SRV run is restored and finished.  Its
//      file (the host log's "timer: wrote|streamed <path>" after B's RES marker;
//      copy to data/p382/resumed.rec) holds `spec 1`, `spec 0 ... server`, `pause
//      <mt> <carry> <t> server` with the edge's <mt> <carry>, `session 2`, then
//      `in` rows; flags include 32768 and 16384.  reccheck 0 faults; pm_verify
//      PASS (p382verify), and N7 derived from it REFUSEs.
//  DRP A watches B, `kick p382e` while B is held: "released (drop)" before
//      "parked ... (drop, ...)"; run.rec ends `spec 0 ... drop`, `pause ... drop`,
//      <mt> <carry> equal.
//  NT  the same kick leaves A alone: "spectate: nobody left to watch", then
//      "released (notarget)" 5 s later (run_spec_countdown 5); A's finished file:
//      `spec 0 ... notarget`, next an `in` row restating <mt> <carry>; pm_verify
//      PASS.
//  RTY A watches B again, B is kicked, `cmd rec_retry` inside the countdown:
//      "released (retry)" then the map restart, and NO "retry: restarts the map
//      for everyone" (B's departed edict is not counted any more).  A's finished
//      file: `spec 0 ... retry`, then the retry's `pause ... retry` (v10).
//      reccheck 0 faults; pm_verify REFUSE (a retry pause, as every retry).
//  ROT lobby_cycle 60, hold 0, maps "surf_666 bhop_eazy", B held: "released
//      (rotate)" before "parked ... (rotate, ...)"; run.rec `spec 0 ... rotate`,
//      `pause ... rotate`.
// CONTROL: none runs here -- the must-fail twin is derived: p382verify N7 is
//   resumed.rec with its `spec 0` moved after its `pause` (what a park before its
//   release would write) and must REFUSE.  A release line AFTER its park line
//   falsifies the order.
// FALSIFIED IF a park line precedes its release line, a `pause` does not restate
//   the edge's <mt> <carry>, NT is not "notarget", RTY is refused, or RES's file
//   does not PASS.
//
// RESULT (2026-09-19, host engine\release\fteqw64 with Patch 380; B on 0.1.10).
//   L: released (load); B's file flags 137, no window.  SLH, sl_save/sl_hold, MSR
//   refusals in B's log as registered.  SRV: released (server) before the park; the
//   parked run.rec ends `spec 0 ... server`, `pause 1867 5.569309e-07 90 server` (the
//   edge's <mt> <carry>).  RES: the resumed file is v10, flags 49152, `spec 1`, `spec 0
//   server`, the pause, `session 2`, rows; reccheck 0 faults, pm_verify PASS 548.
//   DRP: released (drop) before "parked ... (drop)", the pause restates.  NT: "nobody
//   left to watch", released (notarget); A's file PASS 480.  RTY: released (retry), no
//   "restarts the map for everyone"; A's file `spec 0 ... retry`, then `pause 11808
//   ... retry` (pm_verify REFUSEs cold rewinds, as always).  ROT: released (rotate),
//   then parked (rotate), the pause restates.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p382d
developer 1
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
sv_port 27682
sv_cheats 0
vid_conautoscale 0
vid_conwidth 1280
vid_conheight 720
sv_guidkey "ftesurf-p382-probe"
set lobby_enable    1
set lobby_avatars   1
set lobby_nocollide 1
set lobby_av_stream 1
set lobby_norec     0
set lobby_vote      0
set lobby_cycle     0
set run_resume      1
set run_resume_min  1
set run_spec_countdown 5
waitms 5000
map surf_666
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 500
set rec_terms 1
echo ^5==== waiting: B's L and SLH arms, then B holds (B1) ====
waitms 98000
status
echo ^5==== SRV: map reload while B spectates A ====
map surf_666
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 500
echo ^5==== waiting: B holds (B2), ms_resume refused, releases, resumes, finishes, holds ====
waitms 85000
status
echo ^5==== DRP + NT: A watches B, B is kicked ====
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 1000
-forward
waitms 800
cmd rec_spec 2
waitms 3000
kick p382e
waitms 7000
+forward
waitms 7000
-forward
waitms 2000
cmd timer
echo ^5==== waiting: B reconnects ====
waitms 70000
status
echo ^5==== RTY: A watches B, B is kicked, retry inside the countdown ====
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 1000
-forward
waitms 800
cmd rec_spec 2
waitms 2000
kick p382e
waitms 2000
cmd rec_retry
waitms 10000
menu_restart
waitms 500
ui_close
waitms 500
cmd timer
+forward
waitms 7000
-forward
waitms 2000
cmd timer
echo ^5==== waiting: B reconnects, discards, holds (B3) ====
waitms 85000
status
echo ^5==== ROT: the rotation while B spectates A ====
set lobby_maps "surf_666 bhop_eazy"
set lobby_cycle_hold 0
set lobby_cycle 60
waitms 110000
status
echo ^5==== p382d done ====
waitms 500
quit
