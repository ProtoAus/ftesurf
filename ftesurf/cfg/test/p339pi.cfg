// Post-deploy verification against a LIVE Pi lobby: the client must load the
// shipped csprogs, run the trigger mirror on a real rotation map, and idle
// quietly (no QC errors, no prederr storm) against the real server.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p339pi
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
wait 600
connect 192.168.1.102:27510
waitms 25000
cl_prederror 2
cl_trigdebug 1
echo === dump:
trig_dump
waitms 2000
trig_io
waitms 15000
echo === idle done
cmd viewpos
waitms 800
echo === p339pi done
quit
