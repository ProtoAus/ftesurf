cfg_save_auto 0
// Patch 302 Stage A verification -- static-prop direct lighting from
// LUMP_WORLDLIGHTS.  Two maps, because the control arm is a DIFFERENT MAP.
//
// PRE-REGISTERED BEFORE THE BUILD, from the numpy reference implementation
// (scratchpad/s12all.py) run over all 232 props of surf_tensor2:
//
//   worldlights 603 raw -> 601 kept
//       skipped: 1 emit_skylight, 1 emit_skyambient (Stage B, need a sky trace)
//       skipped: 0 styled, 0 DWL_FLAGS_INAMBIENTCUBE  (tensor2 has none of either)
//
//   models/props/surf/tensor2/stage2_detail02.mdl at (-10688 11744 -9728):
//       cube mean  0.0083 0.0115 0.0145
//       + direct   0.0369 0.0537 0.0689
//       boost      4.443  4.657  4.765
//
//   all 232 props, luma boost: p25 3.88  p50 5.66  p75 9.79  max 57.2
//   max linear level after the fix 0.602 -- NO prop reaches the shader's 1.0
//   clamp, so nothing should blow out.  If anything saturates, the C does not
//   match the reference and the run is void.
//
//   the 23x-57x props are all lamps (light01.mdl, prison_cagedlight001a) that
//   sit inside their own light.  Expected, not a fault.
//
// ON SCREEN, from Lex's own CS:S/FTESurf pair at save012:
//   block / left wall is 1.02 in CS:S and 0.40 in ours.
//   >>> A2 MUST MOVE THAT RATIO FROM ~0.40 TO ~1.0. <<<
//   The left wall is a lightmapped world brush and MUST NOT MOVE AT ALL --
//   this patch cannot touch brush lighting.  If the wall moves, something is
//   wrong that has nothing to do with the hypothesis.
//
// THE CONTROL ARM IS surf_boreas AND IT IS NOT OPTIONAL.
//   boreas is 1587 of 1587 props baked from .vhv.  Every one of them takes the
//   sent->hasbaked branch, so hl2_lt_worldlight MUST be a no-op there.
//   >>> B1 AND B2 MUST BE BIT-IDENTICAL.  Not "close" -- identical. <<<
//   This is the arm that catches the patch silently re-lighting props that were
//   already correct, and it is the one that is easy to skip because the headline
//   arm goes green without it.
vid_fullscreen 0
vid_restart
waitms 3000
wait 200

developer 1
log_developer 1
log_enable 1
log_dir logs
log_name p302a_worldlight
cl_maxfps 0
cl_idlefps 0
sv_cheats 1
con_notifylines 0
con_notifytime 0.01
r_drawviewmodel 0

// ---------------------------------------------------------------- tensor2
map surf_tensor2
waitmap 600
waitms 9000
waitms 3000
noclip
waitms 1000

alias vs12 "setpos -12300.9990 10799.1201 -9654.1191 3.1311 43.4784 0; waitms 2000"

hl2_lt_worldlight 0
waitms 2000
echo ^5=== A1: worldlight 0 -- must reproduce Lex's surf_tensor2_000.png
vs12
screenshot p302a_a1_off
prop_census models/props/surf/tensor2/stage2_detail02.mdl
waitms 1500

echo ^5=== A2: worldlight 1 -- block/wall must go 0.40 -> ~1.0
hl2_lt_worldlight 1
waitms 2500
vs12
screenshot p302a_a2_on
prop_census models/props/surf/tensor2/stage2_detail02.mdl
waitms 1500
prop_census
waitms 1500

echo ^5=== A3: back to 0 -- reversibility. Proves the cache invalidation works.
hl2_lt_worldlight 0
waitms 2500
vs12
screenshot p302a_a3_off_again

echo ^5=== A4: on again, second sample of A2
hl2_lt_worldlight 1
waitms 2500
vs12
screenshot p302a_a4_on_again

// ---------------------------------------------------------------- boreas
echo ^5=== CONTROL MAP: surf_boreas, 1587 of 1587 props baked
map surf_boreas
waitmap 600
waitms 9000
waitms 3000
noclip
waitms 1000

// Lex's own boreas savelocs, not invented coordinates: save001 is at ground
// level in the start area and save013 is a second vantage 1300 units away
// looking a different way.  Two vantages, because "bit-identical" is a much
// stronger claim from two independent framings than from one.
alias vbor1 "setpos 10085.2373 -14374.5410 3199.9836 17.1716 39.4080 0; waitms 2000"
alias vbor2 "setpos 9923.2871 -14581.8486 3036.6147 17.9517 36.2494 0; waitms 2000"

hl2_lt_worldlight 0
waitms 2500
echo ^5=== B1: boreas, worldlight 0
vbor1
screenshot p302a_b1_off
vbor2
screenshot p302a_b1b_off
prop_census
waitms 1500

echo ^5=== B2: boreas, worldlight 1 -- MUST BE BIT-IDENTICAL TO B1
hl2_lt_worldlight 1
waitms 2500
vbor1
screenshot p302a_b2_on
vbor2
screenshot p302a_b2b_on
prop_census
waitms 1500

echo ^5=== END OF RUN ===
waitms 500
quit
