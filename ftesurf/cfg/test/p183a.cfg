// FTESurf Patch 183 measurement, arm A: the OLD behaviour (keep every pack).
//
// Three loads, deliberately including the RETURN to the first map -- that is the
// case where unmounting could LOSE (it has to remount TF2), so measuring only
// utopia->tensor2 would be picking the arm's best case and calling it the result.
//   1. surf_utopia   cold, mounts TF2
//   2. surf_tensor2  mounts CS:GO; arm A still carries TF2 as well
//   3. surf_utopia   again; arm A has both mounted already, so this is its best case
fs_loadstats 1
fs_automount 1
fs_autounmount 0
developer 0
waitms 4000
echo "=== P183 ARM A (fs_autounmount 0 -- keep everything) ==="
echo "--- 1. cold: surf_utopia (wants TF2) ---"
map surf_utopia
waitms 30000
echo "--- 2. surf_tensor2 (wants CS:GO) ---"
map surf_tensor2
waitms 30000
echo "--- 3. back to surf_utopia ---"
map surf_utopia
waitms 30000
echo "=== ARM A DONE ==="
waitms 1000
quit
