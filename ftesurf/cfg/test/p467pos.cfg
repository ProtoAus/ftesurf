// P467POS -- print surf_rookie's spawn (cmd viewpos) for p467sky's setpos.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p467pos
developer 0
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
set run_resume 0
sv_public 0
sv_port 27686
set lobby_dir ""
waitms 3000
map surf_rookie
waitmap 45
waitms 4000
menu_restart
waitms 500
ui_close
waitms 1500
cmd viewpos
waitms 1500
quit
