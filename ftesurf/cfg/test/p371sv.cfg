// P371SV -- chat announcements, dedicated server half (clients: p371b.cfg first,
// then p371a.cfg).  From C:\FTESurf, with cfg/test/p360sf.zones.json copied to
// ftesurf/maps/zones/local/surf_666.json (remove it after) and data/runs/surf_666*
// and data/resume moved aside:
//   python surfd/p371stub.py 8141 "1 3 17 0;1 3 17 20000;1 1 17 20000;0 3 17 18000;1 3 17 20000 3;1 12 40 20000;1 2 40 20000;1 1 17 20000"
//   C:\FTEQuake\fteqwsv64.exe +set sv_port 27641 +set sv_public 0 +exec cfg/test/p371sv.cfg
// A walks the fixture ten times, 12 s apart from about S+28 (W1..W10); each full-run
// post takes the next stub entry.  Timeline (S = launch):
//   S+90  lobby_announce_gap 60       (W6 rank 12 is paced out, W7 rank 2 climbs)
//   S+112 lobby_announce 0            (W8, a world record: nothing to B)
//   S+121 no master, lobby_nopb 0, announce 1, gap 0   (W9 server best, W10 slower)
//   S+156 changelevel surf_666, S+186 map_restart      (no join line again)
//   A disconnects at about S+208; the server quits at S+230.
// Run 1 (A with no ui_close: no banner) measured the clients 5 s ahead of this
// clock; the times above are from it.
// PREDICTIONS and RESULTS: see p371b.cfg (what B hears) and p371a.cfg (A's lines).
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p371sv
developer 1
exec cfg/lobby/lobby.cfg
sv_cheats 0
set lobby_master "http://127.0.0.1:8141"
sv_guidkey "ftesurf-p371-probe"
sv_maxrate         0
sv_maxdownloadrate 0
set lobby_master_key  "stub-key-not-a-real-one"
set lobby_master_rate 30
set run_resume 0
set lobby_announce 1
set lobby_announce_gap 0
map surf_666
waitms 90000
echo ==== server S+90: lobby_announce_gap 60 ====
set lobby_announce_gap 60
waitms 22000
echo ==== server S+112: lobby_announce 0 ====
set lobby_announce 0
waitms 9000
echo ==== server S+121: no board, a server PB ====
set lobby_master ""
set lobby_nopb 0
set lobby_announce 1
set lobby_announce_gap 0
waitms 35000
echo ==== server S+156: changelevel ====
changelevel surf_666
waitms 30000
echo ==== server S+186: map_restart ====
map_restart
waitms 44000
quit
