cfg_save_auto 0
// BUILD 82 -- does a recording say what the MOVER WAS HANDED, not just where it went?
//
// WHY THIS EXISTS.  Every .rec this tree has ever written is a STATE trace: an
// origin, a velocity, a plane.  A state trace answers "is this what happened"
// and cannot answer "would this happen again", which is the question Layer 2 of
// the anti-cheat plan exists to ask.  Build 82 adds the INPUT trace -- one `in`
// record per SIMULATED MOVE, written from PlayerPreThink, the only QC hook the
// engine calls once per move rather than once per received packet.
//
// THREE THINGS HAVE TO BE TRUE FOR IT TO BE WORTH ANYTHING, and each is an arm.
//
//   1. IT MUST EXIST AT ALL, and reccheck.py -- written from the grammar, not
//      from the writer -- must pass a real run carrying it.  Arm A.
//
//   2. THE BUTTON COLUMN MUST BE FAITHFUL.  The design takes the three mover
//      bits from .button2/.button4/.button8 rather than from the QC global
//      input_buttons, because that global is registered `globalfloat` and
//      assigned from a 64-bit word (pr_cmds.c:978, :10523), so it is a float32
//      VALUE CONVERSION that rounds the whole number: (1<<25)|BUTTON_JUMP is
//      33554434, which rounds to 33554432, so `input_buttons & 2` reads 0 WHILE
//      THE MOVER JUMPED.  That is the reason for the design, and it is verified
//      by reading plus arithmetic (below).  What a CONFIG can falsify is the
//      other half: that the three per-bit fields are actually populated.  Arm C.
//
//      .button8 IS THE ONE THAT COULD HAVE FAILED SILENTLY.  The engine only
//      writes an extended button field if the progs DECLARE it -- pr_cmds.c
//      walks buttonfields[] and skips any whose offset is < 0 -- and before this
//      build nothing in this tree read .button8, so it could have been absent
//      from the fielddef table and read a constant 0 forever.  That is the
//      sv_mapcheck shape: a comparison whose two sides are both zero, agreeing.
//
//   3. THE PACKET GROUPING MUST BE IN THE FILE.  The run's finish is latched in
//      PlayerPostThink, which runs once per PACKET, so a verifier that re-ran
//      the commands and tested zones after each one would land on a different
//      tick for a run that was in no way wrong.  <pk> is what makes the grouping
//      readable.  Arm D reports it; it cannot FALSIFY it, because a local
//      loopback client sends one command per packet and the interesting case is
//      packet loss.  Said out loud rather than implied by a passing arm.
//
// WHAT THIS FILE CANNOT DO, stated before the arms rather than after.
//
//   IT CANNOT PRODUCE A CLEAN FINISH.  The only way a config can cross an end
//   zone is a noclip flight, and TF_CHEAT beats every other tag, so the file
//   this produces is always cheat.rec.  That is a property of the harness and
//   not of the feature; it is why the plan says anything depending on a clean
//   finish has to be falsified sideways or by hand.
//
//   IT CANNOT REACH THE input_buttons DEFECT FROM THE WIRE.  cl_input.c's
//   GATHERBIT table tops out at bit 18 (+button16) and every value it can send
//   is exact in float32, so no stock client can produce the rounding.  Reaching
//   it needs a client that chooses to -- which is exactly the threat model, and
//   exactly why the trace must not depend on the client being honest.  Recorded
//   as a READING (the two source sites) plus an arithmetic check, not as a
//   measurement.
//
//   IT CANNOT TEST THE SAVE-STATE RESUME PATH, where `instart`'s two numbers
//   come apart.  A resume needs a save-lock load mid-run, which voids the run
//   and does not finish it.  reccheck.py's note for that case is therefore
//   exercised by a synthetic header below, not by a run.
//
// PRE-REGISTERED:
//
//   A  A streamed run to a finish on bhop_eazy.  The .rec MUST carry an
//      `instart` header key, MUST carry `in` records, MUST have a FIVE-field
//      `end`, and reccheck.py MUST pass it with 0 faults.
//   B  `cmd timer` before/during/after -- the b73hdr control that the run really
//      started and really finished.  A missing .rec is the same symptom as a
//      broken writer: zone_goto ARMS and does not start, and SV_RecClose has
//      exactly ONE call site, at the finish.
//   C  Each of the three button bits must appear in some row's <bt>.  1 jump,
//      2 duck, 4 speed.  in_speedbutton 1 is required for the third -- it is
//      CVAR_ARCHIVE and defaults 0, and its own help text names .button8.
//   D  The trace's shape, read back: rows, distinct packets, rows per packet,
//      and rows per sample.  Reported, not asserted.
//
// FALSIFIED IF: no .rec appears; or it has no `instart`; or it has no `in`
//      records; or `end` has four fields; or reccheck.py faults it; or any of
//      the three bits never appears in <bt>.

cfg_save_auto 0
log_enable 1
log_dir logs
log_name b82input
developer 0
sv_cheats 0

// `set`, not a bare assignment: these register in worldspawn, so before the
// first map load a bare `rec_stream 1` is Unknown command and the default
// silently stands.  Cost one attempt in b73hdr and produces a MISSING FILE --
// the same symptom arm A's failure would produce.
set rec_enable 1
set rec_stream 1
set rec_runarchive 1

// ARM C's prerequisite, and it is an ENGINE cvar that exists from boot, so a
// bare set is right here and `set` would be wrong for the opposite reason the
// three above need it.  Off by default because bit 7 collides with +button8 for
// mods that use it; FTESurf does not.
in_speedbutton 1

waitms 6000
map bhop_eazy
waitmap 45
waitms 3000

echo ================================ B82INPUT ARM B -- armed, not started.  Expect no run.
cmd timer
waitms 1000

echo ================================ B82INPUT -- arm, aim, go
cmd zone_goto 0
waitms 1000
setpos -352 -352 144 0 335.3 0
waitms 1000

echo ================================ B82INPUT ARM C -- jump.  Starts the run AND sets bit 1.
+jump
waitms 700
-jump
waitms 300
cmd timer

echo ================================ B82INPUT ARM C -- duck, bit 2
+duck
waitms 700
-duck
waitms 300

echo ================================ B82INPUT ARM C -- speed, bit 4 (needs in_speedbutton 1)
+speed
waitms 700
-speed
waitms 300

echo ================================ B82INPUT -- fly
noclip
waitms 500
+forward
waitms 1500

echo ================================ B82INPUT ARM B -- running; a part file should exist NOW
cmd timer
waitms 500

// NO BUTTONS ARE TOUCHED DURING THE FLIGHT, and the first cut of this file got
// that wrong in a way worth recording.  It tapped all three mid-flight as a
// belt-and-braces second pass, on the reasoning that if start-on-jump had not
// fired above then nothing was RUNNING for the first pass and no rows were
// written.  In noclip +jump is up and +duck is down, so the taps pushed the
// flight off its line and the run never reached the end zone -- `cmd timer`
// read `running` at every check including the last, and SV_RecClose has ONE
// call site, at the finish, so NO FILE WAS PRODUCED AT ALL.  A missing .rec is
// the same symptom a broken writer gives.
//
// The insurance was also unnecessary: the abandoned stream in data/parts/0.rec
// proved the first pass had worked, with 73 rows at bt 1, 65 at bt 2 and 74 at
// bt 4.  The arm that was supposed to cover a failure is what caused one.
waitms 2900
cmd timer
waitms 2000
-forward
waitms 1500

echo ================================ B82INPUT ARM B -- after the end zone.  Expect FINISHED.
cmd timer
waitms 2500

echo ================================ B82INPUT done
waitms 500
quit

// ============================================================================
// MEASURED 2026-09-14, bhop_eazy, QC build 82.  TWO runs: the first FAILED to
// finish and is kept below, because what it failed on is the point.
//
// ARM B -- RUN CONTROL:
//
//     timer: armed on bhop_eazy, tick 0.01, start on jump
//     timer: running  (immediately after +jump -- start-on-jump fired)
//     timer: streamed data/runs/bhop_eazy/main/cheat.rec (476 samples, 66 padding)
//     timer: finished on bhop_eazy, tick 0.01, start on jump
//
// ARM A -- THE WRITER.  The header reads
//
//     FTESURF-REC 6
//     ...
//     mapcrc 676de275
//     zonesrc online
//     zonecrc c50cfd70
//     zonerule 1 1 0
//     instart 606 606
//
// and the trailer reads `end 661 476 66 0 416` -- FIVE fields, the fifth being
// the input count.  The two `instart` numbers are equal, which is what
// SV_TimerStart guarantees on a fresh start and is the control for the resume
// arm that only a synthetic file can reach.  reccheck.py -- written from the
// grammar, not the writer -- passes it with 0 FAULTS and prints
//
//     instart        606 run 606
//     inputs         416
//     in_packets     410
//     in_per_packet  1.015
//     in_per_sample  0.874
//
// ARM C -- THE BUTTON COLUMN, AND THIS IS THE ARM THAT COULD HAVE FAILED
// SILENTLY.  Distribution of <bt> over the finished run's 416 rows:
//
//     bt 0 ... 286     bt 1 (jump) ... 45
//     bt 2 (duck) . 38     bt 4 (speed) .. 47
//
// All three bits appear.  .button8 IS populated by the engine -- the field had
// no other reader in this tree before build 82, and pr_cmds.c only writes an
// extended button field whose name it finds in the progs, so "declared but
// stripped" would have read a constant 0 forever with nothing to notice.  That
// is the sv_mapcheck shape and it is now measured rather than assumed.
//
// ARM D -- THE PACKET GROUPING, AND THE PREDICTION IN THE HEADER OF THIS FILE
// WAS WRONG.  It says a local loopback client sends one command per packet and
// that the interesting case -- several commands in one packet -- will never
// appear.  It appeared, on both runs, without being asked for:
//
//     finished run   408 packets of 1 row,  2 packets of 4 rows
//     abandoned run  988 packets of 1 row,  4 packets of 4 rows
//
// So the column is load-bearing on a quiet loopback, not only under loss.  Six
// of the 416 rows in the finished run belong to a packet whose zone test was
// taken once, after all four moves -- which is exactly the case a verifier
// re-testing per tick would get wrong.
//
// THE UNPLANNED READING, AND IT IS THE BEST ONE HERE.  The .rec's packet count
// is written by SSQC from PlayerPostThink.  The .view sidecar's usercmd count is
// written by CSQC from clientcommandframe, on the other side of the protocol, in
// a separate file, by a separately compiled progs.  reccheck reports
//
//     in_packets 410   (the .rec)        usercmds 410   (the .view)
//
// -- so the server's count of packets and the client's count of commands it sent
// agree exactly.  Like build 81's zone hash this is AGREEMENT and not
// independence (one machine, one process pair), but it is the first check of the
// packet grouping against anything outside the file that states it.
//
// AND NO OFF-GRID ANGLE IN EITHER RUN.  reccheck emits no note, so all 416 rows
// (and all 1004 of the abandoned run's) carry angles that are exact multiples of
// 360/65536 -- i.e. every one of them came off the wire as a usercmd, and the
// setpos used to place the player did not leak into a row.
//
// THE FIRST ATTEMPT FAILED AND THE FAILURE IS WORTH KEEPING.  It tapped the
// three buttons a second time MID-FLIGHT as insurance.  In noclip +jump is up
// and +duck is down, so it pushed the flight off its line, the run never crossed
// the end zone, `cmd timer` read `running` at every check including the last,
// and SV_RecClose has ONE call site -- at the finish -- so NO FILE WAS WRITTEN
// AT ALL.  A missing .rec is the same symptom a broken writer gives, and the arm
// that existed to cover a failure is what caused one.
//
// What saved the attempt is that a STREAMED recording leaves its part file
// behind: data/parts/0.rec held the full header and 1004 `in` rows, and reading
// it is what proved the first button pass had worked and made the second
// unnecessary.  That is a property of Patch 316's streaming writer that no
// buffered run has, and it is worth knowing: an abandoned stream is readable
// evidence, not a lost run.
//
// READER-SIDE ARMS, and they are CHECKED IN rather than recorded here --
// tools/test_reccheck.py, 19 checks, on the tools/test_hidcheck.py precedent.
// It builds a v6 recording FROM THE GRAMMAR and never reads a real file, so it
// runs on a fresh clone with an empty data/ and keeps working when the recorder
// is rewritten.  That the from-grammar file and the writer's real output BOTH
// pass a checker written from the same grammar by a third party is the strongest
// statement available here about the format being a format.
//
//   CONTROL   the synthetic v6 file ......... 0 faults AND 0 notes
//             (0 notes matters: it is what makes the two note arms unambiguous)
//   CONTROL   reccheck.py over the 826 files of ftesurf/data ... 177 with
//             faults, BYTE-IDENTICAL to the build-81 tool's output over the same
//             826.  The new checks cost nothing on real data, and every one of
//             those files prints no `instart` and no `inputs`, which is the
//             honest answer for a file written before the trace existed.
//   FAULTS    rows with no instart; a four-field v6 trailer; a trailer that
//             over-counts; a nine-field row; movetick backwards; packet ordinal
//             backwards; a row below the horizon; a carry one printed step above
//             a tick; bt 8; a start tick above the horizon; a one-field instart.
//   NOT FAULTS (the two legitimate shapes a careless check would refuse)
//             instart with no rows; a start tick BELOW the horizon, which is the
//             save-state resume case and which no config in this tree can
//             produce; a carry printed at exactly one tick, which is a legal
//             rounding of 0.0099996 at %.5f; an off-grid angle, which is what
//             setpos writes and therefore what every harness produces.
//   REGRESSION tools/test_hidcheck.py, 104 checks, still 0 failed.
//
// WHAT WAS NOT EXERCISED, AND WHY:
//
//   THE input_buttons DEFECT ITSELF.  cl_input.c's GATHERBIT table tops out at
//   bit 18 (+button16) and every value it can send is exact in float32, so NO
//   STOCK CLIENT CAN PRODUCE THE ROUNDING.  Reaching it needs a client that
//   chooses to -- the server's own parse has no ceiling, common.c:1912 being a
//   bare MSG_ReadUInt64 -- which is exactly the threat model and exactly why the
//   trace must not depend on the client being honest.  Recorded as a READING of
//   pr_cmds.c:978/:10523 plus the arithmetic: (1<<25)|BUTTON_JUMP = 33554434
//   rounds to 33554432 in float32, so `input_buttons & 2` reads 0 while the
//   mover -- which takes the raw 64-bit word at sv_user.c:7735 -- jumps.
//
//   A CLEAN FINISH.  The only way a config can cross an end zone is a noclip
//   flight, and TF_CHEAT beats every other tag, so this file is always
//   cheat.rec.  Nothing about the trace depends on the class, but it does mean
//   the `flags` word in the measurements above reads 261 and not 0.
//
//   THE CAP.  FS_RECMAX_STREAM is 9,504,000 lines and only a 12-hour run
//   reaches it.  What IS measured is the cost, taken off this file rather than
//   estimated: 63,668 bytes over 910 lines, of which the 416 `in` rows are
//   21,239 bytes.  So the trace costs
//
//       1.84x the LINES   (910 against 494 without it)
//       1.50x the BYTES   (63,668 against 42,429)
//       51.1 bytes per input row, against 85.9 for every other line
//
//   The line multiplier is what the cap is counted in and it is the ~100 rows/s
//   build 81 explicitly sized FS_RECMAX_STREAM to include, so the cap needs no
//   revisiting.  The byte multiplier is lower than the line one because an input
//   row is smaller than a sample -- ten columns against seventeen -- which is
//   the opposite of what the first estimate in SV_TimerInFrame assumed, and that
//   estimate is corrected there.  Against build 81's ~439 MB per 12 hours this
//   is ~660 MB, ~80 MB at rest under xz -6.
// ============================================================================
