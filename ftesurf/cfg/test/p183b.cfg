// FTESurf Patch 183 measurement, arm B: the FIX (drop packs the next map does not want).
// Identical to p183a.cfg except fs_autounmount 1, so the only difference between the
// two logs is the FS_Addon_Unmount pass added to FS_AutoMountForMap.
//
// Expected shape if the patch does what it claims:
//   load 2 (tensor2) much faster than arm A, because TF2 is dropped before CS:GO mounts
//   load 3 (utopia)  SLOWER than arm A, because TF2 has to be remounted
// The patch is only worth keeping if 2's win is bigger than 3's loss.
fs_loadstats 1
fs_automount 1
fs_autounmount 1
developer 0
waitms 4000
echo "=== P183 ARM B (fs_autounmount 1 -- drop what the map does not need) ==="
echo "--- 1. cold: surf_utopia (wants TF2) ---"
map surf_utopia
waitms 30000
echo "--- 2. surf_tensor2 (wants CS:GO) ---"
map surf_tensor2
waitms 30000
echo "--- 3. back to surf_utopia ---"
map surf_utopia
waitms 30000
echo "=== ARM B DONE ==="
waitms 1000
quit
