// P856TOAST -- the finisher (server: p856sv.cfg; how to run it is there).  Three walks
// of P371's fixture; the stub answers W1 bronze, W2 silver + an Events gold that opens
// "Tier 2", W3 nothing.
// PREDICTIONS (before the run):
//   stub log: three "run N" lines; W1 smask=1 sfails=0 stop>0; W2 smask has 4 (left)
//     and 16 (jump); W3 smask=1.
//   W2's `cmd timer` prints "story: fails 0 mask <m> top <t>" with m & 21 == 21.
//   client log: "story: toast b surf_666" after W1, "story: toast g surf_666" after W2
//     (the best of two), none after W3; chat "story: bronze on surf_666 -- Complete
//     the map (Story 3, 1 trophies)", "story: chapter Tier 2 is open".
//   screenshots p856_toast1 / p856_toast2 show the toast top centre; p856_after none.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name runlines_smoke
developer 0
cl_idlefps 0
cl_maxfps 100
vid_vsync 0
mastervolume 0
rate  2000000
drate 5000000
vid_fullscreen 0
set rec_terms 7
set rec_upload 0
set ui_name_chosen 1
set name StoryToast
waitms 15000
map surf_666
waitms 14000
menu_restart
waitms 500
ui_close
waitms 500
set hud_chat_time 600
waitms 3000
echo ==== W1 ====
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 6000
-forward
waitms 1500
screenshot p856_toast1
waitms 8000
echo ==== W2 ====
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 1200
+moveleft
waitms 300
-moveleft
+jump
waitms 100
-jump
waitms 300
cmd timer
waitms 4100
-forward
waitms 1500
screenshot p856_toast2
waitms 8000
echo ==== W3 ====
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 6000
-forward
waitms 3000
screenshot p856_after
waitms 1000
echo RUNLINES COMPLETE
quit
