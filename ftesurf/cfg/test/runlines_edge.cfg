// Private overlay (tools/runlines_smoke.py).  The off-ramp mark at the ramp's own
// edge, found on the loaded map (Patch 628); graded by tools/test_runlines_edge.py.
//   --recording  a native surf_kitsune run with ramp exits (v4 or later)
//   --mount --also runlines_clip.rec=<a native surf_axiom run>   optional, see the end
// cfg/test/p492voy.rec, tracked, is surf_voyager's.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name runlines_smoke
con_notifytime 0
cl_idlefps 0
cl_maxfps 100
set hud_watch_skipidle 0
set hud_watch_path 1
set hud_lines_board 1
set hud_lines_order 0           // Patch 624's window is the draw's; a board line is read whole here
set hud_lines_edgedebug 1
waitms 2000
map surf_voyager
waitmap 60
waitms 4000
menu_restart
ui_close
hud_lines_marks 1
hud_lines_numsize 18
echo ==== VOYAGER ====
set hud_lines_edge 1
replay cfg/test/p492voy.rec
waitms 2000
replay pause
replay seek 5.2
waitms 800
replay marks 0
replay marktrace 2
waitms 800
screenshot runlines_edge.png
// After the marks: a build without this subcommand reads it as a file name.
replay rampprobe
echo ==== VOYAGERBOARD ====
scores lineat 1 cfg/test/p492voy.rec
waitms 3500
replay marks 1
scores lines clear
echo ==== VOYAGEROFF ====
replay stop
waitms 300
set hud_lines_edge 0
replay cfg/test/p492voy.rec
waitms 2000
replay pause
replay seek 5.2
waitms 800
replay marks 0
screenshot runlines_edge_off.png
replay stop
set hud_lines_edge 1
waitms 300
// Another map's run on this one: the map cannot say, and nothing moves.  No wait
// before the prints: a replay of another map's file is closed on its first frame.
echo ==== WRONGMAP ====
replay cfg/test/runlines_sample.rec
replay marks 0
replay rampprobe
waitms 500
map surf_kitsune
waitmap 60
waitms 4000
ui_close
echo ==== KITSUNE ====
replay cfg/test/runlines_sample.rec
waitms 2500
replay pause
replay marks 0
replay rampprobe
echo ==== KITSUNEOFF ====
replay stop
waitms 300
set hud_lines_edge 0
replay cfg/test/runlines_sample.rec
waitms 2500
replay marks 0
replay stop
set hud_lines_edge 1
// OPTIONAL, with --mount and --also runlines_clip.rec=<a native surf_axiom run>:
// a map whose ramps are player clip.  A trace made as the world passes through
// them (0 of 382 contact ticks there); made as a player's hull it does not.
// Without the file the replay does not open and the grader says the case was not run.
map surf_axiom
waitmap 60
waitms 3000
ui_close
echo ==== CLIPMAP ====
replay cfg/test/runlines_clip.rec
waitms 2000
replay pause
replay marks 0
replay rampprobe
echo RUNLINES COMPLETE
quit
