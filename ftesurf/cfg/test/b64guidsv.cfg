// Build 64: the SERVER half of the guid test. See b64guidcl.cfg.
//
// A DEDICATED SERVER AND A REAL CONNECT, because the listen-server run
// (b64guid.cfg) reported no guid and that result cannot be trusted as an
// answer about the Pi: the loopback client skips getchallenge entirely
// (cl_main.c:1120-1144 sets connectinfo.ext.guidsalt by hand) so it never
// takes the PROTOCOL_INFO_GUID path that a networked client takes at
// cl_main.c:976. One of those two is what the lobbies actually do.
//
// THE QUESTION: does a client connecting over a socket to a server with
// sv_guidkey set produce a non-empty infokey(e,"guid")? If not, every finish
// on the Pi is dropped at Lobby_SubmitRun's identity gate and the leaderboard
// can never receive a genuine run.
//
// log_developer 1 because the engine reports the received guid with
// Con_DPrintf ("GUID %s", sv_main.c:3824), which is invisible without it.
log_enable 1
log_dir logs
log_name b64guidsv
log_developer 1
developer 1

// sv_port is passed with +set on the launch line, not here: the socket is
// bound during net init, which happens BEFORE this file is exec'd, so setting
// it here left the server on the default port and every connect attempt came
// back "Connection lost or aborted".
sv_guidkey "ftesurf-guid-probe"

// A dead port, so nothing is sent anywhere real -- the gates under test are
// all reached before uri_post.
set lobby_master     "http://127.0.0.1:1"
set lobby_master_key "not-a-real-key"

// Armed now; Lobby_Heartbeat holds it until a player exists, which is exactly
// the case this test needs and the reason it was written that way.
set lobby_run_probe 1

map bhop_eazy
