// Patch 462 -- the strafe trainer, driven by numbers it cannot know.
//
// WHY THIS ARM CAN MEASURE ANYTHING AT ALL.  A strafe is a mouse gesture, and
// nothing in a config can move a mouse -- which is why no arm in this tree has
// ever graded one.  But `+right` is not the mouse: it feeds CL_AdjustAngles
// directly (cl_input.c:1368) and turns at EXACTLY cl_yawspeed degrees per
// second.  So the view rate becomes an authored constant, and the trainer's own
// `rate` field has an expected value rather than just a plausible one.
//
// That is also the whole reason cl_trainer.qc carries trn_s_rsum, which nothing
// on screen reads: q and err are both ratios against an ideal this config would
// have to re-derive to check, and a grader that re-derives the subject's own
// formula proves the formula agrees with itself.  rate is the one number here
// that can be compared against something outside the file.
//
// FIVE CUTS, each with its own authored number:
//
//   0  on the GROUND, strafing hard   ->  NO trainer line at all.  The air gate.
//   1  cl_yawspeed 500 then 250       ->  rate 500 then 250, ratio exactly 2.
//   2  flick 60 ms BEFORE the key     ->  sync +60 (late), wrong ~60 on the
//                                         strafe that was still held.
//   3  key 60 ms BEFORE the flick     ->  sync -60 (early), wrong ~60 on the
//                                         strafe just opened.
//   4  hud_trainer off, then on again ->  silent while off, measuring after.
//
// THE SYNC TOLERANCE IS ONE TICK AND IT IS THE ARM'S, NOT THE PATCH'S.  A
// `waitms 60` lands on whichever command boundary follows it, so the authored
// 60 ms reaches the mover as 4 ticks give or take two: four runs measured +45,
// +60, +60, +60 and -60, -75, -75, -90, which are 3 to 6 ticks of 15 ms.  Grade
// the SIGN and the 45..90 bracket, not equality with 60 -- a config cannot
// author a sub-tick offset and claiming it did would be the precision trap in
// CLAUDE.md's first bullet.  The -90 is what raised TRN_SYNCWIN from 90 to 120:
// the arm's own jitter had reached the patch's pairing limit.
//
// Cut 1's RATIO is the part that cannot be faked by a constant: a broken rate
// (wrong global, wrong dt, render cadence instead of command cadence) does not
// land on 400 and 200 in the same run.  Cuts 2 and 3 are each other's control
// and differ only in which of two adjacent lines comes first -- so a sign error
// in the sync, which is the single most likely defect in this patch, shows as
// both cuts reporting the same sign.
//
// AND `wrong` CROSS-CHECKS THE SYNC from the other side.  During the 60 ms
// between a flick and its key swap the held key is opposing the turn, so
// trn_s_wrong must accumulate about the same 60 ms that trn_s_sync reports.
// Two independent accumulators, one gesture, one number: they agree or one of
// them is wrong.
//
//   pwsh> $s=@{FilePath="C:\FTESurf\ftesurf64.exe";
//             ArgumentList="-WindowStyle","Minimized","+exec","cfg/test/p462trn.cfg";
//             WorkingDirectory="C:\FTESurf"}
//   pwsh> (Start-Process @s -PassThru).WaitForExit()
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p462trn
con_notifytime 0
developer 1
log_developer 1                 // Con_DPrintf is gated twice; AGENTS.md:899
cl_idlefps 0
cl_maxfps 250                   // 4 ms of frame, well under the 60 ms offsets below
vid_fullscreen 0
vid_width 1280
vid_height 720
fs_missingwarn 0
sv_public 0
sv_port 27693
set lobby_dir ""
set run_resume 0                // a resumed run is HELD, and a held body strafes nothing

/*
  AIR THAT DOES NOT END, AND THE LOCK HAS TO BE OPENED TO GET IT.

  FIRST CUT OF THIS ARM GOT NONE OF THIS RIGHT, and the failure is worth keeping
  because it is the one this repo warns about: `set sv_gravity 100` before the
  map, copied from p457av.cfg:66, DID NOTHING.  sv_gravity is in
  pms_lockedmovevars (sv_phys.c:2988) and `set` after cvar_lockdefaults writes
  the VALUE, not the default the lock canonicalises to -- so the readback said
  `"sv_gravity" is "800" (default)` while the config claimed 100, the body was
  in free fall the whole run at `velocity 0 0 -262  horizontal 0`, and +forward
  in mid-air caps at the 30 u/s air cap instead of reaching 260.  One strafe was
  measured, at 33 u/s, and three cuts measured nothing at all.

  p457av.cfg carries the same dead line for the same reason, so that arm was
  almost certainly grading a falling body too.

  The engine states the real route in pm_lockmovement's own help text
  (sv_phys.c:136): every mover cvar is "refused thereafter unless sv_cheats is
  1".  So cheats first, then gravity, and the refusal message even says
  "anything you set then is not a legal run" -- which is correct and irrelevant
  here, because a trainer arm is not a run.

  GRAVITY 0 RATHER THAN A SMALL NUMBER.  After one jump vel_z sits at 301.99 for
  ever, and PMSrc_CategorizePosition stops tracing for ground at all above
  PMSRC_NON_JUMP_VELOCITY 140 (pm_source.c:2098) -- so the body is airborne by
  the same branch for every tick of every cut, with no landing to interrupt a
  segment and no surfacefriction quarter either (that needs vel_z <= 140).
  Deterministic, rather than a fall I have to fit the cuts inside.

  It distorts no grade: gravity enters the ramp ideal only
  (Strafe_IdealTurnPlane), and the free-air rate this arm drives is
  atan2(gain, speed)/tick, where gravity does not appear.
*/
// ...SET AFTER THE MAP LOADS, not here: see the block below ui_close.

/*
  AND THE PRESTRAFE ASSIST OFF, because it WRITES the global this patch reads.
  PreStrafe_InputFrame (cl_main.qc:879) sets input_movevalues_x = 0 for you on a
  jump from a standing start -- which is exactly the gesture below -- and
  Trn_InputFrame is deliberately downstream of it, so with this on the arm would
  be grading a usercmd the config did not author.
*/
set run_prestrafe 0

// HARNESS TRAP (b63a_logic, b65a_hud, p440font): a +exec'd config runs while the
// engine is still initialising and a `map` issued then is SILENTLY DROPPED.
waitms 4000
map surf_dune
waitmap 45
waitms 5000
menu_restart
waitms 500
ui_close
waitms 1500

/*
  AFTER THE MAP, AND THAT IS THE SECOND HALF OF THE SAME TRAP.  The lock
  "restored to this game's default at each MAP LOAD, and refused thereafter
  unless sv_cheats is 1" (sv_phys.c:136) cuts both ways: setting gravity above
  the `map` line would be undone by the load, and setting it without cheats
  would be refused after it.  There is exactly one window -- cheats on, server
  up -- and this is it.  Printed back below, because this arm has already been
  wrong about this value once.
*/
sv_cheats 1
sv_gravity 0
waitms 300

hud_trainer 1
hud_trainer_trace 1
hud_trainer_rows 6

/*
  THE LAYOUT, SET RATHER THAN ASSUMED, and this arm learned why the hard way.

  hud_trainer_x/y are CVAR_ARCHIVE, and an archived value BEATS the default a
  later registercvar asks for -- so after this arm had run once at the old 0.5,
  ftesurf.cfg held `seta hud_trainer_x "0.5"` and the next run drew there no
  matter what cl_trainer.qc's default said.  The screenshot showed the panel
  over the speedometer and the position change looked like it had not compiled.

  p457av.cfg:78 carries the same line for the same reason: this machine's
  archived ftesurf.cfg overrides default.cfg and its values drift.  What that
  costs is that the arm no longer tests the DEFAULT position -- it tests the
  layout at a known one, which is the part a screenshot can speak to.
*/
seta hud_trainer_x 0.28
seta hud_trainer_y 0.27
set hud_scale 2
waitms 500

// AFTER the sets above, not before them: the first cut of this arm printed
// cl_yawspeed 60 and sv_gravity 800 from above its own assignments and I read
// the 60 as harmless rather than as the arm reporting a value it had not set.
echo === the cvars this arm depends on, read back rather than assumed:
hud_trainer
sv_cheats
sv_gravity
run_prestrafe
pm_ticrate

echo === PREMISE: the movevars the grade rests on, as the SERVER published them.
echo === pm_ticrate decides the ideal rate outright, so it is printed not assumed.
serverinfo

// ---- CUT 0: the ground refuses -------------------------------------------
// The air gate, and it is worth its own cut because every other line in this
// file depends on it: if a grounded strafe opened a segment, cut 1's rates
// would be measured across the take-off and read low.
// WANT: no `trainer:` line between this echo and cut 1's.
echo === CUT 0: strafing on the GROUND. WANT: no trainer line at all.
// 250 ms, not 400: this is ground acceleration and it MOVES the body, and the
// first cut of this arm spent 400 ms of it walking off the start platform --
// after which every later cut measured a falling body instead of a jumping one.
// Long enough to be several ticks of a held strafe key, short enough not to
// travel.  cmd viewpos below is what says it is still on the platform.
cl_yawspeed 500
+moveright
+right
waitms 250
-right
-moveright
waitms 300
echo === still grounded, and where. WANT: velocity z 0, not a fall.
cmd viewpos

// Build horizontal speed, then leave the ground.  W is released before any cut
// so wishdir is purely lateral -- it changes no ideal (wishspeed saturates the
// cap either way) but it keeps the gesture the one being described.
/*
  600 ms OF RUN-UP, NOT 1600, AND THE TELEPORT IS WHY.

  surf_dune's start has 12 teleports on it and 1600 ms of ground acceleration
  travelled about 325 units into one of them: the body came back at the spawn
  (9192 11888) with `velocity 0 0 0`, so the cut that was supposed to measure a
  260 u/s jump measured a hover accelerating from rest instead.  The position
  readbacks either side of this block are what caught it, and they stay.

  600 ms is roughly 190 u/s and under 90 units of travel, which clears it with
  the 250 ms of CUT 0 already spent.  The cuts below are centred on the ideal
  rate for that speed rather than on a round number -- at 190 u/s
  atan2(30,190)/0.015 is about 600 deg/s, so 500 and 250 straddle it.
*/
echo === build speed on the ground, then jump
+forward
waitms 600
+jump
waitms 100
-jump
-forward
waitms 300
echo === airborne now -- the server's own speed read:
cmd viewpos

// ---- CUT 1: two authored turn rates --------------------------------------
// WANT: trainer: R ... rate 500.0 (+- a few), then trainer: L ... rate 250.0.
// The ratio of the two is the real grade: it is 2.000 by construction and no
// constant in cl_trainer.qc can produce it by accident.
echo === CUT 1a: cl_yawspeed 500, strafing RIGHT. WANT: rate ~500.
cl_yawspeed 500
+moveright
+right
waitms 320
-right
-moveright
waitms 250

echo === CUT 1b: cl_yawspeed 250, strafing LEFT. WANT: rate ~250, ratio 2.000.
cl_yawspeed 250
+moveleft
+left
waitms 320
-left
-moveleft
waitms 250

// ---- CUT 2: the flick leads the key by 60 ms -----------------------------
// The R strafe is still held while the view has already reversed, so it takes
// 60 ms of `wrong`; the L strafe that follows is 60 ms LATE.
// WANT: trainer: R ... wrong ~60ms, then trainer: L ... sync +60ms.
echo === CUT 2: flick first, key 60 ms later. WANT: R wrong ~60, L sync +60.
cl_yawspeed 450
+moveright
+right
waitms 280
-right
+left
waitms 60
-moveright
+moveleft
waitms 280

// ---- CUT 3: the key leads the flick by 60 ms -----------------------------
// Same gesture, the two lines swapped.  Now the R strafe opens before the view
// reverses, so IT takes both the wrong-key time and a NEGATIVE sync.
// WANT: trainer: R ... sync -60ms, wrong ~60ms.
echo === CUT 3: key first, flick 60 ms later. WANT: R sync -60, wrong ~60.
-moveleft
+moveright
waitms 60
-left
+right
waitms 280
-right
-moveright
waitms 200

// ---- CUT 4: the switch has to work TWICE ---------------------------------
// Trn_ReadVars is throttled on trn_clock, and trn_clock only advances below the
// on/off gate -- so reading hud_trainer inside that throttle stopped the clock
// the moment the panel went off and the switch was never looked at again.  Off
// once, off for ever, and every cut above still passes because none of them
// turns it off.
//
// WANT: no trainer line from the strafe held while it is OFF, and a `trainer: R`
// line from the one after it is back ON.  Against the pre-fix build the second
// half is silent too, which is the whole discrimination.
echo === CUT 4: hud_trainer OFF. WANT: no trainer line from this strafe.
hud_trainer 0
waitms 200
+moveleft
+left
waitms 250
-left
-moveleft
waitms 250

echo === CUT 4b: hud_trainer back ON. WANT: a trainer R line from this one.
hud_trainer 1
waitms 250
+moveright
+right
waitms 300
-right
-moveright
waitms 300

echo === the panel itself, with the jump on it:
screenshot p462_trainer
waitms 400
screenshot p462_trainer_b
waitms 300

// ---- the compact form, which is a different layout and not just a hide ----
// hud_trainer_trace 0 has to SHRINK the box (Trn_Draw sizes tlh from it), so a
// shot of it is the only thing that says the backdrop followed.
echo === trace off: the box must shrink, not leave a slab of empty fill.
hud_trainer_trace 0
hud_trainer_rows 0
waitms 400
screenshot p462_trainer_compact
waitms 300

quit
