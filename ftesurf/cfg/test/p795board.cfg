// P795/P796 menu arm: client only, no server.  log_name comes from the command line.
// P795: the KSF board on surf_beginner has 50 rows, all with pictures, so the menu
// holds several picture slots at once (MP_Of's crash state).  The status line
// "pictures: ... slots held N" is the subject's own word that it got there.
// P796: the summary, the full terms, the F2 panel and the main menu, screenshotted.
cfg_save_auto 0
con_savehistory 0
cl_idlefps 0
cl_maxfps 100
vid_vsync 0
vid_width 1280
vid_height 800
mastervolume 0
log_enable 1
log_dir logs
log_developer 1
developer 1
waitms 8000
menu_restart
// The map list loads at boot in one long frame (12 s in a fresh basedir): a board
// asked for before it ends times out on the next frame, whatever the reply.
waitms 25000
ui_strip_test screen create
ui_board surf_beginner ksf 0 0
waitms 12000
ui_board_test
screenshot p795_board
waitms 2000
ui_board_test close
waitms 500
ui_strip_test screen terms
waitms 1500
ui_strip_test screen fit
screenshot p796_terms
waitms 1500
ui_strip_test screen termsfull
waitms 1500
ui_strip_test screen fit
screenshot p796_termsfull
waitms 1500
ui_updates
waitms 1500
screenshot p796_f2
waitms 1500
ui_strip_test screen main
waitms 2500
screenshot p796_main
waitms 1500
echo P795 ARM COMPLETE
quit
