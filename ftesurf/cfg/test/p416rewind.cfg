// Patch 416 -- THE TWO REWINDS: a save-load, then a retry, in one run.
//
// Both were found by review, not by this patch's first harness, and both are
// the same shape: the run carries on and the thing that answered the nonce goes
// away underneath it.
//
//   SAVE-LOAD.  A save is taken inside the round trip before the answer lands,
//   so the file records `flags` without the bit; the load then restores flags
//   from that file and CLEARS a bit the client had already earned -- and the
//   client, holding the same number, would never say it again.  The fix keeps
//   TF_NONCE out of what a save may assert (sv_saveloc.qc, beside TF_RECORDING
//   and TF_FROZEN, on the same argument) and re-publishes the nonce after the
//   rewind (SV_RecNoncePublish), with the client answering every time.
//
//   RETRY.  A retry is a map_restart: it destroys the CSQC VM and Rec_ViewInit
//   clears the client's nonce with it.  Nothing re-issued one, so the rest of
//   the run was played by a client that held no nonce while the file asserted
//   an answer.  Same fix, the other call site.
//
// Run from C:\FTESurf:
//   ./ftesurf64.exe -WindowStyle Minimized +exec cfg/test/p416rewind.cfg
// then:
//   grep -n "^nonce \|^flags" ftesurf/data/runs/bhop_eazy/main/cheat.rec
//   grep -n "nonce" ftesurf/data/p416_R.hid
//
// PRE-REGISTERED PREDICTIONS
//  R1  the finished file carries TF_NONCE (bit 131072) in `flags` AFTER a
//      save, a load and a retry.  This is the whole arm: before the fix the
//      load cleared it for good.
//  R2  the file states one nonce (the header's) and no body `nonce` record:
//      neither a load nor a retry is a new SESSION, so neither draws one.
//  R3  the journal opened after the retry carries a `nonce` note, and it is
//      the header's -- which is the only way to see that the re-publish
//      reached the NEW VM rather than the bit simply having survived.
//  R4  reccheck.py: 0 faults, and in particular no "says the run nonce was
//      answered, but the file states no nonce".
// FALSIFIED IF the bit is clear at the finish, if a body record appears, or if
//   the post-retry journal has no note.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p416rewind
developer 0
cl_idlefps 0
cl_maxfps 100
sv_cheats 0

set rec_enable 1
set rec_stream 0
set rec_runarchive 1
set rec_hid 1
set rec_retry 1

in_speedbutton 1

waitms 6000
map bhop_eazy
waitmap 45
waitms 3000

echo ================================ P416 R -- aim and start
cmd zone_goto 0
waitms 1000
setpos -352 -352 144 0 335.3 0
waitms 1000
+jump
waitms 700
-jump
waitms 2000

echo ================================ P416 R -- save, then load it back
cmd sl_save
waitms 1500
cmd sl_load
waitms 2500
cmd timer

echo ================================ P416 R -- retry: the client VM dies here
retry
waitms 6000
cmd timer
waitms 1500

echo ================================ P416 R -- freeze the POST-RETRY journal
in_journal_end data/p416_R.hid
waitms 1200

echo ================================ P416 R -- fly to the end zone
noclip
waitms 500
+forward
waitms 1500
waitms 2900
waitms 2000
-forward
waitms 1500
cmd timer
waitms 2500

echo ================================ P416 R done
waitms 500
quit

// RESULT (2026-09-21): R1, R2 and R4 held on the first run.  R3 FAILED TWICE,
// and both failures are the finding.
//
//   FIRST FAILURE.  The post-retry journal had no `nonce` note at all, while
//   the file carried the bit.  Cause: the server's re-publish reaches a client
//   that is still loading -- a retry is a map_restart -- so the stuffcmd is
//   executed in the new VM's FIRST command-buffer pass, before its first
//   CSQC_UpdateView, which is before the journal exists.  Rec_Nonce's note is
//   gated on the journal being open and correctly stayed silent.  It also meant
//   R1 could not be trusted: the bit might have survived the restore rather
//   than been re-earned.
//
//   THE FIX THAT DID NOT FIX IT, kept because it is the right mechanism for a
//   different case: the client now asks (`cmd rec_nonce_ask`, SV_RecNonceAsk)
//   one second into a recording run that holds no nonce.  R3 failed again --
//   the client HAD the nonce by then (the stuffcmd did arrive, it simply
//   arrived before the journal), so the ask never fired.  Measuring beat
//   reasoning twice in a row here.
//
//   WHAT FIXED IT: restoring the note in Rec_HidBegin, which is safe now that
//   the held nonce is cleared at the run-end edge.  The two notes cover the two
//   orders and neither covers both.
//
//   FINAL RUN, all four:
//   R1  `flags 131465` = 131072 (TF_NONCE) + 256 + 128 + 8 + 1 after a save, a
//       load and a retry.
//   R2  one header nonce (`416702482a9c549dfa69d438a9a6e5fb`), no body record.
//   R3  data/p416_R.hid line 56: `# 0 nonce 416702482a9c549dfa69d438a9a6e5fb`
//       -- the header's, in the journal opened AFTER the retry.
//   R4  reccheck.py: 0 faults.
//   Kept as data/p416/rewind.rec and rewind.hid.
