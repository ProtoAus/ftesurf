// Private overlay, run by tools/p635board.py: it starts this checkout's surfd on
// 127.0.0.1:27634 over seeded rows (main: two ranked, three Momentum, four KSF;
// bonus 1: ranked only; bonus 2: 130 rows) and puts ten Local recordings in the
// overlay.  Patch 635: the TAB board's Online list is every game's by default,
// with a filter switch and a three-stop slider, and the LINE heading is a
// control.  Graded from `scores status` (the tier, the footer's sentence and the
// names AS DRAWN), `board_status`, `scores lines`, the panel's hit rects and each
// click's own print; the screenshots are for a person.  A marker comes BEFORE
// its click and before any `scores <word>` whose tail prints the status.
// `wait 4` after a wait: waitms counts from the frame's start (Patch 630's note).
cfg_save_auto 0
log_enable 1
log_dir logs
log_name runlines_smoke
con_notifytime 0
con_notifylines 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
vid_winmaximize 0
vid_width 1600
vid_height 900
vid_conautoscale 1
sv_public 0
waitms 2000
map surf_voyager
waitmap 60
waitms 4000
wait 4
menu_restart
ui_close
// menu_restart reloads consent: the synthetic test cvar goes after it (p545mom.cfg).
set rec_terms 4
set lobby_dir "http://127.0.0.1:27634"
set hud_scale 2
set hud_lines_board 1
scores open
waitms 3000
wait 4

echo ==== P635 DEFAULT ====
echo P635 default
sb_filter
sb_filter_src
scores status
board_status
hud_edit ui
screenshot p635_default.png
// A type too large for every column: the WHY column goes, and a row says its
// source in front of its name, cut to its column.
set hud_scale 4
waitms 900
wait 4
echo P635 narrow
scores status
screenshot p635_narrow.png
// for a person: the smallest rows, where the labels (12 px at least) are larger
// than the type and the slider has to make its own room
set hud_scale 1
waitms 900
wait 4
screenshot p635_small.png
set hud_scale 2
waitms 900
wait 4

echo ==== P635 FILTER ====
echo P635 click ftesurf
hud_edit ui hover sb_src0
hud_edit ui down mouse1
waitms 100
hud_edit ui hover sb_src0
hud_edit ui up mouse1
waitms 2500
wait 4
echo P635 ftesurf
sb_filter
sb_filter_src
scores status
board_status
screenshot p635_ftesurf.png
echo P635 click momentum
hud_edit ui hover sb_src1
hud_edit ui down mouse1
waitms 100
hud_edit ui hover sb_src1
hud_edit ui up mouse1
waitms 2500
wait 4
echo P635 momentum
sb_filter
sb_filter_src
scores status
board_status
screenshot p635_momentum.png
// What a config saved now would hold.
cfg_save p635save.cfg
echo P635 click ksf
hud_edit ui hover sb_src2
hud_edit ui down mouse1
waitms 100
hud_edit ui hover sb_src2
hud_edit ui up mouse1
waitms 2500
wait 4
echo P635 ksf
sb_filter
sb_filter_src
scores status
board_status
echo P635 click off
hud_edit ui hover sb_flt
hud_edit ui down mouse1
waitms 100
hud_edit ui hover sb_flt
hud_edit ui up mouse1
waitms 2500
wait 4
echo P635 off
sb_filter
sb_filter_src
scores status
board_status
screenshot p635_off.png
// The switch on again: the slider is where it was left.
echo P635 click on
hud_edit ui hover sb_flt
hud_edit ui down mouse1
waitms 100
hud_edit ui hover sb_flt
hud_edit ui up mouse1
waitms 2500
wait 4
echo P635 on
sb_filter
sb_filter_src
scores status
echo P635 to all
scores source all
waitms 2500
wait 4

echo ==== P635 HELD ====
// A board that is only HELD has no cursor.  The cursor is left on the switch by
// the click above; a mouse1 while held must not reach it.
scores close
waitms 400
+showscores
waitms 600
wait 4
echo P635 held
vote key 512 1
waitms 100
vote key 512 0
waitms 600
wait 4
sb_filter
scores status
// `scores open` prints the status too: it must not be read as the held board's
echo P635 held end
-showscores
waitms 400
scores open
// A build whose held board does take the press is left filtered: the steps
// below are graded for themselves, not for that.
scores source all
waitms 2500
wait 4

echo ==== P635 LINE ====
// The merged list: the two rows with a recording on surfd, not the row whose
// demo has to be requested, not the KSF rows.
echo P635 lineall online
scores lineall
waitms 400
wait 4
scores lines
scores status
echo P635 lineall online again
scores lineall
waitms 400
wait 4
scores lines
echo P635 head click
hud_edit ui hover sb_lnall
hud_edit ui down mouse1
waitms 100
hud_edit ui hover sb_lnall
hud_edit ui up mouse1
waitms 600
wait 4
scores lines
screenshot p635_lines_online.png
echo P635 cleared
scores lines clear

echo ==== P635 LEGS ====
// A leg with our times only: every game's list is those two rows, and one
// game's alone is empty and says so.
echo P635 to bonus 1
scores leg 1
waitms 2500
wait 4
echo P635 bonus 1
scores status
board_status
echo P635 to bonus 1 momentum
scores source momentum
waitms 2500
wait 4
echo P635 bonus 1 momentum
scores status
board_status
screenshot p635_empty.png
echo P635 to bonus 2
scores source all
scores leg 2
waitms 3000
wait 4
// More than a page: the footer says how many there are.
echo P635 bonus 2
scores status
screenshot p635_page.png
// for a person: the same sentence where it has to be cut to clear the key hints
set hud_scale 4
waitms 900
wait 4
screenshot p635_page_narrow.png
set hud_scale 2
waitms 900
wait 4
echo P635 to main
scores leg 0
waitms 2500
wait 4

echo ==== P635 TABS ====
// Segmented stays ours: an imported run is clean.
echo P635 to segmented
scores tab segmented
waitms 2500
wait 4
echo P635 segmented
scores status
hud_edit ui
// The console's old word: both imports without ours, for this session.
echo P635 to legacy
scores tab imported
waitms 2500
wait 4
echo P635 legacy
scores status
board_status
// ... and it does not outlive the tab: right arrow to Segmented, left back.
echo P635 keys
hud_edit ui down rightarrow
hud_edit ui up rightarrow
waitms 300
hud_edit ui down leftarrow
hud_edit ui up leftarrow
waitms 2500
wait 4
echo P635 legacy cleared
scores status

echo ==== P635 LOCAL ====
echo P635 to local
scores tab local
waitms 1500
wait 4
echo P635 local
scores status
scores lineall
waitms 600
wait 4
scores lines
scores status
screenshot p635_local.png
// Every slot holds a Local line: the Online list has none to give, and says so.
echo P635 to online
scores tab online
waitms 2500
wait 4
echo P635 full
scores lineall
waitms 300
wait 4
scores status
screenshot p635_full.png
echo P635 back to local
scores tab local
waitms 1000
wait 4
echo P635 local off
scores lineall
waitms 400
wait 4
scores lines
echo P635 end
echo RUNLINES COMPLETE
quit
