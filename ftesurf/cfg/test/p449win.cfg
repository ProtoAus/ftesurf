// P449WIN -- Patch 449: the run-time window, and what the marks actually drew.
//
// Every graded number is one the draw pass computed and used -- ia/ib, the
// window ends, the mark count incremented inside the glyph emitter, and each
// glyph's screen position as it was handed to the fill.  `replay marktrace <n>`
// prints them for the next n rendered frames (lnd / lnd2 / lndm / lnde).
// Frozen frame (paused, seeked, camera still) so two cuts are comparable.
//
// The fixture is opened on its OWN map: a replay for another map stops itself
// within a frame, which is fine for a table dump and useless for a draw test.
//
// A board line comes from `scores lineat <slot> <path>` (Patch 449's harness
// handle) because a headless client has no board rows behind it -- every
// `scores line N` answers "no recording behind that row", and W5 without a
// second slot would measure nothing.
//
// PRE-REGISTERED (graded by tools/p449win.py)
//  W1 win 0: `winon 0`, ia/ib the whole shown range, N marks drawn.
//  W2 win 6 / winf 2 at T: every lndm t inside [T-6, T+2], and ib-ia strictly
//     less than W1's.  The narrowing is the feature.
//  W3 every lndm x,y is finite and inside the guard -- the dot test runs before
//     project(), which divides by w unguarded and returns NaN on the eye plane.
//     Its own cut parks the camera ON a mark (the landing at t=41.1440), since
//     nowhere else in this arm produces the input the guard is for.
//  W4 gap 240 draws strictly fewer marks than gap 24 at the same frame, and no
//     two share a cell of the gap grid.  ONE PER CELL is what the claim
//     guarantees -- two marks either side of a cell edge can be adjacent -- so
//     that is what is graded, not a minimum separation the code does not give.
//  W5 slot 4 (a board line) prints `winon 0` and the same ia/ib whether the
//     window is on or off: it has no playhead, and inferring one from its
//     99999999 sentinel would draw nothing.
//  W6 ahead 0: no lndm past the playhead.
// RESULT (2026-09-27, aesthetic pb at t=40, frozen).  W1 W2 W4 W5 W6 held;
//  W3 held but is NOT falsifiable by this arm -- see below.
//  W1 winon 0, 0..5320, 579 points, 14 marks.
//  W2 winon 1, 34.0..42.0, 2401..2934: both edges moved, 4 marks, none outside.
//  W4 gap 240 drew 8 marks against gap 24's 14, none sharing a cell.
//  W5 slot 4 printed winon 0 and 0..5186 with 14 marks under BOTH settings,
//     in the same frames where slot 0 narrowed to 2401..2800.
//  W6 ahead 0: 2 marks, none past the playhead, 28 points (not zero).
//
// MUTATIONS.  W2's back edge not enforced -> W2 fails (`back edge moved NO`),
//  as predicted, but ONLY after W2 was sharpened: the first cut graded "the
//  range is narrower than the whole line", which the mutation still satisfies,
//  and the stretch it wrongly added is behind the camera so no mark betrayed
//  it.  The declutter claiming every cell -> W4 fails (17 marks against 16, 9
//  sharing a cell), as predicted.  Inferring the window from tplay -> caught,
//  but by W1 and W4 ("no slot 0 trace"), NOT by W5: slot 0 re-enters the window
//  block with a stale ln_wina/ln_winb and stops drawing before the board line
//  is ever reached.  OUTCOME HELD, REASON NOT.
//
// W3 IS A GUARD THIS HARNESS CANNOT FALSIFY, and it is left in anyway.
//  Removing the dot-product test before project() changed NOTHING measurable:
//  158 glyphs both ways, no NaN.  The reason is that `q_z < -1` already rejects
//  everything behind the camera, so the dot test's unique contribution is the
//  w == 0 knife edge exactly, which a sampled run does not land on -- not even
//  with the camera parked on a mark (the W3 cut, t=41.1440, was added to try).
//  So: no NaN reached a draw call across every cut, and the guard's NECESSITY
//  is not demonstrated.  It stays because cl_entview.qc:1288-1294 documents the
//  same hazard from a case that did reach QC, not because this arm proved it.
log_enable 1
log_dir "logs"
log_name p449win
developer 0
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0
set run_resume 0
sv_public 0
sv_port 27711
set lobby_dir ""
set hud_watch_skipidle 0
set hud_watch_path 1
set hud_watch_path_ahead 1
set hud_watch_path_mode 2

wait 200
map surf_aesthetic
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 1000

replay data/runs/surf_aesthetic/main/0005191_pb.rec
waitms 1500
replay pause
replay seek 40
waitms 1500
replay status

echo ^5=== p449win W1 window off, gap 24 ===
hud_lines_win 0
hud_lines_winf 0
hud_lines_gap 24
hud_lines_marks 1
waitms 800
replay marktrace 2
waitms 1200

echo ^5=== p449win W2 window 6 back / 2 ahead ===
hud_lines_win 6
hud_lines_winf 2
waitms 800
replay marktrace 2
waitms 1200

echo ^5=== p449win W4 gap 240, window off ===
hud_lines_win 0
hud_lines_winf 0
hud_lines_gap 240
waitms 800
replay marktrace 2
waitms 1200

// win 6 as well as winf 2: with the window starting AT the playhead, `ahead 0`
// clamps it to nothing (ia == ib, 0 points) and the arm would pass by drawing
// nothing at all.  Measured: lnd2 0 2801 2801 0 0 0.
echo ^5=== p449win W6 ahead 0 ===
hud_lines_gap 24
hud_lines_win 6
hud_lines_winf 2
hud_watch_path_ahead 0
waitms 800
replay marktrace 2
waitms 1200
hud_watch_path_ahead 1
hud_lines_win 0
hud_lines_winf 0

// The camera sits ON a mark: there is a landing at t=41.1440 in this file, and
// the replay camera is at the player, so (mark - eye) . fwd is about zero --
// exactly the input that makes project() return a NaN when the dot test does
// not run first.  Without this cut, removing that guard changes nothing
// measurable and the guard is untested.
echo ^5=== p449win W3 camera on a landing mark ===
replay seek 41.144
waitms 1200
replay marktrace 2
waitms 1200
replay seek 40
waitms 800

echo ^5=== p449win W5 board line on slot 4, window ON ===
hud_lines_win 6
scores lineat 4 data/runs/surf_aesthetic/main/0005191_pb.rec
waitms 6000
scores lines
replay marktrace 2
waitms 1200

echo ^5=== p449win W5 board line on slot 4, window OFF ===
hud_lines_win 0
waitms 800
replay marktrace 2
waitms 1200

echo ^5=== p449win marks for slot 4 (the two-slot parity check) ===
replay marks 4
replay marks 0
waitms 300

replay stop
waitms 300
quit
