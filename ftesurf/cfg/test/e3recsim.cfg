cfg_save_auto 0
// E3 -- DOES A RECORDED INPUT TRACE REPLAY?  (anti-cheat plan, Phase 0)
//
// WHY THIS EXISTS.  The plan lists E3 among the three experiments that must be
// answered before any later phase starts: "Replay one recorded usercmd stream
// through PMSrc_PlayerMove offline and compare to the .rec.  If it does not
// reproduce exactly on the same binary, the verifier is not yet possible and
// that must be understood first."  Until QC build 82 there was no usercmd
// stream in the file, so E3 could not be attempted at all.  It can now.
//
// WHAT THIS FILE PRODUCES, AND WHY IT IS DELIBERATELY NOT A FINISHED RUN.
// b82input.cfg's recording is HALF A NOCLIP FLIGHT, because the only way a
// config can cross an end zone is to fly through the level -- which is a
// property of the harness that the plan already records.  For E3 that file is
// close to worthless: re-simulating noclip exercises no collision, no friction,
// no ground/air split and no jump, so it would reproduce perfectly and prove
// nothing about the mover.
//
// So this file does the opposite trade.  It BHOPS FOR REAL -- ground contact,
// jumps, air acceleration, keyboard turn, wall collisions -- and never finishes,
// then quits.  Patch 316's streaming recorder leaves its part file behind, which
// is the finding b82input paid an attempt to learn:
//
//     "an abandoned stream is readable evidence, not a lost run"
//
// so data/parts/0.rec is the artifact.  It carries the full header (written at
// SV_RecOpen, including `instart`, `mapcrc` and the zone pin) and every `in` row
// up to the moment the process died.  It carries no `end` trailer, and pm_recsim
// does not need one.
//
// NO noclip AND NO setpos AFTER THE START.  setpos voids a run via
// SV_TimerWarped, and noclip changes pm_type -- which is not in the file, so a
// re-simulation could not know to change with it.  Both are used only BEFORE the
// jump that starts the clock.
//
// PRE-REGISTERED:
//
//   A  A part file must exist at data/parts/0.rec, carrying `instart`, `mapcrc`
//      and at least a few hundred `in` rows, with the run never finishing.
//   B  `cmd timer` must read `running` mid-sequence -- the b73hdr control that
//      the rows are from a live run and not a dead one.  zone_goto ARMS and does
//      not start; bhop_eazy starts on a JUMP.
//   C  The rows must show real physics: a spread of <bt> values with bit 1
//      (jump) set on a large minority, and a MOVING yaw, unlike b82input's
//      416 rows which all carry yaw -24.9994.
//
// FALSIFIED IF: no part file; or it has no `in` rows; or the timer never reads
//      running; or every row carries the same yaw (which would mean the
//      keyboard turn never reached the usercmd and the trace is a straight line).
//
// THIS FILE ASSERTS NOTHING ABOUT THE RE-SIMULATION ITSELF.  That is pm_recsim's
// job, run afterwards against the part file, and its result is recorded at the
// bottom of this file rather than predicted here -- E3 is an experiment whose
// answer is allowed to be "no".

cfg_save_auto 0
log_enable 1
log_dir logs
log_name e3recsim
developer 0
sv_cheats 0

// `set`, not a bare assignment: these register in worldspawn, so before the
// first map load a bare `rec_stream 1` is Unknown command and the default
// silently stands.  That failure produces a MISSING FILE, i.e. the same symptom
// arm A's failure would produce.
set rec_enable 1
set rec_stream 1
set rec_runarchive 1

// Keyboard turn is the angle source here, so it has to be a rate the mover can
// actually use.  Left at the default would be fine; pinned so the trace is
// reproducible from this file alone.
cl_yawspeed 210

waitms 6000
map bhop_eazy
waitmap 45
waitms 3000

echo ================================ E3 ARM B -- armed, not started.  Expect no run.
cmd timer
waitms 500

cmd zone_goto 0
waitms 1000
setpos -352 -352 144 0 335.3 0
waitms 1500

// ---------------------------------------------------------------------------
// The run starts HERE, on the jump, and nothing below may warp or noclip.
// ---------------------------------------------------------------------------
alias hop  "+jump;waitms 70;-jump;waitms 110"
alias goL  "+moveleft;-moveright;+left;-right"
alias goR  "-moveleft;+moveright;-left;+right"
alias cyc  "goL;hop;hop;goR;hop;hop"

+forward
+jump
waitms 120
-jump
waitms 120

echo ================================ E3 ARM B -- started?  Expect RUNNING.
cmd timer
waitms 200

cyc
cyc
cyc
cyc
cyc
echo ================================ E3 ARM B -- mid-run.  Expect RUNNING.
cmd timer
cyc
cyc
cyc
cyc
cyc
echo ================================ E3 ARM B -- mid-run 2.  Expect RUNNING.
cmd timer
cyc
cyc
cyc
cyc
cyc
echo ================================ E3 ARM B -- mid-run 3.  Expect RUNNING.
cmd timer
cyc
cyc
cyc
cyc
cyc

-forward
-moveleft
-moveright
-left
-right
waitms 500

echo ================================ E3 ARM B -- last read before quit.
cmd timer
waitms 500

echo ================================ E3 done -- quitting WITHOUT finishing.
waitms 500
quit

// ============================================================================
// MEASURED 2026-09-15, bhop_eazy, QC build 82 + engine Patch 327.
// Capture by this file; replay by e3run.cfg; the tool is `pm_recsim`.
//
// CAPTURE (this file):
//
//   ARM A  data/parts/0.rec, 205,368 bytes, 2782 lines, 1340 `in` rows, header
//          carrying `instart 606 606`, `mapcrc 676de275`, `zonesrc online`,
//          `zonecrc c50cfd70`, `zonerule 1 1 0`.  No `end` trailer, by design.
//   ARM B  `timer: armed`, then `timer: running` at all four mid-run reads, and
//          no `timer: finished` anywhere.  The run was live and was abandoned.
//   ARM C  883 distinct yaw values (b82input's 416 rows carry ONE), and <bt>
//          splits 860 rows at 0 against 480 at 1 -- a real bhop, not a flight.
//
//   AND ONE THING WORTH MORE THAN ALL THREE: `flags 0`.  b82input's recording
//   reads 261 because a noclip flight is the only way a config can finish, and
//   TF_CHEAT beats every other tag.  This one never noclips and never warps
//   after the start, so it is the first CLEAN run in this tree produced entirely
//   by a config.  Nothing about E3 depends on the class -- but a re-simulation
//   measured against a tainted recording would have been easy to dismiss.
//
// REPLAY (e3run.cfg), and E3 IS ANSWERED YES:
//
//   ARM 1  TICK ARITHMETIC ............ 1339 of 1339 moves exact, 0 off.
//   ARM 2  PINNED LOOP ................ 1307 of 1324 packets at the printing
//          floor.  origin err median 0.0046 u, p90 0.0087; velocity err median
//          0.0000, p90 0.0093 u/s.  The sample is written at %.2f, so +-0.005 u
//          IS the floor -- the mover reproduces the run exactly and what is left
//          over is the file's own rounding.
//   ARM 3  OPEN LOOP .................. holds to row 149.
//
//   ARM 1 IS THE ONE THAT DECIDES SOMETHING.  Build 82 refused a frametime
//   column because the duration is exactly (next mt - mt)*rate + (next carry -
//   carry).  That was arithmetic on paper; this is the mover agreeing with it
//   1339 times out of 1339, which also says %.5f on <carry> survives the round
//   trip -- not obvious, with a tick boundary 0.01 from a number printed to 1e-5.
//
// THE FIFTEEN PACKETS THAT DO NOT REPRODUCE ARE NOT SIMULATION FAILURES, and
// they are the actual output of this experiment:
//
//   TEN ARE TELEPORTS.  ~250 u of position discontinuity with velocity
//   PRESERVED EXACTLY, landing on the run's own start coordinates:
//
//       t 2.3980  org -131.09 -244.51 60.91   vel 158.23 62.62 -314.01
//       t 2.4130  org -352.00 -352.00 66.00   vel 158.23 62.62 -330.01
//
//   That is trigger_teleport -- sv_entities.qc:4632, "stage/bonus teleports, and
//   the 'you fell off' resets".  My scripted bhop is bad and fell off ten times.
//
//   THE .rec RECORDS THE CONSEQUENCE AND NOT THE EVENT.  A verifier sees an
//   unexplained 250-unit jump and cannot tell a legitimate stage teleport from a
//   cheat that moved the player.  trigger_push and trigger_setspeed are the same
//   class through velocity instead of position; this run touched neither.
//
//   TWO ARE JUMP-EDGE DISAGREEMENTS at a landing (velocity error 314.16 and
//   301.99 u/s against a jumpvelocity of 301.993) -- the simulation and the
//   recording disagreed by one tick about when a landing became a jump, which is
//   chaos at a discrete boundary and is expected rather than wrong.
//
// AND THE NEGATIVE CONTROL, WHICH IS WHAT MAKES THE ABOVE MEAN ANYTHING.
// e3run.cfg also replays b82input's recording, which is half a noclip flight.
// pm_type is not in the format, so pm_recsim assumes PM_NORMAL, hits walls the
// flight passed through, and reports velocity errors over 1000 u/s from row 223
// -- exactly where the real run typed `noclip`.  A tool that reproduced both
// files equally well would be measuring nothing.
//
// WHAT THIS SAYS A VERIFIER STILL NEEDS, in the order the measurement ranks them:
//
//   1  A RECORD OF STATE IMPOSED FROM OUTSIDE THE MOVER.  Teleports first,
//      because they are the ones this run proved; pushes and setspeed by the
//      same argument.  Without it, re-simulation cannot cross a stage boundary.
//   2  THE FINAL MOVE'S DURATION.  1340 rows give 1339 durations -- the last row
//      has no successor, and it is the move the finish is latched on.  `instart`
//      states the horizon at one end of the recording and nothing states the
//      other.  Worth 1-2 ticks, which is a rank.
//   3  THE PHYSICS PIN.  The file pins the map (build 73) and the zone table
//      (build 81) and not the movement parameters, the player hull or pm_type.
//      pm_recsim takes all three from the running server; a verifier cannot.
//
// NOT MEASURED HERE: whether a run that CROSSES A STAGE reproduces, because the
// teleport hole blocks it by construction -- that is finding 1 restated as a
// limitation.  Nor anything about a surf map: bhop_eazy is 100-tick and its
// geometry is boxes, so the ramp-clipping path that Patch 317/318/320 all landed
// on is untested by this file.
// ============================================================================
