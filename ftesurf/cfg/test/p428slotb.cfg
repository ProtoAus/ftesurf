// P428SLOTB -- the second occupant of the slot (see p428slota.cfg for the arm).
cfg_save_auto 0
log_enable 1
log_dir logs
developer 1
cl_idlefps 0
cl_maxfps 100
rate  2000000
drate 5000000
vid_fullscreen 0
name "^3P428B"
waitms 3000
connect 127.0.0.1:27635
waitms 12000
cmd sl_list
waitms 1000
echo p428slotb: done
quit
