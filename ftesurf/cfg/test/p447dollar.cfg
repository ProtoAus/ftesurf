cfg_save_auto 0

// ===========================================================================
//  P447DOLLAR -- does a map's allow-listed `echo` EXPAND a cvar with `$`?
//    python tools/p447dollar.py [--control]
//  The driver BUILDS the fixture map; this cfg sets the canaries and loads it.
//
//  THIS IS THE VERIFICATION PATCH 446 OWED.  446 refuses `$` in a map's console
//  command, and it did so on a READ OF THE ENGINE that nobody had driven:
//  Cmd_ExpandCvar interpolates `$cvar` AFTER the Cbuf split -- so it can never start a
//  second command, which is the class 446 closed -- but it can read a cvar INTO the
//  allow-listed text.  The expansion gate admits any cvar whose restriction is <= the
//  exec level, and at localcmd's RESTRICT_INSECURE (30) that includes `rcon_password`
//  (restriction 29).  The CVAR_NOUNSAFEEXPAND guard beside it tests Cmd_IsInsecure()
//  against an exec level that is still 0 at expansion time, so it may not bite.
//
//  WHY IT MATTERS ENOUGH TO RUN: the answer decides something OUTSIDE the code.  If a
//  pre-446 build really did broadcast `rcon_password` to everyone on the server, that
//  leaked for as long as the door was open and THE LOBBY KEYS WANT ROTATING.  No code
//  comment can close that question.
//
//  THE REAL SECRET IS NEVER INVOLVED, and the two canaries separate the two halves of
//  the engine read:
//    p447canary     an ordinary cvar, no flags -- does expansion happen AT ALL here?
//    rcon_password  SET BELOW TO A CANARY VALUE -- the same cvar the concern is about,
//                   carrying CVAR_NOUNSAFEEXPAND, but holding `CANARY447RCON`.  Testing
//                   the guard needs a cvar that HAS the flag; it does not need a live
//                   password, and using one would put a secret in a log for no gain.
//  This is a local listen server with no real password set, so nothing is overwritten.
//
//  NO `;` IN THE PAYLOAD, deliberately: that is the class 446 already closed and
//  measured, and including one would confound the two.  `$` alone is the question.
//
//  WHAT IS GRADED
//   fired    `P447A` -- the echo ran.  On the CONTROL this is the witness that the
//            entity fired; on a FIXED build it must be ABSENT, because 446 refuses the
//            whole command.
//   refused  the refusal dprint.  On a FIXED build THIS is the witness that the entity
//            fired, since the echo cannot be.
//   plain    `P447A CANARY447PLAIN` -- the no-flags cvar's value NEXT TO ITS MARKER,
//            i.e. expansion happens at this exec level.
//   unsafe   `P447B CANARY447RCON` -- the NOUNSAFEEXPAND cvar's value next to its
//            marker, i.e. the guard did not bite.  THIS IS THE ONE THE KEY-ROTATION
//            QUESTION TURNS ON.
//   literal  `P447A $p447canary` -- what a build that does NOT expand would print.
//   EVERY ONE IS MARKER-ANCHORED, and that is this arm's own first-run correction: the
//   first cut searched for the bare VALUE, and this cfg sets and reads both canaries
//   back, so `plain` read present on a build that had refused the command outright.
//   Only a substitution can put the value immediately after its marker.
//   canaryset the cfg's readback, i.e. the canary really WAS set -- so an absent
//            expansion cannot quietly mean "the cvar was empty".  The third verdict,
//            in the arm rather than in the subject.
//
//  PLAIN AND UNSAFE ARE REPORTED, NOT PREDICTED, on the control.  They are the unknown
//  this arm exists to resolve; pre-registering a value I do not know would make the run
//  unfalsifiable, which is the opposite of the point.  The driver prints an explicit
//  verdict for each of the four combinations instead.
//
//  PRE-REGISTERED PREDICTIONS
//   FIXED    fired ABSENT, refused present, plain ABSENT, unsafe ABSENT.
//   CONTROL  fired present, refused absent.  plain/unsafe: unknown, reported.
//  FALSIFIED IF the log never names `p447dollar` (the fixture did not load), or the
//   fixed side shows neither `fired` nor `refused` (nothing reached SV_IOCommand, so the
//   section measured nothing), or the control shows `refused` (that build has the patch).
//
//  RESULT 2026-09-27, both sides exit 0.  qwprogs AB1F10EBDD196A3E fixed /
//  1F000116DB26CD5A control (a worktree at bb4fe45).
//   **THE ENGINE READ WAS REAL -- BOTH CANARIES EXPANDED PRE-446.**
//   CONTROL  `P447A CANARY447PLAIN` present, `P447B CANARY447RCON` PRESENT, literal
//            absent.  Expansion happens at this exec level and the NOUNSAFEEXPAND
//            guard does NOT bite, so `say $rcon_password` would have substituted.
//   FIXED    both absent, refusal present -- the question cannot be asked.
//  The fleet has a real 48-character rcon_password set (checked as a length, never
//  printed), so there was a live secret behind the door.  Measured mitigation: 0 of
//  1438 shipped Command rows contain `$`, so nothing installed exploited it.
//  A DEFECT IN THIS ARM, found by running it: the first cut searched for the bare
//  canary value, and this cfg sets and reads back both canaries -- so `plain` read
//  present on a build that had refused the command.  The fields are anchored on their
//  markers now, which only a substitution can produce.
log_enable 1
log_dir logs
log_name p447dollar
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
sv_port 27703
sv_cheats 0
set run_resume 0
vid_fullscreen 0
waitms 5000

// The two canaries, set BEFORE the map so the expansion has something to find.
// Distinctive strings so a grep cannot confuse them with anything else in the log.
set p447canary CANARY447PLAIN
set rcon_password CANARY447RCON

echo ==== M load the fixture, whose logic_auto fires OnMapSpawn ====
map p447dollar
waitmap 2400
waitms 4000
menu_restart
ui_close
waitms 2000

// Read both back, so a reader can see the canaries really were set -- otherwise an
// absent expansion could mean "the cvar was empty" rather than "it did not expand".
echo ==== V the canaries as the console sees them ====
p447canary
waitms 400

quit
