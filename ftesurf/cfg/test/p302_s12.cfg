cfg_save_auto 0
// Fault 4 at Lex's save012 -- the vantage where the fault is UNAMBIGUOUS.
//
// Lex's own pair at this spot (CS:S surf_tensor20001.jpg vs ours
// surf_tensor2_000.png) measures:
//     region            CS:S              ours          ratio
//     block face   [33.1 42.7 54.2]  [13.5 19.0 23.9]   0.41
//     left wall    [32.5 42.2 53.9]  [34.1 45.6 59.2]   1.05
//     ceiling      [26.8 35.4 44.6]  [25.4 34.5 43.7]   0.97
//     floor        [23.3 29.9 38.4]  [24.8 31.7 40.0]   1.06
//     far wall     [25.7 34.4 45.4]  [27.0 36.3 47.7]   1.05
// Everything in the room matches CS:S to within 5%.  ONLY the block is wrong,
// and it is wrong by 2.4x.  In CS:S the block reads 1.02x the side wall; in
// ours 0.40x.  There is no global exposure difference to hide behind.
//
// OFFLINE, from the map, before this run:
//   - no brush model's bbox lies on this view ray at all, out to 4000 units.
//   - exactly one static prop does: models/props/surf/tensor2/stage2_detail02
//     at (-10688, 11744, -9728), hull 1216 x 2560 x 1792, nearest corner 456
//     units ahead, projecting from screen x=560 -- the black block in Lex's
//     shot starts at x~570.
//   - its three materials are concretewall023a, metalgrate013a and
//     concretewall073a, all VertexLitGeneric.  Both screenshots show concrete
//     faces AND a metal grate panel on the right of the block.
//   - surf_tensor2 ships ZERO .vhv, and the engine prints
//     "props: 0 of 232 lit from VRAD's baked vertex lighting".
//
// PRE-REGISTERED -- write these down before looking at any screenshot:
//
//   E2 r_fullbright 1: the LEFT WALL is a lightmapped world brush and must
//   jump ~6x, as the floor did at save008 (22.8 -> 143.2).  The BLOCK must NOT
//   MOVE, because model lighting does not come from a lightmap.
//     >>> IF THE BLOCK JUMPS TOO, IT IS LIGHTMAPPED, IT IS NOT A PROP, AND THE
//     >>> WHOLE IDENTIFICATION ABOVE IS WRONG.  That outcome kills it; no
//     >>> screenshot below can revive it.
//
//   E4 hl2_propdist 1 culls fade-less static props and touches nothing else.
//   The block must VANISH ENTIRELY, revealing the room behind it.  Not dim --
//   gone.  If it merely darkens, or survives, it is not a static prop.
//
//   E5 r_drawentities 0 removes props AND brush entities AND sprites.  It must
//   do EXACTLY what E4 did to the block and no more.  If E5 removes the block
//   but E4 does not, the block is a brush entity after all.
//
//   E3 and E6 are reversibility controls.  They must reproduce E1.  If they do
//   not, something drifted between arms and E2/E4/E5 mean nothing.
vid_fullscreen 0
vid_restart
waitms 3000
wait 200

developer 1
log_developer 1
log_enable 1
log_dir logs
log_name p302_s12
cl_maxfps 0
cl_idlefps 0
sv_cheats 1
con_notifylines 0
con_notifytime 0.01
r_drawviewmodel 0

map surf_tensor2
waitmap 600
waitms 9000
waitms 3000
noclip
waitms 1000

alias vs12 "setpos -12300.9990 10799.1201 -9654.1191 3.1311 43.4784 0; waitms 2000"

echo ^5=== E1: baseline -- must reproduce Lex's surf_tensor2_000.png
vs12
screenshot p302_e1_base

echo ^5=== E2: r_fullbright 1 -- wall must jump ~6x, block must not move
r_fullbright 1
waitms 2500
vs12
screenshot p302_e2_fullbright
r_fullbright 0
waitms 2000

echo ^5=== E3: reversibility control, must equal E1
vs12
screenshot p302_e3_repeat

echo ^5=== E4: hl2_propdist 1 -- static props only.  Block must VANISH.
hl2_propdist 1
waitms 2500
vs12
screenshot p302_e4_nopropx
hl2_propdist 0
waitms 2000

echo ^5=== E5: r_drawentities 0 -- props AND brush ents AND sprites
r_drawentities 0
waitms 2500
vs12
screenshot p302_e5_noents
r_drawentities 1
waitms 2000

echo ^5=== E6: second reversibility control, must equal E1 and E3
vs12
screenshot p302_e6_repeat

echo ^5=== E7: what the engine says it is drawing and how it is lit
vs12
shader_here
waitms 800
lighthere
waitms 800
solidhere
waitms 800
prop_census models/props/surf/tensor2/stage2_detail02.mdl
waitms 1500
prop_census
waitms 1500

echo ^5=== END OF RUN ===
waitms 500
quit
