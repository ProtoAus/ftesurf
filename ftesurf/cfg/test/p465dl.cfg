// cfg_save_auto 0 FIRST: this run sets archived cvars and must never write them
// into ftesurf.cfg (cl_main.c:2535).
cfg_save_auto 0

// ===========================================================================
//  P465DL -- does the map browser's Download button actually download a map?
//    python tools/p465dl.py            subject: a local http mirror that serves
//    python tools/p465dl.py --control  control: the same mirror answering 404
//
//  WHAT IS BEING TESTED, AND WHY NOT THE BUTTON.  The button is a sui element
//  picked with the mouse and no cfg in this tree can drive a cursor -- the same
//  limit b67join.cfg records for the start button.  `ui_dlmap <map>` is its
//  headless twin: it calls ui_dl_start, which is exactly what the button calls,
//  and skips only the pick.
//
//  THE SUBJECT MUST PRINT ITS OWN ACTION, so this does not grade on "a file
//  appeared".  ui_dlmap reports whether the BUILTIN RESOLVED at all, which is
//  the one failure indistinguishable from "nothing happened" -- a #0 with no
//  :name compiles perfectly and binds to nothing -- then the engine's own
//  dlstate percentage, rate and byte counts.  The driver grades the log AND
//  stats the bsp, because either alone can pass while the other is false: the
//  engine prints progress for a transfer it later discards, and a file can
//  exist because a previous run left it there.
//
//  THE CONTROL IS THE POINT.  An arm that passes because its condition never
//  occurred proves nothing, so tools/p465dl.py --control serves 404 from the
//  same mirror on the same port with the same config.  The subject must end
//  `ok` with a file; the control must end `failed` with none.  If both pass,
//  the arm is measuring nothing.
//
//  WHY A LOCAL MIRROR RATHER THAN THE PI.  The Pi's nginx snippet is not
//  installed (it needs a sudo this tooling does not have), so play.proto.bar
//  404s every map today.  A local server makes the http path testable NOW and
//  independently of that, and it logs the REQUESTED PATH -- which settles by
//  measurement which of the engine's two url layouts is actually taken:
//    sv_dlURL           -> <base>/<gamedir>/maps/<map>.bsp   (cl_parse.c:1002)
//    cl_download_mapsrc -> <base>/<map>.bsp                  (cl_parse.c:1020)
//  Both are set here, deliberately, so the log says which one wins instead of
//  this file asserting it.  The mirror serves both.
// ===========================================================================

log_enable 1
log_dir logs
log_name p465dl
log_developer 1
developer 1

// The driver rewrites this line per run; 27650 is only the default.
exec cfg/test/p465src.cfg

// FORTY SECONDS, THEN menu_restart.  menu.dat loads LAZILY and nothing in a
// scripted run needs a menu, so without this every arm prints
// `Unknown command "ui_dlmap"` and the log puts `Initializing menu.dat` after
// the last one.  b67join.cfg's header records the three runs this cost there.
waitms 40000
menu_restart
waitms 4000

echo ^5==== p465dl arm 0: is the builtin bound, and what does the list hold? ====
ui_dlmap
waitms 500

echo ^5==== p465dl arm 1: ask for the map ====
ui_dlmap p465test
waitms 1500
ui_dlmap

echo ^5==== p465dl arm 2: three reads across the transfer ====
waitms 3000
ui_dlmap
waitms 3000
ui_dlmap
waitms 4000
ui_dlmap

echo ^5==== p465dl arm 3: let a THROTTLED transfer actually finish ====
// The driver paces its mirror on purpose, because an unthrottled localhost
// transfer completes inside one Dl_Tick and every rate sample reads 0 -- which
// is indistinguishable from a broken KB/s readout.  The cost is that the run
// must then outlast the transfer: 4.7 MB at 250 kB/s is 19 s, and the first cut
// of this arm gave it 14.5 s and graded the resulting PARTIAL file as a
// failure.  That was the test being too short, not the feature being broken.
// POLL FASTER THAN THE STATE IS HELD.  ui_dl_start's DL_OK/DL_FAIL banner lives
// for DL_HOLD seconds (6) and then falls back to idle, so a probe every 8 s
// steps straight over it and reports `active -> idle` with the map on disk --
// which reads exactly like "the download never completed".  It had completed.
// 2 s polls cannot miss a 6 s window.
waitms 2000
ui_dlmap
waitms 2000
ui_dlmap
waitms 2000
ui_dlmap
waitms 2000
ui_dlmap
waitms 2000
ui_dlmap
waitms 2000
ui_dlmap
waitms 2000
ui_dlmap
waitms 2000
ui_dlmap
waitms 2000
ui_dlmap
waitms 2000
ui_dlmap

echo ^5==== p465dl arm 4: settled state, and does the engine see the file? ====
ui_dlmap
dir maps/p465test.bsp
dir maps/p465test.tmp
waitms 1000

quit
