// Private overlay (tools/runlines_smoke.py).  Patch 641: a config that still holds
// the HUD's old defaults (saved before Patch 637, or an older release's default.cfg)
// is moved to the owner's layout, once.  The `seta` lines below stand for that
// config: they run before the map, as a config does, so each name exists when the
// game code registers it.  Three starts of the game code in one process: all 42
// on their old defaults; then the mark cleared and values a player touched; then
// a value put back by hand with the mark in place.  Graded by
// tools/test_p641migrate.py from the values and the line the game prints.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name runlines_smoke
con_notifytime 0
con_notifylines 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
vid_winmaximize 0
vid_width 1280
vid_height 720
vid_conautoscale 1
sv_public 0
seta hud_timer_y 0.035
seta hud_splits_x 0.045
seta hud_splits_y 0.2
seta hud_seq_x -0.25
seta hud_seq_y 0.5
seta hud_trainer_x 0.28
seta hud_trainer_y 0.27
seta hud_board_x -1
seta hud_board_y -1
seta hud_boarding_x -1
seta hud_boarding_y -1
seta hud_boarding 1
seta hud_speed_y 0.68
seta hud_linegraph_x 0.99
seta hud_linegraph_y 0.3
seta hud_debug_x 0.012
seta hud_debug_y 0.3
seta hud_saveloc_x 0.018
seta hud_saveloc_y 0.34
seta hud_gfx_x 0.018
seta hud_gfx_y 0.1
seta hud_vote_x 0.018
seta hud_vote_y 0.3
seta hud_net_x 0.78
seta hud_net_y 0.3
seta hud_results_x 0.72
seta hud_seq_abs 1
seta hud_seq_pct 1
seta hud_seq_units 1
seta hud_board_seg 1
seta hud_board_ramp 1
seta hud_board_words 1
seta hud_strafe_rates 1
seta hud_strafe_why 1
seta hud_strafe_best 2
seta hud_lines_order 8
seta hud_lines_nums 2
seta hud_watch_path_far 6000
seta hud_linegraph_plots 1
seta hud_mouse_span 90
seta hud_mouse_trail 0.5
seta hud_update -1
waitms 2000
echo ==== P641 FIRST ====
echo P641 first
map surf_kitsune
waitmap 60
waitms 5000
wait 4
menu_restart
ui_close
waitms 600
wait 4
echo P641 first read
hud_timer_y
hud_splits_x
hud_splits_y
hud_seq_x
hud_seq_y
hud_trainer_x
hud_trainer_y
hud_board_x
hud_board_y
hud_boarding_x
hud_boarding_y
hud_boarding
hud_speed_y
hud_linegraph_x
hud_linegraph_y
hud_debug_x
hud_debug_y
hud_saveloc_x
hud_saveloc_y
hud_gfx_x
hud_gfx_y
hud_vote_x
hud_vote_y
hud_net_x
hud_net_y
hud_results_x
hud_seq_abs
hud_seq_pct
hud_seq_units
hud_board_seg
hud_board_ramp
hud_board_words
hud_strafe_rates
hud_strafe_why
hud_strafe_best
hud_lines_order
hud_lines_nums
hud_watch_path_far
hud_linegraph_plots
hud_mouse_span
hud_mouse_trail
hud_update
hud_timer_x
hud_speed_x
hud_results_y
hud_layout_rev
cfg_save p641save.cfg
waitms 300
// The mark cleared, and values a player touched: an element moved on x only, one
// moved on y only, a setting off its old default, a value a hair off the old one.
// hud_boarding is put back on its old default: that one must move again.
seta hud_layout_rev 0
seta hud_splits_x 0.06
seta hud_splits_y 0.2
seta hud_seq_x -0.25
seta hud_seq_y 0.31
seta hud_lines_order 6
seta hud_timer_y 0.0351
seta hud_boarding 1
waitms 300
echo ==== P641 SECOND ====
echo P641 second
map surf_kitsune
waitmap 60
waitms 5000
wait 4
menu_restart
ui_close
waitms 600
wait 4
echo P641 second read
hud_splits_x
hud_splits_y
hud_seq_x
hud_seq_y
hud_lines_order
hud_timer_y
hud_boarding
hud_layout_rev
// The mark is in place: what the player now puts back by hand is theirs.
seta hud_timer_y 0.035
seta hud_linegraph_plots 1
waitms 300
echo ==== P641 THIRD ====
echo P641 third
map surf_kitsune
waitmap 60
waitms 5000
wait 4
menu_restart
ui_close
waitms 600
wait 4
echo P641 third read
hud_timer_y
hud_linegraph_plots
hud_layout_rev
echo P641 end
echo RUNLINES COMPLETE
quit
