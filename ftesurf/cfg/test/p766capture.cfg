// cfg_save_auto 0: this run sets archived cvars; never let it write them into ftesurf.cfg
cfg_save_auto 0
// p766capture -- Patch 766: borderless stays visible to display capture.  Driven by
// tools/p766capture.py, which passes +set vid_borderless_capture 0 or 1 and captures the
// primary monitor at each OBSCAP marker.  The view turns, so every live frame differs.
// No vid_restart once the map is up: on the 758 build too it ends the client (BACKLOG).
log_dir "logs"
log_name "p766capture"
log_enable 1
developer 1
log_developer 1
cl_idlefps 0
// the owner's own: uncapped, no vsync
cl_maxfps 0
vid_vsync 0
vid_minonfocusloss 1
vid_fullscreen 1
vid_width 0
vid_height 0
vid_restart
waitms 3000
vid_borderless_capture
vid_srgb
con_notifylines 0
map surf_dune
waitmap 600
waitms 2000
cl_yawspeed 40
+right
waitms 2000
echo OBSCAP on1
waitms 40000
-right
echo OBSCAP done
quit
