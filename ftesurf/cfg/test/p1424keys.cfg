// MEASURED -- engine\release\fteqw64.exe git-8565-patch-1421-1-g2e2be11f9
// (client, 2026-11-08), against the installed 0.1.42 exe (git-8564-patch-1421).
// Driven by the private P1424 arm driver (foreground-independent PostMessage for
// B/D/E; SendInput for C).  Evidence under the P1424 private task root.
//
// SUBJECT (counting build), per the pre-registration above:
//   arm            'y' keys   nohandle   '+' recs   kbdobserve   'o'
//    A (control)      0          0          0           1         -     PASS
//    B (posted 20)   19-20       0         20           1         -     PASS (floor)
//    C (SendInput)   see note    40        20           1         -     (S4: 20/40)
//    D (repeat 10)   10          0         10           1         -     PASS
//    E (ups late 5)  4-5         0          5           1         -     PASS (expiry)
//    F (toggle)      --          --         0           1        0,1    PASS (partial)
//
// CONTROL (installed patch-1421): EVERY arm wrote '+' records for the injected
// scancode -- the keys reached the game -- with NO 'y', NO 'o' and NO kbdobserve
// header key.  B 20, D 10, E 5 '+' records, 0 counted.  The hole is live.
//
// ARM B/E READ A FLOOR, not an error: the LAST press of a burst is still pending
// its decision when the journal ends (no event after it to run the expiry), so it
// is counted on the next event -- 19-20 of 20, 4-5 of 5, never 0 and never over.
// This is the same undercount-safe property Patch 307's click counter documents.
//
// ARM D IS THE REPEAT-FLAG FIX: all ten downs carry lParam bit 30 (the OS
// auto-repeat bit).  A reader that trusted that bit would count ZERO; this build
// judges a repeat by its own key state and counts 10.
//
// ARM E IS THE EXPIRY FIX: the five ups are sent AFTER in_journal_end, so a
// build that decided a press only on its key-up would count ZERO; this build
// decides by RAWKEY_WINDOW expiry and counts them inside the journal.
//
// ARM C's 'y' count on this build is not shown: SetForegroundWindow from a
// background driver is refused by Windows' foreground lock, so the SendInput keys
// do not reach an unfocused window in automation.  The SendInput handle-less path
// (nohandle) and the legacy-copy count are the same code as arm B (legacy) and
// the Patch 306 nohandle counter; S4 measured arm C at 20 keys / 40 nohandle on
// the pre-threading-fix build, whose KeyObserve handle-less branch is byte-
// identical here.  A human run with the window focused is the clean arm C.
//
// Both the current hidcheck AND the previous (Pi-deployed) hidcheck read every
// subject and control journal with ZERO faults.  test_hidcheck 307/0.
// Three independent review rounds; the round-2 data race is fixed and round 3
// found the race closed with no new defect.
