cfg_save_auto 0
// PATCH 1424 -- the keyboard half of Patch 307: legacy key presses no real
// keyboard reported are counted in the .hid ('y' records, header kbdobserve).
// Driven by a private driver (P1424 task root) that injects while the log shows
// each GO line.
//
// PRE-REGISTERED, before the first run:
//   ARM A  nothing injected -> data/p1424_A.hid
//          subject: kbdobserve 1, 'y' sum 0.  control: no kbdobserve key, no 'y'.
//   ARM B  20 PostMessage key taps to the game window -> data/p1424_B.hid
//          subject: 'y' keys = 20 (the driver's own sent count), nohandle 0.
//          control: no 'y' -- the hole: posted keys reach the game uncounted.
//   ARM C  SendInput key taps, each sent only while the game is foreground
//          -> data/p1424_C.hid
//          subject: 'y' keys = taps sent, nohandle = 2 x taps (down + up).
//          control: no 'y'.  Zero taps sent = not measured, never a pass.
//   Both builds: '+' records for the injected scancode in B (and C when sent),
//   proving the keys reached the game.  hidcheck must not FAULT any file.
//
// ADDED after review round 1 (subject only; each arm acts on one fix):
//   ARM D  10 posted taps whose down message claims to be a repeat
//          -> 'y' keys 10: repeats are judged by the engine's own key state.
//   ARM E  5 posted downs on 5 scancodes, their ups sent only after the journal
//          ends -> 'y' keys 4-5: the presses are decided by EXPIRY, not by their
//          key-ups (which arrive after the journal).  Without the fix this arm
//          reads 0.  A press still pending when the journal ends (no event after
//          it to run the expiry) is counted on the next event -- an
//          undercount-safe FLOOR, not a loss, the same shape as Patch 307's
//          click counter.  So 4-5 of 5, never 0 and never over.
//   ARM F  nothing injected; raw input switched off and on with in_restart
//          mid-journal -> 'o 0' then 'o 1', hidcheck says partial, no faults.

exec cfg/test/_quiet.cfg

developer 1
log_developer 1
log_enable 1
log_dir logs
log_name p1424keys
cl_maxfps 100
cl_idlefps 0
sv_cheats 0
con_notifylines 0
con_notifytime 0.01
r_drawviewmodel 0
in_rawinput 1
in_rawinput_keyboard 0

wait 200
map bhop_eazy
waitmap 600
waitms 5000

echo P1424 state
in_rawinput
in_rawinput_keyboard

echo P1424 ARM A begin
in_journal_begin
waitms 3000
in_journal_note p1424-arm-A-control
in_journal_end data/p1424_A.hid
waitms 800

echo P1424 ARM B GO
in_journal_begin
waitms 7000
in_journal_note p1424-arm-B-postmessage
in_journal_end data/p1424_B.hid
waitms 800

echo P1424 ARM C GO
in_journal_begin
waitms 7000
in_journal_note p1424-arm-C-sendinput
in_journal_end data/p1424_C.hid
waitms 800

echo P1424 ARM D GO
in_journal_begin
waitms 4500
in_journal_note p1424-arm-D-repeatflag
in_journal_end data/p1424_D.hid
waitms 800

echo P1424 ARM E GO
in_journal_begin
waitms 2500
in_journal_note p1424-arm-E-noup
in_journal_end data/p1424_E.hid
echo P1424 ARM E ENDED
waitms 1500

echo P1424 ARM F begin
in_journal_begin
waitms 1000
in_rawinput 0
in_restart
waitms 1500
in_rawinput 1
in_restart
waitms 1500
in_journal_note p1424-arm-F-observe-toggle
in_journal_end data/p1424_F.hid
waitms 800

echo P1424 END
waitms 500
quit

