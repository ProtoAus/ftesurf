// Patch 385 harness TARGET A -- the body the viewer watches.  Predictions, arms
// and the run order: p385view.cfg's header.
//
// +forward at sv_maxspeed 260 and +left at cl_yawspeed 140: a ~106 u circle at a
// constant turn rate (its speed varies ~4% by itself -- AGENTS.md; nothing here
// gates on it).  Starts 5 s after the viewer; circles from about V+22 s and leaves
// at about V+207 s, after P385Two (the viewer's LV arm).
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p385own
cl_idlefps 0
cl_maxfps 250
vid_fullscreen 0
vid_width 800
vid_height 600
fs_missingwarn 0
set name "P385Own"
setinfo lobbycolor 1
setinfo lobbyfx 0
waitms 3000
connect 127.0.0.1:27685
waitms 12000
menu_restart
waitms 500
ui_close
waitms 500
cl_yawspeed 140
lookspring 0
centerview
waitms 1000
echo ^5p385own: circling
+forward
+left
waitms 185000
echo ^5p385own: leaving (the viewer's LV arm)
-forward
-left
disconnect
waitms 2000
quit
