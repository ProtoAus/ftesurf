// P426DCL -- a kept abandon and a successful load in one physics step (server:
// p426sv.cfg, zones cfg/test/p426.zones.json copied to
// maps/zones/local/surf_666.json -- DELETE IT AFTER -- stub `b65stub.py cert 8131`).
//
// Stringcmds run at sv.world.physicstime, which steps every sv_mintic (0.015),
// while a reply goes out for every frame that read a packet.  So a zone_goto
// abandon and a load sent one client frame apart (cl_maxfps 500: 2 ms) mostly
// share one `time`, yet the client renders the abandon's end in between and
// signs it.  2bc0cdf dropped a hold on `rec_end_at == time` after a successful
// rewind -- meant for the load's OWN kept abandon (Patch 426 review round 7).
// Measured at sv_mintic 0.015 the two shared a step in 1 trial of 21, so the
// server runs with `+set sv_mintic 0.1` to widen the step, not the claim.
//
// Sixteen trials (p426sv.cfg quits at 150 s): save mid-run (recording, before S2), walk past S2 (leg 1 posts),
// then `zone_goto` (a kept abandon, held with ticks 0) and, a frame later,
// `sl_load` (the save's recording rewinds cold and resumes).
//
// PRE-REGISTERED PREDICTIONS
//  2bc0cdf: some trials log `kept ...rec (1 posted stage(s))` then `timer:
//   receipt refused -- the run is still recording` (the hold dropped, the
//   resumed run live) -- those whose two commands shared a step.
//  Told apart by runid: every trial's kept abandon logs `timer: receipt
//   ...<its runid>.rcpt`.
// NOT DEMONSTRATED IF 2bc0cdf signs all sixteen (no two commands shared a step).
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p426dcl
developer 1
cl_idlefps 0
cl_maxfps 500
rate  2000000
drate 5000000
vid_fullscreen 0
set rec_enable 1
set rec_hid 1
set rec_upload 1
name "^3P426d"
waitms 6000
connect 127.0.0.1:27632
waitms 12000
set rec_terms 1

alias p426d_trial "cmd sl_delall; cmd zone_goto 0 90 0; waitms 2000; +forward; waitms 600; cmd sl_save; waitms 1400; -forward; waitms 400; cmd zone_goto 0 90 0; wait; cmd sl_load; waitms 1500; cmd zone_goto 0 90 0; waitms 1000"
echo ^5==== trial 1 ====
p426d_trial
echo ^5==== trial 2 ====
p426d_trial
echo ^5==== trial 3 ====
p426d_trial
echo ^5==== trial 4 ====
p426d_trial
echo ^5==== trial 5 ====
p426d_trial
echo ^5==== trial 6 ====
p426d_trial
echo ^5==== trial 7 ====
p426d_trial
echo ^5==== trial 8 ====
p426d_trial
echo ^5==== trial 9 ====
p426d_trial
echo ^5==== trial 10 ====
p426d_trial
echo ^5==== trial 11 ====
p426d_trial
echo ^5==== trial 12 ====
p426d_trial
echo ^5==== trial 13 ====
p426d_trial
echo ^5==== trial 14 ====
p426d_trial
echo ^5==== trial 15 ====
p426d_trial
echo ^5==== trial 16 ====
p426d_trial
waitms 2000
echo ^5==== P426d CL done ====
quit

