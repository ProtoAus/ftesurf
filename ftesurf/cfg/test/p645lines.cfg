// Private overlay (tools/runlines_smoke.py --client <an engine with Patch 645>).
// Patch 645: run lines, their marks and the HUD graph's curves are drawn by the engine
// (lines_draw, lines_segment, lines_strip2d) where QC drew them a segment at a time.
// The picture must not change, so each view is shot three times: the QC way
// (hud_lines_native 0), the engine's, and the QC way again -- the two QC frames
// either side show the view held still across the engine's.  tools/test_p645lines.py
// compares the pixels and each mode's own status lines.
// Part 1 rides a paused replay with the same run in all eight board slots, then the
// replay's own line alone (its playhead is inside it), then one board slot alone.
// Part 2 is the live line after a short walk off surf_dune's start (the fall ends the
// run and puts the player back at the start, looking along the line; its last sample
// has no LOD tables yet).
cfg_save_auto 0
log_enable 1
log_dir logs
log_name runlines_smoke
con_notifytime 0
con_notifylines 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
vid_winmaximize 0
vid_width 1600
vid_height 900
vid_conautoscale 1
sv_public 0
set run_resume 0
waitms 2000
map surf_voyager
waitmap 60
waitms 5000
wait 4
menu_restart
ui_close
set hud_scale 2
set gl_conback 0
waitms 1000
replay cfg/test/p492voy.rec
waitms 2500
replay pause
replay seek 20
waitms 1500
wait 4
scores lineat 1 cfg/test/p492voy.rec
waitms 700
scores lineat 2 cfg/test/p492voy.rec
waitms 700
scores lineat 3 cfg/test/p492voy.rec
waitms 700
scores lineat 4 cfg/test/p492voy.rec
waitms 700
scores lineat 5 cfg/test/p492voy.rec
waitms 700
scores lineat 6 cfg/test/p492voy.rec
waitms 700
scores lineat 7 cfg/test/p492voy.rec
waitms 700
scores lineat 8 cfg/test/p492voy.rec
waitms 700
waitms 2500
echo ==== P645 VIEW window ====
set hud_lines_order 4
set hud_lines_nums 2
set hud_linegraph 1
set hud_lines_native 0
waitms 2500
wait 4
echo P645 window qc
scores lines
lines native
