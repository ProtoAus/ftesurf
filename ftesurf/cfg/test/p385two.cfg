// Patch 385 harness TARGET B -- the second body, for MOUSE1/MOUSE2 and the
// target-leaves arm.  Stands where it spawns (a resting body stays BP_LIVE on
// its 0.5 s keepalives).  Starts with p385own.cfg; leaves at about V+186 s, while
// the viewer watches it (p385view.cfg's LV arm), and ~20 s before P385Own.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p385two
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
vid_width 800
vid_height 600
fs_missingwarn 0
set name "P385Two"
setinfo lobbycolor 3
setinfo lobbyfx 0
waitms 3000
connect 127.0.0.1:27685
waitms 12000
menu_restart
waitms 500
ui_close
waitms 165000
echo ^5p385two: leaving (the viewer's LV arm)
disconnect
waitms 2000
quit
