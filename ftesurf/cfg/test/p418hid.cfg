//       a number the client could not have known in advance.
//
//   THE TWO FAILURES, both worth keeping:
//   - `serverinfo fs_ul` was published as `cvar(...) ? 1 : 0`, so an operator
//     asking for journals at 2 told every client 1 and got sidecars.  The key
//     carries the value now.
//   - The client compared `serverkey("fs_ul") == "1"` for the sidecar, so
//     turning journals ON turned sidecars OFF.  Compared as a number now.
//   - And a HARNESS trap worth stating: `set run_evidence_ul 2` inside the
//     server's cfg is TOO LATE.  The key is published at map init, which runs
//     before the `+exec`, so the value has to be on the command line
//     (`+set run_evidence_ul 2`) or the server publishes the default and the
//     client never keeps a journal.

