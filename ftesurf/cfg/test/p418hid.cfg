// Patch 418 -- BOTH FILES: the angle sidecar AND the raw input journal.
//
// `run_evidence_ul 2` on the server (p418hidsv.cfg) is the operator asking for
// the journal as well.  It is a separate value rather than the same one because
// the two cost different amounts BY A FACTOR OF THIRTY-EIGHT: measured, a
// sidecar is 2.93 KB per second of run (20 KB for 7 s) and a journal is 110 KB
// (8.38 MB for 76 s).  And because on a lobby the journal is otherwise
// discarded outright -- Rec_HidEnd keeps one only for a PB, and a lobby has no
// PBs.
//
// WHAT THIS ARM CANNOT SHOW, because a seven-second bhop run is not the case
// that matters: at 110 KB/s the client's own 4 MiB cap refuses any journal from
// a run past ~38 seconds, and even one that fits is 17,000 round trips of 768
// bytes -- sixteen minutes at 30 ms RTT.  `run_evidence_ul 2` works here and on
// a LAN; it is not a way to collect journals from a public lobby.  See the
// transport arithmetic in engine/client/cl_receipt.c.
//
// An upload is one stream through one netchan, so the two files go one after
// the other: the server asks for the second when the first has landed
// (SV_NextUpload's completion branch), and the client sends whichever of its
// two armed files has not gone yet.
//
// Start the server first, from C:\FTESurf:
//   C:\FTEQuake\fteqwsv64.exe +set sv_port 27696 +set sv_public 0 +set run_evidence_ul 2
//     +set log_enable 1 +set log_dir logs +set log_name p418hidsv
//     +map bhop_eazy +exec cfg/test/p418hidsv.cfg
//
// PRE-REGISTERED PREDICTIONS
//  H1  the client stages TWO files under data/staged/ for this run's nonce:
//      <nonce>.view and <nonce>.hid.
//  H2  the server ends up with BOTH data/evidence/bhop_eazy/<runid>.view and
//      <runid>.hid, and its log shows two `upload completed` lines.
//  H3  the receipt's `signed hid <sha> <len> 1` matches the uploaded .hid
//      exactly -- `kept 1` this time, because the journal was written rather
//      than discarded -- and `signed view` matches the uploaded .view.
//  H4  hidcheck.py reads the uploaded journal and reports the run's nonce note
//      in it: the file that arrived is the journal of the run that signed it.
// FALSIFIED IF either file is missing, if a digest disagrees, or if the second
//   upload never starts (which is what a single-slot arm would look like).
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p418hid
developer 1
cl_idlefps 0
cl_maxfps 100
set rec_enable 1
set rec_hid 1
set rec_upload 1
name "^3P418"

waitms 6000
connect 127.0.0.1:27696
waitms 12000

echo ================================ P418 HID -- aim and start
cmd zone_goto 0
waitms 1500
setpos -352 -352 144 0 335.3 0
waitms 1500
+jump
waitms 700
-jump
waitms 2000
cmd timer

echo ================================ P418 HID -- fly to the end zone
noclip
waitms 500
+forward
waitms 1500
waitms 2900
waitms 2000
-forward
waitms 1500
cmd timer
waitms 3000

echo ================================ P418 HID done
waitms 1000
quit

