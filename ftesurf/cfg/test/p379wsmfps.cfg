// P379WSMFPS -- replay smoothing on REAL frames: the frame clock and the yaw.
//
// Companion to p379wsm.cfg (read its header first).  Run VISIBLE, not
// minimized: a minimized window is not paced like a played one.  cl_maxfps is
// 100 while the map loads (AGENTS.md: uncapped fps starves async loads), then
// 250.  `replay trace frames 1500` prints the next 1500 rendered frames as
//   wtf dtcl dtfr T ez yaw turnrate rate paused
// dtcl = the cltime delta, dtfr = clframetime (host_frametime).  The build is
// set by the wrapper, which names the log (delete it first; the engine appends):
//   379: ./ftesurf64.exe +exec cfg/test/p379wsmfps_new.cfg -> logs/p379wsmfps.log
//   378: ./ftesurf64.exe +exec cfg/test/p379wsmfps_ctl.cfg -> logs/p379wsmfpsctl.log
// Read each with (repo root; a *ctl* log is judged as the control):
//   python tools/watchtrace.py --analyse ftesurf/logs/p379wsmfps.log     (exit 0)
//   python tools/watchtrace.py --analyse ftesurf/logs/p379wsmfpsctl.log  (exit 0)
// `replay trace frames 0` after each arm closes its block if fewer frames came
// than asked (378 does not close one at `replay stop`); a short block says so.
//
// PRE-REGISTERED (NEW 379 / OLD 378):
// P8 frame clock, over playing frames.
//    (a) cv of (dT / rate) / clframetime.  NEW < 0.01: 379 advances by
//    clframetime and banks the cltime difference (cl_main.c:7572's pacer
//    moves them apart by `spare`, up to 0.5/maxfps), paying it once past half
//    a frame.  This says the substitution happened, not that it is right; it
//    fails honestly if the pacer's spare nears half a frame (the analyser
//    prints |dtcl - dtfr| p99 beside it).  OLD recorded: the pacer's jitter
//    plus cltime's float32 step.
//    (b) the advance against the cltime clock, sum(dT / rate) / sum(dtcl) - 1:
//    |drift| <= 0.5 % on BOTH builds.  A clock that double-counts, is
//    gamespeed-scaled, or chooses per frame between the two fails it: in the
//    frame model with spare up to half a frame, the pre-review per-frame
//    choice drifted +0.96..+1.35 %, the banked clock 0.00 %.  With spare
//    under a tenth of a frame the two are identical.
//    NO CONTROL CAN FAIL here: at a fresh map cltime is 20-60 s, where its
//    float32 step (4 us) is far below the design's 0.24 ms-after-an-hour case.
//    What the change buys at long uptimes is NOT verified by this harness.
// P1 on real frames: 1x plays kitsune 15..21 s (turns and the 18.0 snap),
//    0.25x plays 16.5..18 s (turning throughout, into the snap):
//    view 1x      NEW R ~1.5, zero-step 0  / OLD zero-step ~0 (not gated, as in
//                 p379wsm: a frame spans more than one .view line)
//    view 0.25x   NEW R <= 1.5, zero-step < 0.01 / OLD zero-step >= 0.5
//    noview 1x    NEW R <= 1.5, zero-step < 0.01 / OLD R >= 3, zero-step >= 0.6
//    noview 0.25x NEW R <= 1.5, zero-step < 0.01 / OLD R >= 12, zero-step >= 0.9
//    (OLD's exact numbers depend on the achieved fps: 250 is asked for, and the
//    wtf dtfr column says what was delivered.)
// turnrate is printed for the eye (HUD_UpdateTurn reads VF_ANGLES, so a smooth
// yaw shows as a smooth readout); it is the previous frame's value.
//
// RESULTS: (integrator: write them here, failures included)
//
// RESULT (2026-09-19, visible window): AS REGISTERED.
//   379: P1 R 1.01-1.04, zero-step 0 on 503-761 real frames per arm; P8 cv
//   0.0007-0.0032, drift -0.027..+0.001 %; P10 48 ms.
//   378: P1 R 3.18-12.82, zero-step 0.52-0.91; P8(a) recorded 0.0021-0.0318,
//   P8(b) drift within 0.002 % (cannot fail, as registered).

developer 1
log_developer 1
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
set vid_vsync 0
sv_cheats 1
fs_missingwarn 0

wait 200
echo ^5=== p379wsmfps: replay smoothing on real frames ===

map surf_kitsune
waitmap 1800
waitms 2500
// CSQC-registered: set after the map, or registercvar resets it (AGENTS.md)
set hud_watch_skipidle 0
set hud_watch_path 0

echo ^5=== p379wsmfps: view ===
replay data/runs/surf_kitsune/main/0009998_pb.rec
waitms 800
replay pause
replay status
cl_maxfps 250
waitms 1000

echo ^5--- p379wsmfps: view 1x ---
replay seek 15
replay speed 1
replay trace frames 1500
replay play
waitms 7500
replay pause
replay trace frames 0

echo ^5--- p379wsmfps: view 0.25x ---
replay seek 16.5
replay speed 0.25
replay trace frames 1500
replay play
waitms 7500
replay pause
replay trace frames 0
replay stop
cl_maxfps 100
waitms 400

echo ^5=== p379wsmfps: noview ===
replay data/runs/surf_kitsune/main/0009998_pb.rec noview
waitms 800
replay pause
replay status
cl_maxfps 250
waitms 1000

echo ^5--- p379wsmfps: noview 1x ---
replay seek 15
replay speed 1
replay trace frames 1500
replay play
waitms 7500
replay pause
replay trace frames 0

echo ^5--- p379wsmfps: noview 0.25x ---
replay seek 16.5
replay speed 0.25
replay trace frames 1500
replay play
waitms 7500
replay pause
replay trace frames 0
replay stop
cl_maxfps 100

echo ^5=== p379wsmfps: done ===
waitms 400
quit
