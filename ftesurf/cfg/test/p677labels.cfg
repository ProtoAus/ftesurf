// Isolated tools/runlines_smoke.py overlay; tools/test_p677labels.py --write supplies hops.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name runlines_smoke
con_notifytime 0
con_notifylines 0
cl_idlefps 0
cl_maxfps 100
set vid_width 1280
set vid_height 720
set vid_fullscreen 0
set vid_winmaximize 0
vid_restart
waitms 2000
map surf_voyager
waitmap 60
waitms 4000
menu_restart
ui_close
set fs_missingwarn 0
set hud_watch_info 0
set hud_linegraph 0
set hud_lines_edge 0
set hud_watch_skipidle 0
set hud_watch_path 1
set hud_lines_board 1
set hud_lines_order 0
set hud_lines_own 0
set hud_lines_others 0
set hud_lines_marks 1
set hud_lines_land 1
set hud_lines_leave 1
set hud_lines_jump 1
set hud_lines_stitch 1
set hud_lines_nums 2
set hud_lines_speed 1
set hud_lines_energy 1
set hud_lines_names 1
set hud_lines_vz 0
set hud_lines_delta 0
set hud_lines_time 0
set hud_lines_units 1
set hud_lines_label_far 0
set hud_lines_numsize 18
set hud_lines_size 8
set hud_lines_declutter 2
set hud_lines_gap 24
set hud_watch_path_far 10000
set hud_watch_path_alpha 1
set hud_lines_demo 0            // Patch 745: the whole demo line, as before its replay window
replay cfg/test/runlines_peaks.rec
waitms 1500
replay pause
replay seek 0.3
waitms 1000
echo ==== BOTH ====
replay marks 0
replay marktrace 2
waitms 500
screenshot p677_both.png
set hud_lines_speed 0
echo ==== ENERGY ====
replay marktrace 2
waitms 500
screenshot p677_energy.png
set hud_lines_speed 1
set hud_lines_energy 0
echo ==== SPEED ====
replay marktrace 2
waitms 500
screenshot p677_speed.png
set hud_lines_energy 1
replay stop
replay cfg/test/p677hop.rec
waitms 1500
replay pause
replay seek 0
waitms 800
echo ==== HOP ====
replay marks 0
replay seq
replay marktrace 2
waitms 500
screenshot p677_hop.png
set hud_lines_jump 0
echo ==== JUMPOFF ====
replay marktrace 2
waitms 500
set hud_lines_jump 1
replay stop
replay cfg/test/p677hop_mom.rec
waitms 1500
replay pause
replay seek 0
waitms 800
echo ==== IMPORT ====
replay marks 0
replay seq
replay marktrace 2
waitms 500
screenshot p677_import.png
scores lineat 1 cfg/test/p677hop.rec
waitms 2000
echo ==== BOARD ====
replay marks 1
replay marktrace 2
waitms 500
screenshot p677_board.png
scores lines clear
replay stop
replay cfg/test/runlines_peaks.rec
waitms 1500
replay pause
replay seek 0.3
waitms 800
set hud_lines_names 0
set hud_lines_units 0
echo ==== UNITZERO ====
replay marktrace 2
waitms 500
screenshot p677_unitzero.png
set hud_lines_nums 0
echo ==== NUMSOFF ====
replay marktrace 2
waitms 500
screenshot p677_numsoff.png
set hud_lines_marks 0
echo ==== MARKSOFF ====
replay marktrace 2
waitms 500
echo RUNLINES COMPLETE
quit
