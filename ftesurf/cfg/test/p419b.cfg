// Patch 419 -- IS THE STARTING OFFSET PREDICTABLE?  Arm B (server on 27697).
//
// `run_startjitter 2` moves the start box by up to two units so a run cannot be
// replayed from a known start.  The offset is drawn with QuakeC `random()`,
// which is `(rand()&0x7fff)/0x8000` with `rand()` seeded ONCE from `time(0)` at
// COM_Init (common.c) -- so two servers that boot in the same second draw the
// same stream, and the `startjit` line in their recordings is the same pair of
// numbers.  The run nonce (Patch 416) is mixed from the same stream.
//
// This arm and p419a.cfg are the same run against two servers STARTED IN THE
// SAME SECOND on two ports.  Start them together, from C:\FTESurf:
//   C:\FTEQuake\fteqwsv64.exe +set sv_port 27696 +set sv_public 0 +set sv_cheats 1
//     +set rec_enable 1 +set rec_runarchive 1 +set developer 1
//     +set log_enable 1 +set log_dir logs +set log_name p419sva +map bhop_eazy &
//   C:\FTEQuake\fteqwsv64.exe +set sv_port 27697 ... +set log_name p419svb +map bhop_eazy &
// then this cfg, copy the .rec away, then p419b.cfg.
//
// PRE-REGISTERED PREDICTIONS (before the fix)
//  J1  both recordings carry `startjit 2.0000 <dx> <dy> 0.0000` with THE SAME
//      dx and dy.  That is the leak: the offset is a pure function of the boot
//      second, and a player who knows it knows where the box will be.
//  J2  the two `nonce` lines DIFFER anyway -- the seed mixes sv_port, which the
//      two servers do not share.  Stated so the arm cannot be read as "the
//      nonce is fine because it differs": it differs for a reason that has
//      nothing to do with entropy.
// FALSIFIED IF the two startjit offsets differ on the pre-fix build; then the
//   stream is not shared and the leak is somewhere else.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p419b
developer 1
cl_idlefps 0
cl_maxfps 100
set rec_enable 1
set rec_hid 0
set rec_upload 0
name "^3P419B"

waitms 5000
connect 127.0.0.1:27697
waitms 12000

echo ================================ P419 B -- cross the start line
cmd zone_goto 0
waitms 1500
setpos -352 -352 144 0 335.3 0
waitms 1500
+jump
waitms 700
-jump
waitms 2500
cmd timer
waitms 1500

echo ================================ P419 B -- fly to the end zone so the .rec is written
noclip
waitms 500
+forward
waitms 1500
waitms 2900
waitms 2000
-forward
waitms 1500
cmd timer
waitms 2500

echo ================================ P419 B done
quit

// RESULT: see p419a.cfg -- this is the second half of the same arm, and
// the two headers are compared there.
