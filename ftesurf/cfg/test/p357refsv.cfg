// P357REFSV -- server half of p357ref (the board refreshes after a finish).
// Run from C:\FTESurf:  C:\FTEQuake\fteqwsv64.exe +set sv_port 27631 +set sv_public 0
//   +set lobby_master "http://127.0.0.1:8131" +exec cfg/test/p357refsv.cfg
// against `python surfd/p357board.py 8131 [seed N] [getdelay S]`.  Client: p357refcl.cfg.
log_enable 1
log_dir logs
log_name p357refsv
developer 1
sv_cheats 1
sv_guidkey "ftesurf-p357-probe"
sv_maxrate         0
sv_maxdownloadrate 0
set lobby_master_key  "stub-key-not-a-real-one"
set lobby_master_rate 30
map bhop_eazy
// arm O: one synthetic submit (player = this client) for the online half
waitms 70000
set lobby_run_probe 1
waitms 60000
quit
