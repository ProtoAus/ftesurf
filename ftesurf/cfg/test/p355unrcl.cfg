// P355UNRCL -- client half of p355unr (server: p355unrsv.cfg).
//
// PREDICTIONS (pre-registered), stub in `cert` mode with a 2 s delay:
//   ARM R (probe 1, ranked): *wrank = "bhop_eazy 0 0 1234 1 3 17 1 20000 0";
//     `results wrank 0 0 1234 256` state 1 rank 3 of 17 tier 0 stored 1,
//     draws "#3 of 17"; log has "your time is up: #3 of 17".
//   ARM U (probe 3, demoted): *wrank ends "... 1 3 17 1 20000 1";
//     `results wrank 0 0 1234 2304` state 5 rank 0 of 0 tier 1 stored 1,
//     draws "--  unranked: input mode"; log has "board: unranked (input mode)"
//     as a CHAT line (Chat_BuildLine), and NO "your time is up" after it.
//   Before each answer: state 0, draws "...  asking the leaderboard".
//   Off-by-one control: `results wrank 0 0 1235` state -1 in every sample.
// CONTROL, stub in `rank` mode (old surfd, no tier): ARM U reads state 1,
//   rank 3 of 17 (7-field answer + the 3 pending zeros kept -> 10 fields, tier 0).
// FALSIFIER: U drawing any "#", R drawing "unranked", or the 1235 subject matching.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p355unrcl
rate  2000000
drate 5000000
waitms 6000
connect 127.0.0.1:27631
waitms 12000
alias p355s "echo ^5---- sample ----; results wrank 0 0 1234 2304; results wrank 0 0 1235"
p355s
waitms 3000
p355s
waitms 3000
p355s
waitms 3000
p355s
waitms 3000
p355s
waitms 3000
p355s
waitms 3000
p355s
waitms 3000
p355s
waitms 3000
p355s
waitms 3000
p355s
waitms 3000
p355s
waitms 3000
p355s
waitms 3000
p355s
waitms 3000
p355s
waitms 3000
p355s
waitms 3000
p355s
waitms 3000
quit

