// MS1CL -- Multi-Session on a lobby, client half (server: ms1sv.cfg).
//
// Arm R: walk 2 s, `disconnect` (ClientDisconnect parks, why drop), reconnect,
//   offer, `cmd ms_resume` (F2's path), restore R -> countdown C -> resumed,
//   walk to the finish.
// Arm X: walk 2 s, `disconnect`, reconnect, `say !discard`.
// PREDICTIONS: server log "parked ... (drop, recording stream)" per arm; the
//   client gets the offer line on each reconnect; R: "restoring the recording",
//   "run resumed at T -- session 2", then the finish submits (flags carry 16384);
//   the kept .rec is v10, `pauses drop`, `sessions 1`, 0 faults, and it lands in
//   data/runs (not evidence).  X: "paused run dropped (you dropped it)" and no
//   slot files left; X posted stage 1, so its slot's run.rec is kept in
//   data/evidence -- the ONLY evidence file (R's slot continued in its run).  Part files are keyed by port (data/parts/p27631-*.rec) and
//   none is left behind.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name ms1cl
developer 1
cl_idlefps 0
cl_maxfps 100
rate  2000000
drate 5000000
vid_fullscreen 0
waitms 6000
connect 127.0.0.1:27631
waitms 12000
set rec_terms 1
echo ^5==== R: run, drop ====
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 2000
-forward
waitms 300
cmd timer
disconnect
waitms 3000
echo ^5==== R: reconnect, resume ====
connect 127.0.0.1:27631
waitms 12000
cmd ms_resume
waitms 3000
cmd timer
+forward
waitms 5000
-forward
waitms 3000
cmd timer
echo ^5==== X: run, drop, discard ====
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 2000
-forward
waitms 300
disconnect
waitms 3000
connect 127.0.0.1:27631
waitms 12000
say !discard
waitms 1000
cmd ms_resume
waitms 1000
echo ^5==== done ====
disconnect
waitms 500
quit

// RESULT (2026-09-19): as predicted after one fix.  R: parked on the drop
//   (stream), offered on reconnect, restored, resumed, finished; submitted with
//   flags 16384; the .rec is v10, `pauses drop`, 2 stage posts (stage 1 before
//   the pause, stage 4 after -- a box exit after the resume starts a clean
//   stage), 0 faults.  X: dropped on !discard, its slot kept as evidence.  First
//   cut: R's consumed slot was ALSO copied to data/evidence (the posted-stages
//   keep ran at apply); the recording continues in the run, so apply no longer
//   keeps it.  No part or slot files left behind.
