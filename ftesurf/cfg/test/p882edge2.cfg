// Patch 882/890 edge arm, phase 2: replay p882edge.cfg's attempt and three edited copies.
//   python tools/runlines_smoke.py ftesurf/cfg/test/p882edge2.cfg --mount --timeout 600 \
//     --put data/edge.rec=<phase 1's 0-fail.rec> --put data/edge_nopm.rec=<it, `pm` rows removed> \
//     --put data/edge_pmfwd.rec=<its pm row's momlimit=0 made 1> --put data/edge_noland.rec=<it, landticks removed from the seeds> \
//     --put data/kit.rec=<a finished kitsune run> --put data/kit_ent.rec=<it with `entfile 4242`> \
//     --put data/kit_bad.rec=<it with `entfile x1`> \
//     --ssqc <qwprogs> --csqc <csprogs> --mqc <menu> --client <exe> --output-dir <task root>/artifacts
// edge.rec      EXACT, the open loop never past 1u, and a `pm` row whose momlimit is 0.
// edge_nopm     the replay keeps momlimit 16 after the corridor: the open loop diverges at the
//               first jump outside (the control for the `pm` row being applied).
// edge_pmfwd    its `pm` row says momlimit 1 (forward): the replay cuts the recorded forwardmove and the
//               open loop diverges -- the run is airborne, so this, not a jump, shows `pm` rows apply.
// edge_noland   "carried state incomplete" -- not exact at mover 10 without landticks.
// kit / kit_ent pm_verify: kit's verdict (no `entfile` = 0, kitsune has no fix: MATCH), then for
//               kit_ent "a different entity lump" and for kit_bad "an unreadable `entfile`".
cfg_save_auto 0
log_enable 1
log_dir logs
log_name runlines_smoke
developer 0
set rec_enable 0
set rec_stream 0
set run_resume 0
waitms 3000

map surf_journeys
waitmap 120
waitms 4000
echo ==== EDGE pm_recsim ====
pm_recsim data/edge.rec
waitms 3000
echo ==== EDGE_NOPM pm_recsim ====
pm_recsim data/edge_nopm.rec
waitms 3000
echo ==== EDGE_PMFWD pm_recsim ====
pm_recsim data/edge_pmfwd.rec
waitms 3000
echo ==== EDGE_NOLAND pm_recsim ====
pm_recsim data/edge_noland.rec
waitms 3000

map surf_kitsune
waitmap 120
waitms 4000
echo ==== KIT pm_verify ====
pm_verify data/kit.rec
waitms 3000
echo ==== KIT_ENT pm_verify ====
pm_verify data/kit_ent.rec
waitms 3000
echo ==== KIT_BAD pm_verify ====
pm_verify data/kit_bad.rec
waitms 3000
echo RUNLINES COMPLETE
quit
