// P376CL -- the mouse counts ride the usercmd (client half; server p376sv.cfg).
// One clean finish per client binary, each with synthetic mouse events on the
// input ring mid-run (in_journal_synth: the ring, not the OS, so no mouse needed).
//   H  the 376 client (ftesurf64_p376.exe)
//   K  a 376 client built with a TEST HOOK (never committed) that adds one count
//      to each nonzero x delta at IN_MoveMouse's entry -- momentum.dll's shape
//      (ftesurf64_p376hook.exe)
//   O  a client before 376 (ftesurf64.exe)
//   cd C:\FTESurf; <client exe> +exec cfg/test/p376cl.cfg   (one run per binary)
// PRE-REGISTERED
//   H  `mc` lines, ring = read on every one; `cmd timer`: 0 disagreements;
//      pm_verify PASS with "counts N record(s): ... what the view read".
//   K  `mc` lines whose read x exceeds ring x once the synth events land;
//      `cmd timer` counts them; pm_verify HOLD "counts: the view read mouse
//      counts the device did not send".
//   O  no `mc` line; pm_verify "counts none"; PASS.
// FALSIFIED IF H disagrees anywhere, K agrees everywhere, or O writes an `mc`.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p376cl
developer 1
cl_idlefps 0
cl_maxfps 100
rate  2000000
drate 5000000
vid_fullscreen 0
waitms 6000
connect 127.0.0.1:27631
waitms 12000
set rec_terms 1
echo ^5==== run: synth mid-run, finish ====
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 1500
in_journal_synth 60
waitms 5000
-forward
waitms 2500
cmd timer
echo ^5==== done ====
waitms 1000
quit

