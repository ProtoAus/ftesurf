// Patch 874 cost arm: bhop_canals (235 rope spans, the library's most), noclip at its densest
// rope cell (16950 -8972 311), four headings; each an interleaved vbsp_ropes 1/0/1/0 with an
// r_budget_dump per 2 s window at a fixed camera.  Grade the CSQC row on against off.
//   python tools/runlines_smoke.py ftesurf/cfg/test/p874perf.cfg --mount --timeout 600 \
//     --ssqc <qwprogs> --csqc <csprogs> --mqc <menu> --output-dir <task root>/artifacts
cfg_save_auto 0
log_enable 1
log_dir logs
log_name runlines_smoke
con_notifytime 0
cl_idlefps 0
cl_maxfps 0
vid_vsync 0
vid_fullscreen 0
vid_width 1280
vid_height 720
sv_public 0
set run_resume 0
developer 1
log_developer 1
scr_sshot_type png
waitms 1500

map bhop_canals
waitmap 120
waitms 8000
menu_restart
ui_close
waitms 500
r_budget 3
r_budget_csqc 1
noclip
setpos 16950 -8972 311 0 0 0
waitms 2000
screenshot p874perf_y0
waitms 2500
echo ==== AB y0 on-1 ====
vbsp_ropes 1
waitms 2000
r_budget_dump
echo ==== AB y0 off-1 ====
vbsp_ropes 0
waitms 2000
r_budget_dump
echo ==== AB y0 on-2 ====
vbsp_ropes 1
waitms 2000
r_budget_dump
echo ==== AB y0 off-2 ====
vbsp_ropes 0
waitms 2000
r_budget_dump
vbsp_ropes 1
setpos 16950 -8972 311 0 90 0
waitms 2000
screenshot p874perf_y90
waitms 2500
echo ==== AB y90 on-1 ====
vbsp_ropes 1
waitms 2000
r_budget_dump
echo ==== AB y90 off-1 ====
vbsp_ropes 0
waitms 2000
r_budget_dump
echo ==== AB y90 on-2 ====
vbsp_ropes 1
waitms 2000
r_budget_dump
echo ==== AB y90 off-2 ====
vbsp_ropes 0
waitms 2000
r_budget_dump
vbsp_ropes 1
setpos 16950 -8972 311 0 180 0
waitms 2000
screenshot p874perf_y180
waitms 2500
echo ==== AB y180 on-1 ====
vbsp_ropes 1
waitms 2000
r_budget_dump
echo ==== AB y180 off-1 ====
vbsp_ropes 0
waitms 2000
r_budget_dump
echo ==== AB y180 on-2 ====
vbsp_ropes 1
waitms 2000
r_budget_dump
echo ==== AB y180 off-2 ====
vbsp_ropes 0
waitms 2000
r_budget_dump
vbsp_ropes 1
setpos 16950 -8972 311 0 270 0
waitms 2000
screenshot p874perf_y270
waitms 2500
echo ==== AB y270 on-1 ====
vbsp_ropes 1
waitms 2000
r_budget_dump
echo ==== AB y270 off-1 ====
vbsp_ropes 0
waitms 2000
r_budget_dump
echo ==== AB y270 on-2 ====
vbsp_ropes 1
waitms 2000
r_budget_dump
echo ==== AB y270 off-2 ====
vbsp_ropes 0
waitms 2000
r_budget_dump
echo RUNLINES COMPLETE
quit
