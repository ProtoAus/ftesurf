// P395STAGE -- Patch 395, the live half: a stage row whose time was set inside a main
// run (surfd schema 6 `run`) opens that run's recording at the stage.  POST-DEPLOY
// ONLY: surfd at schema 6 and one cron sweep done (the evidence rows).  Listen server
// on each map, lobby_dir the Pi's surfd; the online terms must be accepted.  Run with
// +set log_name.  NOT RUN at commit time (written with the client half).
//
// PRE-REGISTERED
//  S1 surf_aura stage 2: Kap's row in board_status ends `watch run 18`;
//     `board_replay row 0` prints `row 0 is stage 2 of run 18` and ready with
//     data/online/surf_aura/main/04m08.325s_kap_r18.rec (the single-wildcard hint);
//     `scores olpick 0` opens it and prints the p395win A1 line
//     `replay: stage 2 window 7.8750..17.2350 s from 6.8750 (ticks 525..1149, stagepost)`;
//     at 4x, one `window end 17.2350 -- paused`.
//  S2 surf_aser stage 2: the row reads `watch run <E1>` (an evidence row); olpick 0
//     downloads data/online/surf_aser/main/02m03.930s_kap_dnf_r<E1>.rec, the open line
//     ends `(abandoned)`, window 27.5700..34.3800 from 26.5700 (ticks 1838..2292, stagepost).
//  S3 surf_how2surf stage 7: row 0 Kap `run 36`, row 1 BoroBongo `run <E2>`; olpick 1
//     gives .../surf_how2surf/main/02m24.195s_borobongo_r<E2>.rec and
//     `stage 7 window 128.1750..144.1950` (ticks 8545..9613).
//  S4 bhop_eazy stage 3: `run 16`, window as p395win A4.
// CONTROLS: the pre-395 client reads `none` with no `run` and olpick is an unknown
//  word (no window); the 395 client against a pre-schema-6 surfd reads `none` too.
cfg_save_auto 0
log_enable 1
log_dir logs
developer 1
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0
set run_resume 0
sv_public 0
sv_port 27677
set lobby_dir "http://192.168.1.102:8084"

wait 200
map surf_aura
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 1000
set hud_watch_skipidle 0
echo ^5=== p395stage S1 ===
scores open
scores tab online
scores leg 2
scores refresh
waitms 5000
board_status
board_replay row 0
waitms 3000
scores olpick 0
waitms 3000
replay status
replay speed 4
waitms 6000
replay status
replay stop
scores close
waitms 500

map surf_aser
waitmap 1800
waitms 3000
set hud_watch_skipidle 0
echo ^5=== p395stage S2 ===
scores open
scores tab online
scores leg 2
scores refresh
waitms 5000
board_status
scores olpick 0
waitms 8000
replay status
replay stop
scores close
waitms 500

map surf_how2surf
waitmap 1800
waitms 3000
set hud_watch_skipidle 0
echo ^5=== p395stage S3 ===
scores open
scores tab online
scores leg 7
scores refresh
waitms 5000
board_status
scores olpick 1
waitms 8000
replay status
replay stop
scores close
waitms 500

map bhop_eazy
waitmap 1800
waitms 3000
set hud_watch_skipidle 0
echo ^5=== p395stage S4 ===
scores open
scores tab online
scores leg 3
scores refresh
waitms 5000
board_status
scores olpick 0
waitms 3000
replay status
replay stop
scores close
echo ^5=== p395stage DONE ===
waitms 500
quit
