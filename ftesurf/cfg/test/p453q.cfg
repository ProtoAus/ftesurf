// P453Q -- Patch 453: air control, graded the way the strafe bar grades it.
//
// `replay colours <slot> <stride>` prints ln_q -- the grade the colour is drawn
// from -- for every stride-th point, plus the movement settings it was measured
// against.  tools/p453q.py reimplements sh_strafe.qc's closed forms and the
// bar's regime choice (ground / ramp / air, and its several no-answer cases)
// from the documented rules, and compares sample by sample.
//
// WHAT IT CANNOT CHECK, said plainly: the movement settings come from the
// client, because the .rec does not carry them -- a v9 `pmpin` block would, and
// a later patch could read it.  So this grades the ARITHMETIC and the REGIME
// CHOICE, which is where a wrong answer would look plausible, and not whether
// the right cvars were read.
//
// PRE-REGISTERED
//  Q1 every sampled point's grade matches the file's own, to 0.01, and the two
//     agree about WHICH points have no answer at all.
//  Q2 the line is not uniformly grey: most sampled points carry a grade, or Q1
//     would pass by both sides refusing to answer.
//
// RESULT (2026-09-27, aesthetic pb at t=40).  Q1 and Q2 held: 5321 points
//  graded, 5141 agreed, 180 'no answer' on both sides, 0 wrong.
//
// MUTATIONS.  The ramp graded against the flat target -> 142 of 333 wrong.
//  'No answer' painted as zero -> 11 wrong, all of them shoulder cases.  The
//  ground hold ignored -> 1 wrong, a one-tick bhop landing graded as a grounded
//  phase.  The yaw not wrapped -> 6 wrong, EXACTLY the number of times this
//  file's yaw crosses 180.
//
// AND THAT LAST ONE MISSED FIRST TIME, at stride 16: six wraps in 5321 samples
//  means a sparse dump never lands on one, so the arm passed a build with the
//  wrap handling deleted.  Stride 1 is the fix, and it costs a 5000-line log.
//  An arm that misses the only samples where a term matters is not measuring
//  that term -- the same shape as p449win's W2, which graded "narrower" when it
//  needed to grade "which edge moved".
log_enable 1
log_dir "logs"
log_name p453q
developer 0
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0
set run_resume 0
sv_public 0
sv_port 27711
set lobby_dir ""
set hud_watch_skipidle 0
set hud_watch_path 1

wait 200
map surf_aesthetic
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 1000

replay data/runs/surf_aesthetic/main/0005191_pb.rec
waitms 1500
replay pause
replay seek 40
waitms 1200

echo ^5=== p453q C3 speed ===
hud_watch_path_color 0
waitms 700
replay colours 0 32
waitms 400
echo ^5=== p453q C3 gain ===
hud_watch_path_color 1
waitms 700
replay colours 0 32
waitms 400
echo ^5=== p453q C1 contact ===
hud_watch_path_color 2
waitms 700
replay colours 0 32
waitms 400
echo ^5=== p453q C2 energy ===
hud_watch_path_color 3
waitms 700
replay colours 0 32
waitms 400
// EVERY point, not every sixteenth.  This file wraps its yaw past 180 exactly
// six times in 5321 samples, so a sparse dump never lands on one, and the
// mutation that drops the wrap handling passed cleanly against it.  An arm that
// misses the only samples where a term matters is not measuring that term.
echo ^5=== p453q Q1 air control ===
hud_watch_path_color 4
waitms 700
replay colours 0 1
waitms 900
echo ^5=== p453q marks ===
replay marks 0
waitms 300
screenshot screenshots/p453q_quality.png
waitms 500
hud_watch_path_color 2
waitms 700
screenshot screenshots/p453q_contact.png
waitms 500
replay stop
waitms 300
quit
