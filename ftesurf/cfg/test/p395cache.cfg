// P395CACHE -- Patch 395: the downloaded-replay cache moves from data/online/<id>.rec
// to data/online/<map>/<legdir>/<MMmSS.mmms>_<owner>[_dnf]_r<id>.rec, named from the
// file's own header and trailer; flat files migrate one per frame at CSQC start.
// Listen server, lobby_dir "" (no network: every hit is the cache).  Run with
// +set log_name; this cfg sets none.
//
// SETUP (the migration runs on the REAL cache -- that is the feature):
//   copy ftesurf/data/online aside (the restore point);
//   python tools/onlinecache.py fixture <copy>/42.rec ftesurf/data/online 990042 990043 990044
//     (cut from r42 mid-run: an evidence-trailer abandon, a torn file, a no-abandon control)
//   python tools/onlinecache.py manifest ftesurf/data/online > p395.manifest
// Remove the three fixtures from the cache afterwards (ids a real surfd would reach).
//
// PRE-REGISTERED (first run on the patched build)
//  C1 one `cache data/online/<id>.rec -> <manifest path>` line per manifest row (16),
//     and nothing else moved.
//  C2 board_replay 18: ready, file data/online/surf_aura/main/04m08.325s_kap_r18.rec
//     (the bare id, through the */*/ search); board_replay 8: ready,
//     data/online/surf_tensor2/stage_2/00m12.570s_proto_r8.rec.
//  C3 board_replay 1: failed -- `*_r1.rec` matches neither _r18 nor _r10.
//  C4 990042 -> .../surf_beginner/main/00m27.195s_proto_dnf_r990042.rec (abandon),
//     990043 -> ..._proto_dnf_r990043.rec (no trailer), 990044 -> ..._proto_r990044.rec.
//  C5 `onlinecache.py verify p395.manifest ftesurf/data/online`: VERIFY PASS (no flat
//     <id>.rec, every path once with its md5, no .part).
//  C6 second run (fresh log): 0 cache lines, C2-C4 unchanged.
//  C7 third run, the backup's 16.rec copied back flat: one line `cache data/online/16.rec
//     dropped, data/online/bhop_eazy/main/00m49.030s_kap_r16.rec holds it`, the flat file
//     gone, verify still PASS.
//  No QC / PR_ExecuteProgram line in any run.
// CONTROL: this cfg on the pre-395 csprogs, BEFORE building: no cache line, and
//  board_replay 18 reads data/online/18.rec -- C1, C2 and C4 must FAIL.
//
// RESULT (2026-09-20, +set sv_csqc_progname csprogs395.dat = HEAD + the 395 diff,
//  built in a clean worktree).  CONTROL p395cache-ctl (the 03:51 deployed csprogs):
//  FAILED as registered -- no cache line, `ready rep 18 ... "data/online/18.rec"`.
//  C1 16 cache lines, one per manifest row, in p395cache.log only.  C2 18 and 8 at the
//  pinned paths.  C3 `failed rep 1`.  C4 all three names as registered.  C5 VERIFY
//  PASS.  C6 p395cache2: 0 cache lines, same answers.  C7 p395cache3: `cache
//  data/online/16.rec dropped, data/online/bhop_eazy/main/00m49.030s_kap_r16.rec holds
//  it`, flat file gone, VERIFY PASS.  No QC error.  (An earlier, unplanned migration
//  of the same files by another session's client, p399dbg.log 04:18, also verified.)
cfg_save_auto 0
log_enable 1
log_dir logs
developer 1
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0
set run_resume 0
sv_public 0
sv_port 27675
set lobby_dir ""

wait 200
map bhop_eazy
waitmap 1800
waitms 3000
echo ^5=== p395cache C2 ===
board_replay 18
board_replay 8
echo ^5=== p395cache C3 ===
board_replay 1
echo ^5=== p395cache C4 ===
board_replay 990042
board_replay 990043
board_replay 990044
echo ^5=== p395cache DONE ===
waitms 500
quit
