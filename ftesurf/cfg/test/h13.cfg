// H13 -- IS THE BLACK PORTAL AN ARTEFACT OF screenshot_mega?
//
// This run exists to check my own instrument, and it should have been the first
// thing done rather than the fifteenth.
//
// Every portal measurement in this investigation used `screenshot_mega 1280 720`.
// The new instrumentation says the portal never refuses -- it reports DREW at both
// recursion levels every frame -- and that the FBO it renders into is 3840x2400,
// i.e. sized from vid.fbpwidth at portalfboscale 1, NOT from the requested
// screenshot size.  scripts/portal.shader states that ftesurf_portal.glsl samples
// $refraction in SCREEN SPACE and "must not be a UV lookup".
//
// A screen-space lookup against a texture sized for a different resolution samples
// off the edge, and the texture is GL_CLAMP_TO_EDGE (gl_backend.c:6128) over an
// FBO that was cleared to opaque black (:6160).  That produces a perfectly black
// doorway -- which is exactly what has been measured all afternoon, at every
// standoff, under every cvar, immune to r_novis, map_noareas and r_fastsky alike.
// Immune-to-everything is itself the tell: a real culling or shading bug would
// have responded to at least one of them.
//
// So take the SAME camera twice:
//
//   screenshot        -- the ordinary path, at the window's own resolution
//   screenshot_mega   -- what every previous measurement used
//
//   plain shows the far room, mega is black -> the bug is in my instrument, the
//                                              portal works, and the user's report
//                                              is something else entirely
//   both black                              -> the portal is genuinely black and
//                                              screenshot_mega is exonerated
//
// Either answer is worth the run; the first one invalidates a lot of this
// afternoon and needs to be found now rather than after a fix is built on it.

cfg_save_auto 0
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "h13"
scr_sshot_type png
cl_yieldcpu 0
cl_maxfps 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0
r_voidvis 1
vbsp_portal_render 1

waitms 2500
map surf_kitsune
waitmap 240
waitms 8000
sv_cheats 1

setpos 0 -560 184 0 90 0
waitms 3000

echo "@@@ H13 20 units back -- PLAIN screenshot"
setpos 0 -540 184 0 90 0
waitms 4000
screenshot h13_plain_d20
waitms 1000

echo "@@@ H13 20 units back -- screenshot_mega (what every earlier run used)"
screenshot_mega h13_mega_d20 1280 720
waitms 1000

echo "@@@ H13 120 units back -- PLAIN screenshot"
setpos 0 -640 184 0 90 0
waitms 4000
screenshot h13_plain_d120
waitms 1000

echo "@@@ H13 120 units back -- screenshot_mega"
screenshot_mega h13_mega_d120 1280 720
waitms 1000

echo "@@@ H13 DONE"
waitms 1000
quit
