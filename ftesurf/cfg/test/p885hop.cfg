cfg_save_auto 0
// P885 -- the start-hop rule judges only a hop taken inside the start box.
//   python tools/p884arms.py --control <dir> --fixed <dir> --out <dir> p885hop
// surf_tendies with Lex's own local zone (data/maps/zones/local/surf_tendies.json: start
// x -2496..-1024, teleDest -1760 11488 yaw 218).  The booster is a trigger_multiple
// (AddOutput basevelocity 1337 0 0) at x -960..-704, y 11008..11520, z 13216, in the pit
// past the box's east edge.  sv_cheats 0: a cheat-classed run would hide the verdict.
//   C  premises: `run_starthop` 1, `timer: armed`.
//   H  walk east, ONE jump from inside the box (dwell met), land on the booster with
//      +jump held (autohop): control `practice 1`, fixed `practice 0`; both `running`,
//      `jumps` >= 2, and the H viewpos past x -1008 (the hop was outside).
//   I  positive control: +jump held 1.4 s inside the box after !r -- `hopped 1` on BOTH.
//   FALSIFIED IF control reads practice 0 in H (no discriminator) or fixed reads hopped 0
//   in I (the rule went off inside the box too).
log_enable 1
log_dir logs
log_name p885hop
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
sv_port 27703
sv_cheats 0
set run_resume 0
vid_fullscreen 0
waitms 5000
map surf_tendies
waitmap 2400
waitms 3000
menu_restart
ui_close
waitms 1200

echo ==== C the start, and the rule on ====
run_starthop
cmd zone_reset
waitms 1500
cmd viewpos
cmd timer
waitms 800

echo ==== H one jump out of the box, then the hop on the booster ====
// !r puts the body at -1106.8 11246.7 yaw 64.7 -- the start spot in Lex's own saves,
// measured in C, not the zone's teleDest.  +right 0.647 s at 100 deg/s faces ~0, east,
// 83 u from the box edge; 0.3 s of walking, then the jump from inside.
cl_yawspeed 100
+right
waitms 647
-right
waitms 300
cmd viewpos
+forward
waitms 300
+jump
waitms 300
cmd viewpos
waitms 1300
cmd timer
cmd viewpos
waitms 800
-jump
-forward
waitms 400

echo ==== I positive control: a hop chain inside the box after !r ====
cmd zone_reset
waitms 1500
+jump
waitms 1400
cmd timer
waitms 700
-jump
waitms 300

quit
