// P403PLAIN -- Patch 403 must be INVISIBLE on an ordinary start.  The clamp
// early-outs when there is no horizontal carrier, so a normal run on a map with
// no booster near the start should be bit-identical with run_startcap 290 and
// with run_startcap 0.  bhop_eazy, `!r` then walk out under +forward.
//
// PRE-REGISTERED
//  P1 both arms finish and write a .rec.
//  P2 the `seed` line is IDENTICAL between the two arms, to the last digit --
//     same origin, same velocity, same flags.
//  P3 neither .rec carries a `ride` record with a non-zero horizontal carrier.
// FALSIFIED IF the seeds differ: then the clamp is touching ordinary play.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p403plain0
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
sv_cheats 0
fs_missingwarn 0
set run_resume 0
set run_startcap 0
sv_port 27682

wait 200
map bhop_arcane
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 1000

echo ^5=== P: an ordinary start ===
say !r
waitms 800
+forward
waitms 3000
-forward
cmd viewpos
cmd timer
waitms 1000
echo ^5=== P403PLAIN DONE ===
waitms 500
quit
