// Patch 271 -- (a) does the 3D skybox still DRAW, and (b) what are the 30
// entity batches the skyroom pass still costs?
//
// (a) The numbers already say the pass is alive: recurse 1 emits 20 meshes in
//     2 batches at cluster 1534, which is the sky_camera's own cluster
//     (computed offline from the VIS lump, independently of the engine).  An
//     empty or broken skyroom would emit 0.  But "it emits 20 meshes" is not
//     "it looks right", so: a vantage with real sky in frame, ON vs OFF.
//     If the 3D skybox is alive, ON shows distant scenery that OFF does not.
//
// (b) After the patch the skyroom pass still adds 48,213 draw indices at the
//     spawn, and the split says they are not world:
//         World Batches   390 (on) vs 388 (off)   -> +2, my 2 batches
//         Ent Batches      49 (on) vs  19 (off)   -> +30
//     gl_warp.c:357-358 has `r_refdef.firstvisedict = cl_numvisedicts;`
//     COMMENTED OUT, so the main view's visedicts are re-submitted in the
//     skyroom pass.  prop_census in both states says whether those 30 are
//     static props (plugin-side, PVS-culled) or ordinary visedicts.

developer 1
log_developer 1
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000

cl_maxfps 0
cl_idlefps 0
cl_yieldcpu 0
sv_cheats 1
r_speeds 2

map surf_tensor2
waitmap 600
waitms 5000
developer 0
log_developer 0
noclip
waitms 1500

// A vantage with sky: high above the start courtyard, pitched up toward the
// horizon so the skybox occupies most of the frame.
echo ^5=== SKY VANTAGE, vbsp_skyroom 1
vbsp_skyroom 1
setpos -11776 -12200 15200 -25 90 0
waitms 2500
r_speeds_dump
prop_census
screenshot t271_sky_on_x
waitms 900
screenshot t271_sky_on
waitms 900

echo ^5=== SKY VANTAGE, vbsp_skyroom 0
vbsp_skyroom 0
waitms 2500
r_speeds_dump
prop_census
screenshot t271_sky_off_x
waitms 900
screenshot t271_sky_off
waitms 900

// straight up -- nothing but sky, so any 3D skybox content is unmissable
echo ^5=== STRAIGHT UP, vbsp_skyroom 1
vbsp_skyroom 1
setpos -11776 -12200 15200 -80 90 0
waitms 2500
screenshot t271_up_on_x
waitms 900
screenshot t271_up_on
waitms 900

echo ^5=== STRAIGHT UP, vbsp_skyroom 0
vbsp_skyroom 0
waitms 2500
screenshot t271_up_off_x
waitms 900
screenshot t271_up_off
waitms 900

vbsp_skyroom 1
echo ^5=== END ===
waitms 500
quit
