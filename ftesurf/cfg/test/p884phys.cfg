cfg_save_auto 0
// P884 -- a func_physbox with "notsolid" "1" is not solid (physobj.cpp:458).
//   python tools/p884arms.py --control <dir> --fixed <dir> --out <dir> p884phys
// Lex's surf_lovetunnel save 10 stands on *16 ("butterflyentrance", a 16-unit cube, motor
// axle); *17 beside it is a 16 x 4112 x 4112 wall at x -2064.  Both carry notsolid 1.
//   E  the server's own solid for each: control `solid BSP`, fixed `solid NOT`.
//   F  save 10's origin, one second later: control z -695.97 (held by the cube),
//      fixed below it (falling).  FALSIFIED IF fixed reads -695.97 or control falls.
log_enable 1
log_dir logs
log_name p884phys
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
sv_port 27702
sv_cheats 1
set run_resume 0
vid_fullscreen 0
waitms 5000
map surf_lovetunnel
waitmap 2400
waitms 3000
menu_restart
ui_close
waitms 1200

echo ==== E the cube and the wall, as the server holds them ====
cmd ent_info func_physbox -2112 5440 -704
waitms 600
cmd ent_info func_physbox -2064 5440 -736
waitms 600

echo ==== F standing where save 10 stood, one second later ====
setpos -2115.6287 5435.5420 -695.9688 83.2819 44.2090 0
waitms 1000
cmd viewpos
waitms 600

quit
