// MOMBOARD -- the imported board, end to end: does the client ask surfd for the
// momentum tier, parse it, and tell the two halves apart?  log_name momboard.
//
// Needs a surfd on 127.0.0.1:8099 holding the imported rows -- see
// surfd/momindex.py.  Not the Pi: this deliberately points at a local copy so
// the arm cannot depend on, or disturb, the live board.
//
// PRE-REGISTERED, from the local surfd's own /api/board answers, before running.
//  B1 ranked surf_4am 0/1: 2 rows, Proto 7125 ms then borobongo, and the counts
//     object must carry all THREE tiers -- {"ranked":2,"community":0,"momentum":1}.
//     A momentum count of 0 here means json_find_object_child is not finding the
//     new key, and then the tab would never appear however many runs exist.
//  B2 momentum surf_4am 0/1: exactly 1 row, Proto, 7320 ms, and `rep` non-zero
//     so the row is watchable.  Its player key is the SteamID64
//     76561198064721002, NOT an engine guid -- that is what an imported row is
//     keyed on and it is how a reader tells the two apart without the tier.
//  B3 the same board asked as `ranked` must NOT contain the 7320 row, and the
//     `momentum` board must NOT contain the 7125 one.  THIS IS THE ARM THAT
//     MATTERS: it is the whole claim of the feature -- two measurements of one
//     map that never mix -- and B1/B2 would both pass if the server were
//     ignoring `tier` and answering the same rows twice.
//  B4 a tier surfd does not know is still a 400 -> the client reports a failure
//     rather than an empty board, so a typo cannot read as "no times yet".
log_enable 1
log_dir logs
log_name momboard
developer 0
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0
sv_public 0
sv_port 27693
waitms 4000
// Explicit, not the archived value, so this does not depend on what a previous
// session left in ftesurf.cfg -- and so it can never hit the live Pi.
lobby_dir "http://127.0.0.1:8099"
map surf_4am
waitmap 1800
waitms 4000
ui_close
waitms 1000
echo ^5==== momboard B1 ranked 0/1 (expect 2 rows, counts 2/0/1) ====
board_fetch 0 1 ranked clean
waitms 2500
board_status
waitms 500
echo ^5==== momboard B2 momentum 0/1 (expect 1 row, Proto 7320, rep non-zero) ====
board_fetch 0 1 momentum clean
waitms 2500
board_status
waitms 500
echo ^5==== momboard B3 the main track, both tiers, for the separation ====
board_fetch 0 0 ranked clean
waitms 2500
board_status
waitms 500
board_fetch 0 0 momentum clean
waitms 2500
board_status
waitms 500
echo ^5==== momboard B4 a tier surfd does not know (expect a failure, not 0 rows) ====
board_fetch 0 1 nonsense clean
waitms 2500
board_status
waitms 500
// B5 THE COMBINED BOARD.  surf_4am 0/1 holds 2 ranked and 1 imported, and the
// imported 7320 sits BETWEEN the ranked 7125 and 7635 -- so a merge that simply
// concatenated the two boards would put it last and still look plausible.
// Graded on three things, because each alone can pass while wrong:
//   rows 3           the merge happened at all
//   src 0 1 0        the MIDDLE row is the imported one, i.e. the interleave is
//                    by time and the per-row tier was actually parsed. A build
//                    that never read `tr` prints `0 0 0` here and draws a board
//                    that looks entirely correct.
//   reps 0 118 0     the same row carries the imported replay, so `src` is not
//                    merely a coincidence of ordering.
echo ^5==== momboard B5 combined 0/1 (expect rows 3, src 0 1 0, reps 0 118 0) ====
board_fetch 0 1 combined clean
waitms 2500
board_status
waitms 500
// B6 THREE SOURCES ON ONE MAP.  surf_garden holds one of ours, two Momentum and
// one KSF, and their times interleave: ksf 79.884, momentum 95.745, OURS
// 152.115, momentum 303.750.  Graded as src `2 1 0 1` -- KSF, Momentum, ours,
// Momentum -- which no ordering accident produces and which a build that reads
// only `momentum` would print as `0 1 0 1`.
//
// `imported` is the tab's own tier: every foreign board at once, ours excluded.
// Expect 3 rows and src `2 1 1`, plus reps `0 1613 1615` -- the KSF row's 0 is
// the point, because KSF publishes no replay and a 0 there is the honest
// answer rather than a missing feature.
// board_fetch asks for the map the client is ON -- Online_Fetch reads the level
// name, it is not a parameter -- so B6 needs the map changed or it would
// silently re-query surf_4am and grade the wrong board while looking fine.
map surf_garden
waitmap 1800
waitms 3000
ui_close
waitms 1000
echo ^5==== momboard B6 imported on surf_garden (expect rows 3, src 2 1 1, reps 0 1613 1615) ====
board_fetch 0 0 imported clean
waitms 2500
board_status
waitms 500
echo ^5==== momboard B6b combined on surf_garden (expect rows 4, src 2 1 0 1) ====
board_fetch 0 0 combined clean
waitms 2500
board_status
waitms 500
quit
