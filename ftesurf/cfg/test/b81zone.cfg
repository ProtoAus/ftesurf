cfg_save_auto 0
// BUILD 81 -- does a real recording name the zone table that timed it?
//
// WHY THIS EXISTS.  Patch 321 put `mapcrc` in every header on the argument that
// a map NAME is not a map.  That argument stops one level short: on this game
// the MAP does not contain the boxes that start and stop the clock.  SV_ZoneLoad
// tries maps/zones/local/<map>.json, then maps/zones/online/<map>.json, and only
// then the BSP's own trigger brushes -- so two of the three sources are files
// that are not the map, can be re-authored at any moment under a standing
// record, and leave nothing behind to notice.  Build 81 writes three keys:
// zonesrc, zonecrc and zonerule.
//
// AND `zonesrc` ALONE WOULD NOT HAVE DONE IT, which is why zonecrc is over the
// BUILT TABLE rather than over the JSON bytes.  SV_ZoneLoadFromBsp deflates every
// box by a unit on all six faces (sv_zones.qc:111), so a BSP-sourced end zone is
// two units smaller per axis than a JSON traced from the same brush -- same map,
// same source name, different geometry.  Hashing the file would have said nothing
// about the BSP path, which has no file at all.
//
// WHAT THIS FILE CAN AND CANNOT FALSIFY, stated first.
//
//   CAN: that a real recording, driven to a real finish, carries all three keys
//   and that reccheck.py -- written from the GRAMMAR, not from the writer --
//   passes it.  That is arm A and it is the only end-to-end proof available.
//
//   CAN: that the hash is STABLE across a map reload and DIFFERENT across a
//   table change.  Arm D reloads the same map and expects the same crc; without
//   that control a constant would pass arm A just as well as a hash would.
//
//   CANNOT: that the BSP path hashes differently from the JSON path for the SAME
//   brush.  That needs a map shipping both a zone JSON and timer brushes, and
//   then a way to suppress the JSON -- there is no cvar for it (the order is
//   hardcoded at sv_zones.qc:173-177).  Argued from the source instead: the two
//   paths differ by a literal '1 1 1' at sv_zones.qc:111 and the hash covers
//   zone_bottom/zone_top and every polygon point, so they cannot collide except
//   by sha256 collision.  Recorded as a reading, not as a measurement.
//
//   CANNOT: anything about cl_lobbytime.qc's header, which deliberately carries
//   NONE of these keys -- it describes a run that happened on a lobby, and the
//   client's own zone table is not the one that timed it.  Writing the client's
//   answer there would be the sv_mapcheck shape exactly.  There is no arm for a
//   thing that must not happen; the note in that file is the record.
//
// PRE-REGISTERED:
//
//   A  A streamed run to a finish on bhop_eazy.  The .rec MUST carry zonesrc,
//      zonecrc and zonerule, and reccheck.py MUST pass it with 0 faults.
//   B  `cmd timer` before/during/after, the b73hdr control that the run really
//      started and really finished.  zone_goto ARMS and does not start --
//      bhop_eazy starts on a JUMP -- and SV_RecClose has exactly ONE call site,
//      at the finish, so a run that merely starts writes NO FILE AT ALL.  A
//      missing .rec is the same symptom as a broken writer.
//   C  `zone_list` prints the crc beside the count, so the value is visible even
//      if no file is produced.  This is the arm that still says something when
//      arm A fails.
//   D  Reload the map and print the crc again.  MUST be identical.  A hash that
//      changes per load would pin nothing and would fault every re-simulation.
//
// FALSIFIED IF: no .rec appears; or it lacks any of the three keys; or
//      reccheck.py reports a fault on it; or arm D's crc differs from arm C's.

cfg_save_auto 0
log_enable 1
log_dir logs
log_name b81zone
developer 0
sv_cheats 0

// `set`, not a bare assignment: these register in worldspawn, so before the
// first map load a bare `rec_stream 1` is Unknown command and the default
// silently stands.  Cost one attempt in b73hdr and produces a MISSING FILE --
// the same symptom arm A's failure would produce.
set rec_enable 1
set rec_stream 1
set rec_runarchive 1

waitms 6000
map bhop_eazy
waitmap 45
waitms 3000

echo ================================ B81ZONE ARM C -- the table, and its crc
zone_list
waitms 1000

echo ================================ B81ZONE ARM B -- armed, not started.  Expect no run.
cmd timer
waitms 1000

echo ================================ B81ZONE -- arm, aim, go
cmd zone_goto 0
waitms 1000
setpos -352 -352 144 0 335.3 0
waitms 1000
noclip
waitms 500
+forward
waitms 1500

echo ================================ B81ZONE ARM B -- running; a part file should exist NOW
cmd timer
waitms 500

+forward
waitms 3500
cmd timer
waitms 2000
-forward
waitms 1500

echo ================================ B81ZONE ARM B -- after the end zone.  Expect FINISHED.
cmd timer
waitms 2500

echo ================================ B81ZONE ARM D -- reload; the crc MUST NOT MOVE
map bhop_eazy
waitmap 45
waitms 3000
zone_list
waitms 1500

echo ================================ B81ZONE done
waitms 500
quit

// ============================================================================
// MEASURED 2026-09-14, one run on bhop_eazy, QC build 81.
//
// ARM C -- THE TABLE AND ITS HASH, from a config, with no run needed:
//
//     zone_list: 7 zones, 28 points, source maps/zones/online crc c50cfd70
//
// ARM B -- A REAL RUN, not an armed one:
//
//     timer: armed on bhop_eazy, tick 0.01, start on jump
//     timer: running on bhop_eazy, tick 0.01, start on jump
//     timer: finished on bhop_eazy, tick 0.01, start on jump
//
// ARM A -- THE WRITER.  timer: streamed data/runs/bhop_eazy/main/cheat.rec
// (289 samples, 109 padding), and the header reads
//
//     mapcrc 676de275
//     zonesrc online
//     zonecrc c50cfd70
//     zonerule 1 1 0
//
// reccheck.py -- written from the grammar, not the writer -- passes it with
// 0 faults, and now prints `zones  online c50cfd70 rule 1 1 0`.
//
// ARM D -- THE HASH IS STABLE.  After `map bhop_eazy` a second time:
//
//     zone_list: 7 zones, 28 points, source maps/zones/online crc c50cfd70
//
// IDENTICAL.  Without this arm a constant would have passed arm A exactly as
// well as a hash does, which is the whole reason the arm is here.
//
// THE UNPLANNED READING, AND IT IS THE BEST ONE IN THIS FILE.  Arm C/D's crc is
// printed by CSQC from the CLIENT's zone table; the header's crc is written by
// SSQC from the SERVER's.  They are c50cfd70 and c50cfd70.  Two VMs, two copies
// of the table, two separately compiled progs, one number -- so Zone_Hash is
// genuinely shared-code-identical rather than merely compiling in both.  On a
// listen server they read the same files, so this is agreement and not
// independence; it is still the only measurement of the two sides ever agreeing
// about zones, and it is the reading a lobby-vs-client comparison would extend.
//
// READER-SIDE ARMS, run from a shell, recorded with their controls because a
// check that has only ever passed has not been tested:
//
//   CONTROL   reccheck.py over data/runs, 376 files ..... 66 with faults
//             (identical to the pre-81 committed tool, so the new checks cost
//             nothing on real data -- every one of those files reads
//             `zones  not stated`, which is the honest answer for a file
//             written before the pin existed)
//   FALSIFIER five synthetic headers spliced into a real .rec, each expecting
//             a NAMED fault, plus the unmodified file as the control:
//                 base.rec  (untouched) ................. ok, 0 faults
//                 full valid pin ........................ ok, 0 faults
//                 zonecrc with no zonesrc/zonerule ...... "zone pin is partial"
//                 zonesrc momentum ...................... "not one of local/online/bsp"
//                 zonecrc 1A2B3C4D5E .................... "not 8 lowercase hex digits"
//                 zonerule with 2 fields ................ "takes 3 fields"
//             All five fired with the right message and nothing else moved.
//
// A DEFECT THIS FIXTURE CAUGHT IN ITS OWN TOOLING, worth recording because it is
// the exact failure reccheck.py's own comments warn about: `zones` was computed
// into r.info and LEFT OUT of emit()'s print whitelist, so the first version of
// this check was invisible at every verbosity -- the same way `ghosted`,
// `journal` and `ruleset` were invisible for builds 30 through 62. Found by
// asking the tool to show the field rather than by trusting that it would.
//
// WHAT WAS NOT EXERCISED, AND WHY:
//
//   THE BSP PATH.  bhop_eazy ships a zone JSON, and the load order is hardcoded
//   (sv_zones.qc:173-177) with no cvar to suppress it, so `zonesrc bsp` cannot
//   be produced from a config on a map that has a JSON. The claim that the two
//   paths hash differently is argued from source -- SV_ZoneLoadFromBsp deflates
//   by a literal '1 1 1' at sv_zones.qc:111, and the hash covers zone_bottom,
//   zone_top and every polygon point -- and is recorded as a READING, not a
//   measurement.
//
//   A MID-RUN TABLE CHANGE.  Not reachable: the table is rebuilt only on map
//   load and Zone_Hash runs before SV_TimerMapInit arms anything, which is the
//   design rather than a gap.
// ============================================================================
