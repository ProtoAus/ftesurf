// The 720p half of the build 57 menu check -- the TIGHT case.
//
// IT SETS THE VIRTUAL SCREEN, NOT THE WINDOW, and that is the correct lever
// rather than a workaround.  m_draw takes `screensize` as the VIRTUAL screen
// (m_main.qc:3505-3507 says so outright), and every layout number in the create
// screen -- the panel cap, and rows = floor((size_y - 60 - y) / 48) -- is
// computed from it.  So vid_conwidth/vid_conheight ARE the 720p case; the window
// can stay whatever size the desktop gives it.
//
// The physical route was tried first and does not work here: ftesurf.cfg pins
// vid_width "0" / vid_height "0" ("use desktop resolution"), and four runs came
// out 1920x1111 whether the mode was passed as +set, as -width/-height, or set
// and followed by vid_restart.
//
// vid_conautoscale 0 so the values are taken literally rather than scaled.
//
// The driver is armed LAST: m_draw tests cvar("ui_bootcheck") >= 2 every frame
// (m_main.qc:3512), so it is not latched at init and the layout can be set up
// before the first frame it counts.
cfg_save_auto 0
log_enable 1
log_dir "logs"
log_name "b57menu720v"
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
sv_port 27600

set ui_bootcheck 0
set ui_bootterms 1

vid_conautoscale 0
vid_conwidth 1280
vid_conheight 720
waitms 1500
echo ^5=== virtual screen now: ===
vid_conwidth
vid_conheight
waitms 500

togglemenu 1
waitms 500

set ui_bootcheck 2
