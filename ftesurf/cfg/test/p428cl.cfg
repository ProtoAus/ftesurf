// P428CL -- 999 save states a player in a lobby (server: p428sv.cfg).
//
// BEFORE Patch 428 a lobby block is 24 rows (FS_SLBLOCK), the 25th `sl_save`
// answers `the list is full (24)`.  AFTER, 999, backed by memalloc'd columns.
// Saves #1 at spawn (A), #30 at setpos 100 200 300 (B), #999 at -50 -60 700 (C).
//
// PRE-REGISTERED PREDICTIONS
//  N1 saves 25..999 are taken (`save 999 (slot 999)`); the 1000th answers
//     `the list is full (999)`.  Control (pre-428 progs): `full (24)` at #25.
//  N2 `sl_goto 30` -> viewpos B, `sl_goto 999` -> C, `sl_goto 1` -> A.
//  N3 after `rcon changelevel` the block is rescanned from disk (log
//     `saveloc: 999 save state(s)`), and N2 holds again -- the sort put 999
//     rows back in creation order.
//  N4 `sl_list` prints a 30-row window with a `rows a-b of 999` footer, and
//     `sl_list 500` rows 500-529.
//  N5 `sl_delall` answers `deleted all 999` and the client is still connected
//     (a real viewpos after it; one stuffcmd per row used to be 999 reliables).
//     Added after the first Pi run logged `QC call to SV_SaveLocDeleteAll took
//     over a second` (~3.5 s): the sweep runs a batch a packet, so 500 ms in the
//     server answers viewpos at once, refuses `sl_save` (`still deleting -- N
//     left`), and `deleted all 999` follows; no over-a-second line in its log.
// REVIEW ROUND 1 (added): saves 60 ms apart, under the 20/s command bucket.
//  N7 lobby blocks keep a recording copy for the newest SL_RECKEEP (24) saves
//     only: `sl_goto 30` is older, so its load logs the slot copy missing
//     (`gave 0 of N bytes; recording dropped`, needs p428sv.cfg's developer
//     logging) and still lands.  At most 24 run.rec under the probe folder.
//  N8 25 `sl_delall` in one frame: 20 answer `nothing saved`, then one
//     `save: slow down`, and no more.
// FALSIFIED IF any save past 24 is refused, a goto lands elsewhere, the
//   rescan count or order differs, or delete-all drops the client.
//
// RESULT 2026-09-22 (server p428svq.cfg = p428sv with developer logging off;
// Windows fteqwsv64 on 27635, and the live Pi binary on 27791 with the 428 progs
// as sv_progs):
//  N1 held both: saves to 999, `the list is full (999)` at the 1000th.
//  N2/N3 held both: #1, #30 and #999 land at three different points, the same
//     ones after the rescan; rows 500-529 after it carry the slot and run clock
//     each had at creation (30 of 30).  #30/#999 are not exactly B/C -- the
//     body falls or is pushed out in the 300 ms before the save; the arm only
//     needs three distinct points.
//  N4 held.  N5 held on the frame-driven sweep: `deleting 999`, a viewpos
//     answered at once and `still deleting -- 899 left` 500 ms in, `deleted all
//     999` ~5 s later, no `took over a second` line.
//  SCAN COST (profile_ssqc, SV_SaveLocScanBlk inclusive, 999 rows): 237 ms
//     Windows, 157 ms Pi.  4.8 s with developer 1: a `qcfopen` log line per file.
//  What the arm caught on the way: the first cut deleted all 999 in one call
//     (`QC call to SV_SaveLocDeleteAll took over a second`, ~3.5 s on the Pi);
//     a batch per PACKET stalled the same way while no single call was long --
//     the viewpos sent mid-sweep was answered after it, so the over-a-second
//     line was the wrong detector.  And the first run measured no rescan at all:
//     lobby.cfg overrides a +set rcon_password (`Bad rcon`).
// RESULT, REVIEW ROUND 1 (Windows, p428sv.cfg): N1-N5 held as above ('895 left'
//  mid-sweep).  N7 held: goto 30 before the rescan loaded WARM (the live
//  stream, no slot file needed); after it, `save030/run.rec gave -1 of 5818
//  bytes; recording dropped` and the load still landed.  N8 held: 20 `nothing
//  saved`, one `slow down`.  The run.rec count was not taken (the sweep
//  removes them before the end).
cfg_save_auto 0
log_enable 1
log_dir logs
developer 1
cl_idlefps 0
cl_maxfps 100
rate  2000000
drate 5000000
vid_fullscreen 0
rcon_password p428-local
name "^3P428"
waitms 4000
connect 127.0.0.1:27635
waitms 14000
// Precondition: `nothing saved` -- a leftover row shifts every goto by one.
cmd sl_list
waitms 500
echo p428cl: A
cmd viewpos
waitms 300
cmd sl_save
waitms 60
