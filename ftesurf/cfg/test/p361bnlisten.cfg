// P361BNLISTEN -- the banner on real edges, listen server (no lobby, no board).
// Zones: cfg/test/p360sf.zones.json copied to maps/zones/local/surf_666.json
// (DELETE IT AFTER).  This writes local PBs for surf_666: back up
// data/runs/surf_666 first and restore it after.  surf_666's standing leg-2 PB
// is 1241 ticks (0:18.615) -- the stat-99 subject.
//
// PREDICTIONS (pre-registered):
//   S  after the S3 crossing: compact "STAGE 2" "0:00.900" (60 ticks), delta
//      "-0:17.715  NEW PB" (60 - 1241 at 0.015), placement LOCAL; `cmd timer`
//      "spbwas 1241" and `timer` "cl stats: ... spbwas 1241" -- stat 99 is the
//      PB BEFORE this close.  No toast line (the banner replaced it).
//   F  at the finish: full "MAP COMPLETE", no board -> "#1 of N" / "LOCAL";
//      tail leg 4 (the last stage), kind 1.
//   Y  a new attempt 0.5 s after a finish: `banner` at +0.9 s shows exit set
//      (~1.2 s after raise), at +2.0 s kind 0 -- the yield, never before 1.2 s.
//   C  CONTROL hud_banner_stages 0: the S3 crossing raises NO compact banner
//      and the toast stays up (toastat >= 0 in `banner`).
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p361bnlisten
developer 0
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
sv_port 27631
sv_cheats 0
vid_conautoscale 0
vid_conwidth 1280
vid_conheight 720
waitms 5000
map surf_666
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 500
hud_scale 2
set hud_banner 1
set hud_banner_stages 1
set hud_banner_hold 3.5
set hud_results_toast 1
set rec_terms 1
waitms 500
echo ^5==== S+F: walk the fixture ====
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 2900
echo ^5--- S: after the S3 crossing ---
banner
cmd timer
timer
screenshot p361L_S
waitms 2700
echo ^5--- F: finished ---
banner
screenshot p361L_F
waitms 1000
-forward
waitms 1500
echo ^5==== Y: yield ====
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 5100
-forward
cmd zone_goto 0 90 0
waitms 100
+forward
waitms 800
banner
waitms 1100
banner
-forward
waitms 1500
echo ^5==== C: control, hud_banner_stages 0 ====
set hud_banner_stages 0
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 2900
banner
screenshot p361L_C
waitms 2500
-forward
waitms 500
echo ^5==== done ====
quit

// RESULT (2026-09-18):
//   S  as predicted: "STAGE 2" "0:00.900" "-0:17.715  NEW PB" "#1 of 2" / "LOCAL";
//      spbwas 1241 in both `cmd timer` and `timer`.
//   F  FAILED on the first run: the listen walk was ~0.4 s slower and the status
//      fired before the finish (a STAGE 3 strip).  Waiting 2700 not 2100: full
//      "MAP COMPLETE" "0:04.635" "FIRST TIME" "#1 of 1" / "LOCAL", tail leg 4.
//   Y  exit set at +0.9 s (0.17 s ahead: raise + 1.2), but at +2.0 s the NEW
//      attempt's STAGE 1 strip was up, not kind 0 -- the prediction forgot the
//      next boundary.  The yield itself held.
//   C  as predicted: no strip, toastat 0.25.
// AFTER THE REVIEW FIXES: S unchanged (a kept stage still claims NEW PB); F passed
// on one rerun and hit the slow-walk timing again on the next; Y's tail and
// STAGE 1 show a plain delta when the stage was not re-kept.
