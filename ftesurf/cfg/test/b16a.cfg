// Build 16 Stage 1 verification.  Runs headless-ish and quits.
waitms 2000

echo ^5=== pm_selftest (mapless, by design) ===
pm_selftest

echo ^5=== new Patch 172 cvars: value and (default) ===
pm_jumpzoffset
pm_groundtracedist
pm_bumpcount
pm_snaptoground
pm_groundquadrants
pm_normalizejump
pm_lockmovement
sv_maxspeed

echo ^5=== map load ===
map surf_666
waitmap 120
wait 30

echo ^5=== zone_selftest ===
zone_selftest

echo ^5=== serverinfo: are the new keys published? ===
serverinfo

echo ^5=== lock: cheats off, try to change two of them ===
sv_cheats 0
wait 5
pm_bumpcount 4
wait 5
pm_bumpcount
pm_jumpzoffset 0
wait 5
pm_jumpzoffset

echo ^5=== lock: sv_cheats 1 should now accept ===
sv_cheats 1
wait 5
pm_bumpcount 4
wait 5
pm_bumpcount
sv_cheats 0
wait 10
pm_bumpcount

echo ^5=== END OF RUN ===
wait 10
quit
