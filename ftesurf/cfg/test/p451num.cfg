// P451NUM -- Patch 451: speed and energy on the marks.
//
// The subject prints the string it handed to HUD_Text (the last field of lndm),
// and tools/p451num.py rebuilds that string from the MARK TABLE (`replay
// marks`, already graded against the .rec by p449mark) and compares character
// for character.  Grading the drawn text and not a recomputation is the point:
// a label assembled from the wrong mark would still print plausible numbers.
//
// PRE-REGISTERED
//  N1 nums off: every lndm label reads `-`.  Marks still draw.
//  N2 speed only: every label is the mark's own speed, %.0f, and equals the
//     speed in the mark table for that t.
//  N3 speed+energy at hud_seq_units 1: `<spd> <E>e`, E = z + |v|^2/2g measured
//     from the RUN's first sample (hud_lines_ref 1), to 1 unit.
//  N4 hud_seq_units 0: the energy column becomes u/s, Strafe_EquivSpeed of the
//     same number -- the line and the Segments column cannot disagree.
//  N5 peaks: with nums 2 the apex/trough marks carry numbers and a dot.
//  N6 labels are decluttered on their OWN grid: with every field on at size 24
//     the strings are wider than the spacing, so some marks keep the chevron
//     and lose the number -- nlab < nmk, and no two labels share a cell.
//  N7 at gap 240 every mark still keeps its number (nlab == nmk): the labels'
//     grid is their own, so a label never loses a cell to its own glyph.
// RESULT (2026-09-27, aesthetic pb frozen at t=40).  All nine held, but only
//  after the arm found two real defects and one of its own bad premises.
//   N0 the client's energy zero is the file's own first sample (z 1217.00,
//      |v|^2 201421.4) -- it says which zero it used, so a wrong one is
//      catchable rather than cancelling out of both sides.
//   N1 14 marks, 0 labels.  N2 12 labels, all the mark's own speed.
//   N3/N4 13 labels each, energy right in both units; N4b proves the unit
//      switch moved the text (`794 -229e` -> `794 -606u/s`).
//   N5 6 peak labels at nums 2 and none at nums 1.
//   N6 every field at size 24: 21 marks, 19 labels, none sharing a cell.
//   N7 at gap 240 all 9 marks keep their number.
//
// THREE THINGS THIS ARM FOUND, none of which a count of marks would have:
//  1. hud_seq_units did nothing.  The label read seq_units, which Board_Frame
//     caches -- and Board_Frame does not run while a replay is up, so the unit
//     was whatever was in force before the replay opened.  The unit is now a
//     parameter of HUD_SeqAbsTight and cl_lines reads the cvar itself.
//  2. THE LABELS WERE NOT ON THE SCREEN AT ALL while every counter said they
//     were.  Text drawn from inside Line_Draw never appears: the pass is a
//     stream of R_BeginPolygon batches the engine defers, and a drawstring
//     between two of them draws nothing.  Pinned down with a fixed test string
//     at a fixed position rather than guessed at, then fixed by queueing the
//     labels and drawing them from cl_main beside Ev_Labels, which has the
//     same shape for the same reason.  THE LESSON: nlab counted intent, not
//     ink, and only the screenshot could tell the difference.
//  3. N6's first cut asked the wrong question -- at gap 240 all nine marks kept
//     their numbers, because coarsening the gap coarsens the LABEL grid too.
//     Density is what thins labels, so N6 is now every field at size 24, and
//     the coarse-gap case became N7, the regression for the bug that a shared
//     grid made a label lose its cell to its own glyph (9 marks, 0 labels).
//
// MUTATIONS, each caught: the label reading the next mark's speed (N2/N3/N4),
//  energy printed unreferenced (N3/N4), the unit taken from the stale cache
//  (N4/N4b), and labels sharing the glyph grid (N7, which is why N7 exists --
//  it was predicted to fail N2 and did not, because N6's density cut leaves
//  the label a cell of its own).
log_enable 1
log_dir "logs"
log_name p451num
set hud_lines_edge 0            // Patch 628: this arm grades the last-contact stamp (tools/p449mark.py)
developer 0
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0
set run_resume 0
sv_public 0
sv_port 27711
set lobby_dir ""
set hud_watch_skipidle 0
set hud_watch_path 1

wait 200
map surf_aesthetic
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 1000

replay data/runs/surf_aesthetic/main/0005191_pb.rec
waitms 1500
replay pause
replay seek 40
waitms 1500
hud_lines_marks 1
hud_lines_gap 24
hud_lines_ref 1
hud_lines_numsize 12
// The grader reads the bare form; hud_lines_names defaults to 1 since 4 Oct 2026.
hud_lines_names 0

echo ^5=== p451num N1 numbers off ===
hud_lines_nums 0
waitms 800
replay marktrace 2
waitms 1200

echo ^5=== p451num N2 speed only ===
hud_lines_nums 1
hud_lines_speed 1
hud_lines_energy 0
hud_lines_vz 0
hud_lines_delta 0
hud_lines_time 0
waitms 800
replay marktrace 2
waitms 1200

echo ^5=== p451num N3 speed and energy, units 1 ===
hud_seq_units 1
hud_lines_energy 1
waitms 800
replay marktrace 2
waitms 1200

echo ^5=== p451num N4 units 0 ===
hud_seq_units 0
waitms 800
replay marktrace 2
waitms 1200
hud_seq_units 1

echo ^5=== p451num N5 peaks too ===
hud_lines_nums 2
waitms 800
replay marktrace 2
waitms 1200

// Wide labels, not a wide gap.  The first cut of N6 raised hud_lines_gap to 240
// and asked for fewer labels than marks -- but the label grid is the marks'
// grid coarsened too, so all nine marks kept their number and the check was
// asking the wrong thing.  Density is what thins labels, so: every field on at
// double size, which is a string about 200 px wide against a 24 px grid.
echo ^5=== p451num N6 every field, size 24 ===
hud_lines_vz 1
hud_lines_delta 1
hud_lines_time 1
hud_lines_numsize 24
waitms 800
replay marktrace 2
waitms 1200
hud_lines_numsize 12
hud_lines_vz 0
hud_lines_delta 0
hud_lines_time 0

// The regression for the bug N6's first cut found: at a coarse gap a label and
// its own glyph fall in the same cell, and on one shared grid the label lost to
// itself -- 9 marks, 0 labels.  Every mark keeps its number here.
echo ^5=== p451num N7 gap 240, labels keep their marks ===
hud_lines_gap 240
waitms 800
replay marktrace 2
waitms 1200
hud_lines_gap 24

echo ^5=== p451num marks ===
replay marks 0
waitms 300
screenshot screenshots/p451num.png
waitms 600
replay stop
waitms 300
quit
