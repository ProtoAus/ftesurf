// P385PIA -- Patch 385 on a LIVE Pi lobby (Patch I): the viewer A.  B is
// p385pib.cfg (C:\FTEQuake\fteqw64).  Run from C:\FTESurf after the deploy, with
// the lobby empty (surfd's heartbeat: players=0/32), A first, B 5 s later:
//   ftesurf64.exe -WindowStyle Minimized +exec cfg/test/p385pia.cfg
//   C:\FTEQuake\fteqw64.exe -WindowStyle Minimized +exec cfg/test/p385pib.cfg
// then:  python tools/spectrace.py ftesurf/logs/p385pia.log  (the spt/bt lines)
//
// PRE-REGISTERED
//  Q1 serverinfo fs_spec 1; `spectate p385piB` enters (stat > 0) within 1.0 s.
//  Q2 while B circles: B's stream arrives at >= 55 samples/s (`bs ... rate`).
//  Q3 ESC: stat -3, -2, -1, 0 at 1.0 +- 0.15 s steps; A's aim unchanged.
//  Q4 B's hold (B spectates A): on every A frame between B's two `viewpos`
//     lines, B's drawn body (bt, B's slot) is within 0.5 u of the origin B's
//     `viewpos` reports, and it moves again after B's release.
//  Q5 no QC error in either log.
// FALSIFIED IF any fails.
//
// RESULT (2026-09-20, lobby 1 on the Pi right after the deploy: engine 380, progs
// c06c375; A ftesurf64, B C:/FTEQuake/fteqw64; read from the bx/bt/spt lines).  ALL HELD.
//   Q1 fs_spec 1; want -> stat 2 in 0.453 s.  Q2 1197 samples in 18.8 s of B's
//   circling = 63.6/s (tick gaps: 1141 x1, 52 x2, 3 x3).  Q3 -3/-2/-1/0 at
//   0.986/1.006/0.993 s; A's aim span 0.00000 deg over its window.  Q4 499 frames
//   inside B's hold: B's body within 0.051 u of B's viewpos (printed to 0.1), the
//   held bit on all 499; after the release it moved 202 u.  Q5 no QC error.
//   Not armed here: a finish (a scripted client cannot finish a real map) -- the
//   Pi's pm_verify of a 385-path finish is p385verify's, on an overlay basedir.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p385pia
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
set name "p385piA"
setinfo lobbycolor 0
setinfo lobbyfx 0
waitms 3000
connect 192.168.1.102:27510
waitms 25000
menu_restart
waitms 500
ui_close
waitms 500
sensitivity 3
echo ^5p385pia: WAIT for p385piB
waitms 15000
serverinfo
status
spec_trace 20000
body_trace -1 20000
echo ^5p385pia: E spectate B
spectate p385piB
waitms 1500
spectate status
waitms 8000
body_stats
echo ^5p385pia: S3 third person
vote key 32 1
vote key 32 0
waitms 3000
echo ^5p385pia: X esc
vote key 27 1
vote key 27 0
waitms 4500
spectate status
echo ^5p385pia: BH watching B hold (B spectates A)
waitms 25000
body_stats
echo ^5p385pia: DONE
waitms 1000
quit
