// cfg_save_auto 0: this run sets archived cvars; never let it write them into ftesurf.cfg
cfg_save_auto 0
// p657bright -- how bright a mote is drawn (Patch 657).  tools/p657bright.py grades it.
// THE RULER is a wall of one flat colour: the camera is in the void over surf_dune looking
// straight up, where nothing is drawn, and r_clear paints what is behind the motes.  Rows of
// four Frozen motes (their alpha holds for 11 s) at depth 150, size 100, DistMax 1000:
//      upper left  W  white, Alpha 26         upper right  H  white, Alpha 128
//      lower left  F  white, Alpha 255        lower right  D  0 128 255, Alpha 255
//   K  vbsp_emit_exposure 1: the rows over black (k1), a 0.37 grey (g1) and white (w1)
//   A  vbsp_emit_exposure -1, surf_dune again: its logic_auto sets the ceiling to 1.2 (the
//      separators are 0x1b); the rows over black (a1)
//   B  surf_shade, HDR and no ceiling set          C  surf_andromeda, no HDR lighting
//   E  surf_tensor2, ceiling 1.4, comma separators F  surf_dune at hl2_favour_ldr 1
//   G  surf_destruction, HDR and 134 MiB: its header is not read (QC's fread loads a whole file)
// Each row is said twice: a look made by a call is not there for that call's particles.
log_dir "logs"
log_name "p657bright"
log_enable 1
developer 1
log_developer 1
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000
cl_maxfps 100
cl_idlefps 0
sv_cheats 1
r_bloom 0
con_notifylines 0
scr_sshot_type png
fov 90
wait 200
set hl2_favour_ldr 0
set vbsp_emit_exposure 1
map surf_dune
waitmap 600
waitms 2000
menu_restart
ui_close
set hud_speed 0
set hud_energy 0
set hud_keys 0
set vbsp_emit_dust 0
noclip
setpos 11720 10376 16200 -90 0 0
r_clear 1
r_clearcolour 0 0 0
waitms 5000
echo ^5=== K ruler
emit_list
emit_mote 150 0.17 4 255 255 255 26 100 100 12 12 1000 1 -0.15
emit_mote 150 0.17 4 255 255 255 128 100 100 12 12 1000 1 0.15
emit_mote 150 0.04 4 255 255 255 255 100 100 12 12 1000 1 -0.15
emit_mote 150 0.04 4 0 128 255 255 100 100 12 12 1000 1 0.15
waitms 300
emit_mote 150 0.17 4 255 255 255 26 100 100 12 12 1000 1 -0.15
emit_mote 150 0.17 4 255 255 255 128 100 100 12 12 1000 1 0.15
emit_mote 150 0.04 4 255 255 255 255 100 100 12 12 1000 1 -0.15
emit_mote 150 0.04 4 0 128 255 255 100 100 12 12 1000 1 0.15
waitms 1500
screenshot p657bright_k1
waitms 2500
r_clearcolour 0.37 0.37 0.37
waitms 500
screenshot p657bright_g1
waitms 2500
r_clearcolour 1 1 1
waitms 500
screenshot p657bright_w1
waitms 800
set vbsp_emit_dust 1
echo ^5=== A auto
set vbsp_emit_exposure -1
map surf_dune
waitmap 600
waitms 2000
menu_restart
ui_close
set hud_speed 0
set hud_energy 0
set hud_keys 0
set vbsp_emit_dust 0
noclip
setpos 11720 10376 16200 -90 0 0
r_clearcolour 0 0 0
waitms 5000
emit_list
emit_mote 150 0.17 4 255 255 255 26 100 100 12 12 1000 1 -0.15
emit_mote 150 0.17 4 255 255 255 128 100 100 12 12 1000 1 0.15
waitms 300
emit_mote 150 0.17 4 255 255 255 26 100 100 12 12 1000 1 -0.15
emit_mote 150 0.17 4 255 255 255 128 100 100 12 12 1000 1 0.15
waitms 1500
screenshot p657bright_a1
waitms 800
set vbsp_emit_dust 1
r_clear 0
echo ^5=== B ceiling of Source
map surf_shade
waitmap 600
waitms 4000
emit_list
waitms 300
echo ^5=== C no HDR
map surf_andromeda
waitmap 600
waitms 4000
emit_list
waitms 300
echo ^5=== E commas
map surf_tensor2
waitmap 600
waitms 4000
emit_list
waitms 300
echo ^5=== F LDR chosen
set hl2_favour_ldr 1
map surf_dune
waitmap 600
waitms 4000
emit_list
waitms 300
set hl2_favour_ldr 0
echo ^5=== G too large
map surf_destruction
waitmap 600
waitms 4000
emit_list
waitms 300
echo RIGDONE
quit
