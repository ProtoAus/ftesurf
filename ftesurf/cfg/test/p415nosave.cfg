// Patch 415 on a lobby with the operator's kill switch on (lobby_nosaveloc 1).
//
// The third lobby-only path: SV_SaveLocAllowed is asked on EVERY `!r` since 415,
// not only when the row cache is cold, so the refusal has to hold there too.
// Driven against a lobby-mode server the fleet does not use (see the patch entry),
// because setting the cvar on a live lobby needs rcon.
//
// Run: ftesurf64.exe +set log_name p415nosave +set p415_target <host:27706>
//                    +exec cfg/test/p415nosave.cfg
//
// PREDICTION, registered before the run:
//   N1  `sl_save` is refused and says lobby_nosaveloc.
//   N2  `!r` still works and reports the map's own start -- the picker is skipped,
//       not broken, and a refused save never becomes a placement.
//   N3  the run stays clean and armed.
// FALSIFIED IF a save lands, or `!r` reports "your save", or `!r` errors.
cfg_save_auto 0
log_enable 1
log_dir logs
developer 0
cl_idlefps 0
cl_maxfps 100
name "^3P415 N"
waitms 22000
echo ======== P415N connect $p415_target
connect $p415_target
waitms 22000
say !m
waitms 2500
echo ======== P415N sl_save must be refused
cmd sl_save
waitms 1200
cmd sl_list
waitms 1200
echo ======== P415N !r with the picker off
say !r
waitms 2500
cmd viewpos
cmd timer
waitms 1200
echo ======== P415N done
waitms 800
quit
