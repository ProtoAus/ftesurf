// ***************************************************************************
//  BUILD 47 / PATCH 269b -- ACTUALLY reaching the user's framerate.
//
//  jit08 and jit09 were launched with `+set vid_width 320 +set vid_height 240`
//  and both rendered at 1920x1111 anyway: a `+set` on the command line is
//  applied BEFORE ftesurf.cfg is exec'd, and the archived vid_width in that
//  file then overwrites it.  jit07's own screenshot is 1920x1111 and says so.
//  So "I lowered the resolution and the framerate did not move" was never a
//  fact about the renderer -- the resolution never changed.  That is the third
//  time in this investigation a capture has failed to reach the regime it was
//  about, which is now clearly the dominant failure mode here and not bad luck.
//
//  Resolution is therefore set HERE, after the config is loaded, with an
//  explicit vid_restart, and section 0 MEASURES the resulting framerate with a
//  cheap 200-frame trace before anything expensive is spent on the assumption.
//
//  cl_yieldcpu 0 stays, though jit09 showed it was not the limiter either.
// ***************************************************************************

log_developer 0

waitms 2000

map surf_colin_blaster_69000
waitmap 240
wait 60

// ---- make the frames cheap, AFTER the archived config has had its say ----
vid_width 320
vid_height 240
vid_restart
waitms 3000

cl_yieldcpu 0
cl_maxfps 0
cl_idlefps 0
cl_netfps 66.6667
hud_predicted 1
hud_update -1
hud_round 1
hud_debug 1
hud_speed 1
hud_strafe 1
cl_predict_velblend 0
wait 200

// ---------------------------------------------------------------------------
echo ^5=== 0: CHEAP RATE CHECK.  200 frames, only to read frames/cmd.
// If this is not far above jit09's 18, the resolution change did not take and
// nothing below this line is evidence about the user's regime.
// ---------------------------------------------------------------------------
cl_predtrace 200
waitms 6000

// ---------------------------------------------------------------------------
echo ^5=== 1: UNTOUCHED CONTROL.
// ---------------------------------------------------------------------------
cl_predtrace 3000
waitms 20000

// ---------------------------------------------------------------------------
echo ^5=== 2: THE REPRODUCTION.  Tap +forward, release, wait 1s.
// ---------------------------------------------------------------------------
+forward
waitms 400
-forward
waitms 1000
cl_predtrace 3000
waitms 20000

// ---------------------------------------------------------------------------
echo ^5=== 3: POSITIVE CONTROL -- old blend, same framerate.
// ---------------------------------------------------------------------------
cl_predict_velblend 1
+forward
waitms 400
-forward
waitms 1000
cl_predtrace 3000
waitms 20000

// ---------------------------------------------------------------------------
echo ^5=== 4: fix, and a much longer hold -- 5s after release.
// ---------------------------------------------------------------------------
cl_predict_velblend 0
+forward
waitms 400
-forward
waitms 5000
cl_predtrace 3000
waitms 20000

echo ^5=== END OF RUN ===
wait 20
quit
