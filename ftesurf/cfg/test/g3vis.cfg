// Workstream G3 -- "the world isn't visible in some maps, and only visible in the void".
//
// Two live hypotheses:
//
//   H1 (mine, Patch 208): the portal scissor is left armed, so the world gets clipped away.
//        Follows PORTALS.  Void looks fine because Patch 207 refuses apertures out there,
//        so nothing ever arms the scissor.
//
//   H2 (VBSP v25): visibility is misread on Strata v25 maps, so PVS/frustum reject nearly
//        everything.  Follows BSP VERSION.  Void looks fine because a cluster of -1
//        disables PVS *and* the frustum test entirely (r_surf.c:2224, "Patch 138").
//
// The matrix separates them.  Door counts and BSP versions below were read out of the BSP
// files directly, not assumed:
//
//                  |  has linked_portal_door  |  no portal doors
//   ---------------+--------------------------+-------------------------
//   BSP v25        |  surf_kitsune   (18)     |  surf_nova, kz_anubis
//   BSP v20/v21    |  surf_kitsune_mom (18)   |  surf_666, surf_demise
//                  |  bhop_parallel  (20)     |
//
// surf_kitsune_mom is THE decisive arm: it is the same map as surf_kitsune with the same 18
// doors, shipped at BSP v21 instead of v25.  If it renders and surf_kitsune does not, the
// cause is the BSP version and not my scissor.  If both fail, it is the portals.
//
// r_speeds 2 throughout: "invisible world" has to show as a collapsed world surface/batch
// count, not just a dark screenshot -- this setup has already produced black screenshots
// once, and a screenshot alone cannot tell "culled" from "black texture".

cfg_save_auto 0
developer 1
log_developer 1
scr_sshot_type png
cl_yieldcpu 0
cl_maxfps 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0
r_speeds 2

// stock portal settings -- the state the user is actually playing in
vbsp_portal_render 1
r_portalscissor 1
r_portalrecursion 2
r_portalmaxviews 2

waitms 2500

// =============================================== 1. surf_kitsune -- v25, 18 portal doors
map surf_kitsune
waitmap 180
waitms 6000
sv_cheats 1
echo "### G3-1 surf_kitsune v25 portals=18 -- SPAWN stock"
r_speeds_dump
waitms 600
screenshot_mega g3_kitsune25_spawn 1280 720
waitms 600
echo "### G3-1 surf_kitsune -- scissor OFF (H1 arm)"
r_portalscissor 0
waitms 1200
r_speeds_dump
waitms 600
screenshot_mega g3_kitsune25_noscissor 1280 720
waitms 600
echo "### G3-1 surf_kitsune -- portals OFF entirely (H1 arm, harder)"
vbsp_portal_render 0
waitms 1200
r_speeds_dump
waitms 600
screenshot_mega g3_kitsune25_noportals 1280 720
waitms 600
r_portalscissor 1
vbsp_portal_render 1
waitms 500
echo "### G3-1 surf_kitsune -- THE VOID"
setpos 0 -765 24000 0 90 0
waitms 2500
r_speeds_dump
waitms 600
screenshot_mega g3_kitsune25_void 1280 720
waitms 800

// ====================================== 2. surf_kitsune_mom -- v21, SAME MAP, 18 doors
// The decisive arm.
map surf_kitsune_mom
waitmap 180
waitms 6000
sv_cheats 1
echo "### G3-2 surf_kitsune_mom v21 portals=18 -- SPAWN stock  [DECISIVE]"
r_speeds_dump
waitms 600
screenshot_mega g3_kitsune21_spawn 1280 720
waitms 600
echo "### G3-2 surf_kitsune_mom -- THE VOID"
setpos 0 -765 24000 0 90 0
waitms 2500
r_speeds_dump
waitms 600
screenshot_mega g3_kitsune21_void 1280 720
waitms 800

// ============================================== 3. surf_nova -- v25, NO portal doors
map surf_nova
waitmap 180
waitms 6000
sv_cheats 1
echo "### G3-3 surf_nova v25 portals=0 -- SPAWN stock"
r_speeds_dump
waitms 600
screenshot_mega g3_nova25_spawn 1280 720
waitms 600
echo "### G3-3 surf_nova -- portals OFF (must change nothing under H2)"
vbsp_portal_render 0
waitms 1200
r_speeds_dump
waitms 600
screenshot_mega g3_nova25_noportals 1280 720
waitms 600
vbsp_portal_render 1
waitms 400
echo "### G3-3 surf_nova -- THE VOID"
setpos 0 0 24000 0 90 0
waitms 2500
r_speeds_dump
waitms 600
screenshot_mega g3_nova25_void 1280 720
waitms 800

// ============================================== 4. kz_anubis -- v25, NO portal doors
map kz_anubis
waitmap 180
waitms 6000
sv_cheats 1
echo "### G3-4 kz_anubis v25 portals=0 -- SPAWN stock"
r_speeds_dump
waitms 600
screenshot_mega g3_anubis25_spawn 1280 720
waitms 600
echo "### G3-4 kz_anubis -- THE VOID"
setpos 0 0 24000 0 90 0
waitms 2500
r_speeds_dump
waitms 600
screenshot_mega g3_anubis25_void 1280 720
waitms 800

// ============================================ 5. bhop_parallel -- v20, 20 portal doors
map bhop_parallel
waitmap 180
waitms 6000
sv_cheats 1
echo "### G3-5 bhop_parallel v20 portals=20 -- SPAWN stock"
r_speeds_dump
waitms 600
screenshot_mega g3_parallel20_spawn 1280 720
waitms 800

// ================================================= 6. surf_666 -- v20 control, 0 doors
map surf_666
waitmap 240
waitms 8000
sv_cheats 1
echo "### G3-6 surf_666 v20 portals=0 CONTROL -- SPAWN stock"
r_speeds_dump
waitms 600
screenshot_mega g3_666_spawn 1280 720
waitms 800

echo "### G3 DONE"
waitms 1000
quit
