cfg_save_auto 0

// ===========================================================================
// BUILD 64, ARM SET E -- the summed gain at a listener, measured in-game.
//
// WHY A FOURTH ARM SET.  Arm sets A-D all passed and surf_tensor2 still blared.
// That is the finding, and it is about instruments rather than about sound:
// EVERY NUMBER THOSE RUNS ASSERTED WAS A SETUP FIGURE -- how many emitters,
// how loud each is declared, how far each carries -- and every one of them was
// correct while the map was unlistenable.  None of them is the SUM, and the
// sum is what a person hears.
//
// THE MECHANISM, which is FTE's and not Source's.  SND_Spatialize accumulates
// overlapping channels additively (`ch->vol[i] += bound(0, v, 255)`,
// snd_dma.c:2717) and there is NO LIMITER anywhere in the mix path.  So N
// emitters overlapping at full volume is literally N x full scale and
// everything past 1.0 is distortion.  Measured offline from the entity lumps,
// summing each playing emitter under FTE's own falloff (scale = 1.0 -
// dist*attn/1000, snd_dma.c:2714):
//
//     map                 at spawn      worst point
//     surf_tensor2            0.00      2.00x   (2 emitters)
//     kz_secret_temple        0.60      2.08x   (5)
//     surf_lt_unicorn         0.00      2.29x   (4)
//
// surf_tensor2 reading 0.00 at every spawn and 2.00 a short walk away is
// exactly the shape of the complaint -- silence, then clipping.  It is also
// why measuring AT SPAWN would have proved nothing, which is what this arm set
// does differently: each arm setpos's to the map's worst point first.
//
// TWO CHANGES UNDER TEST:
//   1. vbsp_sound_vol, default 0.5, scaling the whole ambient bed.  0.5 is the
//      value that brings those measured worst cases to about unity -- the most
//      that can be justified from numbers rather than by ear.  FTE's own
//      s_ambientlevel, the scale it applies to a BSP's automatic water/wind
//      bed, defaults to 0.3 (snd_dma.c:97), so this is the conservative end of
//      its own precedent.
//   2. `ent_io` now prints the summed gain AT THE PLAYER, in red above 1.0.
//
// PRE-REGISTERED.  Each arm setpos's to the worst point computed offline
// (scratchpad/hot.py) and MUST report:
//
//   ARM  map                setpos                      MUST print "here:"
//   E1   surf_tensor2       -224 -6080 -1184            1.00x from 2 emitter(s)
//   E2   kz_secret_temple   -2319 1078 16               1.04x from 5 emitter(s)
//   E3   surf_lt_unicorn    -11360 -7248 11408          1.14x from 4 emitter(s)
//   E4   surf_tensor2       (spawn, no setpos)          0.00x from 0 emitter(s)
//
// E4 IS THE CONTROL AND IT MATTERS MORE THAN IT LOOKS.  If the sum reads the
// same everywhere, SV_AmbientSum is not reading the listener position at all
// and the other three numbers are coincidence.  0.00 at spawn against 1.00 a
// walk away is what proves it is a function of WHERE YOU ARE.
//
// E3 IS EXPECTED TO STILL EXCEED 1.0 AND THAT IS NOT A FAILURE.  1.14x on
// surf_lt_unicorn says one map in the library still clips slightly at its
// worst point with the bed at 0.5, and the red line is supposed to say so.  A
// scale that silenced every map would be hiding the measurement rather than
// reporting it; the point of the instrument is that it still names the maps
// that need a lower setting.
//
// WHAT THIS STILL CANNOT SETTLE: whether 0.5 SOUNDS right.  That is a
// listening decision and every run of this feature has been deliberately
// muted.  The constant is a cvar precisely because this run cannot choose it.
// ---------------------------------------------------------------------------
// RESULTS, 2026-09-13.  logs/b64e_sum.log.  qwprogs.dat 1115894.
//
//   ARM  map                predicted          actual
//   E1   surf_tensor2       1.00x from 2       0.94x from 2 emitter(s)
//   E2   kz_secret_temple   1.04x from 5       0.87x from 5 emitter(s)
//   E3   surf_lt_unicorn    1.14x from 4       1.14x from 4  + red CLIPPING
//   E4   surf_tensor2 spawn 0.00x from 0       0.00x from 0 emitter(s)
//
// THE EMITTER COUNT IS EXACT ON ALL FOUR ARMS -- 2, 5, 4, 0 -- which is the
// half of the prediction that tests whether SV_AmbientSum walks the right set.
// E3 reproduced its sum exactly as well, and correctly printed the red
// CLIPPING line, so the threshold works in both directions.
//
// E1 AND E2 CAME IN BELOW PREDICTION AND THE REASON IS THE HARNESS, NOT THE
// CODE.  setpos does not noclip (a trap already recorded in this tree), so a
// player placed at a computed point in mid-air falls to the floor and one
// placed inside geometry is pushed out.  Either leaves the listener slightly
// further from the emitters than the point the prediction was computed at, and
// a slightly greater distance is a slightly smaller gain under a linear
// falloff.  The EMITTER COUNT is what distinguishes that from a real
// disagreement: a listener that had moved materially would drop or gain an
// emitter, and none of the three did.  Recorded rather than reconciled.
//
// E4 IS THE ARM THAT MAKES THE OTHER THREE MEAN ANYTHING.  0.00x from 0
// emitters at spawn, against 0.94x from 2 a short walk away ON THE SAME MAP IN
// THE SAME RUN, proves the figure is a function of where the listener is
// standing rather than a per-map constant.  Without it, three plausible
// numbers could all have been the same coincidence.
//
// E3 STILL CLIPS AT 1.14x AND IS REPORTED AS CLIPPING.  That is the intended
// outcome, not a failure: surf_lt_unicorn's worst point exceeds unity even
// with the bed at 0.5, and the instrument is supposed to name it.  A scale
// chosen to silence every map would be hiding the measurement instead of
// reporting it.
//
// ---------------------------------------------------------------------------
// WHAT THIS ARM SET IS REALLY ABOUT, because it is the third instrument added
// after a failure it could not express, and that is now a pattern worth naming.
//
//   arm set A  reported counts            -- all correct, map deafening
//   arm set B  added the falloff          -- fixed a real 3.5x error
//   arm set D  all four arms passed       -- surf_tensor2 still blared
//   arm set E  added the SUM              -- 2.00x at a point 0.00x at spawn
//
// Each report was true and each was unable to state the problem.  The counts
// could not express a falloff error; the falloff could not express an overlap.
// The lesson is not "add more numbers" -- it is that an instrument has to
// measure THE QUANTITY THE COMPLAINT IS ABOUT.  The complaint was always
// loudness, and until this run nothing in the entire layer printed a loudness.
//
// WHAT IS STILL UNVERIFIED: whether 0.5 SOUNDS right.  Every run of this
// feature has been deliberately muted, so this session has never heard any of
// it.  vbsp_sound_vol is a cvar because that is a listening decision and the
// numbers cannot make it.
// ---------------------------------------------------------------------------
// CORRECTION, added after this file was written: THE `here:` INSTRUMENT IS
// MEASURING A CODE PATH THAT DOES NOT RUN ON EVERY MACHINE.  Recorded rather
// than reworded, because the arm set above genuinely passed and is genuinely
// not evidence of what a player hears.
//
// A user on surf_tensor2 reported harsh noise while `ent_io` printed
// `here: 0.00x full scale from 0 emitter(s)` -- the instrument saying nothing
// should be audible where they were standing.  Their log opens with
// "Initiating OpenAL: Generic Software."
//
// SND_Spatialize -- FTE's linear falloff, which SV_AmbientSum mirrors exactly
// -- is only reached on the SOFTWARE mixer path.  snd_dma.c:3828 reads
// `if (sc->ChannelUpdate)` and, when a backend supplies one, hands the channel
// to the driver and `continue`s.  snd_al.c:1898 sets
// `sc->ChannelUpdate = OpenAL_ChannelUpdate`.  So on an OpenAL client the
// engine skips BOTH SND_Spatialize AND the static-sound combining at :3843,
// and the distance model is OpenAL's.
//
// TWO CONSEQUENCES, and the second is the better explanation of "HARSH":
//   * every `here:` figure above describes the software mixer.  On OpenAL it
//     is not wrong arithmetic, it is arithmetic about someone else's mixer.
//   * the software path deliberately COMBINES identical static sounds into one
//     channel -- its own comment says "so we don't mix five torches every
//     frame" (:3841) -- and the OpenAL path does not.  surf_tensor2 has 21
//     ambient_generic all playing ambient/levels/citadel/field_loop3.wav, so on
//     OpenAL that is 21 separate phase-offset sources of one sample summing.
//     That is comb filtering, which sounds HARSH rather than merely LOUD, and
//     "harsh noise" was the exact word used.
//
// This is the FOURTH instrument in this feature to be correct and unable to
// express the failure.  The pattern is no longer "add the missing number" --
// it is that an instrument must be measured against the machine the complaint
// came from, not against the source most convenient to read.  Any future
// loudness figure here has to be taken from the client (s_show / soundlist),
// not modelled on the server.
// ---------------------------------------------------------------------------
// ===========================================================================

log_enable 1
log_dir logs
log_name b64e_sum
developer 1
log_developer 1
cl_maxfps 100
con_notifylines 0

volume 0
bgmvolume 0

waitms 5000

echo ^5=== E1: surf_tensor2 worst point -- expect 1.00x from 2 ===
map surf_tensor2
waitmap 60
waitms 8000
setpos -224 -6080 -1184
waitms 2000
ent_io
waitms 1500

echo ^5=== E2: kz_secret_temple worst point -- expect 1.04x from 5 ===
map kz_secret_temple
waitmap 45
waitms 6000
setpos -2319 1078 16
waitms 2000
ent_io
waitms 1500

echo ^5=== E3: surf_lt_unicorn worst point -- expect 1.14x from 4 (still clips) ===
map surf_lt_unicorn
waitmap 45
waitms 6000
setpos -11360 -7248 11408
waitms 2000
ent_io
waitms 1500

echo ^5=== E4: surf_tensor2 AT SPAWN -- the control, expect 0.00x from 0 ===
map surf_tensor2
waitmap 60
waitms 8000
ent_io
waitms 2500

echo ^5=== END OF RUN ===
quit
