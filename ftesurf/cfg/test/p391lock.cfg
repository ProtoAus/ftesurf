// P391LOCK -- a clean run refuses the save-lock load keys (listen server, bhop_eazy).
//   ftesurf64.exe +set vid_winmaximize 0 -WindowStyle Minimized +exec cfg/test/p391lock.cfg
// then grep "====\|saveloc\|vote key:\|save\|timer:\|class:\|banner: error\|deleted\|Couldn't\|can't cache" logs/p391lock.log
// PRECONDITION: data/saves/bhop_eazy parked (renamed aside) -- the arms create and delete saves.
// Keys: 0=48 1=49 2=50 3-6=51-54 8=56 z=122.  `vote key` runs the whole CSQC input chain.
//
// PREDICTIONS (registered before the run):
//  A  `saveloc`: locked 0; "nothing saved".  `banner probe`: error sound 0 (sound/ftesurf/error.wav).
//  B  in the start box (cmd timer: armed): 1 saves ("save 1 ... no run"); 2 loads -- no
//     "no loads mid-run" line, took 1, server "saves: 1/1"; the up takes 1 (the hold's release).
//  C  zone_goto + walk out: cmd timer running, practice 0, class clean -- else VOID; saveloc locked 1.
//  D  mid-run 1 twice saves (saves 2, 3 with a time, not "no run"); panel-down 4 deletes:
//     "saves: 2/2".  No refusal line.
//  E  2 down: ONE "no loads mid-run -- R restarts the run" line, took 1; shot p391lock_e shows the
//     red flash under the clock; 2 down again (repeat): took 1, no second line; 2 up: took 1.
//     No "saves:"/"run resumed" line; cmd timer still running + clean; saveloc locked 1 refkey 0.
//  F  2 down, 2 s quiet, 2 down: two refusal lines (the latch lapsed); up took 1.
//  G  z opens; 3, 4, 5, 6 each: one refusal line, took 1 down and up; shot p391lock_g shows the
//     "no loads mid-run" row; saveloc: "2 saved ..., current 2" (cursor unmoved).
//  H  8 (arms), refused 2 (disarms), 8 (arms again): no "deleted" line; saveloc 2 saved.
//  I  rec_savelock 0: 2 took 0 down and up, no refusal line, no load.
//  J  hud_snd_error -> CS:S sound/buttons/weapon_cant_buy.wav: probe "error sound 1"; a refusal
//     plays it (audible only); "" -> "error sound 0 ()"; default -> 0.  Nowhere in the log:
//     "Couldn't load" / "can't cache" / a download for error.wav or weapon_cant_buy.
//  K  cmd sl_load (console route, not gated) -> "run resumed", class segmented, practice 1;
//     saveloc locked 0; key 2 then loads (no refusal line, "run resumed" again).
//  L  z, 8 down, 8 down again (a repeat, no up): no "deleted" line (was: deleted all); 8 up,
//     8 down: "deleted all 2 save state(s)"; saveloc: nothing saved.
//
// RESULTS 2026-09-20 02:50 (listen server, build with 391): ALL HELD.  A locked 0, nothing saved,
//  error sound 0.  B armed; save 1 "no run"; 2 took 1, "saves: 1/1", up took 1.  C running 0:01.940,
//  practice 0, class clean; locked 1.  D saves 2 (0:03.550) and 3 (0:04.150); 4 -> "saves: 2/2".
//  E one refusal line, repeat silent (took 1), up took 1; cmd timer running 0:07.120 clean; shot e:
//  "no loads mid-run -- R restarts" in red under the pb line.  F two lines 2 s apart.  G 3-6 one line
//  each, took 1/1; "2 saved, current 2"; shot g: the red row fits, Load Save unhighlighted.  H no
//  delete.  I took 0/0.  J probe 1 on weapon_cant_buy.wav, 0 on "" and on the default; no
//  Couldn't-load / can't-cache line for either.  K "run resumed at 0:03.550 ... shadow run",
//  segmented, practice 1, locked 0, key 2 loaded again.  L the repeat kept the arm (2 saved), a
//  fresh 8 deleted all 2.  Not covered: the ~1 RTT window (listen server), a finished run, sound audible.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p391lock
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
sv_port 27644
sv_cheats 0
set run_resume 0
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_conautoscale 0
vid_conwidth 1280
vid_conheight 720
waitms 5000
map bhop_eazy
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 500
hud_scale 2
set rec_savelock 1
set hud_timer 1
set hud_snd_error "sound/ftesurf/error.wav"
echo ==== A ====
saveloc
banner probe
waitms 800
echo ==== B ====
cmd zone_goto 0 16.18 0
waitms 700
cmd viewpos
cmd timer
waitms 800
vote key 49 1
vote key 49 0
waitms 800
vote key 50 1
waitms 400
vote key 50 0
waitms 1000
echo ==== C ====
cmd zone_goto 0 16.18 0
waitms 700
+forward
waitms 2200
-forward
waitms 400
cmd viewpos
cmd timer
waitms 800
saveloc
waitms 800
echo ==== D ====
vote key 49 1
vote key 49 0
waitms 600
vote key 49 1
vote key 49 0
waitms 600
vote key 52 1
vote key 52 0
waitms 800
echo ==== E ====
vote key 50 1
waitms 300
screenshot p391lock_e
vote key 50 1
waitms 200
vote key 50 0
waitms 1000
cmd viewpos
cmd timer
waitms 800
saveloc
waitms 800
echo ==== F ====
vote key 50 1
waitms 2000
vote key 50 1
vote key 50 0
waitms 500
echo ==== G ====
vote key 122 1
vote key 122 0
waitms 300
vote key 51 1
vote key 51 0
vote key 52 1
vote key 52 0
vote key 53 1
vote key 53 0
vote key 54 1
vote key 54 0
waitms 300
screenshot p391lock_g
waitms 500
saveloc
waitms 800
echo ==== H ====
vote key 56 1
vote key 56 0
vote key 50 1
vote key 50 0
vote key 56 1
vote key 56 0
waitms 800
saveloc
waitms 800
vote key 48 1
vote key 48 0
echo ==== I ====
set rec_savelock 0
vote key 50 1
vote key 50 0
set rec_savelock 1
waitms 800
saveloc
waitms 800
echo ==== J ====
set hud_snd_error "sound/buttons/weapon_cant_buy.wav"
banner probe
vote key 50 1
vote key 50 0
waitms 300
banner sound err
set hud_snd_error ""
banner probe
set hud_snd_error "sound/ftesurf/error.wav"
banner probe
waitms 500
echo ==== K ====
cmd sl_load
waitms 800
cmd viewpos
cmd timer
waitms 800
saveloc
waitms 800
vote key 50 1
waitms 400
vote key 50 0
waitms 800
echo ==== L ====
vote key 122 1
vote key 122 0
vote key 56 1
vote key 56 1
waitms 800
saveloc
waitms 800
vote key 56 0
vote key 56 1
vote key 56 0
waitms 800
saveloc
