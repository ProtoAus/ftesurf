// P403TICK -- prove Patch 403's review fix: the clamp now runs once per USERCMD,
// not once per PACKET.
//
// The first cut called SV_StartCapClamp from SV_TimerFrame, which hangs off
// PlayerPostThink -- and the engine runs PlayerPostThink once per packet, outside
// the per-usercmd loop (sv_user.c:9331), while trigger_push_touch re-arms the
// whole push once per COMMAND.  So it trimmed the last command of each bunch and
// left the rest at full value, and a client picking its packet rate picked the
// ratio.  It is now called from PlayerPreThink (sv_player.qc), per command,
// above SV_BaseVelocityFrame.
//
// cl_c2spps 10 drops outgoing packets so each one carries about 3 commands
// (cl_input.c:3570) -- the exact shape that exposed the bug.  run_bv_debug 1
// makes SV_StartCapClamp print one `startcap:` line every time it fires.
//
// SETUP: copy cfg/test/p403stage.zones.json -> maps/zones/local/bhop_arcane.json.
// The body sits armed INSIDE the *88 booster (the fixture start box wraps it) and
// is clamped every command it stands there.
//
// PRE-REGISTERED
//  T1 `startcap:` lines appear at roughly the COMMAND rate (100/s at cl_maxfps
//     100), not the packet rate (~10/s under cl_c2spps 10).  Over the ~4 s the
//     body stands armed that is order 300+ lines, not order 30.
//  T2 every line reads the same clamp: about 1400 -> 290.
// FALSIFIED IF the count is at packet rate -- the fix did not take.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p403tick
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
sv_cheats 0
fs_missingwarn 0
set run_resume 0
set run_bv_debug 1
sv_port 27682

wait 200
map bhop_arcane
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 1000
cl_c2spps 10
waitms 200

echo ^5=== T: stand armed inside the booster ===
say !r
waitms 4000
cmd viewpos
cmd timer

echo ^5=== P403TICK DONE ===
waitms 500
quit
