// BV01 -- do the booster pads boost?
//
// bhop_futile carries six trigger_multiple whose OnJump fires
//     !activator,AddOutput,basevelocity 0 0 <650..1140>
// and until Patch 249 every one of them delivered about 1.5% of its number.
//
// THE MEASUREMENT IS THE PRINT.  run_bv_debug 1 makes SV_BaseVelocityFrame
// report what it held and what it paid, so a pad authored 650 must read
//
//     basevel #1/1: paid '0 0 650' -> speed S (h +0.0, v +653.3)
//
// 653.3 and not 650 because Source scales the cash-out by (1 + tick*0.5) --
// its own "add in half of the previous frame of velocity first".  bhop runs
// pm_ticrate 0.01, so 650 * 1.005 = 653.25.  Whichever way, the number must
// NOT be 6.5, which is what basevelocity-as-an-acceleration would have paid.
//
// THE FIRST ATTEMPT AT THIS TEST STOOD STILL AND SAW ALMOST NOTHING.  A
// stationary player generates very few trigger touches -- SOLID_BSPTRIGGER
// touch links are evaluated off the move -- so four jumps produced ONE
// OnJump, and it came from a different brush stacked at the same spot.  So
// this holds +forward as well as +jump, which keeps the touch firing.
//
// The pads, from the map's own lump.  Bounds are relative to the entity
// origin, so these are origin + rel:
//     *121  -4416 -7616 12062  ->  x -5120..-3712  y -8192..-7040  z 11804..11808   950
//     *13    5440  2672  7954  ->  x  5312.. 5568  y  2544.. 2800  z  7920.. 7924  1140
//     *14    3872  4304  5394  ->  x  3744.. 4000  y  4176.. 4432  z  5360.. 5364   650
//
// *121 is used first because it is 1408 x 1152 -- the others are 256 square
// and share their footprint with other triggers.
//
// NOTE ON THE FILTER.  All six carry `filtername "boosterqwd"` and no such
// entity exists in the map.  Build 37 already fails OPEN on a dangling filter
// name, which is what Source does, so they fire.

log_enable 1
log_dir "logs"
log_name "bv01"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
developer 1
log_developer 1

wait 200

map bhop_futile
waitmap 1800
waitms 6000

sv_cheats 1
run_bv_debug 1

echo ^5=================== pm_ticrate / gravity in force ===================
pm_ticrate
sv_gravity
waitms 500

echo ^5=================== pad *121, authored 950 ==========================
setpos -4416 -7616 11840
waitms 1500
+forward
+jump
waitms 2500
-jump
-forward
waitms 600
screenshot bv01_pad950
waitms 400

echo ^5=================== pad *13, authored 1140 ==========================
setpos 5440 2672 7950
waitms 1500
+forward
+jump
waitms 2500
-jump
-forward
waitms 600
screenshot bv01_pad1140
waitms 400

echo ^5=================== pad *14, authored 650 ===========================
setpos 3872 4304 5390
waitms 1500
+forward
+jump
waitms 2500
-jump
-forward
waitms 600
screenshot bv01_pad650
waitms 400

echo ^5=== bv01 done ===
wait 30
quit
