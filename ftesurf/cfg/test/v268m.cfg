// V268M -- Patch 268 Part F: the mouse grab must follow the FOREGROUND window.
//
// This cfg does almost nothing on purpose. It puts the game in a small window and
// idles, so the harness (scratchpad/focustest.ps1) can hold the foreground away
// from it and then watch what happens to the physical cursor.
//
// THE INSTRUMENT IS THE CURSOR POSITION, read from Win32 by the harness:
//   grabbed     -> INS_Accumulate/INS_MouseMove warp the cursor to the window
//                  centre every frame, so a SetCursorPos elsewhere is undone
//                  within ~16ms.
//   not grabbed -> a SetCursorPos stays exactly where it was put.
//
// Reproducing the reported bug needs the game to hold its own thread's keyboard
// focus WITHOUT being the foreground window. A plain alt-tab does NOT do this --
// that delivers a real WM_KILLFOCUS and releases the grab even on an unpatched
// build. The harness instead keeps another window foreground across the game's
// startup, so the engine's SetForegroundWindow at gl_vidnt.c is refused while its
// own SetFocus(dibwindow) still succeeds. That is the stuck-true state.
//
// in_focusgrab 0 = pre-268 behaviour (messages only) and must FAIL this test;
// in_focusgrab 1 = the fix and must pass. The cvar is set by the harness on the
// command line so one cfg serves both halves.

log_enable 1
log_dir "logs"
developer 1
log_developer 1
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 0
con_notifytime 0
con_notifylines 0
con_notifytime_error 0

// a small window, well away from the screen centre, so "warped to the window
// centre" and "left where the harness put it" are far apart and unambiguous.
vid_fullscreen_order 1
vid_winmaximize 0
vid_fullscreen 0
vid_width 800
vid_height 600
vid_restart
waitms 4000

// A MAP IS REQUIRED, and the first version of this test was wrong without one.
// INS_UpdateGrabs asks Key_MouseShouldBeFree() (keys.c), which returns true
// whenever key_dest wants an absolute cursor -- the console and the menu both do.
// At the console NOTHING grabs the mouse, patched or not, so the pre-patch build
// passed a test it should have failed. The reported symptom is the VIEWANGLES
// moving, which only happens with key_dest on the game itself.
//
// df_map is the smallest map in the library (41KB) purely so this loads fast.
map df_map
waitmap 1800
waitms 6000

echo ^5=== v268m: in a map, idling for the focus harness ===
wait 3000
echo ^5=== v268m done ===
quit
