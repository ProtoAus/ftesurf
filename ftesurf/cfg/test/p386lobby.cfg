// Patch 386 rig (d)(4): the Linux client joins a live Pi lobby and reads the online board over HTTPS.
// Run in the Debian rig from /home/surf/rig-post (steam_libraries.txt -> the Windows Steam library):
//   rig-run.sh <install> x11 p386lobby_<arm> cfg/test/p386lobby.cfg +set p386_target 192.168.1.102:<port> +set p386_shot p386lobby_<arm> [-notls]
// Target: an empty lobby from http://192.168.1.102:8084/lobbies.json whose current map has board rows.
// NEVER ui_join here: /api/join files a claim that can move a public lobby's map.
// Arms: A normal; B the same with -notls on the command line (control: the HTTPS board must fail).
// rec_terms 4 is set after menu_restart (m_init resets it from data/consent.txt, absent here),
// or the board stops at "terms not accepted" before any TLS is attempted.
// PRE-REGISTERED 2026-09-19, before either arm ran:
//   1 `tls_provider bogus` lists GNUTLS as a valid value (both arms: the driver table is static).
//   2 "FTESurf CSQC loaded"; `timer` prints "cl stats".  csprogs matched locally, no download line:
//     the rig's csprogs.dat and the Pi's are the same bytes (sha256 0dc574c0f5cb0f74).
//   3 zero QC error / PR_ExecuteProgram / runaway lines; a trig census line from trig_dump.
//   4 prederr: no constant or growing cascade over the 15 s idle (AGENTS.md:258-262).
//   5 A: board_status "online board: ok" with rows > 0; zero "GnuTLS ... library not available".
//     B: board_status not ok (failed), rows 0.
// FALSIFIED IF: B's board is ok (the observable does not depend on TLS), or A's is not.
// AMENDED 2026-09-19 19:52 (review: written AFTER the ext4 reruns of A 19:50-19:51 and B 19:51 had
//   started, not before them as first stated), after arm A on drvfs: that run was dropped
//   ("Host_EndGame: Server disconnected", 55 s after connect, no map loaded) -- two back-to-back
//   ~27 s FS rebuilds over /mnt/c against the lobby's timeout 30.  A and B rerun with the Steam
//   library on ext4 (tools/linux/rig-steamlite.sh); predictions unchanged.
// RESULT 2026-09-19, lobby2 192.168.1.102:27520 on surf_beginner (1 board row), 0 players,
//   build 23f1ce06b (logs/linux/p386lobby_{A,B,A_drvfs}.*):
//   1 HELD both arms: "valid values are: GNUTLS".
//   2 HELD: connected in <1 s, "FTESurf CSQC loaded" 2 s later, `timer` printed "cl stats".
//     csprogs matched locally: "COM_WriteFile: csprogsvers/1dfcf1cc.dat" (the local copy
//     cached under the server's *csprogs), no download line.
//   3 HELD: 0 QC/PR_ExecuteProgram/runaway/Host_Error lines; trig: 40 teleports, 13 targetname
//     rows, hook alive (seq 12).
//   4 HELD: 0 prederr lines in 15 s at cl_prederror 2 (idle, so it shows only no cascade).
//   5 HELD: A "online board: ok", surf_beginner rows 1 (Kap 1:00.750, verified), fetched twice,
//     0 "library not available" lines.  B "failed (code -1)", rows 0, "play.proto.bar: no tls
//     provider available" per uri_get.
//   drvfs arm: the HUD never loaded (timer/scores/board_status all "Unknown command").
cfg_save_auto 0
log_enable 1
log_dir logs
developer 1
set csqc_warnfail 1
set cl_download_csprogs 1
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
name "^3Lex P386 linux test"
waitms 20000
echo ======== P386 tls_provider
tls_provider bogus
echo ======== P386 connect $p386_target
connect $p386_target
waitmap 120
waitms 15000
echo ======== P386 serverinfo
serverinfo
echo ======== P386 client csqc
timer
menu_restart
waitms 1000
ui_close
waitms 3000
screenshot $p386_shot
waitms 1000
echo ======== P386 trig census
trig_dump
echo ======== P386 prederr 15 s
cl_prederror 2
waitms 15000
cl_prederror 0
echo ======== P386 board
set rec_terms 4
set lobby_dir "https://play.proto.bar"
scores open
waitms 500
scores tab online
waitms 200
scores refresh
waitms 8000
board_status
scores status
echo ======== P386 done
disconnect
waitms 1000
quit
