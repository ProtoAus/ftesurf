// P431WIN -- Patch 431: a stage opened from a board row loads fast and is cut to its
// stage.  surf_rookie r47 (Proto, 8:26.580, 6.7 MB -- over the 5 MB line fs_win32.c
// memory-maps, so buf_loadfile read it a ReadFile per byte).  `replay online 47 5` is
// the board row's path (rec_wt_wantleg, then Watch_Open).  Run p431reg first; this
// needs data/runs/surf_rookie/main/last.rec = a copy of r47 for A8 (the harness copies
// it in and removes it after).  +set log_name p431win (new), p431win-ctl with
// +set sv_csqc_progname csprogs_ctl431.dat (HEAD 9d1436a).
//
// PRE-REGISTERED (new build)
//  A1 `replay online 47 5`: `replay: stage 5 window 33.2250..37.3650 s from 32.2250
//     (ticks 2215..2491, stagepost)` and `opened in` under 250 ms (ctl 13,290).
//     status: `cut 1`, `view 32.2250..37.3650`, t 32.2250.
//  A2 `replay seek 100` -> t 37.3650; `replay seek 0` -> t 32.2250 (the cut clamps).
//  A3 seek 36.5, play at 1x for 3 s: exactly one `stage 5 window end 37.3650 --
//     paused`, then t 37.3650 paused 1; `replay play` 1 s: still t 37.3650 paused 1,
//     no second end line.
//  A4 `replay cut 0`: `replay: built -1.6800..506.5630 in N ms`, status view
//     -1.6800..506.5630 cut 0; `replay seek 100` -> t 100.0000.
//  A5 `replay cut 1`: view 32.2250..37.3650, t 37.3650 (clamped), no `built` line.
//  A6 `replay online 47` then `replay window 5`: the A1 window line; cut 1.
//  A7 `replay online 47 99`: `no window for stage 99`; view -1.6800..506.5630 cut 0.
//  A8 local tab on surf_rookie with last.rec = r47: the `last` row reads 8:26.580,
//     and `scores status` answers within 1 s of the echo before it (ctl ~13 s).
//  No QC error line.
// CONTROL (ctl csprogs): A1 no window line and `opened in` ~13,000; `replay cut` reads
//  as a path (`cut is not a .rec`); A2 `seek 100` -> t 100.  A8 answers ~13 s late.
//
// RESULT (2026-09-22, new build): A1-A7 as registered.  A1 `opened in 67 ms` and the
//  window line verbatim, t 32.2250 cut 1; A2 37.3650 / 32.2250; A3 one end line, then
//  t 37.3650 paused 1 twice; A4 `built -1.6800..506.5630 in 315 ms`, t 100.0000; A5
//  t 37.3650 no build line; A6 the A1 line after a 407 ms whole open; A7 `no window
//  for stage 99` and the whole file.  A8 FAILED AS A HARNESS: `scores leg 1` ran before
//  the legs were derived and picked leg 19 -- redone as p431trail.
//  CONTROL (p431win-ctl): A1 no window line, `opened in` 13 s; `replay cut` -> `cut is
//  not a .rec`; `seek 100` -> t 100.  Failed as registered.
//  p395win on the new build: every window line verbatim; A1's `replay play` after the
//  end now holds t 17.2350 paused 1 (was 23.2552 paused 0) -- the cut, by design.
cfg_save_auto 0
log_enable 1
log_dir logs
developer 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0
set run_resume 0
sv_public 0
sv_port 27679
set lobby_dir ""
set hud_watch_skipidle 0

wait 200
map surf_rookie
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 1000
echo ^5=== p431win A1 ===
replay online 47 5
replay pause
waitms 300
replay status
echo ^5=== p431win A2 ===
replay seek 100
waitms 300
replay status
replay seek 0
waitms 300
replay status
echo ^5=== p431win A3 ===
replay seek 36.5
replay play
waitms 3000
replay status
replay play
waitms 1000
replay status
echo ^5=== p431win A4 ===
replay cut 0
waitms 300
replay status
replay seek 100
waitms 300
replay status
echo ^5=== p431win A5 ===
replay cut 1
waitms 300
replay status
echo ^5=== p431win A6 ===
replay online 47
waitms 300
replay window 5
replay pause
waitms 300
replay status
echo ^5=== p431win A7 ===
replay online 47 99
replay pause
waitms 300
replay status
replay stop
waitms 500
echo ^5=== p431win A8 ===
scores leg 1
scores tab local
echo ^5=== p431win A8 status ===
scores status
waitms 500
echo ^5=== p431win done ===
quit
