cfg_save_auto 0
// Patch 298f -- DOES FOG EVER REACH FULL OPACITY?
//
// THE TURN THIS INVESTIGATION JUST TOOK.  I spent four runs asking "which props
// are unfogged" and killed four hypotheses doing it (prop-vs-brush, $nofog,
// per-material, envmap -- the last at 0.000% change from r_envcubemap 0).  Then
// I magnified a fogged building instead of measuring it, and the premise was
// wrong: under `skyroomfog end 1u alpha 1`, with every surface 700+ units away,
// the buildings should be a FLAT WALL of fog colour with no detail at all.  The
// entire texture survives -- light walls, dark window panes, clearly legible.
// Measured on the fogged props: std 28.1 7.9 36.4, and 0.0% of pixels within 8
// of the fog colour.
//
// And it is NOT a skyroom fault.  The same test on the MAIN view at save008
// (p298c C6b, fog 255,0,255 alpha 1 end 1u) also reaches 0.0% -- median
// 187 56 244 where it must be 255 0 255.  The skyroom is simply worse: its
// props sit at a uniform 0.68x of the main view's numbers (127/187, 163/244,
// 39/56), which is a second, separate brightness question.
//
// So the real fault behind Lex's "bright black" buildings is that FOG NEVER
// SATURATES.  A fully-fogged surface keeps a large fraction of its own colour,
// so a dark texture stays dark and reads as a black silhouette against a
// lighter sky -- which is exactly the reported picture, and exactly what CS:S
// does not do.
//
// WHY WHITE AND BLACK.  Every measurement so far mixed an unknown surface
// colour with an unknown fog fraction, and two unknowns per channel is why the
// arithmetic kept coming out inconsistent (green rising where the fog colour's
// green was zero).  Pure white and pure black pin both endpoints with no
// unknowns: under correct total fog the region must be EXACTLY 255,255,255 and
// EXACTLY 0,0,0, and -- the real deliverable -- its STANDARD DEVIATION must be
// ZERO.  Any surviving std IS the surviving texture, measured directly.
//
// The candidate the fog-math trace already named: gl_vidcommon.c:1865-1866,
//     fac = (1.0-w_fogalpha) + (clamp(fac,0,1)*w_fogalpha);
//     return mix(w_fogcolour, regularcolour, fac);
// fac is the fraction of the SURFACE that survives, so the greatest fog opacity
// achievable is exactly w_fogalpha, at any distance.  F4/F5 vary alpha on
// purpose to find out whether that dial is live and whether 1 is being honoured.
//
// PRE-REGISTERED, judged against F8 (repeat control):
//   F2 white gives mean 255,255,255 std 0  -> fog saturates; my reading is
//      wrong and the black buildings are something else after all.
//   F2 white gives mean < 255 with std > 0 -> fog does not saturate.  The std
//      is the size of the fault and the mean says how much fog we are getting.
//   F4 (alpha 0.5) differing from F2 proves alpha is live and honoured, which
//      would mean the shortfall is NOT w_fogalpha and is upstream of it.
//   F4 == F2 means alpha is being ignored or clamped, and w_fogalpha IS it.
//   F6/F7 ask the identical question of the MAIN view at a different stage, so
//      the answer cannot be a skyroom artefact.
vid_fullscreen 0
vid_restart
waitms 3000
wait 200

developer 1
log_developer 1
log_enable 1
log_dir logs
log_name p298f_saturate
cl_maxfps 0
cl_idlefps 0
sv_cheats 1
con_notifylines 0
con_notifytime 0.01
r_drawviewmodel 0

map surf_tensor2
waitmap 600
waitms 9000
waitms 3000
noclip
waitms 1000

alias vwin   "setpos -7563.2915 10425.6309 -974.1351 1.9775 -0.39 0; waitms 2000"
alias vstage "setpos -10751.1777 9562.7969 -9789.3184 -0.0934 89.4342 0; waitms 2000"

// Post-processing state, so the screenshots can be read as evidence at all.
echo ^5=== POST-PROCESSING STATE ===
vid_gamma
vid_contrast
vid_contrastboost
gl_contrast
r_postprocshader
r_fog_linear
r_fog_exp2
r_skyfog
fog
skyroomfog

// ---- F1: baseline ----
echo ^5=== F1: shipped defaults
vwin
screenshot p298f_f1_default

// ---- F2: skyroom fog PURE WHITE, alpha 1, end 1u ----
skyroomfog 1 1 1 1 1 0
echo ^5=== F2: skyroomfog WHITE alpha 1 end 1u -- must be 255,255,255 std 0
vwin
screenshot p298f_f2_white

// ---- F3: skyroom fog PURE BLACK, alpha 1, end 1u ----
skyroomfog 1 0 0 0 1 0
echo ^5=== F3: skyroomfog BLACK alpha 1 end 1u -- must be 0,0,0 std 0
vwin
screenshot p298f_f3_black

// ---- F4: white at alpha 0.5 -- is alpha live? ----
skyroomfog 1 1 1 1 0.5 0
echo ^5=== F4: skyroomfog WHITE alpha 0.5 -- differs from F2 iff alpha is live
vwin
screenshot p298f_f4_white_a50

// ---- F5: white at alpha 1 again -- repeat control for F2 ----
skyroomfog 1 1 1 1 1 0
echo ^5=== F5: skyroomfog WHITE alpha 1 again -- repeat control for F2
vwin
screenshot p298f_f5_white_again

// ---- F6/F7: the SAME question of the MAIN view, different stage ----
skyroomfog 23.4375 0.160784 0.258824 0.352941 1 11.7188
echo ^5=== F6: save008 baseline
vstage
screenshot p298f_f6_stage_default

fog 1 1 1 1 1 0
echo ^5=== F7: MAIN fog WHITE alpha 1 end 1u -- must be 255,255,255 std 0
vstage
screenshot p298f_f7_stage_white

echo ^5=== END OF RUN ===
waitms 500
quit
