// FOG05 -- is surf_legends' fog failure about DISTANCE, or about fog at all?
//
// Ruled out so far:
//   * the gamecode -- `fog 800 1 0 0 1 0` typed at the engine did nothing either
//   * the materials -- the map's VMTs are LightmappedGeneric and UnlitGeneric
//     with NO $nofog; only the six skybox faces carry it, which is correct
//   * the 3D skybox -- vbsp_skyroom 0 made no difference
//
// And the fog04 probe was worthless: shader_here reported hit=nothing on legends
// and the SAME hit point at pitch 89 and pitch 0 on bowling, so `setangles` is
// not moving the view and that whole test measured nothing.  Noted so it is not
// trusted later.
//
// So stop trying to control the camera and use a probe no geometry can escape:
// fog ending at ONE unit.  Every pixel of world beyond 1 unit is then 100% fog
// colour.  If the screen does not go solid red, fog is not being drawn on this
// map, full stop -- no argument about sightline lengths is possible.
//
// Then the same in EXP mode, because r_fog_linear is mine (Patch 254) and it is
// the one global thing this work changed.  If exp fog draws where linear does
// not, the fault is in the linear path, not the map.
//
// bhop_bowling runs the identical sequence as a control.

log_enable 1
log_dir "logs"
log_name "fog05"
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 0
vid_fullscreen 0
con_notifytime 0
con_notifylines 0
con_notifytime_error 0
vbsp_fog 0
wait 200

echo ^5=========== surf_legends ==========================================
map surf_legends
waitmap 1800
waitms 9000
screenshot fog05_legends_0_nofog
waitms 800

echo ^3--- LINEAR, end=1: every world pixel must be solid RED
r_fog_linear 1
waitms 500
fog 1 1 0 0 1 0
waitms 1500
fog
waitms 400
screenshot fog05_legends_1_linear_end1
waitms 800

echo ^3--- EXP mode, dense red.  density 64 in exp = very thick.
r_fog_linear 0
waitms 500
fog 64 1 0 0 1 0
waitms 1500
screenshot fog05_legends_2_exp_dense
waitms 800
r_fog_linear 1
waitms 500

echo ^5=========== bhop_bowling (control) ================================
map bhop_bowling
waitmap 1800
waitms 9000
screenshot fog05_bowling_0_nofog
waitms 800

echo ^3--- LINEAR, end=1 on the map that already fogs
r_fog_linear 1
waitms 500
fog 1 1 0 0 1 0
waitms 1500
screenshot fog05_bowling_1_linear_end1
waitms 800

echo ^3--- EXP mode, dense red
r_fog_linear 0
waitms 500
fog 64 1 0 0 1 0
waitms 1500
screenshot fog05_bowling_2_exp_dense
waitms 800
r_fog_linear 1
waitms 500

echo ^5=========== done ==================================================
log_enable 0
