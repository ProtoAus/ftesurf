// P403PROBE -- geometry probe for the start-speed-cap falsifier and the `lift`
// capture (anti-cheat open item 5b and item 8).  READ-ONLY: it measures where a
// body rests, nothing else.  bhop_arcane world bboxes (scratchpad/bhoparcane.py):
//   *86  push +y 1800   6848 3072 -128 .. 6976 3584 0
//   *87  push +y 1400   6848 2560 -128 .. 6976 3072 0
//   *252 push UP  1250  1024 -11232 13056 .. 2048 -10240 15616
// P1 asks: standing in *86, where does the push carry a body, and does it stay on
//    the floor?  That decides where a fixture START zone can sit around it.
// P2 asks: is there a floor inside *252 to stand on?  A `lift` warp needs
//    FL_ONGROUND when an upward push fires (sv_entities.qc:5608).
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p403probe
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
sv_cheats 1
fs_missingwarn 0
set run_resume 0
sv_port 27682

wait 200
map bhop_arcane
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 1000

echo ^5=== P1 in *86 (push +y 1800) ===
cmd setpos 6912 3100 -120 0 90 0
waitms 100
cmd viewpos
waitms 250
cmd viewpos
waitms 250
cmd viewpos
waitms 500
cmd viewpos
waitms 1000
cmd viewpos
waitms 1500
cmd viewpos

echo ^5=== P1b in *87 (push +y 1400), lower entry ===
cmd setpos 6912 2600 -120 0 90 0
waitms 100
cmd viewpos
waitms 500
cmd viewpos
waitms 1500
cmd viewpos

echo ^5=== P2 in *252 (push UP 1250), floor sweep ===
cmd setpos 1536 -10700 13100 0 0 0
waitms 400
cmd viewpos
waitms 800
cmd viewpos
cmd setpos 1536 -10700 13600 0 0 0
waitms 400
cmd viewpos
waitms 800
cmd viewpos
cmd setpos 1200 -11000 14400 0 0 0
waitms 400
cmd viewpos
waitms 800
cmd viewpos

echo ^5=== P403PROBE DONE ===
waitms 500
quit
