// SLIDE02 -- Patch 280 (func_slide), the A/B re-run with probes OUTSIDE the trigger_setspeed
// volumes that launched every slide01 probe: surf_mom_training *14 (HorizontalSpeed 1100 along
// +y) covers *6's y 2880..2912, and *53 (1180 at pitch 45 along +y) covers *54's whole top.
// FLAT arms, surf_mom_training:
//   *8  allowjump 0, x 5408..7328, y 2912..5952, top z 1152.  Probe 6368 3500 1154 (yaw 0 = +x,
//       960 units of brush ahead); y 3500 keeps clear of trigger_teleport *10/*11 (y >= 4160).
//   *6  allowjump 1, x 6688..7328, y 2832..2912, top z 1152.  Probe 7008 2850 1154: the 32-wide
//       hull spans y 2834..2866, inside the brush and clear of *14's 2880.  Expect skin -30
//       (SKIN_SLIDE_BASE -32 + ALLOWJUMP 2) on the under line.
//   CTL the map's real start floor -14080 12800 2560 (setpos 0 0 70 lands in trigger_teleport *1
//       and is sent there anyway).
// SLOPE arms, bhop_everfast *92 (allowjump 0; the only entity within 900 units): top face
//   normal (0,0.351,0.936) = 20.5 degrees, x -1120..1152, y 7200..7456, z = -832 - 0.375*(y-7200),
//   descending toward +y.  The 32-wide hull rests on its -y (uphill) bottom edge, so the origin
//   at rest is z = -832 - 0.375*(y-16-7200) = -863.5 at y 7300; probe 2 above, yaw 90 looks
//   down-slope.  2d acceleration along the face 800*sin*cos = 262 u/s^2; 156 units to the foot
//   is 1.09 s, samples at 250/450/650 ms.  Read cmd replies in ORDER (viewpos, then slideinfo).
log_enable 1
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
con_notifylines 0
developer 1
log_developer 1

wait 200
map surf_mom_training
waitmap 120
waitms 8000
sv_cheats 1
waitms 400
pm_dispprobe 0
pm_ladderprobe 0
pm_slide
pm_autobunny

echo ^5=== CTL: world floor at the real start, pm_slide 1, must stand ===
pm_slide 1
waitms 300
setpos -14080 12800 2562 0 0 0
waitms 1200
cmd viewpos
cmd run_slideinfo
waitms 400
cmd run_slideinfo
waitms 800

echo ^5=== F1: pm_slide 1, flat *8 allowjump 0: rest (onground 0, speed 0) then +jump must NOT jump ===
pm_slide 1
waitms 300
setpos 6368 3500 1154 0 0 0
waitms 1200
cmd viewpos
cmd run_slideinfo
waitms 300
cmd run_slideinfo
+jump
waitms 100
-jump
cmd run_slideinfo
waitms 250
cmd run_slideinfo
waitms 800

echo ^5=== F0: pm_slide 0, flat *8: rest (onground 1) then +jump jumps (control) ===
pm_slide 0
waitms 300
setpos 6368 3500 1154 0 0 0
waitms 1200
cmd viewpos
cmd run_slideinfo
+jump
waitms 100
-jump
cmd run_slideinfo
waitms 250
cmd run_slideinfo
waitms 800

echo ^5=== G1: pm_slide 1, flat *6 allowjump 1 (skin -30): rest (onground 0) then +jump jumps ===
pm_slide 1
waitms 300
setpos 7008 2850 1154 0 0 0
waitms 1200
cmd viewpos
cmd run_slideinfo
waitms 300
cmd run_slideinfo
+jump
waitms 100
-jump
cmd run_slideinfo
waitms 250
cmd run_slideinfo
waitms 800

echo ^5=== G0: pm_slide 0, flat *6: rest (onground 1) then +jump (control) ===
pm_slide 0
waitms 300
setpos 7008 2850 1154 0 0 0
waitms 1200
cmd viewpos
cmd run_slideinfo
+jump
waitms 100
-jump
cmd run_slideinfo
waitms 250
cmd run_slideinfo
waitms 800

echo ^5=== E1: pm_slide 1, flat *8, +forward 700ms (air cap: speed2d <= ~30, onground 0) ===
pm_slide 1
waitms 300
setpos 6368 3500 1154 0 0 0
waitms 1200
cmd viewpos
+forward
waitms 700
cmd run_slideinfo
-forward
waitms 300
cmd run_slideinfo
waitms 800

echo ^5=== E0: pm_slide 0, flat *8, +forward 700ms (walk: speed2d ~250, onground 1) ===
pm_slide 0
waitms 300
setpos 6368 3500 1154 0 0 0
waitms 1200
cmd viewpos
+forward
waitms 700
cmd run_slideinfo
-forward
waitms 300
cmd run_slideinfo
waitms 800

echo ^5=== SLOPE: map bhop_everfast *92, 20.5 degrees, standable today ===
pm_slide 1
map bhop_everfast
waitmap 600
waitms 8000
sv_cheats 1
waitms 400
pm_dispprobe 0
pm_ladderprobe 0

echo ^5=== A1: pm_slide 0 on *92 (expect stand: onground 1, speed 0, under func_slide skin -32 normal.z 0.936) ===
pm_slide 0
waitms 300
setpos 16 7300 -861 0 90 0
waitms 250
cmd viewpos
cmd run_slideinfo
waitms 200
cmd run_slideinfo
waitms 200
cmd run_slideinfo
waitms 800

echo ^5=== B1: pm_slide 1 on *92 (expect slide: onground 0, speed2d rising ~262 u/s^2, y increasing, z = -832 - 0.375*(y-16-7200)) ===
pm_slide 1
waitms 300
setpos 16 7300 -861 0 90 0
waitms 250
cmd viewpos
cmd run_slideinfo
waitms 200
cmd run_slideinfo
waitms 200
cmd run_slideinfo
waitms 1500

echo ^5=== A2: pm_slide 0 again ===
pm_slide 0
waitms 300
setpos 16 7300 -861 0 90 0
waitms 250
cmd viewpos
cmd run_slideinfo
waitms 200
cmd run_slideinfo
waitms 200
cmd run_slideinfo
waitms 800

echo ^5=== B2: pm_slide 1 again ===
pm_slide 1
waitms 300
setpos 16 7300 -861 0 90 0
waitms 250
cmd viewpos
cmd run_slideinfo
waitms 200
cmd run_slideinfo
waitms 200
cmd run_slideinfo
waitms 1500

echo ^5=== C: pm_slide 1, *92 has allowjump 0, +jump must NOT jump (no vel_z > 0) ===
pm_slide 1
waitms 300
setpos 16 7300 -861 0 90 0
waitms 300
cmd run_slideinfo
+jump
waitms 150
-jump
cmd run_slideinfo
waitms 200
cmd run_slideinfo
waitms 1500

echo ^5=== slide02 done ===
pm_slide 1
wait 30
quit
