// BUILD 65 -- per-element HUD customisation, the segment row's absolute energy,
// the Boarding window, three defects and three crosshairs.
// `exec cfg/build65.cfg`, then use the aliases below.
//
// WHAT IS ALREADY VERIFIED: the build.  All three modules compile with zero
// warnings, and the four defaults that had to match between cfg/default.cfg and
// registercvar were checked by hand (they must, because default.cfg runs BEFORE
// the CSQC VM loads and registercvar declines a cvar that already exists).
//
// WHAT NEEDS A PLAYER, i.e. you: EVERYTHING ELSE.  Nothing below has been seen
// on a screen.  The three arms most likely to need another pass are called out
// at the bottom under WHAT I EXPECT TO BE WRONG.

// ---------------------------------------------------------------------------
//  b65_edit -- the editor, which is where most of this build lives
// ---------------------------------------------------------------------------
//  `hud_edit` now lists FIFTEEN elements, not eleven.  Each row is a wide chip
//  that OPENS THAT ELEMENT'S SETTINGS and a small box on the right that shows or
//  hides it.  Click the open one again to close it.
//
//  Four rows are new: Boarding, Net, Results and Crosshair.  Net and Results
//  have owned hud_*_x / hud_*_y since they were written and have simply never
//  been listed; Crosshair is listed with NO position, because it is screen
//  centre by definition, and its row exists for its options.
//
//  EXPECT: 15 rows.  Every one opens.  Every chip writes.  `hud_edit status`
//  lists all 15, with `--` in the x/y columns for Crosshair rather than 0.0000.
alias b65_edit      "hud_edit"
alias b65_status    "hud_edit status"
alias b65_reset     "hud_edit reset; echo ^3every panel back to its shipped position"

// ---------------------------------------------------------------------------
//  b65_size -- the font-size boxes
// ---------------------------------------------------------------------------
//  Each text element's pane opens with a `size` row: three or four boxes with
//  the PIXEL SIZE written in them.  The lit one is the size in force; clicking
//  it again clears back to 0, which is "follow hud_scale" and is build 64's
//  look.
//
//  THE SIZES ARE BAKED LADDER RUNGS, not round numbers -- sh_font.qc bakes each
//  face at a fixed list and anything off it is a resample.  So the test is not
//  "did it get bigger", it is "is it still CRISP at every one of the four".  A
//  soft glyph means the offered size missed its rung and the list is wrong.
//
//  SPLITS IS THE ONE AT RISK.  Its five column offsets were derived from the
//  mono face's 0.6 em advance and are scaled by the size ratio; at 20 px the
//  columns have to still clear each other.  Watch the `e -312` column, which is
//  the rightmost and the first to collide.
alias b65_size      "echo ^5open hud_edit, pick an element, click each size box.; echo ^5  crisp at all four = the rungs are right.  soft = report which."
alias b65_size_off  "hud_timer_size 0; hud_splits_size 0; hud_seq_size 0; hud_strafe_size 0; hud_board_size 0; hud_boarding_size 0; hud_speed_size 0; hud_energy_size 0; hud_debug_size 0; hud_mapinfo_size 0; echo ^2every size back to hud_scale -- this is build 64 exactly"
alias b65_size_big  "hud_timer_size 64; hud_energy_size 48; hud_seq_size 20; echo ^5timer 64, energy 48, segments 20 -- the 'slightly larger' pair plus a wide column"

// ---------------------------------------------------------------------------
//  b65_seq -- the segment rows
// ---------------------------------------------------------------------------
//  The row is five columns now:
//
//      "  Air: 345e +100e 1.45s 80%"
//      "Board: 335e  -10e"
//      " Ramp: 185e -150e 0.80s"
//
//  THE ONE ASSERTION WORTH MAKING IS ARITHMETIC, and it is checkable from a
//  screenshot: a row's absolute is the row ABOVE's absolute plus this row's
//  gain, all the way down the column -- and the BOTTOM row's absolute equals the
//  `e` readout under the speedometer.  They are measured from one anchor by
//  construction, so if any pair disagrees the referencing is wrong and that is
//  the bug to report.
//
//  A save made before build 65 has no absolute stored.  Its rows read as a large
//  NEGATIVE number, which is visibly missing rather than plausibly wrong, and is
//  expected -- not a defect.
alias b65_seq       "hud_seq 1; hud_seq_name 1; hud_seq_abs 1; hud_seq_delta 1; hud_seq_time 1; hud_seq_pct 1; echo ^5every column on.  check: each row's absolute = the one above + this row's gain."
alias b65_seq64     "hud_seq_name 0; hud_seq_abs 0; echo ^3build 64's row exactly -- gain and duration only"
alias b65_seq_u     "hud_seq_units 0; echo ^5u/s"
alias b65_seq_e     "hud_seq_units 1; echo ^5energy"
alias b65_seq_both  "hud_seq_units 2; echo ^5both -- the u/s figure is a dimmer second line UNDER each row, and the column is twice as tall"

// ---------------------------------------------------------------------------
//  b65_hop -- every bhop is its own row now.  THE A/B THAT PROVES THE FIX.
// ---------------------------------------------------------------------------
//  Find a flat, hop five times in a chain, and read the segment column.
//
//    hud_seq_hopbreak 1   FIVE Air rows
//    hud_seq_hopbreak 0   ONE merged Air row (build 64)
//
//  A bhop's ground contact is one tick, 0.015 s, against a 0.10 s threshold --
//  so no merge break was emitted and the whole chain came out as one row.  This
//  pair is the entire evidence; if 0 and 1 give the same answer, the diagnosis
//  is wrong and I want to know before anything else in this build.
//
//  TOGGLE IT INSIDE ONE SESSION.  Two launches is two different runs, and the
//  thing being compared is a row count that depends on how you hopped.
alias b65_hop_on    "hud_seq_hopbreak 1; echo ^2hopbreak ON  -- five hops should give five Air rows"
alias b65_hop_off   "hud_seq_hopbreak 0; echo ^3hopbreak OFF -- build 64: five hops give ONE merged row"

// ---------------------------------------------------------------------------
//  b65_bar -- the strafe bar's bhop flicker
// ---------------------------------------------------------------------------
//  Same five hops, watching the BAR rather than the column.  On each landing
//  build 64 snapped the target's low-pass, swapped to the ground target
//  function, crossed the ground optimum's square-root shoulder and blanked its
//  own fill -- four visible events per touchdown.
//
//    hud_strafe_groundhold 0.12   the bar ignores a touch shorter than 8 ticks
//    hud_strafe_groundhold 0      build 64 exactly
//
//  TOGGLE IT INSIDE ONE SESSION, for the reason above and one more: the
//  within-run pixel difference between two screenshots is not the between-run
//  one, so an A/B across two launches measures the launch.
//
//  If it still flickers at 0.12, try 0.25 before reporting -- that distinguishes
//  "the dwell is too short" from "the dwell is not the mechanism".
alias b65_bar_on    "hud_strafe_groundhold 0.12; echo ^2dwell 0.12s -- the bar should ignore a hop's landing entirely"
alias b65_bar_off   "hud_strafe_groundhold 0; echo ^3dwell OFF -- build 64, expect the flicker"
alias b65_bar_long  "hud_strafe_groundhold 0.25; echo ^5dwell 0.25s -- if THIS is clean and 0.12 was not, the dwell was too short"

// ---------------------------------------------------------------------------
//  b65_e -- the energy readout across a save-load.  MEASURE BEFORE JUDGING.
// ---------------------------------------------------------------------------
//  `e` is (energy here) minus (the anchor), and a restore moves those two at
//  different times: the save event carries the anchor, a snapshot carries the
//  teleported position, and they need not be the same snapshot.  For the frames
//  in between the subtraction pairs the OLD position with the NEW anchor, which
//  is off by the whole teleport -- the "BS anchor value" -- and then corrects in
//  one frame, which is the "flicker update".
//
//  BUILD 65 HOLDS IT rather than drawing it: while a restore is unsettled, or
//  while a save-lock park is held, the last value computed from a MATCHED pair
//  stays on screen at half alpha.  Nothing is smoothed and nothing invented.
//
//  THIS IS A HYPOTHESIS WITH A MEASUREMENT IN FRONT OF IT.  `hud_debug 1` now
//  prints the four values that decide the answer, on their own rows:
//
//      jumpz    the anchor
//      orgz     the feet it is being measured from
//      rsarm    1 = a restore's teleport has not landed
//      slheld   1 = a save-lock park
//
//  Read them ACROSS THE ARRIVAL FRAME of a load taken from a long way off. If
//  jumpz and orgz never disagree, the hold is fixing something else and I have
//  the wrong cause.
alias b65_e         "hud_energy 1; hud_energy_ref 1; hud_debug 1; echo ^5save on a start block, walk ~600 units away, load it.; echo ^5  watch jumpz / orgz / rsarm on the debug column across the arrival frame."
alias b65_e47       "hud_energy 1; hud_energy_ref 1; echo ^5build 47's check, which must still pass: land from a start-box save, e reads 0 with no +jump"

// ---------------------------------------------------------------------------
//  b65_xhair -- the three crosshairs
// ---------------------------------------------------------------------------
//  hud_crosshair 0 is NOT "off" -- it is "the engine decides", which is every
//  build before this one, and `crosshair 0` is still the way to have none.
//  1/2/3 draw gfx/crosshairs/xhair1|2|3 and suppress the engine's.
//
//  The files are 32x32 (measured, not assumed -- the request said 16x16), so
//  they draw at 32 with a 16 px offset and no resample.  hud_crosshair_size is
//  there anyway and IS a resample at any other value.
//
//  EXPECT: dead centre at every resolution, no engine crosshair behind it, and
//  none at all during a replay.
alias b65_x0        "hud_crosshair 0; echo ^5engine crosshair (crosshair cvar decides; crosshair 0 = none)"
alias b65_x1        "hud_crosshair 1; echo ^5xhair1"
alias b65_x2        "hud_crosshair 2; echo ^5xhair2"
alias b65_x3        "hud_crosshair 3; echo ^5xhair3"
alias b65_xsmall    "hud_crosshair_size 16; echo ^3 16 px -- a downscale of a 32 px file, so expect it soft"
alias b65_xnative   "hud_crosshair_size 32; echo ^2 32 px -- native, pixel-exact"

// ---------------------------------------------------------------------------
//  b65_board -- the Boarding window
// ---------------------------------------------------------------------------
//  A new panel, stacked under the Board panel by default, in Google Sans Code:
//
//      enter  1042 u/s
//             -169e
//      leave   873 u/s
//             +212e
//       kept  83.9% Good
//       ramp  53 deg
//
//  `contact` and `leaving` have MOVED here out of the Board panel -- they are
//  the two halves of one comparison and were never adjacent.  The touchdown's
//  cost stays with the grade above, because "98.3% kept" needs something to be a
//  percentage of.
//
//  EXPECT: `enter` equals the number the Board panel used to print as `contact`.
//  Nothing on this HUD prints the same measurement twice.
alias b65_board     "hud_boarding 1; hud_boarding_units 2; echo ^5board a ramp.  enter must equal the old 'contact'."
alias b65_board_u   "hud_boarding_units 0; echo ^5u/s only"
alias b65_board_e   "hud_boarding_units 1; echo ^5energy only"
alias b65_board_det "hud_boarding_x 0.72; hud_boarding_y 0.55; echo ^5detached from the stack -- drag it in hud_edit, or b65_board_stack to reattach"
alias b65_board_stk "hud_boarding_x -1; hud_boarding_y -1; echo ^2back to the -1 sentinel: stacked under the Board panel"

// ---------------------------------------------------------------------------
//  b65_font -- the mono move
// ---------------------------------------------------------------------------
//  The strafe bar, the Board panel and the Boarding window are now all Google
//  Sans Code, so the stack reads as one thing.  That face charges 0.6 em for
//  EVERY glyph against Roboto's 0.562 for a digit and 0.264 for a full stop, so
//  every string on those three panels got wider and the constants were re-cut --
//  the message line under the bar is at 0.7 of the cell size now, not 0.8.
//
//  EXPECT: nothing on those three overruns the bar's own width, and the two rate
//  cells do not touch.  The longest string is "ramp: nz 0.42 out of band" at 25
//  characters; provoke it by pointing away from a ramp you are riding.
alias b65_font      "echo ^5ride a ramp, look away from it, read the message beside the bar.; echo ^5  25 chars at 0.6 em must still fit inside the bar's width."

echo ^5build 65 loaded.
echo ^7  b65_edit / b65_status / b65_reset        -- the editor: 15 rows, each one opens
echo ^7  b65_size / b65_size_off / b65_size_big   -- the font-size boxes
echo ^7  b65_seq / b65_seq64                      -- the new segment row, and build 64's
echo ^7  b65_seq_u / b65_seq_e / b65_seq_both     -- its units, incl. both stacked
echo ^7  ^2b65_hop_on / b65_hop_off^7                 -- ^2every bhop its own row: THE A/B^7
echo ^7  ^2b65_bar_on / b65_bar_off / b65_bar_long^7  -- ^2the bar's bhop flicker^7
echo ^7  b65_e / b65_e47                          -- the energy anchor across a load
echo ^7  b65_x0 / b65_x1 / b65_x2 / b65_x3        -- the crosshairs (0 = engine's)
echo ^7  b65_board / b65_board_u / b65_board_e    -- the Boarding window
echo ^7  b65_font                                 -- the mono move
echo ^7
echo ^3  WHAT I EXPECT TO BE WRONG, in order:
echo ^7   1. ^3the mono move^7.  Three panels changed face and every size constant
echo ^7      had to be re-cut by reasoning rather than by looking.  If anything
echo ^7      overlaps or overruns, it is here -- b65_font.
echo ^7   2. ^3the editor panel's height^7 at hud_scale 1 and 3.  It grows when a
echo ^7      pane opens and halves its own scale if it would not fit; the worst
echo ^7      case is the Segments pane, ten options.
echo ^7   3. ^3the energy hold^7.  The cause is reasoned, not measured -- b65_e
echo ^7      prints the evidence, and if jumpz and orgz never disagree then the
echo ^7      hold is treating the wrong symptom.
echo ^7
echo ^3  NOTHING IN THIS BUILD HAS BEEN SEEN ON A SCREEN.^7  It compiles clean and
echo ^7  every default was checked against its registercvar, and that is all.
