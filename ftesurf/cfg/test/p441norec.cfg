cfg_save_auto 0

// ===========================================================================
//  P441NOREC -- and a server that records NOTHING must not lose its runs.
//    python tools/p441void.py --arm norec
//  The fixtures and the staging are in cfg/test/p441void.cfg's header.  No zones
//  fixture here: nothing in this arm asks a zone a question.
//
//  THE DEFECT.  Patch 434 cancels the run whenever the rewind fails under a
//  RUNNING save -- and with `rec_enable 0` the rewind fails on EVERY load,
//  because there is no recording to rewind.  So on a server that records nothing
//  (and from any mark-0 save, which Patch 426's own note below the branch names)
//  every load of a running save cancelled an honest run, and the reason given
//  was "the save's recording could not be restored": a check that cannot see
//  answering guilty.  CLAUDE.md's absence trap, the fourth time this file has
//  found it.
//
//  THE FIX (round 3).  `SV_RecEnabled() || hadrec || (retry && (flg & TF_RECORDING))` gates the void: does the server
//  write .rec files at all, or did THIS RUN hold a recorder when the load began.
//  Any of them means a recording was expected and this load or retry took it away;
//  none of them means nothing was lost, because the run was already unverifiable by
//  the operator's own configuration before the load arrived.  Note what is NOT in it
//  on THIS path: the save's own `reclines`, nor the file's TF_RECORDING -- on a load
//  they describe some earlier session, and reading them as this run's expectation is
//  what put the absence trap back in round 2.  The third clause is retry-only.
//  THREE PREDICATES WERE TRIED AND MEASURED WRONG FIRST, all three written up in
//  sv_saveloc.qc's own comment: `SV_RecEnabled()` alone (it asks about the SERVER
//  NOW, so `rec_enable 0` under a live recorder skipped the void while the recording
//  was discarded -- cfg/test/p441mid.cfg is that arm); `wasrec` alone (captured below
//  the Patch 360 discard, so it reads FALSE for any run that posted a stage, and a
//  SECOND load of one row finds it clear -- cfg/test/p441twice.cfg); and
//  `mark > 0 || wasrec`, whose `mark` half put this very arm's defect back for the
//  old save at S2 below.
//
//  ARMS, in log order:
//   C1  leave the start box.  The premise, and it is the OPPOSITE one to the
//       other two arms: `timer: running` with `recording 0`.  If this reads
//       `recording 1` then rec_enable did not take and the subject is measuring
//       p441void's branch instead.
//   S   SUBJECT: load row 3 (RUNNING, ticks 500, `reclines 0`).  The rewind fails
//       for want of a prefix that was never written, because nothing was recording.
//   S2  AND THE SAVE THAT CLAIMS ONE.  Row 1 carries `reclines 500` -- a save taken
//       on some earlier day when the server WAS recording, sitting in the same
//       directory, because nothing rewrites a save when a cvar changes.  Round 2's
//       predicate read that claim as "evidence was expected" and cancelled an honest
//       run for it: the absence trap, put back through the file's own words.  Round 3
//       asks the SERVER and the RUN and not the file, so this must read exactly like
//       S.  Two reviewers found this independently and the falsifier was one
//       character -- `sl_goto 3` back to `sl_goto 1`.
//
//  PRE-REGISTERED PREDICTIONS
//   C1  `timer: running`, `recording 0`.
//   S   CONTROL (HEAD, pre-441): `run cancelled (the save's recording could not
//       be restored)`, `timer: idle`, `stopped 1`.
//   S   BOTH builds: `segmented run -- this run will not be saved`, and the load
//       event carries slot 903.  Those two are the POSITIVE CONTROL for the claim
//       below, which is an ABSENCE: an arm whose headline is "no cancel line" has
//       to show it got far enough to have seen one (SV_TimerStitched prints on
//       every completed load, before the rewind, on both builds).
//   S   FIXED: NO cancel line, `timer: running`, `recording 0`, `practice 1` and
//       `class: segmented` -- a shadow run, which is what a load of a running save
//       is -- and a clock PAST the fixture's 0:05.000, because a run that was not
//       cancelled keeps counting.  (The first cut of this file predicted exactly
//       0:05.000 and read 0:06.610.  The prediction was wrong, not the fix: 5.000
//       is what a STOPPED clock holds, which is the control build's answer.)
//   S2  FIXED: the same as S -- no cancel line, `timer: running`, and the load event
//       carrying slot 901.  CONTROL: cancelled and `timer: idle`, like S.
//  FALSIFIED IF C1 reads recording 1, or S or S2 reads `idle` on the fixed build, or
//   either reads `running` on the control build.
//  WHAT S2 DOES AND DOES NOT PROVE, since the first write-up overstated it: it
//   constrains the SHIPPED build -- an old save claiming a recording does not cancel
//   a run on a server that records nothing.  It does NOT measure the round-2
//   predicate, because no build carrying `mark > 0 || wasrec` was ever run against
//   this arm; that half is source reading, which is the shape this patch criticises
//   elsewhere.  The control on disk is pre-441, which cancels at S and S2 alike.
//
//  RESULT (2026-09-26, round 3, both builds, driver exit 0 each way; qwprogs
//   3096B6F5468BEE3A fixed / 830A76438E00EFA4 control, logs kept as
//   ftesurf/logs/p441norec.log.fixed and .control)
//   C1 `timer: running` with `recording 0` on both builds -- rec_enable 0 took, so
//      this arm is on the branch it says it is.
//   S  (row 3, `reclines 0`) CONTROL: `run cancelled (the save's recording could not
//      be restored)`, `timer: idle`, clock held at 0:05.000, `stopped 1` -- an honest
//      run on a server that records nothing, cancelled for evidence it was never
//      going to have.  FIXED: no cancel line, `timer: running`, clock 0:06.600
//      counting on from the restored 0:05.000, `recording 0`, `practice 1`,
//      `class: segmented`, and the load event carrying slot 903.  (0:06.610 in the
//      run on disk; graded as an inequality, because the value is this driver's
//      latency and the fact is that an uncancelled clock keeps counting.)
//   S2 (row 1, the old save CLAIMING `reclines 500`) reads exactly like S on both
//      builds: cancelled on the control, untouched on the fixed build.  Round 2's
//      `mark > 0` predicate cancelled HERE and not at S -- the absence trap coming
//      back through the file's own words -- which is what this section exists to
//      catch and what it now measures.
//   The clocks, read off the kept logs so they are the right way round: S reads
//   0:06.610 and S2 0:06.600 on the fixed side.  An earlier write-up of this block
//   had them swapped and claimed the 0:06.610 was the stale one -- it is S's.
log_enable 1
log_dir logs
log_name p441norec
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
sv_port 27693
sv_cheats 0
set run_resume 0
set rec_enable 0
vid_fullscreen 0
waitms 5000
map bhop_eazy
waitmap 2400
waitms 3000
menu_restart
ui_close
waitms 1200

echo ==== C0 the list ====
cmd sl_list
waitms 800

echo ==== C1 leave the start box: must read running / recording 0 ====
+forward
waitms 1500
-forward
waitms 700
cmd timer
waitms 800

echo ==== S SUBJECT: load row 3, the save with no recording behind it ====
// One gesture -- see p441void.cfg: `sl_goto` is itself the load.
// ROW 3 (slot 903) IS THE SAVE THIS SERVER WOULD HAVE WRITTEN: `reclines 0`, because
// SV_RecWritePrefix returns 0 on an empty buffer (sv_timer.qc:5549).  Round 1 graded
// this arm against row 1's `reclines 500` instead, which this server could not have
// produced -- but, as S2 says, it could certainly be HOLDING one, so the shapes are
// both real and the arm now loads both.
cmd sl_goto 3
waitms 1600
cmd timer
waitms 800

echo ==== S2 and row 1, the old save that CLAIMS 500 recorded lines ====
// Same server, same run, a save whose `reclines` says a recording existed when it
// was taken.  Nothing on this server can restore one and nothing was lost.
cmd sl_goto 1
waitms 1600
cmd timer
waitms 800

quit
