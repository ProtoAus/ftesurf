cfg_save_auto 0

// ===========================================================================
//  P441NOREC -- and a server that records NOTHING must not lose its runs.
//    python tools/p441void.py --arm norec
//  The fixtures and the staging are in cfg/test/p441void.cfg's header.  No zones
//  fixture here: nothing in this arm asks a zone a question.
//
//  THE DEFECT.  Patch 434 cancels the run whenever the rewind fails under a
//  RUNNING save -- and with `rec_enable 0` the rewind fails on EVERY load,
//  because there is no recording to rewind.  So on a server that records nothing
//  (and from any mark-0 save, which Patch 426's own note below the branch names)
//  every load of a running save cancelled an honest run, and the reason given
//  was "the save's recording could not be restored": a check that cannot see
//  answering guilty.  CLAUDE.md's absence trap, the fourth time this file has
//  found it.
//
//  THE FIX (round 2).  `mark > 0 || wasrec` gates the void: this save's own
//  `reclines`, or a recorder on the run right now.  Either means a recording was
//  expected here and the load took it away; neither means nothing was lost, and a
//  run that was never recorded was already unverifiable by the operator's own
//  configuration before the load.
//  TWO PREDICATES WERE TRIED AND MEASURED WRONG FIRST, both in sv_saveloc.qc's own
//  comment: `wasrec` alone (a SECOND load of the same row finds it clear and lets a
//  RUNNING attempt carry on with no recorder -- Patch 434's defect, and `sl_goto` is
//  itself a load so the pair is one keypress apart), and `SV_RecEnabled()` alone (it
//  asks about the SERVER NOW, so `rec_enable 0` under a live recorder skipped the
//  void while the recording was discarded -- cfg/test/p441mid.cfg is that arm).
//
//  ARMS, in log order:
//   C1  leave the start box.  The premise, and it is the OPPOSITE one to the
//       other two arms: `timer: running` with `recording 0`.  If this reads
//       `recording 1` then rec_enable did not take and the subject is measuring
//       p441void's branch instead.
//   S   SUBJECT: load row 1 (RUNNING, ticks 500).  The rewind fails for want of
//       a recording that was never being made.
//
//  PRE-REGISTERED PREDICTIONS
//   C1  `timer: running`, `recording 0`.
//   S   CONTROL (HEAD, pre-441): `run cancelled (the save's recording could not
//       be restored)`, `timer: idle`, `stopped 1`.
//   S   BOTH builds: `segmented run -- this run will not be saved`, and the load
//       event carries slot 903.  Those two are the POSITIVE CONTROL for the claim
//       below, which is an ABSENCE: an arm whose headline is "no cancel line" has
//       to show it got far enough to have seen one (SV_TimerStitched prints on
//       every completed load, before the rewind, on both builds).
//   S   FIXED: NO cancel line, `timer: running`, `recording 0`, `practice 1` and
//       `class: segmented` -- a shadow run, which is what a load of a running save
//       is -- and a clock PAST the fixture's 0:05.000, because a run that was not
//       cancelled keeps counting.  (The first cut of this file predicted exactly
//       0:05.000 and read 0:06.610.  The prediction was wrong, not the fix: 5.000
//       is what a STOPPED clock holds, which is the control build's answer.)
//  FALSIFIED IF C1 reads recording 1, or S reads `idle` on the fixed build, or S
//   reads `running` on the control build.
//
//  RESULT (2026-09-26, both builds, driver exit 0 each way; qwprogs
//   3786B7D1D3341D4B fixed / 830A76438E00EFA4 control)
//   C1 `timer: running` with `recording 0` on both builds -- rec_enable 0 took,
//      so this arm is on the branch it says it is.
//   S CONTROL: `run cancelled (the save's recording could not be restored)`,
//     `timer: idle`, the clock held at 0:05.000, `stopped 1`.  An honest run on a
//     server that records nothing, cancelled for evidence it was never going to
//     have.
//   S FIXED: NO cancel line, `timer: running`, clock 0:06.610 -- counting on from
//     the restored 0:05.000 -- `recording 0`, `practice 1`, `class: segmented`.
log_enable 1
log_dir logs
log_name p441norec
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
sv_port 27693
sv_cheats 0
set run_resume 0
set rec_enable 0
vid_fullscreen 0
waitms 5000
map bhop_eazy
waitmap 2400
waitms 3000
menu_restart
ui_close
waitms 1200

echo ==== C0 the list ====
cmd sl_list
waitms 800

echo ==== C1 leave the start box: must read running / recording 0 ====
+forward
waitms 1500
-forward
waitms 700
cmd timer
waitms 800

echo ==== S SUBJECT: load row 3, the save with no recording behind it ====
// One gesture -- see p441void.cfg: `sl_goto` is itself the load.
// ROW 3 (slot 903) AND NOT ROW 1, from round 2: row 1 claims `reclines 500`, and no
// server running rec_enable 0 could ever have written that -- SV_RecWritePrefix
// returns 0 with an empty buffer (sv_timer.qc:5549), so a real save taken here
// carries `reclines 0`.  Round 1 graded the fix against a fixture that could not
// exist, and the predicate it settled on (SV_RecEnabled alone) was wrong partly
// because this fixture hid the difference.  903 is that save, honestly shaped.
cmd sl_goto 3
waitms 1600
echo ---- CONTROL: cancelled, idle.  FIXED: running at 0:05.000, segmented ----
cmd timer
waitms 800

quit
