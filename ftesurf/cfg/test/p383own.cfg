// Patch 383 harness OWNER -- the body everyone else watches.  Predictions,
// arms and the run order: p383view.cfg's header.
//
// A constant, known motion to measure against: +forward at sv_maxspeed 260 and
// +left at cl_yawspeed 140 is a 106 u circle at constant speed and turn rate;
// +lookup/+lookdown swap every second at cl_pitchspeed 60, a +-30 deg triangle
// wave.  From the circle start S (about 8.5 s after the viewer's trace starts):
//   S+60 kill (P4)   S+65..75 stop (P5)   S+90..92 net_fakeloss 1, an owner
//   stall (P6)   S+96..98 +attack (keys arm)   S+100 lobbycolor 3 (P7)
//   S+104 stop, S+106 quit.
// The timed body below is generated; keep the pitch swaps whole seconds apart.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p383own
cl_idlefps 0
cl_maxfps 500
vid_fullscreen 0
vid_width 800
vid_height 600
fs_missingwarn 0
set name "P383Owner"
setinfo lobbycolor 1
// trail + motes: the LOOK path, and the trail break at the kill
setinfo lobbyfx 3
wait 600
connect 127.0.0.1:27693
waitms 12000
menu_restart
waitms 500
ui_close
waitms 500
cl_yawspeed 140
cl_pitchspeed 60
lookspring 0
centerview
waitms 3000
// S+0: circles; pitch down 0.5 s so the wave is centred on 0
+forward
+left
+lookdown
waitms 500
-lookdown
+lookup
waitms 1000
-lookup
