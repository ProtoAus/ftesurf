// REG251 -- Patch 251 regressions.
//
// The reg250 baselines, unchanged:
//   surf_rise     overlays 103 of 105 placed, sprites 1 of 1
//   bhop_canals   decals 81 of 416, overlays 41 of 53
//   bhop_arcane   1122 func_bhop, overlays 5 of 5
//   surf_kitsune  target case: 28
//
// WHAT THIS PATCH PUTS AT RISK, and why these maps are the right ones to ask.
//
// 1. r_decal_lightmap 1 (cfg/default.cfg).  It changes the PLACEMENT path for
//    every decal and info_overlay in the game -- CL_Decal_SetupCtx now sets
//    ctx->dolm, so adddecal_static interpolates a lightmap page per clipped
//    fragment instead of taking the ": -1" arm.  If that path is wrong, decals
//    stop being PLACED, not merely mis-lit, and the counts above move.
//    bhop_canals (81 of 416 decals, 41 of 53 overlays) and surf_rise (103 of 105)
//    are the two with enough of both to notice.
//
// 2. Two shared world shaders changed.  lightmapped.glsl draws every lightmapped
//    world surface in the game and transition.glsl every WorldVertexTransition
//    one, so a compile error in either -- an undeclared varying, a sampler that
//    is declared but never bound -- takes out most of the library, not just the
//    maps with the new keys.  All four maps exercise both.
//
// 3. `refl` in both shaders now reads normal_f.a rather than re-fetching
//    s_normalmap.  Identical arithmetic, but it moved a #define to after the
//    sampler read, so an envmapped bumped material is the thing to watch.
//
// Both new cvars are left at their defaults on purpose: this asks whether the
// SHIPPED configuration still holds, not whether the features can be switched off.

log_enable 1
log_dir "logs"
log_name "reg251"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
con_notifylines 0
developer 1
log_developer 1

wait 200

echo ^5=========== surf_rise ===========
map surf_rise
waitmap 1800
waitms 6000
cmd ent_census
waitms 1500

echo ^5=========== bhop_canals ===========
map bhop_canals
waitmap 1800
waitms 6000
cmd ent_census
waitms 1500

echo ^5=========== bhop_arcane ===========
map bhop_arcane
waitmap 1800
waitms 6000
cmd ent_census
waitms 1500

echo ^5=========== surf_kitsune ===========
map surf_kitsune
waitmap 1800
waitms 6000
cmd ent_census
waitms 1500

echo ^5=== reg251 done ===
wait 30
quit
