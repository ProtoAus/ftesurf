// Build 66: does the map list's live headcount actually come from the
// directory, and does it stay silent when it has not been told?
//
// WHAT IS UNDER TEST is the join, not the drawing.  ui_lobbypop prints the
// directory's own rows AND, separately, what each map row would draw from
// them -- so a bug in the join between the two shows up as the two halves
// disagreeing, which is the one failure a screenshot of the list could not
// distinguish from "nobody is playing".
//
// THE FIRST CALL IS EXPECTED TO REPORT NOTHING, and that is an arm rather
// than a warm-up.  Lob_Poll only ever runs from m_draw while the create
// screen is up, so from a cold console the directory has never been asked;
// the first call is what asks.  If it printed a populated list, something
// is answering that was never sent a request.
//
// PREDICTION:
//   cold   -> "has NOT answered yet -- 0 lobbies, <N> maps installed"
//             and no row draws a count
//   warm   -> "has answered -- 5 lobbies", each lobby resolved to a row,
//             and exactly as many rows drawing a count as there are
//             DISTINCT maps across those five lobbies
//
// FALSIFIED IF: `Unknown command "ui_lobbypop"` (this menu.dat is not the one
// under test), or the warm pass reports lobbies while no row draws a count
// (the name join is broken -- the case-insensitivity fix), or any row draws a
// count for a map no lobby is on.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name b66pop
log_developer 1
developer 1

// THE MENU VM COMES UP LAST, AND MUCH LATER THAN IT LOOKS, which is the whole
// reason the first two runs of this file proved nothing.  A `+exec` on the
// command line is drained from the command buffer during early init, while
// `waitms` is real time -- so the calls race a startup whose length is set by
// the filesystem scan, not by anything here.  Measured twice on this machine:
// 91,018 files across the Steam VPK mounts, and `Initializing menu.dat` at
// **21 seconds**.  A 15 s wait still landed both calls ahead of it.
//
// Both failures printed `Unknown command "ui_lobbypop"`, which is ALSO exactly
// what a menu.dat not carrying this build prints.  An arm that cannot tell
// "too early" from "wrong binary" is not an arm -- so the number below is
// deliberately well past the measured 21 s rather than just past it, and a
// third `Unknown command` now means the binary and not the clock.
waitms 20000

// AND THE WAIT ALONE IS STILL NOT ENOUGH, because the menu VM is LAZY.  Three
// runs measured it: with waitms working correctly (32 s of real wait, verified
// against the log's own clock) menu.dat logged "Initializing" at the very end
// -- one line AFTER this file's closing echo, i.e. it was `quit` that brought
// it up, not the passage of time.  Waiting longer cannot fix that; there is no
// amount of time after which a lazily-created thing creates itself.
//
// menu_restart (menu.c:1513) forces it, so the precondition becomes explicit
// rather than hoped for.  The wait above is still needed -- restarting the menu
// while the filesystem is still mounting is its own race -- but it is now a
// margin rather than the mechanism.
menu_restart
waitms 3000

echo ^5==== b66pop: cold -- this call is the request, not the answer ====
ui_lobbypop

// Generous: one HTTPS round trip to play.proto.bar, plus the 2200-name scan
// that ui_load_maps does on the first call.
waitms 8000

echo ^5==== b66pop: warm -- now it has been answered ====
ui_lobbypop
waitms 1000

echo ^5==== b66pop: done ====
quit
