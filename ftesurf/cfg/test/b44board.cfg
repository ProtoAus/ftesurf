// B44BOARD -- the leaderboard's four words, and the two selftests.
//
// THE CLIENT HALF HAS ITS OWN WAY TO BE WRONG.  Everything b44class.cfg proves
// is about fields on the server; the report is about a WORD ON A LIST, and that
// word is drawn by a different VM out of a header key read off disk.  A build
// where the server stamps the bit correctly and the board still says `stitched`
// would pass every test in that file.
//
// `scores status` is the instrument and it exists for exactly this: it prints
// the same class word each row draws, from the same Scores_Clean, so a log
// settles the question that would otherwise need a screenshot -- and a
// screenshot in this engine lands one step behind the command that set it up.
//
// bhop_eazy's main leg now holds a spread worth reading: files with `flags 0`
// (clean), `flags 5` (practice -- the residual, and the honest one), and the
// `flags 397` this build's own trace wrote (cheated).  Four filters over one
// list, and the invariant to check is that the row counts add up: every row
// shows under exactly one of clean/stitched/cheated, plus `all`.
//
// pm_selftest and zone_selftest ride along as the regression.  pm_selftest
// because SV_CheatLevel is now read inside PlayerPostThink on every tick and a
// mistake there would show as physics; zone_selftest because nothing in build 44
// touches the zone table and a change there would mean something unintended.

log_enable 1
log_dir "logs"
log_name "b44board"
developer 1
log_developer 1
cfg_save_auto 0
vid_fullscreen 0
fs_missingwarn 0
sv_cheats 0

wait 200
map bhop_eazy
waitmap 1800
waitms 2500

echo ^5=== b44board: all ===
scores open
waitms 600
scores filter all
waitms 300
scores status
waitms 600

echo ^5=== b44board: clean only ===
scores filter clean
waitms 300
scores status
waitms 600

echo ^5=== b44board: stitched (segmented + the bare-practice residual) ===
scores filter stitched
waitms 300
scores status
waitms 600

echo ^5=== b44board: cheated ===
scores filter cheated
waitms 300
scores status
waitms 600

// ...and the word spelled the way the row spells it, which is the console
// handle a player would actually reach for after reading the column.
echo ^5=== b44board: `segmented` as an alias for `stitched` ===
scores filter segmented
waitms 300
scores status
waitms 600

scores close
waitms 400

echo ^5=== b44board: pm_selftest ===
pm_selftest
waitms 1200

echo ^5=== b44board: zone_selftest ===
zone_selftest
waitms 1200

echo ^5=== b44board: done ===
quit
