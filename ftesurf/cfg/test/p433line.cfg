cfg_save_auto 0
log_enable 1
log_dir logs
developer 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0
set run_resume 0
sv_public 0
sv_port 27689
set lobby_dir "http://127.0.0.1:8396"
set hud_watch_skipidle 0

wait 200
map surf_aura
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 1000
echo ^5=== p433line L1 ===
scores legs
scores open
scores tab online
scores leg 2
scores refresh
waitms 3000
scores line 0
waitms 2000
scores lines
echo ^5=== p433line L2 ===
scores line 1
scores lines
echo ^5=== p433line L3 ===
scores leg 4
scores refresh
waitms 3000
scores line 0
waitms 5000
scores lines
echo ^5=== p433line L4 ===
scores leg 2
scores refresh
waitms 3000
scores line 0
scores lines
echo ^5=== p433line L5 ===
scores tab local
scores leg 0
waitms 500
scores line 0
echo ^5=== p433line L6 ===
scores close
replay online 18 4
replay pause
replay seek 40
waitms 1500
scores lines
screenshot screenshots/p433line_world.png
waitms 500
replay stop
waitms 500
echo ^5=== p433line done ===
quit
