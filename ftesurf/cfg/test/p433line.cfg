// CONTROL (ctl): `scores line` is not a subcommand -- it falls through to the board
//  toggle; no line, no GET.
//
// RESULT (2026-09-22).  L1: `line 1 on: r18:2`, `line 1 drawn (625 points, 1 teleports)`,
//  `625 shown`, `t 7.8750..17.2350` -- 625, not the registered 626: the window's end
//  tick is 17.2349997 in float, so the 17.2350 sample IS the one past it that closes
//  the window.  L2 the refusal, no second line.  L3 one `GET /api/replay/990018` on
