// Patch 279, run E -- the shield after the two-pass restructure, and the
// portal particles after the colour correction.
//
// WHAT CHANGED SINCE RUN B:
//   * the program moved from INSIDE the pass to the TOP LEVEL, with one pass
//     per sampler.  A program's textures are bound from the shader's passes in
//     order, so two textures need two passes; the old shape had no route from
//     the top-level `uppermap` to the pass-level program and both samplers came
//     out black, which is why the shield vanished entirely.
//   * pcf.py no longer blends the particle colours 40% toward white.  That was
//     an inference from "expanding to white colour" and it was wrong -- it is
//     what turned [51 51 80]..[0 96 255] into a pale grey-blue, reported back
//     as "they don't have a cool blue hue like in source".
//
// EXPECTED, written before the run:
//   S70   the shield VISIBLE and dense (frame 0 inside 120 units), and BRIGHTER
//         than at any greater distance
//   S70b  one second later: the second layer has scrolled, so the image must
//         DIFFER from S70.  Identical means the multiply is sampling something
//         constant.
//   S200  frame ~16, dimmer
//   S600  alpha ~0.36, faint
//   S1000 alpha ~0, gone
//   P     the particles at the portal: BLUE, and visibly varying in brightness
//         because each one is fading over its own 0.9s life

vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000
cl_maxfps 0
cl_idlefps 0
cl_yieldcpu 0
sv_cheats 1

developer 1
log_developer 1
map surf_tensor2
waitmap 600
waitms 9000
developer 0
log_developer 0

noclip
vbsp_sprites 0
vbsp_sprite_debug 2
waitms 1500

echo ^5=== S70 seventy units -- dense frame 0, brightest
setpos -11776 -10886 13744 0 90 0
waitms 2500
screenshot p279e_s70_x
waitms 900
screenshot p279e_s70
waitms 1400
echo ^5=== S70b same vantage one second on -- the scroll must have moved it
screenshot p279e_s70b_x
waitms 900
screenshot p279e_s70b
waitms 900

echo ^5=== S200
setpos -11776 -11016 13744 0 90 0
waitms 2000
screenshot p279e_s200_x
waitms 900
screenshot p279e_s200
waitms 900

echo ^5=== S600
setpos -11776 -11416 13744 0 90 0
waitms 2000
screenshot p279e_s600_x
waitms 900
screenshot p279e_s600
waitms 900

echo ^5=== S1000 -- gone
setpos -11776 -11816 13744 0 90 0
waitms 2000
screenshot p279e_s1000_x
waitms 900
screenshot p279e_s1000
waitms 900

// ---- the particles, with the sprites still off so nothing paints over them
echo ^5=== P the portal particles -- must be BLUE and fading
setpos -11776 -11016 13744 0 90 0
waitms 3000
r_partinfo
waitms 1000
screenshot p279e_particles_x
waitms 900
screenshot p279e_particles
waitms 900

echo ^5=== END OF RUN ===
waitms 500
quit
