// P394FLT -- Patch 394 review fix: trigger_teleport_relative honours filtername and
// fires its outputs, as Source's Touch/StartTouch do.  surf_race stage 5: *126
// (filter_s5_left, activator named s5_left) and *204 (filter_s5_right, the same
// filter negated) share one box (-64..64, -1840..-1712, 5040..5232) and send you
// 5056 u left or right; *70 / *235 name you s5_left / s5_right (OnStartTouch
// AddOutput targetname).  Listen server; NEW and CONTROL (+set sv_progs
// qwprogs400ctl = HEAD before the fix) with +set log_name.
//
// PRE-REGISTERED
//  L1 unnamed, into the box: NEW lands x +5056 (the negated filter passes).
//  L2 renamed s5_left in *70, into the box: NEW lands x -5056.
//  L3 renamed s5_right in *235, into the box: NEW lands x +5056.
//  CONTROL: filters ignored, one trigger wins for everyone -- L1, L2, L3 land on
//    the same side.
// FALSIFIED IF any NEW row lands on the wrong side, or CONTROL splits by name.
//
// RESULT (2026-09-20).  ALL HELD.  NEW: L1 x 5055.2, L2 x -5056.0, L3 x 5056.0.
//   CONTROL: 5055.6, 5056.0, 5056.0 -- everyone right, whatever their name.
cfg_save_auto 0
log_enable 1
log_dir logs
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
sv_cheats 1
fs_missingwarn 0
set run_resume 0
sv_port 27682

wait 200
map surf_race
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 1000
echo ^5=== p394flt L1 unnamed ===
cmd setpos 0 -1776 5072 0 90 0
waitms 1500
cmd viewpos
waitms 1500
echo ^5=== p394flt L2 s5_left ===
cmd setpos -5000 -1776 4000 0 90 0
waitms 800
cmd setpos 0 -1776 5072 0 90 0
waitms 1500
cmd viewpos
waitms 1500
echo ^5=== p394flt L3 s5_right ===
cmd setpos 5000 -1776 4000 0 90 0
waitms 800
cmd setpos 0 -1776 5072 0 90 0
waitms 1500
cmd viewpos
waitms 1500
echo ^5=== p394flt DONE ===
waitms 500
quit
