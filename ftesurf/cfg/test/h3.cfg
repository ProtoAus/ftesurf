// H3 -- Patch 215 verification AND the first honest look at what a portal view
// actually draws.  One map load, two independent questions.
//
// QUESTION 1: does the doorway still have a floor?
//   Side-on view (yaw 180) so the two probe positions differ only along y, which is
//   perpendicular to the view axis.  Any VERTICAL shift between the frames is eye
//   height and nothing else.  y -560 is outside PM_PortalCSG's window (which spans
//   about -536.1 .. -519.9); y -528 is inside it, and is where the floor was being
//   deleted.  Patch 214 fixed the pure-vertical ground probe; Patch 215 part 2 fixes
//   the walking-and-falling trace that 214 waved through.
//
// QUESTION 2: what does the far side of a portal actually render?
//   The hub is black with a red grid.  Stage 1 is a rainbow.  So the two directions
//   are trivially distinguishable BY COLOUR, which makes this measurable rather than
//   a judgement call:
//     hub -> stage 1  (h3_hub_portal)  must show RAINBOW inside the aperture
//     stage 1 -> hub  (h3_s1_portal)   must show BLACK+RED inside the aperture
//   and h3_hub_portal_off is the same camera with portal rendering disabled, which
//   is the control: whatever that frame shows is the un-rendered portal surface, so
//   if h3_hub_portal matches it pixel for pixel the recursion never ran at all.
//
// portal_hub_exit  origin 0 -520 184   angles 0 270 0  -> faces -y, entered from -y
// portal_s1_entry  origin -15360 -15352 904  angles 0 90 0 -> faces +y, entered from +y

cfg_save_auto 0
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "h3"
scr_sshot_type png
cl_yieldcpu 0
cl_maxfps 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0
r_voidvis 1
vbsp_portal_render 1

waitms 2500
map surf_kitsune
waitmap 240
waitms 8000
sv_cheats 1

// ================================================== Q1: the floor
echo "@@@ H3 eye outside the window (y -560)"
setpos 0 -560 184 0 180 0
waitms 4000
screenshot_mega h3_eye_out 1280 720
waitms 600

echo "@@@ H3 eye inside the window (y -528)"
setpos 0 -528 184 0 180 0
waitms 4000
screenshot_mega h3_eye_in 1280 720
waitms 600

echo "@@@ H3 eye outside again (repeatability control)"
setpos 0 -560 184 0 180 0
waitms 4000
screenshot_mega h3_eye_out2 1280 720
waitms 600

// ================================================== Q2: the portal view
echo "@@@ H3 hub -> looking at portal_hub_exit from 120 units back"
setpos 0 -640 184 0 90 0
waitms 3000
screenshot_mega h3_hub_portal 1280 720
waitms 600

echo "@@@ H3 hub -> same camera, portal rendering OFF (control)"
vbsp_portal_render 0
waitms 2000
screenshot_mega h3_hub_portal_off 1280 720
waitms 600
vbsp_portal_render 1
waitms 2000

echo "@@@ H3 stage 1 -> looking back at portal_s1_entry from 100 units back"
setpos -15360 -15252 904 0 270 0
waitms 3000
screenshot_mega h3_s1_portal 1280 720
waitms 600

echo "@@@ H3 stage 1 -> facing away, what the room itself looks like"
setpos -15360 -15252 904 0 90 0
waitms 2500
screenshot_mega h3_s1_room 1280 720
waitms 600

// ================================================== crossing still works?
echo "@@@ H3 crossing -- walk the hub door for real"
setpos 0 -700 184 0 90 0
waitms 2000
+forward
waitms 1400
-forward
waitms 2500
screenshot_mega h3_crossed 1280 720
waitms 600

echo "@@@ H3 DONE"
waitms 1000
quit
