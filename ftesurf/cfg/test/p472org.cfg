// P472ORG -- Patch 472: a load refuses a save whose origin is not a place.
//    python tools/p472org.py
//
// The driver stages three saves: row 1 origin x `1e999` (stof gives inf -- NOT
// `nan`, which this laptop's msvcrt atof reads as 0, where ucrt and glibc read NaN),
// row 2 origin x 1e9, row 3 a real one.  `sl_goto <n>` loads each; viewpos says
// where the body went (x and y: the body falls before it answers).
//
// PRE-REGISTERED
//  O1 row 3 loads: the body is at its origin (the arm can load at all).
//  O2 rows 1 and 2 are refused with the position message and the body stays
//     where row 3 put it.
// CONTROL (the build before): row 1 refused by SV_SaveRowIs's distance test
//  with "that save changed on disk" -- inf - inf is NaN, which fails it -- and
//  row 2 PLACED at x 1e9.
//
// RESULT (2026-10-03): as predicted, both ways.  Numbers in tools/p472org.py.
cfg_save_auto 0
log_enable 1
log_dir "logs"
log_name p472org
developer 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0
set run_resume 0
sv_public 0
sv_port 27711
set lobby_dir ""
con_notifytime 0

wait 200
map surf_colin_blaster_69000
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 2000

cmd sl_list
waitms 800
echo ^5=== p472org row 3 ===
cmd sl_goto 3
waitms 800
cmd viewpos
waitms 800
echo ^5=== p472org row 1 ===
cmd sl_goto 1
waitms 800
cmd viewpos
waitms 800
echo ^5=== p472org row 2 ===
cmd sl_goto 2
waitms 800
cmd viewpos
waitms 800
echo ^5=== p472org done ===
quit
