// P382A -- Patch 382, the spectate hold: listen host A (entnum 1) on surf_666 in
// lobby mode, target p382t.cfg (B, entnum 2).  NEEDS Patch 380's engine (infokey
// *pmhold "1"); on an older engine every ranked entry is refused (arm C0).
// Setup: zones cfg/test/p360sf.zones.json as maps/zones/local/surf_666.json
// (DELETE AFTER); back up data/runs/surf_666 and data/saves/surf_666.
// Run, together:
//   cd C:\FTESurf; .\ftesurf64.exe -WindowStyle Minimized +exec cfg/test/p382a.cfg
//   cd C:\FTESurf; C:\FTEQuake\ftesurf64.exe -WindowStyle Minimized +exec cfg/test/p382t.cfg
// logs/p382a.log holds server and client.  Each finish logs "timer: wrote|streamed
// <path>":
// copy S1, S2, S7, N and Z to data/p382/{s1,s2,s7,nudge,zone}.rec for
// p382verify.cfg; reccheck each (python tools/reccheck.py, Patch 381's).
// "spectate: <name> released (<why>) after <s> s[, rolled back: ...]" is the
// release's log line; "spectate: <name> spec 1|0 ... / pmstate ..." each edge's.
//
// PRE-REGISTERED
//  R  not held: rec_spec 1 "you cannot watch yourself"; rec_spec 9 "nobody to
//     watch at 9"; under ghost "leave ghost first"; under the watch pin "stop the
//     replay first".  Each refusal is followed by "Unknown command" for
//     `spectate` (the stuffcmd; Patch 385 registers the command).
//  RH held: rec_ghost 1 "ghost: stop spectating first", rec_watch 1 "replay: stop
//     spectating first", sl_hold "save: stop spectating first"; rec_spec 2 again
//     (the same target) is silent and writes nothing.
//  S1 mid-air, ~20 s, ESC: `spec 1` and `spec 0 ... leave` identical in fields
//     2-11 (<fl> 0), <wall> ~22 s apart, NO line between them, the line after
//     `spec 0` an `in` row restating its <mt> <carry>.  Header flags include
//     32768, not 1 or 256.  `cmd timer`: T1->T2 (inside the hold) counted
//     unchanged, frz 0/0.0000, gap up by ~1130 (the wall clock ran -- the
//     instrument can see a hold); T0->T3 (before entry, after release) gap moves
//     by -2..+2 (the startwall rebase).  viewpos identical inside the hold.  The
//     release line has no "rolled back".  .view: at most 5 sample lines carry the
//     edge's <ticks> (TF_FROZEN mirror; ~100 per second without it).
//     pm_verify PASS; reccheck 0 faults, spectated yes.
//  S2 duck just after landing, 5 s: the two pmstate dprints (spec 1, spec 0)
//     byte-identical, and pm_pin 0's two `state` lines inside the hold too.  VOID
//     (re-time, not a failure) if ducktime is 0 in both.  No "origin"/"velocity"
//     in the release line ("groundentity" may appear: sv_user.c:8575 rewrites it
//     on a zero-tick move).  pm_verify PASS.
//  C1 CONTROL, must fail S1/S2's predictions: the rec_watch pin (MOVETYPE_NONE
//     without run_pmhold) at S2's spot -- pm_pin's two `state` lines DIFFER
//     (ducktime/stamina run on) and `cmd timer`'s frz grows by ~290 (the mover ran).
//  S7 input while held (+forward +moveright +jump +duck, 4 s): viewpos unchanged,
//     pmstate dprints identical; ESC, `rec_spec 2` inside the countdown (back to
//     held, no record), ESC: ONE spec pair.  No "forcing ... (anti-hover)" line
//     (sv_showpredloss 1 prints them).  pm_verify PASS.
//  N  rollback: rec_spec_nudge -> viewpos y +16 while held; "rolled back: origin";
//     viewpos after the release = before the entry; the edges identical; flags
//     include 256 (the nudge taints) and 32768.  pm_verify PASS.  Control is
//     derived: this file's `spec 0` oy +16 (p382verify N8) must HOLD/FAULT.
//  Z  `say !r` in stage 2: "released (zone)"; `spec 0 ... zone` immediately
//     followed by `restart 1 <t>` and `warp ... zone`; flags 32768; pm_verify PASS.
//  P  setpos: "released (setpos)" before "setpos: '...'" and the cheated line.
//  K  kill: "released (respawn)"; the run is idled, no file.
//  F  `serverinfo`: fs_spec 1; lobby_avatars 0 -> fs_spec 0 and rec_spec 2 "this
//     server does not offer it".  F2 held when avatars go off: "nobody left to
//     watch", "released (notarget)" ~3 s later.  Avatars on -> fs_spec 1.
//  C0 (optional, the 0.1.9 engine): S1's entry refused "this server's engine
//     cannot hold a running body", no `spec` line.
//  W  the PVS eye while held ("spectate: <name> eye -> client|server (<why>)"):
//     W1 one `rec_watchpos`: "-> client", then "-> server (stale)" before the W2
//     marker (~1 s later).  W2 CONTROL, must NOT lapse: a send every 300 ms for
//     3 s -- one "-> client" and no "-> server" line before "---- W2 sends end",
//     then "(stale)".  W3 a bare `rec_watchpos` after a claim: "(released)".
//     W4 a claim, then ESC: "(countdown)", then "released (leave)".
//  SQ the stage rule: hold ~3 s in stage 1, finish.  `cmd timer`'s "stage close:
//     rec r seg s word w": SQ1 seg 0, w & 256 (SF_QUALIFIES) = 0 -- the stage
//     spans the window; SQ2 seg 1, w & 256 = 256 -- it began after the release.
//  SQC CONTROL, must fail SQ1: the same route and pause with no hold -- SQC1 seg 0,
//     w & 256 = 256.  If it is 0 the route cannot qualify stage 1: VOID, not PASS.
//  BN the finish chat line ("finish: <time> ..."): S1's and SQ's end in
//     SPECTATED, SQC's does not.
// FALSIFIED IF an edge pair differs in fields 2-11, a line sits inside a window,
//   the next row's <mt> is not the edge's, T0->T3 moves by more than 2, the S2/S7
//   pmstate lines differ -- or C1's do NOT (then the observable cannot see a pin);
//   W2 lapses while sent, W1 never lapses; SQ1 qualifies or SQ2 does not.
// (The load arm is B's, p382e.cfg: the listen host has no guid in lobby mode,
//  so its saves are refused before the spectate check is reached.)
//
// RESULT (2026-09-19, host engine\release\fteqw64 with Patch 380, twice; the second
// run with a copier, because S7's and SQ's files shared a tick-count name).
//   R, RH: every refusal as registered.  S1: edges equal in 2-11 (<fl> 0, vel z 182),
//   <wall> 21.5 s apart, nothing between, next `in` restates <mt> <carry>, flags
//   32768; T1->T2 counted unchanged, frz 0, gap +1133; .view <= 3 lines on the edge
//   tick; pm_verify PASS 300, reccheck 0 faults.  FALSIFIED: T0->T3 gap +11 / +12
//   (both runs).  Not the rebase: the gap was already ~13 at entry (T1 is 114 at 1.5
//   s in), i.e. the counted clock fell 0.17 s behind in the 0.95 s after T0's own
//   `cmd timer` dump, before the hold; every other held run (S7, N, Z, SQ) ends
//   within 1.  S2: pmstate identical at both edges and inside (ducktime 925, ducking 1);
//   C1 (rec_watch) ducktime 655 -> 0, rampoff and carry move: the control fails as
//   registered.  S7: pmstate identical with input held; one pair; no anti-hover line
//   in the hold (only at map load, both players); PASS 390.  N: rolled back origin,
//   flags 33025, PASS.  Z: `spec 0 ... zone`, `restart`, `warp ... zone`; PASS 466
//   (this subject is what found the verifier's warp-order HOLD, fixed in 380).
//   P, K, F, W1-W4: as registered.  SQ: seg 0 word 640 (no 256), seg 1 word 898;
//   SQC control seg 0 word 896.  BN: SPECTATED on S1..SQ finishes, not on SQC's.
//   C0 (old engine) not run.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p382a
developer 1
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
sv_port 27682
sv_cheats 0
vid_conautoscale 0
vid_conwidth 1280
vid_conheight 720
set lobby_enable    1
set lobby_avatars   1
set lobby_nocollide 1
set lobby_av_stream 1
set lobby_norec     0
set lobby_vote      0
set run_resume      0
set run_spec_countdown 3
set sv_showpredloss 1
waitms 5000
map surf_666
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 500
set rec_terms 1
echo ^5==== waiting for p382t ====
waitms 45000
status
serverinfo
echo ^5==== R: refusals, not held ====
cmd rec_spec 1
waitms 300
cmd rec_spec 9
waitms 300
cmd rec_ghost 1
waitms 500
cmd rec_spec 2
waitms 300
cmd rec_ghost 0
waitms 500
cmd rec_watch 1
waitms 500
cmd rec_spec 2
waitms 300
cmd rec_watch 0
waitms 1000
echo ^5==== RH: refusals while held ====
cmd zone_goto 0 90 0
waitms 2000
cmd rec_spec 2
waitms 500
cmd rec_ghost 1
waitms 300
cmd rec_watch 1
waitms 300
cmd sl_hold
waitms 300
cmd rec_spec 2
waitms 300
cmd rec_spec 0
waitms 3600
echo ^5==== S1: mid-air, 20 s, ESC ====
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 1200
echo ^5---- T0
cmd timer
waitms 800
+jump
waitms 150
-jump
cmd rec_spec 2
-forward
waitms 1500
cmd viewpos
echo ^5---- T1
cmd timer
waitms 17000
cmd viewpos
echo ^5---- T2
cmd timer
cmd rec_spec 0
waitms 3600
echo ^5---- T3
cmd timer
+forward
waitms 7000
-forward
waitms 2000
cmd timer
echo ^5==== S2: duck just after landing, 5 s ====
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 600
-forward
waitms 800
+jump
waitms 60
-jump
waitms 760
+duck
waitms 60
cmd rec_spec 2
waitms 300
pm_pin 0
waitms 4200
pm_pin 0
cmd rec_spec 0
waitms 3600
-duck
waitms 500
+forward
waitms 7000
-forward
waitms 2000
cmd timer
echo ^5==== C1: CONTROL -- the rec_watch pin at S2's spot ====
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 600
-forward
waitms 800
+jump
waitms 60
-jump
waitms 760
+duck
waitms 60
cmd rec_watch 1
waitms 300
pm_pin 0
cmd timer
waitms 4200
pm_pin 0
cmd timer
cmd rec_watch 0
waitms 500
-duck
waitms 1000
echo ^5==== S7: input while held; back to held from the countdown ====
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 600
-forward
waitms 800
cmd rec_spec 2
waitms 500
cmd viewpos
+forward
+moveright
+jump
+duck
waitms 4000
-forward
-moveright
-jump
-duck
waitms 300
cmd viewpos
cmd rec_spec 0
waitms 1000
cmd rec_spec 2
waitms 1500
cmd rec_spec 0
waitms 3600
+forward
waitms 7000
-forward
waitms 2000
cmd timer
echo ^5==== N: the rollback (rec_spec_nudge) ====
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 600
-forward
waitms 800
cmd viewpos
cmd rec_spec 2
waitms 500
cmd rec_spec_nudge
waitms 300
cmd viewpos
cmd rec_spec 0
waitms 3600
cmd viewpos
+forward
waitms 7000
-forward
waitms 2000
cmd timer
echo ^5==== Z: !r in stage 2 while held ====
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 2000
-forward
waitms 800
cmd rec_spec 2
waitms 2500
say !r
waitms 1000
+forward
waitms 7000
-forward
waitms 2000
cmd timer
echo ^5==== W: the PVS eye while held ====
cmd zone_goto 0 90 0
waitms 2000
cmd rec_spec 2
waitms 500
echo ^5---- W1
cmd rec_watchpos -11520 -13000 15400
waitms 2000
echo ^5---- W2
cmd rec_watchpos -11520 -13000 15400
waitms 300
cmd rec_watchpos -11520 -13050 15400
waitms 300
cmd rec_watchpos -11520 -13100 15400
waitms 300
cmd rec_watchpos -11520 -13150 15400
waitms 300
cmd rec_watchpos -11520 -13200 15400
waitms 300
cmd rec_watchpos -11520 -13250 15400
waitms 300
cmd rec_watchpos -11520 -13300 15400
waitms 300
cmd rec_watchpos -11520 -13350 15400
waitms 300
cmd rec_watchpos -11520 -13400 15400
waitms 300
cmd rec_watchpos -11520 -13450 15400
waitms 300
echo ^5---- W2 sends end
waitms 2000
echo ^5---- W3
cmd rec_watchpos -11520 -13000 15400
waitms 300
cmd rec_watchpos
waitms 1000
echo ^5---- W4
cmd rec_watchpos -11520 -13000 15400
waitms 300
cmd rec_spec 0
waitms 3600
echo ^5==== SQ: the stage rule -- hold in stage 1, finish ====
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 600
-forward
waitms 800
cmd rec_spec 2
waitms 3000
cmd rec_spec 0
waitms 3600
+forward
waitms 1300
echo ^5---- SQ1
cmd timer
waitms 1500
echo ^5---- SQ2
cmd timer
waitms 4200
-forward
waitms 2000
echo ^5---- SQ3
cmd timer
echo ^5==== SQC: CONTROL -- the same route, no hold ====
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 600
-forward
waitms 800
waitms 3000
waitms 3600
+forward
waitms 1300
echo ^5---- SQC1
cmd timer
waitms 1500
echo ^5---- SQC2
cmd timer
waitms 4200
-forward
waitms 2000
echo ^5---- SQC3
cmd timer
echo ^5==== P: setpos while held ====
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 600
-forward
waitms 800
cmd rec_spec 2
waitms 2000
cmd setpos -11520 -14000 15361
waitms 1500
echo ^5==== K: kill while held ====
