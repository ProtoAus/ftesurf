// Build 83 against the LIVE fleet: IS THE RULE ACTUALLY IN FORCE?
//
// build.ps1 -Pi shipped qwprogs.dat and csprogs.dat to all twelve lobbies and
// restarted every one of them.  Both progs are byte-identical to the local
// build and all twelve units restarted onto them.  That proves the CODE is
// live.  It does not prove the RULE is.
//
// -Pi SHIPS TWO FILES AND NO CONFIGS.  Its own header says so: "qwprogs.dat +
// csprogs.dat to the NanoPi".  The Pi's cfg/default.cfg is from Sep 13 and its
// cfg/lobby/lobby.cfg from Sep 13 23:30 -- both predate build 83, and neither
// mentions run_startjitter.  So the `set run_startjitter 2` this build wrote
// into both files is NOT on the fleet, and the value every lobby is running
// comes from one place only:
//
//     registercvar("run_startjitter", "2");        sv_timer.qc:9911
//
// WHICH IS THE TRAP THE ESSAY DIRECTLY ABOVE THAT LINE IS ABOUT.  cvar() on a
// name that does not exist AUTO-CREATES it as "" and registercvar then declines
// to overwrite it, so a non-zero default registered anywhere a read can beat it
// ships the feature inert and reading as 0.  Five features in this tree have
// died that way.
//
// AND THE LOCAL MEASUREMENT CANNOT COVER THIS CASE.  Every b83 arm ran against
// an install whose default.cfg carries `set run_startjitter 2` at line 2044, so
// the name already existed as "2" before worldspawn -- registercvar declined,
// harmlessly, and the value was 2 either way.  The fleet is the ONLY
// configuration in which registercvar has to actually create the cvar, and it
// is the configuration every player is on.  A local green is not evidence here.
//
// Reading the source says it lands: the only cvar("run_startjitter") in the
// tree is 37 lines BELOW the registercvar, in the same function, and no cfg on
// the Pi mentions the name, so nothing can auto-create it first.  That is the
// same kind of reasoning that said the first cut of SV_RunStartJitter was
// correct, and the header key is what refuted it.  Use the header key again.
//
// THE OBSERVABLE.  A lobby always streams its recorder (SV_RecStreams), so a
// run IN PROGRESS has an open part file on the Pi's own disk at
// game/ftesurf/data/parts/<slot>.rec, and SV_RecOpen has already written the
// whole header into it.  No finish is needed, nothing is submitted, the board
// is not touched and no rcon is involved -- the file is read over ssh while the
// run is live.
//
// PREDICTION, registered before the run:
//
//     FTESURF-REC 7                 the build-83 writer is the one running
//     startjit 2.0000 <dx> <dy> 0.0000   with dx or dy non-zero
//
// THREE OUTCOMES AND THEY ARE ALL DIFFERENT FACTS -- which is the entire reason
// the key is three-state rather than written-only-when-it-fired:
//
//     key absent                 THE RULE IS INERT ON ALL TWELVE LOBBIES.
//                                registercvar declined; run_t_startjit is 0.
//                                Build 83 is deployed and does nothing, and
//                                the /api/replay exposure window §3.8 closed
//                                on paper is still open in fact.
//     startjit 2 0 0 0           the rule is in force and applied nothing --
//                                every candidate blocked.  On bhop_eazy that
//                                is the inert first cut returning, i.e. the
//                                SV_ZoneOcc fix did not reach the fleet.
//     startjit 2 <dx> <dy> 0     the rule is in force and moved the player.
//
// FALSIFIED IF: the key is absent, or dz is non-zero (the rule is horizontal by
//          construction), or |dx| or |dy| exceeds 2, or the file's version line
//          is not 7 (the lobby is running progs older than the ones measured
//          identical to the local build, i.e. the restart did not take).
//
// CONTROL.  `cmd timer` is read before the jump and several times after it.  The
// pre-jump read must NOT say running: without that, a header found on disk
// could be a leftover part file from some earlier session rather than this run,
// and the whole reading would mean nothing.  The part directory was confirmed
// EMPTY over ssh immediately before this file was run, for the same reason.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name b83live
developer 0

name "^3Lex StartJit"

waitms 40000
menu_restart
waitms 3000

echo ================================ B83LIVE -- connect to lobby 4 (bhop_eazy)
connect play.proto.bar:27540
waitms 22000

echo ================================ B83LIVE -- who am I talking to
status
waitms 1500

echo ================================ B83LIVE -- BEFORE the jump.  Expect NOT running.
cmd timer
waitms 1500

// Arm the run.  zone_goto teleports into the start zone and ARMS; on bhop_eazy
// the clock latches on the JUMP, with the player standing squarely inside the
// box -- which is the fact the inert first cut got wrong.  No setpos: it is a
// cheat command on a remote server and this arm does not need a pinned origin,
// only a start.
cmd zone_goto 0
waitms 2000

echo ================================ B83LIVE -- armed, not started.  Expect ARMED.
cmd timer
waitms 1000

// ---------------------------------------------------------------------------
// The run starts HERE, on the jump.
// ---------------------------------------------------------------------------
alias hop  "+jump;waitms 70;-jump;waitms 110"
alias goL  "+moveleft;-moveright;+left;-right"
alias goR  "-moveleft;+moveright;-left;+right"
alias cyc  "goL;hop;hop;goR;hop;hop"

cl_yawspeed 210

+forward
+jump
waitms 120
-jump
waitms 120

// Deliberately not immediate: the re-arm cancel the rule could trip fires on
// the packet AFTER the displacement, not on the same one.
cyc
echo ================================ B83LIVE -- after the first cycle.  Expect RUNNING.
cmd timer
waitms 300

cyc
cyc
cyc
echo ================================ B83LIVE -- mid-run 1.  Expect RUNNING.
cmd timer
waitms 300

// A long hold with the run LIVE, so the part file on the Pi can be read over
// ssh while it is still open.  Nothing here may finish the run: a finish closes
// the file, renames it and submits a time to a public board.
cyc
cyc
cyc
cyc
cyc
echo ================================ B83LIVE -- mid-run 2.  Expect RUNNING.
cmd timer
waitms 8000

echo ================================ B83LIVE -- mid-run 3 (hold).  Expect RUNNING.
cmd timer
waitms 8000

echo ================================ B83LIVE -- mid-run 4 (hold).  Expect RUNNING.
cmd timer
waitms 8000

echo ================================ B83LIVE -- mid-run 5 (hold).  Expect RUNNING.
cmd timer
waitms 8000

-forward
-moveleft
-moveright
-left
-right
waitms 1000

echo ================================ B83LIVE -- last read before quit.
cmd timer
waitms 1000

echo ================================ B83LIVE done
disconnect
waitms 1500
quit
