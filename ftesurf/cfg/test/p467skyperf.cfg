// P467SKYPERF -- p467sky.cfg uncapped: shots with the milk sky on and off, same view,
// read the HUD's fps from each (the difference is the sky's in-game cost).
// Launch: ftesurf64.exe +exec test/p467sky.cfg
// Shots: level view, looking up (setpos from the spawn p467pos.cfg printed,
// raised 588 u out of the start room), then the map's own sky as the control.  The
// arm is only worth anything if the control differs: diff p467sky_up against
// p467sky_off over the sky region.
cfg_save_auto 0
// Pin every milk cvar the shots depend on -- ftesurf.cfg archives the player's own.
set milk_menu 1
set milk_quality 2
set milk_trails 1
set milk_react 1
set milk_menumusic auto
set musicvolume 0.02          // pre-tap, and the analysis is level-normalised
volume 0                    // the laptop owner is in the room; analysis taps pre-volume
log_enable 1
log_dir logs
log_name p467skyperf
developer 1
cl_idlefps 0
cl_maxfps 0
vid_wait 0
fs_missingwarn 0
con_notifytime 0
scr_sshot_type jpg
scr_sshot_compression 92
set run_resume 0
sv_public 0
sv_port 27685
set lobby_dir ""
set milk_sky 1
waitms 3000
map surf_rookie
waitmap 45
waitms 4000
menu_restart
waitms 500
ui_close
waitms 2500
echo ==== p467sky: r_skybox is now
r_skybox
cmd setpos -4416 12288 15500 -25 90 0
waitms 3000
screenshot p467skyperf_on
waitms 1500
cmd setpos -4416 12288 15500 -60 90 0
waitms 3000
screenshot p467skyperf_on_up
waitms 1500
set milk_sky 0
r_skybox ""
waitms 2500
screenshot p467skyperf_off
waitms 1500
quit
