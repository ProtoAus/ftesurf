// FTESurf Patch 183 stress: cycle the mount/unmount path hard.
//
// The plan called repeated A->B->A cycling "the dangling-bucket path" -- Patch 27's
// crash signature is a freed pack's buckets left linked in filesystemhash, walked by
// the next incremental FS_AddFileHashUnsafe.  FS_Addon_Unmount calls
// FS_FlushFSHashReally rather than FS_FlushFSHashFull precisely to avoid that, so
// this is the test that says whether the claim is true.
//
// Seven loads, deliberately including:
//   * a map needing NEITHER pack (drops to zero addons mounted)
//   * two DIFFERENT maps wanting the SAME pack in a row (must NOT remount it)
//   * returning to a pack that was dropped twice
fs_loadstats 1
fs_automount 1
fs_autounmount 1
developer 0
waitms 4000
echo "=== P183 STRESS: mount/unmount cycling ==="
echo "--- 1 utopia (TF2) ---"
map surf_utopia
waitms 20000
echo "--- 2 tensor2 (CS:GO; drops TF2) ---"
map surf_tensor2
waitms 20000
echo "--- 3 aberrant (neither; drops CS:GO, zero addons) ---"
map bhop_aberrant
waitms 20000
echo "--- 4 utopia (TF2 again, from nothing) ---"
map surf_utopia
waitms 20000
echo "--- 5 sodacity (CS:GO; drops TF2) ---"
map surf_sodacity
waitms 20000
echo "--- 6 tensor2 (CS:GO again -- must NOT remount) ---"
map surf_tensor2
waitms 20000
echo "--- 7 utopia (TF2 a third time) ---"
map surf_utopia
waitms 20000
echo "=== STRESS DONE, still alive ==="
waitms 1000
quit
