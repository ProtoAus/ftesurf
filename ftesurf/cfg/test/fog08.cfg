// FOG08 -- underwater fog: does the plugin publish the water material's fog,
// and does the gamecode turn it into the engine's waterfog slot?
// surf_legends embeds LIQUIDS/AZTECWATER_OLD, so it is a known water map.
log_enable 1
log_dir "logs"
log_name "fog08"
cfg_save_auto 0
cl_maxfps 0
vid_fullscreen 0
vbsp_fog 1
wait 200
map surf_legends
waitmap 1800
waitms 11000
echo ^3--- plugin outputs (Patch 254):
hl2_waterfog
waitms 300
hl2_waterfog_start
waitms 300
hl2_waterfog_end
waitms 300
echo ^3--- what the gamecode set on the engine water slot:
waterfog
waitms 400
map surf_kitsune
waitmap 1800
waitms 11000
echo ^3--- surf_kitsune:
hl2_waterfog
waitms 300
waterfog
waitms 400
echo ^5=========== done =====
log_enable 0
