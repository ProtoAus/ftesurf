// BUILD 87 capture: b85ride.cfg's surf_ecosystem booster walk, re-run on build 87
// to produce a v9 subject with ride records.  Copied live by an outside poller
// to data/b87ride.part.  Body identical to b85ride.cfg.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name b87ride
developer 0

sv_cheats 0

set rec_enable 1
set rec_stream 1
set rec_runarchive 1

set run_startjitter 2
set run_bv_debug 1

cl_yawspeed 210

waitms 6000
map surf_ecosystem
waitmap 60
waitms 4000

echo ================================ B87 -- loaded.  Expect NOT running.
viewpos
cmd timer
waitms 700

cmd zone_goto 0
waitms 1500
echo ================================ B87 -- after zone_goto
viewpos
waitms 700

setpos -2300 0 5000 0 180 0
waitms 1500
echo ================================ B87 -- armed and aimed
viewpos
cmd timer
waitms 700

+forward
waitms 1200
echo ================================ B87 -- walking out
viewpos
cmd timer
waitms 600

echo ================================ B87 -- approaching the pad
viewpos
cmd timer
waitms 1200

echo ================================ B87 -- on or past the pad
viewpos
cmd timer
waitms 1500

echo ================================ B87 -- after the launch 1
viewpos
cmd timer
waitms 1500

echo ================================ B87 -- after the launch 2
viewpos
cmd timer
waitms 1500

-forward
waitms 600
echo ================================ B87 -- settled
viewpos
cmd timer
waitms 800

echo ================================ B87 -- HOLD (copy window opens)
cmd timer
waitms 9000
echo ================================ B87 -- HOLD 2
viewpos
cmd timer
waitms 9000
echo ================================ B87 -- HOLD 3
cmd timer
waitms 9000

echo ================================ B87 -- last read before quit
cmd timer
waitms 1000

echo ================================ B87 done
waitms 500
quit
