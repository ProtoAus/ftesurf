cfg_save_auto 0

// ===========================================================================
//  P441RETRYW -- a retry whose PREFIX WRITE FAILS while the recorder is live.
//    python tools/p441void.py --arm retryw
//  The path, the clauses and the gesture are all in cfg/test/p441retry.cfg's
//  header.  This arm differs in one staged file and one control build.
//
//  WHY IT EXISTS, AND WHAT IT ACTUALLY MEASURED.  Round 5 replaced round 4's
//  `retry && mark > 0` with `retry && (flg & TF_RECORDING)`, on the grounds that
//  `mark` (`reclines`) answers "did a prefix FILE get written" and is 0 exactly when
//  the write FAILED with the recorder still live (sv_timer.qc:5556).  A review of
//  round 5 pointed out that no arm produced that state, so the swap had no
//  measurement behind it.  This file set out to produce it -- and found that IT
//  CANNOT BE PRODUCED FROM QC AT ALL:
//
//    the engine's PF_fopen allocates a memory buffer for the WRITE modes and the
//    bytes go out at fclose (engine/common/pr_bgcmd.c, PF_fopen's FILE_WRITE case),
//    so `fopen` returns a handle even with a DIRECTORY sitting on the path.
//
//  Measured here: with save000/run.rec staged as a directory, the log shows
//  `qcfopen("data/saves/bhop_eazy/save000/run.rec", 2)` and NO `timer: cannot write`
//  line, the blocker is still a directory when the run exits (the driver checks), and
//  the retry point was written with `reclines` POSITIVE and no prefix file on disk.
//  SV_RecWritePrefix's `if (fh < 0)` branch is effectively unreachable for a
//  filesystem failure; it can fire only if the QC handle table is full.
//
//  SO THIS ARM DOES NOT DISCRIMINATE ROUND 4 FROM ROUND 5.  Both spellings void here:
//  `mark` is positive AND the flags bit is set.  On the evidence available, the two
//  are indistinguishable on every reachable retry path, and round 5's swap stands on
//  which FACT each names -- the run's own recorder, versus the outcome of a write QC
//  cannot check -- not on a measured difference.  That is stated in sv_saveloc.qc's
//  own comment too, because a reader deciding whether to simplify the predicate back
//  needs it.
//
//  WHAT IT DOES ESTABLISH, and it is worth an arm by itself: `reclines > 0` IS NOT
//  EVIDENCE THE PREFIX EXISTS.  Anything that reads that number as "there is a file"
//  -- Patch 426's reasoning about mark-0 saves, a reader pairing a state file with a
//  recording, a future predicate tempted by `mark` -- is trusting a count the writer
//  returns before the bytes leave the process.  BACKLOG.md carries it.
//
//  ARMS, in log order:
//   C1  leave the start box: `timer: running`, `recording 1`.
//   C2  `rec_enable 0` under that recorder: still `timer: running`, `recording 1`.
//   S   `retry`, with save000/run.rec blocked.
//
//  PRE-REGISTERED PREDICTIONS (rewritten after the first run falsified the premise;
//  the original is the paragraph above, kept because the negative is the finding)
//   C1/C2  `timer: running`, `recording 1`, both builds.
//   S   NO `timer: cannot write` line -- the write cannot be seen to fail.
//   S   BOTH builds: `run cancelled (the save's recording could not be restored)`,
//       `retry -- back where you were`, `timer: idle`.  The control here is round 4
//       (64f84a5) and it answers the same, which is the non-discrimination.
//   S   the blocker is still a DIRECTORY at exit (checked by the driver, not the cfg):
//       nothing landed at that path.
//  FALSIFIED IF the `cannot write` line appears after all (then the write CAN be seen
//   to fail, and round 5's justification is measurable -- rewrite this file and grade
//   the pair properly), or if either build reads `running` at S, or if the blocker is
//   a file at exit.
//
//  RESULT (2026-09-26): exactly as above on the round-6 build; the premise this file
//  was written to test is false and the file is kept for that.
log_enable 1
log_dir logs
log_name p441retryw
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
sv_port 27698
sv_cheats 0
set run_resume 0
vid_fullscreen 0
waitms 5000
map bhop_eazy
waitmap 2400
waitms 3000
menu_restart
ui_close
waitms 1200

echo ==== C1 leave the start box: must read running / recording 1 ====
+forward
waitms 1500
-forward
waitms 700
cmd timer
waitms 800

echo ==== C2 rec_enable 0 UNDER the running recorder: still recording 1 ====
rec_enable 0
waitms 600
cmd timer
waitms 800

echo ==== S SUBJECT: retry, with save000/run.rec blocked by a directory ====
retry
waitmap 2400
waitms 3000
cmd timer
waitms 1000

quit
