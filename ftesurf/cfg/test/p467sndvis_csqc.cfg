// snd_vis CSQC binding check (engine client/snd_vis.c): loads a map so csprogs.dat runs, with
// developer logging, where an unbindable #0:name logs "Unknown csqc builtin: <name>". Then
// plays music/visprobe.wav and polls snd_visinfo: with snd_vis_trace 0 the analysis count only
// grows when QC itself calls snd_getvis/snd_visimage. Map-load pattern from anim01.cfg.
cfg_save_auto 0
set log_dir logs
set log_name p467sndvis_csqc
set log_enable 1
set developer 1
set log_developer 1
set cl_idlefps 0
set cl_maxfps 100
set vid_fullscreen 0
set s_inactive 1
set volume 0
set mastervolume 1
set musicvolume 1
set snd_vis_trace 0
wait 200
map surf_demise
waitmap 1800
waitms 3000
echo SNDVIS_CSQC map loaded
snd_visinfo
music visprobe
waitms 3000
echo SNDVIS_CSQC poll 1
snd_visinfo
waitms 3000
echo SNDVIS_CSQC poll 2
snd_visinfo
echo SNDVIS_CSQC done
quit
