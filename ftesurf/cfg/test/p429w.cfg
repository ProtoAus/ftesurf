// P429W -- the watcher for p429t.cfg: spectates P429T from t~25 s to t~50 s of
// the target's clock (it starts ~8 s after the target), then stops.
cfg_save_auto 0
log_enable 1
log_dir logs
developer 1
cl_idlefps 0
cl_maxfps 100
rate  2000000
drate 5000000
vid_fullscreen 0
name "P429W"
waitms 3000
connect 127.0.0.1:27636
waitms 3000
menu_restart
waitms 1000
ui_close
waitms 10000
echo p429w: watch
spectate P429T
waitms 25000
echo p429w: off
spectate off
waitms 20000
echo p429w: done
quit
