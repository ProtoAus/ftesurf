cfg_save_auto 0
// P387SPAN -- a grant change INSIDE a run reaches the finish (engine Patch 387).
// Linux client, listen server on surf_666, X11 renderer, XI2 at boot:
//   zones: cfg/test/p360sf.zones.json copied to ftesurf/maps/zones/local/
//   surf_666.json (DELETE AFTER -- it shadows the shipped zones);
//   env -u WAYLAND_DISPLAY DISPLAY=:0 ./fteqw64 -nosound +set vid_renderer gl
//     +set developer 1 +exec cfg/test/p387span.cfg > p387span.out 2>&1
// READ STDOUT, NOT A LOG: with log_enable 1 the first vid_restart after a run
// wrote its .rec dies in Log_String -> FS_OpenVFS -> FS_AddFileHash ->
// Hash_GetInsensitiveBucket (SIGSEGV; pre-387 and 387 binaries alike, 2026-09-19).
// Writes two runs under data/runs/surf_666/ -- park or remove them after.
// Two-process variant (plan C4): same arms, with `fteqw-sv64 +set sv_port 27631
// +set sv_public 0` from the same commit (p376sv.cfg's setup) and `map surf_666`
// below replaced by `connect 127.0.0.1:27631`.
//
// PRE-REGISTERED
//   S0 CONTROL: two honest vid_restarts mid-run (XI2 stays on).  No frame sees
//      the shutdown's transient 0, so `cmd timer` mid-run reads ev bad = badat,
//      grant R, would 0; the finish's `cmd timer` reads noprofile 0 and
//      that .rec's `flags` header line has no 2048 (TF_NOPROFILE).
//   S1 x11_allow_xi2 0; vid_restart; 0.5 s; x11_allow_xi2 1; vid_restart, all
//      before the finish (the course is ~4.7 s of +forward): mid-run `cmd timer`
//      reads ev bad = badat + 1, grant R again, would 1 (the bad delta alone);
//      the finish reads noprofile 1 and the .rec `flags` include 2048.
// (vid_restart + two waitms: see p387xi2.cfg.  +forward is 6.7 s of
// post-restart time; the finish comes at ~4.7 s, after both restarts.)
// VOID IF an arm's mid-run `cmd timer` does not read "timer: running".
// FALSIFIED IF S0 finishes noprofile 1 (an honest restart demotes) or S1
// finishes noprofile 0 (the core-pointer window ranks).

// No _quiet.cfg: p376cl's shape (no menu.dat), which is known to finish this walk.
set vid_fullscreen 0
set vid_width 640
set vid_height 480

developer 1
log_enable 0
cl_maxfps 100
cl_idlefps 0
sv_cheats 0
m_filter 0
m_accel 0
cl_nocsqc 0
set run_resume 0

wait 200
map surf_666
waitmap 600
waitms 6000

echo ^5=== P387SPAN S0: honest vid_restarts mid-run.  Expect would 0, finish noprofile 0.
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 700
vid_restart
waitms 100
waitms 500
vid_restart
waitms 100
waitms 500
cmd timer
waitms 5000
-forward
waitms 2500
cmd timer
waitms 2000

echo ^5=== P387SPAN S1: XI2 off and back on mid-run.  Expect would 1, finish noprofile 1.
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 700
set x11_allow_xi2 0
vid_restart
waitms 100
waitms 500
set x11_allow_xi2 1
vid_restart
waitms 100
waitms 500
cmd timer
waitms 5000
-forward
waitms 2500
cmd timer
waitms 2000

echo ^5=== END OF RUN ===
waitms 1000
quit

