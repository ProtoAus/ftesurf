cfg_save_auto 0

// ===========================================================================
//  P443HOP -- `retry` from a clean ARMED start, then hop inside the box.
//    python tools/p443start.py --arm hop
//  No fixture and no zones override.  The driver forces `+set sv_gamemode surf` -- see
//  THE MODE below, which is load-bearing.
//
//  THIS IS A GUARD, NOT A DISCRIMINATOR, and that is round 4's doing.  The change it
//  was written to measure -- clearing run_t_startok for a restored ARM, so the
//  hopped-start rule speaks for it -- is WITHDRAWN.  Every reading below is now the
//  same on every build, and what the arm does is go RED if anyone re-introduces the
//  change without the two prerequisites named at the end.  It is kept because the
//  measurements are the argument for that decision.
//
//  THE DEFECT IT MEASURED, which is real and still open.  SV_SaveApplyState sets
//  `e.run_t_startok = TRUE` for every restore it can read, and the whole build 19/20/21
//  start rule -- the settle, the dwell, the `hopped start` verdict, run_t_hopped -- is
//  behind `if (!e.run_t_startok)` (SV_TimerJumpWatch).  Only SV_TimerArm clears it
//  again, and a retry restores run_t_azone verbatim, so there is no arm edge and nothing
//  calls it.  A retry also restores run_t_flags, dirty and cheat VERBATIM and calls no
//  SV_TimerStitched -- by design, since a retry does not move you -- so the attempt that
//  comes back is CLEAN and RANKABLE with the hop rule switched off.  MEASURED: S read
//  `start: ok 1` after the retry, and J1's autohop chain inside the start box went
//  entirely unjudged (`hopped 0`, no message) on a clean attempt.
//
//  WHY THE FIX IS NOT HERE.  Three rounds of review, and the third one priced it:
//    - `run_t_hopped` IS NOT IN THE SAVE FORMAT, so a `retry` launders a hopped start by
//  itself.  The cheaper gesture is to chain BEFORE the retry -- correctly marked, then
//  forgiven by the restart -- so the chain J1 drives is not the one anybody needs.
//    - the retry placement restores `velocity` through no gate at all, so the speed a
//  chain built survives the restart and the player can simply LEAVE the box with it.  No
//  post-retry hop is required, which is what makes judging that hop worthless.
//    - and the dwell the rule grades is BLIND for the first 0.25 s after a placement into
//  a fresh edict, because map_restart re-initialises run_t_groundsec.  A player holding
//  +jump across the restart is accused of the one gesture the rule permits.
//  Both of the first two are BACKLOG.md entries.  Until they land, turning the rule on
//  costs an honest player a taint and closes nothing.
//
//  AND TWO FIXES FOR THE BLINDNESS FAILED, which is the part to read before a third.
//  Round 2 forgave the first jump after a placement with a one-shot flag; SV_TimerArm
//  both cleared that flag and shared the blindness it existed for, and THIS ARM'S
//  SIBLING was staging a zones override that suppressed the very arm edge that does it.
//  Round 3 used `run_t_jumps <= 1`, the rule's own "more than one jump" sentence; every
//  event that zeroes that count is a fresh forgiveness, and SV_TimerArm is reachable
//  from ordinary map data -- 21 shipped maps have two abutting start regions whose seam
//  re-arms silently on every crossing, 66 have a velocity-keeping teleport landing inside
//  a start region.  A forgiveness hung on anything SV_TimerArm touches is one the map
//  hands out.
//
//  THE MODE, AND IT IS THE REASON THIS ARM IS NOT ON A BHOP MAP'S OWN RULES.
//  cfg/lobby/mode_bhop.cfg:131 sets `run_starthop 0` -- on a bhop map hopping out of
//  the start IS the sport -- and SV_TimerMapInit applies that file from the map's
//  metadata on a listen server too (`movement: bhop_eazy is bhop (mapmeta), 6 cvars
//  from cfg/lobby/mode_bhop.cfg`).  So the rule this patch restores is OFF on bhop
//  maps by the operator's own decision, and the configuration where it is ON is the
//  default (surf) ruleset, which is also LEAVE-THE-BOX rather than start-on-jump.
//  `sv_gamemode surf` forces that on bhop_eazy, as cfg/test/p435mode.cfg does; C
//  grades `start on leave` to prove the override took, because if it reads
//  `start on jump` then mode_bhop.cfg ran, run_starthop is 0, and this arm has NO
//  VERDICT either way.  `starthop` grades the cvar itself for the same reason.
//
//  WHY THE CHAIN CANNOT SETTLE ITS OWN START HERE: run_starthop_strict is 1 by
//  default, so `settleok` requires TS_RUNNING and the other two branches
//  need it as well -- and under leave-the-box rules a player hopping INSIDE the box
//  is still TS_ARMED.  So startok cannot become TRUE for as long as the chain stays
//  in the box, and every hop that re-presses on landing reads dwell ~ 0.  The chain
//  is a HELD +jump: pm_autobunny is 1 in default.cfg:105, so the button re-jumps on
//  the landing tick without being released -- the "autohop case" the rule's own
//  comments describe, a hop the server never saw grounded, reading a dwell of zero.
//
//  TWO EARLIER CUTS OF THIS ARM MEASURED NOTHING, and both are worth their lines
//  because both printed a green-looking J on the FIXED build:
//   1  THREE TAPS 300 ms APART.  300 ms is LONGER than run_prestrafe_time (0.25), so
//      every jump that landed was judged LEGAL by the rule's own definition --
//      `jumps 2`, `start: ok 1`, `class: clean`, which reads exactly like the defect.
//      A tap at +300 ms also falls inside the 0.755 s of airtime, so the middle press
//      did nothing at all.  The uncontrolled variable was the RHYTHM.
//   2  A HELD +jump ON BHOP MAP RULES.  `jumps 4`, so the chain really happened, and
//      still `class: clean` -- for TWO reasons, neither of them the patch: the mode
//      cfg above had switched run_starthop off, and under start-on-jump the first
//      jump makes the attempt RUNNING, after which the chain never lets `ong` become
//      true, so run_t_airsec is never reset and `now - airsec` passes run_t_settle
//      (1.006 s) and settles the start through the legitimate airborne branch.  Found
//      by grepping the log for the mode line, not by reading the verdict.
//
//  ARMS, in log order:
//   C   THE IN-ARM CONTROL, and the reason `ok 0` at S is a measurement rather than a
//       field that is always 0: at spawn the player is ARMED in the box, the arm scan
//       has just run SV_TimerArm, and `start: ok` must read 0.  Both builds.  It also
//       carries the two premises, `start on leave` and `starthop 1`.
//   S   SUBJECT: `retry`, then read `start: ok` before touching anything.
//   J1  the chain: +jump HELD for 1.4 s inside the box, and the report is read WHILE
//       IT IS STILL HELD -- the player never stands, so the dwell forgiveness (the
//       run_rearmhop block in SV_TimerJumpWatch, which needs 0.25 s of ground) cannot
//       fire and take the taint back before it is read.
//   J2  release the button and STAND.
//       ROUND 5 CORRECTED THIS ENTRY, which had described round 1's behaviour while the
//       graded table beside it described round 4's -- the two disagreed in the file.  It
//       read "the taint this patch restores must be the forgivable one, so `start
//       re-armed` and `hopped 0` follow 0.25 s of ground dwell".  There is nothing to
//       forgive: the change is withdrawn, J1 is not judged, so the prediction is NO
//       re-arm line, which is what the table says.  PATCH 445 then moved the ground
//       underneath it twice over -- run_rearmhop defaults to 0, and the clear a `!r`
//       now performs is SV_TimerForgiveHop's.  The section is kept as a guard: a
//       `start re-armed` line here means a forgiveness fired that no shipped default
//       should produce.  That is the question worth asking of a patch that turns a
//       rule back on -- whether it can accuse a player who then does the honest
//       thing -- and it needs no travel, which is why this section replaced the one
//       below.
//
//  THE SECTION THAT WAS WITHDRAWN, because a reviewer would find it and it is a
//  finding either way.  J2 was first "hold +jump AND +forward, leave the box
//  mid-chain, and the run starts tainted" -- the exploit's actual point, since the
//  prespeed comes out with you.  Two runs, two problems:
//    at 6 s the exit is NOT DETERMINISTIC.  A chain holding +forward travels at
//  pm_maxairspeed (30 u/s) and the ring is 256 units across, so one run crossed at
//  x -267.9 and the next fell 27 units short and read `armed`, measuring nothing.
//    at 10 s the CONTROL ends tainted too -- `practice 1`, `hopped 1`, and yet
//  `start: ok 1` in the same report -- so something re-armed the attempt during ten
//  seconds of blind forward hopping.  That mechanism is not controlled here and is
//  not this patch's; naming it is the honest verdict, not calling the section safe.
//  What the withdrawn section would have measured is SV_TimerStart consuming
//  run_t_hopped into SV_TimerPractice, which is build 21's own machinery and
//  has its own arms (cfg/test/b21a.cfg, b21c.cfg).  This patch's contribution is
//  whether the chain is JUDGED, which is J1.
//
//  PRE-REGISTERED PREDICTIONS -- all of them "both builds", because this is a guard.
//   C   `start on leave`, `"run_starthop" is "1"`, `timer: armed`, `start: ok 0`,
//       `hopped 0`.  The premises, and the proof the field CAN read 0 (a fresh arm).
//   S   `retry -- back where you were`, `timer: armed`, `start: ok 1`.  The restore
//       settles the start -- build 19's answer, deliberately kept.  A reading of 0 here
//       means the withdrawn change is back and the two prerequisites should be checked.
//   J1  no `hopped start` line, `hopped 0`, still `armed`.  The chain is NOT judged, and
//       that is the recorded decision rather than an oversight.
//   J2  no `start re-armed` line, `hopped 0`: nothing was taken back because nothing was
//       marked.
//  FALSIFIED IF C reads `start on jump` or `starthop 0` (the mode override did not take:
//   NO VERDICT, as p435mode.cfg says of the same premise), or C reads `ok 1` (the field
//   is not what this arm thinks it is and every reading below is void).
//
//  RESULT.  Three readings, one file, because the file outlived two of them.
//   ROUND 1 (qwprogs 88E5939564887CAD) against pre-443 (3096B6F5468BEE3A, which is
//   byte-identical to the pair deployed on the twelve lobbies, so the control side is a
//   reading of the live build):
//     C  both builds `start on leave`, `"run_starthop" is "1"`, `timer: armed`,
//        `start: ok 0 dwell 0.25 settle 1.01 strict 1 hopped 0 rearmhop 1`, ground 4.7.
//     S  both `retry -- back where you were`, `armed`, `arm zone 0 (armed from 0)` --
//        the restore put the latch back, so there is no edge and nothing calls
//        SV_TimerArm, which is the mechanism.  CONTROL `ok 1`; ROUND 1 `ok 0`.
//     J1 both `armed`, `phase: ground 0.00 air 0.63` -- the autohop chain, groundsec
//        never observed, which is the dwell-0 case.  CONTROL `ok 1`, `hopped 0`, no
//        message.  ROUND 1 `ok 0`, `hopped 1`, `hopped start -- one jump out of the
//        start, or walk out`.
//     J2 ROUND 1 `start re-armed -- one jump out of the start`, `hopped 0`, ground 1.35.
//        CONTROL no re-arm line.  So the rule it restored was the forgivable one.
//   ROUND 3 (6BF223C658C8AAF0) read the same as round 1 at S and J1: the chain was still
//   judged with the first hop unjudged and the second judged.
//   ROUND 4 (4F7380452CCCAC68), the change withdrawn: S `start: ok 1`, J1 `hopped 0` and
//   no message, J2 no re-arm line -- identical to the pre-443 control, which is what a
//   guard should read.  Driver exit 0 on both sides.
log_enable 1
log_dir logs
log_name p443hop
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
sv_port 27699
sv_cheats 0
set run_resume 0
vid_fullscreen 0
waitms 5000
map bhop_eazy
waitmap 2400
waitms 3000
menu_restart
ui_close
waitms 1200

echo ==== C the fresh arm, and the two premises ====
run_starthop
waitms 300
cmd timer
waitms 800

echo ==== S SUBJECT: retry, then read start ok before touching anything ====
retry
waitmap 2400
waitms 3000
cmd timer
waitms 1000

echo ==== J1 the chain: +jump HELD in the box, read while still held ====
+jump
waitms 1400
cmd timer
waitms 700

echo ==== J2 stop chaining and stand: the taint must be forgivable ====
-jump
waitms 1500
cmd timer
waitms 1000

quit
