cfg_save_auto 0

// ===========================================================================
//  P443HOP -- `retry` from a clean ARMED start, then hop inside the box.
//    python tools/p443start.py --arm hop
//  No fixture and no zones override: the retry point is slot 0, written by the run
//  itself, and the gesture never loads a save.  The driver forces
//  `+set sv_gamemode surf`, which is load-bearing -- see THE MODE below.
//
//  THE DEFECT.  SV_SaveApplyState set `e.run_t_startok = TRUE` for every restore it
//  could read, and the whole build 19/20/21 start rule -- the settle, the dwell, the
//  `hopped start` verdict, run_t_hopped -- is behind `if (!e.run_t_startok)`
//  (sv_timer.qc:9986).  Only SV_TimerArm clears it again (:10509), and a retry
//  restores run_t_azone verbatim, so there is no arm edge and nothing calls it.  A
//  retry also restores run_t_flags, dirty and cheat VERBATIM and calls no
//  SV_TimerStitched -- by design, since a retry does not move you -- so the attempt
//  that comes back is CLEAN and RANKABLE with the hop rule switched off.  One
//  keypress, no cheats, no cvars.  Found by the review of Patch 441 round 2.
//
//  THE FIX (Patch 443).  The flag is set from the RESTORED STATE: TS_RUNNING keeps
//  build 19's answer (a restored run really is past its start, and the 0.4-second
//  window build 19 was worried about stays closed), and TS_ARMED/TS_IDLE do not --
//  the start has not happened, it is the next thing that will.  run_t_airsec goes
//  with it, gated on run_starthop_strict exactly as SV_TimerArm's clear is
//  (sv_timer.qc:10539), or a stale air phase from the fall before the save would
//  settle the start on the next airborne tick, which is build 20's finding.
//
//  THE MODE, AND IT IS THE REASON THIS ARM IS NOT ON A BHOP MAP'S OWN RULES.
//  cfg/lobby/mode_bhop.cfg:131 sets `run_starthop 0` -- on a bhop map hopping out of
//  the start IS the sport -- and SV_TimerMapInit applies that file from the map's
//  metadata on a listen server too (`movement: bhop_eazy is bhop (mapmeta), 6 cvars
//  from cfg/lobby/mode_bhop.cfg`).  So the rule this patch restores is OFF on bhop
//  maps by the operator's own decision, and the configuration where it is ON is the
//  default (surf) ruleset, which is also LEAVE-THE-BOX rather than start-on-jump.
//  `sv_gamemode surf` forces that on bhop_eazy, as cfg/test/p435mode.cfg does; C
//  grades `start on leave` to prove the override took, because if it reads
//  `start on jump` then mode_bhop.cfg ran, run_starthop is 0, and this arm has NO
//  VERDICT either way.  `starthop` grades the cvar itself for the same reason.
//
//  WHY THE CHAIN CANNOT SETTLE ITS OWN START HERE: run_starthop_strict is 1 by
//  default, so `settleok` requires TS_RUNNING (:10003) and the other two branches
//  need it as well -- and under leave-the-box rules a player hopping INSIDE the box
//  is still TS_ARMED.  So startok cannot become TRUE for as long as the chain stays
//  in the box, and every hop that re-presses on landing reads dwell ~ 0.  The chain
//  is a HELD +jump: pm_autobunny is 1 in default.cfg:105, so the button re-jumps on
//  the landing tick without being released -- the "autohop case" the rule's own
//  comments describe, a hop the server never saw grounded, reading a dwell of zero.
//
//  TWO EARLIER CUTS OF THIS ARM MEASURED NOTHING, and both are worth their lines
//  because both printed a green-looking J on the FIXED build:
//   1  THREE TAPS 300 ms APART.  300 ms is LONGER than run_prestrafe_time (0.25), so
//      every jump that landed was judged LEGAL by the rule's own definition --
//      `jumps 2`, `start: ok 1`, `class: clean`, which reads exactly like the defect.
//      A tap at +300 ms also falls inside the 0.755 s of airtime, so the middle press
//      did nothing at all.  The uncontrolled variable was the RHYTHM.
//   2  A HELD +jump ON BHOP MAP RULES.  `jumps 4`, so the chain really happened, and
//      still `class: clean` -- for TWO reasons, neither of them the patch: the mode
//      cfg above had switched run_starthop off, and under start-on-jump the first
//      jump makes the attempt RUNNING, after which the chain never lets `ong` become
//      true, so run_t_airsec is never reset and `now - airsec` passes run_t_settle
//      (1.006 s) and settles the start through the legitimate airborne branch.  Found
//      by grepping the log for the mode line, not by reading the verdict.
//
//  ARMS, in log order:
//   C   THE IN-ARM CONTROL, and the reason `ok 0` at S is a measurement rather than a
//       field that is always 0: at spawn the player is ARMED in the box, the arm scan
//       has just run SV_TimerArm, and `start: ok` must read 0.  Both builds.  It also
//       carries the two premises, `start on leave` and `starthop 1`.
//   S   SUBJECT: `retry`, then read `start: ok` before touching anything.
//   J1  the chain: +jump HELD for 1.4 s inside the box, and the report is read WHILE
//       IT IS STILL HELD -- the player never stands, so the run_rearmhop forgiveness
//       (:10141, which needs 0.25 s of ground dwell) cannot fire and take the taint
//       back before it is read.
//   J2  release the button and STAND: the taint this patch restores must be the
//       forgivable one, so `start re-armed` and `hopped 0` follow 0.25 s of ground
//       dwell (:10141).  That is the question worth asking of a patch that turns a
//       rule back on -- whether it can accuse a player who then does the honest
//       thing -- and it needs no travel, which is why this section replaced the one
//       below.
//
//  THE SECTION THAT WAS WITHDRAWN, because a reviewer would find it and it is a
//  finding either way.  J2 was first "hold +jump AND +forward, leave the box
//  mid-chain, and the run starts tainted" -- the exploit's actual point, since the
//  prespeed comes out with you.  Two runs, two problems:
//    at 6 s the exit is NOT DETERMINISTIC.  A chain holding +forward travels at
//  pm_maxairspeed (30 u/s) and the ring is 256 units across, so one run crossed at
//  x -267.9 and the next fell 27 units short and read `armed`, measuring nothing.
//    at 10 s the CONTROL ends tainted too -- `practice 1`, `hopped 1`, and yet
//  `start: ok 1` in the same report -- so something re-armed the attempt during ten
//  seconds of blind forward hopping.  That mechanism is not controlled here and is
//  not this patch's; naming it is the honest verdict, not calling the section safe.
//  What the withdrawn section would have measured is SV_TimerStart consuming
//  run_t_hopped into SV_TimerPractice (:11582), which is build 21's own machinery and
//  has its own arms (cfg/test/b21a.cfg, b21c.cfg).  This patch's contribution is
//  whether the chain is JUDGED, which is J1.
//
//  PRE-REGISTERED PREDICTIONS
//   C   `start on leave`, `starthop 1`, `timer: armed`, `start: ok 0`, `hopped 0`.
//       Both builds.
//   S   CONTROL (pre-443, 89f5f7a): `start: ok 1` -- the restore settled a start that
//       has not happened.  FIXED: `start: ok 0`.
//   J1  CONTROL: no `hopped start` line, `hopped 0` -- the rule is off, the chain is
//       free.  FIXED: `hopped start -- one jump out of the start, or walk out`, and
//       `hopped 1`, on an attempt that is still `armed`.
//   J2  FIXED: `start re-armed -- one jump out of the start`, `hopped 0`, still
//       `armed` and `class: clean` -- the taint is taken back by standing still, so
//       the rule this patch restores is the forgivable one and not a new accusation.
//       CONTROL: no re-arm line and `hopped 0`, because there was never a taint to
//       forgive.  The MESSAGE is the discriminator here; the field reads 0 on both.
//  FALSIFIED IF C reads `start on jump` or `starthop 0` (the mode override did not
//   take: NO VERDICT either way, as p435mode.cfg says of the same premise), or C reads
//   `ok 1` on either build (the field is not what this arm thinks it is), or S reads
//   `ok 0` on the control (the defect is not on this path), or S reads `ok 1` on the
//   fixed build, or J1 reads `hopped 1` on the CONTROL (something other than this
//   patch is judging the chain), or J2 reads `hopped 1` on the FIXED build (the taint
//   is NOT forgivable and the patch has made a permanent accusation out of a chain
//   inside a start box).
//
//  RESULT (2026-09-26, both builds, driver exit 0 each way; qwprogs 88E5939564887CAD
//   fixed / 3096B6F5468BEE3A control -- the control is HEAD before Patch 443
//   (89f5f7a) built in a worktree, and it is byte-identical to the pair DEPLOYED on
//   the twelve lobbies, so the control side is a reading of the live build.  Logs kept
//   as ftesurf/logs/p443hop.log.fixed and .control, each with a .hash beside it.)
//   C  both builds: `start on leave`, `"run_starthop" is "1"`, `timer: armed`,
//      `start: ok 0 dwell 0.25 settle 1.01 strict 1 hopped 0 rearmhop 1`, ground 4.7.
//      The premises hold and the field reads 0 on a fresh arm, on both builds.
//   S  both: `retry -- back where you were`, `timer: armed`, `arm zone 0 (armed from
//      0)` -- the restore put the latch back, so there is no edge and nothing calls
//      SV_TimerArm, which is the mechanism.  CONTROL `start: ok 1`.  FIXED
//      `start: ok 0`.  One field, one bit, and it is the field the patch writes.
//   J1 both: `timer: armed`, `phase: ground 0.00 air 0.63` -- the autohop chain, with
//      groundsec never observed, which is the dwell-0 case.  CONTROL: `start: ok 1`,
//      `hopped 0`, no `hopped start` line -- the rule is off and the chain is free.
//      FIXED: `start: ok 0`, `hopped 1`, and `hopped start -- one jump out of the
//      start, or walk out`.
//   J2 FIXED: `start re-armed -- one jump out of the start`, `hopped 0`, still
//      `armed`, `class: clean`, ground 1.35.  CONTROL: no re-arm line, `hopped 0`,
//      ground 1.34.  So the restored rule is the FORGIVABLE one: standing still takes
//      the verdict back, and a player who hops in the box and then does the honest
//      thing is not left accused.
log_enable 1
log_dir logs
log_name p443hop
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
sv_port 27699
sv_cheats 0
set run_resume 0
vid_fullscreen 0
waitms 5000
map bhop_eazy
waitmap 2400
waitms 3000
menu_restart
ui_close
waitms 1200

echo ==== C the fresh arm, and the two premises ====
run_starthop
waitms 300
cmd timer
waitms 800

echo ==== S SUBJECT: retry, then read start ok before touching anything ====
retry
waitmap 2400
waitms 3000
cmd timer
waitms 1000

echo ==== J1 the chain: +jump HELD in the box, read while still held ====
+jump
waitms 1400
cmd timer
waitms 700

echo ==== J2 stop chaining and stand: the taint must be forgivable ====
-jump
waitms 1500
cmd timer
waitms 1000

quit
