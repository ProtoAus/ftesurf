// Patch 377, first-boot arm: a player with no ftesurf.cfg yet.
// Run with CWD = a scratch basedir holding default.fmf and a copy of ftesurf/ (cfg, *.dat,
// fs_addons.txt, glsl, particles, scripts, models) but no ftesurf.cfg:
//   <exe> +set developer 1 +set cfg_save_auto 0 +set log_enable 1 +set log_dir logs
//     +set log_name <n> +exec cfg/test/p377fresh.cfg
// Predictions: pre-377 exe (control, ftesurf64_p362.exe) -> r = "mom_restart_stage",
//              sensitivity 0.35 (Momentum's); 377 exe -> r = "say !r", sensitivity 0.3.
// Result 2026-09-19: both as predicted.  Control: r "mom_restart_stage", 1 "mom_savestate_create",
//   0.35, 499 unknown commands.  377: r "say !r", 1 unbound, 0.3 (default), 0 unknown.
cl_idlefps 0
cl_maxfps 100
waitms 3000
echo ======== P377F
bind r
bind 1
sensitivity
echo ======== P377F done
quit
