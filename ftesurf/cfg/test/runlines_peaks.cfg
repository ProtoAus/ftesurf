// Private overlay (tools/runlines_smoke.py).  The line's turnaround marks, graded
// by tools/test_runlines_peaks.py, whose docstring has the fixture's every case.
// Both fixtures are tracked and built by that file (--write): one motion, as a
// native recording and as an import.  hud_lines_nums is deliberately NOT set here:
// the default is part of what is graded.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name runlines_smoke
con_notifytime 0
cl_idlefps 0
cl_maxfps 100
set hud_watch_skipidle 0
set hud_watch_path 1
set hud_lines_board 1
set hud_lines_order 0           // Patch 624's window is the draw's; a board line is read whole here
waitms 2000
map surf_voyager
waitmap 60
waitms 4000
menu_restart
ui_close
hud_lines_marks 1
hud_lines_speed 1
hud_lines_energy 1
hud_lines_names 1
hud_lines_time 1
hud_lines_numsize 18
hud_lines_declutter 0
echo ==== NATIVE ====
hud_lines_nums
replay cfg/test/runlines_peaks.rec
waitms 1500
replay pause
replay seek 0.3
waitms 1000
replay status
replay marks 0
replay marktrace 2
waitms 1000
screenshot runlines_peaks_fixture.png
scores lineat 1 cfg/test/runlines_peaks.rec
waitms 3000
replay marks 1
echo ==== IMPORT ====
replay stop
waitms 300
replay cfg/test/runlines_peaks_mom.rec
waitms 1500
replay pause
replay status
replay marks 0
scores lineat 2 cfg/test/runlines_peaks_mom.rec
waitms 3000
replay marks 2
scores lines clear
echo ==== REAL ====
// The owner's surf_voyager run, natively recorded: a picture of a real ride's
// bottom and the arc after it, for a person to look at.
replay stop
waitms 300
replay cfg/test/p492voy.rec
waitms 2500
replay pause
replay seek 3.9
waitms 1200
replay marks 0
replay marktrace 2
waitms 800
screenshot runlines_peaks_real.png
echo RUNLINES COMPLETE
quit
