// Private overlay (tools/runlines_smoke.py).  Patch 661: what is written on the run lines.
// The camera rides a paused replay of one run, and that run is the board lines too.
//   NAME    a line alone in an old slot (5), then alone in a new one (12): each has its
//           name, in the line's colour, where there was none past the eighth.  Shots
//           with the names on and off, and `linegraph status` (label, name).
//   CROWD   the run in twenty lines, marks on all of them: every name and every number
//           sits where nineteen others do.  Nearest first, one of each twenty has room
//           (`lines native`: with room, without).  Then the lanes (hud_lines_declutter
//           2), the default before: none is without room there, they are stacked.
//   RANGE   one line: its numbers within 600 u against as far as the line.
//   TEXT    `replay marks 1`: energy as the speedometer prints it (no u/s), then as a
//           speed, then energy alone with the other switches off.
//   PANE    the HUD editor's "Line labels" pane, a shot and its status.
//   MOVED   a config that holds the old energy zero (hud_lines_ref 1, hud_labels_rev 0)
//           and a map load: the zero is the speedometer's afterwards, once.
// In NAME, hud_lines_label_far 50 as well: that is the numbers' range, and a name must
// not go with it (the first cut's did).
// tools/test_p661labels.py grades it.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name runlines_smoke
con_notifytime 0
con_notifylines 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
vid_winmaximize 0
vid_width 1600
vid_height 900
vid_conautoscale 1
sv_public 0
set run_resume 0
waitms 2000
map surf_voyager
waitmap 60
waitms 5000
wait 4
menu_restart
ui_close
set hud_scale 2
set gl_conback 0
set hud_linegraph 0
set hud_lines_order 4
set hud_lines_color_others 5
set hud_lines_nums 2
set hud_lines_marked 64
set hud_lines_declutter 0
set hud_lines_label_far 3000
set hud_lines_units 1
set hud_lines_ref 0
set hud_lines_speed 1
set hud_lines_energy 1
set hud_lines_vz 0
set hud_lines_delta 0
set hud_lines_time 0
set hud_lines_names 1
set hud_linegraph_labels 1
set hud_watch_path 0
waitms 1000
set hud_lines_demo 0            // Patch 745: the whole demo line, as before its replay window
replay cfg/test/p492voy.rec
waitms 2500
replay pause
replay seek 20
waitms 1500
wait 4
echo ==== P661 NAME 5 ====
scores lines clear
waitms 400
scores lineat 5 cfg/test/p492voy.rec
waitms 2500
wait 4
echo P661 NAME 5 on
linegraph status
scores lines
screenshot p661_name5_on.png
waitms 400
set hud_linegraph_labels 0
waitms 600
wait 4
screenshot p661_name5_off.png
waitms 400
set hud_linegraph_labels 1
set hud_lines_label_far 50
waitms 600
wait 4
echo P661 NAME 5 near
linegraph status
set hud_lines_label_far 3000
echo P661 NAME 5 end
echo ==== P661 NAME 12 ====
scores lines clear
waitms 400
scores lineat 12 cfg/test/p492voy.rec
waitms 2500
wait 4
echo P661 NAME 12 on
linegraph status
scores lines
screenshot p661_name12_on.png
waitms 400
set hud_linegraph_labels 0
waitms 600
wait 4
screenshot p661_name12_off.png
waitms 400
set hud_linegraph_labels 1
set hud_lines_label_far 50
waitms 600
wait 4
echo P661 NAME 12 near
linegraph status
set hud_lines_label_far 3000
echo P661 NAME 12 end
echo ==== P661 CROWD ====
scores lines clear
waitms 400
scores lineat 1 cfg/test/p492voy.rec
waitms 250
scores lineat 2 cfg/test/p492voy.rec
waitms 250
scores lineat 3 cfg/test/p492voy.rec
waitms 250
scores lineat 4 cfg/test/p492voy.rec
waitms 250
scores lineat 5 cfg/test/p492voy.rec
waitms 250
scores lineat 6 cfg/test/p492voy.rec
waitms 250
scores lineat 7 cfg/test/p492voy.rec
waitms 250
scores lineat 8 cfg/test/p492voy.rec
waitms 250
scores lineat 9 cfg/test/p492voy.rec
waitms 250
scores lineat 10 cfg/test/p492voy.rec
waitms 250
scores lineat 11 cfg/test/p492voy.rec
waitms 250
scores lineat 12 cfg/test/p492voy.rec
waitms 250
scores lineat 13 cfg/test/p492voy.rec
waitms 250
scores lineat 14 cfg/test/p492voy.rec
waitms 250
scores lineat 15 cfg/test/p492voy.rec
waitms 250
scores lineat 16 cfg/test/p492voy.rec
waitms 250
scores lineat 17 cfg/test/p492voy.rec
waitms 250
scores lineat 18 cfg/test/p492voy.rec
waitms 250
scores lineat 19 cfg/test/p492voy.rec
waitms 250
scores lineat 20 cfg/test/p492voy.rec
waitms 250
waitms 3000
wait 4
echo P661 CROWD nearest
scores lines
lines native
linegraph status
screenshot p661_crowd_nearest.png
waitms 400
set hud_lines_declutter 2
waitms 800
wait 4
echo P661 CROWD lanes
lines native
replay marktrace 1
waitms 300
screenshot p661_crowd_lanes.png
waitms 400
set hud_lines_declutter 0
waitms 800
wait 4
echo P661 CROWD again
replay marktrace 1
waitms 300
echo P661 CROWD end
echo ==== P661 RANGE ====
scores lines clear
waitms 400
scores lineat 1 cfg/test/p492voy.rec
waitms 2500
set hud_linegraph_labels 0
set hud_lines_label_far 0
waitms 800
wait 4
echo P661 RANGE line
lines native
screenshot p661_range_line.png
waitms 400
set hud_lines_label_far 600
waitms 800
wait 4
echo P661 RANGE 600
lines native
screenshot p661_range_600.png
waitms 400
set hud_lines_label_far 3000
echo P661 RANGE end
echo ==== P661 TEXT ====
waitms 600
wait 4
echo P661 TEXT energy
replay marks 1
set hud_lines_units 0
waitms 600
wait 4
echo P661 TEXT speed
replay marks 1
set hud_lines_units 1
set hud_lines_speed 0
waitms 600
wait 4
echo P661 TEXT alone
replay marks 1
screenshot p661_text_alone.png
waitms 400
set hud_lines_speed 1
echo P661 TEXT end
echo ==== P661 PANE ====
replay stop
waitms 600
hud_edit labels
waitms 1500
screenshot p661_pane.png
waitms 600
echo P661 PANE status
hud_edit status
waitms 400
hud_edit off
waitms 300
echo P661 PANE end
echo ==== P661 MOVED ====
set hud_labels_rev 0
set hud_lines_ref 1
map surf_voyager
waitmap 60
waitms 5000
wait 4
echo P661 MOVED after
hud_lines_ref
hud_labels_rev
echo P661 MOVED end
echo P661 end
echo RUNLINES COMPLETE
quit
