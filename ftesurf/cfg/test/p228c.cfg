// The purple trees, second hypothesis: it is the LIGHTING, not the texture.
//
// p228b ruled out three suspects.  All four shots were identical to the pixel in
// the canopy -- (80,22,97) -- so gl_load24bit, r_reflectcube and hl2_bumpmap all
// change nothing here.  Meanwhile the texture's own BC3 endpoints average
// (103,113,83), a muted green.  Green in, magenta out, and the compressed upload
// path is not doing it.
//
// What p228b did NOT test is the one path that is unique to static props and has
// a history of exactly this failure: the leaf AMBIENT CUBE.  The map logs
// "props: 0 of 72 lit from VRAD's baked vertex lighting", so all 72 fall back to
// VBSP_LightPointValues rather than their own bake -- and Patch 152 ("the pale
// props") and Patch 158 ("the blue props") were both bugs on that path.  The
// trunk shares the same lighting but is a dark DXT1 brown, where a colour cast is
// far less obvious than it is on bright leaves.
//
// Two readings, and between them they settle it:
//
//   r_texdiag 1 -> the PROPLIGHT / LEAFAMB census (mod_vbsp.c:4730).  It prints
//     the mean ambient RGB actually applied to the props and an R/B ratio, which
//     is precisely the number a HUE bug moves and a brightness bug cannot.  If the
//     mean is magenta, the lighting is the culprit and the texture is innocent.
//
//   r_fullbright 1 -> removes lighting entirely.  If the leaves go GREEN here,
//     that is conclusive: the texture is fine and the light is wrong.  If they
//     stay magenta with no lighting at all, the fault is in the shader itself and
//     the ambient cube is innocent.
//
// _000 texdiag census + normal lighting
// _001 fullbright        <- THE DECISIVE SHOT

log_enable 1
log_name p228c
developer 1
cfg_save_auto 0
cl_idlefps 0

wait 200
echo ^5=== p228c: is the magenta coming from the prop ambient cube? ===

r_texdiag 1
map bhop_ambience
waitmap 900
wait 120

echo ^5--- census (expect a PROPLIGHT line with mean RGB and R/B) ---
r_texdiag_now
waitms 900
screenshot
waitms 600

echo ^5--- _001 r_fullbright 1: no lighting at all ---
echo ^5(green leaves here == the light is wrong, not the texture)
r_fullbright 1
wait 180
screenshot
waitms 800

r_fullbright 0
echo ^5=== p228c done ===
wait 30
quit
