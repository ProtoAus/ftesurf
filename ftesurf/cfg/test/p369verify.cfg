// PATCH 369 -- pm_verify follows a stage restart.  `restart` records were a
// blanket REFUSE; on the live board they were the largest single reason a v9
// run went unbadged (10 of 27, 2026-09-19).
//
// One dedicated server per map (the sweeper's shape), from C:\FTESurf:
//   C:\FTEQuake\fteqwsv64.exe +set sv_public 0 +set sv_port 27699 +set rec_enable 0
//     +set lobby_master "" +map <map> +wait +wait +wait +pm_verify data/p369/<map>.rec +quit
// SUBJECTS  data/p369/<map>.rec (untracked): the ten live Pi runs whose verdict
// was REFUSE "a stage restart" -- bhop_eazy 4903, surf_anzchamps 23232, surf_aura
// 16555, surf_aweles 8235, surf_beginner 4050, surf_botanica 7371, surf_deathstar
// 7033, surf_deoa 14484, surf_garden 10141, surf_how2surf 9928.  surf_deathstar
// carries the only `!r` (a restart and a `zone` warp written after the packet's
// sample); the rest restart through map teleports.
// DERIVED from surf_deathstar, one edit each:
//   N1 n1order.rec  the `!r` restart + zone warp moved above that packet's sample
//   N2 n2norst.rec  every `restart` line removed
//   N3 n3tele.rec   the first teleport before a restart lands 16 u off in x
// CENSUS FIRST (live corpus + local): every tele/speed warp (191) sits before its
// packet's sample; every zone warp (4) and `!r` restart (4 of 68) after it.
//
// PRE-REGISTERED
//   1  each subject PASS at its trailer's ticks, "restarts N of N applied".
//   2  N1 HOLD state (the warp would beat the sample it followed); N3 HOLD state.
//   3  N2: no prediction -- does the latch reset carry any verdict?
//   4  Control (p369ctl.cfg): the Patch 364-era binary REFUSEs "a stage restart".
//   5  Regression: p367verify, p356newer, p367ms's eazy.rec unchanged.
//
// RESULT (2026-09-19, fteqwsv64 369 + progs with SV_VerifyRestart): 1-5 held.
//   All ten PASS at their ticks (botanica rows 7367 of 7371, how2surf 9927 of
//   9928 -- the zones end them there), ARM 4 exact on every packet, aarch64
//   recordings replayed on x64.  N1 HOLD "state: 1 packet(s) differ, first at row
//   1564"; N3 HOLD at row 1086.  N2 PASS 7033: the latch reset decides no verdict
//   on these files, so the refusal was over-cautious rather than protective; the
//   hook is kept because it is what the live timer does.  Control REFUSE.
