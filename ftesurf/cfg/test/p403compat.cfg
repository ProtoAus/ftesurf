// P403COMPAT -- Patch 403 arm C4, and the only arm the live board's safety
// rests on: an UNCAPPED recording must still verify under CAPPED progs.
//
// If the clamp ran inside pm_verify's replay it would re-trim a carrier the
// original run never trimmed, the replay would diverge from the file, and every
// row on the board recorded before Patch 403 would lose its verdict.  So this
// takes a .rec written with `run_startcap 0` (p403cap0 saves one to
// data/p403cap0.rec) and replays it on progs with the cap at its shipped 290.
//
// SETUP: copy cfg/test/p403stage.zones.json -> maps/zones/local/bhop_arcane.json
// -- the SAME fixture p403cap0 ran under, because the .rec header pins the zone
// source and crc and sv_ccmds.c:5088 refuses on any mismatch before replaying.
// Then run p403cap0 and copy its .rec to data/p403cap0.rec.
//
// PRE-REGISTERED
//  C4 pm_verify prints PASS, and the replay agrees tick for tick.
// FALSIFIED IF it HOLDs or REFUSEs on anything but a zone-table mismatch.
//
// RESULT (2026-09-20, after the review fixes).
//   subject data/p403cap0.rec, written with run_startcap 0:
//     ride 0 372 arm -6.11959404e-05 1400 -0          <- the FULL carrier
//   replayed by progs with run_startcap 290:
//   VERIFY data/p403cap0.rec PASS ticks 64 rows 47
//   So the clamp does not run in the verifier.  Independently confirmed by the
//   review: pm_verify calls exactly four QC entry points -- SV_VerifyZonePin,
//   SV_VerifyBegin, SV_VerifyStep, SV_VerifyRestart (sv_ccmds.c:5057-5098) --
//   and SV_TimerFrame, SV_TimerStart and PlayerPreThink are none of them.  The
//   replay also sets the carrier ABSOLUTELY from the file's own `ride` records
//   (sv_ccmds.c:5415-5431), never from the map or from a cvar.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p403compat
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
sv_cheats 1
fs_missingwarn 0
set run_resume 0
sv_port 27681

wait 200
map bhop_arcane
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 1000

echo ^5=== p403compat ===
pm_verify data/p403cap0.rec
waitms 4000
echo ^5=== P403COMPAT DONE ===
waitms 500
quit
