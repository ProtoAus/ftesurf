// P426BCL -- a FINISH whose receipt lands after the next arm (server: p426sv.cfg,
// zones cfg/test/p426b.zones.json copied to maps/zones/local/surf_666.json --
// DELETE IT AFTER -- and the stub `b65stub.py cert 8131`).
//
// SV_TimerArm calls SV_RecDiscard, whose tail drops the run's id and nonce even
// when nothing is recording -- so a finish followed by an arm before its
// receipt lands loses the receipt.  A chained stage run arms when it leaves the
// next stage's box (run_t_pendarm), and a bhop finish that teleports into the
// start arms at once.  Made deterministic here with cl_delay_packets, which
// delays this client's OUTGOING packets in order: the commands that walk out of
// S2 reach the server before the receipt the client sends on seeing the finish.
//
// FIXTURE: START y -14288..-14150; S2 16 units thick at y -13300..-13284, so the
// stage-1 run is ~850 units (longer than the delay, which the nonce answer
// must beat) and leaving S2 takes a fraction of it; END y -12950..-12800.
//
//   S0  `!s 1`, walk START -> S2: a stage-1 run finishes on S2 (leg 1), and
//       leaving S2 arms stage 2.  No delay: the receipt lands first.
//   S1  the same with cl_delay_packets 1000.
//   S2  as S1, then zone_goto voids stage 2 (unkept, no posts) before the
//       finish's receipt lands (Patch 426 round 2: a void keeps a held finish).
//
// PRE-REGISTERED PREDICTIONS
//  BEFORE the finish hold (Patch 426 as first committed):
//   B1 S0 logs `timer: receipt ...rcpt` for its runid (the control).
//   B2 S1 logs `timer: receipt refused -- no run id or no nonce`, its stage-1
//      submit carrying TF_NONCE (131072) -- so the nonce WAS answered.
//  AFTER the finish hold:
//   A1 S0 and S1 both log `timer: receipt ...rcpt`, each under its own run's
//      runid, and rcptcheck finds both VALID with ticks agreeing.
//  S2 (added for Patch 426 round 3): signs on e33a444+; on a700b52, where
//   every unkept end cleared the hold, refused.
// FALSIFIED IF S1 signs before the fix, S0 does not, or S1's submit lacks
//   TF_NONCE (then it measures the nonce handshake, not the arm).
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p426bcl
developer 1
cl_idlefps 0
cl_maxfps 100
rate  2000000
drate 5000000
vid_fullscreen 0
set rec_enable 1
set rec_hid 1
set rec_upload 1
name "^3P426b"
waitms 6000
connect 127.0.0.1:27632
waitms 12000
set rec_terms 1

echo ^5==== S0: stage-1 run, no delay ====
cmd zone_goto 0 90 0
waitms 1500
say !s 1
waitms 1500
cmd timer
+forward
waitms 3800
-forward
echo ^5--- S0: past S2 ---
cmd timer
waitms 3000
cmd zone_goto 0 90 0
waitms 2000

echo ^5==== S1: stage-1 run, cl_delay_packets 1000 ====
set cl_delay_packets 1000
waitms 2000
say !s 1
waitms 2500
cmd timer
+forward
waitms 3800
-forward
waitms 1200
echo ^5--- S1: past S2 ---
cmd timer
waitms 4000
set cl_delay_packets 0
cmd zone_goto 0 90 0
waitms 3000

echo ^5==== S2: as S1, then a void of stage 2 before the receipt lands ====
// Server time, d = 2000 ms out (1000 left too narrow a window: the zone_goto
// beat stage 2's opening): the finish ~T+5.45, stage 2 opens ~T+5.65, this
// zone_goto voids it ~T+6.6, the finish's receipt lands ~T+7.45 and the void's
// own (signed 0) ~T+8.6.
set cl_delay_packets 2000
waitms 2000
say !s 1
waitms 3500
+forward
waitms 4600
cmd zone_goto 0 90 0
-forward
waitms 6000
set cl_delay_packets 0
waitms 2000
echo ^5==== P426b CL done ====
quit

// RESULT (2026-09-21, Windows, fteqwsv64 + ftesurf64 on one box, stub 8131):
//  BEFORE (Patch 426 as first committed, 25df2c6):
//   B1 HELD: S0's stage-1 finish (210 ticks, flags 131072) signed.
//   B2 OUTCOME HELD, REASON NOT: S1's finish (210 ticks, flags 131072, so the
//      nonce WAS answered) was refused -- but as `the nonce was never
//      answered`, not `no run id or no nonce`.  Leaving S2 had already OPENED
//      stage 2, so the refusal names the new run's unanswered nonce.  Either
//      way the finish lost its receipt.  (A first cut of this fixture used the
//      p426 zones: its stage-1 run lasted 43 ticks, under the 1000 ms delay, so
//      the nonce answer itself arrived after the finish -- the handshake, not
//      the arm.  Hence the thin S2 and the long stage.)
//  AFTER (the run that ended is held, finishes included):
//   A1 HELD: S0 ...234341 and S1 ...234355 both `timer: receipt`, each joined to
//      its own stage_1 file by rcptcheck: VALID, nonce agrees, ticks agree (209,
//      210), the .view matches the committed digest.
//  p426cl.cfg re-run on the same build: both abandons (ticks 0) and the finish
//  (299) VALID, all three through the hold.
//  S2 (Patch 426 round 3, 2026-09-22): on this build the stage-1 finish
//   (210 ticks) signed at 00:50:41 after the client logged `run cancelled
//   (teleported)` at :40 (stage 2 opened at :39, its startjit line); on
//   a700b52's server progs the same case was refused, `no run id or no nonce`,
//   at 00:53:00 after the void at :59.  (d = 1000 ms first: the zone_goto beat
//   stage 2's opening and voided nothing.)  The void's own receipt did not
//   appear on either build.
