// P452COL -- Patch 452: colouring the line by contact and by energy.
//
// `replay colours <slot> <stride>` prints ln_col itself -- the vector the
// emitter hands to R_PolygonVertex -- for every stride-th point, so a mode that
// computes the right number and stores it somewhere else still fails.
// tools/p452col.py derives the expected colour from the .rec: the contact kind
// from the documented flag bits (the same three-state rule p449mark.py uses),
// and the energy rate from E = z + |v|^2/2g over the same two-samples-each-side
// window, against Strafe_PowerCeiling.
//
// PRE-REGISTERED
//  C1 mode 2: every sampled point's colour is its phase's -- ground amber, ramp
//     cyan, air pale.  Points within one sample of a contact edge are skipped:
//     which side of the boundary a point falls on is not the claim.
//  C2 mode 3: every sampled point's colour is the energy ramp for its own dE/dt,
//     to 0.02 per channel.
//  C3 modes 0 and 1 still colour as they did before this patch (the strip is
//     unchanged for anyone who does not turn the new modes on).
//  C4 the four modes do not all agree: a line that looked identical in every
//     mode would pass C1 and C2 by accident.
// RESULT (2026-09-27, aesthetic pb frozen at t=40, stride 32).  All four held.
//  C1 161 of 167 sampled points graded (6 sit within one sample of a contact
//     edge and are skipped), 0 wrong.  C2 167 points against the ceiling 37.5,
//     0 wrong.  C3/C4 four modes sampled, four distinct colourings.
//
// C2 FAILED ONCE AND THE CLIENT WAS RIGHT: one point in 167 came out grey where
//  the model wanted saturated green.  The model was differencing ACROSS a
//  teleport; Line_ColEnergy refuses to, as the speed gain has always refused
//  to.  The grader learned the rule rather than the code being changed.
//
// MUTATIONS, all three caught: ground painted as air (C1, 12 points wrong), the
//  phase read from the mark's `from` instead of its `to` (C1, 160 wrong -- every
//  phase lags one), and energy with the vertical left out (C2, 139 wrong).
log_enable 1
log_dir "logs"
log_name p452col
developer 0
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0
set run_resume 0
sv_public 0
sv_port 27711
set lobby_dir ""
set hud_watch_skipidle 0
set hud_watch_path 1

wait 200
map surf_aesthetic
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 1000

replay data/runs/surf_aesthetic/main/0005191_pb.rec
waitms 1500
replay pause
replay seek 40
waitms 1200

echo ^5=== p452col C3 speed ===
hud_watch_path_color 0
waitms 700
replay colours 0 32
waitms 400
echo ^5=== p452col C3 gain ===
hud_watch_path_color 1
waitms 700
replay colours 0 32
waitms 400
echo ^5=== p452col C1 contact ===
hud_watch_path_color 2
waitms 700
replay colours 0 32
waitms 400
echo ^5=== p452col C2 energy ===
hud_watch_path_color 3
waitms 700
replay colours 0 32
waitms 400
echo ^5=== p452col marks ===
replay marks 0
waitms 300
screenshot screenshots/p452col_energy.png
waitms 500
hud_watch_path_color 2
waitms 700
screenshot screenshots/p452col_contact.png
waitms 500
replay stop
waitms 300
quit
