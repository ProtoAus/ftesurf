// P463PIN -- moving a byte-identical zone table must not refuse a recording.
//
// pm_verify's zone pin used to be a string compare that INCLUDED the directory
// the table was loaded from (sv_ccmds.c:5264, pre-463):
//     Q_snprintfz(zbuf, "%s %s %s", hdrzsrc, hdrzcrc, hdrzrule)
// against SV_VerifyZonePin's "<src> <crc> <swept> <hull> <live>".  So copying a
// zone file from maps/zones/online/ to maps/zones/local/ -- which the loader
// exists to support (sv_zones.qc:177-181), and which is the only way to edit one
// -- made every recording of that map REFUSE as "a different zone table or
// rule", with the crc and the rule identical on both sides.  Maximum verdict, on
// a correct file.  Patch 463 compares the fields and not the path.
//
// NO NEW FIXTURES.  It drives cfg/test/p349verify.cfg's existing subjects, which
// already carry the pre-registered outcomes and a wrong-crc negative control:
//   data/b88fin.rec     finished v9 on bhop_eazy, header says `zonesrc online`
//   data/p349_zcrc.rec  the same file with zonecrc deadbeef
//
// THE DRIVER RUNS THIS TWICE, and the pair is the whole arm: once with a
// byte-identical mirror at maps/zones/local/bhop_eazy.json (so the live source
// is `local` and the header still says `online`) and once without.  A patch that
// simply stopped checking zones would pass the first half and fail the second.
//
// PRE-REGISTERED
//  P1  the server states its own source: `zones(sv): 7 on bhop_eazy
//      (maps/zones/local) crc c50cfd70` with the mirror, `(maps/zones/online)`
//      without.  Same crc both ways -- if the crc moves, the mirror is not
//      byte-identical and nothing below means anything.
//  P2  data/b88fin.rec PASSes ticks 662 in BOTH runs.  This is the fix.
//  P3  data/p349_zcrc.rec REFUSEs in both runs, and the reason names the TABLE
//      rather than "table or rule" -- crc and rule now get separate verdicts,
//      matching SV_MsStale's ("the zones changed" / "the zone rules changed",
//      sv_resume.qc:215-232).
//  P4  the printed diagnostic shows crc and rule as separate fields, so an
//      operator can see which one decided.
//
// CONTROL BUILD, measured 2026-09-28 rather than asserted.  Reverting only
// engine/server/sv_ccmds.c (the sole uncommitted engine change; 458/460/461 are
// committed and stay in) and rebuilding gave a pre-463 exe, and the mirror run
// produced:
//     zone pin  file "online c50cfd70 1 1 0"  here "local c50cfd70 1 1 0"
//     VERIFY data/b88fin.rec REFUSE a different zone table or rule
// with ALL FIVE of p349verify's subjects refused, not just the subject.  Note
// the exe hash changes on every rebuild regardless of source, because the binary
// embeds SVNREVISION and a stash dirties the tree -- so the control was
// confirmed by BEHAVIOUR, not by hash.
log_enable 1
log_dir logs
log_name p463pin
developer 1
log_developer 1
set rec_enable 0
set rec_stream 0
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
con_notifytime 0
sv_port 27713
vid_fullscreen 0
waitms 5000
menu_restart
ui_close
waitms 1200

map bhop_eazy
waitmap 3600
waitms 2500

echo ==== P463 SUBJECT b88fin ====
pm_verify data/b88fin.rec
waitms 1800

echo ==== P463 NEGATIVE zcrc ====
pm_verify data/p349_zcrc.rec
waitms 1800

// Round 2.  The first cut of this arm exercised 2 of SV_VerifyZoneCmp's 6
// returns, which its evidence reviewer flagged: the untested ones included the
// branch that re-indexes the token positions and the one that decides whether a
// missing pin accuses or accepts.  These six are derived from b88fin.rec by the
// driver, one header edit each, and removed afterwards.
echo ==== P463 B1 nosrc -- zonesrc line deleted, must still PASS ====
pm_verify data/p463_nosrc.rec
waitms 1800
echo ==== P463 B2 rule -- zonerule 1 1 1 ====
pm_verify data/p463_rule.rec
waitms 1800
echo ==== P463 B3 nocrc -- zonecrc line deleted ====
pm_verify data/p463_nocrc.rec
waitms 1800
echo ==== P463 B4 norule -- zonerule line deleted ====
pm_verify data/p463_norule.rec
waitms 1800
echo ==== P463 B5 rule4 -- zonerule 1 1 0 1, a fourth term ====
pm_verify data/p463_rule4.rec
waitms 1800
echo ==== P463 B6 rulejunk -- zonerule 1 1 x ====
pm_verify data/p463_rulejunk.rec
waitms 1800

echo ==== P463 done ====
waitms 500
quit
