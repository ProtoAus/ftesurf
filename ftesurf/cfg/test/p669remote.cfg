// Private overlay (tools/runlines_smoke.py --dedicated --map surf_voyager).  Patch 669 on
// SOMEBODY ELSE'S server: the client is connected over a socket, so it is not the host, and
// a console command may have been typed for it by that server.  Zones are made by command
// and every way of writing a file by command is tried: each is refused in words, and nothing
// is written.  tools/test_p669zoneedit.py grades it (it knows the log by its REMOTE marks).
cfg_save_auto 0
log_enable 1
log_dir logs
log_name runlines_smoke
con_notifytime 0
con_notifylines 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
vid_winmaximize 0
vid_width 1600
vid_height 900
vid_conautoscale 1
set run_resume 0
waitms 2000
map surf_voyager
waitmap 60
waitms 5000
wait 4
menu_restart
ui_close
waitms 1500
echo ==== P669 REMOTE ====
zone_edit
waitms 800
zone_edit add checkpoint 0 0 0 64 64 0 64
waitms 300
echo P669 REMOTE made
zone_edit status
zone_edit save
waitms 300
zone_edit save force
waitms 300
zone_edit press ze_sv
waitms 500
zone_edit forget
waitms 300
zone_edit press ze_fg
waitms 500
echo P669 REMOTE after
zone_edit status
echo P669 REMOTE end
echo RUNLINES COMPLETE
quit
