// Patch 417 -- the signing primitive's own falsifier, in the shipping binary.
// RFC 8032 section 7.1's three published vectors, and a tampered signature that
// must be refused: a verifier that returned true unconditionally passes the
// first three arms and fails the fourth.
//
// Run from C:\FTESurf:
//   ./ftesurf64.exe -WindowStyle Minimized +exec cfg/test/p417ed.cfg
//
// PRE-REGISTERED: three `vector N: pk ok sig ok verify ok refuse ok` lines and
// `ed25519 selftest: all vectors ok`.  FALSIFIED IF any arm reads FAIL.
log_enable 1
log_dir logs
log_name p417ed
developer 0
cl_idlefps 0
cl_maxfps 100
waitms 3000
ed25519_selftest
waitms 1000
rec_pubkey
waitms 1000
quit

// RESULT (2026-09-21, ftesurf64.exe with Patch 417, post-review build):
//   ALL THREE VECTORS, ALL FOUR ARMS: `pk ok  sig ok  verify ok  refuse ok`,
//   and `ed25519 selftest: all vectors ok`.
//
//   AND THE FIRST RUN OF THIS ARM FAILED, on a defect in the ARM rather than in
//   the primitive: every vector read `sig FAIL` while pk, verify and refuse
//   passed.  The four columns were computed inside one Con_Printf argument
//   list, one of them flipping a bit of the signature for the refuse test -- and
//   C does not define the order arguments are evaluated in, so gcc ran the
//   tamper first and the signature was then compared against the vector it no
//   longer was.  Fixed by computing one result per statement, in order; a
//   selftest that reports a defect it caused itself is worse than none.
//
//   WHAT PUBLISHED VECTORS CANNOT REACH, checked separately against
//   tools/ed25519.py because no honest signature ever goes near any of them:
//     - a SMALL-ORDER public key.  A signature under one verifies for anybody
//       ([k]A is the identity whatever k is), and this game treats the key as a
//       player's IDENTITY.  A forgery was crafted with no secret at all -- pick
//       r, publish R = [r]B and s = r -- and confirmed to verify under the
//       pre-fix equation; both implementations now refuse it, and the control
//       (a real key, real signature) still verifies.
//     - a NON-CANONICAL y (y >= p), which gave one key two spellings.
//     - s >= L.  The usual three-bit test refuses only s >= 2^253, so (R, s+L)
//       verified in C and was rejected by the Python arbiter: the two
//       implementations accepted DIFFERENT SETS of signatures, invisibly.
//   40 random (seed, message) pairs, lengths 0 to 1024, still agree byte for
//   byte in both directions after all three fixes.
//
//   A THIRD IMPLEMENTATION AGREES, on the machine that will actually read these
//   files: a receipt produced by this patch's own arm was copied to the Pi and
//   verified there by BOTH tools/ed25519.py and python-cryptography 38.0.4
//   (OpenSSL 3.0.20).  Engine C signs, two unrelated verifiers accept.
