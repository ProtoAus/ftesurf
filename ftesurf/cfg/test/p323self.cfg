// Engine Patch 323 -- the mover regression gate.
//
// `pm_selftest` pins PM_PlayerMove's arithmetic with NO MAP LOADED, which is
// exactly why it is worth running beside a collision-tree change: it shares no
// input with pm_dettest's `trace` hash, so it can only fail if the patch broke
// something it had no business touching.
//
// PREDICTION: pm_selftest passes, unchanged, because Patch 323 touches the BIH
// build and nothing the mover computes.  A failure here would mean the scratch
// buffer or the recursion change corrupted the tree rather than reordering it.
cfg_save_auto 0
log_enable 1
log_dir logs
developer 0

waitms 4000
echo ================================ P323 -- mover regression gate
pm_selftest
waitms 3000
echo ================================ P323 selftest done
waitms 500
quit
