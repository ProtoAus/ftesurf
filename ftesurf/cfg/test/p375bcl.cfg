// P375BCL -- arm M of p375cl.cfg on a BUFFERED recorder (server p375bsv.cfg).
// Latent defect found by reading SV_RecRewind: save S1, save S2, load S1 (warm,
// the buffer is cut to S1's mark), run past S2's mark, load S2 -- the serial
// matches and the buffer is long enough, so S2 loaded WARM and took S1's new
// branch as its prefix.  Patch 375's lineage test sends it cold.
// PRE-REGISTERED
//   BEFORE (progs a0bccbf): the file carries no `pause`; the lines before S2's
//     `resume` are not S2's run.rec (they are S1's second attempt).
//   AFTER: a `pause ... load` before S2's `resume`, and the prefix is S2's
//     run.rec byte for byte past line 0.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p375bcl
developer 1
cl_idlefps 0
cl_maxfps 100
rate  2000000
drate 5000000
vid_fullscreen 0
waitms 6000
connect 127.0.0.1:27631
waitms 12000
set rec_terms 1
echo ^5==== M: S1, S2, load S1 (warm), past S2, load S2 (cold by lineage) ====
cmd sl_delall
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 650
cmd sl_save
waitms 150
cmd sl_save
-forward
cmd sl_prev
cmd sl_load
waitms 300
+forward
waitms 200
-forward
cmd sl_next
cmd sl_load
waitms 1000
+forward
waitms 6500
-forward
waitms 2500
cmd timer
echo ^5==== done ====
waitms 1000
quit

