// H1c -- "once you walk though it the world entities disapear, you just walk
// forward into the room and it's gone."
//
// Three arms, cheapest first, and they separate three different faults.
//
// A  STAND WHERE THE PORTAL WOULD PUT YOU, by setpos rather than by crossing.
//    portal_hub_exit's partner is portal_s1_entry at -15360 -15352 904 facing
//    +y, so you emerge on its +y side.  If the room is missing HERE, the arrival
//    position is fine and the map/PVS is what is wrong.  If the room renders
//    fine here, the fault is in the crossing itself.
//
// B  ACTUALLY WALK THROUGH IT.  Same destination, reached the way the player
//    reaches it.  Compare the world batch count against arm A: same number means
//    the crossing is innocent, a collapse means it is not.
//
// C  map_noareas 1 on the far side.  Offline analysis says the area gate at
//    mod_vbsp.c:4311 removes ZERO leafs the PVS had not already dropped at three
//    viewpoints, so this should change nothing.  It is one token and it closes
//    the question rather than leaving it as an argument.
//
// The engine prints `voidvis: cluster N ...` from Surf_VoidVisReport
// (r_surf.c:2359-2377) whenever r_viewcluster comes back -1, i.e. whenever the
// eye resolves into solid or the void.  Every one of kitsune's 18 apertures has
// SOLID 64 units behind it, so an arrival even slightly on the wrong side of the
// destination plane lands inside the wall.  If that is what is happening, this
// log will say so without any new instrumentation.

cfg_save_auto 0
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "h1_cross"
scr_sshot_type png
cl_yieldcpu 0
cl_maxfps 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0
r_speeds 2
r_voidvis 1
vbsp_portal_render 1
vbsp_portal_debug 1

waitms 2500
map surf_kitsune
waitmap 240
waitms 8000
sv_cheats 1

// ---------------------------------------------------------------- A
echo "@@@ H1c A -- hub side, before anything"
setpos 0 -640 184 0 90 0
waitms 2500
r_speeds_dump
waitms 400
screenshot_mega h1c_a_hub 1280 720
waitms 600

echo "@@@ H1c A2 -- setpos straight to the far side of the link"
setpos -15360 -15288 904 0 90 0
waitms 2500
r_speeds_dump
waitms 400
screenshot_mega h1c_a2_dest_setpos 1280 720
waitms 600

echo "@@@ H1c A3 -- 128 units further into that room"
setpos -15360 -15160 904 0 90 0
waitms 2500
r_speeds_dump
waitms 400
screenshot_mega h1c_a3_dest_inside 1280 720
waitms 600

// ---------------------------------------------------------------- B
echo "@@@ H1c B -- walk the hub portal for real"
setpos 0 -700 184 0 90 0
waitms 2000
r_speeds_dump
waitms 400
screenshot_mega h1c_b0_before 1280 720
waitms 400
+forward
waitms 1400
-forward
waitms 2000
r_speeds_dump
waitms 400
screenshot_mega h1c_b1_after 1280 720
waitms 600

echo "@@@ H1c B2 -- keep walking forward into the room"
+forward
waitms 1200
-forward
waitms 2000
r_speeds_dump
waitms 400
screenshot_mega h1c_b2_deeper 1280 720
waitms 600

// ---------------------------------------------------------------- C
echo "@@@ H1c C -- map_noareas 1, same spot"
map_noareas 1
waitms 2500
r_speeds_dump
waitms 400
screenshot_mega h1c_c_noareas 1280 720
waitms 600
map_noareas 0
waitms 1000

echo "@@@ H1c D -- r_novis 1, same spot, for the upper bound"
r_novis 1
waitms 2500
r_speeds_dump
waitms 400
screenshot_mega h1c_d_novis 1280 720
waitms 600
r_novis 0

echo "@@@ H1c DONE"
waitms 1000
quit
