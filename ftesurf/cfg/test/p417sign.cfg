// Patch 417 -- THE RUN RECEIPT, on a listen host.
//
// The route is p416nonce.cfg's, which is b352fin.cfg's: the one scripted walk
// in this tree that reaches bhop_eazy's END zone, because a receipt is signed at
// the finish and nowhere else.  The run is noclipped and therefore cheated,
// which does not matter here -- a cheated run signs exactly as a clean one does,
// and that is the point: the signature says who produced the evidence, never
// that the evidence is honest.
//
// The journal is frozen mid-run as in p416nonce.cfg, so `kept` in the receipt
// reads 1 and the .hid digest can be checked against a file that exists.  On a
// lobby today it would read 0, because Rec_HidEnd keeps a .hid only for a PB.
//
// Run from C:\FTESurf:
//   ./ftesurf64.exe -WindowStyle Minimized +exec cfg/test/p417sign.cfg
// then:
//   cat ftesurf/data/evidence/bhop_eazy/*.rcpt
//   python tools/rcptcheck.py ftesurf/data/evidence/bhop_eazy
//   sha256sum ftesurf/data/p417_S.hid
//
// PRE-REGISTERED PREDICTIONS
//  G1  a receipt appears under data/evidence/<map>/, named for the run's runid, and
//      the runid in it matches the .rec header's.
//  G2  rcptcheck.py reports the signature VALID: the public key in the file
//      verifies the signature over the five signed lines, rebuilt from the file
//      and from nothing else.
//  G3  its `signed nonce` equals the .rec header's `nonce`, and `signed ticks`
//      equals `svticks` -- the client and the server counted the same run.
//  G4  `signed hid <sha> <bytes> 1` is the SHA-256 and length of
//      data/p417_S.hid, which rcptcheck confirms by hashing the file.
//  G5  tampering with any signed line makes rcptcheck report the signature
//      INVALID (its --tamper arm, run on a copy).
// FALSIFIED IF no receipt is written, if the signature does not verify, if the
//   nonce or ticks disagree, or if a tampered copy still verifies.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p417sign
developer 1
cl_idlefps 0
cl_maxfps 100
sv_cheats 0

set rec_enable 1
set rec_stream 1
set rec_runarchive 1
set rec_hid 1

in_speedbutton 1

waitms 6000
map bhop_eazy
waitmap 45
waitms 3000

echo ================================ P417 S -- armed, not started
cmd timer
waitms 1000

echo ================================ P417 S -- aim
cmd zone_goto 0
waitms 1000
setpos -352 -352 144 0 335.3 0
waitms 1000

echo ================================ P417 S -- jump: this starts the run, and the
echo ================================ P417 S -- server issues the nonce on the same packet
+jump
waitms 700
-jump
waitms 1500
cmd timer


echo ================================ P417 S -- fly to the end zone
noclip
waitms 500
+forward
waitms 1500
cmd timer
waitms 2900
cmd timer
waitms 2000
-forward
waitms 1500

echo ================================ P417 S -- after the end zone.  Expect FINISHED.
cmd timer
waitms 2500

echo ================================ P417 S done
waitms 500
quit

// RESULT (2026-09-21, on the post-review build; the pre-review numbers are
// superseded and the differences are listed in the patch entry):
//   ALL FIVE HELD.
//   G1  data/evidence/bhop_eazy/20260921-043744-0.rcpt, beside the recordings
//       and under the same retention, named for the run's runid.
//   G2  rcptcheck.py: `signature VALID (cd480caf1e71aa8e)`, over the message
//       rebuilt from the file's own version line and its five `signed ` lines.
//   G3  `nonce agrees with the .rec (header, the one in force at the finish)`
//       and `ticks agree with the server (-1)` -- the join rcptcheck's docstring
//       promised and, until the review, did not make.
//   G4  `signed hid f8ecd07c... 1897 0`: the journal that closed AT THE FINISH,
//       1897 bytes, not kept (a non-PB run discards it).  `signed view
//       685639de...` matches data/runs/bhop_eazy/main/cheat.view exactly, 16059
//       bytes, which rcptcheck confirms by hashing the file.
//   G5  --tamper alters each of the FIVE signed lines in turn and gets
//       `invalid, as it must be` on every one.
//
//   AND THE FIRST CUT OF THIS ARM MEASURED SOMETHING ELSE ENTIRELY.  It froze
//   the journal mid-run, so at the finish there was none open -- and the receipt
//   still named a digest, because the engine handed over whichever journal had
//   closed last.  That is now p417stale.cfg's arm, with the old receipt kept as
//   its control.
