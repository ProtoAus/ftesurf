cfg_save_auto 0
// DEPLOY SMOKE for the PROGS, not a patch arm -- nothing here is graded by a tool
// and it claims no patch number.  Its one question: do the qwprogs.dat and
// csprogs.dat that build.ps1 -Pi just put on a LIVE LOBBY boot, load a map, run
// CSQC and answer a server command?
//
// WHY IT EXISTS, AND WHY IT IS SEPARATE FROM deploy491smoke.cfg.  That one asks
// about the ENGINE binary in the two local installs.  This one asks about the
// two progs on the twelve public lobbies, which is a different artifact, a
// different host and a different failure mode: `-Pi` swaps both .dat under a
// running unit and restarts it, so the things that can go wrong here are a progs
// that does not match the Pi's engine, a lobby that came back on the old pair, or
// a QC error at map init that reads to a player as "the server is broken".  An
// arm driven on this workstation cannot see any of that, because it loads the
// LOCAL .dat -- which is exactly what AGENTS.md says about an arm that passes
// saying nothing about what the owner is running.  So this is driven against a
// LOBBY, with a headless client, and it grades by presence/absence of strings
// only one cause can produce.
//
// Run headless from C:\FTESurf (the basedir is the cwd; a shell left in ftesurf/
// produces NO log at all):
//   Remove-Item ftesurf\logs\deploy496smoke.log -ErrorAction SilentlyContinue
//   Start-Process -FilePath .\ftesurf64.exe -WorkingDirectory "C:\FTESurf" `
//     -ArgumentList '-WindowStyle','Minimized','+exec','test/deploy496smoke.cfg'
//
// READ logs/deploy496smoke.log FOR, in this order:
//   "Server is using gamedir"            x1    the lobby accepted the join, so
//                                              what answers below is the Pi's
//                                              progs and not a local listen server
//   "no client game"                    x0     the Pi's csprogs.dat loaded --
//                                              a mismatch here is the whole point
//   a `tf cl` line                             the CLIENT's copy of sh_time.qc
//                                              answered, i.e. the local csprogs
//                                              is the one just built
//   "Sending stringcmd timefmt"          x2    both asks left the client
//   === END OF RUN                      x1     it reached the end and quit
//
// **AND THE `tf sv` LINE IS NOT IN THIS LOG, WHICH IS THE ONE THING THIS CFG
// COST THREE RUNS TO FIND OUT.** A lobby sets no `log_enable`, so its server
// console goes to the systemd journal and nowhere else -- and a server QC
// `print()` is Con_Printf, which reaches a CONNECTED CLIENT's log as an
// svc_print only where the qc sends it that way (`sprint`/`bprint`), not where
// it prints to its own console.  `cmd viewpos` and `cmd timer` appear here
// because SV_SaveLocStatus and SV_TimerReport answer with `sprint(self,
// PRINT_HIGH, ...)`; `timefmt` and `ent_census` answer with `print(...)`, so
// their output exists ONLY on the server.  Grade those from the lobby's side:
//   ssh proto@192.168.1.102   # or the WAN address off the home LAN
//   cd /srv/nvme/surfd && python3 -c '...'   # rcon.Rcon("127.0.0.1", 27510, pw)
//   rcon: log_name p496lobby / log_dir logs / log_enable 1     (one cvar per
//         call -- execute(["a","b"]) SETS a to "b"; AGENTS.md)
//   drive this cfg, then grep <basedir>/ftesurf/logs/p496lobby.log for "tf sv",
//   and put it back: rcon log_enable 0, and delete that log file.
//   THE LOBBY PORTS ARE 27510 and 27520..27620, from cfg/lobby/lobby<N>.cfg --
//   NOT 27698, which is the sweep server's, and NOT what build.ps1 uses.
//   `dprint` would be worse than useless here: it is Con_DPrintf, which returns
//   before formatting unless the host has `developer` or `log_developer`, and a
//   lobby has neither (measured over rcon: log_enable "0", log_developer "0").
//   sh_time.qc's Time_Print therefore uses `print`, which is builtin 339,
//   "unconditionally print on the local system's console, even in ssqc".
//
// ONE "Unknown command" IS EXPECTED AND IS NOT A DEPLOY FAULT: `ui_close`, because
// menu.dat loads LAZILY (deploy491smoke.cfg records the same, with the line
// numbers).  Nothing here takes a screenshot, so the notmenu gate is never asked.
//
// THE PORT IS A LOBBY'S, 27510 for ftesurf@1.  The fleet's twelve are 27510 and
// 27520..27620 in tens, from cfg/lobby/lobby<N>.cfg -- and NOT 27698, which is the
// sweep server's (AGENTS.md says so about hand tests; this cfg's first run proved
// it the expensive way: `Can't "cmd", not connected` four times, which reads
// exactly like a dead progs and was a dead port).
//
// RESULT 2026-10-06, on the pair deployed by `build.ps1 -Jobs 8 -Pi` from commit
// b9b150c plus its `print` correction (local qwprogs md5 24b1e51a; both files
// sha256-verified ON THE PI against the local build: 73d14674..., 9d5ed103...;
// all 12 ftesurf@ units active after the swap, and `-Pi` refused to swap until it
// had read 12 rows of 0 players).
//
//   CLIENT SIDE (logs/deploy496smoke.log): "Server is using gamedir ftesurf", no
//   "no client game", `Sending stringcmd timefmt` twice, and both `tf cl` lines
//   with Patch 496's answers (4096275 / 963300).  No `tf sv`, for the reason in
//   the header above.
//
//   LOBBY SIDE (ftesurf@1, port 27510, with log_enable 1 by rcon for the length
//   of the run and put back to 0 afterwards, its log file deleted):
//     2026-10-05 14:53:56 tf sv 273085 0.0149999997 4096275 1:08:16.275
//     2026-10-05 14:54:00 tf sv 64220 0.0149999922 963300 16:03.300
//     2026-10-05 14:54:04 ent_census: 3 unhandled classnames/inputs on surf_kitsune
//   THE PI TALKS UTC AND THIS BOX IS +10, so 14:53:56 there is 01:53:56 here and
//   the two logs describe the same run (AGENTS.md's clock note).  4096275 is
//   Patch 496's answer -- the pre-496 progs would have printed 4096276 -- and
//   `ent_census` is a pre-existing command in the same SSQC chain, so the pair
//   together say the deployed qwprogs is running and answering.
//
//   THREE FALSE READINGS THIS CFG PRODUCED BEFORE IT PRODUCED THAT, each worth
//   keeping because each looked like a different failure than it was:
//     1. port 27698 -- the sweep server, not a lobby.  Four `Can't "cmd", not
//        connected` and two `Unknown command "timefmt"`, which reads like dead
//        progs.
//     2. a fixed 20 s wait after `connect`.  The client IS connected and spawned
//        by then but the lobby is still in surf_kitsune's prop lighting and nav
//        pass, and the stringcmds land in that window and vanish with no error
//        anywhere (AGENTS.md's trap, one level earlier than usual).
//     3. grading a server `print()` from the client's log.  Nothing arrives and
//        nothing says so -- the same shape as 1 and 2, with a completely
//        different cause.  `cmd timer` beside it DID answer, which is what made
//        this diagnosable rather than another silent no-op: one control in the
//        same channel and the same second, as always.
//   `waitstring` is not a command in this engine either; its line printed
//   `Unknown command "waitstring"` and the cfg waited a fixed time instead.
exec cfg/test/_quiet.cfg

developer 1
log_developer 1
log_enable 1
log_dir logs
log_name deploy496smoke

set cl_idlefps 0
set cl_maxfps 100

waitms 2500
ui_close
waitms 500

// A real socket, not a listen server: the point is the LOBBY's progs.
connect 192.168.1.102:27510
// 20 s was NOT enough, and the failure is invisible: the log then holds no
// `Can't "cmd", not connected` and no server reply at all, because a lobby spends
// seconds on surf_kitsune's prop lighting and its nav `area N of 13` pass before
// the client is spawned, and a stringcmd sent before that vanishes with no error
// anywhere (AGENTS.md's trap, one level earlier than the usual one).  Wait for the
// SERVER's own stufftext instead of guessing: `cl_saveroot` is stuffed per player
// on spawn, so its arrival is the spawn.
waitms 12000
waitms 4000

echo ^5=== deploy smoke: the deployed server QC answers
cmd viewpos
waitms 2500
cmd timer
waitms 2500

echo ^5=== deploy smoke: the deployed server's sh_time.qc is Patch 496's
// 273085 ticks at 0.015 is 4,096,275 ms.  The pre-496 float32 chain printed
// 4096276 for exactly this case, so the integer is the version marker.
cmd timefmt 273085 0.015
waitms 4000
cmd timefmt 64220 0.0149999925
waitms 4000
// A control IN THE SAME CHAIN AND THE SAME FUNCTION as `timefmt`: if this one
// prints and timefmt does not, the lobby is running a qwprogs.dat that predates
// the branch -- which is a deploy fault, not a formatter fault.  (`viewpos`
// above is NOT that control: it lives at the end of SV_ParseClientCommand while
// timefmt lives beside timer, so a stale progs could still answer it.)
cmd ent_census
waitms 4000
// A control that MUST print, on the same channel and in the same second as the
// two above: without it, a silent `timefmt` is indistinguishable from a lobby
// whose qc never loaded.  `movebnd:` in this report is Patch 493's line, so its
// presence dates the progs too.
cmd timer
waitms 4000

echo ^5=== deploy smoke: the local client's copy agrees
timefmt 273085 0.015
waitms 1500
timefmt 64220 0.0149999925
waitms 1500

echo ^5=== END OF RUN
disconnect
waitms 1500
quit
