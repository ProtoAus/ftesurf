cfg_save_auto 0
// DEPLOY SMOKE, not a patch arm -- nothing here is graded by a tool and it claims
// no patch number.  Its only question is: does the binary build.ps1 just deployed
// to C:\FTESurf BOOT, LOAD A MAP, RUN CSQC AND ANSWER A SERVER COMMAND?
//
// WHY IT EXISTS.  Patch 491's four arms were driven on engine/release/fteqw64.exe,
// which proves the BUILD.  The deploy is a separate act: it copies the client, the
// server and the plugin into two installs and rebuilds all three progs beside them.
// A deploy can be wrong with a correct build -- locked file half-copied, plugin left
// behind at an older patch, progs out of step with the engine that loads them -- and
// every one of those reads as "the game is broken" to the owner rather than as a
// deploy fault.  This run is the check that the installed pair actually works.
//
// READ logs/deploy491smoke.log FOR, in this order:
//   "SpawnServer: surf_rookie"                  the map loaded (a listen server)
//   "CSQC: initialized"  /  no "no client game"  csprogs.dat matches this engine
//   viewpos answering with three coordinates      the server QC is alive and answering
//   timer answering                               the mod's own command table works
//   "=== END OF RUN"                              it reached the end and quit cleanly
// A crash, a missing SpawnServer, or a QC command reading "Unknown command" is a
// FAILED DEPLOY -- stop and compare the installed md5 against engine/release.
//
// RESULT 2026-10-05, on the build that carried Patches 485-491 into both installs
// (ftesurf64.exe == engine/release/fteqw64.exe == C:\FTEQuake\fteqw64.exe, all three
// md5 3e03b7557d02128c7a90fafb261af841).  rc=0, 1300 log lines, ALL FIVE MARKERS MET:
//   SpawnServer: surf_rookie  x1     map loaded
//   "no client game"          x0     csprogs.dat matched this engine
//   viewpos                          answered -4608.0 12032.0 14912.0, horizontal 0.0000
//   timer                            answered in full: "idle on surf_rookie, tick 0.015",
//                                    "class: clean (seg 0 cheat 0 cheatlatch 0)"
//   ssv                              listed ("Active servers on this cluster:") and was
//                                    NOT blocked -- Patch 491's gate left the legitimate
//                                    local path open, which is the regression it could
//                                    have caused and the reason that leg is in here
//   "Blocking insecure"       x0     nothing local tripped a gate
//   === END OF RUN            x1
// ONE "Unknown command" AND IT IS NOT A DEPLOY FAULT: it is `ui_close` at line 123,
// because menu.dat loads LAZILY and "Initializing menu.dat" lands at line 966, at
// quit -- exactly what cfg/test/_quiet.cfg's own essay says its menu_restart does NOT
// fix.  Harmless here (no screenshot is taken, so the notmenu gate is never asked),
// but it means the `ui_close` line above is decoration in this cfg and not a check.
// Nothing in this run grades a menu-VM command.

exec cfg/test/_quiet.cfg

developer 1
log_developer 1
log_enable 1
log_dir logs
log_name deploy491smoke

set cl_idlefps 0
set cl_maxfps 100

waitms 2500
ui_close
waitms 500

echo ^5=== deploy smoke: loading a map
map surf_rookie
waitms 9000

echo ^5=== deploy smoke: server QC answers
cmd viewpos
waitms 2000
cmd timer
waitms 2000

echo ^5=== deploy smoke: the deployed client still refuses a stuffed cluster command
// Leg 1 of Patch 491's gate, driven LOCALLY on purpose.  A local console is
// RESTRICT_LOCAL, so this must NOT be blocked -- it is here to prove the gate did
// not close the legitimate path, and `ssv` with no cluster prints "No node for
// index." rather than doing anything.  Blocking here would be a regression.
ssv
waitms 1500

echo ^5=== END OF RUN
waitms 500
quit
