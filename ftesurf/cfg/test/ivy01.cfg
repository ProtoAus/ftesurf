// IVY01 -- surf_monolith bonus 4, concretejungle/new-foliage/ivy03_fade.
//
// The user's shader_here at save008 reports a correct-looking shader:
//   program vmt/lightmapped + diffusemap + progblendfunc src_alpha one_minus_src_alpha
// but the material is a $translucent LightmappedGeneric whose VTF alpha channel
// is ENTIRELY 0x00 (verified offline: BGRA8888 512x512, 10 mips, file arithmetic
// exact to the byte, byte[3] min=0 max=0 across the whole top mip).
//
// So the questions this run answers, in order:
//   1. what does it actually LOOK like  (screenshot -- no amount of source
//      reading substitutes for this, and the whole point of the report is
//      "this looks wrong")
//   2. what sort does the finished shader get -- [shader] ... sort N prog P
//      passes Q bits0 0xR.  11 is SHADER_SORT_BLEND, 5 is SHADER_SORT_OPAQUE.
//      If it is 5 the alpha never applies and the ivy draws solid.
//   3. how much of what is on screen is the CUBEMAP.  vmt/lightmapped computes
//      refl = 1.0 - diffuse_f.a when there is no $bumpmap, so an all-zero alpha
//      means refl = 1.0 -- the map's cubemap added at FULL strength -- even
//      though this VMT has no $envmap at all.  hl2_envmap 0 removes that term.
//   4. where the face actually is.  hl2_translucent 0 draws $translucent world
//      materials opaque, which outlines the slab whatever its alpha says.
//
// Vantage is the user's own save008, exactly:
//   origin -8655.8340 630.3555 13256.2676  angles 1.2415 90.2966
// Wall is at y=1000 facing -Y, so this looks straight at it from 370 units.
//
// Traps observed: noclip ONCE (it is a toggle); waitms 2500 after every setpos
// because the *_here probes and the renderer both read r_refdef.vieworg, which
// is a RENDER value; every screenshot taken TWICE because the capture lands one
// step behind; `map x` twice does not reload, hence disconnect between states.

log_enable 1
log_dir "logs"
log_name "ivy01"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
con_notifylines 0
developer 1
log_developer 1

wait 200
map surf_monolith
waitmap 2400
waitms 10000

sv_cheats 1
waitms 300
noclip
waitms 500

echo ^5=== A: STOCK at the user's save008 vantage ===
setpos -8655.8340 630.3555 13256.2676 1.2415 90.2966 0
waitms 2500
screenshot ivy_a_stock_x
waitms 700
screenshot ivy_a_stock
waitms 700
shader_here ivy_stock
waitms 1200

echo ^5=== B: STOCK, backed off to see the whole slab ===
setpos -8655.8340 100.0000 13256.2676 1.2415 90.2966 0
waitms 2500
screenshot ivy_b_wide_x
waitms 700
screenshot ivy_b_wide
waitms 1200

echo ^5=== C: hl2_envmap 0 -- removes the refl term entirely ===
hl2_envmap 0
waitms 300
disconnect
waitms 1500
map surf_monolith
waitmap 2400
waitms 10000
sv_cheats 1
waitms 300
noclip
waitms 500
setpos -8655.8340 630.3555 13256.2676 1.2415 90.2966 0
waitms 2500
screenshot ivy_c_noenv_x
waitms 700
screenshot ivy_c_noenv
waitms 700
shader_here ivy_noenv
waitms 1200

echo ^5=== D: hl2_envmap 1, hl2_translucent 0 -- draw the slab OPAQUE to locate it ===
hl2_envmap 1
hl2_translucent 0
waitms 300
disconnect
waitms 1500
map surf_monolith
waitmap 2400
waitms 10000
sv_cheats 1
waitms 300
noclip
waitms 500
setpos -8655.8340 630.3555 13256.2676 1.2415 90.2966 0
waitms 2500
screenshot ivy_d_opaque_x
waitms 700
screenshot ivy_d_opaque
waitms 1200

echo ^5=== ivy01 done ===
hl2_translucent 1
wait 30
quit
