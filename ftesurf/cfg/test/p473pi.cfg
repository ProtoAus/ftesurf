// ===========================================================================
//  P473PI -- the post-deploy connect check for the 2026-10-03 deploy
//  (Patches 467, 469-473; qwprogs 9a4b1ef2a2c31f28, csprogs 680143ff276edab3).
//    ftesurf64.exe -WindowStyle Minimized +exec cfg/test/p473pi.cfg
//    (cwd C:\FTESurf; log ftesurf/logs/p473pi.log.  27540 is lobby 4.)
//
//  The host was read first (hashes, 12 units active, run_rearmhop 0 by rcon).
//  This adds what only a client can show: the lobby accepts this install's
//  csprogs -- byte-identical to the deployed one, so no download is expected --
//  and CSQC loads and runs with no fault.
//
//  PASS: `FTESurf CSQC loaded`; `cmd viewpos` prints its `velocity ...
//  horizontal` line (the server progs answer); `replay status` answers (CSQC
//  is alive); zero `Unknown command`; zero QC stack frames (`<file>.qc:<n>:`).
//
//  RESULT (2026-10-03 12:58 AEST, lobby 4 on bhop_eazy): PASS.  CSQC loaded 1,
//  viewpos velocity line 1, replay status 1, Unknown command 0, QC frames 0.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p473pi
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
wait 600
connect 192.168.1.102:27540
waitms 22000
echo === p473pi handles
cmd viewpos
waitms 800
replay status
waitms 800
echo === p473pi done
quit
