// BUILD 26 stage 1 -- the final regression pass, against the deployed progs.
//
// The replay panel is the part that cannot be read off a log: it is drawn.  What
// a config CAN prove is that every value it formats is reachable and that the
// panel does not fault -- so hud_watch_info goes to 1 with a replay up, the
// frame runs, and `replay status` prints the console half of the same numbers.
// Watch_RunDate in particular slices a header string and would fault loudly on a
// short one; the fixture below is a real run with a real runid.

developer 1
log_developer 1
cfg_save_auto 0

wait 200
map surf_aesthetic
waitmap 90

echo ""
echo "=== the cvars, with their (default) annotations ==="
hud_watch_info
hud_energy_ref
rec_savelock
con_textsize
wait 5
echo ""

echo "=== the replay, with the detail panel UP ==="
hud_watch_info 1
wait 3
replay data/runs/surf_aesthetic/main/0005471_pb.rec
wait 40
replay status
wait 6
echo ""

echo "=== scrub to the middle: the playhead has somewhere to be ==="
replay seek 41
wait 30
replay status
wait 6
echo ""

echo "=== and to the end ==="
replay seek end
wait 20
replay status
wait 6
replay stop
wait 10
echo ""

echo "=== the save-lock commands, and a retry across the cold path ==="
cmd zone_goto 0
wait 20
cmd sl_save
wait 20
cmd sl_list
wait 6
echo ""

echo "=== selftests ==="
pm_selftest
wait 10
zone_selftest
wait 10
echo ""

echo "=== b26f done ==="
wait 20
quit
