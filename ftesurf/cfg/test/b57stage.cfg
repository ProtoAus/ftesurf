// cfg_save_auto 0 FIRST: this run sets archived cvars (cl_maxfps, vid_*, sv_port)
// and must never write them into ftesurf.cfg (cl_main.c:2535).
cfg_save_auto 0

// ===========================================================================
//  B57STAGE -- stage 1 is a leg of its own, and zone_goto does not lie about it.
//
//  WHAT BUILD 57 CHANGED.  Builds 23-56 keyed a run by the 0-based SEGMENT it
//  started in, so segment 0 meant "the full run" and Momentum's stage 1 -- which
//  also starts at the map's START -- had no key of its own.  It could not be run
//  with `!s 1`, it was never written, and the scoreboard showed one stage too
//  few.  Build 57 separates the two numbers: a SEGMENT is still 0-based, a LEG is
//  0 for the full run and k for stage k.
//
//  THE FOUR THINGS THIS FILE PROVES, none of which a screenshot could:
//
//    A  a FULL run crossing into segment 1 closes stage 1 -- leg 1, at the
//       stage-2 boundary, which is where Momentum records it (mom_player.cpp).
//    B  `!s 1` arms a STAGE-1 run: it stops at segment 1 and reports RUNLEG 2
//       (track * 100 + leg + 1 = 0*100 + 1 + 1).
//    C  zone_goto CLEARS a standing `!s 1`.  This one falsifies a fix made for
//       this very harness: SV_TimerArm honours run_t_wantstage1 on any track-0
//       START of a staged track and cannot tell which route reached it, so
//       before the fix `!s 1` followed by zone_goto armed a stage-1 run while
//       this script believed it had asked for the full run -- a harness lying to
//       its own author.  If C fails, A is not trustworthy either.
//    D  `!r` inside a stage-1 run restarts the STAGE, not the map.
//
//  ...and one client-side check, E: the `cl lobby:` line, whose `mine` field is
//  the gate deciding whether a lobby time may ever be written to this disk.
//
//  WHY bhop_eazy.  A config cannot surf.  This map has its zones on ONE PLANE --
//  every quad z 64..224, centre z 144 -- so the route is a pure yaw with no pitch
//  and no geometry in the way once noclip is on.  Measured with zone_list, not
//  guessed (b43stage.cfg, whose recipe this follows):
//
//      0  start   trk 0 seg 0   centre  -352  -352  144
//      1  stage   trk 0 seg 1   centre  2624   512  144
//      4  end     trk 0 seg 4   centre  2640 -1728  144
//
//      start -> stage 1   yaw  16.18   dist 3099
//      stage 1 -> end     yaw -66.46   dist 2103
//
//  NOCLIP MAKES EVERY RUN PRACTICE, AND THAT IS FINE HERE.  Under test is the
//  LEG MACHINE -- which leg armed, which leg closed, what RUNLEG says -- and none
//  of that consults the taint.  It does mean no personal best can move and
//  nothing is written into data/runs that was not already practice, which is
//  deliberate: this map's stage times belong to the user.
//
//  READ THE TRACE BY THE STRINGCMD ORDER, NOT BY THE ECHOES.  A local `echo` runs
//  in the client console immediately while `cmd timer` is queued and sent on the
//  next outgoing packet, so echoes drift AHEAD of the replies by about one block.
//  `cmd viewpos` is itself a stringcmd, so it stays in order with `cmd timer` and
//  is the marker to read.
//
//  `timer` (no `cmd`) IS A DIFFERENT COMMAND from `cmd timer`: the first is the
//  CSQC console command, which prints the cl stats/results/lobby lines and then
//  forwards to the server; the second asks only the server.  Check E needs the
//  first, everything else wants the second.
//
//  PORT 27600, NOT 27500.  A test that binds the default port silently joins or
//  blocks Lex's own game, and 27510-27550 are the public lobbies.
// ===========================================================================

log_enable 1
log_dir "logs"
log_name "b57stage"
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
sv_cheats 1
fs_missingwarn 0
con_notifylines 0
sv_port 27600

wait 200
echo ^5=== b57stage: bhop_eazy, build 57 ===
map bhop_eazy
waitmap 1800
waitms 2500

// The zone table as THIS build reads it, so every expectation below can be
// checked against the map rather than against this file's header.
//
// `zone_list` WITHOUT `cmd`: it is a CLIENT command (cl_zones.qc:547 registers
// it), and the server has no such user command -- `cmd zone_list` answers
// "Bad user command: zone_list" and prints no table at all, which is what the
// first run of this file did.
echo ^5=== b57stage: the zone table ===
zone_list
waitms 600

// ---------------------------------------------------------------------------
//  A. A FULL RUN RECORDS STAGE 1 AT THE STAGE-2 BOUNDARY.
//
//  Arm at the START with no request standing.  EXPECT on the first report:
//  stagerun 0 and the leg rule naming the full run.  Then fly across segment 1's
//  boundary: EXPECT a stage close for LEG 1 -- not leg 0, and not "refused: seg
//  <= 0", which is what every build before 57 said here.
// ---------------------------------------------------------------------------
echo ^5=== b57stage A: full run armed at the start -- expect stagerun 0 ===
noclip
cmd zone_goto 0 16.18 0
waitms 700
cmd viewpos
cmd timer

echo ^5=== b57stage A: flying start -> stage 1 boundary ===
+forward
waitms 1000
echo ^5--- a1 ---
cmd viewpos
cmd timer
waitms 1000
echo ^5--- a2 ---
cmd viewpos
cmd timer
waitms 1000
echo ^5--- a3 ---
cmd viewpos
cmd timer
waitms 1000
echo ^5--- a4 ---
cmd viewpos
cmd timer
waitms 1000
echo ^5--- a5 ---
cmd viewpos
cmd timer
waitms 1200
-forward
waitms 400
echo ^5=== b57stage A: across it -- expect a close for LEG 1 ===
cmd viewpos
cmd timer

// ---------------------------------------------------------------------------
//  C BEFORE B, DELIBERATELY.  C is what makes B readable: if zone_goto did not
//  clear the request, B's "stage-1 run" could equally be A's full run mislabelled,
//  and this script could not tell the difference.  Falsify the harness first.
//
//  `!s 1` sets the request; zone_goto then moves and arms.  EXPECT stagerun 0 --
//  the full run -- because the move was not a chat command.
// ---------------------------------------------------------------------------
echo ^5=== b57stage C: !s 1 then zone_goto -- expect the request CLEARED, stagerun 0 ===
say !s 1
waitms 600
cmd zone_goto 0 16.18 0
waitms 800
cmd viewpos
cmd timer

// ---------------------------------------------------------------------------
//  B. `!s 1` ARMS A STAGE-1 RUN.
//
//  The chat command moves AND arms, so no zone_goto here -- that is the whole
//  point of C.  EXPECT: stagerun 1, leg 1.  Then fly to segment 1: the run
//  FINISHES there (a stage run ends at the next stage) and pend-arms stage 2.
//  EXPECT RUNLEG 2 on the finish.
// ---------------------------------------------------------------------------
echo ^5=== b57stage B: !s 1 -- expect stagerun 1, leg 1 ===
say !s 1
waitms 900
cmd viewpos
cmd timer

// RE-AIM AFTER THE CHAT COMMAND.  `!s 1` teleports to the START but sets no
// heading -- it leaves the view wherever the previous step pointed it, which on
// the first run of this file was the END heading from step C, so the flight went
// to 760 -1728 and never touched segment 1.  The report still read stagerun 1,
// so the check LOOKED armed and simply proved nothing about the finish.
// setpos carries the yaw, and the run survives it: build 24 made setpos mark
// practice rather than void, and this run is practice already.
setpos -352 -352 144 0 16.18 0
waitms 600
cmd viewpos
cmd timer

echo ^5=== b57stage B: flying stage 1 -> its end at segment 1 ===
+forward
waitms 1000
echo ^5--- b1 ---
cmd viewpos
cmd timer
waitms 1000
echo ^5--- b2 ---
cmd viewpos
cmd timer
waitms 1000
echo ^5--- b3 ---
cmd viewpos
cmd timer
waitms 1000
echo ^5--- b4 ---
cmd viewpos
cmd timer
waitms 1200
-forward
waitms 400
echo ^5=== b57stage B: finished -- expect RUNLEG 2 and a stage-2 pend-arm ===
cmd viewpos
cmd timer

// ---------------------------------------------------------------------------
//  D. `!r` INSIDE A STAGE-1 RUN RESTARTS THE STAGE, NOT THE MAP.
//
//  `!s 1` again, then `!r`.  Both land on the same zone -- the map's START -- so
//  the ONLY thing that distinguishes them is the request, which is exactly what
//  build 57 added.  EXPECT stagerun 1 after the restart, and the chat line to say
//  "stage 1" rather than "start of the map".
// ---------------------------------------------------------------------------
echo ^5=== b57stage D: !s 1 then !r -- expect stagerun 1, "stage 1" ===
say !s 1
waitms 900
say !r
waitms 900
cmd viewpos
cmd timer

// ...and the control for D: `!m` must put it back to the full run.
echo ^5=== b57stage D control: !m -- expect stagerun 0 ===
say !m
waitms 900
cmd viewpos
cmd timer

// ---------------------------------------------------------------------------
//  E. THE CLIENT'S OWN VIEW, including the ownership gate.
//
//  `timer` without `cmd` runs the CSQC handler.  EXPECT on a listen server:
//    cl lobby: stat 0 (lobby 0 nopb 0 norec 0)
//    cl lobby: mine 1 (localent 1 localnum 0) ...
//  `mine 1` is the gate that decides whether a lobby time may be written to this
//  disk at all, and localent == localnum + 1 is the identity it is derived from.
//  Its other half -- mine 0 while tracking another player -- needs a second
//  client and belongs to the lobby test, not here.
//
//  Also EXPECT `cl results: ... leg N ... toast leg N`: build 57 renamed both
//  labels, because a diagnostic that calls a leg a segment reads a correct
//  stage-1 result as off by one.
// ---------------------------------------------------------------------------
echo ^5=== b57stage E: the client lines -- expect mine 1, and legs named "leg" ===
timer
waitms 900

echo ^5=== b57stage: done ===
waitms 400
quit
