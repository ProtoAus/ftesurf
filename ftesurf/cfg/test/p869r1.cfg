// Patch 869 review round 1 arm, listen server, through tools/runlines_smoke.py:
//   python tools/runlines_smoke.py ftesurf/cfg/test/p869r1.cfg --mount --timeout 500 \
//     --ssqc <qwprogs> --csqc <csprogs> --mqc <menu> --output-dir <task root>/artifacts
// Controls: A = the P865 branch (no P869: the triggers inert and KEPT), B = P869 before review.
//   N "lump: last edict #n" on each map equals A's (B stashed and freed the brush triggers:
//     smaller by their count).
//   U bhop_offstyles, dropped into *121 (forward key): one "key 0 pressed", one "released".
//   Z surf_4plar: `!r` in the START (inside progress *7, never left) makes the zone the
//     progress trigger; teleport_progress *8 then goes to the START's destination, not *7's
//     middle (-13056 13824 15424).  B: nothing.
// Not here: the two hold slots -- the library's one overlapping pair (bhop_lego2 *191/*193)
// overlaps in mid-air, where no body stays the 0.5 s hold.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name runlines_smoke
con_notifytime 0
cl_idlefps 0
cl_maxfps 100
vid_vsync 0
vid_fullscreen 0
vid_width 1280
vid_height 720
sv_public 0
set run_resume 0
developer 1
log_developer 1
waitms 1500

map bhop_mom_training_beta
waitmap 120
waitms 6000
menu_restart
ui_close
waitms 500
echo ==== N numbering ====
waitms 300

map bhop_offstyles
waitmap 120
waitms 6000
echo ==== U userinput ====
setpos 4608 -8704 -10368 0 0 0
waitms 1500
cmd viewpos
waitms 300
+forward
waitms 400
-forward
waitms 600

map surf_4plar
waitmap 120
waitms 6000
echo ==== Z zone fallback ====
say !r
waitms 1000
setpos -13184 12672 15936 0 0 0
waitms 1500
cmd viewpos
waitms 300
echo RUNLINES COMPLETE
quit
