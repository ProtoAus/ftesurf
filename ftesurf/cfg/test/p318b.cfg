cfg_save_auto 0
// P318B -- FIXED arm (hl2_brushbevels 1): the missing edge bevels are generated
// at load, using VBSP's own algorithm.  p318a.cfg is this file with the cvar at 0.
//
// THE QUESTION.  BIH_ClipBoxToBrush sweeps the player's box against a convex
// brush using the brush's own side planes plus a runtime AXIAL block.  The
// Minkowski sum of a box and a polytope also needs one plane per pairing of a
// brush EDGE with a box axis, and those have never existed on this path.  Q2
// and Source add them at compile time (VBSP's AddBrushBevels); surf_boreas
// brush 170 -- the PLAYERCLIP wedge at the foot of the lock-11 ramp -- shipped
// without them.
//
// PRE-REGISTERED, from an exact separating-axis test over that brush's 38 hull
// vertices against the 32x32x62 player box.  Five points along the ramp, each
// 2 units above the surface the prop holds the player on:
//
//   x+y     engine face-only test      exact geometry      so `stuck` says
//   -1679        -0.107  (inside)        +10.5 clear        startsolid 1 -> 0
//   -1674        -3.643  (inside)         +8.3 clear        startsolid 1 -> 0
//   -1670        -4.374  (inside)         +6.5 clear        startsolid 1 -> 0
//   -1665        -4.451  (inside)         +4.3 clear        startsolid 1 -> 0
//   -1660        -4.528  (inside)         +2.0 clear        startsolid 1 -> 0
//
// So arm A should report startsolid 1 at all five and arm B startsolid 0 at all
// five.  If A reports 0 anywhere the phantom is not where the model says and
// nothing below means anything.  If B reports 1 anywhere the bevels did not
// reach that brush -- check the "brush edge bevels generated" line first.
//
// The player is 2 units ABOVE the ramp on purpose: the binding plane in arm A
// is side 1509, whose normal has z of zero, so the lift does not weaken the
// phantom, but it does take the prop's own hull out of the answer.
log_enable 1
log_dir "logs"
log_name "p318b"
cl_idlefps 0
vid_fullscreen 0
con_notifylines 0

hl2_propcollision 1
hl2_phywinding 1
hl2_brushbevels 1

wait 200
map surf_boreas
waitmap 600
waitms 12000
sv_cheats 1
waitms 500

echo ^5=== P318B: the census line from map load is above.  With the cvar at 0 it
echo ^5=== must be ABSENT.  Arm B must print it with a non-zero brush count.
cmd run_rulesetinfo
waitms 300

noclip
waitms 400

echo ^5=== P318B: x+y -1679 (engine says 0.107 inside, exact says 10.5 clear)
setpos 11494.45 -13173.45 2577.88 90 41.64 0
waitms 600
cmd stuck
waitms 800

echo ^5=== P318B: x+y -1674 (engine 3.643 inside, exact 8.3 clear)
setpos 11496.95 -13170.95 2577.76 90 41.64 0
waitms 600
cmd stuck
waitms 800

echo ^5=== P318B: x+y -1670 (engine 4.374 inside, exact 6.5 clear)
setpos 11498.95 -13168.95 2577.66 90 41.64 0
waitms 600
cmd stuck
waitms 800

echo ^5=== P318B: x+y -1665 (engine 4.451 inside, exact 4.3 clear)
setpos 11501.45 -13166.45 2577.54 90 41.64 0
waitms 600
cmd stuck
waitms 800

echo ^5=== P318B: x+y -1660 (engine 4.528 inside, exact 2.0 clear)
setpos 11503.95 -13163.95 2577.42 90 41.64 0
waitms 600
cmd stuck
waitms 800

echo ^5=== P318B: CONTROL -- deep inside the same brush, must stay startsolid in
echo ^5=== BOTH arms.  A bevel that opens a hole here is the failure to fear.
setpos 12251.4 -12540.9 2500.0 90 41.64 0
waitms 600
cmd stuck
waitms 800

echo ^5=== P318B: CONTROL -- on the spawn deck, must be identical in both arms
setpos 12788.09 -11827.59 14736.03 90 82.15 0
waitms 600
cmd run_eyeinfo
waitms 600
cmd stuck
waitms 800

echo ^5=== P318B DONE ===
wait 60
quit
