// SEAM06 -- surf_demise vantage C again, this time with the animation stopped.
//
// FOUR RUNS, THREE DIFFERENT WAYS TO MEASURE NOTHING.  Worth writing down,
// because each failure looked like a result:
//
//   seam01  surf_demise, no noise floor at 2 of 3 vantages.  Every toggle 70%.
//   seam02  surf_demise, floor taken at last: 72.82% between two IDENTICAL
//           states.  elly/animated_smoke_skybox carries #SCROLL and covered the
//           frame, so nothing was measurable and the 70%s were all floor.
//   seam03  surf_outra + slowmo 0.  Floor fell to 0.01% -- the method works --
//           but the camera was aimed at the centroid of the displacement's
//           BOUNDING BOX, which is inside the terrain, and shader_here reported
//           an ordinary brick wall. Nothing under test was in frame.
//   seam04  surf_outra, aimed properly at a displaced vertex.  shader_here
//           confirmed a real blend material this time, and every toggle still sat
//           at the floor -- because surf_outra is a dark cave and the screenshot
//           is BLACK apart from a few yellow markers.  A clean floor and a clean
//           aim, and still no measurement.
//
// So this run: the surf_demise vantage that was already known to be lit and
// looking at terrain (seam01/seam02 vantage C), plus slowmo 0 to stop the smoke
// that made it unmeasurable.  That is the smallest change that fixes the one
// known defect while keeping the two properties that were already right.
//
// The analysis reports MEAN LUMINANCE for every shot alongside the diff, so a
// black or blown-out frame is visible in the numbers instead of having to be
// noticed by eye afterwards.

log_enable 1
log_dir "logs"
log_name "seam06"
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 0
vid_fullscreen 0
developer 1
log_developer 1
con_notifytime 0
con_notifylines 0
con_notifytime_error 0

wait 200

hl2_seamless 1
hl2_bumpmap2 1
map surf_demise
waitmap 1800
waitms 12000
sv_cheats 1
waitms 400
noclip
waitms 400
slowmo 0
waitms 1200

setpos 938.8 -1264.1 13407.1 35.00 45.00 0
waitms 3000
developer 1
shader_here seam06
light_here seam06
waitms 600
developer 0
waitms 2000

echo ^5---------- NOISE FLOOR ------------------------------------------------
screenshot seam06_floor1
waitms 4000
screenshot seam06_floor2
waitms 900

echo ^5---------- hl2_seamless 0 ---------------------------------------------
hl2_seamless 0
waitms 4000
screenshot seam06_seam_off
waitms 900
developer 1
shader_here seam06_off
waitms 600
developer 0
waitms 1500

echo ^5---------- hl2_seamless 1 ---------------------------------------------
hl2_seamless 1
waitms 4000
screenshot seam06_seam_on
waitms 900

echo ^5---------- hl2_bumpmap2 0 ---------------------------------------------
hl2_bumpmap2 0
waitms 4000
screenshot seam06_bump_off
waitms 900
hl2_bumpmap2 1
waitms 4000
screenshot seam06_bump_on
waitms 900

echo ^5=== seam06 done ===
wait 30
quit
