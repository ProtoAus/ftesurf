// TINT01 -- BASELINE. What do the broken surfaces actually look like?
//
// Everything in the plan's diagnosis is STATIC READING of mat_vmt.c and the
// GLSL.  Nothing has been looked at.  This run exists to look, before a line
// is changed, at the exact three places the user left save-locks.
//
// bhop_futile contains ZERO sprite/decal ENTITIES -- censused from its own
// LZMA-decompressed entity lump: 330 entities, 105 light, 98 trigger_teleport,
// 51 func_illusionary, 35 trigger_multiple, 29 filter_activator_name and
// nothing else.  So whatever is tinted is a BRUSH FACE.  18 of the map's 68
// world textures are DECALS/*, CS_ASSAULT/* and DE_TRAIN/DECALGRAFFITI*, and
// all 14 of the packed decal VMTs are the same shape:
//
//     LightmappedGeneric { $vertexcolor 1 $vertexalpha 1 $translucent 1
//                          $basetexture "Decals/xxx" $decal 1 $decalscale .25 }
//
// THE PREDICTION UNDER TEST.  mat_vmt.c:1736 routes on `st->decal` BEFORE it
// checks the material type, so every one of those compiles to
// `program vmt/vertexlit` -- and vertexlit.glsl:199 finishes with
//
//     diffuse_f.rgb *= light.rgb * e_colourident.rgb;
//
// where light.rgb is e_light_ambient + dot(n,e_light_dir)*e_light_mul, the
// MODEL lighting uniforms, on a world brush face that has a real lightmap.
// If that is right, these read as flat-tinted rectangles rather than as decals
// sitting in the wall's own light.  If it is wrong, the plan's Stage A changes.
//
// developer 1 is set BEFORE the map so the per-material diagnostics are caught:
//   [vmt]    <name>: alpha .. translucent .. additive .. blendfunc ..
//   [shader] <name> sort N prog P passes N bits0 0x..     (11 = BLEND, 5 = OPAQUE)
// It costs ~50 s of load on a VBSP map and is turned off again before the
// screenshots so the console is not sitting over them.
//
// POSITIONING.  `sl_goto` is not reachable from a config -- it is a pure
// client command handled in SV_ParseClientCommand (sv_player.qc:509) and the
// CSQC registers only saveloc/timer/viewpos/saveloc_menu (cl_saveloc.qc:179-196),
// so the console reports `Unknown command "sl_goto"` and the shot is taken at
// spawn.  That is how the first attempt at this file produced three screenshots
// of the same wrong place.
//
// So: setpos, with the origin AND angles read out of each save-lock's own
// state.txt.  Patch 165 made it take `pitch yaw roll` and write .v_angle as
// well as .angles, so it can actually aim; and it forces MOVETYPE_NOCLIP
// (sv_user.c:5591-5595), which here is wanted -- these are wall-facing shots
// and a falling player would photograph the floor.

log_enable 1
log_dir "logs"
log_name "tint01"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
sv_cheats 1

developer 1

wait 200
echo ^5=== tint01: bhop_futile baseline, save-locks 5/6/7 ===

map bhop_futile
waitmap 900
waitms 3000

echo ^5--- what this map still does not handle ---
ent_census
waitms 800

// Console off the screen for the captures.
developer 0
con_clear
waitms 400

echo ^5--- save005 ---
setpos 5482.3599 2014.7155 9158.1182 -0.1978 -0.4285 0
wait 150
setpos
waitms 600
screenshot tint01_futile_s5
waitms 1200

echo ^5--- save006 ---
setpos 5592.3066 5815.3398 7559.6045 0.1758 88.5168 0
wait 150
setpos
waitms 600
screenshot tint01_futile_s6
waitms 1200

echo ^5--- save007 ---
setpos 540.3427 4427.8555 7510.5981 11.9092 143.9758 0
wait 150
setpos
waitms 600
screenshot tint01_futile_s7
waitms 1200

echo ^5=== tint01 done ===
wait 30
quit
