// V266A -- verify Patch 266 on the build that has it.
//
// Resolution is forced to 1920x1200 because the pre-266 baseline at save011
// (screenshots/v265a_d_011_noslab.png) is 1920x1200 and the last run in this
// gamedir was 1280x800.  A mismatched pair is not a measurement.
//
// PART A (gl_shader.c: progblendfunc no longer redirected off pass 0).
//   The instrument is the log, not the pixels.  During load, look for
//
//     [shader] project_tendies/models/ice_transparent.vmt  sort .. prog 0 passes 6 bits0 0x.....
//
//   BEFORE: sort  5 ... bits0 0x10000   (DEPTHWRITE alone -- no blend)
//   AFTER : sort 11 ... bits0 0x10065   (DEPTHWRITE|ONE_MINUS_SRC_ALPHA|SRC_ALPHA)
//   prog and passes do NOT change -- they come from the pass-level program and
//   were never the defect.  The world twin
//   maps/surf_boreas/.../ice_transparent_13140_-9344_13440 must stay at
//   sort 11 prog 1 passes 1 bits0 0x10065, i.e. unchanged, since it never took
//   the redirect.
//
//   A  save011, the ramp vantage -- ice panes must become translucent.
//      Compared against v265a_d_011_noslab.png, same origin/angles/res.
//
// PART B (gl_backend.c: fixed-function fog for program-less shaders).
//   project_tendies/cloods is UnlitGeneric -> a pass, no program -> unreachable
//   by PERMUTATION_FOG.  surf_boreas is fogmaxdensity 1, so this case is exact.
//
//   The cloods faces are two horizontal displacements in the 3D skybox room, so
//   they are overhead: the vantage has to look UP, which no existing save-lock
//   does.  B1/B2/B3 sweep three pitches and shader_here each one, so the run
//   identifies its own vantage instead of me guessing at it.  Then each is shot
//   twice, r_fog_progless 1 and 0, which is the falsifier: 0 must reproduce the
//   pre-patch picture exactly and 1 must not.
//
//   The control is in the same frame.  The WorldVertexTransition skybox terrain
//   shares that room and already fogs (it has a program), so it must be
//   IDENTICAL between the two shots.  If the whole frame changes, this is
//   double-fogging and the patch is wrong.
//
// NOISE FLOOR first, as always -- two shots of the same state.  It was 0 px at
// save011 for Patch 265, but that was a different build and it gets re-measured.
//
// Probes trace from r_refdef.vieworg, a RENDER value, so every setpos needs a
// drawn frame after it (2500ms).  Screenshots capture one frame behind, hence
// the throwaway shot before each real one.

log_enable 1
log_dir "logs"
log_name "v266a"
developer 1
log_developer 1
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 0
vid_fullscreen 0
con_notifytime 0
con_notifylines 0
con_notifytime_error 0

vid_width 1920
vid_height 1200
vid_restart
waitms 4000

wait 200
echo ^5=== v266a: Patch 266 verification ===

map surf_boreas
waitmap 1800
waitms 9000
sv_cheats 1
waitms 300
noclip
waitms 300
r_fog_progless 1
waitms 300
developer 0
waitms 300

echo ^5========== NOISE FLOOR: save011, same state twice ==========
setpos 13826.6 -2739.2 12105.6 16.3367 163.2788 0
waitms 2500
screenshot v266a_x
waitms 800
screenshot v266a_n1_011
waitms 800
screenshot v266a_n2_011
waitms 800

echo ^5========== A: save011 -- the ramp ice panes, must now blend ==========
screenshot v266a_x
waitms 800
screenshot v266a_a_011_blend
waitms 800

echo ^5---------- A probe ----------
developer 1
waitms 300
shader_here p266_011
waitms 1000
developer 0
waitms 300

echo ^5========== B1: save009 origin, looking UP 25deg ==========
setpos 10229.4 5262.8 14725.9 -25 139.3616 0
waitms 2500
developer 1
waitms 300
shader_here p266_sky_up25
waitms 1000
developer 0
waitms 300
screenshot v266a_x
waitms 800
screenshot v266a_b1_up25_fog1
waitms 800
r_fog_progless 0
waitms 2000
screenshot v266a_x
waitms 800
screenshot v266a_b1_up25_fog0
waitms 800
r_fog_progless 1
waitms 1500

echo ^5========== B2: same origin, looking UP 50deg ==========
setpos 10229.4 5262.8 14725.9 -50 139.3616 0
waitms 2500
developer 1
waitms 300
shader_here p266_sky_up50
waitms 1000
developer 0
waitms 300
screenshot v266a_x
waitms 800
screenshot v266a_b2_up50_fog1
waitms 800
r_fog_progless 0
waitms 2000
screenshot v266a_x
waitms 800
screenshot v266a_b2_up50_fog0
waitms 800
r_fog_progless 1
waitms 1500

echo ^5========== B3: same origin, looking UP 10deg, other yaw ==========
setpos 10229.4 5262.8 14725.9 -10 320 0
waitms 2500
developer 1
waitms 300
shader_here p266_sky_up10
waitms 1000
developer 0
waitms 300
screenshot v266a_x
waitms 800
screenshot v266a_b3_up10_fog1
waitms 800
r_fog_progless 0
waitms 2000
screenshot v266a_x
waitms 800
screenshot v266a_b3_up10_fog0
waitms 800
r_fog_progless 1
waitms 1500

echo ^5=== v266a done ===
wait 30
quit
