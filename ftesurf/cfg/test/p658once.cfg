// cfg_save_auto 0: this run sets archived cvars; never let it write them into ftesurf.cfg
cfg_save_auto 0
// p658once -- the engine draws a blended particle ONCE a frame, and no fainter (engine Patch 658).
// tools/p658once.py drives and grades it, and writes the one file it needs beside this
// (scripts/p658once.shader: `p658plain`, the engine's own default particle shader text WITHOUT
// the 658 permutation, still `sort unlitdecal`).
//
// Six dots that stand still 150 units in front of a wall photographed bare first, each ONE
// particle of an effect defined here (emit_test spawns it 24 under the eye; orgbias puts it on
// the wall).  A dot drawn `blend blendalpha` leaves (1 - a) of the wall per draw.
//   T  the engine's default shader, black, alpha 0.5      U  the same at alpha 0.2
//   P  p658plain, black, alpha 0.5: (1 - a) drawn once, (1 - a)^2 drawn twice
//   G  the default shader, grey 128, alpha 0.5            H  black at alpha 1.6
//   M  `blend invmodc`, grey 128: leaves (1 - c) per draw
// Before 658 the bucket was drawn twice.  After it P is ONE draw, and the others still read
// what two draws left: the default shaders' permutation writes a * (2 - a), or c * (2 - c).
log_dir "logs"
log_name "p658once"
log_enable 1
developer 1
log_developer 1
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000
cl_maxfps 100
cl_idlefps 0
sv_cheats 1
r_bloom 0
con_notifylines 0
scr_sshot_type png
fov 90
wait 200
map surf_dune
waitmap 600
waitms 2000
menu_restart
ui_close
set hud_speed 0
set hud_energy 0
set hud_keys 0
noclip
setpos 11720 10376 13112 0 90 0
set vbsp_emit_dust 0
r_part ftesurf_p658t
{
	texture "ftesurf_dot"
	blend blendalpha
	scalefactor 1
	scale 16
	rgb 0 0 0
	alpha 0.5
	alphadelta 0
	die 8
	count 1
	veladd 0
	gravity 0
	spawnmode box
	spawnorg 0 0
	orgbias -40 150 48
}
r_part ftesurf_p658u
{
	texture "ftesurf_dot"
	blend blendalpha
	scalefactor 1
	scale 16
	rgb 0 0 0
	alpha 0.2
	alphadelta 0
	die 8
	count 1
	veladd 0
	gravity 0
	spawnmode box
	spawnorg 0 0
	orgbias 0 150 48
}
r_part ftesurf_p658p
{
	texture "p658plain"
	blend blendalpha
	scalefactor 1
	scale 16
	rgb 0 0 0
	alpha 0.5
	alphadelta 0
	die 8
	count 1
	veladd 0
	gravity 0
	spawnmode box
	spawnorg 0 0
	orgbias 40 150 48
}
r_part ftesurf_p658g
{
	texture "ftesurf_dot"
	blend blendalpha
	scalefactor 1
	scale 16
	rgb 128 128 128
	alpha 0.5
	alphadelta 0
	die 8
	count 1
	veladd 0
	gravity 0
	spawnmode box
	spawnorg 0 0
	orgbias -40 150 33
}
r_part ftesurf_p658h
{
	texture "ftesurf_dot"
	blend blendalpha
	scalefactor 1
	scale 16
	rgb 0 0 0
	alpha 1.6
	alphadelta 0
	die 8
	count 1
	veladd 0
	gravity 0
	spawnmode box
	spawnorg 0 0
	orgbias 0 150 33
}
r_part ftesurf_p658m
{
	texture "ftesurf_dot"
	blend invmodc
	scalefactor 1
	scale 16
	rgb 128 128 128
	alpha 1
	alphadelta 0
	die 8
	count 1
	veladd 0
	gravity 0
	spawnmode box
	spawnorg 0 0
	orgbias 40 150 33
}
waitms 6000
echo ^5=== B bare
r_partinfo
screenshot p658once_b0
waitms 800
echo ^5=== D dots
emit_test p658t 1
emit_test p658u 1
emit_test p658p 1
emit_test p658g 1
emit_test p658h 1
emit_test p658m 1
waitms 1500
r_partinfo
screenshot p658once_b1
waitms 800
echo RIGDONE
quit
