// Patch 335, ARM B server -- a REAL dedicated server on a REAL socket, so the
// client under test is not a listen client and the prediction hook is not
// gated off.  Launched from the harness as:
//
//   ./ftesurf64.exe -dedicated ... DIED after prop lighting on this tree, so
// the harness uses the true dedicated binary instead, from the C:\FTESurf
// basedir:  C:\FTEQuake\fteqwsv64.exe +set sv_port 27666 +exec cfg/test/p335sv.cfg
//
// sv_public 0: the first run heartbeated to three public masters and started
// answering A2A from the internet.  A test harness must not advertise itself.
// sv_port on the launch line, not here: the socket binds during net init,
// before this file is exec'd (b65ranksv.cfg's lesson, kept).
// sv_cheats 1 so the client's `cmd setpos` (trig_tp) is accepted -- this is a
// harness, not a ranked lobby; every run on it is TF_CHEAT and nobody cares.
log_enable 1
log_dir logs
log_name p335sv
developer 1
log_developer 1
sv_public 0
sv_cheats 1
sv_maxrate 0
sv_maxdownloadrate 0
map bhop_arcane
