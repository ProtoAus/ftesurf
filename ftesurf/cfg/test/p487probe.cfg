// p487 PROBE (not an arm): can a +exec cfg create a local alias that TP_ExecTrigger
// would later run at RESTRICT_LOCAL?  AGENTS.md's harness trap says "an `alias`
// defined in a cfg creates nothing", which would remove the regression control the
// p487 arm needs (a legitimate user-defined trigger alias must keep working).
// Read the FULL listing; never `alias <name>`, which deletes it.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p487probe
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
alias f_probe "echo LOCALALIAS-RAN"
echo ======== p487probe: full listing
alias
echo ======== p487probe: run it directly
f_probe
echo ======== p487probe done
quit
