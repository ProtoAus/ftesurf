cfg_save_auto 0

// ===========================================================================
// BUILD 65, ARM SET A -- MEASURE THE CLIENT BEFORE CHANGING ANYTHING.
//
// This run writes no code and fixes nothing.  It exists because four
// instruments in a row have been correct and unable to express the failure,
// and the fourth was measuring a code path this machine does not execute:
//
//   arm set A  counts              all correct, map deafening
//   arm set B  falloff             fixed a real 3.5x error
//   arm set D  all four arms passed, surf_tensor2 still blared
//   arm set E  the summed gain     2.00x at a point, 0.00x at spawn
//
// Arm set E's `here: Nx` figure models SND_Spatialize from snd_dma.c.  The
// user's log opens "Initiating OpenAL: Generic Software.", and snd_dma.c:3828
// hands the channel to the driver whenever a backend supplies ChannelUpdate --
// snd_al.c:1898 does.  So SND_Spatialize is SKIPPED, and with it the linear
// falloff AND the static-sound combining at snd_dma.c:3843.
//
// WHAT THAT MEANS FOR INSTRUMENTS, established from the engine before writing
// this file rather than discovered during it:
//   * OpenAL_ChannelUpdate reads chan->master_vol (snd_al.c:940) and NEVER
//     writes ch->vol[].  So on this backend `s_show` prints active=0 and
//     mutes everything, and `soundinfo` files every channel under its
//     Con_DPrintf "inactive" branch (snd_dma.c:256-259).  ch->vol[] IS DEAD
//     HERE and no reading of it means anything.
//   * `soundinfo` still lists EVERY known channel with its sample name,
//     entnum, entchannel and ORIGIN, and still prints the known/highest/max
//     totals (snd_dma.c:243-262).  That is the measurement: WHAT is live and
//     WHERE, which is exactly the "I can hear pretty much all sounds play"
//     question.  It needs developer 1 + log_developer 1 to capture the
//     inactive lines.
//
// THE QUESTION THIS RUN ANSWERS.  surf_tensor2 has 31 ambient_generic: 21 x
// ambient/levels/citadel/field_loop3.wav at radius 219 (audible ~256 units),
// 9 x canals/dam_water_loop2.wav at radius 3424-5480 (~1450-1650), and one
// music/pretending.mp3 behind a func_button.  30 of the 31 go to the STATIC
// bucket.  At the player spawn, the offline model says ZERO are in range, and
// the user's own ent_io agreed -- `here: 0.00x full scale from 0 emitter(s)` --
// while they were hearing harsh noise.  So either every static channel is live
// and unattenuated, or the noise is not ours at all.
//
// PRE-REGISTERED.  Nothing here is a prediction about a fix; these are the
// three outcomes that distinguish the live hypotheses:
//
//   M1  surf_tensor2, at spawn, vbsp_sound 1
//       -> `soundinfo` MUST list the channels.  If ~30 field_loop3/dam_water
//          channels are known at a position where the model says 0 are in
//          range, the static bucket is live everywhere and the OpenAL
//          distance model is not doing what the attenuation byte asks.
//       -> If ~0 are known, the noise is NOT ambient_generic and every
//          hypothesis so far is wrong, including the duplicate-source one.
//
//   M2  same map and position, vbsp_sound 0 -- THE CONTROL.
//       -> MUST list zero ambient channels.  This is the arm that separates
//          "this is ours" from "this is something else" in one step, and it
//          is the one that cannot be argued with afterwards.
//
//   M3  the OpenAL distance model itself, printed rather than inferred.
//       s_al_distancemodel is legacyval("2","0") -- 2 = Linear (Quake-like,
//       and the model arm set E's arithmetic assumes), 0 = Inverse, which
//       with AL_ROLLOFF_FACTOR = s_al_reference_distance (120) and
//       AL_REFERENCE_DISTANCE = 1 (snd_al.c:1200-1202) is a completely
//       different curve.  Which one is live has never been checked and
//       decides whether build 64's verified falloff means anything on this
//       machine.
//
// `volume 0` IS SET AND COSTS THIS RUN NOTHING.  A channel exists in
// sc->channel[] whether or not its gain is zero, so soundinfo's list and
// counts are unchanged by muting -- and this feature has already reached a
// person's speakers twice.
// ---------------------------------------------------------------------------
// RESULTS, 2026-09-13.  logs/b65a_measure.log.
//
// M3 -- THE BACKEND, printed rather than inferred:
//     Initiating OpenAL: Generic Software.
//     AL_VERSION 1.1 / AL_RENDERER Software / AL_VENDOR Creative Labs Inc.
//     AL_EXTENSIONS include AL_EXT_LINEAR_DISTANCE
//     s_al_distancemodel       "2" (default)   = LINEAR, Quake-like
//     s_al_reference_distance  "120" (default)
//     s_nominaldistance        "1000" (default)
//     cl_staticsounds          "1" (default)
//
//   So the distance model IS the linear one build 64's falloff arithmetic
//   assumes, and the implementation advertises support for it.  That half of
//   build 64 stands on this machine.  s_nominaldistance 1000 also confirms the
//   "audible = 1000/attn" figure ent_io prints.
//
// M1 -- WHAT IS LIVE, at the surf_tensor2 spawn:
//     0/32/35/69 active/known/highest/max
//       21 x ambient/levels/citadel/field_loop3.wav
//        9 x ambient/levels/canals/dam_water_loop2.wav
//        2 x ambience/water1.wav + wind2.wav   (Quake's own leaf ambience)
//
// M2 -- THE CONTROL, vbsp_sound 0, same map, same place:
//     0/2/5/5 active/known/highest/max        -- only the two Quake ambients
//
//   CONCLUSIVE: the 30 channels are OURS.  One cvar removes exactly 30 of the
//   32, and that is not an inference from a model, it is a subtraction.
//
// THE ACTIVE COLUMN IS DEAD ON THIS BACKEND AND MUST NOT BE READ.  It says 0
// in every block, including the control -- because OpenAL_ChannelUpdate reads
// chan->master_vol (snd_al.c:940) and never writes ch->vol[], which is the
// only thing `active` counts.  snd_dma.c:3828 skips SND_Spatialize entirely
// when a backend supplies ChannelUpdate.  A second, independent reason it is 0
// here: `volume 0` multiplies into ch->vol (snd_dma.c:2715), so a muted run
// zeroes that column even on the software mixer.
//
// WHAT REMAINS OPEN, AND WHY IT IS BEING LEFT OPEN.  30 permanent channels is
// EXPECTED -- a static sound is a permanent client channel by design, and
// distance is supposed to silence the far ones.  Whether OpenAL is actually
// doing that cannot be read from the console: it exposes no per-channel gain,
// and arm sets B and C both failed trying (see b65b/b65c -- their controls
// caught both failures, which is the only reason they are not recorded as
// results).  The software mixer would only re-confirm arithmetic arm set E
// already verified: 0.00x at spawn, 2.00x at an emitter.
//
// So the remaining question is answerable ONLY BY EAR, and it is one line for
// the user:  s_device "DSound:"  then  snd_restart  then reload the map.
// If tensor2 stops being harsh on the software mixer, the OpenAL path is not
// honouring the attenuation, and that is a backend issue rather than a
// falloff-arithmetic one -- build 64's conversion is verified either way.
//
// WHAT THIS RUN CHANGES ABOUT THE PLAN: nothing in Stage 2.  The soundscape
// work is the feature the map actually needs and is independent of this.
// Stage 3 now has its measurement: the ambient layer is 30 permanent channels
// for 3 distinct samples, and FTE's own software mixer deliberately COMBINES
// identical statics ("so we don't mix five torches every frame",
// snd_dma.c:3841) while OpenAL does not.
// ---------------------------------------------------------------------------
// ===========================================================================

log_enable 1
log_dir logs
log_name b65a_measure
developer 1
log_developer 1
cl_maxfps 100
con_notifylines 0

volume 0
bgmvolume 0

waitms 5000

echo ^5=== M3: the sound backend and its distance model ===
soundinfo
waitms 500
s_al_distancemodel
s_al_reference_distance
s_nominaldistance
s_ambientlevel
cl_staticsounds
volume
waitms 1000

echo ^5=== M1: surf_tensor2, vbsp_sound 1, at spawn ===
vbsp_sound 1
map surf_tensor2
waitmap 60
waitms 9000
ent_io
waitms 1500
echo ^5--- soundinfo AT SPAWN ---
soundinfo
waitms 2500

echo ^5--- now at the spawn_outside soundscape origin ---
setpos -11776 -13632 13760
waitms 2500
echo ^5--- soundinfo AT spawn_outside ---
soundinfo
waitms 2500
ent_io
waitms 1500

echo ^5=== M2: THE CONTROL -- vbsp_sound 0, same map, same place ===
vbsp_sound 0
map surf_tensor2
waitmap 60
waitms 9000
ent_io
waitms 1500
echo ^5--- soundinfo WITH THE AMBIENT LAYER OFF ---
soundinfo
waitms 2500

echo ^5=== RESTORE ===
vbsp_sound 1
echo ^5=== END OF RUN ===
quit
