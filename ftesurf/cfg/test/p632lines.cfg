// Private overlay (tools/runlines_smoke.py, with --mount for surf_voyager).
// Patch 632: hud_edit's Run lines pane (the nearby-player rows gone, Labels with a
// fourth state, a colour row for your line and one for the others) and what those
// two rows draw.  Graded from the log by tools/test_p632lines.py: the pane's hit
// rects and each click's cvar, `replay colours` (ln_col itself) and `replay
// marktrace` (what the mark pass drew).  The screenshots are for a person.
// `wait 4` after a wait: waitms counts from the frame's start (Patch 630's note).
cfg_save_auto 0
log_enable 1
log_dir logs
log_name runlines_smoke
con_notifytime 0
con_notifylines 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
vid_winmaximize 0
vid_width 1600
vid_height 900
vid_conautoscale 1
// A config saved with the old one setting on energy: both groups take it, once.
seta hud_watch_path_color 3
waitms 2000
map surf_kitsune
waitmap 60
waitms 6000
wait 4
menu_restart
ui_close
echo P632 migrated
hud_lines_color_own
hud_lines_color_others
hud_watch_path_color
// Reset all: the two colour rows and the three settings that left the pane, moved
// off their defaults first.
set hud_lines_color_own 2
set hud_lines_color_others 1
set cl_playerfade 0
set cl_playerfade_near 64
set cl_playerfade_far 192
waitms 300
wait 4
hud_edit resetall
waitms 600
wait 4
echo P632 reset all
hud_lines_color_own
hud_lines_color_others
cl_playerfade
cl_playerfade_near
cl_playerfade_far
// CSQC registers these at load, so they are set after the map.
set hud_scale 2
set hud_trail 1
set hud_trail_fade 1
set hud_watch_path 1
set hud_lines_board 1
set hud_lines_order 0
set hud_lines_edge 0
set hud_lines_marks 1
set hud_lines_nums 2
set hud_lines_speed 1
set hud_lines_energy 1
set hud_lines_names 1
set hud_lines_numsize 18
// Patch 661: the lanes are 2 now (0 is "nearest first"), a label has its own
// unit (-1: hud_seq_units, as it was) and its own range (0: the line's).
set hud_lines_declutter 2
set hud_lines_units -1
set hud_lines_label_far 0
set hud_lines_ref 1
set hud_lines_color_own 5
set hud_lines_color_others 5
set hud_watch_path_foreign 0.55
set hud_watch_skipidle 0
set hud_edit_panel_x 0.010
set hud_edit_panel_y 0.080
waitms 600
wait 4

echo ==== P632 PANE ====
hud_edit lines
waitms 800
wait 4
echo P632 pane
hud_edit ui
screenshot p632_pane.png
hud_edit ui hover he_o_hud_lines_nums
hud_edit ui down mouse1
waitms 100
hud_edit ui hover he_o_hud_lines_nums
hud_edit ui up mouse1
waitms 400
wait 4
echo P632 read nums a
hud_lines_nums
hud_edit ui hover he_o_hud_lines_nums
hud_edit ui down mouse1
waitms 100
hud_edit ui hover he_o_hud_lines_nums
hud_edit ui up mouse1
waitms 400
wait 4
echo P632 read nums b
hud_lines_nums
hud_edit ui hover he_o_hud_lines_nums
hud_edit ui down mouse1
waitms 100
hud_edit ui hover he_o_hud_lines_nums
hud_edit ui up mouse1
waitms 400
wait 4
echo P632 read nums c
hud_lines_nums
screenshot p632_pane_peaks.png
hud_edit ui hover he_o_hud_lines_nums
hud_edit ui down mouse1
waitms 100
hud_edit ui hover he_o_hud_lines_nums
hud_edit ui up mouse1
waitms 400
wait 4
echo P632 read nums d
hud_lines_nums
hud_edit ui hover he_o_hud_lines_color_own
hud_edit ui down mouse1
waitms 100
hud_edit ui hover he_o_hud_lines_color_own
hud_edit ui up mouse1
waitms 400
wait 4
echo P632 read own
hud_lines_color_own
hud_edit ui hover he_o_hud_lines_color_others
hud_edit ui down mouse1
waitms 100
hud_edit ui hover he_o_hud_lines_color_others
hud_edit ui up mouse1
waitms 400
wait 4
echo P632 read others
hud_lines_color_others
hud_edit off
set hud_lines_color_own 5
set hud_lines_color_others 5
waitms 400
wait 4

echo ==== P632 YOUR LINE ====
// runlines_livelag.cfg's ride: off the start platform onto the first ramp.
cmd zone_goto 0
waitms 800
+moveright
waitms 800
-moveright
waitms 300
+forward
waitms 1800
wait 4
echo P632 own plain 9
replay colours 9 4
echo P632 own plain 10
replay colours 10 4
screenshot p632_own_blue.png
set hud_lines_color_own 1
waitms 300
wait 4
echo P632 own gain 9
replay colours 9 4
echo P632 own gain 10
replay colours 10 4
-forward
// The ride goes down the ramp and the body is put back; the attempt's line stays
// ahead for the eye (12 s, 3 px).  Speed is read HERE: along the platform every
// sample is 260 u/s, and one colour is then the right answer.
set hud_trail_fade 12
set hud_watch_path_px 3
set hud_lines_color_own 0
waitms 1500
wait 4
echo P632 own speed 9
replay colours 9 4
echo P632 own speed 10
replay colours 10 4
screenshot p632_own_speed.png
set hud_lines_color_own 5
waitms 300
wait 4
screenshot p632_own_after.png
set hud_trail_fade 1

echo ==== P632 OTHER LINES ====
map surf_voyager
waitmap 60
waitms 4000
wait 4
menu_restart
ui_close
set hud_lines_demo 0            // Patch 745: the whole demo line, as before its replay window
replay cfg/test/p492voy.rec
waitms 2500
replay pause
replay seek 3.9
// Three times on one leg: the demo's 66.3 s, 6.3 s and 3.3 s.
scores lineat 1 cfg/test/runlines_peaks.rec
waitms 3000
scores lineat 2 cfg/test/runlines_segbreak.rec
waitms 3000
wait 4
echo P632 rank three
scores lines
echo P632 three slot 0
replay colours 0 512
echo P632 three slot 1
replay colours 1 64
echo P632 three slot 2
replay colours 2 32
screenshot p632_rank3.png
// A fourth with slot 1's own time (and an import): the two share a place.
scores lineat 3 cfg/test/runlines_peaks_mom.rec
waitms 3000
wait 4
echo P632 four slot 0
replay colours 0 512
echo P632 four slot 1
replay colours 1 64
echo P632 four slot 2
replay colours 2 32
echo P632 four slot 3
replay colours 3 64
// Slot 3 is an import: pulled toward blue under a reading, never under a plain colour.
set hud_lines_color_others 0
waitms 600
wait 4
echo P632 tint slot 3
replay colours 3 64
set hud_lines_color_others 5
waitms 600
wait 4
// Another leg's line (stage 7 of another map's run) is ranked apart from these.
scores lineat 4 cfg/test/momflag.rec
waitms 3000
wait 4
echo P632 leg slot 4
replay colours 4 32
echo P632 leg slot 2
replay colours 2 32
scores lines clear
// The run that is open, ticked as well: one run in two slots.
scores lineat 1 cfg/test/p492voy.rec
waitms 4000
wait 4
echo P632 same slot 0
replay colours 0 512
echo P632 same slot 1
replay colours 1 512
screenshot p632_same.png
scores lines clear
scores lineat 1 cfg/test/runlines_peaks.rec
waitms 3000
wait 4
echo P632 two slot 0
replay colours 0 512
echo P632 two slot 1
replay colours 1 64
// No drawer draws the demo's line (path mode 0): it is not ranked either.
set hud_watch_path_mode 0
waitms 600
wait 4
echo P632 mode0 slot 0
replay colours 0 512
echo P632 mode0 slot 1
replay colours 1 64
set hud_watch_path_mode 2
waitms 600
wait 4
// The board's lines hidden: the demo is ranked alone.
set hud_lines_board 0
waitms 600
wait 4
echo P632 alone slot 0
replay colours 0 512
screenshot p632_alone.png
set hud_lines_board 1
set hud_lines_color_others 0
waitms 600
wait 4
echo P632 speed slot 0
replay colours 0 512
screenshot p632_speed.png
set hud_lines_color_others 5
waitms 600
wait 4

echo ==== P632 LABELS ====
scores lines clear
set hud_lines_nums 2
waitms 600
wait 4
echo P632 labels both
replay marktrace 2
waitms 600
wait 4
screenshot p632_labels_both.png
set hud_lines_nums 3
waitms 600
wait 4
echo P632 labels peaks
replay marktrace 2
waitms 600
wait 4
screenshot p632_labels_peaks.png
set hud_lines_nums 1
waitms 600
wait 4
echo P632 labels contacts
replay marktrace 2
waitms 600
wait 4
screenshot p632_labels_contacts.png
// A bottom that is also a landing (12.975 s of this run): at 3 the landing's mark
// carries the number.  `replay marks` prints, for every mark of the run, whether
// the draw pass would label it (lng) and which contacts are such turns (lnf).
set hud_lines_nums 3
waitms 600
wait 4
echo P632 marks peaks
replay marks 0
set hud_lines_nums 2
waitms 600
wait 4
echo P632 marks both
replay marks 0
echo P632 end
echo RUNLINES COMPLETE
quit
