// Patch 817 review round 3: a retry's restored run takes the profile baseline 0 (the client's
// counter restarted with its CSQC), not -1, so its span is still checked at the finish.
// tools/p817failrewind.py --retry grades it.
cfg_save_auto 0
name P817
fs_cache 0
log_enable 1
log_dir logs
log_name p817retry
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
waitms 3000
connect 127.0.0.1:27561
waitmap 60
waitms 8000
menu_restart
ui_close
waitms 1000
cmd zone_goto 0
waitms 400
+forward
waitms 2000
-forward
echo ==== P817 BEFORE ====
cmd timer
waitms 300
cmd rec_retry
waitms 9000
echo ==== P817 AFTER ====
cmd timer
waitms 500
echo ==== P817 END ====
quit
