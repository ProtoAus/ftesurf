// Build 30 Stage 1 verification, part 2 -- the STALE CONTACT after a load.
//
// The complaint: "if you are making contact with a ramp when you load the lock,
// the locked position will show surface contact and an energy reading, it's only
// wrong until you make contact with the ramp again."
//
// The cause was that Board_Warped -- the only thing a load reached -- killed the
// open segment and nothing else, so the board panel's rows (hud_board_fade, 3s),
// the held ramp PLANE (RAMPHOLD, 0.25s) and the energy ring (hud_strafe_window,
// 2s) all survived the teleport.  All three were reachable only from a MAP
// CHANGE.
//
// So this has to (a) establish real ramp contact, then (b) teleport away from it
// with a load, and look at what is left on screen.
//
//   b30b-1-surfing    riding.  hud_debug should say SURFING, `ramp` should be a
//                     small age in seconds, and the board panel under the strafe
//                     bar should be showing contact/grade rows.
//   b30b-2-afterload  loaded a save 2000+ units away, one frame later.  `ramp`
//                     must read `--` and the board rows must be GONE.  Before
//                     this build both were still there, counting the previous
//                     ramp, for three more seconds.
//   b30b-3-settled    a second later, still clean.
//
// surf_kitsune save 5 (folder save004) is stored mid-surf at 1225 u/s; save 3
// (save002) is a standstill on the other side of the map, which is the contrast.

waitms 2000

echo ^5=== b30b: build 30 stage 1, stale contact after a load ===

hud_debug 1
hud_energy 1
hud_board 1
scr_conalpha 0

map surf_kitsune
waitmap 400
wait 60

echo ^5--- the list ---
cmd sl_list
wait 10

echo ^5--- load the mid-surf save and LET GO, so real contact is established ---
cmd sl_goto 5
wait 10
cmd sl_load
cmd sl_hold
wait 20
cmd sl_holdoff

// Long enough for the ramp contact, the board panel and the energy ring to be
// genuinely full of this ramp.
waitms 1200

echo ^5--- riding: this is the state that used to survive the next load ---
cmd timer
wait 5
screenshot b30b-1-surfing
wait 20

echo ^5--- now teleport away with a load.  Everything above must be dropped. ---
cmd sl_goto 3
wait 5
cmd sl_load
cmd sl_hold
wait 5

screenshot b30b-2-afterload
wait 20

waitms 900
screenshot b30b-3-settled
wait 20

echo ^5=== b30b done ===
wait 30
quit
