// Patch 746: the race ghost on your run's clock, behind a ping.
//   python tools/runlines_smoke.py ftesurf/cfg/test/raceghost_live.cfg --dedicated
//       --map surf_kitsune --server-arg "+set sv_minping 120"
//       --put data/runs/surf_kitsune/main/0009998_pb.rec=<a surf_kitsune PB .rec>
//   python tools/test_raceghost.py <rig>/ftesurf --pb <that .rec>
// runlines_livelag.cfg's ride (walk off the start onto the first ramp); the saves keep the
// server's recording of it, which the grader reads the clock against.
cfg_save_auto 0
name RaceGhost
log_enable 1
log_dir logs
log_name runlines_smoke
cl_idlefps 0
cl_maxfps 100
set hud_rewind_chase 0
rec_savelock 1
waitms 2000
map surf_kitsune
waitmap 60
waitms 6000
menu_restart
ui_close
hud_ghost 1
hud_ghost_sync 0
hud_ghost_pb 1
hud_ghost_lines 4
hud_ghost_offset 0
hud_ghost_dither 1
hud_ghost_alpha 0.55
hud_ghost_near 96
cmd zone_goto 0
waitms 800
echo ==== ARMED ====
raceghost
cmd timer
echo ==== RIDE ====
+moveright
waitms 800
-moveright
waitms 300
+forward
waitms 1300
echo ==== R1 ====
raceghost
waitms 300
echo ==== R2 ====
raceghost
screenshot raceghost_body.png
waitms 300
echo ==== R3 ====
raceghost
waitms 300
echo ==== R4 ====
raceghost
sl_save
waitms 50
sl_save
waitms 50
sl_save
waitms 50
sl_save
waitms 50
sl_save
waitms 50
sl_save
waitms 50
sl_save
waitms 50
sl_save
-forward
waitms 600
echo ==== RIDEEND ====
cmd timer
raceghost
echo RUNLINES COMPLETE
waitms 100
quit
