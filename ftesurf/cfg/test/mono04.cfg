// MONO04 -- Patch 261 verification: does the pink/black checkerboard go away,
// and what is actually wrong with the sky at BONUS 4?
//
// THE A/B IS ACROSS RUNS, NOT WITHIN ONE.  `map x` twice does not reload, and
// the plugin cannot be swapped mid-process anyway, so the "before" half of this
// comparison is an artefact that already exists on disk:
//
//   before : screenshots/mono02_e_yaw270.png   (spawn room, checkerboard present)
//   after  : shot A below, from the IDENTICAL setpos 3856 -13872 13490 0 270 0
//
// Same vantage, same map, same everything but the plugin.  Any pixel difference
// confined to that one wall panel is the fix; a difference anywhere else is not.
//
// What the fix is: mat_vmt.c:VMT_ReadVMT tested strncmp(fname,"materials/",10)
// to decide whether to prepend the mandatory prefix.  surf_monolith's
// effects/tp_refract_pink.vmt is a `patch` whose include is written the Windows
// way -- include "materials\effects\tp_refract_algetic.vmt" -- so the compare
// hit '\' at index 9, called the name un-prefixed, and asked for
// materials/materials/effects/... .  EFFECTS/TP_REFRACT_PINK is texdata 38, so
// it is on real faces: the map's teleporter panels.
//
// THE BONUS-4 REPORT.  The user placed save004 at bonus 4 and reports a missing
// sky texture there.  mono03 photographed blue sky at a stage start, so the two
// readings have to be reconciled rather than one of them dismissed.  What the
// BSP says narrows it before any pixel is looked at:
//
//   * ONE skyname, sky138a.  No sky_camera, so no 3D skybox.
//   * All six sky138a faces are in the map's own pak with .vmt AND .vtf.
//   * Exactly one sky texdata name in the whole map: TOOLS/TOOLSSKYBOX.
//
// So there is no second sky to be missing.  The live hypothesis is that what
// reads as "missing sky texture" at bonus 4 IS the checkerboard -- a teleporter
// panel is a big flat surface, and at z 15936 (world max 16320) a pink/black
// plane overhead looks exactly like a failed sky.  B and C are aimed at telling
// those two apart: if the checkerboard is gone AND the sky is blue, one bug
// explained both reports.  If the sky is still wrong with the panel fixed, it is
// a second bug and this run says so.
//
// Traps this cfg is written around (all previously paid for):
//   * setpos does NOT noclip -- issue noclip ONCE, before the first setpos,
//     never between shots (it is a toggle).
//   * screenshot captures one step BEHIND, so every shot is taken twice and the
//     second one is the evidence.
//   * a second instance while the user's game runs comes back all-black, so
//     vid_fullscreen 0 -- and the user's game must be closed before this runs.

log_enable 1
log_dir "logs"
log_name "mono04"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
con_notifylines 0
developer 1
log_developer 1

wait 200
map surf_monolith
waitmap 2400
waitms 10000

echo ^5=== resolve counters (expect the same 0 as mono01, or lower) ===
hl2_unresolved
hl2_unresolved_visible
waitms 300
hl2_missing
waitms 1000

echo ^5=== did the patch VMT resolve? ===
r_showshader effects/tp_refract_pink
waitms 600
r_shaderpasses effects/tp_refract_pink
waitms 600
echo ^5=== control: the base material it includes, which always worked ===
r_showshader effects/tp_refract_algetic
waitms 600

echo ^5=== sky state ===
r_fastsky
gl_skyboxname
waitms 400

sv_cheats 1
waitms 300
noclip
waitms 400

echo ^5=== A: spawn room, the mono02_e_yaw270 vantage EXACTLY ===
setpos 3856 -13872 13490 0 270 0
waitms 1500
screenshot mono04_a_x
waitms 700
screenshot mono04_a_spawn_yaw270
waitms 700

echo ^5=== B: the user's bonus-4 save, its own angles ===
setpos -10975.05 -5482.11 15936.03 0 178 0
waitms 1500
cmd viewpos
screenshot mono04_b_x
waitms 700
screenshot mono04_b_bonus4
waitms 700

echo ^5=== C: bonus 4, looking UP at the sky ===
setpos -10975.05 -5482.11 15936.03 -70 178 0
waitms 1400
screenshot mono04_c_x
waitms 700
screenshot mono04_c_bonus4_up
waitms 700

echo ^5=== D: bonus 4, opposite yaw ===
setpos -10975.05 -5482.11 15936.03 0 358 0
waitms 1400
screenshot mono04_d_x
waitms 700
screenshot mono04_d_bonus4_back
waitms 700

echo ^5=== E: bonus 4, yaw 88 ===
setpos -10975.05 -5482.11 15936.03 -20 88 0
waitms 1400
screenshot mono04_e_x
waitms 700
screenshot mono04_e_bonus4_side
waitms 700

echo ^5=== mono04 done ===
wait 30
quit
