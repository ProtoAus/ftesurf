// P462NETS -- the strafe trainer against a REAL server, server half.
// Client: p462netcl.cfg.  Launch this one FIRST and give it time to load.
//
// WHY THIS EXISTS.  Every cut of p462trn.cfg ran on a LISTEN server, where the
// client and the server share a process.  The trainer takes its speed from
// STAT_FS_VELOCITY, which on a listen server is delivered without ever crossing
// the network stack -- so nothing so far has shown that the panel works when the
// stat arrives in a snapshot, late, from somewhere else.  That is the only
// configuration the lobbies run, and it is the one this arm covers.
//
// It is also the first time the trainer sees the gesture it was actually asked
// for: pm_autobunny is on by default, so holding +jump bhops, and each hop is a
// separate jump in the panel rather than one long gravity-0 hover.
//
//   pwsh> $sv=@{FilePath="C:\FTESurf\ftesurf64.exe";
//              ArgumentList="-WindowStyle","Minimized","+exec","cfg/test/p462nets.cfg";
//              WorkingDirectory="C:\FTESurf"}
//   pwsh> Start-Process @sv; Start-Sleep 25
//   pwsh> $cl=@{FilePath="C:\FTESurf\ftesurf64.exe";
//              ArgumentList="-WindowStyle","Minimized","+exec","cfg/test/p462netcl.cfg";
//              WorkingDirectory="C:\FTESurf"}
//   pwsh> (Start-Process @cl -PassThru).WaitForExit()
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p462nets
con_notifytime 0
developer 1
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
vid_width 640
vid_height 480
fs_missingwarn 0
sv_public 0
sv_port 27695                   // not 27691-27693 (p462trn), not 27698 (the peer's)
set lobby_dir ""
set run_resume 0
// NO sv_cheats and NO gravity change.  The point is the ordinary configuration:
// whatever a lobby runs is what the trainer has to cope with, and a 0.755 s hop
// is what a real jump gives you.
waitms 4000
map surf_dune
waitmap 45
waitms 60000                    // outlive the client, which quits first
quit
