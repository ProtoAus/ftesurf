cfg_save_auto 0

// ===========================================================================
// BUILD 63, ARM SET C -- the A/B that shows what actually changed.
//
// Arm sets A and B proved the new names are REGISTERED (nothing censuses them
// any more) and that the layer is running (430 inputs delivered on
// surf_ny_platinum).  Neither proves what the census looked like BEFORE, and
// "it does not warn any more" is only evidence if the warning used to be there.
//
// So this config is run TWICE against the same three maps, once with
// qwprogs.dat.pre-b63 in place and once with the build 63 one, and the two
// censuses are diffed.  The swap is done outside the game, by the harness.
//
// PRE-REGISTERED PREDICTION, for the build 63 side against the pre-b63 side:
//
//   surf_ny_platinum   MUST LOSE, from the census:
//                        input 'Trigger'      (logic_relay)
//                        input 'PickRandom'   (logic_case)
//                        output oncase01..NN  (logic_case)
//                      MUST KEEP output onfullyopen / onfullyclosed
//                        (func_movelinear -- Tier 3, deliberately not done)
//                      MUST KEEP output onbreak (func_breakable -- impossible)
//   surf_forbidden_tomb4  MUST LOSE input 'Trigger' and output ontrigger.
//   surf_kitsune       MUST LOSE output onin / onout.
//                      MUST KEEP 28 / 50 / 1 exactly.
//
// Anything that changes and is NOT on that list is a finding.
//
// ---------------------------------------------------------------------------
// RESULTS, 2026-09-13.  logs/b63ab_old.log vs logs/b63ab_new.log.
// qwprogs.dat 1092638 (pre-b63) against 1107782 (b63).  Same exe, same cfg,
// same three maps, progs swapped between runs by the harness.
//
// CENSUS DIFF -- what stopped warning:
//   surf_kitsune          - output onin, output onout
//   surf_forbidden_tomb4  - output onuser1, output onuser2
//   surf_ny_platinum      - input Trigger
//   NOTHING WAS ADDED on any of the three.  No new class, input or output
//   became unhandled, which is the half of the diff that says nothing broke.
//
// ONE PREDICTION WAS WRONG, AND IT IS THE INTERESTING ONE.  The header above
// predicted surf_ny_platinum would also lose `input PickRandom` and
// `output oncase01..NN`.  It did not -- because those were NEVER CENSUSED in
// the old build either.  logic_case had no spawn function, so the catch-all
// removed the entity before SV_EntityIOBuild ran, and an output on a removed
// entity is never materialised and therefore never reaches the "nothing fires
// this" check.  The 6,258 OnCase outputs were not being warned about; they
// were silently absent, which is worse and is exactly what the catch-all's own
// comment says happens.
//
// So the evidence for logic_case is not in the census at all.  It is the
// WIRED COUNT, which is the number of outputs that exist to be fired:
//
//   map                      OLD    NEW    delta
//   surf_kitsune              50     50        0
//   surf_forbidden_tomb4    1612   2394     +782
//   surf_ny_platinum         831   1611     +780
//
// +1,562 outputs across two maps are now live that previously did not exist
// as far as the engine was concerned -- the ones hanging off logic_case,
// logic_branch and logic_compare, which now survive spawn.  surf_kitsune at
// 50 -> 50 is the control: it carries none of those three classes, and it did
// not move.
//
// DEPTH: the cycle fuse's high-water mark never exceeded 2 on any map tested
// (kitsune 0, forbidden_tomb4 1, ny_platinum 2, miku 2) against a ceiling of
// 32.  That is 16x headroom and it is the first evidence for the constant,
// which was previously a guess.  Worth re-reading on a denser map before
// anyone lowers it.
// ---------------------------------------------------------------------------
// ===========================================================================

log_enable 1
log_dir logs
developer 1
log_developer 1
cl_maxfps 100
con_notifylines 0

waitms 5000

echo ^5=== AB1: surf_kitsune ===
map surf_kitsune
waitmap 45
waitms 6000
ent_census
waitms 1500

echo ^5=== AB2: surf_forbidden_tomb4 ===
map surf_forbidden_tomb4
waitmap 45
waitms 6000
ent_census
waitms 1500

echo ^5=== AB3: surf_ny_platinum ===
map surf_ny_platinum
waitmap 45
waitms 6000
ent_census
waitms 2500

echo ^5=== END OF RUN ===
quit
