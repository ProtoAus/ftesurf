// Patch 335/336 playtest: a real player on the local dedicated server.
// Play normally.  The evidence lands in logs/p335play.log:
//   prederr:  -- any snap-back bigger than 2 units, with both origins
//   trig:     -- local fires are silent (cl_trigdebug 0); set it to 1 in
//                console if you want to watch them land live
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p335play
vid_fullscreen 0
cl_idlefps 0
cl_maxfps 100
cl_prederror 2
cl_trigdebug 0
cl_triggers 1
connect 127.0.0.1:27666
