// BUILD 26 stage 1, first pass -- THE RESET ANGLE, measured on a map that
// exercises the exact case that was broken.
//
// surf_aesthetic's start region names info_teleport_destination "s1", and that
// entity's angles key is "0 0 0".  So it is one of the 173-of-400 installed maps
// where SV_ZoneDest discarded the yaw for being zero and !r left your view
// wherever it happened to be.  bhop_futile is the control: its start marker is
// "0 90 0" and has always worked.
//
// THE MEASUREMENT IS TWO viewpos LINES.  zone_goto takes optional yaw and pitch
// precisely so a headless check can aim the camera repeatably, so:
//
//   zone_goto 0 45 30    -> viewpos must read pitch 30, yaw 45
//   say !r               -> viewpos must read pitch 0,  yaw 0
//
// Before build 26 the second line read 30 / 45 again -- the reset moved the
// player and left the view alone.  The two outcomes are nowhere near each other,
// which is what makes this a test rather than a screenshot.

developer 1
log_developer 1
cfg_save_auto 0

wait 200
map surf_aesthetic
waitmap 90

echo ""
echo "=== every leg's destination AND ITS YAW ==="
echo "=== (yaw -- now means NO destination; yaw 0 means aim north) ==="
cmd zone_dests
wait 8
echo ""

echo "=== aim somewhere deliberate: yaw 45, pitch 30 ==="
cmd zone_goto 0 45 30
wait 12
viewpos
wait 5
echo "--- (must read pitch 30 yaw 45) ---"
echo ""

echo "=== !r -- the reset must now aim you at the marker's own angle ==="
say !r
wait 20
viewpos
wait 5
echo "--- (must read pitch 0 yaw 0.  Build 25 read 30 / 45) ---"
echo ""

echo "=== again from a different starting view, so it is not a coincidence ==="
cmd zone_goto 0 -135 -20
wait 12
viewpos
wait 5
say !r
wait 20
viewpos
wait 5
echo "--- (second line must be pitch 0 yaw 0 again) ---"
echo ""

echo "=== !m goes through the same path and must aim the same way ==="
cmd zone_goto 0 90 0
wait 12
say !m
wait 20
viewpos
wait 5
echo ""

echo "=== selftests ==="
pm_selftest
wait 10
zone_selftest
wait 10
echo ""

echo "=== b26a done ==="
wait 20
quit
