// P430CL -- the load key drawn a round trip early (server p428svq.cfg: lobby mode,
// the probe guid, so the save lands in data/saves/bhop_eazy/@<guid>/ -- remove
// it after).  cl_delay_packets 200 holds this client's outgoing packets 200 ms,
// so the reply to `2` lands ~200 ms after the press.  The key goes through the
// real input chain (`vote key 50 1` = '2' down); `cmd setpos` taints the run so
// the Patch 391 clean-run refusal stays out of the way.
//
// PRE-REGISTERED PREDICTIONS (`spt` lines: fields 9-11 the drawn camera,
// 23-25 the body's predicted eye before any override):
//  P1 cl_slpredict 1: on the first frame after the press the camera is at save
//     A's eye while the body's eye is still at B, and stays there until the body
//     arrives ~200 ms later; the two never disagree after that.
//  P2 cl_slpredict 0 (the control, same client): the camera IS the body's eye
//     throughout -- at B for ~200 ms after the press, then at A.
//  P3 both: no `spt` line puts the camera anywhere but A's eye or the body's.
//  P4 `1` then `2` in one frame at C (cl_slpredict 1): the published row is A's
//     until the save lands, so nothing is drawn early -- the camera is the
//     body's eye throughout and never at A.
// FALSIFIED IF P1's first frame after the press is not at A, P2's is, or P4
//   ever draws A.
// RESULT 2026-09-22 (Windows fteqwsv64 + p428svq.cfg): all four held.
//  P1 frame 0 after the press: camera at A's eye, body 519 u away at B; the
//     body arrives +232 ms and the two agree from then on.
//  P2 camera = body throughout; at B until +234 ms, then A.
//  P4 camera = body = C throughout; save 2 taken at C and loaded there.
//  FIRST RUN FALSIFIED P1's "never disagree after": the override ended on the
//     count, which lands a frame or two before the body -- the camera went back
//     to B for 20 ms at +224 ms.  It now ends when the predicted eye arrives
//     (or SL_PV_SETTLE after the count, a refused load).
cfg_save_auto 0
log_enable 1
log_dir logs
developer 1
cl_idlefps 0
cl_maxfps 100
rate  2000000
drate 5000000
vid_fullscreen 0
name "^3P430"
waitms 4000
connect 127.0.0.1:27635
waitms 3000
menu_restart
waitms 1000
ui_close
waitms 9000
cl_delay_packets 200
cmd viewpos
cmd sl_save
waitms 1500
cmd setpos -48 224 64
waitms 1500
cmd viewpos
waitms 500
echo p430cl: P1 press
spec_trace 45
vote key 50 1
waitms 800
vote key 50 0
waitms 1500
cmd viewpos
cmd setpos -48 224 64
waitms 1500
set cl_slpredict 0
echo p430cl: P2 press
spec_trace 45
vote key 50 1
waitms 800
vote key 50 0
waitms 1500
set cl_slpredict 1
cmd setpos -120 224 64
waitms 1500
echo p430cl: P4 press
spec_trace 45
vote key 49 1
vote key 49 0
vote key 50 1
waitms 800
vote key 50 0
waitms 1500
cl_delay_packets 0
cmd sl_delall
waitms 2000
echo p430cl: done
quit
