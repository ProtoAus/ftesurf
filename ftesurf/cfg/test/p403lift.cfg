// P403LIFT -- find a place to capture a `lift` warp (anti-cheat item 8).
// A lift needs FL_ONGROUND when an UPWARD trigger_push fires (sv_entities.qc:5608),
// and the run must already be RUNNING for the record to reach the .rec.
//
// ROUND 1 (bhop_arcane) FALSIFIED THE MAP: the only floor inside *252 is at
// z 13600 and standing there IS the lift, so a run started there has already
// spent it; west of the volume is a drop (fell 13650 -> 13064) and east/south/
// north the body froze in solid.  No approach walks in.
//
// ROUND 2 looks for a PAD -- a thin upward push sitting on a floor, which is the
// natural grounded case (you walk on).  Ranked by z extent across the 93-map
// rotation (scratchpad/lift2.py):
//   bhop_pharma *939   speed  850, 84 tall, 14640 -15036 -15424 .. 14944 -14732 -15340
//   bhop_badges_mini *249 speed 400, 192 tall, 2304 -7232 11392 .. 2560 -6960 11584
//   agtricks *30       speed 2000, 192 tall, 136 1800 -448 .. 184 1856 -256
// PASS for this probe = the body rests on a floor at the pad and is then carried
// upward, with the resting z inside the pad's own bbox (that is the walk-on case).
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p403lift
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
sv_cheats 1
fs_missingwarn 0
set run_resume 0
sv_port 27682

wait 200
map bhop_pharma
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 1000

echo ^5=== A: bhop_pharma *939 pad centre ===
cmd setpos 14792 -14884 -15400 0 0 0
waitms 500
cmd viewpos
waitms 600
cmd viewpos
echo ^5=== A2: same pad, entering from just outside (+x) ===
cmd setpos 15000 -14884 -15400 0 0 0
waitms 500
cmd viewpos
waitms 600
cmd viewpos

map bhop_badges_mini
waitmap 1800
waitms 3000
ui_close
waitms 1000
echo ^5=== B: bhop_badges_mini *249 pad centre ===
cmd setpos 2432 -7096 11420 0 0 0
waitms 500
cmd viewpos
waitms 600
cmd viewpos
echo ^5=== B2: *249, just outside (+x) ===
cmd setpos 2620 -7096 11420 0 0 0
waitms 500
cmd viewpos
waitms 600
cmd viewpos

echo ^5=== P403LIFT DONE ===
waitms 500
quit
