// P399KEYS -- key display without letters, the overridden strafe key and W-release in the force
// colour, and the mouse-pad trail turning orange while A/D is held (listen server, 1280x720, scale 2).
//   ftesurf64.exe +set vid_winmaximize 0 -WindowStyle Minimized +exec cfg/test/p399keys.cfg
// `vote key <scan> <0|1>` runs the input chain, so Keys_Edge believes the key (its bind never runs).
// Cell centres (px): W 1205,621  A 1169,657  S 1205,657  D 1241,657  C 1169,693  Jump 1223,693.
// Read by class: yellow R>200 B<110, white B>200, dark R<200.  Pad 970..1136 x 605..709.
//
// PREDICTIONS (registered before the run):
//  K0 nothing held: all cells dark, no letters anywhere in the block.
//  K1 A down: A white.            K2 D down over A: A yellow, D white.
//  K3 D up: A white, D dark.      K4 D down, A up, A down: A white, D yellow.
//  K5 cl_iDrive 0 (both keys count, they cancel): A white, D white.   K6 all up: dark.
//  T0 moves with no key: trail pixels blue only (orange 0).  mousepad strafe 0.
//  T1 moves with A held, then 3 with nothing: both orange and blue trail pixels; strafe 1 then 0;
//     t1a (still held) orange, no blue.   T2 D alone: strafe 1.
//  R0 replay 0004976_pb at 0.02 (keys 537 = W+D+jump+PSREL): W yellow, D white, Jump white.
//  R1 seek 0.60 (D) then 0.645 (A+D, A newer): keys 28; D yellow, A white.
//  R2 seek 1.20 (A) then 1.26 (A+D, D newer): keys 28; A yellow, D white.
//
// RESULTS 2026-09-20 04:22 (run 2): K0-K6, R0-R2 all as predicted (k2 A=Y D=w, k4 A=w D=Y, k5 both
//  white, r0 W=Y, r1 D=Y, r2 A=Y; replay keys 537/28/28); no letters in any cell.  T0 blue only;
//  t1a (A held) 105 orange px, 0 blue; T2 D alone strafe 1.  MISSED: t1 showed no orange -- by
//  the shot the held samples had faded (live 4 of 7), a timing miss, not colour.  Run 1 found
//  no tint at all: `ra = ka && !ui_kb_pa` parses as `(ra = ka) && ...` (AGENTS.md) -- fixed.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p399keys
developer 0
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
sv_port 27646
sv_cheats 0
set run_resume 0
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_conautoscale 0
vid_conwidth 1280
vid_conheight 720
waitms 5000
map bhop_eazy
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 500
hud_scale 2
set hud_keys 1
set hud_keys_x 0
set hud_keys_y 0.84
set hud_mouse 1
set hud_mouse_x -1
set hud_mouse_y -1
set hud_debug 0
set cl_iDrive 1
alias mpbase "set sensitivity 1; set m_yaw 0.022; set m_pitch 0.022; set in_xflip 0; set hud_mouse_span 90; set hud_mouse_trail 1; mousepad reset"
echo ==== K0 ====
waitms 500
screenshot p399keys_k0
echo ==== K1 ====
vote key 97 1
waitms 500
screenshot p399keys_k1
echo ==== K2 ====
vote key 100 1
waitms 500
screenshot p399keys_k2
echo ==== K3 ====
vote key 100 0
waitms 500
screenshot p399keys_k3
echo ==== K4 ====
vote key 100 1
waitms 300
vote key 97 0
waitms 300
vote key 97 1
waitms 500
screenshot p399keys_k4
echo ==== K5 ====
set cl_iDrive 0
waitms 500
screenshot p399keys_k5
set cl_iDrive 1
echo ==== K6 ====
vote key 97 0
vote key 100 0
waitms 500
screenshot p399keys_k6
echo ==== T0 ====
mpbase
waitms 100
spectate look 409.0909 204.5455
waitms 30
spectate look 409.0909 -204.5455
waitms 30
spectate look 409.0909 204.5455
waitms 30
spectate look 409.0909 -204.5455
waitms 100
mousepad
waitms 400
screenshot p399keys_t0
echo ==== T1 ====
mpbase
vote key 97 1
waitms 300
spectate look 409.0909 204.5455
waitms 30
spectate look 409.0909 -204.5455
waitms 30
spectate look 409.0909 204.5455
waitms 30
spectate look 409.0909 -204.5455
waitms 100
mousepad
waitms 400
screenshot p399keys_t1a
vote key 97 0
waitms 300
spectate look 409.0909 204.5455
waitms 30
spectate look 409.0909 -204.5455
waitms 30
spectate look 409.0909 204.5455
waitms 100
mousepad
waitms 300
screenshot p399keys_t1
echo ==== T2 ====
mpbase
vote key 100 1
waitms 300
spectate look 409.0909 204.5455
waitms 100
mousepad
vote key 100 0
waitms 300
echo ==== R0 ====
replay data/runs/bhop_eazy/main/0004976_pb.rec
waitms 800
replay pause
replay seek 0.02
waitms 500
replay status
screenshot p399keys_r0
echo ==== R1 ====
replay seek 0.60
waitms 400
replay seek 0.645
waitms 500
replay status
screenshot p399keys_r1
echo ==== R2 ====
replay seek 1.20
waitms 400
replay seek 1.26
waitms 500
replay status
screenshot p399keys_r2
replay stop
echo ==== END ====
waitms 300
quit
