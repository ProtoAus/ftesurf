// surf_tensor2's rain -- does the baked .pcf actually draw?
//
// The chain under test, end to end:
//   tools/pcf.py  read the map's own particles/tensor2_particles.pcf (dmx
//                 binary 2 / pcf 1), translated 20 of 20 systems with every
//                 operator understood, and wrote particles/surf_tensor2.cfg
//                 plus 20 `psys` lines in data/mapparticles.txt
//   cl_emit.qc    reads those lines, matches each info_particle_system's
//                 effect_name, and emits through "surf_tensor2.<name>" --
//                 asking for that name is ALSO what queues the cfg
//
// WHAT WOULD FALSIFY IT:
//   * emit_list shows info_particle_system seen 44 but live 0
//     -> the index lookup failed; the name or the map column is wrong
//   * live > 0 and nothing on screen
//     -> the effect handle never resolved, or the material did not load.
//        `particle/rain` is a Source VMT from a mounted VPK, not from the map,
//        so it is the most likely thing to be missing.  Check the log for it.
//   * rain in the wrong place -> spawnorg is 2 values in FTE, not 3
//
// The two systems at the start are spawn_rain01 (-11776 -13448 14648) and
// spawn_rain02 (-11776 -9656 14016); info_player_start is -11776 -13632 13680,
// so both boxes cover the spawn courtyard from above.

developer 1
log_developer 1
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000

cl_maxfps 0
cl_idlefps 0
cl_yieldcpu 0
sv_cheats 1
vbsp_emit 1
vbsp_emit_psys 1

map surf_tensor2
waitmap 600
waitms 6000

echo ^5=== emit_list: info_particle_system must be SEEN 44 and LIVE > 0
emit_list
waitms 1500
developer 0
log_developer 0
r_speeds 2

noclip
waitms 1500

// Look UP from the spawn: the rain boxes are overhead, so falling streaks
// should cross the whole frame.
echo ^5=== A: spawn, looking up, rain ON
setpos -11776 -13632 13720 -35 90 0
waitms 3000
r_speeds_dump
screenshot t2rain_on_x
waitms 1000
screenshot t2rain_on
waitms 1000

// The control that says the picture is the rain and not the weather texture on
// the skybox: same frame, emitter class off.
echo ^5=== B: same view, vbsp_emit_psys 0
vbsp_emit_psys 0
waitms 3000
r_speeds_dump
screenshot t2rain_off_x
waitms 1000
screenshot t2rain_off
waitms 1000

vbsp_emit_psys 1
echo ^5=== C: level view
setpos -11776 -13632 13720 0 90 0
waitms 3000
screenshot t2rain_level_x
waitms 1000
screenshot t2rain_level
waitms 1000

emit_list
waitms 800
echo ^5=== END ===
waitms 500
quit
