// cfg_save_auto 0: this run sets archived cvars; never let it write them into ftesurf.cfg
cfg_save_auto 0
// p643fire -- env_fire from Source's flame sheet (Patch 643), beside nothing and beside the orbs.
// surf_anubis, one brazier (firesize 64, env_fire_small) from a fixed camera, bloom off.
//   S  vbsp_emit_flame 1   emit_list must say "flame sheet, size classes 10 ..., 26 of their 26
//                          effects answering" (small 2 + large 8); three shots of the brazier
//   R  vid_restart         the repair: three more shots, then the same line with "reloads 1".
//                          Read 19 s after the restart, not at once: the repair waits for a
//                          drawn frame and then for the engine to parse what it sent
//   N  vbsp_emit_fire 0    nothing drawn: the background S and O are diffed against
//   D  surf_dune           65 fires of size 32 and 38: classes 3 (tiny 1 + small 2), 26 of 26
//   C  surf_classics2      one of the two maps with all four sizes: classes 15, 52 of 52.
//                          61 KB of effect text against a 64 KB command buffer, which is why it
//                          is sent a class a frame (Emit_FlameStep)
//   O  vbsp_emit_flame 0   the control, same map and camera: "orbs, because vbsp_emit_flame is 0"
// Each stage ends on two emit_list lines 6 s apart at cl_maxfps 0: frames a second with that
// stage's fire on screen.  tools/p643fire.py grades the log and the pictures.
//
// SHOTS ARE 2.5 s APART ON PURPOSE.  A screenshot stalls the client for longer than a frame, the
// emitter refuses to catch a stall up (Emit_Frame: "a hitch is not a licence to emit"), and a
// flame lives 1.2-1.75 s -- so a burst of shots photographs a fire the burst itself starved.
log_dir "logs"
log_name "p643fire"
log_enable 1
developer 1
log_developer 1
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000
cl_maxfps 100
cl_idlefps 0
sv_cheats 1
r_bloom 0
con_notifylines 0
scr_sshot_type png
wait 200
map surf_anubis
waitmap 600
waitms 2000
menu_restart
ui_close
set hud_speed 0
set hud_energy 0
set hud_keys 0
noclip
setpos -5184 3904 560 5 0 0
waitms 6000
echo ^5=== S sheet
emit_list
r_partinfo
waitms 2500
screenshot p643fire_s1
waitms 2500
screenshot p643fire_s2
waitms 2500
screenshot p643fire_s3
waitms 2500
setpos -5384 3904 620 8 0 0
waitms 2500
screenshot p643fire_sfar
waitms 500
// one of the 21 fires of size 128 (env_fire_large), 300 units off
setpos -1196 3456 -2063 12 0 0
waitms 5000
screenshot p643fire_l1
waitms 2500
screenshot p643fire_l2
waitms 500
setpos -5184 3904 560 5 0 0
cl_maxfps 0
waitms 2500
emit_list
waitms 6000
echo ^5=== S fps
emit_list
cl_maxfps 100
echo ^5=== R restart
vid_restart
waitms 9000
waitms 2500
screenshot p643fire_r1
waitms 2500
screenshot p643fire_r2
waitms 2500
screenshot p643fire_r3
waitms 2500
echo ^5=== R settled
emit_list
echo ^5=== N no fire
set vbsp_emit_fire 0
waitms 4000
r_partinfo
screenshot p643fire_n1
waitms 2500
screenshot p643fire_n2
waitms 500
cl_maxfps 0
waitms 2500
emit_list
waitms 6000
echo ^5=== N fps
emit_list
cl_maxfps 100
set vbsp_emit_fire 1
echo ^5=== D dune
map surf_dune
waitmap 600
waitms 2000
menu_restart
ui_close
set hud_speed 0
set hud_energy 0
set hud_keys 0
noclip
// between two of its braziers (-11406 and -11886, 15997, 14748), looking at the first
setpos -11606 15997 14790 10 0 0
waitms 6000
emit_list
r_partinfo
waitms 2500
screenshot p643fire_d1
waitms 2500
screenshot p643fire_d2
waitms 2500
echo ^5=== C classics2
map surf_classics2
waitmap 600
waitms 2000
menu_restart
ui_close
waitms 5000
emit_list
echo ^5=== O orbs
set vbsp_emit_flame 0
map surf_anubis
waitmap 600
waitms 2000
menu_restart
ui_close
set hud_speed 0
set hud_energy 0
set hud_keys 0
noclip
setpos -5184 3904 560 5 0 0
waitms 6000
emit_list
r_partinfo
waitms 2500
screenshot p643fire_o1
waitms 2500
screenshot p643fire_o2
waitms 500
cl_maxfps 0
waitms 2500
emit_list
waitms 6000
echo ^5=== O fps
emit_list
cl_maxfps 100
echo RIGDONE
quit
