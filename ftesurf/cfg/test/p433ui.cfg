// P433UI -- Patch 433, the board's `line` column on screen: surf_aura stage 2 online
// against the p433line stub (port 8396), row 0 ticked, the board held open.
// Screenshot p433ui_board.png: `line` right of `why`, a tick in row 0's box, row 1
// (no recording) with no box.  Then the board shut: p433ui_world.png, the line in
// the world from where the player stands.
//
// RESULT (2026-09-22): cols 87 (the whole table); `line` right of `why`, row 0 a green
//  tick in its box, row 1 (`none`) no box.  The world shot draws 0 segments: stage 2's
//  line is out of view from the spawn -- p433line L6 is the in-world witness.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p433ui
developer 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0
set run_resume 0
sv_public 0
sv_port 27690
set lobby_dir "http://127.0.0.1:8396"

wait 200
map surf_aura
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 1000
scores legs
scores open
scores tab online
scores leg 2
scores refresh
waitms 3000
scores line 0
waitms 2000
screenshot screenshots/p433ui_board.png
waitms 500
scores close
waitms 1000
scores lines
screenshot screenshots/p433ui_world.png
waitms 500
quit
