// Patch 418 -- TWO RUNS, ONE NETCHAN: what happens when the next run finishes
// while the last one's evidence is still on the wire.
//
// This is not an exotic case.  A sidecar goes out at one <=768-byte chunk per
// server request, so a two-minute run is ~459 round trips -- 25 s at 30 ms RTT,
// 80 s at 150 ms -- and a bhop run is twenty seconds long.  On the Pi the
// second request lands mid-stream routinely; on a LAN it never does, which is
// why every earlier arm in this family missed it.
//
// FORCED, because loopback is too fast to race by hand.  Run A idles at the
// start for four minutes so its sidecar is ~750 KB, and `cl_maxfps 10` at the
// finish slows the drain to ~30 KB/s -- about 25 seconds, which is longer than
// run B takes end to end.
//
// THE FIRST CUT OF THIS ARM USED `cl_netfps 10` AND MEASURED NOTHING: 308,715
// bytes went out in 4 seconds, which is ~100 chunks per second, which is
// cl_maxfps.  The upload cadence follows the CLIENT'S FRAME RATE on loopback,
// not its packet rate -- CL_NextUpload is re-entered from the `nextul`
// stufftext and the chunk rides the next outgoing packet either way.  On a real
// link the round trip dominates instead and the reviewer's arithmetic (25 s at
// 30 ms RTT, 80 s at 150 ms for a two-minute run) is the number that matters;
// here the frame rate is the only knob that reaches it.
//
// Start the server first, from C:\FTESurf (no cfg -- it has to outlive the
// client, and p418sv.cfg quits at 120 s):
//   C:\FTEQuake\fteqwsv64.exe +set sv_port 27696 +set sv_public 0
//     +set developer 1 +set sv_cheats 1 +set rec_enable 1
//     +set rec_runarchive 1 +set run_evidence_ul 1 +set sv_playerslots 4
//     +set log_enable 1 +set log_dir logs +set log_name p418racesv
//     +map bhop_eazy
//
// PRE-REGISTERED PREDICTIONS
//  R1  the server's `Receiving <A>.view` and `<A>.view upload completed` lines
//      name THE SAME runid.  Before this fix the completion line named run B,
//      because the destination was overwritten under an open handle: A's bytes,
//      B's name, and every later file one destination out of step.
//  R2  the server logs `sv_recupload: <n> is still sending <A>.view` -- the
//      refusal, which is the whole change.
//  R3  run B ends up with a .rcpt and NO .view.  `rcptcheck` reports 0 faults
//      for it: an absent sibling is a file that was not sent, which is not the
//      same claim as a file that does not match.
//  R4  run A's uploaded .view matches the digest ITS receipt committed to.
//      (This is the one that catches a "fix" that just dropped the bytes.)
//  R5  the .view that arrives is >600 KB -- i.e. the race window was real and
//      the arm did not accidentally measure two instant uploads.
// FALSIFIED IF the completion line names run B, if B's .view exists, if A's
//   digest disagrees, or if no refusal is logged (the window closed early and
//   the arm proved nothing).
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p418race
developer 1
cl_idlefps 0
cl_maxfps 100
set rec_enable 1
set rec_hid 1
set rec_upload 1
name "^3P418"

waitms 6000
connect 127.0.0.1:27696
waitms 14000

echo ================================ P418 RACE -- run A, start
cmd zone_goto 0
waitms 2000
setpos -352 -352 144 0 335.3 0
waitms 2000
+jump
waitms 700
-jump
waitms 2000
cmd timer

echo ================================ P418 RACE -- run A idles to fatten the sidecar
// FOUR MINUTES, not ninety seconds.  The sidecar is the clock here: at 100 fps
// it grows ~3 KB per second of run, and the upload drains at ~30 KB/s on
// loopback even at cl_maxfps 10 (measured -- several chunks ride one frame when
// the server has queued more than one `nextul`).  Run B needs ~15 s to start
// and finish, so run A needs a sidecar worth more than that: ~750 KB.
waitms 30000
waitms 30000
waitms 30000
waitms 30000
waitms 30000
waitms 30000
waitms 30000
waitms 30000

echo ================================ P418 RACE -- run A, fly to the end zone
noclip
waitms 500
+forward
waitms 1500
waitms 2900
waitms 2000
-forward
// THE WINDOW OPENS HERE.  The end zone was touched during the flight above, so
// the receipt is written and the upload is already running; dropping the frame
// rate now stretches what is left of it across run B.
cl_maxfps 10
waitms 1500
cmd timer
waitms 1000

echo ================================ P418 RACE -- run B, start (A is still uploading)
noclip
cmd zone_goto 0
waitms 1500
setpos -352 -352 144 0 335.3 0
waitms 1500
+jump
waitms 700
-jump
waitms 2000
cmd timer

echo ================================ P418 RACE -- run B, fly to the end zone
noclip
waitms 500
+forward
waitms 1500
waitms 2900
waitms 2000
-forward
waitms 1500
cmd timer

echo ================================ P418 RACE -- let A finish
cl_maxfps 100
waitms 30000
waitms 15000

echo ================================ P418 RACE done
waitms 1000
quit

// RESULT (2026-09-21, both arms measured on loopback):
//   ALL FIVE HELD, and the negative control -- the same arm against a build
//   with the guard compiled out -- reproduced the defect exactly.
//
//   WITH THE GUARD (log p418racesv.log, 06:14-06:15):
//     R1  `Receiving ...20260921-061051-0.view` / `20260921-061051-0.view
//         upload completed.`  Same runid on both lines.
//     R2  `sv_recupload: 1 is still sending
//         data/evidence/bhop_eazy/20260921-061051-0.view -- not asking again`,
//         logged 11 s before the completion.
//     R3  run B (20260921-061506-0) has a .rcpt and no .view.  rcptcheck reads
//         both receipts: `2 receipt(s) checked, 0 with faults`.
//     R4  `20260921-061051-0.view matches the committed digest (833386 bytes)`.
//     R5  833,386 bytes, so the window was real: 16 s of upload against ~15 s
//         for run B to start and finish.
//
//   WITHOUT IT (log p418noguard.log, 06:22, `if (0)` over the guard):
//     `Receiving ...20260921-061806-0.view` ... `20260921-062221-0.view upload
//     completed.`  TWO DIFFERENT RUNIDS ON THE TWO LINES.  What is on disk is
//     833,389 bytes under run A's name -- the handle was opened before the
//     rename, so the bytes went to the right file and only the destination
//     moved -- and `20260921-062221-0.view`, which the server says completed,
//     does not exist.  Run B's evidence is lost silently and the log records a
//     file that was never written.
//
//   WHAT THE CONTROL DID NOT SHOW, said plainly: at `run_evidence_ul 1` there
//   is one destination, so the damage stops at "B lost, log wrong".  The
//   name/content shift the review describes needs the two-slot form, where the
//   completion promotes `uploadnext` and every later file is filed one
//   destination out of step.  That was read from the code, not measured here.
//
//   TWO HARNESS TRAPS, both of which cost a run of this arm:
//   - `cl_netfps 10` does NOT slow the upload.  Chunks ride the client's FRAME
//     rate on loopback (~100/s at cl_maxfps 100, measured 308,715 bytes in 4 s);
//     the packet rate is not the limiter until a real round trip is.
//   - A RUNNING DEDICATED SERVER HOLDS C:\FTEQuake\fteqwsv64.exe, so
//     build.ps1's deploy fails with "being used by another process" and the
//     next arm silently measures the PREVIOUS binary.  Two of the runs above
//     were wasted on that before the copy error was read.  Kill the server
//     before building, and check the deploy line.

// RESULT, SECOND USE (2026-09-21, the same arm against a `run_evidence_ul 2`
// server -- logs/p418race2.log).  This is the arm for the defect two reviewers
// found independently in the version above: the server asks for a run's SECOND
// file only when its first has arrived, and the bare `rec_ul_send` it used to
// send was answered with whatever the client had armed LAST -- which, after the
// next run's `rec_ul_arm -`, was the next run's sidecar.  Run A's journal
// destination would have received run B's camera file, and the checker would
// have called that a digest mismatch against a player who did nothing wrong.
//
//   The request now names the run and the kind (`rec_ul_send <nonce> view|hid`),
//   the client answers only from the slot that matches, it holds four slots
//   (two runs), and the staged files of the previous run are no longer deleted
//   at the next run's end.  Measured, 07:03-07:04:
//     `Receiving ...065931-0.view` / `... upload completed, 833384 bytes` /
//     `Receiving ...065931-0.hid`  / `... upload completed, 1901 bytes`,
//     with `sv_recupload: 1 is still sending ...065931-0.view -- not asking
//     again` for run B in between.
//   The arriving `.hid` opens `FTESURF-HID 1` and rcptcheck reports
//   `20260921-065931-0.hid matches the committed digest (1901 bytes)`.  Both
//   runs' staged files survived (four files, two nonces), which is the other
//   half of the fix.
//
//   AND THE PRE-FIX RUN IS NOT A STORY: an earlier pass of this same arm, at
//   06:41 on the build before the protocol change, left
//   `data/evidence/bhop_eazy/20260921-063713-0.hid` -- 2109 bytes, opening
//   `FTESURF-VIEW 2`, sha256 decfdcb9635833ac..., which is EXACTLY the
//   `signed view` digest in run B's receipt (20260921-064128-0.rcpt).  Run A's
//   journal destination received run B's camera file, and `rcptcheck` said
//   `20260921-063713-0.hid hashes to decfdcb9635833ac, the receipt commits to
//   f5d95585213b26ac` -- a digest mismatch reported against a player who did
//   nothing but finish two runs.  No cheat, no crafted client, no artificial
//   latency beyond the frame-rate knob above.  (Kept out of the tree; the
//   digests above are the record.)

// RESULT, THIRD USE (2026-09-21 07:44, logs/p418r4.log) -- a fourth review
// round, on the version the third produced, and this arm again:
//   `...074022-0.view upload completed, 833425 bytes` then
//   `...074022-0.hid upload completed, 1901 bytes`, run B refused in between,
//   and FOUR staged files under TWO nonces at the end.
//   rcptcheck on run B now SAYS what it used to pass over in silence:
//   `commits to a view digest, and no view is on this host`.  An upload that
//   was never sent is not a fault -- but it was previously indistinguishable
//   from a host with uploads switched off, which is the one thing a client
//   that declines everything would want.
//
//   AND A FINDING THAT WAS NOT ONE, kept because the reasoning is worth more
//   than the verdict: one reviewer traced `rec_rp_ulkeep = rec_rp_nonce` to a
//   use-after-free -- the nonce is a zoned string that the same block frees
//   forty lines later -- and predicted this arm would show run A's staged files
//   deleted at run B's end.  It does not, in three runs.  The reason is that
//   `strunzone` is a NO-OP whenever QCGC is defined (pr_bgcmd.c:4963), which it
//   unconditionally is; the global keeps the string reachable. The assignment
//   now zones its own copy anyway: the measurement says the code was right, and
//   the only thing that made it right was a #define in a repo we do not own.

