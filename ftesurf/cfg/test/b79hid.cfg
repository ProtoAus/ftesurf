cfg_save_auto 0
// BUILD 79 -- can the raw input journal still be switched off from the console?
//
// WHAT THIS IS FALSIFYING.  Build 78 moved the input profile onto sendevent and
// its essay says one rule closes both holes `cl_nocsqc 1` opened.  It does.  What
// it left untouched, one userinfo key over, is the narrower and cheaper forgery:
//
//     rec_hid 0                 the journal is off; no .hid will be written
//     setinfo rechid 1          ...and the server is told one was
//
// That run has an honest CSQC, so it reports its input profile, so build 78's
// silence rule never fires and TF_NOPROFILE is never set.  Its `rechid` key says
// "1", and SV_TimerJournal tested for a literal "0".  It ranked, with no raw
// input journal behind it at all.  One console line, and the entire P1 evidence
// chain -- the thing every Layer 3 statistic is computed from -- is gone.
//
// IT IS WORSE THAN inprof's WAS, BECAUSE OF THE CACHE.  Rec_HidReport sends on
// change against rec_rp_hidsent.  With rec_hid already 0 the honest 0 has been
// sent and cached, so when the key is then forged to "1" the client's own
// Rec_HidOK() still answers 0, the cached compare still hits, and CSQC never
// speaks again.  Nothing corrects the lie for the rest of the session -- where
// `inprof` at least got resent whenever any input cvar moved.
//
// Build 79 adds no check.  It moves the DECISION onto sendevent("rechid","f",v)
// against CSEv_rechid_f, the same channel and the same argument as build 78: a
// console produces clc_stringcmd and cannot produce clcfte_qcrequest, and the
// csprogs that fills the event in is md4-pinned by the server and downloaded by
// the client.  The userinfo key is still written and is now diagnostic only.
//
// `cmd timer` prints both channels since build 79:
//
//     journal: key "<what userinfo says>"  said <0 = CSQC never spoke>
//              hid <what CSQC reported>  nojournal <latched>  would <live>
//
// `would` is computed from `said`/`hid`.  `key` decides nothing.  The two
// disagreeing is an attempted forgery displayed rather than inferred.
//
// PRE-REGISTERED:
//
//   A  CONTROL, AND IT IS ALSO THIS FILE'S OWN FALSIFIER TWICE OVER.  Stock
//      install, journal on.  MUST read `said 1  hid 1  would 0`.
//
//      `said 0` here means the event did not survive at all and the fleet is
//      stamping TF_NOJOURNAL on every run -- the pairing is a function NAME no
//      compiler checks, so this is the arm that catches a typo in either end.
//      `hid 0` here means this install has no accepted consent record, in which
//      case Rec_HidOK() is answering honestly and NOTHING BELOW MEANS ANYTHING:
//      every arm would read hid 0 for a reason this file is not testing.  That is
//      the b72prof latent-fragility note applied in advance -- and it cannot be
//      fixed by writing rec_terms, which default.cfg:2470 forbids because that
//      cvar IS the archived consent record.  Run it on an install that accepted.
//
//   B  HONEST OFF.  rec_hid 0, key left alone.  MUST read `key "0"  said 1
//      hid 0  would 1`.  This is the build-58 behaviour unchanged, and it is
//      what separates "build 79 closed the forgery" from "build 79 fires on
//      everybody" -- without it, a would 1 in arm C proves nothing.
//
//   C  THE FORGERY.  Still in B's state, type the key clean: setinfo rechid 1.
//      MUST read `key "1"` -- which is exactly what build 78 decided on and
//      accepted -- beside `said 1  hid 0  would 1`.  THIS IS THE WHOLE PATCH:
//      the key says journalling, CSQC says otherwise, the server believes CSQC.
//
//   D  RECOVERY, AND THE PROOF THAT THE KEY WAS NEVER SUFFICIENT.  rec_hid 1.
//      MUST read `hid 1  would 0`.
//
//      Note what this arm CANNOT show: the key reads "1" here and it read "1" in
//      arm C, because a forged claim of journalling and an honest one are the
//      same four bytes.  The `key` column is identical across the forgery and
//      the recovery; only `hid` moves.  That is not a weakness of the fixture,
//      it is the argument for build 79 in one line -- there is no reading of
//      that key, however careful, that could have told those two states apart.
//
//      It is also the cache arm.  rec_hid moving 0 -> 1 is a cache miss, so both
//      halves are resent; a stale `hid 0` here would be the event having been
//      sent outside the cache's knowledge, and it would DEMOTE A PLAYER WHO HAD
//      JUST TURNED THEIR JOURNAL BACK ON.  That is the direction that must not
//      fail.
//
//   E  SILENCE.  cl_nocsqc 1 and a fresh map, so CSQC never initialises.  MUST
//      read `said 0  would 1`.  Build 78 already made this run unrankable, but
//      by way of TF_NOPROFILE -- the journal bit was not set and the board was
//      told nothing about the missing .hid.  Now the true statement is made.
//      Expect the key to still read "1": userinfo survives a map change while
//      the event does not, so this row shows a clean key beside a faulted
//      verdict with no forgery involved at all.
//
//   F  THE LATCH.  Everything above reads the live predicate, which is the only
//      thing a config can observe on a zoned map (zone_goto and setpos both void
//      via SV_TimerWarped, so no run can be FINISHED from here).  This arm arms
//      and starts a real run under the arm-C forgery and asks whether the latch
//      actually converts `would` into the bit that reaches the board.
//      MUST read `nojournal 1` with `key "1"`.
//
// FALSIFIED IF: A reads said 0 (the channel is broken and the fleet demotes
//      everything) or hid 0 (no consent record -- wrong install, rerun); or B
//      reads would 0 (the honest-off path regressed); or C reads would 0, which
//      is the hole this build exists to close; or D reads would 1 (the cache
//      hides the recovery and honest players stay demoted); or F reads
//      nojournal 0 (the predicate is right and nothing consumes it).

exec cfg/test/_quiet.cfg

developer 1
log_developer 1
log_enable 1
log_dir logs
log_name b79hid
cl_maxfps 100
sv_cheats 0
con_notifylines 0
con_notifytime 0.01

// Pinned so a stray archived value cannot make an arm fault for a reason this
// file is not testing.  cfg_save_auto 0 above is protecting real user data:
// rec_hid is the player's own switch and arm D restores it, but a crash before
// arm D must not leave somebody's journal off.
rec_hid 1
cl_nocsqc 0

wait 200
map bhop_eazy
waitmap 600
waitms 5000

echo ^5=== B79 ARM A: CONTROL, stock install, journal on.  Expect said 1, hid 1, would 0.
waitms 2500
cmd timer
waitms 1500

echo ^5=== B79 ARM B: HONEST OFF -- rec_hid 0, key untouched.  Expect key "0", hid 0, would 1.
rec_hid 0
waitms 2500
cmd timer
waitms 1500

echo ^5=== B79 ARM C: THE FORGERY -- setinfo rechid 1 over a journal that is off.
echo ^5===          Expect key "1", said 1, hid 0, would 1.  THIS IS THE PATCH.
setinfo rechid 1
waitms 2500
cmd timer
waitms 1500

echo ^5=== B79 ARM D: RECOVERY AND THE CACHE -- rec_hid 1.  Expect hid 1, would 0.
rec_hid 1
waitms 2500
cmd timer
waitms 1500

echo ^5=== B79 ARM F: THE LATCH -- re-forge, arm a real run, expect nojournal 1.
rec_hid 0
waitms 1500
setinfo rechid 1
waitms 2000
cmd zone_goto 0
waitms 1500
+forward
waitms 1200
cmd timer
waitms 1500
-forward
waitms 500
rec_hid 1
waitms 1500

echo ^5=== B79 ARM E: SILENCE -- cl_nocsqc 1 on a fresh map.  Expect said 0, would 1.
cl_nocsqc 1
waitms 2000
map bhop_eazy
waitmap 600
waitms 6000
cmd timer
waitms 2000

echo ^5=== END OF RUN ===
cl_nocsqc 0
rec_hid 1
waitms 1000
quit

// ============================================================================
// MEASURED 2026-09-14, one process, two map loads, QC build 79.  Every arm met
// its pre-registered expectation.
//
//   arm  key   said  hid  nojournal  would  exp
//   A    "1"    1     1       0        0     0   CONTROL
//   B    "0"    1     0       0        1     1   honest off
//   C    "1"    1     0       0        1     1   THE FORGERY
//   D    "1"    1     1       0        0     0   recovery + cache
//   F    "1"    1     0       1        1     1   the latch, on a started run
//   E    "1"    0     0       0        1     1   cl_nocsqc, silence
//
// (F is measured before E in the script because E needs a fresh map load and
// does not come back.  nojournal reads 0 in every arm but F because the latch
// runs at SV_TimerStart and at the finish, and F is the only arm that starts a
// clock -- which is precisely why `would` exists.)
//
// ARM A IS WHAT MAKES THE REST READABLE, AND IT ANSWERED BOTH OF ITS QUESTIONS.
// `said 1` means the qcrequest survived -- the CSEv_rechid_f pairing is spelled
// the same at both ends, which no compiler checked and which would otherwise
// have stamped TF_NOJOURNAL on every run on the fleet.  `hid 1` means this
// install has a real accepted consent record, so Rec_HidOK() is answering the
// question this file thinks it is asking.
//
// ARM C IS THE FINDING.  `key "1"` is exactly the string build 78's
// SV_TimerJournal read and accepted -- it tested for a literal "0" -- sitting
// beside `hid 0`.  Same console line, same client, opposite verdict.  The run
// that ranked with no .hid yesterday is demoted today.
//
// ARMS C AND D TOGETHER ARE THE ARGUMENT FOR THE WHOLE PATCH, IN ONE COLUMN.
// The `key` reads "1" in both.  A forged claim of journalling and an honest one
// are the same four bytes, so no reading of that key, however careful, could
// ever have told the two states apart -- and build 58's reader WAS careful, which
// is the point.  Only `hid` moves, and `hid` is the half a console cannot write.
//
// ARM D ALSO CARRIES THE FAILURE DIRECTION THAT MATTERS.  rec_hid 0 -> 1 is a
// cache miss in Rec_HidReport and both halves are resent; had the event been
// sent outside that cache, arm D would read a stale `hid 0` and a player who
// had just turned their journal back ON would stay demoted for the rest of the
// session with nothing on screen to say why.  It reads hid 1.
//
// ARM E IS BUILD 78'S HOLE, NOW SAID CORRECTLY RATHER THAN MERELY SURVIVED.
// `cl_nocsqc 1` was already unrankable after build 78 -- but by way of
// TF_NOPROFILE, with the journal bit clear and the board told nothing about the
// missing .hid.  The same row now reads `said 0  would 1` on the journal line
// AND `inprof: said 0` on the profile line: two layers, two true statements, one
// cause.  Note the key still reads "1", carried across the map load from arm F's
// forgery -- userinfo survives a reconnect and the event does not -- so this row
// shows a clean key beside a faulted verdict with no forgery in play at all.
//
// WHAT THIS DOES NOT MEASURE, stated so a later reader does not assume it did.
// No run was finished: a config cannot cross an end zone on a zoned map without
// noclip, and TF_CHEAT would beat every other tag if it did.  So this file
// proves the predicate, and arm F proves the latch consumes it, but the row
// surfd actually refuses is checked in test_replays.py's certifiable() suite and
// not here.  Nor does it say anything about whether a .hid that IS written is
// honest -- that is hidcheck.py's question and P293/P312's.  This file only asks
// whether the answer to "is one being written at all" can still be typed.
// ============================================================================
