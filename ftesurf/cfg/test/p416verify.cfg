// Patch 416 -- THE VERIFIER READS A FILE WITH THE NEW RECORDS IN IT.
//
// The header key and the body record are additive, and the plan's standing rule
// is that additive is safe for reccheck and NOT automatically safe for the
// verifier: pm_recsim skips what it does not know, so a record that changes the
// run's continuity has to be taught to it in the same patch.  `nonce` changes
// neither physics nor continuity -- but the body one lands BETWEEN a `pause`
// and its `session`, which is the one place the verifier runs a state machine,
// so it is measured rather than argued.
//
//   cd C:\FTESurf; C:\FTEQuake\fteqwsv64.exe +set sv_public 0 +set sv_port 27698
//     +set log_enable 1 +set log_dir logs +set log_name p416verify
//     +set rec_enable 0 +map bhop_eazy +exec cfg/test/p416verify.cfg
//
// SUBJECTS, in data/p416/ (untracked), from this patch's own arms:
//   ms.rec      p416ms.cfg's finish: v10, `pause server`, a body `nonce`
//               between it and `session 2`, flags 147713.
//   s.rec       p416nonce.cfg's finish: v9, header nonce, flags 131329.
//   c.rec       p416ctl.cfg's: the same route on a client that cannot answer.
//   rewind.rec  p416rewind.cfg's: a save, a load and a retry in one run --
//               the file the two rewind paths produce, flags 131465.
//   twice_S.rec p416twice.cfg's second run on one map load.
//
// ALL THREE ARE NOCLIPPED and therefore diverge.  That is not a defect of this
// arm: what is being measured is that the verifier READS them -- the same
// verdict, for the same reason, as the same files without a nonce would get.
//
// PRE-REGISTERED PREDICTIONS
//  V1  no verdict is REFUSE, and no line mentions `nonce`.  A REFUSE would mean
//      the record reached a version gate or a parse that this patch broke.
//  V2  ms.rec still prints its Patch 367 session line ("session 2 ... parked at
//      clock ..."), i.e. the body record did not disturb the pause/session pair
//      it sits between.
//  V3  s.rec and c.rec reach the same verdict as each other: the answer bit is
//      not something the replay reads.
// FALSIFIED IF any subject REFUSEs, if ms.rec loses its session line, or if
//   s.rec and c.rec differ.
developer 1
echo ================================ P416 V -- ms.rec (v10, body nonce)
pm_verify data/p416/ms.rec
echo ================================ P416 V -- s.rec (v9, header nonce, answered)
pm_verify data/p416/s.rec
echo ================================ P416 V -- c.rec (v9, header nonce, unanswered)
pm_verify data/p416/c.rec
echo ================================ P416 V -- rewind.rec (save, load and a retry)
pm_verify data/p416/rewind.rec
echo ================================ P416 V -- twice_S.rec (the second run of a map session)
pm_verify data/p416/twice_S.rec
echo ================================ P416 V done
quit

