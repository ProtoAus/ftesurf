// cfg_save_auto 0: this run sets archived cvars; never let it write them into ftesurf.cfg
cfg_save_auto 0
// p668precip -- func_precipitation's rain and snowfall (Patch 668).  tools/p668precip.py grades it.
// Each map is loaded with vbsp_emit_precip 0, the view photographed bare, then switched on.
// surf_zion: one volume of rain, renderamt 255 (2,250 drops a second).  Its top is over the
// sky's underside (a side the plugin names sky/tools/toolsskybox) and part of it is roofed.
//   R  bare shot r0; on, 8 s, emit_list; shots r1 and r2; emit_list and r_partinfo
//   V  vid_restart takes the shader and the blocks: 12 s on, both are back
// surf_misc: one volume of rain drawn up to a metal ceiling with nothing over it.
//   M  6 s on: that ceiling is a roof, not sky
// surf_voyager: one volume of snowfall, renderamt 100.
//   S  from inside it: bare shot s0; on, 12 s, emit_list, r_partinfo, shot s1
//   O  from 600 units outside it: emit_list, 6 s, emit_list
// (The rig's window is 1920x1111 whatever vid_width says; the grader refuses a smaller frame.)
log_dir "logs"
log_name "p668precip"
log_enable 1
developer 1
log_developer 1
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000
cl_maxfps 100
cl_idlefps 0
sv_cheats 1
r_bloom 0
con_notifylines 0
scr_sshot_type png
fov 90
wait 200
// Nothing else that moves.
set vbsp_emit_stack 0
set vbsp_emit_fire 0
set vbsp_emit_dust 0
set vbsp_emit_smoke 0
set vbsp_emit_precip 0
map surf_zion
waitmap 600
waitms 2000
menu_restart
ui_close
set hud_speed 0
set hud_energy 0
set hud_keys 0
noclip
setpos 3040 -5024 8050 -20 0 0
waitms 5000
screenshot p668precip_r0
waitms 800
echo ^5=== R rain
set vbsp_emit_precip 1
waitms 8000
emit_list
screenshot p668precip_r1
waitms 2500
screenshot p668precip_r2
waitms 800
emit_list
r_partinfo
echo ^5=== V restart
vid_restart
waitms 12000
emit_list
r_partinfo
waitms 300
echo ^5=== M metal ceiling
map surf_misc
waitmap 600
waitms 2000
menu_restart
ui_close
noclip
setpos -6613 4562 6500 -20 0 0
waitms 6000
emit_list
waitms 300
echo ^5=== S snow
set vbsp_emit_precip 0
map surf_voyager
waitmap 600
waitms 2000
menu_restart
ui_close
set hud_speed 0
set hud_energy 0
set hud_keys 0
noclip
setpos 6472 -1056 -9200 0 0 0
waitms 5000
screenshot p668precip_s0
waitms 800
set vbsp_emit_precip 1
waitms 12000
emit_list
r_partinfo
screenshot p668precip_s1
waitms 800
setpos 4935 -1056 -9200 0 0 0
waitms 500
echo ^5=== O outside
emit_list
waitms 6000
emit_list
echo RIGDONE
quit
