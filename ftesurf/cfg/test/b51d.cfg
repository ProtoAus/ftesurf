// b51d -- were the types NEVER CREATED, or created and then unloaded?
//
// b51c proved the split: the same file exec'd from the console at
// RESTRICT_LOCAL gives "effect exists" and 1811 particles; exec'd by CSQC's
// localcmd at map load it gives "". But the map-load exec DOES build the
// ftesurf_dot_blend shader, which only a parsed r_part block with that texname
// can do -- so something is creating types and something is then invalidating
// them, OR the shader comes from somewhere I have not found.
//
// r_exportalleffects settles it, because P_ExportAllEffects_f writes a block
// per type using PScript_Query(assoc, 1, ...) -- and that returns an EMPTY
// STRING for a type whose loaded flag is 0 (p_script.c:2372-2373).  So:
//
//   no `r_part .ftesurf_*` lines at all   -> never created
//   35 lines with EMPTY {} bodies         -> created, then unloaded
//   35 lines with full bodies             -> loaded, and the bug is in the
//                                            lookup or the precache refresh
//
// NO CONSOLE EXEC IN THIS RUN.  That is the whole point -- the previous run
// contaminated the table before the dump.

log_dir  "logs"
log_name "b51d"
log_enable 1

developer 2
log_developer 1
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000
cl_maxfps 0
cl_idlefps 0
cl_yieldcpu 0
sv_cheats 1

map surf_anubis
waitmap 600
waitms 10000

echo ^5=== 1  CSQC localcmd exec only -- is the effect there?
emit_test dustmote_0 100
waitms 1500
r_partinfo
waitms 1000

echo ^5=== 2  dump every type the engine holds, uncontaminated
r_exportalleffects
waitms 2000

echo ^5=== END ===
waitms 500
quit
