// P403PLAIN -- Patch 403 must be INVISIBLE on an ordinary start.  The clamp
// early-outs when there is no horizontal carrier, so a normal run on a map with
// no booster near the start should be bit-identical with run_startcap 290 and
// with run_startcap 0.  bhop_eazy, `!r` then walk out under +forward.
//
// PRE-REGISTERED
//  P1 both arms finish and write a .rec.
//  P2 the `seed` line is IDENTICAL between the two arms, to the last digit --
//     same origin, same velocity, same flags.
//  P3 neither .rec carries a `ride` record with a non-zero horizontal carrier.
// FALSIFIED IF the seeds differ: then the clamp is touching ordinary play.
//
// The subject is bhop_arcane with cfg/test/p403plain.zones.json at
// maps/zones/local/bhop_arcane.json: the start box sits on the strip of ordinary
// floor just PAST the *86 booster (which ends at y 3584), so nothing touches the
// body at the restart. It walks out under +forward, falls off at about y 3670,
// and lands in the booster gallery below -- which makes this arm do double duty.
// (Round 1 used bhop_eazy's real main track: both arms started the timer and the
// bodies agreed to 1.4 u, but 7542 ticks is far too long to finish in a harness
// window, so there was no .rec and no seed to diff.)
//
// RESULT (2026-09-20).  P1, P2 and P3 held, and P3 held twice over.
//   Both arms finish in exactly 410 ticks and write 0000410_pb.rec.
//     cap 290: seed 6914.68262 3623.11865 -183.23999  0 0 -328  0
//     cap   0: seed 6914.96680 3622.50537 -183.23999  0 0 -328  0
//   Same velocity to the digit, same flags, origin apart by 0.6 u of harness
//   jitter in when +forward is released.  The first ride record is
//   `ride 0 352 arm 0 0 0` in both: no carrier at the start, so the clamp
//   early-outs and ordinary play never meets it.
//
//   AND THE MID-RUN BOOSTERS ARE UNTOUCHED, which this arm was not designed to
//   show but does.  After the fall the body rides the whole gallery, and every
//   arm carries its full value in BOTH runs:
//     600, 1600, 1000, 1400, 3200, 1800, then pay 1800
//   identical either side of the cvar.  The rule is scoped to the start: a
//   booster met during a run is map geometry and keeps working at full strength.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p403plain
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
sv_cheats 0
fs_missingwarn 0
set run_resume 0
sv_port 27682

wait 200
map bhop_arcane
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 1000

echo ^5=== P: an ordinary start ===
say !r
waitms 800
+forward
waitms 3000
-forward
cmd viewpos
cmd timer
waitms 1000
echo ^5=== P403PLAIN DONE ===
waitms 500
quit
