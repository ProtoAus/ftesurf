// MS2CL -- the rotation hold (WP11), client half (server: ms2sv.cfg).
// The client starts a run on surf_666 and stands still inside it.
// PREDICTIONS (server log, times from the surf_666 load):
//   ~60 s   "bhop_eazy waits for the runs in progress (at most 2 min)"
//   ~120 s  "bhop_eazy in one minute -- runs still going are paused; ..."
//   ~180 s  the change goes ahead: "parked ... (rotate, recording stream)"
//   bhop_eazy, the client idle: it rotates back ON TIME, 60 s (the control --
//   no run, no hold, no hold line)
//   back on surf_666: the offer; ms_resume, finish -> a v10 .rec with
//   `pauses rotate`, `sessions 1`, flags 16384, 0 faults.
// FALSIFIER: a change at ~60 s while the run is going; no change by the cap; a
//   hold on bhop_eazy; `server` instead of `rotate` in the pause.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name ms2cl
developer 1
cl_idlefps 0
cl_maxfps 100
rate  2000000
drate 5000000
vid_fullscreen 0
waitms 6000
connect 127.0.0.1:27631
waitms 12000
set rec_terms 1
echo ^5==== run, then stand ====
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 1000
-forward
waitms 55000
echo ^5==== held? ====
cmd timer
waitms 125000
echo ^5==== after the cap (bhop_eazy) ====
cmd timer
waitms 85000
echo ^5==== back on surf_666: resume ====
cmd ms_resume
waitms 3000
+forward
waitms 5000
-forward
waitms 2000
cmd timer
echo ^5==== done ====
disconnect
waitms 500
quit

