// P431TRAIL -- Patch 431 A8 (split out of p431win, whose `scores leg 1` picked leg 19
// before the legs were derived): Scores_TrailerTicks reads a 16 KB tail, not the whole
// file.  Needs data/runs/surf_rookie/main/last.rec = a copy of r47 (6.7 MB, 8:26.580;
// the harness copies it in and removes it after).  log_name p431trail (new) and
// p431trail-ctl (+set sv_csqc_progname csprogs_ctl431.dat).
//
// PRE-REGISTERED: the local main board lists a `last` row at 8:26.580 in both builds;
// new: the status after `=== A8 status ===` lands within 1 s of that echo; ctl ~13 s.
//
// RESULT (2026-09-22): both builds list `* 2 8:26.580 rec9 clean .../last.rec`.  The
//  prediction put the stall at the wrong line: the rows are scanned at the FIRST
//  refresh (`scores legs`), so the A8 echo is fast in both.  Measured instead: the join
//  to the first `scores:` line, ctl 16 s (20:55:11 -> :27) against new 3 s (:36 ->
//  :39), the cfg's own waits being 4.5 s.
cfg_save_auto 0
log_enable 1
log_dir logs
developer 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0
set run_resume 0
sv_public 0
sv_port 27680
set lobby_dir ""

wait 200
map surf_rookie
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 1000
scores legs
scores tab online
scores leg 0
waitms 300
echo ^5=== p431trail A8 status ===
scores tab local
waitms 500
echo ^5=== p431trail done ===
quit
