// PROBE_PROSURF -- does surf_prosurf's bonus-1 boost pad push the player at all?
//   ftesurf64.exe -WindowStyle Minimized +exec cfg/test/p414lift.cfg
// DIAGNOSTIC ONLY, no patch number claimed yet.  Rename to pNNN when the fix is.
//
// THE SUBJECT.  trigger_push hammerid 1150631, model *552, speed 2200,
// pushdir -90 0 0 (pitch -90 = straight UP), spawnflags 1 (allow clients).
// World AABB x -6944..-6464, y -7714..-7138, z -7648..-6240.  Bonus-1's start
// box is x -7200..-6944 over y -7520..-7264, z -7511.97..-7255.97 -- the pad
// ABUTS it on the +x face at x = -6944 with ZERO overlap volume, so leaving the
// box in +x is what crosses into it.
//
// NOT setpos.  trigger_push_touch returns early on MOVETYPE_NOCLIP, and setpos
// forces NOCLIP server-side (AGENTS.md) -- so a setpos probe would prove the pad
// refuses a noclipper, which it is supposed to do.  `say !b 1` is the player's
// own route to the bonus start and lands in WALK.
//
// PRE-REGISTERED.  Two independent witnesses, and the second one is the one that
// counts (p411push printed a textbook flip on a pad that never armed):
//  W1 `basevel: arm ... 0 0 2200` in the log = trigger_push_touch ran on THIS pad
//     and handed that carrier to the mover.  Absent => the touch never fires and
//     the brush/geometry is the answer, not the push code.
//  W2 `cmd viewpos` z RISES between the samples = the lift actually landed.
// FALSIFIED / INCONCLUSIVE IF the walk never leaves the start box: then neither
// witness says anything about the pad.  Check the x in the viewpos samples --
// it must pass -6944.
//
// RESULT 2026-09-20.  WRONG PAD, and the pad it did test WORKS.
//
// The report was "surf_prosurf b4" and b4 is BONUS 4, not bonus 1.  Bonus 4's
// pad is a different mechanism entirely (trigger_multiple + OnJump + AddOutput
// basevelocity, horizontal) -- see probe_b4jump2.cfg, which is the real subject.
// Kept because what it measured about bonus 1 is worth having.
//
//   W1 SILENT and the prediction was WRONG, not the code: a PURELY VERTICAL
//      carrier never cashes out (run_basevel_z is zeroed at the foot of every
//      SV_BaseVelocityFrame), so `basevel: paid` can never print for this pad.
//      The detector was mis-chosen.  A horizontal pad would have printed.
//   W2 POSITIVE AND LARGE.  Walking +x out of the box with no jump at all:
//        -6921.9 -7394.9 -7496.0   (just inside the pad)
//        -6742.5 -7394.9 -7020.9   (+475 u of rise in ~0.7 s)
//      and the prediction trace reached z -6334, i.e. about 1162 u of lift.
//      A walk cannot do that.  The pad fires and it fires hard.
//
// So bonus 1's vertical trigger_push is not broken.  Its shape is Source's: the
// engine applies basevelocity[2] as an ACCELERATION, not a launch
// (PMSrc_StartGravity), so it lifts you while you are inside and pays nothing
// horizontal on the way out.
//
// ONE THING WORTH CHASING SEPARATELY: the log shows
//   prederr: seq 440 origin off by 1141.56
//            (predicted -6621.6 -7394.9 -6334.0, server -7072.0 -7394.0 -7383.0)
// i.e. the client rode the lift and the server did not agree.  This was a LISTEN
// server, where AGENTS.md says prediction is not exercised properly, so the
// number is not trustworthy as it stands -- it wants the two-process
// client-vs-server rig before anyone calls it a bug.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p414lift
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
sv_port 27655
sv_cheats 1
set run_bv_debug 1
set run_resume 0
vid_fullscreen 0
waitms 5000
map surf_prosurf
waitmap 2400
waitms 3000
menu_restart
ui_close
waitms 1000

echo ==== A where does the main start put us ====
cmd viewpos
waitms 600

echo ==== B go to bonus 1 ====
say !b 1
waitms 2500
cmd viewpos
cmd timer
waitms 600

echo ==== C walk +x out of the box and into the pad ====
+forward
waitms 700
cmd viewpos
waitms 700
cmd viewpos
waitms 700
cmd viewpos
waitms 700
cmd viewpos
-forward
waitms 600
cmd viewpos
waitms 600

echo ==== D and again, with a jump, in case the report meant push-on-jump ====
say !b 1
waitms 2000
cmd viewpos
+forward
waitms 500
+jump
waitms 1400
cmd viewpos
-jump
waitms 700
cmd viewpos
-forward
waitms 700
cmd viewpos

echo ==== END ====
waitms 1000
quit
