// Patch 220 investigation -- the decisive experiment, with a debug shader.
//
// ftesurf/glsl/ftesurf_portal.glsl is TEMPORARILY modified: the left half of the
// screen paints the texcoord itself (vec4(stc, 0, 1) -- a red/green gradient),
// the right half paints the sampled texel as normal.  The original is beside it
// as ftesurf_portal.glsl.orig and MUST be restored after this run.
//
// The s1 doorway sits dead centre at 1280x720 (x ~= 607..672), so the split runs
// straight down the middle of it and one shot answers three questions:
//
//   left half GRADIENT, right half BLACK   -> the quad rasterises and its
//        texcoords are correct; the fault is the texture bound to s_refract.
//   both halves BLACK                      -> the quad is not drawing at all,
//        and every "the sample step is at fault" conclusion so far is wrong.
//   left half a FLAT colour, not a gradient-> tf.w is degenerate and the clamp
//        is pinning the lookup to a corner.

cfg_save_auto 0
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "p220dbg"
scr_sshot_type png
cl_yieldcpu 0
cl_maxfps 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0
vbsp_portal_render 1
r_portalfbo 1
r_refract_fbo 1
r_portalrecursion 2
r_portalmaxviews 2

waitms 2500

map surf_kitsune
waitmap 240
waitms 8000
sv_cheats 1

echo "@@@ P220DBG s1 entry, 100 units back -- the split doorway"
setpos -15360 -15252 870 0 270 0
waitms 3000
screenshot_mega p220dbg_s1 1280 720
waitms 800

echo "@@@ P220DBG closer, so the doorway fills more of the frame"
setpos -15360 -15300 870 0 270 0
waitms 3000
screenshot_mega p220dbg_s1_close 1280 720
waitms 800

echo "@@@ P220DBG hub exit"
setpos 0 -620 150 0 90 0
waitms 3000
screenshot_mega p220dbg_hub100 1280 720
waitms 800

echo "@@@ P220DBG DONE"
waitms 1000
quit
