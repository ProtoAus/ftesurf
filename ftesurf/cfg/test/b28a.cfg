// BUILD 28 / engine patch 213 -- what a config can actually prove.
//
// Two features were asked for and five defects were found on the way, four of
// them shipped in build 27 by patch 211.  A config cannot press a key or drag a
// title bar, so the instrument for the arrow gate is con_selftest, which drives
// the gate directly and pins what it answers.  Everything else here is a value
// read back, a screenshot, or the regression suite.
//
// The last line is `exit`, still: if the build is broken the run hangs, which is
// louder than any grep.

developer 1
log_developer 1
cfg_save_auto 0

wait 200

echo ""
echo "=== the new cvar, and the ones it has to agree with ==="
con_gripsize
con_scrollwidth
con_window_titlepad
con_window_rect
con_displaypossibilities
con_completionrows
wait 6
echo "--- (gripsize must be 16, window_rect must be \"64 64 960 640\") ---"
echo ""

echo "=== THE ARROW GATE -- the whole of item 2, measured ==="
echo "--- con_selftest drives Key_CompletionNav directly: first Up is the LAST"
echo "--- row, first Down the first, both wrap, the typed line is not rewritten,"
echo "--- and the gate declines on empty / no-match / history / mode 1 / mode 0."
con_selftest
wait 20
echo ""

echo "=== the grip clamps at both ends, live ==="
con_gripsize 0
wait 4
con_gripsize 64
wait 4
con_gripsize 16
wait 4
echo "--- (con_selftest already pinned 0->4 and 999->64; this is just the set path) ---"
echo ""

echo "=== a map, so the console has something to draw over ==="
map surf_aesthetic
waitmap 90
echo ""

echo "=== the console window itself.  toggleconsole so it is UP in the shot. ==="
con_notifylines 0
wait 6
toggleconsole
wait 30
screenshot b28_console_grip16
wait 20
echo ""

echo "=== and at the ENGINE default, which must reproduce build 27's layout ==="
con_gripsize 8
wait 20
screenshot b28_console_grip8
wait 20
con_gripsize 16
wait 10
toggleconsole
wait 10
echo ""

echo "=== regression: the three selftests ==="
con_selftest
wait 10
pm_selftest
wait 10
zone_selftest
wait 10
echo ""

echo "=== b28a done -- exiting via the command patch 211 added ==="
wait 20
exit
