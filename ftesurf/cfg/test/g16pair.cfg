// G16 -- the paired shot the whole patch is judged on.
//
// Same doorway, same eye position, same everything, twice: the Patch 210
// renderer and the Patch 208 one.  portal_hub_exit at 0 -520 184 from 100 units
// back, which is where an 88x88 aperture is big enough on screen to see what it
// is doing.  Every earlier run in this series aimed 245 units away and could not
// tell "painted nothing" from "painted the same black as the wall".
//
// What G15's magenta probe already settled, so it is not in question here:
//   - the aperture pass rasterises, and paints EXACTLY the quad.  The magenta
//     stopped at the doorway edges on all four sides.  The square box is gone.
//   - the $refraction lookup is a correct screen-space one: the probe's
//     0.4 < stc.x < 0.6 band landed in the middle of the aperture, not on some
//     arbitrary part of it, which is what a wrong tcgen would have given.
//   - the texture has content.  The far view's red geometry came through the
//     probe's 0.2-red tint as DARK red, which it could only do by being sampled
//     from the texture rather than drawn over it.
//
// So the open question is narrow and visual: does the far room in the aperture
// match what the old renderer showed through the same doorway?  If the two shots
// agree inside the doorway and differ outside it, Patch 210 does what it claims.
//
// r_portalfbo is CVAR_RENDERERLATCH so vid_reload is what applies it, and
// vid_reload is also what reparses the material -- which is why it is latched.

cfg_save_auto 0
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "p210_g16"
scr_sshot_type png
cl_yieldcpu 0
cl_maxfps 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0
r_speeds 2
vbsp_portal_render 1

waitms 2500

map surf_kitsune
waitmap 240
waitms 8000
sv_cheats 1

echo "@@@ G16 r_refract_fbo (must be 1, or the aperture samples a screen copy)"
r_refract_fbo
waitms 300

// ---------------------------------------------------------------- NEW (210)
echo "@@@ G16 NEW hub 100"
setpos 0 -620 150 0 90 0
waitms 3000
r_speeds_dump
waitms 400
screenshot_mega g16_new_hub100 1280 720
waitms 600

echo "@@@ G16 NEW hub oblique"
setpos -90 -620 150 0 55 0
waitms 2500
r_speeds_dump
waitms 400
screenshot_mega g16_new_oblique 1280 720
waitms 600

echo "@@@ G16 NEW s1 entry"
setpos -15360 -15252 870 0 270 0
waitms 2500
screenshot_mega g16_new_s1 1280 720
waitms 600

// ---------------------------------------------------------------- OLD (208)
echo "@@@ G16 switching to the Patch 208 renderer"
r_portalfbo 0
vid_reload
waitms 8000

echo "@@@ G16 OLD hub 100"
setpos 0 -620 150 0 90 0
waitms 3000
r_speeds_dump
waitms 400
screenshot_mega g16_old_hub100 1280 720
waitms 600

echo "@@@ G16 OLD hub oblique"
setpos -90 -620 150 0 55 0
waitms 2500
r_speeds_dump
waitms 400
screenshot_mega g16_old_oblique 1280 720
waitms 600

echo "@@@ G16 OLD s1 entry"
setpos -15360 -15252 870 0 270 0
waitms 2500
screenshot_mega g16_old_s1 1280 720
waitms 600

echo "@@@ G16 DONE"
waitms 1000
quit
