// Patch 817: a rewind after surf_dune's fail teleport put the run back in its start.
// A: the attempt fails into the start box (armed); the rewind opens on its line.
// S: a save at the cursor, before the fail. LOAD: that save, held, then released.
// GO: a second attempt fails; the rewind's go resumes it. NEW: a new run from the start.
// tools/p817failrewind.py grades it.
cfg_save_auto 0
name P817
fs_cache 0
log_enable 1
log_dir logs
log_name p817fail
cl_idlefps 0
cl_maxfps 1000
vid_fullscreen 0
waitms 3000
connect 127.0.0.1:27561
waitmap 60
waitms 8000
menu_restart
ui_close
hud_trail 1
hud_trail_prev 1
rec_savelock 1
cl_slpredict 1
hud_rewind_chase 0
waitms 1000
cmd zone_goto 0
waitms 400
+forward
waitms 2800
-forward
waitms 800
echo ==== P817 A ====
cmd timer
rewind
waitms 500
rewind status
trail
echo ==== P817 S ====
rewind seek -0.6
waitms 200
rewind status
rewind key 115
waitms 300
rewind key 115 up
waitms 1500
rewind status
saveloc
echo ==== P817 LOAD ====
+sl_hold
waitms 900
saveloc
cmd timer
trail
-sl_hold
waitms 300
trail
cmd timer
waitms 1500
echo ==== P817 GO ====
cmd zone_goto 0
waitms 400
+forward
waitms 2800
-forward
waitms 800
cmd timer
rewind
waitms 500
rewind seek -0.6
waitms 200
rewind key 13
waitms 300
rewind key 13 up
waitms 700
rewind status
cmd timer
waitms 2600
echo ==== P817 AFTER ====
rewind status
cmd timer
trail
waitms 500
echo ==== P817 NEW ====
cmd zone_goto 0
waitms 400
+forward
waitms 2000
-forward
cmd timer
waitms 500
echo ==== P817 END ====
quit
