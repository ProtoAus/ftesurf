waitms 80
cmd sl_save
waitms 80
cmd sl_save
waitms 80
cmd sl_save
waitms 80
cmd sl_save
waitms 80
cmd sl_save
waitms 80
waitms 800
echo p428hold: D1 demoted load
cmd sl_goto 2
waitms 700
cmd timer
waitms 500
echo p428hold: D2 list
cmd sl_list 1
waitms 800
echo p428hold: H1 hold a frame after the load
cmd sl_goto 3
waitms 700
cmd sl_hold
waitms 500
saveloc
waitms 300
cmd sl_holdoff
waitms 700
echo p428hold: H2 load and hold in one frame
cmd sl_load
cmd sl_hold
waitms 500
saveloc
waitms 300
cmd sl_holdoff
waitms 700
echo p428hold: H3 load, delete, hold
cmd sl_goto 3
cmd sl_del
cmd sl_hold
waitms 500
saveloc
waitms 300
cmd sl_holdoff
waitms 700
echo p428hold: H4 load, respawn, hold
cmd sl_goto 4
cmd respawn
cmd sl_hold
waitms 500
saveloc
waitms 300
cmd sl_holdoff
waitms 700
echo p428hold: H5 zone move under a hold
cmd sl_load
cmd sl_hold
waitms 500
saveloc
waitms 300
say !m
waitms 700
saveloc
waitms 300
cmd sl_holdoff
waitms 700
echo p428hold: H6 start-box save held, then released
cmd sl_goto 1
waitms 700
cmd sl_load
cmd sl_hold
waitms 700
echo p428hold: H6 held
cmd timer
waitms 500
cmd sl_holdoff
waitms 700
echo p428hold: H6 released
cmd timer
waitms 500
cmd sl_delall
waitms 3000
echo p428hold: done
quit
