// P428HOLD -- Patch 428 review rounds 3-4: a hold needs a load of its save in
// the same frame, and a demoted save is a position at rest that arms nothing.
// Server p428sv.cfg (lobby, probe guid; remove data/saves/bhop_eazy/@<guid>/
// after).  Controls: b3e100e (round 3's D1/H1) and b20e42b (round 4's D2/H3/H4)
// as sv_progs.
//
// Save 1 just after a jump start INSIDE the start box (running, moving), then
// 24 more, so save 1 is demoted (a save with a run clock).
// PRE-REGISTERED PREDICTIONS (`cmd timer`, `saveloc`'s `hold`, `sl_list`):
//  D1 `sl_goto 1` (demoted, in the start box): timer `idle`, practice 1.
//     b3e100e: `armed`, practice 0 -- the load's taint laundered by the arm.
//  D2 row 1 lists at 0 u/s.  b20e42b: its saved speed.
//  H1 `sl_goto 2`, then `cmd sl_hold` a frame later on save 2: hold 0.
//     b3e100e: hold 1.
//  H2 `cmd sl_load` + `cmd sl_hold` in one frame (what `2` sends): hold 1.
//  H3 `cmd sl_goto 2; cmd sl_del; cmd sl_hold` in one frame: hold 0 (the delete
//     slid save 3 under the loaded row).  b20e42b: hold 1.
//  H4 `cmd sl_goto 3; cmd respawn; cmd sl_hold` in one frame: hold 0.  b20e42b: 1.
// FALSIFIED IF the fix reads a control's answer, or H2 reads 0.
// RESULT 2026-09-22 (Windows), fix / b20e42b:
//  D1 idle, practice 1 / armed, practice 0 (b20e42b's latches were right,
//     its 241 u/s carried the body into the box -- round 4's speed fix).
//  D2 0 u/s / 241 u/s.  H1 0 / 0 (b3e100e: 1).  H2 1 / 1.  H3 0 / 1.  H4 0 / 1.
cfg_save_auto 0
log_enable 1
log_dir logs
developer 1
cl_idlefps 0
cl_maxfps 100
rate  2000000
drate 5000000
vid_fullscreen 0
name "^3P428H"
waitms 4000
connect 127.0.0.1:27635
waitms 14000
cmd sl_list
waitms 500
cmd timer
waitms 500
+forward
waitms 400
+jump
waitms 60
cmd sl_save
-jump
waitms 300
-forward
waitms 800
cmd timer
waitms 300
cmd sl_save
waitms 80
cmd sl_save
waitms 80
cmd sl_save
waitms 80
cmd sl_save
waitms 80
cmd sl_save
waitms 80
cmd sl_save
waitms 80
cmd sl_save
waitms 80
cmd sl_save
waitms 80
cmd sl_save
waitms 80
cmd sl_save
waitms 80
cmd sl_save
waitms 80
cmd sl_save
waitms 80
cmd sl_save
waitms 80
cmd sl_save
waitms 80
cmd sl_save
waitms 80
cmd sl_save
waitms 80
cmd sl_save
waitms 80
cmd sl_save
waitms 80
cmd sl_save
waitms 80
cmd sl_save
waitms 80
cmd sl_save
waitms 80
cmd sl_save
waitms 80
cmd sl_save
waitms 80
cmd sl_save
waitms 80
waitms 800
echo p428hold: D1 demoted load
cmd sl_goto 1
waitms 700
cmd timer
waitms 500
echo p428hold: D2 list
cmd sl_list 1
waitms 800
echo p428hold: H1 hold a frame after the load
cmd sl_goto 2
waitms 700
cmd sl_hold
waitms 500
saveloc
waitms 300
cmd sl_holdoff
waitms 700
echo p428hold: H2 load and hold in one frame
cmd sl_load
cmd sl_hold
waitms 500
saveloc
waitms 300
cmd sl_holdoff
waitms 700
echo p428hold: H3 load, delete, hold
cmd sl_goto 2
cmd sl_del
cmd sl_hold
waitms 500
saveloc
waitms 300
cmd sl_holdoff
waitms 700
echo p428hold: H4 load, respawn, hold
cmd sl_goto 3
cmd respawn
cmd sl_hold
waitms 500
saveloc
waitms 300
cmd sl_holdoff
waitms 700
cmd sl_delall
waitms 3000
echo p428hold: done
quit
