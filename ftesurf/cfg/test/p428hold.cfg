cmd sl_save
waitms 80
waitms 800
echo p428hold: D1 demoted load
cmd sl_goto 1
waitms 700
cmd timer
waitms 800
echo p428hold: H1 hold a frame after the load
cmd sl_goto 2
waitms 700
cmd sl_hold
waitms 500
saveloc
waitms 300
cmd sl_holdoff
waitms 700
