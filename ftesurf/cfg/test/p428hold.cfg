// P428HOLD -- Patch 428 review round 3: a hold needs a load of its row in the
// same frame, and a demoted save arms nothing.  Server p428sv.cfg (lobby, probe
// guid; remove data/saves/bhop_eazy/@<guid>/ after).  Control: b3e100e's
// qwprogs as sv_progs.
//
// Save 1 at the spawn (in the start box), then 24 more, so save 1 is demoted.
// PRE-REGISTERED PREDICTIONS (`cmd timer`, and `saveloc`'s `hold`):
//  D1 `sl_goto 1` (demoted, in the start box): timer `idle`, practice 1.
//     Control: `armed`, practice 0 -- the Build 47 edge re-armed it clean.
//  H1 `sl_goto 2`, then `cmd sl_hold` a frame later, standing on save 2: hold 0.
//     Control: hold 1 (round 2 only asked for the save's origin).
//  H2 `cmd sl_load` + `cmd sl_hold` in one frame (what `2` sends): hold 1 on both.
// FALSIFIED IF D1 or H1 read the control's answer on the fix, or H2 reads 0.
// RESULT 2026-09-22 (Windows): all three held and discriminate.
//  D1 fix `timer: idle`, practice 1; control `armed`, practice 0.
//  H1 fix hold 0; control hold 1.  H2 hold 1 on both.
cfg_save_auto 0
log_enable 1
log_dir logs
developer 1
cl_idlefps 0
cl_maxfps 100
rate  2000000
drate 5000000
vid_fullscreen 0
name "^3P428H"
waitms 4000
connect 127.0.0.1:27635
waitms 14000
cmd sl_list
waitms 500
cmd timer
waitms 500
cmd sl_save
