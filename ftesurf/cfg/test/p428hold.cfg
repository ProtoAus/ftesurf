// P428HOLD -- Patch 428 review rounds 3-6: a hold needs a load of its save in
// the same frame; a demoted save is a position at rest that arms nothing; a
// zone move lets go of a hold; a held body runs no zone tests.
// Server p428sv.cfg (lobby, probe guid; remove data/saves/bhop_eazy/@<guid>/
// after).  Controls as sv_progs: b3e100e (D1/H1), b20e42b (D2/H3/H4),
// 557d736 (H5), b05f768 (H6).
//
// Save 1 at the spawn (armed, in the start box).  Save 2 just after a jump
// start inside the box (running, moving).  24 more, so save 2 is demoted --
// save 1 has no run clock and is not.
// PRE-REGISTERED PREDICTIONS (`cmd timer`, `saveloc`'s `hold`, `sl_list`):
//  D1 `sl_goto 2` (demoted, in the start box): timer `idle`, practice 1.
//     b3e100e: `armed`, practice 0 -- the load's taint laundered by the arm.
//  D2 row 2 lists at 0 u/s.  b20e42b: its saved speed.
//  H1 `sl_goto 3`, then `cmd sl_hold` a frame later on save 3: hold 0.
//     b3e100e: hold 1.
//  H2 `cmd sl_load` + `cmd sl_hold` in one frame (what `2` sends): hold 1.
//  H3 `cmd sl_goto 3; cmd sl_del; cmd sl_hold` in one frame: hold 0 (the delete
//     slid save 4 under the loaded row).  b20e42b: hold 1.
//  H4 `cmd sl_goto 4; cmd respawn; cmd sl_hold` in one frame: hold 0.  b20e42b: 1.
//  H5 hold on a save (hold 1), then `say !m`: the move lets go -- hold 0.
//     557d736: hold 1 -- the move re-armed a clean attempt under the hold.
//  H6 load+hold save 1 (armed, start box): practice 1 WHILE held -- no zone test
//     runs, so the Build 47 re-arm waits -- then practice 0 after the release.
//     b05f768: practice 0 already while held.
// FALSIFIED IF the fix reads a control's answer, H2 reads 0, or H6's release
//   does not re-arm (practice stays 1).
// RESULT 2026-09-22 (Windows), fix vs the round's control:
//  D1 idle, practice 1 vs armed, practice 0.  D2 0 u/s vs 241 u/s.
//  H1 0 vs 1.  H2 1 vs 1.  H3 0 vs 1.  H4 0 vs 1.  H5 1->0 vs 1->1.
//  H6 held practice 1, released practice 0 (re-armed) vs held practice 0.
cfg_save_auto 0
log_enable 1
log_dir logs
developer 1
cl_idlefps 0
cl_maxfps 100
rate  2000000
drate 5000000
vid_fullscreen 0
name "^3P428H"
waitms 4000
connect 127.0.0.1:27635
waitms 14000
cmd sl_list
waitms 500
cmd timer
waitms 500
cmd sl_save
waitms 500
+forward
waitms 400
+jump
waitms 60
cmd sl_save
-jump
waitms 300
-forward
waitms 800
cmd timer
waitms 300
cmd sl_save
waitms 80
cmd sl_save
waitms 80
cmd sl_save
waitms 80
cmd sl_save
waitms 80
cmd sl_save
waitms 80
cmd sl_save
waitms 80
cmd sl_save
waitms 80
cmd sl_save
waitms 80
cmd sl_save
waitms 80
cmd sl_save
waitms 80
cmd sl_save
waitms 80
cmd sl_save
waitms 80
cmd sl_save
waitms 80
cmd sl_save
waitms 80
cmd sl_save
waitms 80
cmd sl_save
waitms 80
cmd sl_save
waitms 80
cmd sl_save
waitms 80
