// P372PI -- post-deploy check of Patches 371/372 against a LIVE Pi lobby (lobby 1,
// empty at the time): the client loads the shipped csprogs and the server runs
// the new progs.
//   ftesurf64.exe +set vid_winmaximize 0 -WindowStyle Minimized +exec cfg/test/p372pi.cfg
// PREDICTIONS: "server: welcome to FTESurf -- tier 1 (beginner) -- on <map>";
// `vote status` "mapclock: "<end> 0" ... row "time left" and a next map; `cmd
// vote` "svvote: on 1 kind 0"; !timeleft "lobby: N:NN left on <map>"; !nextmap
// "next map is <map> -- the map vote opens 3:00 before the end"; the shot shows
// "time left" / "next" under the map info.
// RESULTS 2026-09-19 06:37 UTC, lobby 1 on surf_kitsune, qwprogs 199e59f8 /
//  csprogs 0dc574c0 (deployed from a clean worktree of 69d8516): ALL HELD.
//  "server: welcome to FTESurf -- tier 1 (beginner) -- on surf_kitsune";
//  mapclock "1800.0 0" row "time left 28:52" next surf_utopia; "svvote: on 1
//  kind 0"; "lobby: 28:51 left on surf_kitsune"; "next map is surf_utopia -- the
//  map vote opens 3:00 before the end"; the shot has both rows under the map
//  info and the replies wrapped in the chatbox.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p372pi
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
vid_width 1280
vid_height 720
wait 600
connect 192.168.1.102:27510
waitms 25000
menu_restart
waitms 500
ui_close
waitms 1500
vote status
cmd vote
waitms 1500
say !timeleft
waitms 1500
say !nextmap
waitms 2000
screenshot p372pi
waitms 800
echo === p372pi done
disconnect
waitms 1000
quit
