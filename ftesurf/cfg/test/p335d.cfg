// Patch 335, ARM D -- box census.  Listen server (single process): trig_models
// dumps every predicted slot's model/org/box, and `cmd ent_info` gives the
// server's absmin/absmax answer for the same points, so the two sides' idea of
// where each '*N' trigger lives can be compared line by line.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p335d
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0
sv_cheats 1
wait 200
map surf_rise
waitmap 1800
waitms 2500

echo ^5=== p335d: client slots ===
trig_models
waitms 800

echo ^5=== p335d: server answers ===
cmd ent_info trigger_teleport -850 -497 800
waitms 500
cmd ent_info trigger_teleport -850 -497 400
waitms 500
cmd ent_info trigger_teleport -3120 -496 2100
waitms 500

echo ^5=== p335d done ===
waitms 300
quit
