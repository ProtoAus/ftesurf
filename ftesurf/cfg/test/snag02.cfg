// SNAG02 -- Patch 258.  Second candidate for the map behind the stuck report.
//
// snag01 ruled surf_boreas out cleanly: run_eyeinfo put the reported origin
// 1307 units in the air there.  bhop_monster_jam is the next candidate and a much
// better one -- across all 1310 maps in the library it has the closest
// displacement vertex to the origin (107.5 units), and every other map in
// conhistory.txt is thousands of units away.  107 units is still too far to be
// standing ON that displacement, which is itself informative: if this is the map,
// the player was on a brush or a prop NEXT TO the displacements, and
// BIH_ClipToTriangle serves static prop collision too.
//
// Same falsification rule as snag01: feet-above-floor 8192.00 or a four-figure
// number means wrong map, and nothing else in this log means anything.

log_enable 1
log_dir "logs"
log_name "snag02"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
con_notifylines 0
developer 1
log_developer 1

hl2_dispwinding 1

wait 200
map bhop_monster_jam
waitmap 1800
waitms 8000
sv_cheats 1
waitms 400

pm_dispprobe 1

echo ^5=== A: is the probe origin real? ===
noclip
waitms 400
setpos 10523.4 -326.7 5359.5 0 123.7 0
waitms 900
cmd run_eyeinfo
waitms 900
screenshot
waitms 600

echo ^5=== B: 64 units higher, so a startsolid cannot hide the floor ===
setpos 10523.4 -326.7 5423.5 0 123.7 0
waitms 900
cmd run_eyeinfo
waitms 900

// Walk into the plane.  Blocking normal was (0.506 -0.759 0.411), so the player
// was pushing along roughly (-0.55 0.83) -- yaw 123.7.  Start 48 units back
// along that normal.
echo ^5=== C: walk into it ===
setpos 10547.7 -363.1 5379.2 0 123.7 0
waitms 400
noclip
waitms 1200
cmd run_eyeinfo
waitms 600
+forward
waitms 3000
-forward
waitms 600
cmd run_eyeinfo
waitms 600
screenshot
waitms 600

echo ^5=== snag02 done ===
pm_dispprobe 0
wait 30
quit
