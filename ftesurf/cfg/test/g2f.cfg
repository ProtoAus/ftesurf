// Patch 208, part F -- the rtlight A/B, with the capture method that works.
//
// Part E used plain `screenshot` on the theory that screenshot_mega drops 2d.
// It does drop 2d, but plain `screenshot` came back BLACK for every single shot
// including the baseline and the lights-off recovery -- states already known to
// render correctly -- so the capture, not the renderer, was at fault and the
// whole E screenshot set was void.  screenshot_mega it is.
//
// The only question here: g2H_rtlight_on showed the wall intact and the doorway
// EMPTY with rtlights on.  Is that Patch 208?  Identical camera, identical
// light, r_portalscissor 0 against 1.  Same at both = not mine.

cfg_save_auto 0
developer 1
log_developer 1
scr_sshot_type png
cl_yieldcpu 0
cl_maxfps 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0
r_speeds 0
r_portalrecursion 2
r_portalmaxviews 2
r_portaldebug 0
vbsp_portal_render 1
r_portalscissor 1

waitms 2500
map surf_kitsune
waitmap 180
waitms 5000
sv_cheats 1
developer 0
clear
setpos 0 -765 133 0 90 0
waitms 3000

echo "### F0 baseline, no lights, scissor 1 -- the known-good reference"
screenshot_mega g2F0_base 1280 720
waitms 700

echo "### F1 rtlights on, scissor 1"
r_editlights 1
waitms 500
r_editlights_spawn
waitms 500
r_shadow_realtime_dlight 1
r_shadow_realtime_world 1
waitms 2500
screenshot_mega g2F1_rt_scissor1 1280 720
waitms 700

echo "### F2 rtlights on, scissor 0 -- the control"
r_portalscissor 0
waitms 1500
screenshot_mega g2F2_rt_scissor0 1280 720
waitms 700

echo "### F3 rtlights on, portals off entirely -- what the wall alone looks like"
r_portalscissor 1
vbsp_portal_render 0
waitms 1500
screenshot_mega g2F3_rt_portalsoff 1280 720
waitms 700
vbsp_portal_render 1
waitms 500

echo "### F4 lights off, scissor 1 -- must return to the F0 image"
r_shadow_realtime_world 0
r_shadow_realtime_dlight 0
r_editlights 0
waitms 2000
screenshot_mega g2F4_recovered 1280 720
waitms 700

echo "### F DONE"
waitms 800
quit
