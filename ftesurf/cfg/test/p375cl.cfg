// P375CL -- client half of p375sv.cfg.  Four finishes on one lobby, each with
// its own saves (sl_delall first).  The saves and loads that must go WARM happen
// inside stage 1 (the next stage box is ~0.8 s of walking away): a stage posted
// before a load keeps the stream as evidence (Patch 360) and forces the cold path
// -- that case is arm P, this harness's first run, where every load was cold.
//   W  save S1, walk, load S1 (warm), walk to the finish.
//   M  save S1, save S2, load S1 (warm), walk past S2's mark, load S2, finish.
//   V  save S1, void with `!r`, load S1, finish.
//   F  save+load in one packet; stand 35 s; save, load 20 ms later; finish.
// PRE-REGISTERED (rt1cl measured L before: flags 137, rec "" -- no replay):
//   every arm submits flags 137 WITH a replay (recbytes = the file's size);
//   reccheck ok.
//   W  v9, one `resume`, no `pause`; the prefix equals S1's run.rec (flags aside).
//   M  S2 loads COLD though no stage posted -- S1's load cut below S2's mark: v10,
//      `pause <mt> <cy> <t> load`, S2's `resume`, and S2's run.rec as the prefix.
//   V  COLD (the void began a new serial): v10 with a `load` pause.
//   F  "timer: finishing 1 pending save copy now" for the first load (no
//      SV_TimerFrame between save and load); both loads warm: v9, two `resume`s.
// FALSIFIED IF any arm submits rec "", a W/F file carries a `pause`, M's S2 or V
// loads warm, or a prefix differs from its slot copy.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p375cl
developer 1
cl_idlefps 0
cl_maxfps 100
rate  2000000
drate 5000000
vid_fullscreen 0
waitms 6000
connect 127.0.0.1:27631
waitms 12000
set rec_terms 1
echo ^5==== W: save S1, walk, load S1 (warm), finish ====
cmd sl_delall
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 500
cmd sl_save
waitms 250
-forward
cmd sl_load
waitms 800
+forward
waitms 6500
-forward
waitms 2500
cmd timer
echo ^5==== M: S1, S2, load S1 (warm), past S2, load S2 (cold by lineage) ====
cmd sl_delall
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 650
cmd sl_save
waitms 150
cmd sl_save
-forward
cmd sl_prev
cmd sl_load
waitms 300
+forward
waitms 200
-forward
cmd sl_next
cmd sl_load
waitms 1000
+forward
waitms 6500
-forward
waitms 2500
cmd timer
echo ^5==== V: save S1, !r, load S1 (cold), finish ====
cmd sl_delall
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 500
cmd sl_save
waitms 300
-forward
say !r
waitms 1500
cmd sl_load
waitms 2000
+forward
waitms 6500
-forward
waitms 2500
cmd timer
echo ^5==== F: save+load one packet, stand 35 s, save, load, finish ====
cmd sl_delall
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 500
-forward
cmd sl_save; cmd sl_load
waitms 35000
cmd sl_save
waitms 20
cmd sl_load
waitms 500
+forward
waitms 6500
-forward
waitms 2500
cmd timer
echo ^5==== done ====
waitms 1000
quit

