cfg_save_auto 0
// Build 64: the board-state key, against the REAL lobby rather than a harness.
//
// Everything so far was measured on a listen server with the cvars moved by
// hand. This asks the deployed Pi the same question: does an official lobby
// publish board=ranked, and does the client read it back?
//
// PREDICTION: scores status reports `board=ranked  this server posts times to
// the online board`.
//
// FALSIFIED IF it reports board=(unpublished) -- the lobby is running a progs
// without Lobby_BoardState, i.e. the deploy did not take -- or board=noid,
// which would mean sv_guidkey is not reaching the server after all and every
// finish on the Pi is still being dropped at the identity gate.
//
// THE LAN ADDRESS, not play.proto.bar: a hairpin NAT failure here would look
// exactly like a server that does not answer, and the thing under test is the
// progs rather than the router.
log_enable 1
log_dir logs
log_name b64live2

waitms 4000
connect 192.168.1.102:27540

// Generous, because the csprogs checksum just changed and the client has to
// download the new one before any CSQC command exists to be typed.
waitms 45000

echo ==== LIVE: what does the lobby say? ====
scores status
waitms 1000
scores open
waitms 1500
scores status
waitms 1000
screenshot
waitms 1500

echo ==== done ====
disconnect
waitms 500
quit
