// P357REFCL -- the leaderboard follows a finish (client half; server p357refsv.cfg).
// The finish is b57stage's arm B: `!s 1`, setpos to the stage-1 box, fly to the
// boundary -> a stage-1 run finishes (leg 1).  setpos taints it; the stub stores
// any flags, and the class (practice) leaves the tab alone.
//
// PREDICTIONS (pre-registered), stub `p357board.py 8131`:
//   F  after the finish + answer, board still CLOSED: board_status "gen 1 asked 0",
//      state idle, and the stub log shows NO GET yet (no traffic while shut).
//   H  +showscores: `scores status` leg 2/6 "stage 1" (followed), "follow 0";
//      exactly one GET for (bhop_eazy,0,1,clean); board_status rows 1, mine 0,
//      gen 1 asked 1; screenshot p357ref_follow shows the row highlighted.
//   P  CONTROL: board pinned open on main (scores leg 0), second finish: leg stays 1/6 "main",
//      follow 0 (refresh in place, no jump).
// With `seed 70` (second run, arm S): rank 71 -> "rank 71" in scores status and a
//   pinned own row under the list (screenshot p357ref_pinned), footer
//   "(top 64 of 71 shown)".
//   F/H NOTE: a scripted finish is uncertified here (sv_cheats -> TF_NORULESET),
//      so H follows to the LOCAL tab and the online board is NOT refreshed (gen
//      stays 0) -- the unranked rule.  The online half is arm O.
//   O  online half via the hooks: `scores note 0 0 1234 0` + the server's probe
//      (player = this client, stub row) + `scores landed` (rank from *wrank): board_status
//      gen 1 asked 0 while CLOSED (no GET); +showscores follows to main/online,
//      exactly one GET for leg 0, rows 1, mine 0; screenshot p357ref_mine shows
//      the row highlighted.  (O starts on the online tab: H left it on Local.)
// FALSIFIER: a GET before O's hold, no GET at O, leg not followed, or a jump at P.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p357refcl
developer 1
cl_idlefps 0
cl_maxfps 100
rate  2000000
drate 5000000
waitms 6000
connect 127.0.0.1:27631
waitms 12000
set rec_terms 1
set lobby_dir "http://127.0.0.1:8131"
menu_restart
waitms 300
ui_close
echo ^5==== F: stage-1 run, board closed ====
// noclip ON first, as b57stage arm A does: the flight needs noclip speed
// (b57: ~5400 u in 5.2 s); setpos alone left a walking-speed flight short.
noclip
waitms 300
say !s 1
waitms 900
setpos -352 -352 144 0 16.18 0
waitms 600
cmd viewpos
+forward
waitms 1500
cmd viewpos
waitms 1500
cmd viewpos
waitms 1500
cmd viewpos
waitms 700
-forward
waitms 3000
cmd viewpos
cmd timer
board_status
echo ^5==== H: hold the board ====
+showscores
waitms 2500
scores status
board_status
screenshot p357ref_follow
waitms 800
-showscores
waitms 500
echo ^5==== P: control, pinned on main, second finish ====
scores open
scores leg 0
waitms 1500
say !s 1
waitms 900
setpos -352 -352 144 0 16.18 0
waitms 600
+forward
waitms 5200
-forward
waitms 3000
scores status
board_status
screenshot p357ref_pinned
waitms 800
scores close
echo ^5==== O: online half (hooks + server probe) ====
scores tab online
scores note 0 0 1234 0
waitms 40000
scores landed
waitms 500
board_status
+showscores
waitms 2500
scores status
board_status
screenshot p357ref_mine
waitms 800
-showscores
waitms 500
quit

// RESULT (2026-09-18, after the review fixes; stub plain, then seed 70):
//   F  the setpos stage-1 run posted (stub stored) and came back UNRANKED (no
//      ruleset: sv_cheats) -> "board: unranked (no ruleset)"; gen stayed 0.
//   H  held: leg 2/6 "stage 1", tab LOCAL (unranked rule), the new 0:02.720 row
//      highlighted (screenshot p357ref_follow).
//   P  pinned on main, second finish: leg stays 1/6 "main" -- no jump.
//   O  after `landed`: board_status "gen 1 asked 0" with the board closed, and
//      the stub saw NO GET until the hold; the hold made exactly one GET, rows 1,
//      mine 0, row highlighted.  seed 70: rank 71, rows 64 of 71, mine -1, the
//      pinned own row "71 0:12.340 Kap" and "(top 64 of 71 shown)".
//   First runs FAILED for harness reasons, kept for the record: no noclip (the
//   flight fell short), O ordered before the probe landed, and the hooks fell
//   through to a Refresh that fetched with the board shut (fixed: they return).
//   NOT COVERED: a real certified finish end to end (needs a human on a lobby).
