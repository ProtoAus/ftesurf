// FTESurf Patch 180 measurement, arm A: the OLD behaviour.
// fs_maploadhash 0 leaves the name hash stale from COM_FlushTempoaryPacks onward,
// which is what the engine has always done.  Loads two maps in one session so the
// second one pays the price the first one does not -- the exact utopia -> tensor2
// case that was reported.
fs_loadstats 1
fs_maploadhash 0
developer 0
waitms 4000
echo "=== P180 ARM A (fs_maploadhash 0) ==="
echo "--- cold: surf_utopia ---"
map surf_utopia
waitms 25000
echo "--- warm: surf_tensor2 ---"
map surf_tensor2
waitms 25000
echo "=== ARM A DONE ==="
waitms 1000
quit
