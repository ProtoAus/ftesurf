// BUILD 23 arm A -- the rawinput default and alias, and the new runs layout.
//
// Every check here is a print into the log; nothing is asserted from a return
// code, because a config that runs to the end proves only that it ran.

developer 1
log_developer 1

echo "=== B23A: in_rawinput / m_rawinput ==="
// Both names must resolve to ONE cvar reading 1.  If the alias failed to
// register, "m_rawinput" prints Unknown command and in_rawinput still reads 1 --
// which is why both are printed rather than just the alias.
in_rawinput
m_rawinput

echo "--- set through the ALIAS, read through the real name ---"
// The proof they are one cvar and not two: writing one must move the other.
m_rawinput 0
in_rawinput
m_rawinput 1
in_rawinput

echo "=== B23A: load the map ==="
// `wait 200` BEFORE the map, which is the idiom every working test config in
// this folder uses.  Without it the map command is issued while the client is
// still coming up and the load never starts -- and the failure is silent, so
// every check after it runs with no server and prints Unknown command.
cfg_save_auto 0
wait 200
map surf_utopia
waitmap 90

echo "=== B23A: the PB came off the new path ==="
// data/runs/surf_utopia/best.pb, moved there by tools/migrate_runs.py.  `timer`
// prints the leg's PB, so a 0 here means SV_PBLoad did not find the file.
cmd timer

echo "--- and where a run STARTED HERE would be written, on stage 0 ---"
// zone_goto 0 puts the player in the main track's start box, so the leg the
// name is composed from is a real one rather than whatever the spawn happens
// to be in.
cmd zone_goto 0
wait 20
cmd timer

echo "=== B23A: rec_runs_keep registered ==="
rec_runs_keep

echo "=== B23A: zones still parse ==="
cmd zone_dests

echo "=== B23A: selftests ==="
pm_selftest
zone_selftest

echo "=== B23A: the menu census pattern, proven not argued ==="
// run_pb_load scans FS_RUNS_ROOT + "*" + FS_PB_LEAF -- one wildcard, a whole
// path component.  `dir` runs the SAME engine enumerator, so if this lists
// best.pb the menu's search_begin will find it too.  Chosen over reasoning by
// analogy with SV_SaveLocScan's pattern, which is one directory level deeper.
dir data/runs/*/best.pb
echo "--- and the leg archive, which is what the leaderboard will read ---"
dir data/runs/surf_utopia/main/*_pb.rec

wait 30
echo "=== B23A: done ==="
quit
