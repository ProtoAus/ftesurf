cfg_save_auto 0
// Patch 302 -- closing out the ONE unexplained number.
//
// p302a (tensor2 then boreas, one process) measured boreas worldlight 0 vs 1 at
// 96.90% of pixels differing, signed mean +0.23.
// p302b (boreas alone) measured the same vantage at 0.01%, WITH a same-cvar
// repeat arm showing the noise floor is also 0.01%.
//
// Cross-comparing every frame of both runs:
//     p302a_b1_off == p302b_c1_off == p302b_c3_on     all 0.01%
//     p302a_b2_on  differs from all three by 96.90% / signed +0.23
//     p302a_b2b_on shows the same offset at the other vantage
// So four frames of this scene agree across two processes and only p302a's two
// ON frames disagree.  The prop_census lines are character-identical between
// arms in p302b, so the CLAIM (baked props are untouched) is already verified by
// numbers.  What is not explained is a pixel difference.
//
// THE ONE VARIABLE p302b DID NOT HAVE: surf_tensor2 was loaded FIRST, in the
// same process, with hl2_lt_worldlight left at 1 when the map changed.  This run
// reproduces exactly that sequence and then puts a noise-floor arm on boreas,
// which is precisely what p302a lacked.
//
// PRE-REGISTERED:
//   E2 vs E3 is the same cvar twice and IS the noise floor for this run.
//   If E2-E4 (the flip) is the same size as E2-E3, there is nothing here and
//   p302a's 96.90% was a settling artefact of a freshly changed map -- the first
//   render of a vantage after a map change, which is the one frame a repeat arm
//   exists to discard.
//   If E2-E4 is LARGE while E2-E3 is small, then loading tensor2 first really
//   does change what boreas draws, that is a cross-map state leak in my own
//   patch, and it must be found before any of this is called verified.
vid_fullscreen 0
vid_restart
waitms 3000
wait 200

developer 1
log_developer 1
log_enable 1
log_dir logs
log_name p302c_crossmap
cl_maxfps 0
cl_idlefps 0
sv_cheats 1
con_notifylines 0
con_notifytime 0.01
r_drawviewmodel 0

// ---- exactly p302a's first half: tensor2, ending with the cvar left at 1 ----
map surf_tensor2
waitmap 600
waitms 9000
waitms 3000
noclip
waitms 1000
hl2_lt_worldlight 1
waitms 2500
setpos -12300.9990 10799.1201 -9654.1191 3.1311 43.4784 0
waitms 2000
screenshot p302c_e1_tensor2_on
waitms 800

// ---- now the map change, with the cvar still at 1, as in p302a ----
echo ^5=== map change to boreas with hl2_lt_worldlight still 1
map surf_boreas
waitmap 600
waitms 9000
waitms 3000
noclip
waitms 1000

alias vbor "setpos 10085.2373 -14374.5410 3199.9836 17.1716 39.4080 0; waitms 2500"

echo ^5=== E2: worldlight 0
hl2_lt_worldlight 0
waitms 2500
vbor
screenshot p302c_e2_off
waitms 1500

echo ^5=== E3: worldlight 0 AGAIN -- the noise floor p302a never measured
vbor
screenshot p302c_e3_off_repeat
waitms 1500

echo ^5=== E4: worldlight 1
hl2_lt_worldlight 1
waitms 2500
vbor
screenshot p302c_e4_on
waitms 1500

echo ^5=== E5: worldlight 1 AGAIN -- noise floor on the ON side too
vbor
screenshot p302c_e5_on_repeat
waitms 1500

echo ^5=== E6: back to 0
hl2_lt_worldlight 0
waitms 2500
vbor
screenshot p302c_e6_off_again
waitms 1500

echo ^5--- census, both states, by index
prop_census 0
waitms 600
prop_census 500
waitms 600

echo ^5=== END OF RUN ===
waitms 500
quit
