// Patch 383 harness SERVER -- the 66 Hz pose stream, the p340sv shape.
// Predictions, arms and the run order are in p383view.cfg's header.
//
//   cd C:\FTESurf
//   C:\FTEQuake\fteqwsv64.exe +set sv_port 27693 +set log_enable 1 +set log_dir logs
//     +set log_name p383sv_<arm> [arm +sets] +exec cfg/test/p383sv.cfg
//
// ARM SWITCHES GO ON THE COMMAND LINE and this file never sets them: `+set`
// creates the cvar first and Lobby_Frame's registercvar then keeps it.
//   (none)                          --arm base: P1 P3-P6 P12 keys C1; also P9
//                                        (--arm loss, viewer-side loss)
//   +set lobby_av_rate 15           --arm rate15 (and 22.2 rate22, 66.67
//                                        rate66: one server per rate)   P2
//   +set lobby_av_budget 500        --arm budget500                     P10
//   +set sv_csqcdebug 1             --arm csqc                          P7
//   +set lobby_av_stream 0 +set lobby_av_rate 15    CONTROL, --arm ctl15
//                                        (and 66.67, ctl66)
// Restart the server (and re-run tools/seed_csprogs.py after a build) before
// every arm; kill leftover fteqwsv64/ftesurf64 processes between arms.
//
// No log_name line: a cfg's own log_name beats the command line's.
sv_public 0
sv_maxrate 0
sv_maxdownloadrate 0
developer 1
sv_cheats 1
set lobby_master ""
set lobby_enable 1
set lobby_avatars 1
set lobby_nocollide 1
set lobby_av_self 0
set lobby_av_colors 1
set lobby_av_fx 1
// Fixture hygiene: no run files, no parked Multi-Session slot on quit.
set rec_enable 0
set run_resume 0

// Every prediction assumes pm_ticrate 0.015: a bhop_ map otherwise loads
// cfg/lobby/mode_bhop.cfg (0.01, sv_phys.c's prefix table).
sv_gamemode none

echo ^5---- p383sv: arm cvars as read ----
lobby_av_stream
lobby_av_rate
lobby_av_budget
sv_csqcdebug
sv_gamemode

// Check the spawn floor before trusting P3: the owner walks a 106 u circle
// there, and the trace's z column must stay constant for the whole steady
// window (a step or a wall shows as a speed-CV outlier).
map bhop_eazy
echo ^5---- p383sv: tick (want 0.015) ----
pm_ticrate
