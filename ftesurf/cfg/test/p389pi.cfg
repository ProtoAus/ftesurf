// Patch 389 post-deploy check: join a live lobby and read the server's input-profile verdict.
// Run: <client> +set p389_target 192.168.1.102:<port> +exec cfg/test/p389pi.cfg   (never ui_join)
// Pre-registered: a Windows client reads `inprof ... would 0`; a Linux client `would 1`
//   (no IPH_RAW -> TF_NOPROFILE).  Void unless the log shows "FTESurf CSQC loaded" and `said 2`.
// RESULT 2026-09-19 22:29, lobby bhop (easy) 192.168.1.102:27540 right after the -Pi deploy (qwprogs
//   a2526d09): Windows (387+388 build) key "2 15 1 0 0 0 2" ev "15 1 0 0 0 2" said 2 would 0;
//   Linux (portable b0a96909b) key "2 14 0 0 0 0 2" ev "14 0 0 0 0 2" said 2 keywould 0 would 1.  Held.
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
set log_enable 1
set log_dir logs
waitms 5000
connect $p389_target
waitms 30000
echo ======== P389 timer
cmd timer
waitms 3000
disconnect
quit
