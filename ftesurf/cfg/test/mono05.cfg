// MONO05 -- name the bonus-4 checkerboard.  Observe only, no code.
//
// mono04 proved Patch 261 fixed the teleporter panel in the spawn room (the
// mono02_e_yaw270 vantage is now clean).  It ALSO showed that bonus 4 is a
// different and much bigger failure: at the user's save004 vantage
// (-10975.05 -5482.11 15936.03, yaw 178) the walls, the far end and the ceiling
// are ALL pink/black, and looking up gives checkerboard where mono03 got blue
// sky at a stage start.
//
// What makes it a puzzle rather than an obvious second instance of the same bug:
//
//   hl2_unresolved 0, hl2_unresolved_visible 0, and the only two names in the
//   "did not resolve" list are the post-load levelshot images.  So NO material
//   failed to resolve.  Every "did not resolve from any wad" line in the log is
//   a "_norm"/"_luma" probe, which is supposed to miss.
//
// A checkerboard with nothing unresolved means the guess has to stop and the
// engine has to be asked.  shader_here (view.c:2133) prints what the crosshair
// is on in one greppable line -- material name, and whether it was lightmapped.
// That is the difference between "the sky material is failing here", "one wall
// material is failing", and "this room is genuinely textured with a checkered
// dev texture and nothing is wrong at all", which the pixels cannot distinguish:
// FTE's no_texture is drawn THROUGH the lightmap, so a lit checkerboard and a
// real checkered texture look the same.
//
// Traps: setpos is a stringcmd and applies server-side, while shader_here runs
// locally off the client's view -- so each pair gets 1500ms, not 300.  noclip
// once, before the first setpos, never between (it is a toggle).

log_enable 1
log_dir "logs"
log_name "mono05"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
con_notifylines 0
developer 1
log_developer 1

wait 200
map surf_monolith
waitmap 2400
waitms 10000

sv_cheats 1
waitms 300
noclip
waitms 400

echo ^5=== CONTROL: mono03's stage start, where the sky demonstrably works ===
setpos -8192 -15830 15720 -70 90 0
waitms 1600
shader_here ctrl_up
waitms 400
setpos -8192 -15830 15720 0 90 0
waitms 1600
shader_here ctrl_horizon
waitms 400

echo ^5=== BONUS 4: the user's save004 vantage, every direction ===
setpos -10975.05 -5482.11 15936.03 0 178 0
waitms 1600
shader_here b4_fwd
waitms 400

setpos -10975.05 -5482.11 15936.03 -70 178 0
waitms 1600
shader_here b4_ceiling
waitms 400

setpos -10975.05 -5482.11 15936.03 -89 178 0
waitms 1600
shader_here b4_straightup
waitms 400

setpos -10975.05 -5482.11 15936.03 0 88 0
waitms 1600
shader_here b4_side
waitms 400

setpos -10975.05 -5482.11 15936.03 0 358 0
waitms 1600
shader_here b4_back
waitms 400

setpos -10975.05 -5482.11 15936.03 45 178 0
waitms 1600
shader_here b4_floor
waitms 400

echo ^5=== and the spawn room, for a name that is known good post-261 ===
setpos 3856 -13872 13490 0 270 0
waitms 1600
shader_here spawn_wall
waitms 400

echo ^5=== mono05 done ===
wait 30
quit
