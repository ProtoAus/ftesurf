cfg_save_auto 0
// P319SHOT -- prove r_showbrushes actually draws the invisible wedge.
//
// Three shots of the SAME vantage looking at surf_boreas brush 170, the nodraw
// PLAYERCLIP wedge the player is stopped by:
//   a  r_showbrushes 0   the control.  This is what the reporter sees: nothing.
//   b  r_showbrushes 1   the brush as the mapper built it.
//   c  r_showbrushes 2   the SWEPT hull -- every plane offset by the player box
//                        support, i.e. the surface the ORIGIN is stopped by.
// If b and c are identical to a, the feature does not work and nothing else in
// this run means anything.
log_enable 1
log_dir "logs"
log_name "p319shot"
cl_idlefps 0
vid_fullscreen 0
con_notifylines 0

hl2_propcollision 1
hl2_phywinding 1
hl2_brushbevels 1

wait 200
map surf_boreas
waitmap 600
waitms 12000
sv_cheats 1
waitms 500

noclip
waitms 400
// camera behind and above the wedge's leading edge, looking down the ramp
setpos 11150 -13550 2800 25 49 0
waitms 800

r_showbrushes_dist 1400
r_showbrushes_mask 65536
waitms 200

echo ^5=== P319 shot A: control, r_showbrushes 0
r_showbrushes 0
waitms 600
screenshot p319_a_off
waitms 600
screenshot p319_a_off
waitms 600

echo ^5=== P319 shot B: r_showbrushes 1 (the brush as built)
r_showbrushes 1
waitms 600
screenshot p319_b_brush
waitms 600
screenshot p319_b_brush
waitms 600

echo ^5=== P319 shot C: r_showbrushes 2 (the SWEPT hull)
r_showbrushes 2
waitms 600
screenshot p319_c_swept
waitms 600
screenshot p319_c_swept
waitms 600

echo ^5=== P319 shot D: swept hull with the bevels OFF is not testable in-process
echo ^5=== (hl2_brushbevels is MAPLATCH); that is a separate launch.
echo ^5=== P319SHOT DONE ===
wait 60
quit
