// BUILD 87 capture: b83warp.cfg's scripted bhop_eazy run (ten teleports), re-run
// on build 87 to produce the first v9 subject with warp records.  Copied live
// by an outside poller to data/b87warp.part.  Body identical to b83warp.cfg.
cfg_save_auto 0

cfg_save_auto 0
log_enable 1
log_dir logs
log_name b87warp
developer 0
sv_cheats 0

set rec_enable 1
set rec_stream 1
set rec_runarchive 1

set run_startjitter 2

cl_yawspeed 210

waitms 6000
map bhop_eazy
waitmap 45
waitms 3000

echo ================================ B87 WARP -- armed, not started.
cmd timer
waitms 500

cmd zone_goto 0
waitms 1000
setpos -352 -352 144 0 335.3 0
waitms 1500

alias hop  "+jump;waitms 70;-jump;waitms 110"
alias goL  "+moveleft;-moveright;+left;-right"
alias goR  "-moveleft;+moveright;-left;+right"
alias cyc  "goL;hop;hop;goR;hop;hop"

+forward
+jump
waitms 120
-jump
waitms 120

cyc
echo ================================ B87 WARP -- after the first cycle.  Expect RUNNING.
cmd timer
waitms 200

cyc
cyc
cyc
cyc
echo ================================ B87 WARP -- mid-run.  Expect RUNNING.
cmd timer
cyc
cyc
cyc
cyc
cyc
echo ================================ B87 WARP -- mid-run 2.  Expect RUNNING.
cmd timer
cyc
cyc
cyc
cyc
cyc
echo ================================ B87 WARP -- mid-run 3.  Expect RUNNING.
cmd timer
cyc
cyc
cyc
cyc
cyc

-forward
-moveleft
-moveright
-left
-right
waitms 500

echo ================================ B87 WARP -- last read before quit.
cmd timer
waitms 500

echo ================================ B87 capture done -- quitting WITHOUT finishing.
waitms 500
quit

