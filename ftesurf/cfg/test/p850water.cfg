// Patch 850 arm: r_nestedents / r_skyroomneed off, level 1, level 2 at Lex's surf_boreas save 006
// (noclip, paused; r_viewstats + two screenshots each; r_budget_dump pairs), then the spawns of surf_kitsune
// (a portal door in view) and surf_demise (open sky) as sky-visible controls. Lex's cfg is read-only, put in as data/lexcfg.cfg:
//   python tools/runlines_smoke.py ftesurf/cfg/test/p850water.cfg --client <exe> --mount \
//     --put data/lexcfg.cfg=C:/FTESurf/ftesurf/ftesurf.cfg --csqc ... --ssqc ... --mqc ...
// Grade the STATS lines (captures at depth 1, skies drawn/skipped) before the pictures.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name runlines_smoke
con_notifytime 0
cl_idlefps 0
cl_maxfps 1000
vid_vsync 0
vid_fullscreen 0
vid_winmaximize 0
vid_width 1600
vid_height 900
sv_public 0
set run_resume 0
waitms 2000
map surf_boreas
waitmap 120
waitms 8000
menu_restart
ui_close
exec data/lexcfg.cfg
cfg_save_auto 0
cl_maxfps 1000
vid_vsync 0
cl_idlefps 0
sv_cheats 1
waitms 800
noclip
waitms 300
setpos 4832.6895 3922.6526 1219.8719 21.0553 17.4738 0
waitms 1500
pausable 1
pause
waitms 1500
r_budget 0
r_frametime 0
r_nestedents 0
r_skyroomneed 0
waitms 900
screenshot p850_lex_off_a
waitms 500
r_nestedents 0
r_skyroomneed 0
waitms 900
screenshot p850_lex_off_b
waitms 500
r_viewstats
waitms 1200
echo ==== STATS lex off ====
r_viewstats
r_nestedents 1
r_skyroomneed 1
waitms 900
screenshot p850_lex_lv1_a
waitms 500
r_nestedents 1
r_skyroomneed 1
waitms 900
screenshot p850_lex_lv1_b
waitms 500
r_viewstats
waitms 1200
echo ==== STATS lex lv1 ====
r_viewstats
r_nestedents 1
r_skyroomneed 2
waitms 900
screenshot p850_lex_lv2_a
waitms 500
r_nestedents 1
r_skyroomneed 2
waitms 900
screenshot p850_lex_lv2_b
waitms 500
r_viewstats
waitms 1200
echo ==== STATS lex lv2 ====
r_viewstats
r_budget 3
r_budget_csqc 0
waitms 1500
r_nestedents 1
r_skyroomneed 1
waitms 2000
echo ==== AB lv1_vs_off p01-1 ====
r_budget_dump
r_nestedents 0
r_skyroomneed 0
waitms 2000
echo ==== AB lv1_vs_off p02-0 ====
r_budget_dump
r_nestedents 1
r_skyroomneed 1
waitms 2000
echo ==== AB lv1_vs_off p03-1 ====
r_budget_dump
r_nestedents 0
r_skyroomneed 0
waitms 2000
echo ==== AB lv1_vs_off p04-0 ====
r_budget_dump
r_nestedents 1
r_skyroomneed 1
waitms 2000
echo ==== AB lv1_vs_off p05-1 ====
r_budget_dump
r_nestedents 0
r_skyroomneed 0
waitms 2000
echo ==== AB lv1_vs_off p06-0 ====
r_budget_dump
r_nestedents 1
r_skyroomneed 1
waitms 2000
echo ==== AB lv1_vs_off p07-1 ====
r_budget_dump
r_nestedents 0
r_skyroomneed 0
waitms 2000
echo ==== AB lv1_vs_off p08-0 ====
r_budget_dump
r_nestedents 1
r_skyroomneed 2
waitms 2000
echo ==== AB lv2_vs_lv1 p01-1 ====
r_budget_dump
r_nestedents 1
r_skyroomneed 1
waitms 2000
echo ==== AB lv2_vs_lv1 p02-0 ====
r_budget_dump
r_nestedents 1
r_skyroomneed 2
waitms 2000
echo ==== AB lv2_vs_lv1 p03-1 ====
r_budget_dump
r_nestedents 1
r_skyroomneed 1
waitms 2000
echo ==== AB lv2_vs_lv1 p04-0 ====
r_budget_dump
r_nestedents 1
r_skyroomneed 2
waitms 2000
echo ==== AB lv2_vs_lv1 p05-1 ====
r_budget_dump
r_nestedents 1
r_skyroomneed 1
waitms 2000
echo ==== AB lv2_vs_lv1 p06-0 ====
r_budget_dump
r_nestedents 1
r_skyroomneed 2
waitms 2000
echo ==== AB lv2_vs_lv1 p07-1 ====
r_budget_dump
r_nestedents 1
r_skyroomneed 1
waitms 2000
echo ==== AB lv2_vs_lv1 p08-0 ====
r_budget_dump
r_budget 0
pause
map surf_kitsune
