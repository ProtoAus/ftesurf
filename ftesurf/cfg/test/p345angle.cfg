cfg_save_auto 0
// PATCH 345 -- pm_recsim rounds the in-row angle back onto the wire grid.
//
// Run twice, same cfg, log name from the command line:
//   before  ftesurf64_p344.exe  +set log_name p345pre  +exec p345angle
//   after   ftesurf64.exe       +set log_name p345post +exec p345angle
//
// THE DEFECT.  The `in` row prints .v_angle = SHORT2ANGLE(wire short) at %.4f;
// pm_recsim rebuilt the short with ANGLE2SHORT, which TRUNCATES into a short.
// Mirrored offline (float32 v_angle, %.4f, sscanf %f): 30134 of 65536 shorts
// come back one step (0.0055 deg) low; rounding recovers all 65536.  So roughly
// half of every replayed row gave the mover a wrong wishdir.  Also: movement was
// cast to (short); the wire field is int.
//
// WHY MEASURE IT: the open loop's deaths (b83 row 817, kitsune 184/287) were
// read as chaos at a discrete boundary.  A systematic input error is a
// different explanation, and this is the cheapest one to remove.
//
// Same subjects and controls as p344ride.cfg (S1-S3, C1-C5).
//
// PRE-REGISTERED
//   1  ARM 1 identical on every file (tick counts do not read angles).
//   2  ARM 2 bands: no file gains a diverged packet.
//   3  e3trace (v6, no warp records) arm 3 still dies at row 149, its first
//      teleport -- the control that must still fail.  surf_trance still dies at
//      row 0 (booster at the start, v7 cannot carry it).
//   4  b83trace arm 3 first-past-0.1u row is >= 817, and kitsune's >= 184: if
//      the deaths were made of angle error they move later; if they do not
//      move, the angle error is below what they are made of.  Either is a
//      result; moving EARLIER falsifies the fix.
//   5  S1/S2 (b85ride, p344end_ok) stay at the floor; S3 still fails at row 26.
//
// FALSIFIED IF: any arm 1 line changes; a file gains diverged packets; an
// arm 3 row moves earlier; the e3 control stops dying at 149.
log_enable 1
log_dir logs
developer 0
set rec_enable 0
set rec_stream 0

waitms 6000
map surf_ecosystem
waitmap 60
waitms 4000
echo ================================ P345 S1 b85ride.part
pm_recsim data/b85ride.part
waitms 2000
echo ================================ P345 S2 p344end_ok.part
pm_recsim data/p344end_ok.part
waitms 2000
echo ================================ P345 S3 p344end_bad.part (must fail)
pm_recsim data/p344end_bad.part
waitms 2000
echo ================================ P345 C1 e5trace.part
pm_recsim data/e5trace.part
waitms 3000

map surf_trance
waitmap 60
waitms 4000
echo ================================ P345 C2 surf_trance v7
pm_recsim data/runs/surf_trance/main/0010929_pb.rec
waitms 4000

map surf_kitsune
waitmap 60
waitms 4000
echo ================================ P345 C3 surf_kitsune v7
pm_recsim data/runs/surf_kitsune/main/0009998_pb.rec
waitms 4000

map bhop_eazy
waitmap 45
waitms 3000
echo ================================ P345 C4 b83trace.part
pm_recsim data/b83trace.part
waitms 2000
echo ================================ P345 C5 e3trace.rec
pm_recsim data/e3trace.rec
waitms 2000

echo ================================ P345 done
waitms 1000
quit
