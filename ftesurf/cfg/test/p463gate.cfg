// P463GATE -- the arm64 engine must agree with the Windows build before it is
// swapped in.  AGENTS.md's gate: pm_dettest on bhop_eazy prints the same hashes
// both sides, and a known-PASS file still verifies.  Run on a port that is NOT
// 27698, which is the sweeper's.
log_enable 1
log_dir logs
log_name p463gate
developer 0
set rec_enable 0
set rec_stream 0
cl_idlefps 0
cl_maxfps 100
waitms 4000
map bhop_eazy
waitmap 60
waitms 3000
echo ================ P463GATE dettest
pm_dettest
waitms 2500
echo ================ P463GATE verify
pm_verify data/b88fin.rec
waitms 2500
echo ================ P463GATE done
waitms 500
quit
