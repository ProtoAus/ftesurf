// BUILD 25 stage 1, third pass -- the two things b25b did not actually show.
//
// 1. THE RAMP HOLD, MEASURED RATHER THAN INFERRED.  b25b compared the segment
//    row count between a clean ride and one whose ramp bit drops out every
//    fourth tick, and got 3 rows for both -- which proves nothing, because a
//    build WITHOUT the hold would also give 3: every fragment falls under
//    SEG_MINTIME and the carry and the merge put the ride back together anyway.
//    Same output, opposite reasons.  `ramp gaps bridged` is the number that
//    separates them: clean must read 0 and dropped must read 11.
//
// 2. THE OPEN SEGMENT, WITH SOMETHING ACTUALLY OPEN.  b25b's setpos landed on
//    the floor within a tenth of a second (`phase: ground 0.32`), so the save
//    was taken with no segment open at all and there was nothing to restore.
//    z 1100 at this spot is over a pit -- build 24 measured it -- so the player
//    is genuinely falling.  The map's own fall-teleport cancels the run about a
//    second later, so the save and the load both have to be inside that window.
//
// `wait 200` before `map`: exec inserts at the FRONT of the command buffer.

developer 1
log_developer 1
cfg_save_auto 0

wait 200
map surf_aesthetic
waitmap 90

echo ""
echo "=== 1. gaps bridged: clean must be 0, dropped must be 11 ==="
replay data/testrun/ramp_clean.rec
wait 25
replay status
wait 5
replay stop
wait 15

replay data/testrun/ramp_drop.rec
wait 25
replay status
wait 5
replay stop
wait 15
echo ""

echo "=== 2. the open AIR segment across a save ==="
zone_goto 0
wait 10
setpos -15200 200 1100
wait 12
cmd timer
wait 4
echo "--- (phase must read air, not ground) ---"

echo "--- save while airborne ---"
cmd sl_save
wait 12

echo "--- fall on, so the live segment has moved ---"
wait 25

echo "--- and load it back ---"
cmd sl_load
wait 15
echo ""

echo "=== 3. what the save actually wrote ==="
// The `open` line is the whole of the item.  Reading it back out of the file is
// the only way to see it -- the restore itself is silent by design.
type data/saves/surf_aesthetic/save001/seq.txt
wait 5
echo ""

echo "=== 4. and the cold path, which is what a retry takes ==="
// sl_del then a fresh save is the warm path again, so force the cold one by
// loading a slot the in-memory snapshot is not keyed to.
cmd sl_save
wait 12
cmd sl_first
wait 12
cmd sl_list
wait 5
echo ""

echo "=== 5. tidy up ==="
cmd sl_delall
wait 15
cmd sl_list
wait 5
echo ""

echo "=== b25c done ==="
wait 20
quit
