// P461BOX -- a `solid 2` prop's box must survive the wire.
//
// A SOLID_BBOX entity's bounds reach the client through COM_EncodeSize /
// COM_DecodeSize (common/common.c:1340-1385), which TRUNCATES each extent to a
// whole unit and FORCES THE BOX SYMMETRIC IN X AND Y, taking -mins[0] for both
// half-widths:
//     maxs[0] = maxs[1] = solid & 255;   mins[0] = mins[1] = -maxs[0];
// The server's own pmove uses the RAW mins/maxs (the final else in
// AddEntityToPmove).  So a prop whose studio bounds are wider in y than in x
// reached the client as a narrow column while the server kept the wide box -- walk
// into its side and the server pushes you out.  Same defect as Patch 458's scale,
// in the other field.
//
// SV_SpawnProp now PROMOTES such a prop to SOLID_PHYSICS_TRIMESH when its model
// ships a .phy, because that crosses the wire as ES_SOLID_BSP with no bounds at all
// -- both sides load the same model and run the same narrowphase, so there is
// nothing left to quantise.  A deliberate deviation from Source, which would use the
// studio AABB: the box is what cannot be transmitted, and a disagreement is worse
// than a shape that is smaller and more accurate than the box.  The re-cut box below
// remains only for a model with no .phy, where Source's box needs none either.
//
// POPULATION IS TINY AND CONCENTRATED, which is why this arm names one map: 146
// solid-2 props in the whole 1316-map library, and 144 of them are on surf_lax.
// The other two are one each on bhop_collective and surf_mate.
//
// WHAT THE FIRST RUN CHANGED ABOUT THIS ARM.  It was written to grade a re-cut box
// and it measured that box instead: on surf_lax all 144 are railingspikedgate.mdl,
// 9.65 wide in x and 138.6 long in y, and the symmetric box the wire can carry made
// each one 142 x 142 -- a 14.7x inflation, 144 times.  The model has a .phy
// (3409 bytes, cstrike_pak_dir.vpk), so the fix became a PROMOTION: trace the hull,
// which the wire carries exactly as ES_SOLID_BSP with no bounds at all.
//
// AND THEN THE SECOND RUN EMPTIED THE OTHER BRANCH.  144 + 1 + 1 = 146 is the whole
// library's solid-2 population, and all 146 promote, so the box re-cut has NEVER RUN
// on a shipped map.  That is why B2 is a three-verdict grade and not a pass.
//
// PRE-REGISTERED
//  B1  surf_lax reports `144 bbox->phy`, matching this script's own count of solid-2
//      props out of the BSP entity lump, and prints NO `box re-cut` clause.
//  B2  bhop_collective and surf_mate hold the only other solid-2 props, one each.
//      Both promote too, so the re-cut branch is NOT DEMONSTRATED -- deliberately
//      reported as unexercised rather than as passing.  Should a map ever reach it,
//      the grade is: integer extents, symmetric in x/y, and CONTAINS the old box.
//  B3  CONTROL: ahop_coast has 284 props and NO solid-2 among them, so neither
//      clause may appear.  Without it a counter that always fires passes B1.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p461box
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
sv_port 27711
sv_cheats 0
vid_fullscreen 0
waitms 5000
menu_restart
ui_close
waitms 1200

echo ==== B1 surf_lax 144 bbox->phy ====
map surf_lax
waitmap 3600
waitms 2500

// B2's own branch is only reachable on a solid-2 prop whose model ships NO .phy,
// and the promotion takes every one on surf_lax.  These are the only other two
// solid-2 props in the library -- one each -- so they are the whole population of
// that branch.  If they also carry a .phy the branch has never run on any shipped
// map, and the grader says NOT DEMONSTRATED rather than pretending otherwise.
echo ==== B2 bhop_collective 1 solid-2 prop ====
map bhop_collective
waitmap 3600
waitms 2500

echo ==== B2b surf_mate 1 solid-2 prop ====
map surf_mate
waitmap 3600
waitms 2500

echo ==== B3 ahop_coast CONTROL -- no solid-2 props ====
map ahop_coast
waitmap 3600
waitms 2500

quit
