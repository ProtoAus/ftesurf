// P225 -- is the surf_kitsune load crash the THREADED QC garbage collector?
//
// gdb on the unstripped build caught it:
//
//   #0 PR_RunGC  #1 PR_ExecuteProgram  #2 CSQC_WorldLoaded
//   #3 CL_LoadModels  #4 CL_RequestNextDownload  #5 Host_Frame
//
// pr_gc_threaded defaults to 1 (pr_bgcmd.c:36).  PR_RunGC then hands a SNAPSHOT
// of the addressable hunk and of prinst.tempstrings to a worker
// (COM_InsertWork(WG_LOADER, PR_QCGC_Thread, ...), initlib.c:1456-1468), and
// that worker runs PR_QCGC_Sweep -- which writes prinst.tempstrings[p] = NULL
// and calls externs->memfree() -- WHILE THE MAIN THREAD IS STILL EXECUTING QC
// and allocating into the same array.  The sweep's own comment at initlib.c:1333
// admits the race in as many words.
//
// CSQC_WorldLoaded on this map parses a 115-entity lump (portals, zones, sky),
// which is thousands of temp strings in one call -- exactly the workload that
// makes the collector fire mid-parse.
//
// Set the cvar BEFORE `map`: csqcprogparms.usethreadedgc is latched from it when
// the CSQC VM is created (pr_csqc.c:8217).
//
// Pass this the arm as the first argument is not possible in an FTE cfg, so the
// driver sets pr_gc_threaded on the command line with +set and this file only
// echoes what it ended up as.

cfg_save_auto 0
developer 1
log_enable 1
log_developer 1
log_dir "logs"
cl_yieldcpu 0
vid_vsync 0
con_notifytime 0

waitms 2500
echo "@@@ P225 pr_gc_threaded is:"
pr_gc_threaded
map surf_kitsune
waitmap 240
waitms 20000
echo "@@@ P225 SURVIVED"
waitms 500
quit
