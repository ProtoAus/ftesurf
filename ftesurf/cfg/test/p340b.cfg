// Patch 340, arm B -- the LISTEN server: no sv_guidkey, so *phash is empty and
// the customizer must say "no id" rather than draw an empty box.  The
// colour loop still runs (it only needs lobby_enable + lobby_avatars), so
// cl_pcolour and the chat colour must still resolve -- the hash is the only
// thing the missing key takes away.
//
// Headless: ftesurf64.exe -WindowStyle Minimized +exec cfg/test/p340b.cfg
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p340b
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
vid_width 1280
vid_height 720
fs_missingwarn 0
set name SoloTest
set lobby_enable 1
set lobby_avatars 1
wait 300
map bhop_mom_training_beta
waitms 10000
menu_restart          // see p340a: the builtin menu is up from boot and
waitms 500            // togglemenu alone re-opens it; ui_close is the way back
ui_close
waitms 500

echo === cl_pcolour must be 1..12; the hash line on the open panel must say
echo === "no id" (no sv_guidkey here) -- the screenshot is that check:
cl_pcolour

cmd say solo chat line
waitms 1200
hud_player open
waitms 600
screenshot p340b_nohash
quit
