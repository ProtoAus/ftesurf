// P226 -- the completion list as a FLOATING popup (con_completiondown 2).
//
// THE CLAIM IS ABOUT WHAT DOES NOT MOVE, so one screenshot cannot make it.  Four
// input strings with wildly different match counts are photographed at one
// console geometry; the input line has to be on the same scanline in all four.
//
//   a  "map kits"            3 rows + the ordinal
//   b  "cl_c"                con_completionrows (12) + the ordinal
//   c  "map surf_kitsune2"   1 row + the ordinal
//   d  "zzqqxnomatch"        no rows at all -- the popup must not draw a bare box
//
// Then the same four at con_completiondown 1, where the field is SUPPOSED to
// move: that is the control, and without it "it did not move" cannot be told
// apart from "the console did not redraw".
//
// Finally the flip: with the window dragged to the bottom of the screen there is
// no room under the field, and the popup has to appear ABOVE it instead of
// hanging off the screen.

log_enable 1
log_dir "logs"
log_name "p226"
cfg_save_auto 0
vid_fullscreen 0

// developer 0, DELIBERATELY.  `developer 1` + `log_developer 1` turns a surf_null
// load from 8s into 61s (measured, interleaved) because the VBSP entity lump
// raises 4033 "'hammerid' is not a field" warnings and every one of them is
// formatted, pushed onto the console and flushed to disk.  Nothing this test
// checks is developer output -- con_selftest prints through Con_Printf, which
// log_enable captures on its own.
scr_sshot_type png

wait 200
map surf_null
waitmap 240
wait 60

con_window 1
con_window_rect "240 140 900 460"
con_displaypossibilities 2
con_completionrows 12
sv_mapcompletion 1

echo ""
echo "=== the new cvars must exist and read their defaults ==="
con_completiondown
con_completionenter
wait 6
echo ""

echo "=== con_selftest, which now covers the Tab/Enter split ==="
con_selftest
wait 20
echo ""

toggleconsole
wait 20

// ---------------------------------------------------------------- popup ------
con_completiondown 2
waitms 400

con_settext map kits
waitms 1500
screenshot p226_pop_a_3rows
waitms 1500

con_settext cl_c
waitms 1500
screenshot p226_pop_b_12rows
waitms 1500

con_settext map surf_kitsune2
waitms 1500
screenshot p226_pop_c_1row
waitms 1500

con_settext zzqqxnomatch
waitms 1500
screenshot p226_pop_d_norows
waitms 1500

// --------------------------------------------------------------- control -----
con_completiondown 1
waitms 400

con_settext map kits
waitms 1500
screenshot p226_band_a_3rows
waitms 1500

con_settext cl_c
waitms 1500
screenshot p226_band_b_12rows
waitms 1500

// ------------------------------------------------------------------ flip -----
// The window's bottom edge is now a couple of rows off the bottom of the screen,
// so a 13-row popup cannot fit below the field and has to flip above it.
con_completiondown 2
con_window_rect "240 540 900 640"
waitms 400
con_settext cl_c
waitms 1500
screenshot p226_flip_above
waitms 1500

con_window_rect "240 140 900 460"
con_settext
waitms 200

echo ""
echo "=== p226 done ==="
wait 20
quit
