// P462NETCL -- the strafe trainer against a REAL server, client half.
// Server: p462nets.cfg, which must already be up on 27695.
//
// IT WORKS NOW.  The earlier cut of this pair did not, and the reason is worth
// keeping because it nearly produced a wrong conclusion about the patch.
//
// HOW TO RUN IT -- the server half is a REAL dedicated server, not a second
// listen server, and both halves of that matter:
//
//   pwsh> Copy-Item C:\FTEQuaketeqwsv64.exe C:\FTESurf\   # once; gitignored
//   pwsh> $sv=@{FilePath="C:\FTESurfteqwsv64.exe";
//              ArgumentList="+exec","cfg/test/p462nets.cfg","+map","surf_dune";
//              WorkingDirectory="C:\FTESurf"}
//   pwsh> Start-Process @sv -WindowStyle Minimized; Start-Sleep 24
//   pwsh> $cl=@{FilePath="C:\FTESurftesurf64.exe";
//              ArgumentList="-WindowStyle","Minimized","+exec","cfg/test/p462netcl.cfg";
//              WorkingDirectory="C:\FTESurf"}
//   pwsh> (Start-Process @cl -PassThru).WaitForExit()
//   pwsh> Get-Process fteqwsv64 | Stop-Process -Force
//
// `+map` MUST be on the command line: a `map` inside the exec'd cfg runs too
// late and dies with "Couldn't load a map. You may need to use the -basedir
// argument", which reads like a path problem and is not.  And ftesurf64.exe
// -dedicated does NOT work -- it loads the map and exits.
//
// WHAT WENT WRONG THE FIRST TIME, because it is the interesting part.  The
// server half was a second ftesurf64.exe, i.e. a LISTEN server, which brings
// its own local player: one server log with `client Proto connected` AND
// `client (1)Proto connected`, two bodies, and mine never moved.  The arm read
// `v 0->0` and `ideal 5872.7` and the obvious conclusion was "the stat does not
// cross the network" -- which was wrong, and 5872.7 is simply
// Strafe_IdealTurn's speed<1 clamp, i.e. the trainer correctly describing a
// stationary body.  What caught it was `cmd viewpos`, a reading INDEPENDENT of
// the subject: +right turns the view client-side whether or not the body is in
// the game, so a measured turn rate says nothing about the body.  Those three
// viewpos calls stay in for that reason.
//
// WHAT IT MEASURED, 2026-09-28, against fteqwsv64 on 27695:
//
//   server's own read after the run-up   velocity 0 -260 0   horizontal 260.0000
//   trainer's first strafe               v 260->282
//     -> Trn_Speed agrees with the server EXACTLY, at a non-zero value, across
//        the wire.  That is the whole question this pair exists to answer.
//   cl_yawspeed 420, measured            rate 420.0   ideal 425.8   q 0.995
//   a strafe that hit a ramp             dur 165ms but graded 120ms
//   a strafe with nothing gradeable      graded 0ms, q -1.000, and the panel
//     draws it grey with "-" rather than a zero -- the third verdict, on screen
//   client VM errors over ~10 s with the panel on     0
//
// The screenshot has this client's texture warnings over the top of the panel
// (surf_dune resolves several to no_texture on this install); the rows are
// still legible and p462trn.cfg is where the clean picture is.
//
// WHAT IS UNDER TEST, and it is narrower than p462trn.cfg on purpose.  That arm
// proved the MEASUREMENT (rate against an authored cl_yawspeed, sync against an
// authored offset, both with a control build).  This one proves only that the
// whole thing still works when the speed it grades against arrives over the
// wire in a snapshot instead of out of the same process:
//
//   1. trainer lines appear at all, with a plausible v -- the stat is reaching
//      Trn_Speed across the network.
//   2. the panel draws -- the screenshot, because a counter of intent is not
//      evidence of ink (CLAUDE.md).
//   3. NO client VM errors and NO `Unknown command`, which is what a bad
//      registercvar, a bad .src order or an out-of-bounds array read would
//      produce -- and an out-of-bounds read in the client VM takes the renderer
//      down rather than misdrawing, so its absence is worth grading.
//
// The gesture is the one the feature was asked for: hold jump, let pm_autobunny
// hop, and alternate the strafe keys with the view.  Each hop is its own jump in
// the panel.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p462netcl
con_notifytime 0
developer 1
log_developer 1                 // Con_DPrintf is gated twice; AGENTS.md:899
cl_idlefps 0
cl_maxfps 250
vid_fullscreen 0
vid_width 1280
vid_height 720
fs_missingwarn 0
// The prestrafe assist WRITES input_movevalues_x, and it was one of the three
// open suspects for the body not moving.  Off, so the usercmd is the config's.
set run_prestrafe 0
waitms 5000
connect 127.0.0.1:27695
waitms 9000
menu_restart
waitms 500
ui_close
waitms 1500

hud_trainer 1
hud_trainer_trace 1
hud_trainer_rows 6
seta hud_trainer_x 0.28
seta hud_trainer_y 0.27
set hud_scale 2
waitms 500

echo === PREMISE: connected to a remote server, and the movevars came over the wire.
echo === pm_ticrate is what the ideal rate is derived from, so it is read back.
pm_ticrate
hud_trainer
cl_yawspeed

// Build speed, then hold jump so pm_autobunny keeps hopping.  Short run-up:
// surf_dune's start has a teleport about 325 units out and 1600 ms of +forward
// reaches it (p462trn.cfg records that finding).
// THE PREMISE THE FIRST CUT DID NOT CHECK, and it cost a wrong conclusion.
// That cut read `v 0->0` and `ideal 5872.7` (which is exactly
// Strafe_IdealTurn's speed<1 clamp) and the obvious reading was "the stat does
// not cross the network".  But +right turns the VIEW client-side whether or not
// the body is in the game, so a measured turn rate proves nothing about the
// body -- the arm had no way to tell a broken stat from a player who never
// moved.  cmd viewpos is the SERVER's own answer and is independent of
// everything the trainer does.
echo === BEFORE: the server's own position and speed. WANT: a real position.
cmd viewpos
waitms 300

echo === bhop, alternating strafes -- the gesture the panel was asked for
+forward
waitms 600
echo === after 600 ms of +forward. WANT: horizontal well above 0.
cmd viewpos
waitms 200
+jump

cl_yawspeed 420
+moveright
+right
waitms 300
-right
-moveright

cl_yawspeed 420
+moveleft
+left
waitms 300
-left
-moveleft

+moveright
+right
waitms 300
-right
-moveright

+moveleft
+left
waitms 300
-left
-moveleft

+moveright
+right
waitms 300
-right
-moveright

-jump
-forward
echo === AFTER the strafes, still the server's own read:
cmd viewpos
waitms 600

echo === the panel, drawn from a stat that crossed the network:
screenshot p462_net
waitms 500

echo === and it must still switch off cleanly on a remote server
hud_trainer 0
waitms 400
screenshot p462_net_off
waitms 300
quit
