// Patch 416 -- THE RESUMED SESSION'S OWN NONCE, on a listen host.
//
// The second of SV_RecNonce's two call sites, and the only one the subject arm
// (p416nonce.cfg) does not reach: SV_MsRecAttach.  A Multi-Session resume can
// be a different machine days later, so the header's nonce is a number that
// client never saw -- the recorder writes a fresh one into the BODY and stuffs
// it, and the client answers that one.
//
// It is ms1listen.cfg's arm B in shape and NOT in setting: bhop_eazy rather
// than surf_666, because that map's zones are online and the surf_666 arm needs
// a JSON fixture installed under maps/zones/local first.  The finish is
// b352fin.cfg's noclip flight, which taints the run and does not touch what is
// measured here.  No `set rec_terms`: this install's data/consent.txt already
// grants, and setting that cvar by hand is not a thing a harness does.
//
// Run from C:\FTESurf:
//   ./ftesurf64.exe -WindowStyle Minimized +exec cfg/test/p416ms.cfg
// then:
//   grep -n "^nonce \|^flags\|^pause \|^session " ftesurf/data/runs/bhop_eazy/main/cheat.rec
//   python tools/reccheck.py -v ftesurf/data/runs/bhop_eazy/main/cheat.rec
//
// PRE-REGISTERED PREDICTIONS
//  M1  the file is v10 and carries a `pause ... server` and a `session 2`.
//      Without those the run was never parked and this arm measured nothing.
//  M2  exactly ONE body `nonce <mt> <hex32>` record, and its hex DIFFERS from
//      the header's.  Same value in both would mean the resume re-published the
//      old number rather than drawing one.
//  M3  the record sits between the `pause` and its `session`: SV_MsRecAttach
//      runs before the first move of the new session, and the nonce
//      deliberately does not open the session itself.
//  M4  `flags` has bit 131072 (TF_NONCE) SET at the finish -- the client
//      answered the SECOND nonce.  The bit is cleared when the new one is
//      issued, so a set bit here cannot be session one's answer.
//  M5  reccheck.py: 0 faults.
//  NOT MEASURED HERE: the .hid note.  A Multi-Session run drops its sidecars
//      (rec_rp_ms, cl_replay.qc), so there is no journal to read; p416nonce.cfg
//      carries that half.
// FALSIFIED IF the body record is missing or equals the header's, if it lands
//   outside the pause, if the flag is clear, or if reccheck faults.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p416ms
developer 1
cl_idlefps 0
cl_maxfps 100
sv_cheats 0
fs_missingwarn 0

set rec_enable 1
set rec_stream 0
set rec_runarchive 1
set rec_hid 1
set run_resume_min 1
set run_resume_countdown 1

waitms 6000
map bhop_eazy
waitmap 45
waitms 3000

echo ================================ P416 MS -- aim and start
cmd zone_goto 0
waitms 1000
setpos -352 -352 144 0 335.3 0
waitms 1000
+jump
waitms 700
-jump
waitms 2500
cmd timer

echo ================================ P416 MS -- park on a map reload
map bhop_eazy
waitmap 45
waitms 4000
cmd timer

echo ================================ P416 MS -- resume: a fresh nonce is issued here
cmd ms_resume
waitms 4000
cmd timer

echo ================================ P416 MS -- fly to the end zone
noclip
waitms 500
+forward
waitms 1500
cmd timer
waitms 2900
cmd timer
waitms 2000
-forward
waitms 1500

echo ================================ P416 MS -- after the end zone.  Expect FINISHED.
cmd timer
waitms 2500

echo ================================ P416 MS done
waitms 500
quit

