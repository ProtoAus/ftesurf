// Patch 457 -- the avatar particle CAP and the viewer's own off switch.
//
// WHAT THIS EXISTS FOR.  Two claims were being made without a test behind
// either of them:
//
//   1. "other players see your trail".  Every arm so far has driven the trail
//      through Av_Dress -- the panel preview or the ghost stand-in -- which is
//      the LOCAL path.  The path other people actually get is the avatar: the
//      server resolves lobbyfx, Lobby_ApplyFX picks the block, and it reaches a
//      viewer either as .traileffectnum on an engine entity or, with
//      lobby_av_stream 1 (the default), as a pose-stream body in cl_body.qc.
//      Nothing had ever exercised that.
//
//   2. lobby_av_fxmax.  Patch 457 changed its default from 8 to -1 and made
//      NEGATIVE mean "no cap", keeping 0 as "no particles, glow still on".  A
//      cap that is never reached is a cap that cannot be shown to work.
//
// HOW ONE CLIENT CAN TEST A THING ABOUT OTHER PLAYERS.  lobby_av_self 1 sends
// you your OWN avatar, which is otherwise dropped before it is networked
// (sv_ents.c:4213).  That body is an ordinary avatar and takes the ordinary
// path, so it answers both questions without a second client -- and
// cl_trailself 0 is what keeps Av_SelfTrail out of the measurement, so any
// ftesurf_avtrail in the table came from the BODY and not from the local
// emitter.
//
// THREE CUTS, one variable each, all read from the client's own particle table:
//
//   A  fxmax -1, cl_avfx 1   ->  a trail.  Baseline: the avatar path works.
//   B  fxmax -1, cl_avfx 0   ->  none.     The VIEWER's switch hides it.
//   C  fxmax  0, cl_avfx 1   ->  none.     The SERVER's cap strips it.
//
// B and C look identical in the table and are not the same thing: in B the
// server still sent the effect and this client declined to draw it; in C the
// server never granted it.  That is why both are here -- a single "no trail"
// cut would not tell them apart, and each one is the other's control.
//
//   pwsh> $s=@{FilePath="C:\FTESurf\ftesurf64.exe";
//             ArgumentList="-WindowStyle","Minimized","+exec","cfg/test/p457fx.cfg";
//             WorkingDirectory="C:\FTESurf"}
//   pwsh> (Start-Process @s -PassThru).WaitForExit()
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p457fx
con_notifytime 0
developer 1
log_developer 1                 // Con_DPrintf is gated twice; AGENTS.md:899
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
vid_width 1280
vid_height 720
fs_missingwarn 0
sv_public 0
sv_port 27692
set lobby_dir ""
set run_resume 0                // a resumed run is HELD, and a held body emits nothing

waitms 4000
map surf_dune
waitmap 45
waitms 5000
menu_restart
waitms 500
ui_close
waitms 1500

// THE LOBBY, ON.  Without this Lobby_Frame returns at sv_lobby.qc:1522 before
// it resolves anything, no avatar is spawned, and all three cuts below would
// read "no trail" for the same uninteresting reason.
lobby_enable 1
lobby_avatars 1
lobby_av_fx 1
lobby_av_stream 1
lobby_av_self 1                 // ...send me my own, or there is no body to watch
cl_trailself 0                  // ...and keep the LOCAL emitter out of the table
setinfo lobbyfx 1               // trail only: motes emit standing still and would
                                // muddy a table read while walking
setinfo lobbytrail 9            // blue, so the block name says which colour resolved
setinfo lobbylen 0              // densest stop: 16 units per particle, fires soonest
waitms 2500                     // the resolve is 1 Hz -- give it two passes

echo === the cvars this arm turns on, read back rather than assumed:
lobby_enable
lobby_av_self
lobby_av_fxmax
cl_avfx
cl_trailself

// ---- A: no cap, viewer showing -- WANT ftesurf_avtrail1_9 ------------------
echo === CUT A: fxmax -1, cl_avfx 1.  WANT: ftesurf_avtrail1_9 running.
lobby_av_fxmax -1
cl_avfx 1
waitms 1500
+forward
waitms 1500
r_partinfo
-forward
waitms 2500                     // stop 0 dies in 0.45-0.70 s; let the pool drain

// ---- B: no cap, viewer hiding ---------------------------------------------
echo === CUT B: fxmax -1, cl_avfx 0.  WANT: no avtrail -- the VIEWER declines.
cl_avfx 0
+forward
waitms 1500
r_partinfo
-forward
waitms 2500

// ---- C: cap at 0, viewer showing ------------------------------------------
echo === CUT C: fxmax 0, cl_avfx 1.  WANT: no avtrail -- the SERVER strips it.
cl_avfx 1
lobby_av_fxmax 0
waitms 2500                     // the cap is applied by the 1 Hz resolve, not now
+forward
waitms 1500
r_partinfo
-forward
waitms 500

quit
