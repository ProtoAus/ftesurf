// B43SELF -- the two selftests, as a regression against phase 3.
//
// pm_selftest is here because the stage arm rule reads run_t_groundat and
// run_t_dwell through SV_StageJump, which are the movement code's own fields --
// so a change to the stage machine that moved one of them would show up as a
// physics failure long before anyone noticed a wrong stage time.
//
// zone_selftest is here because SV_StageZone is a NEW consumer of the zone
// table (zone_type / zone_track / zone_seg), walking it by identity where
// nothing walked it that way before.  If the two geometry primitives it leans on
// have drifted, this says so against answers worked out by hand rather than
// against whatever the code currently does.

log_enable 1
log_dir "logs"
log_name "b43self"
developer 1
log_developer 1
cfg_save_auto 0
vid_fullscreen 0
sv_cheats 1
fs_missingwarn 0

wait 200
map bhop_eazy
waitmap 1800
waitms 2500

echo ^5=== b43self: pm_selftest ===
pm_selftest
waitms 1200

echo ^5=== b43self: zone_selftest ===
zone_selftest
waitms 1200

echo ^5=== b43self: done ===
quit
