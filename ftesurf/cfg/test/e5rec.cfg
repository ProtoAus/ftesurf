// E5 -- RECORD ME A REAL RUN.  Setup only; you drive.
//
// exec cfg/test/e5rec.cfg      then       map surf_kitsune      then play.
//
// ---------------------------------------------------------------------------
// WHAT THIS IS FOR
//
// Build 83 taught the recording to write `warp` -- state imposed on the player
// from outside the mover.  It covers teleports, and it covers trigger_push's
// SF_PUSH_ONCE arm.  A census of all 1310 maps says that second one is worth
// nothing: there is EXACTLY ONE SF_PUSH_ONCE trigger_push in the whole library,
// on mg_dreamscraper, which is neither zoned nor a surf or bhop map.
//
// What the library actually has is 1,284 CONTINUOUS trigger_push volumes across
// 181 of the 536 zoned maps, and the continuous arm writes no velocity at all.
// It writes a CARRIER the engine folds into pmove.basevelocity, which moves you
// while you are in the volume and is then cashed out as real velocity one
// command after you leave.  None of that is in the recording.
//
// Measured on a scripted run, comparing each sample's displacement against what
// its own recorded velocity can explain:
//
//     before the pad      gap    0.07 u      (rounding)
//     the cash-out tick   gap   20.17 u      = 1344.6 u/s unexplained
//     after the pad       gap   -0.03 u      (rounding)
//
// plus a 1712.79 u/s velocity step at the cash-out with nothing in the file
// saying why.  So the effect is real and it is large.
//
// WHY A SCRIPT CANNOT FINISH THIS.  The measurement needs the push crossed WELL
// INTO the run.  Four scripted sites failed, each differently -- and the last
// one is the reason this file exists:
//
//   bhop_hades      boosters 5,400 u from the start; a blind run reached none.
//   surf_hourglass  its one push sits INSIDE the start box, so both cash-outs
//                   fired while the timer was merely armed.
//   surf_fantasy    correct geometry on paper, and a WALL inside the start box
//                   stopped the walk dead at y -14416.
//   surf_ecosystem  worked -- the push fired inside a clean v7 run -- and the
//                   measurement still came out null, because the push is close
//                   enough to the start that the cash-out landed on the run's
//                   FIRST packet.  pm_recsim seeds the open loop from that
//                   packet, so the impulse was baked into the seed and arm 3
//                   sailed through it: first-past-1u at row -1, never diverged.
//
// Every map a config can steer to a booster has the booster at the start.  A
// real run crosses one in the middle, which is the only case where the missing
// record actually costs anything.  Hence: you play, I measure.
//
// ---------------------------------------------------------------------------
// WHAT MAKES A USABLE RUN -- in priority order
//
//   1  IT MUST FINISH.  SV_RecClose has exactly one call site and it is the
//      finish.  A run you abandon leaves NO file at all -- not a short one, not
//      a partial one, nothing.  This is the single most likely way to spend a
//      good run and get no data.
//
//   2  The push must be crossed at least a couple of seconds IN, not off the
//      start.  That is the whole point; see surf_ecosystem above.
//
//   3  Clean, so `flags 0`.  No noclip, no setpos, no practice mode.  A tainted
//      recording is as easy to wave away here as it would have been for E3.
//      Restarting the run is completely fine -- only the finished attempt is
//      written.
//
//   4  It does NOT need to be fast, or good.  Slow and scrappy is perfect.  The
//      mover does not care and neither does the measurement.
//
// ---------------------------------------------------------------------------
// MAPS, and why these three
//
//   surf_kitsune        ONE continuous push in 115 entities.  The best first
//                       run: with a single push in the map, anything the
//                       re-simulation cannot reproduce is either that push or
//                       is not the carrier at all.  No ambiguity to argue about
//                       later.  A lobby is sitting on it.
//
//   bhop_monster_jam    TWO pushes, and bhop is far easier to play
//                       consistently than surf.  Already in the corpus, so its
//                       recordings have been read before.
//
//   surf_trance         TEN boosters in a row -- 300, 400, 500, 600, 700, 800,
//                       900, 1000, 1100, 5000 u/s, all pointing the same way in
//                       96-unit steps.  This is the RIDE at its most extreme
//                       and it is the case that decides the format question: if
//                       a long ride only has to be right at its ENDPOINTS, an
//                       event record is enough and the next build is cheap.  If
//                       the middle of the ride matters, the carrier needs a
//                       value with a DURATION, which is a shape the format does
//                       not have today.  One run through that corridor answers
//                       it.  Worth doing even if it is a scrappy run.
//
// Any other map with a booster on the route is welcome too -- these three are
// just the ones whose answers I can already argue about.
//
// ---------------------------------------------------------------------------
// WHAT YOU WILL SEE, and it is the proof the run is worth sending
//
// run_bv_debug 1 prints a line to the console EVERY time a carrier is cashed
// out, as it happens:
//
//     basevel: paid #1 [AddOutput 0] '-1700.000000 -0.000149 0.000000'
//                                    -> speed 1972.8 (h +1712.8, v +0.0)
//
// If you see one of those a few seconds into a run and then finish, that run is
// exactly what I need.  If you see none, the route missed the boosters and the
// run is not useful -- which is worth knowing before you send it.
//
// `paid` counts every cash-out; `[AddOutput n]` counts only pad writes, so
// paid > AddOutput means it came from a trigger_push, which is the one under
// test.
//
// ---------------------------------------------------------------------------
// WHERE THE FILE LANDS
//
//     data/runs/<map>/main/<ticks>_<tag>.rec
//
// Tell me the map and I will find it.  Nothing here uploads anything, nothing
// touches the fleet, and nothing is submitted to a board -- this is a listen
// server writing to your own disk.
//
// `set` on every one of these, not a bare assignment: rec_enable, rec_stream
// and run_bv_debug are read with a bare cvar() and registered in worldspawn or
// not at all, so a bare `rec_enable 1` before the first map load is Unknown
// command and the default silently stands -- which produces a MISSING FILE,
// i.e. the same symptom as the recorder failing.

// KEEP THE WITNESS.  The first pair of real runs was played without this, and
// the `basevel: paid` lines -- the only independent statement that a booster was
// crossed at all -- went to the console and nowhere else.  conhistory.txt is the
// COMMAND history, not console output, so nothing survived the session.  The
// recording is the thing under test; the proof that a push fired has to come
// from somewhere other than the file, and that means it has to be on disk.
log_enable 1
log_dir logs
log_name e5rec

set rec_enable 1
set rec_stream 1
set rec_runarchive 1

// The build-83 rule, pinned here so the recording states what it was taken
// under rather than inheriting it.
set run_startjitter 2

// THE INDEPENDENT WITNESS.  The recording is the thing under test, so the proof
// that a push was crossed has to come from somewhere other than the file.
set run_bv_debug 1

sv_cheats 0

echo ""
echo "^3E5 recorder armed.^7"
echo "  1. map surf_kitsune      (or bhop_monster_jam, or surf_trance)"
echo "  2. play a run and ^3FINISH IT^7 -- an abandoned run writes no file at all"
echo "  3. watch for ^3basevel: paid^7 lines a few seconds in; that is the booster"
echo "  4. clean run, no noclip/setpos -- restarting is fine, only the finish is written"
echo "  file lands in data/runs/<map>/main/ -- tell me the map"
echo ""
