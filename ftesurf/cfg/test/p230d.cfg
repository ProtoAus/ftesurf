// The classname aliases (Build 35).  Five classnames the FGD declares, that
// FTESurf now spawns, and that ZERO of the 1310 maps in the library use -- so
// there is nothing on disk that would exercise them and nothing that would tell
// me if I had misspelled one.  A compile only proves the functions exist; it
// cannot prove the engine's spawn-function lookup finds them under the name a
// mapper would actually type.
//
// So the entities are synthesised: ftesurf/maps/bhop_ambience.ent is the map's
// own entity lump (sv_loadentfiles 1, gl_model.c:2727) with five props appended,
// one per alias, all carrying the same crate model the map already ships and
// NO "solid" key -- so what is under test is precisely the defsolid each alias
// passes to SV_SpawnProp.
//
//   baseline (map as shipped):  props: 36 spawned (36 solid, 0 scaled)
//   expected with the .ent:     props: 41 spawned (39 solid, 0 scaled)
//
//   41 = 36 + 5              every alias reached SV_SpawnProp
//   39 = 36 + 3              prop_physics_respawnable, simple_physics_prop and
//                            prop_sphere are VPHYSICS; prop_physics_ragdoll and
//                            prop_hallucination are deliberately NOT solid
//
// A miss shows up as 36/40, not as an error: an unknown classname is removed and
// counted by ent_census, which is why ent_census is printed below rather than
// trusted to be empty.
//
// THE .ent IS NOT KEPT.  It overrides the real map for every later run, so it was
// deleted once this passed.  To rebuild it: take lump 0 of the shipped
// bhop_ambience.bsp (LZMA-framed -- 'LZMA' magic, then uncompressed size, then
// compressed size, then 5 bytes of filter props), strip the trailing NUL, append
// one block per classname of the form
//     { "classname" "<alias>"
//       "model" "models/props/cs_militia/crate_stackmill.mdl"
//       "origin" "<x> 20 83"  "angles" "0 90 0" }
// with x stepping -1068, -988, -908, -828, -748, re-append the NUL, and write it
// to ftesurf/maps/bhop_ambience.ent.

log_enable 1
log_name p230d
developer 1
cfg_save_auto 0
cl_idlefps 0
sv_cheats 1

wait 200
echo ^5=== p230d: classname aliases ===

map bhop_ambience
waitmap 900
wait 120

echo ^5(expect: props: 41 spawned (39 solid, 0 scaled))
echo ^5(expect: ent_census lists NONE of the five alias classnames)
ent_census
waitms 400

// The five crates are in a row at y=20, x from -1068 east, floor z=83.
// Stand back and look north-east along the row.
setpos -1000 -180 140 12 65 0
wait 60
screenshot
waitms 800

echo ^5=== p230d done ===
wait 30
quit
