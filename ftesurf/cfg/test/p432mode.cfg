// P432MODE -- Patch 432: the two other ways the path draws.  hud_watch_path_mode 1 (the
// world ribbon, now fed from the run line) and hud_watch_path_ahead 0 (the line ends at
// the playhead), on surf_rookie r47 stage 5 at 34.3.  Screenshots p432mode_ribbon /
// p432mode_ahead0; the log must carry no QC error.
//
// RESULT (2026-09-22): no QC error.  ribbon: the green world ribbon with the stage's
//  loop, from the run line's points; ahead0: nothing drawn at this view -- the played
//  part (32.2 -> 34.3) is behind and under the camera, the rest is hidden.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p432mode
developer 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0
set run_resume 0
sv_public 0
sv_port 27688
set lobby_dir ""
set hud_watch_skipidle 0
set hud_watch_path_ahead 1

wait 200
map surf_rookie
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 1000
replay online 47 5
replay pause
replay seek 34.3
hud_watch_path_mode 1
waitms 1500
screenshot screenshots/p432mode_ribbon.png
waitms 500
hud_watch_path_mode 2
hud_watch_path_ahead 0
waitms 1500
screenshot screenshots/p432mode_ahead0.png
waitms 500
hud_watch_path_ahead 1
replay stop
quit
