// Patch 386 rig (d)(2) follow-up: the first map load of a FRESH Linux install runs on a stale hash.
// Found in p386case_l1: its first load (bhop_eazy) printed "hash STALE" with 4247 missed lookups, W1
// "valid" 443.  Between the two, the Linux listen server wrote $basedir/privkey.pem + fullchain.pem
// (GnuTLS makes a DTLS cert once; Windows' SChannel writes nothing), and COM_WriteFile below FS_GAME
// sets com_fschanged (fs.c:2022-2025).  A stale hash sends every lookup down the exact-case linear
// scan, i.e. fs_cache 0 behaviour, until the next map load rehashes (FS_RehashIfStale).
// Arms: F1 fresh rig-install (no .pem) on the ext4 fakesteam; F2 the same install again (.pem now
// there); W Windows scratch stage (control, never writes a .pem).
// PRE-REGISTERED 2026-09-19, before any arm ran:
//   F1 surf_okeycavetrails loads with "hash STALE" and hl2_unresolved 8 = W's 3 + the 5 asis VMTs
//      the census lists (realworldtextures2/metal/grate/metal_03, realworldtextures2/rock/slate_02,
//      silkroad/china/china_wall_tile01, silkroad/ground/pha_rock_03, tl/tile03); the second map
//      (bussn-bonus) loads "hash valid" with W's count (0).
//   F2 surf_okeycavetrails "hash valid", hl2_unresolved 3 (= W).  If F1 == F2 the pem is not the cause.
// RESULTS 2026-09-19 (ftesurf/logs/linux/p386first_{f1,f2,w}.log):
//   F1 okeycavetrails: "hash STALE", 3956 missed (F2/W 169); hl2_unresolved 3 -- my 8 FAILED: the
//      load-time count is taken before the cert write.  But hl2_missing adds exactly the 5 census
//      VMTs as "loaded after the map", and realworldtextures2/metal/grate/metal_03 is re-registered
//      on the ca_active and per-frame shader reloads as the fallback (sort 5, bits 0x10000) instead
//      of its VMT shader (sort 11, 0x10065, as F2 and W draw it).  Only metal_03 shows this in
//      the shader lines (review); for the other four the evidence is the hl2_missing rows.  So a
//      fresh install's first map can draw case-dependent materials as defaults, silently.  bussn-bonus
//      (second load) valid, 0.
//   F2 HELD: valid, 3, hl2_missing = W.  W: valid, 3.
//   FIXED by Patch 388 (the cert writer rebuilds the hash; build b0a96909b, log p388first_f1):
//      F1 on a fresh install now ends "hash valid", metal_03 registers as its VMT (sort 11,
//      0x10065), and none of the 5 census VMTs is "loaded after the map" (only the levelshots/
//      maps rows, as in F2/W).
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
developer 1
log_developer 1
fs_loadstats 1
waitms 3000
echo ======== P386CASE setup
fs_cache
echo ======== P386CASE map surf_okeycavetrails
map surf_okeycavetrails
waitmap 180
waitms 12000
echo ======== P386CASE report surf_okeycavetrails
mapname
hl2_unresolved
hl2_unresolved_visible
hl2_missing
echo ======== P386CASE end surf_okeycavetrails
echo ======== P386CASE map bussn-bonus
map bussn-bonus
waitmap 180
waitms 12000
echo ======== P386CASE report bussn-bonus
mapname
hl2_unresolved
hl2_unresolved_visible
hl2_missing
echo ======== P386CASE end bussn-bonus
echo ======== P386CASE done
quit
