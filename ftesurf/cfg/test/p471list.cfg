// P471LIST -- Patch 471: `sl_list` shows the speed the start-box gate reads.
//    python tools/p471list.py
//
// SL_ARM_SPEED is 1 u/s and the list printed `%4.0f`, so a row at 0.6 (arms) and
// one at 1.4 (does not) both read `1 u/s`.  The driver stages four saves on this
// map at 0.6, 0.99, 1.06 and 1.4 u/s -- two each side of the line, two of them
// within 0.06 of it -- and grades the list.
//
// PRE-REGISTERED
//  L1 all four rows are listed, each with its own speed to one decimal.
//  L2 `at rest` is printed on exactly the two rows under 1 u/s.
// CONTROL (the build before this patch): L1 and L2 fail -- all four read `1 u/s`.
//
// RESULT (2026-10-03): as predicted, both ways.  Numbers in tools/p471list.py.
log_enable 1
log_dir "logs"
log_name p471list
developer 0
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0
set run_resume 0
sv_public 0
sv_port 27711
set lobby_dir ""
con_notifytime 0

wait 200
map surf_colin_blaster_69000
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 2000

echo ^5=== p471list list ===
cmd sl_list
waitms 1500
echo ^5=== p471list done ===
quit
