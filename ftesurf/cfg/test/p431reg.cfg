// P431REG -- Patch 431 regression: a WHOLE-FILE open builds the same tables as before.
// Watch_Scan's pass two became Watch_ScanRange (the per-sample tables over a range) and
// the board sweep folded into pass one; over the whole file the result must not move.
// Eight files (online cache and local runs, four with a .view), each opened and
// `replay status`ed in the same frame (Watch_Frame stops a replay of another map).  Run twice with +set log_name:
//   p431reg-ctl  +set sv_csqc_progname csprogs_ctl431.dat   (HEAD 9d1436a's csprogs)
//   p431reg-new  (the patch)
// and diff them with the timestamps and the timing/drawing lines (`opened in`, `load`,
// `run fps`, probe, 2d, bbox, `path mode`, `fs:`, the new `view a..b`) removed, and
// `armed`/`cut` read as one word.
//
// PRE-REGISTERED: every `owner/t/window/view/still/path/fit/duck/view spans/seq/boards/
// ramp gaps/v4` line identical between the two logs, file by file.  Only the `view
// a..b` line is new (Patch 431) and `armed` reads `cut`.  `opened in` new << ctl on r47.
//
// RESULT (2026-09-22): the two logs' status lines, minus timing, are IDENTICAL for all
//  eight files (202 lines, 40 of them the fit/duck/still/seq/path counters, e.g. r47
//  `fit 33527 hermite 290 linear 39 snap  snaps 40 rec 0 kin`, `path 891 ctl -> 2036
//  curve`, `seq 256 rows ... boards 121`).  `opened in` ctl/new: r47 13290/392,
//  r18 241/183, r16 71/61, r3 45/46, ace pb 122/103, aesthetic pb 93/92, beginner pb
//  126/118, 4am cheat 313/314 ms.  The first run (-ctl/-new without the 2) paused and
//  waited, and Watch_Frame stops a replay of another map, so seven files printed
//  `nothing loaded` on both -- the arm as written above prints in the open's frame.
cfg_save_auto 0
log_enable 1
log_dir logs
developer 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0
set run_resume 0
sv_public 0
sv_port 27678
set lobby_dir ""
set hud_watch_skipidle 0

wait 200
map surf_rookie
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 1000
echo ^5=== p431reg f1 r47 ===
replay data/online/surf_rookie/main/08m26.580s_proto_r47.rec
replay status
waitms 300
echo ^5=== p431reg f2 aura r18 ===
replay data/online/surf_aura/main/04m08.325s_kap_r18.rec
replay status
waitms 300
echo ^5=== p431reg f3 eazy r16 ===
replay data/online/bhop_eazy/main/00m49.030s_kap_r16.rec
replay status
waitms 300
echo ^5=== p431reg f4 aesthetic r3 ===
replay data/online/surf_aesthetic/main/01m01.515s_player_r3.rec
replay status
waitms 300
echo ^5=== p431reg f5 ace pb ===
replay data/runs/surf_ace/main/0003695_pb.rec
replay status
waitms 300
echo ^5=== p431reg f6 aesthetic pb ===
replay data/runs/surf_aesthetic/main/0005191_pb.rec
replay status
waitms 300
echo ^5=== p431reg f7 beginner pb ===
replay data/runs/surf_beginner/main/0003828_pb.rec
replay status
waitms 300
echo ^5=== p431reg f8 4am cheat ===
replay data/runs/surf_4am/main/cheat.rec
replay status
waitms 300
replay stop
waitms 500
echo ^5=== p431reg done ===
quit
