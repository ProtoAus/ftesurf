// P400B -- Patch 400, extended after its review: every placement that sets velocity
// drops the push carrier (SV_ClearCarrier): zone moves, the `setpos` command, a
// save-lock load (and a retry restore), relative teleports, and trigger_teleport
// VelocityMode 1-3 -- as Source's TeleportEntity does whenever it is given a
// velocity.  bhop_arcane: *86 pushes +y at 1800 (x 6848..6976, y 3072..3584,
// z -128..0); start (1408,0,14400).  Listen server; NEW (+set sv_progs
// qwprogs400b) and CONTROL (+set sv_progs qwprogs400ctl, before Patch 400) with
// +set log_name.  data/saves/bhop_arcane is parked and restored by the runner.
//
// PRE-REGISTERED (the review's two high findings)
//  S  `cmd setpos` into *86, 60 ms, `cmd setpos 1408 0 14400`: NEW rests at (1408,0)
//     1.5 s later; CONTROL slides +y (the carrier paid out, as p400push measured).
//  L  `cmd sl_save` at the start, `cmd setpos` into *86, 60 ms, `cmd sl_load`: NEW
//     rests at (1408,0); CONTROL slides +y.
//  Z  (p400push's arm, again) `!r` from inside *86: NEW rests; CONTROL slides.
// FALSIFIED IF a NEW row moves off (1408,0) by more than 1 u, or a CONTROL row does
// not slide (then this harness does not see the bug).
//
// RESULT (2026-09-20).  ALL HELD.  NEW: S, L and Z all rest at (1408, 0.0, 14400).
//   CONTROL: S, L and Z all slide to (1408, 443.2) -- the carrier paid out after
//   `setpos`, after `sl_load` and after `!r`.  data/saves/bhop_arcane restored.
cfg_save_auto 0
log_enable 1
log_dir logs
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
sv_cheats 1
fs_missingwarn 0
set run_resume 0
sv_port 27682

wait 200
map bhop_arcane
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 1000
echo ^5=== p400b S setpos ===
cmd setpos 6912 3200 -120 0 90 0
waitms 60
cmd setpos 1408 0 14400 0 0 0
waitms 1500
cmd viewpos
waitms 1500
echo ^5=== p400b L sl_load ===
say !r
waitms 1500
cmd sl_save
waitms 800
cmd setpos 6912 3200 -120 0 90 0
waitms 60
cmd sl_load
waitms 1500
cmd viewpos
waitms 1500
echo ^5=== p400b Z !r ===
cmd setpos 6912 3200 -120 0 90 0
waitms 60
say !r
waitms 1500
cmd viewpos
waitms 1500
echo ^5=== p400b DONE ===
waitms 500
quit
