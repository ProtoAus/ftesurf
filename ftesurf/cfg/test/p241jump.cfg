// Build 39: does `e` hold flat across a jump, and is the HUD reading the
// predicted clock?
//
// THE REPORT: "the energy value in the center keeps updating when I jump? it
// starts at 45~ and counts up to 50 and then when I land it jumps back to zero?
// when I jump in Momentum mod surf, it read 57 flat until I land".
//
// 45 is right and flat is right.  hud_energy_ref 1 re-bases ui_jump_z to the
// ground you left at the instant you leave it, so a standing jump is exactly
// pm_jumpvelocity^2/(2*sv_gravity) = 45.0 above it and energy is conserved in
// flight -- the readout should therefore sit on 45 for the whole arc and land on
// whatever horizontal energy you carried.  It did not: org came from the
// predicted eye and vel from a server stat one snapshot old, which puts a term
// linear in v_z into z + |v|^2/2g, and that term sweeps one way across an arc.
//
// The `src` row on the debug panel says which clock is feeding it.  It must read
// `pred` throughout; `stat` means HUD_Feet's fallback fired and every number on
// screen is the build 38 quantity.  The disagreement beside it is legitimately
// non-zero -- 1/16 of a unit standing still, more on stairs -- and is the size of
// what build 39 removed.
//
// cl_maxfps is pinned so `wait N` is N/100 of a second and the shots land where
// they are meant to.  A jump to 45 units takes 0.336s up and the same down.

log_enable 1
log_name p241jump
developer 1
log_developer 1
cfg_save_auto 0
cl_idlefps 0
sv_cheats 1
cl_maxfps 100
fs_missingwarn 0

hud_debug 1
hud_energy 1
hud_energy_ref 1
hud_predicted 1

wait 200
map surf_aesthetic
waitmap 900
wait 300

echo ^5=== p241jump: standing, hud_predicted 1 ===
screenshot
wait 20

echo ^5=== p241jump: the arc ===
+jump
wait 8
screenshot
wait 12
screenshot
wait 14
screenshot
wait 20
screenshot
wait 20
screenshot
-jump
wait 40
echo ^5=== p241jump: landed ===
screenshot
wait 30

echo ^5=== p241jump: standing, hud_predicted 0 (build 38 path) ===
hud_predicted 0
wait 30
screenshot
wait 20

echo ^5=== p241jump done ===
wait 30
quit
