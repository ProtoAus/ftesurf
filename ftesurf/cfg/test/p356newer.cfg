// PATCH 356 -- pm_verify REFUSEs a format newer than it reads.
//
//   fteqwsv64 -basedir <install> +set sv_public 0 +set sv_port 27699
//             +set rec_enable 0 +map bhop_eazy +wait +wait +wait
//             +exec cfg/test/p356newer.cfg
//
// pm_verify skips records it does not know, so a v10 file (multi-session is
// planned) would be verified as one continuous run and could PASS.
//
// SUBJECT  data/b352fin.rec (v9, PASS ticks 660 under Patch 352+).
// DERIVED, one edit each:
//   N1 p356_v10.rec      header FTESURF-REC 10               -> REFUSE newer format
//   N2 p356_v10sess.rec  N1 + a `session` row after begin    -> REFUSE newer format
//   P1 p356_v9extra.rec  v9 + an unknown `stagepost` row     -> PASS ticks 660
// CONTROL: the Patch 354 binary PASSes N1 (so the gate is what refuses it).
//
// PRE-REGISTERED
//   1  S PASS ticks 660; P1 PASS ticks 660 (additive records still tolerated).
//   2  N1, N2 REFUSE "a newer format".
//   3  control: engine 354 on N1 prints PASS ticks 660.
// FALSIFIED IF: N1/N2 do not REFUSE, S or P1 change, or the control REFUSEs.
echo ================================ P356 S b352fin.rec
pm_verify data/b352fin.rec
echo ================================ P356 N1 v10
pm_verify data/p356_v10.rec
echo ================================ P356 N2 v10 + session
pm_verify data/p356_v10sess.rec
echo ================================ P356 P1 v9 + stagepost
pm_verify data/p356_v9extra.rec
echo ================================ P356 done
quit
