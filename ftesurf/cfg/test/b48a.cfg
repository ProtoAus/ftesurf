// B48A -- stats 85..89 arrive at a stage close.  Two boundaries, sampled
// before and after each; the run is never finished so nothing is written.
// Every crossing is a noclip flight (bhop_eazy's legs are 64u func_door blocks
// over fall teleports -- b46cheat.log tp 2 -- so a config cannot walk one), so
// every closed stage is cheated; that is fine here, the close report is raised
// before every refusal.  Read cl stats: (client, local) against stage close:
// (server reply) -- they must agree, and both must MOVE from 0.
log_enable 1
log_dir "logs"
log_name "b48a"
developer 1
log_developer 1
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0
sv_cheats 1
wait 200
map bhop_eazy
waitmap 1800
waitms 2500
hud_results 1
hud_results_toast 1
hud_results_rank 1
hud_splits 1
hud_splits_class 1
echo ^5=== b48a: 0. armed -- expect cl stats: endrec 0 endseg 0 endst 0 endticks 0 pbwas 0 ===
noclip
cmd zone_goto 0 0 0
waitms 700
cmd viewpos
timer
waitms 900
echo ^5=== b48a: 1. leave the start (+x), clock running, still endrec 0 ===
+forward
waitms 1000
-forward
waitms 500
cmd viewpos
timer
waitms 900
echo ^5=== b48a: 2. boundary 1 -- expect endrec 1 endseg 0, endst with bits 128 and 64, endticks > 0 ===
setpos 2200 512 144 0 0 0
waitms 300
+forward
waitms 1000
-forward
waitms 600
cmd viewpos
timer
waitms 900
echo ^5=== b48a: 3. boundary 2 -- expect endrec 2 endseg 1, toast stage 1 ===
setpos 200 -1728 144 0 180 0
waitms 300
+forward
waitms 1000
-forward
waitms 500
screenshot b48a_toast_x
waitms 700
screenshot b48a_toast
cmd viewpos
timer
waitms 900
echo ^5=== b48a: 4. still standing -- the five must not have moved ===
waitms 1500
cmd viewpos
timer
waitms 900
echo ^5=== b48a: done ===
quit
