// ***************************************************************************
//  BUILD 47 / ENGINE PATCH 269b -- THE REGIME THE USER ACTUALLY PLAYS IN.
//
//  jit07 ran at the user's ARCHIVED cl_maxfps 340 and came back clean on every
//  measure: simvel 0.0000 on 400/400 frames after a tap, against 322/400
//  nonzero with cl_predict_velblend 1 in the same run, and a screenshot of the
//  drawn panel reading `xyspd 0.00`.  The fix holds at 340.
//
//  The user then said: uncap the framerate, it works best at 12000.  That is
//  ~180 rendered frames per command against jit07's 5 and jit05/jit06's 19.
//  Nothing measured so far has been measured there, and "the fix held at 5 and
//  19" is not evidence about 180 -- this whole defect is defined by how many
//  rendered frames share one command.
//
//  Two things had to change to ask the question honestly:
//    * cl_maxfps 0 AND cl_idlefps 0, plus a small window, because the capture
//      instance is unfocused and must actually REACH the framerate the report
//      is about.  jit01 was invalidated by exactly this and reported a clean
//      result at 200fps for a defect that needs thousands.
//    * PT_MAX 512 -> 4096.  At 12000fps, 512 records span under three command
//      frames; a per-command pattern cannot appear in three samples of it.
//
//  EVERY section prints its own frames-per-command.  If a section did not
//  reach a high ratio, its nonzero count is not evidence of anything, and that
//  applies just as much to a section that comes back clean.
// ***************************************************************************

log_developer 1

waitms 2000

map surf_colin_blaster_69000
waitmap 240
wait 60

// ---- uncapped, everything else the user's -----------------------------
cl_maxfps 0
cl_idlefps 0
cl_netfps 66.6667
hud_predicted 1
hud_update -1
hud_round 1
hud_debug 1
hud_speed 1
hud_strafe 1
cl_predict_velblend 0
wait 120

echo ^5=== what framerate did we ACTUALLY reach?  Read this before anything else.
show_fps 1
waitms 2000

// ---------------------------------------------------------------------------
echo ^5=== 1: UNTOUCHED CONTROL, uncapped.  Never pressed a key.
// ---------------------------------------------------------------------------
cl_predtrace 4096
waitms 4000

// ---------------------------------------------------------------------------
echo ^5=== 2: THE REPRODUCTION at the user's framerate.  Tap, release, wait 1s.
// ---------------------------------------------------------------------------
+forward
waitms 400
-forward
waitms 1000
cl_predtrace 4096
waitms 4000

// ---------------------------------------------------------------------------
echo ^5=== 3: POSITIVE CONTROL -- old blend restored, same framerate.
// Without this section, a clean section 2 is unreadable: it could mean the fix
// works at 12000fps, or it could mean this capture never reproduced anything.
// ---------------------------------------------------------------------------
cl_predict_velblend 1
+forward
waitms 400
-forward
waitms 1000
cl_predtrace 4096
waitms 4000

// ---------------------------------------------------------------------------
echo ^5=== 4: fix again, and hold much longer -- 5 seconds after release.
// ---------------------------------------------------------------------------
cl_predict_velblend 0
+forward
waitms 400
-forward
waitms 5000
cl_predtrace 4096
waitms 4000

// ---------------------------------------------------------------------------
echo ^5=== 5: the drawn panel at this framerate, photographed.
// Eight shots, close together: the flicker is per-frame, so one shot proves
// nothing and a set of identical ones is the actual claim being tested.
// hud_veltrace is deliberately NOT used -- it prints per rendered frame and
// would throttle the client out of the very regime being measured.
// ---------------------------------------------------------------------------
+forward
waitms 400
-forward
waitms 1000
screenshot jit08_hud_a
waitms 60
screenshot jit08_hud_b
waitms 60
screenshot jit08_hud_c
waitms 60
screenshot jit08_hud_d
waitms 60
screenshot jit08_hud_e
waitms 60
screenshot jit08_hud_f
waitms 60
screenshot jit08_hud_g
waitms 60
screenshot jit08_hud_h
waitms 500

// ---------------------------------------------------------------------------
echo ^5=== 6: and the same eight shots with the OLD blend, for comparison.
// If the fix is working, this set should differ from set 5 and set 5 alone
// should be steady.  If BOTH sets are steady, the screen is not where the
// user's flicker lives and the search moves off the readout entirely.
// ---------------------------------------------------------------------------
cl_predict_velblend 1
+forward
waitms 400
-forward
waitms 1000
screenshot jit08_old_a
waitms 60
screenshot jit08_old_b
waitms 60
screenshot jit08_old_c
waitms 60
screenshot jit08_old_d
waitms 60
screenshot jit08_old_e
waitms 60
screenshot jit08_old_f
waitms 60
screenshot jit08_old_g
waitms 60
screenshot jit08_old_h
waitms 500

echo ^5=== END OF RUN ===
wait 20
quit
