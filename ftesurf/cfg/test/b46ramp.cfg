// B46RAMP -- the engine->QC field link, measured where it can actually fire.
//
// b46link.cfg asked this on bhop_eazy and the answer was inconclusive, which is
// worth writing down rather than quietly replacing: pm_source.c only touches the
// board and ramp fields when the plane it clipped has |normal_z| between
// PMSRC_MIN_RAMP_NZ (0.1) and standable (0.7) -- a face you SURF.  Flat ground is
// 1.0, so on a bhop map that branch never runs and `board: count 0` is what a
// perfectly healthy link prints too.  Five real jumps and a zero counter proved
// nothing at all.
//
// So: a surf map, where the first thing past the start box is a ramp.
//
//   run_rampcontact    engine writes 1 on any tick that clips a ramp face
//   run_rampnormal     engine writes the plane it clipped
//   run_boardnormal    \  engine writes these on a NEW board, i.e. an arrival
//   run_boardvelocity   > after enough air -- so they need a landing, not just
//   run_boardcount     /  contact
//
// All five are found by NAME through GetEdictFieldValue in sv_user.c, which does
// not include the QC and cannot be checked by the compiler.  Renaming the QC
// side alone leaves everything compiling and running with the strafe bar, the
// board grade and the booster pads silently dead.  This is the only test that
// says otherwise.
//
//   EXPECT, after riding the first ramp:
//     ramp: contact 1  ticks > 0            <- run_rampcontact + run_rampnormal
//     board: count > 0, plane non-zero      <- run_boardcount + run_boardnormal
//     rec plane: non-zero, v4 bit 16 set    <- the same values reaching the file
//
//   A ZERO IN EITHER after the player is demonstrably moving down a ramp is the
//   failure, and it means the engine binary in C:\FTESurf is older than the
//   rename -- the deploy, not the code.
//
// No noclip and no cheats: the run is left clean so nothing here can be confused
// with a taint test.  Nothing is finished, so data/runs is not written.

log_enable 1
log_dir "logs"
log_name "b46ramp"
developer 1
log_developer 1
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
sv_cheats 0
fs_missingwarn 0

wait 200
map surf_rise
waitmap 1800
waitms 2500

echo ^5=== b46ramp: armed in the start box, nothing touched yet ===
cmd zone_goto 0 0 0
waitms 800
cmd viewpos
cmd timer
waitms 800

echo ^5=== b46ramp: walk out and ride whatever is past the box ===
+forward
waitms 3500
cmd viewpos
cmd timer
waitms 900

echo ^5=== b46ramp: still going -- THE ASSERTION ===
waitms 2500
cmd viewpos
cmd timer
waitms 900
-forward

echo ^5=== b46ramp: and once more after the ride ===
waitms 1500
cmd viewpos
cmd timer
waitms 900

echo ^5=== b46ramp: done ===
waitms 600
quit
