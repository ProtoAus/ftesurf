// Controls prove the real filter acted on both sides of the pool flag.
ui_find surf_p698disabled
ui_find surf_dune
ui_find surf_aircontrol
ui_strip_test screen create
developer 0
con_notifytime 0
con_notifylines 0
togglemenu
waitms 2000
screenshot p698mappool
waitms 1000
echo RUNLINES COMPLETE
quit
