cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
vid_vsync 0
mastervolume 0
set rec_terms 1
set lobby_dir http://127.0.0.1:1
set ui_name_chosen 1
name MapPoolFixture
log_enable 1
log_dir logs
log_name runlines_smoke
log_developer 1
developer 1
waitms 15000
map surf_dune
waitmap 60
waitms 6000
menu_restart
waitms 2000
set rec_terms 1
set ui_maps_showall 1
