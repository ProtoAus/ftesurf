// Patch 386 rig (d)(2): the six mixed-case BSPs, loaded by their on-disk spelling and then typed
// lowercase (what surfd's lowercased map key, a vote or a player types would send).  Same markers
// as p386case.cfg, so tools/linux/rigcompare.py diffs it; labels are the name as typed.
// Arms: W1 Windows fs_cache 1; L1 Linux ext4 fakesteam fs_cache 1; L0 Linux ext4 fs_cache 0.
// PRE-REGISTERED 2026-09-19, before any arm ran:
//   M1 on-disk spelling loads on every arm (mapname = the on-disk spelling, a fs: line, no "Can't find").
//   M2 the plan (C3) predicts the lowercase load FAILS on Linux.  By reading, SV_Map_f's existence
//      probe (sv_ccmds.c:1127 COM_FCheckExists) and the world load both go through FS_FLocateFile,
//      whose fs_cache hash is case-insensitive, so I predict L1 LOADS every lowercase name (mapname
//      lowercase) and only L0 prints "Can't find maps/<lower>.bsp" for all six.  W1 loads all twelve.
// RESULTS 2026-09-19 (ftesurf/logs/linux/p386maps_{w1,l1,l0,l0x}.log):
//   M1 HELD: all six on-disk spellings load on W1, L1 and L0.
//   M2 plan FAILED, mine HELD: L1 loaded all six lowercase names (mapname lowercase, hash valid,
//      same content as W1; only a sound/misc/talk.wav miss lands in another section).  L0 (fs_cache
//      0 from boot) printed Can't find "maps/<lower>.bsp" for all six.  L0x (p386maps0.cfg) hit the
//      Linux log-write SIGSEGV (p386case.cfg) at its second load and counts for nothing.
//   The exact-case BSP path is the @spec/map prefer-hint form: p386mappref.cfg.
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
developer 1
log_developer 1
fs_loadstats 1
waitms 3000
echo ======== P386CASE setup
version
fs_cache
echo ======== P386CASE map bhop_addict_V2
map bhop_addict_V2
waitmap 180
waitms 5000
echo ======== P386CASE report bhop_addict_V2
mapname
hl2_unresolved
hl2_unresolved_visible
echo ======== P386CASE end bhop_addict_V2
