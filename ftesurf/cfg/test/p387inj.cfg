cfg_save_auto 0
// P387INJ -- core XTEST under XInput2 is rejected and counted (engine Patch 387),
// the X11 analogue of p306inj.cfg's SendInput arms.
// Debian rig as surf, Xvfb (no window manager), display :87 (:99 is taken by
// another session's xvfb-run, and WSL distros share the abstract X socket):
//   Xvfb :87 -screen 0 1024x768x24 +extension GLX &
//   DISPLAY=:87 RIG_TIMEOUT=600 bash rig-run.sh <install> x11 p387inj_<arm>
//     cfg/test/p387inj.cfg +set vid_fullscreen 0 +set vid_width 640
//     +set vid_height 480 +set developer 2 [+set x11_allow_xi2 0]
// THE DRIVER (scratch, not tools/): polls the log for each `=== P387INJ ...`
// marker. On READY it runs `xdotool search --sync --onlyvisible --name .
// windowfocus --sync` and GATES on "Grabbed mouse" (else VOID). Then 1 s after
// each arm's marker it fires:
//   motion = `xdotool mousemove_relative -- 3 0` / `-- -3 0` alternating, 10
//   per xdotool call, 70 ms between calls.
//   A' 50 moves  B 200 moves  C 50 moves  D `click --repeat 20 1` then
//   `click --repeat 5 5`  E `key --repeat 10 k`  H `xinput create-master C`,
//   then 200 moves.
//
// PRE-REGISTERED (trailer = `end ... <injected> <unenum> <legacybtn>`)
//   A  nothing injected: trailer `0 -1 -1`, no `i` record; would 0.
//   A' 50 moves with the menu open (not grabbed): injected +0. Counting is
//      grab-scoped, as on Windows.
//   B  200 moves: the `i` records sum to 200, which equals the trailer's
//      injected; zero `m`; every `v` has dx 0.
//   C  50 moves: exactly 50 (B:C = 4.00).
//   D  25 clicks = 50 raw button events: +50 injected. No `+`/`-` of 178 or
//      183 at any devid: the core release is guarded now (review NIT 3; a
//      pre-fix build writes 20 `- 178` + 5 `- 183` at devid 0).
//   E  10 keys: 10 `+`/`-` pairs of scancode 107 at devid 0, injected +0.
//      XTEST keystrokes arrive as core KeyPress and are accepted uncounted
//      (the known open door, like Windows' in_rawinput_keyboard 0).
//   H  the log has `XInput2: xtest "C XTEST pointer"` after the create-master;
//      the closing table lists it as xtest; 200 moves counted, zero `m`.
//   `cmd timer` would 0 throughout (the grant is Xvfb's own relative pointer).
// CONTROLS (must fail):
//   F  pre-387 build (23f1ce06b = ff940bfec's engine), same arms: B shows ~200
//      `m` from the XTEST devid, trailer injected -1; D shows `+ 178`. If F shows
//      no motion, the injection arms are VOID.
//   G  patched, launched with +set x11_allow_xi2 0: B lands as `m`, injected
//      -1, `cmd timer` would 1. The hole is open, but the run is demoted.
// FALSIFIED IF B or H has any `m` or a count != 200, A' counts, D shows a
// mouse-button record, or F shows no motion.
// closemenu closes the engine's built-in menu; ui_close is menu.dat's and was
// "Unknown command" in the rig (run 1 stayed in the menu from A' on: void).
// NOT RUN: the bypass review's XI1 device-request arm (XTestFakeDevice* on the
// physical slave). The patch is only shown to catch core XTEST requests.

exec cfg/test/_quiet.cfg

developer 2
log_developer 1
cl_maxfps 100
cl_idlefps 0
sv_cheats 0
m_filter 0
m_accel 0
cl_nocsqc 0
r_drawviewmodel 0

wait 200
map bhop_eazy
waitmap 600
waitms 5000
closemenu
ui_close
echo ^5=== P387INJ READY
waitms 10000

echo ^5=== P387INJ ARM A
in_rawmice
cmd timer
in_journal_begin
waitms 4000
in_journal_end data/p387_iA.hid
waitms 500

echo ^5=== P387INJ ARM A2
togglemenu
waitms 500
in_journal_begin
waitms 5000
in_journal_end data/p387_iA2.hid
closemenu
ui_close
waitms 1500

echo ^5=== P387INJ ARM B
in_journal_begin
waitms 5000
in_journal_end data/p387_iB.hid
waitms 500

echo ^5=== P387INJ ARM C
in_journal_begin
waitms 5000
in_journal_end data/p387_iC.hid
waitms 500

echo ^5=== P387INJ ARM D
in_journal_begin
waitms 6000
in_journal_end data/p387_iD.hid
waitms 500

echo ^5=== P387INJ ARM E
in_journal_begin
waitms 5000
in_journal_end data/p387_iE.hid
waitms 500

echo ^5=== P387INJ ARM H
in_journal_begin
waitms 7000
in_journal_end data/p387_iH.hid
waitms 500
in_rawmice
cmd timer
waitms 1500

echo ^5=== P387INJ END OF RUN
waitms 1000
quit

// ===========================================================================
// MEASURED 2026-09-19 -- Debian rig as surf, Xvfb :87, portable chroot build
// linux-build-387 (engine 7cb1179f1) at /home/surf/rig-387, and the pre-387
// control build (23f1ce06b = ff940bfec's engine) at rig-387pre.  R = 1 (one
// Xvfb relative slave).  closemenu before ui_close (the built-in menu; ui_close
// is menu.dat's and prints "Unknown command" here -- an earlier run left the
// menu open and B-H ran ungrabbed: void).  Per-arm grab state read from the log.
//   arm  387 (grabbed)                     pre-387 F (grabbed)
//   A    0 m/a/i (control)                 0 (control)
//   A'   50 a, injected 0 (ungrabbed;      50 a (ungrabbed)
//        counting is grab-scoped)
//   B    0 m, 20 'i', injected 200         200 m at devid 0 = "Virtual core
//        (rejected+counted; view still)     XTEST pointer"  <- the hole
//   C    0 m, 5 'i', injected 50 (B:C=4)   50 m
//   D    0 m, 25 'i', injected 50          75 key (clicks as core buttons)
//        (25 clicks = 50 raw btn events;   -- pre-387 has no reject
//        no + 178 record: NIT 3 guard)
//   E    20 key (scancode 107), inj 0      20 key -- XTEST keystrokes are core
//        (accepted uncounted, the door)     KeyPress, accepted on both
//   H    0 m, 20 'i', injected 200;        200 m -- reused id ranked
//        table lists xtest "C XTEST
//        pointer" (M1: not "mouse")
//   cmd timer: 387 grant 1, ev "14 0 0 0 0 1", would 0 throughout.
// CONTROL G (patched, +set x11_allow_xi2 0): "Using X11 mouse", grant 0,
//   in_rawmice 0, ev "14 0 0 0 1 0", would 1.  B lands as 'm' (100 for 200
//   injected -- the core warp-to-center coalesces alternating +-3 deltas; the
//   point is motion is ACCEPTED and the run demoted), injected -1.
// hidcheck on the 387 journals: injected 200/50/200 counted, XTEST wording
//   "Only core XTEST requests are caught", E ok; the "no frame markers" fault
//   on the rejected-only journals is the same idle note Windows p306_A gets.
// ALL PRE-REGISTERED PREDICTIONS HELD.  No arm produced a stray 'm' when
// grabbed, no A' count, F showed motion (arms valid).
