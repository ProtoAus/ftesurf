// Build 41 / Patches 244-245: does the mover still agree with itself after the
// Momentum parity change?
//
// pm_selftest drives the real functions against a FIXED reference set (not the
// running config -- movevars are zero until a server starts, so a config-driven
// test silently passes against all-zero parameters from the menu).  It needs no
// map, which is the whole point: this runs before anything can go wrong.
//
// WHAT MUST CHANGE from build 40, and these are the patch:
//   hull: standing 62 (was 72), ducked 45 (was 54), shrink 17 (was 18)
//   hull: mid-air origin shift 8.5   <- the viewscale fix; was the full delta
//   hull: crouch-jump reach 67.0     <- was 63.0, and the 64 wall is why
//   eye:  ducked 47 (was 46), half way 55.5 (was 55)
//   jump: ideal apex 57 (was 45), stock standing 54.758, stock crouch 57.000
//   canunduck: three NEW cases -- there was no coverage at all before, which is
//              how a trace against the wrong hull survived a 20-case suite
//
// Anything reported FAIL here is mine and blocks the build.

log_enable 1
log_name b41self
developer 1
log_developer 1
cfg_save_auto 0
cl_idlefps 0
fs_missingwarn 0

wait 60
echo ^5=== b41self: pm_selftest, no map ===
pm_selftest
wait 60
echo ^5=== b41self: done ===
wait 30
quit
