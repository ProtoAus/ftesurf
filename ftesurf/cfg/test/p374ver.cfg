// PATCH 374 -- the in-game board marks a Verified run: a drawn tick after
// "watch" in the replay column, from surfd's `ver` (VER_SQL).
//
//   cd C:\FTESurf; .\ftesurf64.exe +set sv_port 27696 +exec cfg/test/p374ver.cfg
//
// SUBJECTS: the live board (the Pi's surfd, 2026-09-19), not a stub:
//   A surf_ace main      Kap 3532 rep 37 ver 1, BoroBongo 3866 rep 38 ver 1
//   B surf_4am stage 1   Proto 512 rep 11 ver 0 (REFUSE: pre-v9, not exact)
//   B2 surf_aesthetic    Proto 4038 rep 12 ver 0 (the same REFUSE), for the pixels
//   C bhop_eazy stage 1  Kap 1048 rep 0 (no recording)
// PRE-REGISTERED
//   A  both board_status rows end "watch verified"; screenshot p374_ace shows a
//      green tick right of "watch", inside the replay column (clear of the date).
//   B  the row ends "watch", no "verified"; B2 likewise, p374_aes shows no tick.
//   C  the row ends "none"; p374_eazy shows no tick.
// FALSIFIED IF a mark appears on B or C, is missing on A, or overlaps the date.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p374ver
developer 1
waitms 40000
set lobby_dir "http://192.168.1.102:8084"

map surf_ace
waitmap 30
echo ^5==== p374 A: surf_ace main, two verified rows ====
scores open
waitms 1500
scores tab online
scores tier ranked
scores leg 0
scores refresh
waitms 5000
board_status
waitms 500
screenshot p374_ace
waitms 1000

map surf_4am
waitmap 30
echo ^5==== p374 B: surf_4am stage 1, a replay that did not verify ====
scores open
waitms 1500
scores tab online
scores tier ranked
scores leg 1
scores refresh
waitms 5000
board_status
waitms 500
waitms 1000

map surf_aesthetic
waitmap 30
echo ^5==== p374 B2: surf_aesthetic main, the same kind of row, drawn ====
scores open
waitms 1500
scores tab online
scores tier ranked
scores leg 0
scores refresh
waitms 5000
board_status
waitms 500
screenshot p374_aes
waitms 1000

map bhop_eazy
waitmap 30
echo ^5==== p374 C: bhop_eazy stage 1, no recording ====
scores open
waitms 1500
scores tab online
scores tier ranked
scores leg 1
scores refresh
waitms 5000
board_status
waitms 500
screenshot p374_eazy
waitms 1000

echo ^5==== p374: done ====
waitms 1000
quit

