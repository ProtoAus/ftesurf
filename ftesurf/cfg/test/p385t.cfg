// P385T -- p385hid.cfg's passive target: joins the listen host on 27686 as entnum
// 2, stands where it spawns, leaves after 3 minutes.  Nothing here is measured.
//   cd C:\FTESurf; C:\FTEQuake\ftesurf64.exe -WindowStyle Minimized +exec cfg/test/p385t.cfg
// started together with the host (it connects 35 s in).
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p385t
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
name p385t
waitms 35000
connect 127.0.0.1:27686
waitms 180000
echo ^5==== p385t done ====
disconnect
waitms 500
quit
