cfg_save_auto 0
// Build 64: does naming the TLS provider stop the GnuTLS line?
//
// THE REPORT: "GnuTLS 3.8.13 library not available." five times, once per
// thing selected in the leaderboard -- while the leaderboard WORKED and showed
// its rows. That combination is the whole diagnosis: FS_OpenSSL
// (net_wins.c:2696) walks cryptolib[] and takes the first provider that opens
// a stream, the array is {..., &crypto_gnutls, &crypto_sspi} (net_wins.c:195),
// and SSL_InitGlobal remembers only SUCCESS (net_ssl_gnutls.c:1055). So GnuTLS
// is asked first, fails, re-prints, and SChannel then does the work.
//
// THE FIX UNDER TEST is one guarded line in cfg/default.cfg:
//     if $sys_platform == Win tls_provider SChannel
//
// TWO THINGS HAVE TO BE PROVED AND ONE OF THEM IS THE CONTROL. "no GnuTLS
// line appeared" is worthless on its own -- a run that fetched nothing at all
// would pass it. So ARM A deliberately UNSETS the cvar and must REPRODUCE the
// message; only then does ARM B's silence mean anything.
//
// PREDICTIONS, registered before the run:
//   ARM 0  tls_provider reads "SChannel" with nothing but default.cfg run.
//          If it reads "" the `if` did not fire and nothing below matters --
//          check sys_platform, which is printed beside it.
//   ARM A  tls_provider "" + a board fetch -> at least one
//          "GnuTLS ... library not available." AND a board with rows.
//   ARM B  tls_provider SChannel + the same fetch -> ZERO new GnuTLS lines,
//          and the SAME board with the SAME rows.
//
// FALSIFIED IF: ARM A prints no GnuTLS line (then the run is not exercising
// TLS at all and ARM B proves nothing -- check that lobby_dir is https);
// ARM B prints one (naming the provider does not skip the dead one); or ARM B
// loses the rows (SChannel is not actually carrying the connection, and the
// GnuTLS attempt was doing something after all).
//
// wall clock, not frames, before the first `map` -- see p313ruleset.cfg.
log_enable 1
log_dir logs
log_name b64tls
waitms 5000

echo ==== ARM 0: did default.cfg's guarded line fire? ====
sys_platform
tls_provider

// HTTPS ON PURPOSE. The LAN workaround (http://192.168.1.102:8084) opens no
// TLS at all, so it would silence the message by not testing it.
lobby_dir "https://play.proto.bar"

vid_conwidth 1600
vid_conheight 900
hud_scale 2

map bhop_eazy
waitmap 45
waitms 4000

scores open
waitms 500

echo ==== ARM A CONTROL: provider unset, expect the GnuTLS line to COME BACK ====
tls_provider ""
waitms 200
scores tab online
waitms 200
scores refresh
waitms 3000
scores status
waitms 500

echo ==== ARM B: provider named, expect NO GnuTLS line and the same rows ====
tls_provider SChannel
waitms 200
scores refresh
waitms 3000
scores status
waitms 500

echo ==== ARM B2: a second fetch, because the message is per-CONNECTION ====
scores tier community
waitms 3000
scores tier ranked
waitms 3000
scores status
waitms 500

echo ==== done ====
waitms 500
quit
