// cfg_save_auto 0 FIRST: this run sets archived cvars and must never write them
// into ftesurf.cfg (cl_main.c:2535).
cfg_save_auto 0

// ===========================================================================
//  P439SMOKE -- Patches 434/435/436 together, on ONE fixture save.
//    python tools/p439smoke.py      (stages the fixture, runs, parses, restores)
//
//  The three server-side patches this batch shipped each have their own arm
//  (p434rew, p435pre, p436pend).  This is not a fourth arm: it is the SMOKE TEST
//  that the three interact correctly on a save that has all three of their
//  properties at once -- running, carrying speed, in a stage box, with a pendarm
//  owed -- which no individual arm constructs, because each was written to
//  isolate one of them.
//
//  THE FIXTURE (cfg/test/p439smoke.txt, staged as save901):
//    state 2 (TS_RUNNING), ticks 500, velocity 0 (see the note at the end: the 320
//    this line used to claim was removed from the fixture and not from here), origin
//    2624 512 100 which
//    is inside bhop_eazy's STAGE 1 box (x 2528..2720, y 384..640, z 64.03125 to
//    224.03125) and at rest there, azone 1 / armzone -1 (in the box, latch
//    cleared), pendarm 2 (the
//    stage-2 box, 3000 u away), stagerun 1, and `reclines 500` with NO run.rec
//    beside it -- so the rewind has no prefix and fails, which is Patch 434's
//    subject.
//
//  WHAT EACH PATCH MUST DO WITH IT, in the order the code runs
//  (SV_SaveApplyState: restore -> place -> rewind -> 436's pendarm drop is in the
//  restore, 435's gate is in the start-box branch, 434's void is in the failed
//  rewind):
//   436 the restored `pendarm 2` is DROPPED, so no scan can spend it into a clean
//       stage run.  Observable: the state never reads `running` with `stagerun 1`
//       and `practice 0` after the load.
//   435 does NOT apply: its gate is a START-box gate and this body is in a stage
//       box, so the load keeps its TF_SEGMENT|TF_PRACTICE the ordinary way.
//       Observable: `practice 1` / `class: segmented` throughout.
//   434 the rewind fails (no prefix), and the restored state was TS_RUNNING, so
//       SV_TimerVoid ends it.  Observable: `run cancelled (the save's recording
//       could not be restored)`, then `timer: idle`, the clock held at 0:05.000
//       and `stopped 1`.
//
//  ARMS
//   S1 one packet after the load: the cancel line and the timer report.
//   S2 ~2 s later: nothing re-armed it, nothing spent the pendarm.
//   S3 the body: `cmd viewpos` -- the origin is still the stage box and the speed
//      is still 0, because neither patch moves a body.
//
//  PRE-REGISTERED PREDICTIONS (fixed build)
//   S1 `run cancelled (the save's recording could not be restored)`, `timer: idle`,
//      clock `0:00.000` with `stopped 0 at 0:05.000`, `recording 0`, buffer -1.
//      The headline reads 0 because SV_TimerVoid stores the run's time in
//      run_t_stopat and SV_TimerIdle zeroes TF_STOPPED without touching it, so an
//      IDLE report shows a fresh clock beside the parked time -- the parked time is
//      the observable.  (p434rew grades `stopped 1` because that arm never goes
//      idle: it restores RUNNING and voids in place.)
//   S2 (REWRITTEN AT PATCH 441 -- the old prediction was the defect) `timer: idle`,
//      `stagerun 0`, clock `0:05.000`.  Up to 440 this read `armed  stagerun 1
//      practice 0  class: clean`, and this file called that "a stage run started
//      from nothing... not a clean run either", which `practice 0` and
//      `class: clean` on an ARMED attempt are not entitled to say: leaving the box
//      would have started a rankable stage run out of a load whose recording could
//      not be restored.  The cause was SV_TimerVoid clearing the occupancy latches
//      (every other caller is a teleport), so the next scan read an arm edge against
//      the STAGE box the body stands in -- p441void measures the same thing at a
//      START box.  Patch 441 re-scans the latches, so there is no edge and the stage
//      run starts the ordinary way: leave the box, enter it.
//      Patch 436 is still what removes the PENDARM route; this is the other one.
//   S3 origin `2624.0 512.0 64.0`, velocity 0: the body never moved (the void
//      stops the clock, it does not relocate anything), and it rests at the slab's
//      top rather than the fixture's z 100.
//  CONTROL BUILD (3d94164, before 434/435/436): S1 reads `running` with
//   `practice 1` / `segmented` / `recording 0` -- Patch 434's defect exactly: a
//   live clock with no recorder behind it, and NO cancel line.  S2 reads
//   `finished`, the pendarm still owed, one scan away from spending it into a
//   CLEAN stage run (which is what p436pend measures in isolation).  435 is not
//   exercised by this fixture and says nothing either way.
//  FALSIFIED IF S1 reads `idle` on the control build or `running` on the fixed
//   one, or S2's state is the same on both (then nothing here discriminates and
//   the fixture is not what it claims).
//  RESULT (2026-09-23, both builds, driver exit 0 each way).  The control was
//   built from a `git worktree` at 3d94164 with `-NoDeploy`, then its two .dat
//   copied in and copied back -- this tree's source already held all five patches,
//   so a checkout-and-rebuild here would have built the fixed code and called it a
//   control.  Its csprogs hash came out ed3080de/68815aa8, byte-identical to the
//   0.1.12 receipt, which is the proof the worktree really was pre-434.
//                        control (3d94164)              fixed
//    S1 cancel line      absent                         present
//    S1 state            running, practice 1, segmented idle, clock 0:00.000,
//                        recording 0                    stopped at 0:05.000
//    S2 state            finished (pendarm owed)        armed, stagerun 1, 0:05.000
//                                                       -> Patch 441: idle,
//                                                          stagerun 0, 0:05.000
//    S3 origin           2624.0 512.0 64.0              2624.0 512.0 64.0
//   So the composition holds: the failed rewind ends the run (434) and the dropped
//   pendarm means the only arm that follows is the ordinary one from the box the
//   body stands in (436) -- the control build instead sits in FINISHED with the
//   pendarm owed, one scan from a clean stage run.
//   THREE PREDICTIONS THIS FILE GOT WRONG, all recorded because each is a fact
//   about the code rather than about the patches:
//    - the fixture's `velocity 320` was a liability, not a subject: a body at rest
//      inside a stage box stays put, so the origin and the speed are stable reads;
//      with 320 u/s on it the body slid 80 u and bled to 0 before the first
//      viewpos answered, and the arm graded a race.
//    - the origin reads at the slab top (z 64.03125 -> 64.0), not the fixture's
//      z 100: the load places the body and lets it settle, and nothing in these
//      patches is about where it lands.
//    - the fixed build's S2 is `armed`, not `idle`: the void ends the run, and the
//      next scan arms a fresh stage attempt from the box the body is standing in.
//      Patch 436 removes the pendarm route, not the ordinary arm.
//      AND THAT WAS NOT A FACT ABOUT THE CODE, IT WAS THE NEXT DEFECT: an `armed`
//      attempt reading `practice 0  class: clean` is one step from a ranked stage
//      run, out of a load whose evidence was gone.  Written down here as expected
//      behaviour on 2026-09-23 and closed by Patch 441 on 2026-09-26; S2 now reads
//      `idle  stagerun 0`, and this arm's own tables carried the old reading as the
//      prediction until then.
//    - `stopped %g at %s` is TWO numbers and the first is TF_STOPPED, which
//      SV_TimerIdle zeroes while run_t_stopat survives: an idle report reads
//      `stopped 0 at 0:05.000`, so the parked TIME is the observable here and the
//      flag is the observable in p434rew (which never goes idle).
//  NOT COVERED: a save with a REAL recording prefix (434's branch is not reached),
//   a start-box save with speed (that is p435pre), and a live stage handover
//   earned by crossing a finish (that is p436hand).
log_enable 1
log_dir logs
log_name p439smoke
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
sv_port 27679
sv_public 0
sv_cheats 0
set run_resume 0
vid_fullscreen 0
waitms 5000
map bhop_eazy
waitmap 2400
waitms 3000
menu_restart
ui_close
waitms 1200

echo ==== Z the zone table and the one staged row ====
zone_list
waitms 600
cmd sl_list
waitms 800

echo ==== S1 load the fixture, read one packet later ====
cmd sl_goto 1
cmd sl_load
echo ---- S1 idle + stopped at 0:05.000, or the three patches do not compose ----
cmd timer
waitms 700

echo ==== S2 two seconds on: nothing re-armed, nothing spent the pendarm ====
waitms 2000
cmd timer
waitms 700

echo ==== S3 the body: the save's speed, the stage box's origin ====
cmd viewpos
waitms 700

quit
