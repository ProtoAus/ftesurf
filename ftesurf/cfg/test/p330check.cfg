// P330 CHECK -- the folder-structure move, verified from one run.
//
// Exec'd BY BARE NAME from the command line (+exec p330check), which is itself
// the first thing under test: Patch 330's fallback in Cmd_Exec_f resolves a
// name that is not at the gamedir root against cfg/, cfg/test/ and cfg/maps/.
// If this file runs at all, bare-name exec works.
//
// Then, in order:
//   * surf_ardon carries cfg/maps/map_surf_ardon.cfg (moved from cfg/ by P330)
//     -- SV_LoadMapRuleset must find it at the new path and say so;
//   * surf_tensor2 carries cfg/maps/render_surf_tensor2.cfg -- CSQC's render
//     layer must print its "applied over cfg/maps/render_default.cfg" line;
//   * fs_cache_info must resolve the cache at its new home, ftesurf/cache,
//     and report the harvested packs that were ftesurf_cache/ an hour ago.
log_enable 1
log_dir "logs"
log_name "p330check"
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
vid_width 640
vid_height 480
con_notifytime 0
con_notifylines 0
developer 1
log_developer 1

echo ^5=== P330: bare-name exec resolved cfg/test/p330check.cfg ======
wait 200

map surf_ardon
waitmap 900
waitms 12000
echo ^5=== P330: surf_ardon ruleset lines are above =================
fs_cache_info
waitms 500

map surf_tensor2
waitmap 900
waitms 12000
echo ^5=== P330: tensor2 render-layer line is above =================
fs_cache_info
waitms 500

echo ^5=== P330 CHECK DONE ============================================
wait 60
quit
