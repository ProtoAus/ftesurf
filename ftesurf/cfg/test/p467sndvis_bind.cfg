// snd_vis builtin binding check (engine client/snd_vis.c): with developer logging, the menu VM
// reports "Unknown menu builtin: <name>" for any #0:name it cannot bind. menu.dat declares
// snd_getvis and snd_visimage; a build without them logs both lines (logs/p467milk6.log:105-106).
// pr_dumpplatform writes its defs to <pr_sourcedir>/sndvis_defs.qc, pointed at logs/ here.
cfg_save_auto 0
set log_dir logs
set log_name p467sndvis_bind
set log_enable 1
set developer 1
set log_developer 1
exec cfg/test/_quiet.cfg
set cl_idlefps 0
set cl_maxfps 100
set volume 0
wait 50
menu_restart
wait 100
set pr_sourcedir logs
pr_dumpplatform -O sndvis_defs
wait 10
echo SNDVIS_BIND done
quit
