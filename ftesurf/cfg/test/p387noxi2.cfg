cfg_save_auto 0
// P387NOXI2 -- `-noxi2` beats the cvar (X11_CheckFeature), so the grant stays 0.
// Linux client, listen server on bhop_eazy, launched WITH -noxi2:
//   env -u WAYLAND_DISPLAY DISPLAY=:0 ./fteqw64 -noxi2 -nosound
//     +set vid_renderer gl +set developer 1 +set log_enable 1 +set log_dir logs
//     +set log_name p387noxi2 +exec cfg/test/p387noxi2.cfg
// GATE: boot log "Using X11 mouse" (or "Using DGA mouse"), never "Using XInput2".
// (vid_restart + two waitms: see p387xi2.cfg.)
//
// PRE-REGISTERED
//   A  first report: "X11 input grant: 0 raw mice", in_rawmice 0, said 2,
//      ev "14 0 0 0 1 0" (the first broken report is an edge), would 1.
//      data/p387_N.hid: rawmice 0, dev keyboard - "x11" + mouse 0 "x11", trailer
//      `-1 -1 -1` (XI2 never ran, so nothing lifted the counters); hidcheck as
//      p387xi2 B (only fault "no frame markers"),
//      input_backend "X11 core pointer (OS-accelerated)" ("X11 DGA" and mouse 0
//      "dga" if the server offers DGA), the rawmice-0 note.
//   B  set x11_allow_xi2 1; vid_restart: still "Using X11 mouse", in_rawmice 0,
//      would 1.
// FALSIFIED IF any arm reads would 0 or in_rawmice other than 0.

exec cfg/test/_quiet.cfg

developer 1
log_developer 1
log_enable 1
log_dir logs
log_name p387noxi2
cl_maxfps 100
cl_idlefps 0
sv_cheats 0
m_filter 0
m_accel 0
cl_nocsqc 0

wait 200
map bhop_eazy
waitmap 600
waitms 5000

echo ^5=== P387NOXI2 ARM A: -noxi2.  Expect in_rawmice 0, would 1.
in_rawmice
cmd timer
in_journal_begin
waitms 2000
in_journal_end data/p387_N.hid
waitms 1500

echo ^5=== P387NOXI2 ARM B: x11_allow_xi2 1; vid_restart.  Expect still 0, would 1.
set x11_allow_xi2 1
vid_restart
waitms 100
waitms 4000
in_rawmice
cmd timer
waitms 1500

echo ^5=== END OF RUN ===
waitms 1000
quit

