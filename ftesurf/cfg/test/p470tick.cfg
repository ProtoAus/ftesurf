// P470TICK -- Patch 470: a replay is graded at the recording's tick, not the server's.
//    python tools/p470tick.py
//
// The driver stages data/p470tick.rec: the fixture's samples under a header that
// says `tickrate 0.01`, on a server running 0.015.  A SYNTHETIC file -- nothing
// flew it at 0.01 -- which is fine for what is graded: the arithmetic the line
// and the bar do with a file's tick.  The same file sits in slot 0 (the replay)
// and slot 1 (`scores lineat`, the board job).
//
// PRE-REGISTERED
//  T1 each slot's tick (the `lnmv` line) is the file's 0.01.
//  T2 both slots' grades match the model run at the FILE's tick, to 0.01, and
//     the tick moves the grade at enough points for that to mean something.
//  T3 slot 1's energy colour is slot 0's at every shared sample, and enough of
//     them are unsaturated that a different ceiling would show.
//  T4 at each seek the strafe bar printed the file's tick, and where it is in
//     flat air its ideal is atan2(gain, speed) / that tick.
//
// CONTROL: this patch's three behaviour hunks reverted with the `bar tick` print
//  kept (tools/p470tick.py's header has them).  Predicted: T1 fails on slot 1
//  only (the job handed Line_Tick a 0 before reading the header), T2 on both,
//  T3, and T4 at every seek.
//
// RESULT (2026-10-03): all four held on the fix and all four failed on the control,
//  each as predicted.  The numbers are in tools/p470tick.py's docstring.
log_enable 1
log_dir "logs"
log_name p470tick
developer 0
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0
set run_resume 0
sv_public 0
sv_port 27711
set lobby_dir ""
set hud_watch_skipidle 0
set hud_watch_path 1
set hud_strafe 1
set hud_strafe_minspeed 200
con_notifytime 0

wait 200
map surf_colin_blaster_69000
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 1000

echo ^5=== p470tick live ===
pm_ticrate
replay data/p470tick.rec
waitms 1500
replay pause
scores lineat 1 data/p470tick.rec
waitms 4000
scores lines

// Flat air in this fixture, far from any contact: 2080, 1040, 260 and 263 u/s.
echo ^5=== p470tick bar ===
replay seek 7.02
waitms 1200
replay status
replay seek 11.288
waitms 1200
replay status
replay seek 15.593
waitms 1200
replay status
replay seek 63.559
waitms 1200
replay status

hud_watch_path_color 4
waitms 700
echo ^5=== p470tick grade 0 ===
replay colours 0 2
waitms 500
echo ^5=== p470tick grade 1 ===
replay colours 1 2
waitms 500
hud_watch_path_color 3
waitms 700
echo ^5=== p470tick energy 0 ===
replay colours 0 4
waitms 500
echo ^5=== p470tick energy 1 ===
replay colours 1 4
waitms 500
screenshot screenshots/p470tick.png
waitms 500
echo ^5=== p470tick done ===
replay stop
waitms 300
quit
