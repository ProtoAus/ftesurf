// FTESurf Patch 776 -- ent_view's mouse1 (pin and expand) and mouse2 (copy).
// Run with tools/runlines_smoke.py --mount and this build's csprogs.  Key presses go
// through `vote key <scan> <down>`, which runs the whole CL_InputEvent chain and
// prints whether it was taken.  512 = MOUSE1, 513 = MOUSE2.  The vantage is b56b's:
// a centre ray from it selects a trigger_teleport on surf_tensor2.
//   0  ent_view off: MOUSE1 "took 0" (the game's).
//   1  ent_view on, MOUSE1: "took 1", the [enthere] line and its keys print, and the
//      server's ent_info reply follows; the pinned card is on screen (p776ev_pin).
//   2  looking away, the card stays (p776ev_away).
//   3  MOUSE2: "copied [enthere] class=trigger_teleport ... and the server's answer".
//   4  MOUSE1 on the pinned entity unpins: the hover card is back (p776ev_closed).
//   5  MOUSE2 unpinned copies the hovered entity; the clipboard keeps this one.
//   6  ent_view off again: MOUSE1 "took 0".
cfg_save_auto 0
exec cfg/test/_quiet.cfg
log_enable 1
log_dir "logs"
log_name "runlines_smoke"   // tools/runlines_smoke.py reads this log
scr_sshot_type png
cl_yieldcpu 0
cl_idlefps 0
cl_maxfps 100
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0

waitms 2500
map surf_tensor2
waitmap 240
waitms 8000
sv_cheats 1
noclip
waitms 500
setpos -11776 -11020 13680 0 90 0
waitms 2500

echo "@@@ P776 0. ent_view off: mouse1 is the game's"
vote key 512 1
waitms 200
vote key 512 0
waitms 500

ent_view
waitms 1500
echo "@@@ P776 1. mouse1 pins the hovered entity"
vote key 512 1
waitms 200
vote key 512 0
waitms 3000
screenshot p776ev_pin_x
waitms 900
screenshot p776ev_pin
waitms 500

echo "@@@ P776 2. looking away, the card stays"
setpos -11776 -11020 13680 0 270 0
waitms 1500
screenshot p776ev_away_x
waitms 900
screenshot p776ev_away
waitms 500

echo "@@@ P776 3. mouse2 copies the pinned entity"
vote key 513 1
waitms 200
vote key 513 0
waitms 800

echo "@@@ P776 4. mouse1 on the pinned entity unpins it"
setpos -11776 -11020 13680 0 90 0
waitms 1500
vote key 512 1
waitms 200
vote key 512 0
waitms 1200
screenshot p776ev_closed_x
waitms 900
screenshot p776ev_closed
waitms 500

echo "@@@ P776 5. mouse2 unpinned copies the hovered entity"
vote key 513 1
waitms 200
vote key 513 0
waitms 800

echo "@@@ P776 6. ent_view off: mouse1 is the game's again"
ent_view
waitms 800
vote key 512 1
waitms 200
vote key 512 0
waitms 500

echo "@@@ P776 DONE"
echo RUNLINES COMPLETE
waitms 1000
quit
