// OVL03 -- LOOK AT THEM.  Everything so far is counters; this is the only test
// that can tell a correct decal from a mirrored, rotated or stretched one.
//
// Four of surf_rise's largest overlays, each framed head-on from along its own
// vecBasisNormal (positions derived from the map's own lump 45, not guessed).
// A/B pairs: with overlays on, and with vbsp_overlays 0, so the difference is
// unambiguous rather than "something is on that wall".
//
//   #78 soniccolours/riselogo512      256x256 on a +X wall
//   #76 dotd/skull/skullgraffiti512   256x256 on a -X wall
//   #87 soniccolours/riselogo512      192x192 on a -Y wall
//   #85 sodacitytextures/surfhabit512 104x144 on a +Y wall (non-square: the
//       one that shows whether `aspect` is the right way up)

log_enable 1
log_dir "logs"
log_name "ovl03"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
sv_cheats 1
r_decal_lightmap 1

wait 200
map surf_rise
waitmap 1800
waitms 4000

// setpos does not imply noclip -- without this the camera is a walking player
// and falls out of every one of these positions before the screenshot lands.
noclip
waitms 500

echo ^5=== #78 riselogo512 256x256 ===
setpos -755 2080 1408
setang 0 180 0
waitms 800
screenshot ovl03_78_on

echo ^5=== #76 skullgraffiti512 256x256 ===
setpos -4125 832 1680
setang 0 0 0
waitms 800
screenshot ovl03_76_on

echo ^5=== #87 riselogo512 192x192 ===
setpos -3128 -79 2170
setang 0 90 0
waitms 800
screenshot ovl03_87_on

echo ^5=== #85 surfhabit512 104x144 -- NON-SQUARE, checks aspect ===
setpos -3148 507 2168
setang 0 270 0
waitms 800
screenshot ovl03_85_on

echo ^5=== same four with vbsp_overlays 0 (the A/B) ===
vbsp_overlays 0
map surf_rise
waitmap 1800
waitms 4000
noclip
waitms 500

setpos -755 2080 1408
setang 0 180 0
waitms 800
screenshot ovl03_78_off

setpos -3148 507 2168
setang 0 270 0
waitms 800
screenshot ovl03_85_off

echo ^5=== ovl03 done ===
wait 30
quit
