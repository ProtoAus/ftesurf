// frame just before renderscene (columns: cl_spectate.qc Spec_Trace).  Markers:
// `p385view: <ID> ...`; spectrace.py tags every line with the latest one.
// Timeline (V = this client's start): tests ~V+36..156 s, then LV watches
// P385Two, which leaves ~V+186 s; P385Own leaves ~V+207 s.  `body_trace -1`
// prints one `bt` line per frame for the first stream body (Own or Two) --
// P3's independent reference (cl_body.qc Body_Trace).
