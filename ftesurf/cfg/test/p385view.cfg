// PREDICTIONS.  Observable in brackets; each has a CONTROL that must FAIL the
// same test, or the observable is shown unable to see the effect (VOID).
//  P1  entry: first `want` > 0 frame -> first stat > 0 frame <= 1.0 s, stat ==
//      want (P385Own's entnum)                                     [spt E]
//      CONTROL: TKR's request, refused locally, never enters (P18).
