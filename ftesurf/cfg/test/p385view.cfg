//      to the X release; `setpos` (cmd viewpos) V0 == E == XE to 0.15 (origin and
//      v_angle).  CONTROL: the target's feet travel >= 100 u in those frames.
//  P3  first person: on every first-person frame whose target is the body the
//      same frame's `bt` line reports (bt slot == tslot), |cam - (bt org + bt
//      eye)| <= 0.5 -- the camera against the stream's own print, not against
//      the spt columns it was placed from.  CONTROL: the frames watching the
//      OTHER body fail the same gate (> 0.5) on more than half of them.
//  P4  smoothness vs the target's own sampled motion (AGENTS.md): sample yaw =
//      the drawn yaw on frames with |rtick - round(rtick)| < 0.03; per frame the
//      camera's yaw rate over the sampled rate between the nearest such samples
//      (<= 60 ticks apart: the owner turns at a constant cl_yawspeed), on frames
//      where that rate >= 60 deg/s: >= 90% in 0.8..1.2 and <= 1% frames with no
//      yaw step.  CONTROL C1 (cl_body_raw 1, 5 s) FAILS the same gate.  Run 1
//      registered 4 ticks (60 frames graded) and a control of >= 25% no-step
//      frames; it gave 6.5%: at ~65 fps against 66.7 Hz the raw body jitters
//      between 0, 1 and 2 samples a frame rather than stalling.
