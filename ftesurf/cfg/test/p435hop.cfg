// cfg_save_auto 0 FIRST: this run sets archived cvars and must never write them
// into ftesurf.cfg (cl_main.c:2535).
cfg_save_auto 0

// ===========================================================================
//  P435HOP -- the OTHER half of the start-box prespeed hole: the SHIPPED zones.
//    python tools/p435pre.py --shipped      (no zones fixture, this cfg)
//
//  p435pre.cfg measures the gate on a zones file whose start region has been
//  lowered so SV_ZoneStartAt answers 0 -- the 29 of 35 shipped regions the
//  census says the gate can see.  THIS file measures the rounding class, bhop_eazy
//  among them, where state.txt's `origin %.4f` puts the placed body 0.00005
//  BELOW a zone whose bottom is its floor (64.0312 against 64.03125), so the
//  point test fails and Build 47's gate never fires.  Patch 415 measured that
//  and left it alone as failing safe: no gate, no forced edge, no arm, so the
//  load's TF_SEGMENT|TF_PRACTICE stands.  tools/census/startdest.py names the
//  whole class: 6 regions on 3 maps.
//
//  BACKLOG'S CLAIM, which is what this arm exists to grade: "a hop beats that --
//  the first scan sets the latch -1, the hop lifts the point into the zone,
//  SV_TimerArm clears the load's taint."  Patch 415 measured the STANDING case
//  (`arm zone -1 (armed from 0)` two seconds after the load, still segmented);
//  the hop was reasoned, never run.  If it arms clean, then Patch 435's gate
//  condition -- which is never reached on the rounding class, because
//  SV_ZoneStartAt answers -1 before it -- closes nothing here, and the hole is
//  wider than the fix.
//
//  FIXTURES: the same pair p435pre uses, `cfg/test/p435rest.txt` (velocity 0)
//  and `p435speed.txt` (velocity 250), both ARMED at (-420 -352 64.0312) inside
//  bhop_eazy's start region.  No zones fixture is installed, so the shipped
//  region (bottom 64.03125) is what every test below reads against.
//
//  ARMS
//   H1 standing, no hop: load the prespeed save alone and wait.  Patch 415's own
//      measurement, repeated: `arm zone -1`, taint standing.
//   H2 THE FALSIFIER: load the prespeed save and jump.  `cmd timer` afterwards
//      is the whole question -- `practice 0`/`clean` means the hop laundered it.
//   H3 CONTROL for H2: the at-rest save, loaded and jumped the same way.  It
//      must read `clean`: picking a start by loading into it is Build 47's
//      purpose, and if H3 is tainted too then H2's verdict is not about speed.
//
//  PRE-REGISTERED PREDICTIONS (all three on BOTH builds unless stated)
//   H1 `arm zone -1 (armed from 0)`, `practice 1`, `class: segmented`, and
//      `viewpos` horizontal 250-ish bled by friction -- Patch 415, reproduced.
//   H2 IF the backlog is right: `armed` or `running`, `practice 0`,
//      `class: clean`, `arm zone 0` -- the hop lifted the point into the slab,
//      the scan saw an entry edge, SV_TimerArm laundered.  THEN PATCH 435 IS
//      INCOMPLETE and this file is the evidence.
//   H2 IF the hop does not beat it: `practice 1`, `segmented`, on both builds.
//   H3 `practice 0`, `class: clean`, `arm zone 0` -- Build 47 working through
//      the hop instead of through the gate.
//  FALSIFIED IF H1 is not segmented (Patch 415's measurement does not reproduce,
//   so this map is not in the rounding class and the arm measures nothing), or H3 is
//   tainted (the hop arms nothing at all here, so H2 cannot show a launder).
//
//  RESULT (2026-09-23, the Patch 435 build).  THE HOP DOES NOT LAUNDER IN BHOP
//   MODE, and the backlog's claim is false here:
//     H1 `arm zone -1 (armed from 0)`, `practice 1`, `segmented` -- Patch 415's
//        measurement, reproduced exactly on the shipped zones.
//     H2 (load + hop) `running`, `practice 1`, `segmented`, `arm zone -1`, with
//        `jumps 1` and `rec lines 84 (58 samples)` -- the subject acted, the run
//        started, and the taint stood.  The jump starts the run from the restored
//        ARMED state, and SV_TimerTryArm's bhop branch then refuses to arm an
//        attempt that is already RUNNING, so SV_TimerArm never runs.
//     H3 (at rest + hop) `running`, `practice 1`, `segmented` -- ALSO tainted, and
//        that is the finding: on this map no start-box load arms clean at all,
//        which is the other half of Patch 415's "a start-box load keeps a taint
//        Build 47 says it should lose".
//   p435mode.cfg is the same arm with sv_gamemode surf, where the deferral is off.
//   TWO READS THIS FILE GOT WRONG, both about friction rather than the fix: H1's
//   `viewpos` came ~2 s after its load, by which time 250 u/s has bled to exactly
//   0 (friction at sv_stopspeed stops a grounded body in ~0.33 s), and the phase
//   clock's `air 0.00` counts only the time since the run started -- a jump taken
//   while ARMED is invisible there, so `jumps` and the recorder's line count are
//   the proof the subject acted, not `air`.
log_enable 1
log_dir logs
log_name p435hop
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
sv_port 27663
sv_cheats 0
set run_resume 0
vid_fullscreen 0
waitms 5000
map bhop_eazy
waitmap 2400
waitms 3000
menu_restart
ui_close
waitms 1200

echo ==== Z the shipped zone table, and the two rows ====
zone_list
waitms 600
cmd sl_list
waitms 800

echo ==== H1 prespeed, loaded, NO hop: Patch 415's measurement ====
cmd sl_goto 2
cmd sl_load
waitms 900
echo ---- H1 arm zone -1 / practice 1 / segmented ----
cmd timer
waitms 700
cmd viewpos
waitms 600

echo ==== H2 THE FALSIFIER: prespeed, loaded, then a hop ====
cmd sl_goto 2
cmd sl_load
+jump
waitms 200
-jump
waitms 700
echo ---- H2 practice 0 / clean means the hop laundered it ----
cmd timer
waitms 700
cmd viewpos
waitms 600

echo ==== H3 CONTROL for H2: at rest, loaded, then the same hop ====
cmd sl_goto 1
cmd sl_load
+jump
waitms 200
-jump
waitms 700
echo ---- H3 practice 0 / clean, or H2 proves nothing ----
cmd timer
waitms 700
cmd viewpos
waitms 600

quit
