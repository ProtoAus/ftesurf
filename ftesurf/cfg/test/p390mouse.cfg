// P390MOUSE -- the mouse pad left of the key block (listen server, bhop_eazy, 1280x720).
//   ftesurf64.exe +set vid_winmaximize 0 -WindowStyle Minimized +exec cfg/test/p390mouse.cfg
// then grep "====\|mousepad\|  box\|  span\|  wraps\|  last\|spectate look\|hud_mouse\|wtr" logs/p390mouse.log
// Driver: `spectate look <dx> <dy>` = one IE_MOUSEDELTA through the whole chain.  Each injection
// must add exactly 1 to `events` and print took 0 (the pad observes only); else the arm is VOID.
// mpbase re-applies the baseline before every arm: sensitivity 1, m_yaw/m_pitch 0.022, in_xflip 0,
// span 90 (height 56.25 deg), trail 0.5 s, then `mousepad reset` (pos 0.5 0.5, counters 0).
//
// PREDICTIONS (registered before the run; 1 count = 0.022 deg):
//  G0 status: box 970 605 166 104 px 1 (keys block left 1140.8, one 4 px gap).
//  A  1022.7273 0 (22.5 deg): pos 0.7500 0.5000, wraps 0 0, took 0.
//  B  0 -454.5455 (-10 deg, mouse forward): pos 0.5000 0.3222.
//  C  A, then 2045.4545 0: 0.2500 wraps 1 0; then -2045.4545 0: 0.7500 wraps 0 0.
//  E  0 1534.0909 (0.6 panel): y 0.1000 wraps 0 1; then 0 -1534.0909: y 0.5000 wraps 0 0.
//  F  5113.6364 0 (1.25 panels): pos_x 0.7500 wraps 1 0 breaks 1.
//  H  in_xflip 1, 1022.7273 0: pos_x 0.2500 (the flip undone; code path only).
//  I  m_pitch -0.022, 0 -454.5455: y 0.3222 (up; a signed m_pitch would give 0.6778).
//  S  sensitivity 0.5, 1022.7273 0: pos_x 0.6250.
//  T  5 x (200 100, 20 ms): samples 5 live 5; 600 ms later samples 5 live 0.  Trail 1: live 5.
//  L  hud_mouse 0, 1022.7273 0: pos_x 0.7500 (tracks while hidden).
//  Shots (one variable changed each): a trail across the right edge, b = a with hud_mouse 0 --
//  the a/b difference lies inside x 970-1136, y 605-709.  c hud_keys_x 0.5: box 458 605 166 104.
//  d hud_keys 0: box 970 605 166 104, the pad alone.  e hud_scale 1: box 1068 605 83 52.
//  f hud_mouse_x/y 0.1: box 128 72 166 104.  g dot at x 0.0: halves at both vertical edges,
//  nothing outside the box (g vs g0 = hud_mouse 0).  h hud_edit on: a "Mouse" row.
//  Ed hud_mouse_x 0.1 + `hud_edit reset` -> -1; hud_mouse_span 180 + `hud_edit resetall` -> 90.
//  R  replay 0004976_pb.rec (local fixture): after seek 5 src 2 pos 0.5000 0.5000; seek 5.05:
//     pos_x = 0.5 - Arc(yaw5, yaw5.05)/90, pos_y = 0.5 + Arc(pitch5, pitch5.05)/56.25 from the
//     `wtr` lines (VOID if |dyaw| < 0.5); spectate look while paused: pos unchanged; seek 2:
//     resets +1, pos 0.5 0.5; play 1 s then pause: live > 0 (VOID if samples 0); 1 s later live
//     unchanged (the fade runs on the recording clock); stop: src 1, resets +1.
//
// RESULTS 2026-09-20 03:01 (run 2): ALL HELD.  Every injection took 0 and added exactly 1 event.
//  G0 box 970 605 166 104 px 1; A 0.7500; B 0.3222; C 0.2500 wraps 1 0 -> 0.7500 wraps 0 0; E 0.1000
//  wraps 0 1 -> 0.5000; F 0.7500 wraps 1 0 breaks 1; H 0.2500; I 0.3222; S 0.6250; T live 5 -> 0
//  (samples 5), T1 live 5; L 0.7500 with on 0.  a/b and g/g0 differ only inside 970,605-1136,709;
//  c 458 605, d 970 605 (pad alone), e 1068 605 83 52, f 128 72; h lists "Mouse" and draws its box;
//  Ed -1 and 90.  R: wtr yaw -170.620 -> -175.400, pitch 26.840 -> 26.750 => 0.5531 0.4984, logged
//  0.5531 0.4984; look while paused unchanged; seek 2 resets; play: samples 73 live 42, 1 s paused
//  later unchanged; stop src 1.  Run 1 was VOID for A-C (72 real mouse events arrived before any
//  injection -- the live path moving on real input) and its shots lagged a step (100 ms waits;
//  minimized frames are slow): shots now wait 500 ms.
// RE-RUN after the independent review (replay snap window, wrap-count guard, attached pad on the
//  keys' right when the left slot is off-screen, the editor's snap skips the riding pad): every
//  arm identical; R's play sample 0.1682 0.3687 (wall-clock dependent), snaps 0.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p390mouse
developer 0
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
sv_port 27645
sv_cheats 0
set run_resume 0
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_conautoscale 0
vid_conwidth 1280
vid_conheight 720
waitms 5000
map bhop_eazy
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 500
hud_scale 2
set hud_keys 1
set hud_keys_x 0
set hud_keys_y 0.84
set hud_mouse 1
set hud_mouse_x -1
set hud_mouse_y -1
set hud_debug 0
alias mpbase "set sensitivity 1; set m_yaw 0.022; set m_pitch 0.022; set in_xflip 0; set hud_mouse_span 90; set hud_mouse_trail 0.5; mousepad reset"
echo ==== G0 ====
mpbase
waitms 100
mousepad
echo ==== A ====
mpbase
waitms 100
spectate look 1022.7273 0
waitms 100
mousepad
echo ==== B ====
mpbase
waitms 100
spectate look 0 -454.5455
waitms 100
mousepad
echo ==== C ====
mpbase
waitms 100
spectate look 1022.7273 0
waitms 100
spectate look 2045.4545 0
waitms 100
mousepad
spectate look -2045.4545 0
waitms 100
mousepad
echo ==== E ====
mpbase
waitms 100
spectate look 0 1534.0909
waitms 100
mousepad
spectate look 0 -1534.0909
waitms 100
mousepad
echo ==== F ====
mpbase
waitms 100
spectate look 5113.6364 0
waitms 100
mousepad
echo ==== H ====
mpbase
set in_xflip 1
waitms 100
spectate look 1022.7273 0
waitms 100
mousepad
echo ==== I ====
mpbase
set m_pitch -0.022
waitms 100
spectate look 0 -454.5455
waitms 100
mousepad
echo ==== S ====
mpbase
set sensitivity 0.5
waitms 100
spectate look 1022.7273 0
waitms 100
mousepad
echo ==== T ====
mpbase
waitms 100
spectate look 200 100
waitms 20
spectate look 200 100
waitms 20
spectate look 200 100
waitms 20
spectate look 200 100
waitms 20
spectate look 200 100
waitms 50
mousepad
waitms 600
mousepad
echo ==== T1 ====
mpbase
set hud_mouse_trail 1
waitms 100
spectate look 200 100
waitms 20
spectate look 200 100
waitms 20
spectate look 200 100
waitms 20
spectate look 200 100
waitms 20
spectate look 200 100
waitms 650
mousepad
echo ==== L ====
mpbase
set hud_mouse 0
waitms 100
spectate look 1022.7273 0
waitms 100
mousepad
set hud_mouse 1
echo ==== shots a b ====
mpbase
set hud_mouse_trail 1
waitms 100
spectate look 409.0909 204.5455
waitms 30
spectate look 409.0909 -204.5455
waitms 30
spectate look 409.0909 204.5455
waitms 30
spectate look 409.0909 -204.5455
waitms 30
spectate look 409.0909 204.5455
waitms 30
spectate look 409.0909 -204.5455
waitms 30
spectate look 409.0909 204.5455
waitms 30
mousepad
waitms 500
screenshot p390mouse_a
set hud_mouse 0
waitms 100
waitms 500
screenshot p390mouse_b
set hud_mouse 1
echo ==== shot c ====
mpbase
set hud_keys_x 0.5
waitms 100
mousepad
waitms 500
screenshot p390mouse_c
set hud_keys_x 0
echo ==== shot d ====
set hud_keys 0
waitms 100
mousepad
waitms 500
screenshot p390mouse_d
set hud_keys 1
echo ==== shot e ====
hud_scale 1
waitms 100
mousepad
waitms 500
screenshot p390mouse_e
hud_scale 2
echo ==== shot f ====
set hud_mouse_x 0.1
set hud_mouse_y 0.1
waitms 100
mousepad
waitms 500
screenshot p390mouse_f
set hud_mouse_x -1
set hud_mouse_y -1
echo ==== shot g ====
mpbase
set hud_mouse_trail 0
waitms 100
spectate look 2045.4545 0
waitms 100
mousepad
waitms 500
screenshot p390mouse_g
set hud_mouse 0
waitms 100
waitms 500
screenshot p390mouse_g0
set hud_mouse 1
echo ==== shot h / Ed ====
hud_edit on
waitms 300
waitms 500
screenshot p390mouse_h
hud_edit status
hud_edit off
waitms 200
set hud_mouse_x 0.1
hud_edit reset
waitms 200
hud_mouse_x
set hud_mouse_span 180
hud_edit resetall
waitms 200
hud_mouse_span
hud_mouse
echo ==== R ====
mpbase
set hud_mouse_trail 0.5
replay data/runs/bhop_eazy/main/0004976_pb.rec
waitms 800
replay pause
replay seek 5
waitms 200
mousepad
replay trace 2 0.05
replay seek 5.05
waitms 200
mousepad
spectate look 1022.7273 0
waitms 100
mousepad
replay seek 2
waitms 200
mousepad
replay play
waitms 1000
replay pause
waitms 50
mousepad
waitms 500
screenshot p390mouse_r
waitms 1000
mousepad
replay stop
waitms 300
mousepad
echo ==== END ====
waitms 300
quit
