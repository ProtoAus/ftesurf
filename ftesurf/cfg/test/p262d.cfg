// P262D -- does hl2_propcollision_nophy 1 put the old collision back?
//
// A switch that changes a default has to be able to undo it exactly, or it is
// documentation rather than a control.  Set BEFORE the first map load, because it
// is MAPLATCH and the world BIH is built once.
//
// EXPECTED on surf_garden: no "383 static props are not solid" line at all, and
// prop_census reporting 420 solid with none colliding against nothing -- i.e.
// exactly what shipped before Patch 262.

log_enable 1
log_dir "logs"
log_name "p262d"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
sv_cheats 1
developer 1
log_developer 1

hl2_propcollision_nophy 1

wait 200
echo ^5=== p262d: hl2_propcollision_nophy 1, the pre-262 behaviour ===

map surf_garden
waitmap 1800
waitms 6000
echo ^5-------------------- surf_garden, nophy 1 (restored) -------------------
prop_census
waitms 600
prop_census ivoryshrub
waitms 600

echo ^5=== p262d done ===
wait 30
quit
