// V266B -- Patch 266, second pass.  Fixes two harness errors in v266a.
//
// ERROR 1: v266a measured the noise floor only at save011 and then took its
// Part B numbers at a different vantage.  A noise floor belongs to the vantage
// it was measured at.  The B vantage turned out to DRIFT between shots -- the
// two B1 frames align best at dy=-10 dx=20, i.e. the camera moved -- so that
// 137518 px was partly camera movement and is discarded.  Every screenshot here
// re-issues setpos immediately before it, and the noise floor is taken at the
// same vantage with the same spacing as the real pair.
//
// ERROR 2: the Part A comparison inherited vbsp_skyroom/r_sky_forcedepth from
// whatever was archived, while the pre-266 baseline (v265a_d_011_noslab) was
// taken with skyroom 1 / forcedepth 1 explicitly set.  The background differed
// for that reason and not because of this patch.  Both are set explicitly here.
//
// PART B, done properly.  PROJECT_TENDIES/CLOODS is two horizontal planes
// spanning the whole 3D-skybox room:
//     x -15784..15808   y -16192..16320   z = -8000 and -7232
// Rather than hope they fall in frame from a playable vantage, noclip INTO that
// room and look at them directly -- they are ordinary world geometry (brush
// model 0), so shader_here can name them and world fog applies (fogstart 500,
// fogend 43420, fogmaxdensity 1, which is the case r_fog_progless handles
// exactly).  Standing below the lower plane and looking up at a shallow angle
// makes it recede for tens of thousands of units, which is what puts a distance
// gradient on screen at all.
//
// The control is in the same frame: ALPINE_BLENDROCKSNOW_SKYBOX shares that
// room, is WorldVertexTransition, has a program and already fogs.  It must be
// IDENTICAL between fog1 and fog0.  If the whole frame moves, this is
// double-fogging and the patch is wrong.

log_enable 1
log_dir "logs"
log_name "v266b"
developer 1
log_developer 1
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 0
vid_fullscreen 0
con_notifytime 0
con_notifylines 0
con_notifytime_error 0

vid_width 1920
vid_height 1200
vid_restart
waitms 4000

wait 200
echo ^5=== v266b: Patch 266, corrected harness ===

map surf_boreas
waitmap 1800
waitms 9000
sv_cheats 1
waitms 300
noclip
waitms 300
vbsp_skyroom 1
r_sky_forcedepth 1
r_fog_progless 1
waitms 500
developer 0
waitms 500

echo ^5===== A: save011, cvars matched to the v265 baseline =====
setpos 13826.6 -2739.2 12105.6 16.3367 163.2788 0
waitms 2500
screenshot v266b_x
waitms 800
setpos 13826.6 -2739.2 12105.6 16.3367 163.2788 0
waitms 1200
screenshot v266b_a_011_matched
waitms 800

echo ^5===== B: inside the skybox room, under the cloud planes =====
setpos 0 -9000 -9500 -18 90 0
waitms 3000
developer 1
waitms 300
shader_here p266b_clouds
waitms 1200
developer 0
waitms 300

echo ^5----- B noise floor: same state, same spacing as the real pair -----
setpos 0 -9000 -9500 -18 90 0
waitms 2500
screenshot v266b_x
waitms 800
setpos 0 -9000 -9500 -18 90 0
waitms 1200
screenshot v266b_n1_clouds
waitms 800
setpos 0 -9000 -9500 -18 90 0
waitms 2000
screenshot v266b_x
waitms 800
setpos 0 -9000 -9500 -18 90 0
waitms 1200
screenshot v266b_n2_clouds
waitms 800

echo ^5----- B fog ON -----
r_fog_progless 1
waitms 1500
setpos 0 -9000 -9500 -18 90 0
waitms 2000
screenshot v266b_x
waitms 800
setpos 0 -9000 -9500 -18 90 0
waitms 1200
screenshot v266b_b_clouds_fog1
waitms 800

echo ^5----- B fog OFF (falsifier) -----
r_fog_progless 0
waitms 1500
setpos 0 -9000 -9500 -18 90 0
waitms 2000
screenshot v266b_x
waitms 800
setpos 0 -9000 -9500 -18 90 0
waitms 1200
screenshot v266b_b_clouds_fog0
waitms 800
r_fog_progless 1
waitms 500

echo ^5----- B2: steeper, straight up at the cloud plane -----
setpos 0 -9000 -9500 -55 90 0
waitms 2500
developer 1
waitms 300
shader_here p266b_clouds_up
waitms 1200
developer 0
waitms 300
setpos 0 -9000 -9500 -55 90 0
waitms 1500
screenshot v266b_x
waitms 800
setpos 0 -9000 -9500 -55 90 0
waitms 1200
screenshot v266b_b2_up_fog1
waitms 800
r_fog_progless 0
waitms 1500
setpos 0 -9000 -9500 -55 90 0
waitms 2000
screenshot v266b_x
waitms 800
setpos 0 -9000 -9500 -55 90 0
waitms 1200
screenshot v266b_b2_up_fog0
waitms 800
r_fog_progless 1
waitms 500

echo ^5=== v266b done ===
wait 30
quit
