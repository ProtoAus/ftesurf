// Patch 417 -- A JOURNAL THAT CLOSED EARLIER IS NOT THIS RUN'S EVIDENCE.
//
// The review's worst evidence finding: the engine keeps the last journal's
// digest so a receipt can sign it after the buffer is freed, and NOTHING said
// that digest belonged to the run being signed.  A run that opens no journal --
// `rec_hid 0`, a Multi-Session resume, or (here) a journal the harness closed
// mid-run -- would sign whichever earlier run's digest was still latched.  The
// named use: play one clean PB so a real journal is latched, turn journalling
// off, and every later run commits to the clean one's bytes.
//
// This arm closes the journal in the middle of the run, so at the finish there
// is none open, and checks that the receipt claims nothing.
//
// Run from C:\FTESurf:
//   ./ftesurf64.exe -WindowStyle Minimized +exec cfg/test/p417stale.cfg
//
// PRE-REGISTERED PREDICTIONS
//  S1  the receipt's `signed hid` reads `- 0 0`: no digest, no length, not kept.
//  S2  the signature still verifies and the rest of the receipt is intact --
//      the run is signed, it simply claims no journal.
//  CONTROL: data/p417/stale.rcpt, produced by the build BEFORE the fix on this
//      same config, reads `signed hid aa2a3dcc... 1897 1` -- a digest the
//      engine had latched when the harness closed the journal, presented as
//      the run's own.
// FALSIFIED IF the receipt names a digest.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p417stale
developer 1
cl_idlefps 0
cl_maxfps 100
sv_cheats 0

set rec_enable 1
set rec_stream 1
set rec_runarchive 1
set rec_hid 1

in_speedbutton 1

waitms 6000
map bhop_eazy
waitmap 45
waitms 3000

echo ================================ P417 S -- armed, not started
cmd timer
waitms 1000

echo ================================ P417 S -- aim
cmd zone_goto 0
waitms 1000
setpos -352 -352 144 0 335.3 0
waitms 1000

echo ================================ P417 S -- jump: this starts the run, and the
echo ================================ P417 S -- server issues the nonce on the same packet
+jump
waitms 700
-jump
waitms 1500
cmd timer

echo ================================ P417 S -- freeze the journal while it is open
in_journal_end data/p417_stale.hid
waitms 1200

echo ================================ P417 S -- fly to the end zone
noclip
waitms 500
+forward
waitms 1500
cmd timer
waitms 2900
cmd timer
waitms 2000
-forward
waitms 1500

echo ================================ P417 S -- after the end zone.  Expect FINISHED.
cmd timer
waitms 2500

echo ================================ P417 S done
waitms 500
quit

// RESULT (2026-09-21):
//   BOTH HELD, and the control is the interesting half.
//   S1  `signed hid - 0 0`.  The journal this harness closed in the middle of
//       the run is not this run's evidence at the finish, and the receipt says
//       so rather than naming it.  The engine's own line, with the temporary
//       instrumentation that found this: `in_journal_end with no buffer open`.
//   S2  the signature verifies and every other line is intact.
//   CONTROL, data/p417/stale.rcpt, this same config on the build before the
//       fix: `signed hid aa2a3dcc15a235beb8ff92df414a410b64a16618519bdf743b167
//       b4fee498254 1897 1` -- a digest the engine had latched when the harness
//       closed the journal, presented as the run's own, with `kept 1` on a file
//       the run did not write.
//
//   WHY IT MATTERS MORE THAN THE HARNESS CASE: the same latch is reached by
//   `rec_hid 0` and by a Multi-Session resume, neither of which opens a journal
//   at all.  Play one clean PB so a real journal is latched, turn journalling
//   off, and every later run would have committed to the clean run's bytes.
