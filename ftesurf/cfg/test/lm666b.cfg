// LM666B -- name every material on surf_666 whose compiled shader has no lightmap.
//
// shader_here prints shader->usageflags & SUF_LIGHTMAP (view.c:2200), which is
// what the material was REGISTERED as -- not what it COMPILED to.  The flag that
// decides whether Mod_LightmapAllocSurf actually gives the surfaces a lightmap is
// SHADER_HASLIGHTMAP, and mod_vbsp.c:3757-3762 already reports every material that
// lacks it, under the r_texdiag cvar.  So the report the user filed has a
// purpose-built diagnostic in the tree already; it just has to be switched on.
//
// r_texdiag MUST be set before `map`: VBSP_GenerateMaterials runs at load and the
// census is inside it.  cfg/default.cfg resets r_texdiag to 0 after the command
// line is applied, which is why this sets it here rather than passing +set.
//
// Also switched on: hl2_vmtkeys, so any key these two materials carry that we
// silently drop shows up in the same log.

log_enable 1
log_dir "logs"
log_name "lm666b"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
developer 1
log_developer 1
con_notifytime 0
con_notifylines 0
con_notifytime_error 0

wait 200

r_texdiag 1
hl2_vmtkeys 1
map surf_666
waitmap 1800
waitms 12000

echo ^5=========== vmt_keys on surf_666 ==================================
vmt_keys
waitms 1000

echo ^5=== lm666b done ===
wait 30
quit
