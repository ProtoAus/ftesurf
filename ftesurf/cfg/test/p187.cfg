// Patches 187-190 verification.
//
// cfg_save_auto 0 FIRST: another ftesurf64 is running (the shared-tree hazard),
// and a second instance quitting would otherwise write ftesurf.cfg out from
// under it -- which is also the CVAR_ARCHIVE trap that produced a bogus "safe
// state" reading in Patch 186.  Nothing below this line is an archived cvar.
cfg_save_auto 0
log_name p187
developer 1
scr_sshot_type png
waitms 3000

echo "=== P187: surf_unrequited -- every texture was white ==="
map surf_unrequited
waitms 30000
echo "--- unrequited: UnlitGeneric $color, a real pass rgbGen ---"
r_showshader dreams/window_fake
waitms 200
echo "--- unrequited: VertexLitGeneric $color2 {30 90 165} -> #COLOR ---"
r_showshader models/dreams/her/umbrella_blue.vmt
waitms 200
echo "--- unrequited: UnlitGeneric $color2 {150 0 0} ---"
r_showshader models/dreams/alarm_clock/clock_second.vmt
waitms 200
echo "--- unrequited: Sprite $color2 {255 169 99} ---"
r_showshader dreams/heart2
waitms 500
screenshot p187_unrequited
waitms 2000

echo "=== P187: surf_demise -- solid smoke and 12 vmt image loads ==="
map surf_demise
waitms 45000
echo "--- demise: WorldVertexTransition, no basetexture2 -> #NOBLEND, no uppermap ---"
r_showshader elly/animated_smoke
waitms 200
echo "--- demise: UnlitGeneric with only $envmap -> map $whiteimage ---"
r_showshader models/surf_demise/ramp7/sky_demise_05.vmt
waitms 500
screenshot p187_demise
waitms 2000

echo "=== P187: surf_rise -- missing transparency, blend not working ==="
map surf_rise
waitms 45000
r_showshader soniccolours/ivy_blendmodulate
waitms 500
screenshot p187_rise
waitms 2000

echo "=== P187: surf_sodacity -- a REAL two-texture blend with a modulate map ==="
map surf_sodacity
waitms 45000
r_showshader de_aztec/hr_aztec/hr_aztec_blend_groundgrass01-groundrock04
waitms 500
screenshot p187_sodacity
waitms 2000

echo "=== P187 DONE ==="
waitms 1000
quit
