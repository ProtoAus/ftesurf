cfg_save_auto 0
// P1576: the ranked profile on an engine 1576+ build (in_guard_live). python tools/p1573guard.py --live ...
// Fresh basedir, so DEFAULT reads the engine's own defaults.
name P1576
fs_cache 0
log_enable 1
log_dir logs
log_name p1576live
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
waitms 3000
connect 127.0.0.1:27561
waitmap 60
waitms 8000
menu_restart
ui_close
waitms 1000
echo ==== P1576 DEFAULT ====
in_keyguard
in_rawinput_nolegacy
in_rawinput_touchpad
in_guard_live
cmd timer
waitms 800
echo ==== P1576 KEYS ====
in_keyguard 0
waitms 800
cmd timer
waitms 800
echo ==== P1576 CLICKS ====
in_keyguard 1
in_rawinput_nolegacy 0
waitms 800
cmd timer
waitms 800
echo ==== P1576 TOUCHPAD ====
in_rawinput_nolegacy 1
in_rawinput_touchpad 1
waitms 800
cmd timer
waitms 800
echo ==== P1576 OK ====
in_rawinput_touchpad 0
set in_guard_live 0
waitms 800
in_guard_live
cmd timer
waitms 800
echo ==== P1576 MIDRUN ====
cmd zone_goto 0
waitms 600
+forward
waitms 1450
in_keyguard 0
waitms 200
in_keyguard 1
waitms 200
cmd timer
waitms 900
-forward
waitms 800
echo ==== P1576 END ====
quit
