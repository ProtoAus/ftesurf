// ANIM03 -- Stage 4.  Does vmt/animated advance, and if not, is sz.z really 1?
//
// WHAT ANIM02 LEFT.  Six screenshots 250 ms apart under hl2_animated 1 differed
// by 0.00%-0.35% with maxdelta as low as 8, and Patch 250 concluded "the flipbook
// selects a frame and then never advances".  It named a suspect --
// img_vtf.c:398 `mips->mip[img].depth = faces` -- and deliberately did not act on
// it, which was the right call, because:
//
// THE SUSPECT IS WRONG, and reading the file is enough to see it.  Line 398 sits
// inside `if (miplevel < miplevels && mips->type != PTI_2D_ARRAY)` -- the
// NON-array branch.  The array branch is 407-419 and sets `depth = frames`, with
// `frames = vtf->numframes` (:326).  The loader already does the right thing;
// "fixing" 398 would have changed cubemap loading to address nothing.
//
// AND THE MEASUREMENT MAY ALSO BE WRONG, for exactly the reason trap 7 exists.
// 250 ms at 24 fps is SIX frames of a 331-frame loop of smoke -- soft, grey and
// low-contrast, and six frames apart it genuinely does look almost identical.
// maxdelta 8 is not zero.  A small diff was read as no diff.
//
// SO MEASURE BOTH SIDES.  Two instruments, neither needing new code:
//
//   1. r_imagelist prints `Array W*H*D` for any texture whose depth != 1
//      (image.c:15487-15490).  If smokeanimated reports depth 331 then the array
//      reached the GPU and sz.z CANNOT be 1, which retires the hypothesis
//      outright; if it reports no depth, the diagnosis stands and the loader is
//      where to look next.  This is the "instrument textureSize" step Patch 250
//      asked for, and it turns out to already be shipped.
//
//   2. A LONG-BASELINE time series WITH THE CONTROL ANIM02 NEVER TOOK.
//      elly/animated_smoke also carries #SCROLL=0.019924,0.001743, so under
//      hl2_animated 0 the frame is ALREADY moving -- a nonzero diff proves
//      nothing on its own, and a near-zero one cannot be attributed without the
//      other half of the comparison.  Take the same three shots at the same 3.5 s
//      spacing in BOTH states.  3.5 s is 84 frames, a quarter of the loop, so if
//      the flipbook advances at all the ON series must move far more than OFF.
//      If the two are indistinguishable, frames are not advancing and it is not
//      the scroll hiding them.
//
// PREDICTIONS, stated before the run:
//   - shader_here reports vmt/animated#...#ANIMRATE=24.000000 under 1 and
//     vmt/transition#...#NOBLEND under 0.  If that does not reproduce, nothing
//     below means anything and the run is void.
//   - animating:     ON diffs are several times the OFF diffs.
//   - not animating: ON and OFF diffs are within noise of each other, and
//     r_imagelist says which half of the chain to open.
//
// Vantage is anim01/anim02's, already known to land on the smoke: 32 units above
// a real displaced smoke vertex looking straight down, so the flipbook is
// magnified across the whole frame and a frame change cannot hide in a corner.

log_enable 1
log_dir "logs"
log_name "anim03"
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 0
vid_fullscreen 0
developer 1
log_developer 1
con_notifytime 0
con_notifylines 0
con_notifytime_error 0

wait 200

hl2_animated 1
map surf_demise
waitmap 1800
waitms 12000
sv_cheats 1
waitms 400
setpos -2944 7552 4865 90 0 0
waitms 2500

echo ^5=========== ON: routing ======================================
shader_here anim_on
waitms 800

echo ^5=========== ON: r_imagelist -- grep the log for smokeanimated =
r_imagelist
waitms 4000

developer 0
waitms 1500

echo ^5=========== ON: time series, 3.5s == 84 of 331 frames ========
screenshot anim03_on_t0
waitms 3500
screenshot anim03_on_t1
waitms 3500
screenshot anim03_on_t2
waitms 1200

echo ^5=========== OFF: the control anim02 never took ===============
developer 1
hl2_animated 0
waitms 3000
setpos -2944 7552 4865 90 0 0
waitms 1500
shader_here anim_off
waitms 800
developer 0
waitms 1200

screenshot anim03_off_t0
waitms 3500
screenshot anim03_off_t1
waitms 3500
screenshot anim03_off_t2
waitms 1200

echo ^5=== anim03 done ===
wait 30
quit
