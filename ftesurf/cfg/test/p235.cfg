// Patch 235: does the asset cache converge, and does it stop claiming files it
// never wrote?
//
// surf_sodacity's ONE missing material is
//   models/props/de_venice/venice_streetlight_1/venice_streetlight_1_lamp_off.vmt
// which EXISTS in CS:GO, was listed at line 295 of the map's own v2 manifest, and
// was never written to the cache directory -- one of 62 such gaps out of 526.  The
// manifest said state 1 regardless, so fs_automount trusted it and skipped mounting
// CS:GO.  That is the whole of the "I have the cache on and still get the warning".
//
// FS_Cache_EndMap copies at the START of the next load, so each sodacity visit needs
// a different map after it to bank the harvest.  demise is used because it mounts
// nothing, so it cannot contaminate the pack set.
//
// Expect: visit 1 harvests (state 0), visit 2 confirms (state 1 IF every noted name
// is now on disk), visit 3 loads from cache.  If it never reaches state 1 that is
// also a correct outcome -- it means something genuinely cannot be copied, and the
// new Con_DPrintf skip lines say which files and why.

log_enable 1
log_name p235
developer 1
log_developer 1
cfg_save_auto 0
cl_idlefps 0
sv_cheats 1
fs_missingwarn 0

wait 200
echo ^5=== p235 visit 1 ===
map surf_sodacity
waitmap 900
wait 400
hl2_missing
fs_automount_state
map surf_demise
waitmap 900
wait 120

echo ^5=== p235 visit 2 ===
map surf_sodacity
waitmap 900
wait 400
hl2_missing
fs_automount_state
map surf_demise
waitmap 900
wait 120

echo ^5=== p235 visit 3 ===
map surf_sodacity
waitmap 900
wait 400
hl2_missing
fs_automount_state
map surf_demise
waitmap 900
wait 120

echo ^5=== p235 done ===
wait 30
quit
