// cfg_save_auto 0 FIRST. This run loads a map and quits, and ftesurf.cfg is
// how ftesurf-a1 lost sv_dlURL -- a saved empty value shadowing the shipped
// one, exec'd after default.cfg and winning silently. A driver that writes
// that file quietly disables downloads for whoever runs it next.
cfg_save_auto 0

// ===========================================================================
//  B89ZDL -- does a client that LACKS a zone file fetch one from our mirror?
//
//  RUN IT LIKE THIS, and park the local copy first or the arm measures nothing:
//
//    mv ftesurf/maps/zones/local/surf_rookie.json <somewhere>
//    rm -rf ftesurf/maps/zones/dl
//    ftesurf64.exe -game ftesurf +set vid_fullscreen 0 \
//        +set vid_width 640 +set vid_height 480 \
//        +set log_name b89zdl +exec cfg/test/b89zdl.cfg
//    (restore the local copy afterwards)
//
//  WHAT IS MEASURED, and it is the subject's own words rather than a file
//  appearing. cl_zones.qc's Zone_LoadForMap prints
//
//      zones: <count> on <map> (<source>) crc <hash>
//
//  on every load, and <source> is Zone_SourceName -- so the line itself says
//  WHICH of the four sources answered. The sequence that proves the feature is
//  TWO of those lines for one map:
//
//      1. at map load:            nothing, or the bsp
//      2. after the fetch lands:  zones: N on surf_rookie (maps/zones/dl) ...
//
//  The second line can only exist if uri_get returned a body, ZoneDL_Reply
//  wrote it, and ZoneDL_Frame re-read the table. A file appearing on disk
//  would prove the write and not the re-read, and the re-read is the half the
//  player actually sees.
//
//  FALSIFIED IF the second line never appears, or if it names any source other
//  than maps/zones/dl -- naming local/ or online/ would mean the parked copy
//  was not parked and the arm measured the ordinary path.
//
//  surf_rookie because it is installed here, is in mapdl.txt, and its textures
//  come off the Steam mount, so the map actually finishes loading. A map whose
//  bsp carries trigger_momentum_timer_* brushes would be the wrong subject:
//  Zone_LoadFromBsp answers first and ZoneDL_Want is never reached.
// ===========================================================================

log_enable 1
log_dir "logs"
developer 1
log_developer 1
cl_maxfps 100
fs_missingwarn 0

echo ==== b89zdl: the cvar as the client actually holds it ====
cl_download_zonesrc

// waitms BEFORE the map and waitmap AFTER it, both from p440font.cfg:110-114.
// The first cut of this arm had neither and measured nothing -- every command
// ran while the engine was still initialising, the map never loaded, and the
// giveaway was `Unknown command "zone_reload"`, because that handler lives in
// CSQC and CSQC does not exist until a map does.
waitms 4000
set sv_gravity 0             // still body, no respawn loop; p440font's reason
map surf_rookie
waitmap 45

echo ==== b89zdl: map is up. The fetch has had no time yet ====
waitms 6000

echo ==== b89zdl: forcing a re-read, so a fetch that landed has to say so ====
zone_reload
waitms 1500

echo ==== b89zdl done ====
quit
