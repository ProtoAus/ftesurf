// P438PI -- post-deploy check for Patches 434-438 (552b093): a client joins a live
// lobby, loads the lobby's csprogs, and the handles and commands these patches added
// answer.  This is a CLIENT CONNECT because the lobbies write no file log and their
// journals need sudo -- the connect is the only thing that proves the new progs are
// the ones running.
//
// WHAT EACH LINE PROVES
//   `sl_replay 900`   Patch 438's harness handle exists in the SERVER progs.  It
//                     answers `save: replay event for slot 900` -- and slot 900 has
//                     no row, so it also proves the range check (`900 is not a slot`
//                     would be the other honest answer; either way the command is
//                     registered, and an unregistered one prints "Unknown command").
//   `cmd viewpos`     Patch 435's second line: `velocity x y z  horizontal N`.  A
//                     build without it prints only the `setpos` line.
//   `scores lines`    Patch 437's builder summary (0 drawn is the right answer with
//                     no row lined -- the line existing is the check).
//   `replay status`   the viewer answers, so the csprogs loaded and CSQC is alive.
//   NO `Unknown command`, NO `QC error`, NO `Bad rcon`.
//
// RESULT (2026-09-24, after the 532fc45 deploy -- qwprogs 801d4d46, csprogs
//  e456ec99, all 12 lobbies restarted, nobody on): joined lobby 4 on 27540,
//  `FTESurf CSQC loaded`, and `hud_edit status` printed `hud_font_outline 2
//  (outline+shadow)` -- a line only the deployed csprogs can print, which is the
//  whole point of this cfg.  The fleet-intact handles all answered as before:
//  `save: replay event for slot 900`, `velocity 0.0000 0.0000 0.0000  horizontal
//  0.0000`, `lines: 0 drawn, 0 segments last frame`, `replay: nothing loaded`.
//  Zero occurrences of Unknown command / QC error / Bad rcon.
//
// Run: ftesurf64.exe -WindowStyle Minimized +exec cfg/test/p440pi.cfg   (cwd C:\FTESurf)
// Log: ftesurf/logs/p440pi.log.  Port 27540 is lobby 4; any of 27510..27620 works.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p440pi
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
wait 600
connect 192.168.1.102:27540
waitms 22000
echo === p440pi handles
// Patch 440's own line: the CLIENT's csprogs is the lobby's copy (downloaded or
// cached), so `hud_edit status` naming hud_font_outline proves the deployed
// csprogs is the one that draws the ring.  A pre-440 csprogs prints nothing here.
hud_edit status
waitms 800
cmd sl_replay 900
waitms 800
cmd viewpos
waitms 800
scores lines
waitms 800
replay status
waitms 800
echo === p440pi done
quit
