// P403LIFTREC -- try to record a `lift` warp (anti-cheat item 8).
//
// WHY THIS IS AWKWARD.  A lift is written when an upward trigger_push fires on a
// GROUNDED player (sv_entities.qc:5608-5615), and the same code clears
// FL_ONGROUND -- so the lift is the thing that un-grounds you.  A run whose start
// box sits on the pad therefore spends its first lift BEFORE the latch.  A
// capture needs the pad to re-ground the body and fire again while the run runs.
// ROUND 1 (bhop_pharma *939, speed 850) FALSIFIED THE MAP, not the idea: the
// body armed on the pad and 1 s later stood at 12993 -61 -879.  That pad sits
// inside a fail teleport, which took the run somewhere else entirely (763 ticks
// in a pit, 0 warps).
//
// ROUND 2 picks a pad WEAKER than gravity so the body lands back on it:
// bhop_badges_mini *249, push UP 400 against gravity 800 (probe: rests at
// z 11393.2 and creeps to 11393.5 in 600 ms -- it never gets away).  The fixture
// START box is a slab of air 100 u above the pad: the body falls out of it, which
// starts the run, and lands on the pad with the recording already open.
//
// SETUP: copy cfg/test/p403lift.zones.json -> maps/zones/local/bhop_badges_mini.json.
// AFTER: delete it, and data/runs/bhop_badges_mini.
//
// PRE-REGISTERED
//  L1 the .rec holds at least one `warp <pk> <mt> <row> lift <o> <v> <fl>`.
//  L2 its <fl> is 0 -- the push clears FL_ONGROUND as part of the same branch.
//  L3 tools/reccheck.py: 0 faults.
// FALSIFIED IF L1 finds none: then a lift cannot reach a recording on this pad,
// and the coverage gap needs a map where a run's route lands on an upward push.
//
// RESULT (2026-09-20).
//  L1 HELD -- 99 `lift` warps, the first ever captured in either corpus.  The weak
//     pad re-grounds the body every few ticks and fires again each time:
//       warp 0  551 0  lift 2430.84546 -7095.6499 11393.0312 0 0 0 0
//       warp 2  553 2  lift 2430.84546 -7095.6499 11393.9912 0 0 0 0
//       warp 10 561 10 lift 2430.84546 -7095.6499 11393.8701 0 0 0 0   (... 99 of them)
//  L2 HELD -- every one ends in <fl> 0: the same branch clears FL_ONGROUND.
//  L3 HELD -- tools/reccheck.py: 0 faults (cheat.rec and cheat.view).
//  p403liftverify: HOLD "no finish: the zones never end this run", and the reason
//     is the harness, not the lifts -- the verifier reads all 99 (it reports
//     "99 warps, 45 rides" and rebuilds 698 packets).  The pad is a trap: a body
//     on it can neither climb off (400 < gravity 800) nor be moved off in a way a
//     replay can follow.
//       - `setpos` writes NO warp record (sv_player.qc:1063-1066 is setorigin +
//         velocity 0 + SV_ClearCarrier + SV_TimerWarped, and no SV_RecWarp), so the
//         replay stays on the pad and never reaches the end box.  It is the one
//         placement in the mod that records nothing; it is cheat-gated
//         (SV_TimerCheat, :1062), so nothing ranks through it, but a cheated run's
//         recording is not re-simulable.
//       - `zone_goto 1` DOES record (sv_zones.qc:875) but arriving in the end box
//         by a zone move takes the timer to `idle`, not `finished`, and no file is
//         written at all.
//     A PASS needs a map whose ordinary route lands a running player on an upward
//     push.  Logged as such rather than forced.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p403liftrec
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
sv_cheats 1
fs_missingwarn 0
set run_resume 0
sv_port 27682

wait 200
map bhop_badges_mini
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 1000
zone_list

echo ^5=== L: fall out of the start slab onto the pad ===
cmd setpos 2430 -7096 11530 0 0 0
waitms 400
cmd viewpos
cmd timer
waitms 800
cmd viewpos
cmd timer
waitms 1500
cmd viewpos
cmd timer
waitms 2500
cmd viewpos
cmd timer
waitms 3000
cmd viewpos
cmd timer

echo ^5=== L2: finish, so the run writes a file ===
cmd setpos 3056 -7376 11310 0 90 0
waitms 1200
cmd viewpos
cmd timer
waitms 2000
cmd viewpos
cmd timer

echo ^5=== P403LIFTREC DONE ===
waitms 1000
quit
