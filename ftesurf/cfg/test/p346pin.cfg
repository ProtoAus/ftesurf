cfg_save_auto 0
// PATCH 346 -- the engine publishes what the mover was handed (the pin).
//
// `pm_pin` prints each client's snapshot, taken in SV_RunCmd just before
// PM_PlayerMove, plus its epoch (bumps when the snapshot changes), the physent
// digest and the portal-crossing count.  The snapshot must come from what the
// mover READ, not from the cvars -- five movevars are latched at spawn, and
// maxspeed/entgravity reach the mover a send frame after QC writes them.
//
// PRE-REGISTERED (bhop_eazy, listen server, player idle in the start box):
//   1  After spawn: epoch >= 1; physmode=1 ticrate=0.00999999978 (bhop 0.01 in
//      float32) jumpvelocity=301.993378 hullx0=-16 hullx1=16.
//   2  IDLE CONTROL: two reads 1 s apart, nothing changed -> SAME epoch and SAME
//      physcrc.  An epoch that moves by itself is the memcmp/-0.0 hazard and
//      would cost ~66 `pm` records a second.
//   3  sv_cheats 1; sv_friction 8 -> friction UNCHANGED and epoch UNCHANGED:
//      sv_friction is copied into movevars only at spawn (SV_SetMoveVars), so a
//      pin read from cvar() would state 8 for a run that never used it.
//   4  pm_jumpvelocity 300 -> jumpvelocity=300, epoch +1 (per-command setter).
//   5  sv_maxspeed 300 -> maxspeed=300, epoch +1 (QC PreThink .maxspeed, then
//      the send frame's host_client->maxspeed).
//   6  pm_jumpvelocity 0 -> jumpvelocity=301.993378 (the fallback), epoch +1.
//
// FALSIFIED IF: 2 moves; 3 shows friction=8; 4-6 do not move the epoch.
log_enable 1
log_dir logs
log_name p346pin
developer 0
set rec_enable 0
set rec_stream 0
cl_idlefps 0
cl_maxfps 100

waitms 6000
map bhop_eazy
waitmap 45
waitms 4000
echo ================================ P346 1 after spawn
pm_pin
waitms 1000
echo ================================ P346 2 idle control
pm_pin
echo ================================ P346 3 sv_friction 8 (spawn-latched)
sv_cheats 1
waitms 300
sv_friction 8
waitms 1000
pm_pin
echo ================================ P346 4 pm_jumpvelocity 300
pm_jumpvelocity 300
waitms 1000
pm_pin
echo ================================ P346 5 sv_maxspeed 300
sv_maxspeed 300
waitms 1000
pm_pin
echo ================================ P346 6 pm_jumpvelocity 0
pm_jumpvelocity 0
waitms 1000
pm_pin
echo ================================ P346 done
waitms 500
quit
//
// RESULT (2026-09-18, exe built from engine Patch 346): ALL SIX HELD.
//   1  epoch 2, physmode=1 ticrate=0.00999999978 jumpvelocity=301.993378,
//      hull +-16.  Not predicted: entgravity=0 -- host_client->entgravity is
//      0 here and pm_source.c treats 0 as 1; the pin states the raw value.
//   2  epoch 2 and physcrc a87ef2 on both idle reads.
//   3  friction=4 and epoch 2 after `sv_friction 8`: the pin is the mover's.
//   4  jumpvelocity=300, epoch 3.  5  maxspeed=300, epoch 4.
//   6  jumpvelocity=301.993378, epoch 5.
// REGRESSION: pm_dettest on bhop_eazy identical before/after and equal to
