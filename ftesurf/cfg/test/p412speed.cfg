// P412SPEED -- a trigger_setspeed pad forces velocity_z and the hop rule read it
// as a jump.
//   ftesurf64.exe +set vid_winmaximize 0 -WindowStyle Minimized +exec cfg/test/p412speed.cfg
//
// THE DEFECT.  trigger_setspeed_touch writes other.velocity_z directly
// (sv_entities.qc, `if (vmode == SSV_SET) vel_z = vspeed`) and was not a
// run_pushed writer, so Patch 409's gate (sv_timer.qc:9156, `!run_pushed ||
// run_jumpcmd`) passed on a rise nobody commanded.  SSV_SET forces the value
// whatever you arrived with.  Patch 412 marks the pad when its own write puts
// velocity_z over PM_NONJUMP_VEL, withholding the accusation as 409 does.
//
// THE PREDICATE IS A CONJUNCTION, and each half alone was a draft that failed.
// `vel_z > other.velocity_z` alone is TRUE for any DESCENDING player, and 25 of the
// start-overlapping pads SET a small or negative vertical (`verticalspeed -6` is the
// common authoring), so it switched the hop rule off on almost every approach --
// both reviewers caught that.  `vel_z > PM_NONJUMP_VEL` alone marks a player whose
// OWN jump put them over 140: vel_z is untouched under SS_IGNORE
// (KeepVerticalSpeed) and unchanged under SS_INCREASE when they arrive higher than
// the pad's value, so a real bhop across a horizontal-only pad in a start box would
// have bought its own acquittal.  Both clauses together say what is meant.
//
// AND THE CLIP CASE IS NOT FIXED.  A pad writing only HORIZONTAL speed still has
// it clipped into velocity_z off a standable slope one packet later, after
// run_pushed is cleared -- 25 such pads over 300 u/s sit inside start zones on 13
// maps (tools/census/ssd1.py).  A flag set in the toucher cannot reach it; see the
// NOT DONE block in trigger_setspeed_touch.  This harness does not test that.
//
// WHY IT NEEDS NO GROUND CONTACT, which is what makes it ordinary rather than
// exotic: dwell is 0 when run_t_groundsec is 0 (sv_timer.qc:8927-8929), and 0 <
// want (0.25).  So an AIRBORNE player who crosses the pad is accused -- jump
// legitimately inside the start box, fly through the curtain, get told "hopped
// start".  No bhop, no timing, no ground phase.
//
// THE MAP.  surf_cement start zone 2 is x 4864..5376, y -4032..-3136, z
// 9216..9536.  Its pad is x 5248..5312 over the SAME y and z -- a 64 u curtain
// spanning the box's full depth and height, so leaving in +x means crossing it.
// verticalspeedmode 1 (SSV_SET), verticalspeed 1800, horizontalspeed 2060, and no
// interval/everytick key, so it fires on the ENTER edge only.
//
// CENSUS (tools/census, 1316 bsps; its README says why AABB figures are graded).
// 376 setspeed pads, 217 write a positive vertical, 183 over 140.  Of those 183: 38 touch a
// start zone, 8 of them only on a zero-width plane (the unreachable surf_prosurf
// shape), 30 have real overlap volume, and 16 across 9 maps lie ENTIRELY inside a
// start zone.  That last figure is the one to quote: containment is the only claim
// an AABB can make safely, because wherever the brush sits inside that box it is
// still inside the start zone.  P411's "4 upward pads" was a gap-zero figure like
// the 38 and two of its three maps proved unreachable -- same trap, counted
// properly this time.
//
// PRE-REGISTERED
//  H1 `cmd timer` in the start box reports hopped 0 before anything else.
//  H2 THE PAD FIRES.  After setpos into the pad, `cmd viewpos` a second later must
//     show the body far from where it was put -- 2060 u/s horizontal and 1800 u/s
//     vertical cannot be mistaken for settling.  If it has not moved, the brush
//     does not fill its AABB and K1/K2 are NOT measurements: say so, do not
//     report them as passes.  (p411push printed a perfect-looking flip on a pad
//     that never armed.  That is what this arm exists to prevent.)
//  K1 patched build, airborne through the pad, NO +jump -> hopped 0.
//  K2 CONTROL, same arms on a pre-412 build -> hopped 1.  Without K2 this proves
//     nothing: hopped 0 is also what a pad that never fired would print.
// FALSIFIED IF K1 reads hopped 1 (the gate still passes), or K2 reads hopped 0
// (there was no defect and this patch is unmotivated), or H2 shows no launch.
//
// RESULT 2026-09-20, patched build against a control built from HEAD (qwprogs.dat
// 1478930 vs 1478882 bytes).  THE FLIP IS REAL, ON THE ARM I DID NOT LABEL:
//
//                     control (pre-412)      patched (412)
//   K1   jumps 1      hopped 0               hopped 0
//   K1b  jumps 3      hopped 1               hopped 0
//
// K1 DISCRIMINATES NOTHING and the reason is mine, not the build's: it setpos's in
// from H2's grounded spot, so run_t_groundsec was ~0.9 s old when the pad fired,
// dwell >= want, and no accusation was due on either build.  K1b setpos's to
// 5000 -3584 9500 first -- airborne, dwell 0 -- and that is the arm that measures.
// Both builds print `jumps 3` and `stage fill: tkspd 2060` there, so the pad fired
// identically; the one line in trigger_setspeed_touch is the only difference.
//
// H2'S DETECTOR FAILED AND TWO BETTER ONES TURNED UP.  `cmd viewpos` read
// 5280.0 -3584.0 9500.0 both before and after, i.e. the body never moved -- setpos
// into that brush leaves it embedded, so the launch cannot be seen positionally.
// That would have sunk the run under the p411push rule ("if nothing moved, K1/K2
// are not measurements").  It does not here, because two independent witnesses in
// the same log show the touch ran and its velocity landed:
//   - `trigger_setspeed: StrictMode is not implemented` -- the dprint inside
//     trigger_setspeed_touch, so the function executed on this pad;
//   - `stage fill: tk 1 tkspd 2060` against `tkspd 0` at H1 -- 2060 is the pad's
//     authored horizontalspeed, latched by SV_StageTakeoff.
// Recorded because the pre-registered detector being the wrong one is a result.
// The accusation preconditions are all visible in the K1b timer block too: `timer:
// armed`, `arm zone 10`, `ok 0`, `ground 0.00`, `ramp: contact 0`, `jumps 3`.
//
// REGRESSION, which matters more than the new arm: these edits are one gate away
// from the rule Patch 409 shipped and the player retested.  cfg/test/p409hop.cfg on
// this build gives its pre-registered result unchanged --
//   H1 ok 0 hopped 0, jumps 0
//   J1 `basevel: paid #1 ... '-0.000131 3000.000000 0.000000'`, jumps 1, hopped 0
//   J2 paid twice (#2, #3), jumps 2, hopped 1
// so 412 disturbs neither 409 nor 411.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p412speed
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
sv_port 27654
sv_cheats 1
set run_resume 0
set run_starthop 1
set run_starthop_strict 1
set run_startcap 0
set run_bv_debug 1
vid_fullscreen 0
waitms 5000
map surf_cement
waitmap 2400
waitms 3000

echo ==== H1 baseline ====
cmd timer
waitms 800

echo ==== H2 does the pad fire at all ====
// Into the start box, clear of the pad (pad starts at x 5248), near the floor.
setpos 5000 -3584 9250
waitms 1200
cmd viewpos
cmd timer
waitms 600

echo ==== K1 airborne into the pad, no jump ====
// Top of the pad volume, so the body is falling when the touch fires: dwell 0.
setpos 5280 -3584 9500
waitms 120
cmd viewpos
waitms 1600
cmd viewpos
cmd timer
waitms 800

echo ==== K1b second entry, from the other side ====
setpos 5000 -3584 9500
waitms 400
setpos 5280 -3400 9480
waitms 1600
cmd viewpos
cmd timer
waitms 800

echo ==== END ====
waitms 800
quit
