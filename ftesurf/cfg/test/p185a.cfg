// P185: the runtime asset cache, full arc in one run.
//
// surf_utopia needs "steam:Team Fortress 2/tf"; bhop_aberrant needs nothing, so it is
// what forces the drop between visits and makes each utopia load pay a real remount.
//
// Expected:
//   1. utopia   mounts TF2, harvests N files          -> manifest state 0
//   2. aberrant drops TF2, flushes                    -> "fs_cache: surf_utopia, N files"
//   3. utopia   state 0 so it MOUNTS TF2 AGAIN, but the cache now outranks it, so the
//               harvest should come back EMPTY        -> manifest state 1
//   4. aberrant drops TF2 again
//   5. utopia   "is cached, not mounting" and NO TF2 mount at all -- this is the payoff.
//               Should report ~12 searchpaths (not 17) and load at cold speed.
//
// Run from a state with NO ftesurf_cache/ directory.
fs_loadstats 1
fs_automount 1
fs_autounmount 1
fs_assetcache 1
developer 0
waitms 4000
echo "=== P185-A: harvest, prove, then skip ==="
echo "--- 1. surf_utopia, first ever visit (mounts TF2, harvests) ---"
map surf_utopia
waitms 30000
echo "--- 2. bhop_aberrant (drops TF2, flushes the harvest) ---"
map bhop_aberrant
waitms 25000
echo "--- 3. surf_utopia, confirming visit (mounts TF2, should harvest NOTHING) ---"
map surf_utopia
waitms 30000
echo "--- 4. bhop_aberrant (drops TF2) ---"
map bhop_aberrant
waitms 25000
echo "--- 5. surf_utopia, PROVEN: should not mount TF2 at all ---"
map surf_utopia
waitms 25000
fs_cache_info
waitms 2000
echo "=== P185-A DONE ==="
waitms 1000
quit
