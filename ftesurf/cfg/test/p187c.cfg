// Patches 187-191, one run.
//
// Screenshots with the console dismissed, plus the Patch 191 target-case counts.
// Predicted from each BSP's entity lump BEFORE the run:
//     bhop_aberrant    0   CONTROL -- must print no target-case line at all
//     surf_kitsune    28   (of 44 trigger_teleports -- the reported map)
//     surf_tycho      74   (worst in the library)
//
// ONE toggleconsole, at the top, while the console is definitely up.  p187b
// called it again after every map, which just put it back -- toggle is a toggle.
cfg_save_auto 0
log_name p187c
developer 0
scr_sshot_type png
waitms 2500
toggleconsole
waitms 500

echo "=== CONTROL: bhop_aberrant, expect NO target-case line ==="
map bhop_aberrant
waitms 18000

echo "=== P191: surf_kitsune, expect target case: 28 ==="
map surf_kitsune
waitms 22000

echo "=== P191: surf_tycho, expect target case: 74 ==="
map surf_tycho
waitms 32000

echo "=== unrequited: the start zone was almost white ==="
map surf_unrequited
waitms 30000
screenshot p187c_unrequited
waitms 1500

echo "=== demise: the smoke, now additive with a scroll ==="
map surf_demise
waitms 48000
screenshot p187c_demise
waitms 1500

echo "=== rise: the ivy, DXT5 with a real alpha channel ==="
map surf_rise
waitms 48000
screenshot p187c_rise
waitms 1500

echo "=== P187C DONE ==="
waitms 1000
quit
