// Patches 187-190: clean screenshots, no console overlay, no developer spam.
// The first run's shots had the console down over half the view.
cfg_save_auto 0
log_name p187b
developer 0
scr_sshot_type png
waitms 3000
toggleconsole

echo "=== unrequited: start zone, was almost white ==="
map surf_unrequited
waitms 30000
toggleconsole
waitms 1500
screenshot p187b_unrequited
waitms 2000

echo "=== demise: the smoke sheets ==="
map surf_demise
waitms 45000
toggleconsole
waitms 1500
screenshot p187b_demise
waitms 2000

echo "=== rise: the ivy ==="
map surf_rise
waitms 45000
toggleconsole
waitms 1500
screenshot p187b_rise
waitms 2000

echo "=== sodacity: the aztec two-texture blend ==="
map surf_sodacity
waitms 45000
toggleconsole
waitms 1500
screenshot p187b_sodacity
waitms 2000

echo "=== P187B DONE ==="
waitms 1000
quit
