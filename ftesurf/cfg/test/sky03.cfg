// SKY03 -- report 3, third cut.  Is the see-through caused by ENTITIES drawn in
// the skyroom pass?
//
// sky02 ruled out two candidates at save009: r_sky_forcedepth 2 changed 0 pixels
// and r_novis 1 changed 211.  What sky02's own pictures then showed is that the
// stuff bleeding through is a WOODEN RAMP and PINE TREES -- and surf_boreas's
// world has no wood texture at all (38 world textures, none of them wood), so
// those are static props, i.e. entities, not brushwork.
//
// gl_warp.c:331-336 says exactly this can happen:
//   "annoyingly sky does not always write depth values ... this can include
//    (massive) entities outside of the skyroom.  so, we can only draw entities
//    in skyrooms if: 1) the ents have robust pvs info ... 2) or if
//    r_ignoreentpvs==1 we must mask depth"
// r_ignoreentpvs is 1 here (measured in sky01), and on a Source map the main
// pass does NOT mask sky depth (R_SkyMaskWantedForGame returns false for
// fg_new), so the skyroom image survives wherever the main view sees sky.
//
// Four shots at one camera, one lever each:
//   A  stock skyroom 1                     (the artefact)
//   B  r_ignoreentpvs 0                    (stop drawing out-of-PVS ents)
//   C  r_drawentities 0, skyroom 1         (no ents at all)
//   D  r_drawentities 0, skyroom 0         (control for C)
// and the cvars are echoed after being set, because sky02's exact-zero result
// for r_sky_forcedepth 2 is equally consistent with "no effect" and "never
// applied", and those need telling apart.

log_enable 1
log_dir "logs"
log_name "sky03"
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 0
vid_fullscreen 0
con_notifytime 0
con_notifylines 0
con_notifytime_error 0

wait 200
echo ^5=== sky03: is the skyroom bleed caused by entities? ===

map surf_boreas
waitmap 1800
waitms 9000
sv_cheats 1
waitms 300
noclip
waitms 300
setpos 10229.4 5262.8 14725.9 17.2046 139.3616 0
waitms 2000

echo ^5========== A: stock, skyroom 1 ==========
vbsp_skyroom 1
r_ignoreentpvs 1
r_drawentities 1
r_sky_forcedepth 1
waitms 2500
r_ignoreentpvs
r_drawentities
r_sky_forcedepth
vbsp_skyroom
waitms 500
screenshot sky03_x
waitms 800
screenshot sky03_a_stock
waitms 800

echo ^5========== B: r_ignoreentpvs 0 ==========
r_ignoreentpvs 0
waitms 2500
r_ignoreentpvs
waitms 500
screenshot sky03_x
waitms 800
screenshot sky03_b_entpvs0
waitms 800
r_ignoreentpvs 1
waitms 1000

echo ^5========== C: r_drawentities 0, skyroom 1 ==========
r_drawentities 0
waitms 2500
r_drawentities
waitms 500
screenshot sky03_x
waitms 800
screenshot sky03_c_noents_skyon
waitms 800

echo ^5========== D: r_drawentities 0, skyroom 0 ==========
vbsp_skyroom 0
waitms 2500
screenshot sky03_x
waitms 800
screenshot sky03_d_noents_skyoff
waitms 800

echo ^5========== E: r_drawentities 1, skyroom 0 (plain control) ==========
r_drawentities 1
waitms 2500
screenshot sky03_x
waitms 800
screenshot sky03_e_skyoff
waitms 800

echo ^5=== sky03 done ===
wait 30
quit
