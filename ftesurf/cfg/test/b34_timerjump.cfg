// Bhop jump-start timer regression.
//
// bhop_futile is resolved from mapmeta as `bhop`.  Its first qualified jump in
// zone 0 must start the timer immediately.  Keeping +jump held produces short
// autohops; those must NOT reset it.  After landing and standing long enough to
// trigger the same +forward release used by the client, another jump in the
// start must atomically reset the clock.
//
// surf_null is the control: its vertical jump must leave the timer armed until
// the player actually leaves the start zone.

log_enable 1
log_name b34_timerjump
developer 0
cfg_save_auto 0
cl_idlefps 0
con_notifytime 0

wait 200
echo ^5=== bhop jump-start timer ===

map bhop_futile
waitmap 600
wait 90

cmd zone_goto 0
waitms 1200

echo ^5--- armed control: expect `armed`, `start on jump` ---
cmd timer
waitms 500

echo ^5--- initial jump: expect `running` immediately ---
+jump
waitms 50
cmd timer
waitms 500

echo ^5--- held autohops: expect the clock around 1.4s, NOT near zero ---
waitms 850
cmd timer
waitms 500
-jump

echo ^5--- stand, then jump again: expect the clock reset near zero ---
waitms 1200
+jump
waitms 50
-jump
waitms 50
cmd timer
waitms 600

echo ^5--- bhop fallback: walking out must still start the clock ---
map bhop_futile
waitmap 600
wait 90
cmd zone_goto 0 90 0
waitms 1200
+forward
waitms 2500
-forward
waitms 100
cmd timer
waitms 600

echo ^5--- surf control: expect jump not to start while still in the box ---
map surf_null
waitmap 240
wait 90
cmd zone_goto 0
waitms 1200
cmd timer
waitms 300
+jump
waitms 50
-jump
waitms 50
cmd timer
waitms 600

echo ^5=== done ===
wait 30
quit
