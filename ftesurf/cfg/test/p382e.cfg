// P382E -- Patch 382, client B for p382d.cfg (predictions there).  Joins the host
// on 27682 as entnum 2 and spectates it (A = entnum 1) at the times below, which
// assume the host's map loads in ~10 s; each arm has >= 20 s of margin to the
// host's arm it depends on.  B is kicked twice and reconnects twice.
//   wall s   B                                   host (p382d)
//     40     connect
//     60     L: save, run, hold, sl_save/sl_hold refused, sl_load, finish
//     77     SLH: sl_hold then rec_spec 1 refused, sl_holdoff
//     84     B1: run, hold                        ~117 map reload (SRV)
//    155     B2: run, hold, ms_resume refused (MSR), release
//    169     RES: ms_resume, finish the SRV run
//    187     B2b: run, hold                       ~223 kick (DRP + NT)
//    263     reconnect                            ~315 kick, then retry (RTY)
//    358     reconnect
//    383     ms_discard, B3: run, hold            ~422 lobby_cycle 60 -> ~482 (ROT)
//    633     quit
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p382e
developer 1
cl_idlefps 0
cl_maxfps 100
rate  2000000
drate 5000000
vid_fullscreen 0
name p382e
waitms 40000
connect 127.0.0.1:27682
waitms 20000
set rec_terms 1
echo ^5==== L: load while held ====
cmd sl_delall
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 600
-forward
waitms 600
cmd sl_save
waitms 400
+forward
waitms 400
-forward
waitms 600
cmd rec_spec 1
waitms 1000
cmd sl_save
waitms 300
cmd sl_hold
waitms 700
cmd sl_load
waitms 1000
+forward
waitms 7000
-forward
waitms 2000
cmd timer
echo ^5==== SLH: spectate refused under a save-lock hold ====
cmd sl_hold
waitms 300
cmd rec_spec 1
waitms 300
cmd sl_holdoff
waitms 3000
echo ^5==== B1: hold until the host reloads the map ====
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 1000
-forward
waitms 800
cmd rec_spec 1
waitms 71000
echo ^5==== B2: hold, ms_resume refused (MSR), release ====
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 1000
-forward
waitms 800
cmd rec_spec 1
waitms 2000
cmd ms_resume
waitms 1000
cmd rec_spec 0
waitms 7000
echo ^5==== RES: resume the SRV run, finish it ====
cmd ms_resume
waitms 6000
+forward
waitms 7000
-forward
waitms 2000
cmd timer
echo ^5==== B2b: hold until kicked ====
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 1000
-forward
waitms 800
cmd rec_spec 1
waitms 75000
echo ^5==== reconnect 1 ====
connect 127.0.0.1:27682
waitms 95000
echo ^5==== reconnect 2 ====
connect 127.0.0.1:27682
waitms 25000
echo ^5==== B3: discard, hold until the rotation ====
cmd ms_discard
waitms 1000
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 1000
-forward
waitms 800
cmd rec_spec 1
waitms 245000
echo ^5==== p382e done ====
disconnect
waitms 500
quit
