// OVL01 -- Stage C: are the maps' BAKED decals (LUMP_OVERLAYS, lump 45) read,
// synthesised as info_overlay, and placed?  And are Source decals lit now?
//
// Four maps, chosen from a census of all 1310:
//     bhop_futile   lump 45 raw length 0            -> THE CONTROL.  No overlay
//                   line may appear at all.  If one does, the synthesis is
//                   inventing entities.
//     surf_rise     105 overlays, lump 45 version 0 -> the ordinary case
//     bhop_arcane     5 overlays, lump 45 VERSION 1 -> Strata's 356-byte record.
//                   This is the one that proves the stride is chosen by the
//                   LUMP's version field and not the BSP header version.
//     surf_theme    604 overlays                    -> the worst case in the
//                   library, and the one with the most tiled/sheared rejects.
//
// ent_census is the second assertion: info_overlay must NOT appear in it.  The
// plugin synthesises hundreds of them and SSQC now has a stub that removes them,
// so a census row would mean the stub is not being reached.

log_enable 1
log_dir "logs"
log_name "ovl01"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
sv_cheats 1
developer 1
log_developer 1

wait 200
echo ^5=== ovl01: LUMP_OVERLAYS -> info_overlay -> adddecal_static ===
echo ^5--- cvars, value then (default) ---
hl2_overlays
vbsp_overlays
vbsp_overlay_depth
vbsp_overlay_shear
fs_overlay_tiled
r_decal_lightmap

echo ^5=================== bhop_futile: THE CONTROL (no lump 45) =================
map bhop_futile
waitmap 1800
waitms 4000
ent_census
waitms 800

echo ^5=================== surf_rise: 105 overlays, lump version 0 ===============
map surf_rise
waitmap 1800
waitms 4000
ent_census
waitms 800

echo ^5============ bhop_arcane: 5 overlays, lump VERSION 1 (356-byte) ===========
map bhop_arcane
waitmap 1800
waitms 4000
ent_census
waitms 800

echo ^5=================== surf_theme: 604 overlays, the worst case ==============
map surf_theme
waitmap 1800
waitms 5000
ent_census
waitms 800

echo ^5=== ovl01 done ===
wait 30
quit
