cfg_save_auto 0
// Build 64 STAGE 2: do the three tabs draw the right board?
//
// Stage 1 proved the NETWORK path (b64board.cfg): one GET, parsed, stored.
// This proves the BOARD -- that the tab picks the style, the chip picks the
// tier, and that the four (tier x style) boards never bleed into each other.
//
// SEEDED ON THE Pi BEFORE THIS RUNS, deliberately across all four quadrants,
// and deliberately with the SEGMENTED runs FASTER than the clean ones -- which
// is what a segmented run is, and which makes the leak detectable:
//
//   ranked    / clean      Bob   3500 ticks  flags 0     -> 0:52.500
//                          Alice 4108 ticks  flags 0     -> 1:01.620
//   community / clean      Carol 5200 ticks  flags 1024  -> 1:18.000  (TF_NORULESET)
//   ranked    / segmented  Dave  3100 ticks  flags 128   -> 0:46.500  (TF_SEGMENT)
//   community / segmented  Erin  2900 ticks  flags 640   -> 0:43.500  (TF_SEGMENT|TF_NOJOURNAL)
//
// THE SHARPEST CHECK IN THE FILE: Dave and Erin are the two FASTEST times on
// the map.  If `style` does not separate the boards, one of them is rank 1 on
// the clean tab -- not a subtle misordering, the top row.  A test where the
// leak would be a rounding error would prove much less.
//
// PREDICTIONS, registered before the run:
//   ARM A  scores status, nothing touched -> tab online, tier ranked, and the
//          online board already "fetching": the tab DRIVES the fetch, nobody
//          has to click a chip or call board_fetch.
//   ARM B  after the reply -> ok, rows 2, Bob then Alice, ranked 2/community 1,
//          ages "now", and NO Dave and NO Erin.
//   ARM C  tier community -> rows 1, Carol, flags 1024, the word "no ruleset".
//   ARM D  tab segmented + tier ranked -> rows 1, Dave 0:46.500, flags 128,
//          counts ranked 1 / community 1 -- the counts are per STYLE, so they
//          must CHANGE from ARM B's 2/1.  Unchanged counts = counts not scoped.
//   ARM E  tier community -> rows 1, Erin 0:43.500, flags 640, "no journal".
//   ARM F  tab local -> NO "online board:" line at all, and the local list
//          (which is empty on this install) reported instead.
//   ARM F  ...and the local time reads at THE SERVER'S tick, not the shipped
//          one: bhop_eazy runs at 0.01 s/tick, so the 4976-tick PB is
//          0:49.760 and NOT the 1:14.640 that PM_TICK would print.
//   ARM G  hud_scale 2 -> cols 76, every column drawn.
//   ARM H  hud_scale 6 -> cols 65: the `why` column drops.
//   ARM I  hud_scale 8 -> cols 44: `age` and `run` drop as well.
//          (MEASURED 65, not 44 -- see the note above ARM I.  The prediction
//          assumed a font size that is off the top of the mono ladder.)
//
// FALSIFIED IF: Dave or Erin appear under clean (the style key is not
// separating the boards); counts read 0 (the nested "counts" object is not
// being walked) or do not change between ARM B and ARM D (they are not scoped
// per style); a ranked row carries a why-word (the demotion bits are being
// read on the wrong rows); ARM F prints an online board (Scores_IsOnline is
// wrong); an age reads anything but "now" on rows submitted seconds earlier;
// or any time reads 64:48:53.328, which is the Hz-vs-seconds inversion that
// b64board.cfg caught once already and which would mean it came back.
//
// wall clock, not frames, before the first `map` -- see p313ruleset.cfg.
log_enable 1
log_dir logs
log_name b64tabs
waitms 5000

// Point at the Pi explicitly rather than trusting what ftesurf.cfg archived.
lobby_dir "http://192.168.1.102:8084"

// A pinned virtual screen, because the layout is what is on trial and
// vid_width is pinned to 0 by ftesurf.cfg -- the launch line cannot set this.
// 1600x900 is wide enough for the full 76-character table, so ARM A..F see
// every column and ARM G is the only one that drops any.
vid_conwidth 1600
vid_conheight 900
hud_scale 2

map bhop_eazy
waitmap 45
waitms 4000

// Open it and LEAVE it open, so every arm below exercises Scores_Draw and
// both row drawers rather than only the console report.
echo ==== ARM A: fresh, nothing clicked (expect tab online / tier ranked / fetching) ====
scores open
waitms 500
screenshot
waitms 1000

echo ==== ARM B: the default board (expect Bob 0:52.500 then Alice 1:01.620, 2/1) ====
scores status
waitms 500
screenshot
waitms 1000

echo ==== ARM C: community chip (expect Carol 1:18.000 flags 1024, no ruleset) ====
scores tier community
waitms 2500
scores status
waitms 500
screenshot
waitms 1000

echo ==== ARM D: segmented tab, ranked (expect Dave 0:46.500 flags 128, counts 1/1) ====
scores tab segmented
waitms 200
scores tier ranked
waitms 2500
scores status
waitms 500
screenshot
waitms 1000

echo ==== ARM E: segmented + community (expect Erin 0:43.500 flags 640, no journal) ====
scores tier community
waitms 2500
scores status
waitms 500
screenshot
waitms 1000

echo ==== ARM F: local tab (expect NO online board line) ====
scores tab local
waitms 800
scores status
waitms 500
screenshot
waitms 1000

// ARM G, SECOND CUT.  The first one set vid_conwidth 640 and proved nothing:
// that is the MENU's virtual screen (what m_draw lays out against) and it does
// not reach CSQC, which lays out in the real pixels CSQC_UpdateView is handed.
// The board drew identically and the arm looked passed -- caught only because
// the screenshot was read rather than assumed.
//
// hud_scale is the knob that does reach it.  The drop rule is the ratio
// ColX(cols) > rs_x - pad, so a bigger font against a fixed window exercises
// exactly the arithmetic a smaller window would, and `cols` in the status line
// now names the budget that was actually chosen.
echo ==== ARM G: back on the default board at hud_scale 2 (expect cols 76, all columns) ====
scores tab online
waitms 200
scores tier ranked
waitms 2500
scores status
waitms 500
screenshot
waitms 1000

echo ==== ARM H: hud_scale 6 (expect cols 65 -- the why column drops, nothing overflows) ====
hud_scale 6
waitms 800
scores status
waitms 500
screenshot
waitms 1000

// ARM I PREDICTED cols 44 AND MEASURED 65, AND THE PREDICTION WAS THE WRONG
// PART.  The mono ladder is "8 10 12 14 16 18 20 22 24 28 32" (sh_font.qc) and
// tops out at 32, so hud_scale 6 asks for 36 and hud_scale 8 asks for 48 and
// BOTH snap to the same 32 -- identical cw, identical budget.  This arm is a
// duplicate of ARM H, kept because that is worth knowing: the third budget
// (SBX_DATE, 44) is not reachable by hud_scale on a 1920-wide window at all,
// and testing it needs a genuinely narrow one.  The arithmetic in my head
// assumed a font size the engine cannot draw.
echo ==== ARM I: hud_scale 8 (measures cols 65 -- the SAME rung as ARM H) ====
hud_scale 8
waitms 800
scores status
waitms 500
screenshot
waitms 1000
hud_scale 2
waitms 500

echo ==== END ====
log_enable 0
waitms 500
quit
