// SKY01 -- three reports from surf_boreas, captured at the exact save-locks.
//
// Lex saved three positions and described two of them.  This drives the camera
// to those save-lock origins/angles and shoots each one twice, vbsp_skyroom 0
// then 1, so the "only there when I turn on 3d skybox" claim is a diff and not a
// recollection.
//
//   save011  13826.6 -2739.2 12105.6  p16.34 y163.28  -- "a ramp, brush model,
//            no transparency applied to the faces like it should have"
//   save010  -1841.2  2588.4 -12054.9 p26.30 y142.77  -- "3d skybox presents
//            some sort of skybox onto the stage, see through the stage itself"
//   save009  10229.4  5262.8  14725.9 p17.20 y139.36  -- control, main map
//
// Plus a look UP from inside the 3D skybox room at the two CLOODS displacements
// (z -8000 and -7232, spanning the whole +-16000 map footprint), which is the
// "clouds not based on distance" report.
//
// What the map actually contains, from the lumps -- so the pixels can be read
// against something:
//   TOOLS/TOOLSSKYBOX    390 faces, z  7488..16128  -- the MAIN map's sky
//   TOOLS/TOOLSSKYBOX2D 1231 faces, z -16192..-5184 -- the SKYBOX ROOM's shell
//   PROJECT_TENDIES/CLOODS 2 disp faces, z -8000 / -7232, x/y +-16000
//   sky_camera at -6208 1840 -16064, scale 4
// The room's 2D-sky shell tops out at z=-5184 and the main map's fail zone sits
// at about z=-4576.  They share the whole footprint and are ~450 units apart.
//
// screenshot captures one frame behind, so every measured shot gets a throwaway
// first.  setpos does not noclip -- noclip is issued separately.

log_enable 1
log_dir "logs"
log_name "sky01"
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 0
vid_fullscreen 0
con_notifytime 0
con_notifylines 0
con_notifytime_error 0

wait 200
echo ^5=== sky01: surf_boreas skybox/translucency reports ===

map surf_boreas
waitmap 1800
waitms 9000
sv_cheats 1
waitms 300
noclip
waitms 300

echo ^5--- the cvars that decide sky masking ---
r_sky_forcedepth
r_ignoreentpvs
r_fastsky
vbsp_skyroom
hl2_lt_baked
waitms 500

// ---------------------------------------------------------------- save011 --
echo ^5========== save011: the ramp with no translucency ==========
setpos 13826.6 -2739.2 12105.6 16.3367 163.2788 0
waitms 2500
shader_here save011-ramp
waitms 400
solid_here save011-ramp
waitms 400
vbsp_skyroom 0
waitms 2000
screenshot sky01_x
waitms 800
screenshot sky01_011_skyoff
waitms 800
vbsp_skyroom 1
waitms 2000
screenshot sky01_x
waitms 800
screenshot sky01_011_skyon
waitms 800

// ---------------------------------------------------------------- save010 --
echo ^5========== save010: see-through stage, only with 3d skybox ==========
setpos -1841.2 2588.4 -12054.9 26.3013 142.7673 0
waitms 2500
shader_here save010-seethru
waitms 400
vbsp_skyroom 0
waitms 2000
screenshot sky01_x
waitms 800
screenshot sky01_010_skyoff
waitms 800
vbsp_skyroom 1
waitms 2000
screenshot sky01_x
waitms 800
screenshot sky01_010_skyon
waitms 800

// ------------------------------------------------- the clouds, from below --
echo ^5========== CLOODS: looking up from inside the 3d skybox room ==========
setpos -1841.2 2588.4 -12054.9 -40 142.7673 0
waitms 2500
shader_here cloods-frombelow
waitms 400
vbsp_skyroom 0
waitms 2000
screenshot sky01_x
waitms 800
screenshot sky01_cloods_skyoff
waitms 800
vbsp_skyroom 1
waitms 2000
screenshot sky01_x
waitms 800
screenshot sky01_cloods_skyon
waitms 800

// ------------------------------------------- save009, main-map control -----
echo ^5========== save009: main map control ==========
setpos 10229.4 5262.8 14725.9 17.2046 139.3616 0
waitms 2500
vbsp_skyroom 0
waitms 2000
screenshot sky01_x
waitms 800
screenshot sky01_009_skyoff
waitms 800
vbsp_skyroom 1
waitms 2000
screenshot sky01_x
waitms 800
screenshot sky01_009_skyon
waitms 800

// -------------------------------- main map, looking AT the sky (parallax) --
// Two stations 4096 apart on X, same angles, skybox on.  If the 3D skybox is
// working, everything in it shifts by the SAME small amount between these two
// shots (the camera moves 4096/4 = 1024 in the room).  Anything that shifts by
// a main-world amount instead is being drawn in the wrong pass.
echo ^5========== parallax stations, skybox on ==========
vbsp_skyroom 1
setpos 12000 -8000 14000 -12 180 0
waitms 2500
screenshot sky01_x
waitms 800
screenshot sky01_par_a
waitms 800
setpos 7904 -8000 14000 -12 180 0
waitms 2500
screenshot sky01_x
waitms 800
screenshot sky01_par_b
waitms 800

echo ^5=== sky01 done ===
wait 30
quit
