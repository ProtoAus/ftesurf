// cfg_save_auto 0: this run sets archived cvars (vid_*, cl_maxfps); never let it write them into ftesurf.cfg (cl_main.c:2535)
cfg_save_auto 0
// FTESurf Patch 293 -- VRAD's 12-byte-per-vertex baked static prop lighting.
//
// THE BUG.  sp_hdr_N.vhv carries a per-vertex STRIDE in its header.  The loader demanded
// vertexsize == 4 and rejected everything else, so on 67 maps (27,178 props, measured off
// the library's own pakfiles) every baked prop colour was thrown away and the props fell
// back to the leaf ambient cube.  surf_fantasy is one: 2345 files in the pak, 2345 props,
// and "props: 0 of 2345 lit from VRAD's baked vertex lighting" in the log.
//
// Twelve bytes is three BGRA colours -- Source's three radiosity-normal-map basis colours.
// The patch averages them.  hl2_lt_vhv12 0 restores the old rejection, which is the A/B.
//
// THREE ARMS IN ONE PROCESS, because the cross-run pixel floor hides a 7-18% swing:
//   1. fantasy, hl2_lt_vhv12 1  -- must read "props: 2345 of 2345"
//   2. boreas                   -- the CONTROL: vertexsize 4, must still read "1587 of 1587"
//                                  and must look identical to before
//   3. fantasy, hl2_lt_vhv12 0  -- the OFF arm: back to "props: 0 of 2345", the dark picture
//
// Arm 3 reloads the same map, so it goes through boreas first: `map x` twice in a row does
// not reload (ftesurf-ab-testing-traps).
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000
wait 200

developer 1
log_developer 1
log_enable 1
log_dir logs
log_name p293_fantasy
cl_maxfps 0
cl_idlefps 0
sv_cheats 1
con_notifylines 0
con_notifytime 0
con_notifytime_error 0
r_drawentities 1
r_lightstylescale 1

// leave the Patch 268 C switches where they ship, so this measures 293 alone
hl2_cubelight 0
hl2_bumpgreenfix 0
hl2_lt_dirsign 0
r_cubelight 1

// ============ ARM 1: fantasy, the fix ON ============
hl2_lt_vhv12 1
echo ^5=== p293 ARM 1: surf_fantasy, hl2_lt_vhv12 1 -- expect "props: 2345 of 2345"
map surf_fantasy
waitmap 600
waitms 9000
waitms 3000
noclip
waitms 1000

setpos -9424.4 -15577.9 6155.6 -12 0 0
waitms 2500
cmd viewpos
screenshot p293_on_tree_cluster

setpos -9212.0 -14488.0 6141.0 20 0 0
waitms 2500
screenshot p293_on_tree_fern

setpos 7095.0 -14443.4 -10790.5 -12 0 0
waitms 2500
screenshot p293_on_tree_pine04

// save001: the island rock -- Lex's reference pair for the bumpmapping complaint
setpos -9001.9434 -14301.5703 6205.6196 30.9814 38.5675 0
waitms 2500
cmd viewpos
prop_census fan_rock
screenshot p293_on_s1_rock

setpos -10560.2393 -12718.2324 4593.5737 18.5669 164.0588 0
waitms 2500
screenshot p293_on_s2

// ============ ARM 2: boreas, the CONTROL (vertexsize 4, must not move) ============
echo ^5=== p293 ARM 2: surf_boreas CONTROL -- expect "props: 1587 of 1587", unchanged
map surf_boreas
waitmap 600
waitms 9000
waitms 3000
noclip
waitms 1000
setpos 9440 -15488 3741 0 90 0
waitms 2500
cmd viewpos
screenshot p293_ctl_boreas_ramp

// ============ ARM 3: fantasy again, the fix OFF ============
echo ^5=== p293 ARM 3: surf_fantasy, hl2_lt_vhv12 0 -- expect "props: 0 of 2345", the dark picture
hl2_lt_vhv12 0
map surf_fantasy
waitmap 600
waitms 9000
waitms 3000
noclip
waitms 1000

setpos -9424.4 -15577.9 6155.6 -12 0 0
waitms 2500
screenshot p293_off_tree_cluster

setpos -9212.0 -14488.0 6141.0 20 0 0
waitms 2500
screenshot p293_off_tree_fern

setpos 7095.0 -14443.4 -10790.5 -12 0 0
waitms 2500
screenshot p293_off_tree_pine04

setpos -9001.9434 -14301.5703 6205.6196 30.9814 38.5675 0
waitms 2500
prop_census fan_rock
screenshot p293_off_s1_rock

setpos -10560.2393 -12718.2324 4593.5737 18.5669 164.0588 0
waitms 2500
screenshot p293_off_s2

echo ^5=== END OF RUN ===
waitms 500
quit
