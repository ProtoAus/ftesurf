cfg_save_auto 0

// ===========================================================================
//  P450MAP -- a start-box load only arms clean if the save can prove which BSP it
//  came from.
//    python tools/p450map.py [--control]
//  Stages save901 = p435rest.txt (NO mapcrc) and save902 = p450wrong.txt (a WRONG
//  one).  Stages cfg/test/p435.zones.json.  The driver forces `+set sv_gamemode surf`.
//
//  THE DEFECT.  A save was keyed by map NAME alone: `map` has been written since the
//  format existed and NO READER EVER LOOKED AT IT (round 7 counted it as one of three
//  write-only keys).  The zone JSON is keyed by name too, so the coordinates a save
//  calls "the start box" are identical on a different .bsp under the same name -- only
//  the BRUSHES differ, and brushes are exactly what SL_RowGrounded traces.  So the
//  Build 47 gate would trace THIS map's world against THAT map's origin and launder the
//  load's TF_SEGMENT|TF_PRACTICE on the strength of it.
//
//  THE FIX adds `mapcrc` from `infokey(world, "*mapcrc")` -- which already existed in
//  this tree, with its third verdict done right, at SV_MapForeign -- and makes the gate
//  require a POSITIVE match.
//
//  THE POLARITY IS THE REVERSE OF SV_MapForeign'S, AND THAT IS THE DESIGN.
//  SV_MapForeign decides an ACCUSATION, so it answers "not foreign" when either crc is
//  missing: a check that cannot see must not accuse.  This gate decides a GRANT -- the
//  arm it forces launders the taint -- so "cannot tell" must fall the other way, or the
//  blindness becomes the bypass.  That is round 5's finding about SL_RowGrounded applied
//  one level up, and it is why there are three sections below and not two.
//
//  ARMS, in log order:
//   N   NO CRC.  `sl_goto 1` loads p435rest.txt, the grounded at-rest row the Build 47
//       gate has always accepted.  It carries no `mapcrc`, so it CANNOT PROVE anything:
//       the gate must refuse and the attempt must stay PRACTICE.  This is also every
//       pre-450 save on every disk, so it is the honest-player cost of the patch made
//       visible rather than argued about -- it heals on the next save.
//   W   WRONG CRC.  `sl_goto 2` loads p450wrong.txt: the same row with a non-empty crc
//       that is definitely not this install's.  DISPROVED rather than unproven, and the
//       dprint must say so in different words from N -- otherwise a player who stops
//       arming clean cannot tell which of the two happened, and neither can a reviewer.
//   S   THE POSITIVE CONTROL, and it is why this arm can exist at all.  `sl_save` writes
//       a save HERE, on this install, so it carries the live crc without this file having
//       to hard-code one (a hard-coded crc would be wrong on every other machine).
//       Loading it must PROVE the map and arm CLEAN.  Without S the patch would be
//       indistinguishable from one that simply broke the gate for everyone.
//
//  PRE-REGISTERED PREDICTIONS
//   N   FIXED    `class: segmented`, `practice 1`, `nocrc` present.
//       CONTROL  `class: clean`, `practice 0` -- the gate fired and asked nothing.
//       `support` is REPORTED, not graded, and the first run of this arm is why: the gate
//       tests the map BEFORE SL_RowGrounded, so on a refused map the probe never runs and
//       prints nothing (<absent>, not 0).  That ordering is correct -- a string compare is
//       cheaper than a tracebox, and there is nothing to ask about geometry until the bsp
//       is known -- so the arm moved rather than the code.
//   W   FIXED    `class: segmented`, `practice 1`, and `crcsay` present.
//       CONTROL  `class: clean`, `practice 0`.
//   S   BOTH     `class: clean`, `practice 0`.  On the control because the gate never
//                asked; on the fixed build because the save proved its map.  Reading
//                `segmented` here on the FIXED side is the falsifier -- it would mean
//                the patch refuses even a save it should accept.
//  FALSIFIED IF S reads `support 0` (the probe refused the positive control's ROW, so
//   the section measures the ground check rather than the map check and S proves nothing),
//   or S reads `segmented` on the fixed side (the patch broke the gesture it was supposed
//   to preserve -- this is the one reading that would send the patch back), or `nocrc` and
//   `crcsay` are ever both present in one section (the two refusals are not actually
//   distinguishable and the third verdict is decoration).
//
//  RESULT 2026-09-27, both sides exit 0.  qwprogs BFC3D491E36ADAB1 fixed /
//  2EE7916A043FC579 control (worktree at 7947906).
//   CONTROL  N and W both `class clean practice 0 support 1` -- the gate fired and
//            laundered a save that cannot prove its map, and one from a different bsp.
//   FIXED    N `segmented practice 1` + "cannot prove which bsp"; W `segmented
//            practice 1` + "taken on a DIFFERENT bsp" -- two different sentences, so the
//            third verdict is distinguishable rather than decorative.
//            S `clean practice 0`: the gesture the gate exists for still works.
//  S READS THE SAME ON BOTH SIDES and that is the guard: a patch that simply broke the
//  gate would pass N and W.  The FIXTURES ARE STAMPED with this install's crc by
//  tools/mapcrc.py at stage time (tools/p443start.py does the same for its own rows),
//  because a literal crc in cfg/test/ would be wrong on every other machine -- and
//  without the stamp Patch 450 would silently disarm Patch 445's own L section, which is
//  the arm-whose-condition-never-occurs trap arriving from a LATER patch.
log_enable 1
log_dir logs
log_name p450map
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
sv_port 27705
sv_cheats 0
set run_resume 0
vid_fullscreen 0
waitms 5000
map bhop_eazy
waitmap 2400
waitms 3000
menu_restart
ui_close
waitms 1200

echo ==== N no crc: the pre-450 save, which cannot prove its map ====
cmd sl_goto 1
waitms 1400
cmd timer
waitms 1000

echo ==== W wrong crc: disproved, not merely unproven ====
cmd sl_goto 2
waitms 1400
cmd timer
waitms 1000

echo ==== S the positive control: a save taken HERE carries this map's crc ====
// Written on this install, so the crc is whatever this bhop_eazy.bsp hashes to and no
// number has to be hard-coded.  `!r` first, so the save is taken at rest in the start
// box -- the gate needs SL_RowSpeed under SL_ARM_SPEED and a grounded row, and a body
// still settling from the previous load would fail those for reasons that are not this
// patch's.
cmd zone_reset
waitms 1500
cmd sl_save
waitms 1200
cmd sl_goto 3
waitms 1400
cmd timer
waitms 1000

quit
