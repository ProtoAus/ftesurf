// Patch 421 -- THE SERVER HALF of the v9 angle corpus.  Identical to
// p418sv.cfg except that it stays up long enough for a whole batch of client
// runs instead of one, because the batch is the point: the thresholds under
// test were set from ONE swept v9 run (p420live) and a number from n=1 is the
// P419 lesson.
//
// Start this FIRST, from C:\FTESurf:
//   C:\FTEQuake\fteqwsv64.exe +set sv_port 27696 +set sv_public 0
//     +set log_enable 1 +set log_dir logs +set log_name p421sv
//     +map bhop_eazy +exec cfg/test/p421sv.cfg
// then p421corp.cfg in a client, once per variant.  tools/p421corp.ps1 drives
// both ends.
//
// sv_cheats 1 for the same reason p418sv.cfg needs it: the route is setpos and
// noclip, which a server refuses a remote client otherwise.  Every run here is
// tagged cheat and that is irrelevant -- a receipt, an upload and a recording
// happen for a cheated run exactly as for a clean one.
developer 1
sv_cheats 1
set rec_enable 1
set rec_runarchive 1
set run_evidence_ul 1
set sv_playerslots 4
waitms 1200000
quit
