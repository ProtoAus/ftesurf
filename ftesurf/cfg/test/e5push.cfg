// E5 -- THE VELOCITY CARRIER, capture arm (site 4: surf_ecosystem).
//
// Build 83 closed E3's hole for state imposed on POSITION.  The plan names the
// next gap and says its shape is not guessable and must be measured the way the
// teleports were.  This is that measurement's capture.
//
// WHAT THE CARRIER IS (sv_entities.qc:827-894), and it is not one thing:
//
//   trigger_push, continuous arm   writes .run_basevel AND .run_basevel_armed.
//     While the player is in the volume the cash-out is SUPPRESSED, so they
//     RIDE the carrier -- the engine adds it before the move and subtracts it
//     after -- and collect it as real velocity on the first command after they
//     leave.
//
//   AddOutput basevelocity         writes .run_basevel and NOT the flag, so the
//     very next command cashes it out in full.  789 outputs across 139 zoned
//     maps.  The plan does not mention this shape at all.
//
// TWO INVISIBILITIES, DIFFERENT IN KIND:
//
//   (a) THE CASH-OUT -- a discrete velocity impulse in PlayerPreThink, outside
//       the mover.  A teleport's shape wearing velocity; a `warp`-like record
//       carries it.
//   (b) THE RIDE -- pmove.basevelocity non-zero DURING the move, changing the
//       move's own outcome.  Not an event at all: a PARAMETER of the move, like
//       a movevar, which no instantaneous record can express.
//
// If (a) dominates the next format build is another warp kind and is cheap.  If
// (b) dominates the record must carry a value WITH A DURATION, which is a shape
// the format does not have today.  Deciding that by measurement rather than by
// guess is the whole point, and is what build 83's `warp` record was written to
// protect.
//
// AND ONE FACT FROM THE SITE SEARCH THAT CHANGES THE STAKES.  Across all 1310
// maps there is EXACTLY ONE trigger_push carrying SF_PUSH_ONCE (128), on
// mg_dreamscraper, which is neither zoned nor a surf/bhop map.  The dominant
// spawnflag is bit 1 -- 4,637 of them -- a different flag entirely.  So
// `warp ... push`, the one push shape build 83 records, CANNOT FIRE ON ANY
// TIMEABLE MAP IN THE LIBRARY.  The continuous arm is not "the common case"; it
// is effectively the only case, and the recorded arm is a null set.
//
// ---------------------------------------------------------------------------
// THREE SITES FAILED FIRST, and each failed on a DIFFERENT wrong criterion.
// Kept in full, because the fourth criterion is only defensible beside them and
// because each failure looked like a result until the control said otherwise.
//
//   bhop_hades      chosen on ENTITY COUNT.  123 entities, five boosters.  Its
//                   start is at (3068, 15136, 129) and its nearest push is
//                   ~5,400 u away at z -6000; a clean 27-second run crossed none
//                   and logged no cash-out.  Small does not mean the boosters
//                   are on the route.
//
//   surf_hourglass  chosen on DISTANCE FROM THE START.  One push in the map,
//                   140 u from the start centre -- and the geometry says why
//                   that was the wrong ask: start box x -21..353, y +-159,
//                   z 800..1200, push at (248, 0, 872), i.e. INSIDE the start
//                   volume.  Both cash-outs fired while merely ARMED and the run
//                   cancelled and re-armed between them.  "Near the start" and
//                   "crossed by a running run" are opposed, not aligned.
//
//   surf_fantasy    chosen on PAST-THE-BOX GEOMETRY: one push in 1269 entities,
//                   376 u beyond the box's -Y edge at the same x and z.  The
//                   criterion was right and the map still refused -- `viewpos`
//                   showed the walk stopping dead at y -14416 and never moving
//                   again, three probes apart.  There is a WALL inside the start
//                   box.  Geometry on paper is not a route, and only a position
//                   readout could say so: every timer report in that run said
//                   `armed`, which is the same thing it says when nothing is
//                   wrong at all.
//
// So this file carries the probe INSIDE the capture.  `viewpos` prints a setpos
// line at every step, so a fourth failure diagnoses itself in one run instead of
// costing a second one.  That is the only reason this is not a fifth attempt.
//
//   surf_ecosystem  start box x -2400..-2224, y -496..496, z 4944..5456.  Push
//                   origin (-2634, 0, 4825), speed 1700, pushdir 0 180 0 (-X).
//                   234 u past the box's -X edge and 119 u below its floor, so
//                   the walk-out leaves the box FIRST -- which is the property
//                   surf_hourglass lacked -- and then drops onto it.  The map's
//                   two other pushes are at (-6400, +-1024, 2560), thousands of
//                   units away and not reachable by this walk.
//
// GROUND TRUTH IS NOT INFERRED FROM THE RECORDING.  `run_bv_debug 1` makes
// SV_BaseVelocityFrame print every cash-out as it happens -- what was held and
// what it was worth.  That log is an INDEPENDENT witness: the recording is the
// thing under test, so a divergence must be attributable to a cash-out by
// something other than the file suspected of not mentioning it.  E3's argument.
//
// THE setpos IS BEFORE THE START.  It aims the walk down -X; b83warp.cfg set the
// precedent.  Nothing warps or noclips after the latch -- setpos taints via
// SV_TimerCheat, and (worse here) setpos is NOT one of SV_RecWarp's six call
// sites, so a post-start setpos would be an UNRECORDED position discontinuity
// and would confound the very divergence being measured.
//
// PREDICTION, registered before the run:
//
//   - `timer: running` BEFORE the first `basevel: paid` line.  This is the one
//     thing all three previous sites failed, and it is the whole experiment:
//     a cash-out outside a run reaches no recording.
//   - one cash-out holding about 1700 u/s on -X, `[AddOutput 0]`;
//   - `warp` records for teleports only, ZERO of kind `push`;
//   - `startjit 2.0000 <dx> <dy> 0.0000` and `flags 0`.
//
// FALSIFIED IF: the cash-out again precedes the start, or `viewpos` shows the
//          walk stalled, or the run comes out tainted, or no cash-out fires.
//
// `set` on every one of these: rec_enable, rec_stream and run_bv_debug are read
// with a bare cvar() and registered in worldspawn or not at all, so a bare
// assignment before the first map load is Unknown command and the default
// silently stands -- which produces a MISSING FILE or a SILENT INSTRUMENT, the
// same symptom a real failure produces.
//
// THE RECORDING IS COPIED WHILE THE RUN IS LIVE.  SV_RecClose has one call site
// and it is the finish; an abandoned stream's part file is cleaned up on quit,
// which is measured -- both the surf_hourglass attempt and the live fleet arm
// left data/parts empty afterwards.  Hence the long hold: it is the window in
// which data/parts/0.rec is copied out from another process.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name e5push
developer 0

sv_cheats 0

set rec_enable 1
set rec_stream 1
set rec_runarchive 1

set run_startjitter 2
set run_bv_debug 1

cl_yawspeed 210

waitms 6000
map surf_ecosystem
waitmap 60
waitms 4000

echo ================================ E5 -- loaded.  Expect NOT running.
viewpos
cmd timer
waitms 700

cmd zone_goto 0
waitms 1500
echo ================================ E5 -- after zone_goto
viewpos
waitms 700

// x near the box's -X edge, y centred, yaw 180 = -X.
setpos -2300 0 5000 0 180 0
waitms 1500
echo ================================ E5 -- armed and aimed
viewpos
cmd timer
waitms 700

// ---------------------------------------------------------------------------
// The run starts HERE, on leaving the box at x = -2400.  The pad is a further
// 234 u down -X and 119 u below.  Nothing below may warp or noclip.
// ---------------------------------------------------------------------------
+forward
waitms 1200
echo ================================ E5 -- walking out
viewpos
cmd timer
waitms 600

echo ================================ E5 -- approaching the pad
viewpos
cmd timer
waitms 1200

echo ================================ E5 -- on or past the pad
viewpos
cmd timer
waitms 1500

echo ================================ E5 -- after the launch 1
viewpos
cmd timer
waitms 1500

echo ================================ E5 -- after the launch 2
viewpos
cmd timer
waitms 1500

-forward
waitms 600
echo ================================ E5 -- settled
viewpos
cmd timer
waitms 800

// THE COPY WINDOW.  The run is still open here and data/parts/0.rec is still on
// disk; a poller outside this process takes it during this hold.
echo ================================ E5 -- HOLD (copy window opens)
cmd timer
waitms 9000
echo ================================ E5 -- HOLD 2
viewpos
cmd timer
waitms 9000
echo ================================ E5 -- HOLD 3
cmd timer
waitms 9000

echo ================================ E5 -- last read before quit
cmd timer
waitms 1000

echo ================================ E5 done
waitms 500
quit
