// Patch 798: hud_edit's Display Info / Input display rework. Run in a disposable
// rig made by tools/test_ui_modern.py (its ui_modern.map, never owner data):
//   <rig>\ftesurf64.exe -basedir <rig> +exec test/p798hud.cfg
// PREDICTIONS, registered before the run:
//   status: 27 ids; spectate absent; display listed; keyhint (unlisted)
//   list/ui: he_sel_display present; he_sel_spectate, he_sel_keyhint, he_upd,
//     he_round, he_fontfx and he_xhair absent; he_rstall full width
//   display pane: he_o_ chips for hud_mapinfo, hud_mapinfo_timeleft, hud_keyhint,
//     hud_chat, hud_specby, hud_crosshair, hud_font_outline, hud_update, hud_round
//   clicks: chat 1 -> 0; crosshair 1 -> 2; Input display square 1/1 -> 0/0 -> 1/1;
//     its Keys row 1 -> 0 with mouse still 1; its reset puts keys_x 0, mouse_x -1
//   resetall: hud_chat back to 1, spec_dist 240 back to 110, and (review fix)
//     hud_keyhint_x 0.5 back to 0.0333; a build without the fix leaves 0.5
//   `hud_edit spectate` names no such element; `hud_edit keyhint` has no row
// Every readback is a cvar set to a known value first, so only the click moves it.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p798hud
con_notifytime 0
con_notifylines 0
developer 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
vid_winmaximize 0
vid_width 1600
vid_height 900
vid_conautoscale 1
vid_vsync 0
r_fullbright 1
set run_resume 0
set lobby_dir ""
name p798-test
waitms 3000
map ui_modern.map
waitms 6000
menu_restart
waitms 500
ui_close
set hud_scale 2
set hud_edit_panel_x 0.01
set hud_edit_panel_y 0.01
set hud_keys 1
set hud_mouse 1
set hud_chat 1
set hud_keyhint 1
set hud_crosshair 1
set spec_dist 240
set hud_keys_x 0.5
set hud_mouse_x 0.3
set hud_keyhint_x 0.5
set ui_tooltip_delay 0.35
waitms 300
echo === p798 status ===
hud_edit status
echo === p798 list ===
hud_edit on
waitms 700
hud_edit ui hover he_done
waitms 300
hud_edit ui
screenshot p798_list
waitms 500
echo === p798 display ===
hud_edit display
waitms 500
hud_edit ui
screenshot p798_display
waitms 500
echo === p798 chat click ===
hud_edit ui hover he_o_hud_chat
hud_edit ui down mouse1
waitms 100
hud_edit ui hover he_o_hud_chat
hud_edit ui up mouse1
waitms 300
hud_chat
echo === p798 crosshair click ===
hud_edit ui hover he_o_hud_crosshair
hud_edit ui down mouse1
waitms 100
hud_edit ui hover he_o_hud_crosshair
hud_edit ui up mouse1
waitms 300
hud_crosshair
echo === p798 input pane ===
hud_edit mouse
waitms 500
hud_edit ui
screenshot p798_input
waitms 500
echo === p798 square off ===
hud_edit ui hover he_on_mouse
hud_edit ui down mouse1
waitms 100
hud_edit ui hover he_on_mouse
hud_edit ui up mouse1
waitms 300
hud_keys
hud_mouse
screenshot p798_input_off
waitms 500
echo === p798 square on ===
hud_edit ui hover he_on_mouse
hud_edit ui down mouse1
waitms 100
hud_edit ui hover he_on_mouse
hud_edit ui up mouse1
waitms 300
hud_keys
hud_mouse
echo === p798 keys row ===
hud_edit ui hover he_o_hud_keys
hud_edit ui down mouse1
waitms 100
hud_edit ui hover he_o_hud_keys
hud_edit ui up mouse1
waitms 300
hud_keys
hud_mouse
echo === p798 input reset ===
hud_edit ui hover he_rst_mouse
hud_edit ui down mouse1
waitms 100
hud_edit ui hover he_rst_mouse
hud_edit ui up mouse1
waitms 300
hud_keys_x
hud_mouse_x
echo === p798 board ===
hud_edit board
waitms 500
screenshot p798_board
waitms 500
echo === p798 spectate ===
hud_edit spectate
echo === p798 keyhint ===
hud_edit keyhint
echo === p798 resetall ===
hud_edit off
waitms 300
hud_edit resetall
waitms 500
hud_chat
spec_dist
hud_keyhint_x
hud_keyhint_y
echo === p798 done ===
quit
