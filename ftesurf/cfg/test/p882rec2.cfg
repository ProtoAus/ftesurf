// Patch 882 replay arm, phase 2: p882rec.cfg's lody-bonus attempt and two edited copies.
//   python tools/runlines_smoke.py ftesurf/cfg/test/p882rec2.cfg --mount --timeout 400 \
//     --put data/lody.rec=<p882rec's 0-fail.rec> --put data/lody_nocool.rec=<its pins' momcool=0> \
//     --put data/lody_nolim.rec=<its pins' momlimit=0> --put data/lody_land0.rec=<seed landticks=0> \n//     --put data/lody_land0_nolim.rec=<that with momlimit=0> \
//     --ssqc <qwprogs> --csqc <csprogs> --mqc <menu> --client <exe> --output-dir <task root>/artifacts
// lody        EXACT: the attempt hops on the ground inside *141 (bhop limit, cool 0.2).
// lody_nocool the same pin with no cooldown: the replay hops at once where the run waited 14 ticks,
//             so the open loop diverges -- the pin's limit values reach the mover (the header
//             pin and `pm` rows share SV_PMPinApply).
// lody_nocool, lody_nolim: 21 Oct, EXACT -- the attempt is airborne after row 0, whose jump the
//             cooldown already allowed (landticks 159), so these two measure nothing.
// lody_land0  the seed's landticks 0: the cooldown refuses row 0's jump, so the replay diverges.
// lody_land0_nolim  the same with momlimit 0: it jumps, EXACT -- the limit, not the edit, decides.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name runlines_smoke
developer 0
set rec_enable 0
set rec_stream 0
set run_resume 0
waitms 3000

map surf_affliction
waitmap 120
waitms 4000
echo ==== LODY pm_recsim ====
pm_recsim data/lody.rec
waitms 3000
echo ==== LODY_NOCOOL pm_recsim ====
pm_recsim data/lody_nocool.rec
waitms 3000
echo ==== LODY_NOLIM pm_recsim ====
pm_recsim data/lody_nolim.rec
waitms 3000
echo ==== LODY_LAND0 pm_recsim ====
pm_recsim data/lody_land0.rec
waitms 3000
echo ==== LODY_LAND0_NOLIM pm_recsim ====
pm_recsim data/lody_land0_nolim.rec
waitms 3000
echo RUNLINES COMPLETE
quit
