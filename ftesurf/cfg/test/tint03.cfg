// TINT03 -- SHOW ME THE ACTUAL SHADER.
//
// Established so far:
//   * the decals render as OPAQUE rectangles of their texture's transparent-
//     region fill colour (olive for ivy02, black for the big func_illusionary
//     panels at save007);
//   * the VMT side reports, for all 14 of them,
//         [vmt] decals/ivy02: translucent 1 blendfunc src_alpha one_minus_src_alpha
//     and the map summary says "23 translucent";
//   * hl2_translucent 0 vs 1 is PIXEL-IDENTICAL on those surfaces, so the
//     blendfunc the VMT chose is not reaching the renderer at all -- turning
//     the switch that is supposed to withhold it changes nothing, because it
//     was already being withheld somewhere downstream.
//
// That is the Patch 219 failure shape ("a shader that reads as translucent
// everywhere you look at it") and the instrument for it already exists rather
// than needing to be written:
//
//   r_showshader <name>    the generated shader body
//   r_shaderpasses <name>  the RESOLVED passes, after Shader_Finish
//   shader_here            the material under the crosshair + its body
//
// If the body carries `progblendfunc src_alpha one_minus_src_alpha` but the
// resolved pass has no blend bits, the loss is in Shader_Finish/ProgBlendFunc.
// If the body does not carry it at all, the loss is in mat_vmt and the plan's
// Stage A is what fixes it.  Those are different files, so this is worth one
// run before touching either.
//
// Also asks the vertexlit question directly: if $decal really is routing a
// LightmappedGeneric world material into vmt/vertexlit, the body will SAY
// `program "vmt/vertexlit..."` instead of `vmt/lightmapped`.

log_enable 1
log_dir "logs"
log_name "tint03"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
sv_cheats 1
developer 1

wait 200
echo ^5=== tint03: the generated shaders ===

map bhop_futile
waitmap 900
waitms 2500
con_clear
developer 0

// noclip ONCE, before any setpos -- see tint02's header.
noclip
waitms 300
setpos 540.3427 4427.8555 7510.5981 11.9092 143.9758 0
wait 150
waitms 600

echo ^5=========== BODY: decals/ivy02 (the olive rectangle) ===========
r_showshader decals/ivy02
waitms 400
echo ^5=========== BODY: decals/ivy03 ===========
r_showshader decals/ivy03
waitms 400
echo ^5=========== BODY: decals/decalstain002a ===========
r_showshader decals/decalstain002a
waitms 400
echo ^5=========== BODY: de_nuke/nuke_metalgrate_01 ($alphatest, the grate) ===========
r_showshader de_nuke/nuke_metalgrate_01
waitms 400
echo ^5=========== BODY: glass/combineglass001a ($envmap + $envmaptint) ===========
r_showshader glass/combineglass001a
waitms 400
echo ^5=========== BODY: a plain lit wall, for contrast ===========
r_showshader concrete/concretefloor024a
waitms 400

echo ^5=========== RESOLVED PASSES ===========
r_shaderpasses decals/ivy02
waitms 400
r_shaderpasses decals/ivy03
waitms 400
r_shaderpasses glass/combineglass001a
waitms 400
r_shaderpasses concrete/concretefloor024a
waitms 400

echo ^5=========== WHAT IS UNDER THE CROSSHAIR RIGHT NOW ===========
shader_here centrequad
waitms 600
screenshot tint03_aim

echo ^5=== tint03 done ===
wait 30
quit
