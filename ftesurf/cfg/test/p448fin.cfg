cfg_save_auto 0

// ===========================================================================
//  P448FIN -- the hopped-start tag dies with the run it described.
//    python tools/p448fin.py [--control]
//  Stages cfg/test/p448.zones.json.  The driver forces `+set sv_gamemode surf`.
//
//  THE DEFECT.  Patch 445 made the tag sticky and removed SV_TimerIdle's clear.  A
//  round-6 reviewer found it therefore outlived the RUN: finish a hopped run, walk back
//  into the box, run again -- practice, with no message and no record.  Worse on the 66
//  maps whose own reset teleport is the void path (tools/census/startrearm.py), because
//  there the honest population is the same population the exploit was priced on.  The
//  tag is a statement about ONE attempt's start; carrying it into the next attempt is a
//  second punishment for one mistake.
//
//  THE FIX is two lines at the END of SV_TimerFinish, and the ORDERING is the whole
//  safety argument: everything that reads the finished run's class has already run, and
//  the tag itself was consumed far earlier at SV_TimerStart (folded into run_t_flags as
//  TF_PRACTICE).  So the run that just finished KEEPS its mark and only the next attempt
//  starts clean.  Clearing anywhere above that line could launder the run being recorded.
//
//  IT DOES NOT ZERO THE VELOCITY, unlike SV_TimerForgiveHop's three callers -- players
//  coast past the finish line.  So it deliberately does NOT call that function, whose
//  contract is that every caller zeroes, and its safety rests on a different argument:
//  reaching the end zone means traversing the map, so a finisher's speed was built on the
//  course, not in the box.  The route that WOULD carry speed into a start is open with or
//  without this patch, because the rule never tags a chain taken outside the box at all.
//
//  THE FIXTURE IS A ONE-SEGMENT TRACK so a finish is reachable headlessly.  p448.zones.json
//  is p435's start box plus an END region 64 units past its +x face; teleDestYaw 0 faces
//  +x, so `+forward` leaves the start at x -224 (the run starts) and enters the end at
//  x -160 (it finishes).  The 64-unit gap is deliberate -- abutting them would let the
//  swept test fire start and end in one packet, leaving no duration to read.
//
//  ARMS, in log order:
//   C   THE PREMISES.  Fresh arm in the box: `start on leave`, `starthop 1`,
//       `rearmhop 0`, `armed`, `hopped 0`.  A `hopped 1` here and every reading below is
//       void.
//   J   THE TAG.  +jump held 1.4 s inside the box -> `hopped 1`.  Build 21's SET is
//       untouched by this patch, so BOTH builds must read 1; a control that reads 0 means
//       the chain did not happen.
//   F   THE FINISH.  Release, walk out with +forward, cross the end region.
//       `timer: finished` is the premise that a finish actually occurred -- without it
//       the section measures nothing, which is the trap this repo keeps re-finding.
//       THE SECTION PRODUCES TWO RUNS, not one: the end zone teleports the player back
//       to the start box and `+forward` is still held, so the tainted attempt finishes
//       and the next one starts from a fresh arm.  That accident is what makes this the
//       whole measurement in one place, so it grades the FINISH LINES rather than a
//       latch read afterwards: `nprac` (how many runs finished MARKED) and the derived
//       `cleanfin` (did any finish un-marked).
//       FIXED nprac 1 + cleanfin yes + `hopped 0`; CONTROL nprac 2 + cleanfin no +
//       `hopped 1`.  Tag gone, run still marked, next attempt clean -- and the one thing
//       this patch must not do is launder the run being recorded, which nprac >= 1 on
//       both sides is what proves.
//   A   THE NEXT ATTEMPT.  Walk back into the box and read it: FIXED `hopped 0` on a
//       clean fresh arm, CONTROL `hopped 1` carried in from a run that already ended.
//
//  PRE-REGISTERED PREDICTIONS
//   C   both: `start on leave`, `starthop 1`, `armed`, `startok 0`, `hopped 0`, `rearmhop 0`.
//   J   both: `hopped 1`, the `hopped start` line, `armed`.
//   F   both: `finished` (the premise that a finish happened at all).
//       FIXED nprac 1, cleanfin yes, `hopped 0`, and the `cleared by the finish it
//       marked` dprint.
//       CONTROL nprac 2, cleanfin no, `hopped 1`, and no such line.
//   A   FIXED `hopped 0`.  CONTROL `hopped 1`.
//  FALSIFIED IF C reads `start on jump` or `starthop 0` (the mode override did not take:
//   NO VERDICT), or C reads `hopped 1`, or J reads `hopped 0` on either side (no chain,
//   so nothing below measures a clear), or F never reads `finished` (no finish happened,
//   so `hopped 0` there would mean nothing), or F reads `nprac 0` on either side (no run
//   finished marked, so the taint never reached a finish and the section measured
//   nothing), or the FIXED side reads `nprac 0` with `cleanfin yes` (the tainted run was
//   laundered, which is the one thing this patch must not do).
//
//  RESULT 2026-09-27, both sides exit 0.  qwprogs 2EE7916A043FC579 fixed /
//  AB1F10EBDD196A3E control (worktree at f349d53).
//   CONTROL  nfin 2, **nprac 2** -- both runs marked, cleanfin NO, `hopped 1` at F and
//            at A, and A reads `armed`: the re-entered box armed an attempt that was
//            already tagged.  The defect in person.
//   FIXED    nfin 2, **nprac 1** -- the tainted run finishes MARKED, the next finishes
//            CLEAN, cleanfin YES, `hopped 0` at F and A, and the finish's own dprint is
//            present.  Tag gone, run still marked, next attempt clean.
//  MY FIRST PREDICTION HERE WAS WRONG AND THE ARM IS BETTER FOR IT.  I graded
//  `class practice` from `cmd timer` at F and it read `clean` -- not a laundering: the
//  END ZONE TELEPORTS THE PLAYER BACK TO THE START BOX and `+forward` was still held, so
//  the section produces TWO runs and `cmd timer` was reading the second.  The log had
//  said so all along.  F grades the FINISH LINES now, which a later latch read cannot
//  take back, and the patch's whole claim lands inside one section.
log_enable 1
log_dir logs
log_name p448fin
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
sv_port 27704
sv_cheats 0
set run_resume 0
vid_fullscreen 0
waitms 5000
map bhop_eazy
waitmap 2400
waitms 3000
menu_restart
ui_close
waitms 1200

echo ==== C the fresh arm, and the three premises ====
run_starthop
waitms 300
cmd timer
waitms 800

echo ==== J the chain: +jump HELD in the box ====
+jump
waitms 1400
cmd timer
waitms 600
-jump
waitms 500

echo ==== F walk out and cross the end region ====
+forward
waitms 2500
cmd timer
waitms 800
-forward
waitms 400

echo ==== A back into the box: is the next attempt clean ====
// WALKED, NOT WARPED, and that is load-bearing.  The first cut used `cmd zone_goto 0`,
// which reaches SV_ZoneMoveAt and therefore SV_TimerForgiveHop -- so it would have
// CLEARED the tag itself, read `hopped 0` on both builds, and measured nothing.  That is
// this repo's "an arm that passes because its condition never occurred", caught before
// the run rather than after it.  `+back` re-enters the start box on foot: the arm fires
// from the occupancy edge, which is exactly the path that must NOT forgive.
+back
waitms 1600
cmd timer
waitms 1000
-back
waitms 300

quit
