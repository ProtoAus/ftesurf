// Build 66, step R5: does a board row's `rep` actually fetch a recording?
//
// WHAT THIS CAN AND CANNOT PROVE.
//
//   PROVEN HERE.  The whole network half: that surfd's /api/board carries
//   `rep`, that board_replay turns one into a request, that the reply is
//   written to data/online/<rep>.rec through a .part and a rename, and that a
//   second ask for the same id is served from the disk without a round trip.
//   The file it leaves behind is checkable from outside the engine with
//   tools/reccheck.py, which is the only verification this tree trusts.
//
//   NOT PROVEN HERE, AND IT CANNOT BE.  The CLICK.  A row is picked with the
//   mouse through sui, and no cfg in this tree can drive a cursor -- that is
//   what cl_scores.qc's own trap note says and it has not changed.  So
//   board_replay takes the ledger id directly, which is precisely what
//   Scores_OnlineHandOff hands Online_ReplayFetch, and everything downstream
//   of that call is what runs here.  The pick itself, the hover suppression on
//   an unwatchable row and the three refusal sentences are read, not executed.
//
//   NOT PROVEN HERE, DELIBERATELY.  The public path.  lobby_dir is pointed at
//   the Pi's LAN address on purpose, because /api/replay is not on the public
//   vhost yet -- /etc/nginx needs a password this session cannot supply.  The
//   route itself was verified on the Pi's loopback, byte-for-byte against the
//   file on its disk.  What is untested is nginx's copy of that, and the
//   installer verifies it at the moment it is run.
//
// PREDICTION:
//   board_status   after the fetch: rows > 0, and row 1 carries a rep
//   replay:        "fetching" then "ready" with file "data/online/1.rec"
//   second ask     "ready" IMMEDIATELY -- the cache path, no request
//   on disk        ftesurf/data/online/1.rec, 1128886 bytes, reccheck clean
//
// FALSIFIED IF: any "QC"/"PR_ExecuteProgram"/"runaway" line appears; or the
// replay never leaves "fetching"; or a .part file is left behind; or the file
// differs from the one on the Pi.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name b66rep
log_developer 1
developer 1

cl_sendguid 1
name "^3Lex Replay"

// THE LAN ADDRESS, NOT play.proto.bar.  See the header: the public vhost has
// no /api/replay location yet, so the default would 404 and prove nothing but
// that nginx has not been reloaded.
set lobby_dir "http://192.168.1.102:8084"

waitms 4000
echo ^5==== b66rep: connecting ====
connect 192.168.1.102:27510

// The lobby serves its own csprogs and this client has not seen this build.
waitms 60000

echo ^5==== b66rep: connected ====
board_status
waitms 2000

echo ^5==== b66rep: asking for the board ====
board_fetch 0 0 ranked clean
waitms 5000
board_status
waitms 1000

// BY ROW, NOT BY ID.  This is the twin of the click: it reads ob_rep[0], the
// same array Scores_OnlineHandOff reads, so the board parse and the fetch are
// proven together rather than one assumed while the other is tested.
echo ^5==== b66rep: fetching the recording ====
board_replay row 0
waitms 12000
board_status
waitms 1000

echo ^5==== b66rep: asking again -- must be cached ====
board_replay row 0
board_status
waitms 2000

// A row nobody issued: the 404 path, and the board must still be usable after.
echo ^5==== b66rep: a replay that does not exist ====
board_replay 99999
waitms 6000
board_status
waitms 1000

echo ^5==== b66rep: done ====
quit
