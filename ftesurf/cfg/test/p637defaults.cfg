// Private overlay (tools/runlines_smoke.py).  Patch 637: the HUD editor's defaults are
// the owner's own layout of 11 Oct.  A fresh overlay has no saved config, so every
// value read at boot is the game's default.  Graded by tools/test_p637defaults.py:
// each setting as booted; the editor's rectangles before and after the owner's whole
// saved layout is set by hand (they must not move: the defaults ARE that layout);
// every moved setting put back on its old default (the rectangles must move), "reset
// all" clicked twice (it asks first), each setting and the rectangles again.
// The screenshots are for a person.  A marker comes BEFORE what it names.
// `wait 4` after a wait: waitms counts from the frame's start (Patch 630's note).
cfg_save_auto 0
log_enable 1
log_dir logs
log_name runlines_smoke
con_notifytime 0
con_notifylines 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
vid_winmaximize 0
vid_width 1600
vid_height 900
vid_conautoscale 1
sv_public 0
waitms 2000
map surf_kitsune
waitmap 60
waitms 6000
wait 4
menu_restart
ui_close
waitms 600
wait 4
