// Patch 273 -- WHAT IS THE 2079us `Snapshot build`?  One cvar answers it.
//
// p273b split the Server bucket and the answer was unambiguous at the tensor2
// spawn (developer off, clean window):
//
//                        tensor2      surf_tensor     ratio
//     QC StartFrame        16.46us        1.14us        14x
//     Entity physics       15.46us        0.84us        18x
//     Snapshot build     2079.21us       29.38us        71x   <-- all of it
//     measured total     2111.13us       31.35us
//     r_speeds `Server`  2166.14us       34.08us       (97.5% accounted)
//
// So it is SV_SendClientMessages, and the game QC and the physics tick are both
// exonerated. Inside that, the only thing that is O(map size) rather than
// O(entities) is the per-entity visibility test: sv_ents.c:4163 calls
// mod->funcs.EdictInFatPVS, and VBSP_EdictInFatPVS falls into
// VBSP_HeadnodeVisible -- a FULL recursive descent of the world node tree with
// no box test and no early-out -- for any entity whose pvscache.num_leafs is -1,
// which VBSP_FindTouchedLeafs sets when the entity's box touches >=128 leafs or
// >32 clusters, storing headnode = topnode (the ROOT for anything straddling it).
// One such entity is ~2 x 19846 node visits on tensor2 and ~0 on a small map:
// a presence/absence switch, which is the only shape that gives 71x between two
// maps whose geometry differs by 1.6x.
//
// THE TEST.  sv_nopvs 1 sets `cameras = NULL` (sv_ents.c:4450) and the entity
// loop's `if (cameras && ...)` then skips EdictInFatPVS entirely.
//
//   Snapshot build COLLAPSES  -> the cost is the visibility test. Fix it there.
//   Snapshot build UNCHANGED  -> it is delta-compression or message writing,
//                                the HeadnodeVisible story is wrong, and I go
//                                back to the source rather than patching it.
//
// sv_nopvs is NOT a shipping option -- it sends every entity to every client and
// is a cheat/bandwidth disaster. It is a diagnostic only.
//
// Arms are ALTERNATED (A B A B), not sampled once, because the Server row is a
// per-RENDER-frame average: it moves when the framerate moves even if the server
// does exactly the same work. sv_perfdump's own rows are the honest instrument;
// r_speeds' Server row is recorded alongside only to show that coupling.

vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000

cl_maxfps 0
cl_idlefps 0
cl_yieldcpu 0
sv_cheats 1

map surf_tensor2
waitmap 600
waitms 9000
r_speeds 2
noclip
waitms 1000
setpos -11776 -13632 13720 0 0 0
waitms 3000

echo ^5=== A1 sv_nopvs 0 (shipped -- expect Snapshot build ~2079us)
sv_nopvs 0
waitms 2500
sv_perfdump
waitms 3500
sv_perfdump
waitms 400
r_speeds_dump
waitms 600

echo ^5=== B1 sv_nopvs 1 (PVS test skipped entirely)
sv_nopvs 1
waitms 2500
sv_perfdump
waitms 3500
sv_perfdump
waitms 400
r_speeds_dump
waitms 600

echo ^5=== A2 sv_nopvs 0 again
sv_nopvs 0
waitms 2500
sv_perfdump
waitms 3500
sv_perfdump
waitms 400
r_speeds_dump
waitms 600

echo ^5=== B2 sv_nopvs 1 again
sv_nopvs 1
waitms 2500
sv_perfdump
waitms 3500
sv_perfdump
waitms 400
r_speeds_dump
waitms 600

sv_nopvs 0
waitms 1000

// ---- and the same pair on the control, where the claim is that there is
// ---- nothing to save because no entity overflows the leaf list ------------
echo ^5=== F CONTROL surf_tensor: both arms should be ~29us, i.e. no difference
map surf_tensor
waitmap 600
waitms 9000
r_speeds 2
noclip
waitms 2500
sv_nopvs 0
waitms 2000
sv_perfdump
waitms 3500
sv_perfdump
waitms 400
echo ^5--- control, sv_nopvs 1
sv_nopvs 1
waitms 2000
sv_perfdump
waitms 3500
sv_perfdump
waitms 400
sv_nopvs 0

echo ^5=== END OF RUN ===
waitms 500
quit
