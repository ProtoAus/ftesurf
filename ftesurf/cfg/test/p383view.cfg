// Patch 383 harness VIEWER -- traces the owner's streamed body.  PREDICTIONS
// ARE REGISTERED HERE, before any run; write the results back underneath.
//
// RUN (from C:\FTESurf; seed_csprogs.py after the build; kill leftovers first):
//   1. C:\FTEQuake\fteqwsv64.exe +set sv_port 27693 +set log_enable 1 +set log_dir logs
//        +set log_name p383sv_<arm> [arm +sets, p383sv.cfg] +exec cfg/test/p383sv.cfg
//   2. ftesurf64.exe -WindowStyle Minimized +set log_name p383view_<arm>
//        +exec cfg/test/p383view.cfg          (no log_name line here, on purpose)
//   3. 5 s later: ftesurf64.exe -WindowStyle Minimized +exec cfg/test/p383own.cfg
//   4. python tools/bodytrace.py ftesurf/logs/p383view_<arm>.log --arm <arm>
//        [--from T --to T]; arm names in p383sv.cfg.  It prints one verdict per
//        prediction below, and an ARM line: the log's tick must be 0.015.
// Viewer timeline, from the trace start T0 (the owner's circle start S is about
// T0+8.5; the two-process drift is up to a few seconds, AGENTS.md):
//   T0+35..45 cl_body_raw 1 (C1)   T0+86..114 cmd pose_watch -1 (SPEC, Hermite)
//   body_stats lines print cltime: use them for --from/--to.
// Run bodytrace twice: once on the whole log (P1 P4 P5 P6 C1 KEY; without a
// window a missing kill, rest, stall, raw segment or attack is a FAIL), once on
// the steady window S+2..S+58 for P3/P3b.  Round every snap, reseed, rest and
// raw edge it drops 1 s by itself; underruns and R jumps count against P3b.
//
// PREDICTIONS (observable in brackets; bodytrace prints a verdict line each):
//  P1  uncapped: gap mode 1, 58..67 samples/s per body over moving seconds
//      (SPEC samples excluded), mean tick gap 1.00..1.15      [bx lines]
//  P2  lobby_av_rate 15 / 22.2 / 66.67: gap mode 5 / 3 / 1, moving rate in
//      [12,13.6] / [20,22.6] / [58,67]                          [bx lines]
//  P3  steady: >= 1000 steady frames; speed CV < 2%; yaw rate 126..154 deg/s
//      (cl_yawspeed 140), CV < 3%; pitch range >= 50 deg, pitch-rate samples
//      >= half the steady frames, CV < 3% away from the reversals  [bt]
//  P3b render clock p1..p99 within 0.95..1.05, starved < 1%, 0 steady reseeds,
//      0 underrun/jump frames; hud_net `late%` < 1, `per body` green [bt, shot]
//  P4  kill: exactly 1 frame carries the teleport (snap bit), 0 frames at
//      in-between positions, the trail breaks there              [bt clusters]
//  P5  stops (the one before S and S+65..75): 1.6..2.4 still samples/s in a
//      rest >= 5 s; 0 frames moved > 0.5 u or 0.5 deg from the rest pose before
//      the resume tick - 1.  The resume tick is the first moved sample (bx mv),
//      not the RESUME flag, which a newer sample can supersede.   [bx, bt]
//      CONTROL build: `hold = FALSE;` on Body_ReadPose's marked line
//      (cl_body.qc) -- the body leaves the rest ~D early (P5 FAILs).
//  P6  owner stall (net_fakeloss 1 on the owner): exactly 1 stall reseed and 1
//      reseed in all (+1 per unhold in P12's run); drawn drift across the stall
//      <= 260 * 0.03 + 1.5 frames of travel (the sum starts one frame before
//      the newest sample); hold after it <= D + 1 frame (0.07 s); speed CV < 2%
//      in the second after                                      [bt]
//  P7  +set sv_csqcdebug 1, second viewer (+set log_name p383view2) started 40 s
//      after the first, LOOK change at S+100, SPEC segment: 0 "CSQC overread" /
//      "underread" lines in either viewer log (--arm csqc on each); 0
//      "Write*: value" lines in the server log (developer 1)    [logs]
//  P8  none.  `cmd pose_stats` (18.00 B pose-only, 33.00 B with SPEC) counts
//      the QC's own writes and cannot fail; P7 checks the layout. [diagnostic]
//  P9  +set p383_vloss 0.05 on THIS client, --arm loss --p1rate <P1's moving
//      rate>: moving rate 0.90..1.00 x P1's, starved < 3%, speed CV < 4%
//  P10 +set lobby_av_budget 500 (two players): gap mode 3, moving rate
//      [20,22.6]
//  P12 AFTER Patches 380+382 (owner spectates while moving; one extra `cmd
//      rec_spec` line in p383own.cfg): largest drawn step within 0.6 s of the
//      held edge <= 1.5 x the median moving step; 0 frames extrapolated while
//      held.  CONTROL build: `heldchg = FALSE;` on Pose_Capture's marked line
//      (sv_pose.qc) -- the body overshoots ~0.03 x speed and snaps back at the
//      first 0.5 s keepalive.                                   [bt held runs]
//  KEY SPEC segment, owner +attack S+96..98: every frame drawn from a sample
//      whose wire keys byte has bit 64 shows FSI_ATTACK (256) and not FSI_TLEFT
//      (64, the unmapped control that would light "+left"); a SPEC segment
//      without such frames FAILs                               [bt keys/kraw]
//  C1  (UX control) cl_body_raw 1 frames: >= 25% drawn still while the body
//      moves; interpolated frames < 1%                          [bt raw bit]
//
// CONTROL ARM: server +set lobby_av_stream 0 +set lobby_av_rate 15, then
//   66.67 (--arm ctl15 / ctl66).  body_trace falls back to the engine avatar
//   (getentity, engine delta counts).  Its CTL line must PASS: 12..13.6 deltas/s
//   at 15 and 25..45 (not 66) at 66.67 over moving seconds, pitch range < 0.5.
//   It must FAIL P3 (flat pitch) and P4 (the kill, < 512 u =
//   cl_lerp_maxdistance, smeared over >= 2 frames) at both rates, and P2 at
//   66.67; at 15 the stream's P2 rate and the control's coincide.
// P11 regression: p270_2c, p278b, p270_net rerun (their headers say what moved).
// Pi arm: owner + viewer against a test lobby on port 27693 (never 27698), cfgs
//   copied in and deleted after: >= 55 /s, starved < 2%, speed CV < 3%; note
//   the lobby's CPU from top.
//
// RESULT (2026-09-19, Windows, C:\FTEQuake\fteqwsv64 3ee3baf4d; viewer ~111 fps median
// on a loaded box).  A first run FAILED P3/P4/P5/C1: fteqcc parses `x = a && b` as
// `(x = a) && b`, so Body_ReadPose's `mv` and `hold` were always true and every
// sample pushed a hold copy.  Fixed (RHS parenthesised); every figure below is after.
//   base: ARM P1 (62.7 /s, gap 1.05) P3b P4 (4 snaps, 1 frame each) P5 P5k (2.00,
//     1.89 /s) P6n C1 (raw 49% still, interp 0%) KEY (283 frames, 0/0) PASS.
//     FALSIFIED: P3 speed CV < 2% (0.049 on S+2..S+58) and P6's CV-after (0.039).
//     Not the render: the owner's own sampled speed (frames drawn exactly on a
//     sample tick) has CV 0.043 (p5 249, p50 282, p95 287 u/s) -- Source ground
//     movement while turning -- and the rendered CV is 0.045.  Yaw CV 0.017 and
//     pitch CV 0.017 pass.  Big steps in the window follow viewer frame stalls or
//     7-42 tick arrival gaps (starved, then R catches up), all box load.
//   rate15 / rate22 / rate66: P2 gap 5 / 3 / 1, 13.33 / 22.06 / 66.29 /s PASS.
//   budget500: P10 gap 3, 22.06 /s PASS.
//   loss: P9 rate 58.3 = 0.93 x P1 PASS, starved 0.67% PASS; CV 0.067 FALSIFIED
//     (the gate assumed a constant-speed owner; true CV 0.048 in this run).
//   csqc: P7 0 over/underreads (both viewers), 0 Write*: value lines PASS; the second
//     viewer's SPEC window opens after the owner quits, so it saw no SPEC (harness).
//   ctl15: CTL PASS (13.13 /s, pitch flat); P3 and P4 (14-frame smears) FAIL, as
//     registered.  ctl66: 53.45 deltas/s -- FALSIFIED the "25..45, not 66" (the
//     float gate costs less than predicted); P2 and P3 FAIL as registered; P4 PASSES
//     at 53 Hz (a 512 u lerp cap is not crossed), so the control only smears at 15.
//   P11: p270_net rate15 13.0 /s gap 5, rate5, rate0 67.0 /s gap 1.00, self off 0
//     bodies.  p278b (after adding the menu_restart/ui_close every screenshot harness
//     needs): 1 body, red, crown below the crosshair; its colour-off arm needs rcon
//     (burned), so a one-client check stood in: the LOOK flip turns the body from
//     red to the skin and back live.
//   Not run: P5's control build, P12 (needs Patch 382), the Pi arm.
cfg_save_auto 0
log_enable 1
log_dir logs
cl_idlefps 0
cl_maxfps 250
vid_fullscreen 0
vid_width 1280
vid_height 720
fs_missingwarn 0
set name "P383View"
setinfo lobbycolor 0
setinfo lobbyfx 0
wait 600
connect 127.0.0.1:27693
waitms 12000
menu_restart
waitms 500
ui_close
waitms 500

// P9 passes +set p383_vloss 0.05 (a cheat cvar set before the connect may not
// stick); unset, the macro stays literal and reads as 0.  The next line proves it.
net_fakeloss $p383_vloss
echo ^5p383view: arm state (net_fakeloss 0 unless P9)
net_fakeloss
hud_net 1
echo ^5p383view: trace on (T0)
body_trace -1 40000
body_stats

waitms 30000
screenshot p383view_net
waitms 5000
echo ^5p383view: cl_body_raw 1 (C1)
body_stats
cl_body_raw 1
waitms 10000
cl_body_raw 0
echo ^5p383view: cl_body_raw 0
body_stats
waitms 17000
echo ^5p383view: end of the steady window
body_stats
waitms 10000
body_stats
waitms 8000
echo ^5p383view: during the rest
body_stats
waitms 6000
echo ^5p383view: SPEC on
cmd pose_watch -1
body_stats
waitms 9000
screenshot p383view_spec
waitms 19000
cmd pose_watch 0
echo ^5p383view: SPEC off
body_stats
waitms 1000
cmd pose_stats
body_stats
screenshot p383view_end
waitms 3000
quit
