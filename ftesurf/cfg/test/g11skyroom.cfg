// G11 -- verify 209a: the skyroom diagnostic no longer floods.
//
// Reproduce the exact conditions that killed the G3 run: developer 1 AND log_developer 1
// (Con_DPrintf writes to the log whenever log_developer is set, regardless of developer --
// console.c:1258), on surf_kitsune, whose sky_camera sits inside brushwork so the "in solid"
// test is permanently true.  Then sit there for several seconds at an uncapped framerate.
//
// Before: one line per frame, ~300/s.  G3's tail had 168 consecutive copies and the run died.
// After:  gated on a 4-unit move AND a 0.25s interval, so a static skyroom prints once.
//
// The pass condition is a COUNT, checked after the run, not a screenshot.

cfg_save_auto 0
developer 1
log_developer 1
cl_yieldcpu 0
cl_maxfps 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0
r_speeds 0

waitms 2500
map surf_kitsune
waitmap 240
waitms 5000
sv_cheats 1

echo "@@@ G11 sitting at spawn for 5s"
waitms 5000

echo "@@@ G11 into the void for 8s -- this is where G3 drowned"
setpos 0 -765 24000 0 90 0
waitms 8000

echo "@@@ G11 back inside for 4s"
setpos 0 -765 133 0 90 0
waitms 4000

echo "@@@ G11 DONE"
waitms 800
quit
