// PACEFIX -- live A/B for the per-frame camera judder.  `exec cfg/pacefix.cfg`.
//
// WHY THIS EXISTS.  The judder is a visual report and the numbers below are only
// a proxy for it, so the last step has to be your eyes.  These aliases flip
// between the measured configurations in-game, with no restart, so you can hold
// +forward on surf_4am and switch under yourself.
//
// WHAT WAS MEASURED (2026-09-06, your machine, surf_4am at save002's position,
// three interleaved rounds, windowed).  "jitter" is the stddev of
// present-to-present spacing from sys_framepacing_stats -- i.e. how unevenly
// finished frames actually reach the screen.  On a VRR panel the display FOLLOWS
// the present, so this number is close to what your eye is given:
//
//     cl_maxfps 0    + pacing 1   898 fps    87 us    7.8 %   <- what you ship
//     cl_maxfps 300  + pacing 1   300 fps   179 us    5.4 %
//     cl_maxfps 300  + pacing 4   300 fps    37 us    1.1 %   <- pace_300
//     cl_maxfps 1000 + pacing 4   unstable  466 us   23.2 %   <- the trap
//
// THE MECHANISM, IN ONE LINE.  Sys_DoubleTime() is sampled once at the top of
// the frame (sys_win.c:5000) and the swap happens a whole render later
// (gl_screen.c:344), so frame n shows time T_n but arrives at T_n + C_n.
// Present spacing is dt + (C_n - C_n-1) while the simulation advanced only dt --
// the frame-to-frame VARIANCE of render cost is delivered to your eye as
// forward/back motion error.  Modes 1-3 pace the frame START and cannot touch
// that.  Mode 4 holds the swap to a grid, which is exactly what absorbs it.
//
// WHY YOUR OWN sys_framepacing 1/2/3 TESTS READ AS RANDOM.  They were all the
// same code path.  Modes 1-3 only ever run from Host_Frame's "frame not due yet"
// branch (cl_main.c:7473), and your saved config has `seta cl_maxfps "0"`
// (ftesurf.cfg:344), which skips that block entirely.  Every measured arm at
// cl_maxfps 0 printed "no samples yet" for wait accuracy -- proof the pacer was
// never called even once.
//
// ALWAYS SET THE CAP AND THE MODE TOGETHER.  Mode 4 with a cap the map cannot
// hold is WORSE than no pacing at all (the 1000 row above: fps swinging 330/757/
// 498 and one 103 ms frame interval), because Sys_FramePacePresent rounds every
// present up to the next 1/cl_maxfps slot (sys_win.c:2198) and a missed slot
// costs a whole one.  That is why there is no bare "framepacing 4" alias here.

alias pace_off   "cl_maxfps 0;   sys_framepacing 1; echo ^3pace: OFF   ^7(shipped: uncapped, frame-start pacing, pacer inert)"
alias pace_300   "cl_maxfps 300; sys_framepacing 4; echo ^2pace: 300   ^7(present-paced -- the measured arm, 37us jitter)"
alias pace_240   "cl_maxfps 240; sys_framepacing 4; echo ^2pace: 240   ^7(present-paced, more headroom on heavy spots)"
alias pace_355   "cl_maxfps 355; sys_framepacing 4; echo ^2pace: 355   ^7(present-paced, just under your 360Hz panel)"
alias pace_480   "cl_maxfps 480; sys_framepacing 4; echo ^2pace: 480   ^7(present-paced -- CHECK it holds, or this is the trap)"

// The control that is NOT present-pacing: capped, but frame-start paced.  If
// pace_300 feels better than this, it is mode 4 doing it and not merely the cap.
alias pace_cap   "cl_maxfps 300; sys_framepacing 1; echo ^3pace: CAP   ^7(capped but frame-START paced -- the control)"

alias pace_stats "sys_framepacing_stats"

// Exclusive fullscreen.  Patch 47's note: mode 4 is fullscreen-only in practice
// because in windowed/borderless DWM owns the present and G-Sync will not
// engage.  Your vid_fullscreen is 2 (borderless), and every number above was
// taken windowed -- so mode 4 may well do BETTER for you than it measured here.
// Needs a vid_restart, hence its own alias.
// Engine patch 268 swapped 1 and 2: 1 is now borderless, 2 is exclusive.
alias pace_full  "vid_fullscreen 2; vid_restart; echo ^2pace: exclusive fullscreen (vid_restart done)"
alias pace_bord  "vid_fullscreen 1; vid_restart; echo ^3pace: borderless (vid_restart done)"

echo ^5pacefix loaded.
echo ^7  pace_off / pace_cap / pace_300 / pace_240 / pace_355 / pace_480
echo ^7  pace_full / pace_bord   (exclusive vs borderless, does a vid_restart)
echo ^7  pace_stats              (read the present-cadence block)
echo ^7
echo ^7  Suggested: load surf_4am, hold forward, and flip pace_off <-> pace_300.
echo ^7  Then pace_cap, to check it is the PRESENT pacing and not just the cap.
echo ^7  Nothing here is saved -- all of it dies with the session.
// A ';' inside an echo is a command separator, not punctuation -- this line
// used to print `Unknown command "all"`.
