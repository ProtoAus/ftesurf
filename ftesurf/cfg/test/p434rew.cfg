// cfg_save_auto 0 FIRST: this run sets archived cvars and must never write them
// into ftesurf.cfg (cl_main.c:2535).
cfg_save_auto 0

// ===========================================================================
//  P434REW -- a save whose recording cannot be restored must END the run.
//    python tools/p434rew.py       (stages the fixture, runs, parses, restores)
//    or by hand: PARK ftesurf/data/saves/bhop_eazy (a shared fixture other
//    harnesses read), copy cfg/test/p434state.txt to
//    ftesurf/data/saves/bhop_eazy/save901/state.txt, then
//    ftesurf64.exe -WindowStyle Minimized +exec cfg/test/p434rew.cfg
//    (cwd MUST be C:\FTESurf; log ftesurf/logs/p434rew.log)
//
//  THE DEFECT (BACKLOG, Patch 428 review).  SV_SaveApplyState resumes the clock
//  from `ticks`/`elapsed` and only THEN rewinds the recording, and its failed
//  branch discarded the recorder without touching the timer.  So a save whose
//  prefix is gone -- a stream copy over SV_RecSnapshot's 256 MB cap, a failed
//  copy step, a hand-deleted run.rec -- loaded into a RUNNING attempt that kept
//  counting, kept posting splits and stages, and filed a finish with no .rec
//  behind it: nothing for pm_verify to replay and no row saying why.
//
//  THE FIX.  The failed branch calls SV_TimerVoid when the restored state was
//  TS_RUNNING -- the funnel every other abort uses, so the restored time stays
//  on screen greyed instead of snapping to zero, and its SV_TimerIdle does the
//  discard (the branch must not do it twice: a second SV_RecDiscard re-runs the
//  Patch 426 hold logic against a run that has already ended).
//
//  THE SUBJECT IS A FIXTURE, AND THAT IS THE POINT.  save901 is a hand-written
//  state.txt: RUNNING, ticks 500, `reclines 500`, `recserial -1` (a serial no
//  session draws, so the rewind cannot take the warm path) and NO run.rec.  That
//  is byte-for-byte what a failed copy step leaves on disk, and it is the only
//  way to reach the cold path's failure on a listen server, where the recording
//  is buffered and the warm path always applies to the save you just took.
//
//  ARMS, in log order:
//   C1  leave the start box, save while RUNNING.  Row 2, with a real prefix.
//   C2  CONTROL, and the arm that makes S mean anything: load row 2.  The
//       rewind must SUCCEED -- `run resumed`, timer `running`, `recording 1`.
//       Without it, S reading "not running" could be a fixture the loader
//       refused for an unrelated reason (a bad key, a row mismatch, a refusal
//       before the placement) and the arm would pass by never happening.
//   S   SUBJECT: load row 1, the fixture.  The cold path finds no prefix and
//       returns FALSE.
//
//  PRE-REGISTERED PREDICTIONS
//   C2  `save 2 -- run resumed at 0:0N.NNN ... shadow run`; `cmd timer` reads
//       `running` and `recording 1`.
//   S   BEFORE the fix (control build HEAD~): `cmd timer` reads `running`, the
//       fixture's own clock `0:05.000` (500 ticks at the 0.01 rate),
//       `recording 0`, `recorder: buffer -1`, `class: segmented` -- a live clock
//       with no recorder behind it.
//   S   AFTER the fix: `run cancelled (the save's recording could not be
//       restored)` and `cmd timer` reads `idle` with `recording 0` and
//       `stopped 1 at 0:05.000` -- SV_TimerVoid's greyed time, which is the
//       honest number: that is how far the save got.
//  FALSIFIED IF C2 does not resume (the harness cannot load a running save at
//   all, so S proves nothing), or S reads `running` on the fixed build, or S
//   reads `idle` on the control build.
//
//  RESULT (2026-09-23, both arms run, driver exit 0 each way)
//   C2 resumed at 0:01.720/0:02.290, `timer: running`, shadow 1, recording 1,
//     buffer 17 -- identical on both builds, so the harness can load a running
//     save and S is not measuring a loader that refuses everything.
//   S CONTROL (HEAD's sv_saveloc.qc, the pre-fix build): no cancel line,
//     `timer: running`, recording 0, buffer -1, stopped 0, and the clock read
//     0:06.200 -- PAST the 0:05.000 it was restored to, i.e. it kept counting
//     with no recorder behind it.  That drift is the defect in one number.
//   S FIXED: `run cancelled (the save's recording could not be restored)`,
//     `timer: idle`, the clock held at 0:05.000, stopped 1 at 0:05.000,
//     recording 0, buffer -1, `shadow 0  from save 901`.
//   Every prediction held.  One note the predictions got wrong: the fixture's
//   `elapsed 5.000000` is what the clock reads, not the 7.5 this file first
//   claimed -- pm_ticrate is 100 here, so ticks 500 is 5.0 s and the counted
//   clock ignores `elapsed`.
//   Also seen, and honest rather than a fault: the void prints
//   `timer: receipt refused -- no run id or no nonce`, because the fixture
//   carries no `recrid` -- there is no recording for a receipt to commit to.
//  NOT COVERED: the streamed (lobby) cold path -- SV_RecSnapshot's buffer is
//   what fails there, and this harness runs a listen server where the recording
//   is buffered.  Same FALSE, same branch, different reason string.
log_enable 1
log_dir logs
log_name p434rew
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
sv_port 27661
sv_cheats 0
set run_resume 0
vid_fullscreen 0
waitms 5000
map bhop_eazy
waitmap 2400
waitms 3000
menu_restart
ui_close
waitms 1200

echo ==== C0 the list: row 1 is the fixture, and nothing else is here ====
cmd sl_list
waitms 800

echo ==== C1 leave the start box and save WHILE RUNNING ====
+forward
waitms 1500
-forward
waitms 700
echo ---- must read running / recording 1, or C2 and S both prove nothing ----
cmd timer
waitms 600
cmd sl_save
waitms 900
cmd sl_list
waitms 800

echo ==== C2 CONTROL: load row 2, the rewind must succeed ====
cmd sl_goto 2
waitms 400
cmd sl_load
waitms 1200
cmd timer
waitms 800

echo ==== S SUBJECT: load row 1, whose recording prefix is gone ====
cmd sl_goto 1
waitms 400
cmd sl_load
waitms 1200
echo ---- BEFORE: running 0:05.000 recording 0.  AFTER: cancelled, idle ----
cmd timer
waitms 800
cmd sl_list
waitms 800

quit
