// BUILD 47 / ENGINE PATCH 269 -- jit04 redone with an instrument that does not
// destroy the condition.
//
// WHY jit04 IS VOID, and it looked exactly like a pass.  Its cl_predtrace wrote
// four Con_Printf lines per rendered frame from inside the measured window.
// The result: 200 rendered frames against command frames 831..1030 -- 199
// command frames, in 4 wall-clock seconds.  That is ~50fps and ONE RENDERED
// FRAME PER COMMAND, which is the one regime in which this defect provably
// cannot appear, because the defect is many rendered frames sharing a command.
// Every frame in that log says `extrap none` for the same reason.  1 nonzero
// frame in 200 was not a clean result, it was a capture of the wrong thing.
//
// This is the same trap as jit01 (which ran at 200fps because an unfocused
// window is capped by cl_idlefps) and it is worth naming twice: a capture that
// does not reach the framerate the report is about proves nothing about it.
//
// cl_predtrace now RECORDS to memory and dumps after the window closes, so the
// measured frames carry no console traffic at all.
//
// THE SELF-CHECK THIS RUN CARRIES: the dump prints the command sequence per
// rendered frame.  Divide traced frames by the span of `seq` across the dump.
//   ~1 frame per seq  -> the capture failed again, throw it out.
//   >5 frames per seq -> a real high-framerate capture, and the numbers count.
//
// WHAT jit04 DID ESTABLISH, on the one frame where the regime was momentarily
// right, and it is a genuine lead:
//
//     pt seq 831: replays 1 extrap none f 0.150
//        fromvel 5.1250 0 0    tovel 0.0000 0 0
//        fromorg -32727.932    toorg -32727.932    simvel 4.3543
//
// fromorg and toorg are IDENTICAL -- the player provably did not move during
// that command -- and yet the blend reports (1-0.150)*5.125 = 4.354.  The
// velocity being blended FROM produced no displacement whatsoever: friction had
// already zeroed it inside the tick, before the move.  So the blend is
// reporting a speed that was dead on arrival, and f is a per-rendered-frame
// quantity, which is exactly the flicker's shape.
//
// This run asks whether that is the whole story at high framerate, or whether
// the extrapolation adds a second contribution on top of it.

log_developer 1

waitms 2000

map surf_colin_blaster_69000
waitmap 240
wait 60

cl_idlefps 0
cl_maxfps 0
hud_debug 1
hud_speed 1
waitms 500

echo ^5=== A: NEVER TOUCHED.  Control -- does this need a tap at all?
cl_predtrace 400
waitms 3000

echo ^5=== B: tap forward, release, wait a full second, THEN trace
+forward
waitms 250
-forward
waitms 1000
cl_predtrace 400
waitms 3000

echo ^5=== C: trace while the key is HELD -- what a REAL input looks like here,
echo ^5     so a nonzero reading in A/B has something to be compared against
+forward
waitms 250
cl_predtrace 400
waitms 3000
-forward
waitms 500

echo ^5=== END OF RUN ===
wait 20
quit
