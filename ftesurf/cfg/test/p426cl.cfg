//   V1 HELD: ...225127 `HOLD no finish: the zones never end this run`.
//   V2 HELD: ...225135 `HOLD a cancel zone is crossed at row 177`, trailer
//      `end 184 328 154 0 178 ...` -- the last of 178 input rows.
//  AFTER (Patch 426 progs, this file):
//   R1 HELD: ...230435 and ...230444 each log `timer: receipt ...rcpt` for the
//      kept file's runid and upload their .view (5111 and 24614 bytes).
//   R2 HELD: rcptcheck on both: signature VALID, joined the evidence .rec,
