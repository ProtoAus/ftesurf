// P426CL -- an abandoned run's receipt, client half (server: p426sv.cfg, zones
// cfg/test/p426.zones.json, stub `b65stub.py cert 8131`).
//
// FIXTURE (surf_666 start room, floor z 15360, walked +y at ~260 u/s from the
// START centre, x -11520): the p360sf zones plus a CANCEL region across the
// LEFT half of the route, x -11800..-11520, y -13400..-13350.
//   START y -14288..-14150   S2 -13950..-13800 (leg 1 posts on its exit)
//   CANCEL y -13400..-13350, left half (between S3 and S4)
//
// Two abandons, each after leg 1 has posted, so the lobby keeps the run as
// evidence (SV_RecKeepEvidence), and a finish:
//   A  straight on, then back into START with zone_goto (the re-arm abandon)
//   C  forward and LEFT, into the cancel region
//   F  right inside START, then straight past it to the END (the control)
//
// PRE-REGISTERED PREDICTIONS
//  BEFORE Patch 426 (the server drops the run's id and nonce in the frame it
//  stops recording, and the client signs a round trip later):
//   B1 each abandon logs `kept data/evidence/surf_666/<runid>.rec (N posted
//      stage(s))` and then `timer: receipt refused -- no run id or no nonce`.
//   B2 no .rcpt appears beside either evidence file.
//  AFTER Patch 426:
//   R1 each abandon logs `timer: receipt data/evidence/surf_666/<runid>.rcpt`
//      for the kept file's runid.  (Since Patch 426 round 4 no sidecar: an
//      abandon's upload would hold the engine's one upload slot.)
//   R2 rcptcheck: signature VALID, the nonce agrees with the .rec header, the
//      ticks agree (0 -- the RUNTICKS SV_RecDiscard publishes).
//   R3 F: its receipt and upload land exactly as before (the live path).
//  pm_verify on the two abandon files (the sweeper's verifier):
//   V1 A: HOLD "no finish: the zones never end this run" -- reproduced.
//   V2 C: HOLD "a cancel zone is crossed at row N", N the last input row (the
//      `end` trailer's 5th field less one).
// FALSIFIED IF a receipt lands before the patch, none after it, a receipt is
//   filed under a runid that is not its run's, or F loses its receipt.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p426cl
developer 1
cl_idlefps 0
cl_maxfps 100
rate  2000000
drate 5000000
vid_fullscreen 0
set rec_enable 1
set rec_hid 1
set rec_upload 1
name "^3P426"
waitms 6000
connect 127.0.0.1:27632
waitms 12000
set rec_terms 1

echo ^5==== A: post leg 1, then back into START ====
cmd zone_goto 0 90 0
waitms 2000
cmd timer
+forward
waitms 2000
-forward
echo ^5--- A: past S2 ---
cmd timer
waitms 500
cmd zone_goto 0 90 0
waitms 4000
echo ^5--- A: abandoned ---
cmd timer

echo ^5==== C: post leg 1, then forward-left into the cancel region ====
cmd zone_goto 0 90 0
waitms 2000
+forward
+moveleft
waitms 2600
echo ^5--- C: past S2 ---
cmd timer
waitms 2600
-moveleft
-forward
echo ^5--- C: past the cancel region ---
cmd timer
waitms 4000

echo ^5==== F: right inside START, then straight past the cancel region to the END ====
cmd zone_goto 0 90 0
waitms 2000
+moveright
waitms 600
-moveright
waitms 500
+forward
waitms 7000
-forward
echo ^5--- F: finished ---
cmd timer
waitms 5000
echo ^5==== P426 CL done ====
quit

