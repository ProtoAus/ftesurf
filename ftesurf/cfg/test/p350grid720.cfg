// P350GRID720 -- the create screen's public lobbies as a 4 x 3 grid, narrower panel.
//
// PREDICTIONS (pre-registered; arm set by the three p350grid*.cfg files):
//   720  (this file, 1280x720 virtual): panel 1100x688  lcols 4  lshow 12  rows 5
//   1080 (p350grid1080.cfg):            panel 1100x808  lcols 4  lshow 12  rows 8
//   CONTROL 860 (p350grid860.cfg, 860x720): inner 796 < 4*200+24, so the
//        LOB_MIN_COL fallback must drop to 3 columns: lcols 3  lshow 9  rows 4
//        (4, not 5: the ~925 px chip row wraps at inner 796 and costs 46 px)
// FALSIFIER: any arm's bootcheck "layout" line differing from the above, or a
// "lobbies ready 1 count" other than 12 (the fleet) with lshow != count.
// Needs the WAN directory (play.proto.bar) -- the lobby list is fetched.
//
// RESULT (written back after the run): see the bottom of this file.
cfg_save_auto 0
log_enable 1
log_dir "logs"
log_name "p350grid720"
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
sv_port 27600

set ui_bootcheck 0
set ui_bootterms 1

vid_conautoscale 0
vid_conwidth 1280
vid_conheight 720
waitms 1500
menu_restart
waitms 500
togglemenu 1
waitms 6000
echo ^5=== p350grid720: expect panel 1100x688 lcols 4 lshow 12 rows 5 ===
set ui_bootcheck 2
waitms 3000

// RESULT (2026-09-18, three runs):
//   720:  layout panel 1100x688  lcols 4  lshow 12  rows 5   -- as predicted
//   1080: layout panel 1100x808  lcols 4  lshow 12  rows 8   -- as predicted
//   860:  layout panel 828x688   lcols 3  lshow 9   rows 5   -- columns as
//         predicted; rows FALSIFIED (predicted 4).  The chip row did not wrap:
//         it fits at inner 796, so the ~925 px estimate it was based on was
//         wrong.  All three: lobbies ready 1 count 12.
