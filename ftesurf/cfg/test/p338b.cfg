// Patch 338 -- IO mirror, dynamic half.
// 1) trig_tp 1: into TELEPORT_SEND_PLAYER (slot #1, SD, mapspawn-enabled at
//    +0.5 s).  In walk mode it must teleport the client LOCALLY -- before
//    patch 338 this was the 6956u server-only snapback.
// 2) walk east through the *218 trigger_multiple at (-8128, 11328): its
//    OnStartTouch Enables push_prevent_backtrack_t1 (*217 at -7648).  The
//    client must print the Enable event, then fire the setspeed locally, and
//    OnEndTouch must Disable it again on the way out (0.05 s grace).
// noclip parity: `cmd noclip` twice (engine + QC handler), z-drop proves walk.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p338b
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0
wait 600
connect 127.0.0.1:27666
waitms 15000
cl_prederror 2
cl_trigdebug 1
echo === part 1: TELEPORT_SEND_PLAYER
trig_tp 1
waitms 600
cmd noclip
waitms 500
cmd noclip
waitms 1200
echo === pos after teleport (expect TELE_LEVEL_1, not the *51 volume):
cmd viewpos
waitms 800
echo === part 2: backtrack enabler, walk east through *218 into *217
cmd setpos -8260 11328 40 0 0 0
waitms 600
cmd noclip
waitms 500
cmd noclip
waitms 1500
echo === walk start:
cmd viewpos
+forward
waitms 3500
echo === walk end:
cmd viewpos
-forward
waitms 1200
echo === p338b done
waitms 300
quit
