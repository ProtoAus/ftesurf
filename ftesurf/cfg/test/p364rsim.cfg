// P364RSIM -- the engine's replay commands on FTESURF-REC 10 (Patch 364).
// Files: p364rewind's four arms, copied to data/p364t/ by the driver (DELETE AFTER).
// PREDICTIONS: every v10 file -> pm_recsim "is FTESURF-REC 10; its sessions ...
// are not replayed yet" and pm_verify "VERIFY <f> REFUSE a newer format ...".
// CONTROL, v9 (arm L, a warm save-load): pm_recsim replays (a `v9 state` line),
// pm_verify refuses for its own reason, "a save-state resume or retry".
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p364rsim
developer 0
cl_idlefps 0
fs_missingwarn 0
sv_port 27631
waitms 5000
map surf_666
waitmap 1800
waitms 2000
echo ^5==== v10 retry ====
pm_recsim data/p364t/r.rec
pm_verify data/p364t/r.rec
echo ^5==== v10 load ====
pm_recsim data/p364t/c.rec
pm_verify data/p364t/c.rec
echo ^5==== v10 retry+load ====
pm_recsim data/p364t/d.rec
pm_verify data/p364t/d.rec
echo ^5==== v9 control ====
pm_recsim data/p364t/l.rec
pm_verify data/p364t/l.rec
echo ^5==== done ====
waitms 500
quit

