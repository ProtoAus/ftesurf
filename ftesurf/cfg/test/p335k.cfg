// Patch 337, push E2E -- bhop_mom_training_beta slot #17: an 8-unit push pad
// at box 7999..8193 x -10753..-10623 x -2433..-2425 (from trig_models).  The
// map has NO zone data, so the warp is setpos + `cmd noclip` to unlatch the
// movetype setpos forces server-side.  The warp itself desyncs (prederr lines
// around it are expected); what is measured is the walk: enter the pad, ride,
// exit, and the cash-out tick after exit.  Before Patch 337 the ride printed
// cascades of exactly 4.00 and the exit a growing 4-per-command error.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p335k
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0
set cl_prederror 2
set cl_trigdebug 1
wait 600
connect 127.0.0.1:27666
waitms 15000
echo === p335k: warp west of pad 17, facing +x
cmd setpos 7900 -10688 -2400 0 0 0
waitms 400
cmd noclip
waitms 2500
echo === p335k: walk east across the pad (3 s)
+forward
waitms 3000
echo === p335k: stop, observe exit + cash-out (3 s)
-forward
waitms 3000
echo === p335k done
waitms 500
quit
