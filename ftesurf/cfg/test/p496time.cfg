// Patch 496 -- run times are exact milliseconds, not a float32 product.
//
// THE DEFECT (BACKLOG "Cosmetic / low", measured here rather than assumed):
// Time_TickString did `ms = floor(ticks * tickrate * 1000 + 0.5)` in ONE float32
// chain.  A float32 carries ~7 significant digits and that chain rounds twice
// (ticks*rate, then *1000), so the result is 1-3 ms off on most values past
// 4,096,003 ms -- 68 minutes -- and 9,149,677 of the 16,777,216 ms values below
// 2^24 print a wrong digit.  Three board paths entered milliseconds and asked
// for a 0.001 s tick rate to get them back out, which is the same chain with its
// worst possible rate: 0.001 is not representable in float32, so the product
// drifts even below the 2^24 boundary.  The fix is an exact compensated product
// (Time_TickMs) plus an integer formatter (Time_MsString); the three ms call
// sites now call that instead.
//
// Run headless from C:\FTESurf (the basedir is the cwd, and a shell left in
// ftesurf/ produces NO log at all):
//   Remove-Item ftesurf\logs\p496time.log -ErrorAction SilentlyContinue
//   Start-Process -FilePath .\ftesurf64.exe -WorkingDirectory "C:\FTESurf" `
//     -ArgumentList '-WindowStyle','Minimized','+exec','test/p496time.cfg'
// then:  python tools\p496time.py            (subject: must PASS)
//        python tools\p496time.py --control  (control: must FAIL)
// tools\p496time.py drives the run itself, including the control build; see its
// docstring for the control recipe.
//
// WHY A `timefmt` COMMAND AND NOT A SCREENSHOT: the observable is a digit in a
// string, and the two VMs must agree on it -- the server says your time in chat
// and in the save list, the client draws it.  sh_time.qc is compiled into both,
// so the client registers `timefmt` (cl_main.qc's CSQC_Init) and the server
// answers `cmd timefmt` (sv_player.qc's ClientCommand chain).  One listen-server
// run therefore grades BOTH copies of the file, and every line is tagged.
//
// PRE-REGISTERED PREDICTIONS
//  P1  BOTH VMs ANSWER, AND AGREE.  At least 2000 lines tagged `cl` and 2000
//      tagged `sv`, and every (ticks, rate) case both printed carries the same
//      integer ms and the same string.  This is the invariant sh_time.qc exists
//      for, so a disagreement is a FAIL even where both strings look plausible.
//  P2  EVERY ms IS THE EXACT ONE: floor(ticks * rate * 1000 + 0.5) evaluated in
//      float64 FROM THE float32 INPUTS the QC saw (the rate as the file spells
//      it, the ticks as printed), and every string is that ms split as
//      m:ss.mmm / h:mm:ss.mmm.  0 disagreements required.
//  P3  THE ARM CAN TELL A FIX FROM NO FIX: at least 1000 of the graded cases are
//      ones the pre-496 float32 chain prints differently (the grader computes
//      that chain too and reports the count).  A count of 0 means the sweep
//      never left the range where float32 is exact, i.e. the arm measured
//      nothing -- which is what its first cut would have done with a small n.
//  P4  THE CONTROL FAILS.  With Time_TickMs's body replaced by the naive chain
//      (one function, everything else identical), P2 must fail on at least 1000
//      cases and P3's count must read 0.  `--control` inverts the verdict.
//  P5  THE EDGES ARE PINNED, each by an explicit case rather than by something
//      the sweep happens to hit, and every number below was derived from the
//      exact product BEFORE the first run (tools/p496time.py's EDGES agrees):
//        100 @ 0, 100 @ -1  -> 1500 ms      "0:01.500"    PM_TICK fallback
//        240000 @ 0.015     -> 3600000      "1:00:00.000"
//        273085 @ 0.015     -> 4096275      "1:08:16.275" BACKLOG's example
//        -273085 @ 0.015    -> -4096275     "-1:08:16.275"
//        143000000 @ 0.015  -> 2144999952   "595:49:59.952", where the old
//                            chain reads 2144999936 -- 16 ms off, not 1
//        200000000 @ 0.015  -> the clamp, 2147483000  "596:31:23.000"
//        1118481 @ 0.015    -> 16777215     "4:39:37.215", where the old chain
//                            reads 16777216: 2^24, which a float32 ms is not
//        4096003 @ 0.001    -> 4096003      "1:08:16.003", old reads ...004
//        64219 @ 0.0149999925 -> 963285     "0:16:03.285", and the old chain
//                            agrees there; 64220 -> 963299 where the old chain
//                            reads 963300, and 64221 -> 963314 against 963315.
//                            That is the online board's own rate going wrong at
//                            16 minutes of run, not at 68.
//        16777217 @ 0.001   -> 16777217     "4:39:37.217"
//        0.5 @ 0.015, -0.5  -> A HALF-MILLISECOND TIE.  The exact product of
//                            the two float32 inputs is 7.4999998 ms, which
//                            rounds to 7, but the last scaling step is itself
//                            float32 (6e-5 resolution at 1000) and resolves it
//                            to 8.  Both are accepted and the grader prints a
//                            note; no integer tick count at a shipped rate is
//                            inside that window.
//        -0.01 @ 0.015      -> 0, printed "0:00.000" with no sign: an int has
//                            no negative zero, the one intended change here.
// FALSIFIED IF P1's tags are missing (a VM never answered, so the other VM's
//   lines prove nothing about it), or P2 has a single disagreement, or P3's
//   discrimination count is 0, or P4's control PASSES (then the grader is not
//   reading the arithmetic it thinks it is).
//
// KNOWN, INTENDED DIFFERENCE FROM THE OLD CODE: a negative time that rounds to
// zero now prints "0:00.000" rather than "-0:00.000", because an int has no
// negative zero.  No caller passes fractional ticks (every one rounds first),
// and the case is in the sweep's explicit list so the behaviour is pinned
// rather than discovered later.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p496time
cl_idlefps 0
cl_maxfps 100

// Nothing here moves, so nothing should be written -- but a listen server on a
// zoned map can arm a clock from the spawn, and data/runs is a shared fixture.
set rec_enable 0
set run_resume 0

// A PORT OF ITS OWN: other sessions run arms on this box, and a listen server
// that cannot bind is an arm that measures nothing while looking like a hang.
set sv_port 27897
name "^3P496"

// waitms BEFORE the map and waitmap AFTER it: without them every later command
// runs while the engine is still initialising and the arm reads `Can't "cmd",
// not connected` (p493move.cfg's first run, b89zdl.cfg's recipe).
waitms 3000
map surf_rookie
waitmap 60
waitms 2000

echo ================================ P496 A -- explicit cases, client
timefmt 0 0.015
timefmt 1 0.015
timefmt 66 0.015
timefmt 67 0.015
timefmt 240000 0.015
timefmt 273085 0.015
timefmt -273085 0.015
timefmt 411000 0.015
timefmt 1118481 0.015
timefmt 66666 0.015
timefmt 66667 0.015000001
timefmt 100000 0.01
timefmt 12500 0.008
timefmt 125000 0.008
timefmt 0.5 0.015
timefmt -0.5 0.015
timefmt -0.01 0.015
timefmt 100 0
timefmt 100 -1
timefmt 143000000 0.015
timefmt 200000000 0.015
timefmt -200000000 0.015
timefmt 4096003 0.001
timefmt 4096002 0.001
timefmt 16777216 0.001
timefmt 16777217 0.001
timefmt 1000000 0.001
// THE ONLINE BOARD'S OWN RATE.  cl_online.qc:1683 and cl_scores.qc:1818 pass
// `1 / ob_rate[i]`, and ob_rate is ticks per SECOND (66.6667), so the rate that
// reaches this function is f32(1/f32(66.6667)) = 0.014999992214143276 -- not the
// 0.015 a listen server publishes.  Spelled here as 0.0149999925, which is the
// same float32.  It is the WORST realistic rate: its first wrong tick is 64220,
// i.e. 16 minutes of run, and 446140 of the first 1.2M ticks differ.
timefmt 64219 0.0149999925
timefmt 64220 0.0149999925
timefmt 64221 0.0149999925
timefmt 400000 0.0149999925
waitms 1500

echo ================================ P496 B -- explicit cases, server
cmd timefmt 0 0.015
cmd timefmt 240000 0.015
cmd timefmt 273085 0.015
cmd timefmt -273085 0.015
cmd timefmt 411000 0.015
cmd timefmt 1118481 0.015
cmd timefmt 100 0
cmd timefmt 100 -1
cmd timefmt 200000000 0.015
cmd timefmt 4096003 0.001
cmd timefmt 64220 0.0149999925
waitms 1500

echo ================================ P496 C -- sweeps, both VMs, same cases
// step 1499 so the ticks are not a power of two, and n far enough that the
// sweep crosses 2^24 ms (16,777,216) -- below it a float32 is exact and P3's
// discrimination count would read 0.
timefmt sweep 0.015 2200 1499
waitms 2500
cmd timefmt sweep 0.015 2200 1499
waitms 2500
// The rate the three board paths used to enter milliseconds at.
timefmt sweep 0.001 2600 2003
waitms 2500
cmd timefmt sweep 0.001 2600 2003
waitms 2500
// The online board's rate, `1 / ob_rate` where ob_rate is 66.6667 ticks/s.
timefmt sweep 0.0149999925 1500 1499
waitms 2000
cmd timefmt sweep 0.0149999925 1500 1499
waitms 2000

echo ================================ P496 done
quit

// RESULT (2026-10-05, subject build; `python tools/p496time.py` = 24 checks,
// 0 failed; `--control` = 25 checks, 0 failed)
//   SUBJECT: 12642 graded lines, 6331 client and 6311 server.  6310 cases were
//   printed by BOTH VMs and all of them agree (P1) -- which is the invariant
//   sh_time.qc exists for, and it is now measured rather than asserted.  Every
//   ms is the exact product of the two float32 inputs and every string is that
//   ms split correctly (P2, 0 disagreements).  4214 of the graded cases are ones
//   the pre-496 chain prints differently, against a prediction of >=1000 (P3).
//   All 17 P5 edges as predicted, including 64220 @ f32(1/66.6667) -> 963299
//   where the old chain reads 963300, and 4096003 @ 0.001 -> "1:08:16.003"
//   where it reads ...004.
//   CONTROL (`--control`, which rewrites Time_TickMs's body and only that, back
//   into the naive float32 chain, rebuilds, runs the same cfg, then restores by
//   hash and rebuilds): reproduced the modelled pre-496 chain on EVERY one of
//   the 12642 cases and disagreed with the exact answer on the same 4214.  So
//   the arm measures the arithmetic, and this script's Python model of the old
//   chain is faithful to the old QC -- the second thing a control has to prove.
//   The control cannot show the negative-zero change, because it keeps the new
//   integer formatter and only replaces the product.
//   TWO PREDICTIONS IN THIS HEADER WERE WRONG AND ARE CORRECTED ABOVE:
//     - 143000000 @ 0.015 was pre-registered as 2145000000; the exact answer is
//       2144999952.  The number came from a reference that rounded the product
//       to float32 before scaling, i.e. the reference carried the very defect
//       under test, and the first run read "2210 cases differ" against a build
//       that was correct.  exact_ms() now takes the product in float64, which
//       holds two float32s exactly.
//     - 64219 @ f32(1/66.6667) was pre-registered as 963284; it is 963285.
//       Same cause, caught before the run by re-deriving rather than after.
//   ONE DEFECT THE FIRST RUN FOUND IN THE SUBJECT, not in the harness: the
//   integer literals had no `i` suffix, so `sec * 1000` promoted the product to
//   float32 and the int local absorbed a quantised value -- 2144999936 instead
//   of 2144999952, silently, with NO warning from fteqcc.  A throwaway probe
//   verb printed both spellings side by side in both VMs (`imath i-suffix
//   2144999952 bare-literal 2144999936`) and the suffixes went in; the probe is
//   deleted and the rule is in AGENTS.md's pitfalls.  What gave it away was
//   fteqcc's F324, `%i requires int at arg N (got float)`, on a diagnostic
//   print -- the compiler type-checks sprintf's arguments and had been trying
//   to say this all along.
//   BACKLOG's modelled tick-path figures did NOT reproduce and are not repeated
//   here: it named tick 273,085 at rate 1/66.6667 as the first wrong one and
//   619k of the first 1.2M ticks.  Measured by `tools/p496time.py --stats`, the
//   first wrong tick is 64,220 at f32(1/66.6667) and 546,152 at 0.015, with
//   446,140 and 329,580 of the first 1.2M differing.  Its ms-idiom figures
//   reproduced exactly (first wrong 4,096,003 ms; 9,149,677 of 16,777,216).
