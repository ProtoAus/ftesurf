// Patch 745: a replay's line follows hud_edit's own two settings for it.
// Private overlay; --recording supplies a surf_kitsune .rec.  Graded by
// tools/test_runlines_demowin.py <rig>/ftesurf/logs/runlines_smoke.log.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name runlines_smoke
con_notifytime 0
cl_idlefps 0
cl_maxfps 100
set hud_watch_skipidle 0
waitms 2000
map surf_kitsune
waitmap 60
waitms 4000
menu_restart
ui_close
set hud_watch_path 1
set hud_watch_path_mode 2
set hud_watch_path_ahead 1
set hud_watch_path_far 12000
set hud_lines_win 0
set hud_lines_winf 0
set hud_lines_order 8
set hud_lines_nums 0
replay cfg/test/runlines_sample.rec
waitms 1500
replay pause
replay seek 40
waitms 1000
hud_lines_demo 0
hud_lines_demo_far -1
waitms 300
echo ==== WHOLE ====
replay marktrace 2
waitms 600
screenshot runlines_demowin_whole.png
waitms 600
hud_lines_demo 4
waitms 300
echo ==== AHEAD4 ====
replay marktrace 2
waitms 600
screenshot runlines_demowin_ahead4.png
waitms 600
hud_lines_demo -1
waitms 300
echo ==== ASBOARD ====
replay marktrace 2
waitms 600
hud_lines_win 6
hud_lines_winf 2
waitms 300
echo ==== OVERRIDE ====
replay marktrace 2
waitms 600
hud_lines_win 0
hud_lines_winf 0
hud_lines_demo 0
hud_lines_demo_far 1500
waitms 300
echo ==== NEAR ====
replay marktrace 2
waitms 600
screenshot runlines_demowin_near.png
waitms 600
hud_lines_demo_far -1
hud_watch_path_far 1500
waitms 300
echo ==== PATHFAR ====
replay marktrace 2
waitms 600
// The review's three (Patch 745): the window when nothing ahead is drawn, the name
// inside the window, and the name at the demo's distance with a board line drawn too.
hud_watch_path_far 12000
hud_lines_demo_far -1
hud_linegraph_labels 1
hud_watch_path_ahead 0
hud_lines_demo 4
waitms 400
echo ==== AHEAD0 ====
replay marktrace 2
waitms 600
linegraph status
waitms 300
screenshot runlines_demowin_ahead0.png
waitms 600
hud_watch_path_ahead 1
hud_lines_demo 0
hud_lines_demo_far 1500
hud_lines_board 1
scores lineat 1 cfg/test/runlines_sample.rec
waitms 5000
echo ==== NAMEFAR ====
replay marktrace 2
waitms 600
linegraph status
waitms 300
// The name above sits 61 u from the eye: 40 u of the demo's line leaves it out,
// whatever the board line beside it is drawn to.
hud_lines_demo_far 40
waitms 400
echo ==== NAMENEAR ====
linegraph status
waitms 300
echo RUNLINES COMPLETE
waitms 100
quit
