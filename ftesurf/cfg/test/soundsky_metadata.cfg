cfg_save_auto 0
log_enable 1
log_dir logs
log_name runlines_smoke
log_developer 1
developer 1
con_notifytime 0
con_notifylines 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
vid_winmaximize 0
vid_width 1280
vid_height 720
vid_conautoscale 1
sv_public 0
set run_resume 0
volume 0
musicvolume 0
set snd_vis_source 0
set milk_quality 4
set milk_trails 1
set milk_react 1
set milk_grade 0
set milk_streaks 0
waitms 2000
map surf_rookie
waitmap 60
waitms 6000
wait 4
menu_restart
ui_close
set milk_sky 1
r_skybox milk
set milk_sky_parallax 1
set milk_sky_palette 1
zone_draw 0
cmd zone_goto 0 0 -20
waitms 1500
wait 4
echo META-MISSING
milk_skyinfo
screenshot meta_missing
waitms 7000
echo META-RECOVERED
milk_skyinfo
screenshot meta_recovered
echo META-REPLACE
waitms 500
milk_skyinfo refresh
wait 1
echo META-BUDGET
milk_skyinfo
waitms 1800
echo META-REPLACED
milk_skyinfo
screenshot meta_replaced
echo META-CLEAR
waitms 500
milk_skyinfo refresh
waitms 1000
echo META-CLEARED
milk_skyinfo
screenshot meta_cleared
echo META-INVALID
waitms 500
milk_skyinfo refresh
waitms 1000
echo META-INVALID-DONE
milk_skyinfo
echo META-RESTART
vid_restart
waitms 7000
ui_close
wait 4
echo META-RESTART-DONE
milk_skyinfo
screenshot meta_restart
echo META-OFF
r_skybox ""
waitms 500
milk_skyinfo refresh
wait 1
echo META-OFF-DONE
milk_skyinfo
r_skybox milk
waitms 1000
echo META-ON-DONE
milk_skyinfo
echo META-AUTO
waitms 31000
echo META-AUTO-DONE
milk_skyinfo
screenshot meta_auto
echo META-DELETE
waitms 500
milk_skyinfo refresh
waitms 1000
echo META-DELETED
milk_skyinfo
screenshot meta_deleted
echo META-RESTORE
waitms 7000
echo META-RESTORED
milk_skyinfo
screenshot meta_restored
r_imagelist
echo RUNLINES COMPLETE
waitms 300
quit
