// P184 fix 1: a FAILED `map` must not strip the running map's packs.
//
// Before the fix, FS_AutoMountForMap dropped packs from SV_Map_f, which runs BEFORE
// the map-existence check -- so a typo unmounted the packs of the map you were still
// playing and the "Can't find" early-return never put them back.
//
// Expected now:
//   load 1  "needs TF2", 17 searchpaths
//   typo    "Can't find", and NO "dropping" line
//   load 3  17 searchpaths again, and FAST (~1.5s) because TF2 was never dropped.
//           If the bug were still present this would be a ~3s remount.
fs_loadstats 1
fs_automount 1
fs_autounmount 1
developer 0
waitms 4000
echo "=== P184-A: failed map must not unmount ==="
echo "--- 1. surf_utopia (mounts TF2) ---"
map surf_utopia
waitms 25000
echo "--- 2. TYPO: map surf_utopa (must fail, must not drop) ---"
map surf_utopa
waitms 4000
echo "--- 3. surf_utopia again (must NOT have remounted) ---"
map surf_utopia
waitms 25000
echo "=== P184-A DONE ==="
waitms 1000
quit
