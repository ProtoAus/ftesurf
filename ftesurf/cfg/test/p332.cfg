// P332 -- the save-lock anchor lands with the teleport.
//
// PRE-REGISTERED, before the run:
//   * standing in the start zone with the clock stopped, e reads 0 (the
//     build-47 floor rule);
//   * a save taken at the jump apex carries e = apex height above the take-off
//     floor, and AFTER loading it from somewhere else on the map the readout
//     returns to that same number -- not to 0, not to the height of wherever
//     the load was pressed;
//   * loading the standing start-zone save from mid-map puts e back to 0 once
//     you are on the ground in the box, which is the "e -65 until I jump"
//     class of report this patch closes from the other end.
// The e readout lives in the speed cluster (hud_energy 1, shipped default),
// so each arm ends in a screenshot and the numbers are read off them.
log_enable 1
log_dir "logs"
log_name "p332"
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
vid_width 800
vid_height 600
con_notifytime 0
con_notifylines 0
developer 1
log_developer 1
hud_energy 1
hud_energy_ref 1

wait 200
map surf_tensor2
waitmap 900
waitms 15000
sv_cheats 1
waitms 500

echo ^5=== P332 1. standing in the start zone: e must read 0 ==========
setpos -11776 -13632 13681 0 90 0
waitms 1500
screenshot p332_stand
waitms 500

echo ^5=== P332 2. save at the jump apex ==============================
cmd sl_save 2
waitms 300
+jump
wait 30
screenshot p332_air
cmd sl_save 1
wait 20
-jump

echo ^5=== P332 3. land, then load the apex save from the ground =====
wait 60
// 520 units HIGHER than the save: a re-based anchor would come back as
// "e -520" once the load lands you back on the start floor.
setpos -11700 -13500 14200 0 90 0
waitms 1200
cmd sl_load 1
waitms 2500
screenshot p332_loaded
waitms 500

echo ^5=== P332 4. load the standing start-zone save from away =======
wait 60
cmd sl_load 2
waitms 2000
screenshot p332_startload
waitms 500

echo ^5=== P332 DONE ==================================================
wait 60
quit
