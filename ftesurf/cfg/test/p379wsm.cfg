// P379WSM -- replay smoothing, measured on synthetic frames (headless).
//
// Patch 378 added `replay trace <n> <dt>` (n frames dt run-seconds apart,
// printed as `wtr T ex ey ez pitch yaw src fit eyeh`) and the interpolation
// tables' counters in `replay status`, and changed nothing that is drawn.
// Patch 379 draws from those tables.  THE BUILD IS SET BY THE WRAPPER, which
// names the log (the engine appends, so one log for both builds mixes them):
//   379: p379wsm_new.cfg -> logs/p379wsm.log      (the subject)
//   378: p379wsm_ctl.cfg -> logs/p379wsmctl.log   (the CONTROL, commit 4b91307)
//
// Files: surf_kitsune main 0009998_pb (v7, .view at 340 fps, 256 pad samples,
// 12 snaps) and bhop_monster_jam main cheat (v4, tickrate 0.01, .view at ~645
// fps with a map reload in it, 51 fall-teleports, 14 ground unducks), and the
// rewind fixture data/p379/rewind.rec (three `retry` rewinds across ducks).
// Arms: {view, noview} x {dt 0.004 = 1x at 250 fps, dt 0.001 = 0.25x}.
// Windows: approach (-3), steady turn (20; view also 60), each snap from
// ta-0.03 for 60 ms, each air duck, monster_jam's 14 ground unducks from t-0.3
// for 0.35 s, an air arc (2.0), exact samples (P9), the fixture's rewinds.
// Synthetic frames: fps is irrelevant.
//
// RUN from C:/FTESurf, both logs deleted first:
//   python tools/watchtrace.py --fixture ftesurf/data/p379/rewind.rec
//   ./ftesurf64.exe -WindowStyle Minimized +exec cfg/test/p379wsm_new.cfg   (379)
//   ./ftesurf64.exe -WindowStyle Minimized +exec cfg/test/p379wsm_ctl.cfg   (378)
// READ each log L with (repo root; data/ paths resolve under --gamedir ftesurf):
//   python tools/watchtrace.py --model ftesurf/data/runs/surf_kitsune/main/0009998_pb.rec --check L
//   python tools/watchtrace.py --model ftesurf/data/runs/bhop_monster_jam/main/cheat.rec --check L
//   python tools/watchtrace.py --model ftesurf/data/p379/rewind.rec --check L
//   python tools/watchtrace.py --compare new L        python tools/watchtrace.py --compare old L
//   python tools/watchtrace.py --analyse L    (a *ctl* log is judged as the control)
// 379: every --check MATCH, --compare new MATCH, --analyse AS REGISTERED (exit 0).
// 378: kitsune/monster_jam --check MATCH, the fixture's SUSPECT (378 slides
// across a rewind: `duck 5 slide(s)  1 fix`), --compare old MATCH, --compare
// new SUSPECT, --analyse AS REGISTERED (every discriminating gate fails).
// --compare replays every wtr line through the Python model of that build;
// a SUSPECT line means the QC or the model is wrong -- neither is accepted
// until they agree.  Every tool reads a log's LAST run only.
//
// ---- EXPECTED COUNTERS (watchtrace.py --model, taken 2026-09-19) ----------
// kitsune, view:
//   fit 10177 hermite  62 linear  12 snap   snaps 4 rec  8 kin  (0 vetoed, +0 over)
//   duck 0 slide(s)  0 fix  (+0 over)  eye 64 / 47  src 1
//   view 1 span(s)  150 knot(s)  (+0 over)  0 short  0 stalled  step 4.1 ms
// kitsune, noview: the same two, then `view none`.
// monster_jam, view:
//   fit 57109 hermite  1189 linear  51 snap   snaps 1 rec  51 kin  (0 vetoed, +0 over)
//   duck 26 slide(s)  0 fix  (+0 over)  eye 64 / 47  src 1
//   view 10 span(s)  198 knot(s)  (+0 over)  2 short  2 stalled  step 34.7 ms
// the rewind fixture:
//   fit 197 hermite  0 linear  3 snap   snaps 3 rec  0 kin  (0 vetoed, +0 over)
//   duck 4 slide(s)  0 fix  (+0 over)  eye 64 / 47  src 1
//   view none
// (`src 1` assumes this server publishes pm_viewheight 64 / pm_duckviewheight 47,
// default.cfg:345-346; no file carries pmpin.)  The 1 `rec` snap on
// monster_jam is its `retry`, a zero-size jump; the 4 kitsune `rec` snaps are
// its warp tele + restart pairs, the 8 `kin` its v7 stage jumps with no warp.
// 378 builds the fixture's table without the review fix: `duck 5 slide(s)
// 1 fix` -- an unduck slide drawn across rewind A, a dkfix at B, and C's release
// slide running to 2.430 past the rewind at 2.370.  No recording in data/runs
// (239) has a hull change across a rewind, so only the fixture reaches this.
//
// ---- PRE-REGISTERED PREDICTIONS: NEW (379) / OLD (378) --------------------
// Numbers in [brackets] are the Python model of each build over exactly these
// windows (tools/watchtrace.py --sim), not a game measurement.
// P1 yaw.  R = max |dyaw| / (rate * dt) over frames whose reference rate
//    exceeds 100 deg/s, zero-step = fraction of those frames with dyaw 0.
//    Reference: the .rec pair's rate (noview), the .view line pair's rate on the
//    379 time map (view).  Frames within 50 ms of a snap are excluded.
//    kitsune noview 1x:     NEW R <= 1.5, zero < 0.01  [1.00, 0]
//                           OLD R >= 3,  zero ~ 0.73   [3.75, 0.741]
//    kitsune noview 0.25x:  NEW R <= 1.5, zero < 0.01  [1.00, 0]
//                           OLD R >= 12, zero ~ 0.93   [15.0, 0.938]
//    kitsune view 0.25x:    NEW R <= 1.5, zero < 0.01  [1.01, 0]
//                           OLD zero ~ 0.66            [R 17.1, 0.670]
//    The view reference comes from the 379 map itself, so P1 does not test the
//    map's alignment; P6 does.
//    NOT GATED: view at 1x.  A 4 ms frame spans a 2.94 ms line pair plus part
//    of the next, so R > 1 on honest output [NEW 1.55, OLD 1.58, zero 0 both].
// P2 snaps.  Frames crossing a snap interval whose feet leave the recorded
//    velocity by > 8 u.  NEW exactly 1 per snap (12 on kitsune; monster_jam's
//    retry is a 0 u jump: 0 or 1) [1 everywhere, retry 0].  OLD one per frame
//    of the interval: ~15 at 0.25x, ~4 at 1x [15-16, 5].
// P3 ballistic curvature, kitsune only: max |z''| / g over 3 ms of frames in
//    Hermite air intervals with no ramp bit.  NEW <= 3 [1.44 at 0.25x, 1.24 at
//    1x; view with its 60 s window 1.59, 1.38].  OLD >= 3.5: a lerp's kink
//    reads tick/h [5.36-5.52, 3.98-4.15].
//    NOT GATED: monster_jam (v4) samples its t off sv.time, +-1 ms against 10 ms
//    ticks, so a Hermite's dt is 10% wrong there [NEW 35.7/25.2, OLD 44/24.8];
//    the error is under 0.1 u of position.
// P4 ground unducks (monster_jam, 14): largest per-frame change of eyeh.
//    NEW <= 0.2 u at 0.25x [0.133], <= 0.8 at 1x [0.514]; S-curve rms < 0.5 u
//    [0.001].  OLD a 17 u one-frame step, 0.2 s late [17.0, rms 7.9].
// P5 air ducks (kitsune 3, monster_jam 6) a block covers whole (a snap window
//    that clips one would read net 0): the head against the recorded vz.
//    NEW a monotone ~8.5 u drop: rise < 1 u [<= 0.43], largest one-frame drop
//    <= 8.5*dt/interval + 1 [1.05 at 0.25x, 4.18 at 1x], net -8.5 +- 0.5.
//    OLD an 8.5 u rise then a 17 u drop [rise 6.86-8.54, drop 15.3-16.9].
// P6 .view alignment, kitsune view, the 20 s and 60 s windows pooled per arm:
//    the time between each fast .rec sample and the drawn yaw passing it.
//    NEW |median| <= 2 ms and p10..p90 <= 1.2 ms [1x -1.14 / 0.37 over 55,
//    0.25x -1.12 / 0.28 over 31].  OLD's median passes [-1.38, -0.81]; its
//    spread fails [2.80, 3.16]: 378's tick-quantized pick lands each line
//    +-1.5 ms off.  A map offset error moves the median by the error (model:
//    +-2 ms -> -3.15 / +0.86), so a shift past +0.9 or -3.1 ms fails.  Knot
//    offset step <= 5 ms [4.1, the `step` counter].
//    NOT GATED: monster_jam [NEW -2.5 at 126 s, +4.2..+4.7 ms at 562-586 s]:
//    the lower-envelope offset is biased there (100 Hz ticks against a 66 Hz
//    tick stat); recorded so the number is not rediscovered as a regression.
//    Nor kitsune past 77.8 s: its `in` rows carry 5.01 ms of movecarry from
//    there, which neither build's k*tick map sees [both -5.3 ms at 90 s].  The
//    windows stay before it.
// P7 feet frozen while the .rec speed > 100 (outside snaps): 0 in both builds.
//    Does not discriminate -- position was already lerped -- so it is no win.
// P9 exact samples (`replay trace 1 0` at kitsune 20.01, 60.0 and monster_jam
//    100.0007): feet within 0.01 u of the sample, both builds [0.000-0.001];
//    noview angles within 0.01 deg [0].  View arms draw the .view's angles.
// P10 load: `replay: opened in N ms (view map M ms)`.  378 already builds
//    every table (to print them), so NEW and OLD load alike; the pair's added
//    cost against HEAD~2 is M plus one str2chr per record line and one
//    Interp_Fit per pair.  Want kitsune M <= 150 ms.  monster_jam (374k lines)
//    is recorded, not gated.
// P8 (the frame clock) is p379wsmfps.cfg's.
//
// P11 the rewind fixture: --check MATCH and --compare new MATCH on 379 (no
//    slide spans a rewind; C's stops at 2.370).  378: --check SUSPECT on the
//    duck line, as above.  --analyse gates nothing on the fixture.
//
// CONTROL THAT MUST FAIL: the 378 log through --analyse must FAIL P1-P6 as
// bracketed above (the tool prints each verdict; exit 0 = as registered).
// A metric the 378 build passes is not measuring the defect.
// --compare new on the 378 log must be SUSPECT, --compare old on it MATCH.
//
// SPECTATE (critic #41), pending Patch 382's files: a run with a spec window.
//    Want 0 snaps and 0 jump frames across the window (its samples are
//    continuous), a `view` span break at the window, and the same counters on
//    --check.  Add the file's windows here when one exists.
//
// RESULTS: (integrator: write them here, failures included)
//
// RESULT (2026-09-19, listen server, fteqw 3ee3baf4d, csprogs from 1a8b4a1+379 and
// the 378 control 4b91307).  AS REGISTERED, with one falsified CONTROL prediction.
//   379 (logs/p379wsm.log): --check MATCH on kitsune, monster_jam and the rewind
//   fixture; --compare new MATCH over 22075 frames (worst feet 0.002 u, angle
//   0.037 deg, eye 0.001 u); --analyse 42 of 42 as registered: P1 R 1.00-1.01 with
//   0 zero-steps, P2 one jump frame per snap, P3 1.28-1.86 g, P4 0.133 u / 0.514 u,
//   P5 rise <= 0.43 u, P6 -1.12 / -1.14 ms, P7 0, P9 feet <= 0.001 u, P10 50 ms.
//   378 (logs/p379wsmctl.log): kitsune/monster_jam --check MATCH, the fixture
//   SUSPECT (duck 5 slides 1 fix), --compare new SUSPECT, and every discriminating
//   gate fails: P1 R 3.75-17.1, P2 5 / 15-16 jump frames, P3 3.98-5.52, P4 17 u,
//   P5 rise 6.9-8.5, P6 spread 2.7-2.9 ms.
//   FALSIFIED: "--compare old MATCH" on the 378 log -- SUSPECT, 142 of 22075
//   frames past tolerance (worst 0.368 u, 1.99 deg).  The Python model of the OLD
//   code is not exact; it does not touch the 379 verdicts, which compare 379's QC
