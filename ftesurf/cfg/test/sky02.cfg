// SKY02 -- narrow the three surf_boreas reports to one cause each.
//
// sky01 reproduced report 3 outright: at save009 (10229 5262 14726, p17.2
// y139.4) vbsp_skyroom 1 punches a large hard-edged white hole through solid
// rock that is opaque with vbsp_skyroom 0.  Sky surfaces under RDF_SKIPSKY draw
// nothing AND write no depth on a Source map (R_SkyMaskWantedForGame returns
// false for fg_new while r_sky_forcedepth < 2), so those pixels keep whatever
// the skyroom pass left there.  Two candidate causes, one shot each:
//
//   r_sky_forcedepth 2  -- makes SKYMUSTBEMASKED true for Source, so the sky
//                          surface writes depth.  Closes the hole if the cause
//                          is the missing mask.
//   r_novis 1           -- draws every surface regardless of PVS.  Closes the
//                          hole if the cause is the skyroom pass leaving the
//                          world's visibility set marked from ITS camera.
//
// Report 2 is the big blue-grey panelled plate at save011.  It fills the screen
// yet shader_here traced straight through it to terrain 587 units away, so it is
// not world geometry.  Two shots to name it:
//   r_drawentities 0 -- gone => it is a brush entity (func_dustmotes *29 is the
//                       only brush model containing that viewpoint)
//   r_fastsky 1      -- turns flat r_fastskycolour => it is a sky surface
//
// Report 1 is the clouds.  They are two CLOODS displacement planes at z -8000
// and -7232 spanning the whole +-16000 footprint, and sky01 showed they only
// appear with the skyroom on, so they ARE in the skyroom pass.  What is left is
// whether they take the skyroom's DISTANCE fog.  sky_camera says fogstart 500
// fogend 43420; force something unmissable and see if the clouds tint with the
// mountains or stay untouched.

log_enable 1
log_dir "logs"
log_name "sky02"
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 0
vid_fullscreen 0
con_notifytime 0
con_notifylines 0
con_notifytime_error 0

wait 200
echo ^5=== sky02: narrowing the three boreas reports ===

map surf_boreas
waitmap 1800
waitms 9000
sv_cheats 1
waitms 300
noclip
waitms 300

// ============================ REPORT 3: the see-through hole ==============
echo ^5========== save009 A: skyroom 1, stock ==========
vbsp_skyroom 1
r_sky_forcedepth 1
r_novis 0
r_drawentities 1
r_fastsky 0
setpos 10229.4 5262.8 14725.9 17.2046 139.3616 0
waitms 2500
screenshot sky02_x
waitms 800
screenshot sky02_09a_stock
waitms 800

echo ^5========== save009 B: + r_sky_forcedepth 2 (mask the sky) ==========
r_sky_forcedepth 2
waitms 2500
screenshot sky02_x
waitms 800
screenshot sky02_09b_forcedepth2
waitms 800

echo ^5========== save009 C: + r_novis 1 (ignore PVS) ==========
r_sky_forcedepth 1
r_novis 1
waitms 3000
screenshot sky02_x
waitms 1000
screenshot sky02_09c_novis
waitms 800
r_novis 0
waitms 1500

echo ^5========== save009 D: skyroom 0 control ==========
vbsp_skyroom 0
waitms 2500
screenshot sky02_x
waitms 800
screenshot sky02_09d_skyoff
waitms 800

// ============================ REPORT 2: what is the plate ================
echo ^5========== save011 A: stock ==========
vbsp_skyroom 1
setpos 13826.6 -2739.2 12105.6 16.3367 163.2788 0
waitms 2500
screenshot sky02_x
waitms 800
screenshot sky02_11a_stock
waitms 800

echo ^5========== save011 B: r_drawentities 0 ==========
r_drawentities 0
waitms 2500
screenshot sky02_x
waitms 800
screenshot sky02_11b_noents
waitms 800
r_drawentities 1
waitms 500

echo ^5========== save011 C: r_fastsky 1 ==========
r_fastsky 1
waitms 2500
screenshot sky02_x
waitms 800
screenshot sky02_11c_fastsky
waitms 800
r_fastsky 0
waitms 1000

// ============================ REPORT 1: do the clouds take fog ===========
echo ^5========== clouds A: stock skyroom fog ==========
vbsp_skyroom 1
setpos 12000 -8000 14000 -12 180 0
waitms 2500
screenshot sky02_x
waitms 800
screenshot sky02_fog_a_stock
waitms 800

echo ^5========== clouds B: skyroomfog forced red ==========
skyroomfog 0.02 1 0 0 1 0
waitms 2500
screenshot sky02_x
waitms 800
screenshot sky02_fog_b_red
waitms 800

echo ^5========== clouds C: skyroomfog off entirely ==========
skyroomfog 0
waitms 2500
screenshot sky02_x
waitms 800
screenshot sky02_fog_c_none
waitms 800

echo ^5=== sky02 done ===
wait 30
quit
