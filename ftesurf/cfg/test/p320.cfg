cfg_save_auto 0
// P320 -- the player's box was not rotated into a rotated prop's frame.
//
// BIH_RecursiveTrace's BIH_MODEL case rotates startpos/endpos into the submodel's
// frame and hands the box through as an AABB.  An AABB cannot express "rotated",
// so inside a prop yawed off-axis the player's box effectively rotates with the
// prop.  Zero error at 0/90/180/270, worst at 45.
//
// surf_boreas's ramps are prop_static at yaw -135.  Ramp surface normal there is
// (-0.5367 0.5676 0.6243).  The engine computed a plane push-out of 12.843 from
// the MODEL-space normal; the true value from the WORLD-space normal is 17.669.
// 4.826 / 0.6243 = 7.73 units of ride height, on every diagonal prop in the game.
//
// PRE-REGISTERED.  At XY (11494.4 -13173.5) the ramp holds the player's feet at
//   pm_rotatedboxhulls 0 : z 2575.93   (and the recorded stop in p317probe.log
//                                       was z 2576.0 -- the old behaviour)
//   pm_rotatedboxhulls 1 : z 2583.66   (which is EXACTLY what an independent
//                                       convex-ledge Minkowski sum gives, i.e.
//                                       what Source's vphysics trace would give)
// So a zero-length tracebox at z 2580, between the two:
//   arm 0 -> startsolid 0   (2580 is ABOVE the old surface: clear)
//   arm 1 -> startsolid 1   (2580 is BELOW the new surface: inside)
// If arm 0 reports 1 at 2580 the old surface is not where the model says and
// nothing below means anything.
//
// CONTROLS, which must be IDENTICAL in both arms:
//   z 2570  below both surfaces  -> startsolid 1, 1
//   z 2595  above both surfaces  -> startsolid 0, 0
//   the spawn deck (world brushes, UNROTATED) -> unchanged, proving the fix
//   touches only rotated submodels and not the world.
log_enable 1
log_dir "logs"
log_name "p320"
cl_idlefps 0
vid_fullscreen 0
con_notifylines 0

hl2_propcollision 1
hl2_phywinding 1
hl2_brushbevels 1

wait 200
map surf_boreas
waitmap 600
waitms 12000
sv_cheats 1
waitms 500
noclip
waitms 400

echo ^5=== P320 ARM A: pm_rotatedboxhulls 0 (old behaviour)
pm_rotatedboxhulls 0
waitms 300
echo ^5=== A/2570 control, expect startsolid 1
setpos 11494.4 -13173.5 2570.0 90 41.64 0
waitms 500
cmd stuck
waitms 700
echo ^5=== A/2580 THE TEST, expect startsolid 0
setpos 11494.4 -13173.5 2580.0 90 41.64 0
waitms 500
cmd stuck
waitms 700
echo ^5=== A/2595 control, expect startsolid 0
setpos 11494.4 -13173.5 2595.0 90 41.64 0
waitms 500
cmd stuck
waitms 700
echo ^5=== A/spawn deck control
setpos 12788.09 -11827.59 14736.03 90 82.15 0
waitms 500
cmd stuck
waitms 700

echo ^5=== P320 ARM B: pm_rotatedboxhulls 1 (the fix)
pm_rotatedboxhulls 1
waitms 300
echo ^5=== B/2570 control, expect startsolid 1
setpos 11494.4 -13173.5 2570.0 90 41.64 0
waitms 500
cmd stuck
waitms 700
echo ^5=== B/2580 THE TEST, expect startsolid 1
setpos 11494.4 -13173.5 2580.0 90 41.64 0
waitms 500
cmd stuck
waitms 700
echo ^5=== B/2595 control, expect startsolid 0
setpos 11494.4 -13173.5 2595.0 90 41.64 0
waitms 500
cmd stuck
waitms 700
echo ^5=== B/spawn deck control, must match arm A exactly
setpos 12788.09 -11827.59 14736.03 90 82.15 0
waitms 500
cmd stuck
waitms 700

echo ^5=== P320 DONE ===
wait 60
quit
