// Patch 386 rig (d)(2): the prefer-hint world load (SV_Map_f's "@<spec>/<map>" form, sv_ccmds.c:954;
// sv_init.c:1158 sets fs_preferhint for the BSP locate, and FS_FLocateFile skips the case-insensitive
// hash while a hint is set, fs.c:2405).  FTESurf's QC never issues this form; the engine's own menu
// and a typed command can.  Arms: W Windows fs_cache 1; L1 Linux ext4 fakesteam fs_cache 1.
// PRE-REGISTERED 2026-09-19, before any arm ran:
//   H1 on-disk spelling (@.../Bhop_Mukiology) loads on W and L1.
//   H2 lowercase (@.../bhop_mukiology) loads on W; on L1 the existence probe passes (hash) but the
//      hinted world load is exact-case and fails ("Couldn't load maps/bhop_mukiology.bsp" or no
//      fs: line for it; waitmap gives up), and the plain `map bhop_eazy` after it recovers.
// RESULTS 2026-09-19 (ftesurf/logs/linux/p386mappref_{w,l1}.log): H1 HELD on both.  H2 HELD: W
//   loaded bhop_mukiology; L1 printed "Host_EndGame: Mod_NumForName: maps/bhop_mukiology.bsp not
//   found or couldn't load", waitmap gave up, and bhop_eazy after it loaded.
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
developer 1
log_developer 1
fs_loadstats 1
waitms 3000
echo ======== P386CASE setup
fs_cache
echo ======== P386CASE map pref_Bhop_Mukiology
map "@steam:Momentum Mod Playtest/momentum/Bhop_Mukiology"
waitmap 60
waitms 5000
echo ======== P386CASE report pref_Bhop_Mukiology
mapname
hl2_unresolved
echo ======== P386CASE end pref_Bhop_Mukiology
echo ======== P386CASE map pref_bhop_mukiology
map "@steam:Momentum Mod Playtest/momentum/bhop_mukiology"
waitmap 60
waitms 5000
echo ======== P386CASE report pref_bhop_mukiology
mapname
hl2_unresolved
echo ======== P386CASE end pref_bhop_mukiology
echo ======== P386CASE map bhop_eazy
map bhop_eazy
waitmap 60
waitms 5000
echo ======== P386CASE report bhop_eazy
mapname
hl2_unresolved
echo ======== P386CASE end bhop_eazy
echo ======== P386CASE done
quit
