// P495FOREST -- the monolith's forest terrace, photographed.
//
// Four stations bare (milk_art_monolith_0..3; 0 MAIN sees the terrace across
// the void, 1 PLAY stands in the forest):
//   ftesurf64.exe -WindowStyle Minimized -WorkingDirectory C:\FTESurf ^
//     +set milk_bootcheck 7 +set log_name p495art +exec test/p495forest.cfg
//
// A view sweep inside the forest (milk_seq_0..5), which is the arm for the
// sectioning: the crowns that vanish are a function of the sample point, so two
// head turns 1.5 s apart move the seams.  Bootcheck 10 runs one '|'-separated
// command from milk_bcseq and shoots 1.5 s later:
//   ... +set milk_bootcheck 10 +set milk_bcstation 1 +set log_name p495sweep ...
//
// Pinned to the OWNER's archived settings (ftesurf.cfg: milk_world monolith,
// milk_quality 4, milk_res 1, milk_panels 0), not to p467milk.cfg's, because
// the thing being judged is what they see.  Quality 4 is the expensive one --
// every tick raymarches, at high's resolution.
//
// RESULT (2026-10-05, RTX 2080 SUPER + i9-9900K, PLAY station, milk_res 1,
//   milk_panels 0, s_inactive 1; bootcheck 4 over its 6 s window):
//   before, q4 div 1:  494 fps  (2.02 ms)   -- and the shots showed why the
//                                            owner complained: crowns holed and
//                                            faceted, a comb of missing leaf at
//                                            every cell boundary that MOVED with
//                                            the camera (sweep views 0..5 differ
//                                            in which slices are gone), ~10 trees
//                                            on a flat green slab, trunks black.
//   after,  q4 div 1:   47-58 fps (17-21 ms, two samples 19.3 / 21.1)
//   after,  q3 div 2:   2.75-5.56 ms a frame (the wood, every other tick)
//   after,  q2 div 2:   2.20 ms a frame (mass-only crowns, no boulders)
//   control, q4, forest removed from map(): 7.7 ms -- so of the ~19, ~6 is the
//     terrace's hummock and the new light, ~13 the trees themselves.
//   MAIN (the balcony) is ~0.7-0.8 ms before and after: open void, few steps.
//   The sweep (six head turns, milk_seq_0..5) shows whole crowns and trunks in
//   every view; the sectioning is gone.  Graded by eye against before_*.jpg in
//   the patch's own working notes, and by the comb's absence, which is binary.
//   WHAT THIS COSTS AND WHAT TO DO ABOUT IT: at ultra the wood is ~13 ms of a
//   19 ms frame on a 2080 SUPER.  On the N100 that setting was already the slow
//   one before this patch (the corridor's own march), so the advice stands:
//   milk_quality 3 draws the same wood for a fraction of it, because the
//   raymarch then runs every other tick.
//   PREDICTIONS, and how they went:
//     P1 the sectioning is the 4-cell lookup window sliding -> CONFIRMED, and
//        the first fix (a reach bound alone) did NOT cure it: a crown leaving
//        the window took its distance with it and the march stepped through.
//        The cure is the nine-cell window plus the 1.2 * CELL distance cap.
//     P2 the holed crowns are an over-estimating SDF -> CONFIRMED (the old
//        crown divided by 1.67 where its gradient needed 2.8).
//     P3 the cost is the crown ripple -> FALSIFIED (removing it moved nothing);
//        ablation put it on the trunks' per-step evaluation, then on the
//        density field being read once per CELL instead of once per step.
//     P4 cheaper trees = sparser trees -> FALSIFIED at ultra: mass-only crowns
//        measured SLOWER (30.6 ms) than the lobed ones (19-21), because
//        disjoint spheres let a ray weave into everything behind them.
cfg_save_auto 0
set milk_menu 1
set milk_world monolith
set milk_quality 4
set milk_res 1
set milk_fsr 0
set milk_checker 0
set milk_cone 0
set milk_panels 0
set milk_streaks 0
set milk_grade 1
set milk_react 1
set milk_trails 1
set milk_sfx 0
set milk_menumusic auto
// The music is a whisper: volume scales SFX only, and musicvolume*mastervolume
// is taken BEFORE the snd_vis tap, so muting would blind the analysis.
set s_inactive 1
volume 0
set musicvolume 0.02
log_enable 1
log_dir "logs"
developer 0
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
scr_sshot_type jpg
scr_sshot_compression 92
// The view sweep.  With milk_panels 0 the camera takes the head-turn path, so
// milk_fakemouse aims it: yaw (x/2256 - 0.5) * 16 deg, pitch (0.5 - y/1380) * 8.
// A ';' would split the command, so each entry is one assignment.  -1 = the real
// cursor, which in a minimized window is the resting view.
set milk_bcseq "set milk_fakemouse -1|set milk_fakemouse 2200 1300|set milk_fakemouse 120 1300|set milk_fakemouse 2200 120|set milk_fakemouse 120 120|set milk_fakemouse -1"
