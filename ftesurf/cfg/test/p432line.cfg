log_enable 1
log_dir "logs"
developer 0
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0
set run_resume 0
sv_public 0
sv_port 27687
set lobby_dir ""
set hud_watch_skipidle 0
set hud_watch_path_ahead 1
set hud_watch_path_color 0

wait 200
map surf_rookie
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 1000
echo ^5=== p432line A1 ===
replay online 47
replay window 5
replay pause
replay seek 34.3
waitms 1500
replay status
screenshot screenshots/p432line_tele.png
