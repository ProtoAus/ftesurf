// cfg_save_auto 0 FIRST: this run sets archived cvars and must never write them
// into ftesurf.cfg (cl_main.c:2535).
cfg_save_auto 0

// ===========================================================================
//  P436HAND -- the LEGITIMATE stage handover still works after Patch 436.
//    python tools/p436hand.py        (server + client, parses, cleans up)
//    server: cfg/test/p436sv.cfg on 27666 (see its header for the hand recipe)
//
//  Patch 436 makes the save-state loader DROP `pendarm`, so a restored file can
//  no longer hand a player a clean stage run.  This is the other half of that
//  claim and the reason the drop is safe: the handover a PLAYER earns by crossing
//  a stage finish is live state, not a file key, and nothing about it changed.
//
//  ROUTE (bhop_eazy, measured with zone_list rather than guessed):
//    0  start   x -480..-224   y -480..-224    bottom 64.03125
//    1  stage   x 2528..2720   y  384..640     bottom 64.03125
//    2  stage   x -480..-288   y -1856..-1600  bottom 64.03125
//  `!s 1` arms a stage-1 run and teleports to the start; noclip + `setpos` flies
//  the body into zone 1 (a full run would take a real surfer 30 s and a headless
//  one cannot surf), the crossing finishes the leg and owes the handover; then a
//  step OUT of zone 1's box is what SV_TimerFrame's FINISHED branch waits for.
//
//  ARMS
//   G1 armed by `!s 1`: stagerun 1, leg 1, finished 0.
//   G2 inside zone 1, the crossing taken: `timer: finished` and `pending arm 1` --
//      the leg closed and the handover is OWED, which is the state Patch 436 stops
//      a file from handing back.  (This arm's `splits` stays 0: a stage leg posts
//      no split, so `pending arm` is the observable, not the count.)
//   G3 THE SUBJECT: stepped out of zone 1's box.  A stage-2 run must be RUNNING,
//      stagerun 1 and `pending arm -1` -- the handover fired and spent itself.
//   G4 the same, 1.5 s on: still running, still stagerun 1 (the handover is not
//      a one-tick flicker).
//
//  PRE-REGISTERED PREDICTIONS, identical on the fixed build and on HEAD~ -- this
//  arm exists to NOT MOVE:
//   G1 `stagerun 1`, `pending arm -1`, state armed, class clean (nothing has
//      touched the body yet, so the flight's taint has not landed either).
//   G2 `timer: finished`, `pending arm 1`.
//   G3 `timer: running`, `stagerun 1`, `pending arm -1`, ticks near 0.  The class
//      reads `cheated` by now and that is the noclip the route needs, not a
//      finding: the handover's gate is a pure geometry test.
//   G4 the same as G3.
//  FALSIFIED IF G2 is not `finished` with `pending arm 1` (the leg never closed,
//   so no pendarm was ever owed and G3 proves nothing), or G3 is not `running`
//   with stagerun 1 on the FIXED build (Patch 436 broke the handover it was meant
//   to leave alone).
//  NOT COVERED: the handover's taint forgiveness (b43stage 4b's subject) and a
//   bonus track, where the same code runs with a different zone set.
//
//  RESULT (2026-09-23, both builds, driver exit 0 each way -- and IDENTICAL, which
//   is the whole point of the arm):
//     G1 armed, stagerun 1, pending arm -1, clean
//     G2 finished, pending arm 1 -- the leg closed and the handover is owed
//     G3 running, stagerun 1, pending arm -1, clock 0:01.190, class cheated
//     G4 running, stagerun 1
//   So Patch 436 leaves the live path alone: the crossing still owes the arm and
//   the step out still spends it.  The `cheated` class at G3 is the noclip the
//   route needs and is not a finding; the handover's gate is a pure geometry test.
//   ONE PREDICTION WRONG: G2 was registered as `splits 1`, and a stage leg posts
//   no split at all (the report reads `stage: seg -1 ... wrote 0`, `splits 0`).
//   `pending arm` is the observable, and it is the one that shows the handover
//   owed at G2 and spent at G3.
log_enable 1
log_dir logs
log_name p436hand
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
vid_fullscreen 0
waitms 4000
connect 127.0.0.1:27666
waitms 6000
menu_restart
ui_close
waitms 1500

echo ==== G1 arm a stage-1 run ====
say !s 1
waitms 1200
echo ---- G1 stagerun 1 ----
cmd timer
waitms 700

echo ==== G2 fly into stage 1's box and take the crossing ====
cmd noclip
waitms 300
setpos 2624 512 144 0 16 0
waitms 1500
echo ---- G2 finished, pending arm 1 (the handover is owed) ----
cmd timer
waitms 700
cmd viewpos
waitms 500

echo ==== G3 THE SUBJECT: step out of the box, the handover must fire ====
setpos 2760 512 144 0 16 0
waitms 1200
echo ---- G3 running / stagerun 1 / pending arm -1, or Patch 436 broke the handover ----
cmd timer
waitms 700
cmd viewpos
waitms 500

echo ==== G4 the same, 1.5 s on ====
waitms 1500
cmd timer
waitms 700

disconnect
quit
