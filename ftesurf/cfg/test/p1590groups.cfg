// Private overlay, run by tools/p1590groups.py: this checkout's surfd on 127.0.0.1:27636
// over seeded rows (surf_voyager main: 150 Momentum times, ranked times across every group;
// bonus 1: 40 KSF; main sw: 30 KSF; main tas and segmented: ranked/community). P1590: the
// mode row, Groups lines and leg badges. Graded from `scores status` (mode, the groups store,
// each row's group, each leg's badge); the screenshots are for a person. A marker comes
// BEFORE the `scores status` it labels.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name runlines_smoke
con_notifytime 0
con_notifylines 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
vid_winmaximize 0
vid_width 1600
vid_height 900
vid_conautoscale 1
sv_public 0
// a private game's account mark is the client's own _smark (Account_Mark): the board's `me`
setinfo _smark f1590abc
waitms 2000
map surf_voyager
waitmap 60
waitms 4000
wait 4
menu_restart
ui_close
// menu_restart reloads consent: the synthetic test cvar goes after it (p545mom.cfg).
set rec_terms 9
set lobby_dir "http://127.0.0.1:27636"
set hud_scale 2
set sb_filter 0
set sb_filter_src 0
set ui_native_scores 0
scores open
// a map's board opens on WOS (P909): every game's list first
scores source all
waitms 4000
wait 4

echo P1590 normal
scores status
screenshot p1590_normal.png
scores source ftesurf
waitms 2500
wait 4
echo P1590 ours
scores status
screenshot p1590_ours.png
scores mode segmented
waitms 2500
wait 4
echo P1590 segmented
scores status
screenshot p1590_segmented.png
scores style hsw
waitms 1500
wait 4
echo P1590 styleword
scores status
scores segmented 1
waitms 1500
wait 4
echo P1590 segword
scores status
scores mode tas
waitms 2500
wait 4
echo P1590 tas
scores status
screenshot p1590_tas.png
scores source all
scores mode sw
waitms 2500
wait 4
echo P1590 sideways
scores status
screenshot p1590_sideways.png
scores mode normal
scores leg 1
waitms 2500
wait 4
echo P1590 bonus
scores status
screenshot p1590_bonus.png
scores leg 0
scores tab local
scores mode tas
waitms 1500
wait 4
echo P1590 localtas
scores status
screenshot p1590_localtas.png
scores tab online
waitms 1500
wait 4
echo P1590 back
scores status
echo P1590 end
echo RUNLINES COMPLETE
quit
