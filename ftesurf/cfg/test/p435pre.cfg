// cfg_save_auto 0 FIRST: this run sets archived cvars and must never write them
// into ftesurf.cfg (cl_main.c:2535).
cfg_save_auto 0

// ===========================================================================
//  P435PRE -- a start-box load that carries speed must not arm a CLEAN run.
//    python tools/p435pre.py     (stages the fixtures + zones, runs, restores)
//    or by hand, from C:\FTESurf: PARK ftesurf/data/saves/bhop_eazy (a shared
//    fixture), copy cfg/test/p435rest.txt and p435speed.txt to
//    ftesurf/data/saves/bhop_eazy/save901/state.txt and save902/state.txt,
//    copy cfg/test/p435.zones.json to ftesurf/maps/zones/local/bhop_eazy.json
//    (DELETE IT AFTER -- a local zone file shadows the shipped one for every
//    harness on this map, and pm_verify REFUSEs a file recorded under it), then
//    ftesurf64.exe -WindowStyle Minimized +exec cfg/test/p435pre.cfg
//
//  THE DEFECT (BACKLOG, Patch 415's essay + Patch 428 review).  Build 47's gate
//  forces the zone edge (`run_t_azone = -1`) for a save loaded inside a start
//  box, so the next scan arms the attempt and SV_TimerArm LAUNDERS the load's
//  TF_SEGMENT|TF_PRACTICE.  `SV_SaveLocPlace` writes `e.velocity =
//  rec_sl_vel[r]`, so a save taken while carrying speed inside a start box
//  becomes a CLEAN armed attempt with that speed already on the body: leave the
//  box and the run is ranked from a flying start.  Patch 415 measured the gate
//  failing on some shipped regions (state.txt's `origin %.4f` lands the body
//  0.00005 under a zone whose bottom is its floor) and left it alone precisely
//  because the velocity was unanswered.  tools/census/startdest.py now counts
//  both classes over the whole shipped library: 29 of 35 regions with an
//  authored teleDestPos are in the class this patch closes, 6 regions on 3 maps
//  are in the rounding class it cannot reach.
//
//  THE FIX.  The gate also asks the ROW what it carries: `SL_RowSpeed(r) <
//  SL_ARM_SPEED` (1 u/s, above `%.4f` rounding and above friction's residue at
//  sv_stopspeed, below any prespeed worth having).  A save at rest arms exactly
//  as before; a save with speed keeps the load's taint and leaving the box
//  starts a PRACTICE run -- at the speed you saved with, which is what a
//  stitched attempt is for.  Same answer the rounding regions gave by accident,
//  given by all of them on purpose.
//
//  THE ZONES FIXTURE IS PART OF THE ARM, NOT A SHORTCUT.  p435.zones.json is
//  bhop_eazy's shipped file with the start region's `bottom` lowered 64.03125 ->
//  48, so a body standing on the floor at 64.0312 IS inside the slab and
//  SV_ZoneStartAt answers 0.  On the shipped file this gate never fires on
//  bhop_eazy at all (that is Patch 415's measurement), so the shipped file
//  cannot show either behaviour.  The census's 29 are the live case; this fixture
//  is one of them, made deterministically instead of found.
//
//  THE TWO SAVES DIFFER IN ONE LINE that matters: `velocity 0.0000 0.0000
//  0.0000` (save901, row 1) against `velocity 250.0000 0.0000 0.0000` (save902,
//  row 2).  Both are ARMED (state 1), both sit at (-420 -352 64.0312) inside the
//  start region, both carry `azone 0`/`armzone 0` so the restored latches say
//  "in the box", both have `reclines 0` (an armed save has no recording, so both
//  take SV_RecRewind's mark<=0 FALSE -- Patch 434's branch, and not its
//  TS_RUNNING half).  `seq` differs too, because two saves cannot share one.
//
//  ARMS, in log order.  A load and a hold in one frame is what the client's own
//  `2` key sends (cl_saveloc.qc), and the hold is what makes the class readable:
//  it parks the body, and Patch 428 runs no zone tests under a hold, so nothing
//  arms until the release.
//   A  CONTROL, row 1 at rest: load+hold, read, release, jump out, read.
//   B  SUBJECT, row 2 at 250: the same gestures.
//   C  SUBJECT without the hold: load row 2 alone and read the body at once --
//      the arm that shows the speed really reaches the body rather than only the
//      row, and the purest form of the falsifier (no park between load and arm).
//
//  PRE-REGISTERED PREDICTIONS
//   A1 parked: `armed`, `arm zone -1 (armed from 0)` -- the gate fired and forced
//      the edge, exactly as Build 47 intends.  The class still reads `practice 1`/
//      `segmented` HERE and that is not a failure: Patch 428 runs no zone tests
//      under a hold, so the scan that would arm (and SV_TimerArm is the only thing
//      that launders) cannot come until the release.  A1 and B1 are therefore told
//      apart by `arm zone`, and the class by A3 and B4.
//   A2 parked: `viewpos` velocity 0 (the hold freezes the body).
//   A3 released and out of the box: `running`, `practice 0`, `class: clean` -- the
//      laundered arm, which is what an at-rest start-box load is FOR.
//   B1 parked: `armed`, `arm zone 0 (armed from 0)` -- the gate did NOT force the
//      edge, so no arm can come to launder the load's `practice 1`/`segmented`.
//   B2 parked: `viewpos` velocity 0 (the hold, not the fix, zeroes the body).
//   B3 just after the release: `viewpos` horizontal WELL ABOVE 0 -- the row's speed
//      is in the body, which is the whole reason B1 must stay tainted.  Not 250:
//      ground friction bleeds it (measured 147 at 120 ms after the release), so
//      C1 is the arm that quotes the row's number exactly.
//   B4 out of the box: `running`, `practice 1`, `class: segmented`.
//   C1 in the SAME PACKET as the load: `viewpos` horizontal exactly 250.0000 --
//      the body has the row's velocity before any physics ran on it.
//   C2 ~1.2 s later: `practice 1` and `class: segmented` -- on the control build
//      this reads `practice 0`/`clean`, THE DEFECT ITSELF: a load alone armed a
//      clean run and the body kept the 250 u/s it was handed.
//   And the two arms that bound the fix from the other side, both run:
//    `--arm shipped` (p435hop.cfg) and `--arm mode` (p435mode.cfg).
//  CONTROL BUILD (HEAD~) PREDICTIONS: A1/A2/A3 unchanged (the at-rest save is the
//   arm that must NOT move); B1 `arm zone -1 (armed from 0)`; B4 `running`,
//   `practice 0`, `class: clean`; C2 `practice 0`, `class: clean`.  B3/C1
//   unchanged -- the speed was never the fix's job.
//  FALSIFIED IF A3 is not `practice 0`/`clean` on either build (an at-rest
//   start-box load must still arm clean, or Build 47 is broken and B proves
//   nothing), or B1's `arm zone` is -1 on the fixed build, or 0 on the control
//   build, or C1's horizontal is not 250.0000 on both (the subject never carried
//   the row's speed).
//  NOT COVERED: a save with speed taken in a STAGE box -- the gate is a start-box
//   gate, so a stage-box load keeps the taint it always kept.
//  SIBLING ARMS, and the limit of this fix:
//   p435hop.cfg (`--arm shipped`) is the same two saves on bhop_eazy's OWN zones,
//     where state.txt's `origin %.4f` puts the placed body 5e-5 below the slab and
//     the gate cannot fire at all.  The backlog's "a hop beats that" is FALSE
//     there: the jump starts the run from the restored ARMED state and
//     SV_TimerTryArm's bhop branch refuses to arm an attempt already RUNNING.
//   p435mode.cfg (`--arm mode`) is that arm again with `sv_gamemode surf`, which
//     is the one input to run_t_bhopjump.  THERE THE HOP DOES LAUNDER: airborne at
//     z 106.9 against a slab bottom of 64.03125, `arm zone 0`, `practice 0`,
//     `class: clean`.  So this patch closes the regions the gate can see and the
//     rounding class on a non-bhop map stays open -- in BACKLOG with that cfg as
//     its reproducer.
//
//  RESULT (2026-09-23, both arms run, driver exit 0 each way).  A textbook flip,
//   with the at-rest control identical on both builds:
//                        control (HEAD's sv_saveloc.qc)   fixed
//    A1 arm zone         -1 (armed from 0)                -1 (armed from 0)
//    A3 class            clean, practice 0                clean, practice 0
//    B1 arm zone         -1 (armed from 0)                0 (armed from 0)
//    B3 horizontal       147.0503                         153.1774
//    B4 class            clean, practice 0                segmented, practice 1
//    C1 horizontal       250.0000                         250.0000
//    C2 class            clean, practice 0                segmented, practice 1
//   So the load hands the body the row's 250.0000 u/s in its OWN packet on both
//   builds (C1), and only the fixed one refuses to launder the attempt: pre-fix
//   the same gesture produced a CLEAN run from a flying start (C2/B4), which is
//   the ranked board reading a stitched one.
//   TWO PREDICTIONS THIS FILE GOT WRONG, both recorded because both are facts
//   about the machine rather than about the fix:
//    - A1/B1 read `practice 1`/`segmented` while PARKED on both builds.  The arm
//      cannot land under a hold (Patch 428 runs no zone tests), so the parked
//      read shows the forced edge and nothing else; the class only moves at A3.
//      The gate's own observable is `arm zone`, which is why B1 is graded on it.
//    - B3 is not ~250: ground friction bleeds the released body to 147-153 in
//      the 120 ms before the read.  C1, in the load's own packet, is the exact
//      figure and is the one quoted.
log_enable 1
log_dir logs
log_name p435pre
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
sv_port 27662
sv_cheats 0
set run_resume 0
vid_fullscreen 0
waitms 5000
map bhop_eazy
waitmap 2400
waitms 3000
menu_restart
ui_close
waitms 1200

echo ==== Z the zone table this fixture runs under ====
zone_list
waitms 600
cmd sl_list
waitms 800

echo ==== A CONTROL: row 1, the same save at rest ====
cmd sl_goto 1
cmd sl_load
cmd sl_hold
waitms 900
echo ---- A1 armed / arm zone -1 (the gate fired); still tainted under the hold ----
cmd timer
waitms 700
echo ---- A2 velocity 0 while parked ----
cmd viewpos
waitms 500
cmd sl_holdoff
waitms 300
+jump
+forward
waitms 1000
-forward
-jump
waitms 400
echo ---- A3 running / practice 0 / clean ----
cmd timer
waitms 700
cmd viewpos
waitms 600

echo ==== B SUBJECT: row 2, the same save carrying 250 u/s ====
cmd sl_goto 2
cmd sl_load
cmd sl_hold
waitms 900
echo ---- B1 armed / arm zone 0 (the gate did NOT fire) / practice 1 ----
cmd timer
waitms 700
echo ---- B2 velocity 0 while parked ----
cmd viewpos
waitms 500
cmd sl_holdoff
waitms 120
echo ---- B3 the row's speed is in the body, bled by friction ----
cmd viewpos
waitms 200
+jump
+forward
waitms 700
-forward
-jump
waitms 400
echo ---- B4 running / practice 1 / segmented ----
cmd timer
waitms 700
cmd viewpos
waitms 600

echo ==== C SUBJECT, no hold: load row 2 alone and read the body at once ====
cmd sl_goto 2
cmd sl_load
echo ---- C1 horizontal exactly 250.0000, in the load's own packet ----
cmd viewpos
waitms 1200
echo ---- C2 THE DEFECT: control build reads practice 0 / clean ----
cmd timer
waitms 700
cmd viewpos
waitms 600

quit
