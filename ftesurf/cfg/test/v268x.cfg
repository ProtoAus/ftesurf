// V268X -- Patch 268c: windowed means MAXIMIZED, not "whatever vid_width says".
//
// THE REPORT, second time round.  "ok, but it windows at like 640x480, can't you make
// it windowed but full screen, but not boarderless? like with the top menu bar, but
// maximized?"
//
// 268b made vid_winmaximize mode 1 mean "honour the requested size only if the
// decorated window fits the work area".  ftesurf.cfg still archives vid_width 1920 /
// vid_height 1200 -- verified, it was not clobbered -- so something moved vid_width to
// a small value at RUNTIME, 640x480 fits the desktop comfortably, and the fit rule
// dutifully honoured it.  Both failures are the same mistake: inferring what window the
// player wants from a stale archived resolution.  The default is now 2, maximize.
//
// X1 deliberately reproduces that runtime state (vid_width 640 / vid_height 480) rather
// than a clean one.  A test that only ran at 1920x1200 would have passed 268b too.
//
// INSTRUMENT: screenshot dimensions.  The log's "Setting windowed mode W*H" prints the
// REQUESTED size and is identical across X1 and X2, which differ 1920x1111 vs 640x480.
//
// X1  THE REPORTED CASE: vid_width 640x480, borderless -> fullscreen_toggle
//         -> MUST be maximized (~1920x1111), MUST NOT be 640x480.
//         vid_winmaximize is deliberately NOT set here -- the DEFAULT is what is on
//         trial, so setting it would prove nothing about a fresh install.
// X2  FALSIFIER: same state, vid_winmaximize 1 -> MUST be exactly 640x480.
//         This is 268b's behaviour reproduced on demand. If X1 and X2 agree, the
//         default change did nothing and X1 passed for some other reason.
// X3  ESCAPE HATCH: vid_winmaximize 0 at 1920x1200 -> MUST be exactly 1920x1200,
//         proving an exact-size capture is still obtainable.
// X4  STARTUP PATH: vid_fullscreen 0 + vid_restart, default winmaximize, vid_width
//         still 640 -> MUST be maximized. F11 is not the only way in.

log_enable 1
log_dir "logs"
log_name "v268x"
developer 1
log_developer 1
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 0
con_notifytime 0
con_notifylines 0
con_notifytime_error 0

wait 200
echo ^5=== v268x: windowed must be maximized ===
echo ^5----- inherited state (vid_winmaximize must read 2, unset+default) -----
vid_winmaximize
vid_width
vid_height
vid_fullscreen

echo ^5----- X1: THE REPORTED CASE -- 640x480 requested, default winmaximize -----
vid_fullscreen_order 1
vid_width 640
vid_height 480
vid_fullscreen 1
vid_restart
waitms 6000
fullscreen_toggle
waitms 6000
screenshot v268x_z
waitms 900
screenshot v268x_1_reported_case
waitms 1200

echo ^5----- X2: FALSIFIER winmaximize 1 -> expect EXACTLY 640x480 -----
vid_winmaximize 1
vid_fullscreen 0
vid_restart
waitms 6000
screenshot v268x_z
waitms 900
screenshot v268x_2_falsifier_fitrule
waitms 1200

echo ^5----- X3: ESCAPE HATCH winmaximize 0 at 1920x1200 -> expect EXACTLY 1920x1200 -----
vid_winmaximize 0
vid_width 1920
vid_height 1200
vid_restart
waitms 6000
screenshot v268x_z
waitms 900
screenshot v268x_3_escape_exact
waitms 1200

echo ^5----- X4: STARTUP PATH -- vid_fullscreen 0, default winmaximize, stale 640 -----
vid_winmaximize 2
vid_width 640
vid_height 480
vid_fullscreen 0
vid_restart
waitms 6000
screenshot v268x_z
waitms 900
screenshot v268x_4_startup_path
waitms 1200

echo ^5=== v268x done ===
wait 30
quit
