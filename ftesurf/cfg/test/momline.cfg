// MOMLINE -- imported Momentum Mod runs: do they open, do they draw, and do the
// teleports come back without fabricating evidence?  log_name momline.
//
// The files are built by tools/momimport.py from wrlines' .wrpath extractor
// output.  All 2961 pass tools/reccheck.py with 0 faults, and three mutations
// (stray plane, exponent form, wrong end count) fault while the unchanged file
// passes -- so the grammar check discriminates and is not vacuously green.
// What it cannot say is whether the line lands on the map, which is this arm.
//
// PRE-REGISTERED, from tools/momimport.py's manifest.tsv, before running.
//  A1 CONTROL  surf_4am/stage_1/0000488_proto-2da02252_run.rec
//     508 samples, single leg.  Expect `508 of 508 samples, 508 shown, 0 tele`
//     and a speed range topping out near 2513 -- the demo's OWN
//     trackStats.maxHorizontalSpeed is 2513.1, and the importer's momquality
//     ratio for this file is 1.000, so the line must agree with the demo about
//     its own top speed.
//  A2 FLAGGED  surf_4am/main/0007210_de6438c2_run.rec
//     6810 samples, momquality ratio 2.548 against an oracle of 3130.4.  Expect
//     the speed range to top out near 7976, i.e. ~2.5x the speed the demo says
//     it reached.  THIS ARM EXISTS TO SHOW THE COST OF A CHOICE, not to pass:
//     velocity is imported untouched by instruction, and 7.6% of the corpus
//     spikes like this at coverage gaps because a central difference across a
//     missing tick divides a longer distance by the same two ticks.  If this
//     reads ~3130 instead, the importer is silently clamping and the header's
//     ratio is a lie.
//  A3 MULTI-LEG surf_ruse/main/0018126_doobie-1acfa76f_run.rec
//     16761 samples, 22 jumps over 256 units by the importer's own measure.
//     Expect `22 tele` AND `snaps 22 rec 0 kin` to read ZERO rec and 22 kin:
//     no warp record is written by the importer, on the grammar's own
//     instruction that a record synthesised from a discontinuity "would see the
//     jump and still not know what caused it".  A non-zero `rec` here means
//     something fabricated evidence.
//  A4 screenshots.  No count says the line is in the map rather than beside it,
//     and the camera is a DERIVED travel-direction angle (Momentum demos carry
//     no view angles at all), which only a picture can judge.
log_enable 1
log_dir "logs"
log_name momline
developer 0
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0
set run_resume 0
sv_public 0
sv_port 27692
set lobby_dir ""
set hud_watch_skipidle 0
set hud_watch_path_ahead 1
set hud_watch_path_color 0
wait 200
map surf_4am
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 1000
echo ^5=== momline A1 control (expect 508 samples, 0 tele, speed max ~2513) ===
replay data/momentum/surf_4am/stage_1/0000488_proto-2da02252_run.rec
waitms 1200
replay status
replay pause
replay seek 3.5
waitms 1200
replay status
screenshot screenshots/momline_a1.png
echo ^5=== momline A2 flagged (expect speed max ~7976 = 2.5x the demo's own 3130) ===
replay data/momentum/surf_4am/main/0007210_de6438c2_run.rec
waitms 1500
replay status
replay pause
replay seek 40
waitms 1200
replay status
screenshot screenshots/momline_a2.png
replay stop
waitms 500
echo ^5=== momline A3 multi-leg on surf_ruse ===
map surf_ruse
waitmap 1800
waitms 3000
ui_close
waitms 1000
echo ^5=== momline A3 (expect 16761 samples, 22 tele, snaps 0 rec 22 kin) ===
replay data/momentum/surf_ruse/main/0018126_doobie-1acfa76f_run.rec
waitms 2500
replay status
replay pause
replay seek 120
waitms 1500
replay status
screenshot screenshots/momline_a3.png
echo ^5=== momline A4 colour modes over an imported line ===
hud_watch_path_color 1
waitms 800
replay status
hud_watch_path_color 2
waitms 800
replay status
hud_watch_path_color 0
waitms 400
replay stop
waitms 500
// A5 THE PROVENANCE TINT, and its control.  `foreign` is the LINE's own latched
// state and `tint` is the blend the emitter last drew with -- not a re-read of
// the cvar, which would pass against a build where the tint never reached
// Line_Feed.  Three states are graded and the arm is worthless without all
// three: an imported file must read `foreign 1 tint 0.55`; a LOCAL file on the
// same map must read `foreign 0 tint 0.00`, which is what proves the flag is
// not simply stuck on; and the imported file at hud_watch_path_foreign 0 must
// read `foreign 1 tint 0.00`, which separates "this run is imported" from "the
// tint is switched on" -- two facts the one number would otherwise conflate.
map surf_4am
waitmap 1800
waitms 3000
ui_close
waitms 1000
echo ^5=== momline A5a imported (expect foreign 1 tint 0.55) ===
replay data/momentum/surf_4am/stage_1/0000488_proto-2da02252_run.rec
waitms 1200
replay status
screenshot screenshots/momline_a5_tinted.png
// The control must be a file with SAMPLES.  data/runs/surf_4am/main/0019132_lobby.rec
// is cl_lobbytime.qc's 12-line stub -- `samples 0` -- so `replay` refuses it and
// leaves the PREVIOUS line loaded, and the status then reports the imported
// run's own numbers again: 152 pts, 108 draws, speed 283..2513, foreign 1,
// identical to A5a. A control that cannot load is a control that grades the
// subject it was meant to replace.  cheat.rec is a real 20416-sample recording.
echo ^5=== momline A5b CONTROL, a local run (expect foreign 0 tint 0.00) ===
replay data/runs/surf_4am/main/cheat.rec
waitms 1200
replay status
screenshot screenshots/momline_a5_local.png
echo ^5=== momline A5c imported with the tint off (expect foreign 1 tint 0.00) ===
replay data/momentum/surf_4am/stage_1/0000488_proto-2da02252_run.rec
waitms 800
hud_watch_path_foreign 0
waitms 800
replay status
screenshot screenshots/momline_a5_untinted.png
hud_watch_path_foreign 0.55
waitms 400
replay stop
waitms 300
quit
