// MOMLINE -- imported Momentum Mod runs: do they open, do they draw, and do the
// teleports come back without fabricating evidence?  log_name momline.
//
// The files are tools/momreimport.py's since 4 Oct 2026: each run decoded
// from its own .mtv (tools/momreplay.py), one sample per tick, real eye angles,
// velocity, ground/duck/jump and the move from the recorded wishVel.  All 5281
// pass tools/reccheck.py with 0 faults, and a mutant whose key bit the moves do
// not carry faults -- so the grammar check discriminates.  What it cannot say
// is whether the line lands on the map, which is this arm.  (Until 4 Oct they
// were tools/momimport.py's, from wrlines' .wrpath: positions only.)
//
// PRE-REGISTERED, from the re-imported files themselves, before running.
//  A1 CONTROL  surf_4am/stage_1/0000488_proto-2da02252_run.rec
//     608 samples (119 of them the pre-roll), single leg.  Expect a speed range
//     topping out near 2513 -- the demo's OWN trackStats.maxHorizontalSpeed is
//     2513.1 and momquality reads 1.0000.
//  A2 RE-IMPORTED MAIN  surf_4am/main/0012387_proto-2da02252_run.rec
//     12507 samples.  Expect the speed range to top out near 3317 = the demo's
//     own 3317.1.  The .wrpath import of this run had 11294 samples; the old A2
//     file (0007210_de6438c2, a 2.5x spike) left the tree with an earlier import.
//  A3 MULTI-LEG surf_ruse/main/0018126_doobie-1acfa76f_run.rec
//     18243 samples, 23 steps over 256 units between consecutive samples.
//     Expect `snaps 0 rec <n> kin` with n near 23 -- ZERO rec: no warp record
//     is written by the importer, on the grammar's own instruction that a
//     record synthesised from a discontinuity "would see the jump and still not
//     know what caused it".  A non-zero `rec` here means something fabricated
//     evidence.
//  A4 screenshots.  No count says the line is in the map rather than beside it,
//     and the camera is now the player's own eye angle, which only a picture
//     can judge.
log_enable 1
log_dir "logs"
log_name momline
developer 0
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0
set run_resume 0
sv_public 0
sv_port 27692
set lobby_dir ""
set hud_watch_skipidle 0
set hud_watch_path_ahead 1
set hud_watch_path_color 0
wait 200
map surf_4am
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 1000
echo ^5=== momline A1 control (expect 608 samples, speed max ~2513) ===
replay data/momentum/surf_4am/stage_1/0000488_proto-2da02252_run.rec
waitms 1200
replay status
replay pause
replay seek 3.5
waitms 1200
replay status
screenshot screenshots/momline_a1.png
echo ^5=== momline A2 re-imported main (expect 12507 samples, speed max ~3317 = the demo's own) ===
replay data/momentum/surf_4am/main/0012387_proto-2da02252_run.rec
waitms 1500
replay status
replay pause
replay seek 40
waitms 1200
replay status
screenshot screenshots/momline_a2.png
replay stop
waitms 500
echo ^5=== momline A3 multi-leg on surf_ruse ===
map surf_ruse
waitmap 1800
waitms 3000
ui_close
waitms 1000
echo ^5=== momline A3 (expect 18243 samples, snaps ~23, 0 rec) ===
replay data/momentum/surf_ruse/main/0018126_doobie-1acfa76f_run.rec
waitms 2500
replay status
replay pause
replay seek 120
waitms 1500
replay status
screenshot screenshots/momline_a3.png
echo ^5=== momline A4 colour modes over an imported line ===
hud_watch_path_color 1
waitms 800
replay status
hud_watch_path_color 2
waitms 800
replay status
hud_watch_path_color 0
waitms 400
replay stop
waitms 500
// A5 THE PROVENANCE TINT, and its control.  `foreign` is the LINE's own latched
// state and `tint` is the blend the emitter last drew with -- not a re-read of
// the cvar, which would pass against a build where the tint never reached
// Line_Feed.  Three states are graded and the arm is worthless without all
// three: an imported file must read `foreign 1 tint 0.55`; a LOCAL file on the
// same map must read `foreign 0 tint 0.00`, which is what proves the flag is
// not simply stuck on; and the imported file at hud_watch_path_foreign 0 must
// read `foreign 1 tint 0.00`, which separates "this run is imported" from "the
// tint is switched on" -- two facts the one number would otherwise conflate.
map surf_4am
waitmap 1800
waitms 3000
ui_close
waitms 1000
echo ^5=== momline A5a imported (expect foreign 1 tint 0.55) ===
replay data/momentum/surf_4am/stage_1/0000488_proto-2da02252_run.rec
waitms 1200
replay status
screenshot screenshots/momline_a5_tinted.png
// The control must be a file with SAMPLES.  data/runs/surf_4am/main/0019132_lobby.rec
// is cl_lobbytime.qc's 12-line stub -- `samples 0` -- so `replay` refuses it and
// leaves the PREVIOUS line loaded, and the status then reports the imported
// run's own numbers again: 152 pts, 108 draws, speed 283..2513, foreign 1,
// identical to A5a. A control that cannot load is a control that grades the
// subject it was meant to replace.  cheat.rec is a real 20416-sample recording.
echo ^5=== momline A5b CONTROL, a local run (expect foreign 0 tint 0.00) ===
replay data/runs/surf_4am/main/cheat.rec
waitms 1200
replay status
screenshot screenshots/momline_a5_local.png
echo ^5=== momline A5c imported with the tint off (expect foreign 1 tint 0.00) ===
replay data/momentum/surf_4am/stage_1/0000488_proto-2da02252_run.rec
waitms 800
hud_watch_path_foreign 0
waitms 800
replay status
screenshot screenshots/momline_a5_untinted.png
hud_watch_path_foreign 0.55
waitms 400
replay stop
waitms 500
// A6 THE VELOCITY FLAG.  The operator chose "import untouched, flag only" for
// the 7.6% of demos whose derived velocity exceeds the speed the DEMO ITSELF
// reports -- so the flag has to be visible, or "flag only" means "no flag".
// No re-imported file is flagged (every one reads 1.0000), so the flagged half
// is a FIXTURE: cfg/test/momflag.rec, Lex's surf_skatelife stage 7 run as the
// .wrpath import wrote it -- momquality 3.7653 of 1850.6 u/s, and its old
// `startseg 7` with it.
//   FLAGGED cfg/test/momflag.rec on surf_skatelife.  Expect a ^3 line at open
//           naming 3.8x, and `replay status` to read `momquality 3.7653 of
//           1851 u/s  OVER ITS OWN CEILING`.
//   CLEAN   surf_me/main/0009346_proto-2da02252_run.rec, momquality 1.0000.
//           Expect NO warning at open and `momquality 1.0000 of 4079 u/s` with
//           no ceiling note. This is the half that proves the flag
//           discriminates rather than firing on every import.
//   FIXED   surf_me/main/0008253_vooidt-990c104c_run.rec, the old flagged
//           subject (3.0935, a 12121 u/s peak).  Re-imported it reads 1.0000 of
//           3918 u/s and must raise NO warning.
// All are imports, so `foreign 1` on all: the arm separates "is imported"
// from "disagrees with its own source", which are different facts.
map surf_skatelife
waitmap 1800
waitms 3000
ui_close
waitms 1000
echo ^5=== momline A6a FLAGGED fixture (expect a warning, momquality 3.7653) ===
replay cfg/test/momflag.rec
waitms 1500
replay status
replay stop
waitms 500
map surf_me
waitmap 1800
waitms 3000
ui_close
waitms 1000
echo ^5=== momline A6b CLEAN (expect NO warning, momquality 1.0000) ===
replay data/momentum/surf_me/main/0009346_proto-2da02252_run.rec
waitms 1500
replay status
echo ^5=== momline A6c FIXED (expect NO warning, momquality 1.0000 of 3918) ===
replay data/momentum/surf_me/main/0008253_vooidt-990c104c_run.rec
waitms 1500
replay status
replay stop
waitms 300
quit
