// Build 32 -- the three ghost fixes, end to end.
//
// 1. A FORCED ANGLE MUST LAND ON THE BODY, NOT THE CAMERA.
//
//    The report is "enter ghost, the body touches a teleport, the view spins".
//    trigger_teleport_touch snaps your aim to the destination's yaw by writing
//    .v_angle and setting .fixangle, the engine sends that as an svc_setangle,
//    and the client obeys one by writing cl.playerview.viewangles -- which is
//    the ghost camera, because Ghost_Frame leaves VF_CL_VIEWANGLES to the
//    mouse.
//
//    zone_goto <n> <yaw> <pitch> is the same three lines (SV_ZoneGotoAng sets
//    .angles, .v_angle and .fixangle exactly as the teleport does) with a
//    DETERMINISTIC value, which a teleport does not have.  Same client path,
//    same packet, a number this file chose.  So it proves the fix rather than
//    approximating it.
//
//    `ghost status` prints the two aims on separate rows, added this build for
//    this: `body ... yaw` is rec_gh_bodyang, `camera ... yaw` is the live
//    VF_CL_VIEWANGLES.  Both rows print whether or not you are ghosting.
//
//    The shape to read in the log:
//      A. not ghosting -- both rows follow the number.  The engine unchanged.
//      B. ghosting     -- body follows, CAMERA DOES NOT MOVE, absorbed climbs.
//      C. on exit      -- camera adopts the body's aim, so you come back facing
//                         where the teleport meant you to.  This is the part
//                         that makes it "delivered" rather than "suppressed".
//      D. after ghost  -- A again, proving the hook is inert when it should be.
//
// 2. FLY SPEED == NOCLIP SPEED.  pm_noclipspeed x sv_maxspeed = 4 x 260 = 1040.
//    Measured, not asserted: hold +forward for a known wall-clock time and
//    difference the camera origin `ghost status` prints.
//
// 3. +speed DOUBLES IT, as it does in noclip.  Same measurement with the key
//    held, and the status row says whether the bit is arriving at all
//    (in_speedbutton is what carries it, and without it there is no walk key
//    either -- so a 0 there is a config fault, not a ghost fault).

waitms 2000

echo ^5=== b32a: ghost angles, ghost speed, +speed ===

scr_conalpha 0
con_notifytime 0
cl_idlefps 0

map surf_null
waitmap 240
wait 60

// ---------------------------------------------------------------------------
echo ^5--- A. NOT ghosting: the engine's own behaviour, twice ---
// Both aim rows must follow the number.  If they do not, the control is broken
// and nothing below means anything.
cmd zone_goto 0 90 0
waitms 400
ghost status
waitms 300

cmd zone_goto 0 200 0
waitms 400
ghost status
waitms 300

// ---------------------------------------------------------------------------
echo ^5--- B. ghosting: the body follows, the camera must not ---
ghost on
waitms 600
echo ^5(baseline -- camera yaw here is the one that must survive C)
ghost status
waitms 300

// FIRST RUN OF THIS FILE FOUND A BUG IN THE FIX IT WAS WRITTEN TO CHECK, and
// the expected values below are the corrected ones.  The engine sends these as
// a DELTA already added to viewangles, and viewangles while detached is the
// camera -- so absorbing the arriving angle verbatim applied a delta computed
// against the body to the camera's reference.  It landed at -250 for a
// requested 315 (= -160 + (315 - 44), the right delta on the wrong reference)
// and read like a plausible angle rather than like a fault.  Ghost_SetAngles
// undoes the engine's reference before re-applying it; the numbers to look for
// are now the ones that were asked for.
echo ^5(expect: body yaw 45, camera yaw -160 unmoved, absorbed 1)
cmd zone_goto 1 45 0
waitms 400
ghost status
waitms 300

echo ^5(expect: body yaw -45 == 315, camera yaw STILL -160, absorbed 2)
cmd zone_goto 0 315 0
waitms 400
ghost status
waitms 300

// ---------------------------------------------------------------------------
echo ^5--- 2. speed: 1040 u/s expected (4 x 260) ---
ghost speed
waitms 300

// Two seconds of +forward.  Distance between the camera rows / 2 == u/s.
echo ^5(mark 1)
ghost status
+forward
waitms 2000
-forward
waitms 300
echo ^5(mark 2 -- expect ~2080 units from mark 1)
ghost status
waitms 300

// ---------------------------------------------------------------------------
echo ^5--- 3. +speed: 2080 u/s expected ---
+speed
waitms 300
echo ^5(the +speed row must say `held`; `UNREADABLE` means in_speedbutton 0)
ghost status
waitms 300

echo ^5(mark 3)
ghost status
+forward
waitms 2000
-forward
waitms 300
echo ^5(mark 4 -- expect ~4160 units from mark 3, twice mark 1->2)
ghost status
-speed
waitms 300

// ---------------------------------------------------------------------------
echo ^5--- an explicit override still overrides, and still doubles ---
ghost speed 500
waitms 400
ghost status
waitms 300
ghost speed 0
waitms 400
ghost speed
waitms 300

// ---------------------------------------------------------------------------
echo ^5--- C. leaving: the camera adopts the body's aim (expect yaw -45) ---
ghost off
waitms 600
ghost status
waitms 300

// ---------------------------------------------------------------------------
echo ^5--- D. not ghosting again: the hook must be inert ---
cmd zone_goto 0 120 0
waitms 400
ghost status
waitms 300

echo ^5=== b32a done ===
wait 30
quit
