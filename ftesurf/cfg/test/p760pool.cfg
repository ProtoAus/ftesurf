// Patch 760: a board line holds its whole run wherever it is ticked; the pool fills
// and empties.
//   python tools/runlines_smoke.py ftesurf/cfg/test/p760pool.cfg --timeout 500
//       --put data/test/kit.rec=<a surf_kitsune run over 8,192 samples (Lex's PB: 10,252)>
//       --put data/test/long.rec=<a run of 50-60k samples (bhop_monster_jam cheat.rec: 58,353)>
//   python tools/test_p760pool.py <this rig>/ftesurf
// FULL: the same file as lines 1, 9 and 64 (slots 1, 11, 66: before this patch the last
// two kept 8,192 and halved it).  FILL: that and 19 copies of the long run; the pool
// (991,232 samples in two ranges either side of the live run) holds 15 of them whole.  FREED / REUSE: lines 5 and 6 off, their
// regions joined, the Kitsune run back in line 5 inside them.  CLEAR: the pool whole.
cfg_save_auto 0
name LinePool
log_enable 1
log_dir logs
log_name runlines_smoke
con_notifytime 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
vid_width 1600
vid_height 900
waitms 2000
map surf_kitsune
waitmap 60
waitms 5000
menu_restart
ui_close
set hud_lines_board 1
scores lineat 1 data/test/kit.rec
scores lineat 9 data/test/kit.rec
scores lineat 64 data/test/kit.rec
waitms 8000
wait 4
echo ==== FULL ====
scores lines
lines native
screenshot p760_full.png
scores lineat 2 data/test/long.rec
scores lineat 3 data/test/long.rec
scores lineat 4 data/test/long.rec
scores lineat 5 data/test/long.rec
scores lineat 6 data/test/long.rec
scores lineat 7 data/test/long.rec
scores lineat 8 data/test/long.rec
scores lineat 10 data/test/long.rec
scores lineat 11 data/test/long.rec
scores lineat 12 data/test/long.rec
scores lineat 13 data/test/long.rec
scores lineat 14 data/test/long.rec
scores lineat 15 data/test/long.rec
scores lineat 16 data/test/long.rec
scores lineat 17 data/test/long.rec
scores lineat 18 data/test/long.rec
scores lineat 19 data/test/long.rec
scores lineat 20 data/test/long.rec
scores lineat 21 data/test/long.rec
waitms 120000
wait 4
echo ==== FILL ====
scores lines
lines native
// Two neighbours off: their regions join; a run ticked again lands in the hole.
scores lineoff 5
scores lineoff 6
waitms 500
wait 4
echo ==== FREED ====
lines native
scores lineat 5 data/test/kit.rec
waitms 8000
wait 4
echo ==== REUSE ====
scores lines
lines native
scores lines clear
waitms 1000
wait 4
echo ==== CLEAR ====
scores lines
lines native
echo RUNLINES COMPLETE
waitms 100
quit
