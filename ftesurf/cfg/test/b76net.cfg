// Build 76, arm 3: the counted clock RANKING, on a live public lobby.
//
// WHY A THIRD ARM, when b76clock.cfg and b76frz.cfg both passed.  They ran on a
// loopback listen server, and the whole argument for the counted clock is about
// something loopback does not have: the sampled clock was a function of when
// PACKETS ARRIVED and where the server's FRAME LOOP landed, neither of which is
// in the usercmd stream.  On loopback there is no arrival delay to measure and
// one client to schedule, so the property under test is structurally absent --
// which is exactly why the eighteen live readings that produced build 75's
// "sampled is always >= counted" all went one way, and why b76clock.cfg
// measured -1 the moment the network was taken away.  A loopback pass says the
// arithmetic is right.  Only this says the deployment is.
//
// AND IT IS NOW THE RANKING CLOCK, which is what makes this different from
// p325net.cfg, whose arm this borrows.  That file measured a number nothing
// consumed.  If the counter is not published on the fleet -- an engine and a
// qwprogs deployed out of order -- then `ranks sampled` prints here, the run
// carries TF_NOCLOCK, surfd demotes it, and every time set on this server is
// one no verifier can recompute.  That is the single reading this arm exists
// for, and it is a property of the DEPLOY rather than of the code.
//
// NO CHEATS ON A LOBBY (maxclients 32, so sv_cheats is false), so the run has to
// be started by actually playing: walk out, dwell past run_t_dwell, jump inside
// the start box.  And it CANNOT be finished from a config -- crossing an end
// zone wants a noclip flight -- so SV_RecClose is never reached, no .rec is
// written and no board row appears.  That is what makes it safe to point at a
// public server, and it was verified after the last one: /api/board still
// "rows":[].
//
// PREDICTIONS, REGISTERED BEFORE THE RUN:
//
//   N1  Before the run: `tick: not latched`, and `ranks sampled` -- run_t_clock
//       is torn down with the attempt, so an idle player is on no clock at all.
//       Build 75 shipped `counted 0 sampled 9033 gap 9033` here.
//   N2  Once running: `ranks counted` on every reading.  THIS IS THE ARM.  A
//       `sampled` here means the fleet's engine is not publishing and every
//       ranked time on this server is unverifiable.
//   N3  `rate 0.01` with no MISMATCH -- bhop_eazy is a bhop map, so the mover
//       and cvar("pm_ticrate") must BOTH read 0.01.  A mismatch here is the
//       build 64 defect and would scale every board time by 1.5x, because since
//       this build Lobby_SubmitRun sends the MOVER's rate.
//   N4  The gap.  NOTHING IS PREDICTED ABOUT ITS SIGN OR ITS BOUND.  Three
//       claims about it have now been withdrawn -- a max of 1 falsified at
//       eighteen readings, and "always non-negative" falsified by a -1 on
//       loopback the same day.  The readings are recorded and nothing is
//       asserted from them.  Stated as a prediction anyway, because "I will not
//       conclude anything" is the honest content of this line.
//
// FALSIFIED IF: `ranks sampled` appears during the run; or the rate line reads
//          MISMATCH or `no engine value` once the mover has published; or a run
//          fails to start at all, which would mean the dwell rule moving onto
//          SV_ClockSec changed which jumps qualify.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name b76net
developer 0

waitms 4000
connect play.proto.bar:27540
waitms 12000

echo ================================ B76NET -- connected, before the run.  N1.
cmd timer
waitms 1500

echo ================================ B76NET -- walk, dwell, jump
+forward
waitms 2500
cmd timer
waitms 500

// Dwell: run_t_dwell is 0.25s, so a full second on the ground qualifies the hop.
// Build 76 measures that second in SIMULATED seconds rather than wall seconds --
// if the rule broke, the run below never starts and every reading stays latched.
-forward
waitms 1200
+jump
waitms 200
-jump
waitms 800

echo ================================ B76NET -- should be running now.  N2/N3.
cmd timer
waitms 500
+forward
waitms 2000

echo ================================ B76NET -- reading 1
cmd timer
waitms 2500
+jump
waitms 150
-jump
echo ================================ B76NET -- reading 2
cmd timer
waitms 2500
+jump
waitms 150
-jump
echo ================================ B76NET -- reading 3
cmd timer
waitms 2500
echo ================================ B76NET -- reading 4
cmd timer
waitms 2000
-forward
waitms 1000
echo ================================ B76NET -- reading 5 (stopped)
cmd timer
waitms 2000
echo ================================ B76NET -- reading 6
cmd timer
waitms 2000

echo ================================ B76NET done -- writes nothing to the board
disconnect
waitms 1000
quit
