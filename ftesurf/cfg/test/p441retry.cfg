cfg_save_auto 0

// ===========================================================================
//  P441RETRY -- `retry` across a map_restart, with the recorder switched off.
//    python tools/p441void.py --arm retry
//  No zones override, and the three save fixtures the driver stages for every arm
//  are INERT here: the retry point is slot 0, written by the run itself, which is the
//  whole reason this path needs its own arm.  (The header used to say "no fixture";
//  the driver stages 901/902/903 unconditionally.)
//
//  THE DEFECT, AND IT IS ROUND 3'S OWN.  Patch 441's void asks whether a RUNNING
//  attempt has been left without evidence it was supposed to have.  Round 3 answered
//  with `SV_RecEnabled() || hadrec` and dropped the save's `reclines`, on the grounds
//  that a file's claim is not a fact about this run.  On the RETRY path both of those
//  clauses are blind:
//    - `map_restart` re-initialises the progs, so `e.run_t_flags` is 0 by the time
//      SV_RetryApply runs and `hadrec` is structurally FALSE (that globals do not
//      survive is why the arming flag travels in a cvar -- `cvar_set("rec_retry_armed",
//      "1")` in SV_RetryPoint, latched back at map init);
//    - SV_RecEnabled() is FALSE, because the operator has just set `rec_enable 0`.
//  And the retry branch of SV_SaveApplyState restores run_t_flags, run_t_dirty and
//  run_t_cheat VERBATIM -- no SV_TimerStitched, by design, because a retry does not
//  move you.  So a CLEAN, RANKABLE, RUNNING attempt carried on across the restart
//  with no recorder, and SV_RetryApply then fremoved the prefix the run had written
//  moments earlier.  No message of any kind.  Patch 434 voided this; round 2's
//  `mark > 0 || wasrec` voided it through `mark`; round 3 was the first cut that did
//  not, and an independent review of round 3 found it.
//
//  THE FIX (round 4, corrected in round 5).  A third clause, and only on the retry
//  path: `retry && (flg & TF_RECORDING)` -- the RUN's own bit, out of the file.
//  SV_SaveWriteState masks only TF_FROZEN|TF_STOPPED|TF_NONCE out of the flags word,
//  so TF_RECORDING survives into state.txt, and the loader still holds it in `flg`
//  (the live flags are assigned from `flg` minus that bit, which is the only reason
//  it looked unavailable).  Round 4 first used `mark > 0` -- `reclines`, i.e. whether
//  a prefix FILE got written -- and a reviewer showed that misses the case it was
//  added for: the write can fail with the recorder still live (SV_RecWritePrefix), and
//  on a streamed save the count is positive for a copy that has only been QUEUED.
//  On the LOAD path neither number may be read as this run's expectation: there the
//  file is some earlier session's, which is how round 2 put the absence trap back.
//
//  ARMS, in log order:
//   C1  leave the start box: `timer: running`, `recording 1`.
//   C2  THE PREMISE: `rec_enable 0` while that run records, and `cmd timer` must
//       STILL read `recording 1` -- the cvar is read at SV_RecOpen and nowhere per
//       sample (SV_RecOpen), so the prefix this arm depends on does get
//       written.  If this reads `recording 0` there is no prefix and no subject.
//   S   SUBJECT: `retry`, then read the timer after the restart.  The server's own
//       last word on the path is the observable: SV_RetryApply prints
//       `retry -- run restored at <clock>` when the restored state is RUNNING and
//       `retry -- back where you were` when it is not, so which of the two appears
//       says whether the void ran, in the subject's own words.
//
//  PRE-REGISTERED PREDICTIONS
//   C1  `timer: running`, `recording 1`.
//   C2  `timer: running`, `recording 1`.
//   S   CONTROL (FTESurf 58ef286, Patch 441 round 3): `retry -- run restored at
//       0:0N.NNN`, NO cancel line, `timer: running`, `practice 0`, `class: clean`,
//       `recording 0`, `recorder: buffer -1`.  A clean rankable run with no recorder.
//   S   FIXED: `run cancelled (the save's recording could not be restored)`,
//       `retry -- back where you were`, `timer: idle`.
//  FALSIFIED IF C2 reads `recording 0` (no prefix is written and the subject is a
//   different case), or S prints neither retry line (the retry did not land at all --
//   `rec_retry 0`, or more than one player on the server, both of which refuse it),
//   or S reads `running` on the fixed build, or `idle` on the control build.
//
//  RESULT (2026-09-26, both builds, driver exit 0 each way; qwprogs
//   3096B6F5468BEE3A fixed / 63AF428049260231 control -- the control is Patch 441
//   ROUND 3 (58ef286), the first cut that failed to void here, built in a worktree.
//   Logs kept as ftesurf/logs/p441retry.log.fixed and .control, each with a .hash
//   beside it naming the build that wrote it.)
//   C1 `timer: running`, `recording 1`.
//   C2 after `rec_enable 0`: still `timer: running`, `recording 1` -- so the prefix
//      this arm depends on is written.  Both builds.
//   S  CONTROL: `retry -- run restored at 0:04.080` -- the clock the run held when
//      the key was pressed, NOT the 0:05.000 the other arms' fixtures carry (this arm
//      has no fixture; an earlier write-up of this block put 0:05.000 here and the
//      commit message repeated it) -- NO cancel line, `timer: running` with the clock
//      counting on to 0:05.120 by the time it is read, `practice 0`, `class: clean`,
//      `recording 0`, `recorder: buffer -1`.  A CLEAN, RANKABLE, RUNNING attempt with
//      no recorder, and SV_RetryApply has already removed the prefix.
//      `practice 0`, `class: clean` and `recorder: buffer -1` read the SAME on the
//      fixed side (an idle report's defaults, and the void discards the recorder
//      too), so they describe the control's state without discriminating it.
//   S  FIXED: `run cancelled (the save's recording could not be restored)`,
//      `retry -- back where you were`, `timer: idle`, `stopped 1`.
//   `retrysay` is the discriminating field together with `cancel` and `state`; it also
//   proves the retry LANDED, which `rec_retry 0` or a second player would prevent and
//   which nothing else in the log would show.
//   WHAT THIS ARM DOES PROVE ABOUT THE EXPRESSION, which is worth one line because
//   fteqcc does not short-circuit `||` and a bitwise `&` inside one is the kind of
//   thing that compiles to something else: on THIS path clauses 1 and 2 are both
//   FALSE -- C2 shows `rec_enable 0`, and the map_restart re-initialises the progs so
//   `hadrec` is 0 -- so the void can only come from `retry && (flg & TF_RECORDING)`.
//   The fixed side cancels and the control (round 3, the same predicate MINUS this
//   clause) does not.  So the clause is individually necessary and sufficient here,
//   and the compiled expression evaluates TRUE for a flags word with the bit set.
//   WHAT THIS ARM CANNOT SAY, since p441mid.cfg had to admit the same: which CLAUSE
//   fired.  On the fixed side a cancel from SV_RecEnabled() and one from the retry
//   clause are byte-identical in the log, and nothing prints whether `rec_enable 0`
//   survived the map_restart.  The attribution rests on the control run -- round 3,
//   which has only the first two clauses -- not cancelling.  A cross-build inference,
//   like mid's.
log_enable 1
log_dir logs
log_name p441retry
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
sv_port 27697
sv_cheats 0
set run_resume 0
vid_fullscreen 0
waitms 5000
map bhop_eazy
waitmap 2400
waitms 3000
menu_restart
ui_close
waitms 1200

echo ==== C1 leave the start box: must read running / recording 1 ====
+forward
waitms 1500
-forward
waitms 700
cmd timer
waitms 800

echo ==== C2 rec_enable 0 UNDER the running recorder: still recording 1 ====
rec_enable 0
waitms 600
cmd timer
waitms 800

echo ==== S SUBJECT: retry, which restarts the map around the run ====
retry
waitmap 2400
waitms 3000
cmd timer
waitms 1000

quit
