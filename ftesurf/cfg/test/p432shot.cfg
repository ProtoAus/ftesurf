// P432SHOT -- Patch 432, the run line: every sample, 1 px anti-aliased, red (slow) to
// green (fast), teleports as squares + a faint dashed line.  surf_rookie r47 at stage
// 5 (cut), then the whole run; `replay status` after each for the draw's cost and
// counts.  Screenshots under screenshots/screenshots/p432_*.png.
//
// RESULT (2026-09-22): stage cut `344 of 344 samples, 343 shown, 1 tele`, 153 segments,
//  a smooth soft-edged line (4x crop) with a square at the teleport's end; whole run
//  at t 20 with far 6000: 605 segments, the sky lines faded; playing: the mouse pad's
//  trail anti-aliased (crop).  The straight blue line across the t 20 shot is the
//  map's (it is there with hud_watch_path 0).
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p432shot
developer 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0
set run_resume 0
sv_public 0
sv_port 27683
set lobby_dir ""
set hud_watch_skipidle 0
set hud_watch_path_ahead 1

wait 200
map surf_rookie
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 1000
echo ^5=== p432shot stage ===
replay online 47 5
replay pause
replay seek 34.3
waitms 1500
replay status
screenshot screenshots/p432_stage.png
waitms 500
echo ^5=== p432shot whole ===
replay cut 0
replay seek 20
waitms 1500
replay status
screenshot screenshots/p432_whole.png
waitms 500
replay seek 60
waitms 1500
screenshot screenshots/p432_whole60.png
waitms 500
echo ^5=== p432shot playing ===
replay seek 36
replay play
waitms 700
screenshot screenshots/p432_play.png
waitms 500
replay status
replay stop
quit
