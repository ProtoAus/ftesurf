// P404PAD -- the mouse pad's trail colour follows WHICH strafe key steers, and the later press
// wins it: blue for +moveleft, orange for +moveright (listen server, headless-ish).
//   ftesurf64.exe +set vid_winmaximize 0 -WindowStyle Minimized +exec cfg/test/p404pad.cfg
// `vote key <scan> <0|1>` runs the input chain so Keys_Edge believes the key (its bind never
// runs) -- the same lever p399keys.cfg uses.  Scancodes: 97 = a (+moveleft), 100 = d (+moveright).
// The ORACLE IS THE `mousepad` PRINT, not pixels: Patch 404 added
//   keys a<0|1> d<0|1>  newer <a|d|->  colour <blue|orange> ...
// which states ui_mp_pa/ui_mp_pd, the rising-edge latch and the colour it resolves to.  p399keys
// read the trail's pixels and MISSED an arm because the held samples had faded by the shot; the
// print cannot fade.  Screenshots are kept as corroboration only.
//
// PREDICTIONS (registered before the run):
//  A0 nothing held:            a0 d0  newer -  blue
//  A1 a down:                  a1 d0  newer a  blue      (+moveleft steers)
//  A2 d down over a:           a1 d1  newer d  ORANGE    (later press wins; cl_iDrive 1)
//  A3 d up, a still held:      a1 d0  newer d  blue      <-- the regression this arm exists for:
//      the latch only turns on a RISING edge, so it still reads `d`; the colour must not.
//  A4 a up (none held):        a0 d0  newer -  blue
//  A5 d alone:                 a0 d1  newer d  ORANGE
//  A6 a down over d:           a1 d1  newer a  blue      (later press wins the other way)
//  A7 a up, d still held:      a0 d1  newer a  ORANGE    <-- mirror of A3
//  A8 all up:                  a0 d0  newer -  blue
//  CONTROL C1 cl_iDrive 0, both held: the engine lets them cancel, but the pad still has to name
//      one -- A2's rule is unchanged, so a1 d1 newer d ORANGE.  Recorded to show the cvar is not
//      silently steering the colour.
//
// RESULTS 2026-09-20 15:16 (logs/p404pad.log, run twice, identical both times): ALL TEN ARMS AS
//  PREDICTED.  a0d0 newer- blue / a1d0 newer-a blue / a1d1 newer-d ORANGE / a1d0 newer-d BLUE (A3)
//  / a0d0 newer- blue / a0d1 newer-d ORANGE / a1d1 newer-a blue / a0d1 newer-a ORANGE (A7) /
//  a0d0 newer- blue / C1 a1d1 newer-d ORANGE.
//  A3 and A7 are the ones worth reading twice: the latch still says `d` (A3) and `a` (A7) because
//  it only turns on a rising edge, and the COLOUR correctly ignores it and follows the key that is
//  actually still down.  Reading the latch alone would have been wrong in both.
//
// WHAT THIS DOES NOT TEST: a real keyboard.  `vote key` drives CSQC_InputEvent, which is the same
//  entry Keys_Edge sees, so the resolution logic is exercised end to end -- but the scancode ->
//  bind step (getkeybind, Keys_Action) is the part a real key press adds, and p399keys.cfg's
//  header carries the same caveat.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p404pad
developer 0
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
sv_port 27647
sv_cheats 0
set run_resume 0
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_conautoscale 0
vid_conwidth 1280
vid_conheight 720
waitms 5000
map bhop_eazy
waitmap 1800
set hud_mouse 1
set hud_mouse_x -1
set hud_mouse_y -1
set hud_debug 0
set cl_iDrive 1
set hud_mouse_trail 1
set sensitivity 1
set m_yaw 0.022
set in_xflip 0
waitms 500

echo ==== A0 none ====
mousepad
waitms 200
echo ==== A1 a ====
vote key 97 1
waitms 200
mousepad
waitms 200
echo ==== A2 a+d, d later ====
vote key 100 1
waitms 200
mousepad
waitms 200
echo ==== A3 d up, a held ====
vote key 100 0
waitms 200
mousepad
waitms 200
echo ==== A4 a up ====
vote key 97 0
waitms 200
mousepad
waitms 200
echo ==== A5 d alone ====
vote key 100 1
waitms 200
mousepad
waitms 200
echo ==== A6 a+d, a later ====
vote key 97 1
waitms 200
mousepad
waitms 200
echo ==== A7 a up, d held ====
vote key 97 0
waitms 200
mousepad
waitms 200
screenshot p404pad_a7
echo ==== A8 all up ====
vote key 100 0
waitms 200
mousepad
waitms 200

echo ==== C1 iDrive 0, both held ====
set cl_iDrive 0
vote key 97 1
waitms 100
vote key 100 1
waitms 200
mousepad
waitms 200
vote key 97 0
vote key 100 0
set cl_iDrive 1

echo ==== END ====
waitms 300
quit
