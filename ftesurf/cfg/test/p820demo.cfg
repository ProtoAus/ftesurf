cfg_save_auto 0
con_savehistory 0
// FTESurf Patch 820: an imported (Momentum) replay's failed stage attempts, from the
// zones, and the playback bar's "successful only" switch (skip + line, one click).
// nev.rec = data/momentum/surf_dune/main/0005571_nevermind66: offline model of the rule
// (failsim.py) gives stage 2 failed 23.47..28.05 and stage 3 failed 44.61..61.62.
// Control: the same cfg on a csprogs without P820 reads "fails 0 span(s)".
developer 1
log_developer 1
log_enable 1
log_dir logs
log_name runlines_smoke
con_notifytime 0
con_notifylines 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
vid_winmaximize 0
vid_width 1280
vid_height 720
vid_conautoscale 1
sv_public 0
scr_sshot_type png
waitms 2000
map surf_dune
waitmap 90
waitms 6000
menu_restart
ui_close
set hud_watch_skipidle 0
set hud_watch_skipfail 0
set hud_watch_path 1
set hud_watch_path_fails 1
set hud_lines_demo 0
echo P820 PHASE A open the import, the zone pass reads it
replay cfg/test/nev.rec
waitms 2500
replay pause
replay status
waitms 300

echo P820 PHASE B the bar inside stage 3's fails, every line shown
replay seek 50
waitms 800
screenshot screenshots/p820_bar_all.png
waitms 600

echo P820 PHASE C click "successful only"
hud_edit ui hover wt_skipfail
waitms 250
hud_edit ui down mouse1
waitms 100
hud_edit ui up mouse1
waitms 800
hud_watch_skipfail
hud_watch_path_fails
replay status
waitms 300
screenshot screenshots/p820_bar_ok.png
waitms 600

echo P820 PHASE D play into stage 2's fails with the switch on
replay seek 24
replay play
waitms 2000
replay pause
replay status
waitms 300

echo P820 PHASE E click it off again
hud_edit ui hover wt_skipfail
waitms 250
hud_edit ui down mouse1
waitms 100
hud_edit ui up mouse1
waitms 800
hud_watch_skipfail
hud_watch_path_fails
replay status
waitms 300

echo P820 PHASE F rank 1, no fails
replay stop
waitms 500
replay cfg/test/moby.rec
waitms 2500
replay pause
replay status
waitms 300
echo RUNLINES COMPLETE
quit
