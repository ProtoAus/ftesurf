// H9 -- is the far side being AREA-culled?
//
// mod_vbsp.c:4419 reads
//
//     else if (portal || hl2_novis->ival || clusters[0] == -1 || !model->vis)
//         return NULL;	//use some blind whole-model thing
//
// with `int portal = refdef->recurse`.  So a recursed view NEVER gets a PVS --
// it always takes the whole-model path.  Two consequences, and the first one
// invalidates an earlier result of mine:
//
//   * h5's r_novis test was meaningless.  It gave a pixel-identical frame not
//     because vis is irrelevant but because the portal view was ALREADY in the
//     no-vis path, so the cvar had nothing left to switch off.  That null result
//     must not be counted as evidence for anything.
//   * the whole-model path still AREA-culls.  Source areas are the one cull left
//     standing in a portal view, and the hub and stage 1 are far apart enough to
//     be in different areas.
//
// map_noareas 1 disables the area test outright.  The camera is the 20-unit
// standoff from h8, where the aperture fills the frame and the through-view
// measured centre brightness 3.9 against 90.5 for the same room on foot -- so
// this differences directly against h8_d20.
//
// Set BEFORE `map` because the area flood is built at load.

cfg_save_auto 0
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "h9"
scr_sshot_type png
cl_yieldcpu 0
cl_maxfps 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0
r_voidvis 1
vbsp_portal_render 1
map_noareas 1

waitms 2500
map surf_kitsune
waitmap 240
waitms 8000
sv_cheats 1
map_noareas 1
vbsp_portal_debug 1

setpos 0 -560 184 0 90 0
waitms 3000

echo "@@@ H9 20 units back, map_noareas 1"
setpos 0 -540 184 0 90 0
waitms 4000
screenshot_mega h9_noareas_d20 1280 720
waitms 600

echo "@@@ H9 120 units back, map_noareas 1"
setpos 0 -640 184 0 90 0
waitms 4000
screenshot_mega h9_noareas_d120 1280 720
waitms 600

echo "@@@ H9 DONE"
waitms 1000
quit
