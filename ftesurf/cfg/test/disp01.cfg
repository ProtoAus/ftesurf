// DISP01 -- Patch 250: the mapper's per-displacement "no collision" flag.
//
// Source overloads ddispinfo_t's minTess field: vbsp writes
//     pDisp->minTess = pMapDisp->flags | 0x80000000;   (disp_vbsp.cpp:326)
// and the player's hull sweep is gated on SURF_NOHULL_COLL (0x4) SEPARATELY
// from the contents mask (dispcoll_common.cpp:892).  FTE never read the field,
// so every displacement the mapper marked non-solid has been an invisible wall.
//
// surf_demise's elly/animated_smoke is 552 displacements, ALL minTess 0x80000006
// (NOPHYSICS|NOHULL).  Their contents are CONTENTS_WINDOW|TRANSLUCENT, and
// CONTENTS_WINDOW *is* in MASK_PLAYERSOLID -- which is exactly why reading
// contents alone was not enough, and why this looked like correct behaviour.
//
// TWO TRAPS THIS CONFIG EXISTS TO AVOID, both of which cost a run:
//
// 1. AIM AT REAL DISPLACED VERTICES, not base-quad centres.  A displacement is
//    deformed hundreds of units off its own quad, so base-quad probes landed on
//    a co-located playerclip brush, on the terrain behind, or on nothing.  These
//    points come from the same bilinear + norm*dist the loader runs
//    (mod_vbsp.c:2321-2338), camera 32 units above, looking straight down.
//
// 2. `map surf_demise` TWICE DOES NOT RELOAD.  hl2_dispflags is CVAR_MAPLATCH,
//    so the second value never latched and both halves of the A/B printed the
//    same answer -- which reads exactly like "the patch does nothing".  The
//    giveaway was one displacement census line in the log where there should
//    have been two.  surf_rise in between forces a real unload.
//
// Expected, hl2_dispflags 1 (default):
//     smoke   -> geom contents=0x10000000 [translucent], playersolid=no
//     terrain -> geom contents=0x1 [solid],              playersolid=YES
// Expected, hl2_dispflags 0 (pre-patch):
//     smoke   -> geom contents=0x10000002 [window|translucent], playersolid=YES
//
// Nine smoke probes because parts of the layer have playerclip brushes over
// them, and a clip is solid whatever the displacement says.  The terrain probe
// is the control: rock_cliff_to_rockjungle is 985 displacements at flags 0, and
// if the patch made THOSE non-solid the map would be unplayable.

log_enable 1
log_dir "logs"
log_name "disp01"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
developer 1
log_developer 1

wait 200

echo ^5=========== PASS A: surf_demise, hl2_dispflags 0 (pre-patch) =======
hl2_dispflags 0
map surf_demise
waitmap 1800
waitms 8000
sv_cheats 1
waitms 300

setpos -2944 7552 4865 90 180 0
waitms 800
solid_here off-s1
waitms 150
setpos -3456 8064 4682 90 180 0
waitms 800
solid_here off-s2
waitms 150
setpos -2432 7040 5217 90 180 0
waitms 800
solid_here off-s3
waitms 150
setpos -2432 9088 4936 90 180 0
waitms 800
solid_here off-s4
waitms 150
setpos -1408 8064 4857 90 180 0
waitms 800
solid_here off-s5
waitms 150
setpos -2944 9600 5032 90 180 0
waitms 800
solid_here off-s6
waitms 150
setpos -3456 6016 6062 90 180 0
waitms 800
solid_here off-s7
waitms 150
setpos -2560 5952 6042 90 180 0
waitms 800
solid_here off-s8
waitms 150
setpos -896 7552 5135 90 180 0
waitms 800
solid_here off-s9
waitms 200
screenshot disp01_smoke_off
waitms 400
setpos 13385 -9736 1595 90 180 0
waitms 800
solid_here off-terrain
waitms 400

echo ^5=========== surf_rise -- forces a real unload between passes =======
map surf_rise
waitmap 1800
waitms 4000

echo ^5=========== PASS B: surf_demise, hl2_dispflags 1 (patched) =========
hl2_dispflags 1
map surf_demise
waitmap 1800
waitms 8000
sv_cheats 1
waitms 300

setpos -2944 7552 4865 90 180 0
waitms 800
solid_here on-s1
waitms 150
setpos -3456 8064 4682 90 180 0
waitms 800
solid_here on-s2
waitms 150
setpos -2432 7040 5217 90 180 0
waitms 800
solid_here on-s3
waitms 150
setpos -2432 9088 4936 90 180 0
waitms 800
solid_here on-s4
waitms 150
setpos -1408 8064 4857 90 180 0
waitms 800
solid_here on-s5
waitms 150
setpos -2944 9600 5032 90 180 0
waitms 800
solid_here on-s6
waitms 150
setpos -3456 6016 6062 90 180 0
waitms 800
solid_here on-s7
waitms 150
setpos -2560 5952 6042 90 180 0
waitms 800
solid_here on-s8
waitms 150
setpos -896 7552 5135 90 180 0
waitms 800
solid_here on-s9
waitms 200
screenshot disp01_smoke_on
waitms 400
setpos 13385 -9736 1595 90 180 0
waitms 800
solid_here on-terrain
waitms 400

echo ^5=== disp01 done ===
wait 30
quit
