// Patch 377: exec never runs a config out of an fs_load addon mount (Momentum, CS:S, HL2).
// Run from C:\FTESurf:
//   ftesurf64.exe -WindowStyle Minimized +set developer 1 +set cfg_save_auto 0
//     +set log_enable 1 +set log_dir logs +set log_name p377boot +exec cfg/test/p377boot.cfg
// Momentum's cfg/config.cfg runs `unbindall` then its own binds; P330's bare-name fallback
// turned the boot's `exec config.cfg` into `cfg/config.cfg`, which only Momentum has.
// SHIFT is the subject: default.cfg binds +speed, Momentum +walk, this machine's ftesurf.cfg
// does not save it.
// Predictions (pre-registered):
//   before  boot log has "execing cfg/config.cfg" from ...Momentum Mod Playtest/momentum;
//           SHIFT = "+walk"; `exec cfg/autoexec.cfg` (Momentum-only) runs.
//   after   no execing line names a mounted game; SHIFT = "+speed";
//           `exec cfg/autoexec.cfg` is refused.
// Control (must still work after): `exec p377echo` resolves to cfg/test/p377echo.cfg
//   through the P330 fallback and prints its marker.
// Result 2026-09-19: before -- "execing cfg/config.cfg", 499 "Unknown command" lines,
//   cfg/autoexec.cfg ran.  After -- "not execing .../momentum/cfg/config.cfg", 0 unknown,
//   cfg/autoexec.cfg refused, control ran, ftesurf.cfg still execs.
//   SHIFT prediction FAILED both times ("+speed"): ftesurf.cfg saves LSHIFT and masks it.
//   The log count is the observable here; the first-boot binds are p377fresh.cfg.
cl_idlefps 0
cl_maxfps 100
waitms 3000
echo ======== P377 binds
bind SHIFT
bind CTRL
echo ======== P377 direct exec of a Momentum-only file
exec cfg/autoexec.cfg
echo ======== P377 control
exec p377echo
echo ======== P377 mounts (the shortened fs_addons.txt: three ok lines, two commented)
fs_steamlibs
echo ======== P377 done
waitms 500
quit
