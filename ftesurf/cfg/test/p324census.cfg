// Prop-collision content census -- does the SERVER resolve the same .phy hulls
// the CLIENT does?
//
// WHY THIS IS A SEPARATE EXPERIMENT FROM pm_dettest.  pm_dettest's `trace` hash
// is world model only, so it cannot see props at all.  Prop collision comes
// from static props' .phy hulls, which resolve out of the mounted game content
// (cstrike's VPKs, and hl2's) rather than out of the BSP -- so a client and a
// server can agree on every trace hash and still disagree about whether a prop
// is solid.  mod_vbsp.c prints a per-map census line for exactly this:
//     "<map>.bsp: collision shapes -- N .phy hull (T tris), ... M models with
//      no .phy"
// It is Con_DPrintf, so it needs developer 1 or it is silent -- and a silent
// census reads identical to a matching one.
//
// THE MAP IS THE CONTROL.  surf_420 is chosen because its BSP is byte-identical
// on both machines (same size in the 2026-09-14 census, and the 989 same-size
// pairs sampled hashed identical).  So the map file is held constant and the
// only variable left is what content each side has mounted.  Running this on
// one of the 323 drifted maps would confound the two.
//
// M > 0 IS NOT BY ITSELF A FAULT.  It counts legitimately hull-less props too,
// exactly as Source does.  The finding is a DIFFERENCE between the two sides,
// not a non-zero count on one.
//
// FALSIFIED IF: the two sides print the same census line, which would mean the
// empty game/hl2/ on the Pi costs this map nothing and the gap is latent rather
// than live.
cfg_save_auto 0
log_enable 1
log_dir logs
developer 1

waitms 5000

map surf_420
waitmap 60
waitms 4000

echo ================================ P324 prop-collision census
pm_dettest
waitms 3000

echo ================================ P324 census done
waitms 500
quit
