// Patch 388 falsifier (new-file keying): on Linux, can a file written this session be read back by name?
// fs_stdio.c keyed a new file's name-hash entry by its absolute OS path (Windows keys the
// game-relative name), so a lookup through a valid hash would miss it until the next rebuild.
// FTESurf's saveloc writes a slot and sl_load reads it back in the same session.
// Run: rig-run.sh <install> x11 <log> cfg/test/p388save.cfg (a Linux listen server on bhop_eazy).
// Pre-registered: pre-388 Linux build -> sl_load after sl_save cannot find the slot it just wrote;
//   388 build -> it loads.  Control (NOT RUN): the same cfg on Windows loads (fs_win32 keys relative names).
// RESULT 2026-09-19 (Debian rig, logs/linux/p389save_*): pre (386 build) `writeip` then
//   `flocate listip.cfg` -> Not found; Patch 388 build (b0a96909b) -> found.  The seq.txt
//   probe is found on both: creating its new folder flushes the hash, so lookups scan.
//   The sl_save/sl_load half is weak: with no run active, sl_save writes no state.txt.
cl_idlefps 0
cl_maxfps 100
set run_resume 0
waitms 3000
map bhop_eazy
waitmap 180
waitms 8000
echo ======== P388S save
cmd sl_save
waitms 3000
echo ======== P388S flocate
flocate data/saves/bhop_eazy/save001/seq.txt
writeip
flocate listip.cfg
echo ======== P388S load
cmd sl_load
waitms 3000
echo ======== P388S done
quit
