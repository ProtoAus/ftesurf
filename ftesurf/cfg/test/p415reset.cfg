// cfg_save_auto 0 FIRST: this run sets archived cvars and must never write them
// into ftesurf.cfg (cl_main.c:2535).
cfg_save_auto 0

// ===========================================================================
//  P415RESET -- `!r` lands on the spot you left in the box, and on nothing else.
//    ftesurf64.exe -WindowStyle Minimized +exec cfg/test/p415reset.cfg
//    (cwd MUST be C:\FTESurf -- the basedir is the cwd, and a shell left in
//     ftesurf/ produces NO log at all)
//
//  THE CHANGE.  On the RESET path only, SV_ZoneChatCommand asks
//  SV_SaveLocPickInZone for the newest save taken with the clock stopped whose
//  origin SV_ZoneOcc puts inside the leg's own zone, and passes its ORIGIN AND
//  VIEW ANGLE to SV_ZoneMoveAt.  That is the same SV_ZoneMove `!r` has always
//  run, with a different destination.
//
//  IT IS NOT A SAVE LOAD, and this file exists mostly to prove that.  The first
//  cut called SV_SaveLocLoad and three independent reviews rejected it: a load
//  restores `.velocity`, while SV_ZoneMove zeroes it and clears the push carrier.
//  Loading turned the restart key into a prespeed injector -- carry speed into a
//  start box (re-entering one while running ARMS you, no file editing needed),
//  save while the clock reads 0, and every `!r` afterwards hands that velocity
//  back into a freshly armed attempt whose .rec opens with it in the seed, with
//  no lead-in and no warp record for pm_verify to catch.  ARM V IS THAT ARM.
//
//  NOT setpos, ANYWHERE.  setpos forces MOVETYPE_NOCLIP and taints the attempt
//  `cheated` -- which is the field arms K2/S read.  Every placement here is the
//  player's own route: `!m`, `!s`, `!r` through chat, and the movement keys.
//
//  THE FIXTURE IS SHARED.  ftesurf/data/saves/bhop_eazy holds real saves and two
//  other harnesses read them.  The runner PARKS that directory before this arm
//  and restores it after; the arm never calls sl_delall.
//
//  WHY bhop_eazy: b57stage.cfg established its geometry -- zones on one plane,
//  start centre (-352 -352 144), stage 1 at (2624 512 144).  Its start box is
//  SMALL: the destination sits near the +x edge and 37 u of walk is already
//  outside, so the step below goes BACKWARD and is short.  b57stage is this
//  patch's regression for the other path, the stage restart that keeps the clock.
//
//  PRE-REGISTERED
//   H1  `!m` -> the destination, armed, class clean.
//   K1  NO SAVE: `!r` -> the destination, unchanged.  The arm most likely to
//       catch a picker that returns something when it should return nothing.
//   K2  A SAVE IN THE BOX: `!r` lands on the SAVE's origin, yaw AND PITCH, not
//       the destination, and `cmd timer` still reads armed + class clean.  The
//       pitch matters on its own: SV_ZoneDest levels a destination entity's
//       pitch deliberately, so `havepit` is a separate flag and its arm is dead
//       code unless a save carries a non-zero one.
//   V   VELOCITY IS ZEROED.  The K2 save is taken WHILE MOVING, so its own row in
//       `sl_list` reads a non-zero u/s.  After `!r` lands on it, a fresh save
//       taken immediately must read `0 u/s`.  If it reads the saved speed back,
//       the placement is restoring velocity and the patch is the injector its
//       first cut was.  THIS IS THE ARM THAT MATTERS.
//   S   A STAGE LEG STAYS CLEAN.  `!s 2`, save in the stage box, `!s 2`, `!r`.
//       Must land on the stage save AND read class clean -- SV_ZoneMove arms a
//       ZONE_STAGE, where the rejected design's SV_ZoneStartAt would not have,
//       leaving the whole stage attempt practice-tainted and silent.
//   Z   SCOPE: with a save in the START box, `!r` on stage 2 must not use it.
//  FALSIFIED IF K1 moves anywhere but the destination; K2 lands on the
//  destination or comes back practice/stitched; V reads anything but 0 u/s;
//  S reads practice 1 or lands on the destination; Z lands back in the start box.
//  INCONCLUSIVE IF the K2 save's own row reads 0 u/s -- then V proves nothing,
//  because there was no velocity to restore.  Check that row first.
//
//  RESULT 2026-09-20.  ALL SIX ARMS HOLD.
//
//    H1  `!m` -> -336 -352 64, armed, class clean.
//    K1  no save: `!r` -> -336 -352 64, clean.  Unchanged.
//    K2a saved mid-step at -365 -366 64, yaw 25, pitch 2.6, carrying 209 u/s,
//        clock 0:00.000, class clean.
//    K2  `!m` back to -336 -352 64 at yaw 0.0, then
//          !r -- start of the map (your save, -363 -364 64)
//          setpos -363.4 -364.4 64.0  0.0 24.3 0.0
//        the save's spot and its yaw, with `practice 0  class: clean
//        stitch 0`.  The bracket says "your save" rather than the zone's own
//        destination kind, which is the second round's nit and a real one --
//        saying "teleDestPos" about a point the zone never supplied is the kind
//        of small lie that costs someone an hour.  A separate run with a save
//        carrying pitch 2.6 came back at pitch 2.6 from a `!m` that had levelled
//        it to 0.0, so `havepit` is measured and not assumed.
//    V   THE ARM THAT MATTERS.  The K2 save's own row reads 209 u/s; a save taken
//        immediately after `!r` landed on it reads 0 u/s at the same position.
//        Velocity is zeroed, so the placement cannot carry prespeed.
//    Z   `!r` on stage 2 with only a start-box save -> stage 2's own destination,
//        clean.  The picker is scoped to the leg.
//    S   stage-leg save -> `!r -- stage 2 (your save, 2597 505 64)`,
//        setpos 2597.1 504.6 64.0 yaw 29.7, `class: clean`.
//
//  A SECOND REVIEW ROUND FOUND MORE, and one of them broke this arm before it
//  was fixed.  The picker now ground-snaps and hull-tests its answer
//  (cfg/test/p415snap.cfg is that arm), and the FIRST cut of the snap re-tested
//  the zone on the raw snapped point -- which on a map whose zone bottom is its
//  floor is the same sub-ulp shortfall all over again, because a body already
//  resting on the floor traces down zero distance.  K2 fell straight back to the
//  destination.  The returned point now goes through SV_SaveZonePoint as well,
//  so the placement and the arm scan agree about where the body is.  Also
//  landed: the two lobby policy gates are asked on every press instead of being
//  skipped whenever the row cache was fresh (which on a lobby is always, because
//  SV_SaveLocSync stamps it every PostThink), a NaN/out-of-range origin out of a
//  hand-edited file is refused, and the pitch is clamped.
//
//  REGRESSIONS on this build: b57stage D (`!s 1` then `!r`) still reports
//  `stagerun 1  stage 1 asked 1`; p409hop's J1/J2 still read hopped 0 then
//  hopped 1 with paid #1/#2/#3; p412speed K1b still reads hopped 0, jumps 3,
//  tkspd 2060.  tools/test_reccheck.py 229 checks 0 failed.  None of them finds
//  a save: bhop_eazy's real slot is timed (ticks 220) and outside the box, which
//  is worth knowing -- these arms would change behaviour if it were not.
//
//  THE TOLERANCE TOOK THREE GOES AND THE THIRD IS THE ONLY RIGHT ONE.
//  state.txt stores `origin %.4f`, so a save standing in a box whose zone BOTTOM
//  IS THE FLOOR reads back below it and the z-slab test rejects a point the ring
//  test accepts.  bhop_eazy: bottom 64.031250, slot 64.0312, parsed 64.031197.
//  An unconditional `+ 0.0001` lift worked but also pushes a save resting on a
//  zone's TOP face out through the ceiling.  A one-sided snap at 5e-5 -- "the
//  decimal quantum" -- FAILED, because the real gap is 5.34e-5: `%.4f` rounds to
//  5e-5 and the parse back into a 24-bit mantissa adds its own error, 7.6e-6 at
//  z 64 and 0.002 at a map's 16384.  The shipped tolerance is the decimal quantum
//  plus two ulps at the magnitude concerned, snapping upward only.
//
//  WHAT THE REVIEWS CHANGED, recorded because the rejected design passed its own
//  harness.  The first cut called SV_SaveLocLoad and three independent reviewers
//  -- predicate/control-flow, evidence, and what-a-cheater-gains -- each rejected
//  it.  The decisive finding was arm V's: a load restores `.velocity`, so
//  carrying speed into a start box (re-entering one while running ARMS you; no
//  file editing) and saving with the clock at 0 made every `!r` a prespeed
//  injection into a freshly armed, laundered attempt whose .rec opens with that
//  velocity in the seed, no lead-in, no warp record -- self-consistent, so
//  pm_verify PASSes it.  Also found: the load let `state.txt` decide the LEG
//  (SV_SaveApplyState overwrites run_t_stagerun/run_t_wantstage1, so a save could
//  silently change which board a finish filed under); SV_ZoneStartAt re-derived
//  the zone and would take the FIRST matching start, undoing the index latch that
//  exists because surf_aircontrol's bonus-2 start is byte-identical to its main;
//  a stage leg got no arm at all and ran practice-tainted and silent; a failed
//  load left a live run neither voided nor restarted; and `ticks > 0` admitted a
//  hand-edited NEGATIVE tick count.  Taking only the origin and the angle removes
//  every one of those by construction.  Arms V, S and Z are here because of them.
//
//  NOT COVERED: the stage-restart path, where `!r` keeps the clock running --
//  cfg/test/b57stage.cfg's D arm is that regression.  Nor a lobby, where SL_Blk
//  splits the row set per player and lobby_nosaveloc refuses the picker outright.
log_enable 1
log_dir logs
log_name p415reset
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
sv_port 27659
sv_cheats 0
set run_resume 0
set run_starthop 0
vid_fullscreen 0
waitms 5000
map bhop_eazy
waitmap 2400
waitms 3000
menu_restart
ui_close
waitms 1200

echo ==== H1 the geometry, read not assumed ====
zone_list
waitms 600
say !m
waitms 1800
cmd viewpos
cmd timer
waitms 800

echo ==== K1 no save yet: !r must land on the destination ====
say !r
waitms 1800
cmd viewpos
cmd timer
waitms 800

echo ==== K2a aim, step back toward the centre, and save WHILE MOVING ====
// THE PITCH ARM, and how it ended up being driven by an accident.
// SV_ZoneMoveAt writes [havepit ? atpit : 0, yaw, 0], and that flag's arm is
// dead code unless a save carries a non-zero pitch -- SV_ZoneDest levels a
// destination entity's pitch deliberately, so 0 is both the default AND a
// legitimate saved value, which is why it is a flag and not `atpit != 0`.
// `+lookdown` does NOT move the pitch in a minimized headless client: measured,
// viewpos still read 0.0 after 300 ms of it.  zone_goto takes optional angles
// for exactly this reason, but the extra arguments do not survive the forward
// (the log reads `Client command: zone_goto 0`).  What DOES give a non-zero
// pitch is the body settling after the move -- 2.6 degrees here -- and that is
// enough, because `!m` at K2b levels the view to 0.0 first.  So the arm reads:
// pitch 0.0 after `!m`, pitch 2.6 after `!r`, and 2.6 is the save's.
zone_goto 0
waitms 1500
cmd viewpos
waitms 400
// The turn is the discriminator (a placement restores angles, and it costs no
// displacement); the step is backward because the destination is near the box's
// +x edge.  The save is taken with the key still down so the row carries speed --
// arm V needs a non-zero u/s in the slot to be worth anything.
+left
waitms 400
-left
waitms 300
+back
waitms 250
cmd sl_save
waitms 120
-back
waitms 900
echo ---- the clock MUST read 0:00.000 and armed, or K2 proves nothing ----
cmd timer
cmd viewpos
waitms 600
echo ---- and THIS row must read a non-zero u/s, or arm V proves nothing ----
cmd sl_list
waitms 700

echo ==== K2b/V back to the destination, then !r ====
say !m
waitms 1800
cmd viewpos
waitms 400
say !r
waitms 1800
echo ---- must be K2a's spot and yaw, not the destination, and class clean ----
cmd viewpos
cmd timer
waitms 800
echo ---- V: a save taken right now must read 0 u/s ----
cmd sl_save
waitms 900
cmd sl_list
waitms 800

echo ==== Z scope: on stage 2, the START box's save must NOT be used ====
say !s 2
waitms 1800
cmd viewpos
waitms 300
say !r
waitms 1800
echo ---- must be stage 2's own destination, not the start-box save ----
cmd viewpos
cmd timer
waitms 800

echo ==== S a stage leg: save in stage 2's box, then !r there ====
say !s 2
waitms 1800
cmd viewpos
+left
waitms 500
-left
waitms 300
+back
waitms 120
-back
waitms 800
cmd sl_save
waitms 900
say !s 2
waitms 1700
cmd viewpos
waitms 300
say !r
waitms 1800
echo ---- must be the stage save's spot, and class CLEAN ----
cmd viewpos
cmd timer
waitms 800

echo ==== END ====
waitms 800
quit
