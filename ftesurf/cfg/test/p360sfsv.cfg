// P360SFSV -- stage fill-in, server half (client: p360sfcl.cfg).
// Run from C:\FTESurf with cfg/test/p360sf.zones.json copied to
// ftesurf/maps/zones/local/surf_666.json (DELETE IT AFTER -- it shadows the
// shipped zones), against `python surfd/b65stub.py cert 8131`:
//   C:\FTEQuake\fteqwsv64.exe +set sv_port 27631 +set sv_public 0
//     +set lobby_master "http://127.0.0.1:8131" +exec cfg/test/p360sfsv.cfg
// sv_cheats 0 and no noclip/setpos on the client: a stage taint refuses the post.
// Three map loads: defaults; run_stagecap 200; run_prestrafe_time 30.
// The real lobby.cfg first: a lobby streams its recording (SV_RecStreams) and
// keeps no PB, so this takes the fleet's evidence path and writes no local PB.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p360sfsv
developer 1
exec cfg/lobby/lobby.cfg
sv_cheats 0
set lobby_master "http://127.0.0.1:8131"
sv_guidkey "ftesurf-p360-probe"
sv_maxrate         0
sv_maxdownloadrate 0
set lobby_master_key  "stub-key-not-a-real-one"
set lobby_master_rate 30
set run_stagecap 290
map surf_666
waitms 90000
echo ^5==== server: control C1, run_stagecap 200 ====
set run_stagecap 200
map surf_666
waitms 40000
echo ^5==== server: control C2, run_prestrafe_time 30 ====
set run_stagecap 290
set run_prestrafe_time 30
map surf_666
waitms 40000
set run_prestrafe_time 0.25
quit
