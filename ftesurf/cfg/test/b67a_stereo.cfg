cfg_save_auto 0

// ===========================================================================
// BUILD 67, ARM SET A -- Engine Patch 315, the stereo downmix.
//
// WHAT WENT WRONG, AND WHY FIVE ROUNDS OF INSTRUMENTS COULD NOT SEE IT.
//
// The user's report was exact: "Start with vbsp_sound 0, then map surf_tensor2,
// and plays the sound scapes and sounds beautiful, loading the map with
// vbsp_sound not 0 is awful."  So the soundscape layer is right and the
// ambient_generic layer is wrong -- and the ambient_generic layer's ARITHMETIC
// had already been proved right, twice, against Source's own source:
//
//     ComputeSoundlevel, sound.cpp:55-69 -- REFERENCE_dB_DISTANCE 36.0 and
//     `(int)(40 + dB_loss)` are both transcribed verbatim, re-verified today.
//
// At the player start the nearest emitter is 781 units away and carries 256
// units.  Every model said SILENCE.  The engine agreed: an instrument written
// against snd_dma.c's mixer printed "0.00x full scale from 0 emitter(s)".
//
// BOTH OF surf_tensor2's AMBIENT SAMPLES ARE STEREO .WAV FILES.
//
//     ambient/levels/citadel/field_loop3.wav      2ch 22050Hz 16bit   x21
//     ambient/levels/canals/dam_water_loop2.wav   2ch 44100Hz  8bit   x9
//
// OpenAL will not position a multi-channel buffer.  A source holding one
// ignores AL_POSITION, AL_MAX_DISTANCE and the distance model outright and
// plays flat, 2d, at full AL_GAIN.  That is OpenAL by specification, not a
// driver fault; OpenAL Soft's answer is the AL_SOFT_source_spatialize
// extension, which snd_al.c:1433 tests for -- and Creative's "Generic
// Software", which is what this machine initialises, does not have it.
//
// So all 30 emitters played at full scale everywhere on the map at once, 21 of
// them phase-offset copies of one waveform, which comb-filters.  That is
// "harsh noise", and it is why every correct number was also irrelevant: the
// attenuation was computed correctly, transmitted correctly, and then thrown
// away by the backend before it could do anything.
//
// THE LESSON, which is the same one this file keeps re-learning: an instrument
// that models a code path can only ever be as true as the claim that the path
// RUNS.  snd_dma.c's mixer is not what this machine mixes with.
//
// ---------------------------------------------------------------------------
// WHAT IS BEING TESTED HERE.  Not loudness -- this run is muted and cannot
// judge it.  SELECTIVITY.  Patch 315 folds a stereo sample to mono when, and
// only when, it is used as a POSITIONAL source and the driver cannot do it.
// Three things must all hold, and arm A3 is the one that matters:
//
//   - it fires on stereo samples used positionally
//   - it does NOT fire on mono ones          <-- A3, and it is the real test
//   - it does NOT fire on 2d sounds          <-- soundscapes, see below
//
// SOUNDSCAPES CANNOT BE AFFECTED BY THIS PATCH AND THAT IS WORTH STATING.
// Snds_Frame plays every slot at ATTN_NONE, so dist_mult is 0, so snd_al.c:949
// makes them srcrel, so the `if (!srcrel)` guard at the call site excludes them
// by construction.  That is correct rather than lucky: a soundscape rule with
// no `position` is a 2d ambient bed in Source too, and stereo is exactly what
// it wants.  A3 and A4 still assert the soundscape layer is untouched.
//
// PRE-REGISTERED, computed offline from the entity lumps and the fmt chunk of
// each .wav in Momentum's mount/hl2_dir.vpk (scratchpad/pred67.py), before this
// run.  The count is of DISTINCT SAMPLES, not emitters: the mono fold is cached
// per sfx, so 21 emitters sharing a sample produce ONE line.
//
//   ARM  map            s_al_downmix3d   "downmixed" lines MUST be
//   A1   surf_tensor2   1 (default)      2   field_loop3, dam_water_loop2
//   A2   surf_tensor2   0 (CONTROL)      0
//   A3   surf_sleeper   1                2   of FIVE samples -- see below
//   A4   surf_kitsune   1                0   and 28/50/1 still intact
//
// A3 IS THE ARM THAT CAN FAIL INFORMATIVELY.  surf_sleeper's 58 static
// emitters carry five distinct samples, THREE OF THEM MONO:
//
//     ambient/wind/wasteland_wind.wav                  x22  STEREO
//     ambient/fire/fire_small1.wav                     x15  mono
//     hl1/ambience/alien_powernode.wav                 x13  mono
//     ambient/atmosphere/pipe1.wav                     x7   mono
//     ambient/levels/citadel/zapper_ambient_loop1.wav  x1   STEREO
//
// A patch that folded indiscriminately would print 5 lines here and would
// still have "fixed" surf_tensor2.  Exactly 2, naming the two stereo samples,
// is the assertion.
//
// A2 IS THE CONTROL AND IT IS NOT OPTIONAL.  Without it, two lines of output
// prove only that something printed two lines.  Build 65's arm sets B and C
// were both saved by their controls after the harness, not the feature, turned
// out to be what moved.
//
// THE snd_restart BEFORE EACH MAP IS LOad-BEARING.  OpenAL buffers are cached
// per sfx in oali->sounds[] and freed only on OpenAL_Shutdown, so changing
// s_al_downmix3d does nothing until the cache is dropped.  snd_restart drops
// it -- and ALSO drops every static sound, because the prespawn replay that
// created them does not re-run (the build 65 arm B trap).  Hence the order:
// set the cvar, snd_restart, THEN load the map, which re-sends the statics.
//
// ---------------------------------------------------------------------------
// WHAT THIS RUN CANNOT DECIDE, said plainly: whether it SOUNDS right.  The
// mechanism is established from three things that are all objective -- the fmt
// chunks, OpenAL's own specification, and which extension the driver reports --
// but "the blare is gone" is a claim about a person's speakers and only a
// person can make it.  The A/B for that is one cvar:
//
//     s_al_downmix3d 0 ; snd_restart ; map surf_tensor2     <- the old, awful
//     s_al_downmix3d 1 ; snd_restart ; map surf_tensor2     <- the fix
// ---------------------------------------------------------------------------
// RESULTS, 2026-09-13.  logs/b67a_stereo.log.  ftesurf64.exe 17:49:12.
//
// FOUR OF FOUR ON THE PRE-REGISTERED COUNTS -- AND THE RUN FOUND A BUG THAT
// WAS NOT IN THE PATCH, WHICH IS THE MORE USEFUL RESULT.  Recorded, not
// reworded; the false claim it falsified is left standing above.
//
//   ARM  map            downmix3d  lines  named
//   A1   surf_tensor2   1          2      dam_water_loop2, field_loop3   PASS
//   A2   surf_tensor2   0          0      (control)                      PASS
//   A3   surf_sleeper   1          2      zapper_ambient_loop1,
//                                         wasteland_wind                 PASS
//   A4   surf_kitsune   1          0                                     PASS
//
// A3 IS THE RESULT THAT MATTERS.  surf_sleeper's 58 emitters carry five
// samples and THREE ARE MONO.  Exactly the two stereo ones were folded;
// fire_small1, alien_powernode and pipe1 were left alone.  The patch is
// selective, not merely active -- which a one-map test could not have shown.
//
// A2 EARNED ITS PLACE.  Zero lines with the cvar off, in the same process,
// over the same map: the two lines in A1 are the patch and nothing else.
//
// ---------------------------------------------------------------------------
// WHAT THIS RUN CAUGHT THAT NOBODY WAS LOOKING FOR.  A1 printed TWO MORE
// lines, 360 lines later, after the soundscape layer started (log:1247-1248):
//
//     OpenAL: downmixed "ambient/rain_heavy_sc.wav" to mono so it can be positioned
//     OpenAL: downmixed "ambient/sea_breeze.wav" to mono so it can be positioned
//
// Those are surf_tensor2's SOUNDSCAPE samples, and this file's own header
// asserts three paragraphs up that soundscapes "CANNOT BE AFFECTED BY THIS
// PATCH".  The assertion's reasoning was sound and its premise was false:
// Snds_Frame does use ATTN_NONE, but Snds_Apply CREATED each slot with
// `sound(..., attn, ...)` -- the rule's own attenuation -- and one frame with
// dist_mult != 0 is all the engine needs to call a source positional.  The
// fold is cached per sfx, so the downgrade was permanent for the session.
//
// A one-frame inconsistency with no audible symptom of its own had become a
// silent stereo->mono downgrade of the layer the user had just called
// "beautiful".  No listening test would have found it; the loss is width on an
// ambient bed, not a wrong sound.
//
// Fixed in cl_soundscape.qc (build 67): both call sites now pass ATTN_NONE,
// and the write-only .ssl_attn field that held the unused value is gone.
// b67b_scope.cfg is the arm that asserts the fix, including a slot allocated
// AFTER map load -- which this run never exercised, because it never moved.
//
// THE LESSON: an arm written to confirm something you believe is impossible is
// worth writing.  This one was, and it caught a bug in a different file.
// ===========================================================================

log_enable 1
log_dir logs
log_name b67a_stereo
developer 1
log_developer 1
cl_maxfps 100
con_notifylines 0

// The downmix notice is a Con_DPrintf, so it needs developer 1 AND
// log_developer 1 -- both set above, before any sound is loaded.
volume 0
bgmvolume 0

vbsp_sound 1

waitms 5000

echo ^5=== A1: surf_tensor2, downmix ON -- expect 2 lines: field_loop3, dam_water_loop2 ===
s_al_downmix3d 1
snd_restart
waitms 1500
map surf_tensor2
waitmap 60
waitms 9000
soundinfo
waitms 1000
ent_io
waitms 1500
snd_report
waitms 1500

echo ^5=== A2: surf_tensor2, downmix OFF -- CONTROL, expect 0 lines ===
s_al_downmix3d 0
snd_restart
waitms 1500
map surf_tensor2
waitmap 60
waitms 9000
soundinfo
waitms 1000
ent_io
waitms 1500

echo ^5=== A3: surf_sleeper, downmix ON -- expect 2 of 5 samples: wasteland_wind, zapper_ambient_loop1 ===
s_al_downmix3d 1
snd_restart
waitms 1500
map surf_sleeper
waitmap 60
waitms 9000
soundinfo
waitms 1000
ent_io
waitms 1500
snd_report
waitms 1500

echo ^5=== A4: surf_kitsune -- no static ambients, expect 0 lines, 28/50/1 intact ===
snd_restart
waitms 1500
map surf_kitsune
waitmap 45
waitms 8000
ent_io
waitms 1500
snd_report
waitms 2500

echo ^5=== END OF RUN ===
quit
