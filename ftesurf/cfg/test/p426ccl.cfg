// P426CCL -- a load of a save with no recording in it (server: p426sv.cfg, zones
// cfg/test/p426.zones.json copied to maps/zones/local/surf_666.json -- DELETE IT
// AFTER -- and the stub `b65stub.py cert 8131`).
//
// A save taken armed in START holds no recording (mark 0), so its load's rewind
// fails at once and takes sv_saveloc.qc's failed-rewind branch -- the ordinary
// reset key, not a rare failure.  b8f92a0 cleared a hold there whose ticks
// matched rec_rec_ticks (Patch 426 review round 6):
//   L1  post leg 1, then `sl_load` the START save: the load itself keeps the
//       run as evidence and holds (rid, nonce, 0); the client sees the end and
//       signs (nonce, 0).
//   L2  a finish, then `sl_load` the START save after the server's finish and
//       before the client's receipt: cl_delay_packets 3000 delays this client's
//       outgoing packets in order, so a load sent ~1.5 s after the client
//       crosses the END reaches the server between the two.  The run is ~4.5 s,
//       longer than the delay the nonce answer must beat.
//
// PRE-REGISTERED PREDICTIONS
//  b8f92a0 (the clear ungated):
//   B1 L1 logs `kept ...rec (1 posted stage(s))`, then `timer: receipt refused
//      -- no run id or no nonce`.
//   B2 L2's finish submit carries TF_NONCE (131072), then `timer: receipt
//      refused -- no run id or no nonce`.
//  With the clear gated on "was recording":
//   A1 L1 and L2 each log `timer: receipt ...rcpt` under their own runid.
// FALSIFIED IF b8f92a0 signs either, the fix signs neither, or L2's submit
//   lacks TF_NONCE (then it measures the nonce handshake, not the load).
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p426ccl
developer 1
cl_idlefps 0
cl_maxfps 100
rate  2000000
drate 5000000
vid_fullscreen 0
set rec_enable 1
set rec_hid 1
set rec_upload 1
name "^3P426c"
waitms 6000
connect 127.0.0.1:27632
waitms 12000
set rec_terms 1
cmd sl_delall
waitms 500

echo ^5==== L1: save in START, post leg 1, load ====
cmd zone_goto 0 90 0
waitms 2000
cmd sl_save
waitms 1000
+forward
waitms 2000
-forward
echo ^5--- L1: past S2 ---
cmd timer
waitms 500
cmd sl_load
waitms 4000
echo ^5--- L1: loaded ---
cmd timer

echo ^5==== L2: save in START, finish, load before the receipt ====
cmd sl_delall
cmd zone_goto 0 90 0
waitms 2000
+moveright
waitms 600
-moveright
waitms 500
cmd sl_save
waitms 1000
set cl_delay_packets 3000
waitms 1000
+forward
waitms 6000
-forward
waitms 300
cmd sl_load
waitms 9000
set cl_delay_packets 0
echo ^5--- L2: loaded ---
cmd timer
waitms 3000
echo ^5==== P426c CL done ====
quit

