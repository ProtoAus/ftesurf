// V268Y -- Patch 268c, corrected run.  v268x's headline arm was INVALID.
//
// v268x X1 was supposed to test the new vid_winmaximize default of 2 by not setting the
// cvar.  It read back "1": ftesurf.cfg:402 carries an explicit `vid_winmaximize "1"`,
// written by a cfg_save while 1 was still the default, and an explicit config line beats
// an engine default.  So X1 ran the old fit rule and its 640x480 result said nothing
// about the change -- it agreed with the X2 falsifier because it WAS the X2 falsifier.
// The config line is now migrated to 2.  X4 (the vid_restart path, which did set the
// cvar explicitly) was valid and passed; nothing here contradicts it.
//
// The lesson is the reason this file echoes the cvar before using it: an arm that relies
// on a default has to prove the default is what is actually in effect.
//
// INSTRUMENT: screenshot dimensions.  "Setting windowed mode 640*480" is logged in the
// pass and the fail alike -- it prints the REQUESTED size, and maximizing happens after.
//
// Y0  echo vid_winmaximize -- MUST read 2, or every arm below is void.
// Y1  THE REPORTED CASE: vid_width 640x480, borderless -> fullscreen_toggle,
//        vid_winmaximize left at the config value -> MUST be ~1920x1111, NOT 640x480.
// Y2  FALSIFIER: identical state, vid_winmaximize 1 -> MUST be exactly 640x480.
//        Y1 and Y2 differ only in that cvar. If they agree, mode 2 is not doing this.
// Y3  ESCAPE HATCH: vid_winmaximize 0 at 1920x1200 -> MUST be exactly 1920x1200.

log_enable 1
log_dir "logs"
log_name "v268y"
developer 1
log_developer 1
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 0
con_notifytime 0
con_notifylines 0
con_notifytime_error 0

wait 200
echo ^5=== v268y: windowed must be maximized (corrected) ===
echo ^5----- Y0: inherited state -- vid_winmaximize MUST read 2 -----
vid_winmaximize
vid_width
vid_height

echo ^5----- Y1: THE REPORTED CASE -- 640x480 requested, config winmaximize, F11 -----
vid_fullscreen_order 1
vid_width 640
vid_height 480
vid_fullscreen 1
vid_restart
waitms 6000
fullscreen_toggle
waitms 6000
screenshot v268y_z
waitms 900
screenshot v268y_1_reported_case
waitms 1200

echo ^5----- Y2: FALSIFIER winmaximize 1, same state, same F11 -> expect 640x480 -----
vid_winmaximize 1
fullscreen_toggle
waitms 6000
fullscreen_toggle
waitms 6000
screenshot v268y_z
waitms 900
screenshot v268y_2_falsifier_fitrule
waitms 1200

echo ^5----- Y3: ESCAPE HATCH winmaximize 0 at 1920x1200 -> expect EXACTLY 1920x1200 -----
vid_winmaximize 0
vid_width 1920
vid_height 1200
vid_fullscreen 0
vid_restart
waitms 6000
screenshot v268y_z
waitms 900
screenshot v268y_3_escape_exact
waitms 1200

echo ^5=== v268y done ===
wait 30
quit
