//   C2  20260921-062636-0.rcpt says `signed view -`, and the file is 483 bytes
//       against 546 for a run that did upload: the digest line is the only
//       difference, which is what "the client declined" should look like.
//   C3  the server log has a `timer: receipt` line for this runid and NO
//       `Receiving` line.  rcptcheck: `1 receipt(s) checked, 0 with faults` --
//       a receipt with no sidecar is a complete receipt, not a broken one.
