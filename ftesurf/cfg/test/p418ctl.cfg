// Patch 418 -- THE CONTROL for the evidence upload: the client declines.
//
// `rec_upload 0`, same route, same server (p418sv.cfg on 27696).  Without this
// arm, "a file appeared on the server" is also what a build that took the file
// WITHOUT asking would produce, and the switch would be decoration.
//
// PRE-REGISTERED PREDICTIONS
//  C1  nothing is staged: no new file under data/staged/, and the client's log
//      says `sidecar dropped -- this run's .rec is on the server`, which is the
//      pre-418 behaviour restored by the cvar.
//  C2  the receipt for this run has `signed view -`.
//  C3  the server gets no .view for this runid -- no `Receiving` line, and only
//      a .rcpt in data/evidence/bhop_eazy/ for it.
// FALSIFIED IF anything is staged or uploaded.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p418ctl
developer 1
cl_idlefps 0
cl_maxfps 100
set rec_enable 1
set rec_hid 1
set rec_upload 0
name "^3P418"

waitms 6000
connect 127.0.0.1:27696
waitms 12000

echo ================================ P418 CTL -- aim and start
cmd zone_goto 0
waitms 1500
setpos -352 -352 144 0 335.3 0
waitms 1500
+jump
waitms 700
-jump
waitms 2000
cmd timer

echo ================================ P418 CTL -- fly to the end zone
noclip
waitms 500
+forward
waitms 1500
waitms 2900
waitms 2000
-forward
waitms 1500
cmd timer
waitms 3000

echo ================================ P418 CTL done
waitms 1000
quit

// RESULT (2026-09-21):
//   ALL THREE HELD.
//   C1  no data/staged/ directory at all: nothing was written.
//   C2  the receipt for this run reads `signed view -`.
//   C3  the server's log has no `Receiving` line and data/evidence/bhop_eazy/
//       holds only the .rcpt for this runid.
//   So the switch is the thing that decides, which is what makes the subject
//   arm a measurement of the feature rather than of the server's appetite.

