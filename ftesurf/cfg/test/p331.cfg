// P331 -- the hover inspector: overlay without the mouse, dithered faces.
//
// PRE-REGISTERED, before the run:
//   * `ent_cursor 1` takes NOTHING: no UI_CursorClaim, the game keeps the
//     mouse (the log carries no cursor-claim line and +forward still works);
//   * aiming straight down at the spawn stands the probe in the start zone's
//     trigger, so the card names a brush entity and the engine dithers its
//     exact faces through ftesurf_enthover (nodepthtest: visible through the
//     floor the eye is above);
//   * the yaw sweep's ent_report lines prove the card's function half --
//     target resolution ("goes to"/"fires ... at x y z") and the On* output
//     lines -- on whatever each ray lands on;
//   * r_showbrushes 1 with r_showbrushes_fill at its 0.25 default shades every
//     hull face in the dither; fill 0 returns the Patch 319 wireframe exactly;
//   * `ent_cursor 0` empties ent_hover_model, so the last screenshot has
//     neither card nor stipple, and the log says off.
log_enable 1
log_dir "logs"
log_name "p331"
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
vid_width 800
vid_height 600
con_notifytime 0
con_notifylines 0
developer 1
log_developer 1

wait 200
map surf_tensor2
waitmap 900
waitms 15000
sv_cheats 1
waitms 500

echo ^5=== P331 1. ent_cursor on, no mouse taken =====================
ent_cursor 1
waitms 800

echo ^5=== P331 2. straight down: the start zone under the spawn ====
// 40 units off the spawn: the info_player_start probe copy no longer
// intercepts the downward ray, so the probe reaches whatever volume the
// spawn actually stands in -- the start zone's trigger brush.
setpos -11736 -13632 13681 90 90 0
waitms 1200
ent_report
waitms 400
screenshot p331_hover
waitms 700
setpos -11776 -13592 13681 90 90 0
waitms 900
ent_report
waitms 300

echo ^5=== P331 2b. a real trigger_teleport, from its own lump =======
// the intro->spawn teleport: a 96x48x128 volume centred 0 -1280 8, target
// "start", whose info_teleport_destination is the spawn itself at
// -11776 -13632 13952.  Standing 40 above its centre and looking down puts
// the probe inside the volume, so the card must say where it goes.
setpos 0 -1280 48 90 90 0
waitms 1200
ent_report
waitms 400
screenshot p331_tele
waitms 700

cvarlist -v ent_view_models
cvarlist -v ent_hover_model
waitms 300

echo ^5=== P331 3. yaw sweep: what each ray lands on =================
setpos -11776 -13632 13681 90 0 0
waitms 900
ent_report
setpos -11776 -13632 13681 90 180 0
waitms 900
ent_report
setpos -11776 -13632 13681 60 45 0
waitms 900
ent_report
waitms 300

echo ^5=== P331 4. r_showbrushes 1, dither fill at default ==========
setpos -11736 -13632 13681 90 90 0
waitms 600
r_showbrushes 1
waitms 1200
screenshot p331_brushfill
waitms 700

echo ^5=== P331 5. fill 0: the Patch 319 wireframe, unchanged ========
r_showbrushes_fill 0
waitms 1200
screenshot p331_wireonly
waitms 700
r_showbrushes 0
r_showbrushes_fill 0.25

echo ^5=== P331 6. off: no card, no stipple, mouse never taken =======
ent_cursor 0
waitms 1200
screenshot p331_off
waitms 700

echo ^5=== P331 DONE ==================================================
wait 60
quit
