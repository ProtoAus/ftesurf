// BUILD 47 -- characterising the legacy-BSP zone finding, which is NOT a
// build 47 regression but is in the function build 47 edited.
//
// OBSERVED on surf_summer_ksf (logs/zhull04.log):
//     zones(sv): 0 on surf_summer_ksf (none)     <- server, and it prints FIRST
//     FTESurf: worldspawn                        <- worldspawn finishes AFTER
//     zones:    12 on surf_summer_ksf (bsp entities)   <- client, from the lump
//
// So the client reads 12 timer zones out of the entity lump and the server
// finds none.  32 of the 1317 installed maps take this path (they have no zone
// JSON but do carry trigger_momentum_timer_* brushes -- scratchpad/
// legacyzones.py).  On those maps the cages draw and nothing times.
//
// TWO CANDIDATE CAUSES, and they need different fixes:
//
//   (a) the entities never spawn at all, so find() has nothing to match
//   (b) they spawn fine, but SV_ZoneLoad's find() runs before they exist --
//       the print order above says the load beat worldspawn to it, which the
//       comment on SV_ZoneFrame ("the deferred load, which has to happen off a
//       frame because worldspawn is too early") says was NOT the intent
//
// ent_census discriminates them.  It runs well after worldspawn, so if the four
// trigger_momentum_timer_* classnames show up in its unhandled list, the
// entities exist by then and the cause is (b) -- an ordering bug, not a
// spawning one.

waitms 2000

map surf_summer_ksf
waitmap 240
wait 60

echo ^5=== summer_ksf: do the timer entities exist after spawn? ===
cmd ent_census
wait 30

echo ^5=== and what does the server think it has? ===
cmd zone_dests
wait 20

echo ^5=== END OF RUN ===
wait 10
quit
