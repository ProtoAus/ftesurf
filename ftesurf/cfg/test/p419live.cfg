// Patch 416-419 LIVE: the whole evidence chain against the Pi, over the real
// network.  A 13th server on 27699 with the deployed engine and progs, the
// route of p418cl.cfg, and the files land in the fleet's own data tree.
//   ssh proto@180.150.62.57, from /srv/nvme/ftesurf-server/game:
//     ./fteqw-svarm64 -basedir /srv/nvme/ftesurf-server/game +set sv_port 27699
//       +set sv_public 0 +set sv_cheats 1 +set rec_enable 1 +set rec_runarchive 1
//       +set run_evidence_ul 1 +set developer 1 +set lobby_master ""
//       +set log_enable 1 +set log_dir logs +set log_name p419livesv +map bhop_eazy
// NOTE: the LAN address -- only the lobby ports are forwarded publicly.
// PREDICTIONS: a .rec with a nonce, a .rcpt whose signature verifies, and a
// .view uploaded from THIS machine to the Pi and matching the signed digest.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p419live
developer 1
cl_idlefps 0
cl_maxfps 100
set rec_enable 1
set rec_hid 1
set rec_upload 1
name "^3P418"

waitms 6000
connect 192.168.1.102:27699
waitms 12000

echo ================================ P418 CL -- aim and start
cmd zone_goto 0
waitms 1500
setpos -352 -352 144 0 335.3 0
waitms 1500
+jump
waitms 700
-jump
waitms 2000
cmd timer

echo ================================ P418 CL -- fly to the end zone
noclip
waitms 500
+forward
waitms 1500
waitms 2900
waitms 2000
-forward
waitms 1500
cmd timer
waitms 3000

echo ================================ P418 CL done
waitms 1000
quit

