// Patches 187-190: clean screenshots.
//
// screenshot_mega, not screenshot: SCR_ScreenShot_Capture re-renders through
// CSQC_DrawView, so the engine's console and notify overlay are not in the
// frame at all.  toggleconsole is gone -- con_stayhidden is 1, so the console
// starts HIDDEN and the toggle in p187c was what opened it.
cfg_save_auto 0
log_name p187d
developer 0
scr_sshot_type png
waitms 2500

echo "=== unrequited: the start zone was almost white ==="
map surf_unrequited
waitms 30000
screenshot_mega p187d_unrequited 1280 720
waitms 2000

echo "=== demise: the smoke, now additive with a scroll ==="
map surf_demise
waitms 48000
screenshot_mega p187d_demise 1280 720
waitms 2000

echo "=== rise: the ivy, DXT5 with a real alpha channel ==="
map surf_rise
waitms 48000
screenshot_mega p187d_rise 1280 720
waitms 2000

echo "=== sodacity: the aztec two-texture blend ==="
map surf_sodacity
waitms 48000
screenshot_mega p187d_sodacity 1280 720
waitms 2000

echo "=== P187D DONE ==="
waitms 1000
quit
