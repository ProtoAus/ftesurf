// Patch 269b: prove the VERDICT mode itself works before handing it to the
// user.  An instrument that has not been run once is a guess with a version
// number.  Two sections, and they must DISAGREE -- a verdict that says "clean"
// in both is broken, not reassuring.

log_developer 0
waitms 2000
map surf_colin_blaster_69000
waitmap 240
wait 60

cl_maxfps 0
cl_idlefps 0
hud_predicted 1
hud_debug 1
hud_speed 1
wait 120

echo ^5=== VERDICT A: with the fix. Expect green/clean.
cl_predict_velblend 0
+forward
waitms 400
-forward
waitms 1000
cl_predtrace -800
waitms 4000

echo ^5=== VERDICT B: old blend restored. Expect red/IS producing it.
cl_predict_velblend 1
+forward
waitms 400
-forward
waitms 1000
cl_predtrace -800
waitms 4000

cl_predict_velblend 0
echo ^5=== END OF RUN ===
wait 20
quit
