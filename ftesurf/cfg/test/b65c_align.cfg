cfg_save_auto 0

// ===========================================================================
// BUILD 65.1 -- DO THE COLONS LINE UP.
//
//     "make the boarding info align to the : part, so Air: Board: and Ramp:
//      the semi-colin lines up"
//
// The rows are drawn from their RIGHT edge (HUD_TextR), so "%5s: " aligned the
// name inside its own string and the anchor then threw that away: a row's left
// edge -- and with it its colon -- sat wherever the rest of the row's width put
// it.  65.1 makes every column right of the name fixed width and reserves the
// percentage column on every row.
//
// WHAT A SCRIPT CAN ACTUALLY PROVE HERE.  A ramp row needs a ramp and a board
// row needs a landing on one, and neither is reachable without hands -- so this
// cannot show Air/Board/Ramp stacked.  It can show the mechanism, because the
// two row builders that disagreed are both reachable from a flat:
//
//   * COMMITTED air rows carry a percentage, so they were shifted LEFT by its
//     width.
//   * The LIVE row at the bottom never has one, so it was drawn on the raw
//     anchor -- about five characters right of every row above it.
//
// That offset is the same defect the board rows show, from the other end, and
// it is in every frame with a live row in it.  If the colons in these shots
// form one vertical line, the reserve works; if the bottom row still hangs
// right, it does not.
//
// SHOT 3 IS hud_seq_units 2, which draws a second line under every row.  That
// line is built by a THIRD piece of code, and a column stops lining up exactly
// where a row is assembled twice.
//
// PREDICTIONS, registered before the run:
//   * every ':' in the column shares one x, live row included
//   * the 'e' of every absolute shares one x, and so does every '+'
//   * the u/s translation lines end where the deltas above them end
//
// FALSIFIED IF: the bottom row is still offset from the rows above it.
// ===========================================================================
log_enable 1
log_dir logs
log_name b65c_align
developer 1

scr_sshot_prefix "screenshots/b65c_"

// Big, because this is a test of single-pixel column alignment and the column
// is 8*scale px at rest.  20 px glyphs make a one-character drift obvious in a
// PNG; 16 px ones make it arguable.
hud_scale 2
hud_seq_size 20
cl_maxfps 250
con_notifylines 0

// Everything on: the widest row the column can build is the one most likely to
// disagree with the narrowest.
hud_seq 1
hud_seq_name 1
hud_seq_abs 1
hud_seq_delta 1
hud_seq_time 1
hud_seq_pct 1
hud_seq_live 1
hud_seq_units 1
hud_seq_hopbreak 1

// Quieter neighbours, so the shot is of the column and not of the HUD.
hud_strafe 0
hud_splits 0

// Harness trap 1 (b63a_logic.cfg): a `map` issued while the engine is still
// initialising is silently dropped.
waitms 5000

map surf_kitsune
waitmap 45
waitms 4000

// Five hops -> five committed Air rows (hopbreak 1, proven in b65b) plus the
// live row underneath them.
+jump
waitms 120
-jump
waitms 520
+jump
waitms 120
-jump
waitms 520
+jump
waitms 120
-jump
waitms 520
+jump
waitms 120
-jump
waitms 520
+jump
waitms 120
-jump
waitms 900

// screenshot CAPTURES ONE FRAME BEHIND: every shot is taken twice and the
// SECOND of each pair is the one to read.
echo ==== 1. energy units, percentages on ====
screenshot
waitms 600
screenshot
waitms 600

echo ==== 2. u/s units ====
hud_seq_units 0
waitms 400
screenshot
waitms 600
screenshot
waitms 600

echo ==== 3. both, stacked -- the third row builder ====
hud_seq_units 2
waitms 400
screenshot
waitms 600
screenshot
waitms 600

echo ==== 4. percentages OFF -- the reserve should vanish, not shift one row ====
hud_seq_units 1
hud_seq_pct 0
waitms 400
screenshot
waitms 600
screenshot
waitms 600

echo ==== END ====
waitms 800
log_enable 0
waitms 500
quit
