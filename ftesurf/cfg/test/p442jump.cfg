cfg_save_auto 0

// ===========================================================================
//  P442JUMP -- a save taken MID-JUMP in a start box is not a save at rest.
//    python tools/p435pre.py --arm jump     (the Patch 435 gate's own driver)
//
//  THE DEFECT.  Patch 435's gate arms a start-box load whose row carries no speed
//  and keeps the load's taint on one that does, and it asked SL_RowSpeed, which
//  measured `vlen([v_x, v_y, 0])` -- HORIZONTAL only.  Its comment reasons entirely
//  about a grounded body (friction, sv_stopspeed), and friction is horizontal; a
//  body mid-JUMP inside the box has vz +302 and no horizontal speed at all, so the
//  row read as AT REST.  The gate then fired, SV_TimerArm cleared the load's
//  TF_SEGMENT|TF_PRACTICE, and the load handed back a CLEAN attempt already rising
//  out of the start box.  The hop dwell goes with it: SV_TimerJumpWatch needs a
//  jumped EDGE and a restored velocity never produces one, so run_t_hopped stays
//  clear and SV_TimerStart finds nothing to consume -- a free jump out of the start,
//  on a map where the start IS a jump.  Found by the review of Patch 441, which sat
//  a guard on top of this gate without looking inside it.
//
//  THE FIX (Patch 442).  SL_RowSpeed returns vlen of the whole vector.  `sl_list`
//  goes with it: a row carrying +302 printed `0 u/s  standing`, which is how the
//  vertical half stayed invisible to anyone reading their own list.
//
//  THE ZONES FIXTURE, as in p435pre: cfg/test/p435.zones.json lowers bhop_eazy's
//  start slab bottom to 48.0 so a placed body is inside it at all (the shipped
//  64.03125 against `origin %.4f` puts it 5e-5 below, where no scan can see it and
//  neither the defect nor the fix engages -- Patch 415's rounding).  Without it this
//  arm passes while measuring nothing.
//
//  ARMS
//   J  SUBJECT: row 3, cfg/test/p442jump.txt -- ARMED, `velocity 0 0 302`, at rest
//      horizontally, inside the slab.  The body rises 57 units (302^2 / 2g at
//      sv_gravity 800) and lands back INSIDE a slab 160 tall, so it does not leave
//      the box on its own and nothing races.  IT DOES START THE RUN, THOUGH, and
//      immediately: bhop_eazy's rule is `start on jump` (`cmd timer`'s first line),
//      so the restored velocity lifting the body off the ground is the start -- J1
//      already reads `running`.  That makes the laundering instant rather than
//      something the player has to walk out to collect; J3 only confirms it holds.
//   R  THE REGRESSION CONTROL, and the reason this arm is not just a one-line diff:
//      a REAL save taken standing in the start box, by the engine, with whatever
//      velocity a grounded body actually has -- not a hand-written 0.0000.  If the
//      3D test broke "a save at rest arms exactly as before", this is where it
//      shows, and it must read the same on both builds.
//
//  PRE-REGISTERED PREDICTIONS
//   J  CONTROL (HEAD before Patch 442): `timer: armed` with `practice 0` and
//      `class: clean` at J1 and J2 -- the gate read the row as at rest and
//      SV_TimerArm cleared the load's taint -- and `running`, still `practice 0` and
//      `clean`, at J3 once the body walks out.  That last line is the laundered run.
//   J  FIXED: `armed` with `practice 1` and `class: segmented` at J1/J2, and
//      `running practice 1 segmented` at J3: the run starts, because an ARMED save
//      that leaves the box starts a run, but it starts as the stitched attempt the
//      load made it.  `arm zone 0` on the fixed build (the latch the file restored)
//      against `-1` on the control (the gate forcing the edge) is the same fact one
//      layer down.
//   R  BOTH builds: `practice 0`, `class: clean`.  And `sl_list` prints that row's
//      speed as 0 u/s, which is the number the whole fix rests on: a grounded body
//      at rest carries nothing in any component.
//  FALSIFIED IF J reads `practice 1` on the CONTROL build (the launder does not
//   reproduce and this arm measures nothing), or J reads `practice 0` on the fixed
//   build, or R is not clean on either (the fix broke the feature the gate exists
//   for), or R's row speed is not 0 (then a grounded save does carry speed and the
//   3D test is the wrong shape, whatever J says).
//
//  RESULT (2026-09-26, both builds, driver exit 0 each way; qwprogs
//   725E18EF7AE4B60D control / 78FCAB85E475B805 fixed, the control a worktree build
//   at the commit before this one)
//   J1/J2/J3 CONTROL: `timer: running` with `practice 0` and `class: clean` at all
//     three reads -- a clean, rankable run produced by loading a save taken mid-jump,
//     and running from the first frame because the start rule is `start on jump`.
//   J1/J2/J3 FIXED: `running` with `practice 1` and `class: segmented`.  The run
//     still starts; it just starts as the stitched attempt the load made it.
//   R0 BOTH builds: standing in the start box, `cmd viewpos` reads
//     `velocity 0.0000 0.0000 0.0000` -- the engine's own number for a grounded body,
//     which is what makes a 3-component test safe for the case the gate exists for.
//   R1/R2 BOTH builds: `armed  practice 0  class: clean`, then `running  practice 0
//     class: clean`.  A real save taken standing still arms clean; the fix did not
//     break the feature.
//   TWO PREDICTIONS THIS FILE GOT WRONG, both about the map and not the fix:
//    - J1 reads `running`, not `armed`: bhop_eazy starts ON JUMP, so the restored
//      velocity lifting the body off the ground is the start.  The laundering is
//      instant rather than something the player walks out to collect.
//    - `arm zone` does not discriminate.  The gate's -1 lasts ONE TICK; the next
//      scan writes the box back before `cmd timer` can be asked, so both builds read
//      `arm zone 0 (armed from 0)` at J1.  The class is the observable.
log_enable 1
log_dir logs
log_name p442jump
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
sv_port 27695
sv_cheats 0
set run_resume 0
vid_fullscreen 0
waitms 5000
map bhop_eazy
waitmap 2400
waitms 3000
menu_restart
ui_close
waitms 1200

echo ==== Z the zone table and the rows this fixture runs under ====
zone_list
waitms 600
cmd sl_list
waitms 800

echo ==== J SUBJECT: row 3, a save taken mid-jump inside the start box ====
cmd sl_goto 3
waitms 900
echo ---- J1 the load: armed, CONTROL practice 0 / clean, FIXED practice 1 / segmented ----
cmd timer
waitms 700
cmd viewpos
waitms 500
echo ---- J2 the hop has landed, still inside the box: the same reading ----
waitms 1500
cmd timer
waitms 800
echo ---- J3 walk out, which STARTS the run: CONTROL a clean ranked run ----
+forward
waitms 1200
-forward
waitms 500
cmd timer
waitms 800

echo ==== R the regression control: a REAL save, taken standing in the box ====
zone_goto 0 90 0
waitms 1800
echo ---- R0 standing in the start box, armed, at rest by the engine's own numbers ----
cmd viewpos
waitms 500
cmd timer
waitms 700
cmd sl_save
waitms 900
cmd sl_list
waitms 800
echo ---- R1 load it back: must arm CLEAN on both builds ----
cmd sl_last
waitms 400
cmd sl_load
waitms 900
cmd timer
waitms 700
+jump
+forward
waitms 1200
-forward
-jump
waitms 500
echo ---- R2 running / practice 0 / clean, or the fix broke the gate's purpose ----
cmd timer
waitms 800

quit
