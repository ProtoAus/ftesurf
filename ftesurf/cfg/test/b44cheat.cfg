// B44CHEAT -- the sv_cheats latch, and the arm that forgives it.
//
// THE ONE PROPERTY THAT IS NOT OBVIOUS: a taint set while the timer is ARMED has
// to survive the arm's own zeroing of run_t_flags and then be consumed by the
// start.  That is what run_t_cheat is for, and it is the same shape as
// run_t_dirty, whose essay records the bug it was written for -- noclip into the
// start zone, drop out of it, walk out, and the timer starts a pristine run from
// a position you flew to.  Re-introducing that one class down would produce a
// header saying `clean` on a run made with the physics unlocked.
//
// FOUR READINGS, AND THE THIRD AND FOURTH ARE THE TEST:
//
//   1  armed, cheats off       cheatlatch 0, class clean       -- the control
//   2  sv_cheats 1             cheatlatch 1, class cheated     -- the edge
//   3  sv_cheats 0             cheatlatch STILL 1              -- the LATCH
//   4  re-arm (zone_goto)      cheatlatch 0, class clean       -- FORGIVENESS
//
// 3 without 4 would be a taint you can never clear; 4 without 3 would be a taint
// that evaporates the moment you turn the cvar back off.  Either alone reads as
// working.  Both together are the rule.
//
// Read the trace by the stringcmd order and not by the echoes -- `cmd viewpos`
// is the in-order marker.  See b43stage.cfg for why.

log_enable 1
log_dir "logs"
log_name "b44cheat"
developer 1
log_developer 1
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0

sv_cheats 0

wait 200
map bhop_eazy
waitmap 1800
waitms 2500

echo ^5=== b44cheat: 1. armed, cheats off -- expect latch 0 class clean ===
cmd zone_goto 0 16.18 0
waitms 700
cmd viewpos
cmd timer

echo ^5=== b44cheat: 2. sv_cheats 1 -- expect latch 1 class cheated ===
sv_cheats 1
waitms 700
cmd viewpos
cmd timer

echo ^5=== b44cheat: 3. sv_cheats 0 -- expect latch STILL 1 ===
sv_cheats 0
waitms 700
cmd viewpos
cmd timer

echo ^5=== b44cheat: 4. re-arm -- expect latch 0 and class clean again ===
cmd zone_goto 0 16.18 0
waitms 700
cmd viewpos
cmd timer

// ---------------------------------------------------------------------------
// 5. AND THE SAME CVAR WITH THE CLOCK RUNNING, which is the other half: while
// ARMED the class message is suppressed (there is no run to spoil yet and
// SV_TimerPractice is state-gated), so nothing above proves the player is ever
// TOLD.  EXPECT a `^3cheated run` line here and `cheats now 1` in the report.
// ---------------------------------------------------------------------------
echo ^5=== b44cheat: 5. walking out clean ===
+forward
waitms 2200
-forward
waitms 400
cmd viewpos
cmd timer

echo ^5=== b44cheat: 6. sv_cheats 1 while RUNNING -- expect a cheated run line ===
sv_cheats 1
waitms 900
cmd viewpos
cmd timer

// ---------------------------------------------------------------------------
// 7. AND THE LATCH GOES INTO THE SAVE FILE.
//
// `cheat` is a new key in data/saves/<map>/saveNNN/state.txt, and only `retry`
// reads it back -- a load is a stitch and re-derives its own class.  It has to
// be there because a retry restores an attempt that MAY NOT HAVE STARTED YET,
// and TF_CHEAT in the saved `flags` word cannot speak for that: the whole reason
// run_t_cheat exists is that the flags are zeroed by the arm and the latch is
// what crosses it.
//
// Taken here, with the run cheated, so the file has something to say.  EXPECT
// `cheat 1` beside `dirty 1` in the state.txt this writes -- checked off disk
// afterwards, because nothing in the game prints a save file back.
// ---------------------------------------------------------------------------
echo ^5=== b44cheat: 7. save while cheated -- expect `cheat 1` on disk ===
cmd sl_save
waitms 700
cmd viewpos
cmd timer

echo ^5=== b44cheat: done ===
waitms 600
quit
