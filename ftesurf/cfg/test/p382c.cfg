// P382C -- Patch 382: the world-time rebase (S3, func_bhop dwell on bhop_arcane),
// the trigger gate (S6, bhop_mom_training_beta) and the engine-noclip release (M).
// Listen host A (entnum 1) + p382t.cfg (B, entnum 2), lobby mode, no zones, no
// runs.  NEEDS Patch 380's engine.  Run as p382a.cfg's header says, with this cfg.
// Map facts (the entity lumps, read with a scratch parser):
//   arcane: func_bhop *30 under (1665.03 -1.55 14507.92) -- b37a.cfg's spot; its
//     dwell teleport lands at stage1a (1472 0 14416).
//   training: trigger_push *123 x 8000..8192 y -10752..-10624 z -2432..-2426,
//     pushdir 0 0 0 speed 400 (it carries you east off the pad in ~0.5 s --
//     p335k5.cfg's pad 17); trigger_multiple *218 x -8576..-7712 y 11008..11648
//     z 0..128, wait 1 (p338c.cfg), OnStartTouch/OnEndTouch outputs (delay 0);
//     trigger_setspeed *206 x -5504..-4864 y 960..1856 z 0..128.  (8350 -10688)
//     is in no push/setspeed/multiple/teleport box.
// PRE-REGISTERED
//  S3a calibration, no hold, sv_bhop_time_limit 5: viewpos x~1665 at +3.5 s (on
//      the block), x~1472 at +6.5 s (the dwell fired at ~5 s after landing).
//  S3  entry at ~1.0 s of dwell, 10 s hold, ESC (3 s): x~1665 at the release
//      +0.1 s and +2.1 s, x~1472 at +4.6 s -- the teleport comes ~4 s after the
//      release, not inside the hold and not at the first packet after it.
//  C3  CONTROL, must fail S3: the rec_watch pin at the same ~1.0 s -- the dwell
//      fires INSIDE the pin (x~1472 at +6 s, still pinned).  A build without the
//      rebase would read x~1472 at S3's release +0.1 s.
//  S6a on the push pad, 150 ms after arriving: "spectate: a trigger is touching
//      you -- step out of it first".
//  S6b inside the trigger_multiple: the same refusal.
//  S6d setpos out of *218 to (8350 -10688), `rec_spec` 40 ms later: the touch
//      stamp is stale, its OnEndTouch not yet fired (0.06-0.09 s) -- "a trigger
//      has not seen you leave yet".  "touching you" instead: VOID (no packet ran).
//  S6e inside the trigger_setspeed *206: "a trigger is touching you".  VOID if
//      viewpos z is not in 0..128 (no floor there).
//  S6c CONTROL, must be ACCEPTED: back into *218, then setpos to (8350 -10688) and
//      `rec_spec` 1 s later: "spectate: watching ...", then "released (leave)".
//      Refused here, S6a/b/d/e prove nothing about triggers.
//      viewpos z settles within 1 s at each spot (a floor; else pick another).
//  M   held at S6c's spot, `noclip` (sv_cheats 1): "released (move)" within a
//      packet; the release line has no "rolled back".
// FALSIFIED IF S3 teleports inside the hold or at release +0.1 s, C3 does not
//   teleport inside the pin, S6a/b/d/e are accepted, or S6c is refused.
//
// RESULT (2026-09-19, host engine\release\fteqw64 with Patch 380): ALL HELD.
//   S3a: x 1665 then 1472 (the dwell fires ~5 s after landing).  S3 (13 s hold):
//   x 1665.2 at release +0.1 and +2.1; the stage1a cluster (1472) between +2.1 and
//   +4.6.  C3: under rec_watch the dwell fires inside the pin (1472 while pinned).
//   S6a push / S6b multiple / S6e setspeed: "a trigger is touching you"; S6d: "a
//   trigger has not seen you leave yet"; S6c control accepted, then released (leave).
//   M: engine noclip while held -> "released (move)", no "rolled back".
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p382c
developer 1
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
sv_port 27682
sv_cheats 1
set lobby_enable    1
set lobby_avatars   1
set lobby_nocollide 1
set lobby_av_stream 1
set lobby_vote      0
set run_resume      0
set run_spec_countdown 3
waitms 5000
map bhop_arcane
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 500
echo ^5==== waiting for p382t ====
waitms 45000
status
set sv_bhop_time_limit 5
echo ^5==== S3a: calibration, no hold ====
setpos 1665.03 -1.55 14507.92
waitms 3500
cmd viewpos
waitms 3000
cmd viewpos
echo ^5==== S3: hold at ~1 s of dwell, 10 s, ESC ====
setpos 1665.03 -1.55 14507.92
waitms 1200
cmd rec_spec 2
waitms 10000
cmd viewpos
cmd rec_spec 0
waitms 3100
echo ^5---- release +0.1
cmd viewpos
waitms 2000
echo ^5---- release +2.1
cmd viewpos
waitms 2500
echo ^5---- release +4.6
cmd viewpos
echo ^5==== C3: CONTROL -- the rec_watch pin ====
setpos 1665.03 -1.55 14507.92
waitms 1200
cmd rec_watch 1
waitms 6000
cmd viewpos
cmd rec_watch 0
waitms 1000
echo ^5==== to bhop_mom_training_beta ====
map bhop_mom_training_beta
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 25000
status
echo ^5==== S6a: on the push pad ====
cmd setpos 8016 -10688 -2426
waitms 150
cmd rec_spec 2
waitms 1500
cmd viewpos
echo ^5==== S6b: inside the trigger_multiple ====
cmd setpos -8128 11328 40
waitms 1000
cmd viewpos
cmd rec_spec 2
waitms 800
echo ^5==== S6d: 40 ms after leaving the trigger_multiple ====
cmd setpos 8350 -10688 -2420
waitms 40
cmd rec_spec 2
waitms 1500
echo ^5==== S6e: inside the trigger_setspeed ====
cmd setpos -5184 1408 40
waitms 1000
cmd viewpos
cmd rec_spec 2
waitms 800
echo ^5==== S6c: CONTROL -- 1 s after leaving the trigger_multiple ====
cmd setpos -8128 11328 40
waitms 1000
cmd setpos 8350 -10688 -2420
waitms 1000
cmd viewpos
cmd rec_spec 2
waitms 1500
cmd rec_spec 0
waitms 3600
echo ^5==== M: engine noclip while held ====
cmd rec_spec 2
waitms 1500
noclip
waitms 1500
cmd viewpos
waitms 500
echo ^5==== p382c done ====
quit
