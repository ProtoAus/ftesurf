// RT1SV -- what a lobby does with a retry and a save-load mid-run (server half;
// client rt1cl.cfg).  The plan's open item "a lobby retry or save-load drops the
// recording" was code reading: a stream cannot rewind (SV_RecRewind).  Zones as
// ms1listen.cfg; stub `b65stub.py cert 8131`, whose POST lines are the record.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name rt1sv
developer 1
exec cfg/lobby/lobby.cfg
sv_cheats 0
set lobby_master "http://127.0.0.1:8131"
sv_guidkey "ftesurf-rt1-probe"
sv_maxrate         0
sv_maxdownloadrate 0
set lobby_master_key  "stub-key-not-a-real-one"
set lobby_master_rate 30
set run_resume 0
map surf_666
waitms 100000
quit
// RESULT: see rt1cl.cfg.
