// Private overlay; --recording supplies a surf_kitsune control .rec (tools/runlines_smoke.py).
// Patch 608: a ramp leave is stamped at the ride's last real contact.  One replay's mark
// table, Segments rows and colouring, in the forms p449mark.py and p452col.py read; graded
// with them and with tools/test_runlines_rampleave.py against the recording itself.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name runlines_smoke
con_notifytime 0
cl_idlefps 0
cl_maxfps 100
set hud_watch_skipidle 0
set hud_watch_path 1
sv_public 0
sv_port 27612
waitms 2000
map surf_kitsune
waitmap 60
waitms 4000
menu_restart
ui_close
// An authored body, no map: five ride shapes the recording below does not hold.  A replay
// for another map stops within a frame, so its dump shares the open's batch.
echo === p449mark FIXTURE cfg/test/runlines_rampshapes.rec ===
replay cfg/test/runlines_rampshapes.rec
replay status
replay marks 0
replay seq
waitms 300
echo === p449mark FIXTURE cfg/test/runlines_sample.rec ===
replay cfg/test/runlines_sample.rec
waitms 2000
replay status
replay marks 0
replay seq
waitms 300
replay pause
replay seek 40
waitms 1200
hud_lines_marks 1
hud_lines_nums 1
hud_lines_speed 1
hud_lines_time 1
hud_lines_names 1
echo === p452col C3 speed ===
hud_watch_path_color 0
waitms 700
replay colours 0 32
waitms 400
echo === p452col C3 gain ===
hud_watch_path_color 1
waitms 700
replay colours 0 32
waitms 400
echo === p452col C2 energy ===
hud_watch_path_color 3
waitms 700
replay colours 0 32
waitms 400
// Every point: a ride's tail is five or six samples, and a stride of 32 lands on few.
echo === p452col C1 contact ===
hud_watch_path_color 2
waitms 700
replay colours 0 1
waitms 1000
screenshot runlines_rampleave.png
waitms 500
echo RUNLINES COMPLETE
quit
