cfg_save_auto 0
// P1573: the ranked profile's click/touchpad guard.  python tools/p1573guard.py --progs <dir> --out <root> [--control]
// Fresh basedir, so the engine defaults (nolegacy 0, touchpad 1) are what the migration finds.
name P1573
fs_cache 0
log_enable 1
log_dir logs
log_name p1573guard
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
waitms 3000
connect 127.0.0.1:27561
waitmap 60
waitms 8000
menu_restart
ui_close
waitms 1000
echo ==== P1573 MIGRATED ====
in_rawinput_nolegacy
in_rawinput_touchpad
cmd timer
waitms 800
echo ==== P1573 CLICKS ====
in_rawinput_nolegacy 0
in_rawinput_touchpad 0
waitms 800
cmd timer
waitms 800
echo ==== P1573 SPACE ====
// review: " 1" and 0.99999999 read 1 through cvar() (Q_atof) and 0 through .ival (Q_atoi), so the engine
// leaves clicks open; both must read `clicks`.
in_rawinput_nolegacy " 1"
waitms 800
cmd timer
waitms 800
echo ==== P1573 NEARONE ====
in_rawinput_nolegacy 0.99999999
waitms 800
cmd timer
waitms 800
echo ==== P1573 TOUCHPAD ====
in_rawinput_nolegacy 1
in_rawinput_touchpad 1
waitms 800
cmd timer
waitms 800
echo ==== P1573 OK ====
in_rawinput_touchpad 0
waitms 800
cmd timer
waitms 800
echo ==== P1573 MIDRUN ====
// surf_dune: the run starts ~1.3 s into +forward and ends ~2.5 s in (back in the start), so the toggle
// and its read sit inside that window.
cmd zone_goto 0
waitms 600
+forward
waitms 1450
in_rawinput_nolegacy 0
waitms 200
in_rawinput_nolegacy 1
waitms 200
cmd timer
waitms 900
-forward
waitms 800
echo ==== P1573 END ====
quit
