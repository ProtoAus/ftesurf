// Patch 396/397 -- the dedicated server every p396*/p397* client arm joins.
// surf_aircontrol: all 46 trigger_teleports land at yaw 90 (entity lump), 66 tick, zones.
// Run from C:\FTESurf, log_name on the command line (a cfg's own would override it):
//   <S0|S1>\fteqwsv64.exe +set sv_port 27666 +set log_enable 1 +set log_dir logs
//     +set log_name p396sv-<tag> +exec cfg/test/p396sv.cfg
// S0 = C:\FTEQuake\fteqwsv64.exe (int newa), S1 = fteqw engine\release\fteqwsv64.exe.
// run_resume 0: a harness quit must not park a run into data/resume.
developer 1
log_developer 1
sv_public 0
sv_cheats 1
sv_maxrate 0
sv_maxdownloadrate 0
set run_resume 0
map surf_aircontrol
set run_resume 0
