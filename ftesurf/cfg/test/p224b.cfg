// Patch 224, part b -- the two readers that are NOT the engine's own movevars.
//
// p224a proved the cvars land and the banner says 100 Hz.  Both of those are
// read inside sv_phys.c, so they would still pass if the ruleset arrived too
// late for everyone else.  Two readers arrive earlier or elsewhere, and each
// is the reason for one line of the patch:
//
//   run_t_tick -- the gamecode latches pm_ticrate ONCE per map, in
//     SV_TimerMapInit, which StartFrame reaches from the two settle frames
//     inside SV_SpawnServer.  Those frames run BEFORE the old Patch 170 call
//     site, which is why SV_ApplyGamemode was moved up to just before
//     Cvar_ApplyLatches.  `timer` prints this value, so it is directly
//     readable: it must say 0.01 on a bhop map.  A stale 0.015 here would
//     convert every recorded time on the map by the wrong rate -- a silent
//     1.5x error in the leaderboard, not a movement bug.
//
//   the serverinfo mirror -- what the CLIENT predicts and draws with.  The
//     engine client reads pm_* straight out of serverinfo (cl_main.c:3244+)
//     and the HUD reads sv_* out of the gamecode's mirror, so both have to
//     carry the mode's numbers or the client mispredicts every ramp.
//
// Also here: a map whose gamemode is a CATEGORY fallback.  kz_ maps resolve to
// gamemode 5 (kz), there is no cfg/mode_kz.cfg, and the category is climb --
// so this must report `kz` and then quietly run the base ruleset rather than
// erroring or loading something else.

log_enable 1
log_name p224b
developer 0
cfg_save_auto 0
cl_idlefps 0

wait 200
echo ^5=== p224b: the other readers ===

map bhop_futile
waitmap 600
wait 90

echo ^5--- the gamecode's latched tick (expect: tick 0.01) ---
cmd timer
waitms 600

echo ^5--- what the client is told (expect pm_ticrate 0.01, sv_airaccelerate 1000) ---
serverinfo
waitms 800

echo ^5--- and back on surf (expect: tick 0.015) ---
map surf_null
waitmap 240
wait 90
cmd timer
waitms 600

echo ^5=== p224b done ===
wait 30
quit
