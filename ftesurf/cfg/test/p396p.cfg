// Patch 396 review -- ARM P, provoking finding 1: a crossing moved 3+ commands later onto a
// command sampled before the first snap.  PRE-REGISTERED 2026-09-20, before any row ran.
// Rep body = p396c's (graded by grade396.py kind c); server p396sv (S1, rebuilt) on 27666.
// Extra command line: +set p396_snap <0|1> +set p396_netfps <n> +set p396_nudge <s>, applied after
// connect (cl_netfps is archived and CSQC's Net_MatchTicrate resets it at map load).
// +set cl_predict_angledebug 1 (decisions only: at 300 Hz the per-command trace fills the 512-line
// log); an applied line carries its command's yaw, a skip-self line too (review build).
// Clients: C1old = the committed 396 build (fteqw64 a88d9d09, skip-self window 1-2 commands) and
// C1 = the review build.  300 fps, cl_delay_packets 120, 12 reps each.
//   P1  netfps 66.6667, snap 1, nudge 0 (delay alone)
//   P2  netfps 300, snap 0, nudge 0: sub-tick commands, so a one-tick carry misprediction moves
//       the crossing by up to 4 commands
//   P3  P2 + cl_predict_timenudge -0.03: the chain runs ~9 commands behind the newest sent, so
//       the first snap fires with pre-snap commands after it
// PREDICTIONS
//  Q1  P1: no moved crossing in either client (no skip-self, one applied snap per rep).
//  Q2  P2/P3: C1old doubles at least one rep, its dump showing a second applied snap >= 3
//      commands after the first on a command sent at yaw 0 (the defect); P3 more often than P2.
//  Q3  C1: every graded rep PASS in every cell; where C1old would double, C1 logs skip-self with
//      slot seq >= 3 behind and the command's trace yaw 0.
// FALSIFIED IF any graded C1 rep is not PASS.  Q2 failing = not provoked (reported as such).
// RESULT 2026-09-20 -- Q1 HELD; Q2 HELD in P3, not in P2; Q3 HELD.  Build and progs as p396a's
// RERUN 2 RESULT; C1old = fteqw64 a88d9d09.
//   P1 (delay 120 alone)  C1old 12/12 PASS, C1 12/12 PASS, no moved crossing in either.
//   P2 (netfps 300, snap 0)  C1old VOID: 11 NO-CROSS, 1 PASS.  The one-tick carry jitter (prederr
//      15.6 u, 17-29 a rep) let the client cross and turn before the server reached the trigger,
//      so the server never crossed.  C1 12/12 PASS; its first crossing came ~8 commands later than
//      C1old's, which is unexplained -- the cell tests nothing either way.
//   P3 (P2 + timenudge -0.03)  PROVOKED.  C1old 10 DOUBLE, 2 PASS: each DOUBLE reads "snap N ...
//      rot 90.000 view 0.000 -> 90.000 applied" and then, ~20 ms later, "snap N+4 or N+5 cmd 0.000
//      rot 90.000 view 90.000 -> 180.000 applied" -- the moved crossing landing on a command sent
//      before the first snap -- after which "match seq N+5 -> 0.000" keeps the 180.  That is the
//      review's finding 1, measured.  C1 12/12 PASS: the same crossings read "skip-self (slot seq
//      N, cmd 0.000 base 90.000)" at d = 4-5 in 9 of 12 reps; in three the server's delta then
//      took "rebase ... -> 0.000" instead of match, the slot's new sequence being 3 past its basis.
