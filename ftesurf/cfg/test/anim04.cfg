// ANIM04 -- what does hl2_animated 1 COST, on the map that is worst for it.
//
// anim03 settled that the flipbook advances (ON series 99.70%/11.59% of pixels
// moving between shots 3.5 s apart against an OFF control of 0.09%/0.05% at the
// same vantage and spacing -- an 87x ratio in mean delta), and that
// smokeanimated.vtf reaches the GPU as `Array 256*256*331`, which retires the
// "sz.z is 1" hypothesis outright.  What is left before the default can move is
// the cost, and "does anything break".
//
// WHY DEMISE IS THE WORST CASE.  ELLY/ANIMATED_SMOKE is 552 displacements
// spanning 31552x27067x27067 units -- a shell around the whole map -- plus
// elly/animated_smoke_skybox.  Both are `translucent 1 additive 1`, so they are
// drawn, blended, and cover most of the screen from most vantages.  If the array
// sampler and the GLSL 130 context cost anything measurable, they cost it here.
//
// INTERLEAVED, because a single before/after on this machine is noise: the
// benchmarking note measured timerefresh at 14x spread. Three OFF/ON pairs at
// each of two vantages, alternating, so drift over the run cancels instead of
// being attributed to the cvar.  cl_maxfps 0 and the FPS is read off the HUD
// corner -- NOT timerefresh, which never runs CSQC_UpdateView and so cannot
// measure anything this HUD or these shaders do.
//
// Vantage A is seam02's smoke-covered overlook (its 72.82% pixel-diff floor was
// this smoke scrolling, so the sheet demonstrably fills that frame).  Vantage B
// is seam02's vantage D, a normal in-map view, so the pair brackets "worst case"
// and "typical".
//
// The order within each pair is OFF then ON, and the pairs are read as three
// independent replicates rather than averaged blind.

log_enable 1
log_dir "logs"
log_name "anim04"
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 0
vid_fullscreen 0
developer 1
log_developer 1
con_notifytime 0
con_notifylines 0
con_notifytime_error 0

wait 200

hl2_animated 0
map surf_demise
waitmap 1800
waitms 12000
sv_cheats 1
waitms 400
noclip
waitms 400
developer 0
waitms 500

echo ^5=========== vantage A -- smoke-covered overlook =============
setpos 938.8 -1264.1 13407.1 35.00 45.00 0
waitms 4000

hl2_animated 0
waitms 3000
screenshot anim04_a_off1
waitms 900
hl2_animated 1
waitms 3000
screenshot anim04_a_on1
waitms 900
hl2_animated 0
waitms 3000
screenshot anim04_a_off2
waitms 900
hl2_animated 1
waitms 3000
screenshot anim04_a_on2
waitms 900
hl2_animated 0
waitms 3000
screenshot anim04_a_off3
waitms 900
hl2_animated 1
waitms 3000
screenshot anim04_a_on3
waitms 900

echo ^5=========== vantage B -- a normal in-map view ===============
setpos 9235.6 -4034.9 13436.4 20.00 80.00 0
waitms 4000

hl2_animated 0
waitms 3000
screenshot anim04_b_off1
waitms 900
hl2_animated 1
waitms 3000
screenshot anim04_b_on1
waitms 900
hl2_animated 0
waitms 3000
screenshot anim04_b_off2
waitms 900
hl2_animated 1
waitms 3000
screenshot anim04_b_on2
waitms 900
hl2_animated 0
waitms 3000
screenshot anim04_b_off3
waitms 900
hl2_animated 1
waitms 3000
screenshot anim04_b_on3
waitms 900

echo ^5=== anim04 done ===
wait 30
quit
