// Patch 817 review round 2: a plain save taken during a run after an off-profile step carries
// the step (SV_SaveWriteState), so the cold load's new latch cannot forgive it.
// tools/p817failrewind.py --prof2 grades it.
cfg_save_auto 0
name P817
fs_cache 0
log_enable 1
log_dir logs
log_name p817prof2
cl_idlefps 0
cl_maxfps 1000
vid_fullscreen 0
waitms 3000
connect 127.0.0.1:27561
waitmap 60
waitms 8000
menu_restart
ui_close
hud_trail 1
rec_savelock 1
cl_slpredict 1
waitms 1000
cmd zone_goto 0
waitms 400
+forward
waitms 1800
m_accel 1
waitms 150
m_accel 0
waitms 150
echo ==== P817 SAVE ====
sl_save
waitms 300
cmd timer
waitms 1200
-forward
waitms 800
echo ==== P817 LOAD ====
+sl_hold
waitms 900
-sl_hold
waitms 300
cmd timer
waitms 500
echo ==== P817 END ====
quit
