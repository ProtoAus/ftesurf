// FTESurf Patch 196, run A -- REPRODUCE the P186 exit crash, with symbols this time.
//
// P186's entry says "no symbols are available (the build is stripped to an external PDB
// that is not produced)".  That is wrong, and it is why this was never root-caused:
//   * engine/Makefile:2094-2096 links to $(EXE_NAME).db and STRIPS THAT to the shipped
//     exe, so engine/release/fteqw64.exe.db is a full unstripped copy of the binary that
//     is running.  Re-stripping it reproduces the deployed exe byte for byte apart from
//     the PE timestamp, so the RVAs line up.
//   * sys_win.c:633 nettest_CrashAddrLogger is registered UNCONDITIONALLY in release
//     (sys_win.c:4674-4679) and already writes the faulting address AND a 28-frame
//     CaptureStackBackTrace to crashaddr.txt next to the running exe.
// So a repro here is directly symbolisable with addr2line.  No new instrumentation.
//
// The arm being reproduced is the one P186's control table calls "cache mounted,
// directory populated -> crash (repeated)".  Sequence, and why each step is needed:
//   1. fs_assetcache 1 with the directory still absent.  At this point there is NO cache
//      searchpath: it is created inside FS_ReloadPackFilesFlags (fs.c:5813) and startup
//      already ran with the cvar at 0.
//   2. map surf_utopia -- FS_AutoMountForMap mounts TF2, which reloads the packfiles and
//      therefore creates the (still empty) cache searchpath.  25 files are harvested.
//   3. map bhop_aberrant -- needs no pack, so TF2 is dropped; another reload, and now the
//      cache searchpath is created over a POPULATED directory.
//   4. map surf_utopia again -- the confirming visit.  This is the first load that
//      actually RESOLVES files out of the cache searchpath, which is the state the crash
//      correlates with and the thing no control arm reproduced.
//   5. quit.
//
// cfg_save_auto 0 is the first line and is not optional: fs_assetcache is CVAR_ARCHIVE,
// and an earlier P186 run archived "1" into ftesurf.cfg, which then invalidated a whole
// control arm.  Private log name, shared gamedir.

cfg_save_auto 0
log_name p196a
developer 0
fs_loadstats 1
fs_automount 1
fs_autounmount 1
waitms 4000

echo "=== P196A: reproducing the P186 exit crash ==="
fs_assetcache 1
fs_cache_info
waitms 1000

echo "--- 1. surf_utopia, first visit: mounts TF2, harvests ---"
map surf_utopia
waitmap 180
waitms 12000
fs_cache_info

echo "--- 2. bhop_aberrant: drops TF2, reload sees a POPULATED cache dir ---"
map bhop_aberrant
waitmap 180
waitms 8000

echo "--- 3. surf_utopia, confirming visit: reads back OUT of the cache ---"
map surf_utopia
waitmap 180
waitms 12000
fs_cache_info

echo "=== P196A: quitting now -- this is where it dies ==="
waitms 2000
quit
