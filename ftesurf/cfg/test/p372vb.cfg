// P372VB -- the second voter (server: p372sv.cfg; the predictions are in p372va.cfg).
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p372vb
developer 0
cl_idlefps 0
cl_maxfps 100
rate  2000000
drate 5000000
vid_fullscreen 0
set name vB
set cl_sendguid 2
waitms 6000
connect 127.0.0.1:27642
waitms 12000
set hud_chat_time 600
waitms 16000
echo ==== B C+34 ====
say !nominate utopia
waitms 6000
say !nominate bhop_HeLL
waitms 6000
echo ==== B C+46: !extend ====
say !extend
waitms 6000
say !extend
waitms 30000
echo ==== B C+82 ====
cmd vote_cast 1
waitms 34000
echo ==== B C+116 ====
cmd vote_cast 2
waitms 78000
echo ==== B C+194: !rtv in the hold ====
say !rtv
waitms 30000
echo ==== B C+224: !rtv on bhop_HeLL ====
say !rtv
waitms 4000
cmd vote_cast 2
waitms 138000
quit
