// cfg_save_auto 0 FIRST: this run sets archived cvars and must never write them
// into ftesurf.cfg (cl_main.c:2535).
cfg_save_auto 0

// ===========================================================================
//  P439HOLD -- a save-lock hold does NOT arm a func_bhop dwell.  MEASUREMENT ONLY.
//
//  Two-process arm, because the hold has to be taken by a client command and the
//  dwell is a server-side mover.  From C:\FTESurf, with the server on 27677:
//    C:\FTEQuake\fteqwsv64.exe +set sv_port 27677 +set sv_public 0
//      +set log_enable 1 +set log_dir logs +set log_name p439sv
//      +set log_developer 1 +map bhop_arcane
//    then: ftesurf64.exe -WindowStyle Minimized +exec cfg/test/p439cl.cfg
//  bhop_arcane.bsp is NOT in ftesurf/maps and is not in git: copy it from the
//  local Momentum install first (`maps/bhop_arcane.bsp`, 25 MB, 1122 func_bhop
//  platforms -- the census line the server prints at map init is the proof it
//  loaded).  Remove it after; it is a Steam asset, not a repo file.
//
//  WHY THIS EXISTS.  BACKLOG claimed a func_bhop dwell fires OnActivate and
//  writes a `bhop` warp record into a held body's run.  It does not, and the
//  reason is the mover rather than the hold: a save-lock hold is MOVETYPE_NONE,
//  sv_user.c:8097 maps that to PM_NONE, PM_NONE clears FL_ONGROUND, and
//  .groundentity is written only inside `if (pmove.onground)` (sv_user.c:8887) --
//  so it goes STALE the moment the hold starts, and SV_BhopFrame reads `world`.
//  No block, no dwell, no teleport.  The route below reproduces that, with the
//  prints that settle it.
//
//  ROUTE, and every step of it cost a run to find:
//   A  join, then WAIT.  bhop_arcane downloads ~7 s of models before `spawn`, and
//      every stringcmd sent before that arrives at a server with no client yet and
//      is dropped with no error anywhere -- which reads as "the command did
//      nothing".  25 s is the number this cfg uses.
//   B  `zone_goto 0` puts the body at 608 592 14144 inside the start region
//      (x 256..1472, y 64..780, z 14144..14400).  `+forward` at yaw -90 walks it
//      to y 96 and STOPS -- 32 u short of the leave edge -- so the run never
//      starts and there is no sidecar.  A jump is the wrong gesture: `run_rearmhop
//      1` re-arms on the first jump out of a start box ("start re-armed -- one
//      jump out of the start") and the start rule refuses the second ("hopped
//      start -- one jump out of the start, or walk out").  `+right` ALONE only
//      turns.  The last stretch is BOTH keys, which walks it out at y ~90 and
//      starts the run.
//   C  `sl_save` writes save001; `sl_goto 1` sets the cursor to the last row (the
//      client's own `1` key sends sl_load+sl_hold in one frame, and sl_hold with
//      no row under the cursor returns silently).  `sl_load` + `sl_hold` in the
//      same frame is the gesture that takes the hold: Patch 428 only accepts a
//      hold in the SAME SERVER FRAME as its load, because the placement freezes
//      the body and a later frame reads an origin the mover already moved.
//   D  `cmd viewpos` twice, 4 s apart.  The origin and the velocity are the
//      observables; the server log's `bhop frame first: ground 0 ... slheld 1` is
//      the mechanism.
//
//  OBSERVABLES
//   server log  `func_bhop: 1122 solid platform(s)` (the map really has them)
//               `hold: TAKEN`-equivalent: `save 1 -- run resumed at ...` on the
//                 client, and no `warp`/`OnActivate` line at all
//               `bhop frame first: ground 0 isbhop 0 movetype 0 slheld 1` -- the
//                 one-shot print that says the mover saw no block under a held body
//               NO `bhop dwell fires` line, ever
//   client log  `setpos 1472.0 0.0 14400.0` and `velocity 0.0000 0.0000 0.0000`
//                 at A (just after the hold) and at B (4 s later), IDENTICAL
//
//  RESULT (2026-09-23, Patch 438's build, before any of Patch 439's guards were
//   written -- so this is the baseline, and it already reads clean).  The hold was
//   taken (`hold set: hold 1 row 0 edict 1 movetype 3` with the debug build), the
//   body stayed at 1472 0 14400 with zero velocity across 4 s, `bhop dwell fires`
//   never printed, and every one of the 4201 SV_BhopFrame calls in the window read
//   `ground 0`.  BACKLOG's claim is FALSIFIED for this map and this gesture, and
//   the item now names the half that is still open (triggers a held body is
//   already touching, and the push-once spend) instead.
//   THREE TRAPS THIS ARM HIT, all recorded above because each one cost a run:
//   stringcmds sent before `spawn` vanish silently; `zone_goto`'s placement leaves
//   the body 32 u inside the start box on this map; and `sl_hold` with an empty
//   cursor returns without a word, so a save that landed in slot 1 after `sl_goto
//   1` reported nothing at all.
log_enable 1
log_dir logs
log_name p439cl
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
vid_fullscreen 0
waitms 4000
connect 127.0.0.1:27677
waitms 25000
menu_restart
ui_close
waitms 2000

echo ==== A leave the start box WALKING, so a run and a sidecar exist ====
zone_goto 0 90 0
waitms 3000
cmd viewpos
waitms 500
+forward
waitms 2500
-forward
waitms 500
cmd viewpos
waitms 500
+right
+forward
waitms 1500
-right
-forward
waitms 800
cmd viewpos
waitms 500
echo ---- A must read running / recording 1, or there is no sidecar to reload ----
cmd timer
waitms 700

echo ==== B save, cursor to it, then load+hold in one frame ====
cmd sl_save
waitms 1500
cmd sl_goto 1
waitms 900
cmd sl_load
cmd sl_hold
waitms 800
echo ---- A the held body: origin and velocity, read at once ----
cmd viewpos
waitms 4000
echo ---- B the same read 4 s later: sv_bhop_time_limit is 0.1 ----
cmd viewpos
waitms 1000

quit
