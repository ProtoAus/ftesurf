// Patch 881 arm, listen server, through tools/runlines_smoke.py:
//   python tools/runlines_smoke.py ftesurf/cfg/test/p881net.cfg --mount --timeout 700 \
//     --ssqc <qwprogs> --csqc <csprogs> --mqc <menu> --output-dir <task root>/artifacts
//   N surf_network2008_final.  spawn_timer (refire 30) does jail Enable, spawn Disable.
//     N1 before it: into the fall box under the start (*40, CT -> fall2 1952 4048 5928);
//     its brushes are GRATE|TRANSLUCENT, which missed the BSPTRIGGER touch mask before P881.
//     N2 after it: the same box.  N3 Lex's rewind point of 01:33 (-1192 -2024 2738).
//   R rope materials (P886), the shortest span of each, screenshots.  Grade the log: each
//     rope material appears as a `[shader] <name>.vmt` line and in no "did not resolve" line.
//   Control for N: the build without P881 (N1/N3 stay put on the box floors).
cfg_save_auto 0
log_enable 1
log_dir logs
log_name runlines_smoke
con_notifytime 0
cl_idlefps 0
cl_maxfps 100
vid_vsync 0
vid_fullscreen 0
vid_width 1280
vid_height 720
sv_public 0
set run_resume 0
developer 1
log_developer 1
scr_sshot_type png
waitms 1500

map surf_network2008_final
waitmap 120
waitms 5000
menu_restart
ui_close
waitms 500
echo ==== N1 fall box before the timer ====
setpos 1856 2624 4040 0 0 0
waitms 1500
cmd viewpos
waitms 300
echo ==== N2 wait for the 30 s timer ====
waitms 26000
echo ==== N2 fall box after the timer ====
setpos 1856 2624 4040 0 0 0
waitms 400
cmd viewpos
waitms 1500
cmd viewpos
waitms 300
screenshot p881_n2
waitms 2500
echo ==== N2 wait for back_to_spawn ====
waitms 20000
cmd viewpos
waitms 300
echo ==== N3 Lex's rewind point ====
setpos -1192 -2024 2738 66 -90.8 0
waitms 1500
cmd viewpos
waitms 1500
cmd viewpos
waitms 300

map surf_despair
waitmap 120
waitms 6000
echo ==== R1 single_chain ====
noclip
setpos 10436 -6970 4664 3 0.0 0
waitms 1000
screenshot p881_r_despair
waitms 2500

