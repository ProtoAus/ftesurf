// PROBE_B4JUMP -- surf_prosurf BONUS 4's push-on-jump pad.  Does OnJump ever fire?
//   ftesurf64.exe -WindowStyle Minimized +exec cfg/test/p414jumpwalk.cfg
//   (cwd MUST be C:\FTESurf)
// DIAGNOSTIC ONLY, no patch number claimed yet.
//
// THE SUBJECT, read raw from the entity lump (bsplib.parse_ents LOWERCASES keys,
// which is blind to exactly the distinction that matters here -- see below):
//   trigger_multiple hammerid 1216059, model *744, spawnflags 1, wait 64, solid 6
//   AABB (-15760, 12352, -32) .. (-15632, 12480, -30)   -- TWO UNITS TALL
//   OnJump  !activator,AddOutput,basevelocity 2000.000000 0.000000 0.000000,0,-1
// i.e. +x, 2000 u/s, HORIZONTAL, fired on jump.  It is the floor of the square
// recess cut into bonus 4's start box (box: x -16224..-15616, y 12096..12736,
// z -32..448; spawn `sneakyy_rulldar_bonus` at -16000 12416 96).
//
// THE KEY IS "OnJump", EXACT CASE, so ED_ParseUnknownEpair's case-sensitive
// `substring(key, 0, 2) == "On"` takes it.  That hypothesis is already dead.
//
// THE LIVE HYPOTHESIS IS GEOMETRY MEETING DISPATCH.  SV_TriggerIOTouch fires
// OnJump from `run_wasground && !FL_ONGROUND && velocity_z > 0` -- but it is
// called FROM THE TOUCH FUNCTION, so it only runs on a command the trigger was
// actually touched, and the server dispatches touches at the command's END
// position only (no sweep).  One tick of jump rise is 301.99 * 0.015 = 4.53 u.
// On the tick you jump off a 2 u floor slab your hull is already 4.5 u above it,
// so there is no touch on the one command the test could pass -- and on every
// earlier command FL_ONGROUND is still set, so the test fails there instead.
// Momentum fires OnJump against its PERSISTENT touching set (m_hTouchingEntities),
// which is why it works there.
//
// AND THE SHAPE IS THE LIBRARY'S NORM, not this map's quirk: across 1316 bsps
// there are 1352 OnJump triggers on 123 maps, median brush height 1.0 u, and
// 1101 of 1352 are SHORTER than one tick of jump rise.  surf_cement's is 0.5 u.
// So if this reproduces, it is not one map's pad.
//
// PRE-REGISTERED
//  W1 `trig_io` lists an OnJump row on *744.  Absent => the output never parsed
//     and everything below is moot.
//  W2 `basevel: OnJump from *744 vz <n>` (the dprint inside SV_TriggerIOTouch,
//     run_bv_debug 1).  THIS IS THE MEASUREMENT.
//  W3 `basevel: paid #N [AddOutput M]` -- the cash-out.  A HORIZONTAL carrier
//     does cash out (only Z is zeroed at the foot of SV_BaseVelocityFrame), so
//     unlike the bonus-1 vertical pad this one prints when it pays.
//  W4 `cmd viewpos` x jumping by hundreds of units = the 2000 u/s landed.
// PREDICTED: W1 yes, W2 NEVER, W3 never, W4 never.
// FALSIFIED IF W2 fires -- then the dispatch theory is wrong and the fault is
// downstream, in SV_IOAddOutput or the carrier.
// INCONCLUSIVE IF the walk never reaches x -15760..-15632 / y 12352..12480: check
// the viewpos samples before believing any absence.
//
// RESULT: (written back here after the run, INCLUDING any prediction that failed)
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p414jumpwalk
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
sv_port 27657
sv_cheats 1
set run_bv_debug 1
set run_resume 0
set vbsp_entity_io 1
vid_fullscreen 0
waitms 5000
map surf_prosurf
waitmap 2400
waitms 3000
menu_restart
ui_close
waitms 1000

echo ==== A go to bonus 4 ====
say !b 4
waitms 2500
cmd viewpos
waitms 400

echo ==== B the wiring: is the OnJump output on *744 in the graph ====
trig_io
waitms 800

echo ==== C hop around the recess, every direction, +jump held (autohop) ====
+jump
+forward
waitms 900
cmd viewpos
waitms 900
cmd viewpos
-forward
waitms 300
+back
waitms 900
cmd viewpos
waitms 900
cmd viewpos
-back
waitms 300
+moveright
waitms 900
cmd viewpos
waitms 900
cmd viewpos
-moveright
waitms 300
+moveleft
waitms 900
cmd viewpos
waitms 900
cmd viewpos
-moveleft
-jump
waitms 600

echo ==== D back to the spawn, walk out and single-jump repeatedly ====
say !b 4
waitms 2000
cmd viewpos
+forward
waitms 400
+jump
waitms 80
-jump
waitms 500
+jump
waitms 80
-jump
waitms 500
+jump
waitms 80
-jump
waitms 500
-forward
cmd viewpos
waitms 600

echo ==== END ====
waitms 800
quit
