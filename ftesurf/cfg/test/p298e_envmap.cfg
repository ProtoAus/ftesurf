cfg_save_auto 0
// Patch 298e -- IS THE UNFOGGED SET THE ENVMAP TERM?
//
// MEASURED SO FAR at Lex's save011 window vantage.  Noise floor 0.000% both
// within a run and ACROSS processes, so every number below is real:
//   - every fogged pixel is a static prop ("fogged NOT prop: 0.000%"), and the
//     town is 13 props.
//   - 9.082% of the scene is prop; 8.190% of it takes skyroom fog and 0.892%
//     takes NONE.
//   - the fogged props measure [22.0 35.4 50.9] against a sky of [23.1 37.0
//     53.0] -- indistinguishable, which is the CS:S picture.
//     The unfogged ones measure [3.8 5.3 6.8] against [21.9 35.2 50.4] -- a
//     black silhouette on a lighter sky.  That is "bright black", quantified.
//   - the unfogged set is THREE things: the whole church cluster, the whole
//     far-left block, and THE WINDOW GRIDS on the apartment blocks.
//
// WHY THE WINDOWS ARE THE INTERESTING HALF.  project_building03_skybox and
// long_building001a each reference exactly ONE material (read out of the .mdl's
// own texture table).  One material is one program with one fog state, so fog
// CANNOT split that mesh into fogged walls and unfogged windows.  Something that
// is not the fog term is drawing those windows.
//
// The one thing those materials have that the mesh does not share uniformly is
//     $envmap "env_cubemap"  +  $basealphaenvmapmask 1
// and the windows are exactly where the base texture's alpha marks the
// reflective area.  buildingsheet_03a, long_building001a, project_building02 and
// project_building03 all carry it; hill_cluster, gov_upscale and industrial do
// not.
//
// THE STATIC READING SAYS THIS SHOULD BE FINE, WHICH IS WHY IT NEEDS TESTING.
// vertexlit.glsl:367 adds the reflection (#ifdef ENVSRCPOST, on because
// hl2_envmap_source is 7) and :384 applies fog4() AFTER it, so the reflection
// ought to be fogged with everything else.  Either that program is not what
// draws these, or the reflection arrives by another route.  Note the comment at
// :378-380: Patch 255 found a `#if 1` here that made EVERY Source prop draw
// unfogged, so this precise class of bug has already happened once in this file.
//
// PRE-REGISTERED, judged against E3 and E5, the repeat controls:
//   E4 (magenta, no cubemap) turns the WINDOW GRIDS magenta -> the envmap term
//      is what draws them unfogged.  Fault located, and it is in the reflection
//      path, not the fog path.
//   E4 leaves the window grids black -> the envmap is innocent and the split
//      inside a single material is something else entirely (alpha/blend).
//   E6 (hl2_envmap_source 0) differing from E5 says the same thing from the
//      other side, through the mask arithmetic rather than the cubemap itself.
//   If E2 and E4 both change the CHURCH CLUSTER too, then one cause covers all
//      three; if the cluster is unmoved, it is a second, separate fault and I
//      will say so rather than fold it in.
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000
wait 200

developer 1
log_developer 1
log_enable 1
log_dir logs
log_name p298e_envmap
cl_maxfps 0
cl_idlefps 0
sv_cheats 1
con_notifylines 0
con_notifytime 0.01
r_drawviewmodel 0

map surf_tensor2
waitmap 600
waitms 9000
waitms 3000
noclip
waitms 1000

alias vwin "setpos -7563.2915 10425.6309 -974.1351 1.9775 -0.39 0; waitms 2000"

// ---- E1: baseline ----
echo ^5=== E1: shipped defaults
vwin
screenshot p298e_e1_default

// ---- E2: no cubemap reflection ----
r_envcubemap 0
echo ^5=== E2: r_envcubemap 0
vwin
screenshot p298e_e2_nocube

// ---- E3: repeat control ----
r_envcubemap 1
echo ^5=== E3: r_envcubemap 1 -- repeat control, must reproduce E1
vwin
screenshot p298e_e3_repeat

// ---- E4/E5: the same question under MAGENTA fog, where it cannot be misread ----
skyroomfog 1 1 0 1 1 0
r_envcubemap 0
echo ^5=== E4: magenta fog, NO cubemap -- do the window grids go magenta?
vwin
screenshot p298e_e4_magenta_nocube

r_envcubemap 1
echo ^5=== E5: magenta fog, cubemap back -- must reproduce p298 A2
vwin
screenshot p298e_e5_magenta_cube

// ---- E6: the mask arithmetic instead of the cubemap ----
hl2_envmap_source 0
echo ^5=== E6: magenta fog, hl2_envmap_source 0
vwin
screenshot p298e_e6_magenta_src0

hl2_envmap_source 7
echo ^5=== E7: magenta fog, hl2_envmap_source 7 -- repeat control 2
vwin
screenshot p298e_e7_magenta_src7

echo ^5=== END OF RUN ===
waitms 500
quit
