// Private overlay (tools/runlines_smoke.py --mount; add --dedicated --map
// surf_kitsune --server-arg "+set run_startjitter 0", and --server-arg "+set
// sv_minping 120", for the other two servers: the enter's level is where they
// differ).  Patch 631: the Boarding window's
// energies are levels -- the speedometer's e at the enter and at the leave.
// Graded from `boarding` by tools/test_p631boarding.py, which takes one log or
// several; the screenshots are for a person.
// LIVE: runlines_livelag.cfg's ride -- off surf_kitsune's start platform onto its
// first ramp, down it and off its lower edge, where a trigger puts the body back.
// REPLAY: the owner's surf_voyager run, paused part way down four of its rides.
// `wait 4` after a wait: waitms counts from the frame's start (Patch 630's note).
cfg_save_auto 0
log_enable 1
log_dir logs
log_name runlines_smoke
con_notifytime 0
con_notifylines 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
vid_winmaximize 0
vid_width 1600
vid_height 900
vid_conautoscale 1
// The randomized start (up to 2 u) is the one thing that differs between runs by
// design, so it is off; a dedicated server wants --server-arg "+set
// run_startjitter 0".  One run of twelve with it on rode a second board: not
// shown to be its doing, and the grader takes such a ride.
set run_startjitter 0
waitms 2000
map surf_kitsune
waitmap 60
waitms 6000
wait 4
menu_restart
ui_close
// CSQC registers these at load, so they are set after the map.
set hud_scale 2
set hud_boarding 1
set hud_boarding_x -1
set hud_boarding_y -1
set hud_boarding_size 0
set hud_boarding_units 2
set hud_boarding_fade 999
set hud_boarding_enter 1
set hud_boarding_leave 1
set hud_board 1
set hud_board_fade 999
set hud_board_exact 1
set hud_seq 1
set hud_seq_abs 1
set hud_seq_delta 1
set hud_seq_board 1
set hud_seq_merge 1
set hud_seq_units 1
set hud_energy 1
set hud_energy_ref 1
set hud_speed_show 1
set hud_round 1
set hud_trail 0
cmd zone_goto 0
waitms 800
wait 4
echo ==== P631 RIDE ====
+moveright
waitms 800
-moveright
waitms 300
+forward
waitms 1000
wait 4
echo P631 riding 1
boarding
waitms 400
wait 4
echo P631 riding 2
boarding
waitms 400
wait 4
echo P631 riding 3
boarding
screenshot p631_riding.png
waitms 400
wait 4
echo P631 riding 4
boarding
waitms 300
// Released before the wait: held, the body walks out of the start again.
-forward
waitms 1200
wait 4
echo P631 after
boarding
screenshot p631_after.png
// The zero moves; the window's two levels must not (they carry their own).
set hud_energy_ref 0
waitms 500
wait 4
echo P631 moved 1
boarding
set hud_energy_ref 1
cmd zone_goto 1
waitms 800
ui_anchor
waitms 500
wait 4
echo P631 moved 2
boarding
screenshot p631_moved.png
ui_anchor clear
set hud_boarding_units 1
waitms 500
wait 4
screenshot p631_energy_only.png
set hud_boarding_units 2

echo ==== P631 REPLAY ====
// A new map: the server's board counter is not this map's news.
map surf_voyager
waitmap 60
waitms 4000
wait 4
menu_restart
ui_close
waitms 1500
wait 4
echo P631 after map
boarding
set hud_lines_edge 0
set hud_watch_path 0
set hud_boarding_fade 3
set hud_board_fade 3
replay cfg/test/p492voy.rec
waitms 2500
replay pause
replay seek 4.5
waitms 600
wait 4
echo P631 replay 4.5
boarding
replay seek 7.7
waitms 600
wait 4
echo P631 replay 7.7
boarding
replay seek 8.9
waitms 600
wait 4
echo P631 replay 8.9
boarding
screenshot p631_replay.png
replay seek 18.5
waitms 600
wait 4
echo P631 replay 18.5
boarding
replay seek 1
waitms 600
wait 4
echo P631 replay 1
boarding
// The recording's own rows, for a diff against another build: a replay's column
// is not this patch's to change.
echo P631 seq
replay seq
// Closing it must not hand the live window the replay's last board.
replay stop
waitms 1500
wait 4
echo P631 after stop
boarding
screenshot p631_stop.png
echo P631 end
echo RUNLINES COMPLETE
quit
