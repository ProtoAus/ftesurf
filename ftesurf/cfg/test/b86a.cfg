// BUILD 86 arm A -- the five UI fixes, on a listen server on bhop_eazy.
//
//   ftesurf64.exe -WindowStyle Minimized +exec cfg/test/b86a.cfg
//
// bhop_eazy because four of the five want a BHOP: the segment column's
// Jump:/Bhop: rows are the thing being recoloured, the floor touch between two
// hops is what moves the energy anchor, and data/runs/bhop_eazy/best.pb carries
// `split 0 1..3` so the clock has a PB to be ahead of.
//
// WHAT EACH ARM PROVES
//   1  say !r transmits           two viewpos lines, 45/30 then 0/0
//   2  the scoreboard release     three `scores status` lines
//   3  the column is green        shot 1 (read the Jump:/Bhop: rows)
//   4  old rows keep their zero   shot 1 vs shot 2: the absolute column must
//                                 NOT move when the anchor does
//   5  the pace latch exists      `timer`'s new `cl pace:` line
//
// ARM 4 IS THE ONE WITH A NUMBER IN IT and it is worth saying how it works.
// The rows are generated by really hopping (+jump on a bhop map), then hopping
// STOPS so the list is frozen, then `ui_anchor` is used to move the reference
// by a known amount from a known height.  Before build 86 every row's absolute
// shifted with it; after, only rows pushed afterwards use the new zero, so the
// two shots must show the SAME absolutes.  Nothing else on screen changes
// between them, which is what makes a diff of two pictures a measurement.

cfg_save_auto 0
log_enable 1
log_dir logs
log_name b86a
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
vid_width 1280
vid_height 720
fs_missingwarn 0
developer 1
log_developer 1

// FORCED, not assumed: this machine's archived ftesurf.cfg beats default.cfg
// (AGENTS.md), and it is known to archive hud_energy_ref 0 -- which would put
// the column on the zone anchor and make arm 4 measure the wrong reference.
set hud_scale          2
set hud_seq            1
set hud_seq_name       1
set hud_seq_abs        1
set hud_seq_delta      1
set hud_seq_hopname    1
set hud_seq_units      1
set hud_seq_live       1
set hud_energy_ref     1
set hud_energy         1
set hud_timer          1
set hud_timer_pace     1
set hud_splits         1

wait 400
map bhop_eazy
waitmap 120

// The engine's builtin menu is open from boot and notmenu=0 skips the whole HUD
// stack, so no screenshot below shows anything until this pair has run.
menu_restart
waitms 500
ui_close
waitms 800

echo ""
echo "^5=== b86a ARM 1: say !r MUST TRANSMIT (build 85 swallowed it into the draft) ==="
echo "^5=== default.cfg binds r to this, so the restart key itself was dead ==="
cmd zone_goto 0 45 30
waitms 400
viewpos
waitms 200
echo "--- (above must read pitch 30 yaw 45 -- the deliberate aim) ---"
say !r
waitms 700
viewpos
waitms 200
echo "--- (above MUST read pitch 0 yaw 0.  Unchanged 30/45 = say !r never sent) ---"
echo ""

echo "^5=== ARM 1b: the NUMBER must survive too -- say !s 2 is stage 2, not stage 1 ==="
echo "^5=== (this is why the fix declines text rather than sending via `cmd say`) ==="
say !s 2
waitms 700
echo ""

echo "^5=== ARM 5: the pace latch and its cvar ==="
timer
waitms 300
echo "--- (want a `cl pace:` line; cvar 1.  0 = no gate crossed yet this run) ---"
echo ""

echo "^5=== ARM 2: releasing +showscores closes a PINNED board ==="
say !r
waitms 500
scores open
waitms 300
scores status
echo "--- (want: pinned) ---"
+showscores
waitms 300
scores status
echo "--- (want: pinned+held) ---"
-showscores
waitms 300
scores status
echo "--- (want: closed.  build 85 left this `pinned` -- the reported bug) ---"
waitms 300
echo ""

echo "^5=== ARMS 3+4: hop for real, so the column fills with Jump:/Bhop: rows ==="
say !r
waitms 700
+forward
+jump
waitms 4000
-jump
-forward
// Let the last airborne segment close and commit before anything is measured:
// a row still open draws as the provisional pair, which is a different colour
// and a different alpha, and arm 4 needs COMMITTED rows.
waitms 1500

echo "^5--- shot 1: the column as it stands, on the anchor the hops left ---"
viewpos
waitms 200
screenshot b86a_1_hops
waitms 600
echo ""

echo "^5=== ARM 4: MOVE THE REFERENCE. 400 units up, then anchor there. ==="
echo "^5=== The rows above are finished and must not move with it. ==="
// setpos is fine here and only here: every measurement left is a HUD readout,
// there is no prediction under test, and no further segment may be generated
// (which is exactly why the hopping arm is already over).
setpos 0 0 400
waitms 500
ui_anchor
waitms 400
echo "--- (the printed z is the new zero; it must be ~400 above shot 1's) ---"
screenshot b86a_2_reanchored
waitms 600
echo ""

echo "^5=== the same two states as numbers, for a log-only reading ==="
timer
waitms 300
echo ""

echo "^5=== selftests -- nothing above may have disturbed the physics ==="
pm_selftest
waitms 400
zone_selftest
waitms 400
echo ""

echo "^5=== b86a done -- compare screenshots/b86a_1_hops and b86a_2_reanchored ==="
waitms 800
quit
