// The three reported maps on the shipped build, everything at its default.
// No cvar is touched except the logging and the auto-save guard.
//
// Expect 0 unresolved materials at the end of the map load on all three, and no
// banner on any of them.
log_enable 1
log_name p233ship
developer 1
log_developer 1
cfg_save_auto 0
cl_idlefps 0

wait 200
map surf_demise
waitmap 900
wait 200
hl2_missing
hl2_unresolved
hl2_unresolved_visible
waitms 400

map surf_aesthetic
waitmap 900
wait 200
hl2_missing
hl2_unresolved
hl2_unresolved_visible
waitms 400

map surf_sodacity
waitmap 900
wait 200
hl2_missing
hl2_unresolved
hl2_unresolved_visible
fs_automount_state
waitms 400

echo ^5=== p233ship done ===
wait 30
quit
