// Patch 385 -- the .hid identity across a spectate window, on a LISTEN host (the
// sidecars are a local-server affair).  Host A (entnum 1) on bhop_eazy in lobby
// mode; p385t.cfg (B) joins on 27686.  NEEDS Patch 380's engine for the host.
// Run from C:\FTESurf, together:
//   C:\msys64\home\Lex\fteqw\engine\release\fteqw64.exe -WindowStyle Minimized
//     +exec cfg/test/p385hid.cfg
//   C:\FTEQuake\ftesurf64.exe -WindowStyle Minimized +exec cfg/test/p385t.cfg
// then:
//   python tools/hidcheck.py ftesurf/data/p385_S.hid
//   python tools/hidcheck.py ftesurf/data/p385_G.hid
//   grep "spec [01]" ftesurf/data/p385_S.hid
//
// PRE-REGISTERED
//  H1  S (spectate: entry, 5 looks in first person, SPACE to third, 5 looks that
//      turn the camera, ESC, the 3 s countdown, all under one journal): hidcheck
//      prints no "yaw moved with ZERO mouse counts" note and no identity
//      violation -- nothing wrote the view angles, so every 'v' yaw is the same.
//  H2  S holds the window's two annotations: `spec 1 <ticks>` and `spec 0
//      <ticks>`, in that order (Spec_Edges' in_journal_note).
//  H3  `spectate status` inside S: stat > 0; after S: stat 0, and its aim row
//      equals the one printed before the entry.
//  CONTROL G (ghost, +left 1 s, ghost off, one journal): >= 1 "ZERO mouse counts"
//      note -- Ghost_Frame's re-attach writes VF_CL_VIEWANGLES (cl_ghost.qc), a
//      yaw jump with no counts and no keyboard term.  If G shows none, hidcheck
//      cannot see a written angle here and H1 proves nothing (VOID).
// FALSIFIED IF H1 notes a ZERO-count frame or a violation, H2 is missing an
//   edge, or G notes none.
//
// RESULT (2026-09-20, host engine\release\fteqw64 with Patch 380, B C:\FTEQuake\fteqw64;
// run three times -- before review 2, after it, and on the final build -- identical):
//   H1 VOID as registered: hidcheck has "fewer than two governed frames -- nothing
//   to test".  What S shows instead: one 'v' (at begin) and none in the window,
//   and IN_Journal_View (in_generic.c) emits one whenever the angle differs from
//   the last, so no angle changed; G proves a write shows.  H2, H3 and G held.  H2: `spec 1 0` then `spec 0
//   0` (the host was not running, so <ticks> 0).  H3: stat 2 inside, 0 after; aim
//   0 0 0 before, inside and after (the aim had never left spawn -- H1 carries the
//   test), body feet unchanged, 10 looks turned the camera to 6.6 -33.  CONTROL G:
//   1 ZERO-count frame (line 159), and the counts join HOLDS on its 102 frames.  Both
//   journals also FAULT "no frame markers": the scripted-capture trap (p305kbd).
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p385hid
developer 1
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
sv_port 27686
sv_cheats 0
set lobby_enable    1
set lobby_avatars   1
set lobby_nocollide 1
set lobby_av_stream 1
set lobby_vote      0
set run_resume      0
set rec_enable      0
set run_spec_countdown 3
waitms 5000
map bhop_eazy
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 500
sensitivity 3
m_yaw 0.022
m_pitch 0.022
cl_yawspeed 140
echo ^5==== p385hid: waiting for p385t ====
waitms 45000
status
spectate status
echo ^5==== S: a spectate window under one journal ====
in_journal_begin
waitms 1000
spectate p385t
waitms 1500
spectate status
spectate look 100 0
spectate look 100 0
spectate look 100 0
spectate look 100 0
spectate look 100 0
vote key 32 1
vote key 32 0
waitms 500
spectate look 100 20
waitms 200
spectate look 100 20
waitms 200
spectate look 100 20
waitms 200
spectate look 100 20
waitms 200
spectate look 100 20
waitms 1000
vote key 27 1
vote key 27 0
waitms 4500
spectate status
in_journal_note p385-S-end
in_journal_end data/p385_S.hid
waitms 1200
echo ^5==== G: CONTROL -- ghost, +left, re-attach ====
in_journal_begin
waitms 500
ghost
waitms 800
+left
waitms 1000
-left
waitms 300
ghost
waitms 1000
in_journal_note p385-G-end
in_journal_end data/p385_G.hid
waitms 1200
echo ^5==== p385hid: done ====
quit
