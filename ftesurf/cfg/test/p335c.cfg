// Patch 335, ARM C -- DIAGNOSTIC for the p335b findings.
//
// p335b measured two things that need separating:
//
//   1  The client mirror DID fire, correctly shaped: falling past the ramp
//      end, trig #7 (model *24, box z 255..449, target 'rise') fired at
//      vel_z -852, which is sqrt(2*800*451) -- freefall from the 900 the
//      harness set, arriving at the box top.  The arithmetic closes.
//   2  It then RE-FIRED forever, because `setpos` puts the SERVER player
//      into MOVETYPE_NOCLIP (sv_user.c Cmd_SetPos_f: "make sure they're not
//      going to whizz away from it") and the server hovered while the
//      client's prediction kept falling.  The chain restarted every frame
//      from a hovering acked state and re-fell through the box.  That is a
//      harness artifact of setpos, not of the mirror -- but it must be
//      excluded, not assumed: every setpos below is followed by `cmd
//      noclip`, which sv_player.qc's SV_ParseClientCommand toggles back to
//      MOVETYPE_WALK on the server.
//
//   3  OPEN QUESTION this arm answers: ent_info said the entity containing
//      -850 -497 800 is model *52, but the client fired *24 lower down and
//      never fired whatever slot holds *52 at 800.  trig_at lists every
//      predicted slot whose box contains a point next to the submodel clip's
//      own answer; ent_info gives the server's.  If *52 is in the server's
//      answer and in no client slot, the lump walk dropped it.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p335c
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0
menu_restart
waitms 1500

set cl_trigdebug 1
connect 127.0.0.1:27666
waitms 25000

echo ^5=== p335c 1: what does each side think is at -850 -497 800 ===
trig_at -850 -497 800
waitms 400
cmd ent_info trigger_teleport -850 -497 800
waitms 600

echo ^5=== p335c 2: and at the spawn column -3120 -496 2100 ===
trig_at -3120 -496 2100
waitms 400
cmd ent_info trigger_teleport -3120 -496 2100
waitms 600

echo ^5=== p335c 3: slot 7 in full ===
trig_probe 7 -850 -497 400
waitms 400

echo ^5=== p335c 4: clean fall into the carpet, noclip toggled off ===
cmd setpos -800 -497 900
waitms 200
cmd noclip
waitms 200
cmd viewpos
waitms 700
cmd viewpos
waitms 700
cmd viewpos
waitms 700
cmd viewpos
waitms 1000

echo ^5=== p335c done ===
waitms 300
quit
