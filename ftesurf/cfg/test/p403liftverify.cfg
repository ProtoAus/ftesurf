// P403VERIFY -- replay the p403ride capture through the verifier.  The point is
// NOT that a cheat-tainted run passes; it is that pm_verify copes with the two
// shapes the corpus has never held: a packet holding 3 commands with the push
// carrier armed across two of them (`ride 9 394 arm` / `ride 9 395 arm`), and the
// two overlapping push volumes that sum to 3200 in one tick.
//
// SETUP: cfg/test/p403ride.zones.json must still be at
// maps/zones/local/bhop_arcane.json (the file's header pins zonecrc 89c53834, and
// the verifier runs the timer's own zone scan).
//
// PRE-REGISTERED
//  V1 pm_verify prints VERIFY ... PASS for the capture.
// RESULT (2026-09-20): HOLD "no finish: the zones never end this run", with
//   body 707 in rows, 730 samples, 698 packets, 99 warps, 45 rides.  The 99 lifts
//   are read and re-simulated; the HOLD is the harness's finish.  See p403liftrec.
// A HOLD is a RESULT, not a failure of the harness: it would say the verifier
// cannot yet re-simulate a multi-command ride span, which is exactly what open
// item 8 asked to find out.  Record the reason verbatim either way.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p403liftverify
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
sv_cheats 1
fs_missingwarn 0
set run_resume 0
sv_port 27681

wait 200
map bhop_badges_mini
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 1000

echo ^5=== p403liftverify ===
pm_verify data/runs/bhop_badges_mini/main/cheat.rec
waitms 4000
echo ^5=== P403LIFTVERIFY DONE ===
waitms 500
quit
