// P382T -- Patch 382's passive target: joins the p382a/p382c listen host on
// 27682 as entnum 2 (the host is 1), stands where it spawns, follows the host's
// map changes, and leaves after 15 minutes.  Nothing here is measured; the host's
// log is the record.  Run from C:\FTESurf with the second install's binary:
//   cd C:\FTESurf; C:\FTEQuake\ftesurf64.exe -WindowStyle Minimized +exec cfg/test/p382t.cfg
// started together with the host (it connects 35 s in).
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p382t
developer 1
cl_idlefps 0
cl_maxfps 100
rate  2000000
drate 5000000
vid_fullscreen 0
name p382t
waitms 35000
connect 127.0.0.1:27682
waitms 900000
echo ^5==== p382t done ====
disconnect
waitms 500
quit
