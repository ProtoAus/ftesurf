// Run only in an owned overlay through tools/runlines_smoke.py.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name runlines_smoke
con_notifytime 0
con_notifylines 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
vid_winmaximize 0
vid_width 1280
vid_height 720
vid_conautoscale 1
sv_public 0
set run_resume 0
volume 0
musicvolume 0
waitms 2000
map surf_dune
waitmap 60
waitms 6000
wait 4
menu_restart
ui_close
waitms 600
wait 4
echo MILK DEFAULTS boot
milk_menu
milk_quality
milk_trails
milk_react
milk_sky
milk_lowpass
milk_world
milk_panels
milk_sfx
milk_grade
milk_streaks
milk_res
milk_fsr
milk_checker
milk_cone
milk_sky_parallax
milk_sky_palette
set milk_quality 2
set milk_world monolith
set milk_panels 1
set milk_grade 1
set milk_streaks 1
set milk_res 0
echo MILK DEFAULTS old
milk_quality
milk_world
milk_panels
milk_grade
milk_streaks
milk_res
menu_restart
ui_close
waitms 600
wait 4
echo MILK DEFAULTS preserved
milk_quality
milk_world
milk_panels
milk_grade
milk_streaks
milk_res
set milk_quality 4
set milk_world lattice
set milk_panels 0
set milk_grade 0
set milk_streaks 2
set milk_res 1
echo MILK DEFAULTS restored
milk_menu
milk_quality
milk_trails
milk_react
milk_sky
milk_lowpass
milk_world
milk_panels
milk_sfx
milk_grade
milk_streaks
milk_res
milk_fsr
milk_checker
milk_cone
milk_sky_parallax
milk_sky_palette
echo RUNLINES COMPLETE
waitms 300
quit
