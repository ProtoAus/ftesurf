// cfg_save_auto 0: this run sets archived cvars (vid_*, cl_maxfps); never let it write them into ftesurf.cfg (cl_main.c:2535)
cfg_save_auto 0
// surf_fantasy, FIRST in a fresh process: the trees (Patch 292), shader_here on props
// (Patch 291), and the island rocks under Patch 268 C.
//
// TREES.  Their textures come from Momentum's mount/hl2_dir.vpk as VTF 7.6 with Zstandard
// auxiliary compression, which the p268c_live build uploaded as garbage and drew solid black.
// Same three vantages as p268c_live, for a direct before/after.  The log should carry no
// "auxiliary" error line.
//
// PROPS.  shader_here should now name the model under the crosshair, its material, each
// pass's program (the vertexlit program lives on a pass), its lighting and its ambient cube.
//
// ROCKS.  r_cubelight 1 / 0 / 2 / 1 at each saveloc.  2 is a synthetic cube lit hard from
// above: if the bumped-normal path works, the moss relief must be obvious under it whatever
// the map's own cube holds.  save001 sits inside drifting soft particles, so a pixel count is
// not the measurement there -- read the rock crop.
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000
wait 200

developer 1
log_developer 1
log_enable 1
log_dir logs
log_name p292b_fantasy
cl_maxfps 0
cl_idlefps 0
sv_cheats 1
con_notifylines 0
con_notifytime 0
con_notifytime_error 0
r_drawentities 1
r_lightstylescale 1

hl2_envcubemap 1
hl2_envmap_source 7
r_envcubemap 1
r_reflectcube_nosky 0
hl2_cubelight 1
hl2_bumpgreenfix 0
hl2_lt_dirsign 0
r_cubelight 1
echo ^5=== p292b: fantasy first -- trees, shader_here on props, r_cubelight 1/0/2/1

map surf_fantasy
waitmap 600
waitms 9000
waitms 3000
noclip
waitms 1000

// ---- the trees, p268c_live's vantages ----
setpos -9424.4 -15577.9 6155.6 -12 0 0
waitms 2500
cmd viewpos
shader_here fan_tree_cluster
screenshot p292b_fan_tree_cluster

setpos -9212.0 -14488.0 6141.0 20 0 0
waitms 2500
cmd viewpos
shader_here fan_tree_fern
screenshot p292b_fan_tree_fern

setpos 7095.0 -14443.4 -10790.5 -12 0 0
waitms 2500
cmd viewpos
shader_here fan_tree_pine04
screenshot p292b_fan_tree_pine04

// ---- save001: the island rock ----
setpos -9001.9434 -14301.5703 6205.6196 30.9814 38.5675 0
waitms 2500
cmd viewpos
r_cubelight 1
waitms 900
shader_here fan_s1_on1
screenshot p292b_fan_s1_on1
r_cubelight 0
waitms 900
shader_here fan_s1_off
screenshot p292b_fan_s1_off
r_cubelight 2
waitms 900
shader_here fan_s1_test
screenshot p292b_fan_s1_test
r_cubelight 1
waitms 900
shader_here fan_s1_on2
screenshot p292b_fan_s1_on2

// ---- save002 ----
setpos -10560.2393 -12718.2324 4593.5737 18.5669 164.0588 0
waitms 2500
cmd viewpos
r_cubelight 1
waitms 900
shader_here fan_s2_on1
screenshot p292b_fan_s2_on1
r_cubelight 0
waitms 900
screenshot p292b_fan_s2_off
r_cubelight 2
waitms 900
screenshot p292b_fan_s2_test
r_cubelight 1
waitms 900
screenshot p292b_fan_s2_on2

echo ^5=== END OF RUN ===
waitms 500
quit
