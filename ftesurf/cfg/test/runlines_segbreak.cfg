// Private overlay (tools/runlines_smoke.py, no --recording needed):
//   python tools/runlines_smoke.py ftesurf/cfg/test/runlines_segbreak.cfg --output-dir <owned root>
//   python tools/test_runlines_segbreak.py <rig>/ftesurf/logs/runlines_smoke.log --control-log <older build's>
// Patch 613: the Segments rows around a teleport the segment machine does not see by
// distance (under 512 u).  An authored body, no map and no player data
// (cfg/test/runlines_segbreak.rec): standing, moved 200 u up into a fall; a ramp ride moved
// 150 u along and 60 u down 0.045 s after its last contact; and a fall moved 160 u up and slowed.  A
// replay for another map stops within a frame, so its dump shares the open's batch.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name runlines_smoke
con_notifytime 0
cl_idlefps 0
cl_maxfps 100
set hud_watch_skipidle 0
set hud_watch_path 1
sv_public 0
sv_port 27612
waitms 2000
map surf_kitsune
waitmap 60
waitms 4000
menu_restart
ui_close
echo === p449mark FIXTURE cfg/test/runlines_segbreak.rec ===
replay cfg/test/runlines_segbreak.rec
replay status
replay marks 0
replay seq
waitms 300
replay stop
waitms 300
echo RUNLINES COMPLETE
waitms 100
quit
