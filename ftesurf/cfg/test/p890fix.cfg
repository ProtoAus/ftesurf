// Patch 890 arm: per-map entity fixes.  Listen server, through tools/runlines_smoke.py:
//   python tools/runlines_smoke.py ftesurf/cfg/test/p890fix.cfg --mount --timeout 700 \
//     --ssqc <qwprogs> --csqc <csprogs> --mqc <menu> --client <exe> --output-dir <task root>/artifacts
// Control: the same arm on the build without P890 (no `entfix:` line; falls go to the jail).
//   F3 drops from z 4800 over four columns into the start's fall box (*40, to fall2 at z 5928
//     before the 30 s timer), each sampled every 100 ms: with sv_entfix 0 the body keeps ~1100 u/s
//     down and lands ~0.6 s after the warp; with the fix (velocitymode 1) it arrives at 0 and takes
//     ~1.4 s.  A column whose samples never reach z 5928 measured nothing.
//     F3c runs first, sv_entfix 0, on a map load with no `entfix:` line.
//   F surf_network2008_final with cfg/maps/entfix_surf_network2008_final.cfg: the engine prints
//     `entfix: ...: 0 removed, 1 added, 21 modified`; F1 the fall box after the 30 s timer and
//     F2 Lex's rewind point both end at entfix_start (1856 3680 5153), not the CT jail (6176 -1536).
//   Parser cases (stale and malformed blocks, separators, wildcards): tools/test_entfix.py.
//   R rope shots again with the client given time to finish loading (P886).
cfg_save_auto 0
log_enable 1
log_dir logs
log_name runlines_smoke
con_notifytime 0
cl_idlefps 0
cl_maxfps 100
vid_vsync 0
vid_fullscreen 0
vid_width 1280
vid_height 720
sv_public 0
set run_resume 0
developer 1
log_developer 1
scr_sshot_type png
waitms 1500

sv_entfix 0
map surf_network2008_final
waitmap 120
waitms 5000
menu_restart
ui_close
waitms 500
echo ==== F3c a moving fall, no entity fix ====
