// cfg_save_auto 0: this run sets archived cvars (vid_*, cl_maxfps); never let it write them into ftesurf.cfg (cl_main.c:2535)
cfg_save_auto 0
// Patch 294e -- measure the prop LEVEL with the engine's own instrument, not a crop.
//
// WHERE THIS STANDS.  The 12-byte .vhv gate is fixed and reads all 2345 props on
// surf_fantasy.  The COLLAPSE rule is settled by citation, not by fitting: every
// live three-basis combine in the Source tree divides by sum(dots), i.e. a plain
// mean (lightmappedgeneric_ps2_3_x.h:449-462, worldtwotextureblend_ps20b.fxc:
// 179-187, water_ps2x_helper.h:199-209, lightmappedreflective_ps20b.fxc:123-133,
// pbr_common_ps2_3_x.h:144-156), and VRAD calibrates the bake so the mean of the
// three stored bytes reproduces the flat value (lightmap.cpp:3498-3533).  The one
// non-dividing form, DiffuseBump (common_ps_fxc.h:105-124), is commented out with
// zero callers -- so the sqrt(3) I was chasing does not exist.
//
// And yet applying the mean renders DARKER than the leaf-ambient fallback:
// -10.40 mean luminance on the rock crop, -8.12 on s2, -4.54 on pine.
//
// So the collapse is right and the LEVEL is wrong, which means the loss is
// somewhere after the collapse -- baked_scale, FS_BAKED_DIR, the vcgain
// normalisation, or the retint.  A crop cannot tell those apart.  The texdiag
// PROPLIGHT line can: it prints a whole-map mean RGB over every prop.
//
// ARMS (one process, cvar toggled, map reloaded between -- the bake is read at
// load, so a live toggle alone would not re-read it):
//   1  fantasy, hl2_lt_vhv12 0 -- fallback level, the reference
//   2  fantasy, hl2_lt_vhv12 1 -- baked level
//   3  boreas,  hl2_lt_vhv12 1 -- 4-byte control, must be unchanged
// The stored-byte mean of fantasy's own files is 35.82/255 (sampled over 469
// props); if arm 2's engine mean is far below that, the loss is in the pipeline,
// not in the file.
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000
wait 200

developer 1
log_developer 1
log_enable 1
log_dir logs
log_name p294e_proplevel
cl_maxfps 0
cl_idlefps 0
sv_cheats 1
con_notifylines 0
con_notifytime 0
con_notifytime_error 0
r_drawentities 1
r_texdiag 1

// Lex's own save-locks on surf_fantasy (data/saves/surf_fantasy), not my invented
// vantages -- the p293c shots were taken somewhere he never stood.
alias lex1 "setpos -9921.6426 -13870.3916 6350.7290 0.7910 -48.8123 0; waitms 2000"
alias lex2 "setpos -8047.4780 -13422.3525 5602.3896 27.4438 153.7427 0; waitms 2000"
alias lex3 "setpos -7821.1230 -13608.8525 4073.5354 -3.3179 41.3910 0; waitms 2000"

// ---------------- ARM 1: fantasy, fallback ----------------
hl2_lt_vhv12 0
echo ^5=== p294e ARM 1: surf_fantasy vhv12 0 -- fallback, expect props: 0 of 2345
map surf_fantasy
waitmap 600
waitms 9000
waitms 3000
noclip
waitms 1000
lex1
cmd viewpos
screenshot p294e_off_lex1
lex2
screenshot p294e_off_lex2
lex3
screenshot p294e_off_lex3

// ---------------- ARM 2: fantasy, baked ----------------
hl2_lt_vhv12 1
echo ^5=== p294e ARM 2: surf_fantasy vhv12 1 -- baked, expect props: 2345 of 2345
map surf_fantasy
waitmap 600
waitms 9000
waitms 3000
noclip
waitms 1000
lex1
screenshot p294e_fix_lex1
lex2
screenshot p294e_fix_lex2
lex3
screenshot p294e_fix_lex3

// ---------------- ARM 3: boreas CONTROL ----------------
echo ^5=== p294e ARM 3: surf_boreas -- 4-byte control, expect 1587 of 1587
map surf_boreas
waitmap 600
waitms 9000
waitms 3000
noclip
waitms 1000
setpos 9440 -15488 3741 0 90 0
waitms 2000
screenshot p294e_ctl_boreas

echo ^5=== END OF RUN ===
waitms 500
quit
