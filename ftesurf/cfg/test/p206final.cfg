// Patches 206/207 -- final verification, one run.
//
// PART 1  the acceptance band, re-measured after every other change landed.
//         Slots 1..6 are feet z = 820/840/860/880/900/920.  Expected: 820 and
//         920 refuse, 840..900 cross.  Under Patch 203's rule only 860 crossed.
// PART 2  server and client portal counts, which must agree.
// PART 3  vbsp_portal_render 0 -- apertures off, physics still crossing.
// PART 4  the void gate -- 0 scene renders while outside the world.
// PART 5  surf_tripportals, 116 doors, as the stress case.
// PART 6  surf_demise, no portals at all, which must be silent and untouched.

cfg_save_auto 0
developer 1
log_developer 1
scr_sshot_type png
cl_yieldcpu 0
cl_maxfps 0
vid_vsync 0
r_speeds 2
r_drawviewmodel 0
crosshair 0
con_notifytime 0
r_portalrecursion 2
r_portalmaxviews 2
r_portaldebug 0

waitms 2500
map surf_kitsune
waitmap 180
waitms 4000

echo "### F1 band"
cmd sl_goto 1
waitms 300
cmd viewpos
waitms 200
cmd sl_goto 2
waitms 300
cmd viewpos
waitms 200
cmd sl_goto 3
waitms 300
cmd viewpos
waitms 200
cmd sl_goto 4
waitms 300
cmd viewpos
waitms 200
cmd sl_goto 5
waitms 300
cmd viewpos
waitms 200
cmd sl_goto 6
waitms 300
cmd viewpos
waitms 200

echo "### F3 render off, physics on"
vbsp_portal_render 0
waitms 200
cmd sl_goto 3
waitms 300
cmd viewpos
waitms 200
sv_cheats 1
noclip
setpos 0 -765 133 0 90 0
wait 120
screenshot_mega p206F_renderoff 1280 720
wait 20
vbsp_portal_render 1
setpos 0 -765 133 0 90 0
wait 120
screenshot_mega p206F_renderon 1280 720
wait 20

echo "### F4 void"
setpos 0 -700 24000 0 90 0
wait 150
r_speeds_dump
wait 20

echo "### F5 tripportals"
map surf_tripportals
waitmap 240
waitms 5000
wait 200
r_speeds_dump
wait 20
screenshot_mega p206F_tripportals 1280 720
wait 20

echo "### F6 demise, must be silent"
map surf_demise
waitmap 240
waitms 5000
wait 200
r_speeds_dump
wait 20

echo "### F DONE"
waitms 600
quit
