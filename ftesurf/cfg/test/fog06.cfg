// FOG06 -- HOW MANY maps does fog silently not render on, and does it track
// sky_camera?
//
// surf_legends renders no fog at all: `fog 1 1 0 0 1 0` (everything past ONE
// unit is 100% red) leaves the frame untouched, in BOTH linear and exp mode.
// bhop_bowling under the identical commands goes 0% -> 99.8% red, so the probe
// is sound and the fault is the map, not the fog state and not Patch 254 --
// exp mode is the pre-existing path and it fails the same way.
//
// The one structural difference found so far: surf_legends has a sky_camera and
// all three maps where fog DID render do not.  138 fogged maps split 50 with a
// sky_camera and 88 without, so if that is the split it is worth a third of the
// feature.  Six of each, plus the two known anchors.
//
// vbsp_fog stays 0 throughout so the gamecode's own fog cannot confuse the
// reading -- every fog here is typed straight at the engine after the map has
// loaded.  Anything that is not solid red is a map that will never show fog.

log_enable 1
log_dir "logs"
log_name "fog06"
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 0
vid_fullscreen 0
con_notifytime 0
con_notifylines 0
con_notifytime_error 0
vbsp_fog 0
r_fog_linear 1
wait 200

alias redprobe "fog 1 1 0 0 1 0"

echo ^5===== ANCHORS =====
map surf_legends
waitmap 1800
waitms 10000
redprobe
waitms 1500
screenshot fog06_a_legends_SKY
waitms 700

map bhop_bowling
waitmap 1800
waitms 10000
redprobe
waitms 1500
screenshot fog06_a_bowling_NOSKY
waitms 700

echo ^5===== WITH sky_camera =====
map bhop_avantasia
