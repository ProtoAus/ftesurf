// Patch 416 -- THE CONTROL, and it is the arm the subject means nothing without.
//
// Same route, same server progs, an OLDER CLIENT: csprogs built from HEAD's
// cl_replay.qc and cl_main.qc, i.e. without Rec_Nonce.  So the server still
// picks a nonce and still writes it into the header, and nothing answers it.
//
// It is built the way AGENTS.md prescribes rather than by `git stash` (which
// would take another session's files): the two client sources are copied aside,
// `git checkout --`ed, built, run, and copied back.
//
// Run from C:\FTESurf, AFTER that build:
//   ./ftesurf64.exe -WindowStyle Minimized +exec cfg/test/p416ctl.cfg
//
// PRE-REGISTERED PREDICTIONS
//  C1  the .rec header carries a `nonce <32 hex>` line, as the subject's does.
//      The writer is the SERVER and this arm does not change it; if the key is
//      missing here, the subject arm measured the wrong thing.
//  C2  its `flags` value has bit 131072 (TF_NONCE) CLEAR.  This is the control:
//      it is what proves the subject's bit was the client's answer and not a
//      constant.
//  C3  data/p416_C.hid has NO `nonce` note: nothing on this client writes one.
//  C4  the two nonces differ.  They are drawn per run from a per-boot seed, and
//      two identical values would say the draw is not a draw.
// FALSIFIED IF the flags bit is set here (the subject's arm is then void), or
//   the header key is missing (the arms are not comparable).
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p416ctl
developer 0
cl_idlefps 0
cl_maxfps 100
sv_cheats 0

set rec_enable 1
set rec_stream 1
set rec_runarchive 1
set rec_hid 1

in_speedbutton 1

waitms 6000
map bhop_eazy
waitmap 45
waitms 3000

echo ================================ P416 C -- armed, not started
cmd timer
waitms 1000

echo ================================ P416 C -- aim
cmd zone_goto 0
waitms 1000
setpos -352 -352 144 0 335.3 0
waitms 1000

echo ================================ P416 C -- jump: this starts the run, and the
echo ================================ P416 C -- server issues the nonce on the same packet
+jump
waitms 700
-jump
waitms 1500
cmd timer

echo ================================ P416 C -- freeze the journal while it is open
in_journal_end data/p416_C.hid
waitms 1200

echo ================================ P416 C -- fly to the end zone
noclip
waitms 500
+forward
waitms 1500
cmd timer
waitms 2900
cmd timer
waitms 2000
-forward
waitms 1500

echo ================================ P416 C -- after the end zone.  Expect FINISHED.
cmd timer
waitms 2500

echo ================================ P416 C done
waitms 500
quit

// RESULT (2026-09-21, re-run on the post-review server build with csprogs built
// from HEAD's cl_replay.qc + cl_main.qc):
//   ALL FOUR HELD.
//   C1  `nonce ce3c0903b39a3d19718e07c9b33dc30a` at header line 11.
//   C2  `flags 257` -- TF_NONCE clear.  The subject's identical route wrote
//       131329, so the 131072 there is this client's `cmd rec_nack` and nothing
//       else in the patch.
//   C3  data/p416_C.hid: no `nonce` line at all (grep -c = 0).
//   C4  the two nonces differ: the draw is a draw.
//   Kept as data/p416/c.rec.
