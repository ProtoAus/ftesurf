cfg_save_auto 0

// ===========================================================================
//  P443AIR -- a save taken AIRBORNE and at rest inside the start slab.
//    python tools/p443start.py --arm air
//  The driver stages cfg/test/p435rest.txt as save901 (row 1: grounded, at rest --
//  THE POSITIVE CONTROL) and cfg/test/p443air.txt as save904 (row 2: the same save
//  36 units higher, z 100.0000 against a floor at 64.03125 -- THE SUBJECT), plus
//  cfg/test/p435.zones.json as the local zones override, because bhop_eazy's shipped
//  start slab has its bottom AT the floor and `origin %.4f` puts a placed body
//  0.00005 below it where no scan can see it (Patch 415).  The override's start slab
//  is z [48, 208], so both rows are inside it and only one of them is standing on
//  anything.
//
//  THE DEFECT.  The Build 47 gate launders a start-box load -- it forces the arm edge,
//  SV_TimerArm clears run_t_flags, and the attempt comes back CLEAN -- and Patch 435
//  gated that on the row being AT REST so a save carrying speed could not inject it.
//  Patch 442 made "at rest" cover all three components.  But a row carries no GROUND
//  state, and SV_SaveLocLoad clears FL_ONGROUND for every load, so a body hanging in
//  mid-air inside the slab was as still as one standing on the floor and armed just
//  as clean.  What it buys is the FALL: the clock does not start until the hull leaves
//  the box, so the drop is free -- up to the slab's height, 160 u here and up to 189 u
//  of authored destination elsewhere (tools/census/startdest.py).  Found by the review
//  of Patch 442.
//
//  THE FIX (Patch 443).  SL_RowGrounded: the engine's own ground probe at the ROW's
//  origin, with pm_groundtracedist and pm_standablenormal read from the server (engine
//  pm_source.c, PMSrc_GroundTraceDist / PMSrc_Standable), the hull built from the row's
//  own duck bit because e.maxs is still the PRE-load hull here, and -- from round 2 --
//  the mover's four-quadrant retry, because standing on the corner of a ledge is
//  standing (pm_source.c:2043).
//
//  TWO ROUNDS OF REVIEW BROKE THE PROBE'S startsolid BRANCH, and the history is short
//  enough to keep because each cut looked right.  ROUND 1 traced from one unit UP, so a
//  grounded row whose `%.4f` origin lands epsilon inside the floor would read as a plane
//  -- and answered startsolid as CONTACT.  The lift exposed the sliver ABOVE THE HEAD,
//  so anything solid within a unit of a ceiling certified a body in mid-air at any
//  height.  ROUND 2 dropped the lift and kept the polarity.  ROUND 3: the mover answers
//  startsolid as AIRBORNE on both of its paths -- `pmove.onground = !pm.startsolid` sits
//  inside the `else` of `fraction == 1 || normal[2] < standable`, and a startsolid trace
//  writes no plane at all (q1bsp.c:901), so it takes the airborne arm -- and the
//  rounding never needed the fail-open anyway: DIST_EPSILON is 0.03125 against a
//  `%.4f` quantum of 0.00005.  So startsolid REFUSES now.  ROUND 4 WITHDREW THAT
//  ARITHMETIC AS A CLAIM -- DIST_EPSILON is a per-clip-plane back-off, not a property of
//  bodies (Patch 177's own comment says one tick of clipping leaves you a fraction of a
//  unit inside "often enough to matter", and PMSrc_CheckStuck, which heals it, is
//  SKIPPED for PM_NONE, i.e. for the save-lock hold), and `frac 0.000` cannot show a
//  margin anyway because com_bih.c clamps a negative fraction to 0.  What stands is the
//  MEASUREMENT below, plus round 4's E row, which is the first fixture in which the
//  branch fires at all.  Round 4 also dropped the claim that all three sibling probes
//  refuse: two of them LIFT ONE UNIT AND RETEST first.  This one is the odd one out on
//  purpose -- they are choosing a PLACE to put the body, so repairing is part of the job;
//  this is asking whether a ROW WAS STANDING, and lifting it would answer about a
//  position the player was never at, which is exactly what round 1's lift did.  The
//  reach is the mover's one unit rather than two, and MOVE_NOMONSTERS means another
//  PLAYER cannot be the ground -- an accomplice's axial hull answers `nz 1.000` and is
//  indistinguishable from a floor.
//
//  ARMS, in log order:
//   S   SUBJECT: load row 2, the airborne row.
//   P   THE POSITIVE CONTROL, and the arm is worth nothing without it: load row 1, the
//       GROUNDED row, on the same build in the same run.  If the gate does not fire
//       here then it is unreachable in this arm for some reason of its own -- the
//       rounding, the zones override, the row order -- and S's reading means nothing.
//       This is the shape tools/p435pre.py --arm shipped did NOT have, which is why it
//       reports NOT DEMONSTRATED.
//
//  `support` IS THE SUBJECT'S OWN WORD.  SL_RowGrounded dprints
//  `save: row N support 0|1 at z Z (solid S frac F nz N)` for every row it is asked
//  about, so the fixed build says what it decided and what it saw.  It also catches
//  the one way this fixture could be wrong: if z 100 is inside a ceiling brush the
//  trace reads `solid 1`, and the probe would then be refusing for a reason that has
//  nothing to do with the row being airborne -- so the arm would pass while measuring
//  something else.  `solid 0` is graded for that reason, not as a consequence.
//
//  PRE-REGISTERED PREDICTIONS
//   S   FIXED: `save: row 1 support 0` with `solid 0` and `frac 1.000` -- nothing
//       within the probe.  `evslot 904`, `timer: armed`, `arm zone 0 (armed from 0)`,
//       `class: segmented`, `practice 1`: the gate did not fire, so the load keeps the
//       taint SV_TimerStitched gave it.
//   S   CONTROL (pre-443, 89f5f7a): `evslot 904`, `arm zone 0 (armed from 0)`,
//       `class: clean`, `practice 0` -- laundered.  No `support` line exists on that
//       build, so it is graded ABSENT there, which also proves the two logs came from
//       different progs.
//   P   BOTH BUILDS: `evslot 901`, `class: clean`, `practice 0` -- the honest grounded
//       row still arms, which is the whole of Build 47's feature.  On the fixed build
//       `save: row 0 support 1` with `nz 1.000`.
//  FALSIFIED IF P reads `segmented` or `practice 1` on the FIXED build (the fix broke
//   the gesture the gate exists for -- the fix is wrong, not the arm), or if P reads
//   `segmented` on the CONTROL (the gate never fires in this arm and S proves nothing),
//   or if S's `support` line reads `solid 1` (the fixture is embedded, see above), or
//   if S reads `clean` on the fixed build, or `segmented` on the control.
//
//  RESULT (2026-09-26, both builds, driver exit 0 each way; qwprogs 88E5939564887CAD
//   fixed / 3096B6F5468BEE3A control -- the control is HEAD before Patch 443
//   (89f5f7a) built in a worktree, and byte-identical to the pair DEPLOYED on the
//   twelve lobbies, so the control side is a reading of the live build.  Logs kept as
//   ftesurf/logs/p443air.log.fixed and .control, each with a .hash beside it.)
//   S  FIXED: `save: row 1 support 0 at z 100.0000 (solid 0 frac 1.000 nz 0.000)` --
//      the probe reached its end and found nothing, which is the whole measurement.
//      ROUND 2 ADDS `save: row 1 quadrants 4 of 4`: the mover's own sub-box retry ran
//      and found no standable plane under any corner either, so the refusal is the
//      answer CategorizePosition would give and not an artifact of testing one hull.
//      `evslot 904`, `timer: armed`, `arm zone 0 (armed from 0)`, `class: segmented`,
//      `practice 1`: the gate refused, so the load keeps its stitch taint.
//   S  CONTROL: `evslot 904`, `arm zone 0 (armed from 0)`, `class: clean`,
//      `practice 0` -- LAUNDERED.  A body hanging 36 units up inside the start slab
//      armed a clean attempt, and the 36-unit drop is free because the clock does not
//      start until the hull leaves the box.  No `support` line exists on that build,
//      which the driver also checks as proof the two logs are from different progs.
//   P  FIXED: `save: row 0 support 1 at z 64.0312 (solid 0 frac 0.500 nz 1.000)` --
//      contact at half a 3-unit sweep from one unit up, i.e. a floor at z 64.0312
//      exactly, with a flat normal.  `evslot 901`, `class: clean`, `practice 0`.
//      ROUND 2 READS `frac 0.000` FOR THE SAME ROW, and the difference is the whole
//      of that round's first fix: the trace no longer starts a unit up, so contact
//      with a floor the row is sitting exactly on comes at the start of the sweep.
//      It reads `emb 0`, i.e. not embedded -- which is the measurement that justified
//      dropping the lift.  It is NOT proof of a margin: com_bih.c clamps a negative
//      fraction to 0, so 0.000 is compatible with any clearance up to DIST_EPSILON.  The server also confirms
//      the two numbers the probe reads, in its own serverinfo:
//      `pm_groundtracedist 1` (not the engine fallback of 2) and
//      `pm_groundquadrants 1`.
//      ROUND 3 READS `frac 0.000` AGAIN and that is the point of re-running it: the
//      sweep is now the mover's own one unit rather than two, and startsolid is a
//      REFUSAL rather than contact -- so if a grounded row's rounded origin could land
//      inside the floor, THIS is the reading that would have gone to `support 0`.  It
//      did not, which is the reviewer's arithmetic measured: a physics-legal body is
//      held DIST_EPSILON 0.03125 off the plane it collided with and `origin %.4f`
//      quantises to 0.00005.  Round 4 withdrew that as a CLAIM (see above) and kept the
//      reading: on this map's floor a grounded row is not embedded, run after run, and
//      the E row shows what the branch does with one that is.
//   P  CONTROL: `evslot 901`, `class: clean`, `practice 0` -- the same answer, which
//      is the point of the positive control: the honest grounded row still arms on
//      both builds, so S's difference is the airborne case and not the gate having
//      become unreachable.
//   E  (ROUND 4) FIXED: `save: row 2 support 0 at z 60.0000 (emb 1 frac 1.000 nz 0.000)`
//      plus `quadrants 4 of 4`, `evslot 905`, `class: segmented`, `practice 1` -- a row 4
//      units INSIDE the floor is refused.  CONTROL HERE IS PATCH 443 ROUND 2
//      (646DB0AD455249A0), the build that CERTIFIED startsolid as contact, and it reads
//      `class: clean`, `practice 0`: it ARMS the embedded row.  That is the discriminator
//      round 3 shipped without -- both of its rows read `emb 0`, so the flip it made
//      never fired in any arm.  `--pre r2` selects this generation; `--pre 443` is S and
//      P's, and one flag could not say both (tools/p437win.py hit the same wall).
//      THE THREE ROWS NOW READ DISTINCTLY, which round 3 also lost: `emb 0 frac 1.000`
//      is airborne, `emb 0 frac 0.000 nz 1.000` is standing, `emb 1` is embedded.  Round
//      3 printed the LAST trace's startsolid, and the quadrant retry overwrites it, so a
//      row refused for being embedded and one refused for hanging in the air printed the
//      same line.
//   ALSO READ, and worth one line because it confirms the patch's own reasoning:
//   `start: ok 0` at S on BOTH builds.  On the control that is not Patch 443 -- the
//   gate fired, so SV_TimerArm ran one tick later and cleared the flag itself.  It is
//   why 443's startok change makes the other placements agree with the one that
//   already did, rather than inventing a rule for them.
log_enable 1
log_dir logs
log_name p443air
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
sv_port 27700
sv_cheats 0
set run_resume 0
vid_fullscreen 0
waitms 5000
map bhop_eazy
waitmap 2400
waitms 3000
menu_restart
ui_close
waitms 1200

echo ==== S SUBJECT: load row 2, the AIRBORNE at-rest row ====
cmd sl_goto 2
waitms 1200
cmd timer
waitms 1000

echo ==== P POSITIVE CONTROL: load row 1, the GROUNDED at-rest row ====
cmd sl_goto 1
waitms 1200
cmd timer
waitms 1000

echo ==== E ROUND 4: load row 3, the EMBEDDED row (4 units under the floor) ====
// The branch round 3 changed and never fired.  Rows 1 and 2 both read `emb 0`, so the
// accept-to-refuse flip shipped unmeasured in the direction it changed -- the same trap
// as an arm whose condition never occurs, one level up.  z 60.0000 against a floor
// surface at 64.03125 puts the hull's feet 4 units inside the world brush, and 60 is
// still inside the override's slab [48, 208] so the gate is reached.
cmd sl_goto 3
waitms 1200
cmd timer
waitms 1000

quit
