// FTESurf Patch 195: AnimatedTexture.
//
// surf_demise's smoke is the case that opened all of this: elly/animated_smoke,
// 331 frames of 256x256 DXT1, driven by an AnimatedTexture proxy at 24fps.
// Patch 189 gave it a scroll and it still could not cycle, because
// img_vtf.c read `frames = 1;//vtf->numframes;`.
//
// Three things to see:
//  1. The generated shader.  With hl2_animated 1 the material must come out as
//     a PASS containing `program "vmt/animated#...#ANIMRATE=24"` and
//     `map "$2darray:materials/elly/smokeanimated.vtf"` -- the $2darray prefix
//     is what asks the loader for every frame (gl_shader.c:1022).
//  2. No GLSL errors.  vmt/animated is `!!ver 130-450` and is the first thing in
//     this plugin to use a sampler2DArray, so a compile failure is the most
//     likely way this goes wrong and it must be looked for rather than assumed.
//  3. The frames actually advancing.  Two screenshots a second apart at 24fps is
//     24 frames of a 331-frame flipbook; if they are identical it is not
//     cycling.  A third with hl2_animated 0 is the control.
//
// The camera is 260 units back from the smoke surface the original shader_here
// dump reported, along -X, so it looks AT the sheet instead of being buried in
// it -- the mistake p193a made with this same coordinate.

cfg_save_auto 0
log_name p195
developer 1
scr_sshot_type png
cl_yieldcpu 0
waitms 2500

echo "=== P195 AnimatedTexture ==="
hl2_animated 1
map surf_demise
waitmap 180
waitms 8000

echo "### GENERATED SHADER for elly/animated_smoke"
r_showshader elly/animated_smoke
waitms 500

echo "### FRAME A"
setpos 6900 -6287 4763 0 0 0
waitms 1500
screenshot_mega p195_smoke_A 1280 720
waitms 1000

echo "### FRAME B (1s later -- 24 frames on at 24fps)"
screenshot_mega p195_smoke_B 1280 720
waitms 1000

echo "### CONTROL: hl2_animated 0"
hl2_animated 0
waitms 4000
screenshot_mega p195_smoke_off 1280 720
waitms 1000

echo "=== P195 DONE ==="
waitms 1500
quit
