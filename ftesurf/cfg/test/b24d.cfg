// BUILD 24 stage 2 -- the +showscores leaderboard, driven from the console.
//
// A scripted config cannot press TAB, cannot click a row and cannot read a
// pixel.  `scores` exists for exactly that reason, the same reason `replay
// status` does: without a console handle and a status line the leg derivation,
// the name sort, the header reads and the clean/stitched rule would be
// verifiable only by looking at them.
//
// WHAT EACH BLOCK PROVES.
//
//   legs        derived from the ZONE TABLES and not from the directory, so a
//               leg with no runs still gets a row.  surf_aesthetic has 19 zones;
//               the leg count must match what zone_dests reports about its
//               tracks and segments, INCLUDING legs that have never been run.
//   rows        one wildcard in the last component, FS_NAMESORT, and the sort IS
//               the ranking.  The status line prints every row's path, so the
//               order can be read against the folder rather than trusted.
//   headers     owner / date / version / clean come out of the FILE, nine fgets
//               each.  A v3 recording (everything on disk before today) has no
//               `flags` key and must read `unknown` for `last` rather than being
//               guessed into clean or stitched.
//   filter      an UNKNOWN row shows under BOTH settings.  That is the honest
//               rule and it is the one a filter is most likely to get wrong.
//   hand-off    `scores watch N` opens row N in the stage 1 player, which is the
//               same call a click makes.  `replay status` then proves it is the
//               file the row named.

developer 1
log_developer 1
cfg_save_auto 0

wait 200
map surf_aesthetic
waitmap 90

echo "=== B24D: what the map's zones say the legs are ==="
cmd zone_dests
wait 20

echo "=== B24D: and the board's derivation of them, leg by leg ==="
echo "--- zone_dests lists only zones WITH a teleport destination, so these ---"
echo "--- two are not the same list; the leg count is arithmetic over ALL of ---"
echo "--- them and this is the only way to read it without doing it by hand ---"
scores legs
wait 10

echo "=== B24D: the board's own answer, closed ==="
scores
wait 10

echo "=== B24D: leg 1 -- main.  Rows in NAME order, which is TIME order ==="
scores leg 0
wait 10

echo "=== B24D: the filter.  An unknown row must survive BOTH settings ==="
scores filter clean
wait 10
scores filter stitched
wait 10
scores filter all
wait 10

echo "=== B24D: a leg with nothing on it must say so, not fault ==="
scores leg 3
wait 10
scores leg 0
wait 10

echo "=== B24D: out-of-range leg indices are clamped, not crashed ==="
scores leg 999
wait 10
scores leg -5
wait 10

echo "=== B24D: the hand-off -- row 1 into the stage 1 player ==="
scores watch 1
wait 20
replay pause
replay status
wait 10

echo "=== B24D: and the camera really is on the row's own file ==="
replay seek end
replay status
replay stop
wait 20

echo "=== B24D: a row index nobody has must be refused quietly ==="
scores watch 99
wait 10

echo "=== B24D: close, and the board says so.  `scores` alone TOGGLES, so the ==="
echo "=== second line below must report it OPEN again -- that is the toggle  ==="
echo "=== the TAB bind uses, and a config is the only place to check it.     ==="
scores close
wait 10
scores
wait 10
scores close
wait 10

echo "=== B24D: regression ==="
pm_selftest
zone_selftest

echo "=== B24D: done ==="
wait 30
quit
