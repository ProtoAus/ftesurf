// Patch 745: the player line hidden (hud_trail 0) is still recorded, so a rewind opens.
// Private dedicated overlay only: tools/runlines_smoke.py --dedicated --map surf_dune,
// graded by tools/test_runlines_hidden.py <rig>/ftesurf/logs/runlines_smoke.log.
cfg_save_auto 0
name RunlinesHidden
log_enable 1
log_dir logs
log_name runlines_smoke
cl_idlefps 0
cl_maxfps 100
set hud_rewind_chase 0
rec_savelock 1
waitms 2000
map surf_dune
waitmap 60
waitms 6000
menu_restart
ui_close
hud_trail 0
hud_trail_fade 1
cmd zone_goto 0
waitms 600
// surf_dune's platform ends about 300 u past the box: 1.6 s of walking stays on it.
+forward
waitms 1600
-forward
echo ==== HIDDEN RUN ====
trail
cmd timer
screenshot runlines_hidden_run.png
waitms 600
echo ==== HIDDEN REWIND ====
rewind
waitms 250
rewind
waitms 1200
rewind status
screenshot runlines_hidden_rewind.png
waitms 600
rewind
waitms 1200
echo ==== HIDDEN CLOSED ====
rewind status
cmd timer
echo ==== SHOWN AGAIN ====
hud_trail 1
waitms 600
trail
screenshot runlines_hidden_shown.png
waitms 600
echo RUNLINES COMPLETE
waitms 100
quit
