// Build 30 -- does the ghost stand-in actually DRAW, and at the right size?
//
// b30c answered "does ghost work" (it does: the body moved 2650 units while
// detached).  It did NOT answer this, and could not have: it ghosted off a ramp
// at 1500 u/s, so by the time the camera had flown anywhere the body was a
// thousand units away on its own trajectory and out of frame.
//
// So: stand still at spawn, detach, back off in a straight line, and look at it.
// surf_null because it loads in a couple of seconds and its geometry is plain
// enough that a 32x32x62 box with a nose is unmistakable against it.
//
// HEIGHTS CHANGED IN PATCH 278.  This script was written at build 30 and its
// pass criteria said 72 and 54 until then.  Those were the CS:S hull; the game
// moved to Momentum's 62/45 in build 41 (sh_defs.qc:36-39) and the MODEL was
// left behind, so from build 41 to build 51 the stand-in really did draw 72
// units tall and this script really did pass.  If you are reading an old
// screenshot against this file, that is why it does not match.
//
//   b30h-1-before   first person, standing.  No stand-in.
//   b30h-2-close    ghosted, backed off ~200 units.  The box should be dead
//                   centre, standing 62 units tall, its nose pointing AWAY from
//                   the camera -- because the body is still facing the way it
//                   was when we detached, and we backed straight off behind it.
//   b30h-3-far      ~700 units back, for the whole silhouette and its height
//                   against the world.
//   b30h-4-duck     ducked.  Should visibly shorten to the 45-unit model.
//   b30h-5-off      ghost_body 0 -- the box must be gone, camera unchanged.

waitms 2000

echo ^5=== b30h: the ghost stand-in ===

hud_debug 1
scr_conalpha 0
ghost_alpha 1

map surf_null
waitmap 240
wait 60

echo ^5--- standing, first person ---
screenshot b30h-1-before
wait 20

echo ^5--- detach and back off ---
ghost
wait 20
ghost status
wait 5

+back
waitms 250
-back
wait 15
screenshot b30h-2-close
wait 20

+back
waitms 600
-back
wait 15
screenshot b30h-3-far
wait 20

echo ^5--- the ducked model ---
// +duck goes into the usercmd the ghost is emptying, so it cannot reach the
// body while detached.  Come back, duck, then detach again -- the duck state is
// PMF_DUCKED on the body and that is what the model swap reads.
ghost
wait 20
+duck
waitms 400
ghost
wait 20
+back
waitms 500
-back
wait 15
ghost status
screenshot b30h-4-duck
wait 20

echo ^5--- ghost_body 0 ---
ghost_body 0
wait 15
screenshot b30h-5-off
wait 20
-duck

echo ^5=== b30h done ===
wait 30
quit
