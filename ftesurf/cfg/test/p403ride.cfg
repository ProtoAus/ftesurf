// P403RIDE -- anti-cheat open item 8 (coverage): capture the two evidence shapes
// the corpus has never held, and measure the start speed a booster inside a start
// zone hands a run (the control for open item 5b, the start-zone speed cap).
//
//   a `lift` warp   -- an UPWARD trigger_push firing on a GROUNDED player
//                      (sv_entities.qc:5608-5615).  Never seen live or locally.
//   a multi-command ride span -- an armed carrier across a packet holding 2+
//                      commands.  LAN players send one command per packet because
//                      CSQC pins cl_netfps to pm_ticrate (Net_MatchTicrate,
//                      cl_main.qc:108), so this sets cl_netfps AFTER the map load,
//                      which is the only window where it sticks.
//
// SETUP, by hand before the run:
//   copy cfg/test/p403ride.zones.json -> ftesurf/maps/zones/local/bhop_arcane.json
//   park ftesurf/data/runs/bhop_arcane if it exists
// AFTER: delete that local zone file (bhop_arcane ships a real one and local wins)
// and restore data/runs/bhop_arcane.
//
// Geometry from cfg/test/p403probe.cfg.  MAIN's start zone wraps *86 (push +y
// 1800, world 6848 3072 -128 .. 6976 3584 0): a body dropped in it is grounded
// under the push and slides +y along the floor to y~3670, where the floor stops
// and it falls into the end box.  BONUS 1 sits on the floor at z 13600 inside
// *252 (push UP 1250): standing there is the lift, and it carries the body up
// through the bonus end box at z 15100..15600.
//
// setpos is a cheat, so both runs are tainted and land as `_cheat.rec`.  That is
// deliberate -- the capture is about the RECORDS, and a tainted run records the
// same ones.  A clean capture would need the map's own route.
//
// PRE-REGISTERED
//  M1 the main .rec holds at least one `ride` span whose arm and pay are >= 2
//     commands apart inside ONE packet (same <pk>, different <row>).
//  M2 the main .rec holds at least one `warp ... push` record.
//  M3 the body leaves the fixture start zone (y > 3600) at a horizontal speed far
//     above prestrafe (289): the viewpos samples show >= 900 u/s across the exit.
//     This is the start-speed-cap control -- today nothing stops it.
//  L1 the bonus .rec holds at least one `warp ... lift` record, with <fl> 0
//     (the push clears FL_ONGROUND as it lifts).
//  L2 tools/reccheck.py reports 0 faults on both files.
// FALSIFIED IF M1, M2 or L1 finds none -- the capture did not happen and the
// coverage gap is still open.  M3 failing would mean the booster does not reach
// the start-zone exit, and the cap has no live case on this map.
//
// RESULT (2026-09-20).
//  M1 HELD, and this is the capture: `ride 9 394 arm ... 3200` and
//     `ride 9 395 arm ... 1800` are two COMMANDS inside ONE packet (pk 9) with the
//     carrier armed across both -- the multi-command ride span the plan says
//     neither corpus has ever held.  cl_c2spps 10 put 3 `in` rows in every packet.
//     The 3200 is a second first: *87 (1400) and *86 (1800) OVERLAPPING and summed
//     in the one tick they both touch, which is the rule the grammar block states
//     ("two OVERLAPPING push volumes sum in the tick they both touch") and had
//     never been seen either.
//  M2 FALSIFIED AS WRITTEN, and the pre-registration was wrong, not the run:
//     `warp push` is written ONLY on the SF_PUSH_ONCE branch (sv_entities.qc:5579),
//     the one that writes .velocity.  bhop_arcane's boosters are continuous, so
//     they arm the carrier and record `ride`, never `warp`.  0 warps is correct.
//  M3 HELD, larger than predicted.  The samples step 54 u per 0.03 s from 0.3630
//     (y 3242.81) to 0.4230 (y 3350.81) = 1800 u/s.
//  AND THE THING WORTH THE WHOLE ARM: the seed reads
//     `seed 6911.86 2688.81 -120.66  0 0 0  1` -- velocity EXACTLY ZERO, on the
//     ground -- while the body is doing 1800.  The speed is not in .velocity at
//     all; it is in the armed carrier.  A start-speed cap written against
//     .velocity reads 0 here and passes the run.  It has to read .velocity plus
//     .run_basevel when .run_basevel_armed.
//  p403verify: this file is pm_verify PASS.  So today a booster inside a start
//     zone yields a finished, verified run that began at 1800 u/s.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p403ride
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
sv_cheats 1
fs_missingwarn 0
set run_resume 0
sv_port 27682

wait 200
map bhop_arcane
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 1000
zone_list

// cl_netfps stays pinned to pm_ticrate so a command is still one 10 ms tick
// (lowering it just makes ONE longer command -- measured: "cl_netfps 20 -> one
// usercmd per 50 ms").  cl_c2spps DROPS outgoing packets instead (cl_input.c:3570,
// at most 2 in a row), and QW carries the backup moves, so the packet that does go
// out holds up to 3 commands.  That is the multi-command packet.
cl_c2spps 10
waitms 200
cl_c2spps

echo ^5=== M: the booster inside the start zone ===
cmd setpos 6912 2300 -120 0 90 0
waitms 100
cmd viewpos
cmd timer
waitms 200
cmd viewpos
waitms 200
cmd viewpos
waitms 200
cmd viewpos
cmd timer
waitms 400
cmd viewpos
cmd timer
waitms 1200
cmd viewpos
cmd timer
waitms 2000
cmd viewpos
cmd timer

echo ^5=== L: grounded under the upward push (bonus 1) ===
cmd setpos 1535 -10700 13650 0 0 0
waitms 300
cmd viewpos
cmd timer
waitms 500
cmd viewpos
cmd timer
waitms 1500
cmd viewpos
cmd timer
waitms 2500
cmd viewpos
cmd timer
waitms 2000
cmd viewpos
cmd timer

echo ^5=== P403RIDE DONE ===
waitms 1000
quit
