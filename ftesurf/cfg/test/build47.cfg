// BUILD 47 -- hull zone triggering, the save-lock start rule, and three
// readout defects.  `exec cfg/build47.cfg`, then use the aliases below.
//
// WHAT IS ALREADY VERIFIED (automated, logs/zhull01-03.log):
//   * the geometry -- 53 self-test checks, of which the 21 pre-47 ones are
//     green UNCHANGED, so the Zone_XYInRing / Zone_ClipZ extraction moved code
//     and not answers
//   * cl_netfps self-correction, measured: 100 -> 66.6667 on a 0.015 map
//   * zone_list's trigger line, and run_zone_hull published to serverinfo
//   * zone_dests' three-state audit on two maps
//
// WHAT NEEDS A PLAYER, i.e. you.  These are the four below.

// ---------------------------------------------------------------------------
//  b47_hull -- does the clock start a hull-width outside the box?
// ---------------------------------------------------------------------------
//  Stand in a start box and walk out slowly.  The clock should start when your
//  BODY is clear, not when your feet cross the line -- about 16 units later
//  than build 46.  Then flip the cvar and reload to feel the difference; it is
//  map-latched, so `map` is required, not just the cvar.
alias b47_hull_on  "run_zone_hull 1; echo ^2hull rule ON  -- now RELOAD the map (map <name>)"
alias b47_hull_off "run_zone_hull 0; echo ^3hull rule OFF -- build 46 point test; RELOAD the map"
alias b47_where    "zone_list"

// ---------------------------------------------------------------------------
//  b47_save -- a save-lock at a start box must NOT say "segmented run"
// ---------------------------------------------------------------------------
//  Stand in a start zone, save, load it, then walk out normally.  Expect NO
//  "segmented run -- this run will not be saved", and `clean` on the finish.
//  Then do it again with noclip on: it MUST still taint, because the re-arm
//  re-derives the latch from your live state rather than blanket-clearing it.
alias b47_save     "echo ^5save at a start box, load it, walk out. Expect NO 'segmented run'.; echo ^5  then repeat with noclip 1 -- that MUST still taint."

// ---------------------------------------------------------------------------
//  b47_e -- the energy readout after a save-load at a start box
// ---------------------------------------------------------------------------
//  Load the save that teleports you to the start zone.  On landing `e` should
//  read 0, not -65, WITHOUT pressing +jump.
alias b47_e        "hud_energy 1; hud_energy_ref 1; echo ^5land from the save; e should read 0 with no +jump"

// ---------------------------------------------------------------------------
//  b47_jitter -- the speedometer at high framerate
// ---------------------------------------------------------------------------
//  Tap a movement key and let go.  The speedometer and the debug rows should
//  settle to 0 and the strafe line to +19.5, at 1000 fps and at 60 alike.
//
//  TWO SEPARATE FIXES ARE IN PLAY HERE and it is worth knowing which one you
//  are seeing.  b47_jitter_cause sets cl_netfps back to the broken 100 WITHOUT
//  reloading, so the underlying oscillation returns while the display latch
//  stays on -- if the readout still wobbles at 100, the latch is not enough and
//  the cause fix is doing the real work.  Reload the map to get it corrected
//  again automatically.
alias b47_jitter       "hud_debug 1; hud_speed 1; hud_strafe 1; cl_maxfps 0; cl_netfps; pm_ticrate"
alias b47_jitter_cause "cl_netfps 100; echo ^3cl_netfps forced back to 100 -- the 5ms back-date mismatch is back. Reload the map to fix."
alias b47_latch_off    "hud_update 0; echo ^3display latch OFF (per rendered frame)"
alias b47_latch_on     "hud_update -1; echo ^2display latch ON (per command frame) -- the shipped default"

// ---------------------------------------------------------------------------
//  THE JITTER: ONE MECHANISM FIXED (PATCH 269), AND YOU STILL SEE SOMETHING
// ---------------------------------------------------------------------------
//  READ THIS FIRST, because the section below was written when this looked
//  finished and it is not.  Patch 269 fixed a real, measured defect.  You then
//  loaded the patched exe, tapped +forward on colin_blaster, and reported the
//  flicker again -- so either there is a second mechanism, or the one below is
//  not what you were ever looking at.
//
//  WHAT IS ESTABLISHED, and it is worth separating from what is not:
//    * the fix is in the only engine binary on this machine.  All three copies
//      (ftesurf64.exe, FTEQuake\fteqw64.exe, the build tree) are the same
//      build and all carry it.  You cannot be running a stale exe.
//    * measured at 340, 990, 1200, 1290, 1380 and 1400 fps, on this map, one
//      second and five seconds after a release: the engine's reported speed is
//      nonzero on 0 of 3000 frames.  Flip cl_predict_velblend to 1 in the SAME
//      run and it is nonzero on 95% of them.  So the fix holds and the harness
//      can still see the defect when it is put back.
//    * the drawn panel, screenshotted, reads xyspd 0.00 / zspd 0.00, and
//      consecutive shots differ only in the fps counter.
//    * an eight-way audit of every path from the prediction to the pixel --
//      later writers to the value, the nopred gate, the HUD's source choice,
//      the display latch, position-derived readouts, the server stat path --
//      refuted all eight.
//
//  WHAT IS NOT ESTABLISHED: any of it at YOUR framerate.  You play at ~12000
//  fps; a second instance on this machine tops out near 1300 and I could not
//  close that gap, at any resolution.  Every number above is from a tenth of
//  your regime, and this defect is defined by how many rendered frames share
//  one command.  So none of it is proof about what you are seeing.
//
//  ^3b47_verdict IS THE ONE THING THAT WOULD SETTLE IT^7 -- it runs the same
//  measurement inside YOUR session at YOUR framerate and prints six lines.
//  See the alias at the bottom of this section.
//
//  The rest of this section describes the mechanism Patch 269 fixed.  It is
//  accurate; it is just not yet known to be your mechanism.
//
//  FIRST, A CORRECTION.  This file previously said the cause was the client's
//  per-rendered-frame extrapolation in cl_pred.c.  THAT WAS WRONG, and it was
//  wrong in a way worth naming: hud_predicted 0 really does fix the symptom,
//  and that was over-read as identifying the mechanism.  It identifies where
//  the number came FROM, which is a different claim.  Measured with the new
//  cl_predtrace instrument, the extrapolation ran ZERO times in 3,200 traced
//  rendered frames across two runs.  It was never involved.
//
//  WHAT IT ACTUALLY WAS.  At the end of its prediction the engine blends two
//  player states by a fraction f recomputed per RENDERED frame:
//
//      simvel = (1-f)*from.velocity + f*to.velocity
//
//  `to` is the freshly predicted state and is correct.  `from` is the last
//  ACKED state off the network -- and the velocity field of your own player is
//  not maintained there, because the client predicts its own velocity and the
//  server has no reason to keep sending it.  So it FREEZES at whatever you were
//  last moving at.  Measured one second after a key release, standing still:
//
//      from velocity  frozen at 5.2500 on 380 of 400 frames, one value, never
//                     changing
//      to   velocity  0.0000 on all 400
//      from/to origin IDENTICAL on all 380 -- you provably did not move
//      f              ramping 0.087, 0.135, 0.178, 0.221 ... per rendered frame
//
//  (1-f)*5.25 sweeps 0..4.958.  That is your 0-4, closed to four decimals, and
//  it is also the whole of the "+19.5 goes 15-18.5" line, since that line is
//  19.5 minus this speed.  It scales with framerate because f is per rendered
//  frame; it needs a prior tap because until you move once the stale field is
//  still 0 (the untouched control measured 0 nonzero in 400 frames); and its
//  ceiling is the friction floor, stopspeed*friction*tick = 75*4*0.015 = 4.5,
//  because that is the last speed before friction killed it.
//
//  STILL TRUE FROM BEFORE, and both were right:
//    * the input layer is clean.  hud_wishtrace shows the movement value
//      DECAYING 179/38/16/0 within four frames of a release and 0 forever
//      after, so nothing is holding a stale key.
//    * the display latch cannot help.  The bad frame is the FIRST of each
//      command frame -- which the new explanation actually PREDICTS, since
//      small f means large (1-f)*5.25 -- and that is precisely the frame
//      hud_update -1 latches.  b47_latch_on would make it steady-wrong.
//
//  THE FIX: while predicting, the engine now takes the predicted velocity
//  outright instead of blending it against that dead field.  The POSITION blend
//  is untouched -- position must stay continuous and both its endpoints are
//  real.  Nothing feeds simvel back into the mover, so this cannot move a run
//  time; it is a readout fix.
//
//  b47_jit_off IS NO LONGER NEEDED.  hud_predicted 1 (the shipped default) is
//  now both correct AND fresher than the server stat, so leave it alone.  The
//  alias stays only so the old workaround is still reachable.
//
//  b47_velblend is the A/B, and it is a real one: at 1 the bug comes straight
//  back on the same map at the same framerate.  Verified A/B/A plus a control,
//  400 frames each: fix 0 nonzero, old 381 nonzero (max 4.95), fix again 0, and
//  then key-HELD 400 nonzero at max 260 with the origin moving -- so a real
//  speed is still reported in full and this is not just a zeroed readout.
//
//  b47_veltrace is the CSQC instrument, permanent: N rendered frames of
//  speed/velocity/position with the command frame beside them.  cl_predtrace is
//  its engine-side counterpart and dumps the arithmetic above.  Both are
//  self-clearing.  cl_predtrace RECORDS and dumps afterwards on purpose: the
//  first version printed as it went, which throttled the client to one rendered
//  frame per command -- the one regime where this defect cannot appear -- and
//  reported a clean pass that was purely an artifact of the instrument.
alias b47_jit       "hud_debug 1; hud_speed 1; cl_maxfps 0; echo ^5tap a key, let go, then b47_veltrace"
alias b47_jit_off   "hud_predicted 0; echo ^3the OLD workaround -- no longer needed with patch 269, and one tick stale"
alias b47_jit_on    "hud_predicted 1; echo ^2readouts on prediction -- the default, and correct as of patch 269"
alias b47_veltrace  "hud_veltrace 300; echo ^5300 frames dumped to the console and the log"
// ---------------------------------------------------------------------------
//  THE ENERGY GAIN OVER A JUMP -- fixed in PATCH 269c, and it was MY fault
// ---------------------------------------------------------------------------
//  Reported: in colin_blaster's start zone, jump, and `e` starts near 57 and
//  climbs to about 60 during the flight, where Momentum holds a solid 57.
//
//  57 is not approximate.  pm_jumpvelocity is sqrt(2*800*57) = 301.9933774, so
//  the impulse's own apex is exactly 57.0, and E = z + |v|^2/(2g) is conserved
//  under gravity.  A jump must read flat from takeoff to landing.  (You will
//  see 58.5, not 57: pm_jumpzoffset 1.5 pins the takeoff 1.5 units above the
//  surface, so ground+58.5 is the correct number and Momentum does the same.)
//
//  CAUSE, and it was introduced BY Patch 269 four hours earlier.  269 stopped
//  blending the reported velocity across a rendered frame and left the
//  reported POSITION blended.  That made the two halves of the reported state
//  two different instants, and energy is the one readout that combines them:
//
//      E_error = -(1-f) * v_z * dt
//
//  Measured across a jump, per command frame: reads up to 3.6 LOW at takeoff
//  (v_z +278), 0.28 at the apex (v_z +25), and up to 4.1 HIGH on the way down
//  (v_z -286).  A climb of about 4 units across a jump that conserves energy
//  exactly -- which is what you saw, and the sign flip at the apex is why it
//  looked like a steady gain rather than noise.
//
//  Patch 269 was verified on the speed readout only, so this went out with it.
//  That is the actual lesson: a fix to one half of a shared pair has to be
//  checked against every consumer of the pair, not against the one that
//  motivated it.
//
//  THE REAL FIX (269c).  The blend was never wrong -- one of its two inputs
//  was.  It interpolates against the last ACKED player state, whose velocity
//  field is not maintained for your own player (the client predicts its own
//  velocity, so the server stops sending it) and freezes when you stand still.
//  During a JUMP that same field is correct, and the blend built the right
//  answer from it -- so 269 threw out a blend that was doing real work
//  everywhere except the one case that motivated removing it.
//
//  269c keeps the blend and gives it a from-velocity that exists: the velocity
//  this client itself predicted for that frame, carried in the same
//  propagation struct the engine already uses for onground, jump_held, pmsrc
//  and gravitydir -- values that likewise do not survive the network round
//  trip.  It is read only to build the REPORTED number; the mover still seeds
//  from the server's own state, so no movement outcome or run time moves.
//
//  VERIFIED, one run, one map, all three modes against BOTH properties,
//  because fixing one and breaking the other is exactly what happened before:
//
//                       speed after a tap      energy spread in flight
//    velblend 0 (269)   0 of 1200      OK      2.52 mean, 5.55 worst   BAD
//    velblend 1 (pre)   1144 of 1200   BAD     0.022                   OK
//    velblend 2 (269c)  0 of 1200      OK      0.022                   OK
//
//  and a strafe-jump control, so the blend has horizontal work too: 0.041.
alias b47_e_jump    "hud_energy 1; hud_energy_ref 1; echo ^5jump on flat ground: e must hold ~58.5 the whole flight (57 + pm_jumpzoffset 1.5)"
alias b47_velblend  "cl_predict_velblend 1; echo ^3pre-269 blend -- the standing 0-4 speed flicker is back on purpose"
alias b47_vel269    "cl_predict_velblend 0; echo ^3patch 269 -- speed clean, but energy climbs ~4 over a jump"
alias b47_velfixed  "cl_predict_velblend 2; echo ^2patch 269c -- the shipped default: speed clean AND energy conserved"
alias b47_predtrace "cl_predtrace 400; echo ^5400 rendered frames of the engine's own prediction arithmetic"

// ---------------------------------------------------------------------------
//  b47_verdict -- THE ONE COMMAND THAT ANSWERS IT, on your machine
// ---------------------------------------------------------------------------
//  HOW TO USE IT:  stand still, tap +forward, let go, wait about a second so
//  you are definitely settled, THEN type b47_verdict.  It watches the next 800
//  rendered frames and prints six lines.  It costs nothing and disarms itself.
//
//  It does NOT print per frame.  That distinction is the whole reason it can
//  be trusted: the first version of this instrument printed as it went, which
//  throttled the client to one rendered frame per command -- the one regime
//  where the defect cannot occur -- and cheerfully reported a pass.
//
//  WHAT THE ANSWER MEANS:
//    green "clean"      -> the engine is handing the HUD a steady number at
//                          your framerate, so whatever you are watching flicker
//                          is downstream of the engine, or is a different row.
//                          Say WHICH row and I will chase that instead.
//    red "the engine IS producing it" -> it is still the engine and the fix
//                          does not cover your regime.  The line above the
//                          verdict says how many frames took the nopred path
//                          and how many were extrapolated, which is exactly
//                          what would say why.
//    yellow "POSITION is moving" -> it is the position blend, which Patch 269
//                          deliberately did NOT touch, and that is a different
//                          fix with different risks.
//
//  Also check the "rendered frames per command" it reports.  Everything I have
//  measured was at 5-21.  If yours says 180, that alone explains why my
//  verification and your experience disagree.
alias b47_verdict   "cl_predtrace -800; echo ^5watching 800 frames -- verdict in about a second. Tap+release+wait BEFORE running this."
alias b47_verdict_l "cl_predtrace -3000; echo ^5watching 3000 frames -- a longer window, same verdict."

// ---------------------------------------------------------------------------
//  The duck flicker: NOT FIXED, and the one-line test for it
// ---------------------------------------------------------------------------
//  +duck at high fps holds the hull down but flickers the camera up.  If
//  b47_duck stops it, it is the same root cause as the speedometer and build
//  47 already fixes it -- the map load sets cl_netfps for you, so just check
//  whether it still happens on a freshly loaded map.  If it DOES still happen,
//  it is engine-side (cl_pred.c blends simorg by a per-frame fraction but takes
//  the eye height unblended) and needs a patch nobody has taken yet.
alias b47_duck     "cl_netfps; pm_ticrate; echo ^5if these match, the netfps half is already fixed -- so a flicker now is the engine one"

echo ^5build 47 loaded.
echo ^7  b47_hull_on / b47_hull_off / b47_where   -- the hull rule (map-latched)
echo ^7  b47_save                                 -- the save-lock start rule
echo ^7  b47_e                                    -- the energy readout
echo ^7  b47_jitter / b47_jitter_cause            -- the speedometer
echo ^7  b47_latch_off / b47_latch_on             -- display latch only
echo ^7  b47_verdict                              -- the jitter self-check (tap, release, wait, then type it)
echo ^7  ^2b47_e_jump^7                               -- ^2energy over a jump: FIXED^7 (patch 269c)
echo ^7  b47_velfixed / b47_velblend / b47_vel269 -- the three blend modes, A/B/C
echo ^7  b47_veltrace / b47_predtrace             -- its two instruments
echo ^7  b47_duck                                 -- the duck flicker, NOT fixed
echo ^7
echo ^7  Also this build: the server now loads zone triggers on the 32 legacy
echo ^7  maps that never timed at all, `!r` no longer parks you a unit in the
echo ^7  air, and 80 maps get the velocity ceiling they ask for (`movement`
echo ^7  names the file). ^3The engine changed too -- patch 267.^7
echo ^7
echo ^7  ^3Your old times were archived^7 to data/runs.archive-build46-2026-09-07.
echo ^7  The hull rule makes runs ~55-105ms faster, so they could not stay in
echo ^7  one sorted list. ^1data/saves was not touched.^7
