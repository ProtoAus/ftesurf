// cfg_save_auto 0 FIRST: this run sets archived cvars and must never write them
// into ftesurf.cfg (cl_main.c:2535).
cfg_save_auto 0

// ===========================================================================
//  B90BIND -- the save-lock actions as bindable names, headless.
//    python tools/b90bind.py
//
//  WHAT IT MEASURES.  Every one of these was already a server command
//  (sv_player.qc:927-1047) and none was registered client-side, so the whole
//  change is "does the name reach SaveLoc_Console".  A name that did NOT get
//  there prints `Unknown command "..."` -- but absence of that line proves
//  nothing on its own, so every arm below grades a line the HANDLER ITSELF
//  printed, never the silence around it.
//
//    arm 0  sl_delall arms and says so.  The two-press confirmation is the one
//           action here that prints on the FIRST press, which makes it the
//           cheapest proof that a bare name was dispatched into my handler
//           rather than forwarded blind to the server -- the server has no
//           such arming and would have deleted on press one.
//    arm 1  mom_saveloc_remove_all prints the same line, four seconds later so
//           the arm from arm 0 has lapsed.  That the SECOND press did not
//           delete is itself the check that FS_SL_ARMTIME is honoured.
//    arm 2  +sl_hold / -sl_hold latch and release rec_sl_holding, read back
//           through `saveloc`'s own status line.
//    arm 3  the run guard.  A clean run on the clock must refuse a bound load
//           the same way it refuses the digit -- this is the arm that says the
//           names go through SaveLoc_RunLocked and not straight to `cmd sl_*`,
//           which is the entire reason they are QC and not eleven alias lines.
//
//  FORTY SECONDS BEFORE THE MAP, AND THAT IS NOT PADDING.  The first cut ran
//  `map bhop_3d` after 12 s; the map loaded, no csprogs did, and arms 0-2 spent
//  the run printing `Unknown command "saveloc"` -- a command registered for
//  dozens of builds.  The console commands here are CSQC's, and CSQC does not
//  exist until the client connects, so an arm that beats the boot measures an
//  engine with no client VM.  b89browse.cfg's header records the same trap from
//  the menu VM's side.  The driver greps for `FTESurf CSQC loaded` and refuses
//  to grade a run that never printed it.
//
//  ONE MAP, AND ITS SAVES ARE PARKED BY THE DRIVER.  Arms 0 and 1 arm a
//  DELETE-EVERY-SAVE; if their spacing ever slipped under FS_SL_ARMTIME the
//  second press would confirm the first.  surf_dune is the map here because
//  arm 3 needs zones, and it HAS a saves tree -- so tools/b90bind.py renames it
//  aside for the run and checks the restore rather than hoping.
//
//  ARM 3 CAN FAIL TO MEASURE, AND THE DRIVER SAYS SO RATHER THAN PASSING.  The
//  clock starts when the HULL leaves the start box and a plain +forward does
//  not always clear it -- AGENTS.md records surf_4am stopping 32 u inside the
//  region.  So the arm prints `saveloc` BEFORE the load and the driver reads
//  `locked` out of it: locked 0 means no clean run was ever on the clock and
//  the refusal had nothing to refuse.  That is a third verdict, not a pass.
// ===========================================================================

log_enable 1
log_dir logs
log_name b90bind
log_developer 1
developer 1

// The digit map stays ON for this run.  Turning it off is the setup these
// binds exist for, but it also proves nothing here: rec_savelock gates
// SaveLoc_Key and never SaveLoc_Console, so the arms read the same either way,
// and leaving it on is the configuration a player actually has.
set rec_savelock 1

waitms 40000
map surf_dune
waitms 15000

echo ^5==== b90 arm 0: sl_delall is dispatched here, and arms rather than acts ====
sl_delall
waitms 500
saveloc
waitms 4000

echo ^5==== b90 arm 1: Momentum's name resolves onto it, and the arm had lapsed ====
mom_saveloc_remove_all
waitms 500
saveloc
waitms 4000

echo ^5==== b90 arm 2: the hold pair, read back off saveloc's own status line ====
// A SAVE FIRST, and it is not setup -- it is the arm for sl_save, which nothing
// else here exercises.  It is also what makes the hold measurable at all: a
// hold is a hold ON a save, and against an empty list the server refuses
// sl_load, whereupon Patch 428's guard correctly drops the hold before any
// `saveloc` can read it.  The first cut of this arm measured exactly that and
// called it "+sl_hold never latched".  The driver greps the list line, so a
// save that did not happen fails here rather than further down.
sl_save
waitms 900
saveloc
waitms 500
+sl_hold
waitms 700
saveloc
waitms 300
-sl_hold
waitms 700
saveloc
waitms 1500

echo ^5==== b90 arm 3: a clean run refuses a bound load ====
say !m
waitms 3000
+forward
waitms 2500
-forward
waitms 1500

// The condition FIRST.  `locked 1` here is what makes the next line a
// measurement; without it the refusal below is untested code.
echo ^5---- b90 arm 3a: is a clean run actually on the clock? ----
saveloc
waitms 800

echo ^5---- b90 arm 3b: the bound load, which must be refused ----
sl_next
waitms 1200
saveloc
waitms 1500

echo ^5==== b90 done ====
waitms 500
quit
