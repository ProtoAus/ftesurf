// P400PUSH -- Patch 400: a zone move (`!r`, `!s`, `!b`, `!m`, zone_goto) clears the
// push carrier, as Momentum's restart does (TeleportEntity -> SetBaseVelocity(0)).
// Before it, `!r` typed while a trigger_push held you launched you out of the
// start at the push's speed.  bhop_arcane: *86 pushes +y at 1800 (x 6848..6976,
// y 3072..3584, z -128..0); the start zone is x 1280..1536, y -512..512 at z 14400.
// Listen server; run NEW and CONTROL (+set sv_progs qwprogs400ctl = HEAD's server
// progs) with +set log_name.
//
// PRE-REGISTERED
//  A NEW: 1.5 s after `!r` from inside *86 the body is still in the start zone
//    (viewpos inside x 1280..1536, y -512..512) and `timer` reads armed.
//  B CONTROL: the body has left the start zone along +y (y > 512) and the timer
//    reads running -- the launch.  If not, this harness does not see the bug.
//  C both arms: `!r` from standing still (no push) leaves the body in the zone,
//    armed (the fix changes nothing without a carrier).
// FALSIFIED IF A or C fails on NEW, or B does not show the launch on CONTROL.
//
// RESULT (2026-09-20).  A and C HELD: NEW `!r` from inside *86 rests at the start
//   (1408, 0.0, 14400), armed, as it does with no push.  B FALSIFIED as written but
//   the bug shows: CONTROL cashed the carrier out and slid to (1408, 443.2) inside the
//   zone (ground friction), timer still armed -- this map's timer starts on a jump,
//   not on leaving.  Enough to leave the zone on a leave-start map, or with a jump.
cfg_save_auto 0
log_enable 1
log_dir logs
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
sv_cheats 1
fs_missingwarn 0
set run_resume 0
sv_port 27682

wait 200
map bhop_arcane
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 1000
echo ^5=== p400 C (no push) ===
say !r
waitms 1500
cmd viewpos
cmd timer
waitms 1500
echo ^5=== p400 A/B (inside the push) ===
cmd setpos 6912 3200 -120 0 90 0
waitms 60
say !r
waitms 1500
cmd viewpos
cmd timer
waitms 2000
echo ^5=== p400 DONE ===
waitms 500
quit
