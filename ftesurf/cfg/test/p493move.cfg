// Patch 493 -- THE MOVE-COLUMN RANGE MARKER.  Subject + control in one run.
//
// A usercmd's move triple reaches the server with no range test anywhere (the
// engine's server side is a bare `sv_player->xv->movement[0] =
// ucmd->forwardmove;`), and nothing in this tree has ever looked at it.  Patch 493
// compares each command's largest |axis| against `run_movebound` (2000), counts
// the ones over it, keeps the worst, sets TF_MOVEOOR, states the bound in the
// file as a `movebnd` header key and prints all of it from `cmd timer`.
//
// Run headless from C:\FTESurf (the basedir is the cwd):
//   Start-Process -FilePath .\ftesurf64.exe -WorkingDirectory "C:\FTESurf" `
//     -ArgumentList '-WindowStyle','Minimized','+exec','test/p493move.cfg'
// then:  python tools\p493move.py
//
// THE SUBJECT IS A CONFIG, NOT A CHEAT, AND THAT IS THE POINT OF THE ARM.  Both
// phases drive the stock input layer: the only difference between them is
// cl_forwardspeed, which is an ordinary archived cvar.  So this arm measures the
// observation, not an accusation -- the same 5000 could come from a CreateMove
// rewrite writing a DISTANCE into forwardmove, and telling those apart is what the
// counters (over/worst) and the client's own input profile are for.
//
// PRE-REGISTERED PREDICTIONS
//  P1  CONTROL (cl_forwardspeed 450, the shipped config): the line reads
//      `movebnd: bound 2000  over 0  worst 450  moveoor 0`.  worst is EXACTLY 450
//      because that is what the cvar says and the whole command is one key held;
//      a control that read worst 0 would mean the move never reached the server
//      and the arm measured nothing.
//  P2  SUBJECT (cl_forwardspeed 5000, +forward held): `over` is > 0, `worst` is
//      >= 5000 and `moveoor` is 1.  over is a COUNT OF COMMANDS, so it grows with
//      the hold -- two samples of the same line must not read equal.
//  P3  THE FILE CARRIES THE KEY: the archived .rec's header has `movebnd 2000`
//      and its `flags` word has bit 262144 set, and tools/reccheck.py faults
//      neither (the two-directional check agrees: rows over the bound exist AND
//      the bit is set).
//  P4  NEGATIVE CONTROL ON THE CHECK ITSELF: reccheck.py must FAULT a copy of
//      that file with the bit cleared and one with a row edited over the bound.
//      Graded by tools/p493move.py, not by this cfg.
// FALSIFIED IF P1's worst is 0 (the control never moved, so P2 proves nothing),
//   or P2's over does not grow between two samples (the check is per packet, not
//   per command), or P3's key is absent (the writer and the check read different
//   numbers).
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p493move
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
set rec_enable 1
set rec_hid 0
set rec_upload 0
set rec_runarchive 1
// THE FILE ARM FINISHES THE RUN, AND A PARK WOULD HAVE MEASURED NOTHING.  Two
// runs of this cfg taught that, in order:
//   1. it flew to the end zone and archived nothing -- because `map` with no
//      `waitms` before it and no `waitmap` after it left every later command
//      running while the engine was still initialising, so the whole arm read
//      `Can't "cmd", not connected` and never had a run at all;
//   2. it PARKED the run instead (Multi-Session, run_resume_min 1) and produced a
//      closed file with `flags 0` beside 284 rows over the bound.  That is not a
//      bug in the marker and it is not a bug in reccheck: THE FLAGS WORD IS ONLY
//      REWRITTEN AT A REAL CLOSE (SV_RecClose, or SV_RecKeepEvidence for a kept
//      abandon), so a parked file cannot carry any marker set after its open --
//      which is why reccheck.py gates every header-bit cross-check on `end`, and
//      why this one now does too.
// So: fly b88fin.cfg's route into the END zone and grade the tainted finish.
// run_resume 0, so a flight that fails to finish cannot leave a Multi-Session
// slot in data/resume -- a shared fixture, and a slot left behind is offered to
// whoever runs this map next.
set run_resume 0
name "^3P493"

// THE MOVE CVARS ARE ARCHIVED, so the owner's ftesurf.cfg can override
// default.cfg's 450 and the control would then measure the wrong ceiling.  Set
// all four explicitly and print them back: a precondition nobody read is a
// precondition nobody proved.
set cl_forwardspeed 450
set cl_sidespeed 450
set cl_upspeed 450
set cl_backspeed 450
set cl_movespeedkey 1
echo P493 PRECONDITION cl_forwardspeed $cl_forwardspeed cl_sidespeed $cl_sidespeed cl_movespeedkey $cl_movespeedkey

// A PORT OF ITS OWN: another session runs arms on bhop_eazy too, and a
// listen server that cannot bind is an arm that measures nothing while
// looking like a hang.
// waitms BEFORE the map and waitmap AFTER it -- the recipe in b89zdl.cfg's
// own comment, which is the trap this cfg hit on its first run: with
// neither, every command ran while the engine was still initialising, the
// map never loaded, and the whole arm read `Can't "cmd", not connected`.
waitms 4000
set sv_port 27893
map bhop_eazy
waitmap 45
sv_cheats 1
waitms 500
echo ================================ P493 A -- control: the shipped 450
cmd zone_goto 0
waitms 1500
setpos -352 -352 144 0 335.3 0
waitms 1000
+jump
waitms 700
-jump
waitms 1500
+forward
waitms 1200
cmd timer
waitms 1200
cmd timer
waitms 800
-forward
waitms 1500
echo ================================ P493 A -- the line the control must print
cmd timer
waitms 1500

echo ================================ P493 B -- subject: the same key at 5000
set cl_forwardspeed 5000
echo P493 PRECONDITION subject cl_forwardspeed $cl_forwardspeed
waitms 500
+forward
waitms 1200
cmd timer
waitms 1200
cmd timer
waitms 800
-forward
waitms 1500
echo ================================ P493 B -- the line the subject must print
cmd timer
waitms 1500

echo ================================ P493 C -- FINISH the run, so the file is closed
// b88fin.cfg's route verbatim (jump start, then a noclip flight into bhop_eazy's
// END zone), and it is the only way a script gets a CLOSED file: the zone scan is
// a server-side point test, so a noclip flight does cross the end region, while
// sv_lobby.qc's own essay is right that a finish is not reachable by walking one.
// THE FLAGS WORD IS ONLY REWRITTEN AT A REAL CLOSE -- SV_RecClose, or
// SV_RecKeepEvidence for a kept abandon -- so a parked or part file carries
// `flags 0` and cannot show TF_MOVEOOR at all.  That is why this arm flies.
// It lands as data/runs/bhop_eazy/main/cheat.rec (noclip + setpos taint it, which
// is the point: nothing here depends on the clock).  The driver backs that file up
// and restores it, because it is b88fin's fixture and not ours to keep.
set cl_forwardspeed 450
waitms 1000
// BACK TO b88fin's LAUNCH POINT, and this is not decoration: phases A and B move
// the body (B at cl_forwardspeed 5000), so a flight from wherever B left it goes
// somewhere else entirely -- the first run of this arm flew 2785 units down +x and
// never crossed the end region (`checkpoints: 0 crossed`).  A setpos mid-run adds
// a `warp` record and taints the attempt, both of which are already true here, and
// it does NOT re-arm: only `zone_goto` does that, so the counters this arm is
// measuring survive it.
setpos -352 -352 144 0 335.3 0
waitms 1000
noclip
waitms 500
+forward
waitms 1500
cmd timer
waitms 500
waitms 2900
cmd timer
waitms 2000
-forward
waitms 1500
echo ================================ P493 C -- after the end zone: expect FINISHED
cmd timer
waitms 2500

echo ================================ P493 done
quit

// RESULT (2026-10-05, third run of this cfg; graded by tools/p493move.py, 26
// checks, 0 failed).  THE FIRST TWO RUNS ARE THE INTERESTING PART and both are
// recorded in the comment above the `map` line: one measured nothing because the
// map never loaded, and one produced a real file that could not show the marker.
//   P1 control   bound 2000  over 0    worst 450   moveoor 0   (x3 samples)
//   P2 subject   bound 2000  over 120  worst 5000  moveoor 1, and the next
//                sample read over 283 -- a count of commands, growing as predicted
//   P3 the closed file: header `movebnd 2000`, `flags 395013` (262144 present),
//      reccheck 0 faults, and its own reading of the rows
//      `moveoor: 284 of 1938 over 2000 (worst 5000)`
//   D1/D2/D3 the two tamper directions fault and the weak one notes
//   THE PREDICTION THAT FAILED, and it was the one that mattered: this cfg
//   predicted a Multi-Session park would carry the flags word.  It does not --
//   SV_RecFlagLine's reserved line is rewritten only at a real close, so a parked
//   file reads `flags 0` beside 284 rows over the bound.  The first cut of
//   reccheck's cross-check faulted that file, i.e. accused a recording the writer
//   never finished; the check is now gated on `end` like every other header-bit
//   cross-check, and tools/test_reccheck.py's case_movebnd pins the gate.
//   Residue: the driver restores data/runs/bhop_eazy/main (cheat.*, last.*) and
//   deletes any resume slot the arms parked.  Two other keys' slots live in that
//   folder and are not touched.
