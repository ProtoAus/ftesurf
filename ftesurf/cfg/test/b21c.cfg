// FTESurf build 21 -- regression, plus the one thing b21a and b21b could not
// show about item 1.
//
// log_dir is deliberately NOT passed on the command line for this run.  Both
// earlier runs set it there, so they proved the cvar works and NOT that
// cfg/default.cfg sets it -- which is the whole of the change.  This run is
// launched with `-condebug +set log_name b21c` and nothing else, so if
// logs/b21c.log exists afterwards, default.cfg did it.
//
// Also confirms the shipped zone file is back: b21b ran against a local fixture
// that shadowed it, and surf_666 must read 6 segments again, not 1.

cfg_save_auto 0
developer 0

wait 200
map surf_666
waitmap 60
waitms 500

echo "--- the shipped zones are back: expect 6 segments, NOT the 1-segment fixture ---"
cmd zone_dests
waitms 600

echo "--- build 21 cvars, none of them empty ---"
run_rearmhop
run_starthop
run_starthop_strict
run_rearmstops
run_teleport_warp
hud_splits_x
hud_splits_y
hud_seq_x
hud_seq_y
log_dir
scr_sshot_prefix
waitms 400

echo "--- pm_selftest ---"
pm_selftest
waitms 1200

echo "--- zone_selftest ---"
zone_selftest
waitms 1200

echo "--- a named screenshot must land in screenshots/, not the gamedir root ---"
screenshot b21-namedshot
waitms 700

echo "--- done ---"
waitms 400
quit
