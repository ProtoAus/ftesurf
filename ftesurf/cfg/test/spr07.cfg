// SPR07 -- the regressions, and the two new menu rows on screen.
//
// Stage D touched cl_main.qc (a call site and four cvars), cl_gfx.qc (two rows
// and eleven shifted ones) and sv_entities.qc (five stubs).  The rows shifting
// is the part with reach: every row from Prop distance down moved by two, and a
// table like that is easy to get off by one in a way nothing warns about.
//
// So: the whole table printed, page 3 and page 4 screenshotted, and the numbers
// Patch 246 established re-read to make sure nothing moved.
//
//   surf_rise      overlays: 103 of 105 placed        (Patch 246's number)
//   bhop_canals    decals:   81 of 416 placed         (the infodecal control)
//   bhop_arcane    1122 func_bhop, 5 of 5 overlays
//   surf_kitsune   50 wired outputs, target case: 28
//
// ent_census on each: the five stubbed classes must have LEFT the unimplemented
// list, and env_spritetrail / env_lightglow must still be IN it.

log_enable 1
log_dir "logs"
log_name "spr07"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
sv_cheats 1
vbsp_sprites 1
vbsp_spotlights 1

wait 200

echo ^5=================== the gfx table, all 26 rows =====================
map surf_rise
waitmap 1800
waitms 5000
gfx_menu status
waitms 1000

echo ^5=================== page 3: Overlays, Sprites, Light shafts =========
gfx_menu page 3
waitms 1000
screenshot spr07_page3
waitms 800
echo ^5=================== page 4: the eleven that shifted ==================
gfx_menu page 4
waitms 1000
screenshot spr07_page4
waitms 800
gfx_menu
waitms 500

echo ^5=================== surf_rise census ================================
cmd ent_census
waitms 1500

echo ^5=================== bhop_canals: the infodecal control ==============
map bhop_canals
waitmap 1800
waitms 5000
cmd ent_census
waitms 1500

echo ^5=================== bhop_arcane =====================================
map bhop_arcane
waitmap 1800
waitms 5000
cmd ent_census
waitms 1500

echo ^5=================== surf_kitsune: the entity-I/O regression =========
map surf_kitsune
waitmap 1800
waitms 5000
cmd ent_census
waitms 1500

echo ^5=== spr07 done ===
wait 30
quit
