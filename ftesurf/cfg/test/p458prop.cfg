// P458PROP -- prop scale parity: the client and the server collided against
// different-sized props, and this is the arm for the floor that fixed it.
//
// WHAT WENT WRONG.  `.scale` is a plain QC float and nothing clamps it on write,
// so one number reached four readers three ways:
//
//   wire -> client pmove   bound(1, scale*16, 255) as a BYTE (sv_ents.c:3953,
//                          protocol.h:1434), /16 on arrival (cl_ents.c:7791)
//   renderer               the same byte (cl_ents.c:6122)
//   server pmove           bound(1, scale*16, 255)/16.0, NO truncation
//                          (sv_user.c:7747)
//   World_Move             the raw float (world.c:1405, :1420, :1428)
//
// `modelscale 1.4` therefore predicted as 1.3750 on the client and moved the
// player against 1.4000 on the server.  SV_SpawnProp now floors the field to the
// 1/16 the wire carries, which puts all four on one number by construction --
// a multiple of 1/16 is exact in float32, so there is nothing left to round.
//
// WHAT THIS ARM MEASURES, AND WHY IT IS THE RIGHT THING.  Not a screenshot and
// not a trace: the SPAWN'S OWN COUNT of props it had to requantise, printed on
// the `props:` line.  That count is the population whose collision size the two
// sides disagreed about, and it is graded against
// tools/census/propsolid.py -- an independent reader of the same question out of
// the BSP's entity lump, written from the map format and not from the QC.  Two
// readers, one number, per map.  (reccheck.py's discipline.)
//
// THE TWO CONTROLS ARE THE POINT.  A counter that always prints proves nothing:
//   ahop_coast   284 props and ZERO requantised -- props exist, none need the
//                floor, so the clause must stay SILENT.  This is the arm that
//                fails if the condition is written backwards or is always true.
//   bhop_eazy    no props at all -- `props: 0 spawned` and nothing after it.
//
// PRE-REGISTERED, from the census (solid AND non-solid, since the spawn counts
// every prop it makes; props with no model or a '*N' brush model are dropped
// before the scale block and so are excluded there too):
//   surf_spacemonkeys   257 props, 225 requantised
//   surf_420            232 props, 109 requantised
//   surf_dune           344 props,  98 requantised
//   surf_bikini_bottom  273 props,  46 requantised
//   ahop_coast          284 props,   0 requantised   <- must print no clause
//   bhop_eazy             0 props,   0 requantised   <- must print no clause
//
// MUTATION THAT MUST FAIL IT, and it has to be the right one.  Deleting the
// floor outright takes P1 down with P2, because the counter tests `raw != sc` and
// a deleted floor makes that always false -- so it proves the pair fires
// together, not that P2 measures the arithmetic.  The isolating mutation is
// `floor(sc*16 + 0.5)`: the population is unchanged, so P1 and P3 still pass, and
// every scale whose sixteenth-fraction is >= 0.5 rounds the wrong way -- 1.1 to
// 18/16 instead of 17/16, 1.8 to 29/16 instead of 28/16.  P2 alone goes red.
// Run against that build: P1 PASS, P2 FAIL, P3 PASS.  Recorded below.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p458prop
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
sv_port 27708
sv_cheats 0
vid_fullscreen 0
waitms 5000
menu_restart
ui_close
waitms 1200

echo ==== M1 surf_spacemonkeys 257/225 ====
map surf_spacemonkeys
waitmap 3600
waitms 2500

echo ==== M2 surf_420 232/109 ====
map surf_420
waitmap 3600
waitms 2500

echo ==== M3 surf_dune 344/98 ====
map surf_dune
waitmap 3600
waitms 2500

echo ==== M4 surf_bikini_bottom 273/46 ====
map surf_bikini_bottom
waitmap 3600
waitms 2500

echo ==== M5 ahop_coast 284/0 CONTROL -- no clause ====
map ahop_coast
waitmap 3600
waitms 2500

echo ==== M6 bhop_eazy 0/0 CONTROL -- no props ====
map bhop_eazy
waitmap 2400
waitms 2000

quit
