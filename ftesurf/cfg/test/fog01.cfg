// FOG01 -- Patch 254 stage 1: does Source fog actually reach the screen, and
// are the NUMBERS the ones Source would use?
//
// Five maps, chosen so that a plausible-but-wrong implementation fails at least
// one of them.  Bare `fog` / `skyroomfog` print the engine's current state
// (CL_Fog_f's argc<=1 arm), so this reads back what the gamecode actually set
// rather than trusting that it ran.
//
//   surf_potatochip   one controller, fogmaxdensity 1.  The easy case: end and
//                     end' agree at m=1, so this only proves fog arrives.
//                     expect: fog 8000, rgb .470588 .611765 .600000, a 1, bias 2000
//
//   bhop_angst        THREE controllers and the master is `fog_off` (fogenable 0).
//                     Must start UNFOGGED.  If it starts fogged, the selection
//                     rule picked "first enabled" instead of "master else first",
//                     which is wrong on 34 of the 194 maps.
//                     expect: fog 0, and the load line naming fog_off (off)
//
//   surf_minimumwage  the same trap with teeth: its ONLY enabled controller is
//                     `fog_underwater` (1650..4000).  "First enabled" drowns the
//                     whole map in underwater fog from the spawn point.
//                     expect: fog 0
//
//   surf_huecomundo   NO world fog, sky_camera only, fogmaxdensity 0.16, scale 32.
//                     This is the reparametrisation check.  Source takes
//                     min(m, u), not m*u, so end' = start + m*(end-start)
//                     = 2000 + .16*6000 = 2960, then / scale 32.
//                     expect: skyroomfog 92.5, a 0.16, bias 62.5
//                     A naive m*u implementation prints 250 / 62.5 instead, and
//                     draws fog 6.7x too thin.  This map is the whole reason the
//                     "exact mapping" claim had to be checked.
//
//   surf_beginner     no controller, no sky_camera.  Regression control: must be
//                     unfogged and the menu row must grey out.
//
// The skybox is the other thing to look at.  r_skyfog defaults to 0.5 and was
// set in no cfg, so before Patch 254's default.cfg line every one of these
// skyboxes would wash 50% toward the fog colour the moment fog switched on.
// Screenshots are taken with the sky in frame for exactly that reason.

log_enable 1
log_dir "logs"
log_name "fog01"
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 0
vid_fullscreen 0
con_notifytime 0
con_notifylines 0
con_notifytime_error 0
wait 200

echo ^5=========== surf_potatochip -- fog arrives at all ==================
vbsp_fog 1
map surf_potatochip
waitmap 1800
waitms 9000
echo ^3-- expect: 8000 (r:0.470588 g:0.611765 b:0.600000, a:1.000000 bias:2000)
fog
waitms 500
screenshot fog01_potatochip_on
waitms 700
vbsp_fog 0
waitms 1500
echo ^3-- expect: 0 (toggle off)
fog
waitms 500
screenshot fog01_potatochip_off
waitms 700
vbsp_fog 1
waitms 1500

echo ^5=========== bhop_angst -- master is fog_off, must START UNFOGGED ===
map bhop_angst
waitmap 1800
waitms 9000
echo ^3-- expect: 0.  three controllers, master fog_off.  NOT 1800.
fog
waitms 500
screenshot fog01_angst_spawn
waitms 700

echo ^5=========== surf_minimumwage -- only enabled ctrl is fog_underwater
map surf_minimumwage
waitmap 1800
waitms 9000
echo ^3-- expect: 0.  if this is 2707.5 the selection rule took first-enabled.
fog
waitms 500
screenshot fog01_minimumwage_spawn
waitms 700

echo ^5=========== surf_huecomundo -- sky only, m=0.16, THE min() CHECK ===
map surf_huecomundo
waitmap 1800
waitms 9000
echo ^3-- expect world fog: 0
fog
waitms 500
echo ^3-- expect sky: 92.5 (r:0.921569 g:0.917647 b:0.992157, a:0.160000 bias:62.5)
echo ^3-- a naive m*u implementation prints 250 here instead of 92.5
skyroomfog
waitms 500
screenshot fog01_huecomundo_on
waitms 700

echo ^5=========== surf_beginner -- no fog anywhere, regression control ===
map surf_beginner
waitmap 1800
waitms 9000
echo ^3-- expect: 0, and no "fog:" load line above
fog
waitms 500
skyroomfog
waitms 500
screenshot fog01_beginner
waitms 700

echo ^5=========== done ==================================================
log_enable 0
