// Patch 233/234 A/B, half one: every build before them.
//
// TWO SESSIONS, not two phases, and that is the point.  FTE keeps the loaded world
// model, so `map x` twice in a row is a no-op -- Mod_LoadVBSP does not run, the
// census is not reset, VBSP_GenerateMaterials does not run, and the second half of
// an in-session A/B silently reports the first half's numbers.  (p233b.cfg did
// exactly that.)  A fresh process per state also means every map here is a FIRST
// visit, so no counter is reading a shader that was already registered.
//
// Vantages are the centre of the largest $bottommaterial face in each map, read out
// of lumps 7/13/12/3/1, from below looking up and from above looking down:
//   surf_demise     largest of 7 faces:   (-464, 192, 32)
//   surf_aesthetic  largest of 325 faces: (9728, 11776, 48)

log_enable 1
log_name p233off
developer 1
cfg_save_auto 0
cl_idlefps 0
sv_cheats 1
fs_missingwarn 0
hl2_bottommaterial 0
hl2_skinfallback 0

wait 200
echo ^5=== p233off: surf_demise (expect 3 missing) ===
map surf_demise
waitmap 900
wait 180
hl2_missing
noclip
setpos -464 192 16 -88 0 0
wait 90
screenshot
waitms 600
setpos -464 192 64 88 0 0
wait 90
screenshot
waitms 600

echo ^5=== p233off: surf_aesthetic (expect 1 missing) ===
map surf_aesthetic
waitmap 900
wait 180
hl2_missing
noclip
setpos 9728 11776 32 -88 0 0
wait 90
screenshot
waitms 600
setpos 9728 11776 80 88 0 0
wait 90
screenshot
waitms 600

echo ^5=== p233off done ===
wait 30
quit
