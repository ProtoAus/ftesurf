echo ^5=== p394a leg b1 ===
say !b 1
waitms 1500
cmd viewpos
cmd stuck
waitms 300
echo ^5=== p394a leg b2 ===
say !b 2
waitms 1500
cmd viewpos
cmd stuck
waitms 300
echo ^5=== p394a leg b3 ===
say !b 3
waitms 1500
cmd viewpos
cmd stuck
waitms 300
echo ^5=== p394a leg b4 ===
say !b 4
waitms 1500
