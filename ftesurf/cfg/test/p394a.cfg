// P394A -- Patch 394: trigger_teleport_relative uses Source's rule (trigger centre +
// offset, velocity 0) and SV_ZoneDest does not floor-snap a destination inside a
// relative box.  surf_4am (Momentum maps dir, online zones), listen server.
// Run twice with +set log_name: NEW (the build) and CONTROL (+set sv_progs
// qwprogs394ctl = HEAD 4204a13's server progs).  Read the cmd output in order.
//
// PRE-REGISTERED (from BSP brush geometry, before running)
//  A NEW: after `!s N` + 1.5 s the body rests at, xy +-0.5 / z +-0.5:
//       s2 (3424,-4000) -4800   s3 (-13216,7744) 5600   s4 (-13152,12256) 5808
//       s5 (-14336,15328) -128  s6 (-14624,5216) 3456   s7 (400,14960) -6416
//       b6 (-1536,3176) 10920
//     with `stuck` startsolid 0 at each, and the "not snapped" dprint for exactly
//     s2-s7 and b6.
//  B NEW: s1, !m and b1-b5 land where CONTROL lands, within 0.1.
//  C NEW: on s2, `cmd timer` reads armed, and running after leaving the zone.
//    (Run 1 flew out under noclip and read "armed": noclip refuses the start, a
//    harness error.  Run 2 walks out +x from (3424,-4000); the zone ends at x 3776.)
//  D CONTROL: s2-s7 rest at z -4876/5524/5732/-200/3380/-6492 with startsolid 1,
//     and b6 at about (-224,3176,10536).  If not, this harness does not see the bug.
// FALSIFIED IF any of A-C fails on NEW, or D fails on CONTROL.
//
// RESULT (2026-09-20).  A, B, D HELD; C held on run 2.
//   A NEW rests at s2 (3424,-4000,-4800), s3 5600, s4 5808, s6 3456, s7 -6416, b6
//     (-1536,3176,10920), startsolid 0 on every leg.  s5 rests at -127.1, 0.9 above
//     the predicted -128 (free, standing; the brush-only prediction missed a surface).
//   B m, s1, b1-b5 identical in both arms.
//   C run 1 flew out under noclip and read "armed" (noclip refuses the start, a
//     harness error); run 2 walked out: armed, then running at (4385,-4459).
//   D CONTROL s2-s7 at z -4876/5524/5732/-200/3380/-6492, startsolid 1, and the
//     clock already running.  But CONTROL b6 landed right, (-1535.5,3175.6,10920.8):
//     the predicted SV_ZoneDest bug (the snap dropping !s out of a floating box)
//     does not happen, so that half of the change was dropped after run 1 (run 2
//     without it gives the same landings on every leg).
cfg_save_auto 0
log_enable 1
log_dir logs
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
sv_cheats 1
fs_missingwarn 0
set run_resume 0
sv_port 27681

wait 200
echo ^5=== p394a: surf_4am ===
map surf_4am
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 1000
cmd zone_dests
waitms 800

echo ^5=== p394a leg m ===
say !m
waitms 1500
cmd viewpos
cmd stuck
waitms 300
echo ^5=== p394a leg s1 ===
say !s 1
waitms 1500
cmd viewpos
cmd stuck
waitms 300
echo ^5=== p394a leg s2 ===
say !s 2
waitms 1500
cmd viewpos
cmd stuck
cmd timer
waitms 300
echo ^5=== p394a s2 walk out ===
+forward
waitms 3000
-forward
waitms 300
cmd viewpos
cmd timer
waitms 500
echo ^5=== p394a leg s3 ===
say !s 3
waitms 1500
cmd viewpos
cmd stuck
waitms 300
echo ^5=== p394a leg s4 ===
