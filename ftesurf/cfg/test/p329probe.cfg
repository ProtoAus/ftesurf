// P329 PROBE -- where is surf_tensor2's spawn, so the void vantage can be
// picked?  Prints viewpos (setpos-format origin) and run_eyeinfo (server floor
// trace), then quits.  Patch 329's two arms sit the camera thousands of units
// above the map, which needs numbers from the map itself.
log_enable 1
log_dir "logs"
log_name "p329probe"
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
vid_width 640
vid_height 480
con_notifytime 0
con_notifylines 0
developer 1
log_developer 1

wait 200
map surf_tensor2
waitmap 900
waitms 15000
sv_cheats 1
waitms 300

echo ^5=== P329 PROBE: spawn position ================================
cmd viewpos
waitms 300
cmd run_eyeinfo
waitms 300

// the fog line cl_fog.qc prints at load, to confirm the map is fogged
echo ^5=== P329 PROBE DONE =============================================
wait 60
quit
