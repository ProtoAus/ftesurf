// Patch 841: the editor's speed cap rides in the saved zone file, and the next load takes it
// from there. Run with tools/runlines_smoke.py --mount --put
// data/maps/settings/local/surf_dune.cfg=<settings file at cap 3500> (hosted game, private
// overlay); grade with tools/p841editor.py <rig>. surf_dune's shipped zone file says 4000.
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
vid_width 1280
vid_height 720
vid_fullscreen 0
con_savehistory 0
cl_download_zonesrc ""
fs_missingwarn 0
developer 1
log_developer 1
log_enable 1
log_dir logs
log_name runlines_smoke
set lobby_enable 0
set lobby_master ""
sv_public 0
waitms 1500
map surf_dune
waitmap 60
waitms 5000
menu_restart
ui_close
echo P841 LOAD1
sv_maxvelocity
zone_edit
waitms 400
zone_edit settings
waitms 200
zone_edit setting sv_gravity 790
zone_edit savesettings
waitms 200
zone_edit save
waitms 300
echo P841 UNTOUCHED
zone_edit settings
waitms 200
zone_edit setting sv_maxvelocity 6500
zone_edit savesettings
waitms 200
zone_edit save
waitms 500
echo P841 SAVED
zone_edit
waitms 300
map surf_dune
waitmap 60
waitms 5000
echo P841 LOAD2
sv_maxvelocity
movement
echo RUNLINES COMPLETE
quit
