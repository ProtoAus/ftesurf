// Private overlay (tools/runlines_smoke.py, on an engine with Patch 645).
// Patch 649: sixty-four board lines where there were eight.  Lines 1..8 are the slots
// they always were; 9..64 are new slots with a smaller sample store.  The camera rides
// a replay and the same run goes into every slot, so:
//   - eight lines, then sixty-four: `scores lines` must say 64 drawn and exactly eight
//     times the segments (every new slot draws what an old one does), and `lines
//     native` the same count of marks both times (only the first eight carry them);
//   - the viewer moved along the run (`replay seek`), half a second later: every one of
//     the sixty-four lines' cursors is with it again (`lines order`), though a line's
//     own look comes only every two seconds now;
//   - the replay playing: the cursors stay with it;
//   - one line alone in an old slot (5), then alone in new ones (40, 64): the same
//     picture, pixel for pixel, and the same counts (names off: lines 9 and up have
//     none, as they are not in the graph);
//   - a 65th is refused in words;
//   - on another map, eight lines ticked and a short walk off the start: the live
//     run's line is built several times, and none of the eight is repainted for it.
// tools/test_p649lines.py grades it.  r_speeds is on for the two crowd states only, to
// print what sixty-four cost; that number is not graded.
