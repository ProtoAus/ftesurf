// BUILD 86 / PATCH 343 -- the replay's own segment column.
//
//   ftesurf64.exe -WindowStyle Minimized +exec cfg/test/b86c.cfg
//
// THE BUG: rec_wt_sq* captured eight columns and never seq_eend (build 65) or
// seq_sub (build 66). Watch_SeqApply refilled only what it had, so every row of
// a replayed column drew its absolute and its Jump/Bhop word from whatever the
// BUILD PASS had left in the live ring -- the run's LAST row, repeated down
// every line. The numbers were plausible, which is why it survived two builds.
//
// THE FALSIFIER, and it needs no "before" picture to read: in a correct column
// the absolutes DIFFER row to row and track their own delta column. If every
// row shows the same `e` and the same word, the capture is still stale. Run
// this against a stash of the patch and the two shots are the A/B.
//
// bhop_eazy: a bhop map, so the sub-kinds actually vary (Jump then Bhop...),
// and data/runs/bhop_eazy/main/ holds a real pb recording to play.

cfg_save_auto 0
log_enable 1
log_dir logs
log_name b86c
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
vid_width 1280
vid_height 720
fs_missingwarn 0
developer 1
log_developer 1

// Forced: the archived ftesurf.cfg overrides default.cfg, and every one of
// these decides what the column prints.
set hud_scale          2
set hud_seq            1
set hud_seq_name       1
set hud_seq_abs        1
set hud_seq_delta      1
set hud_seq_time       1
set hud_seq_hopname    1
set hud_seq_units      1
set hud_seq_rows       10
set hud_energy_ref     1

wait 400
map bhop_eazy
waitmap 120
menu_restart
waitms 500
ui_close
waitms 800

echo ""
echo "^5=== b86c: open the leg's best recording ==="
replay pb
waitms 2500
replay status
waitms 400
echo ""

echo "^5=== let it play so the column accumulates rows ==="
waitms 6000
echo "^5--- shot 1: mid-run column ---"
screenshot b86c_1_midrun
waitms 800
echo ""

echo "^5=== further in: different rows, and they must carry DIFFERENT absolutes ==="
waitms 6000
echo "^5--- shot 2: later column ---"
screenshot b86c_2_later
waitms 800
replay status
waitms 400
echo ""

echo "^5=== stop: the player's own column must come back untouched ==="
echo "^5=== (Watch_SeqSave/Restore park eend+sub+eref since patch 342) ==="
replay stop
waitms 1200
screenshot b86c_3_afterstop
waitms 800
echo ""

echo "^5=== b86c done ==="
waitms 600
quit
