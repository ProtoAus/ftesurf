// P318PROBE -- the stop is gone, something now BOUNCES you.  Name it.
//
// Why mode 2 and not mode 4.  p317probe used pm_dispprobe 4 (hard stops only:
// fraction < 0.05 or startsolid) because a wedge IS a hard stop.  A bounce is
// not -- you get deflected at a perfectly healthy fraction, so mode 4 would
// filter out the very line I need.  Mode 2 is ungated and CHANGE-LATCHED: it
// prints once each time what you are touching changes, which is exactly the
// question "what deflected me".  It is chattier than 4 and much quieter than 3.
//
// WHAT I ALREADY KNOW, so you do not have to re-test it:
//   - Patch 318 cannot have invented a new phantom.  Every plane it adds is a
//     SUPPORTING plane of the brush hull, so the swept volume can only shrink
//     toward the true Minkowski sum, never past it.  Whatever bounces you is
//     real geometry you can now reach.
//   - On the line where you used to stop, the clip wedge (brush 170) is now
//     21.5 units clear of the ramp surface.  That wall really is gone.
//   - The ramp surface itself is smooth: a box dropped along your approach and
//     along the crease finds no lip over 0.3 units anywhere.
//   So the bounce is somewhere I could not guess, and the probe has to say.
//
// WHAT TO DO
//   1. Launch ftesurf64_p318.exe.  On map load you must see BOTH lines:
//        ".phy collision hulls re-wound ... 488 of 488"          (Patch 317)
//        "brush edge bevels generated ... 596 planes across 113" (Patch 318)
//      Both are MAPLATCH and models are cached, so a missing line means you
//      need a FRESH PROCESS, not a map reload.
//   2. exec test/p318probe
//   3. cmd sl_goto 11
//   4. Surf it the way you normally do, until it bounces you.  Do it two or
//      three times -- the latch means a repeat contact costs nothing.
//   5. quit, and send ftesurf/logs/p318probe.log
//
// READING IT -- the line on the tick you get kicked:
//   hit: BIH_BRUSH ... norm with z near 0      a wall.  Send the whole line; the
//                                              brush's contents field names it.
//   hit: BIH_TRIANGLE ... via plane 0 FACE     the ramp's own shape.  If the
//                                              normal swings hard between two
//                                              consecutive lines, that is a
//                                              facet seam -- Defect B, and the
//                                              convex-ledge rework is the fix.
//   via plane 1 BACK-SLAB(+4)                  the 4-unit slab standing proud.
//   via plane 2/3/4 (edge ...) / bevel #N      one triangle's edge plane or
//                                              bevel sticking out past the
//                                              surface.  Patch 258's family, on
//                                              the prop path.
//
// If you have time, the single most useful extra data point is a SECOND launch
// with the prop put back where it was before Patch 317:
//      hl2_phywinding 0        (leave hl2_brushbevels at 1)
// If the bounce disappears there, it is the 6.8 units Patch 317 moved you down,
// and the answer is about the prop hull.  If it survives, the prop height is
// not what is doing it.  Log that arm as p318probe_w0 -- there is a line for it
// at the bottom of this file, just uncomment it before you launch.

log_enable 1
log_dir "logs"
log_name "p318probe"
con_notifylines 4

pm_dispprobe 2

echo ^5=== probe armed, mode 2 (ungated, change-latched).
echo ^5=== current settings:
hl2_phywinding
hl2_brushbevels
hl2_propcollision
echo ^5=== now: cmd sl_goto 11, and surf it until it bounces you.
echo ^5=== log: ftesurf/logs/p318probe.log

// second arm -- uncomment BOTH lines, relaunch, and surf the same line
//hl2_phywinding 0
//log_name "p318probe_w0"
