cfg_save_auto 0

// ===========================================================================
//  P445HOP -- a hopped start stays tagged until the player asks for it back.
//    python tools/p443start.py --arm hop445
//  Stages save901 = p435rest.txt (the grounded at-rest row).  NO ZONES OVERRIDE, and
//  that is load-bearing -- see L.  The driver forces `+set sv_gamemode surf`.
//
//  WHAT PATCH 445 CHANGED.  Build 21 had three clears of run_t_hopped: SV_TimerArm,
//  the ground-dwell re-arm, and SV_TimerIdle.  Patch 445 replaced all three with
//  SV_TimerForgiveHop, whose callers are SV_ZoneMoveAt (the `!r`/`!m`/`!s`/`!b`
//  gesture), SV_TimerSpawn and SV_TimerMapInit -- and added `hopped` to the save
//  format so a `retry` cannot launder it.
//
//  THE DISCRIMINATOR IS A VELOCITY ZERO, and it is why this shape works where two
//  earlier attempts did not.  A clear is only worth anything to a cheater if the
//  prespeed the chain built survives it.  Every caller of SV_TimerForgiveHop zeroes
//  or abandons the velocity in the same breath (SV_ZoneMoveAt:903 `self.velocity =
//  '0 0 0'`, a respawn, a map change); SV_TimerArm does not, which is the bug.  The
//  round-4 census priced it: of 1316 shipped bsps, 21 have two abutting start
//  regions whose seam re-arms on every crossing and 66 have a velocity-keeping
//  trigger_teleport landing inside a start region.
//
//  AND THE GESTURE IS UNFORGEABLE BY MAP DATA, which is the other half.
//  SV_ZoneChatCommand is reached only from ClientCommand -- a client stringcmd --
//  and SV_IOCommand's allow-list is exactly say/echo/print run through localcmd() on
//  the SERVER console.  A map can make the server talk; it cannot press `!r`.
//
//  ARMS, in log order:
//   C   THE PREMISES, and the proof `hopped` is not a field that always reads 0: at
//       spawn the player is ARMED in the box on a fresh SV_TimerArm.  `start on leave`
//       and `starthop 1` prove the mode override took (a `start on jump` reading means
//       mode_bhop.cfg ran, run_starthop is 0, and this arm has NO VERDICT).
//       `rearmhop 0` is Patch 445's own premise: with the dwell forgiveness ON, the
//       0.25 s of ground between two hops could take the taint back and L/R/G would be
//       measuring the dwell instead of the patch.  IT READS 0 ON BOTH SIDES -- the
//       default moved in default.cfg, which is the same file both builds load -- so it
//       is a premise, not a discriminator.  The dwell path keeps its own arm in
//       cfg/test/b21a.cfg, whose two sections set the cvar before the map.
//   J   THE TAINT SETS.  +jump HELD for 1.4 s inside the box, read while still held.
//       Build 21's SET is unchanged by this patch, so both builds must read `hopped 1`
//       here -- and a control that reads 0 means the chain did not happen and every
//       reading below is void.  This is where the new `press !r to re-arm the start`
//       line appears.
//   L   SUBJECT 1 -- DOES AN ARM FORGIVE?  `sl_goto 1` loads the GROUNDED at-rest row
//       inside the start slab, which is the Patch 435 Build 47 gate's own subject: the
//       gate sets `run_t_azone = -1` so SV_TimerArm fires on the next tick and launders
//       the load's TF_SEGMENT|TF_PRACTICE.  That forced arm is the map-reachable clear
//       in person, driven here by a gesture instead of by a seam, and it is the reading
//       the patch exists for.  A LOAD DOES NOT RESTORE `hopped` (deliberately -- see
//       SV_SaveApplyState), so the live bit is the only thing that can be read, which
//       is what isolates this arm from R.
//       NO ZONES OVERRIDE FOR THE SAME REASON round 3's grace arm dropped one: the
//       override suppresses the very arm edge that decides whether the fix fires.
//   R   SUBJECT 2 -- DOES A RETRY LAUNDER?  `retry` re-initialises the progs, so
//       before Patch 445 run_t_hopped came back 0 from the QC default and the cheap
//       gesture was to chain BEFORE the retry: correctly marked, then forgiven by the
//       restart.  It also crosses BOTH lifecycle clears (SV_TimerMapInit's loop and
//       SV_TimerSpawn) and survives only because SV_RetryApply runs at the END of
//       PutClientInServer -- an ordering, so it is measured rather than asserted.
//       THE DRIVER ALSO READS THE STATE FILE `retry` WROTE and greps it for `hopped`,
//       which is the format half measured on the artefact rather than inferred from a
//       field: on the control the key is not written at all.
//   G   THE POSITIVE CONTROL, and it is the section that stops this patch from being
//       a permanent accusation.  `zone_reset` is `!r`'s console twin through the same
//       SV_ZoneChatCommand.  `hopped` must go back to 0 and SV_TimerForgiveHop must
//       print its own line naming the gesture.  Without G, a patch that deleted every
//       clear and left none would read identically at J/L/R and be broken for every
//       honest player -- which is exactly the failure this repo keeps re-finding.
//       It reads 0 on BOTH sides (the control's arm had already cleared it), so G is a
//       guard, not a discriminator, and the DPRINT is the part only one build prints.
//
//  PRE-REGISTERED PREDICTIONS.
//   C   both: `start on leave`, `"run_starthop" is "1"`, `timer: armed`, `startok 0`,
//       `hopped 0`, `rearmhop 0`.
//   J   both: `hopped 1`, `hopped start -- one jump out of the start` present, `armed`.
//       FIXED ONLY: `press !r to re-arm the start`.
//   L   FIXED `hopped 1` -- the forced arm did not forgive.  CONTROL `hopped 0`.
//       Both sides, and these are the PREMISES rather than the result: `support 1`
//       (SL_RowGrounded accepted the row, so the gate's fifth condition passed),
//       `jumps 0` (it read 2 at J, and the only writers of that zero are SV_TimerArm
//       and SV_TimerForgiveHop) and NO `hopped-start taint cleared by` line in this
//       section (which rules the second writer out).  Together: the arm ran, nothing
//       forgave, so `hopped` is a reading of what the arm did to the taint.
//
//       TWO OF MY PREDICTIONS WERE FALSIFIED GETTING HERE, both recorded because both
//       produced a green-looking section:
//        1  NO ZONES OVERRIDE.  Run 1 read `hopped 1` -- the prediction -- and measured
//       nothing.  The Build 47 gate needs `SV_ZoneStartAt(e, e.origin) >= 0` and the
//       placed body sits 0.00005 BELOW the shipped slab (Patch 415), so the gate never
//       fired and no arm ever happened.  The tell was `class segmented practice 1`: a
//       laundered load reads `clean`/`0`.  The override is staged now, and `jumps`
//       replaced the absence as the proof the arm ran.
//        2  `class segmented` AT L.  Run 2 predicted the taint would show in the class,
//       reasoning from SV_TimerStart's `run_t_dirty || run_t_hopped` chain.  It read
//       `clean`.  The chain is real; the inference was not -- it runs when the CLOCK
//       STARTS, and the report's `class:` is `FS_RunClass(e.run_t_flags)` alone.  A
//       hopped start is deliberately NOT a class (the field's own essay says so), so
//       while TS_ARMED it cannot appear there.  `class` and `practice` are reported
//       here and grade nothing.
//   R   FIXED `hopped 1` and `hopped 1` present in the written state.txt.
//       CONTROL `hopped 0` and NO `hopped` key in the file.
//       Both: `retry -- back where you were`, `armed`.
//   G   both: `hopped 0`.  FIXED ONLY: `hop: ... cleared by a reset gesture`.
//  FALSIFIED IF C reads `start on jump` or `starthop 0` (the override did not take:
//   NO VERDICT, as p435mode.cfg says of the same premise), or C reads `hopped 1`
//   (the field is not what this arm thinks it is), or C reads `rearmhop 1` (the dwell
//   forgiveness is live and L/R/G measure it rather than the patch), or J reads
//   `hopped 0` on EITHER side (the chain did not happen, so nothing below is a
//   measurement of a clear), or G reads `hopped 1` on the fixed side (the patch left
//   no way out and is worse than no patch).
//
//  RESULT 2026-09-27, both sides exit 0, qwprogs 76D668572F532173 fixed /
//  8E16FDF3946871C0 control (a worktree at 46afc22, HEAD before the patch).
//   C   both: `start on leave`, `starthop 1`, `armed`, `startok 0`, `hopped 0`,
//       `rearmhop 0`, ground 4.66, dwell 0.25.  The premises hold on both builds.
//   J   both: `hopped 1`, the `hopped start` line, `jumps 2`, `armed`, `ground 0.00
//       air 0.63` -- the autohop chain, groundsec never observed.  FIXED also prints
//       `press !r to re-arm the start`; the control has no such line.
//   L   both: `support 1` (the probe accepted the row), `jumps 0` (it was 2 one
//       section earlier, so SV_TimerArm RAN), no `taint cleared by` line (so the
//       other writer of that zero did not).  Then the patch:
//         CONTROL `hopped 0` -- the arm took the taint with the flags.
//         FIXED   `hopped 1` -- the same arm, the same gate, the taint stands.
//   W   FIXED `hopped 1` and the written state.txt carries `hopped 1` (save001).
//       CONTROL `hopped 0` and the key is ABSENT from the file -- the pre-445 writer
//       does not emit it at all, which is the laundering channel in its plainest form.
//   R   FIXED `hopped 1` across a map_restart, both lifecycle clears and the restore.
//       CONTROL `hopped 0`: `retry` laundered it by itself, exactly as BACKLOG said.
//   G   both `hopped 0`.  FIXED prints `hop: Proto's hopped-start taint cleared by a
//       reset gesture (!r/!m/!s/!b/zone_goto)` -- and it appears EXACTLY ONCE in the
//       whole log, which is the single strongest reading here: a run containing a
//       forced arm edge, a save load, a map_restart and 1.4 s of chaining cleared the
//       taint once, at the one gesture the player made.
log_enable 1
log_dir logs
log_name p445hop
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
sv_port 27701
sv_cheats 0
set run_resume 0
vid_fullscreen 0
waitms 5000
map bhop_eazy
waitmap 2400
waitms 3000
menu_restart
ui_close
waitms 1200

echo ==== C the fresh arm, and the three premises ====
run_starthop
waitms 300
cmd timer
waitms 800

echo ==== J the chain: +jump HELD in the box, read while still held ====
+jump
waitms 1400
cmd timer
waitms 700
-jump
waitms 400

echo ==== L SUBJECT 1: load the grounded at-rest row, forcing the Build 47 arm edge ====
cmd sl_goto 1
waitms 1400
cmd timer
waitms 1000

echo ==== W the WRITER, on a file that outlives the process ====
// `retry` CONSUMES its own point (SV_RetryApply removes the file it read), so the R
// section below cannot be graded on the artefact -- measured: run 1's check looked for
// save000/state.txt and found only seq.txt beside it.  An ordinary save while the taint
// is up leaves a state.txt the driver can grep for `hopped 1`.  AFTER L on purpose: an
// extra slot before it would renumber the rows `sl_goto` counts in.
cmd sl_save
waitms 1200
cmd timer
waitms 800

echo ==== R SUBJECT 2: retry, which used to launder the taint by itself ====
retry
waitmap 2400
waitms 3000
cmd timer
waitms 1000

echo ==== G POSITIVE CONTROL: zone_reset, the one gesture that may forgive ====
cmd zone_reset
waitms 1200
cmd timer
waitms 1000

quit
