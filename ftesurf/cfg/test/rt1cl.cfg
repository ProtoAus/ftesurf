// RT1CL -- client half of rt1sv.cfg.  Three finishes on one lobby:
//   C  clean: walk from the start to the finish.            (the control)
//   L  walk, sl_save, walk on, sl_load, walk to the finish.
//   R  walk, rec_retry (a map_restart; alone on the lobby), walk to the finish.
// PREDICTIONS (from reading SV_RecRewind, not measured before): C submits with a
//   replay (rec path, recbytes > 0), v9, reccheck ok.  L: the stream is not
//   rewound -- the file keeps the abandoned stretch past the save plus a `resume`
//   record, and the run submits segmented (TF_SEGMENT) with that file.  R: the
//   map_restart closes the stream; the run submits segmented with NO replay.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name rt1cl
developer 1
cl_idlefps 0
cl_maxfps 100
rate  2000000
drate 5000000
vid_fullscreen 0
waitms 6000
connect 127.0.0.1:27631
waitms 12000
set rec_terms 1
echo ^5==== C: clean ====
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 6500
-forward
waitms 2500
cmd timer
echo ^5==== L: save, walk, load, finish ====
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 1500
cmd sl_save
waitms 1000
-forward
waitms 300
cmd sl_load
waitms 500
+forward
waitms 5000
-forward
waitms 2500
cmd timer
echo ^5==== R: retry, finish ====
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 1500
-forward
waitms 300
cmd rec_retry
waitms 8000
+forward
waitms 5000
-forward
waitms 2500
cmd timer
echo ^5==== done ====
waitms 1000
quit

