// FTESurf Patch 196, run B -- the control that decides whose bug this is.
//
// P196A reproduced the exit crash and the symbolicated stack says it is not in the
// material teardown at all:
//
//   Host_Frame -> Cbuf_Execute -> Cmd_ExecuteString("quit") -> Sys_Quit
//     -> Host_Shutdown -> Plug_Shutdown -> Plug_Close
//       -> (FS_UnRegisterFileSystemModule) -> Cmd_ExecuteString -> FS_ReloadPackFiles_f
//         -> FS_ReloadPackFilesFlags -> FS_AddPathHandle -> VFSW32_BuildHash
//           -> Sys_EnumerateFiles (x3, one per directory level)
//             -> VFSW32_RebuildFSHash -> FS_AddFileHashUnsafe
//               -> Hash_GetInsensitiveBucket   <-- 0xC0000005
//
// and the faulting instruction is `mov 0x8(%rbx),%rdx` at Hash_GetInsensitiveBucket+0x25,
// i.e. reading ->key.string off a chain head that came straight out of
// filesystemhash.bucket[] and is a freed pointer.  That is the Patch 27 dangling-bucket
// signature, and the comment at fs.c:6026 already describes this exact crash.
//
// If that reading is right, NOTHING about the asset cache is required.  All it takes is
// an SPF_ADDON *directory* searchpath that actually contains files, because
// FS_AddPathHandle:4596 is the only place in a reload that writes into the hash
// incrementally, and it is reached before the FS_FlushFSHashReally at fs.c:6032.
// <gamedir>_downloads (fs.c:5772) is such a path and is mounted ONE LINE EARLIER than
// the cache -- it has simply always been empty on this machine.
//
// So: fs_assetcache 0 (P186 completely inert -- the mount is gated off, which is P186's
// own "clean" control arm, and ftesurf_cache is left populated to make that explicit),
// 64 files planted in ftesurf_downloads/p196probe/, one map, quit.
//
// PREDICTION, written before the run: this crashes exactly like P196A, with the same
// faulting address, and the frame that was VFSW32_BuildHash for ftesurf_cache is now
// VFSW32_BuildHash for ftesurf_downloads.  If it does, the crash is a pre-existing engine
// bug that P186 merely became the first code in this tree to trip, and P186's rework does
// not have to carry it.
//
// The probe names exist nowhere else in the game and _downloads is mounted at the TAIL,
// so nothing can be shadowed by them either way.

cfg_save_auto 0
log_name p196b
developer 0
fs_assetcache 0
fs_loadstats 1
waitms 4000

echo "=== P196B: fs_assetcache OFF, ftesurf_downloads populated ==="
fs_cache_info
map surf_utopia
waitmap 180
waitms 10000
echo "=== P196B: quitting ==="
waitms 2000
quit
