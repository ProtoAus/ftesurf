cfg_save_auto 0
con_savehistory 0
// FTESurf Patch 819: the lobby map clock.  Run with tools/runlines_smoke.py --dedicated
// --map surf_dune and server args "+set lobby_cycle 3600 +set lobby_maps 'surf_dune
// surf_kitsune'" (lobby_extend_time is the progs default, 3600).  The server log grades:
//   join 1: no reset line (the map's clock is already whole, within 60 s)
//   !extend: "extended -- 60 more minutes", then `timeleft` near 1:59:xx
//   join 2 (after a disconnect): "... -- 1:00:00 on surf_dune (was 1:5x:xx, 1 extension(s))",
//   then `timeleft` near 59:xx -- the clock came DOWN, so the reset acted.
developer 1
log_developer 1
log_enable 1
log_dir logs
log_name runlines_smoke
con_notifytime 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
vid_width 1280
vid_height 720
waitms 2000
map surf_dune
waitmap 90
waitms 8000
echo P819 PHASE A first join
cmd timeleft
waitms 1500
cmd vote
waitms 1500
echo P819 PHASE B extend
cmd extend
waitms 3000
cmd timeleft
waitms 1500
cmd vote
waitms 1500
echo P819 PHASE C leave, the lobby is empty, join again
disconnect
waitms 6000
connect 127.0.0.1:27619
waitmap 90
waitms 8000
cmd timeleft
waitms 1500
cmd vote
waitms 1500
echo RUNLINES COMPLETE
quit
