// E5 site probe -- WHERE IS THE PLAYER ACTUALLY STANDING?
//
// The surf_fantasy capture arm read `timer: armed` for its whole length and
// logged no cash-out, which has three possible causes that look identical from
// the outside: setpos refused, setpos landed somewhere the player cannot walk
// from, or +forward is walking the wrong way.  A timer report cannot tell them
// apart because it does not carry a position.
//
// So this prints one.  `viewpos` after every step, and nothing else happens.
//
// Reference geometry, from the BSP and the zone file:
//   start box    x -9600..-8832   y -14440..-14080   z 6144..6400
//   push volume  x -9180..-9140   y -14856..-14816   z 6136..6224
//   walk         yaw 270 = -Y, from y -14150 out through the -14440 edge,
//                then a further 376 u to the pad.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name e5probe
developer 0

sv_cheats 0
set run_bv_debug 1

waitms 6000
map surf_fantasy
waitmap 60
waitms 4000

echo ======== PROBE 1: where does the map spawn me
viewpos
waitms 500
cmd timer
waitms 500

echo ======== PROBE 2: after zone_goto 0
cmd zone_goto 0
waitms 1500
viewpos
waitms 500

echo ======== PROBE 3: after setpos into the start box
setpos -9160 -14150 6180 0 270 0
waitms 1500
viewpos
waitms 500
cmd timer
waitms 500

echo ======== PROBE 4: after 1.5s of +forward
+forward
waitms 1500
viewpos
waitms 500

echo ======== PROBE 5: after another 1.5s
waitms 1500
viewpos
waitms 500
cmd timer
waitms 500

echo ======== PROBE 6: after another 2s
waitms 2000
viewpos
-forward
waitms 500
cmd timer
waitms 500

echo ======== PROBE done
waitms 500
quit
