// V268W -- Patch 268b: "windowed" has to fit on the desktop.
//
// THE REPORT.  "fullscreen_toggle causes the window to go windowed but it's at full
// res, so it looks like borderless fullscreen, so it's borderless to borderless."
//
// THE CAUSE.  ftesurf.cfg archives vid_width 1920 / vid_height 1200, and 268's first
// vid_winmaximize rule was "maximize only when NO explicit size was asked for" -- so
// an explicit 1920x1200 was honoured exactly, AdjustWindowRectEx grew it to 1936x1239
// for the border and caption, and centerrect put that at (-8,-19) on a 1920x1200
// desktop.  Title bar off the top, taskbar covered, client area full res.  Indis-
// tinguishable from borderless, which is exactly what was reported.
//
// mode 1 now means "honour the requested size only if the DECORATED window fits the
// work area".  W3 is what stops that from being a disguised 'always maximize'.
//
// INSTRUMENT: screenshot dimensions.  The log line is NOT usable here -- "Setting
// windowed mode 1920*1200" prints the REQUESTED size and says the same thing whether
// the window then maximized or not.  Only the captured frame knows.
//
//   maximized on this desktop  -> 1920 x <work area minus caption>   (~1920x1111)
//   exact                      -> exactly what vid_width/vid_height asked for
//
// W1  1920x1200 asked for, vid_winmaximize 1 -> MUST NOT be 1920x1200 (maximized)
// W2  FALSIFIER: same, vid_winmaximize 0     -> MUST be exactly 1920x1200 (upstream)
// W3  CONTROL:   1280x800, vid_winmaximize 1 -> MUST be exactly 1280x800 (it fits, so
//                it is honoured; without this W1 could just be "always maximize")
// W4  THE REPORTED CASE: borderless, then fullscreen_toggle, at 1920x1200 archived
//                -> MUST NOT be 1920x1200.  This is the one the user pressed.

log_enable 1
log_dir "logs"
log_name "v268w"
developer 1
log_developer 1
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 0
con_notifytime 0
con_notifylines 0
con_notifytime_error 0

wait 200
echo ^5=== v268w: windowed must fit the desktop ===

vid_fullscreen_order 1
vid_exclusive_desktopres 1

echo ^5----- W1: 1920x1200 requested, winmaximize 1 -> expect MAXIMIZED -----
vid_winmaximize 1
vid_width 1920
vid_height 1200
vid_fullscreen 0
vid_restart
waitms 6000
screenshot v268w_x
waitms 900
screenshot v268w_1_oversize_maximizes
waitms 1200

echo ^5----- W2: FALSIFIER winmaximize 0 -> expect EXACTLY 1920x1200 -----
vid_winmaximize 0
vid_restart
waitms 6000
screenshot v268w_x
waitms 900
screenshot v268w_2_falsifier_exact
waitms 1200

echo ^5----- W3: CONTROL 1280x800 fits, winmaximize 1 -> expect EXACTLY 1280x800 -----
vid_winmaximize 1
vid_width 1280
vid_height 800
vid_restart
waitms 6000
screenshot v268w_x
waitms 900
screenshot v268w_3_control_fits_exact
waitms 1200

echo ^5----- W4: the reported case -- borderless, then fullscreen_toggle -----
vid_width 1920
vid_height 1200
vid_fullscreen 1
vid_restart
waitms 6000
fullscreen_toggle
waitms 6000
screenshot v268w_x
waitms 900
screenshot v268w_4_toggled_back_windowed
waitms 1200

echo ^5=== v268w done ===
wait 30
quit
