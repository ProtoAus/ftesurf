// cfg_save_auto 0: this run sets archived cvars; never let it write them into ftesurf.cfg
cfg_save_auto 0
// p648motes -- func_dustmotes as Source draws them (Patch 648).  tools/p648motes.py grades it.
// surf_dune, in the room its two mote volumes fill (15-40, life 1-3, DistMax 1024), bloom off,
// fov 90 so that a mote of size S is S / 10000 * (height / 1.5) pixels from centre to edge.
//   V  the volumes as the map has them: emit_list "Source's motes, 3 looks asked, 3 answering".
//      Its two shots, and O's, are for eyes; nothing grades them.
//   M  THE RULER.  The volumes are switched off and left to empty, the wall is photographed
//      bare (m0), and emit_mote stands rows of motes in front of it at depths that are known.
//      Most are BLACK: a black mote only darkens, so the shot over the bare wall gives its
//      coverage exactly.  Rows are 0.17, 0.10 and 0.04 of the depth above the line of sight; a
//      row of 4 sits 0.15 of it left or right.  Life 8 s, DistMax 1000 unless said.
//        0.17   left  A  black, size 100, depth 150      right W  WHITE at Alpha 26, the same
//        0.10   left  B  A's look at depth 330         right S  ONE black mote of size 300
//        0.04   left  C  black, size 20                  right D  colour 0 128 255
//      Each row is said twice: a look made by a call is not there for that call's particles.
//      Shot m1 is 1.333 s into the life (a sixth: the sine is at a quarter), m2 at 4 s (full).
//   N  THE SECOND SET, once the first is past its life (n0, bare again: nothing may be left).
//        0.17         E  black, sizes 50 to 150 (9)
//        0.10         G  black, size 100, lives 4 to 12 s (9)
//        0.04   left  F  black, size 100, Frozen         right X  depth 330 with DistMax 300
//      Shots n1 and n2 at the same two ages.
//   P  SOURCE'S POOL.  surf_psychedelia stacks three volumes of SpawnRate 4000, life 9-15, on
//      one box: at vbsp_emit_ratemax 200 each that is 7,200 alive, and Source holds 2,048 for
//      the whole world.  18 s in (past the longest life) the ENGINE's count is read, r_partinfo.
//   R  vid_restart takes the shader and every block (and 8 s of the 10 waited): they must
//      answer again, and T, 4 s on, must hold more motes than R did.
//   O  vbsp_emit_motes 0, the control: "orbs, because vbsp_emit_motes is 0", and the old look
log_dir "logs"
log_name "p648motes"
log_enable 1
developer 1
log_developer 1
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000
cl_maxfps 100
cl_idlefps 0
sv_cheats 1
r_bloom 0
con_notifylines 0
scr_sshot_type png
fov 90
wait 200
map surf_dune
waitmap 600
waitms 2000
menu_restart
ui_close
set hud_speed 0
set hud_energy 0
set hud_keys 0
noclip
setpos 11720 10376 13112 0 90 0
waitms 6000
echo ^5=== V volumes
fov
emit_list
r_partinfo
waitms 500
screenshot p648motes_v1
waitms 2500
screenshot p648motes_v2
waitms 500
echo ^5=== M ruler
set vbsp_emit_dust 0
waitms 4500
r_partinfo
screenshot p648motes_m0
waitms 800
emit_mote 150 0.17 4 0 0 0 255 100 100 8 8 1000 0 -0.15
emit_mote 150 0.17 4 255 255 255 26 100 100 8 8 1000 0 0.15
emit_mote 150 0.04 4 0 0 0 255 20 20 8 8 1000 0 -0.15
emit_mote 150 0.04 4 0 128 255 255 100 100 8 8 1000 0 0.15
emit_mote 150 0.10 1 0 0 0 255 300 300 8 8 1000 0 0.15
waitms 300
emit_mote 150 0.17 4 0 0 0 255 100 100 8 8 1000 0 -0.15
emit_mote 150 0.17 4 255 255 255 26 100 100 8 8 1000 0 0.15
emit_mote 330 0.10 4 0 0 0 255 100 100 8 8 1000 0 -0.15
emit_mote 150 0.10 1 0 0 0 255 300 300 8 8 1000 0 0.15
emit_mote 150 0.04 4 0 0 0 255 20 20 8 8 1000 0 -0.15
emit_mote 150 0.04 4 0 128 255 255 100 100 8 8 1000 0 0.15
waitms 1333
screenshot p648motes_m1
waitms 2667
screenshot p648motes_m2
waitms 500
echo ^5=== N second set
waitms 4500
screenshot p648motes_n0
waitms 800
emit_mote 150 0.17 9 0 0 0 255 50 150 8 8 1000 0
emit_mote 150 0.10 9 0 0 0 255 100 100 4 12 1000 0
emit_mote 150 0.04 4 0 0 0 255 100 100 12 12 1000 1 -0.15
emit_mote 330 0.04 4 0 0 0 255 100 100 8 8 300 0 0.15
waitms 300
emit_mote 150 0.17 9 0 0 0 255 50 150 8 8 1000 0
emit_mote 150 0.10 9 0 0 0 255 100 100 4 12 1000 0
emit_mote 150 0.04 4 0 0 0 255 100 100 12 12 1000 1 -0.15
emit_mote 330 0.04 4 0 0 0 255 100 100 8 8 300 0 0.15
waitms 1333
screenshot p648motes_n1
waitms 2667
screenshot p648motes_n2
waitms 800
set vbsp_emit_dust 1
echo ^5=== P pool
map surf_psychedelia
waitmap 600
waitms 2000
menu_restart
ui_close
set hud_speed 0
set hud_energy 0
set hud_keys 0
noclip
setpos 2928 0 -976 0 0 0
waitms 18000
emit_list
r_partinfo
waitms 500
screenshot p648motes_p1
waitms 800
echo ^5=== R restart
vid_restart
waitms 10000
emit_list
r_partinfo
echo ^5=== T refill
waitms 4000
r_partinfo
waitms 500
echo ^5=== O orbs
set vbsp_emit_motes 0
map surf_dune
waitmap 600
waitms 2000
menu_restart
ui_close
set hud_speed 0
set hud_energy 0
set hud_keys 0
noclip
setpos 11720 10376 13112 0 90 0
waitms 6000
emit_list
r_partinfo
emit_mote 150 0.17 9 0 0 0 255 100 100 8 8 1000 0
waitms 500
screenshot p648motes_o1
waitms 800
echo RIGDONE
quit
