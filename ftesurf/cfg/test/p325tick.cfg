// Engine Patch 325 -- the run clock, counted rather than sampled.  ARM 1 of 2.
//
// WHAT THIS MEASURES.  The mover has always run a whole number of fixed ticks
// per usercmd and thrown the count away (`iters`, a local in PMSrc_PlayerMove).
// Patch 325 publishes it.  This arm proves the published number is the number
// the mover actually ran -- offline, with no client, no run and no leaderboard,
// so a failure here is arithmetic and nothing else.
//
// WHY AN OFFLINE ARM AT ALL, when the point of the patch is a live run: because
// the live reading cannot distinguish a correct patch from a wrong one.  At the
// shipped config -- pm_ticrate 0.015 with Patch 252 snapping the client's
// usercmd interval to exactly one tick -- "count the ticks" and "count the
// commands" give the SAME answer on every command of every run.  A patch that
// simply did `count++` once per call would look perfect in game.  So the
// discriminator has to be a config the live game never runs, which is what
// pm_dettest's `tickcensus` block is for:
//
//   ticrate 0.015, msec 15 -> 1,1,1,...       total 90   (the live case)
//   ticrate 0.010, msec 15 -> 1,2,1,2,...     total 135  (TWO ticks in one
//                                                         command -- only a real
//                                                         tick count does this)
//   ticrate 0.015, msec 10 -> 0,1,1,0,1,1,... total 60   (a command that runs NO
//                                                         ticks; the carry case,
//                                                         and the exact shape the
//                                                         Patch 252 essay
//                                                         measured as a 33 Hz
//                                                         stall on surf_rise)
//
// PREDICTION, registered before the arm was run:
//
//   tickcensus  all three arms `ok`.  If arm 2 reads 90 instead of 135, the
//               patch is counting COMMANDS and the whole change is void.  If
//               arm 3 reads 90 instead of 60, the zero-tick command is being
//               counted as one, which would make every stored time too long by
//               the number of dropped-carry commands in it.
//   ticks n/n   the main mover loop drives 2048 commands of msec 15 at the
//               now-pinned ticrate 0.015, so the total MUST be exactly 2048.
//               Any other value is an off-by-one in the accumulate.
//   mover       MUST be unchanged from Patch 322/323's recorded readings.  This
//               patch adds an output field and pins a movevar that was already
//               0.015 on a surf server; it must not have moved the physics.
//               This is the control, and it is the one that fails if the new
//               field has disturbed the mover it is measuring.
//   mapcrc      MUST match the other arm.  Same map, same bytes.
//
// THAT PREDICTION FAILED ON `mover`, AND THE FAILURE WAS THE INSTRUMENT RATHER
// THAN THE PATCH.  Measured 3d136f8de25c9c2c against the recorded
// b4d8e3a39a1fcdb8.  The cause: `bhop_eazy`'s NAME PREFIX puts the server in
// bhop mode, which sets pm_ticrate 0.010 -- and pm_dettest never pinned ticrate,
// so every reading recorded against patches 322, 323 and 324 was taken at 0.010
// while reading as if it were the shipped 0.015.  Confirmed directly rather than
// argued: pinning the harness to 0.010 reproduces b4d8e3a39a1fcdb8 EXACTLY, and
// the tick total goes 2048 -> 3072, which is the 1.5x a 15ms command must give
// at a 10ms tick.
//
// Those cross-build results still stand -- both architectures ran this same map
// and therefore the same rate, which is all that comparison needed.  What was
// wrong is that the number depended on something nothing printed, so an arm on a
// surf map would have differed from identical source and read as a determinism
// failure.  Both values are now recorded at PMDET_TICRATE in sv_ccmds.c and the
// rate is printed in the header line.  From here the expected reading on this
// map is:
//
//   mover  3d136f8de25c9c2c   (ticrate 0.015, pinned)
//
// A HARNESS HOLE THIS ARM ALSO CLOSES, and it predates the patch: pm_dettest
// pinned ten movevars and NOT ticrate -- the one variable the whole command is a
// function of, since the mover divides the command's msec by it.  So `mover` was
// only comparable between two machines that happened to share a pm_ticrate, and
// nothing printed it.  A box that had loaded cfg/mode_bhop.cfg (0.010) would have
// produced a different `mover` from identical source and read as a determinism
// failure.  Now pinned; on a surf server it was already 0.015, which is where the
// 322/323 readings were taken, so those hashes must NOT move.
//
// FALSIFIED IF: any tickcensus arm prints FAIL; or `ticks` is not 2048/2048; or
//          `mover` differs from the Patch 323 reading for this map on this
//          architecture (that would mean the patch changed the physics, not just
//          observed it).
cfg_save_auto 0
log_enable 1
log_dir logs
developer 0

waitms 5000

map bhop_eazy
waitmap 60
waitms 4000

echo ================================ P325 tick count -- offline arm
pm_dettest
waitms 4000

echo ================================ P325 done
waitms 500
quit
