// FTESurf Patch 776, review fix B1 -- a pinned card keeps only ITS entity's ent_info reply.
// Run like p776ev.cfg (tools/runlines_smoke.py --mount, the build's csprogs), once with the
// pre-fix csprogs as the control.  Each case pins B in the same frame as a manual request
// for something else, so B's own request falls inside SV_EntInfo's 0.25 s cooldown and is
// dropped, and the other reply arrives inside B's 3 s capture window.  Mouse2 then copies B.
//   1  B = trigger_multiple *109 (b56b step 0b), other = trigger_teleport *36: CLASS differs.
//      Control: "copied [enthere] class=trigger_multiple model=*109 ... and the server's
//      answer" (*36's lines under *109).  Subject: no "server's answer".
//   2  B again, other = the trigger_multiple whose origin is nearest 0 0 0 (not *109):
//      same class, and the server strips both models to '-', so only the targetname
//      line tells them apart.  Control: the server's answer; subject: none.
//   3  B pinned on its own, 0.5 s clear of any request: both builds catch B's own reply
//      ("and the server's answer").  The first fix (model '-' read as a mismatch)
//      failed this case, which is how its stripped-model hole was found.
cfg_save_auto 0
exec cfg/test/_quiet.cfg
log_enable 1
log_dir "logs"
log_name "runlines_smoke"   // tools/runlines_smoke.py reads this log
scr_sshot_type png
cl_yieldcpu 0
cl_idlefps 0
cl_maxfps 100
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0

waitms 2500
map surf_tensor2
waitmap 240
waitms 8000
sv_cheats 1
noclip
waitms 500
ent_view
setpos -11200 10560 160 90 0 0
waitms 2500

echo "@@@ P776B 1. class differs"
cmd ent_info trigger_teleport -11776 -10816 13744; vote key 512 1; vote key 512 0
waitms 1500
vote key 513 1
vote key 513 0
waitms 500
vote key 512 1
vote key 512 0
waitms 1000

echo "@@@ P776B 2. same class, model differs"
cmd ent_info trigger_multiple 0 0 0; vote key 512 1; vote key 512 0
waitms 1500
vote key 513 1
vote key 513 0
waitms 500
vote key 512 1
vote key 512 0
waitms 1000

echo "@@@ P776B 3. its own reply"
vote key 512 1
vote key 512 0
waitms 1500
vote key 513 1
vote key 513 0
waitms 500

echo "@@@ P776B DONE"
echo RUNLINES COMPLETE
waitms 1000
quit
