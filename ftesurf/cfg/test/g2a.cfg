// Patch 208 verification, part A -- the visuals on surf_kitsune.
//
// Split from the cost/stress half so a failure cannot lose both.  Settling uses
// waitms (wall time) not wait (client FRAMES), because a frame-counted settle is
// meaningless if anything drags the framerate down -- which is exactly what lost
// the first attempt at this run.
//
// No noclip: Patch 207's predraw refuses apertures under MOVETYPE_NOCLIP.

cfg_save_auto 0
developer 1
log_developer 1
scr_sshot_type png
cl_yieldcpu 0
cl_maxfps 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0
r_speeds 0
r_portalrecursion 2
r_portalmaxviews 2
r_portaldebug 0
vbsp_portal_render 1
r_portalscissor 1

waitms 2500
map surf_kitsune
waitmap 180
waitms 4000
sv_cheats 1
developer 0
clear
waitms 500

// -------------------------------------------------------------- A1 exit side
echo "### A1 exit side"
setpos 0 -765 133 0 90 0
waitms 2500
cmd viewpos
waitms 500
r_portalscissor 0
waitms 700
screenshot_mega g2A1_scissor0 1280 720
waitms 500
r_portalscissor 1
waitms 700
screenshot_mega g2A1_scissor1 1280 720
waitms 500
vbsp_portal_render 0
waitms 700
screenshot_mega g2A1_portalsoff 1280 720
waitms 500
vbsp_portal_render 1
waitms 500

// -------------------------------------------------------------- A2 entry side
// This is where the refusal reporter used to flood.  If the log for this section
// is short, Patch 208's fix to PM_PortalCSGReport is working.
echo "### A2 entry side"
setpos -15360 -15250 880 0 -90 0
waitms 2500
cmd viewpos
waitms 500
r_portalscissor 0
waitms 700
screenshot_mega g2A2_scissor0 1280 720
waitms 500
r_portalscissor 1
waitms 700
screenshot_mega g2A2_scissor1 1280 720
waitms 500
vbsp_portal_render 0
waitms 700
screenshot_mega g2A2_portalsoff 1280 720
waitms 500
vbsp_portal_render 1
waitms 500

// -------------------------------------------------------------- B behind it
// Facing away from the doorway.  The wall must be solid -- no square of the
// previous frame, which is the Patch 206 regression this must not reintroduce.
echo "### B behind the door"
setpos 0 -765 133 0 -90 0
waitms 2500
screenshot_mega g2B_behind 1280 720
waitms 500

// -------------------------------------------------------------- C nested
// r_portalrecursion 3 is the only way the nested-intersection branch in
// GLR_DrawPortal is ever executed; at the shipped default of 2 it never runs.
echo "### C two portals deep, recursion 3"
r_portalrecursion 3
setpos 0 -765 133 0 90 0
waitms 2500
r_portalscissor 1
waitms 900
screenshot_mega g2C_deep_scissor1 1280 720
waitms 500
r_portalscissor 0
waitms 900
screenshot_mega g2C_deep_scissor0 1280 720
waitms 500
r_portalscissor 1
r_portalrecursion 2
waitms 500

// -------------------------------------------------------------- D crossing
// The Patch 206 acceptance band, re-run as a regression: 208 touched the
// renderer only and must not have moved it.  Slots 1..6 are feet z
// 820/840/860/880/900/920 at 1200 u/s.  820 and 920 refuse; 840..900 cross.
echo "### D crossing band"
developer 1
cmd sl_goto 1
waitms 700
cmd viewpos
waitms 400
cmd sl_goto 2
waitms 700
cmd viewpos
waitms 400
cmd sl_goto 3
waitms 700
cmd viewpos
waitms 400
cmd sl_goto 4
waitms 700
cmd viewpos
waitms 400
cmd sl_goto 5
waitms 700
cmd viewpos
waitms 400
cmd sl_goto 6
waitms 700
cmd viewpos
waitms 400

echo "### A2 DONE"
waitms 800
quit
