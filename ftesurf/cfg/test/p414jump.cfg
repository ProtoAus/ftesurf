// PROBE_B4JUMP2 -- v1 never reached the recess, so place the body in it exactly.
//   ftesurf64.exe -WindowStyle Minimized +exec cfg/test/p414jump.cfg
//   (cwd MUST be C:\FTESurf)
//
// v1's arm C hopped between x -16140 and -15968 and never entered the pad's
// footprint (x -15760..-15632, y 12352..12480); arm D crossed it but only two
// viewpos samples covered 530 units of travel, so "no basevel line" said nothing.
// A blind walk is not a placement.  This one places.
//
// setpos FORCES MOVETYPE_NOCLIP server-side, and a noclipping body is not what
// FL_ONGROUND / run_wasground describe -- so setpos ALONE cannot test a jump.
// `cmd noclip` TWICE lands back in WALK (each one is processed twice: the engine
// flips to WALK, then the mod's QC handler flips back, so the PRINTED state lies).
// The z-drop in the viewpos samples is the proof, not the console.
//
// SUBJECT: trigger_multiple 1216059, model *744, AABB (-15760,12352,-32) ..
// (-15632,12480,-30), OnJump -> AddOutput basevelocity 2000 0 0.  Centre of the
// footprint is (-15696, 12416); the slab is the bottom two units.
//
// PRE-REGISTERED
//  P1 PLACEMENT.  After setpos + noclip x2 the viewpos z must DROP and settle.
//     No drop => still NOCLIP and every jump arm below is void.
//  P2 THE JUMP HAPPENED.  `jump z: moving player up 1.5000` in the log, or a
//     viewpos z that rises between samples.
//  P3 `basevel: OnJump from *744 vz <n>` -- the dprint inside SV_TriggerIOTouch.
//     THIS IS THE MEASUREMENT.
//  P4 `basevel: paid #N [AddOutput M]` and a viewpos x jumping by hundreds.
// PREDICTED: P1 yes, P2 yes, P3 NEVER, P4 never -- because the touch loop runs at
// the command's END position and one tick of jump rise (4.53 u) already clears a
// 2 u slab, while every command before that still has FL_ONGROUND set.
// FALSIFIED IF P3 fires: the dispatch theory is wrong, look downstream.
// INCONCLUSIVE IF P1 or P2 fails.
//
// CONTROL, and it is the arm that makes the absence mean anything: arm E stands
// in the SAME place and jumps with the body left in NOCLIP.  If P3 is silent in
// both, the silence may just be this harness never producing a jump the server
// believes; if it is silent only where it should be, the reading is real.
//
// RESULT 2026-09-20, stock build (qwprogs at HEAD).  EVERY PREDICTION HELD.
//   P1 placed:  setpos z -16 -> noclip x2 -> viewpos settled -31.2 then -32.0.
//               The floor is at -32 and the slab is -32..-30, so the body's feet
//               are INSIDE it.  The z-drop proves WALK; the console said the
//               opposite ("noclip ON" then "noclip OFF"), as documented.
//   P2 jumped:  14 `jump z: moving player up 1.5000 (-31.9688 => -30.4688)`
//               lines across arms B/C/D, and viewpos z rose to +26.5 after the
//               first one.  Real jumps, from inside the slab.
//   P3 SILENT:  not one `basevel: OnJump` line in the whole log.
//   P4 SILENT:  no `basevel: paid`, and x never left -15696.0 -- the 2000 u/s
//               never landed.
//
// AND THE 1.5 IN THAT JUMP LINE IS THE MECHANISM, spelled out by the engine
// itself: pm_jumpzoffset lifts the body 1.5 u off the ground on the jump, so the
// origin is at -30.47 -- ABOVE the slab's top of -30 -- before the tick's own
// 4.53 u of rise is even added.  The touch loop then runs at the command's END
// position and finds no overlap, so the one command where `run_wasground &&
// !FL_ONGROUND && velocity_z > 0` could pass is a command on which
// SV_TriggerIOTouch is never called at all.  On every earlier command
// FL_ONGROUND is still set and the test fails there instead.
//
// THIS IS THE LIBRARY'S NORM.  1352 OnJump triggers on 123 maps, median brush
// height 1.0 u; 1101 of 1352 are shorter than one tick of jump rise.  So this is
// not surf_prosurf's pad, it is every push-on-jump pad in the library --
// including the bhop_futile boosters the OnJump code was written for.
//
// THE REMAINING ALTERNATIVE is that the OnJump output never parsed, which would
// make P3 silent for a different reason (SV_TriggerIOTouch returns on
// `!trig.vbsp_io_out` before the dprint).  Ruled out by the FIX being the
// experiment: this run is the control, and firing OnJump from the persistent
// touching set must turn P3 and P4 positive on the same arm.  If it does not,
// the parse is where to look.
//
// RESULT 2026-09-20, PATCHED (qwprogs.dat 1479506 vs the control's 1478930).
// EVERY PREDICTION HELD, INCLUDING THE FALSIFIER'S.  Arm B, one single jump from
// inside the slab:
//   basevel: OnJump from *744 vz 290
//   basevel: SET '2000.000000 0.000000 0.000000' on player (write 1)
//   basevel: paid #1 [AddOutput 1] '2000.000000 0.000000 0.000000'
//            -> speed 2015.0 (h +2015.0, v +0.0)
//   setpos -14940.4 12416.0 26.5        (x was -15696.0: +756 u in one second)
// So the output had parsed all along; the touch was simply never dispatched on
// the command that mattered.  The parse alternative is dead.
//
// ARM E IS THE CONTROL AND IT STAYED SILENT: the same placement ritual and the
// same single jump at x -16000, 300 u west of the pad, produced no OnJump line
// and no movement (viewpos -16000.0 before and after).  So the fire is the pad's,
// not the patch firing at every jump everywhere -- which is the way this change
// would most plausibly have been wrong.
//
// ARMS C AND D FIRE NOTHING, and that is correct rather than a miss: arm B
// launched the body 756 u down the bonus, where the map's own reset teleported it
// back to the spawn at -16000 12416 96 -- outside the pad.  Read the viewpos
// samples before reading the silence.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p414jump
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
sv_port 27658
sv_cheats 1
set run_bv_debug 1
set run_resume 0
set vbsp_entity_io 1
vid_fullscreen 0
waitms 5000
map surf_prosurf
waitmap 2400
waitms 3000
menu_restart
ui_close
waitms 1000

echo ==== A place in the recess, centre of the pad footprint ====
setpos -15696 12416 -16
waitms 500
cmd viewpos
cmd noclip
waitms 400
cmd noclip
waitms 1200
echo ---- P1: this z must be BELOW -16 if we are in WALK ----
cmd viewpos
waitms 800
cmd viewpos
waitms 800

echo ==== B single jump, standing in the slab ====
+jump
waitms 80
-jump
waitms 300
cmd viewpos
waitms 900
cmd viewpos
waitms 800

echo ==== C two more single jumps ====
+jump
waitms 80
-jump
waitms 1000
cmd viewpos
+jump
waitms 80
-jump
waitms 1000
cmd viewpos
waitms 600

echo ==== D autohop chain in the slab ====
+jump
waitms 2400
-jump
waitms 600
cmd viewpos
waitms 600

echo ==== E CONTROL, same spot, jump somewhere with no pad under it ====
setpos -16000 12416 -16
waitms 400
cmd noclip
waitms 400
cmd noclip
waitms 1200
cmd viewpos
+jump
waitms 80
-jump
waitms 1000
cmd viewpos
waitms 600

echo ==== END ====
waitms 800
quit
