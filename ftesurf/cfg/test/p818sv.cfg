// FTESurf Patch 818 -- surf_view: red = teleports (resets), yellow = clip brushes,
// blue = ramps.  Run with tools/runlines_smoke.py --client <exe>; the same cfg on the
// installed exe is the control (P776's colours).  Vantages are teleport destinations
// read from the maps' entity lumps (stage starts), looking along the stage.
//   surf_view's first-frame line names the counts: "N ramp face(s), N clip face(s), ...".
cfg_save_auto 0
exec cfg/test/_quiet.cfg
log_enable 1
log_dir "logs"
log_name "runlines_smoke"   // tools/runlines_smoke.py reads this log
scr_sshot_type png
cl_yieldcpu 0
cl_idlefps 0
cl_maxfps 100
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0
surf_view_fill 0.5

waitms 2500
map surf_kitsune
waitmap 240
waitms 8000
sv_cheats 1
noclip
waitms 500
surf_view 1
setpos -15360 -15300 1000 20 90 0
waitms 2500
echo "@@@ P818 kitsune red stage"
screenshot p818_kit1
waitms 1500
setpos -13312 -15400 -250 25 90 0
waitms 2500
echo "@@@ P818 kitsune orange stage"
screenshot p818_kit2
waitms 1500
setpos 0 -1600 400 20 90 0
waitms 2500
echo "@@@ P818 kitsune spawn"
screenshot p818_kit3
waitms 1500

surf_view 0
map surf_dune
waitmap 240
waitms 8000
sv_cheats 1
noclip
waitms 500
surf_view 1
setpos -11100 -9920 13600 20 180 0
waitms 2500
echo "@@@ P818 dune stage 2"
screenshot p818_dune1
waitms 1500
setpos 11614 11675 13300 25 270 0
waitms 2500
echo "@@@ P818 dune spawn"
screenshot p818_dune2
waitms 1500

echo "@@@ P818 DONE"
echo RUNLINES COMPLETE
waitms 1000
quit
