// cfg_save_auto 0 FIRST: this run sets archived cvars and must never write them
// into ftesurf.cfg (cl_main.c:2535).
cfg_save_auto 0

// ===========================================================================
//  P466REGET -- does the browser notice it holds the WRONG BUILD of a map,
//  and can it replace one?
//    python tools/p466reget.py            subject: a truncated shadow is planted
//    python tools/p466reget.py --control  control: nothing is planted
//
//  WHY THIS EXISTS.  Patch 465 asked "is there a file of that name".  Having a
//  FILE and having the RIGHT BUILD are different facts, and only the first was
//  ever checked -- so the one case the Download button could not help with was
//  a wrong build, which is exactly what a server kicks you for (mapcrc
//  mismatch, cl_parse.c:7669).  Reported from a laptop whose Momentum copy of
//  surf_666 differed from the Pi's.
//
//  THE CONTROL IS THE WHOLE POINT HERE, more than in p465dl.  This build box IS
//  the source data/mapdl.txt was written from, so every installed map matches by
//  construction and `wrongbuild` MUST report 0.  A check that flags a correct
//  install is worse than no check: its action is to re-download, so a false
//  positive spends the player's bandwidth telling them something false.  The
//  subject then plants ONE truncated shadow in ftesurf/maps/ -- which wins the
//  mount -- and the same count must become exactly 1.
//
//  ui_dlmap <map> force is the headless twin of the "Wrong build" button, the
//  way plain ui_dlmap is the "Download" one's; no cfg in this tree drives a
//  cursor.  It prints localkb, the engine's MOUNT-RESOLVED size, so the arm can
//  see the subject's own reading rather than inferring it from a consequence.
// ===========================================================================

log_enable 1
log_dir logs
log_name p466reget
log_developer 1
developer 1

// The driver rewrites this per run: the mirror address, and p466_act -- the
// action, which is the ONLY thing that differs between the two arms.
exec cfg/test/p466src.cfg

// FORTY SECONDS, THEN menu_restart -- menu.dat loads lazily and nothing in a
// scripted run needs a menu, so without this every arm prints
// `Unknown command "ui_dlmap"`.  b67join.cfg's header records the three runs
// this cost there.
waitms 40000
menu_restart
waitms 4000

// LOAD THE LIST FIRST.  ui_load_maps is lazy -- it runs when the browser is
// opened, not when the menu starts -- so a bare ui_dlmap before this reports
// `list 0`, and a wrongbuild count taken from an EMPTY list is 0 for reasons
// that have nothing to do with the install being correct.  The first cut of
// this arm graded exactly that reading and called it a clean control.
// ui_maplist is the cheapest thing that calls ui_load_maps.
ui_maplist surf_exxak
waitms 2000

echo ^5==== p466 arm 0: what does the list think it has? ====
ui_dlmap

echo ^5==== p466 arm 1: ask about the map itself ====
p466_act
waitms 1500

echo ^5==== p466 arm 2: across the transfer ====
waitms 2000
ui_dlmap
waitms 2000
ui_dlmap
waitms 2000
ui_dlmap
waitms 2000
ui_dlmap
waitms 2000
ui_dlmap
waitms 2000
ui_dlmap
waitms 2000
ui_dlmap
waitms 2000
ui_dlmap

echo ^5==== p466 arm 3: settled ====
ui_dlmap
dir maps/surf_exxak.bsp
waitms 1000

quit
