// Patch 808 (tools/p808rewind.py). surf_dune's run is about a second long (its fail
// teleport lands in the start box, which re-arms it), so each rewind opens about
// 0.8 s after the walk leaves the box, before the fail. A: the run on the clock
// under the rewind's pin. S: 0.5 s back, the rewind's S key saves. LOAD: the load
// key holds that save (timed, segmented, recording, the line from the start), then
// lets go and the line grows. GO: a fresh run, rewind, ENTER: the count holds the
// body; AFTER: it let go. 1000 fps: a cursor 0.5 s back is past the view trim's
// old 256-frame walk.
cfg_save_auto 0
name P808
fs_cache 0
log_enable 1
log_dir logs
log_name p808rw
cl_idlefps 0
cl_maxfps 1000
vid_fullscreen 0
waitms 3000
connect 127.0.0.1:27561
waitmap 60
waitms 8000
menu_restart
ui_close
hud_trail 1
hud_trail_prev 1
rec_savelock 1
cl_slpredict 1
hud_rewind_chase 0
waitms 1000
cmd zone_goto 0
waitms 400
+forward
waitms 2000
rewind
waitms 150
rewind
waitms 400
-forward
echo ==== P808 A ====
cmd timer
rewind status
trail
waitms 300
echo ==== P808 S ====
rewind seek -0.5
waitms 200
rewind status
rewind key 115
waitms 300
rewind key 115 up
waitms 1200
rewind status
saveloc
echo ==== P808 LOAD ====
+sl_hold
waitms 900
saveloc
cmd timer
trail
-sl_hold
waitms 300
trail
cmd timer
waitms 1500
echo ==== P808 GO ====
cmd zone_goto 0
waitms 400
+forward
waitms 2000
rewind
waitms 150
rewind
waitms 400
-forward
rewind seek -0.5
waitms 200
rewind key 13
waitms 300
rewind key 13 up
waitms 700
rewind status
cmd timer
waitms 2600
echo ==== P808 AFTER ====
rewind status
cmd timer
trail
waitms 500
echo ==== P808 END ====
quit
