// P372VOTE -- the vote box and the map clock, synthetic (listen server, no vote
// running on the server).  `vote fake ...` overrides serverinfo locally (HUD_SK);
// `vote key <scan> <0|1>` runs the whole CSQC_InputEvent chain.
//   ftesurf64.exe +set vid_winmaximize 0 -WindowStyle Minimized +exec cfg/test/p372vote.cfg
// then grep "vote:\|vote key:\|mapclock:" logs/p372vote.log and look at the shots.
//
// PREDICTIONS (registered before the run):
//  A  nothing faked: "vote: none", mapclock "" left -1 row "".
//  B  clock 900 0 + next surf_beginner: row "time left 15:00" (or 14:59); shot b
//     shows "time left" and "next surf_beginner" under the map-info rows.
//  C  shot c 5 s later: only that clock (and nothing else) has moved, by 5 s.
//  D  a 6-option vote: first status 0.1 s in (inside VOTE_ARM) "capture 0"; 1 s later
//     "shown 1 pick 0 capture 1"; shot d is the box at 0.018/0.30.
//  E  `vote key 49 1/0` while capturing: took 1, pick 1, saves unchanged (the save
//     key did not save); `vote key 50 1/0` in the same frame: pick 2 (the grace
//     re-picks).  After 0.7 s: capture 0, and `vote key 49 1/0` saves: saves +1.
//  F  votec "0 3 1 0 0 0": option 2's tally reads 3.
//  G  bare `vote` with a pick: capture 1 (re-armed), shown 1; again: shown 0.
//  H  a new vote (Yes/No): shown 1 pick 0; the draft (`chat_say x`) takes key 50
//     (took 1, pick still 0); ESC (27) closes the draft.
//  I  keypad 2 (scan 159) picks 2; holding it (a second down, no up) is a repeat
//     the box keeps (took 1) with pick unchanged.
//  J  clock rows: 30 0 -> "time left 0:30"; 5 0 -> "time left 0:05"; 90 1 ->
//     "waiting for runs 1:30"; 8 2 -> "changing to surf_beginner 0:08".
//  K  hud_mapinfo_timeleft 0: shot k has no clock rows, the status row is unchanged;
//     hud_mapinfo 0 + +showscores: shot s has the clock in the scoreboard header.
//  L  falsifier: `vote fake off` -> "vote: none"; `vote 2` -> "no vote running".
//  M  overlap: six two-row chat lines and a 6-option box (shot m): the chat's
//     rows stop below the box (run 1, before that, drew them under it).
//
// RESULTS 2026-09-19 (run 2): ALL HELD but J's rounding.  A none; B "time left
//  15:00"; C "14:55"; D capture 0 at 0.1 s, 1 at 1.1 s (shot d: the box at 0.018/
//  0.30, "time left / next" under the map info); E 1 picks with saves 2 -> 2, the
//  same-frame 2 re-picks, after the grace 1 saves (3); F tally 3; G re-armed, then
//  hidden; H the draft took 50 (pick 0) and ESC; I keypad 2 picks, its repeat is
//  kept; J rows "time left 0:31" / "0:06" / "waiting for runs 1:31" / "changing
//  to surf_beginner 0:09" -- the fake's %.1f end rounds up a second, the formats
//  are the predicted ones; K status unchanged, shot s "time left 14:59  next
//  surf_beginner" in the scoreboard header; L none / "no vote running"; M shot m:
//  the chat's rows stop below the box.  Run 1 found M's overlap (chat text under
//  the box) and a 2 pressed 0.5 s late going to the load key -- the harness now
//  presses it in the same frame.
