// MOMLIVE -- the imported board against the LIVE Pi, after deploy. log_name momlive.
//
// Everything else in this feature was graded against a local surfd holding a
// copy of the database. This is the one that asks the real one, on the progs
// the fleet is running, which is the only configuration a player will ever be
// in.
//
// PRE-REGISTERED from the live API before running (curl, off-box):
//  L1 surf_utopia 0/0 ranked   -> 2 rows, counts ranked 2, imported 271
//     The ranked count is the invariant: importing 85,000 rows must not have
//     moved it. If this reads anything but 2, the tier predicate leaked.
//  L2 surf_utopia 0/0 imported -> 25 rows (the page cap), src all 1 (momentum),
//     reps non-zero on the ones we hold a demo for.
//  L3 surf_utopia 0/0 combined -> ours interleaved with theirs by time.
//  L4 a map with KSF rows: surf_whiteout 0/0 imported should carry src 2 rows.
log_enable 1
log_dir "logs"
log_name momlive
developer 0
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0
sv_public 0
sv_port 27694
waitms 4000
// The real directory, not a local copy.
lobby_dir "http://192.168.1.102:8084"
map surf_utopia
waitmap 1800
waitms 4000
ui_close
waitms 1000
echo ^5==== momlive L1 ranked (expect 2 rows, imported count 271) ====
board_fetch 0 0 ranked clean
waitms 3000
board_status
waitms 500
echo ^5==== momlive L2 imported (expect 25 rows, src all 1) ====
board_fetch 0 0 imported clean
waitms 3000
board_status
waitms 500
echo ^5==== momlive L3 combined ====
board_fetch 0 0 combined clean
waitms 3000
board_status
waitms 500
quit
