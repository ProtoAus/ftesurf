// Build 64: the CLIENT half of the guid test. See b64guidsv.cfg.
//
// Nothing is read from this side -- the whole result is on the server's
// console. The client exists only to be a genuine networked connection, which
// is the one thing a listen server cannot provide.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name b64guidcl
waitms 9000
connect 127.0.0.1:27599
waitms 60000
disconnect
waitms 500
quit
