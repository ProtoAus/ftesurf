cfg_save_auto 0
// P1573 review 2: a worldspawn `cvar_in_rawinput_nolegacy " 1"` (here from a pk3's maps/surf_dune.ent, the
// way a player's own file would add it) locks the applied string to " 1" -- clicks open -- while the
// player's "1" stays as the latch cvar_string returns.  python tools/p1573guard.py --latch ...
name P1573L
fs_cache 0
log_enable 1
log_dir logs
log_name p1573latch
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
seta in_rawinput_nolegacy 1
seta in_rawinput_touchpad 0
waitms 3000
connect 127.0.0.1:27561
waitmap 60
waitms 8000
menu_restart
ui_close
waitms 1000
echo ==== P1573 LATCH ====
in_rawinput_nolegacy
cmd timer
waitms 800
echo ==== P1573 END ====
quit
