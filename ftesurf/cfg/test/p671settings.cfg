// Actual engine loader, one fixture per disposable overlay; no live installs.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name runlines_smoke
log_developer 1
developer 1
con_notifytime 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
vid_winmaximize 0
vid_width 800
vid_height 600
sv_public 0
set lobby_enable 0
set lobby_master ""
waitms 1500
map surf_voyager
waitmap 60
waitms 5000
menu_restart
ui_close
echo P670 LOADER values
sv_maxvelocity
sv_gravity
sv_airaccelerate
sv_accelerate
sv_maxspeed
sv_friction
echo P670 LOADER end
echo RUNLINES COMPLETE
waitms 300
quit
