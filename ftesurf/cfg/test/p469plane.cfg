// P469PLANE -- Patch 469: a board line is graded against its own ground plane.
//
// The board-line job (cl_watch.qc Watch_LineJobStep) read the plane only when a
// sample had MORE than 17 columns, and a conforming v4+ sample has exactly 17,
// so slots 1-8 were built with a zero plane and every ramp sample was graded
// against the flat-air target.  The same file goes into slot 0 (the replay) and
// slot 1 (`scores lineat`, the real job), and tools/p469plane.py grades both
// against the .rec with p453q's model.
//
// FIXTURE: any v4+ file with ramp samples, and its map.  Two lines below.
//
// PRE-REGISTERED
//  P1 slot 1 holds the same points as slot 0.
//  P2 slot 1's grade matches the file's at every point, to 0.01.
//  P3 slot 1's grade matches slot 0's at every point, to 0.0001.
//  P4 the file has ramp samples where the plane MOVES the grade by over 0.01,
//     or P2 and P3 would pass with the plane still zero.
//
// RESULT (2026-10-03, the N100 laptop; surf_colin_blaster_69000, runid
//  20260930-085843-0, 8084 samples of which 873 carry a plane; csprogs
//  C8750BFA78E71E0E fixed / B58F0E8EE93603F3 control = HEAD 9a9ec07).
//  P1 both builds: slot 1 holds 7828 points, the file's samples from t >= 0
//     (the 256 before the clock are the replay's alone), 0 out of place.
//  P2 FIXED 0 wrong of 7828.  CONTROL 789 wrong.
//  P3 FIXED 0 of 7827 differ, grade and ln_col.  CONTROL 789.
//  P4 the plane moves the grade at 789 points, and the control's slot 1 matches
//     the ZERO-PLANE model at all 789 of them (the fixed build's at 0).
//  Slot 0 is 0 wrong of 8084 on both builds: the replay never had the defect.
//
// NOT SHOWN BY PIXELS: the two slots draw the same path, so the screenshot proves
//  ink and not which slot's.  P3 compares ln_col, what the emitter is handed.
// THE DUMP IS SLOW: ~16000 log lines at ~90 a second, so allow 5 minutes.
log_enable 1
log_dir "logs"
log_name p469plane
set hud_lines_edge 0            // Patch 628: this arm grades the last-contact stamp (tools/p449mark.py)
developer 0
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0
set run_resume 0
sv_public 0
sv_port 27711
set lobby_dir ""
set hud_watch_skipidle 0
set hud_watch_path 1
con_notifytime 0

wait 200
map surf_colin_blaster_69000
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 1000

replay data/resume/surf_colin_blaster_69000/@local/save000/run.rec
waitms 1500
replay pause
replay seek 40
waitms 1200
scores lineat 1 data/resume/surf_colin_blaster_69000/@local/save000/run.rec
waitms 4000
scores lines
hud_watch_path_color 4
waitms 700

echo ^5=== p469plane slot 0 ===
replay colours 0 1
waitms 900
echo ^5=== p469plane slot 1 ===
replay colours 1 1
waitms 900
echo ^5=== p469plane marks ===
replay marks 0
waitms 300
screenshot screenshots/p469plane.png
waitms 500
replay stop
waitms 300
quit
