// Patch 882 arm, listen server, through tools/runlines_smoke.py:
//   python tools/runlines_smoke.py ftesurf/cfg/test/p882lim.cfg --mount --timeout 600 \
//     --ssqc <qwprogs> --csqc <csprogs> --mqc <menu> --client <exe> --output-dir <task root>/artifacts
// Control: the same arm on the build without P882 (no `momlimit` lines, every key moves).
// The server prints `momlimit <name>: limit L slide S cool C` when what a move gets changes.
//   L bhop_offstyles at hsw_fail, inside *87 (left+right+jump+crouch) and *120 (back): limit 62;
//     +moveleft and +back leave x/y where they were, +forward moves.
//   J bhop_mom_training_beta *310 (jump+crouch+bhop+walk+sprint, limit 496) at TELE_LEVEL_2:
//     held +jump leaves z on the floor.
//   B surf_affliction *141 (bhop, limit 64 cool 0.2) at lody_bonus: held +jump, z sampled
//     every 50 ms; each landing sits on the floor ~0.21 s (14 ticks) before the next hop.
//   S surf_rogue *41 and bhop_parallel *16 (slide 8): after +forward is released the body
//     keeps moving (no friction) instead of stopping.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name runlines_smoke
con_notifytime 0
cl_idlefps 0
cl_maxfps 100
vid_vsync 0
vid_fullscreen 0
vid_width 1280
vid_height 720
sv_public 0
set run_resume 0
developer 1
log_developer 1
scr_sshot_type png
waitms 1500

map bhop_offstyles
waitmap 120
waitms 6000
menu_restart
ui_close
waitms 500
echo ==== L1 offstyles W-only, drop ====
setpos 2560 -4288 -8240 0 0 0
waitms 3000
cmd viewpos
waitms 200
echo ==== L2 +moveleft ====
+moveleft
waitms 1000
-moveleft
waitms 300
cmd viewpos
waitms 200
echo ==== L3 +back ====
+back
waitms 800
-back
waitms 300
cmd viewpos
waitms 200
echo ==== L4 +forward ====
+forward
waitms 600
-forward
waitms 300
cmd viewpos
waitms 300

map bhop_mom_training_beta
waitmap 120
waitms 6000
echo ==== J1 training jump limit, drop ====
setpos -2496 8064 40 0 0 0
waitms 1500
cmd viewpos
waitms 200
echo ==== J2 +jump held ====
+jump
waitms 300
cmd viewpos
waitms 300
cmd viewpos
-jump
waitms 300

map surf_affliction
waitmap 120
waitms 6000
echo ==== B1 affliction bhop limit, drop ====
setpos -8320 15104 13200 0 0 0
waitms 1500
cmd viewpos
waitms 200
echo ==== B2 +jump held, z every 50 ms ====
alias p882z "cmd viewpos; waitms 50; cmd viewpos; waitms 50; cmd viewpos; waitms 50; cmd viewpos; waitms 50; cmd viewpos; waitms 50"
+jump
p882z
p882z
p882z
p882z
p882z
p882z
p882z
p882z
-jump
waitms 300

map surf_rogue
waitmap 120
waitms 6000
echo ==== S1 rogue slide, drop ====
setpos 14208 14784 4100 0 0 0
waitms 1500
cmd viewpos
waitms 200
echo ==== S2 +forward then release ====
+forward
waitms 1000
-forward
cmd viewpos
waitms 500
cmd viewpos
waitms 500
cmd viewpos
waitms 300

map bhop_parallel
waitmap 120
waitms 6000
echo ==== S3 parallel slide, drop ====
setpos 2944 15072 850 0 0 0
waitms 1500
cmd viewpos
waitms 200
echo ==== S4 +forward then release ====
+forward
waitms 1000
-forward
cmd viewpos
waitms 500
cmd viewpos
waitms 500
cmd viewpos
waitms 300
echo RUNLINES COMPLETE
quit
