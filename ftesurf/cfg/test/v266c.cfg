// V266C -- Patch 266 Part C, plus a second-map regression.
//
// PART C.  r_fog_permutation 0 ORed the permutation's enum INDEX (5) into a
// MASK, so it set PERMUTATION_BUMPMAP|PERMUTATION_UPPERLOWER and never touched
// PERMUTATION_FOG (32).  The user's own report of this bug is the before: they
// set r_fog_permutation 0 looking for a fog change and got "nothing".
//
// So the test is a POSITIVE one: with the fix, r_fog_permutation 0 must now
// visibly REMOVE fog from shaders that have a program.  Measured from inside
// the 3D-skybox room, where the terrain is WorldVertexTransition (a program)
// and heavily fogged -- turning the permutation off must make the mean move
// AWAY from the near-white fog colour, i.e. DOWN.  That is the opposite
// direction from Part B's r_fog_progless, which fogs the program-LESS clouds
// and moves the mean UP.  The two knobs acting on different surfaces in
// opposite directions is the discrimination.
//
// r_fog_permutation is CVAR_SHADERSYSTEM: setting it rebuilds every shader, so
// it gets a long settle before the shot.
//
// The cloods material scrolls (tcMod scroll), so a pixel count at this vantage
// is meaningless -- v266b measured its noise floor at 58.8% of the frame.
// Everything here is compared by regional mean, with a scroll-only pair taken
// the same way as the calibration.
//
// REGRESSION.  surf_demise carries 24 translucent VertexlitGeneric materials,
// the second-heaviest map in the Part A census, and is the natural place to
// check that the redirect change does not break a map with many of them.  The
// check is the [shader] lines plus "does it load and render at all".

log_enable 1
log_dir "logs"
log_name "v266c"
developer 1
log_developer 1
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 0
vid_fullscreen 0
con_notifytime 0
con_notifylines 0
con_notifytime_error 0

vid_width 1920
vid_height 1200
vid_restart
waitms 4000

wait 200
echo ^5=== v266c: Part C + regression ===

map surf_boreas
waitmap 1800
waitms 9000
sv_cheats 1
waitms 300
noclip
waitms 300
vbsp_skyroom 1
r_sky_forcedepth 1
r_fog_progless 1
r_fog_permutation 1
waitms 800
developer 0
waitms 500

echo ^5----- C noise floor: scroll-only pair, permutation ON both times -----
setpos 0 -9000 -9500 -18 90 0
waitms 2500
screenshot v266c_x
waitms 800
setpos 0 -9000 -9500 -18 90 0
waitms 1200
screenshot v266c_n1
waitms 800
setpos 0 -9000 -9500 -18 90 0
waitms 2000
screenshot v266c_x
waitms 800
setpos 0 -9000 -9500 -18 90 0
waitms 1200
screenshot v266c_n2
waitms 800

echo ^5----- C: r_fog_permutation 1 (fog present on program shaders) -----
r_fog_permutation 1
waitms 4000
setpos 0 -9000 -9500 -18 90 0
waitms 2000
screenshot v266c_x
waitms 800
setpos 0 -9000 -9500 -18 90 0
waitms 1200
screenshot v266c_perm1
waitms 800

echo ^5----- C: r_fog_permutation 0 (fog must now GO) -----
r_fog_permutation 0
waitms 6000
setpos 0 -9000 -9500 -18 90 0
waitms 2000
screenshot v266c_x
waitms 800
setpos 0 -9000 -9500 -18 90 0
waitms 1200
screenshot v266c_perm0
waitms 800
r_fog_permutation 1
waitms 4000

echo ^5===== REGRESSION: surf_demise (24 translucent VertexlitGeneric) =====
developer 1
waitms 300
map surf_demise
waitmap 1800
waitms 12000
developer 0
waitms 500
sv_cheats 1
waitms 300
screenshot v266c_x
waitms 800
screenshot v266c_demise
waitms 800

echo ^5=== v266c done ===
wait 30
quit
