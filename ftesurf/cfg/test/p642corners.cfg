// Private overlay (tools/runlines_smoke.py).  Patch 642: a rounded corner is drawn
// from a mask made at its own pixel size.  `hud_edit ui round <px>` keeps one white
// box of that corner radius on black; each is shot twice -- drawn the way before
// the patch (`round png`: the 8 px mask stretched) and the new way (`round mask`)
// -- and tools/test_p642corners.py compares the pixels with the box's exact
// coverage.  Then a video restart, which drops uploaded images: the masks must
// come back.  vid_conautoscale 1, so a unit here is a pixel.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name runlines_smoke
con_notifytime 0
con_notifylines 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
vid_winmaximize 0
vid_width 1280
vid_height 720
vid_conautoscale 1
sv_public 0
waitms 2000
map surf_kitsune
waitmap 60
waitms 5000
wait 4
menu_restart
ui_close
waitms 600
wait 4
echo ==== P642 PNG ====
hud_edit ui round png
hud_edit ui round 6
waitms 500
wait 4
screenshot p642_png_r6.png
hud_edit ui round 12
waitms 500
wait 4
screenshot p642_png_r12.png
hud_edit ui round 20
waitms 500
wait 4
screenshot p642_png_r20.png
hud_edit ui round 32
waitms 500
wait 4
screenshot p642_png_r32.png
hud_edit ui round 45
waitms 500
wait 4
screenshot p642_png_r45.png
hud_edit ui round 64
waitms 500
wait 4
screenshot p642_png_r64.png
hud_edit ui round 96
waitms 500
wait 4
screenshot p642_png_r96.png
hud_edit ui round 100
waitms 500
wait 4
screenshot p642_png_r100.png
hud_edit ui round 176
waitms 500
wait 4
screenshot p642_png_r176.png
echo ==== P642 MASK ====
hud_edit ui round mask
hud_edit ui round 6
waitms 500
wait 4
screenshot p642_mask_r6.png
hud_edit ui round 12
waitms 500
wait 4
screenshot p642_mask_r12.png
hud_edit ui round 20
waitms 500
wait 4
screenshot p642_mask_r20.png
hud_edit ui round 32
waitms 500
wait 4
screenshot p642_mask_r32.png
hud_edit ui round 45
waitms 500
wait 4
screenshot p642_mask_r45.png
hud_edit ui round 64
waitms 500
wait 4
screenshot p642_mask_r64.png
hud_edit ui round 96
waitms 500
wait 4
screenshot p642_mask_r96.png
hud_edit ui round 100
waitms 500
wait 4
screenshot p642_mask_r100.png
hud_edit ui round 176
waitms 500
wait 4
screenshot p642_mask_r176.png
echo P642 status
hud_edit ui
echo ==== P642 RESTART ====
hud_edit ui round 32
vid_restart
waitms 4000
wait 4
screenshot p642_mask_r32_restarted.png
echo P642 status restarted
hud_edit ui
hud_edit ui round 0
waitms 800
wait 4
echo P642 end
echo RUNLINES COMPLETE
quit
