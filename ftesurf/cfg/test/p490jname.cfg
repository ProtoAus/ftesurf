// p490jname.cfg -- PATCH 490: in_journal_end prints the file it wrote, not a
// loader thread's name.
//
// WHAT THIS ARM EXISTS TO PROVE.  `IN_JournalEnd_f` holds `name` across
// `COM_WriteFile` and prints it afterwards.  QC_FixFileName returns EITHER its
// argument (a Z_Malloc'd Cmd_Argv copy, stable for the whole command) OR
// `va("data/%s", name)` -- a pointer into the engine's small rotating va()
// buffer, taken whenever the caller passed a BARE name with no data/ prefix.
// COM_WriteFile walks the filesystem, which restarts the loader threads, whose
// names come from va().  So on the bare-name path the pointer describes a
// loader thread by the time it is printed.
//
// MEASURED BEFORE WRITING ANY CODE, over every `in_journal_end:` line naming a
// file in ftesurf/logs/ (the corpus, not a guess):
//     17 lines read `loadworker_3,`      -- every one from a BARE-name argument
//     the rest read `data/<real>.hid`    -- every one from a `data/`-prefixed one
// and the split is exact: cfg/test/p484ident.cfg says `in_journal_end p484_B.hid`
// and its log says loadworker_3; the gamecode's own caller
// (cl_replay.qc: localcmd(sprintf("in_journal_end %s\n", dst))) always spells the
// data/ prefix through FS_RunPath, and its lines name their file.
//
// WHY IT IS WORTH FIXING AND NOT MERELY COSMETIC.  The same pointer feeds TWO
// prints, and the second is
//     Con_Printf(CON_WARNING "in_journal_end: %s was not written\n", name)
// i.e. precisely the line where a reader needs to know WHICH journal was lost.
// A warning that names a loader thread is a warning that cannot be acted on.
//
// WHAT IT IS NOT.  THE FILE ON DISK WAS ALWAYS CORRECT: COM_WriteFile runs on
// the good pointer, before the clobber.  No journal was ever misnamed and no
// evidence is affected.  Arm 3 measures that rather than asserting it.
//
// PRE-REGISTERED PREDICTIONS.  Run this cfg on BOTH binaries; the pre-490 one is
// the control and MUST fail arm 1.  tools/p490jname.py grades it.
//
//   ARM 1 -- SUBJECT.  `in_journal_end p490_A.hid`, a BARE name, the path that
//          takes QC_FixFileName's va() branch.
//          1a the log's `in_journal_end:` line names `data/p490_A.hid`
//          1b it does NOT read `loadworker_3`
//          ON THE PRE-490 BINARY 1a FAILS AND 1b FAILS.  That is the control,
//          and if it passes on the pre-490 binary this arm measures nothing --
//          "not flagged" is also what a subject that never fired prints.
//
//   ARM 2 -- CONTROL FOR THE FIX.  `in_journal_end data/p490_B.hid`, already
//          prefixed, the path that was correct BEFORE the patch.
//          2a it names `data/p490_B.hid` on BOTH binaries, identically.
//          This is the half that proves the patch did not break the working
//          path, including the gamecode's own caller, which is this shape.
//
//   ARM 3 -- THE FILE, NOT THE PRINT.  Both journals exist on disk under their
//          real names, and each one's own content names no loader thread.
//          3a data/p490_A.hid exists and is non-empty
//          3b data/p490_B.hid exists and is non-empty
//          3c neither file was written under a `loadworker_3` name
//          THIS IS THE PREDICTION THAT BOUNDS THE INCIDENT: if 3a failed on the
//          pre-490 binary the defect would be an evidence defect and not a
//          diagnostic one, and the patch would be a different patch.
//
// No server, no map, no CSQC: the journal is the input layer's own and begins at
// the menu.  log_developer 1 is mandatory -- the line under test is a
// Con_DPrintf, which never reaches the log file without it.

cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
log_enable 1
log_dir logs
log_name p490jname
developer 1
log_developer 1

echo ================================ P490 ARM 1 -- a BARE name.  Expect data/p490_A.hid, never loadworker_3.
in_journal_begin
waitms 700
+forward
waitms 400
-forward
waitms 300
in_journal_end p490_A.hid
waitms 500

echo ================================ P490 ARM 2 -- an ALREADY-PREFIXED name.  Expect the same on both binaries.
in_journal_begin
waitms 700
+forward
waitms 400
-forward
waitms 300
in_journal_end data/p490_B.hid
waitms 500

echo ================================ P490 ARM 3 -- the files themselves.
echo P490-DONE
waitms 800
quit
