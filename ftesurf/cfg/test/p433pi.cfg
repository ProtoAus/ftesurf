// P433PI -- post-deploy check for Patches 431-433 (fe56812): a client joins lobby
// 27540, loads the lobby's csprogs, and the new handles answer: `replay cut` with
// nothing open says `nothing loaded` (the round-1 guard), `scores lines` prints its
// summary, `replay status` says nothing loaded.  No QC error.
//
// RESULT (2026-09-23, after the fe56812 deploy): joined bhop_eazy on 27540, `FTESurf
//  CSQC loaded` (the local csprogs is the deployed build, so no download), `replay cut`
//  and `replay status` -> `nothing loaded`, `lines: 0 drawn`.  No QC error.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p433pi
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
wait 600
connect 192.168.1.102:27540
waitms 20000
echo === p433pi handles
replay cut 1
scores lines
replay status
waitms 1000
echo === p433pi done
quit
