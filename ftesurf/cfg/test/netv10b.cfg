// NETV10B -- the 0,1,1 stall, reproduced deliberately on a SURF map.
//
// WHAT netv10/netv15 GOT WRONG, twice over:
//
//  1. THE MAP.  bhop_eazy is the one family where this cannot show.  Patch 224
//     applies cfg/mode_<mode>.cfg per map, and mode_bhop.cfg sets pm_ticrate,
//     sv_mintic and sv_maxtic to 0.01 AND cl_netfps to 100 -- all four matched
//     at 10 ms.  The .rec header proves it: `tickrate 0.01`.  Both arms
//     therefore read 1111... and looked like a null result.  Surf runs
//     pm_ticrate 0.015 (default.cfg:148) with the same 100 Hz client, which is
//     the mismatch.
//
//  2. THE ORDER.  Setting cl_netfps at the top of a +exec'd cfg does nothing:
//     the saved ftesurf.cfg loads afterwards and `seta cl_netfps "100"`
//     overwrites it.  netv15.cfg printed `"cl_netfps" is "100"` right before its
//     walk -- the arm never ran.  That is the SAME override that causes the bug
//     being investigated, so it is worth saying out loud rather than quietly
//     fixing: an archived cvar cannot be forced from a config that runs first,
//     and default.fmf forcing cl_netfps 66.6667 has exactly that shape.
//
// So: a surf map, and the cvar set AFTER the map is up.
//
// THIS ARM IS THE BUG.  10 ms commands into a 15 ms mover:
//     avail 0.010 -> 0 ticks, carry 0.010
//     avail 0.020 -> 1 tick,  carry 0.005
//     avail 0.015 -> 1 tick,  carry 0.000
// Expect the recorded motion to read 011011011... -- a dead stop every third
// usercmd, at 33 Hz, in position only.  Its pair netv15b.cfg differs by one
// number and should read 111111111.
//
// Writes one save under data/saves/surf_rise/; the caller deletes it.

log_enable 1
log_dir "logs"
log_name "netv10b"
developer 0
log_developer 0
cfg_save_auto 0
sv_cheats 0
fs_missingwarn 0
cl_idlefps 0
vid_fullscreen 0
con_notifylines 0
scr_conalpha 0

wait 200
map surf_rise
waitmap 1800
waitms 3000

// AFTER the map, so nothing loads over the top of it.
cl_netfps 100
waitms 600
echo ^5=== netv10b: the values actually in force ===
cl_netfps
pm_ticrate
cl_maxfps
waitms 600

echo ^5=== netv10b: walking ===
cmd zone_goto 0 16.18 0
waitms 900
+forward
waitms 4000
-forward
waitms 500
cmd sl_save
waitms 1200

echo ^5=== netv10b: done ===
waitms 500
quit
