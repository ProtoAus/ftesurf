// Patch 221 -- what does the recursed scene actually CONTRIBUTE?
//
// The debug shader (p220dbg) settled three things: the aperture quad rasterises,
// it covers the whole doorway (at the s1 camera that is x 218..1062, not the
// little rectangle at screen centre), and its screen-space texcoords are a clean
// gradient.  So the geometry and the lookup are innocent and the question is
// only what is IN the texture.
//
// Three arms at one camera, so the difference is the answer and nothing else
// moves:
//
//   A  normal                      -- aperture drawn, far scene rendered
//   B  r_portaldebug 1             -- aperture drawn, far scene SKIPPED, so it
//                                     paints the opaque black clear.  If A and B
//                                     are the same picture, the recursed render
//                                     contributes nothing and "the FBO contains
//                                     the correct image" is false.
//   C  vbsp_portal_render 0          -- no aperture at all, so this is the near
//                                     side: what the doorway is set into.
//
// A vs B is the decisive pair.  C is the control that says which of the two is
// the near room, in case A == C instead.
//
// Deliberately no reliance on mean pixel values: CUSTOM/RAINBOWSCROLL animates
// and screen brightness has already given one confidently wrong answer on this
// bug.  These are three pictures of one stationary camera, to be looked at.

cfg_save_auto 0
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "p221"
scr_sshot_type png
cl_yieldcpu 0
cl_maxfps 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0
r_portalfbo 1
r_refract_fbo 1
r_portalrecursion 2
r_portalmaxviews 2

waitms 2500
map surf_kitsune
waitmap 240
waitms 8000
sv_cheats 1

setpos -15360 -15252 870 0 270 0
waitms 2500

echo "@@@ P221 A -- normal"
vbsp_portal_render 1
r_portaldebug 0
waitms 2000
screenshot_mega p221_A_normal 1280 720
waitms 800

echo "@@@ P221 B -- r_portaldebug 1, aperture drawn but no recursed scene"
r_portaldebug 1
waitms 2000
screenshot_mega p221_B_noscene 1280 720
waitms 800

echo "@@@ P221 C -- vbsp_portal_render 0, no aperture at all"
r_portaldebug 0
vbsp_portal_render 0
waitms 2000
screenshot_mega p221_C_noaperture 1280 720
waitms 800

echo "@@@ P221 DONE"
vbsp_portal_render 1
waitms 1000
quit
