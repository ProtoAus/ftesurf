// MS1QUIT2 -- see ms1quit.cfg (2 of 3).
cfg_save_auto 0
log_enable 1
log_dir logs
log_name ms1quit
developer 1
cl_idlefps 0
cl_maxfps 100
sv_port 27631
set run_resume_countdown 1
waitms 5000
map surf_666
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 500
set rec_terms 1
echo ^5==== 2: resume in a new process ====
say !resume
waitms 2500
cmd timer
+forward
waitms 5000
-forward
waitms 1500
cmd timer
quit
