// Patch 892 arm: zone-tool triggers (no brush, shaped by a logic_auto's OnMapSpawn AddOutput).
//   python tools/runlines_smoke.py ftesurf/cfg/test/p892tool.cfg --mount --timeout 400 \
//     --ssqc <qwprogs> --csqc <csprogs> --mqc <menu> [--client <exe>] --output-dir <task root>/artifacts
// Control: the build before it -- no `tooltrig` lines, no limit, no teleport, no boxes in `trig:`.
//   G surf_greek: the server prints `tooltrig trigger_momentum_limitmovement ...` twice for each of its
//     21 checkpoint limits; inside checkpoint 0's slab (14048 15072 15492, 2048x256x8) it prints
//     `momlimit Player: limit 64` (bhop).
//   C bhop_cloudburst: a tool teleport (box -3136..-1024, 448..512, 808..856) sends a body set inside it
//     to bh7 (-3644 3268 392); the client's `trig:` line counts its zone-tool boxes.
//   R surf_reverie: its tool teleport sits behind filter_momentum_surface_collision, which this game
//     does not evaluate: the server says `... is not one this game evaluates -- inert`, and a body at
//     a spawn stays there (fail-open, the box covers the map and resets everyone).
//   V surf_voyager (tool triggers ahead of 107 solids): `lump: last edict #N` equals the control's --
//     the tool triggers are re-created after the lump, so no edict renumbers (the pe digest).
cfg_save_auto 0
log_enable 1
log_dir logs
log_name runlines_smoke
con_notifytime 0
cl_idlefps 0
cl_maxfps 100
vid_vsync 0
vid_fullscreen 0
vid_width 1280
vid_height 720
sv_public 0
set run_resume 0
developer 1
log_developer 1
waitms 1500

map surf_greek
waitmap 120
waitms 5000
menu_restart
ui_close
waitms 500
echo ==== G1 inside checkpoint 0's slab ====
setpos 14048 15072 15480 0 90 0
waitms 300
cmd viewpos
waitms 1500

map bhop_cloudburst
waitmap 120
waitms 5000
menu_restart
ui_close
waitms 500
echo ==== C1 inside a tool teleport ====
setpos -2080 480 820 0 90 0
waitms 1500
cmd viewpos
waitms 500

map surf_reverie
waitmap 120
waitms 5000
menu_restart
ui_close
waitms 500
echo ==== R1 reverie: a tool teleport behind a filter this game does not evaluate stays inert ====
setpos 1948 -4259 2712 0 0 0
waitms 2000
cmd viewpos
waitms 500

map surf_voyager
waitmap 120
waitms 5000
echo ==== V1 voyager: the lump's numbering ====
waitms 500
echo RUNLINES COMPLETE
quit
