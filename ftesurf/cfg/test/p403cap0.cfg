// P403CAP0 -- Patch 403's CONTROL arm: the same harness as p403stage with
// `set run_startcap 0`, which is the shipped rule switched off.  Keeping the
// control a cvar rather than a second build means NEW and CONTROL differ by one
// number and nothing else.
//
// THE PATCH.  A trigger_push may not carry you out of a start zone above
// run_startcap u/s.  SV_StartCapClamp (sv_timer.qc, above SV_StageLaunch) is
// called from PlayerPreThink per USERCMD while the player is TS_ARMED and still
// inside run_t_armzone, and once more at the latch in SV_TimerStart.  It reads
// the EFFECTIVE horizontal speed -- .velocity plus the carrier at the cash-out's
// own scale -- and pays the excess out of the CARRIER.  .velocity is never
// written, so bhop prespeed and slope slides are untouched at any speed.
//
// WHAT THE FIRST CUT GOT WRONG, found by review and fixed before deploy:
//  - the clamp hung off SV_TimerFrame, i.e. PlayerPostThink, which the engine
//    runs once per PACKET while trigger_push re-arms once per COMMAND.  It
//    trimmed one command per bunch and the client chose the ratio by its packet
//    rate.  Now per command from PlayerPreThink (p403tick measures 74 clamps in
//    one second at cl_maxfps 100 with cl_c2spps 10 -- command rate, not the ~10
//    that a per-packet clamp would give).
//  - it had a ground gate, which was unimplementable as intended: FL_ONGROUND is
//    read after the move and after the touch loop, and BOTH a jump and any
//    upward-tilted push clear it -- so a booster exempted itself and every bhop
//    start was a structural no-op.  The gate is gone.  It protected nothing once
//    the rule stopped touching .velocity.
//  - a carrier BRAKING a player already over the cap was discarded, which RAISED
//    the start speed.  Guarded (`if (own >= sp) return;`).
//
// PRE-REGISTERED
//  C1 CONTROL (run_startcap 0) reproduces HEAD exactly: `seed ... 0 0 0 1` and
//     the first `ride ... arm` carries the booster's full 1400.
//  C2 NEW (run_startcap 290, p403stage) clamps that first arm to just under the
//     cap.
//  C3 the clamped run still verifies: pm_verify PASS (p403capverify).
//  C4 COMPATIBILITY, the one that matters for the fleet: a recording made with
//     the cap OFF must still verify under progs with the cap ON -- i.e. the
//     clamp must NOT run inside pm_verify's replay (p403compat).
// FALSIFIED IF C1 does not reproduce, or C4 gives anything but PASS.
//
// RESULT (2026-09-20, after the review fixes).  All four held.
//  C1 CONTROL: `SERVERINFO: run_startcap=0`,
//       seed ... 0 0 0 1
//       ride 0 372 arm -6.11959404e-05 1400 -0
//     and a clean ranked PB, exactly as HEAD (p403stage's RESULT).
//  C2 NEW:
//       ride 0 430 arm -1.26132345e-05 288.55722 -0      <- 1400 -> 288.56
//     288.56 * the 1.005 cash-out scale = 290.0, the cap.  The run still RANKS,
//     which is the point of a clamp rather than a taint: it happens, at a legal
//     speed.  The seed still reads velocity 0 0 0 and that is honest -- the
//     player's own velocity IS zero; the carrier is stated separately by `ride`.
//  C3 VERIFY data/runs/bhop_arcane/main/0000065_pb.rec PASS ticks 65 rows 45.
//  C4 VERIFY data/p403cap0.rec PASS ticks 64 rows 47 -- an UNCAPPED recording,
//     replayed by CAPPED progs, agrees tick for tick.  So the clamp does not run
//     inside the verifier and every recording on the board keeps its verdict.
//
// WHAT THIS ARM ALSO SHOWS, and it is the patch's boundary rather than a bug:
//   ride 1 431 arm -6.11959404e-05 1400 -0
// One command after the latch the SAME push volume re-arms its full value,
// because the fixture's start box sits inside a booster stack that continues
// past it and nothing clamps once the state is TS_RUNNING.  So the run BEGINS at
// the cap and then accelerates on the map.  Momentum's clamp stops at the zone
// edge too.  What is closed is building or inheriting speed inside the box; what
// is not closed is a booster a mapper drew across the start plane.  No map on
// the current rotation is known to do that -- p403b666 measured the one
// candidate, surf_666 bonus 3, and its restart destination arms no carrier.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p403cap0
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
sv_cheats 0
fs_missingwarn 0
set run_resume 0
set run_startcap 0
sv_port 27682

wait 200
map bhop_arcane
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 1000
zone_list

// cl_netfps stays pinned to pm_ticrate so a command is still one 10 ms tick
// (lowering it just makes ONE longer command -- measured: "cl_netfps 20 -> one
// usercmd per 50 ms").  cl_c2spps DROPS outgoing packets instead (cl_input.c:3570,
// at most 2 in a row), and QW carries the backup moves, so the packet that does go
// out holds up to 3 commands.  That is the multi-command packet.
cl_c2spps 10
waitms 200
cl_c2spps

echo ^5=== S: restart into the booster, clean ===
say !r
waitms 100
cmd viewpos
cmd timer
waitms 200
cmd viewpos
waitms 200
cmd viewpos
waitms 200
cmd viewpos
cmd timer
waitms 400
cmd viewpos
cmd timer
waitms 1200
cmd viewpos
cmd timer
waitms 2000
cmd viewpos
cmd timer

echo ^5=== L: grounded under the upward push (bonus 1) ===
cmd setpos 1535 -10700 13650 0 0 0
waitms 300
cmd viewpos
cmd timer
waitms 500
cmd viewpos
cmd timer
waitms 1500
cmd viewpos
cmd timer
waitms 2500
cmd viewpos
cmd timer
waitms 2000
cmd viewpos
cmd timer

echo ^5=== P403RIDE DONE ===
waitms 1000
quit
