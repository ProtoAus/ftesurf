// P403CAP0 -- Patch 403's CONTROL arm: the same harness as p403stage with
// `set run_startcap 0`, which is the shipped rule switched off.  Keeping the
// control a cvar rather than a second build means NEW and CONTROL differ by one
// number and nothing else.
//
// THE PATCH.  A trigger_push may not carry you out of a start zone above
// run_startcap u/s.  SV_StartCapClamp (sv_timer.qc, above SV_StageLaunch) is
// called twice: per tick while TS_ARMED and still inside the box (Momentum's own
// rule, which is a per-tick ground clamp), and once at the latch in
// SV_TimerStart above the taint chain -- the latch call is what a push volume
// reaching PAST the box needs, and bhop_arcane's stack is exactly that.
// Ground only, and it touches ONLY .run_basevel, never .velocity.
//
// WHY CARRIER-ONLY, measured: across the Pi's 43,369 grounded sample rows 16.2%
// sit at 250-299 u/s and 1.0% are above 300 (bhop landings, slope slides).
// Clamping the player's own speed would take prespeed off every bhop start.
//
// PRE-REGISTERED
//  C1 CONTROL (run_startcap 0) reproduces HEAD exactly: `seed ... 0 0 0 1` and
//     the first `ride ... arm` carries the booster's full 1400.
//  C2 NEW (run_startcap 290, p403stage) clamps that first arm to just under the
//     cap, and the seed is no longer a standing start.
//  C3 the clamped run still verifies: pm_verify PASS (p403capverify).
//  C4 COMPATIBILITY, the one that matters for the fleet: a recording made with
//     the cap OFF must still verify under progs with the cap ON -- i.e. the
//     clamp must NOT run inside pm_verify's replay (p403compat).
// FALSIFIED IF C1 does not reproduce, or C4 gives anything but PASS.
//
// RESULT (2026-09-20).  All four held.
//  C1 CONTROL: `SERVERINFO: run_startcap=0`,
//       seed 6910.74219 2738.16162 -120.360779  0 0 0 1
//       ride 0 370 arm -6.1e-05 1400 -0
//     and a clean ranked PB, exactly as HEAD (p403stage's RESULT).
//  C2 NEW:
//       ride 0 373 arm -0.549864292 288.565186 -0      <- 1400 -> 288.57
//       seed ... 0.696070373 -0.00805664062 0 1        <- no longer 0 0 0
//     effective start speed 289.3 against the 290 cap.  The run still RANKS,
//     which is the point of a clamp rather than a taint: it happens, at a legal
//     speed.  It then re-accelerates on *87/*86, which lie OUTSIDE the start
//     box -- a booster on the route during a run, which is ordinary map geometry.
//  C3 VERIFY data/runs/bhop_arcane/main/0000064_pb.rec PASS ticks 64 rows 47.
//  C4 VERIFY data/p403cap0.rec PASS ticks 64 rows 47 -- an UNCAPPED recording,
//     replayed by CAPPED progs, agrees to the last tick.  So the clamp does not
//     run inside the verifier: pm_verify replays the recorded `ride` values and
//     the live rule never touches them.  Every recording on the board keeps its
//     verdict.  This is the property the whole design was chosen for.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p403cap0
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
sv_cheats 0
fs_missingwarn 0
set run_resume 0
set run_startcap 0
sv_port 27682

wait 200
map bhop_arcane
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 1000
zone_list

// cl_netfps stays pinned to pm_ticrate so a command is still one 10 ms tick
// (lowering it just makes ONE longer command -- measured: "cl_netfps 20 -> one
// usercmd per 50 ms").  cl_c2spps DROPS outgoing packets instead (cl_input.c:3570,
// at most 2 in a row), and QW carries the backup moves, so the packet that does go
// out holds up to 3 commands.  That is the multi-command packet.
cl_c2spps 10
waitms 200
cl_c2spps

echo ^5=== S: restart into the booster, clean ===
say !r
waitms 100
cmd viewpos
cmd timer
waitms 200
cmd viewpos
waitms 200
cmd viewpos
waitms 200
cmd viewpos
cmd timer
waitms 400
cmd viewpos
cmd timer
waitms 1200
cmd viewpos
cmd timer
waitms 2000
cmd viewpos
cmd timer

echo ^5=== L: grounded under the upward push (bonus 1) ===
cmd setpos 1535 -10700 13650 0 0 0
waitms 300
cmd viewpos
cmd timer
waitms 500
cmd viewpos
cmd timer
waitms 1500
cmd viewpos
cmd timer
waitms 2500
cmd viewpos
cmd timer
waitms 2000
cmd viewpos
cmd timer

echo ^5=== P403RIDE DONE ===
waitms 1000
quit
