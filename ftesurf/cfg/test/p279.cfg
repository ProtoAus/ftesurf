// Patch 279 / build 53 -- three reports, three instruments.
//
// Lex reported, in one message:
//   1. "brush entities do not block the sprites from rendering when they should"
//   2. the spawn-area portals are "a solid glow web texture", where CS:S shows
//      them invisible until you approach, with "a mask moving diagonally" and
//      "mipmap coming in and showing you more as you get closer"
//   3. the portal particles are "very tiny and white and very inactive", where
//      Source has them "slightly bigger, blue, and expanding to white colour
//      while moving away from the center point"
//
// None of these can be settled by looking at a screenshot and saying it looks
// better, so each gets a COUNTER and a control arm.
//
// WHAT MUST BE TRUE, written before the run:
//
//  1. `sprite occluders:` must report a number well under the 622 brush
//     entities surf_tensor2 has -- 452 of those are triggers and must be
//     declined.  Expect ~161 (160 func_brush + 1 func_button).
//     Then vbsp_glare_brush 0 vs 1 must change the `hidden` count in
//     vbsp_sprite_debug.  If it does not, the occluders exist and the trace is
//     not hitting them, which is a different bug from not having them.
//
//  2. `UnlitTwoTexture material(s)` must appear with a NON-ZERO distance-fade
//     count.  4 materials, and if the fade count is 0 the proxy graph walk
//     declined every chain -- which is invisible on screen, because the shield
//     still draws, just as it did before.  shader_here must then name
//     `program "vmt/twotexture..."` with a #PROXFADE in the argument string and
//     both a `map "$2darray:..."` and an `uppermap`.
//
//  3. r_partinfo must show the three portal systems with live particles, and
//     the baked config must no longer say `scale 0` with nothing to grow it.
//
// TRAPS THIS RUN AVOIDS, all of them already recorded in this project's notes:
//   - developer is on ONLY around the load censuses; a VBSP map load is ~7x
//     slower with it on and every dprint is flushed to disk.
//   - `map <same name>` does not reload, so arm B uses vbsp_sprite_debug 2,
//     which reloads the sprite/occluder tables in place.
//   - screenshot captures one step behind, so every one is taken twice.
//   - a frozen cache is not an untraced one: arm B rebuilds the occluders
//     rather than merely flipping the cvar.

vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000

cl_maxfps 0
cl_idlefps 0
cl_yieldcpu 0
sv_cheats 1

// ---- developer ON, once, purely to capture the load censuses --------------
developer 1
log_developer 1
map surf_tensor2
waitmap 600
waitms 9000
echo ^5=== CENSUS: expect `UnlitTwoTexture material(s) at hl2_twotexture 1` and
echo ^5=== `sprite occluders: N of 622 brush entities` above this line.
waitms 1500
developer 0
log_developer 0
waitms 2000

noclip
waitms 1000

// ---------------------------------------------------------------------------
//  1. THE OCCLUDERS
// ---------------------------------------------------------------------------
// Same spawn vantage build 52 was verified at, so the numbers are comparable
// to logs/glare02.log: 244 -> 8 drawn, 233 of 241 hidden, with worldspawn only.
vbsp_glare 1
vbsp_glare_traces 300
vbsp_glare_brush 1
vbsp_sprite_debug 2
waitms 1500

echo ^5=== A1 spawn, glare_brush 1 (worldspawn + solid brush entities)
setpos -11776 -13632 13720 0 0 0
waitms 3000
vbsp_sprite_debug 1
waitms 1000

echo ^5=== A0 spawn, glare_brush 0 -- the control.  `hidden` must be LOWER or equal.
vbsp_glare_brush 0
vbsp_sprite_debug 2
waitms 2500
vbsp_sprite_debug 1
waitms 1000

echo ^5=== A2 spawn, glare_brush 2 (also func_illusionary).  occluders must RISE.
vbsp_glare_brush 2
vbsp_sprite_debug 2
waitms 2500
vbsp_sprite_debug 1
waitms 1000

vbsp_glare_brush 1
vbsp_sprite_debug 2
waitms 1500

// ---------------------------------------------------------------------------
//  2. THE COMBINE SHIELD
// ---------------------------------------------------------------------------
// The spawn portal's info_particle_system is at -11776 -10816 13744, so the
// shield brush is around there.  Approach it along +Y and probe the material.
echo ^5=== B1 close to the portal (~300 units) -- shield should be BRIGHT
setpos -11776 -11100 13744 0 90 0
waitms 2500
shader_here shieldnear
waitms 500
screenshot p279_shield_near_x
waitms 900
screenshot p279_shield_near
waitms 900

echo ^5=== B2 mid (~800 units) -- shield should be FAINT
setpos -11776 -11616 13744 0 90 0
waitms 2000
screenshot p279_shield_mid_x
waitms 900
screenshot p279_shield_mid
waitms 900

echo ^5=== B3 far (~2900 units, the spawn) -- shield should be GONE
setpos -11776 -13632 13744 0 90 0
waitms 2000
screenshot p279_shield_far_x
waitms 900
screenshot p279_shield_far
waitms 900

// The control: hl2_twotexture 0 is the old single-layer arm.  It needs a
// material reload, which a map change gives us; surf_tensor is the no-sky_camera
// map used as a control elsewhere, and going via it defeats the "map twice does
// not reload" trap.
echo ^5=== B0 control: hl2_twotexture 0, reloaded through another map
hl2_twotexture 0
map surf_tensor
waitmap 600
waitms 6000
map surf_tensor2
waitmap 600
waitms 9000
noclip
waitms 1000
setpos -11776 -11100 13744 0 90 0
waitms 2500
shader_here shieldold
waitms 500
screenshot p279_shield_off_x
waitms 900
screenshot p279_shield_off
waitms 900
hl2_twotexture 1

// ---------------------------------------------------------------------------
//  3. THE PORTAL PARTICLES
// ---------------------------------------------------------------------------
// r_partinfo prints per-effect LIVE counts plus the free list, which is the
// instrument for "are these actually emitting" -- a screenshot of something
// half a pixel across cannot answer it.
echo ^5=== C1 at the spawn portal -- r_partinfo, expect surf_tensor2_portal_blue live
setpos -11776 -11100 13744 0 90 0
waitms 4000
r_partinfo
waitms 1500
screenshot p279_particles_x
waitms 900
screenshot p279_particles
waitms 900

echo ^5=== END OF RUN ===
waitms 500
quit
