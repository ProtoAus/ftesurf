// P431LOAD -- measurement, not an arm: where a stage replay's load time goes.
// surf_rookie r47 (Proto, 8m26s, 95304 lines) from the online cache, opened whole
// and then at stage 5, with CSQC profiling on.  Read `replay: opened in` and the
// profile_csqc table in logs/p431load.log.
//
// RESULT (2026-09-22, HEAD 9d1436a csprogs): `opened in 13373 ms`; profile_csqc
//  Watch_Open self 12.879 s of 13.384 -- every QC pass together ~0.5 s (Watch_Scan
//  0.302, Watch_BuildSeq 0.201).  The self time is buf_loadfile: VFS_GETS reads a byte
//  per VFS_READ and fs_win32.c:480 maps only files up to 5 MB.  After Patch 431
//  (log p431load2 appended to p431load.log): `opened in 539 ms`, Watch_BufLoad 34 ms.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p431load
developer 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0
set run_resume 0
sv_public 0
sv_port 27677
set lobby_dir ""
set pr_enable_profiling 1

wait 200
map surf_rookie
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 1000
profile_csqc
echo ^5=== p431load open ===
replay online 47
waitms 500
profile_csqc
replay window 5
waitms 1000
replay status
replay stop
waitms 1000
quit
