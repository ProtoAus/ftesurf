// Patch 386 rig (d)(2): does the Linux hl2 plugin decode Strata's zstd VTFs (VTF 7.6 auxiliary
// compression, Patch 292)?  bhop_woodenspace mounts Momentum's mount/ (5,589 of 6,748 VTFs use it).
// Arms (Debian rig, ext4 fakesteam, rig-run.sh x11):
//   Z386  386 build 23f1ce06b (plugin eafb9af1): chroot recipe links a static libzstd
//   ZPRE  pre-386 archive build 3dd8f93c5 (plugin a9891390): same recipe
//   ZTRI  386 engine + the 2026-09-19 WSL trial plugin (d2337ed8, built without HAVE_ZSTD)
// PRE-REGISTERED 2026-09-19, before any arm ran (counts are "auxiliary compression" lines):
//   Z386 0.  ZPRE: the task expected > 0, but its plugin links ZSTD_decompress and lacks the
//   "needs a build with zstd" string, so I predict 0 (then it is not a negative control).
//   ZTRI > 0 ("needs a build with zstd"): the real negative control; if it prints 0 the
//   observable cannot see a missing zstd.
// RESULTS 2026-09-19 (ftesurf/logs/linux/p386zstd_{z386,zpre,ztri,w}.log), "auxiliary compression":
//   Z386 0 and ZPRE 0 (as I predicted; the pre-386 archive build is no control), ZTRI 4 -- "needs a
//   build with zstd" for models/Cliffs/Rocks02.vtf and props_foliage/rocks_vegetation.vtf, 160
//   images failed vs 158.  Windows 0.  All four: hl2_unresolved 0, 18 searchpaths.
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
developer 1
log_developer 1
fs_loadstats 1
waitms 3000
echo ======== P386CASE setup
fs_cache
echo ======== P386CASE map bhop_woodenspace
map bhop_woodenspace
waitmap 180
waitms 15000
echo ======== P386CASE report bhop_woodenspace
mapname
hl2_unresolved
hl2_unresolved_visible
r_imagelist
echo ======== P386CASE end bhop_woodenspace
echo ======== P386CASE done
quit
