// SLIDE03 -- Patch 280, the four flat *8 arms of slide02 again at a spot the hull is proven
// free on.  slide02 probed *8 at 6368 3500 1154 and every arm froze there (z 1154.0, vel_z
// -6, no fall, no walk, pm_slide 0 included): an embedded probe, not a slide result.
// slide01's D0 came to rest on *8 at 7008 3171.2 1152 (onground 1) and E0 walked from it, so
// 7008 3200 1154 is proven clear: only *8 contains it (entnear.py, r 400; *6 and the
// trigger_setspeed *14 sit 300 units away and do not contain the point).
// EXPECT: F1 (pm_slide 1) rest onground 0 speed 0 under func_slide skin -32, +jump does nothing
// (allowjump 0); F0 (pm_slide 0) rest onground 1, +jump gives vel_z > 0; E1 speed2d <= ~30
// onground 0 x advanced 15-25; E0 speed2d ~250 onground 1 x advanced 100+.
log_enable 1
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
con_notifylines 0
developer 1
log_developer 1

wait 200
map surf_mom_training
waitmap 120
waitms 8000
sv_cheats 1
waitms 400
pm_dispprobe 0
pm_ladderprobe 0

echo ^5=== F1: pm_slide 1, flat *8 allowjump 0 at 7008 3200: rest (onground 0, speed 0) then +jump must NOT jump ===
pm_slide 1
waitms 300
setpos 7008 3200 1154 0 0 0
waitms 1200
cmd viewpos
cmd run_slideinfo
waitms 300
cmd run_slideinfo
+jump
waitms 100
-jump
cmd run_slideinfo
waitms 250
cmd run_slideinfo
waitms 800

echo ^5=== F0: pm_slide 0, flat *8: rest (onground 1) then +jump jumps (control) ===
pm_slide 0
waitms 300
setpos 7008 3200 1154 0 0 0
waitms 1200
cmd viewpos
cmd run_slideinfo
+jump
waitms 100
-jump
cmd run_slideinfo
waitms 250
cmd run_slideinfo
waitms 800

echo ^5=== E1: pm_slide 1, flat *8, +forward 700ms (air cap: speed2d <= ~30, onground 0) ===
pm_slide 1
waitms 300
setpos 7008 3200 1154 0 0 0
waitms 1200
cmd viewpos
+forward
waitms 700
cmd run_slideinfo
-forward
waitms 300
cmd run_slideinfo
waitms 800

echo ^5=== E0: pm_slide 0, flat *8, +forward 700ms (walk: speed2d ~250, onground 1) ===
pm_slide 0
waitms 300
setpos 7008 3200 1154 0 0 0
waitms 1200
cmd viewpos
+forward
waitms 700
cmd run_slideinfo
-forward
waitms 300
cmd run_slideinfo
waitms 800

echo ^5=== slide03 done ===
pm_slide 1
wait 30
quit
