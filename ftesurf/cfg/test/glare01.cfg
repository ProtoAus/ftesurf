// Build 52 -- the light glares. Does the trace actually gate them?
//
// THE FEATURE.  An additive billboard sprite is a light glow, so it is now drawn
// with no depth test (over the world) and its visibility comes from a traceline
// to its centre, ramped over 50ms. Source's CGlowOverlay, same constants.
//
// THE RISK IS THE OPPOSITE OF THE OLD BUG, and it is worse. Before, a glow was
// SLICED by geometry. Now it is drawn through everything unless the trace says
// otherwise -- so if the trace is broken or never runs, every glow on the map
// shines through every wall. That is what these arms are for; the pretty
// screenshot is the least interesting one.
//
//   A  vbsp_glare 1                the feature
//   B  vbsp_glare 0                exactly the old behaviour, byte for byte
//   C  vbsp_glare 1, traces 0      traces frozen: nothing new is ever traced,
//                                  so every glow must sit at its start value.
//                                  Since untraced glows START HIDDEN, arm C
//                                  should show NO glows at all. If it shows
//                                  them, the trace is not what is gating them
//                                  and the feature is decorative.
//
// Vantages are chosen so at least one glow is behind solid world in one of them.
// Read the screenshots against each other, not against memory.

developer 0
log_developer 0
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000

cl_maxfps 0
cl_idlefps 0
cl_yieldcpu 0
sv_cheats 1

map surf_tensor2
waitmap 600
waitms 9000
r_speeds 2
noclip
waitms 1000

// ---- vantage 1: the spawn, which has a bright glow in frame ---------------
setpos -11776 -13632 13720 0 0 0
waitms 2500

echo ^5=== A1 spawn, vbsp_glare 1 (traced, over the world)
vbsp_glare 1
vbsp_glare_traces 64
waitms 2500
r_speeds_dump
waitms 400
screenshot glare_A1_x
waitms 900
screenshot glare_A1
waitms 900

echo ^5=== B1 spawn, vbsp_glare 0 (old behaviour -- sliced by geometry)
vbsp_glare 0
waitms 2000
r_speeds_dump
waitms 400
screenshot glare_B1_x
waitms 900
screenshot glare_B1
waitms 900

echo ^5=== C1 spawn, glare on but traces FROZEN -- expect NO glows
vbsp_glare 1
vbsp_glare_traces 0
waitms 3000
screenshot glare_C1_x
waitms 900
screenshot glare_C1
waitms 900
vbsp_glare_traces 64
waitms 2000

// ---- vantage 2: stage 5, the wall glow seen in p273b_stage5.png ----------
setpos 6624 -6955 11472 0 0 0
waitms 3000
echo ^5=== A2 stage 5, glare on
vbsp_glare 1
waitms 2500
screenshot glare_A2_x
waitms 900
screenshot glare_A2
waitms 900
echo ^5=== B2 stage 5, glare off
vbsp_glare 0
waitms 2000
screenshot glare_B2_x
waitms 900
screenshot glare_B2
waitms 900
vbsp_glare 1
waitms 1500

// ---- cost: does 263 sprites x a traceline show up at all? ----------------
echo ^5=== D cost, traces 64 vs 0, same vantage
setpos -11776 -13632 13720 0 0 0
waitms 2500
vbsp_glare_traces 64
waitms 2500
r_speeds_dump
waitms 400
vbsp_glare_traces 0
waitms 2500
r_speeds_dump
waitms 400
vbsp_glare_traces 8
waitms 500

echo ^5=== END OF RUN ===
waitms 500
quit
