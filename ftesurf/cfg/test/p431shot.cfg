// P431SHOT -- Patch 431, the chrome in a cut: title `Proto   stage 5`, clock
// in stage time (negative in the 1 s lead-in), the bar spanning the cut, and the
// `whole run` label left of `skip still`; then `replay cut 0`: the run's own title
// and clock, and the label reads `stage 5 only`.  Screenshots p431shot_cut/_whole.
//
// RESULT (2026-09-22; screenshots/screenshots/, the cfg's path is under the engine's
//  screenshots dir): cut2 reads `0:02.275 / 0:04.140` at t 35.5, the playhead 64% along
//  the bar and the amber stage-start mark at 19%, `whole run` left of `skip still`, one segment row;
//  whole reads `0:35.490 / 8:26.580`, `stage 5 only`, `skip still (7)`, 10 rows.  The
//  first cut shot's title also carried the stage time beside the clock's; dropped.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p431shot
developer 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0
set run_resume 0
sv_public 0
sv_port 27682
set lobby_dir ""
set hud_watch_skipidle 0
set hud_watch_path_ahead 1

wait 200
map surf_rookie
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 1000
replay online 47 5
replay pause
replay seek 32.5
waitms 1500
screenshot screenshots/p431shot_cut.png
waitms 500
replay seek 35.5
waitms 1500
screenshot screenshots/p431shot_cut2.png
waitms 500
replay cut 0
waitms 1500
screenshot screenshots/p431shot_whole.png
waitms 500
replay stop
quit
