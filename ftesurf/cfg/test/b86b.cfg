// BUILD 86 arm B -- the PB pace colour on the RUNNING clock.
//
//   ftesurf64.exe -WindowStyle Minimized +exec cfg/test/b86b.cfg
//
// b86a could only show the latch's value (`cl pace: 0`); the clock there was
// ARMED (grey) and then CHEATED (red, because setpos), so neither shot proved
// the pace branch is reached at all.  This does.
//
// WHAT IS REACHABLE HEADLESSLY, and what is not, stated up front:
//
//   the GREEN half   yes.  A run on a leg that HAS a pb starts "not behind
//                    anything", which is the pace the request describes as the
//                    starting state, and starting the clock is one +jump.
//   the cvar gate    yes.  hud_timer_pace 0 must put the clock back to white
//                    with everything else identical -- which is also the proof
//                    that the green above is the PACE branch and not some other
//                    rule that happens to be green.
//   the RED half     NO.  Red needs a gate crossing whose delta says behind,
//                    and a stage boundary is three thousand units of bhop away
//                    -- a teleport to it aborts the run (SV_TimerAbort is called
//                    by every chat command and zone_goto).  That half is a human
//                    run on a map you hold a pb on.
//
// bhop_eazy leg 2 because the timer prints `pb 0:07.710` there, i.e. TF_HAVEPB
// is set -- which is the gate the pace gets asked for at all.

cfg_save_auto 0
log_enable 1
log_dir logs
log_name b86b
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
vid_width 1280
vid_height 720
fs_missingwarn 0
developer 1
log_developer 1

set hud_scale          2
set hud_timer          1
set hud_timer_pace     1
set hud_splits         1
set hud_seq            1
set hud_energy_ref     1

wait 400
map bhop_eazy
waitmap 120
menu_restart
waitms 500
ui_close
waitms 800

echo ""
echo "^5=== b86b: the FULL run, which starts at the map's own start box ==="
echo "^5=== (best 0 0 = 0:49.760 on this map, so TF_HAVEPB is set) ==="
say !m
waitms 1200
cmd viewpos
waitms 300
timer
waitms 300
echo "--- (want: armed, a pb, cl pace 0 -- nothing crossed yet) ---"
echo ""

/*
  WALK OUT, DO NOT HOP OUT, and two failed attempts are the reason.

  The clock starts when you LEAVE THE START BOX (a no-jump start is legal -- see
  SV_TimerStartRule: "grounded for the dwell -- you walked out and are simply
  walking").  Holding +jump hops you in place: arm A travelled EIGHTY units in
  four seconds of +forward +jump, which is nowhere near out of the box, so the
  timer sat at ARMED with `jumps 0` both times.  Walking is ~250 u/s and clears
  it in well under a second.
*/
echo "^5=== start the clock by WALKING out of the start box ==="
waitms 1600
+forward
waitms 1200
cmd viewpos
waitms 1200
cmd viewpos
waitms 1200
cmd viewpos
waitms 1200
-forward
waitms 600
cmd viewpos
waitms 300

echo "^5--- shot 1: RUNNING with hud_timer_pace 1 -- the clock must be GREEN ---"
echo "^5--- (build 85 drew a flat white clock here; white now = pace never read) ---"
timer
waitms 300
screenshot b86b_1_pace_on
waitms 700
echo ""

echo "^5=== the same clock with the switch off -- must go back to WHITE ==="
set hud_timer_pace 0
waitms 500
screenshot b86b_2_pace_off
waitms 700
timer
waitms 300
echo "--- (want: cl pace unchanged, cvar 0.  The LATCH does not move; the ---"
echo "---  COLOUR does -- which is what makes shot 1's green the pace branch) ---"
echo ""

set hud_timer_pace 1
waitms 400
echo "^5=== b86b done -- compare b86b_1_pace_on (green) and b86b_2_pace_off (white) ==="
waitms 800
quit
