// PATCH 373 -- pm_verify replays a ghost window.  `ghost` was a blanket REFUSE;
// one live v9 run carried one (surf_derpis 16195, Kap, 2026-09-18).
//
//   cd C:\FTESurf; C:\FTEQuake\fteqwsv64.exe +set sv_public 0 +set sv_port 27699
//     +set log_enable 1 +set log_dir logs +set log_name p373verify +set rec_enable 0
//     +set lobby_master "" +map surf_derpis +exec cfg/test/p373verify.cfg
//
// SUBJECT  data/p373/derpis.rec (untracked): the Pi's REFUSE "a ghost window".
//   One window, 401 packets, body standing still, rows empty from the first.
// CENSUS: both `ghost` lines sit after a sample and before the next `in` row.
// DERIVED, one edit each:
//   N1 n1late.rec     `ghost 0` moved below the next row and its sample
//   N2 n2noopen.rec   `ghost 1` removed        N3 n3noclose.rec  `ghost 0` removed
//   N4 n4steer.rec    speed bit on row 200 of the window (it was already empty)
//   P5 p5lag.rec      speed bit on the window's first 3 rows (the RTT lag)
//   N6 n6late.rec     speed bit on the window's first 80 rows (past 1 s)
//   N7 n7pe.rec       the 16176 `pe` digest xor 1 (trajectory untouched)
//   N8 n8move.rec     forwardmove 450 on row 200 of the window
//
// PRE-REGISTERED
//   1  derpis PASS ticks 16195 rows 16195, "ghost 2 edge(s), 401 ... skipped",
//      restarts 23 of 23; a physents note (9 rows at the finish), not a HOLD.
//   2  N1 HOLD "ghost at row ...: the file says tick 7080, the trace 7081".
//   3  N2 REFUSE "`ghost 0` with no window open"; N3 REFUSE "open at the finish".
//   4  N4 HOLD "ghost: input at row 6879, 200 ticks ..."; P5 PASS; N6 HOLD
//      "input at row 6746, 67 ticks" (the window opens at row 6679; 1 s / 0.015).
//   5  N7 PASS with the physents note (rows 16176-16194); N8 HOLD "state".
//   6  Control (p373ctl.cfg, the 369 binary): derpis REFUSE "a ghost window".
// FALSIFIED IF derpis is not PASS at 16195, N1-N6 or N8 PASS, or P5/N7 HOLD.
// Regression: p369verify, p367verify, p356newer unchanged.
echo ================================ P373 S derpis
pm_verify data/p373/derpis.rec
echo ================================ P373 N1 late
pm_verify data/p373/n1late.rec
echo ================================ P373 N2 no open
pm_verify data/p373/n2noopen.rec
echo ================================ P373 N3 no close
pm_verify data/p373/n3noclose.rec
echo ================================ P373 N4 steer
pm_verify data/p373/n4steer.rec
echo ================================ P373 P5 lag
pm_verify data/p373/p5lag.rec
echo ================================ P373 N6 late input
pm_verify data/p373/n6late.rec
echo ================================ P373 N7 pe
pm_verify data/p373/n7pe.rec
echo ================================ P373 N8 move
pm_verify data/p373/n8move.rec
echo ================================ P373 done
quit

