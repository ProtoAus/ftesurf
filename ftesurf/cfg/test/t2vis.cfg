// surf_tensor2 -- the MECHANISM, not the correlation.
//
// t2perf.cfg established the cost (236 -> 545 fps with vbsp_skyroom 0, draw
// indices 304,787 -> 12,605).  That is a correlation between a switch and a
// framerate.  This run is the one line that says WHY:
//
//   [world] recurse %i: area %i cluster %i vis %s -> %i meshes in %i batches
//                                                        (r_surf.c:3994)
//
// Expect TWO lines per frame for the first 16 views:
//   recurse 0 ... vis yes  -> a few hundred meshes   (the real view)
//   recurse 1 ... vis NONE -> ~29,796 meshes         (the skyroom pass)
//
// log_developer 1 is the point of this file.  Con_DPrintf reaches the CONSOLE
// on `developer 1` but does NOT reach the log without log_developer -- which is
// why t2perf.cfg captured none of these despite setting developer 1.
developer 1
log_developer 1

vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000

cl_maxfps 0
cl_idlefps 0
cl_yieldcpu 0

map surf_tensor2
waitmap 600
waitms 5000

echo ^5=== the [world] lines above are the answer ===

// And the control: same engine, same session, a map with no sky_camera at all.
// It must print ONLY `recurse 0`.
map surf_tensor
waitmap 600
waitms 5000
echo ^5=== surf_tensor (no sky_camera): recurse 1 must be ABSENT ===

waitms 500
quit
