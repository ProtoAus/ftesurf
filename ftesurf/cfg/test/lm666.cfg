// LM666 -- why do dev/dev_concretefloor006a and brick/brickwall004a look
// fullbright on surf_666?
//
// Established offline, so this config does not need to re-establish it:
//   * both materials' VMTs are plain LightmappedGeneric with only $basetexture
//   * their BSP faces carry texinfo flags 0x0000, styles [0,255,255,255] and a
//     valid lightofs -- 3 of 2838 and 0 of 3866 faces lack one
//   * lump 8 (LDR lighting) is 9.9 MB, lump 53 (HDR) is EMPTY: LDR only
//   * decoding lump 8 at the two probed faces gives mean linear luminance
//     0.013 and 0.052, peak 0.074.  The map is DARK there.
//   * shader_here already reports usage=lightmapped, i.e. FTE has set
//     SUF_LIGHTMAP on the shader (view.c:2200), so the shader is not the issue
//
// So the BSP says dim and the screen says bright.  Three shots separate the
// three ways that can happen, and they are mutually exclusive:
//
//   b_lightmaponly  r_lightmap 1 -- draws the lightmap with no albedo.
//                   WHITE  => no lightmap texture is reaching the surface.
//                   DARK/varied => the data is bound and something later
//                   multiplies it back up.
//   c_fullbright    r_fullbright 1 -- forces every world lightmap to full.
//                   IDENTICAL to the baseline => the surface was ALREADY
//                   unlit, which is the whole report.
//   e_nooverbright  gl_overbright 0 -- if the baseline is simply the lightmap
//                   scaled too hard, this is where it goes dark.
//
// Vantage is the user's own save005 (data/saves/surf_666/save005/state.txt),
// created 20260906-152441, eight seconds before surf_666_000.png -- so this is
// the exact frame they were looking at, not a reconstruction.
//
// developer drops to 0 before each screenshot: the notify overlay dominated a
// pixel diff in the Patch 250 emissive run.  log_developer 1 keeps the log full.

log_enable 1
log_dir "logs"
log_name "lm666"
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 0
vid_fullscreen 0
developer 1
log_developer 1
con_notifytime 0
con_notifylines 0
con_notifytime_error 0

wait 200

map surf_666
waitmap 1800
waitms 9000
sv_cheats 1
waitms 500
// noclip FIRST.  setpos teleports but does not change movetype, so the first run
// of this config dropped the player in mid-air at the save's origin, they fell,
// hit a reset trigger and were back at the map start (-11520 -13536 15361) two
// seconds later -- shader_here then reported stone/marblefloor001b at the spawn
// and the screenshot was of the wrong room entirely.
noclip
waitms 500
setpos -100.325 -13112.070 11281.580 3.148 -130.446 0
waitms 2500

echo ^5=========== A: baseline, as shipped ================================
shader_here lm666-A
waitms 500
developer 0
waitms 2500
screenshot lm666_a_base
waitms 900

echo ^5=========== B: r_lightmap 1 -- the lightmap with no albedo =========
r_lightmap 1
waitms 4000
screenshot lm666_b_lightmaponly
waitms 900

echo ^5=========== C: r_fullbright 1 -- forced fully lit ==================
r_lightmap 0
waitms 2000
r_fullbright 1
waitms 4000
screenshot lm666_c_fullbright
waitms 900

echo ^5=========== D: back to baseline (proves C actually changed state) ==
r_fullbright 0
waitms 4000
screenshot lm666_d_base2
waitms 900

echo ^5=========== E: gl_overbright 0 ====================================
gl_overbright 0
waitms 4000
screenshot lm666_e_nooverbright
waitms 900
gl_overbright 1
waitms 2000

echo ^5=========== F: second vantage, looking at the other probe ==========
setpos -1408 -13300 11300 20 -90 0
waitms 2500
developer 1
shader_here lm666-F
waitms 500
developer 0
waitms 2000
screenshot lm666_f_probe2
waitms 900

echo ^5=== lm666 done ===
wait 30
quit
