// Patch 418 -- EVIDENCE RETENTION REACHES MAPS THAT ARE NOT LOADED.
//
// `SV_EvidenceSweep` only ever globbed `data/evidence/<mapname>/`, so a map
// that dropped out of rotation kept its recordings, receipts and uploaded
// sidecars forever and `run_evidence_days` silently stopped being the retention
// this server states.  With receipts that was ~500 bytes a run; with Patch
// 418's uploads it is a few hundred KB a run.
//
// The fix sweeps the loaded map's directory at every init (as before) and the
// WHOLE TREE once a day, stamped in `localinfo fs_evswept` -- but only where
// `run_evidence_sweepall 1` says so, and that gate is the second half of the
// fix rather than a decoration.  The tree is shared by twelve lobbies, so a
// whole-tree sweep applies THIS process's `run_evidence_days` to every other
// lobby's evidence: one practice server set to 1 would reap the ranked lobbies
// a day after they recorded.  Exactly one process gets the switch.
//
// Run it headless from C:\FTESurf, twice -- the second run is the control:
//   C:\FTEQuake\fteqwsv64.exe +set sv_port 27698 +set sv_public 0
//     +set developer 1 +set run_evidence_days 30 +set run_evidence_sweepall 1
//     +set log_enable 1 +set log_dir logs +set log_name p418sweep
//     +map bhop_eazy +exec cfg/test/p418sweep.cfg
//   ...and the same line with `+set run_evidence_sweepall 0`.
//
// PRE-REGISTERED PREDICTIONS
//  S1  THREE map inits log THREE per-map sweeps (`data/evidence/bhop_eazy/*.*`)
//      and exactly ONE whole-tree sweep (`data/evidence/*/*.*`).  The gate is
//      the point: without it, twelve lobbies walk the shared tree at every map
//      change.
//  S2  the whole-tree sweep CONSIDERS at least as many files as the per-map one
//      -- i.e. the `*/*` glob really does descend into the map directories.
//      (FTE's search wildcards are not obviously supposed to cross a `/`; this
//      arm exists because that had to be measured rather than assumed.)
//  S3  `localinfo` afterwards shows `fs_evswept <today>`, and it is NOT in
//      serverinfo -- a housekeeping stamp is not something clients are told.
//  S4  CONTROL: the same arm with `run_evidence_sweepall 0` logs the three
//      per-map sweeps and NO whole-tree sweep, and writes no localinfo stamp.
//      Without this arm, "the tree was swept" is also what a build that ignored
//      the switch would produce -- and that switch is what keeps one lobby's
//      retention from deciding another's.
// FALSIFIED IF the whole-tree sweep runs more than once, if it considers zero
//   files, if the key turns up in serverinfo, or if the control sweeps at all.
//
// NOTE ON THE FIRST ATTEMPT: `+map a +map b +map c` on the command line does
// NOT test this.  All three are in the command buffer before the first init
// runs, and the `localinfo` the sweep appends lands behind them -- so every
// init reads an empty stamp and the gate looks broken when it is not.  The
// waits below are load-bearing.
developer 1
set run_evidence_days 30

waitms 4000
map bhop_eazy
waitms 6000
map bhop_eazy
waitms 6000
localinfo
serverinfo
waitms 2000
quit

// RESULT (2026-09-21, logs/p418sweep3.log, 29 files in the tree).  SUPERSEDED
// by the run below -- a third review added the `run_evidence_sweepall` gate, so
// the version this passed against is not the version that ships.
//   ALL THREE HELD.
//   S1  three `data/evidence/bhop_eazy/*.*` sweeps at 06:31:43, :48 and :55,
//       and one `data/evidence/*/*.*` sweep, at the first init only.
//   S2  the whole-tree sweep considered 29 files -- the same 29 -- so FTE's
//       search wildcard DOES descend through the map directory.  Only one map
//       directory exists on this disk, so this shows the glob works, not that
//       it reaches a map out of rotation; that follows from the pattern.
//   S3  `Local info settings: fs_evswept 20260921`, and the serverinfo dump
//       three lines later does not contain the key.
//
//   AND TWO GATES THAT DID NOT WORK, in the order they were tried:
//   - an SSQC global: reset by the map load.
//   - a cvar set from `localcmd`: the full sweep still ran at every init.  A
//     cvar the gamecode creates is purged when the progs are freed, so the read
//     came back 0 every time.
//   localinfo survives both, because it lives in `svs`, which the map change
//   does not touch.

// RESULT (2026-09-21, logs/p418sweepA.log and p418sweepB.log, 44 files):
//   ALL FOUR HELD on the shipping build.
//   S1  `run_evidence_sweepall 1`: three per-map sweeps (07:08:15, :20, :27)
//       and exactly one whole-tree sweep, at the first init.
//   S2  the whole-tree sweep considered 44 files, the same as the per-map one.
//   S3  `Local info settings: fs_evswept 20260921`; the serverinfo dump below
//       it does not carry the key.
//   S4  `run_evidence_sweepall 0`: three per-map sweeps, ZERO whole-tree
//       sweeps, no stamp written.  The switch is the switch.
