// Patch 418 -- THE CLIENT HALF of the evidence upload.  Needs p418sv.cfg's
// dedicated server already up on 27696.
//
//   ./ftesurf64.exe -WindowStyle Minimized +exec cfg/test/p418cl.cfg
//
// The route is b352fin.cfg's, as every arm in this family is: the one scripted
// walk that reaches bhop_eazy's END zone.  What is different is that the .rec
// is on the OTHER PROCESS, which is the only condition under which any of this
// code runs at all.
//
// PRE-REGISTERED PREDICTIONS
//  U1  the client STAGES its sidecar instead of dropping it: a
//      `data/staged/<nonce>.view` appears, and the log says `staged`.  Before
//      this patch the same run printed `sidecar dropped -- this run's .rec is
//      on the server`.
//  U2  the server ends up with `data/evidence/bhop_eazy/<runid>.view`, and its
//      SHA-256 equals the `signed view` line of the receipt for that same
//      runid.  That is the whole point: what arrived is what was committed to.
//  U3  the receipt verifies (rcptcheck), and its `signed view` is not `-`.
//  U4  the uploaded file is a well-formed sidecar -- `FTESURF-VIEW 2` and the
//      same frame count the client wrote.
//  CONTROL: `rec_upload 0` on the client, same route, and the server gets
//      NOTHING -- the staging file is not written and the receipt says
//      `view -`.  Without that arm, "a file appeared" is also what a server
//      that took it without asking would produce.
// FALSIFIED IF nothing is staged, if the server's copy differs from the
//   signed digest, or if the control arm still uploads.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p418cl
developer 1
cl_idlefps 0
cl_maxfps 100
set rec_enable 1
set rec_hid 1
set rec_upload 1
name "^3P418"

waitms 6000
connect 127.0.0.1:27696
waitms 12000

echo ================================ P418 CL -- aim and start
cmd zone_goto 0
waitms 1500
setpos -352 -352 144 0 335.3 0
waitms 1500
+jump
waitms 700
-jump
waitms 2000
cmd timer

echo ================================ P418 CL -- fly to the end zone
noclip
waitms 500
+forward
waitms 1500
waitms 2900
waitms 2000
-forward
waitms 1500
cmd timer
waitms 3000

echo ================================ P418 CL done
waitms 1000
quit

