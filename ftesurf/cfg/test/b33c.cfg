// Build 33 -- the four pages, legibly.
//
// b33a proved the behaviour and shot the pages too, but its own `gfx_menu
// status` output was still sitting in the notify area when the shutter went, so
// the menu was drawn over four hundred characters of console text.  The check
// was sound and the picture was not, and the picture is the artifact a person
// actually looks at.
//
// `clear` immediately before each shot is the whole fix.  con_notifytime 0 does
// not do it: a print still reaches the notify area, 0 only governs how long it
// lingers, and "lingers for zero seconds" is not evaluated between two console
// commands issued in the same frame.
//
// One state is set up on purpose before shooting page 1: water on Dithered and
// Dither level at 55%, so that page carries a LIVE row and a GREYED row side by
// side.  A page of all-live rows would prove the menu draws; this proves the
// two states are distinguishable at a glance, which is the actual claim.

log_enable 1
log_name b33c
developer 0
scr_conalpha 0
con_notifytime 0
cl_idlefps 0
scr_sshot_type png
cfg_save_auto 0

waitms 2000
echo ^5=== b33c: clean page shots ===

map surf_null
waitmap 240
wait 60

hl2_water 3
hl2_dither_force 0.55
waitms 500

gfx_menu page 1
waitms 400
clear
waitms 200
screenshot
waitms 500

gfx_menu page 2
waitms 400
clear
waitms 200
screenshot
waitms 500

gfx_menu page 3
waitms 400
clear
waitms 200
screenshot
waitms 500

gfx_menu page 4
waitms 400
clear
waitms 200
screenshot
waitms 500

gfx_menu
waitms 300
echo ^5=== b33c done ===
wait 30
quit
