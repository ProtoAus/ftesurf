// P468REACT -- which beats the milk visuals answer to (src/milk_sys.qc, milk_kick /
// milk_hit).  Plays each generated track ~30 s with snd_vis_trace 2 (one line per
// analysis), split by REACT_TRACK markers; `python tools/p468react.py LOG` replays
// the trace through the QC's kick/snare gates and counts what fires, per track.
// Tracks: `python tools/mkmusic.py`.  Music at a whisper: the analysis is
// level-normalised and taps before nothing but musicvolume*mastervolume.
// Launch (PowerShell): Start-Process ftesurf64.exe -WorkingDirectory C:\ftesurf -WindowStyle Minimized
//   -ArgumentList '+set cfg_save_auto 0 +set s_inactive 1 +exec test/p468react.cfg'
cfg_save_auto 0
set log_dir logs
set log_name p468react
set log_enable 1
exec cfg/test/_quiet.cfg
set cl_idlefps 0
set cl_maxfps 100
set s_inactive 1
set volume 0
set mastervolume 1
set musicvolume 0.02
set snd_vis 1
set snd_vis_rate 120
set snd_vis_latency -1
set snd_fx_lowpass 0
wait 100
set snd_vis_trace 2
echo REACT_TRACK ftesurf_drive
music ftesurf_drive
wait 1500
echo REACT_TRACK ftesurf_dream
music ftesurf_dream
wait 1500
echo REACT_TRACK ftesurf_monolith
music ftesurf_monolith
wait 1500
echo REACT_TRACK ftesurf_vessel
music ftesurf_vessel
wait 1500
echo REACT_TRACK ftesurf_canopy
music ftesurf_canopy
wait 1500
echo REACT_TRACK ftesurf_void
music ftesurf_void
wait 1500
set snd_vis_trace 0
echo REACT_DONE
quit
