// P394B -- Patch 394's centre rule on maps whose relative triggers are not stage
// boxes, and the +1 lift.  Listen server; run NEW and CONTROL (+set sv_progs
// qwprogs394ctl) with +set log_name, as p394a.
//
// PRE-REGISTERED (BSP brush geometry, before running)
//  S1 surf_sirius, `cmd setpos 2000 800 -1030`: NEW rests at xy (-384,-832),
//     z about -512; CONTROL at xy (336,-32).
//  S2 surf_sirius, `cmd setpos -2900 14500 -3600`: NEW the same point as S1
//     (all three triggers land on one spot); CONTROL xy (-212,-668).
//  S3 bhop_collective, `cmd setpos 20 1250 70`, viewpos 300 ms later: NEW x 0.0,
//     y 2824.0 (landing xy no longer depends on where you entered); CONTROL x 20,
//     y about 2810.
//  S4 surf_excavation `!s 1`: NEW prints "telerel: ... lifted 1" (the landing is
//     exactly on the floor) and rests at (-14960,15072,15104) with startsolid 0.
//  S5 surf_board_this `!b 2`: NEW y 13412; CONTROL y 13400.
//  (Run 1: cmd replies land 1-2 s late and a map change swallowed S2/S4/S5;
//  run 2 waits 2.5 s after each reply.)
// FALSIFIED IF any NEW row misses by more than 0.5 u (z by more than 1), or a
// CONTROL row does not differ where predicted.
//
// RESULT (2026-09-20, run 2; run 1 lost S2/S4/S5 to late replies).
//   S1 NEW (-384,-832,-512); S2 NEW the same point.  CONTROL (-1328,-864,-1494)
//     and (-1876,-1500,-1480): different from NEW, not the predicted coordinates
//     (the old rule lands you elsewhere and you fall).  HELD in substance.
//   S3 NEW (0.0,2824.0); CONTROL (20.0,2810.0).  HELD.
//   S4 both arms rest at the destination (-14960,15072,15104), startsolid 0; no
//     "lifted" line: the landing was not solid, so the guard never fired.
//     FALSIFIED as to the lift; the landing itself is right.
//   S5 NEW y 13398.7, CONTROL y 13400.4: both at the !b 2 destination -- the box
//     did not fire in either arm.  FALSIFIED (predicted 13412); no difference.
cfg_save_auto 0
log_enable 1
log_dir logs
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
sv_cheats 1
fs_missingwarn 0
set run_resume 0
sv_port 27681

wait 200
echo ^5=== p394b S1/S2 surf_sirius ===
map surf_sirius
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 1000
echo ^5=== p394b S1 ===
cmd setpos 2000 800 -1030
waitms 2000
cmd viewpos
cmd stuck
waitms 2500
echo ^5=== p394b S2 ===
cmd setpos -2900 14500 -3600
waitms 2000
cmd viewpos
cmd stuck
waitms 2500

echo ^5=== p394b S3 bhop_collective ===
map bhop_collective
waitmap 1800
waitms 3000
echo ^5=== p394b S3 ===
cmd setpos 20 1250 70
waitms 300
cmd viewpos
waitms 1500
cmd viewpos
waitms 2500

echo ^5=== p394b S4 surf_excavation ===
map surf_excavation
waitmap 1800
waitms 3000
echo ^5=== p394b S4 ===
say !s 1
waitms 1500
cmd viewpos
cmd stuck
waitms 2500

echo ^5=== p394b S5 surf_board_this ===
map surf_board_this
waitmap 1800
waitms 3000
echo ^5=== p394b S5 ===
say !b 2
waitms 1500
cmd viewpos
cmd stuck
waitms 2500
echo ^5=== p394b DONE ===
waitms 500
quit
