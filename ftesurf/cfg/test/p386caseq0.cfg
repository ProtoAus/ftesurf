// Patch 386 rig (d)(2): p386caseq.cfg (no r_imagelist) with fs_cache switched off AFTER boot -- the case-only
// negative control.  Run with +set fs_cache 1.  Found in the first L0 arm: with fs_cache 0 from
// boot no VPK is ever mounted (6 searchpaths, not 12), because the hl2 plugin registers "vpk"
// after the first mount and the deferred pack reload runs only inside FS_RebuildFSHash, which
// fs_cache 0 never calls (fs.c:2235 FS_ReloadPackFilesFlags, gated at :4709/:4754).  Booting with
// the hash and dropping it here keeps every VPK mounted while every lookup skips the case-
// insensitive hash, so the extra misses are exactly the case-dependent loose lookups.
// Predictions are p386case.cfg's P2 (L0x) and P3 (D0x).
fs_cache 0
exec cfg/test/p386caseq.cfg
