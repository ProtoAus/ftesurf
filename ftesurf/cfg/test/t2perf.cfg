// ***************************************************************************
//  surf_tensor2 -- where the frame actually goes.
//
//  THE CLAIM UNDER TEST, from reading mod_vbsp.c and the map's own VIS lump:
//
//    R_DrawSkyroom recurses (gl_warp.c:355) and clears forcevis/forcedvis
//    (:361,:364).  VBSP_MarkLeaves bails on ANY recursed view
//    (mod_vbsp.c:6398 -- `else if (portal || ...) return NULL;`), and
//    VBSP_PrepareFrame answers a NULL vis by emitting EVERY surface in the
//    world model (mod_vbsp.c:6591-6601), with no PVS, no frustum, no area.
//
//    Computed offline from the map's VIS lump:
//       PVS at the spawn ................  1,063 of 29,796 world faces (3.6%)
//       PVS at the sky_camera ...........     30 of 29,796          (0.1%)
//       what the skyroom pass emits .....  29,796                   (100%)
//
//    So the skyroom pass should draw 30 faces and draws 29,796 -- 993x, and
//    28x the main view's own geometry, every frame.
//
//  WHAT WOULD FALSIFY IT.  Any of these kills the diagnosis outright:
//    * `vbsp_skyroom 0` does not move the framerate much
//    * the [world] recurse 1 line says `vis yes`, or reports few meshes
//    * surf_tensor (no sky_camera, 18,300 faces) is NOT faster than tensor2
//    * fps at the spawn varies strongly with view YAW -- the skyroom pass has
//      no frustum cull, so if it dominates, the frame is direction-INSENSITIVE.
//      That is a prediction the baseline sweep below tests for free.
//
//  Every arm expected to change NOTHING is kept.  A switch that reads the same
//  everywhere is not reaching the code, and that is the only way to tell this
//  measurement is live at all.
// ***************************************************************************

// ---- harness ------------------------------------------------------------
// Resolution HERE, not on the command line: +set vid_width is overwritten by
// ftesurf.cfg, which execs afterwards.  Windowed, because a second instance in
// exclusive fullscreen minimises and cl_main.c:7661 then skips SCR_UpdateScreen
// entirely -- every counter would read zero and look like a fixed bug.
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000

cl_maxfps 0
cl_idlefps 0
cl_yieldcpu 0
sv_cheats 1

// developer 1 for the LOAD only.  The [world] print is capped at 16 views
// (r_surf.c:3982) so it cannot run away, but the area prints add console cost
// and console cost is what the timed sections are trying to measure.
developer 1

map surf_tensor2
waitmap 600
waitms 4000

echo ^5=== THE SMOKING GUN should be above: [world] recurse 1 ... vis NONE
echo ^5=== ent_census: what this map asks for that we ignore
ent_census
waitms 1500

developer 0
r_speeds 2
waitms 2000

// noclip ONCE -- it is a toggle, and setpos alone leaves MOVETYPE_WALK, so the
// camera falls out of the vantage before the 100-frame sampler has filled.
noclip
waitms 1000

// ---- A: the spawn, shipped settings, four yaws ---------------------------
// If the skyroom pass dominates, these four are nearly EQUAL.
echo ^5=== A0 spawn yaw 0   vbsp_skyroom 1 (shipped baseline)
setpos -11776 -13632 13720 0 0 0
waitms 2500
r_speeds_dump
waitms 500

echo ^5=== A1 spawn yaw 90
setpos -11776 -13632 13720 0 90 0
waitms 2500
r_speeds_dump
waitms 500

echo ^5=== A2 spawn yaw 180
setpos -11776 -13632 13720 0 180 0
waitms 2500
r_speeds_dump
waitms 500

echo ^5=== A3 spawn yaw 270
setpos -11776 -13632 13720 0 270 0
waitms 2500
r_speeds_dump
waitms 500

// ---- B: the headline A/B, same vantage, same yaw -------------------------
echo ^5=== B0 spawn vbsp_skyroom 0  -- THE CLAIM
vbsp_skyroom 0
waitms 2500
r_speeds_dump
waitms 500

echo ^5=== B1 spawn r_fastsky 1 -- independent route to the same off state
vbsp_skyroom 1
r_fastsky 1
waitms 2500
r_speeds_dump
waitms 500

echo ^5=== B2 back to shipped, confirm it returns (A0 must reappear)
r_fastsky 0
vbsp_skyroom 1
waitms 2500
r_speeds_dump
waitms 500

// ---- C: the other suspects, priced one at a time -------------------------
echo ^5=== C0 vbsp_sprites 0  (263 unculled sprite quads)
vbsp_sprites 0
waitms 2500
r_speeds_dump
vbsp_sprites 1
waitms 500

echo ^5=== C1 r_shadows 0
r_shadows 0
waitms 2500
r_speeds_dump
waitms 500

echo ^5=== C2 hl2_propdist 8000  (232 static props)
hl2_propdist 8000
waitms 2500
r_speeds_dump
prop_census
hl2_propdist 0
waitms 500

echo ^5=== C3 vbsp_emit 0 / vbsp_decals+overlays already load-time only
vbsp_emit 0
waitms 2500
r_speeds_dump
vbsp_emit 1
waitms 500

// ---- D: the eight stages, shipped settings, one sweep --------------------
// Which vantage is actually heavy, against the offline PVS figures.
echo ^5=== D1 stage 1
setpos -11200 10406 -560 0 0 0
waitms 2500
r_speeds_dump
echo ^5=== D2 stage 2
setpos -10688 -2091 -8560 0 0 0
waitms 2500
r_speeds_dump
echo ^5=== D3 stage 3   (PVS 1264 faces -- one of the two heaviest)
setpos -11136 -10475 8720 0 0 0
waitms 2500
r_speeds_dump
echo ^5=== D4 stage 4
setpos -1728 6805 11792 0 0 0
waitms 2500
r_speeds_dump
echo ^5=== D5 stage 5   (PVS 1322 faces -- the heaviest stage)
setpos 6624 -6955 11472 0 0 0
waitms 2500
r_speeds_dump
echo ^5=== D6 stage 6
setpos 13312 6101 10768 0 0 0
waitms 2500
r_speeds_dump
echo ^5=== D7 stage 7
setpos -12224 -10091 720 0 0 0
waitms 2500
r_speeds_dump
echo ^5=== D8 stage 8
setpos 8576 -1643 656 0 0 0
waitms 2500
r_speeds_dump
echo ^5=== D9 main END  (PVS 1444 faces -- the worst vantage in the map)
setpos 15216 4096 -7088 0 0 0
waitms 2500
r_speeds_dump
waitms 500

// ---- E: the two heaviest stages, with the skyroom off --------------------
echo ^5=== E3 stage 3, vbsp_skyroom 0
setpos -11136 -10475 8720 0 0 0
vbsp_skyroom 0
waitms 2500
r_speeds_dump
echo ^5=== E5 stage 5, vbsp_skyroom 0
setpos 6624 -6955 11472 0 0 0
waitms 2500
r_speeds_dump
vbsp_skyroom 1
waitms 500

// ---- F: the control map -- no sky_camera at all -------------------------
// surf_tensor: 18,300 faces (61% of tensor2), 0 sky_camera, same author.
// If this is NOT markedly faster than tensor2's spawn, the diagnosis is wrong
// and Patch 270 must not be written.
echo ^5=== F0 CONTROL: surf_tensor, no sky_camera
developer 1
map surf_tensor
waitmap 600
waitms 4000
developer 0
r_speeds 2
noclip
waitms 1500
r_speeds_dump
waitms 1000

echo ^5=== END OF RUN ===
waitms 500
quit
