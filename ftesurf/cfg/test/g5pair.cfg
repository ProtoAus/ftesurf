// G5 -- the same map at two BSP versions, from the SAME camera position.
//
// surf_kitsune (v25) and surf_kitsune_mom (v21) are the same level.  In the G3 run their
// spawn frames looked nothing alike -- v25 showed the lit room, v21 showed a flat grid on
// black -- but that comparison is worthless because the two maps spawn the player in
// different places (the HUD read "E -1" against "E -37", and kitsune_mom reported "zones: 0"
// where kitsune reported 39).  Different camera, different picture, no conclusion.
//
// So: pin the camera. 0 -765 133 yaw 90 is the exit-hall position used throughout the Patch
// 208 work, and it exists in both builds of the map.  Anything that still differs is the
// map or the engine, not the viewpoint.
//
// Also sweeps a few positions, because "the world isn't visible" may only bite in part of a
// level, and one camera cannot rule that out.

cfg_save_auto 0
developer 0
log_developer 0
scr_sshot_type png
cl_yieldcpu 0
cl_maxfps 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0
r_speeds 2
vbsp_portal_render 1
r_portalscissor 1

waitms 2500

// ------------------------------------------------------------------ v25 build
map surf_kitsune
waitmap 240
waitms 6000
sv_cheats 1

echo "@@@ v25 posA 0 -765 133 yaw90"
setpos 0 -765 133 0 90 0
waitms 2500
r_speeds_dump
waitms 400
screenshot_mega g5_v25_posA 1280 720
waitms 500

echo "@@@ v25 posB 0 -765 133 yaw-90"
setpos 0 -765 133 0 -90 0
waitms 2000
r_speeds_dump
waitms 400
screenshot_mega g5_v25_posB 1280 720
waitms 500

echo "@@@ v25 posC entry hall -15360 -15250 880"
setpos -15360 -15250 880 0 -90 0
waitms 2000
r_speeds_dump
waitms 400
screenshot_mega g5_v25_posC 1280 720
waitms 500

// ------------------------------------------------------------------ v21 build
map surf_kitsune_mom
waitmap 240
waitms 6000
sv_cheats 1

echo "@@@ v21 posA 0 -765 133 yaw90"
setpos 0 -765 133 0 90 0
waitms 2500
r_speeds_dump
waitms 400
screenshot_mega g5_v21_posA 1280 720
waitms 500

echo "@@@ v21 posB 0 -765 133 yaw-90"
setpos 0 -765 133 0 -90 0
waitms 2000
r_speeds_dump
waitms 400
screenshot_mega g5_v21_posB 1280 720
waitms 500

echo "@@@ v21 posC entry hall -15360 -15250 880"
setpos -15360 -15250 880 0 -90 0
waitms 2000
r_speeds_dump
waitms 400
screenshot_mega g5_v21_posC 1280 720
waitms 500

echo "@@@ v21 posA again, with vis forced OFF -- does the world come back?"
setpos 0 -765 133 0 90 0
waitms 2000
hl2_novis 1
waitms 1500
r_speeds_dump
waitms 400
screenshot_mega g5_v21_posA_novis 1280 720
waitms 500
hl2_novis 0
waitms 500

echo "@@@ G5 DONE"
waitms 800
quit
