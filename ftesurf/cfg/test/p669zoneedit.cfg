// Private overlay (tools/runlines_smoke.py).  Patch 669: the zone editor, on a hosted game.
//   ROUNDTRIP  the map's own zones (Momentum's file) saved by the editor and read back: the
//              same table, line for line, destinations included, and the same crc.
//   PANEL      the panel's own buttons, pressed by name (`zone_edit press <id>` makes the
//              panel's branch for that element run): a track, a row, the grid, + checkpoint
//              into placing and back, delete, reload, close.
//   AIM        a start zone placed as the mouse places it: aim at the floor, click, turn,
//              click, look up, click.  `zone_edit click` is MOUSE1's own code.  On bonus 9,
//              which no map has (surf_voyager's bonus 2 already has a start).  The turn is
//              sixty degrees: at the shipped cl_yawspeed 60 half a second is thirty, and the
//              second corner then snapped into line with the first one run in two (the
//              editor refuses that corner in words, and the stage read NOT MEASURED).
//   EMPTY      every zone deleted: a save is refused in words (an empty file would be
//              ignored by the loader and bring the old zones back).
//   BUILD      a course made by command: start, TWO stages, a checkpoint in the second,
//              end, then a checkpoint in the start's segment (so the first one becomes
//              number 2), and a bonus.  Saved and read back in course order.  (With one
//              stage the first cut passed; with two it put the checkpoint in stage 1.)
//   DELETE     the first stage deleted: the second becomes stage 1 and keeps its checkpoint.
//   HOST       the map loaded again: the server (developer 1 prints its line) and the
//              client both state the saved table's crc, from the local file.
//   FORGET     `zone_edit forget`: this machine's file goes and the map's own zones are back.
// In ROUNDTRIP an unchanged table is first refused a save, then saved with `force`.
// tools/test_p669zoneedit.py grades it.  Everything it writes is in the rig's own data/.
