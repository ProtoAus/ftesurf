cfg_save_auto 0
log_enable 1
log_dir logs
log_name runlines_smoke
developer 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
set fs_missingwarn 0
sv_public 0
sv_port 27640
set run_resume 0
// Synthetic client consents only inside this private test overlay.
set rec_terms 4
set lobby_dir "http://127.0.0.1:8545"
set hud_lines_board 1
set hud_scale 1
set hud_linegraph 1
set hud_linegraph_labels 1
set hud_watch_path 1
set hud_watch_skipidle 0
waitms 2000
map surf_dune
waitmap 60
waitms 2500
menu_restart
waitms 500
ui_close
waitms 500
// menu_restart reloads consent, so set only the synthetic test cvar afterward.
set rec_terms 4
scores tab imported
scores leg 0
scores open
waitms 1500
board_status
screenshot screenshots/p545mom_get.png
// Revoking the synthetic cvar permission cannot spend a cached handle.
set rec_terms 0
scores line 0
waitms 500
scores lines clear
set rec_terms 4
scores line 0
scores line 1
waitms 12500
scores lines
board_status
screenshot screenshots/p545mom_ready.png
scores close
waitms 500
linegraph
waitms 500
screenshot screenshots/p545mom_graph.png
linegraph close
scores tab imported
scores open
// A cached row must replace an older queued watch without waiting.
scores olpick 1
waitms 300
scores olpick 0
waitms 1500
replay status
screenshot screenshots/p545mom_cancel.png
replay stop
scores open
scores olpick 1
waitms 11500
scores olpick 0
waitms 1500
replay status
screenshot screenshots/p545mom_watch.png
replay stop
scores lines clear
waitms 500
echo p545mom DONE
echo RUNLINES COMPLETE
quit
