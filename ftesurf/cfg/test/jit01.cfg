// BUILD 47 -- the 0-4 u/s jitter, which SURVIVED the cl_netfps fix.
//
// REPORTED, twice.  First: "at 1000fps, tap a movement key, your XY jumps 0-4
// per frame, the +19.5 line goes 15-18.5, the speedometer reads 0-4; at 60 it
// doesn't appear; moving the mouse stops it."  Build 47 matched cl_netfps to
// pm_ticrate, which was one real cause.  Then: "when I have 1400fps and tap a
// direction key, and wait, my unit position still doesn't know where to land?
// flickers between 0-4".  So there is a second cause and this is about finding
// which half of the client owns it.
//
// THE QUESTION THIS RUN ANSWERS, and it is deliberately only one:
// after the key is RELEASED, does CSQC still see movement input?
//
//   fore/side NON-ZERO after release
//       -> the input layer is handing on a stale command, and the fix is in QC
//          or in CL_AccumlateInput.
//   fore/side ZERO after release, and the readouts still wobble
//       -> CSQC's input is clean and the wobble is downstream of it, in the
//          engine's prediction.  That points at cl_pred.c's extrapolation
//          block: each rendered frame it runs ONE extra partial command of
//          msec = (simtime - to.time)*1000, and takes `*to.cmd` -- the last
//          SENT command, movement values and all -- whenever
//          cl_pendingcmd[seat].msec happens to be 0.  msec sawtooths 0..15 per
//          frame, so the partial command runs 0 or 1 extra ticks depending on
//          the frame, which is a two-valued readout at high fps and none at 60.
//
// The clientcommandframe column is the second half of the measurement: at 1400
// fps against 66.67 Hz commands, ~21 rendered frames share one command frame.
// Seeing the SAME command frame with DIFFERENT raw values would be a third
// thing again.
//
// cl_maxfps 0 uncaps, which is what makes this reproduce at all -- the report
// says it does not appear at 60.

log_developer 1

waitms 2000

map surf_colin_blaster_69000
waitmap 240
wait 60

cl_maxfps 0
hud_debug 1
hud_strafe 1
hud_speed 1
wait 30

echo ^5=== what are the two clocks, after build 47's auto-correction?
cl_netfps
pm_ticrate
wait 10

echo ^5=== baseline: standing still, never touched a key
hud_wishtrace 60
wait 120

echo ^5=== TAP: key down
+forward
wait 20
echo ^5=== TAP: key released -- everything after this must read 0/0
-forward
hud_wishtrace 240
wait 240

echo ^5=== and a strafe key, since the report says "a direction key"
+moveright
wait 20
-moveright
hud_wishtrace 240
wait 240

echo ^5=== END OF RUN ===
wait 10
quit
