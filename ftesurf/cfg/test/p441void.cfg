// cfg_save_auto 0 FIRST: this run sets archived cvars and must never write them
// into ftesurf.cfg (cl_main.c:2535).
cfg_save_auto 0

// ===========================================================================
//  P441VOID -- the run Patch 434 cancels must not come back ARMED AND CLEAN.
//    python tools/p441void.py --arm rest        (stages, runs, parses, restores)
//    or by hand: PARK ftesurf/data/saves/bhop_eazy, copy cfg/test/p441rest.txt
//    to .../bhop_eazy/save901/state.txt and cfg/test/p441fast.txt to
//    .../save902/state.txt, copy cfg/test/p435.zones.json to
//    ftesurf/maps/zones/local/bhop_eazy.json, then
//    ftesurf64.exe -WindowStyle Minimized +exec cfg/test/p441void.cfg
//    (cwd MUST be C:\FTESurf; log ftesurf/logs/p441void.log)
//
//  THE DEFECT.  Patch 434 ends a run whose recording could not be restored by
//  calling SV_TimerVoid, and SV_TimerVoid CLEARS ALL FOUR OCCUPANCY LATCHES
//  (sv_timer.qc:8735) because every other caller is a teleport, where walking
//  back into the box you left must count as entering it.  On the load path the
//  body is standing in the save's own start box, so the next tick's scan saw
//  azone 0 against a latch of -1, took that as an ARM EDGE, and SV_TimerArm
//  cleared the load's TF_PRACTICE|TF_SEGMENT: a cancelled run handed back as a
//  CLEAN armed attempt, at the velocity the save carried.  That is the hole
//  Patch 428 round 3 closed for a demoted save (SV_SaveLocLoad re-scans the
//  latches there, 40 lines below the Patch 435 gate) -- reopened through the
//  void, which did not exist when r3 was written.
//
//  THE FIX (Patch 441).  The void branch re-scans the latches from where the
//  body now stands, and the Patch 435 gate is skipped when this load voided
//  (sl_voided): the state is non-RUNNING there because the run was CANCELLED,
//  not because an idle save was restored, so forcing the arm edge would hand
//  the clean arm straight back.  You start that run by leaving the box and
//  entering it, as anywhere else.
//
//  WHY THE ZONES FIXTURE.  bhop_eazy's shipped start slab has its BOTTOM at the
//  floor (64.031250) and state.txt stores `origin %.4f`, so a placed body sits
//  0.00005 below the slab and NO scan can see it -- which is why p434rew, whose
//  fixture is the same position, measured `arm zone -1 (armed from -1)` and
//  never reached this defect.  cfg/test/p435.zones.json is the copy whose start
//  region has bottom 48.0, the same fixture the p435 `pre` arm uses to make the
//  gate reachable at all (p435pre.log:828 `arm zone 0`).  Without it this arm
//  would pass while measuring nothing.
//
//  THE FIXTURES.  save901/902 are hand-written state.txt: RUNNING, ticks 500,
//  `reclines 500`, `recserial -1` (a serial no session draws, so the rewind
//  cannot take the warm path) and NO run.rec -- byte-for-byte what a failed copy
//  step leaves, and the only way to reach the cold path's failure on a listen
//  server.  901 is at rest, 902 carries 400 u/s (p441fast.cfg).
//
//  ARMS, in log order:
//   C1  leave the start box.  The premise: `timer: running` and `recording 1`,
//       because Patch 441 voids only where SV_RecEnabled() -- rec_enable and not
//       lobby_norec.  If this reads `recording 0` the subject is measuring
//       p441norec's branch instead.
//   S   SUBJECT: load row 1 (at rest, inside the slab).  The rewind fails.
//
//  PRE-REGISTERED PREDICTIONS
//   C1  `timer: running`, `recording 1`.
//   S   BOTH builds: `run cancelled (the save's recording could not be
//       restored)`.
//   S   CONTROL BUILD (HEAD, pre-Patch 441): `timer: armed` -- the void's
//       cleared latch became an arm edge one tick later -- with `class: clean`
//       and `practice 0`, the laundering, and `arm zone 0 (armed from 0)`.
//   S   FIXED: `timer: idle`, `arm zone 0 (armed from -1)` -- the latch put
//       back, armzone left where a cancelled run leaves it -- and the clock
//       held at the fixture's 0:05.000 (`stopped 1`).
//  FALSIFIED IF C1 does not read running+recording 1 (the subject then measures
//   nothing), or S reads `armed` on the fixed build, or S reads `idle` on the
//   control build, or S reads no cancel line on either.
//  WHICH FIELDS ACTUALLY DISCRIMINATE, said plainly because the driver prints six:
//   `state` (idle vs armed) and `armedfrom` (-1 vs 0).  The clock at 0:05.000 and
//   `stopped 1` are the void's doing on BOTH builds -- they say the void ran, not
//   that it was repaired -- and `azone 0` is the same on both for the reason above
//   (the control's arm edge sets it to 0 as it arms).  Drop either half of the fix
//   and `state` reads `armed`: without the re-scan azone stays -1, and without the
//   `!sl_voided` guard the Patch 435 gate puts it back to -1.
//
//  RESULT (2026-09-26, both builds, driver exit 0 each way.  qwprogs
//   3786B7D1D3341D4B fixed, 830A76438E00EFA4 control -- the control built in a
//   `git worktree` at 3ab4195, the commit before Patch 441, and the driver prints
//   the hash it ran so the two cannot be confused.)
//   C1 `timer: running`, `recording 1` on BOTH builds: the premise held, so the
//     subject measured the SV_RecEnabled() branch and not p441norec's.
//   S CONTROL: `run cancelled (the save's recording could not be restored)`, and
//     then `timer: armed`, `class: clean`, `practice 0`, `arm zone 0 (armed from
//     0)`.  The cancelled run came back one tick later as a CLEAN armed attempt,
//     with the load's TF_PRACTICE|TF_SEGMENT gone.
//   S FIXED: the same cancel line, `timer: idle`, `arm zone 0 (armed from -1)`,
//     the clock held at the fixture's 0:05.000, `stopped 1`.
//   Every prediction held on both builds.  p441fast.cfg measures what the clean
//   arm is worth; p441norec.cfg the other half of the fix.
log_enable 1
log_dir logs
log_name p441void
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
sv_port 27691
sv_cheats 0
set run_resume 0
vid_fullscreen 0
waitms 5000
map bhop_eazy
waitmap 2400
waitms 3000
menu_restart
ui_close
waitms 1200

echo ==== C0 the list: row 1 at rest, row 2 with speed, both RUNNING ====
cmd sl_list
waitms 800

echo ==== C1 leave the start box: must read running / recording 1 ====
+forward
waitms 1500
-forward
waitms 700
cmd timer
waitms 800

echo ==== S SUBJECT: load row 1, whose recording prefix is gone ====
// ONE gesture: `sl_goto <n>` IS a load (sv_player.qc:1046 -> SV_SaveLocLoad).  The
// `sl_load` that used to follow here loaded the same row a SECOND time, and the
// second load's premise is not the first's -- the first one's void has already
// taken the recording down, so what the pair measures is two different branches
// with one report at the end.  That cut is what found the wasrec/SV_RecEnabled
// error in this patch's own first draft; p434rew.cfg still fires both.
cmd sl_goto 1
waitms 1600
echo ---- CONTROL: armed, class clean, practice 0.  FIXED: idle, arm zone 0 ----
cmd timer
waitms 800

quit
