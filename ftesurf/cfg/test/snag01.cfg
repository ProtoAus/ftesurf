// SNAG01 -- Patch 258.  Go and look at the place the player got stuck.
//
// The report: pm_dispprobe printed, over and over with the origin not moving,
//   frac 0.0000 norm 0.506 -0.759 0.411  ss 0 as 0  org 10523.4 -326.7 5359.5
// i.e. wedged against a plane 66 degrees off flat, on the ground, not startsolid.
// That is the plan's "Bug B" row, NOT the four-unit slab Patch 256 removed.
//
// The map name was not in the paste.  It is inferred, and this file is written
// so the inference FALSIFIES ITSELF: if run_eyeinfo reports feet-above-floor
// 8192.00 the point is in the void and surf_boreas is the wrong guess -- say so
// and try the next candidate rather than reading anything into the probe lines.
// surf_boreas is the last `map` in conhistory.txt, its world bbox contains the
// point, and it has 1125 displacements.  Against it: the nearest reconstructed
// displacement vertex is 285 units away, which is nowhere near close enough to
// stand on -- so this run is as likely to rule the map OUT as in.
//
// Patch 258 adds the second probe line, which is the whole point of the run:
//   via plane 0 FACE ... face norm (steep)  -> the terrain really is that steep;
//                                              the bevels are innocent.
//   via plane 2/3/4 edge ... face norm flat -> an in-plane edge plane is
//                                              blocking over ground the triangle
//                                              itself calls walkable.  Bug B.
//   via plane 1 BACK-SLAB(+4)               -> still a winding/thickness problem.
//   via: not a trisoup triangle             -> a brush, and displacements are
//                                              not involved here at all.

log_enable 1
log_dir "logs"
log_name "snag01"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
con_notifylines 0
developer 1
log_developer 1

hl2_dispwinding 1

wait 200
map surf_boreas
waitmap 1800
waitms 8000
sv_cheats 1
waitms 400

pm_dispprobe 1

// 1. Is the reported origin anywhere at all?  A point traceline straight down.
echo ^5=== A: is the probe origin real? ===
noclip
waitms 400
setpos 10523.4 -326.7 5359.5 0 123.7 0
waitms 900
cmd run_eyeinfo
waitms 900

// 2. Same again 64 units up, so a startsolid at the exact origin cannot hide the
//    floor from us.
echo ^5=== B: 64 units higher ===
setpos 10523.4 -326.7 5423.5 0 123.7 0
waitms 900
cmd run_eyeinfo
waitms 900
screenshot
waitms 600

// 3. Drop out of noclip and walk INTO the plane.  The blocking normal was
//    (0.506 -0.759 0.411), so the player was pushing along roughly (-0.55 0.83),
//    which is yaw 123.7.  Start 48 units back along the normal and 16 up.
echo ^5=== C: walk into it ===
setpos 10547.7 -363.1 5375.5 0 123.7 0
waitms 400
noclip
waitms 1200
+forward
waitms 2500
-forward
waitms 600
cmd run_eyeinfo
waitms 600
screenshot
waitms 600

echo ^5=== snag01 done ===
pm_dispprobe 0
wait 30
quit
