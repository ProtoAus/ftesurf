// P427CL -- a sound name with a space no longer stalls a join (server: p427sv.cfg).
//
// BEFORE Patch 427 the client sends `download <name>` unquoted, the server's
// tokenizer cuts "sound/music/never coming back.mp3" at the first space and
// answers for "sound/music/never"; CL_DownloadFailed matches by name, so the
// pending download is never aborted and CL_RequestNextDownload waits forever.
//
// PRE-REGISTERED PREDICTIONS (four arms: old/new client x old/new server)
//  A  old client, old server: client log `Couldn't find file "sound/music/never"`,
//     and the server never logs this client entering the game.  (The report.)
//  B  new client, old server: the request is quoted, the reply names the whole
//     file (`Couldn't find file "sound/music/never coming back.mp3"`), the queue
//     moves on and the server logs the client entering.
//  C  old client, new server: the server rejoins the split name; same as B.
//  D  new client, new server: same as B.
// FALSIFIED IF A spawns (the harness does not reproduce the report), or B/C/D
//   leave the client unspawned or print a fragment name.
// SPAWN MARKER: the server's `said> server: P427 joined`.  (The closing `cmd
//   viewpos` was meant to be one and is NOT: arm A answered `setpos 0.0 0.0 0.0`
//   unspawned.  A spawned client reads a real position.)
//
// RESULT 2026-09-22 (old = the installs' binaries, new = engine/release built
// with the patch; server p427sv.cfg on surf_r-ne unless noted):
//  A  `Couldn't find file "sound/music/never" on the server`, no `joined` in
//     45 s -- the report's log line for line.  surf_themeless (p427sv2.cfg):
//     `Couldn't find file "sound/custom/mgs3"`, no `joined`.
//  B  `...never coming back.mp3" on the server`, joined 3 s after it.
//  C  same as B; surf_themeless too (`...mgs3 se theme2.wav"`, joined).
//  D  same as B.
// All four as predicted.  C is the one a Pi deploy buys: every current client
// joins both maps once the lobbies run the patched server.
cfg_save_auto 0
log_enable 1
log_dir logs
developer 1
cl_idlefps 0
cl_maxfps 100
rate  2000000
drate 5000000
vid_fullscreen 0
cl_downloads 1
cl_download_wait 1
name "^3P427"
waitms 4000
connect 127.0.0.1:27634
waitms 40000
cmd viewpos
waitms 3000
echo p427cl: done
quit
