cfg_save_auto 0
// P387WL -- the Wayland grant and journal table, reached by switching from X11
// (engine Patch 387; WSLg, whose compositor is Weston).
// Linux client, listen server on bhop_eazy, starting on X11:
//   DISPLAY=:0 WAYLAND_DISPLAY=wayland-0 XDG_RUNTIME_DIR=/mnt/wslg/runtime-dir
//     ./fteqw64 -nosound +set vid_renderer gl +set developer 1 +set log_enable 1
//     +set log_dir logs +set log_name p387wl +exec cfg/test/p387wl.cfg
// GATE: "Using XInput2" at boot, and "OpenGL (Wayland)" after the switch.
// (vid_restart + two waitms: see p387xi2.cfg.)
//
// PRE-REGISTERED
//   X  on X11: data/p387_X.hid table starts keyboard - "x11" (control for W).
//   W  vid_renderer wayland; vid_restart.  in_rawmice 1 if the log shows neither
//      "does not support zwp_relative_pointer_manager_v1" nor "...
//      zwp_pointer_constraints_v1", else 0; `cmd timer` would 0 for 1, would 1
//      for 0.  data/p387_W.hid: dev keyboard - "wayland" and mouse 0
//      "wayland-relative-pointer" ("wayland" when the grant is 0), trailer
//      `-1 -1 -1`; hidcheck input_backend "Wayland (one merged seat)", no
//      rawmice mismatch note, only the idle fault "no frame markers".
// FALSIFIED IF W's table is not the Wayland one, the grant disagrees with the
// warnings, or would disagrees with the grant.
// CONTROL (must fail): a pre-387 binary reaches XIQueryDevice(NULL) at W's
// in_journal_begin (x11_input_method outlived the display) -- a crash or an X
// table written for a Wayland session.  Either is the finding behind the
// INS_EnumerateDevices guard; if it writes a correct table the guard is untested.

exec cfg/test/_quiet.cfg

developer 1
log_developer 1
log_enable 1
log_dir logs
log_name p387wl
cl_maxfps 100
cl_idlefps 0
sv_cheats 0
m_filter 0
m_accel 0
cl_nocsqc 0

wait 200
map bhop_eazy
waitmap 600
waitms 5000

echo ^5=== P387WL ARM X: X11 table.
in_rawmice
in_journal_begin
waitms 2000
in_journal_end data/p387_X.hid
waitms 1500

echo ^5=== P387WL ARM W: switch to Wayland.  Expect the Wayland table and grant.
set vid_renderer wayland
vid_restart
waitms 100
waitms 4000
in_rawmice
cmd timer
in_journal_begin
waitms 2000
in_journal_end data/p387_W.hid
waitms 1500

echo ^5=== END OF RUN ===
waitms 1000
quit

