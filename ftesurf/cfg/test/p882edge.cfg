// Patch 882 edge arm, phase 1: a streamed run on surf_journeys that starts inside the jump
// limit *27 (the start zone's north corridor) and leaves it, so the header pin carries
// momlimit=16 and a `pm` row drops it to 0; +jump held from the start fires on the first tick
// outside (a stripped jump stays unheld), the walk ends in a fail teleport or `!r`, closing the attempt as
// data/parts/0-fail.rec.  No `quit`: the harness times the client out and kills it, so the file
// is not dropped at disconnect and stays in the retained rig for p882edge2.cfg.
//   python tools/runlines_smoke.py ftesurf/cfg/test/p882edge.cfg --mount --timeout 150 \
//     --ssqc <qwprogs> --csqc <csprogs> --mqc <menu> --client <exe> --output-dir <task root>/artifacts
cfg_save_auto 0
log_enable 1
log_dir logs
log_name runlines_smoke
con_notifytime 0
cl_idlefps 0
cl_maxfps 100
vid_vsync 0
vid_fullscreen 0
vid_width 1280
vid_height 720
sv_public 0
set run_resume 0
set rec_stream 1
developer 1
log_developer 1
waitms 1500

map surf_journeys
waitmap 120
waitms 6000
menu_restart
ui_close
waitms 500
echo ==== E1 the start, facing north ====
cmd zone_goto 0 90
waitms 2000
cmd viewpos
cmd timer
waitms 300
echo ==== E2a +jump held first, then +forward: prestrafe must not hold W while a limit takes the jump ====
+jump
+forward
waitms 1500
cmd viewpos
-jump
-forward
waitms 500
cmd zone_goto 0 90
waitms 2000
cmd viewpos
echo ==== E2 walk out of the limit, jump at 1.6 s (the start drops away: the run is airborne) ====
+forward
waitms 1600
+jump
waitms 600
-jump
waitms 800
-forward
waitms 300
cmd viewpos
cmd timer
waitms 300
echo ==== E3 restart: the attempt is kept as 0-fail.rec ====
say !r
waitms 2000
echo RUNLINES COMPLETE
waitms 600000
