// Patch 897 arm: a play-time server dprint is quiet offline at developer 0 and prints with developer 1.
//   python tools/runlines_smoke.py ftesurf/cfg/test/p897quiet.cfg --mount --timeout 200 \
//     --ssqc <qwprogs> --csqc <csprogs> --mqc <menu> --client <exe> --output-dir <task root>/artifacts
// surf_greek's checkpoint-0 slab is a zone-tool limitmovement box (Patch 892); entering it prints
// `momlimit Player: limit 64 ...` (SV_MomLimitFrame).  The log takes every console print whatever
// developer is, so it shows what an offline player's console shows.  No noclip: the limit frame
// skips a noclip body, and an arm with it prints neither phase (measured).
// Expected: D0 (developer 0) has `lump: last edict` (a load line, ungated) and no momlimit line; D1
// (developer 1, the same entry again) has the momlimit line.  Control, a build without Patch 897:
// the momlimit line in D0 too.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name runlines_smoke
con_notifytime 0
cl_idlefps 0
cl_maxfps 100
vid_vsync 0
vid_fullscreen 0
vid_width 1280
vid_height 720
sv_public 0
set run_resume 0
developer 0
log_developer 0
waitms 1500

map surf_greek
waitmap 120
waitms 5000
menu_restart
ui_close
waitms 500
echo ==== D0 developer 0: into the slab ====
setpos 14048 15072 15480 0 90 0
waitms 1000
setpos 14048 17072 15480 0 90 0
waitms 1000
developer 1
echo ==== D1 developer 1: into the slab again ====
setpos 14048 15072 15480 0 90 0
waitms 1000
echo ==== END ====
waitms 300
quit
