// P463ZONE -- a zone file copied under another map's name must load, and must
// build the SAME TABLE.
//
// The loader keys on the bare map name and nothing else:
//     maps/zones/local/<map>.json, maps/zones/online/<map>.json, then the BSP
// (sv_zones.qc:177-182, mirrored in cl_zones.qc:296-301).  An exact string
// concatenation, with no aliasing -- so surf_utopia_njv gets no zones at all
// even though surf_utopia.json is installed, and 71 of the library's builds are
// in that position (tools/census/zonefit.py).
//
// The fix Lex asked for needs no code: drop the donor's JSON in as
// maps/zones/local/<target>.json.  What has to be PROVEN is not that a file
// appears -- it is that the table built from it is the same table, because
// Zone_Hash (sh_zones.qc:264) hashes the BUILT TABLE and writes that hash into
// every recording as `zonecrc`.  Two builds sharing one leaderboard are only
// comparable if their start and finish geometry hash identically.  So `crc` is
// the graded number, not the region count.
//
// AND BOTH VMs ARE GRADED, because they load independently and zones are never
// networked (sv_zones.qc:3-12).  A copy the server reads and the client does not
// is the same class of client/server split as Patches 458-461.
//
// PRE-REGISTERED
//  Z1  each of the three targets prints source `maps/zones/local` with the SAME
//      crc and region count as its donor, which loads from `maps/zones/online`
//      earlier in the same run.  Donor and target in one log, so nothing is
//      compared across builds.
//  Z2  for every map in the run, the `zones(sv):` and `zones:` lines agree on
//      count, source and crc.  A server-only copy fails here.
//  Z3  CONTROL: surf_1111 has no zone file and no alias-recoverable donor, so it
//      must NOT report source maps/zones/local.  Without it, a loader that
//      reported `local` unconditionally would pass Z1.
//  Z4  MUTATION (documented, run by hand): stage surf_summer.json as
//      surf_utopia_njv.json and Z1's crc equality must fail while Z2 still
//      passes -- the two VMs agree about the wrong file.
log_enable 1
log_dir logs
log_name p463zone
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
con_notifytime 0
sv_port 27712
sv_cheats 0
vid_fullscreen 0
waitms 5000
menu_restart
ui_close
waitms 1200

echo ==== Z1 surf_utopia DONOR ====
map surf_utopia
waitmap 3600
waitms 2000

echo ==== Z1 surf_utopia_njv TARGET ====
map surf_utopia_njv
waitmap 3600
waitms 2000

echo ==== Z1 surf_summer DONOR ====
map surf_summer
waitmap 3600
waitms 2000

echo ==== Z1 surf_summer_ksf TARGET ====
map surf_summer_ksf
waitmap 3600
waitms 2000

echo ==== Z1 surf_tundra DONOR ====
map surf_tundra
waitmap 3600
waitms 2000

echo ==== Z1 surf_tundra_v2 TARGET ====
map surf_tundra_v2
waitmap 3600
waitms 2000

echo ==== Z3 surf_1111 CONTROL -- no zone file, no alias ====
map surf_1111
waitmap 3600
waitms 2000

quit
