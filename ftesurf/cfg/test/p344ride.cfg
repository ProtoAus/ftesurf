cfg_save_auto 0
// PATCH 344 -- pm_recsim consumes `ride` and `inend` (FTESURF-REC 8).
//
// Run twice, same cfg, log name from the command line:
//   before  ftesurf64_p342.exe  +set log_name p344pre  +exec p344ride
//   after   ftesurf64.exe       +set log_name p344post +exec p344ride
//
// SUBJECTS
//   S1  data/b85ride.part (surf_ecosystem, v8): seed sample vel.x -260, then
//       `pay -1700` + `arm 0` precede in-row 0; the next sample reads -1972.75
//       = -260 + (1 + 0.015*0.5) * -1700.  No trailer, no inend.
//   S2  data/p344end_ok.part  = S1 + `inend 733 0.01200` (the true successor:
//       every row is one 15 ms tick, and the final sample is t 0.412).
//   S3  data/p344end_bad.part = S1 + `inend 734 0.01200` (two ticks: wrong).
// CONTROLS (no ride records; every ARM line must be identical before/after)
//   C1  data/e5trace.part (surf_ecosystem v7)  arm 3 row -1, 169 at floor
//   C2  surf_trance 0010929_pb.rec (v7)        99 diverged, arm 3 row 0
//   C3  surf_kitsune 0009998_pb.rec (v7)       14 diverged, arm 3 184/287
//   C4  data/b83trace.part (bhop_eazy v7)      8 diverged, arm 3 row 817
//   C5  data/e3trace.rec (bhop_eazy v6)        15 diverged, arm 3 row 149
//
// PRE-REGISTERED
//   1  BEFORE, S1 fails at the cash-out: arm 2 has >=1 diverged packet with a
//      velocity error ~1712.75 u/s, and arm 3 passes 1 u at row 0.
//   2  AFTER, S1 is at the floor: arm 2 0 diverged, arm 3 row -1 (or never
//      past 0.1 u); "2 ride records applied (0 off their row's <mt>)".
//   3  AFTER, S2 runs 27 moves (S1 runs 26) all exact, and its last packet is
//      at the floor; S3 runs 27 with 1 off by 1 tick and 1 diverged packet
//      (~29.6 u = 1972.75 * 0.015).  S3 is the control that must still fail.
//   4  C1-C5: ARM 1/2/3 lines byte-identical before and after.  Only the
//      v7 `warps none` sentence changes (C1, C2) -- narrowed, per E5.
//
// FALSIFIED IF: 2 fails (the ride is applied wrong); S3 passes (inend is not
//      read, or the final move is not compared); any control moves.
//
// RESULT (2026-09-18; before exe md5 1E721C8A, after C685ADAC -- re-run after the
//   renumber from 343, every arm line identical to the first run):
//   1  HELD.  S1 before: arm2 DIVERGED row 0, org 25.69 u, vel 1712.75 u/s;
//      arm 3 past 1 u at row 0, last 667.97 u.
//   2  HELD.  S1 after: 26 at the floor, 0 diverged (max 0.0089 u, 0.0001
//      u/s), arm 3 row -1, last 0.0040 u; 2 rides applied, 0 off their <mt>.
//   3  HALF.  S2: 27 moves exact, 27 at the floor.  S3 fails where it must:
//      row 26, 30.27 u / 12.00 u/s (= 1972.75 and 430.08 u/s times 0.015).
//      BUT ARM 1 READ 27 EXACT ON S3, not "1 off" -- the prediction was wrong.
//      Arm 1 derives dt from the same <mt> delta it checks, so a wrong but
//      self-consistent `inend` passes it by construction; only the trajectory
//      against the final sample can catch one.
//   4  HELD.  C1-C5 ARM/DIVERGED/seed/warp lines byte-identical; only `body`
//      (+rides), the v7 `warps none` sentence and the new `rides` line moved.
log_enable 1
log_dir logs
developer 0
set rec_enable 0
set rec_stream 0

waitms 6000
map surf_ecosystem
waitmap 60
waitms 4000
echo ================================ P344 S1 b85ride.part
pm_recsim data/b85ride.part
waitms 2000
echo ================================ P344 S2 p344end_ok.part
pm_recsim data/p344end_ok.part
waitms 2000
echo ================================ P344 S3 p344end_bad.part (must fail)
pm_recsim data/p344end_bad.part
waitms 2000
echo ================================ P344 C1 e5trace.part
pm_recsim data/e5trace.part
waitms 3000

map surf_trance
waitmap 60
waitms 4000
echo ================================ P344 C2 surf_trance v7
pm_recsim data/runs/surf_trance/main/0010929_pb.rec
waitms 4000

map surf_kitsune
waitmap 60
waitms 4000
echo ================================ P344 C3 surf_kitsune v7
pm_recsim data/runs/surf_kitsune/main/0009998_pb.rec
waitms 4000

map bhop_eazy
waitmap 45
waitms 3000
echo ================================ P344 C4 b83trace.part
pm_recsim data/b83trace.part
waitms 2000
echo ================================ P344 C5 e3trace.rec
pm_recsim data/e3trace.rec
waitms 2000

echo ================================ P344 done
waitms 1000
quit
