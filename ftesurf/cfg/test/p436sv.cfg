// P436SV -- the legitimate stage handover, server half (client: p436hand.cfg).
// Run from C:\FTESurf:
//   C:\FTEQuake\fteqwsv64.exe +set sv_port 27666 +set sv_public 0
//     +set log_enable 1 +set log_dir logs +set log_name p436sv
//     +map bhop_eazy +exec cfg/test/p436sv.cfg
// A dedicated server and not a listen one: the client has to drive its own body
// across a stage boundary, and on a listen server the cfg's own `cmd`/`setpos`
// calls land in the same process that is simulating, which makes the ordering
// hard to read.  sv_cheats 1 so the client can noclip the 3000 u to the stage box
// -- the handover's own gate is a pure geometry test (SV_ZoneIn against the body's
// hull), so what taint the flight adds does not touch it.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p436sv
developer 1
log_developer 1
set sv_cheats 1
set run_class 1
set run_resume 0
sv_maxrate 0
map bhop_eazy
waitms 240000
quit
