// P854 Story screen rig: tools/story_fixture.py on 127.0.0.1:18854, then tools/runlines_smoke.py
// this cfg --mount --mqc <menu.dat> --put data/consent.txt, data/mapmeta.txt, data/mapdl.net.txt
// (and data/story_me.txt = "FTESURF-STORYME 1" + a seeded handle, which p854story_new leaves out).
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
vid_vsync 0
mastervolume 0
set rec_terms 7
set rec_upload 0
set lobby_dir "http://127.0.0.1:18854"
set ui_name_chosen 1
name StoryFixture
log_enable 1
log_dir logs
log_name runlines_smoke
log_developer 1
developer 1
waitms 15000
map surf_dune
waitmap 60
waitms 6000
menu_restart
waitms 2000
set rec_terms 7
set lobby_dir "http://127.0.0.1:18854"
developer 0
con_notifytime 0
con_notifylines 0
ui_story
waitms 5000
ui_story sel 2
waitms 800
ui_story probe
screenshot p854_new_player
waitms 1500
ui_story view 4dc9929e4ced
waitms 4000
ui_story sel 3
waitms 800
ui_story probe
screenshot p854_new_viewing
waitms 1500
echo RUNLINES COMPLETE
quit
