// Patch 279 / build 53, run B -- the two things run A could not settle.
//
// RUN A's RESULTS, and what each one left open:
//
//   * `2 UnlitTwoTexture material(s) ... 2 with a distance fade, 2 with a
//     distance-driven frame` -- the proxy graph walk resolves.  It does NOT
//     show that the second texture is bound or that the frame index reaches
//     the sampler.
//   * `sprite occluders: 16 of 622` -- correct, and useless.  145 of
//     surf_tensor2's 160 func_brush declare `solidity 1`, so mode 1 kept 16 and
//     the A/B measured 232 of 240 hidden with the occluders IN and 232 of 240
//     with them OUT.  Identical.  The spawn portal is itself one of the 145:
//     the combine shield is func_brush *19 solidity 1 at -11776 -10816 13744.
//     Hence mode 2, now the default, and hence the direct counter below.
//   * the shield screenshots were taken at 300 units, where the material's own
//     proxy chain puts the frame index at its maximum -- so "on" looked blank
//     and "off" looked like a dense web, which is the feature and reads as a
//     regression.  clamp(dist*0.2 - 24, 0, 30) is 0 only inside 120 UNITS.
//
// SO THIS RUN ASKS THREE QUESTIONS THAT HAVE ANSWERS:
//
//  1. Do the occluders get HIT?  `N traces stopped by one` counts tracelines
//     whose trace_ent was not the world.  Zero at mode 2 means the entities
//     exist and the trace passes through them, which is a different bug from
//     not having them.  This is the measurement run A lacked.
//
//  2. Does the SECOND layer contribute?  Two screenshots one second apart from
//     the same fixed vantage.  The second layer scrolls at rate .1 angle -45,
//     so the two images must DIFFER.  If they are identical the multiply is
//     sampling something constant and the layer is not bound.
//
//  3. Does the frame ramp work?  Six distances through the band where the
//     material's own arithmetic says it changes: 60 (frame 0), 120 (frame 0),
//     200 (frame 16), 300 (frame 30), 600, 1000 (alpha ~0).
//
// The map's own env_sprite sits AT the portal -- sprites/light_glow03 at scale
// 3, rendermode 9 -- and build 52 draws it over the world with no depth test,
// so it whites out the middle of every close shot.  vbsp_sprites 0 plus a
// reload takes it out of the way; that is what vbsp_sprite_debug 2 is for.

vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000

cl_maxfps 0
cl_idlefps 0
cl_yieldcpu 0
sv_cheats 1

map surf_tensor2
waitmap 600
waitms 9000
noclip
waitms 1000

// ---------------------------------------------------------------------------
//  1. ARE THE OCCLUDERS BEING HIT?
// ---------------------------------------------------------------------------
vbsp_glare 1
vbsp_glare_traces 300
vbsp_sprites 1

echo ^5=== A2 mode 2 (default) -- expect ~161 occluders and a NON-ZERO stop count
vbsp_glare_brush 2
vbsp_sprite_debug 2
waitms 2500
vbsp_sprite_debug 1
waitms 1000

echo ^5=== A1 mode 1 -- 16 occluders, and the stop count should FALL
vbsp_glare_brush 1
vbsp_sprite_debug 2
waitms 2500
vbsp_sprite_debug 1
waitms 1000

echo ^5=== A0 mode 0 -- no occluders, and the stop count MUST be 0
vbsp_glare_brush 0
vbsp_sprite_debug 2
waitms 2500
vbsp_sprite_debug 1
waitms 1000

// A second vantage, because one could be a coincidence.
echo ^5=== A2b stage 5, mode 2
vbsp_glare_brush 2
vbsp_sprite_debug 2
setpos 6624 -6955 11472 0 0 0
waitms 3000
vbsp_sprite_debug 1
waitms 1000

echo ^5=== A0b stage 5, mode 0 -- must be 0 stopped
vbsp_glare_brush 0
vbsp_sprite_debug 2
waitms 2500
vbsp_sprite_debug 1
waitms 1000

vbsp_glare_brush 2

// ---------------------------------------------------------------------------
//  2 and 3. THE SHIELD, WITH THE GLARE SPRITE OUT OF THE WAY
// ---------------------------------------------------------------------------
// The portal is at -11776 -10816 13744 and faces -Y, so approach along -Y.
vbsp_sprites 0
vbsp_sprite_debug 2
waitms 1500

echo ^5=== S60 sixty units -- frame 0, alpha ~0.85.  The DENSE web.
setpos -11776 -10876 13744 0 90 0
waitms 2500
screenshot p279b_s60_x
waitms 900
screenshot p279b_s60
waitms 1200
// ---- the scroll test: same vantage, one second later.  MUST differ.
screenshot p279b_s60_t1_x
waitms 900
screenshot p279b_s60_t1
waitms 900

echo ^5=== S120 frame 0 still, alpha ~0.79
setpos -11776 -10936 13744 0 90 0
waitms 2000
screenshot p279b_s120_x
waitms 900
screenshot p279b_s120
waitms 900

echo ^5=== S200 frame ~16
setpos -11776 -11016 13744 0 90 0
waitms 2000
screenshot p279b_s200_x
waitms 900
screenshot p279b_s200
waitms 900

echo ^5=== S300 frame 30 (max)
setpos -11776 -11116 13744 0 90 0
waitms 2000
screenshot p279b_s300_x
waitms 900
screenshot p279b_s300
waitms 900

echo ^5=== S600 alpha ~0.36
setpos -11776 -11416 13744 0 90 0
waitms 2000
screenshot p279b_s600_x
waitms 900
screenshot p279b_s600
waitms 900

echo ^5=== S1000 alpha ~0 -- the shield should be GONE
setpos -11776 -11816 13744 0 90 0
waitms 2000
screenshot p279b_s1000_x
waitms 900
screenshot p279b_s1000
waitms 900

// ---- the control at the SAME close vantage, through another map so the
// ---- material really reloads ("map <same name>" does not).
echo ^5=== S60OFF hl2_twotexture 0 at sixty units -- one layer, frame 0, no fade
hl2_twotexture 0
map surf_tensor
waitmap 600
waitms 6000
map surf_tensor2
waitmap 600
waitms 9000
noclip
vbsp_sprites 0
vbsp_sprite_debug 2
waitms 1500
setpos -11776 -10876 13744 0 90 0
waitms 2500
screenshot p279b_s60off_x
waitms 900
screenshot p279b_s60off
waitms 900
hl2_twotexture 1
vbsp_sprites 1

echo ^5=== END OF RUN ===
waitms 500
quit
