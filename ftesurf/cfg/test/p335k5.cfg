// Patch 337 push E2E, take 3.  k4 proved `cmd noclip` after setpos lands the
// player back in NOCLIP (the engine's SV_Noclip_f flips to WALK, then the
// mod's QC handler flips back to NOCLIP and prints ON) -- so k2-k4 "walked"
// in noclip flight, where BOTH sides skip pushes and nothing is tested.
// This run issues the toggle twice and verifies WALK by the z-drop: a walker
// falls -2420 -> -2431 and stays; a noclipper hangs.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p335k5
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0
wait 600
connect 127.0.0.1:27666
waitms 15000
cl_prederror 2
cl_trigdebug 1
echo === warp onto pad 17
cmd setpos 8096 -10688 -2420 0 0 0
waitms 600
cmd noclip
waitms 600
cmd noclip
waitms 600
echo === z probe 1 (walk: -2431.x, noclip: -2420):
cmd viewpos
waitms 900
echo === z probe 2:
cmd viewpos
waitms 600
echo === walk east 2.5 s
+forward
waitms 2500
echo === stop; cash-out window 2.5 s
-forward
waitms 2500
echo === final pos:
cmd viewpos
waitms 600
echo === k5 done
waitms 300
quit
