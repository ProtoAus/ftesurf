// Patch 421 -- A v9 ANGLE CORPUS, because the cuts in reccheck are the wrong
// ones for every file the fleet now writes.  Needs p421sv.cfg's dedicated
// server up on 27696; tools/p421corp.py starts both ends and runs the batch.
//
//   ./ftesurf64.exe -WindowStyle Minimized +set cl_maxfps <n>
//     +set cl_yawspeed <n> +set cl_pitchspeed <n> +exec cfg/test/p421corp.cfg
//
// THE ROUTE IS p420live.cfg's, UNCHANGED, AND THAT IS DELIBERATE.  p420live is
// the one arm that has ever produced a v9 pair with a moving camera; changing
// its route to gather more of them would mean the batch and the reference
// measurement are not the same experiment.  What varies here is OUTSIDE the
// cfg: the driver sets cl_maxfps, cl_yawspeed and cl_pitchspeed on the command
// line, and this file sets none of them.
//
// WHY THOSE THREE AND NOT THE MAP.  The plan's note said "a handful of runs on
// different maps", and the map is the one thing the join does NOT depend on.
// reccheck pairs a rendered frame with a mover tick and compares two angles; it
// can only be wrong about frames per tick (cl_maxfps against the mover rate) or
// about how far the camera moved inside one tick (cl_yawspeed/cl_pitchspeed).
// Geometry enters neither.  Varying the map would have grown the sample without
// varying the dimension under test, which is the failure CLAUDE.md now names.
//
// AND cl_netfps IS NOT A FREE VARIABLE, which is worth knowing before anyone
// tries: CSQC's Net_MatchTicrate (cl_main.qc:108) overwrites it with
// 1/pm_ticrate on every map load that publishes a Source mover.  So on this
// game a client sends exactly one usercmd per mover tick by construction, and
// the `in` rows are 1:1 with ticks.  The frames are the only thing that can be
// dense or sparse against them.
//
// PRE-REGISTERED PREDICTIONS
//  C1  every variant's .rec is v9 and carries a swept yaw -- hundreds of
//      degrees, not the 0 every 416-419 fixture recorded.  A variant that
//      comes back BLIND is a variant that did not run, not a datum.
//  C2  the variants DIFFER in what they stress: frames-per-tick spans at least
//      an order of magnitude across the batch (cl_maxfps 30 to 500 against a
//      100 Hz mover).  If the .view frame counts come back all alike, the
//      +set knobs did not take and the batch measures one condition twelve
//      times -- which is the corpus-shaped arm that cannot fail.
//  C3  the honest v9 residual stays at the wire quantum regardless: max raw
//      deviation under 0.05 deg on every variant, against the 2.52 deg that
//      v6-v8's .v_angle reached on surf_kitsune.  This is the prediction that
//      would justify a v9-specific cut.
//  C4  FALSIFIER FOR C3: if any honest variant lands near the current 3x cut,
//      the cut stays where it is and the answer is "not demonstrated".
//      A tighter number is only earned if the whole batch is at the quantum.
//  CONTROL: tools/reccheck.py --tamper-view on each collected pair -- a
//      rotation small enough to matter must fail under the NEW cut and the old
//      one must be shown to miss it, or "tighter" is a claim with no arm.
// FALSIFIED IF the camera does not sweep, if the variants do not differ, or if
//   the residual tracks the sweep rate instead of staying at the quantum.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p421corp
developer 1
cl_idlefps 0
set rec_enable 1
set rec_hid 1
set rec_upload 1
name "^3P421"

waitms 6000
echo ================================ P421 CL -- knobs as the driver set them
echo P421KNOBS maxfps=$cl_maxfps yawspeed=$cl_yawspeed pitchspeed=$cl_pitchspeed
connect 127.0.0.1:27696
waitms 12000

echo ================================ P421 CL -- aim and start
cmd zone_goto 0
waitms 1500
setpos -352 -352 144 0 335.3 0
waitms 1500
+jump
waitms 700
-jump
waitms 2000
cmd timer

echo ================================ P421 CL -- sweep the camera inside the run
+left
waitms 1500
-left
+right
waitms 3000
-right
+left
waitms 1500
-left
+lookup
waitms 800
-lookup
+lookdown
waitms 1600
-lookdown
+lookup
waitms 800
-lookup
waitms 500

echo ================================ P421 CL -- restore the route's heading
setpos -352 -352 144 0 335.3 0
waitms 1500

echo ================================ P421 CL -- fly to the end zone
noclip
waitms 500
+forward
waitms 1500
waitms 2900
waitms 2000
-forward
waitms 1500
cmd timer
waitms 3000

echo ================================ P421 CL done
waitms 1000
quit

// RESULT (2026-09-21 16:34-16:52, dedicated server on 27696 via
// tools/p421corp.py, 12 variants, engine a72183e6b / patch 419, qcbuild 88):
//   C1 HELD.  Twelve v9 pairs, 246 to 12392 degrees of camera travel, every
//      one of them joined.  Not one BLIND.
//   C2 HELD, AND IT IS THE PRECONDITION FOR EVERYTHING BELOW.  Measured
//      framerate 29.7 to 494.7/s; frames per usercmd 1.000 to 4.980; frames in
//      the sidecar 522 to 8671.  The knobs took.
//   C3 FALSIFIED, AND THE FALSIFICATION IS THE RESULT.  The residual is at the
//      wire quantum ONLY while cl_maxfps is at or below the mover rate:
//        fps  30  50  73 100 110 | 150   250   500   250@900 250@2000
//        max .010 .010 .010 .010 .010 | .285  .287  .126   1.500   0.760 deg
//      Below the mover the client builds ONE usercmd per rendered frame, so
//      the two files carry the same number and there is nothing to disagree
//      about.  Above it the usercmd samples between frames and the difference
//      is real.  p420live measured only cl_maxfps 100 -- the left half of that
//      table -- and concluded the v9 thresholds were ~400x looser than needed.
//      They are not.  Normalised, the worst honest move across the batch is
//      1.49 (250 fps at 900 deg/s), against 1.24 for the whole pre-v9 corpus
//      and a cut of 3.  ONE run at ONE framerate is not a measurement of a
//      format.
//   C4 HELD as written: the cut stays at 3.  A tighter number would have been
//      set from the same n=1 that produced the 400x claim.
//   AND THE OUTLIER DOES NOT SCALE.  The 1.49 is a single move of 1738, at a
//      key-release boundary where the tick's own sweep collapses while the
//      residual does not.  Predicted that 2000 deg/s would scale it to ~3.3;
//      MEASURED 0.76.  It is a chance alignment between the send instant and a
//      frame, so the honest ceiling is a statistical claim over 12 runs and not
//      a formula.
//
//   WHAT THE BATCH FOUND THAT IT WAS NOT LOOKING FOR -- the one-frame rule.
//   A tick that held exactly ONE rendered frame has nothing to choose between:
//   the usercmd was built from that frame, so the two files must agree to the
//   print rounding plus the wire quantum.  Over 21 honest v9 pairs and 11,592
//   such ticks the worst is 0.0104 degrees; the stale pair in data/runs is
//   179.997 on 52.53% of them.
//   That is a cut of 0.05 instead of 3, it does NOT need the camera to have
//   moved, and it is the rule that reaches the files this game actually
//   records.  Measured with --tamper-view on a still-camera pair (p417/s):
//   smallest whole-run rotation caught went from NOTHING AT ALL to 0.1 deg,
//   and a 2% splice from missed to caught.  On the swept pair at 100 fps the
//   rotation floor went 5 deg -> 0.05.
//   ITS COVERAGE IS THE CLIENT'S FRAMERATE, WHICH IS THE HONEST LIMIT: 250 fps
//   left 5 one-frame ticks of 1740, so that pair is still judged by the sweep
//   rule alone and reccheck says so rather than passing quietly.
//
//   TWO THINGS THIS ARM CORRECTED IN WORK IT DID NOT TOUCH.
//   - cl_netfps IS NOT A FREE VARIABLE (Net_MatchTicrate, cl_main.qc:108).  The
//     batch was designed with it as a fourth axis; CSQC overwrites it with
//     1/pm_ticrate on every map load.  One usercmd per mover tick, always.
//   - p420live.cfg's incidental finding was WRONG and is corrected there: the
//     stale cheat.rec/cheat.view pair in data/runs IS caught, at 51.03% of
//     joined moves, because the .rec that arm wrote is the swept one.
