cfg_save_auto 0

// ===========================================================================
//  P443GRACE -- ONE jump out of the start, taken across a `retry`.
//    python tools/p443start.py --arm grace
//  No fixture and no zones override.  The driver forces `+set sv_gamemode surf`
//  for the reason cfg/test/p443hop.cfg's THE MODE paragraph gives: on bhop map
//  rules cfg/lobby/mode_bhop.cfg sets run_starthop 0 and there is no rule to break.
//
//  WHY THIS ARM EXISTS.  An independent review of Patch 443 round 1 reported that
//  the `run_t_startok` half accuses an HONEST player, and traced it rather than
//  measuring it.  The trace: `retry` runs map_restart, which destroys every edict,
//  so the restored attempt has run_t_groundsec 0 -- and the dwell the hop rule
//  grades is `SV_ClockSec(e) - run_t_groundsec` (SV_TimerJumpWatch's `dwell`), read as 0 when
//  the field is 0.  A player holding +jump across the restart jumps on the first
//  grounded tick (pm_autobunny 1, default.cfg:105), which is inside
//  run_prestrafe_time, so the ONE jump out of the start is called a hopped start.
//  Build 19 set run_t_startok TRUE at the restore FOR THIS REASON -- its own comment
//  says "a fresh edict where every field reads zero" -- and round 1 removed that
//  protection for the ARMED case without putting anything in its place.
//
//  AND THE FIX THIS ARM GRADES IS ROUND 3'S, NOT ROUND 2'S.  Round 2 answered with a
//  one-shot flag a placement set and SV_TimerArm cleared; a second review showed the
//  arm can hand the rule the same blind dwell having just cleared the flag, and that
//  THIS FILE was staging a zones override which is exactly what stops the arm edge
//  from happening -- so the fix was measured only where SV_TimerArm could not reach
//  it.  Round 3 reads run_t_jumps instead: the first jump of an attempt is the one
//  run_starthop's own line permits ("more than one jump"), the arm and the re-arm both
//  zero the count, and no new state is involved.  This file now runs on the SHIPPED
//  zones, with that arm edge present, which is the configuration 37 of 48 authored
//  start regions are in.
//
//  A REVIEWER'S TRACE IS NOT A MEASUREMENT, which is why this file exists rather
//  than a patch: one "certain" finding in the Patch 441 series was disproved by
//  reading the code it named.  This grades the gesture.
//
//  THE GESTURE, AND WHY IT IS ONE JUMP AND NOT A CHAIN.  p443hop.cfg's J1 holds
//  +jump for 1.4 s, which is the CHEAT -- a chain inside the box -- and it is
//  correctly accused.  The honest gesture differs in exactly one thing: the button
//  goes up again before the second hop can land.  A jump is airborne
//  2 * 302 / sv_gravity = 0.755 s, so a release inside that window admits exactly
//  one.  `jumps` is GRADED at 1 for that reason: 2 is the chain, which is a different
//  arm's subject, and 0 is a button that never reached a usercmd.
//
//  ARMS, in log order:
//   C   the premises: `start on leave`, `starthop 1`, `timer: armed`, `start: ok 0`
//       on a fresh arm, and `dwell 3.00` once the threshold is set.
//   C1  THE IN-ARM CONTROL, AND IT IS THE WHOLE ARGUMENT: the SAME one jump, taken
//       after a dwell the rule accepts.  It must not be accused.  So C1 and G differ
//       in exactly one thing -- whether a map_restart happened in between -- and the
//       dwell the player has earned is 3 s in both.
//   C2  land and stand again, so the dwell is satisfied at the moment of the retry
//       too.  Without this the retry would be taken 0.4 s after C1's landing and G
//       would be accused for a reason that is not the restart.
//   G   the restored attempt, STANDING: the dwell the rule is about to judge, printed
//       before anything is pressed.  `jumps 0` here, and the ground phase is the
//       credit the restart left -- compare C's 4.7 s.
//   G2  SUBJECT: the same one jump as C1, now taken after that restart.
//
//  PRE-REGISTERED PREDICTIONS -- "both builds", because this is now a GUARD: the change
//  it was written for is withdrawn, and what it protects is that the honest gesture is
//  not accused.
//   C   `start on leave`, `"run_starthop" is "1"`, `timer: armed`, `start: ok 0`.
//   C1  `jumps 1`, `hopped 0`, no message -- the gesture is legal before the retry.
//   C2  `timer: armed`, the ground phase over 3 s again.
//   G   `dwell 30.00` (the threshold re-latched across the restart), `jumps 0`, `armed`.
//   G2  `hopped 0` and NO `hopped start` line: the same single jump, after the restart,
//       is not accused.  And no first-jump line either (`gracen 0`) -- there is nothing
//       to forgive, because the rule is off for a restored arm.
//  FALSIFIED IF C reads `start on jump` or `starthop 0` (the mode override did not take:
//   NO VERDICT, as p435mode.cfg says of the same premise), or C1 is accused (then the
//   threshold and not the restart is what this arm measured), or G2 IS accused -- which
//   is the whole thing this guard exists to catch.
//
//  RESULT.  Four readings, and the file is the record of all four.
//   ROUND 1 (qwprogs 88E5939564887CAD) -- THE REVIEW WAS RIGHT, and this was the
//   measurement it lacked, taken with a zones override staged:
//     C1 `jumps 1`, `hopped 0`, no message -- legal before the retry.
//     G  `dwell 30.00`, `jumps 0`, `phase: ground 0.80` against C's 4.70: the dwell
//        credit the player had earned did not survive the restart.
//     G2 `jumps 1`, `hopped 1`, and `hopped start -- one jump out of the start, or walk
//        out`.  THE SAME ONE JUMP, accused because a map_restart happened.
//   Run WITHOUT the override, the same sections read `hopped 0` with the message still
//   present: bhop_eazy's shipped slab hides the restored body (Patch 415's rounding), so
//   `azone` comes back -1 and the first drift into the slab is an ARM EDGE whose
//   SV_TimerArm clears the taint a second later.  Cosmetic on a map whose slab bottom is
//   its floor; the rank on every other one.
//   ROUND 2 passed this arm -- and only because of that override, which is what
//   suppresses the arm edge that clears round 2's own flag.  Recorded because the arm was
//   GREEN while measuring the one configuration where the fix could not fail.
//   ROUND 3 (6BF223C658C8AAF0), on the SHIPPED zones with the edge landing: one
//   `timer: first jump not judged, dwell 0.15 of 30.00`, no accusation, `azone 0`.
//   ROUND 4 (4F7380452CCCAC68), the change withdrawn: `hopped 0`, no accusation, and no
//   first-jump line -- the same reading as pre-443, which is what a guard should give.
//   Driver exit 0 on both sides.  The reason for the withdrawal is in p443hop.cfg's
//   header and in sv_saveloc.qc's withdrawn startok block; in one line, the retry
//   launders run_t_hopped by itself and restores velocity through no gate, so judging a
//   restored arm closes nothing while costing an honest player a taint.
log_enable 1
log_dir logs
log_name p443grace
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
sv_port 27701
sv_cheats 0
set run_resume 0
vid_fullscreen 0
waitms 5000
map bhop_eazy
waitmap 2400
waitms 3000
menu_restart
ui_close
waitms 1200

echo ==== C the fresh arm, and the two premises ====
run_starthop
waitms 300
cmd timer
waitms 800

// THE RULE'S OWN THRESHOLD IS THE FORCING KNOB.  run_prestrafe_time is `want` in
// SV_TimerJumpWatch's `want` and is latched per map (SV_TimerMapInit), so setting it
// here takes effect for THIS map and again at the retry's map_restart -- `dwell 3.00`
// in the report is the premise, graded at G where the restart re-latched it.
// THIRTY SECONDS, and the size is deliberate rather than realistic.  A cfg cannot
// time a keypress to land inside a quarter second of a spawn whose moment it does not
// know -- three cuts of this section tried and read `jumps 0` every time, because the
// client sends no usercmds while the map reloads and `cmd timer` one second after the
// restore still showed `ground 0.00  air 0.00  jumps 0`, i.e. a body that had not yet
// moved at all.  A 30 s window makes the spawn's timing irrelevant: wait until the
// player is demonstrably standing, then jump.  It also stops run_rearmhop forgiving
// the verdict before it is read, since that needs `want` of ground dwell too.
// WIDENING IT DOES NOT CHANGE THE MECHANISM: the dwell is still
// `SV_ClockSec(e) - run_t_groundsec` and the restart still zeroes the field.  At the
// shipped 0.25 the same hole is 0.25 s wide -- which is exactly the width a +jump
// held across the restart lands in, since pm_autobunny fires it on the first grounded
// tick.  What this arm cannot do is land that keypress on purpose.
run_prestrafe_time 30
waitms 400

echo ==== C1 THE SAME GESTURE, LEGAL: one jump after a dwell the rule accepts ====
// Standing since the spawn, so the dwell is over 3 s and this jump is the one the
// rule permits.  It must NOT be accused.  Under leave-the-box rules a jump inside the
// box starts no run, so the attempt is still ARMED afterwards.
waitms 3200
+jump
waitms 200
-jump
waitms 700
cmd timer
waitms 800

echo ==== C2 land and stand again, so the dwell is satisfied at the retry ====
waitms 3400
cmd timer
waitms 800

echo ==== G SUBJECT: the same one jump, one second after a retry ====
// THE RETRY IS TAKEN STANDING, and the jump comes AFTER the restart, not across it.
// Two earlier cuts of this section held +jump across the retry and read `jumps 0`
// both times: the button went up before the player's first usercmd, and the 200 ms
// of held jump before the retry wrote the point MID-JUMP, so the restore put the
// body back airborne -- `phase: ground 0.00  air 0.25  jumps 0` with four `jump z`
// lines that all belong to the pre-retry jump.  Neither cut measured the subject.
// Three seconds of standing after the restart, read by the first `cmd timer` so the
// log carries the dwell the rule is about to judge, and then the jump -- all inside
// the 30 s window, so no part of this depends on when the spawn happened.
// `dwell 30.00` is the premise: the restart re-latched the threshold.
retry
waitmap 2400
waitms 3000
cmd timer
waitms 600

echo ==== G2 and now the jump, with the dwell G1 just printed ====
+jump
waitms 200
-jump
waitms 700
cmd timer
waitms 1000

quit
