// P409HOP -- a booster is not a jump; the jump BUTTON is.  Reported live 2026-09-20 on
// surf_666 bonus 3: "When you fall onto the booster at the start of B3 you still get pred
// error AND you get flagged for practice! you have to 'fall' there is a pit you need to
// fall into and this caused it to believe you 'hopped'?"
//   ftesurf64.exe +set vid_winmaximize 0 -WindowStyle Minimized +exec cfg/test/p409hop.cfg
//
// THE DETECTOR HAS ONE SIGNAL AND ONE EXCLUSION, and the exclusion has a blind spot.
// SV_TimerJumpWatch reads a jump as velocity_z crossing PM_NONJUMP_VEL (140) from at or
// below it, excluded only by run_rampcontact.  PMSrc_TryPlayerMove clips
// velocity+basevelocity against the plane and subtracts only the carrier back out, so a
// horizontal push deflected off a slope leaves its Z in .velocity -- but pm_source.c sets
// rampcontact only for |n_z| in [0.1, 0.7], and B3's pit floor is STANDABLE (26.57 deg,
// n_z 0.89).  From the player's own log: (0, +43.5, +21.7) per command at pm_ticrate 0.015
// is v = (133, 2920, 1453), the map's 3000 u/s pad clipped 2:1, and the vertical decay is
// ~240 u/s^2 against gravity's 800 -- a body held on a surface, not one that jumped.
//
// WHY THE GATE IS THE BUTTON AND NOT THE NUMBER.  Two earlier drafts were reviewed out:
//   draft 1  `!run_pushed`                     -- a continuous pad re-arms every command,
//            so it switched the rule OFF for the whole time you stood in the volume.  On
//            the 21 maps whose start box overlaps a push (census: 1316 bsps, 21 overlap,
//            36 more within 300 u) a deliberate bhop start would have ranked.
//   draft 2  `vz <= PM_JUMP_IMPULSE * 1.05`    -- beaten.  CheckJumpButton runs BEFORE
//            AirMove, and AirMove is where the carrier is added, clipped and subtracted
//            back, so the impulse and the clip's gain land in the same tick and ADD: a
//            bhop out of this very start box reads ~1259 (296 jump + ~963 clip) against a
//            bound of 317.  It also missed vertical pads entirely, whose Z is spent as an
//            acceleration and crosses 140 at ~140.
//   shipped  `!run_pushed || run_jumpcmd`      -- CheckJumpButton is the only path to a
//            commanded rise and needs the jump button AND pre-move ground.  A body falling
//            into a pit has neither, and no floor angle changes that.
//
// Shipped zones, NOT a fixture: maps/zones/local must be empty.
//
// THE ARMS ARE A AND B OF ONE GESTURE, both on the patched build, which is what makes this
// a falsifier without needing a control binary: the only difference between J1 and J2 is
// whether +jump is held.  The setpos point is inside the START box AND inside the pad
// (x 9965 -- probing found the pad's brush is far narrower in x than its model AABB, see
// H2 below), so the state stays TS_ARMED and `run_t_hopped` is observable.  In TS_ARMED
// the hopped latch is NOT guarded by run_t_dirty, so setpos tainting the run does not hide
// it -- only the console sprint is suppressed.
//
// PRE-REGISTERED
//  H1 `!b 3` arms bonus 3: `cmd timer` reports ok 0 hopped 0, ground phase, jumps 0.
//  H2 the probe arms a carrier: a `basevel: paid #N ... 3000.000000 ...` line appears.
//     If none does, J1/J2 are not measurements -- say so, do not report them as passes.
//  H3 the detector actually fires there: `phase: jumps N` with N >= 1 and
//     `ramp: contact 0`.  If jumps stays 0 the arm is vacuous for the same reason.
//  J1 carrier, NO +jump  -> hopped 0.   <- the reported bug, withdrawn
//  J2 carrier, +jump held -> hopped 1.  <- the CRITICAL both reviewers found, still closed
// FALSIFIED IF J1 reports hopped 1 (the player's bug is not fixed) or J2 reports hopped 0
// (the rule is switched off inside push volumes, which is the hole draft 1 opened).
//
// RESULTS 2026-09-20 (logs/p409hop.log), patched build, shipped zones.  All five hold.
//   H1  ok 0 hopped 0, ground 2.27 air 0.00, jumps 0.
//   H2  held, and it corrects the geometry: an earlier probe pass armed NOTHING at x 9440
//       while x 9950/9965 armed every time, so the +y pad's BRUSH is far narrower in x
//       than its model AABB (8832..10048).  That is also why p403b666.cfg found the `!b 3`
//       rest position never reaches a pad.  J1/J2 print
//       `basevel: paid #N ... '-0.000131 3000.000000 0.000000'`, i.e. the map's 3000 u/s
//       carrier, with `v +0.0` -- the Z comes from the mover's clip, not from the carrier,
//       which is the patch's whole claim.
//   H3  held: `phase: jumps 1` (J1) and `jumps 2` (J2) with `ramp: contact 0` on both.
//       The detector really does fire on a booster with nothing to excuse it.
//   J1  carrier, no jump  -> `start: ok 1 ... hopped 0`   <- the reported bug, withdrawn
//   J2  carrier, +jump    -> `start: ok 1 ... hopped 1`   <- the rule, still armed
//
// The two arms differ in ONE input and the verdict flips, which is what makes this a
// falsifier with no control binary: draft 1 (`!run_pushed`) gives hopped 0 on BOTH, and an
// unpatched build gives hopped 1 on both.  Only the shipped gate separates them.
//
// The J2 log also prints `basevel: OnJump from *409 vz 290` -- an independent witness that
// the jump really was commanded, at the 290 u/s a jump reads after FinishGravity, which is
// the number draft 2's bound was calibrated against and could not distinguish.
//
// STILL WORTH A HUMAN: this drives the gesture with setpos, not by falling down the pit.
// The player's own retest of B3 is the confirmation that matters.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p409hop
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
sv_port 27651
sv_cheats 1
set run_resume 0
set run_starthop 1
set run_starthop_strict 1
set run_startcap 0
set run_bv_debug 1
vid_fullscreen 0
waitms 5000
map surf_666
waitmap 2400
waitms 3000

echo ==== H1 arm bonus 3 ====
cmd say !b 3
waitms 1500
cmd timer
waitms 800

// The start box is x 8416..10464 y 8376..10424 from z -13952; the +y pad is
// x 8832..10048 y 10040..11448 z -13984..-13712.  This point is in both, so the run stays
// ARMED while a carrier acts on it.
echo ==== J1 carrier, no jump ====
setpos 9965 10200 -13945
waitms 2500
cmd timer
waitms 800

echo ==== re-arm to clear the latch ====
cmd say !b 3
waitms 1500
cmd timer
waitms 600

echo ==== J2 carrier, +jump held ====
+jump
waitms 200
setpos 9965 10200 -13945
waitms 2500
-jump
waitms 300
cmd timer
waitms 800

echo ==== END ====
waitms 800
quit
