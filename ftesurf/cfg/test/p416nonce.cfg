// Patch 416 -- THE PER-RUN NONCE, on a listen host.  SUBJECT ARM.
//
// The route is b352fin.cfg's, unchanged and for its reason: it is the one
// scripted walk in this tree that reaches bhop_eazy's END zone, and a nonce is
// only interesting on a recording that CLOSED -- the `flags` line is written at
// the finish.  The run is noclipped and therefore cheated, which does not
// matter here: this arm is about the header key and the answer bit, and a
// cheated run writes both exactly as a clean one does.
//
// The journal is written MID-RUN, on purpose.  Rec_HidEnd keeps a .hid only for
// a PB (cl_replay.qc), and a cheated run is not one -- so the harness asks the
// engine for the buffer directly while it is still open.  That reads the same
// journal Rec_HidBegin opened; it changes no shipped policy.
//
// Run from C:\FTESurf:
//   ./ftesurf64.exe -WindowStyle Minimized +exec cfg/test/p416nonce.cfg
// then:
//   grep -i nonce ftesurf/data/runs/bhop_eazy/main/cheat.rec
//   grep -n "^flags" ftesurf/data/runs/bhop_eazy/main/cheat.rec
//   grep -n nonce ftesurf/data/p416_S.hid
//   python tools/reccheck.py ftesurf/data/runs/bhop_eazy/main/cheat.rec
//
// PRE-REGISTERED PREDICTIONS
//  S1  the .rec header carries exactly one `nonce <32 lowercase hex>` line,
//      written by SV_RecOpen between `runid` and `mapcrc`.
//  S2  its `flags` value has bit 131072 (TF_NONCE) SET: the client answered
//      `cmd rec_nack` with the same string.  This is the bit the control must
//      NOT have, and it is the whole arm -- everything else here is shape.
//  S3  data/p416_S.hid carries a `nonce <hex>` note, and the hex is S1's.  The
//      note proves the number reached the journal while the journal was open,
//      which is the property a later patch signs over.
//  S4  reccheck.py reports no NEW fault on the file (a noclipped run's existing
//      findings are not this patch's).
//  S5  exactly one nonce line in the body: none.  A `nonce <mt> <hex>` record
//      belongs to a resumed session and this run has no pause.
// FALSIFIED IF the header has no nonce, the flags bit is clear, the .hid note
//   is missing or disagrees with the header, or reccheck gains a fault.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p416nonce
developer 0
cl_idlefps 0
cl_maxfps 100
sv_cheats 0

set rec_enable 1
set rec_stream 1
set rec_runarchive 1
set rec_hid 1

in_speedbutton 1

waitms 6000
map bhop_eazy
waitmap 45
waitms 3000

echo ================================ P416 S -- armed, not started
cmd timer
waitms 1000

echo ================================ P416 S -- aim
cmd zone_goto 0
waitms 1000
setpos -352 -352 144 0 335.3 0
waitms 1000

echo ================================ P416 S -- jump: this starts the run, and the
echo ================================ P416 S -- server issues the nonce on the same packet
+jump
waitms 700
-jump
waitms 1500
cmd timer

echo ================================ P416 S -- freeze the journal while it is open
in_journal_end data/p416_S.hid
waitms 1200

echo ================================ P416 S -- fly to the end zone
noclip
waitms 500
+forward
waitms 1500
cmd timer
waitms 2900
cmd timer
waitms 2000
-forward
waitms 1500

echo ================================ P416 S -- after the end zone.  Expect FINISHED.
cmd timer
waitms 2500

echo ================================ P416 S done
waitms 500
quit

// RESULT (2026-09-21, re-run on the post-review build; the first run's numbers
// are superseded, and the difference is only which nonce was drawn):
//   ALL FIVE HELD.
//   S1  `nonce 0635273dc6f2d8dd42525be8d788cc20` at header line 11, between
//       `runid` and `mapcrc`.
//   S2  `flags 131329` = 131072 (TF_NONCE) + 256 (TF_CHEAT) + 1 (TF_PRACTICE).
//       The control arm's same route reads 257, so the bit is the answer.
//   S3  data/p416_S.hid line 57: `# 0 nonce 0635273dc6f2d8dd42525be8d788cc20`
//       -- the same 32 characters, stamped at stream position 0.
//   S4  reccheck.py: ok, 0 faults, on both the .rec and the .view.
//   S5  one `nonce` line in the whole file and it is the header's.
//   Kept as data/p416/s.rec and s.hid.
//
//   WHAT THIS ARM CANNOT SEE, and it took three reviews to say so: it runs ONE
//   run per map load, which is the only case where the client holds no nonce
//   when its journal opens.  The note it checks was written by Rec_Nonce and
//   not by the Rec_HidBegin line the first cut thought was writing it, and the
//   difference is invisible here.  p416twice.cfg is the arm that sees it.
