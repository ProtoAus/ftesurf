// H1b -- the acceptance band across the width of the doorway.
//
// This is the physics half of the half-extent fix, and it is the thing that most
// plausibly explains "you just walk forward into the room and it's gone".
//
// portal_hub_exit is at 0 -520 184 facing -y, and its frame opening in the
// `kitsune` func_brush is 176 units wide (measured, twice, to 0.03 units).  The
// entity declares width 88.  Before the fix both cl_portal.qc and sv_entities.qc
// halved that again, so:
//
//   * the aperture DREW 88 wide  -- the reported "square that doesn't cover the door"
//   * the aperture ACCEPTED 88 wide -- so the outer ring of the doorway, from 44 to
//     88 units off centre on each side, was a hole you could walk into that did
//     NOT teleport you.  Behind every one of kitsune's 18 apertures is SOLID
//     (measured: solid at y=-480, open at y=-520).  Walk in off-centre and you go
//     nowhere, with the destination room never loading.
//
// So: step across the doorway in 22-unit increments and walk forward at each one.
// The hub is black; stage 1 is a saturated rainbow corridor.  A screenshot tells
// the two apart with no ambiguity at all, so each arm is classified by mean
// saturation rather than by eye.
//
//   BEFORE the fix the expected pattern is: cross only within +-44.
//   AFTER  the fix it should cross across the whole +-88.
//
// The player falls while walking, so an arm can also fail by dropping below the
// aperture rather than by being refused.  The aperture is +-88 tall now, so a
// short walk stays inside it; the signal to read is the SHAPE of the pattern
// (symmetric, cutting off at a particular offset), not any single arm.

cfg_save_auto 0
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "h2_band"
scr_sshot_type png
cl_yieldcpu 0
cl_maxfps 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0
vbsp_portal_render 1

waitms 2500
map surf_kitsune
waitmap 240
waitms 8000
sv_cheats 1

// The door's right axis is -x (yaw 270), so offsets are along x.  Standing 120
// units in front of the plane at 0 -520, i.e. y = -640, facing +y.

echo "@@@ BAND x-88"
setpos -88 -640 184 0 90 0
waitms 1200
+forward
waitms 900
-forward
waitms 1200
screenshot_mega h2b_m88 1280 720
waitms 500

echo "@@@ BAND x-66"
setpos -66 -640 184 0 90 0
waitms 1200
+forward
waitms 900
-forward
waitms 1200
screenshot_mega h2b_m66 1280 720
waitms 500

echo "@@@ BAND x-44"
setpos -44 -640 184 0 90 0
waitms 1200
+forward
waitms 900
-forward
waitms 1200
screenshot_mega h2b_m44 1280 720
waitms 500

echo "@@@ BAND x-22"
setpos -22 -640 184 0 90 0
waitms 1200
+forward
waitms 900
-forward
waitms 1200
screenshot_mega h2b_m22 1280 720
waitms 500

echo "@@@ BAND x0"
setpos 0 -640 184 0 90 0
waitms 1200
+forward
waitms 900
-forward
waitms 1200
screenshot_mega h2b_p00 1280 720
waitms 500

echo "@@@ BAND x+22"
setpos 22 -640 184 0 90 0
waitms 1200
+forward
waitms 900
-forward
waitms 1200
screenshot_mega h2b_p22 1280 720
waitms 500

echo "@@@ BAND x+44"
setpos 44 -640 184 0 90 0
waitms 1200
+forward
waitms 900
-forward
waitms 1200
screenshot_mega h2b_p44 1280 720
waitms 500

echo "@@@ BAND x+66"
setpos 66 -640 184 0 90 0
waitms 1200
+forward
waitms 900
-forward
waitms 1200
screenshot_mega h2b_p66 1280 720
waitms 500

echo "@@@ BAND x+88"
setpos 88 -640 184 0 90 0
waitms 1200
+forward
waitms 900
-forward
waitms 1200
screenshot_mega h2b_p88 1280 720
waitms 500

echo "@@@ BAND x+110 (outside the doorway -- must NOT cross)"
setpos 110 -640 184 0 90 0
waitms 1200
+forward
waitms 900
-forward
waitms 1200
screenshot_mega h2b_p110 1280 720
waitms 500

echo "@@@ H1b DONE"
waitms 1000
quit
