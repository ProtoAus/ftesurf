cfg_save_auto 0
// E3 part 2 -- re-simulate the traces captured by e3recsim.cfg.
// Recording is OFF here: a live recorder would reopen data/parts/0.rec and
// overwrite the very trace this is measuring.
log_enable 1
log_dir logs
log_name e3run
developer 0
sv_cheats 0
set rec_enable 0
set rec_stream 0

waitms 5000
map bhop_eazy
waitmap 45
waitms 3000

echo ================================ E3 SUBJECT -- real bhop, clean run, 1340 rows
pm_recsim data/e3trace.rec
waitms 1500

echo ================================ E3 CONTRAST -- the build-82 noclip flight
echo ================================ pm_type is NOT in the file so pm_recsim assumes PM_NORMAL
echo ================================ so this one SHOULD diverge -- the control that says the command
echo ================================ can tell a reproduction from a non-reproduction
pm_recsim data/runs/bhop_eazy/main/cheat.rec
waitms 1500

echo ================================ E3 done
waitms 500
quit
