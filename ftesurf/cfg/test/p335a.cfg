// Patch 335, ARM A -- the trigger mirror LOADS, and the listen-server gate
// HOLDS.  Single process, `map surf_rise`, no connection.
//
// WHAT IS UNDER TEST.  cl_triggers.qc walks the entity lump from
// CSQC_WorldLoaded and builds the client-side copy of every predictable
// trigger (teleport, push, setspeed).  On a listen server the engine hook is
// gated OFF (sv.active -- the Patch 240 precedent: SSQC touches are the
// authority in-process, so the client must not fire its copy too), which is
// itself an assertion: a "hook alive" line here would mean the gate is broken
// and every local trigger would double-apply.
//
// PREDICTIONS, registered before the run:
//   A  the load line appears: "trig: surf_rise -- N teleports, M pushes,
//      K setspeeds predicted" with N > 0 (surf_rise is a surf map; its
//      fall-off resets are trigger_teleports), and trig_dump repeats the
//      census with the filtered/startdisabled/over-cap counts.
//   B  "prediction hook alive" does NOT appear anywhere in this log.
//   C  SERVER REGRESSION: trig_tp 0 setpos-es into the first teleport's box;
//      the SSQC touch must still fire (this arm changes nothing server-side,
//      but the engine was rebuilt around the mover's callers).  The viewpos
//      AFTER must not be the box centre printed by trig_tp -- the server
//      moved the player to the destination.
//
// FALSIFIED IF: no load line (lump walk broken), a hook-alive line appears
// (gate broken), or the post-trig_tp viewpos still sits inside the box
// (server teleport regressed).
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p335a
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0
sv_cheats 1
wait 200
map surf_rise
waitmap 1800
waitms 2500

echo ^5=== p335a A: census ===
trig_dump
waitms 400
trig_here
waitms 600

echo ^5=== p335a B: (absence) hook must not be alive on a listen server ===
waitms 800

echo ^5=== p335a C: server-side teleport regression ===
cmd viewpos
waitms 400
trig_tp 0
waitms 1200
cmd viewpos
waitms 400

echo ^5=== p335a done ===
waitms 300
quit
