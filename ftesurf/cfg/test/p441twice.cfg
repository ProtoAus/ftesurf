cfg_save_auto 0

// ===========================================================================
//  P441TWICE -- the SECOND load of the same row, which no arm covered.
//    python tools/p441void.py --arm twice
//  The fixtures and the staging are in cfg/test/p441void.cfg's header.  No zones
//  fixture: nothing here asks a zone a question.
//
//  WHY THIS ARM EXISTS.  Patch 441's void fires on
//  `st == TS_RUNNING && (SV_RecEnabled() || hadrec)`, and an audit of the arms
//  found that NOT ONE OF THEM exercised either clause alone: rest, fast and mid
//  all load a row with a recorder live (both clauses true) and norec loads one with
//  neither.  So the predicate could have been cut down to either half and every arm
//  would still have passed -- which is the same defect as an arm whose condition
//  never occurs, one level up.  p441mid.cfg is the arm for `hadrec` alone (the
//  server has stopped recording, this run still holds a recorder).  THIS is the arm
//  for `SV_RecEnabled()` alone: the run holds no recorder, and the server records.
//
//  HOW A RUNNING SAVE IS LOADED WITH NO RECORDER LIVE: load it twice.  The first
//  load voids the run, and the void discards the recording; the second load then
//  restores TS_RUNNING out of the same file with `hadrec` FALSE.  `sl_goto <n>` is
//  itself a load (sv_player.qc:1046), so this is two keypresses, and it is exactly
//  the case that killed the `wasrec`-alone predicate of round 1 -- which was argued
//  in a commit message and measured by nothing until this file.
//
//  ARMS, in log order:
//   C1  leave the start box: `timer: running`, `recording 1`.
//   S1  the FIRST load of row 1.  Both clauses true, so this is p441void's case
//       without the zones fixture: `run cancelled`, `timer: idle`.
//   S2  the SECOND load of row 1.  `hadrec` is now FALSE -- the first void took the
//       recorder down -- and SV_RecEnabled() is TRUE, which is the whole subject.
//
//  PRE-REGISTERED PREDICTIONS
//   C1  `timer: running`, `recording 1`.
//   S1  `run cancelled (the save's recording could not be restored)`, `timer: idle`,
//       clock held at 0:05.000, on BOTH builds.
//   S2  FIXED: the cancel line again, `timer: idle`, clock 0:05.000, `recording 0`.
//   S2  CONTROL -- and the control here is the fix COMPILED OUT, not an older
//       commit.  REPRODUCE IT EXACTLY: in a worktree at this commit, replace the
//       condition in SV_SaveApplyState's failed-rewind branch with
//           if (st == TS_RUNNING && (hadrec))
//       and build.  Then the second load voids nothing: `timer: running` with the
//       restored clock counting PAST 0:05.000, and `practice 1  class: segmented`
//       where the fixed build is idle.  NOT `recorder: buffer -1` -- that reads -1 on
//       both builds, because the void discards the recorder too, and an audit caught
//       this file quoting it as the defect.
//  FALSIFIED IF S1 does not cancel (the fixture is not reaching the branch at all),
//   or S2 reads `running` on the fixed build, or S2 reads `idle` on the compiled-out
//   control (then the SV_RecEnabled clause is doing nothing and the predicate should
//   lose it).
//
//  RESULT (2026-09-26, both builds, driver exit 0 each way; qwprogs
//   3096B6F5468BEE3A fixed / 8B84B5CE71C058E8 control.  The control is THE FIX
//   COMPILED OUT: the same tree with the predicate cut to `hadrec` alone, built in
//   a worktree, which is the only way to isolate this clause -- no commit does.
//   Logs kept as ftesurf/logs/p441twice.log.fixed and .control.)
//   C1 `timer: running`, `recording 1`.
//   S1 BOTH builds: `run cancelled`, `timer: idle`, clock 0:05.000, `stopped 1`.
//      Both clauses are true there, so the first load is not the subject.
//   S2 CONTROL (hadrec alone): NO cancel line, `timer: running`, the clock PAST the
//      parked 0:05.000 and still counting (0:06.400 in the run on disk; the exact
//      value is the driver's own latency, which is why it is graded as `>5.0`)
//      counting past 0:05.000, `recorder: buffer -1`, `practice 1`,
//      `class: segmented` -- the second load of one row leaving a RUNNING attempt
//      with no recorder, which is Patch 434's defect.
//   S2 FIXED: `run cancelled` again, `timer: idle`, clock 0:05.000, slot 901.
//   So the SV_RecEnabled clause is load-bearing, measured rather than argued.  Its
//   partner is measured the same way by p441mid.cfg, whose control is 441's own
//   first commit.  Before these two arms existed, either clause could have been
//   deleted with every arm in the set still green -- which an audit found by
//   reading the fixtures' `reclines` against the runs' `recording`.
log_enable 1
log_dir logs
log_name p441twice
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
sv_port 27696
sv_cheats 0
set run_resume 0
vid_fullscreen 0
waitms 5000
map bhop_eazy
waitmap 2400
waitms 3000
menu_restart
ui_close
waitms 1200

echo ==== C0 the list ====
cmd sl_list
waitms 800

echo ==== C1 leave the start box: must read running / recording 1 ====
+forward
waitms 1500
-forward
waitms 700
cmd timer
waitms 800

echo ==== S1 the FIRST load of row 1: both clauses true, cancels on both builds ====
cmd sl_goto 1
waitms 1400
cmd timer
waitms 800

echo ==== S2 the SECOND load of row 1: hadrec is gone, only the server's answer left ====
cmd sl_goto 1
waitms 1400
cmd timer
waitms 800

quit
