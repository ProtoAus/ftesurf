cfg_save_auto 0
// P885 review 1 -- an attempt that never stood in the start box keeps the old judgment.
//   python tools/p884arms.py --control <dir> --fixed <dir> --side v2=<dir> --out <dir> p885walk
// The review's hole: fly through a small start box in the air (it arms, never rests), land
// outside and hop, and the speed built before the box ranks.  No small box here, so the
// same state is made on surf_tendies by raising run_prestrafe_time to 5 s: walk off the
// ledge 1-2 s after !r, ARMED but never 5 s at rest, then the first jump is outside.
//   W  control `practice 1`; P885 as first reviewed (7cfaae5a) `practice 0` -- the hole;
//      P885 after review `practice 1`.  `jumps` >= 1 and `running` on all three.
//   FALSIFIED IF the reviewed-out build reads practice 1 (the arm cannot see the hole) or
//   the fixed one reads practice 0.  p885hop.cfg's H is the same gesture after a rest.
log_enable 1
log_dir logs
log_name p885walk
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
sv_port 27704
sv_cheats 0
set run_resume 0
set run_prestrafe_time 5
vid_fullscreen 0
waitms 5000
map surf_tendies
waitmap 2400
waitms 3000
menu_restart
ui_close
waitms 1200

echo ==== C the start, the rule on, the dwell raised ====
run_starthop
run_prestrafe_time
cmd zone_reset
waitms 300
cmd timer
waitms 300

echo ==== W walk off the ledge unrested, land on the booster, hop ====
cl_yawspeed 100
+right
waitms 647
-right
+forward
waitms 800
+jump
waitms 1000
cmd timer
cmd viewpos
waitms 800
-jump
-forward
waitms 300

quit
