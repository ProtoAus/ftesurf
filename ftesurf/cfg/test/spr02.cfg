// SPR02 -- LOOK AT THE PIXELS.  A/B on three maps, same camera both times.
//
// Every viewpoint is derived from the entity lump, not guessed: each is 500
// units back from the centroid of the densest cluster of the class in
// question, looking at it.  So the frame is known to contain the thing being
// tested, which "screenshot at spawn" does not guarantee.
//
//   surf_grotto   16 point_spotlight in one cluster   the light shafts
//   bhop_rpg      32 env_sprite in one cluster        billboards
//   bhop_murder   33 env_sprite_oriented in one       the fixed-angle quads
//
// noclip is issued ONCE before the first setpos -- setpos leaves you in
// MOVETYPE_WALK and you fall out of frame before the shot lands, and toggling
// noclip per shot inverts it.
//
// The OFF shot is taken through vbsp_sprites/vbsp_spotlights + retry, which is the
// same path the gfx_menu row uses, so this doubles as the menu-applies test.

log_enable 1
log_dir "logs"
log_name "spr02"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
sv_cheats 1
rec_retry 1
r_speeds 0

wait 200

// ---------------------------------------------------------------- grotto
vbsp_sprites 1
vbsp_spotlights 1
map surf_grotto
waitmap 1800
waitms 5000
noclip
waitms 300
setpos 2324 -1998 3388 13.5 0.0 0
waitms 1200
screenshot spr02_grotto_on
waitms 600
vbsp_spotlights 0
retry
waitmap 1800
waitms 5000
setpos 2324 -1998 3388 13.5 0.0 0
waitms 1200
screenshot spr02_grotto_off
waitms 600
vbsp_spotlights 1

// ---------------------------------------------------------------- bhop_rpg
map bhop_rpg
waitmap 1800
waitms 5000
noclip
waitms 300
setpos 276 2139 -578 13.5 0.0 0
waitms 1200
screenshot spr02_rpg_on
waitms 600
vbsp_sprites 0
retry
waitmap 1800
waitms 5000
setpos 276 2139 -578 13.5 0.0 0
waitms 1200
screenshot spr02_rpg_off
waitms 600
vbsp_sprites 1

// ---------------------------------------------------------------- murder
map bhop_murder
waitmap 1800
waitms 5000
noclip
waitms 300
setpos 14117 3377 -970 13.5 0.0 0
waitms 1200
screenshot spr02_murder_on
waitms 600
vbsp_sprites 0
retry
waitmap 1800
waitms 5000
setpos 14117 3377 -970 13.5 0.0 0
waitms 1200
screenshot spr02_murder_off
waitms 600

echo ^5=== spr02 done ===
wait 30
quit
