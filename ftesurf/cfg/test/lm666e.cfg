// LM666E -- are the flat bright surfaces BRUSH ENTITIES?
//
// Everything measured so far says the WORLD is fine:
//   light_here on eight aims: every one has an atlas page (lmpage=0 or 1),
//   samples=yes, haslightmap=1, style 0, d_lightstylevalue 264, and a lightmap
//   block mean of 0.06-0.27 -- dark, exactly as the BSP's own bytes say.
//   r_texdiag: shift=1 overbright=1 on the world AND all 22 submodels, so the
//   bake-darker/multiply-back pair agrees and is not the factor-of-four bug.
//
// But the region measurements split into two populations that no world-surface
// property explains, and one of them (r_fullbright ratio ~1.00, gl_overbright 0
// exactly halves) does not even behave like the other.
//
// The thing all three instruments share: shader_here, solid_here and light_here
// all trace cl.worldmodel ONLY, and Mod_GetSurfaceNearPoint searches the world
// only.  A func_brush standing in front of a wall is invisible to every one of
// them -- they report the WORLD FACE BEHIND IT.  That is the same trap that made
// a CSQC floor trace read through a brush entity in Patch 247, and it would
// explain why the user's own shader_here came back naming a perfectly ordinary
// lit material while the picture showed something flat and bright.
//
// r_drawentities settles it in two screenshots and needs no new code:
//   2 = draw everything EXCEPT bmodels
//   3 = draw bmodels ONLY
// If the flat bright regions disappear at 2 and are the whole of the picture at
// 3, they are brush entities and the world was never the subject.
//
// Same vantage as every other lm666 run: the user's save005.

log_enable 1
log_dir "logs"
log_name "lm666e"
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 0
vid_fullscreen 0
developer 1
log_developer 1
con_notifytime 0
con_notifylines 0
con_notifytime_error 0

wait 200

map surf_666
waitmap 1800
waitms 9000
sv_cheats 1
waitms 400
noclip
waitms 400
setpos -100.325 -13112.070 11281.580 3.148 -130.446 0
waitms 2500
developer 0
waitms 1500

echo ^5=========== A: everything ==========================================
screenshot lm666e_a_all
waitms 900

echo ^5=========== B: r_drawentities 2 -- no bmodels ======================
r_drawentities 2
waitms 2500
screenshot lm666e_b_nobmodels
waitms 900

echo ^5=========== C: r_drawentities 3 -- bmodels only ====================
r_drawentities 3
waitms 2500
screenshot lm666e_c_bmodelsonly
waitms 900

echo ^5=========== D: back to 1, and gl_overbright 0 on the WHOLE frame ===
r_drawentities 1
waitms 2500
screenshot lm666e_d_all2
waitms 900
gl_overbright 0
waitms 3000
screenshot lm666e_e_ob0
waitms 900
gl_overbright 2
waitms 3000
screenshot lm666e_f_ob2
waitms 900
gl_overbright 1
waitms 2000

echo ^5=== lm666e done ===
wait 30
quit
