cfg_save_auto 0
// E5 -- THE MEASUREMENT, on two REAL runs played by hand.
//
// Four scripted sites failed to put a booster mid-run (see e5push.cfg's header
// for all four and what each one taught).  Lex played these two instead:
//
//   surf_kitsune  9998 ticks, 9996 in rows, 10252 samples, 4 `warp ... tele`
//                 records, flags 4 = TF_HAVEPB, which is NOT a taint -- it
//                 means a PB exists for this leg.  ONE continuous
//                 trigger_push in the map, so attribution is unambiguous.
//
//   surf_trance   10929 ticks, 10926 in rows, 11179 samples, ZERO warp
//                 records, flags 4.  TEN boosters in a row (300 400 500 600
//                 700 800 900 1000 1100 5000 u/s in 96-unit steps).  This is
//                 the RIDE at its most extreme and it is the run that decides
//                 the format question.
//
// Both are FTESURF-REC 7 with a full `end` trailer, so both finished.
//
// WHY pm_recsim RATHER THAN A HAND-ROLLED DETECTOR.  The first pass at reading
// these files by eye counted every velocity step over 200 u/s as a candidate
// cash-out and got 287 on surf_kitsune -- because a landing zeroes vz and a
// jump sets it, so the threshold catches every hop in a 150-second run.  The
// same pass called a 39,236-unit position step a "ride", which is a teleport.
// Both detectors were measuring the mover doing its job.  pm_recsim does not
// have that problem because it does not look for a signature at all: it RUNS
// THE MOVER and reports where the mover and the file disagree.
//
// THE THREE ARMS, and only one of them can answer this:
//
//   ARM 1  tick arithmetic.  A property of the file; the carrier cannot touch
//          it.  If this is not exact, something unrelated is broken and every
//          other number here is suspect.
//   ARM 2  pinned loop -- snaps origin and velocity to the sample at every
//          packet boundary, so it papers over an imposed state by construction.
//          It papered over the teleports in E3 and it will paper over a
//          cash-out too.  Reported for the control it gives, not for the answer.
//   ARM 3  OPEN LOOP -- seeded once, never corrected.  The only arm that can
//          say whether the file carries enough to cross a hole.
//
// AND THE TRAP THAT KILLED THE LAST ATTEMPT, stated here so this run is read
// correctly: on surf_ecosystem the cash-out landed on the run's FIRST packet,
// pm_recsim seeds the open loop from that packet, and the impulse was therefore
// baked into the seed -- arm 3 sailed through, first-past-1u at row -1.  A null
// result caused by the site, not by the format.  These two runs are 150+ seconds
// long, so a booster crossed anywhere but the first tenth of a second is past
// the seed and cannot hide in it.
//
// PRE-REGISTERED:
//
//   1  Arm 1 exact on both.
//   2  surf_kitsune's 4 warps are teleports and pm_recsim applies them, so its
//      arm 3 must survive those four.  If it dies AT a teleport, build 83's
//      record is not doing its job and that is a bigger finding than E5.
//   3  Arm 3 diverges on both, and on surf_trance it diverges at or before the
//      booster corridor -- which is early, because the corridor is near the
//      start of that map.
//   4  surf_trance has ZERO warps and is v7, so pm_recsim will report that
//      silence as a STATEMENT ("nothing imposed state on this run").  That
//      report is FALSE on this file, and its falseness is the headline: ten
//      boosters imposed state on that run and the format has no way to say so.
//
// FALSIFIED IF: arm 1 is inexact; or arm 3 survives both files intact, which
//      would mean the carrier is somehow already in the format and this whole
//      experiment is misconceived.
//
// rec_enable 0 so the live recorder cannot touch anything while two real PBs
// are being read.
log_enable 1
log_dir logs
log_name e5real
developer 0
set rec_enable 0
set rec_stream 0

waitms 6000

map surf_kitsune
waitmap 60
waitms 4000
echo ================================ E5REAL -- surf_kitsune (1 push, 4 tele warps)
pm_recsim data/runs/surf_kitsune/main/0009998_pb.rec
waitms 4000

map surf_trance
waitmap 60
waitms 4000
echo ================================ E5REAL -- surf_trance (10 boosters, 0 warps)
pm_recsim data/runs/surf_trance/main/0010929_pb.rec
waitms 4000

echo ================================ E5REAL -- done
waitms 1000
quit
