// P375BSV -- the buffered recorder (a server that is not a lobby), for p375bcl.cfg.
// Zones as p375sv.cfg.  No lobby, so runs buffer and land in data/runs locally.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p375bsv
developer 1
sv_cheats 0
set rec_enable 1
set lobby_master ""
set run_resume 0
map surf_666
waitms 60000
quit
