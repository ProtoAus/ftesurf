// Visible KSF fetch buttons: actual pointer events in CSQC and menu QC.
// tools/ksftopup_smoke.py substitutes current online terms for the fixture only.
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
vid_vsync 0
vid_fullscreen 0
vid_width 1280
vid_height 800
mastervolume 0
set rec_terms 8
set lobby_dir "http://127.0.0.1:19869"
set ui_name_chosen 1
name KsfFixture
log_enable 1
log_dir logs
log_name runlines_smoke
con_notifytime 0
waitms 15000
map surf_dune
waitmap 60
waitms 6000
menu_restart
waitms 1500
set rec_terms 8
ui_close
scores open
scores source ftesurf
waitms 1500
echo KSF FETCH RANKED CONTROL
hud_edit ui hover sb_ksmore
scores source ksf
scores style fw
waitms 1500
scores style sw
waitms 1500
hud_edit ui
hud_edit ui hover sb_ksmore
waitms 200
hud_edit ui down K_MOUSE1
waitms 200
hud_edit ui up K_MOUSE1
waitms 1500
screenshot p1347-fetch-csqc
scores segmented 1
waitms 500
echo KSF FETCH SEGMENTED CONTROL
hud_edit ui hover sb_ksmore
scores segmented 0
scores style hsw
waitms 1000
scores style bw
waitms 1000
scores close
ui_strip_test screen create
ui_board surf_dune ksf 0 0 sw
waitms 1500
ui_board_test style hsw
waitms 1000
ui_cursor
ui_hover @mlb_ksmore
waitms 200
ui_mouse down
waitms 200
ui_mouse up
waitms 1500
screenshot p1347-fetch-menu
ui_board_test segmented 1
waitms 500
echo KSF FETCH MENU SEGMENTED CONTROL
ui_hover @mlb_ksmore
ui_board_test segmented 0
ui_board_test style bw
waitms 500
vid_conautoscale 0
vid_conwidth 640
vid_conheight 480
waitms 700
ui_cursor
screenshot p1347-fetch-menu-narrow
ui_board_test close
echo RUNLINES COMPLETE
quit
