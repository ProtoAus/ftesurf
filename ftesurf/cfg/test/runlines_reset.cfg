// Private dedicated overlay only: tools/runlines_smoke.py --dedicated
cfg_save_auto 0
name RunlinesControl
log_enable 1
log_dir logs
log_name runlines_smoke
cl_idlefps 0
cl_maxfps 100
hud_trail 1
hud_trail_fade 1
set hud_rewind_chase 0
rec_savelock 1
waitms 2000
map surf_dune
waitmap 60
waitms 6000
menu_restart
ui_close
hud_trail 1
hud_trail_fade 1
cmd zone_goto 0
waitms 400
sl_save
waitms 500
+forward
waitms 2300
-forward
echo ==== GROW1 ====
trail
cmd timer
waitms 400
echo ==== GROW2 ====
trail
cmd timer
cmd zone_goto 0
waitms 300
echo ==== RESET1 ====
trail
cmd timer
cmd viewpos
rewind
waitms 250
rewind status
rewind
waitms 1000
echo ==== RESET2 ====
trail
cmd sl_goto 1
waitms 900
echo ==== LOADSTART ====
trail
cmd timer
waitms 300
+forward
waitms 1000
echo ==== NEW ====
trail
waitms 1300
-forward
echo ==== FADED ====
trail
cmd timer
// Stage 1 alone has the same retain/restart/fade lifecycle as a map run.
say !s 1
waitms 400
+forward
waitms 2300
-forward
echo ==== STAGERUN ====
trail
cmd timer
say !r
waitms 400
echo ==== STAGERESET1 ====
trail
cmd timer
waitms 1000
echo ==== STAGERESET2 ====
trail
+forward
waitms 1000
echo ==== STAGENEW ====
trail
waitms 1300
-forward
echo ==== STAGEFADED ====
trail
cmd timer
echo RUNLINES COMPLETE
waitms 100
quit
