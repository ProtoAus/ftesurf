// P432BENCH -- the run line's QC cost, unprofiled: `replay bench 200` draws slot 0 200
// more times in one frame and prints ms each (gettime(1) counts whole ms).
// surf_rookie r47: the whole run at t 20, 60 and 200, and the stage 5 cut at 34.3;
// each with hud_watch_path_far 0 (never fades) and 6000 (the default).
//
// RESULT (2026-09-22, ms each, points): t20 2.035 (1963) / 0.595 (605); t60 0.490
//  (325) / 0.325 (274); t200 1.770 (1485) / 1.285 (1355); cut 0.295 (170) both.
//  Earlier cuts of the drawer, far 0, t20: every point, 3.705 (3595); stride levels at
//  0.5 px, 2.600 (2478); at 1 px, 2.150 (1963).  With the polygons skipped, 1.565: the
//  emission is a quarter; the walk and the strip are the rest.
log_enable 1
log_dir "logs"
log_name "p432bench"
developer 0
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0
set run_resume 0
sv_public 0
sv_port 27686
set lobby_dir ""
set hud_watch_skipidle 0
set hud_watch_path_ahead 1

wait 200
map surf_rookie
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 1000
replay online 47
replay pause
replay seek 20
waitms 1000
echo ^5=== t20 far 0 ===
hud_watch_path_far 0
waitms 300
replay bench 200
waitms 1000
echo ^5=== t20 far 6000 ===
hud_watch_path_far 6000
waitms 300
replay bench 200
waitms 1000
replay seek 60
waitms 1000
echo ^5=== t60 far 0 ===
hud_watch_path_far 0
waitms 300
replay bench 200
waitms 1000
echo ^5=== t60 far 6000 ===
hud_watch_path_far 6000
waitms 300
replay bench 200
waitms 1000
replay seek 200
waitms 1000
echo ^5=== t200 far 0 ===
hud_watch_path_far 0
waitms 300
replay bench 200
waitms 1000
echo ^5=== t200 far 6000 ===
hud_watch_path_far 6000
waitms 300
replay bench 200
waitms 1000
replay window 5
replay pause
replay seek 34.3
waitms 1000
echo ^5=== cut far 0 ===
hud_watch_path_far 0
waitms 300
replay bench 200
waitms 1000
echo ^5=== cut far 6000 ===
hud_watch_path_far 6000
waitms 300
replay bench 200
waitms 1000
replay stop
quit
