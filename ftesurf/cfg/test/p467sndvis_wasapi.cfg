// snd_vis in-engine probe (engine client/snd_vis.c). Loops music/visprobe.wav through the real
// software mixer, polls snd_visinfo every 25 frames and traces every analysis (snd_vis_trace 2:
// one line per analysis and one per onset, stamped with the analysis clock = audio time).
// visprobe.wav (16 s loop): 0-2 s silence, 2-6 kick 120 BPM, 6-10 hats 8/s, 10-14 both, 14-16 silence;
// kick 55 Hz at -40 dBFS peak, hats 8 kHz at -60 dBFS, so the laptop speakers stay effectively silent.
// snd_fx_lowpass 500 from poll 20 to poll 40: frames are not seconds here (the minimised window ran
// 40-60 fps), so the filtered span is read back from snd_visinfo, and the loop gives filtered and
// unfiltered passes of the same sections to compare.
// volume only scales SFX; music goes through musicvolume*mastervolume (snd_dma.c:3512).
// Launch (PowerShell): Start-Process <fteqw64.exe> -WorkingDirectory C:\ftesurf -WindowStyle Minimized
//   -ArgumentList '+set cfg_save_auto 0 +set s_inactive 1 +exec test/p467sndvis.cfg'
cfg_save_auto 0
set log_dir logs
set log_name p467sndvis_wasapi
set log_enable 1
exec cfg/test/_quiet.cfg
set cl_idlefps 0
set cl_maxfps 100
set s_inactive 1
set volume 0
set mastervolume 1
set musicvolume 1
set snd_vis 1
set snd_vis_rate 120
set snd_vis_latency -1
set snd_fx_lowpass 0
set snd_fx_lowpass_time 0.25
// WASAPI instead of the default (DirectSound): exercises the queue-length latency estimate.
set s_device WASAPI
snd_restart
wait 100
soundinfo
echo SNDVIS_PROBE before music
snd_visinfo
set snd_vis_trace 2
echo SNDVIS_PROBE music start
music visprobe
echo SNDVIS_POLL 0
snd_visinfo
wait 25
echo SNDVIS_POLL 1
snd_visinfo
wait 25
echo SNDVIS_POLL 2
snd_visinfo
wait 25
