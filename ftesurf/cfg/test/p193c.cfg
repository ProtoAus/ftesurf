// FTESurf Patch 193, run C: does the broadphase reject work, and is collision unchanged?
//
// Same viewpoints, same rig, same 300-frame holds as p193a/p193b so the numbers subtract.
// Baseline to beat (run B, same binary minus this patch):
//   demise-smoke base           11.70 fps   Prediction 79.61ms   Server 35.87ms
//   demise-smoke nopred         69.23 fps   Prediction  8.75ms   Server  6.50ms   <- the ceiling
//   demise-start base           23.23 fps   Prediction  0.21ms   Opaque 26.92ms   <- untouched by this fix
//   sodacity-propdense3         49.04 fps   Prediction  8.94ms   Server  2.98ms
//
// The prediction fix cannot touch demise-start (its Prediction is already 0.2ms), so that
// viewpoint is the CONTROL: if it moves, something else changed and the result is suspect.
//
// PART D is the correctness half, and it matters more than the speed half: a reject that
// is too aggressive makes props non-solid and the player falls through the map.  The test
// drops the player onto a known solid prop and prints where they come to rest, against a
// control drop 600 units to the side with no prop under it.  Props near the smoke
// viewpoint, read from the sprp lump, all solid type 6:
//   speleothem4  at 9152 -4800 7806
//   wood_cross_1 at 9472 -4544 7680
// `viewpos` prints "setpos x y z pitch yaw roll", so the resting position lands in the log
// as text and pastes straight back in.  BUILD 24 gave it that name: it used to be the
// no-argument form of setpos, which meant the command called "set" was the only way to
// "get".  setpos now only sets -- and marks the run practice when it does, rather than
// voiding it -- so each drop still has to toggle noclip back off itself.

cfg_save_auto 0
log_name p193c
developer 0
scr_sshot_type png
cl_yieldcpu 0
cl_maxfps 0
vid_vsync 0
r_speeds 2
waitms 2500

echo "=== P193C: broadphase reject, after ==="
map surf_demise
waitmap 180
waitms 6000
sv_cheats 1

echo "### DUMP demise-smoke after"
setpos 7223 -6287 4763 0 0 0
wait 300
r_speeds_dump
wait 10
screenshot_mega p193c_smoke_after 1280 720

echo "### DUMP demise-smoke after-nopred (the ceiling)"
cl_nopred 1
setpos 7223 -6287 4763 0 0 0
wait 300
r_speeds_dump
wait 10
cl_nopred 0

echo "### DUMP demise-start after (CONTROL, must not move)"
setpos -12192 -3920 15128 0 0 0
wait 300
r_speeds_dump
wait 10
screenshot_mega p193c_start_after 1280 720

// ---------------------------------------------------------------- collision correctness
echo "### COLLISION drop onto speleothem4 at 9152 -4800 7806"
setpos 9152 -4800 8106 0 0 0
noclip
wait 200
echo "### RESTED-ON-PROP-1:"
viewpos
wait 10

echo "### COLLISION control drop 600 units aside (no prop)"
setpos 9752 -4800 8106 0 0 0
noclip
wait 200
echo "### RESTED-CONTROL-1:"
viewpos
wait 10

echo "### COLLISION drop onto wood_cross_1 at 9472 -4544 7680"
setpos 9472 -4544 7980 0 0 0
noclip
wait 200
echo "### RESTED-ON-PROP-2:"
viewpos
wait 10

// ---------------------------------------------------------------- sodacity, milder case
echo "### MAP surf_sodacity"
map surf_sodacity
waitmap 180
waitms 6000
sv_cheats 1

echo "### DUMP sodacity-propdense3 after"
setpos -13568 -9984 256 0 180 0
wait 300
r_speeds_dump
wait 10
screenshot_mega p193c_soda_dense3_after 1280 720

echo "### DUMP sodacity-hub after (CONTROL)"
setpos -3040 14128 -11374 0 180 0
wait 300
r_speeds_dump
wait 10

echo "=== P193C DONE ==="
waitms 1500
quit
