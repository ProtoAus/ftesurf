// P460LOCK -- prop collision is on by default and a client cannot turn it off.
//
// "Maps must have prop collision for this surf game to work. Please ensure its
// defaulted to on, and can't be turned off client side" -- unless sv_cheats is on,
// "then it's fine".  That is CVAR_CHEAT exactly: cvar.c:126 "latch to the default,
// unless cheats are enabled", enforced at cvar.c:1159-1166 by force-setting the
// cvar to its REGISTRATION default on connect.  hl2_propcollision registers as "1"
// (VPhysics), hl2_dispcollision as "1", hl2_propcollision_nophy as "0" -- so the
// values the engine enforces are already collision-on and Source-accurate, which
// is the only reason this flag is usable here: a `set` in default.cfg does NOT
// become a cvar's default (CVAR_CONFIGDEFAULT is defined but nothing ever sets it),
// so a cheat cvar snaps to what the C code registered, not to what the config says.
//
// MAXCLIENTS 4 IS LOAD-BEARING.  cl_main.c:3253 allows cheats unconditionally on a
// listen server with ONE slot -- `sv.allocated_client_slots == 1 || sv_cheats.ival`
// -- so at the default slot count this arm would measure nothing and report the
// latch broken.  A real lobby runs 32.  This is also the honest caveat for a player
// hosting solo: the lock does not engage there, and it does not need to.
//
// PRE-REGISTERED
//  L1  connected, cheats off: hl2_propcollision 0 is refused, reads back 1.
//  L2  ...and so are 2 (Bbox) and 3 (Mesh).  Not just "off" -- any client-side
//      change to the collision SHAPE desyncs prediction, so all three are locked.
//  L3  hl2_dispcollision 0 is refused, reads back 1.
//  L4  hl2_propcollision_nophy 1 is refused, reads back 0 -- the .phy-or-nothing
//      rule cannot be switched back to render-mesh collision either.
//  L5  with sv_cheats 1 the same set SUCCEEDS and reads back 0.  This is what makes
//      L1-L4 a latch rather than a hardcoded constant, and it is the user's own
//      exception.
//  L6  CONTROL: hl2_propdist, the same family and the same menu page but NOT a
//      cheat cvar, is still settable with cheats off.  Without this arm "every
//      hl2_ cvar is frozen" would pass every check above.
//
// IT HAS ALREADY BEEN RUN AGAINST A BUILD WITHOUT THE FIX, and that is how the fix
// was found rather than how it was confirmed.  The first run of this arm was against
// an engine whose Plug_Cvar_GetNVFDG did `flags&1` -- masking every plugin cvar flag
// down to CVAR_ARCHIVE -- and every set LANDED: no latch message, no `Effective
// value` line, hl2_propcollision reading 0/2/3 as asked, with L5 and L6 passing.
// So the discriminating power is measured, not argued: L1-L4 red and L5-L6 green on
// the pre-fix engine, all six green after.
//
// THE READBACK IS A TRAP AND THE GRADER SAYS SO.  A latched cheat cvar still prints
// the value you asked for; `Effective value is "1"` on the next line is the engine
// saying it ignored you.  tools/p460lock.py keys on that line, because keying on
// `is "0"` would pass a build where collision can be switched off.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p460lock
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
sv_port 27710
vid_fullscreen 0
sv_cheats 0
maxclients 4
waitms 5000
menu_restart
ui_close
waitms 1200

map bhop_eazy
waitmap 2400
waitms 3000

echo ==== L1 propcollision 0 refused ====
hl2_propcollision 0
waitms 200
hl2_propcollision
waitms 300

echo ==== L2 propcollision 2 and 3 refused ====
hl2_propcollision 2
waitms 200
hl2_propcollision
waitms 200
hl2_propcollision 3
waitms 200
hl2_propcollision
waitms 300

echo ==== L3 dispcollision 0 refused ====
hl2_dispcollision 0
waitms 200
hl2_dispcollision
waitms 300

echo ==== L4 propcollision_nophy 1 refused ====
hl2_propcollision_nophy 1
waitms 200
hl2_propcollision_nophy
waitms 300

echo ==== L6 CONTROL propdist is not a cheat cvar ====
// Run BEFORE sv_cheats goes on, or it proves nothing.
hl2_propdist 8000
waitms 200
hl2_propdist
waitms 300

echo ==== L5 with sv_cheats the set lands ====
sv_cheats 1
waitms 600
hl2_propcollision 0
waitms 200
hl2_propcollision
waitms 300
sv_cheats 0
waitms 400
hl2_propdist 0
waitms 200

quit
