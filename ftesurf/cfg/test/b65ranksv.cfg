// Build 65: the SERVER half of the world-rank test.  See b65rankcl.cfg.
//
// WHAT IS UNDER TEST.  A finish now produces an answer from the directory, and
// that answer has to travel: uri_post -> URI_Get_Callback -> the player who
// finished -> a *wrank userinfo key -> CSQC -> one sentence on the results
// card.  Every link in that is new in build 65 and none of it is reachable
// from a listen server, because a loopback client is never asked for a GUID
// (cl_main.c:1120-1144 sets connectinfo.ext.guidsalt by hand) and
// Lobby_SubmitRun drops an unidentified run at its fourth gate.  So: a real
// dedicated server and a real socket, exactly as b64guidsv.cfg established.
//
// THE DIRECTORY IS A STUB (surfd/b65stub.py) and its own header says why.
// Short version: the live board must not be fed fabricated rows, and only a
// stub can produce all three of the answers the card draws differently.
//
// sv_port IS PASSED WITH +set ON THE LAUNCH LINE, not here.  The socket is
// bound during net init, which happens BEFORE this file is exec'd; setting it
// here left the server on the default port and every connect came back
// "Connection lost or aborted".  That cost a run last build.
log_enable 1
log_dir logs
log_name b65ranksv
log_developer 1
developer 1

// Without this the engine never asks a client for a GUID, infokey(e,"guid")
// is "", and the run is dropped before any of this is reached.  b64guidsv.cfg
// is the run that proved a real socket does deliver one.
sv_guidkey "ftesurf-b65-probe"

// Uncapped, for the reason b65rankcl.cfg explains at length: the csprogs fetch
// at the shipped defaults takes 85 seconds and swallowed an entire run of this
// test.  Fine on a harness talking to one client over loopback; NOT a setting
// to copy to a public server, where the cap is what stops a download being a
// denial of service.
sv_maxrate         0
sv_maxdownloadrate 0

// THE DIRECTORY URL COMES FROM THE LAUNCH LINE AND IS NOT SET HERE:
//
//   +set lobby_master "http://192.168.1.102:8099"   rank    -> 200, rank 3/17
//   +set lobby_master "http://192.168.1.102:8098"   noboard -> 204
//   +set lobby_master "http://192.168.1.102:8097"   refuse  -> 403
//
// One config for three arms, because the ONLY difference between them is what
// the directory answers; a config per arm is three copies of everything else,
// which is how two of them drift and the run stops comparing anything.
//
// IT IS NOT `set lobby_master "...:$b65port"`, AND THAT COST A RUN.  FTE did
// not expand $b65port inside the quotes, so the server posted to a host
// literally named "$b65port", every request failed, and the client duly showed
// "the leaderboard did not take it" -- the exact result the 403 arm is
// supposed to produce, reached without the stub ever being contacted.  A
// passing arm that never touched the thing under test is worse than a failing
// one.  Hence the echo below: the URL in use is printed where the log will
// show it, every run.
set lobby_master_key  "stub-key-not-a-real-one"

// Bare cvar names, which print their value.  If this shows an empty or
// malformed master, nothing below this line means anything.
echo ^5---- b65rank: the directory this server will actually post to ----
lobby_master

// 30s rather than the usual 5: heartbeats go to the same stub and every one of
// them is a line in its log.  The heartbeat is not what is being read here,
// but a couple of them are worth having as proof the server is talking to the
// stub at all -- a run POST that never appears is then "the submission did not
// happen" rather than "the network did not happen".
set lobby_master_rate 30

map bhop_eazy

// ARMED LATE, AND THAT IS THE CONTROL.
//
// lobby_run_probe fires the instant a player exists, so arming it above would
// spend it on the frame the client spawns -- before the client has recorded a
// single sample of what *wrank looks like when nothing has been submitted.
// That sample is the control for the whole test: without it, a reader that
// returned "#3 of 17" unconditionally would pass every arm below.
//
// The client polls rather than sleeping to a schedule, so this number only has
// to land somewhere inside its polling window, not on a particular sample.
waitms 45000
set lobby_run_probe 1
