// Patch 396 -- DISCOVERY, not a falsifier: pick the subject teleport T and zone Z.
// Client C1 (engine\release\fteqw64.exe), 100 fps, delay 0, against p396sv (S1).
// Pass 1 cl_triggers 0 (server-only angle: the viewpos yaw after a crossing is the
// destination's own S, no predicted snap involved); pass 2 cl_triggers 1 (one
// `trig: ... kind 1 fired` per crossing wanted).  Then 3 s standing at the destination
// (no further fire), `cmd zone_dests`, and zone_goto 1..3 with yaw 45.
// T qualifies if: the +1.4 s viewpos is far from the walk start, its yaw is S = 90
// (entity lump: every destination here is "0 90 0"), exactly one fire per pass-2 crossing,
// none while standing.  Z qualifies if zone_goto Z 45 0 reads yaw 45.0 and is not a START.
exec cfg/test/p396pro.cfg
cl_triggers 0
echo ^5=== pass 1: cl_triggers 0
echo ^5=== find T0
trig_tp 0 walk
waitms 500
cmd viewpos
waitms 300
+forward
waitms 400
-forward
waitms 1200
cmd viewpos
echo ^5=== find T1
trig_tp 1 walk
waitms 500
cmd viewpos
waitms 300
+forward
waitms 400
-forward
waitms 1200
cmd viewpos
echo ^5=== find T2
trig_tp 2 walk
waitms 500
cmd viewpos
waitms 300
+forward
waitms 400
-forward
waitms 1200
cmd viewpos
echo ^5=== find T3
trig_tp 3 walk
waitms 500
cmd viewpos
waitms 300
+forward
waitms 400
-forward
waitms 1200
cmd viewpos
cl_triggers 1
echo ^5=== pass 2: cl_triggers 1
echo ^5=== find2 T0
trig_tp 0 walk
waitms 500
cmd viewpos
waitms 300
+forward
waitms 400
-forward
waitms 1200
cmd viewpos
echo ^5=== stand 3 s
waitms 3000
cmd viewpos
echo ^5=== find2 T1
trig_tp 1 walk
waitms 500
cmd viewpos
waitms 300
+forward
waitms 400
-forward
waitms 1200
cmd viewpos
echo ^5=== find2 T2
trig_tp 2 walk
waitms 500
cmd viewpos
waitms 300
+forward
waitms 400
-forward
waitms 1200
cmd viewpos
echo ^5=== zones
cmd zone_dests
waitms 800
echo ^5=== Z1
cmd zone_goto 1 45 0
waitms 1200
cmd viewpos
echo ^5=== Z2
cmd zone_goto 2 45 0
waitms 1200
cmd viewpos
echo ^5=== Z3
cmd zone_goto 3 45 0
waitms 1200
cmd viewpos
waitms 500
predangle_dump
waitms 1500
echo ^5=== p396find done
quit
