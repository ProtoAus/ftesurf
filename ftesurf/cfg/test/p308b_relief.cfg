cfg_save_auto 0
// Patch 308 part 2 -- the ratio cube gets the direct light a BAKED prop was denied.
//
// WHY.  vertexlit.glsl's #BUMPCUBE relief is  cube(n_bumped)/cube(n_geom).  On a
// prop with a .vhv bake, VBSP_AddWorldLightCube returned early on wl_suppress, so
// that cube was BOUNCE ONLY -- and a bounce-only cube has almost no anisotropy to
// resolve.  Measured over 200 real leaf cubes with fan/moss_n's own tilt
// distribution (mean 6.8 deg), as 0..255 levels on a mid-grey pixel:
//     bounce only     mean 1.72 levels, above 3 levels on  11 of 200 cubes
//     with direct     mean 4.41 levels, above 3 levels on 193 of 200 cubes
// i.e. it sat below the threshold at which anything is visible, and now sits above.
// The suppression is still right for the LEVEL (VBSP_LightPointValues) -- a ratio
// carries no level, is exactly 1.0 on a flat normal and is invariant under scaling
// the cube, so it cannot double-count a bake.
//
// surf_fantasy needs Patch 308 part 1 too: it is a v21 map, so until this patch it
// loaded ZERO worldlights and there was no direct light to add in the first place.
//
// LIVE A/B in ONE process at a pinned setpos, per pixel-noise-floor-across-runs:
// two runs of the same binary differ by up to 18% of a frame from the async
// texture-load race.  r_cubelight gates the UPLOAD (runtime, no resolve), so 0 is
// the pre-patch picture to the bit: it uploads zeros and the shader's ratio becomes
// eps/eps == exactly 1.0.
//
// THE CLAIM, STATED SO IT CAN FAIL:
//   1. r_cubelight 1 vs 0 at save001 must differ on a MATERIAL fraction of the rock.
//      Patch 268 C measured 0.00% here. If this is still ~0%, the patch failed.
//   2. The change must be a REDISTRIBUTION, not a brightening: some rock pixels up,
//      some down. Report the signed split, never a single mean -- a mean over two
//      lobes cancels, which is exactly how Patch 304's metric read as a null.
//   3. r_cubelight_used must be > 0. A uniform the compiler optimises out gets NO
//      parameter entry at all, so a non-zero count is real evidence the define
//      compiled -- one of the few probes here that cannot read as its opposite.
//   4. The WORLD must not move. Rocks are props; brushwork is lightmapped and
//      nothing in this patch can reach it.
//   5. hl2_cubelight 0 (arm C) must be bit-identical to the pre-308 picture: it
//      gates both the shader AND, as of 306, whether the term enters the cube.
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000
wait 200
developer 1
log_developer 1
log_enable 1
log_dir logs
log_name p308b
cl_maxfps 0
cl_idlefps 0
sv_cheats 1
con_notifylines 0
con_notifytime 0
con_notifytime_error 0
r_drawentities 1
hl2_lt_wl21 1
hl2_cubelight 1
hl2_bumpgreenfix 0
r_cubelight 1
echo ^5=== p308b: hl2_lt_wl21 1, hl2_cubelight 1
map surf_fantasy
waitmap 45		// SECONDS, not frames -- 600 blocks the command buffer for ten minutes (P308)
waitms 9000
waitms 3000
noclip
waitms 1000
// save001 -- Lex's saveloc, the island rock (models/fan/island1cluster1.mdl, fan/moss + fan/moss_n)
setpos -9001.9434 -14301.5703 6205.6196 30.9814 38.5675 0
waitms 2500
cmd viewpos
// --- G1: relief ON (the patch) ---
r_cubelight 1
waitms 1200
screenshot p308_g1_on
waitms 400
screenshot p308_g1_on
r_speeds 0
// --- G2: relief OFF (uploads zeros -> ratio exactly 1.0 -> pre-patch picture) ---
r_cubelight 0
waitms 1200
screenshot p308_g2_off
waitms 400
screenshot p308_g2_off
// --- G3: back ON, must reproduce G1 (proves the toggle is clean) ---
r_cubelight 1
waitms 1200
screenshot p308_g3_on
waitms 400
screenshot p308_g3_on
// --- G4: the synthetic hard-lit diagnostic cube ---
r_cubelight 2
waitms 1200
screenshot p308_g4_test
waitms 400
screenshot p308_g4_test
r_cubelight 1
waitms 800
// --- G5: hl2_cubelight 0 -- regenerates materials AND drops the term from the cube ---
hl2_cubelight 0
waitms 4000
screenshot p308_g5_cubelight0
waitms 400
screenshot p308_g5_cubelight0
hl2_cubelight 1
waitms 4000
screenshot p308_g6_cubelight1
waitms 400
screenshot p308_g6_cubelight1
echo ^5=== p308b end
quit
