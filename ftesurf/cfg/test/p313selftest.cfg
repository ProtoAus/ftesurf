cfg_save_auto 0
// Patch 313 regression gate.  pm_selftest is the tree's standing check for
// anything that touches the mover; it needs no map loaded.  This patch does not
// touch pm_source.c at all -- it edits the cvar-lock section of sv_phys.c and
// two callers -- so the expectation is "unchanged, passes", and the point of
// running it is that "I did not touch the mover" is a claim until something
// checks it.
log_enable 1
log_dir logs
log_name p313selftest
wait 200
pm_selftest
waitms 3000
log_enable 0
waitms 500
quit
