// P370WRAP -- the chatbox wraps downward and never cuts a line that fits (Patch 370).
// Listen server, no network.  Run from C:\FTESurf:
//   ftesurf64.exe +set vid_winmaximize 0 -WindowStyle Minimized +exec cfg/test/p370wrap.cfg
// then read `chat_rows:` in logs/p370wrap.log and the p370wrap_* screenshots.
//
// PREDICTIONS (registered before the run).  lh = 1.35*sz; bottom = hud_chat_y*scr_y.
//  A  (two short lines, then a 249-char line with a ^3 span and a {..} span)
//     msg0 (the long one) n >= 3, drawn == n; every row w <= maxw; no row ends "..";
//     msg0's rows 1.. begin with a carry that ends in ^3 while inside the yellow span,
//     and in ^3^7^m inside the {..} span.  Idle draft: n 1, y0 == yl == bottom - lh;
//     msg0 y0 + lh*drawn == draft y0; msg1 y0 + lh == msg0 y0.
//  C  hud_chat_size 16 only: header sz 16, msg0 n smaller than in A, every w <= maxw.
//  D  hud_chat_lines 1 only: shown 1 (msg0 alone, whole).
//  E0 a 704-char line at hud_chat_y 0.95: n <= room, drawn == n, no "..".
//  E  the same with only hud_chat_y 0.5: n > room, drawn == room, last row ends "..";
//     this is the control -- the one cut that must still happen.
//  F  (added after review) an ezQuake &cf00 line: its continuation rows carry &cf00
//     (drawn red); a ^`u8: span over a 68-char word: every row w <= maxw and the
//     tail " b`= tail" appears exactly once.
//  B  chat_say with 128+12 chars: draft len 128, no row holds OVERFLOWTAIL, row 0
//     begins "> Draft", the last row ends "_" or " "; draft n = D >= 2 with y0 < yl,
//     yl - y0 == lh*(D-1) and yl == bottom - lh (the reported bug, inverted);
//     msg0 y0 + lh*drawn == draft y0.  Shots b and b2 differ only in the cursor.
//
// RESULTS 2026-09-19 (1280x720, sz 24, lh 32.4, maxw 576): ALL HELD.
//  A  msg0 n 5 drawn 5 y0 489.6; 489.6 + 5*32.4 = 651.6 = draft y0 = 684 - 32.4;
//     msg1 457.2 + 32.4 = 489.6.  Widths 473..567.  Rows 1-2 carry ^2^7^3, row 4
//     ^2^7^3^7^m.  Shot: yellow and the alternate span continue across breaks.
//  C  sz 16: n 4 (A: 5).  D  shown 1, msg0 whole.
//  E0 n 17 drawn 17 (room 19), no cut.  E  room 9: n 17 drawn 9, shot ends "..".
//  B  draft len 128, n 3, y0 586.8 yl 651.6 (= 2*lh apart, yl = bottom - lh), no
//     OVERFLOWTAIL, row 2 carries ^2; msg0 36.0 + 17*32.4 = 586.8.  b has no
//     cursor, b2 has "_", same rows.
//  F  (rerun after review fixes) the &cf00 line's three rows all draw red (shot f;
//     log_readable strips &c from the log); the ^`u8: line is 2 rows, w 569/507,
//     " b`= tail" once.  Known limit: a split u8 span shows its `= as text.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p370wrap
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_conautoscale 0
vid_conwidth 1280
vid_conheight 720
fs_missingwarn 0
con_notifylines 0
set name WrapTest
set run_resume 0
sv_port 27643
wait 300
map bhop_eazy
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 500
set hud_chat 1
set hud_chat_size 24
set hud_chat_lines 6
set hud_chat_time 600
set hud_chat_fade 5
set hud_chat_x 0.05
set hud_chat_y 0.95
echo ==== A ====
cmd say "short one"
waitms 1500
cmd say "short two"
waitms 1500
cmd say "^3this yellow run is long enough to be broken across rows and every continuation row must stay yellow until the code that ends it^7 then plain words, then {an alternate charset span that also crosses a row break must keep its look} and a plain tail."
waitms 1500
chat_rows
screenshot p370wrap_a
waitms 300
echo ==== C ====
set hud_chat_size 16
waitms 300
chat_rows
screenshot p370wrap_c
waitms 300
set hud_chat_size 24
echo ==== D ====
set hud_chat_lines 1
waitms 300
chat_rows
screenshot p370wrap_d
waitms 300
set hud_chat_lines 6
echo ==== E0 ====
cmd say "0123456789 0123456789 0123456789 0123456789 0123456789 0123456789 0123456789 0123456789 0123456789 0123456789 0123456789 0123456789 0123456789 0123456789 0123456789 0123456789 0123456789 0123456789 0123456789 0123456789 0123456789 0123456789 0123456789 0123456789 0123456789 0123456789 0123456789 0123456789 0123456789 0123456789 0123456789 0123456789 0123456789 0123456789 0123456789 0123456789 0123456789 0123456789 0123456789 0123456789 0123456789 0123456789 0123456789 0123456789 0123456789 0123456789 0123456789 0123456789 0123456789 0123456789 0123456789 0123456789 0123456789 0123456789 0123456789 0123456789 0123456789 0123456789 0123456789 0123456789 0123456789 0123456789 0123456789 0123456789 END"
waitms 1500
chat_rows
screenshot p370wrap_e0
waitms 300
echo ==== E ====
set hud_chat_y 0.5
waitms 300
chat_rows
screenshot p370wrap_e
waitms 300
set hud_chat_y 0.95
echo ==== F ====
set hud_chat_y 0.95
cmd say "&cf00this ezquake red text is long enough to wrap and every continuation row must stay red to the end ok"
waitms 1500
cmd say "^`u8:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa b`= tail"
waitms 1500
chat_rows
screenshot p370wrap_f
waitms 300
echo ==== B ====
chat_say "Draft row one starts with the prompt and stays on top, the rest lands below. ^2This part is green and stays green on every row!!OVERFLOWTAIL"
waitms 300
chat_rows
screenshot p370wrap_b
waitms 500
screenshot p370wrap_b2
waitms 500
quit
