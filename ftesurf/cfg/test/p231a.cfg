// Patches 231 + 232.  Three maps; every claim in the plan has a line here.
//
// ---- 231: the missing-material warning stops blaming the asset pack ----
//
// fs.c now publishes what fs_automount actually DID (fs_automount_state / _spec) and
// mod_vbsp.c picks its sentence from that instead of printing the same two hardcoded
// fs_load lines for every miss on every map.  The three states this machine can reach:
//
//   surf_aesthetic  state 2   its CS:GO pack is served from ftesurf_cache, and the one
//                             unresolved material (water/clear_beneath) is in NO pack --
//                             not CS:GO, not TF2, not CS:S, not HL2, not Momentum, and
//                             not the map's own pakfile.  So the advice must be "served
//                             from the cache, and it is not in there either", with
//                             fs_cache_clear offered -- and must NOT say fs_load.
//   surf_demise     state 0   no data/mapdeps.txt line at all, because mapdeps.py already
//                             established no pack resolves it.  Must say so.
//   surf_rise       state 1/2 two deps, both installed.  THE REGRESSION: a map whose
//                             packs are present must behave exactly as before.
//
// NOTHING here should print an fs_load line.  If one appears, state 3 was reached on a
// machine where both games are installed, which would be a fault in the state and not
// in the message.
//
// hl2_missing is the audit instrument, and surf_demise is the reason it exists: the HUD
// has been reporting 41 unresolved, tools/mapdeps.py --map surf_demise resolves
// everything except one bottom material, and only the full list can settle which is
// true.  The warning still shows 24; this shows all of them.
//
// Also watch for what should NOT appear: "Unsupported gamelump id/version".  Both maps
// carry a zero-id terminator entry in the game-lump table, which was being reported as
// an unsupported lump AND truncating its own line (a %c of 0 ends the string that
// reaches plugfuncs->Print, taking the version and the newline with it).
//
// ---- 232: $vertexcolor / $vertexalpha reach the shader ----
//
//   soniccolours/ivy_blendmodulate  WorldVertexTransition, $translucent 1, $nocull 1,
//                                   $vertexcolor 1, $vertexalpha 1, NO $basetexture2
//        expect:  program "vmt/transition#NOBLEND#VERTEXCOL#VERTEXALPHA"
//
//   soniccolours/ivy_basic          THE CONTROL, and deliberately the material next
//                                   door: same $basetexture, same $bumpmap, but
//                                   LightmappedGeneric with neither key
//        expect:  program "vmt/lightmapped"  with NO #VERTEX argument at all
//
// The control is what proves the two args are gated on the keys rather than on the
// material type -- a shared texture and a shared normalmap mean the only difference
// between these two shaders is the thing under test.

log_enable 1
log_name p231a
developer 1
cfg_save_auto 0
cl_idlefps 0
sv_cheats 1

wait 200
echo ^5=== p231a: the diagnosis (P231) and the vertex keys (P232) ===

// ---------------------------------------------------------------- 1 ---------
echo ^5--- 1. surf_aesthetic: pack served from CACHE, 1 material in no pack ---
map surf_aesthetic
waitmap 900
wait 120
echo ^5(expect state 2, "asset cache", an fs_cache_clear line, and NO fs_load)
fs_automount_state
fs_automount_spec
waitms 300
hl2_missing
waitms 600

// ---------------------------------------------------------------- 2 ---------
echo ^5--- 2. surf_demise: NO mapdeps line at all, and the 41-vs-1 question ---
map surf_demise
waitmap 900
wait 120
echo ^5(expect state 0, "No asset pack supplies these", and NO fs_load)
fs_automount_state
fs_automount_spec
waitms 300
echo ^5(THE AUDIT: mapdeps.py predicts 1.  Whatever the real number is, it is named here.)
hl2_missing
waitms 900

// ---------------------------------------------------------------- 3 ---------
echo ^5--- 3. surf_rise: two satisfied deps (regression) + the ivy shaders ---
map surf_rise
waitmap 900
wait 180
fs_automount_state
fs_automount_spec
waitms 300
hl2_missing
waitms 400

echo ^5(P232 subject: expect vmt/transition#NOBLEND#VERTEXCOL#VERTEXALPHA)
r_showshader soniccolours/ivy_blendmodulate
waitms 500
echo ^5(P232 control: expect vmt/lightmapped with NO #VERTEX arg)
r_showshader soniccolours/ivy_basic
waitms 500

// Two vantages onto the ivy displacement.  -845 -1484 368 is the surface point the
// reporter's own shader_here trace landed on, so stand back from it along each axis
// and look in.  setpos forces noclip, so being inside geometry costs nothing.
setpos -645 -1484 400 10 180 0
wait 60
screenshot
waitms 700
setpos -845 -1284 400 10 270 0
wait 60
screenshot
waitms 700

echo ^5=== p231a done ===
wait 30
quit
