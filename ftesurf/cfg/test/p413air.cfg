// P413AIR -- the Air/Bhop/Jump row's percentage measured the gain and the ceiling
// from two different moments, and which two depended on the frame rate.
//   ftesurf64.exe -WindowStyle Minimized +exec cfg/test/p413air.cfg
//   (cwd MUST be C:\FTESurf -- the basedir is the cwd and a shell left in
//    ftesurf/ produces no log at all)
//
// THE DEFECT.  seq_pct is 100 * de / emax (Seq_Push, cl_board.qc).  emax was the
// STRAFE ceiling alone -- Board_AirCeiling integrated over the airtime, 37.5 units
// of height per second at the shipped tuning.  de was the energy change across the
// segment, whose origin is the frame the client first saw !onground.  But the
// ground edge comes from `onground` and the energy from the velocity source, and
// at a render rate that is not the tick rate those two do not always agree about
// whether the jump impulse has landed.  A jump is worth v^2/2g = 57 units of
// height at sv_gravity 800 / pm_jumpvelocity 301.99, so the SAME HOP read 59% or
// 139% depending on where the frame fell.
//
// MEASURED IN THE SAVE CORPUS, not argued: across ftesurf/data/saves,
// 571 of 1482 recorded air rows read over 100%.  Median on a Jump row: 250%.
// Worst on file: 1199223%.  Two rows opened with e0 EXACTLY equal to the ground
// anchor (player at rest, jump energy inside de); others clearly opened after it.
//
// THE CHANGE.  The launch point is latched on the last grounded frame
// (seg_ground_e) and used as the segment's e0; the jump's own energy seeds the
// ceiling to match.  A perfect flat hop is then 99e of 99e.  A RAMP EXIT IS
// UNTOUCHED -- no ground phase, no jump, seg_sub is SEQSUB_NONE and both lines
// are skipped, which is most of a surf map's column.
//
// THE FALSIFIER IS A FILE, NOT A SCREENSHOT.  `cmd sl_save` makes the client write
// the segment ring to data/saves/<map>/save<NNN>/seq.txt as
//   row <kind> <de> <emax> <dur> <pct> <gain>      (kind 1 = SEG_AIR)
//   rowsub <1|2>                                   (1 = Jump, 2 = Bhop)
// so the numbers are read back exactly rather than squinted at.
//
// menu_restart + ui_close ARE LOAD-BEARING: Board_Frame is called from HUD_Draw,
// and until the builtin menu closes notmenu=0 skips the whole HUD stack -- no
// close, no segments, an empty ring, and an arm that measures nothing.
//
// PRE-REGISTERED, as a DIFFERENCE between two builds on this one arm.  "pct
// dropped" alone proves nothing; a control that still reads over 100% is what
// makes it a measurement (p411push printed a textbook flip on a pad that never
// armed).
//  H1 THE HOPS HAPPENED.  seq.txt holds three kind-1 rows with rowsub 1 and
//     dur ~0.75s each.  Fewer than three => the hops merged or never registered
//     and K1/K2 are NOT measurements: say so, do not report them as passes.
//  K1 CONTROL (pre-413): each Jump row reads pct > 100.
//  K2 PATCHED: emax rises by ~57 per row (the jump term, v^2/2g) and pct lands
//     inside 0..100.
// FALSIFIED IF the control rows are already under 100 (there was no defect and
// this patch is unmotivated), or the patched rows are still over 100 with no
// booster on the map, or emax moves by something other than ~57.
//
// RESULT 2026-09-20, patched against a control built from HEAD (csprogs.dat
// 4956958 vs 4956134 bytes).  H1 held: three kind-1 rows, rowsub 1, dur ~0.75.
//
//   hop   control (pre-413)                  patched (413)
//          de        emax     pct             de        emax     pct
//    1    -59.5168  42.8959   0.00          58.5289   99.4488   58.85
//    2     -0.0025  41.6250   0.00          58.4977   99.1876   58.98
//    3     -0.0102  41.4810   0.00          58.4977   99.0338   59.07
//
// K1 WAS WRONG AND THE WAY IT WAS WRONG IS THE FINDING.  It predicted the control
// would read over 100.  It reads 0 -- because on this arm the close lands AFTER
// the engine zeroed the fall, so the jump's 57 units leave through the same door
// they came in by and the `pct < 0 -> 0` clamp eats the remainder.  Over-100 and
// stuck-at-0 are the same defect seen from its two ends, and which one you get is
// a frame-rate accident.  THE CONTROL COLUMN PROVES IT BY ITSELF: three identical
// hops, de of -59.5168, -0.0025 and +58.4957 -- a spread of 59.5 units of height
// on inputs that differ in nothing.  Patched, that spread is 0.03.
//
// K2 held, and exactly: emax rose by 57.0 on every row once the dur difference is
// taken out at the map's own ceiling rate (row 2: 99.1876 - 41.6250 = 57.5626,
// less 56.25 * 0.0100 of extra airtime = 57.00).  That is PM_JUMP_APEX,
// v^2/2g = 301.9933774^2 / 1600, arriving through serverkeyfloat rather than the
// define.
//
// THE RATE HERE IS 56.25/s, NOT THE 37.5 THE SOURCE COMMENTS QUOTE, and that is
// correct: bhop_eazy runs pm_ticrate 0.01 (100 tick), and 900 / (2*800*0.01) is
// 56.25.  Board_AirCeiling computing it from the server's own movevars instead of
// writing 37.5 down is what makes the number right on this map.  So the ceiling a
// flat hop is measured against here is 57 + 56.25*0.755 = 99.2 -- "about 100e" --
// and a hop that takes the jump and strafes for none of the rest reads 59%.
//
// WHAT THIS ARM DOES NOT COVER.  Only rows opened from the GROUND change origin;
// a ramp exit keeps eb and a zero jump term, and 1445 of the corpus's 1482 air
// rows are ramp exits.  Their over-100 readings are mid-air boosters injecting
// energy no ceiling models, which is a separate question and untouched here.  The
// landing edge above does reach them when they end on flat ground.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p413air
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
sv_port 27656
sv_cheats 1
set run_resume 0
set hud_seq_pct 1
set hud_seq_merge 1
set hud_seq_hopbreak 1
set hud_energy_ref 1
vid_fullscreen 0
waitms 5000
map bhop_eazy
waitmap 2400
waitms 3000
menu_restart
ui_close
waitms 1500

echo ==== settle, in the start box, no run started ====
cmd viewpos
waitms 1200

echo ==== hop 1 ====
+jump
waitms 60
-jump
waitms 1400

echo ==== hop 2 ====
+jump
waitms 60
-jump
waitms 1400

echo ==== hop 3 ====
+jump
waitms 60
-jump
waitms 1600

echo ==== write the ring ====
cmd viewpos
cmd sl_save
waitms 1500

echo ==== END ====
waitms 800
quit
