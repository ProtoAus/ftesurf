// PATCH 367 -- pm_verify replays FTESURF-REC 10: a Multi-Session run, each
// session reseeded from its own `seed`, the clock and the state carried across
// the pause checked.
//
//   cd C:\FTESurf; C:\FTEQuake\fteqwsv64.exe +set sv_public 0 +set sv_port 27699
//     +set log_enable 1 +set log_dir logs +set log_name p367verify
//     +set rec_enable 0 +map surf_666 +exec cfg/test/p367verify.cfg
//
// Zones: cfg/test/p360sf.zones.json as maps/zones/local/surf_666.json (DELETE
// AFTER).  Files in data/p367/ (untracked):
// SUBJECTS  ms1listen.cfg's two finishes (Patch 365 progs, engine 364):
//   S1 b.rec  buffered, `pause 586 .. 123 server`, `session 2 258 .. 123`,
//             inend 539, end 404, 386 rows.  123 + (539 - 258) = 404.
//   S2 s.rec  streamed, pause at 122, end 447, 441 rows.
// DERIVED from S1, one edit each:
//   N1 n1clk.rec    pause and session ticks -10, end -10 (a consistent forgery
//                   that drops 10 ticks while parked)
//   N2 n2jmp.rec    session 2's seed y +16 (the resume moved the player)
//   N3 n3floor.rec  the session's floor `pm`/`pe` moved above the pause, so they
//                   bind to row 122 as written (proves the position rule)
//   N4 n4cold.rec   pause reason `retry`   N5 n5why.rec  pause reason `nap`
//   N6 n6nosess.rec the `session` line removed
//   N7 p356_v10.rec (v9 body, header 10)   N8 p356_v10sess.rec (a session, no pause)
//
// PRE-REGISTERED
//   1  S1 PASS ticks 404 rows 386; S2 PASS ticks 447 rows 441.  Each prints
//      "session 2 ... parked at clock C (pause C, session C)" with C 123 / 122,
//      and a resume gap <= 0.0001 u and u/s (the save's %.4f).
//   2  N1 HOLD "session 2: the trace parks the clock at 123, the pause says 113".
//   3  N2 HOLD "session 2 resumes 16 u ..."; N3 HOLD state, first at row 122.
//   4  N4-N8 REFUSE: cold rewind; unknown reason; no session answers; 10 with
//      no pause; a session with no pause.
//   5  pm_recsim on S1: ARM 1 all 386 moves exact; ARM 4 every packet matches.
// FALSIFIED IF: S1 or S2 is not PASS at its ticks; any N PASSes; N1 does not
// name the clock; N4-N8 HOLD.  CONTROL: the Patch 364 engine REFUSEs S1 ("a
// newer format"), so the gate that moved is what admits it.
// Run also cfg/test/p356newer.cfg (bhop_eazy): its v9 files must still PASS 660.
echo ================================ P367 S1 b.rec
pm_verify data/p367/b.rec
echo ================================ P367 S2 s.rec
pm_verify data/p367/s.rec
echo ================================ P367 N1 clock
pm_verify data/p367/n1clk.rec
echo ================================ P367 N2 jump
pm_verify data/p367/n2jmp.rec
echo ================================ P367 N3 floor
pm_verify data/p367/n3floor.rec
echo ================================ P367 N4 cold
pm_verify data/p367/n4cold.rec
echo ================================ P367 N5 why
pm_verify data/p367/n5why.rec
echo ================================ P367 N6 nosess
pm_verify data/p367/n6nosess.rec
echo ================================ P367 N7 v10 no pause
pm_verify data/p367/p356_v10.rec
echo ================================ P367 N8 session no pause
pm_verify data/p367/p356_v10sess.rec
echo ================================ P367 R pm_recsim S1
pm_recsim data/p367/b.rec
echo ================================ P367 done
quit

