// REG253 -- Patch 253 regressions.
//
// The reg250/reg251 baselines, unchanged:
//   surf_rise     overlays 103 of 105 placed, sprites 1 of 1
//   bhop_canals   decals 81 of 416, overlays 41 of 53, sprites 74 of 97
//   bhop_arcane   1122 func_bhop, overlays 5 of 5, sprites 180 of 180
//   surf_kitsune  target case: 28
//
// WHAT THIS PATCH PUTS AT RISK.
//
// 1. `set hl2_animated 1` in cfg/default.cfg.  This is the point of the patch and
//    the widest single change in it: 927 materials across 269 maps move off
//    vmt/lightmapped, vmt/transition and the UnlitGeneric pass onto a GLSL 130
//    array-sampler shader that until now essentially nothing ran.  None of these
//    four maps was picked for having flipbooks -- they were picked for the entity
//    counts above -- which is exactly what makes them the right control: whatever
//    they happen to have, the counts must not move.
//
// 2. animated.glsl gained a permutation.  #UNLIT removes the lightmap sampler
//    DECLARATION, not merely its use, so the lit permutation has to keep working
//    unchanged beside it.  A mistake there is either loud (the shader fails to
//    compile at load) or silent (a surface quietly loses its lightmap), and only
//    the first kind announces itself.
//
// 3. mat_vmt.c's animated arm now reads st->type BEFORE overwriting it with
//    "vmt/animated".  Getting that order wrong mis-permutes EVERY flipbook rather
//    than none, and the new census line prints the lit/unlit split per map, so a
//    wrong answer shows up in the log and not only on screen.
//
// Defaults are left alone on purpose: this asks whether the SHIPPED configuration
// still holds, and that configuration now includes hl2_animated 1.

log_enable 1
log_dir "logs"
log_name "reg253"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
con_notifylines 0
developer 1
log_developer 1

wait 200

echo ^5=========== surf_rise ===========
map surf_rise
waitmap 1800
waitms 6000
cmd ent_census
waitms 1500

echo ^5=========== bhop_canals ===========
map bhop_canals
waitmap 1800
waitms 6000
cmd ent_census
waitms 1500

echo ^5=========== bhop_arcane ===========
map bhop_arcane
waitmap 1800
waitms 6000
cmd ent_census
waitms 1500

echo ^5=========== surf_kitsune ===========
map surf_kitsune
waitmap 1800
waitms 6000
cmd ent_census
waitms 1500

echo ^5=== reg253 done ===
wait 30
quit
