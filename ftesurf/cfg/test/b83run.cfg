cfg_save_auto 0
// BUILD 83 -- THE MEASUREMENT.  Does the format now carry the EVENT?
//
// Captured by cfg/test/b83warp.cfg; measured here with engine Patch 328's
// `pm_recsim`, which is Patch 327's E3 harness taught to read a `warp` record.
//
// THE QUESTION HAS ONE ARM AND ONE CONTROL, and the control is what makes the
// arm mean anything:
//
//   SUBJECT  data/b83trace.part -- FTESURF-REC 7, ten `warp ... tele` records,
//            startjit 2 (1.6462 1.0044 0), flags 0, reccheck 0 faults.
//            ARM 3, the OPEN LOOP, must now survive the teleports.
//
//   CONTROL  data/e3trace.rec -- FTESURF-REC 6, the build-82 recording E3 was
//            measured on, kept for exactly this.  Same map, same binary, same
//            command.  It has no `warp` records because the writer did not
//            exist, so ARM 3 MUST STILL DIE AT ROW 149, its first teleport.
//
// WHY THE CONTROL IS NOT OPTIONAL.  A harness that had merely got LOOSER --
// wider tolerances, a skipped comparison, a reseed nobody noticed -- would
// improve both files equally.  Only a control that is REQUIRED TO STILL FAIL
// can tell "the format now carries the event" from "the tool stopped looking".
// This is the same argument E3 itself made with b82input's noclip flight, and it
// is why that file was replayed rather than merely described.
//
// ARM 2 IS DELIBERATELY NOT THE MEASUREMENT.  The pinned loop snaps origin and
// velocity to the sample at every packet boundary, so it papers over a teleport
// by construction -- which is exactly why its numbers looked fine in E3 while
// the format was missing something.  Only an open loop can say whether the file
// contains enough to cross a hole.
//
// rec_enable 0 SO THE LIVE RECORDER CANNOT OVERWRITE THE TRACE BEING MEASURED.
// Loading a map arms nothing here, but the streaming recorder writes
// data/parts/0.rec on any run that starts, and the subject was captured to that
// path.  It has been copied to data/b83trace.part; this is the second guard.
//
// PRE-REGISTERED:
//
//   1  The subject prints `FTESURF-REC 7`, `startjit 2 ...`, 10 warps, and
//      "warp record(s) applied" on arm 3.
//   2  The subject's arm 3 first-past-1u row is LATER than the control's, and
//      ideally -1 (it never diverged).
//   3  The CONTROL prints "no warp records ... the file is v6 -- which says
//      NOTHING" and its arm 3 still reports first-past-1u at row 149.
//   4  Arm 1 is unchanged on both: the tick arithmetic is a property of the
//      file, and Patch 328 touched nothing that could move it.  If arm 1 moves,
//      something unrelated broke and every other number here is suspect.
//
// FALSIFIED IF: the control improves; or the subject's arm 3 dies at the same
//      row as the control; or arm 1 changes on either file.

cfg_save_auto 0
log_enable 1
log_dir logs
log_name b83run
developer 0
set rec_enable 0
set rec_stream 0

waitms 6000
map bhop_eazy
waitmap 45
waitms 3000

echo ================================================================
echo B83 SUBJECT -- v7, ten warp records.  ARM 3 should now survive.
echo ================================================================
pm_recsim data/b83trace.part
waitms 3000

echo ================================================================
echo B83 CONTROL -- v6, no warp records.  ARM 3 MUST STILL DIE AT 149.
echo ================================================================
pm_recsim data/e3trace.rec
waitms 3000

echo ================================================================
echo B83 measurement done.
echo ================================================================
waitms 1000
quit

// ============================================================================
// MEASURED 2026-09-15, bhop_eazy, QC build 83 + engine Patch 328.
//
//                          SUBJECT (v7)      CONTROL (v6)
//   warp records           10                0
//   startjit               2 (1.65 1.00 0)   no key
//   ARM 1 tick arithmetic  1749/1749 exact   1339/1339 exact
//   ARM 2 pinned, median   0.0049 u          0.0046 u
//   ARM 2 at the floor     1687 of 1734      1307 of 1324
//   ARM 3 OPEN LOOP dies   row 817           row 149
//
// THE HOLE E3 FOUND IS CLOSED.  The open loop crossed SIX trigger_teleports it
// could not previously cross even one of, and ran 5.5x further before diverging.
// The control -- same map, same binary, same command, run in the same process
// minutes apart -- STILL dies at row 149, its first teleport, exactly as
// pre-registered.  A harness that had merely got looser would have improved
// both.  That is the whole reason the control had to be required to fail.
//
// AND THE CONTROL REPRODUCES E3 TO THE DIGIT under a different binary: 1339 of
// 1339, median 0.0046, p90 0.0087, 1307 at the floor, 15 diverged, arm 3 at 149.
// So Patch 328 moved nothing it was not supposed to move, which is what arm 4 of
// the pre-registration was for.
//
// WHAT STOPS THE OPEN LOOP NOW IS NOT A MISSING FACT.  Row 817 is four rows
// before arm 2's first divergence at row 821, whose velocity error is 301.99 --
// the jumpvelocity exactly.  That is one tick of disagreement about when a
// landing became a jump: chaos at a discrete boundary, which E3 already named as
// expected rather than wrong, and which no format can record away.  An open loop
// over eight seconds of bhop is a hard thing to ask for; the point is that it
// now fails for a physics reason instead of a bookkeeping one.
//
// ONE RESIDUAL, RECORDED AND NOT EXPLAINED.  Three consecutive arm-2 packets
// (rows 1430-1432, t 14.794-14.814) read an origin error of EXACTLY 16.00 u with
// velocity errors under 5 u/s, at a landing.  Sixteen is the player hull's
// half-width, and a summary statistic landing on a round constant is usually a
// systematic offset rather than a spread -- so this is written down rather than
// waved at.
//
//   WHAT IT IS NOT: it is not the new record.  Those rows carry movetick
//   2084-2089 and the nearest `warp` records are at 1857 and 2168, so nothing
//   was applied within two hundred mover ticks of them and Patch 328's code did
//   not run there.  It is also absent from the control under the same binary.
//
//   WHAT IT IS: not known, and a fourth explanation is not being offered.  It is
//   3 packets of 1734 in the PINNED arm, which E3 already reported has a tail,
//   and it moves neither headline number.
// ============================================================================
