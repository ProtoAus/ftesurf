// TINT09 -- Patch 240, Stage E: basevelocity.
//
// THE QUESTION ASKED WAS "do we need to implement basevelocity for correctness?"
// The answer turned out to be that the ENGINE ALREADY IMPLEMENTS IT: pm_source.c
// consumes pmove.basevelocity in eleven places -- the Z half-step in
// PMSrc_StartGravity and the add/move/subtract sandwiches around WalkMove and
// AirMove.  What was missing was a WRITER.  The only one in the tree is
// svhl_game.c's, behind a GT_HALFLIFE-only flag test, so for this game the
// field was permanently '0 0 0' and all eleven reads were dead code.
//
// Patch 240 adds the writer: sv_user.c reads the optional QC field
// .run_basevelocity into pmove.basevelocity right after PMSrc_LoadState and
// ZEROES IT AS IT READS.  trigger_push's continuous arm now writes that field.
//
// THE PROBE: bhop_arcane's trigger_push at 6912 3328 -64
//     "speed" "1800.0"   "pushdir" "0 90 0"  (yaw 90 = +Y)   spawnflags 1
// 1800 u/s along +Y is large enough to read off origin samples alone.
//
// WHAT DISTINGUISHES THE NEW CODE FROM THE OLD, and why sampling twice matters:
//   OLD  raised .velocity along the push up to `speed`.  That is a real change
//        to the player's own velocity, so on LEAVING the volume you keep it and
//        keep travelling at 1800 u/s.
//   NEW  is Source's carrier: the engine adds it before the move and subtracts
//        it after, so your own velocity is never touched.  The moment you leave
//        the volume the push is simply gone.
// So: large +Y displacement WHILE inside, then a rapid stop.  If Y keeps
// climbing at ~1800 u/s long after the volume, the field is not being consumed
// and the old assignment is still in play.
//
// CONTROL: the same drop at 6912 6000 -64, well clear of any push volume.
// Y must stay put there (only gravity acts).

log_enable 1
log_dir "logs"
log_name "tint09"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
sv_cheats 1

wait 200
echo ^5=== tint09: Patch 240 basevelocity ===

map bhop_arcane
waitmap 1800
waitms 4000
con_clear

echo ^5=========== PROBE: inside the speed-1800 +Y push volume ===========
// No noclip: the whole point is that pmove and the touch function both run.
setpos 6912 3328 0 0 90 0
waitms 250
echo ^3--- t=0.00
viewpos
waitms 250
echo ^3--- t=0.25
viewpos
waitms 250
echo ^3--- t=0.50
viewpos
waitms 250
echo ^3--- t=0.75
viewpos
waitms 500
echo ^3--- t=1.25
viewpos
waitms 500
echo ^3--- t=1.75
viewpos
waitms 1000
echo ^3--- t=2.75
viewpos
waitms 1000
echo ^3--- t=3.75  (long after the volume: Y must be STATIC if the carrier works)
viewpos
waitms 300
screenshot tint09_pushed

echo ^5=========== CONTROL: same drop, no push volume ===========
setpos 6912 6000 0 0 90 0
waitms 250
echo ^3--- ctl t=0.00
viewpos
waitms 750
echo ^3--- ctl t=0.75
viewpos
waitms 1000
echo ^3--- ctl t=1.75
viewpos
waitms 1000
echo ^3--- ctl t=2.75
viewpos
waitms 300
screenshot tint09_control

echo ^5=== tint09 done ===
wait 30
quit
