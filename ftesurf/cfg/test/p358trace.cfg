//          trisoup=1 rotboxes=1 portalcsg=1 (cfg/test/p358cap.cfg: start-zone
//          jump start, noclip flight to 10547 -361, walk NW across displacement
//          #89's seam -- the snag03/04 spot -- then noclip flight into END).
//          `pm` rows apply at rows 237 (noclip), 1283 (walk), 1745 (noclip).
// DERIVED  N1 data/p358seam_t0.rec -- the subject with every `trisoup=1` pin
//          token (pmpin and pm rows) edited to `trisoup=0`, nothing else.
//          N2 data/p358seam_t0pm.rec -- only the three `pm` rows' tokens
//          edited; pmpin keeps 1.  The one subject that tests the pm-row call.
// PROBE    `pm_dettest` trace hash: world traces at the live .ival, nothing the
//          verify saves.  On this map, new binary: 507c8b94f2e56ef7 at 1,
//          2158fa44d1cf01a5 at 0 (logs/p358b_cal1.log, p358b_cal0.log).
// ARMS, binary x server value, each running S, N1, N2 with the probe between:
//   ctl-old / ctl-new  C:\tmp\fteqwsv64_pre358.exe / C:\FTEQuake\fteqwsv64.exe, server 1
//   s0-old  / s0-new   the same two binaries, server pm_trisoup_bevels 0
//
// PRE-REGISTERED (2026-09-18, before any arm ran)
//   0  validity: s0-old S is HOLD "state: N packet(s) differ" with N > 0.  If it
//      PASSes, the subject does not exercise trisoup and nothing below means
//      anything -- re-capture, do not read the rest.
//   1  ctl-old S and ctl-new S: the same PASS line (same ticks, same rows), no
//      trace-cvar line.
//   2  s0-new S: PASS, identical to (1), with "trace cvars: the file ran 1 1 1,
//      this server 0 1 1 -- replaying with the file's".
//   3  N1 on the new binary (ctl-new and s0-new): HOLD "state: N packet(s)
//      differ, first at row r" with exactly s0-old S's N and r -- all three are
//      the same trisoup-0 replay against the same samples.
//   4  ctl-old N1: PASS identical to (1) (the old binary ignores the pin).
//   5  after each pm_verify, `pm_trisoup_bevels` and `serverinfo` read what
//      they read before it.
// FALSIFIED IF: (1), (2), (3) or (5) fails.  (0) failing voids the harness.
// AMENDED (2026-09-18 20:48, before N2 or the probe ran with any verify)
//   5  could not fail: the patch writes .value/.ival, never the string both
//      commands print.  It shows only that serverinfo reads the same after every
//      verify; no transient push rests on the direct field writes, not on this.
//   5a .value restore: a verify compares the pin with .value read at its start
//      (savetv).  s0-new N1 and ctl-new N2 print no trace-cvar line; a
//      verify that left .value at its last pin would make them print "this
//      server 1 1 1" and "this server 0 1 1".
//   6  N2: ctl-old PASS as (1); s0-old HOLD as (0); ctl-new and s0-new the same
//      HOLD "state: N packet(s) differ, first at row r", r >= 237 and r != 74
//      (expected r >= 1283: rows 237-1282 are pm_type 2, PMSrc_NoClipMove).
//      A 358 PASS means the walk does not exercise trisoup and the pm-row call
//      is unmeasured.
//   7  .ival restore: within each arm the four probe hashes are equal, 507c8b94..
//      on ctl, 2158fa44.. on s0.  A leaked .ival shows on s0-new after S (1)
//      and on ctl-new after N1 (0).
// GATES (same binaries): p349verify, p352slots, p356newer VERIFY lines match
// the pre-358 binary's; pm_dettest on bhop_eazy prints mapcrc 676de275, libm
// 5e749b8a83b44107, trace f7958b04dbcd1008, mover 3d136f8de25c9c2c, tick
// 93e8615d81c26325.
echo ================================ P358 server trace cvars
pm_trisoup_bevels
pm_rotatedboxhulls
pm_portalcsg_scanall
serverinfo
echo ================================ P358 probe before
pm_dettest
echo ================================ P358 S p358seam.rec
pm_verify data/p358seam.rec
pm_trisoup_bevels
echo ================================ P358 probe after S
pm_dettest
echo ================================ P358 N1 p358seam_t0.rec
pm_verify data/p358seam_t0.rec
pm_trisoup_bevels
echo ================================ P358 probe after N1
pm_dettest
echo ================================ P358 N2 p358seam_t0pm.rec
pm_verify data/p358seam_t0pm.rec
pm_trisoup_bevels
echo ================================ P358 probe after N2
pm_dettest
serverinfo
echo ================================ P358 done
quit
