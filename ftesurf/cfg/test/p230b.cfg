// Patch 230 -- does taking $staticprop models off the skeletal path buy anything?
//
// THE ARM IS SET BY p230b_on.cfg / p230b_off.cfg, which exec this.  hl2_rigidprops
// is MAPLATCH and the models are parsed at map load, so it MUST be set before the
// map command or the arm is a lie.
//
// Same viewpoint as p230a, and it has to be: surf_demise's own info_player_start,
// where the pre-patch reading was
//     r_speeds 2   Opaque 27,528us  Present 11,145us  4,703,625 idx  1863 draws  24.4 fps
//     r_speeds 3   Opaque 46,284us  Present    359us  4,703,625 idx  1863 draws  19.2 fps
// Only r_speeds 3 calls glFinish (render.h:947), so 3 is the honest total and 2
// minus 3 is roughly what the GPU was still chewing on.  Both are read here
// because the fix targets the CPU half ONLY -- it removes per-frame skinning and
// per-frame vertex re-upload; it removes not one index and not one draw call.
// A win that shows up in `2` and not in `3` would mean we moved the CPU cost and
// the GPU is now the wall.
//
// developer 1 from the start: every model now prints RIGID or skeletal as it
// loads (mod_hl2.c), which is the evidence that the gate actually fired.  On
// surf_demise the offline .mdl census says the answer must be 73 RIGID, 0
// skeletal -- every prop model on the map is one-bone $staticprop with no
// animations.  If the log disagrees with 73, the gate is wrong and the fps
// number means nothing.

developer 1
cfg_save_auto 0
cl_idlefps 0
sv_cheats 1

wait 200

map surf_demise
waitmap 900
wait 300

echo ^5--- r_speeds 2 (no glFinish) ---
r_speeds 2
wait 240
screenshot
waitms 800

echo ^5--- r_speeds 3 (WITH glFinish) ---
r_speeds 3
wait 240
screenshot
waitms 800

echo ^5--- control: r_drawentities 3 skips the props entirely ---
r_drawentities 3
wait 240
screenshot
waitms 800
r_drawentities 1
r_speeds 0

echo ^5=== p230b done ===
wait 30
quit
