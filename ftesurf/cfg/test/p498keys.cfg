// P498KEYS -- Patch 498: a text field the keyboard can reach, and one that gives
// the navigation keys back.
//    python tools/p498keys.py
//
// THE DEFECT, in two halves that are one rule.  sui moves its cursor by HIT TEST
// (_cursor_kb_move looks _action_elements up by screen position) and a text field
// is not an element the cursor can land on and click, so with the mouse parked off
// it no key the menu VM consumes can focus a field -- and sui_text_input_focused,
// the flag that suppresses the WASD navigation keys, is set from a MOUSE hit
// (sui_is_last_clicked), so it reads FALSE and w/a/s/d keep moving the cursor.
// The field is unreachable by keyboard, and the flag that would have suppressed
// the navigation keys while someone typed in it was only ever set by a mouse.
//
// THE FIX is a CLAIM, not a flag: TAB on a screen with a field claims it
// (sui_field_focus), the field's own draw takes the claim (sui_text_input), and
// sui_begin clears the flag every frame -- so a claim cannot outlive the screen
// that made it, and the panel's ESC drops it explicitly.  Why a claim and not a
// set-and-forget flag is in the essay over sui_field_focus, and it was measured:
// the first cut set the flag from the key handler and got exactly ONE frame with
// it set out of 899 draws, so the next keystroke arrived after sui_begin had
// cleared it -- and that one frame was worse than useless, because the buffered
// TAB (bound to +showscores) made sui_listen_command report a navigation key and
// Menu_KeyEvent then told keys.c the VM had HANDLED it.
//
// WHY A SYNTHETIC KEY IS THE RIGHT INSTRUMENT HERE AND NOT A SUBSTITUTE.
// AGENTS.md says a synthetic key never reaches the binds in a minimized headless
// client, and that is about cl_keys.c's bind dispatch in CSQC.  This is menuqc:
// keys.c gives every non-F1..F15 key to Menu_KeyEvent and RETURNS (keys.c:4056-
// 4063), so with the menu up a bind never runs and Menu_KeyEvent's QC half IS
// Menu_InputEvent -- which is what `ui_key` calls, with a scan out of the
// engine's own stringtokeynum table.  The handler under test is the real one.
// What it cannot reach is _sui_kb_move_dir's consumption of _cursor_kb_move,
// which m_draw drives, so a navigation key is graded by the CURSOR it moved.
//
// THE SCREEN THIS IS GRADED ON IS CHOSEN, NOT CONVENIENT, and that choice is the
// reason the arm can say anything at all.  The create screen has 58 elements --
// one per visible map row -- and its scroll view calls sui_reread_input and
// drains the input buffer every frame, so a keystroke there is gone before the
// field can read it (measured: the TAB that claimed the focus was consumed by the
// frame that claimed it).  A text field on that screen is therefore unreachable
// by ANY key, which is a separate finding and is in BACKLOG.  The name screen has
// three elements and no scroll view, and on it: the cursor starts at (960,570),
// RIGHT moves it to (1146,626), LEFT back to (839,626) and UP to (960,570) --
// measured, one wait per key -- so "did this key navigate" has an observable.
//
// PRE-REGISTERED.  Every figure is a line the menu VM prints:
//  A1 nothing focused at boot: `ui_focus` reads field '' held 0, keydest 2 (the
//     menu holds the key destination -- PF_cl_getkeydest's own encoding, where
//     kdm_menu is 2 and not the mask's 8, so 2 means "drawing").
//  A2 `ui_key rightarrow` took 0 -- Menu_InputEvent did not consume it, so it fell
//     through to _sui_kb_move_dir.  (ENTER is NOT the probe for "the synthetic key
//     reached the handler": it IS consumed, took 1, and reading that as "dropped"
//     was this arm's first mistake.)
//  A3 and it navigated: the cursor moved for RIGHT, for LEFT and for UP, one wait
//     apiece, ending where it started.
//  A4 is B5, and this arm has no ENTER-as-consumed probe: `ui_key enter` reads
//     took 0 on this screen even though ENTER is sui's confirm key, because
//     sui_input_is_confirm is reached only through sui_block_menu_navigation --
//     which is the unused sibling of sui_block_input_fn (measured: no caller
//     anywhere in src/) -- and the name screen's commit is its own handler's, so
//     a focused field consumes ENTER as char 13 instead.  The first cut of this
//     arm graded `took 1` here and failed for that reason; what makes A2's 0 mean
//     something is B5, a keystroke that reached a field's text.
//  B1 a MOUSE CLICK on the field focuses it -- the route that always worked, and
//     the baseline the keyboard route is measured against.  `ui_click` drives
//     _sui_mouse_move + Menu_InputEvent(IE_KEYDOWN/UP, K_MOUSE1), i.e. the real
//     click path; its `down 0 up 0` return is NOT a failure (sui reports a click
//     on the release of the FOLLOWING frame), so the observable is `ui_focus`.
//  B2 `ui_focus` reads held 1 for that field, and `ui_name field` reads the caret
//     at the end of the text -- a click focuses and moves the caret.
//  B3 RIGHT does NOT move the cursor while the field is focused -- the same key
//     that moved it in A3.  This is the suppression being real, and it is graded
//     on a screen whose RIGHT provably moves the cursor, because on the create
//     screen (58 elements, one per map row) no direction has anywhere to go and
//     "did not move" would be true of a build that was not suppressing anything.
//  B4 typing reaches the field: `ui_key w down 119` and friends put "wat" in it,
//     read back by `ui_name field`.  THIS is the check that focus works, and it is
//     the one a focus flag alone would pass without.
//  B5 ENTER is not swallowed AS TEXT (char 13 is sui_handle_text_input's "commit
//     and deselect"), and the committed `name` is NOT the field's: ui_name_take is
//     not wired to char 13, so ENTER does not adopt what was typed -- pre-existing,
//     and in BACKLOG.  The positive half of "a keystroke reached the field" is B7.
//  B7 the BIND-bearing letters reach the field too: w/a/s/d typed after "wat"
//     leave it reading "watwasd" with the caret at 7.  This is the check the
//     unicode letters cannot make -- w/a/s/d are bound, so a build whose
//     sui_menu_nav still drains the buffer reads "wat" here and looks like it
//     passed B5.
//  C1 the create screen's TAB claims ITS field (a different id, cs_search).  That
//     screen cannot show more: its scroll view calls sui_reread_input and drains
//     the input buffer every frame, so a keystroke is consumed before the field can
//     read it -- measured, and in BACKLOG as its own item.
//  C2 the create screen's ESC drops the claim: field '' held 0.
//  C3 the name screen's click focuses its own field again (held 1).
//  C4 its ESC drops the claim (held 0), and C5/C6 the keys are given back to the
//     panel -- which is the defect's second half.  DOWN and not RIGHT: the ESC
//     lands on the main menu, whose four elements are a vertical list at
//     x 144..352 (mm_play, mm_vis, mm_music, mm_quit, read with `ui_element`), so
//     RIGHT has nowhere to go from mm_play and DOWN moves (226,474) -> (248,538).
//     Both were measured; a navigation key with no element in its direction is
//     indistinguishable from a suppressed one, which is the same trap A3 records.
//
// CONTROL: menu.dat from `git worktree add <tmp> HEAD` compiled by hand
// (`fteqcc64 m_progs.src`), copied over the install's -- tools/p498keys.py prints
// the hash it ran.  Predicted on the control, and measured: `ui_key`, `ui_focus`
// and `ui_cursor` are all UNKNOWN COMMANDS (none of the three existed), so no
// section has an observable and the grader reports CANNOT GRADE rather than
// scoring failures -- a different exit code from a subject that ran and was
// wrong.  What the control therefore does NOT test is the second half of the
// defect on its own terms: a pre-fix build cannot report its own focus state at
// all, so "ESC left the keys dead" is proven by the subject reading held 0 where
// the pre-fix code had no route to clear it, and by there being no caller of
// anything that could.
//
// RESULT (2026-10-06): 16 checks, 0 failed, on menu.dat 14200595A3457882.  The
// control (menu.dat C86E8EC399D018F1, built by hand in a worktree at HEAD, 0
// warnings, and with zero mentions of sui_text_focus or ui_key in either source)
// returned CANNOT GRADE with 36 unrecognised lines and named all four handles as
// unknown -- exactly as predicted, and run twice: once before the sui_menu_nav gate
// went in and once after, with the same verdict.
// FOUR PREDICTIONS FAILED ON THE WAY, and each one was a real finding rather than
// a grader bug:
//  1. "ui_key enter took 1" was to be the probe that the synthetic key reached the
//     handler.  It reads took 0 on the name screen even with no field focused,
//     because sui_input_is_confirm is reached only through
//     sui_block_menu_navigation -- the unused sibling of sui_block_input_fn, no
//     caller anywhere in src/ -- and the screen's own ENTER handler is not on that
//     path.  The probe that works is B5/B6: text appearing in a field.
//  2. "the cursor moves for each of w, a, s, d" -- it does not: _cursor_kb_move
//     picks the element whose centre is nearest in that direction, so a direction
//     with nowhere to go leaves it put (measured (226,474) for both w and a on a
//     four-element main menu).  A navigation key with no element in its direction
//     is INDISTINGUISHABLE from a suppressed one, so every suppression check here
//     is paired with a direction measured to move on that screen.
//  3. "the focus flag suppresses the keys the moment TAB claims it" -- the first
//     cut set the flag from the key handler and got exactly ONE frame with it set
//     out of 899 draws, and that one frame made Menu_KeyEvent report the key as
//     HANDLED.  The claim shape is what fixed it (see the essay in sui_sys.qc).
//  4. "the first navigation key after a click is suppressed by the focus" -- it is
//     spent, not suppressed: _cursor_kb_move only moves FROM an element's centre,
//     and a click leaves the cursor inside a box but off-centre (measured: `dir
//     scan 131 focus 1 flag 1 kb 0 0` -- the gate live, the move vector still
//     zero).  Hence the two spent RIGHTs, one before A3's base and one before B4's.
// AND A FIFTH, WHICH IS THE ONE THAT MATTERED: "the focus gate in sui_input_dir is
// enough" is FALSE.  sui_menu_nav's four sui_listen_* calls classify a key by its
// BIND, read out of the same buffer the field types from, so w/a/s/d were consumed
// by the navigation before sui_text_input could see them -- measured with the gate
// live: `nav focus 1 up 1 down 0 left 0 right 0` for exactly the one frame the w
// was in, and the field still empty afterwards.  The gate went into sui_menu_nav as
// well, and B7 (w/a/s/d typed into the field, which are BOTH binds and printable)
// is the check that would fail without it while B5 still passed.
// ALSO MEASURED AND NOT FIXED HERE: the create screen's field is unreachable by
// ANY key, because its scroll view calls sui_reread_input and drains the input
// buffer every frame -- the TAB that claimed the focus was consumed by the frame
// that claimed it.  In BACKLOG.
// AND ONE MORE, WHICH IS WHY B6 IS A NEGATIVE READING: ENTER in a focused field
// is not swallowed as text (char 13 is the commit branch) but nothing wires that
// to the screen's own take, so typing "watwasd" and pressing ENTER leaves the
// committed name at its default -- `name "Proto" -- chosen`, measured.  BACKLOG
// has it with the falsifier for whoever wires it up.
cfg_save_auto 0
log_enable 1
log_dir "logs"
log_name p498keys
developer 0
log_developer 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0
con_notifylines 0
con_notifytime 0
// A menu-only run binds no server.  Set the port anyway so a copy of this file
// that does launch one cannot land on a lobby port.
sv_port 27602
set ui_bootcheck 0

wait 200
menu_restart
waitms 1500

// A NAVIGATION KEY IS CONSUMED ONE FRAME LATER, not by the handler:
// Menu_InputEvent buffers it, m_draw's last act is sui_menu_nav, and sui_end
// clears the buffer -- so the cursor it moves is the next frame's.  A minimized
// client renders about one frame every few seconds, so every wait below is one
// that a frame needs and this arm is slow rather than approximate (measured: 3 s
// was not always enough, 9 s always was).
ui_name screen
waitms 9000
// THE FIELD'S BOX, in transformed screen space: screen_name lays the panel out at
// (screensize/2 - [260, 112]) and the field at panel + [24, 112] with size
// [472, 30], so at 1920x1080 it is (724..1196, 623..653).  Read back by ui_click's
// own print rather than trusted: a click that hit nothing reports `down 0 up 0`
// and `focus ''`, which is how the first cut of this arm found that it was aiming
// at an untransformed coordinate.
ui_click 900 640
waitms 9000
ui_focus
ui_name

echo ^5=== p498 A ===
ui_cursor
ui_focus
ui_key rightarrow
waitms 9000
ui_cursor
ui_key leftarrow
waitms 9000
ui_cursor
ui_key uparrow
waitms 9000
ui_cursor

echo ^5=== p498 B ===
// THE MOUSE CURSOR IS PARKED ON AN ELEMENT BEFORE ANY NAVIGATION KEY IS SENT, and
// that is a precondition rather than a detail: sui_input_dir calls
// _cursor_kb_move('0 0 0') BEFORE it classifies the key, which activates mouse
// mode -- and while _cursor_is_mouse_active is set, _cursor_kb_move returns
// immediately.  So the first navigation key after a click moves nothing whatever
// the focus is doing, and an arm that sampled only after one key would read that
// as the focus suppressing it.  Measured, with the probe that settled it: `dir scan
// 131 focus 1 flag 1 kb 0 0` -- the key classified as navigation, the focus gate
// live, and the move vector still zero.  RIGHT is spent here and its sample is the
// base B4 compares against.
ui_key rightarrow
waitms 9000
// THE FIELD'S BOX IS READ, NOT COMPUTED: `ui_element` prints it in the space the
// hit test uses, and on this screen at 1920x1080 it is nm_field 724 555 472 30.
// Two cuts of this arm aimed at the authored geometry and at a transformed estimate
// of it and hit nothing either time, with `down 0 up 0` as the only evidence.
ui_click 900 568
waitms 9000
ui_focus
ui_name field
// THE MOUSE CURSOR IS PARKED ON AN ELEMENT AGAIN HERE, AND THAT IS THE SECOND HALF
// OF THE PRECONDITION: the click above moved it to (900,568), which is inside
// nm_field but is not the element's CENTRE, and _cursor_kb_move only runs from a
// centre -- so the first navigation key after any click is spent re-centring.  With
// only the boot park, B4's base was (960,570) and its "focused" sample was
// (1146,626): the focus gate was live (the probe read focus 1) and the cursor moved
// anyway, because the key that moved it was the spent one.
ui_key rightarrow
waitms 9000
// RIGHT is the one navigation key that MOVES on this screen (measured: A3), so it
// is the one whose suppression means something.  One wait, one sample either side.
ui_cursor
ui_key rightarrow
waitms 9000
ui_cursor
// Typing is consumed by the FIELD in the same frame's sui_text_input, so it needs
// no wait of its own -- only the frame that draws it, which `ui_name field` reads.
ui_key w down 119
ui_key a down 97
ui_key t down 116
waitms 9000
ui_name field
// AND THE BIND-BEARING KEYS, which is the half of the BACKLOG item that the
// unicode ones do not cover: w/a/s/d are BOUND (+forward/+back/+moveleft/
// +moveright, default.cfg), and sui_menu_nav classified them by bind out of the
// SAME BUFFER the field types from -- so before the fix they were consumed by the
// navigation and never reached the field (measured: `nav focus 1 up 1 down 0 left
// 0 right 0` for exactly the one frame the w was in, and the field still empty).
// Four letters chosen because each is a bind AND a printable character, so one
// sample proves both that the buffer was not drained and that the text arrived.
ui_key w down 119
ui_key a down 97
ui_key s down 115
ui_key d down 100
waitms 9000
ui_name field
ui_key enter
waitms 9000
ui_name

echo ^5=== p498 C ===
ui_strip_test screen create
waitms 9000
ui_key tab
ui_focus
waitms 9000
ui_key escape
waitms 9000
ui_focus
ui_name screen
waitms 9000
ui_click 900 568
waitms 9000
ui_focus
ui_key escape
waitms 9000
ui_focus
ui_cursor
ui_key rightarrow
waitms 9000
ui_cursor
ui_key downarrow
waitms 9000
ui_cursor

echo ^5=== p498 done ===
waitms 300
quit
