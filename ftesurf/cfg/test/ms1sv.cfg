// MS1SV -- Multi-Session on a lobby, server half (client: ms1cl.cfg).  Zones as
// ms1listen.cfg; stub `b65stub.py cert 8131`.  A lobby streams, and keys the
// slot by the certificate: data/resume/surf_666/@<guid>/save000/.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name ms1sv
developer 1
exec cfg/lobby/lobby.cfg
sv_cheats 0
set lobby_master "http://127.0.0.1:8131"
sv_guidkey "ftesurf-ms1-probe"
sv_maxrate         0
sv_maxdownloadrate 0
set lobby_master_key  "stub-key-not-a-real-one"
set lobby_master_rate 30
set run_resume_min 1
set run_resume_countdown 1
map surf_666
waitms 110000
quit
