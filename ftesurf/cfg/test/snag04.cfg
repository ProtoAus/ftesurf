// SNAG04 -- Patch 258, the A/B done properly: start ON the wedge.
//
// snag03 answered the mechanism (in-plane edge-plane contacts 111 -> 0,
// unstandable normals 134 -> 3) but its distance comparison was unreadable,
// because once the two passes diverge they diverge chaotically -- the OLD set
// actually travelled further, by being thrown off the lip and falling 90 units
// down the slope.  Raw displacement is not the measurement; getting across is.
//
// So start exactly where the player wedges, 10529.1 -324.1 5357.3, facing the
// heading they were walking, and measure progress along that heading.
// run_eyeinfo's `N away` is the distance to whatever the crosshair hits, and the
// crosshair points along the walk, so the DROP in `away` over a fixed walk is
// forward progress in a straight line.  Nothing to reconstruct and nothing to
// reconcile between passes.
//
// Each state is run twice, because a single number here is worth very little:
// if the two A runs disagree with each other by as much as A disagrees with B,
// the run has measured noise.  Expect A to move ~0 and B to move freely.

log_enable 1
log_dir "logs"
log_name "snag04"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
con_notifylines 0
developer 1
log_developer 1

wait 200
map bhop_monster_jam
waitmap 1800
waitms 8000
sv_cheats 1
waitms 400
pm_dispprobe 0

echo ^5=== A1: bevels 0 ===
pm_trisoup_bevels 0
waitms 200
setpos 10529.1 -324.1 5361.3 0 123.7 0
waitms 1500
cmd run_eyeinfo
waitms 800
+forward
waitms 1500
-forward
waitms 800
cmd run_eyeinfo
waitms 800

echo ^5=== B1: bevels 1 ===
pm_trisoup_bevels 1
waitms 200
setpos 10529.1 -324.1 5361.3 0 123.7 0
waitms 1500
cmd run_eyeinfo
waitms 800
+forward
waitms 1500
-forward
waitms 800
cmd run_eyeinfo
waitms 800

echo ^5=== A2: bevels 0 again ===
pm_trisoup_bevels 0
waitms 200
setpos 10529.1 -324.1 5361.3 0 123.7 0
waitms 1500
cmd run_eyeinfo
waitms 800
+forward
waitms 1500
-forward
waitms 800
cmd run_eyeinfo
waitms 800

echo ^5=== B2: bevels 1 again ===
pm_trisoup_bevels 1
waitms 200
setpos 10529.1 -324.1 5361.3 0 123.7 0
waitms 1500
cmd run_eyeinfo
waitms 800
+forward
waitms 1500
-forward
waitms 800
cmd run_eyeinfo
waitms 800

echo ^5=== snag04 done ===
wait 30
quit
