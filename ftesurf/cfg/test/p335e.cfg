// Patch 335, ARM E -- THE CLEAN CROSSING (bhop_arcane).  No setpos: the
// harness warps with `cmd zone_goto` (an SSQC warp that leaves movetype
// alone, unlike the engine's setpos cheat which forces MOVETYPE_NOCLIP and
// desyncs the two simulations -- measured in p335b/p335c) and then walks off
// the route under +forward with +jump pulses, which on a bhop map ends in a
// fall, and every fall ends in a fall-reset trigger_teleport.
//
// This arm runs on the build whose client probe clips REAL BRUSHES: the
// first cut of cl_triggers.qc left the trigger edicts SOLID_NOT, and
// World_ClipMoveToEntity resolves the submodel only for SOLID_BSP/
// BSPTRIGGER/PORTAL -- with any other solid it clips the BOUNDING BOX
// instead.  On surf_rise that made a fall-reset whose bbox spans
// 3858x3426x194 fire from everywhere under it, forever, while the server
// (exact brushes) never fired: an infinite client-only teleport loop, which
// is the snap-back bug class in its worst form.  Solid is BSPTRIGGER now.
//
// PREDICTIONS, registered before the run:
//   A  zone_goto 1 moves the player (viewpos changes) without any trig fire
//      -- an SSQC warp is not a trigger crossing.
//   B  Walking/jumping off the route ends in a fall, and the fall fires a
//      teleport on the client: a BOUNDED burst of "trig: seq N trig #M kind 1
//      fired" prints (the crossing command replays on each rendered frame
//      until acked), then silence.
//   C  The server fires its own copy: the viewpos samples after the burst
//      sit at the trigger's destination and STAY there.
//   D  Ten seconds of standing produce zero fires (the surf_rise loop is
//      gone with the brush fix).
//
// FALSIFIED IF: fires never appear after a real fall (mirror is blind), or
// fires continue while standing (loop), or the client's fired destination
// and the final server viewpos disagree (snap-back).
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p335e
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0
menu_restart
waitms 1500

set cl_trigdebug 1
connect 127.0.0.1:27666
waitms 25000

echo ^5=== p335e A: warp to stage 1 ===
cmd viewpos
waitms 400
cmd zone_goto 0 0 0
waitms 1000
cmd viewpos
waitms 600

echo ^5=== p335e B: walk off the route ===
+forward
waitms 1500
+jump
waitms 300
-jump
waitms 1200
+jump
waitms 300
-jump
waitms 2500
cmd viewpos
waitms 2500
cmd viewpos
-forward
waitms 500
cmd viewpos

echo ^5=== p335e D: standing still -- must be silent ===
waitms 10000
cmd viewpos
waitms 500

echo ^5=== p335e done ===
waitms 300
quit
