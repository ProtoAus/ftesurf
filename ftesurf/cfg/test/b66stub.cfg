// Build 66: the headcount cases the live directory cannot produce on demand.
//
// b66pop.cfg already pins the join against the real play.proto.bar, and that is
// the arm that matters -- but every lobby there was idle, so it only ever saw
// "0 playing".  The green branch, the two-lobbies-one-map sum and the
// case-insensitive match were all untested by it.  surfd/b66stub.py serves the
// five rows that exercise them; its header is the arm list.
//
// PREDICTION:
//   5 lobbies parsed, and exactly THREE rows draw a count:
//     surf_lux         "7 playing"   (3 + 4, summed across two lobbies)
//     Bhop_Mukiology   "2 playing"   (matched from lowercase, case fix)
//     surf_flow        "0 playing"   (a lobby with nobody on it is not silence)
//   and zz_b66_absent's NINE players land on no row at all.
//
// FALSIFIED IF: surf_lux draws 3 or 4 rather than 7 (the sum is not summing, or
// the second lobby overwrote the first); Bhop_Mukiology is absent or reads "not
// installed here" (ui_map_index is still comparing exactly); surf_flow draws
// nothing (0 and "no lobby" have been folded together); or "4 of 1337" appears
// (the absent map found a row, i.e. the mapidx < 0 guard is gone).
//
// See b66pop.cfg for why menu_restart is here and why the wait is long.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name b66stub
log_developer 1
developer 1

// Plain `lobby_dir`, not `seta`: this must NOT be archived.  The cvar is
// CVAR_ARCHIVE, and a `seta` here would write a dead localhost stub into the
// config as this install's permanent directory -- which would then be honoured
// on every launch, and Lob_MigrateDir would deliberately leave it alone,
// because it is not a value this project ever shipped as a default.
lobby_dir "http://127.0.0.1:8099"

waitms 20000
menu_restart
waitms 3000

echo ^5==== b66stub: cold ====
ui_lobbypop
waitms 8000

echo ^5==== b66stub: warm -- against the stub ====
ui_lobbypop
waitms 1000

echo ^5==== b66stub: done ====
quit
