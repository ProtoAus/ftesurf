// G8 -- is AREA CULLING what hides the world and the entities?
//
// The user's report: "the entities inside the level you're currently in does not load; if
// you go through [the portal] it's like that level despawns".  Entities despawning per-area
// is the signature of Source area culling, not of PVS -- mod_vbsp.c:4242 refuses any leaf
// whose area bit is clear, and 2975-2977 stamps areanum onto every entity's pvscache, so
// one wrong area bit takes the world surfaces AND the entities in them together.
//
// Measured so far, at runtime, with developer 1:
//     surf_kitsune  ->  "area 4 of 13: 1 area(s) reachable"
//     surf_conc     ->  "area 1 of 2: 1 area(s) reachable"
// i.e. on kitsune twelve of thirteen areas are unreachable.  That is NOT fixed by opening
// portals (map_autoopenportals is already 1 in default.cfg, and hl2_areaportals defaults to
// 1): kitsune has 13 areas and exactly ONE areaportal, so eleven areas have no portal to
// flood through at all and can never be connected.
//
// The open question is whether those unreachable areas contain anything.  They might be the
// 3D skybox and sealed volumes, in which case the report is harmless and this is a dead end.
// map_noareas 1 bypasses the area test outright, so the A/B answers it directly:
//
//   world batches / indices UNCHANGED  -> the other areas are empty, area culling is not it
//   world batches / indices JUMP       -> area culling is hiding real geometry: the bug
//
// map_noareas is CVAR_RENDERERLATCH, so it must be set BEFORE the map loads -- hence two
// separate map loads rather than toggling in place.  Getting that wrong would make the arms
// silently identical and look like a clean negative.

cfg_save_auto 0
developer 1
log_developer 0
scr_sshot_type png
cl_yieldcpu 0
cl_maxfps 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0
r_speeds 2
vbsp_portal_render 1
r_portalscissor 1

waitms 2500

// ============================================ kitsune, area culling ON (stock)
map_noareas 0
map surf_kitsune
waitmap 240
waitms 6000
sv_cheats 1
setpos 0 -765 133 0 90 0
waitms 3000
echo "@@@ kitsune AREAS-ON exit hall"
r_speeds_dump
waitms 400
screenshot_mega g8_kitsune_areason_A 1280 720
waitms 500
setpos -15360 -15250 880 0 -90 0
waitms 2500
echo "@@@ kitsune AREAS-ON entry hall"
r_speeds_dump
waitms 400
screenshot_mega g8_kitsune_areason_B 1280 720
waitms 500

// =========================================== kitsune, area culling OFF
map_noareas 1
map surf_kitsune
waitmap 240
waitms 6000
sv_cheats 1
setpos 0 -765 133 0 90 0
waitms 3000
echo "@@@ kitsune AREAS-OFF exit hall"
r_speeds_dump
waitms 400
screenshot_mega g8_kitsune_areasoff_A 1280 720
waitms 500
setpos -15360 -15250 880 0 -90 0
waitms 2500
echo "@@@ kitsune AREAS-OFF entry hall"
r_speeds_dump
waitms 400
screenshot_mega g8_kitsune_areasoff_B 1280 720
waitms 500

// ============================================ surf_conc, the same A/B
map_noareas 0
map surf_conc
waitmap 240
waitms 7000
echo "@@@ conc AREAS-ON spawn"
r_speeds_dump
waitms 400
screenshot_mega g8_conc_areason 1280 720
waitms 500

map_noareas 1
map surf_conc
waitmap 240
waitms 7000
echo "@@@ conc AREAS-OFF spawn"
r_speeds_dump
waitms 400
screenshot_mega g8_conc_areasoff 1280 720
waitms 500

echo "@@@ G8 DONE"
waitms 800
quit
