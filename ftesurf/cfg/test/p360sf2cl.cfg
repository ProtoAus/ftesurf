// P360SF2CL -- stage fill-in review fixes, client half (server: p360sf2sv.cfg).
// Fixture as p360sfcl.cfg (START, S2 box, S3 flown, S4 box, END on surf_666).
//
// PREDICTIONS (pre-registered), stub `cert` with a 2 s delay:
//   D  delayed replies: stage 1's answer lands after stage 2 was posted, stage
//      2's after stage 4 -- chat still says "stage 1: #3 of 17", "stage 2: ...",
//      "stage 4: ...", then "your time is up"; *srank ends on leg 4, answered.
//      (Before the fix the first two answers were dropped.)
//   P  hop out of START (short dwell -> practice), then walk: legs 2 and 4 post
//      and the practice finish is kept as data/evidence/surf_666/<runid>.rec
//      ("kept ... (2 posted stage(s))"), not the fixed-name last.rec.
//   S  post leg 1, sl_save in S2, walk out and post leg 2, sl_load: kept with
//      the PRE-load clock (abandon >= the stage-2 record); after the load NO
//      stage posts (no live recording), the finish still submits leg 0.
//   G  post leg 1, stop in S2, rec_ghost 1 / 0, walk out: leg 2 NOT posted
//      (timer "prime 0 launch 260"), leg 4 posted.
//   M  post leg 1, hold in S2 through the server's map reload: "kept
//      data/evidence/... (1 posted stage(s))" at the reload (SV_Shutdown).
//   U  m_accel 1, two walks: every stage row demoted, but the stage "unranked"
//      chat line appears ONCE; each finish still says it (3 lines, not 8).
// FALSIFIER: dropped stage lines in D, last.rec in P, a post after the load in
//   S, leg 2 in G, no keep in M, more than one stage unranked line in U.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p360sf2cl
developer 1
cl_idlefps 0
cl_maxfps 100
rate  2000000
drate 5000000
vid_fullscreen 0
waitms 6000
connect 127.0.0.1:27631
waitms 12000
set rec_terms 1
echo ^5==== D: delayed replies ====
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 6000
-forward
waitms 10000
results wrank
echo ^5==== P: practice start, then posts ====
cmd zone_goto 0 90 0
waitms 2000
+jump
waitms 50
-jump
waitms 50
+jump
waitms 50
-jump
waitms 50
+jump
waitms 50
-jump
waitms 50
+jump
waitms 50
-jump
waitms 50
+jump
waitms 50
-jump
waitms 50
+jump
waitms 50
-jump
waitms 50
+forward
+jump
waitms 50
-jump
waitms 50
+jump
waitms 50
-jump
waitms 50
+jump
waitms 50
-jump
waitms 50
+jump
waitms 50
-jump
waitms 50
+jump
waitms 50
-jump
waitms 50
+jump
waitms 50
-jump
waitms 50
+jump
waitms 50
-jump
waitms 50
+jump
waitms 50
-jump
waitms 50
waitms 8000
-forward
waitms 1000
cmd timer
waitms 9000
echo ^5==== S: save, post, load ====
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 1300
-forward
waitms 1000
cmd sl_save
waitms 500
+forward
waitms 1500
-forward
waitms 500
cmd timer
cmd sl_load
waitms 1000
cmd timer
+forward
waitms 5000
-forward
waitms 8000
echo ^5==== G: ghost in the S2 box ====
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 1300
-forward
waitms 1000
cmd rec_ghost 1
waitms 1000
cmd rec_ghost 0
waitms 500
+forward
waitms 900
cmd timer
waitms 4100
-forward
waitms 8000
echo ^5==== M: hold in S2 through the map reload ====
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 1300
-forward
waitms 1000
cmd timer
waitms 30000
echo ^5==== U: m_accel 1, two walks ====
m_accel 1
waitms 2000
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 6000
-forward
waitms 12000
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 6000
-forward
waitms 12000
m_accel 0
echo ^5==== done ====
waitms 1000
quit

// RESULT (2026-09-18, second run -- the first had P's walk 3 s shorter, so it
// never reached the finish and was abandoned instead; everything else matched):
//   D  "stage 1/2/4: #3 of 17" and "your time is up" all arrived with the 2 s
//      delay; *srank "surf_666 0 4 35 1 3 17 1 20000 0".
//   P  practice (flags 1): legs 2 and 4 posted; the finish streamed to
//      data/evidence/surf_666/<runid>.rec ("kept ... (2 posted stage(s))"),
//      submit rec="" -- no last.rec.
//   S  legs 1, 2, then "kept ... (2 posted stage(s))" at sl_load; abandon 290
//      after `stage 2 244`; no stage post after the load; leg 0 flags 137.
//   G  timer "prime 0 launch 258" after the ghost; legs 1, 4 + main only.
//   M  "kept ... (1 posted stage(s))" right after the server's reload line.
//   U  flags 2048 on every post; 3 "unranked (input mode)" lines in total.
//   All six recordings: reccheck 0 faults.  p360sf re-run: unchanged.
