// CONTROL for b67join: does ANY menuqc console command work from a cfg?
// ui_lobbypop is a build-66 menu command that predates this work entirely.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name b67ctl
waitms 40000
echo ^5==== b67ctl: forcing the menu VM up ====
menu_restart
waitms 4000
echo ^5==== b67ctl: calling a menu command that already existed ====
ui_lobbypop
waitms 2000
echo ^5==== b67ctl: and one that does not exist at all ====
ui_thiscommanddoesnotexist
waitms 2000
echo ^5==== b67ctl: done ====
quit
