// P449CAP -- the run line's mark cap (LN_EVCAP), which no arm had ever fired.
//    python tools/p449cap.py
//
// The policy (cl_lines.qc Line_Ev): when a slot's marks reach the cap, the peaks
// (apex/trough) go as a class in one pass and later ones are ignored; past that it
// stops and counts.  The fixture has 35 marks (6 apex, 0 trough), so the driver
// builds the progs with LN_EVCAP 20 -- the 20th mark cuts 4 apex, then 29 non-peaks
// overrun it by 9 -- runs this, puts the define back and rebuilds, and grades the
// capped dump against the uncapped one put through the policy.
//
// PRE-REGISTERED
//  K1 the uncapped build holds every mark: count 35, cut 0, dropped 0.
//  K2 the capped build's table is the model's, mark for mark (kind, ordinal).
//  K3 its counters are the model's: 20 held, cut 1, 9 dropped.
//  K4 `replay status` says so: `marks 20, peaks cut, 9 dropped  (cap 20)`.
//
// RESULT (2026-10-03): K1-K4 held.  Numbers and mutants in tools/p449cap.py.
cfg_save_auto 0
log_enable 1
log_dir "logs"
log_name p449cap
developer 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0
set run_resume 0
sv_public 0
sv_port 27711
set lobby_dir ""
set hud_watch_skipidle 0
set hud_watch_path 1
con_notifytime 0

wait 200
map surf_colin_blaster_69000
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 1000

replay data/resume/surf_colin_blaster_69000/@local/save000/run.rec
waitms 1500
replay pause
echo ^5=== p449cap marks ===
replay marks 0
waitms 500
replay status
waitms 500
echo ^5=== p449cap done ===
replay stop
waitms 300
quit
