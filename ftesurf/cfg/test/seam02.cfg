// SEAM02 -- isolate $bumpmap2 with a per-vantage NOISE FLOOR.
//
// seam01 measured hl2_bumpmap2 1->0 at 70.39% of pixels changed, which cannot be
// right: transition.glsl consults the normal only inside #ifdef REFLECTCUBEMASK,
// so the second normal map can only move the cubemap reflection.  A 70% frame is
// the signature of something else moving.
//
// It is: seam01 took ONE shot per state and only one repeat, at vantage A, where
// two IDENTICAL states differed by 5.12% with maxdelta 242.  surf_demise animates
// -- the smoke sheets, the water, a rotating brush -- so a diff taken across a few
// seconds carries all of that.  Vantages B and C never got a control at all, and
// their 70% numbers are uninterpretable rather than large.
//
// So: two shots in every state, at the SAME spacing as the A/B, and the noise
// floor is the first pair.  A toggle only counts if it clears its own floor.
//
// Vantage C (moss1_to_moss2) is the quiet one -- terrain filling the frame, no
// smoke in view -- so it goes first and carries the bumpmap2 test.  Vantage D
// looks at rock_cliff_to_moss2 from underneath the tree line for a second opinion.
//
// PREDICTED, before the run:
//   seamless 1->0   large, tens of percent: every texcoord on the terrain changes
//   bumpmap2 1->0   small but above the floor, and confined to where the cubemap
//                   reflection actually lands.  If it comes out at the floor, the
//                   feature is bound but contributing nothing and I should say so.

log_enable 1
log_dir "logs"
log_name "seam02"
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 0
vid_fullscreen 0
developer 1
log_developer 1
con_notifytime 0
con_notifylines 0
con_notifytime_error 0

wait 200

hl2_seamless 1
hl2_bumpmap2 1
map surf_demise
waitmap 1800
waitms 12000
sv_cheats 1
waitms 400
noclip
waitms 400

setpos 938.8 -1264.1 13407.1 35.00 45.00 0
waitms 3000
developer 1
shader_here seam02C
waitms 400
developer 0
waitms 2000

echo ^5---------- NOISE FLOOR: two shots, no change between them --------------
screenshot seam02_c_floor1
waitms 4000
screenshot seam02_c_floor2
waitms 900

echo ^5---------- hl2_bumpmap2 0 ---------------------------------------------
hl2_bumpmap2 0
waitms 4000
screenshot seam02_c_bump_off
waitms 900

echo ^5---------- hl2_bumpmap2 1 (restore, second floor sample) ---------------
hl2_bumpmap2 1
waitms 4000
screenshot seam02_c_bump_on
waitms 900

echo ^5---------- hl2_seamless 0 ---------------------------------------------
hl2_seamless 0
waitms 4000
screenshot seam02_c_seam_off
waitms 900

echo ^5---------- hl2_seamless 1 (restore) -----------------------------------
hl2_seamless 1
waitms 4000
screenshot seam02_c_seam_on
waitms 900

echo ^5########## vantage D ##################################################
developer 1
setpos 9235.6 -4034.9 13436.4 20.00 80.00 0
waitms 3000
shader_here seam02D
waitms 400
developer 0
waitms 2000
screenshot seam02_d_floor1
waitms 4000
screenshot seam02_d_floor2
waitms 900
hl2_bumpmap2 0
waitms 4000
screenshot seam02_d_bump_off
waitms 900
hl2_bumpmap2 1
waitms 4000
screenshot seam02_d_bump_on
waitms 900

echo ^5=== seam02 done ===
wait 30
quit
