// P427SV -- a sound name with a space no longer stalls a join (client: p427cl.cfg).
// surf_r-ne's ambient_generics precache "music/never coming back.mp3" and two
// more spaced names this install does not have, so every joining client asks
// the server for them.  Run from C:\FTESurf:
//   <server exe> +set sv_port 27634 +set sv_public 0 +exec cfg/test/p427sv.cfg
// Server log: logs/<log_name>.  The pass/fail line is the SERVER's
// `said> server: <name> joined` -- a client stuck on a download never spawns.
cfg_save_auto 0
log_enable 1
log_dir logs
developer 1
sv_maxrate         0
sv_maxdownloadrate 0
map surf_r-ne
waitms 75000
quit
