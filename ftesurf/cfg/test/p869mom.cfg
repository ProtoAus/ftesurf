// Patch 869 arm, listen server, through tools/runlines_smoke.py with the subject's progs:
//   python tools/runlines_smoke.py ftesurf/cfg/test/p869mom.cfg --mount --timeout 700 \
//     --ssqc <qwprogs> --csqc <csprogs> --mqc <menu> --output-dir <task root>/artifacts
// Grade the server's own `momtrigger` / `catapult` lines per section:
//   O bhop_mom_training_beta onehops (hold 0.36, all flagged reset-onehop, dest 6t1 -5184 1664 1
//     inside resetonehop *264):
//     O1 first landing *263.  O2 first landing *266, which drops *263 (flag 32768).
//     O3 back on *263: first landing again, no teleport.  O4 re-land on *263 before the hold:
//     teleport *263 at once.  O5 *266 after the reset: first landing, then the hold teleport.
//   M multihop *224 (hold 0.36, dest 8t1 1536 1728 1): M1 standing teleports; M2 0.1 s does not.
//   X run_momtriggers 0, then `!r`: the run started after it is latched off (run_momon,
//     the header's momtrig): no line on *266.  Back on, `!r` again.
//   T bhop_floodwaters: progress *24, then teleport_progress *300 sends to *24's middle -440 256 128.
//   K surf_mom_training catapult *58: playerspeed 1337 along -20 0 0 = 1256.4 0 457.3.
//   R bhop_ithyphallophobia reversespeed *3 (horizontal only): the line prints.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name runlines_smoke
con_notifytime 0
cl_idlefps 0
cl_maxfps 100
vid_vsync 0
vid_fullscreen 0
vid_width 1280
vid_height 720
sv_public 0
set run_resume 0
developer 1
log_developer 1
waitms 1500

map bhop_mom_training_beta
waitmap 120
waitms 6000
menu_restart
ui_close
waitms 500
echo ==== O1 onehop 263 ====
setpos -5184 2144 -127 0 270 0
waitms 100
echo ==== O2 onehop 266 ====
setpos -5184 2976 -383 0 270 0
waitms 100
echo ==== O3 onehop 263 again ====
setpos -5184 2144 -60 0 270 0
waitms 550
echo ==== O4 re-land 263 ====
setpos -5184 2144 -60 0 270 0
waitms 1000
cmd viewpos
waitms 300
echo ==== O5 hold on 266 ====
setpos -5184 2976 -383 0 270 0
waitms 1000
cmd viewpos
waitms 300
echo ==== M1 multihop stand ====
setpos 1536 2016 -63 0 270 0
waitms 1000
cmd viewpos
waitms 300
echo ==== M2 multihop brief ====
setpos 1536 2016 -63 0 270 0
waitms 100
setpos 1536 1728 1 0 270 0
waitms 1000
echo ==== X toggle off ====
set run_momtriggers 0
waitms 100
say !r
waitms 500
setpos -5184 2976 -383 0 270 0
waitms 1000
set run_momtriggers 1
say !r
waitms 500
echo ==== X done ====
waitms 300

map bhop_floodwaters
waitmap 120
waitms 6000
echo ==== T1 progress 24 ====
setpos -440 256 100 0 0 0
waitms 300
echo ==== T2 teleport_progress 300 ====
setpos 3584 3584 6 0 0 0
waitms 1000
cmd viewpos
waitms 300

map surf_mom_training
waitmap 120
waitms 6000
echo ==== K catapult 58 ====
setpos -13856 -4608 1800 0 0 0
waitms 300
cmd viewpos
waitms 300

map bhop_ithyphallophobia
waitmap 120
waitms 6000
echo ==== R reversespeed 3 ====
setpos 1984 -36416 -1990 0 0 0
waitms 1000
cmd viewpos
waitms 300
echo RUNLINES COMPLETE
quit
