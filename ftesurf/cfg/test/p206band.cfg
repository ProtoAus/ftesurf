// Patch 206 -- the acceptance band, MEASURED.
//
// This is the test Patch 205 did not have.  205 verified the crossing with ONE
// hand-placed fixture, and that fixture's own comment admits it was aimed at
// "the middle of the [860, 876] band the window accepts" -- so it proved the
// mechanism and told us nothing about the parameter that decides whether anyone
// can use it.  The user found the truth by playing: the doors could only be
// entered by crouch-jumping, because a 72-tall standing hull in an 88-tall hole
// had sixteen units of freedom and a 54-tall ducked one has thirty-four.
//
// Six slots, identical approach, only the feet height varies:
//   save01 z=820   save02 z=840   save03 z=860
//   save04 z=880   save05 z=900   save06 z=920
//
// PREDICTION.  P203's rule (whole box inside) accepts [860, 876]: slot 3 only.
// P206's rule (box centre inside) accepts [824, 912]: slots 2,3,4,5 -- and
// slots 1 and 6 must STILL REFUSE, four and eight units outside respectively.
// That the window keeps sharp edges in the predicted places is the actual
// claim; "it got easier" on its own would be satisfied by deleting the test.
//
// developer 1 + log_developer 1 because Patch 206's PM_PortalCSGReport is what
// makes a refusal say which plane it missed and by how much.  Before 206 a
// refused carve was completely silent -- the world trace won the fraction
// comparison, entnum stayed 0, and neither of P203's two prints was reachable.
//
// REQUIRES data/saves/surf_kitsune/save01..06 (written by the driver).

cfg_save_auto 0
developer 1
log_developer 1
cl_yieldcpu 0
cl_maxfps 0
vid_vsync 0
r_drawviewmodel 0
con_notifytime 0
crosshair 0

waitms 1500
map surf_kitsune
waitmap 120
waitms 1200

echo "### BAND z=820 slot1"
cmd sl_goto 1
waitms 300
cmd viewpos
waitms 250

echo "### BAND z=840 slot2"
cmd sl_goto 2
waitms 300
cmd viewpos
waitms 250

echo "### BAND z=860 slot3"
cmd sl_goto 3
waitms 300
cmd viewpos
waitms 250

echo "### BAND z=880 slot4"
cmd sl_goto 4
waitms 300
cmd viewpos
waitms 250

echo "### BAND z=900 slot5"
cmd sl_goto 5
waitms 300
cmd viewpos
waitms 250

echo "### BAND z=920 slot6"
cmd sl_goto 6
waitms 300
cmd viewpos
waitms 250

echo "### BAND DONE"
waitms 400
quit
