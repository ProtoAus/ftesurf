cfg_save_auto 0
// P318D -- robustness sweep: load several maps in one process and read the
// per-map census line.  Looking for three things: no crash, a plausible brush
// count, and bevelfull staying at zero (the "left alone for want of room"
// clause in the census line must never appear on a real map).
log_enable 1
log_dir "logs"
log_name "p318d"
cl_idlefps 0
vid_fullscreen 0
con_notifylines 0
hl2_brushbevels 0
wait 200
map kz_bhop_badg3s
waitmap 600
waitms 9000
echo ^5=== P318D loaded kz_bhop_badg3s
waitms 500

map surf_summer_ksf
waitmap 600
waitms 9000
echo ^5=== P318D loaded surf_summer_ksf
waitms 500

map surf_fortum_fix
waitmap 600
waitms 9000
echo ^5=== P318D loaded surf_fortum_fix
waitms 500

map surf_jumble
waitmap 600
waitms 9000
echo ^5=== P318D loaded surf_jumble
waitms 500

map bhop_circlejerk
waitmap 600
waitms 9000
echo ^5=== P318D loaded bhop_circlejerk
waitms 500

map surf_progress_fix
waitmap 600
waitms 9000
echo ^5=== P318D loaded surf_progress_fix
waitms 500

echo ^5=== P318D DONE ===
wait 60
quit

