// Patch 865 review round 1 arm, listen server, through tools/runlines_smoke.py:
//   python tools/runlines_smoke.py ftesurf/cfg/test/p865r1.cfg --mount --timeout 400 \
//     --ssqc <qwprogs> --csqc <csprogs> --mqc <menu> --output-dir <task root>/artifacts
//   G bhop_cheesemania *29 sets gravity 0.33 with no persist key; `!r` arms the START:
//     "gravity: Player reset at the start (was 0.33)".  The P865 commit prints nothing.
//   L lobby_enable 1: *331's Break of tower2 (*420) is held: "held on a lobby".
cfg_save_auto 0
log_enable 1
log_dir logs
log_name runlines_smoke
con_notifytime 0
cl_idlefps 0
cl_maxfps 100
vid_vsync 0
vid_fullscreen 0
vid_width 1280
vid_height 720
sv_public 0
set run_resume 0
developer 1
log_developer 1
waitms 1500

map bhop_cheesemania
waitmap 120
waitms 6000
menu_restart
ui_close
waitms 500
echo ==== G gravity into the start ====
setpos 6166 1690 -3590 0 0 0
waitms 1000
say !r
waitms 1500
echo ==== L lobby break ====
set lobby_enable 1
waitms 300
setpos 3088 -320 2006 0 0 0
waitms 1500
set lobby_enable 0
waitms 300
echo RUNLINES COMPLETE
quit
