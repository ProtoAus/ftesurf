cfg_save_auto 0
// PATCH 1424 -- the human half: a real keyboard must read as corroborated.
// Lex clicks into the window and plays normally for 40 s (move, jump, strafe,
// open chat and type a word). Nothing is injected.
// PRE-REGISTERED: data/p1424_H.hid has kbdobserve 1, many '+' records, and a
// 'y' key total of 0. Any 'y' key is a false positive to explain before ship.

exec cfg/test/_quiet.cfg

developer 1
log_developer 1
log_enable 1
log_dir logs
log_name p1424human
cl_maxfps 100
cl_idlefps 0
sv_cheats 0
r_drawviewmodel 0
in_rawinput 1
in_rawinput_keyboard 0

wait 200
map bhop_eazy
waitmap 600
waitms 3000

centerprint "P1424: click here, then play and type for 40 seconds"
echo P1424 HUMAN begin
in_journal_begin
waitms 40000
in_journal_note p1424-human
in_journal_end data/p1424_H.hid
centerprint "P1424: done, thank you"
waitms 1500
echo P1424 END
quit
