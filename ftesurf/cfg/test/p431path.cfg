// P431PATH -- measurement: is buf_loadfile's 13 s about the file or its path?  The same
// 6.7 MB bytes (r47) opened from data/runs/surf_rookie/main/last.rec and from the
// online cache, on the csprogs given by +set sv_csqc_progname.  Read `opened in`.
//
// RESULT (2026-09-22, ctl csprogs): 12992 / 13030 / 13055 ms -- the size, not the path.
cfg_save_auto 0
log_enable 1
log_dir logs
developer 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0
set run_resume 0
sv_public 0
sv_port 27681
set lobby_dir ""

wait 200
map surf_rookie
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 1000
echo ^5=== p431path runs ===
replay data/runs/surf_rookie/main/last.rec
waitms 500
echo ^5=== p431path online ===
replay data/online/surf_rookie/main/08m26.580s_proto_r47.rec
waitms 500
echo ^5=== p431path runs again ===
replay data/runs/surf_rookie/main/last.rec
waitms 500
replay stop
quit
