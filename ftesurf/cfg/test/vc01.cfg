// VC01 -- Patch 259 smoke test: does the per-vertex prop bake load, bind and draw,
// and does the fallback fire where it must?
//
// Four questions, in the order that a failure is cheapest to diagnose:
//
//   1. surf_garden (HDR, 428 sp_hdr_N.vhv).  The Patch 163 line must still read
//      "428 of 429", and the NEW line must appear beside it saying how many of
//      those kept their bake per vertex and what it cost.  If the second line is
//      missing, hl2_lt_baked did not reach mode 2 or nothing allocated.
//
//   2. prop_census 170 -- s3hedge2, the stage-3 hedge Patch 257 recovered.  Its
//      "per-vertex bake" line must say APPLIED.  REJECTED there would mean the
//      firstvert slicing or the vertex count disagrees with the file.
//
//   3. The A/B.  hl2_lt_baked_vc is live, so 1 -> 0 -> 1 at ONE vantage is the
//      whole comparison, and the middle shot is exactly what mode 1 draws.
//      Screenshots are taken twice each because the capture lands one frame
//      behind the command that asked for it.
//
//   4. surf_leesriize_ksf.  819 of its props have VVD fixups, so our vertex
//      order is not VRAD's and every one of them MUST decline the per-vertex
//      path.  The count on the new line is the assertion: far below its prop
//      count, and no crash.  surf_demise (2350 LDR sp_N.vhv) is the control that
//      the ordinary path did not regress.

log_enable 1
log_dir "logs"
log_name "vc01"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
sv_cheats 1
developer 1
log_developer 1

wait 200
echo ^5=== vc01: Patch 259, per-instance per-vertex static prop lighting ===

// ---------------------------------------------------------------- 1 + 2 -----
map surf_garden
waitmap 1800
waitms 5000

echo ^5=========== surf_garden: the two load lines, then prop 170 =============
prop_census
waitms 400
prop_census 170
waitms 400
prop_census s3hedge2
waitms 800

// ------------------------------------------------------------------- 3 ------
echo ^5================= A/B at one vantage: vc 1, vc 0, vc 1 =================
hl2_lt_baked_vc 1
waitms 1200
screenshot vc01_a_pervertex
waitms 600
screenshot vc01_a_pervertex
waitms 600

hl2_lt_baked_vc 0
waitms 1200
screenshot vc01_b_mean
waitms 600
screenshot vc01_b_mean
waitms 600

hl2_lt_baked_vc 1
waitms 1200
screenshot vc01_c_pervertex_again
waitms 600
screenshot vc01_c_pervertex_again
waitms 600

echo ^5== and prop 170 again, to show the live switch moved it back to APPLIED ==
prop_census 170
waitms 800

// ------------------------------------------------------------------- 4 ------
echo ^5====== surf_leesriize_ksf: 819 props whose vertex order is not VRAD's ====
map surf_leesriize_ksf
waitmap 1800
waitms 5000
prop_census
waitms 800

echo ^5=============== surf_demise: the LDR control, 2350 sp_N.vhv =============
map surf_demise
waitmap 1800
waitms 4000
prop_census
waitms 800
screenshot vc01_d_demise
waitms 600
screenshot vc01_d_demise
waitms 600

echo ^5=== vc01 done ===
wait 30
quit
