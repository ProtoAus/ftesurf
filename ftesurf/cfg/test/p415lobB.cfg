// Patch 415 on a LIVE LOBBY -- player B, who must NOT be offered A's save.
// See p415lobA.cfg for the pair and how to run them. B waits out A's save first.
//
// PREDICTION, registered before the run:
//   B1  `sl_list` shows B's OWN rows only. A's save, placed on this map minutes
//       earlier, is not among them (SL_Blk, Patch 333).
//   B2  `!r` reports the map's own start ("start of the map"), NOT "your save",
//       and lands on the destination -- A's origin is not offered to B.
//   B3  B's guid differs from A's in the lobby log. If they match, this pair
//       measured one player twice and proves nothing.
// FALSIFIED IF B's `!r` says "your save", or B lands on A's saved origin, or
// A's row appears in B's list.
cfg_save_auto 0
log_enable 1
log_dir logs
developer 0
cl_idlefps 0
cl_maxfps 100
name "^3P415 B"
waitms 62000
echo ======== P415B connect $p415_target
connect $p415_target
waitms 22000
echo ======== P415B rows visible to B (A's must not be here)
cmd sl_list
waitms 1200
say !m
waitms 2500
cmd viewpos
waitms 800
echo ======== P415B !r with no save of B's own
say !r
waitms 2500
cmd viewpos
cmd timer
waitms 1200
echo ======== P415B done
waitms 800
quit
