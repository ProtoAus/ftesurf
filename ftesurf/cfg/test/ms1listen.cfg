// MS1LISTEN -- Multi-Session on a listen server (WP10): park on a map reload,
// offer, resume, finish.  Zones: cfg/test/p360sf.zones.json as
// maps/zones/local/surf_666.json (DELETE AFTER); back up data/runs/surf_666 and
// data/saves/surf_666 -- this writes local runs.
//
// Arm B (buffered, rec_stream 0): walk 2 s, `map surf_666` (SV_Shutdown parks,
//   why server), offer, `say !resume`, countdown 1, walk to the finish.
// Arm S (streamed, rec_stream 1): the same through `cmd ms_resume` (F2's path),
//   and the resume copies run.rec (R).
// Arm D (discard): park, offer, walk a fresh run with run_resume_grace 2.
// PREDICTIONS: "resume: parked ... (server, recording buffer|stream)"; an offer
//   line after each reload; "run resumed at T -- session 2"; each finish writes a
//   v10 .rec with 16384 in flags, `pauses server`, `sessions 1`, the trailer's
//   11th field 1, 0 faults.  Screens: the O prompt (ms1_O), the countdown or
//   resumed line (ms1_C), the panel's `session 2` (ms1_run), the banner's
//   MULTI-SESSION at the finish (ms1_fin).  D: the warning, then "paused run
//   dropped (a new run went on)" ~2 s into the fresh run; no offer after.
//   `quit` parks D's fresh run (still running): SV_Shutdown fires where a listen
//   quit runs no ClientDisconnect -- one slot (why server) is left behind.
//   No .view beside the two Multi-Session .rec files (sidecars dropped).
// CONTROL: a finished file minus `session`/`seed` must fault (run by hand).
cfg_save_auto 0
log_enable 1
log_dir logs
log_name ms1listen
developer 1
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
sv_port 27631
sv_cheats 0
vid_conautoscale 0
vid_conwidth 1280
vid_conheight 720
set run_resume_min 1
set run_resume_countdown 1
set hud_banner 1
waitms 5000
map surf_666
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 500
hud_scale 2
set rec_terms 1
echo ^5==== B: buffered ====
set rec_stream 0
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 2000
-forward
waitms 300
cmd timer
echo ^5==== B: park (map reload) ====
map surf_666
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 500
cmd timer
screenshot ms1_O
echo ^5==== B: resume ====
say !resume
waitms 400
screenshot ms1_C
waitms 2100
cmd timer
screenshot ms1_run
+forward
waitms 5000
-forward
waitms 300
screenshot ms1_fin
waitms 1200
cmd timer
echo ^5==== S: streamed ====
set rec_stream 1
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 2000
-forward
waitms 300
cmd timer
echo ^5==== S: park (map reload) ====
map surf_666
waitmap 1800
waitms 3000
cmd ms_resume
waitms 3000
cmd timer
+forward
waitms 5000
-forward
waitms 1500
cmd timer
echo ^5==== D: discard by a fresh run ====
set rec_stream 0
set run_resume_grace 2
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 2000
-forward
waitms 300
map surf_666
waitmap 1800
waitms 3000
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 3500
-forward
waitms 500
cmd ms_resume
echo ^5==== done ====
waitms 500
quit

// RESULT (2026-09-19): as predicted after one fix.  B and S v10 ok, `pauses
//   server`, `sessions 1`, 16384 in flags; B: 123 + (482 - 188) = 417 ticks, S:
//   122 + (512 - 188) = 446; controls (session/seed removed) fault.  D: warned,
//   then "paused run dropped (a new run went on)".  Quit parked D's fresh run.
//   No .view beside either Multi-Session .rec.  First cut: the `A` state's
//   "RESUMED - SESSION 2" line sat on the panel's sub-label (ms1_run): dropped
//   (the sub-label says `session 2`) and the prompt moved to 0.30 of the height.
