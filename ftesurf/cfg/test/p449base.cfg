// P449BASE -- the PRE-CHANGE numbers Patch 449 must not move, captured before a
// line of it is written.  Patch 449 extracts Board_KindOf and Board_RampHeld out
// of cl_board.qc so the run line and the Segments panel share one speller; the
// extraction is a pure refactor and this is what proves it.
//
// GRADED (per fixture, from `replay status`):
//   `ramp gaps bridged N`  -- the only headless evidence the 0.08 s contact-gap
//                             hold does anything (cl_watch.qc:4573).
//   `seq N rows`           -- the segment machine's own output.
//   `path N of M samples, S shown, T tele` and `fit/snaps` -- the line and the
//                             interpolation, unchanged by the refactor.
// Re-run as p449post.cfg (log_name only) after the extraction and diff: every
// number identical, or the refactor changed behaviour and is not a refactor.
//
// Fixtures: the four p432line ones, plus two this patch adds --
//   gigapede bonus_4 shadow: 7 `resume` records, the save-state stitch fixture.
//   bhop_monster_jam cheat:  58353 samples, the event-cap fixture.
// WHAT THIS PROVES, AND WHAT IT DOES NOT (independent review, 2026-09-27).
// Identical numbers over seven fixtures are consistent with the extraction
// being correct AND with a branch of it never being taken -- a fixture set
// where no ride has ramp_lastc == 0 at the test never exercises the `last > 0`
// guard.  So this arm shows the outputs AGREE; it does not show the predicates
// are the same predicate.  That was closed by reading the two side by side,
// term for term, not by this.  The repo's "an arm that passes because its
// condition never occurred", one level up: in the proof rather than the code.
//
// `ramp gaps bridged` is also a BOARD-side counter.  The run line's copy of the
// hold keeps no counters at all, so 69/9/10/0/50/1/43 verify the board half of
// the extraction and say nothing about cl_lines' half.
log_enable 1
log_dir "logs"
log_name p449base
developer 0
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0
set run_resume 0
sv_public 0
sv_port 27711
set lobby_dir ""
set hud_watch_skipidle 0
set hud_watch_path 1
set hud_watch_path_ahead 1
set hud_watch_path_color 0

wait 200
map surf_rookie
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 1000

echo ^5=== p449base r47 (33857 samples) ===
replay data/online/surf_rookie/main/08m26.580s_proto_r47.rec
waitms 2000
replay status
waitms 300

echo ^5=== p449base aesthetic r3 ===
replay data/online/surf_aesthetic/main/01m01.515s_player_r3.rec
replay status
waitms 300

echo ^5=== p449base aesthetic pb ===
replay data/runs/surf_aesthetic/main/0005191_pb.rec
replay status
waitms 300

echo ^5=== p449base beginner pb ===
replay data/runs/surf_beginner/main/0003828_pb.rec
replay status
waitms 300

echo ^5=== p449base 4am cheat ===
replay data/runs/surf_4am/main/cheat.rec
replay status
waitms 300

echo ^5=== p449base gigapede bonus_4 shadow (7 resume) ===
replay data/runs/surf_gigapede/bonus_4/0001250_shadow.rec
replay status
waitms 300

echo ^5=== p449base bhop_monster_jam cheat (58353 samples) ===
replay data/runs/bhop_monster_jam/main/cheat.rec
replay status
waitms 300

replay stop
waitms 300
quit
