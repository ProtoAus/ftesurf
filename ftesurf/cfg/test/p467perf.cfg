// P467PERF -- the milk menu's frame cost, uncapped.
// Launch: ftesurf64.exe +set milk_bootcheck 4 +set milk_quality <1|2|3> +set log_name <n> +exec test/p467perf.cfg
// Prints fps with the space on, then off; the difference is the milk.
cfg_save_auto 0
// Pin every milk cvar the shots depend on -- ftesurf.cfg archives the player's own.
set milk_menu 1
set milk_trails 1
set milk_react 1
set milk_menumusic auto
volume 0                    // the laptop owner is in the room; analysis taps pre-volume
log_enable 1
log_dir "logs"
developer 0
cl_idlefps 0
cl_maxfps 0
vid_wait 0
fs_missingwarn 0
con_notifylines 0
