// P467PERF -- the milk menu's frame cost, uncapped.
// Launch: ftesurf64.exe +set milk_bootcheck 4 +set milk_quality <1|2|3> +set log_name <n> +exec test/p467perf.cfg
// Prints fps with the space on, then off; the difference is the milk.
cfg_save_auto 0
// Pin every milk cvar the shots depend on -- ftesurf.cfg archives the player's own.
set milk_menu 1
set milk_trails 1
set milk_react 1
set milk_menumusic auto
// The worlds and panels (milk_world is left to the command line; put per-run
// overrides AFTER this exec, or it wins).
set milk_panels 1
set milk_sfx 1
// Keep the mix running if the window loses focus (a precaution for the audio
// analysis; music is at 0.02, so still a whisper).
set s_inactive 1
volume 0                    // the laptop owner is in the room; analysis taps pre-volume
log_enable 1
log_dir "logs"
developer 0
cl_idlefps 0
cl_maxfps 0
vid_wait 0
fs_missingwarn 0
con_notifylines 0
