cfg_save_auto 0
// BUILD 80 -- can a run be twelve hours long, and does the file still parse?
//
// TWO DEFECTS, ONE PATCH, AND NEITHER OF THEM IS NEW CODE.
//
//   1. FS_RECMAX was ONE cap for TWO recorders.  200,000 lines was costed at
//      66.67 Hz ("50 minutes", which is true, and is surf).  Measured on a real
//      100-tick file -- bhop_monster_jam/main/cheat.rec, 58,396 lines over
//      647.2s -- the rate is 90.2 lines/s, so it was THIRTY-SEVEN minutes.  A
//      bare line count is a duration over a rate; the rate moved and the
//      constant did not.  Build 80 splits it: FS_RECMAX_BUF (1,000,000, which
//      is bufstr_set's own refusal point and not a number we chose) and
//      FS_RECMAX_STREAM (8,640,000 = 12h * 3600 * 200/s).
//
//   2. EVERY tick-bearing record in the .rec used %g.  Six significant digits,
//      then exponent form -- so a run past 1,000,000 ticks (2.78 HOURS at
//      100 Hz) wrote `end 1.00001e+06 ...` and the time arrived ROUNDED.
//
// (2) IS BUILD 76'S OWN BUG, ONE CHANNEL OVER, AND ITS ESSAY SAYS SO WITHOUT
// MEANING TO.  sv_lobby.qc's note ends "Any field HERE that can reach seven
// digits has the same flaw" -- and `here` was the wire body.  The fix went to
// the submission and stopped.  Thirteen writers in sv_timer.qc, two in
// cl_replay.qc and one in cl_lobbytime.qc had the identical flaw and were not
// visited, because the thing that broke was a byte count so the repair was
// scoped to byte counts.
//
// WHAT THIS FILE CAN AND CANNOT FALSIFY, stated first because the honest answer
// is "less than you would like", and because that gap is the reason the bug
// shipped in the first place.
//
//   CANNOT: the caps.  A config cannot produce a run of 37 minutes, let alone
//   twelve hours -- the only finish a cfg can reach is a noclip flight, over in
//   seconds.  This is EXACTLY the b76 trap ("the harness was not wrong, it was
//   SMALLER THAN REALITY, and the boundary sat between the two"), and it is
//   why the standing instrument for (2) is in reccheck.py rather than here.
//
//   CANNOT: %d at seven digits, in game.  Same reason.  It is settled by
//   READING instead: FTE's PF_sprintf routes %d through
//   GETARG_SNUMERIC(qint64_t, ...) and an I64d/lld format (pr_bgcmd.c:7642),
//   i.e. a 64-bit integer path with no six-digit stage anywhere in it.  So the
//   float is the only limit, which is 2^24, which is what FS_RECMAX_STREAM is
//   sized against.  Recorded as a reading, not as a measurement.
//
//   CAN: that the WRITER still emits a well-formed file.  Sixteen format
//   strings changed; every one of them is on a path a real recording takes.  If
//   any is now wrong -- a stray %d on a float that is not integral, a lost
//   column -- reccheck.py, which is written from the GRAMMAR and not from the
//   writer, says so.  That is this file's whole job and it is worth doing,
//   because at these tick values %g and %d produce IDENTICAL OUTPUT: a passing
//   run here cannot distinguish the patch from its absence, and can only
//   distinguish a working writer from a broken one.
//
// PRE-REGISTERED:
//
//   A  A real streamed recording, driven to a finish on bhop_eazy.  MUST
//      produce a .rec that reccheck.py passes with 0 faults.  rec_stream 1 is
//      deliberate: the streamed path is the one whose cap changed, so this also
//      exercises the new `cap = rec_rec_stream ? ... : ...` branch in
//      SV_RecPut.  A fault here means one of the sixteen edits is wrong.
//
//   B  `cmd timer` before, during and after, as the b73hdr control that the run
//      really started and really finished rather than being armed and dropped.
//      zone_goto ARMS and does not start -- bhop_eazy starts on a JUMP -- and
//      SV_RecClose has exactly one call site, at the finish, so a run that
//      merely started writes NO FILE AT ALL.  A missing .rec is therefore the
//      same symptom as a broken writer, which is why this control exists.
//
// FALSIFIED IF: no .rec appears (arm B never finished, or the writer died), or
//      reccheck.py reports any fault on it.
//
// THE OTHER TWO ARMS ARE NOT IN THIS FILE because they are reader-side and run
// from a shell; they are recorded in the MEASURED block below with their
// controls, because a check that only ever passes has not been tested.

cfg_save_auto 0
log_enable 1
log_dir logs
log_name b80fmt
developer 0
sv_cheats 0

// `set`, not a bare assignment: these are registered in worldspawn, so before
// the first map load a bare `rec_stream 1` is Unknown command and the default
// silently stands.  Cost one attempt in b73hdr and produces a MISSING FILE,
// i.e. the same symptom arm A's failure would produce.
set rec_enable 1
set rec_stream 1
set rec_runarchive 1

waitms 6000
map bhop_eazy
waitmap 45
waitms 3000

echo ================================ B80FMT -- zones, so the flight is computed not guessed
zone_list
waitms 500

echo ================================ B80FMT ARM B -- armed, not started.  Expect no run.
cmd timer
waitms 1000

echo ================================ B80FMT -- arm, aim, and go continuous
cmd zone_goto 0
waitms 1000
setpos -352 -352 144 0 335.3 0
waitms 1000
noclip
waitms 500
+forward
waitms 1500

echo ================================ B80FMT ARM B -- running; a part file should exist NOW
cmd timer
waitms 500

// STOP SHORT OF THE END ZONE.  The first cut of this arm flew on for 3.5s and
// the run had already FINISHED by the time sl_save ran -- "save 2 (slot 002)
// no run" -- so the save wrote its ~30 fields (which was the point) but there
// was no run left to resume and the `resume` record never fired.  A passing
// arm that silently covered half of what it claimed.
-forward
waitms 800

echo ================================ B80FMT ARM C -- save MID-RUN.  Expect a run, not "no run".
cmd sl_save
waitms 1500
cmd sl_list
waitms 1000

echo ================================ B80FMT ARM C -- resume.  Expect a `resume` record in the .rec.
cmd sl_load
waitms 1500
cmd timer
waitms 1500

echo ================================ B80FMT -- fly on to the end zone
+forward
waitms 3000
cmd timer
waitms 2000
-forward
waitms 1500

echo ================================ B80FMT ARM B -- after the end zone.  Expect FINISHED.
cmd timer
waitms 2500

echo ================================ B80FMT done
waitms 500
quit

// ============================================================================
// MEASURED 2026-09-14, three runs on bhop_eazy, QC build 80.
//
// ARM A -- THE WRITER STILL PRODUCES A WELL-FORMED FILE.
//
//     timer: streamed data/runs/bhop_eazy/main/cheat.rec (442 samples, 166 padding)
//     ok   cheat.rec
//     ok   cheat.view
//     1 file(s) checked, 0 with faults
//
// `streamed` is the control that this took the path whose cap changed, so the
// new `cap = rec_rec_stream ? FS_RECMAX_STREAM : FS_RECMAX_BUF` branch in
// SV_RecPut ran.  The sidecar passing covers the two cl_replay.qc edits, which
// only exist because this was a listen server -- on a lobby the client writes
// no .view at all (Rec_ServerIsRemote, build 66).  The trailer reads
//
//     end 292 442 166 0
//
// ARM C -- THE SAVE-STATE WRITER, ~30 FIELDS, AND IT CAUGHT ITSELF FIRST.
// The first attempt flew on for 3.5s before saving and the run had already
// FINISHED: `save 2 (slot 002)  no run`.  The save still wrote its fields, so
// the arm PASSED while covering half of what it claimed -- the `resume` record
// it was also there for could not fire, because there was no run to resume.
// Fixed by stopping short of the end zone; the second attempt reads
//
//     save 3 (slot 003)  0:02.640
//     save 3 -- run resumed at 0:02.640, 0 checkpoint(s), shadow run
//
// THE FOUR NEGATIVE SENTINELS ARE THE READING THAT MATTERS in state.txt:
//
//     ticks 292      pb 4976      recsamples 442      recpad 166
//     azone -1       evzone -1    cpzone -1           pendarm -1
//     elapsed 0.000000            clock counted
//
// %d on a negative float is the one way this change could have broken the save
// path SILENTLY -- a mangled -1 restores as a real zone index rather than "no
// zone", so the run would resume into a wrong state rather than fail visibly.
// It prints -1.  `elapsed` keeps %.6f and `clock` keeps %s, untouched.
//
// WHAT WAS NOT EXERCISED IN A WRITTEN FILE, AND WHY -- stated because an arm
// that passes is not the same as a line that ran:
//
//     resume  retry  cp  stage  stagestart  restart  split  ghost  board
//
// A noclip flight crosses no checkpoint and boards no ramp, so six of those
// have no trigger here at all.  `resume`/`retry` DID execute in memory (the
// log above proves the resume happened) but the resumed shadow run never
// reached the end zone, and SV_RecClose has exactly ONE call site -- at the
// finish -- so nothing was written and data/parts/ was empty afterwards.
//
// They are covered three other ways instead, none of which is a substitute for
// running them and all of which are stated as what they are:
//
//   1. PRESENT IN THE COMPILED PROGS.  All sixteen rewritten format strings
//      grep out of qwprogs.dat/csprogs.dat, and `resume %g %g`, `retry %g`,
//      `end %g`, `split %g`, `cp %g`, `ghost %g` are ABSENT from every record
//      writer -- so the edits landed and compiled, and none was half-applied.
//   2. INTEGRAL BY CONSTRUCTION.  Every converted value is a tick count, a
//      sample/line/frame counter or a segment index; run_t_delta is the one
//      that can be negative (ticks - pb) and arm C proves negatives print.
//      Nothing fractional was converted: tickrate and movetickrate keep %g
//      deliberately, and they are the reason the rule is "counts become %d,
//      rates stay %g" rather than "replace every %g".
//   3. reccheck.py's EXP_RE is the STANDING instrument, and it is the only one
//      of the three that will still be watching next year.
//
// READER-SIDE ARMS, run from a shell, recorded here with their controls because
// a check that has only ever passed has not been tested:
//
//   CONTROL   reccheck.py at HEAD, 376 files ....... 66 with faults
//   SUBJECT   reccheck.py + EXP_RE, same files ..... 66 with faults
//             -- identical, so the new check costs nothing on real data
//   FALSIFIER 0004976_pb.rec, untouched ............ ok, 0 faults
//             same file, trailer rewritten as a pre-80 writer would have
//             emitted it had the run been long enough:
//                 end 4976 5137 169 0   ->   end 4.97612e+06 5.159e+06 169 0
//             ............................... 1 fault, both tokens named
//
// The falsifier also shows the SIDEWAYS catch this replaces: the old grammar
// additionally faulted "'end' says 5159000 samples, the file has 5137" -- the
// right file, the wrong field, a different threshold, and no mention of the
// actual defect.
//
// NOT MEASURED, AND NOT MEASURABLE FROM A CONFIG: the caps themselves.  200,000
// lines is 37 minutes at this map's rate and 8,640,000 is twelve hours; the
// only finish a cfg can reach is a noclip flight of a few seconds.  That gap is
// not incidental -- it is the same gap that let the %g defect ship in build 76
// ("the harness was not wrong, it was SMALLER THAN REALITY"), and it is why the
// cap's own argument is written as arithmetic in sv_timer.qc against measured
// rates rather than as a test here.
// ============================================================================
