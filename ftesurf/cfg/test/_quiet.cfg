// Shared preamble for scripted client tests.  Keep the window small, out of the
// way, and showing something that is obviously a test rather than something that
// looks like the game is broken.
//
// WHY THERE IS A WINDOW AT ALL.  A scripted test still needs a REAL renderer:
// connecting, loading a BSP and running CSQC all require one, and CSQC_Init
// refuses to start when qrenderer == QR_NONE -- so a headless run cannot test
// the things these tests test.  Server-side tests (surfd, the Steam resolver)
// use fteqwsv64.exe and open no window at all.
//
// WHY THE STOCK FTEQW MENU USED TO APPEAR ("join server / options / updates /
// mods / quit").  FTE loads menuQC LAZILY -- menu.dat is initialised the first
// time a menu is actually needed.  A test config connects immediately and never
// opens one, so menu.dat stayed uninitialised for the whole run and the engine's
// own built-in menu was what sat on screen behind the loading plaque.  Verified
// in the p283 log: "Initializing menu.dat" is at line 610 of 1145, at `quit`,
// while the connect was at line 138.
//
// It was never a fault in the game -- a player opens the menu, which loads it --
// but it looks exactly like FTESurf failing to start.  So force it up front.
//
// BUILD 55: THIS LINE DOES NOT ACHIEVE THAT, at least not from here, and the
// paragraph above describes the intent rather than the behaviour.  Measured
// twice (logs/b55b.log) with a config that loads NO map and then waits: with
// this preamble exec'd, "Initializing menu.dat" still lands at `quit`, after
// the screenshot, and the picture is still the engine's built-in menu.  Adding
// a SECOND menu_restart later in the run -- after the filesystem is fully up,
// followed by `togglemenu 1` and ten more seconds -- did not change it either.
//
// Consequences for anyone trying to photograph the FTESurf menu:
//   * a scripted run cannot currently do it, and a picture of the stock FTE
//     menu ("Join server / Options / Updates / Mods / Quit") is the EXPECTED
//     result, not a regression in menu.dat;
//   * screenshot_mega cannot capture a menu at all -- it re-renders the 3D
//     scene and with no map there is none, so it logs "Unable to capture
//     screenshot" and writes no file.  Use plain `screenshot`, which grabs the
//     framebuffer and (since build 21) still honours scr_sshot_prefix.
//
// Left in place rather than removed: it is harmless, and whatever it was meant
// to do is still worth doing if someone finds the right incantation.
menu_restart

// ALSO LAUNCH WITH -WindowStyle Minimized so the window never takes focus.
set vid_fullscreen 0
set vid_width  640
set vid_height 480

// `wait n` counts FRAMES, and ftesurf.cfg sets cl_maxfps 0 -- uncapped, every
// wait in a test config would mean something different on a different machine.
set cl_maxfps  100

// AND RUN FROM C:\FTESurf.  FTE takes basedir from the process CWD, not from the
// exe's directory (sys_win.c:4787-4798 -- ftesurf.bat cd's for exactly this).
// A Start-Process without a WorkingDirectory silently gets the wrong basedir:
// no gamedir, no log, no screenshot, and an exit code of 0 saying it all went
// fine.  That cost one confusing test run before it was noticed.
