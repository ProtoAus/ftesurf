// ===========================================================================
//  P477REWIND -- Patch 477: rewind along your own run, resume or save there.
//    python tools/p477rewind.py     (parks data/saves/surf_dune, runs this,
//                                    grades the log and the saves it made,
//                                    then restores the park)
//
//  PRE-REGISTERED
//   R1  a run on the clock before anything else (`cmd timer`).
//   R2  on a clean run the first `rewind` only asks (still closed, the ask
//       line printed); the second opens at the head (cursor n-1 of n).
//   R3  `rewind save` at 1.0 s: the SERVER answers with a save "at" a time and
//       a speed over 50 u/s; its state.txt is the demoted shape with
//       `rewound 1`, `velocity 0 0 0` (what an older build reads) and the speed
//       in `rwvel`, origin near the cursor.
//   R4  `rewind go` at 1.5 s, walking speed (~260, sv_maxspeed 260): after the
//       countdown the body is moving (the speed came back out of `rwvel`), the
//       server says "no faster than a walk or a jump" and `cmd timer` says
//       hopped 0.
//   R4C `rewind` again opens at that resume (resume 1); `rewind go` at 1.0 s,
//       505 u/s: "practice from here" and hopped 1.
//   R4B round 1's laundering chain at 505 u/s: release the go's hold and save
//       in one packet (a plain idle save with the speed), forgive with `!r`,
//       load it: "it carries speed" and hopped 1 again.
//   R5  `say !r` forgives it: the forgiveness line, then hopped 0.
//   R5B armed in the box: `rewind` opens without asking, at the last resume's
//       cursor (resume 1); `rewind` closes it; `cmd timer` reads practice 0 --
//       the pin did not taint the armed timer.
//   R5C round 3: a save taken at rest in the box (save 4); `sl_goto 1`, R3's
//       505 u/s rewind row, tags (hopped 1); `sl_goto 4` back at rest forgives
//       it ("the hopped start is forgiven", hopped 0).
//   R6  `sl_saveat` far past the run is refused with "nothing kept".
//   R7  a run of 2:10 that starts CLEAN (R5B left no taint) -- past the ring's
//       two minutes.  `rewind seek 1.0` reads kept 0; `rewind go` there is
//       refused by the server ("nothing kept"), and the mode is still browsing
//       with the body where it was pinned, no load, no "practice from here".
//   R8  the ring has wrapped: `rewind seek -20` reads kept 1 and `rewind save`
//       answers within a second of the cursor's time with a rewound state.txt
//       near it.  Then `rewind` on a run that was on the clock resumes at the
//       head (a load, "rewind: resumed") and replaces R4B's resume row: the
//       list ends at 5 saves (8 with no replacing).
//   R9  a load that winds a running clock back starts the live line over, so
//       its FIRST point is one the server's ring holds: `trail` reads fewer
//       samples after the load, and `rewind save` at `seek 0` is answered AT
//       the cursor (under 64 u).
//   R10 `say !r` while browsing: the mode closes by itself (on 0), the body is
//       at the start box, and nothing resumes it back mid-map.
//   R11 the pin's freeze does not outlive a respawn (review round 2): pin a
//       running run with a typed `cmd rec_watch 1`, `kill` (which respawns at
//       a random spawn, so `!r` back to the box -- it voids, it does not
//       thaw), run again -- the new run is clean, its clock moves (over 1 s)
//       and no freeze is wanted.
//       Before: the freeze request stopped the new clean run's clock while the
//       body ran, and the shortened time ranked.
//   R12 round 5: a RUNNING save taken at ~400 u/s, `!r`, then loaded -- NOT
//       tagged (no "it carries speed", hopped 0).  Round 3 tagged it, and on
//       bhop-mode maps nothing then forgave honest save-state practice.
//   R13 round 6: a warp the server serves while the rewind holds a running
//       run -- `setpos` to mid-slope, OUTSIDE the start box (round 4's target
//       was inside it, which cancelled the run and tested the wrong check) --
//       ends the frozen run there ("moved while the rewind held it"), and the
//       client sees the run stop and closes the mode (on 1, then 0).
//   R13B round 8: a warp that starts no run keeps the ring, as a finish does
//       (round 7 wiped it, and a browse that stayed open refused every point):
//       reopened on R13's kept line, `rewind go` at its head resumes.  Round
//       10: a replay asked for during that countdown (an imported surf_dune
//       .rec) is refused ("wait for the rewind's resume first") -- opened, it
//       ran over a body the server was not pinning.
//   R14 round 5: `s` pressed, then repeated, then released through the same
//       handle: one save, not two (the engine hands CSQC every repeat).  On a
//       fresh run of its own since round 7 (R13's warp took the ring).
//   R15 round 7: a warp that is refused (`zone_goto 99`) ends nothing: still
//       browsing, the run still on the clock, no "moved while...".
//   R16 round 7: a load typed under the pin (`cmd sl_goto 1`) is refused by the
//       server ("close the replay or rewind first"); still browsing.
//   R17 round 7: an S save while browsing a recording run writes no .view
//       prefix for its slot (no run.view in its folder), where R12's plain
//       running save did write one -- and, round 8, no segment column either
//       (no seq.txt; R12's has one).
//   R17B round 11: a replay opened while browsing a timed run takes the pin
//       over in the same frame -- `replay <file>; rewind go` on one line: the
//       replay opens, the go never leaves (no "rewind: resumed"), and the
//       handover's void ends the run.  Before, the go ran under the open replay
//       and released the body when its countdown ended.
//   R18 round 7: a replay's pin (`cmd rec_watch 1`, no `rw`) keeps its frozen
//       run through a warp, as before 477: `setpos`, and the timer still runs.
//   R18C round 9: a plain `cmd rec_watch 0` (the console way out) under the
//       rewind's pin ends the frozen run as `void` does; the mode closes.
//   R18D round 9: the same typed release of a rewind opened IDLE ends nothing
//       but frees the body -- the client sees the pin go (STAT_FS_PIN) and
//       closes the mode (on 1, then 0).  Round 16: the stat reads -serial
//       after the release, not 0, so a pin let go inside one snapshot is seen.
//   R18J rounds 17-18, through the whole input chain (`vote key`): with a
//       chat draft open, ENTER is the draft's, and its repeat into the open
//       rewind is no go; and a scrub whose release the draft swallowed stops
//       -- from 0.6 s back, the cursor stays within 15 points of the seek and
//       reads the same 600 ms apart (a stuck scrub runs ~90 points in its
//       first 0.7 s, to 0).
//   R13C round 18: ENTER in R13B's countdown is kept from `bind enter say`
//       (`took 1`), which would open a draft over the release.
//   R13D rounds 19-20: `4` in the countdown deletes nothing (the save count
//       the `vote key` lines print is the same 600 ms later) -- it fell to the
//       save-lock keys and deleted the resume row.  (`1` could not tell: the
//       server refuses a save under the countdown's hold.)
//   R13E round 20: S bound to `sl_del` in the countdown is taken (`took 1`);
//       the mode's own keys passed to their binds there.
//   R18K round 19: ESC's repeat after the rewind it closed is still taken
//       (`took 1`) -- it reached the engine's own ESC, the menu.
//   R18L round 19: S bound to a saveloc alias (`bind s mom_saveloc_create`) is
//       still the rewind's save -- the save-lock bind block swallowed it.
//   R18M round 21: `sl_del` typed (as a bind or an alias of it runs) while the
//       rewind is up deletes nothing, and the client says why; and `4` held
//       across the rewind's close stays swallowed -- its repeat after the
//       close deleted a save (the count, the same at all three reads).  Round
//       22: the mode reads closed (on 0) before that repeat.
//   R22A round 22: a key reporting scancode 0 (the ISO `<>` key, a dead key)
//       tapped in a countdown ends nothing -- 0 is the countdown hold's "no
//       key", and the tap let the body go mid-count.
//   R22B round 22: `4` held in that countdown stays swallowed once it ends,
//       the key-0 release between notwithstanding -- 0 was the swallowed-key
//       table's empty slot, so that release emptied the table.
//   R22C round 22: `1` pressed while browsing, its release taken by a chat
//       draft: after the close, the next `1` saves -- the table kept `1` and
//       swallowed that press.
//   R22D round 22: a fast idle load (R3's rewind row) leaves its tag forgivable
//       at rest; a fast load of the hop chain's own running save then raises a
//       chain's tag, which drops that forgiveness -- rest in the box leaves
//       hopped 1 (it lifted the chain's tag).  The save is taken 0.75 s into
//       the run, on the ramp: by 1.8 s the body is on the flat at 41 u/s, too
//       slow for any load to raise (measured: the arm could not grade).
//   R22E round 23: R22D's control -- the same rest after only the idle load
//       forgives (hopped 0, "the hopped start died with that run"), so the
//       rest test runs at that spot and R22D's hopped 1 is the row's doing.
//   R23A rounds 23-24: with a chat draft open, the release of a key held into it
//       is passed (`took 0`: the engine runs its stored release), and a key
//       pressed while typing is the draft's, its release too (`took 1`).
//   R23B round 23: `rec_savelock 0` lets go only of a key's hold -- a
//       `+sl_hold` hold survives another key's press (holding 1), and its own
//       `-sl_hold` still lets go.
//   R23C round 23: `sl_save` under the replay pin is refused (older than 477:
//       its row read at rest wherever the body hung).
//   R24A round 24: the save-lock's `2` (a load and hold) held into a chat draft
//       is let go by its own release -- the draft passed only `+` binds, and the
//       player stayed held and view-locked.  Graded on the client's and the
//       server's hold.
//   R24B round 24: a save-lock key the rewind swallows says why, once a press
//       (round 25: on the press, not the repeat).
//   R25A round 25: `2` held into a chat draft that its OS repeat then reaches is
//       still let go by its own release -- round 24's draft recorded the repeat
//       as its own press and swallowed the release.
//   R25B round 25: with `bind enter messagemode`, ENTER in the rewind is the
//       rewind's go, not a draft.
//   R18E round 9: a hop chain's tag (`+jump` held in the box) is `!r`'s alone:
//       a fast idle load after it (row 1, R3's rewind row: "practice from
//       here"), then a setpos back into the box and rest, leaves hopped 1.
//   R18F round 12: a rewind pin asked from a state that is not RUNNING
//       (`cmd rec_watch 1 rw 99 0`, as a client a round trip behind its run's
//       start sends) on a run that IS running is refused ("the run changed
//       since you asked");
//       the run stays clean and on the clock -- before, it was frozen into
//       practice and then voided by the client's close.
//   R18G round 13: the same pin asked from RUNNING but at more ticks than the
//       run now has (`cmd rec_watch 1 rw 98 2 99999` -- the shape of a stage
//       chain or a finish into the box starting the next run inside the round
//       trip) is refused too; the run stays clean.
//   R18H round 14: the same pin with a save/load count other than the run's
//       (`cmd rec_watch 1 rw 97 2 0 99999` -- a later save loaded in the round
//       trip has MORE ticks, so only the event count tells) is refused too.
//   R18I round 15: a resume with no rewind pin (`cmd sl_saveat 100 0 0 0 go` on
//       R18F's unpinned run, as one sent behind a refused pin) is refused ("not
//       rewinding"), and the run stays on the clock -- it used to load a sample
//       of whatever run the ring held and end it.
//   R15 round 14: the browsed run's record counts show the pin's `warp` (the
//       velocity zero, so a replay flies the pinned packet from rest).  Round
//       16 writes it only when the pin zeroes something; R14's lands on a body
//       sliding down the start ramp (517 u/s a moment before).
//   R18W round 16: R18's replay pin lands on a sliding body (a warp); let go and
//       taken again in one packet, the body the release zeroed writes none: one
//       warp in the run, where a pin blind to the state writes two.
//   R18B round 8: `retry` while rewinding a running run ends it first ("retry
//       during a rewind"), and the restart says what it restored: "back where
//       you were", never "run restored" (round 9: graded on that line, which
//       the timer read raced -- the restore comes at the spawn).  An idle save
//       after it writes no run.view (round 9: the idle restore loads no
//       sidecar).  And the open is at the head (resume 0): R14's run, two lines
//       back in the same trail slot with the same sample count, read as the
//       line last resumed from until lines were told apart by tr_gen.
//   R19 round 7, surf_embrace: a pinned body inside a repeating basevelocity
//       trigger (trigger_multiple, OnTrigger, every 0.2 s) gains no speed --
//       the trigger fires on it ("basevel: SET", run_bv_debug) and the body
//       reads under 1 u/s pinned and just after the release.
//  CONTROL: a csprogs/qwprogs without Patch 477 answers `Unknown command` to
//  `rewind` and `sl_saveat` does nothing, so R2-R10 fail; R11 then reads a
