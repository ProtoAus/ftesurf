// ===========================================================================
//  P477REWIND -- Patch 477: rewind along your own run, resume or save there.
//    python tools/p477rewind.py     (parks data/saves/surf_dune, runs this,
//                                    grades the log and the saves it made,
//                                    then restores the park)
//
//  PRE-REGISTERED
//   R1  a run on the clock before anything else (`cmd timer`).
//   R2  on a clean run the first `rewind` only asks (still closed, the ask
//       line printed); the second opens at the head (cursor n-1 of n).
//   R3  `rewind save` at 1.0 s: the SERVER answers with a save "at" a time and
//       a speed over 50 u/s, and that save's state.txt is the demoted shape
//       with `rewound 1`, a non-zero velocity and an origin near the cursor.
//   R4  `rewind go` at 1.5 s: after the countdown the body is moving at over
//       50 u/s (the save's speed came back) and `cmd timer` says hopped 1.
//   R5  `say !r` forgives it: the forgiveness line, then hopped 0.
//   R6  `sl_saveat` far past the run is refused with "nothing kept".
//   R7  a run of 2:10 -- past the ring's two minutes.  `rewind seek 1.0` reads
//       kept 0; `rewind go` there is refused by the server ("nothing kept"),
//       and the mode is still browsing with the body where it was pinned, no
//       load and no "practice from here".
//   R8  the ring has wrapped: `rewind seek -20` reads kept 1, `rewind save`
//       answers with a time within a second of the cursor's and a rewound
//       state.txt near it; `rewind` then closes the mode.
//  CONTROL: a csprogs/qwprogs without Patch 477 answers `Unknown command` to
//  `rewind` and `sl_saveat` does nothing, so R2-R8 fail.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p477rewind
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
set run_resume 0
waitms 5000
map surf_dune
waitmap 60
waitms 8000
menu_restart
ui_close
waitms 1500
set hud_trail 1

echo ==== P477 R1 ====
say !m
waitms 3000
+forward
waitms 3000
-forward
waitms 800
cmd timer
waitms 800

echo ==== P477 R2 ====
rewind
waitms 300
rewind status
waitms 300
rewind
waitms 1500
rewind status
waitms 400
screenshot p477_rewind
waitms 600

echo ==== P477 R3 ====
rewind seek 1.0
waitms 400
rewind status
waitms 300
rewind save
waitms 1500

echo ==== P477 R4 ====
rewind seek 1.5
waitms 400
rewind status
waitms 300
rewind go
waitms 2900
cmd viewpos
waitms 100
cmd viewpos
waitms 100
cmd viewpos
waitms 100
cmd viewpos
waitms 100
cmd viewpos
waitms 100
cmd viewpos
waitms 1200
cmd timer
waitms 800

echo ==== P477 R5 ====
say !r
waitms 2500
cmd timer
waitms 800

echo ==== P477 R6 ====
cmd sl_saveat 999999
waitms 1200

echo ==== P477 R7 ====
+forward
waitms 3000
-forward
waitms 127000
cmd timer
waitms 400
rewind
waitms 300
rewind
waitms 1500
rewind status
waitms 300
rewind seek 1.0
waitms 300
rewind status
waitms 300
cmd viewpos
waitms 300
rewind go
waitms 2000
rewind status
waitms 300
cmd viewpos
waitms 300

echo ==== P477 R8 ====
rewind seek -20
waitms 300
rewind status
waitms 300
rewind save
waitms 1500
rewind
waitms 1000
rewind status
waitms 300

echo ==== P477 END ====
quit
