// BUILD 88 capture: b82input.cfg's route (jump start, duck, speed, then a noclip
// flight into bhop_eazy's END), re-run on QC build 88 + engine 349 to produce
// the first FINISHED v9 recording with a `zseed`.  Noclip taints it, which is
// fine: this file exists to exercise pm_verify, not to rank.  It lands as
// data/runs/bhop_eazy/main/cheat.rec; the harness driver copies it to
// data/b88fin.rec and restores the previous cheat.rec.
cfg_save_auto 0

cfg_save_auto 0
log_enable 1
log_dir logs
log_name b352fin
developer 0
sv_cheats 0

set rec_enable 1
set rec_stream 1
set rec_runarchive 1

in_speedbutton 1

waitms 6000
map bhop_eazy
waitmap 45
waitms 3000

echo ================================ B88FIN ARM B -- armed, not started.  Expect no run.
cmd timer
waitms 1000

echo ================================ B88FIN -- arm, aim, go
cmd zone_goto 0
waitms 1000
setpos -352 -352 144 0 335.3 0
waitms 1000

echo ================================ B88FIN ARM C -- jump.  Starts the run AND sets bit 1.
+jump
waitms 700
-jump
waitms 300
cmd timer

echo ================================ B88FIN ARM C -- duck, bit 2
+duck
waitms 700
-duck
waitms 300

echo ================================ B88FIN ARM C -- speed, bit 4 (needs in_speedbutton 1)
+speed
waitms 700
-speed
waitms 300

echo ================================ B88FIN -- fly
noclip
waitms 500
+forward
waitms 1500

echo ================================ B88FIN ARM B -- running; a part file should exist NOW
cmd timer
waitms 500

waitms 2900
cmd timer
waitms 2000
-forward
waitms 1500

echo ================================ B88FIN ARM B -- after the end zone.  Expect FINISHED.
cmd timer
waitms 2500

echo ================================ B88FIN done
waitms 500
quit

