// Patch 670: dedicated surf_deoa, fresh NORMAL player, cheats allowed.
// Run only in an owned test overlay: this deliberately warps the test body.
// OFF must act: repeated 6-unit corrections prove the server pushes.
// ON must act: same displacement, no sustained 6-unit train after entry.
// Transitions/setpos can still correct; silence alone is not a pass.
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
cl_netfps 66.6667
cl_prederror 0.25
cl_predict_timenudge 0
cl_delay_packets 0
cl_trigdebug 0
menu_restart
ui_close
trig_dump
cl_triggers 0
echo P670-OFF-BEGIN
cmd setpos 6180 -1444 -668 0 0 0
waitms 900
cmd viewpos
echo P670-OFF-END
waitms 2200
cl_triggers 1
echo P670-ON-BEGIN
cmd setpos 6180 -1444 -668 0 0 0
waitms 900
cmd viewpos
echo P670-ON-END
waitms 2200
noclip
waitms 300
echo P670-NOCLIP-BEGIN
cmd setpos 6100 -1444 -668 0 0 0
waitms 300
+forward
waitms 700
-forward
cmd viewpos
echo P670-NOCLIP-END
