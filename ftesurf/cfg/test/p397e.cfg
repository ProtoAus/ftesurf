cfg_save_auto 0
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0
menu_restart
waitms 1500
connect 127.0.0.1:27666
waitms 25000
echo ^5=== p397e block 1 begin
status
waitms 1500
echo ^5=== p397e block 1 end
disconnect
waitms 1000
set sv_public 0
set sv_port 27667
set run_resume 0
map surf_aircontrol
waitms 15000
echo ^5=== p397e block 2 begin
status
waitms 1000
echo ^5=== p397e block 2 end
waitms 500
quit
