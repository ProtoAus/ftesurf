// TINT08 -- Patch 239, Stage B: the VTF loader used to return a texture made of
// nothing, silently, for 808 texture instances across 112 of the 1310 maps.
//
// MECHANISM (verified by reading, then measured):
//   an IMAGE_FORMAT the loader did not map returned PTI_INVALID; PTI_INVALID's
//   block size is 0 bytes; every mip then computed datasize 0 and the loader
//   handed back a NON-NULL texture containing nothing.  Downstream that became
//   TEX_FAILED with no console message from anywhere, so the surface drew as
//   the missing-texture placeholder and the log said nothing at all.
//
// WHAT CHANGED
//   ABGR8888 (419 instances)  -> PTI_RGBA8, bytes reversed in place
//   Strata BC7, id 70 (182)   -> PTI_BC7_RGBA
//   Strata BC6H, id 71 (193)  -> PTI_BC6_RGB_UFLOAT
//   the remaining 14 instances-> a NAMED ERROR instead of silence
//   DXT1 + TEXTUREFLAGS_ONEBITALPHA -> PTI_BC1_RGBA (2 instances, 0 pixels)
//   the 7.3+ resource table now read at +80, not +72 (measured: 3807/3807 files)
//
// TEST MAPS, chosen because the census says exactly what is in them:
//   surf_jumble    73 ABGR8888, and NOTHING else unhandled -> pure ABGR test
//   surf_epiphany  68 BC6H,     and nothing else            -> pure BC6H test
//   surf_frost     17 ABGR8888 + 17 BC7                     -> both at once
//   bhop_arcane    14 BC6H -- the standing regression map, which must still work
//
// EXPECTED: [texdiag] lines showing fmt=1/70/71 resolving to a real pti, and
// ZERO "unsupported VTF image format" lines on these four maps.

log_enable 1
log_dir "logs"
log_name "tint08"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
sv_cheats 1
r_texdiag 1

wait 200
echo ^5=== tint08: Patch 239 VTF loader ===

echo ^5======================= surf_jumble: 73x ABGR8888 =======================
map surf_jumble
waitmap 1800
waitms 4000
noclip
waitms 300
screenshot tint08_jumble
waitms 1200

echo ^5======================= surf_epiphany: 68x BC6H ========================
map surf_epiphany
waitmap 1800
waitms 4000
noclip
waitms 300
screenshot tint08_epiphany
waitms 1200

echo ^5=================== surf_frost: 17x ABGR8888 + 17x BC7 =================
map surf_frost
waitmap 1800
waitms 4000
noclip
waitms 300
screenshot tint08_frost
waitms 1200

echo ^5============ bhop_arcane: 14x BC6H -- the regression control ===========
map bhop_arcane
waitmap 1800
waitms 4000
noclip
waitms 300
screenshot tint08_arcane
waitms 1200

echo ^5=== tint08 done ===
wait 30
quit
