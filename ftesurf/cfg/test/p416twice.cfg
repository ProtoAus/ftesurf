//     journal named a number belonging to a recording that had already been
//     written and archived.
//     Kept as data/p416/twice_C.hid.
//
//   The two builds differ in cl_replay.qc only.  What removed it was not moving
//   the note -- the final build writes one in Rec_HidBegin again -- but
//   CLEARING THE HELD NONCE at the run-end edge, so the value present when a
//   journal opens can only be that journal's run.
