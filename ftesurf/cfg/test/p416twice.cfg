// Patch 416 -- TWO RUNS IN ONE MAP SESSION.  The arm the first cut did not have,
// and the one that found a real defect.
//
// p416nonce.cfg runs once per map load, which is the only case where the
// client's held nonce is empty when the journal opens.  Three independent
// reviews pointed at the same line: the engine runs Cbuf_Execute BEFORE
// CL_ReadPackets (cl_main.c:7607 against :7639/:7705) and before CSQC_UpdateView
// (:7743), so a stuffcmd parsed this frame is executed in the NEXT frame's
// command buffer -- after Rec_HidBegin has run.  A note written there could
// therefore only ever carry the value the client was ALREADY holding: nothing on
// the first run of a map, and the PREVIOUS RUN'S NUMBER on every run after it.
//
// The fix moves the note to Rec_Nonce, which runs one Cbuf pass later with the
// journal open, and clears the held nonce at the run-end edge.  This arm is what
// says so.
//
// Run from C:\FTESurf:
//   ./ftesurf64.exe -WindowStyle Minimized +exec cfg/test/p416twice.cfg
// then:
//   grep -c "nonce" ftesurf/data/p416_T2.hid
//   grep -n "nonce" ftesurf/data/p416_T2.hid
//   grep -n "^nonce \|^flags" ftesurf/data/runs/bhop_eazy/main/cheat.rec
//
// PRE-REGISTERED PREDICTIONS
//  T1  run 2's journal carries EXACTLY ONE `nonce` note.
//  T2  that note equals run 2's own header nonce -- the `nonce` line of the
//      cheat.rec this arm leaves behind, which run 2 overwrote run 1's with.
//  T3  run 2's file carries TF_NONCE (bit 131072) in `flags`: the second run
//      was issued and answered its own number, not the first run's.
//  CONTROL, run separately with the pre-fix cl_replay.qc built back in (the
//      copy this session kept): run 2's journal carries TWO notes and the FIRST
//      is not the header's.  If the control shows one note, this arm measured
//      nothing and the defect was never real.
// FALSIFIED IF the subject shows two notes, or the note disagrees with the
//   header, or the control shows one.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p416twice
developer 0
cl_idlefps 0
cl_maxfps 100
sv_cheats 0

set rec_enable 1
set rec_stream 0
set rec_runarchive 1
set rec_hid 1

in_speedbutton 1

waitms 6000
map bhop_eazy
waitmap 45
waitms 3000

echo ================================ P416 T -- run 1: aim and start
cmd zone_goto 0
waitms 1000
setpos -352 -352 144 0 335.3 0
waitms 1000
+jump
waitms 700
-jump
waitms 1500

echo ================================ P416 T -- run 1: fly to the end zone
noclip
waitms 500
+forward
waitms 1500
waitms 2900
waitms 2000
-forward
waitms 1500
cmd timer
waitms 2000

echo ================================ P416 T -- run 1 finished; back to the start
noclip
waitms 500
cmd zone_goto 0
waitms 1500
setpos -352 -352 144 0 335.3 0
waitms 1500

echo ================================ P416 T -- run 2: start
+jump
waitms 700
-jump
waitms 2500
cmd timer

echo ================================ P416 T -- freeze RUN TWO's journal
in_journal_end data/p416_T2.hid
waitms 1200

echo ================================ P416 T -- run 2: fly to the end zone
noclip
waitms 500
+forward
waitms 1500
waitms 2900
waitms 2000
-forward
waitms 1500
cmd timer
waitms 2500

echo ================================ P416 T done
waitms 500
quit

