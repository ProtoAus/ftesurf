// H2 floor -- does the doorway still have a floor?
//
// Patch 212 doubled the aperture from 88 to 176, which also doubled the portal's
// collision box, which is what PM_PortalCSG derives its carve window from.  The
// window's BOTTOM plane sits at `door_z - halfheight - 36` (Patch 206 tests the
// side planes against the player box's centre, and the standing hull is
// (-16,-16,0)..(16,16,72)).  On portal_hub_exit at z 184 that moved:
//
//     before:  184 - 44 - 36 = 104   -- ABOVE the doorway floor at z 96
//     after:   184 - 88 - 36 =  60   -- 36 units BELOW it
//
// The floor height is measured, not assumed: the pre-fix band run logged
// PM_PortalCSGReport's `below it` edge 58 times, every one at exactly 8.0 units,
// i.e. feet at 96 against a plane at 104.
//
// So a downward ground trace at the doorway began ending INSIDE the window,
// crossing none of the six planes -- hitplane -1, bestfrac 1 -- and the old code
// set fraction = 1 anyway, deleting the floor.  Patch 213 gates the elongation on
// hitplane == 1 (a real crossing) while leaving the startsolid/allsolid clear
// alone, because that half is the actual contract.
//
// HOW THIS MEASURES IT.  There is no viewpos/showpos command in this engine, so
// the readout is optical and that is fine, because the effect is enormous: at
// 1280x720 the focal length is 480.7 px, and a 36-unit eye drop against the wall
// ~10 units ahead moves everything in frame by far more than a pixel.  Stand
// still in the doorway for three and a half seconds -- long enough to fall if the
// floor is gone -- and shoot.  Run the same cfg on ftesurf64.exe (old) and
// ftesurf64_p213.exe (new) and diff the pairs.
//
// The control arm is the point of the thing: at y -640 the player is 120 units in
// front of the plane, outside the carve window entirely, so that shot MUST be
// identical between the two builds.  If the control moves, the test is measuring
// something other than the carve and nothing else here can be believed.

cfg_save_auto 0
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "h2_floor"
scr_sshot_type png
cl_yieldcpu 0
cl_maxfps 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0
r_voidvis 1
vbsp_portal_render 1

waitms 2500
map surf_kitsune
waitmap 240
waitms 8000
sv_cheats 1

// ---------------------------------------------------------------- control
// 120 units in front of the plane: outside the window, must not move.
echo "@@@ H2F control -- 120 units out, outside the carve window"
setpos 0 -640 184 0 90 0
waitms 3500
screenshot_mega h2f_control 1280 720
waitms 600

// ---------------------------------------------------------------- in the doorway
// y -530 is 10 units in front of the plane at -520, i.e. inside the window
// (which spans roughly -536.1 .. -519.9 for a 16-deep player box).

echo "@@@ H2F doorway x0"
setpos 0 -530 184 0 90 0
waitms 3500
screenshot_mega h2f_x0 1280 720
waitms 600

echo "@@@ H2F doorway x-66"
setpos -66 -530 184 0 90 0
waitms 3500
screenshot_mega h2f_m66 1280 720
waitms 600

echo "@@@ H2F doorway x+66"
setpos 66 -530 184 0 90 0
waitms 3500
screenshot_mega h2f_p66 1280 720
waitms 600

// ---------------------------------------------------------------- still crosses?
// The gate must not have broken a real crossing.  Walk it for real.
echo "@@@ H2F crossing -- must still go through"
setpos 0 -700 184 0 90 0
waitms 2000
+forward
waitms 1400
-forward
waitms 2000
screenshot_mega h2f_crossed 1280 720
waitms 600

echo "@@@ H2F DONE"
waitms 1000
quit
