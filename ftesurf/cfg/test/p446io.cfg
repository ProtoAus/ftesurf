cfg_save_auto 0

// ===========================================================================
//  P446IO -- a map's allow-listed console command cannot smuggle a second one.
//    python tools/p446inject.py [--control]
//  The driver BUILDS the fixture map; this cfg only loads it and quits.
//
//  THE DEFECT.  SV_IOCommand (src/server/sv_entities.qc) allow-lists a map's
//  `Command` by testing the FIRST space-delimited token against say/echo/print, then
//  hands the WHOLE string to localcmd.  Cbuf_ExecuteLevel terminates a command at an
//  unquoted `;` (engine common/cmd.c:495 and :654), so `echo P446FIRED;set p446hit 1` passes
//  the gate and Cbuf then runs the second half too.  RESTRICT_INSECURE is 30 against
//  a default rcon_level of 20, so anything registered without an explicit restriction
//  executes -- including `set`, and `run_starthop` is read LIVE every packet, which is
//  one map switching the whole hopped-start rule off for everyone.  Found by two
//  independent reviewers in Patch 445's round 6, in the door 445's own essays cite as
//  the reason its design is safe.
//
//  THE FIXTURE MAKES THE CONDITION, because no shipped map carries it.
//  tools/census/iocmd.py over all 1316 bsps: 301 maps carry a Command output, 1438
//  rows, 194 allow-listed as the gate sees the verb.  THIRTEEN rows carry a terminator
//  and NONE of the thirteen is allow-listed -- every one begins sv_cheats /
//  sv_airaccelerate / sv_maxvelocity, so all thirteen were already refused on the verb.
//  ZERO rows contain a quote and ZERO contain `$`.  (ROUND 7 ROUGHLY DOUBLED ALL OF
//  THOSE: the census took a dict that dropped repeated keys and assumed a comma where
//  VBSP >= v25 uses 0x1B ESC.  The conclusion did not move; every number did.)
//  So the corpus cannot demonstrate the defect, and pointing at it would be pointing
//  at a filter that never fires.  The driver copies bhop_futile -- whose logic_auto is
//  the row the gate's essay was written about -- and rewrites its parameter
//  `sv_airaccelerate 150` as `echo P446FIRED;set p446hit 1`.  The lump is
//  LZMA-compressed, so it is decompressed, patched, appended uncompressed at EOF and
//  lump 0's header entry repointed -- VBSP lumps are absolute and need not be
//  contiguous.  A raw byte patch was the first cut and could not reach it.
//
//  WHAT IS GRADED.  Each side carries its own witness that the entity fired at all,
//  and they differ because the fix refuses the WHOLE command rather than stripping its
//  tail -- on the control that witness is `fired`, on the fixed build it is `injsay`.
//   fired    `P446FIRED` -- the FIRST echo.  It runs pre-446 and does NOT run after,
//            because the refusal discards the legitimate half with the payload.  On the
//            control this is the proof the Command output fired at all; without such a
//            proof a build that never ran the entity would read identically to one that
//            refused, which is the arm-whose-condition-never-occurs trap one level up.
//   payload  `p446hit` reading 1 -- the injected `set` landed.  Present pre-446,
//            absent after.  This is the whole measurement, and it is a CVAR rather
//            than a log token because the refusal dprint quotes the command it
//            refused: the first cut graded the token and read `payload present` on a
//            build that had just refused it.  Both `fired` and `payload` are searched
//            with the `entity I/O:` lines dropped for that reason.
//   cvarread `p446hit` was readable at all -- otherwise `payload absent` would mean
//            "could not see" rather than "did not run".
//   injsay   SV_IOCommand's own refusal dprint.  The subject printing its own action,
//            which CLAUDE.md requires: "the flag ended up right" is a downstream
//            consequence and four arms in one session graded one and measured nothing.
//   blocked  reported, not graded -- the ordinary "only say/echo/print" refusal. It
//            should NOT appear for this row on either build, because `echo` is
//            allow-listed; if it does, the fixture's first token is not what this arm
//            thinks it is.
//
//  PRE-REGISTERED PREDICTIONS
//   FIXED    fired ABSENT, payload ABSENT, injsay present, cvarread present.
//   CONTROL  fired present, payload PRESENT, injsay absent, cvarread present.
//  FALSIFIED IF the log never names `p446inject` (the fixture did not load), or
//   `blocked` appears (the gate refused on the VERB, not on the separator, so the arm
//   measured the pre-existing allow-list instead of this patch), or `cvarread` is
//   absent (the witness could not be read, so `payload absent` means "could not see"
//   rather than "did not run"), or BOTH `fired` and `injsay` are absent on the fixed
//   side (then nothing reached SV_IOCommand and the section measured nothing).
//
//  A PREDICTION OF MINE WAS FALSIFIED GETTING HERE.  I predicted `fired` PRESENT on
//  both sides, treating the first echo as a side-agnostic positive control.  It is
//  ABSENT on the fixed build, because the refusal discards the WHOLE command including
//  its legitimate half.  The fix is sound and this is a real consequence of choosing
//  "refuse outright" over "strip the tail": a future map writing
//  `say Secret 1; well done` prints nothing at all.  It is FREE ONLY BECAUSE IT WAS
//  MEASURED -- zero allow-listed rows in 1316 shipped bsps carry a `;`.
//  So the two sides have different witnesses that the entity fired, and both are sound:
//  `fired` on the control, and `injsay` on the fixed build, which SV_IOCommand can only
//  print if it was reached.
//
//  RESULT 2026-09-27, both sides exit 0, re-run after round 7.  qwprogs
//  AB1F10EBDD196A3E fixed / 1F000116DB26CD5A control (a worktree at bb4fe45).
//   CONTROL  fired present, `p446hit` reads 1, no refusal line -- THE INJECTION RAN.
//   FIXED    fired absent, `p446hit` still 0, refusal line present.
//  `run_starthop` read 1 on both sides throughout, recorded so a reader can see the
//  cvar a real payload would aim at never moved in either run.
//  ROUND 7 also moved the refusal INSIDE the allow-list and added `$` to it, and broke
//  this arm doing so: `injsay` was anchored on the whole sentence, the dprint gained
//  `or $`, and the arm went red on a build whose refusal was working.  That is the
//  right failure mode for a check that grades the subject's own print -- but the
//  pattern is anchored on `REFUSED map command` alone now.
log_enable 1
log_dir logs
log_name p446io
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
sv_port 27702
sv_cheats 0
set run_resume 0
vid_fullscreen 0
waitms 5000

// NO `;` IN AN ECHO LINE IN THIS FILE.  The first cut wrote "load the fixture; its
// logic_auto fires OnMapSpawn" and Cbuf split it -- the run logged
// `Unknown command "its"`.  The defect under test bit its own arm, which is the
// cheapest possible demonstration that the mechanism is real.
//
// ZEROED BEFORE THE MAP LOADS, so the reading afterwards is an EDGE and not a default.
// The payload is `set p446hit 1`; this is the witness that is not text, because the
// refusal dprint quotes the command and any token inside it appears on both builds.
set p446hit 0

// The fixture has no zone data, deliberately -- this arm is about entity I/O at map
// spawn, and a timer that never arms cannot confuse the reading.
echo ==== M load the fixture, whose logic_auto fires OnMapSpawn ====
map p446inject
waitmap 2400
waitms 4000
menu_restart
ui_close
waitms 2000

echo ==== V the witness: did the injected set land ====
p446hit
waitms 400
// And the cvar a REAL payload would aim at, recorded so a reader can see it never moved.
run_starthop
waitms 800

quit
