// G9 -- does the SAME map render differently depending on what was loaded before it?
//
// Two runs of surf_conc disagree, same build, same spawn point, same cvars:
//     G6 (surf_conc loaded FIRST)                     -> 7 world batches, sky + geometry
//     G8 (surf_conc loaded 5th, after 4 kitsune loads) -> 0 world batches, entirely black
// and in G8 the map itself loaded perfectly well: "load 128ms", "Average leafs visible /
// hearable / total: 385 / 501 / 502".  So the BSP is fine and something survives a map
// change that should not.
//
// If that reproduces, it explains the shape of the user's report better than anything else
// found so far -- "some maps are broken and some random are not" would not be about the maps
// at all, it would be about what you loaded before them, which is why it looks random.
//
// The design is the experiment: load conc, then a different map, then conc AGAIN, in one
// session.  Arm 1 and arm 3 are the same map from the same spawn, so any difference between
// them is the map change and nothing else.  Arm 4 repeats it once more to tell a one-shot
// glitch from a persistent state leak.

cfg_save_auto 0
developer 1
log_developer 0
scr_sshot_type png
cl_yieldcpu 0
cl_maxfps 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0
r_speeds 2
vbsp_portal_render 1
r_portalscissor 1

waitms 2500

// ---------------------------------------------- ARM 1: surf_conc, FIRST map of the session
map surf_conc
waitmap 240
waitms 8000
echo "@@@ ARM1 conc FIRST"
r_speeds_dump
waitms 400
screenshot_mega g9_1_conc_first 1280 720
waitms 600

// ---------------------------------------------- ARM 2: something else in between
map surf_kitsune
waitmap 240
waitms 7000
echo "@@@ ARM2 kitsune (the map change under test)"
r_speeds_dump
waitms 400
screenshot_mega g9_2_kitsune 1280 720
waitms 600

// ---------------------------------------------- ARM 3: surf_conc AGAIN, identical to ARM 1
map surf_conc
waitmap 240
waitms 8000
echo "@@@ ARM3 conc AFTER a map change -- must match ARM1"
r_speeds_dump
waitms 400
screenshot_mega g9_3_conc_after 1280 720
waitms 600

// ---------------------------------------------- ARM 4: and once more, to see if it persists
map surf_conc
waitmap 240
waitms 8000
echo "@@@ ARM4 conc a third time"
r_speeds_dump
waitms 400
screenshot_mega g9_4_conc_again 1280 720
waitms 600

// ---------------------------------------------- ARM 5: kitsune again, same question
map surf_kitsune
waitmap 240
waitms 7000
echo "@@@ ARM5 kitsune AFTER conc -- does it degrade too?"
r_speeds_dump
waitms 400
screenshot_mega g9_5_kitsune_after 1280 720
waitms 600

echo "@@@ G9 DONE"
waitms 800
quit
