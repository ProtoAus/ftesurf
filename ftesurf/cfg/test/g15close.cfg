// G15 -- the magenta probe, this time with an aperture actually filling the view.
//
// G12-G14 were all aimed by guesswork and the QC kept saying the nearest aperture
// was 228.9 units away.  It was right: surf_kitsune's entity lump says
// portal_hub_exit sits at 0 -520 184 and every door on the map is 88x88 units, so
// from 0 -765 133 the target was an 88-unit square 245 units away -- the small red
// frame in those shots, far too small to judge anything by, and small enough that
// "nothing painted" and "painted the same black as the wall" look identical.
//
// Stand 100 units off instead.  An 88x88 door at 100 units fills a large part of
// the screen, so if the pass rasterises at all the magenta is unmissable.
//
// The program is still carrying the G14 probe: solid magenta everywhere the
// aperture draws, except a vertical strip down the middle showing the real
// $refraction lookup tinted green.  Reverted right after this run.

cfg_save_auto 0
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "p210_g15"
scr_sshot_type png
cl_yieldcpu 0
cl_maxfps 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0
r_speeds 0
vbsp_portal_render 1

waitms 2500

map surf_kitsune
waitmap 240
waitms 8000
sv_cheats 1

// portal_hub_exit, 0 -520 184, angles 0 270 0.  Approach from -y looking +y.
echo "@@@ G15 hub exit from 100 units"
setpos 0 -620 150 0 90 0
waitms 3000
screenshot_mega g15_hub_100 1280 720
waitms 600

echo "@@@ G15 hub exit from 200 units"
setpos 0 -720 150 0 90 0
waitms 2000
screenshot_mega g15_hub_200 1280 720
waitms 600

// Oblique: the angle at which a bounding rectangle and the real quad disagree
// most, which is the whole reason Patch 208 was not good enough.
echo "@@@ G15 hub exit oblique"
setpos -90 -620 150 0 55 0
waitms 2000
screenshot_mega g15_hub_oblique 1280 720
waitms 600

// A second door, in case the hub one is special.  portal_s1_entry at
// -15360 -15352 904, angles 0 90 0, so approach from +y looking -y.
echo "@@@ G15 s1 entry from 100 units"
setpos -15360 -15252 870 0 270 0
waitms 3000
screenshot_mega g15_s1_100 1280 720
waitms 600

echo "@@@ G15 DONE"
waitms 1000
quit
