cfg_save_auto 0
// BUILD 78 AGAINST THE LIVE FLEET -- does the qcrequest survive the real path?
//
// b78event.cfg measured all seven arms on a listen server, which is one process
// talking to itself.  This asks the same question of the deployed build over the
// path a player actually takes: a Windows x86-64 client, the router, the public
// internet, and an aarch64 dedicated server running the qwprogs.dat that
// build.ps1 -Pi put there.  That is the b73live lesson -- verifying against
// 127.0.0.1 "is not the path any player takes" -- applied before a claim rather
// than after one.
//
// WHAT IS AND IS NOT PROVEN HERE, stated so the log is not over-read.  This
// client's csprogs.dat is byte-identical to the one the lobby serves, so no
// download happens and this arm does NOT exercise the force-download path.  What
// it does exercise is the half that is new and remote: clcfte_qcrequest leaving
// a real client, crossing the internet, and being dispatched into
// CSEv_inprof_ffffff by a server compiled for another architecture.
//
// PRE-REGISTERED, on lobby 4 (bhop_eazy, 27540):
//
//   A  CONTROL.  Honest raw input.  MUST read `said 2` and `would 0`.  A `said 0`
//      here means the event did not survive the trip and the fleet is faulting
//      every run; nothing below would mean anything.
//
//   B  THE BYPASS.  in_rawinput 0 ; in_restart ; in_rawinput 1 -- the cvar ends
//      back at 1 and only the grant moved.  MUST read `would 1`.
//
//   C  THE FORGERY.  Still in B's state, type the key clean:
//      setinfo inprof "2 15 1 0 0 0 2".  MUST read `keywould 0` and `would 1`.
//      This is the arm the whole build exists for, measured against a server a
//      player could actually be on.
//
//   D  RECOVERY.  in_restart, no cvar set.  MUST read `would 0` and the forged
//      key must be gone, because a grant change is a cache miss and both halves
//      are resent.
//
// FALSIFIED IF A reads said 0 or would 1, or C reads would 0, or D reads would 1.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name b78live
developer 0

name "^3Lex Profile78"

m_filter 0
m_accel 0
cl_nocsqc 0

waitms 40000
menu_restart
waitms 3000

echo ================================ B78LIVE -- connect to lobby 4 (bhop_eazy)
connect play.proto.bar:27540
waitms 20000

echo ================================ B78LIVE -- who am I talking to
status
waitms 2000

echo ================================ B78LIVE ARM A -- control.  Expect said 2, would 0.
in_rawinput 1
in_restart
waitms 4000
cmd timer
waitms 3000

echo ================================ B78LIVE ARM B -- the bypass.  Expect would 1.
in_rawinput 0
in_restart
waitms 2500
in_rawinput 1
waitms 4000
cmd timer
waitms 3000

echo ================================ B78LIVE ARM C -- forged key.  Expect keywould 0, would 1.
setinfo inprof "2 15 1 0 0 0 2"
waitms 4000
cmd timer
waitms 3000

echo ================================ B78LIVE ARM D -- recovery.  Expect would 0.
in_restart
waitms 4000
cmd timer
waitms 3000

echo ================================ B78LIVE done
waitms 1000
quit

// ============================================================================
// MEASURED 2026-09-14, lobby 4 over the public internet, QC build 78 deployed
// to all twelve.  Every arm met its pre-registered expectation.
//
//   arm  key (userinfo)        said  ev                keywould  would  exp
//   A    "2 15 1 0 0 0 2"        2   "15 1 0 0 0 2"       0        0     0
//   B    "2 15 1 0 0 1 0"        2   "15 1 0 0 1 0"       1        1     1
//   C    "2 15 1 0 0 0 2"        2   "15 1 0 0 1 0"       0        1     1
//   D    "2 15 1 0 0 1 2"        2   "15 1 0 0 1 2"       0        0     0
//
// THE CONTROL THAT SAYS THIS IS REMOTE AT ALL, because a client that silently
// fell back to a listen server would produce this exact table and mean nothing:
//
//     Connecting to play.proto.bar:27540...
//     180.150.62.57:27540: challenge
//     Connected to play.proto.bar:27540 (plain-text).
//
// -- the public IP, not the LAN address and not loopback.  Worth pinning
// deliberately: `status` in this file printed "Server is not running", because
// it reports the LOCAL server and not the one being talked to.  It is kept in
// the script as a reminder that it answers a different question than it looks
// like it answers; the connect lines above are the actual control.
//
// AND THE PRE-REGISTRATION UNDERSTATED WHAT THIS RUN COVERED.  The caveat above
// says this arm "does NOT exercise the force-download path" because the local
// csprogs.dat should have been byte-identical to the lobby's.  The log says
// otherwise:
//
//     Downloading csprogsvers/bdef4f37.dat...
//
// The client pulled the lobby's csprogs and ran that.  So the chain measured
// here is the whole one, not the half that was claimed: the server publishes
// its csprogs hash, the client refuses its own copy and downloads the server's,
// THAT csprogs emits the qcrequest, and an aarch64 qwprogs.dat dispatches it
// into CSEv_inprof_ffffff.  Recorded as a correction rather than quietly fixed
// in the paragraph above, because the direction matters: an essay claiming MORE
// than the table is the failure build 77 shipped, and this is the same habit
// catching the harmless version of it.
//
// ARM C IS THE ONE THAT MATTERS AND IT IS NOW MEASURED SOMEWHERE A PLAYER COULD
// STAND.  Same console line that read would 0 under build 77, same engine
// state, against a server on the other side of a router: key clean, ev dirty,
// would 1.
// ============================================================================
