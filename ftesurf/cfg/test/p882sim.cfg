// Patch 882 replay arm: the pin's new keys and the per-version name count.
//   python tools/runlines_smoke.py ftesurf/cfg/test/p882sim.cfg --mount --timeout 600 \
//     --put data/p882old.rec=<a finished pmsrcver 8 run> --put data/p882v10.rec=<the same, pins
//     relabelled pmsrcver=10 with momlimit=0 momcool=0 momslide=0> \
//     --put data/p882v10l.rec=<that, landticks=1000000 added to its seed> \
//     --ssqc <qwprogs> --csqc <csprogs> --mqc <menu> [--client <exe>] --output-dir <task root>/artifacts
// OLD  70 names: `pin 70/70 ... EXACT REPLAY` and VERIFY PASS on the new engine, as on the
//      installed one (the control).
// V10  73 names at mover 10 with the inputs 0 and no landticks: "carried state incomplete", not
//      exact, REFUSE on the new engine; on the installed one "not a mover this engine has".
// V10L the same with landticks: EXACT and PASS on the new engine (mover 10 with nothing limited
//      is mover 8); REFUSE on the installed one -- neither a fault.  A real mover-10 recording with momlimit 64 is replayed by
//      p882rec.cfg inside its own session.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name runlines_smoke
developer 0
set rec_enable 0
set rec_stream 0
set run_resume 0
waitms 3000

map surf_garden
waitmap 120
waitms 4000
echo ==== OLD pm_recsim ====
pm_recsim data/p882old.rec
waitms 3000
echo ==== OLD pm_verify ====
pm_verify data/p882old.rec
waitms 3000
echo ==== V10 pm_recsim ====
pm_recsim data/p882v10.rec
waitms 3000
echo ==== V10 pm_verify ====
pm_verify data/p882v10.rec
waitms 3000
echo ==== V10L pm_recsim ====
pm_recsim data/p882v10l.rec
waitms 3000
echo ==== V10L pm_verify ====
pm_verify data/p882v10l.rec
waitms 3000
echo RUNLINES COMPLETE
quit
