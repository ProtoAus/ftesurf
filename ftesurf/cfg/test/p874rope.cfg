// Patch 874 rope-frame check: bhop_kiitovittu's rope from 300 units, three ropes-on frames
// 2.5 s apart with an off/on toggle between the second and third, to tell a one-frame
// glitch from a drawing fault.  Grade each frame's top-left wall against the off frame.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name runlines_smoke
con_notifytime 0
cl_idlefps 0
cl_maxfps 100
vid_vsync 0
vid_fullscreen 0
vid_width 1280
vid_height 720
sv_public 0
set run_resume 0
developer 1
log_developer 1
scr_sshot_type png
waitms 1500

map bhop_kiitovittu
waitmap 120
waitms 8000
menu_restart
ui_close
waitms 500
noclip
setpos 144 4676 330 0 90 0
waitms 1500
screenshot p874r_on1
waitms 2500
screenshot p874r_on2
waitms 2500
vbsp_ropes 0
waitms 500
screenshot p874r_off
waitms 2500
vbsp_ropes 1
waitms 500
screenshot p874r_on3
waitms 2500
echo RUNLINES COMPLETE
quit
