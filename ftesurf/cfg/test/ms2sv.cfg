// MS2SV -- the rotation hold (WP11), server half (client: ms2cl.cfg).  Zones as
// ms1listen.cfg for surf_666; bhop_eazy uses its own.  lobby_cycle 60 with
// lobby_cycle_hold 120: a due rotation waits for a run in progress, at most 2 min.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name ms2sv
developer 1
exec cfg/lobby/lobby.cfg
sv_cheats 0
set lobby_master "http://127.0.0.1:8131"
sv_guidkey "ftesurf-ms2-probe"
sv_maxrate         0
sv_maxdownloadrate 0
set lobby_master_key  "stub-key-not-a-real-one"
set lobby_master_rate 30
set lobby_maps "surf_666 bhop_eazy"
set lobby_cycle 60
set lobby_cycle_hold 120
set run_resume_min 1
set run_resume_countdown 1
map surf_666
waitms 330000
quit
