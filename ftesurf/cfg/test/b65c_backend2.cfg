cfg_save_auto 0

// ===========================================================================
// BUILD 65, ARM SET C -- arm set B, with its harness bug fixed.
//
// ARM SET B FAILED AND ITS CONTROL IS WHY WE KNOW.  It switched the backend
// with `s_device dsound; snd_restart` AFTER the map had loaded, and measured
// 0 active / 2 known -- i.e. the 30 ambient channels had VANISHED, not gone
// quiet.  Static sounds are replayed to the client during PRESPAWN
// (sv_user.c:1823-1831); snd_restart rebuilds the channel list and nothing
// re-sends them, so the software mixer came up with an empty world.
//
// The control caught it.  B3 measured at an emitter's OWN POSITION, where the
// answer must be "loud", and got 0 active / 2 known -- which is impossible if
// the sounds were merely attenuated.  Without that arm, B2's 0 at spawn would
// have read as "silence is correct here" and been quoted as a result.  It was
// added for exactly this reason after arm set E read a 0.00x as evidence when
// the instrument could not produce anything else.
//
// TWO FIXES: set the device BEFORE the map so prespawn replays into the
// software mixer, and use the real driver name -- "DSound" (snd_directx.c:1074),
// not "dsound"; the s_device format is driver:device.
//
// PRE-REGISTERED, unchanged from arm set B:
//   C1  software, at spawn        -> MUST be ~32 known.  If it is 2, the
//                                    device switch failed again and NOTHING
//                                    below is readable.
//   C2  software, at spawn        -> active MUST be 0 if silence is correct
//                                    where the offline model and the user's
//                                    own ent_io both say 0 emitters are in
//                                    range.
//   C3  software, AT an emitter   -> active MUST be > 0.  THE CONTROL.  A 0
//                                    here means the counter never moves and
//                                    C2 says nothing.
//
// If C1 and C3 both pass and C2 reads 0, then silence at spawn is the correct
// behaviour, the software mixer implements it, and whatever the user hears on
// OpenAL is the OpenAL path not attenuating -- which is a backend bug, not a
// falloff-arithmetic bug, and build 64's verified conversion stands.
// ---------------------------------------------------------------------------
// RESULTS: (written back here after the run)
// ---------------------------------------------------------------------------
// ===========================================================================

log_enable 1
log_dir logs
log_name b65c_backend2
developer 1
log_developer 1
cl_maxfps 100
con_notifylines 0

volume 0
bgmvolume 0

waitms 5000

// BEFORE the map: prespawn must replay the statics into this mixer.
s_device "DSound:"
snd_restart
waitms 4000
soundinfo
waitms 1000

vbsp_sound 1
map surf_tensor2
waitmap 60
waitms 9000

echo ^5=== C1/C2: software mixer at spawn -- expect ~32 known, 0 active ===
soundinfo
waitms 2500

echo ^5=== C3: software mixer AT an emitter -- THE CONTROL, expect active > 0 ===
setpos -224 -6080 -1184
waitms 3000
soundinfo
waitms 2500

echo ^5=== C4: s_show 2 at the same spot -- per-channel volumes ===
s_show 2
waitms 1500
s_show 0
waitms 1000

echo ^5=== restore ===
s_device ""
snd_restart
waitms 2500
echo ^5=== END OF RUN ===
quit
