// P427CLPI -- p427cl.cfg against a PI server on a spare LAN port (the deployed binary).
// The Pi runs p427sv.cfg copied to cfg/, on port 27791, once with the live
// fteqw-svarm64 (control: must stall) and once with the 427 build (must join).
// The client is this install's pre-427 ftesurf64.exe, i.e. every player today.
// Arms and markers are p427cl.cfg's; this file differs only in the connect.
cfg_save_auto 0
log_enable 1
log_dir logs
developer 1
cl_idlefps 0
cl_maxfps 100
rate  2000000
drate 5000000
vid_fullscreen 0
cl_downloads 1
cl_download_wait 1
name "^3P427"
waitms 4000
connect 192.168.1.102:27791
waitms 40000
cmd viewpos
waitms 3000
echo p427cl: done
quit
