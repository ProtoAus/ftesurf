cfg_save_auto 0
// P388CRASH -- Linux: logging walks a name hash that still links freed packs (engine Patch 388).
// Linux client, WSL/Xvfb, scratch basedir (a copy of release/stage-0.1.10), under gdb:
//   xvfb-run -a gdb -batch -ex run -ex bt --args ./fteqw64 -nosound
//     +set vid_renderer gl +set developer 1 +exec cfg/test/p388crash.cfg
// log_developer 1 is what makes it fire: the lines logged inside the two windows
// below are Con_DPrintf.  With log_developer 0 the same runs exit cleanly.
//
// PRE-REGISTERED
//   V  (vid_restart after a map load) unpatched: SIGSEGV inside the restart --
//      Hash_GetInsensitiveBucket <- FS_AddFileHash <- FSSTDIO_OpenVFS (fs_stdio.c:282)
//      <- FS_OpenVFS("logs/p388crash.log","ab") <- Log_String <- Con_DPrintf <-
//      R_ApplyRenderer, com_fschanged 1.  R_ShutdownRenderer's COM_FlushTempoaryPacks
//      freed surf_666's embedded pak while its buckets were still linked.
//      Fires only when the log key's bucket (1024, hashed on the ABSOLUTE log path)
//      also holds a pak name: 823 of 1024 do for surf_666 (1476 names), and
//      /root/p388run/ftesurf/logs/p388crash.log is bucket 56 (sp_545.vhv).
//      "=== P388 V survived" never prints.
//   Q  (quit) unpatched, if V was survived: SIGSEGV at quit, same top five frames,
//      under Con_DPrintf <- FS_ReloadPackFilesFlags (the "%s is no longer needed"
//      loop) <- fs_restart <- Plug_Close.  Deterministic: the hl2 plugin's vpks
//      put ~47 entries in every bucket.  Last log line "...cstrike_pak_dir.vpk is
//      no longer needed".
//   Patched (388): prints "=== P388 V survived", logs the whole reload at quit and
//      gdb reports "exited normally".
// FALSIFIED IF the patched build crashes, or the unpatched one exits normally.

set vid_fullscreen 0
set vid_width 640
set vid_height 480
cl_maxfps 100
log_developer 1
log_enable 1
log_name p388crash
wait 100
map surf_666
waitmap 600
waitms 3000

echo === P388 V: vid_restart after a map load
vid_restart
waitms 100
waitms 1000
echo === P388 V survived

echo === P388 Q: quit
quit

