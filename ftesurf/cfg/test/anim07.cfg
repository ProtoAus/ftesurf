// ANIM07 -- five aimed candidates, so at least one lands.
//
// anim06 aimed at a 3104-unit face and hit a dev-textured wall 96 units short of
// it: a map-spanning face's centroid usually has other geometry in front.  These
// five are 768-860 units across -- actual screens -- and are five DIFFERENT
// materials, so a single unlucky occluder cannot take out the whole run.
//
// Each vantage is photographed in both states and shader_here/light_here are
// taken in the ON state, so which candidate landed is decided from the log
// afterwards rather than guessed now.
//
// EXPECTED, on any candidate that lands:
//   shader_here -> vmt/animated#...#UNLIT
//   light_here  -> haslightmap=0, lmpage -1,-1,-1,-1   (no page allocated)
// against surf_demise's LIT flipbook from anim06, same shader, no #UNLIT:
//   light_here  -> haslightmap=1, lmpage=221, mean 0.3074
// One build, two permutations, opposite answers.

log_enable 1
log_dir "logs"
log_name "anim07"
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 0
vid_fullscreen 0
developer 1
log_developer 1
con_notifytime 0
con_notifylines 0
con_notifytime_error 0

wait 200

hl2_animated 1
map surf_the_internet
waitmap 1800
waitms 12000
sv_cheats 1
waitms 400
noclip
waitms 600

setpos 712.0 -13906.0 6957.5 0.00 180.00 0
waitms 2000
shader_here c1_ham
light_here c1_ham
waitms 600
developer 0
waitms 800
screenshot anim07_c1_on
waitms 800
developer 1

setpos -7269.9 9386.9 3840.0 0.00 101.27 0
waitms 2000
shader_here c2_dance5
light_here c2_dance5
waitms 600
developer 0
waitms 800
screenshot anim07_c2_on
waitms 800
developer 1

setpos -7261.1 9343.6 3840.0 0.00 -78.69 0
waitms 2000
shader_here c3_dance11
light_here c3_dance11
waitms 600
developer 0
waitms 800
screenshot anim07_c3_on
waitms 800
developer 1

setpos -6961.1 9514.6 3840.0 0.00 123.64 0
waitms 2000
shader_here c4_dance6
light_here c4_dance6
waitms 600
developer 0
waitms 800
screenshot anim07_c4_on
waitms 800
developer 1

setpos -10048.0 11669.3 15424.4 42.27 -90.00 0
waitms 2000
shader_here c5_insane
light_here c5_insane
waitms 600
developer 0
waitms 800
screenshot anim07_c5_on
waitms 800

echo ^5=========== same five, hl2_animated 0 =======================
hl2_animated 0
waitms 3500

setpos 712.0 -13906.0 6957.5 0.00 180.00 0
waitms 1800
screenshot anim07_c1_off
waitms 800
setpos -7269.9 9386.9 3840.0 0.00 101.27 0
waitms 1800
screenshot anim07_c2_off
waitms 800
setpos -7261.1 9343.6 3840.0 0.00 -78.69 0
waitms 1800
screenshot anim07_c3_off
waitms 800
setpos -6961.1 9514.6 3840.0 0.00 123.64 0
waitms 1800
screenshot anim07_c4_off
waitms 800
setpos -10048.0 11669.3 15424.4 42.27 -90.00 0
waitms 1800
screenshot anim07_c5_off
waitms 800

echo ^5=== anim07 done ===
wait 30
quit
