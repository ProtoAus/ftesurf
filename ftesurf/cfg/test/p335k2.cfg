cfg_save_auto 0
log_enable 1
log_dir logs
log_name p335k2
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0
set cl_prederror 2
set cl_trigdebug 1
wait 600
connect 127.0.0.1:27666
waitms 15000
echo === spawn pos:
cmd viewpos
waitms 500
echo === warp:
cmd setpos 7900 -10688 -2400 0 0 0
waitms 400
cmd noclip
waitms 2500
echo === after warp/land:
cmd viewpos
waitms 500
+forward
waitms 3000
echo === after walk:
cmd viewpos
waitms 500
-forward
waitms 2000
quit
