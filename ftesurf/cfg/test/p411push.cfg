// P411PUSH -- an UPWARD pad takes the ground flag, and Patch 409's gate read it.
//   ftesurf64.exe +set vid_winmaximize 0 -WindowStyle Minimized +exec cfg/test/p411push.cfg
//
// THE HOLE, in the patch that shipped this morning.  409 gates the hopped-start
// accusation on `!run_pushed || run_jumpcmd`, and run_jumpcmd is latched in
// PlayerPreThink as `run_wasground && button2`.  trigger_push_touch strips
// FL_ONGROUND on any upward net push (sv_entities.qc:5657) and the touch loop runs
// AFTER the move, so the next command's run_wasground stamp reads FALSE for a body
// the mover will re-ground inside pmove.  run_jumpcmd then never latches, the gate
// is `!TRUE || FALSE` = FALSE, and the hop rule is switched off for as long as you
// are on the pad -- the hole draft 1 opened, reached by another route.
//
// MEASURED, 1316 bsps (scratchpad/pushtilt.py over pushcensus.out): of the 21 maps
// whose start zone overlaps a trigger_push, only 4 pads push UP --
// surf_prosurf 2200 u/s, surf_polygon 770, surf_ethereal 400 x2.  Every other
// overlapping pad is horizontal or points down and never strips the flag, which is
// why surf_666 bonus 3 was unaffected and the player's retest of it passed.
//
// WHY surf_polygon AND NOT surf_prosurf, which has the bigger pad: prosurf's pad
// meets its start box only on the x = -6944 plane (zero-width overlap), so a body
// in the box need never be in the pad.  polygon's 770 u/s pad overlaps the box by
// 288 x 288 x 224 u about (7168, -10240, 14224), which is a volume you can stand in.
//
// A VERTICAL PAD RISES AS AN ACCELERATION, not an impulse: run_basevel_z is handed
// to the engine and spent by PMSrc_StartGravity at basevelocity[2] * frametime, so
// 770 u/s is ~11.6 u/s per tick at pm_ticrate 0.015 and velocity_z crosses
// PM_NONJUMP_VEL (140) about 12 ticks in.  `jumped` does fire here; it just takes
// longer than the 2:1 clip on surf_666 does.  The dwells below allow for that.
//
// PRE-REGISTERED
//  H1 `cmd timer` in the start box reports ok 0 hopped 0 before either arm.
//  H2 the pad arms an UPWARD carrier: a `basevel: paid #N ... 0.000000 0.000000
//     770.000000`-shaped line with a positive `v +`.  If none appears, K1/K2 are
//     not measurements -- say so, do not report them as passes.
//  K1 on the pad, NO +jump   -> hopped 0.  The mover lifted you; 409's withdrawal
//     of the accusation is preserved and this arm must not regress.
//  K2 on the pad, +jump held -> hopped 1.  This is the repair: pre-411 it is
//     IMPOSSIBLE, because run_jumpcmd cannot latch while the pad holds the flag off.
// CONTROL: the same cfg on a HEAD (pre-411) build must give hopped 0 on BOTH arms.
// FALSIFIED IF K2 reads hopped 0 on the patched build (the hole is still open), or
// K1 reads hopped 1 (Patch 409 has been undone), or the control reads hopped 1 on
// K2 (then the hole was never there and this patch is unmotivated).
//
// RESULT 2026-09-20: H2 FAILED, SO K1/K2 ARE NOT MEASUREMENTS.  Recorded here
// rather than deleted, because the reading LOOKS like a pass and is not one.
//   - The run printed K1 hopped 0 and K2 hopped 1, exactly the predicted flip.
//     It is worthless: zero `basevel:` lines in the whole log, `rec rows: ride 0`,
//     and K2's `phase: jumps 4` with run_pushed FALSE throughout.  That is an
//     ordinary bhop with +jump held, on no pad at all -- the pre-411 build would
//     print the same thing, so the arms separate nothing.
//   - p411probe.cfg then probed 7 points across the pad's model AABB and armed
//     nothing; p411probe2.cfg setpos'd to the entity's exact `origin`
//     (7168 -10240 12288) and the player stood there GROUNDED, `jumps 0`, with no
//     carrier.  The entity is live (startdisabled 0, spawnflags 1 =
//     SF_TRIGGER_ALLOW_CLIENTS, which SV_PassesFilter wants, sv_entities.qc:5567),
//     so its BRUSH simply does not fill model *198's 2048 x 2048 x 4096 box.  Same
//     lesson as p409hop's H2 on surf_666, and it cost a second harness to relearn:
//     an AABB from the models lump is where a brush CAN be, not where it IS.
//   - So .run_pushlift is NOT verified by harness.  It is verified by construction
//     only: the flag is set on each line that strips FL_ONGROUND and spent on the
//     next command beside the stamp it repairs.
//
// AND THE MAP LIST IS WORSE THAN THAT -- read this before quoting "4 pads on 3
// maps" as a severity.  A third pass swept 45 points through surf_polygon's pad
// AABB reading the player's ACTUAL position back with `cmd viewpos`, which is the
// only detector here that works: `basevel: paid` prints on CASH-OUT only, and
// setpos-ing out of a volume clears the carrier instead of cashing it, so the
// first two attempts printed nothing on surf_666 either.  With the control fixed:
//   surf_666  9965 10200 -13945 -> 9963.5 11988.1 -13473.9  (+1788 y, +471 z: the
//             reported bug, reproduced) ... and 9440 -> unmoved, as p409hop said.
//   surf_polygon  z 14300 and 13500, all 9 xy points: UNMOVED, no pad.
//                 z 12288 and below, all points: returned to 7168 -10240 14112.9,
//                 which is the start floor -- a teleport, not a 770 u/s climb
//                 (4000 u at 770 u/s is 5.2 s, not the 0.9 s allowed).
// So the pad is not reachable by standing in it, and the census that produced the
// "21 overlapping / 4 upward" figures reads a brush model's AABB -- where a pad
// CAN be, not where it IS.  Twice now that has been wrong by a wide margin.  The
// MECHANISM run_pushlift repairs is proven from the code and is map-independent;
// the claim that any particular shipped map exposes it is NOT established, and no
// map is currently known where a human could test it.
//
// WHAT THIS RUN DID ESTABLISH -- the regression, which matters more, because these
// edits are inside the function Patch 409 changed and surf_666 bonus 3 is the map
// the player retested and passed.  cfg/test/p409hop.cfg on the SAME patched build:
//   H1 ok 0 hopped 0, jumps 0
//   J1 `basevel: paid #1 ... '-0.000131 3000.000000 0.000000'`, jumps 1, hopped 0
//   J2 paid twice, jumps 2, hopped 1
// which is its pre-registered result unchanged.  Patch 411 does not disturb 409.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p411push
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
sv_port 27653
sv_cheats 1
set run_resume 0
set run_starthop 1
set run_starthop_strict 1
set run_startcap 0
set run_bv_debug 1
vid_fullscreen 0
waitms 5000
map surf_polygon
waitmap 2400
waitms 3000

echo ==== H1 baseline in the start box ====
cmd timer
waitms 800

// Inside the pad-and-start overlap: pad x 6144..8192 y -11264..-9216 z 10240..14336,
// start x 7023.98..7311.98 y -10384..-10096 z 14111.999..14336.
echo ==== K1 upward pad, no jump ====
setpos 7168 -10240 14120
waitms 2500
cmd timer
waitms 800

echo ==== re-arm to clear the latch ====
setpos 7168 -10240 14320
waitms 1500
cmd timer
waitms 600

echo ==== K2 upward pad, +jump held ====
+jump
waitms 200
setpos 7168 -10240 14120
waitms 2500
-jump
waitms 300
cmd timer
waitms 800

echo ==== END ====
waitms 800
quit
