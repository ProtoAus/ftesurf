// P355KEEP -- Local keeps a demoted (uncertified) lobby run beside the certified
// one, never in its place.  Listen server on `poop` (no run data of its own);
// the runner deletes data/runs/poop afterwards.  LT_Keep is driven directly
// through `lobbytime keep`, because a scripted finish is practice-tainted and
// LT_Frame never hands it to LT_Keep.  2048 = TF_NOPROFILE ("input mode").
//
// SETUP: the runner copies the Momentum bhop_eazy zone file to
// ftesurf/maps/zones/local/poop.json so the board has legs, and deletes it after.
//
// PREDICTIONS (pre-registered):
//   K1 keep 0 0 5000 0     -> "first one on a lobby";           best 5000 unranked 0
//   K2 keep 0 0 4000 2048  -> "first unranked best (input mode)"; best 5000 unranked 4000
//                             (THE SPLIT: before this patch 4000 replaced 5000)
//   K3 keep 0 0 4500 2048  -> "not a new unranked best";           best 5000 unranked 4000
//   K4 keep 0 0 3000 2048  -> "unranked best ... by";          best 5000 unranked 3000
//   K5 keep 0 0 4800 0     -> "lobby best by";                  best 4800 unranked 3000
//   K6 keep 0 0 4800 2048  -> not written (slower than 3000): best 4800 unranked 3000
//   Files after: exactly 0004800_lobby.rec and 0003000_lobby.rec in main/;
//   lobby.pb says `best 0 0 4800`, never 3000.  Local tab row tags: "lobby" and
//   "input mode" (screenshot p355keep_local).
//   K0 (setup: the runner pre-writes lobby.pb with a stale `best 0 1 999`, an
//      uncertified time an older build filed): keep 0 1 2000 2048 -> saved as
//      unranked; lobby.pb loses its `best 0 1` line (no certified time on leg 1).
// FALSIFIER: any best/unranked pair differing, a third file, or lobby.pb 3000.
cfg_save_auto 0
log_enable 1
log_dir "logs"
log_name "p355keep"
developer 1
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
sv_public 0
waitms 5000
map poop
waitmap 45
waitms 3000
menu_restart
waitms 300
ui_close
echo ==== K0 ====
lobbytime keep 0 1 2000 2048
lobbytime best 0 1
echo ==== K1 ====
lobbytime keep 0 0 5000 0
lobbytime best 0 0
echo ==== K2 ====
lobbytime keep 0 0 4000 2048
lobbytime best 0 0
echo ==== K3 ====
lobbytime keep 0 0 4500 2048
lobbytime best 0 0
echo ==== K4 ====
lobbytime keep 0 0 3000 2048
lobbytime best 0 0
echo ==== K5 ====
lobbytime keep 0 0 4800 0
lobbytime best 0 0
echo ==== K6 ====
lobbytime keep 0 0 4800 2048
lobbytime best 0 0
set rec_terms 1
scores tab local
scores open
waitms 1500
scores status
screenshot p355keep_local
waitms 800
quit

// RESULT (2026-09-18): K1-K6 exactly as predicted (5000/0, 5000/4000,
// 5000/4000, 5000/3000, 4800/3000, 4800/3000); main/ held 0003000_lobby.rec and
// 0004800_lobby.rec only; lobby.pb `best 0 0 4800`.  Screenshot: 0:45 "input
// mode", 1:12 "lobby".  Note: the Local list marks the unranked 0:45 as `best`
// (fastest clean row) -- it is the player's own list; left as is.
// RE-RUN after the review fixes (K0 added): K0 saved "first unranked best (input
// mode)", best 0 unranked 2000 on leg 1, and lobby.pb lost `best 0 1 999`;
// K1-K6 unchanged; files: main/0003000, main/0004800, stage_1/0002000.
