// Patch 502: persisted-prefix and replay practice controls in a fresh CSQC VM.
cfg_save_auto 0
fs_cache 0
log_enable 1
log_dir logs
log_name p502cold
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
run_resume 0
waitms 4000
map surf_dune
waitmap 60
waitms 6000
menu_restart
ui_close
rec_savelock 1
hud_trail 1
hud_rewind_chase 0
waitms 800
echo ==== P502 COLD ====
sl_goto 2
waitms 800
trail
cmd timer
waitms 1000
trail
echo ==== P502 PRACTICE ====
sl_goto 4
waitms 600
trail
waitms 900
trail
rewind
waitms 500
rewind seek 0.25
waitms 100
rewind status
sl_save
waitms 500
rewind go
waitms 600
trail
rewind status
sl_save
waitms 500
cmd sl_list
waitms 3500
trail
rewind status
cmd timer
echo ==== P502 COLD END ====
quit
