// Patch 846: the console's completion keys and the cached map list.
// <exe> -basedir C:\FTESurf -manifest C:\FTESurf\default.fmf -window +exec cfg/test/p846con.cfg
// con_selftest drives Key_Console with TAB, ENTER and `, compares the cached map rows with the
// live globs and times a keystroke each way; con_settext first puts the popup on screen so its
// row map can be checked. condump shows whether a [focus] line reached the console's own text.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p846con
con_notifytime 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
vid_winmaximize 0
vid_width 1280
vid_height 720
sv_public 0
set run_resume 0
set con_displaypossibilities 2
set con_completiondown 2
set con_completionenter 1
set con_completionrows 12
set sv_mapcompletion 1
set sv_mapcompletioncache 1
set developer 0
waitms 2000
map surf_dune
waitmap 60
waitms 3000
menu_restart
ui_close
toggleconsole
waitms 500
con_settext map surf_
waitms 1500
screenshot p846popup
waitms 2500
echo ==== P846 selftest ====
con_selftest
echo ==== P846 done ====
waitms 500
condump p846condump
waitms 500
quit
