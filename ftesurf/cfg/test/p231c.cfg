// Patch 231 + Build 36, final pass on the shipped binaries.
//
// Build 36 is the HUD half of the same fix.  The banner carried its OWN copy of the
// two hardcoded fs_load lines, so on surf_demise the console said "no asset pack
// supplies these" while three lines of red text in the middle of the screen said to
// mount CS:GO.  It now reports the count and the first name and points at hl2_missing,
// which is the one thing that knows.
//
//   surf_demise     expect the banner to read "3 materials did not resolve on this
//                   map" -- it said 41 before P231 -- with no fs_load line anywhere,
//                   on screen or in the console.
//   surf_aesthetic  expect 1, and the cache sentence.
//
// fs_missingwarn is left ON here precisely because the banner is the subject.

log_enable 1
log_name p231c
developer 1
cfg_save_auto 0
cl_idlefps 0
sv_cheats 1
fs_missingwarn 1

wait 200
echo ^5=== p231c: the banner and the counts, on the shipped build ===

map surf_demise
waitmap 900
wait 150
fs_automount_state
hl2_missing
waitms 500
screenshot
waitms 800

map surf_aesthetic
waitmap 900
wait 150
fs_automount_state
hl2_missing
waitms 500
screenshot
waitms 800

echo ^5=== p231c done ===
wait 30
quit
