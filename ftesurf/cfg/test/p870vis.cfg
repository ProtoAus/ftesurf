// Patches 870/873/874 arm: map text and screen effects, trigger soundscapes, env_sun and ropes.
//   python tools/runlines_smoke.py ftesurf/cfg/test/p870vis.cfg --mount --timeout 700 \
//     --ssqc <qwprogs> --csqc <csprogs> --mqc <menu> --output-dir <task root>/artifacts
// Server lines (game_text / env_hudhint / env_fade / env_shake) prove the input landed;
// the screenshots are what has to be looked at.  Sun and ropes are matched on/off pairs.
//   G bhop_grid2 *1 -> bhoptext "Bunnyhop Grid 2", effect 2 (a character every fadein 0.1,
//     each white settling to 0 155 200 over fxtime 0.75), y 0.47; 2.6 s in it is complete.
//   H surf_tron *3 -> hh1 ShowHudHint "SURF_TRON".
//   F bhop_wuyan *80 -> fade1, fade FROM 149 255 255 over 1 s (*67's spot is in a teleport).
//   S surf_s_t_a_t_i_o_n *5 -> start_effect amplitude 16, 4 s.
//   U bhop_eazy: env_sun dir ~ yaw 19.4 pitch -20.2, seen from the env_sun itself (noclip).
//   U2 surf_mom_training: env_sun with no target keeps CSun's (0,0,1): straight up.
//   P bhop_kiitovittu: rope -> rope2, slack 120 (sag ~209), seen from 300 units.
//   A bhop_pokemans_xd: trigger_soundscape *2 (ss1) then *3 (ss2); snd_report names the active one.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name runlines_smoke
con_notifytime 0
cl_idlefps 0
cl_maxfps 100
vid_vsync 0
vid_fullscreen 0
vid_width 1280
vid_height 720
sv_public 0
set run_resume 0
developer 1
log_developer 1
scr_sshot_type png
scr_conalpha 0
waitms 1500

map bhop_grid2
waitmap 120
waitms 6000
menu_restart
ui_close
waitms 500
echo ==== G game_text ====
setpos 7168 -1152 30 0 0 0
waitms 600
screenshot p870_text
waitms 2000
screenshot p870_text2
waitms 2500

map surf_tron
waitmap 120
waitms 6000
echo ==== H hudhint ====
setpos -15616 0 448 0 0 0
waitms 800
screenshot p870_hint
waitms 2500

map bhop_wuyan
waitmap 120
waitms 6000
echo ==== F fade ====
setpos 8992 -5824 -4478 0 0 0
waitms 150
screenshot p870_fade
waitms 2500

map surf_s_t_a_t_i_o_n
waitmap 120
waitms 6000
echo ==== S shake ====
setpos -62 40 -470 0 0 0
waitms 500
screenshot p870_shake1
waitms 100
screenshot p870_shake2
waitms 2500

map bhop_eazy
waitmap 120
waitms 6000
echo ==== U sun ====
noclip
setpos 896 320 512 -20.2 19.4 0
waitms 1000
screenshot p874_sun_on
waitms 2500
vbsp_sun 0
waitms 300
screenshot p874_sun_off
waitms 2500
vbsp_sun 1
noclip

map surf_mom_training
waitmap 120
waitms 6000
echo ==== U2 sun without a target ====
noclip
setpos 0 0 64 -89 0 0
waitms 1000
screenshot p874_sun2_on
waitms 2500
vbsp_sun 0
waitms 300
screenshot p874_sun2_off
waitms 2500
vbsp_sun 1
noclip

map bhop_kiitovittu
waitmap 120
waitms 6000
echo ==== P ropes ====
noclip
setpos 144 4676 330 0 90 0
waitms 1000
screenshot p874_rope_on
waitms 2500
vbsp_ropes 0
waitms 300
screenshot p874_rope_off
waitms 2500
vbsp_ropes 1
noclip

map bhop_pokemans_xd
waitmap 120
waitms 6000
echo ==== A1 soundscape ss1 ====
setpos 384 512 40 0 0 0
waitms 1500
snd_report
waitms 300
echo ==== A2 soundscape ss2 ====
setpos 384 384 40 0 0 0
waitms 1500
snd_report
waitms 300
echo RUNLINES COMPLETE
quit
