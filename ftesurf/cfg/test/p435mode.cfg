// cfg_save_auto 0 FIRST: this run sets archived cvars and must never write them
// into ftesurf.cfg (cl_main.c:2535).
cfg_save_auto 0

// ===========================================================================
//  P435MODE -- does the HOP launder a prespeed start-box load on a NON-bhop map?
//    python tools/p435pre.py --mode        (no zones fixture, this cfg)
//
//  p435hop.cfg measured the hop on bhop_eazy in bhop mode and it does NOT
//  launder: the jump STARTS the run first (the save restored ARMED), and
//  SV_TimerTryArm's bhop branch refuses to arm an attempt that is already
//  RUNNING, so no SV_TimerArm runs and the load's TF_SEGMENT|TF_PRACTICE stands
//  (`practice 1`, `segmented`, `jumps 1`).  That refusal is gated on
//  `run_t_bhopjump`, which SV_TimerMapInit derives from `serverkey("gamemode")`
//  and sets ONLY for mode bhop / bhop-hl1.  On a surf or kz map there is no
//  deferral: an entry edge into a START arms outright, even from RUNNING --
//  Patch 415's own essay says so ("on a surf map re-entering one while running
//  ARMS you outright").
//
//  SO THE QUESTION THIS ARM EXISTS TO ANSWER: on the maps where state.txt's
//  `origin %.4f` puts the placed body below its zone's bottom (so Build 47's gate
//  cannot fire and Patch 435's row-speed condition is never reached), does an
//  airborne edge from a hop arm and launder the load's taint -- leaving a CLEAN
//  attempt carrying the save's speed?  bhop_eazy's start region is one of those
//  (bottom 64.03125, placed 64.0312), so this cfg runs the SAME map and the SAME
//  two fixtures as p435hop with `sv_gamemode surf` forced, which is the one input
//  to run_t_bhopjump.  The zone table and the rounding are unchanged; the start
//  rule changes with the mode (`start on leave` rather than `start on jump`), and
//  that line in `cmd timer` is the observable that the mode took.
//
//  ARMS
//   M1 SUBJECT: load the prespeed save (row 2, velocity 250) and hop.
//   M2 CONTROL: load the at-rest save (row 1) and hop the same way.
//
//  PRE-REGISTERED PREDICTIONS
//   M0 both arms: `cmd timer` reads `start on leave`, not `start on jump` -- the
//      mode took, so run_t_bhopjump is FALSE and the deferral is off.  If it
//      reads `start on jump`, sv_gamemode is locked (cvar_lockdefaults) and this
//      arm measured bhop mode again: NO VERDICT EITHER WAY.
//   ML THE LIFT, and the line that decides whether M1 measured anything: `viewpos`
//      read while +jump is held must show an origin z ABOVE the slab's bottom
//      64.03125 (the placed body sits at 64.0312, 5e-5 below it).  If z is still
//      64.0312 the jump never lifted the body -- the load clears FL_ONGROUND and
//      `jumps 1` in the phase clock counts the button, not the lift -- and M1's
//      verdict is "the subject never acted", not "the hop cannot launder".
//   M1 IF the residual is real: `practice 0`, `class: clean` -- the airborne entry
//      edge armed and SV_TimerArm zeroed the load's taint.  Then Patch 435 is a
//      PARTIAL fix and the BACKLOG item stays, narrowed to the rounding class on
//      non-bhop modes, with this as its measurement.
//   M1 IF it is not: `practice 1`, `class: segmented` on a non-bhop mode too --
//      then the hop cannot launder anywhere, the BACKLOG's "a hop beats that" is
//      dead on both modes, and the item can be deleted rather than narrowed.
//   M2 `practice 0`, `class: clean` -- an at-rest start-box load still arms clean,
//      which is Build 47's purpose and the control for M1: if M2 is tainted too,
//      M1's verdict says nothing about speed.
//  FALSIFIED IF M0 reads `start on jump` (no verdict), or ML's z never clears the
//   slab (the subject never acted, no verdict), or M2 is tainted (nothing here can
//   launder at all, so M1 cannot show one).
//
//  RESULT (2026-09-23, the Patch 435 build, driver exit 0).  THE RESIDUAL IS
//   REAL, and this arm is its measurement:
//     M0 `start on leave` -- sv_gamemode surf took, so run_t_bhopjump is FALSE
//        and SV_TimerTryArm's deferral is off.
//     ML z 106.9 against a slab bottom of 64.03125, horizontal 143.25 -- the body
//        WAS airborne inside the zone and still carrying the row's speed (250 bled
//        to 143 by the 120 ms of ground friction before the jump).
//     M1 `armed`, `arm zone 0 (armed from 0)`, `practice 0`, `class: clean` --
//        the airborne entry edge armed, and SV_TimerArm zeroed the load's
//        TF_SEGMENT|TF_PRACTICE.  A CLEAN attempt holding an inherited speed, on a
//        map where Build 47's gate cannot fire and so Patch 435's row-speed
//        condition is never reached.
//     M2 identical (`practice 0`, `clean`) -- the at-rest control launders too, so
//        M1's clean class is the arm doing its normal job and the speed is what
//        makes it a defect.
//   So the BACKLOG's "a hop beats that" is TRUE on a non-bhop mode and FALSE on a
//   bhop one (p435hop H2: the jump starts the run first and the deferral refuses
//   to arm a RUNNING attempt).  Patch 435 closes the regions where the gate fires;
//   this arm is the evidence that the rounding class on a non-bhop map is still
//   open, and it stays in BACKLOG with this cfg as its reproducer.
//   ONE PREDICTION WRONG: M2 was registered as `class: clean` and reads clean, but
//   the driver's first cut matched the report's `stage class: stitch` line for it.
//   The regex now anchors on `class: <word> (seg`.
log_enable 1
log_dir logs
log_name p435mode
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
sv_port 27664
sv_cheats 0
set run_resume 0
vid_fullscreen 0
waitms 5000
map bhop_eazy
waitmap 2400
waitms 3000
menu_restart
ui_close
waitms 1200

echo ==== M0 the mode this run resolved ====
cmd timer
waitms 700
cmd sl_list
waitms 800

echo ==== M1 SUBJECT: prespeed load, then a hop, non-bhop mode ====
cmd sl_goto 2
cmd sl_load
waitms 120
+jump
waitms 150
echo ---- ML the lift: origin z must be ABOVE the slab bottom 64.03125 ----
cmd viewpos
waitms 400
-jump
waitms 300
echo ---- M1 practice 0 / clean means the hop laundered it ----
cmd timer
waitms 700
cmd viewpos
waitms 600

echo ==== M2 CONTROL: at-rest load, then the same hop ====
cmd sl_goto 1
cmd sl_load
waitms 120
+jump
waitms 150
echo ---- ML2 the lift, same gesture on the at-rest save ----
cmd viewpos
waitms 400
-jump
waitms 300
echo ---- M2 practice 0 / clean, or M1 proves nothing ----
cmd timer
waitms 700
cmd viewpos
waitms 600

quit
