// Patch 273 -- the measurement that has to justify three separate claims, at the
// SAME vantages and yaws as t2perf.cfg / t2after.cfg so all three logs line up.
//
// POST-271 BASELINE (t2after.log, 13:58), surf_tensor2 spawn yaw 0:
//     Total refresh  3094.03us   "Framerate (refresh only)" 323.20
//     World walking  1677.50us
//     Server         1790.68us   <- OUTSIDE Total refresh; real frame ~4884us ~205fps
//     Draw indices   83013 ; recurse 0 -> 506 meshes, recurse 1 -> 20 meshes
//   Control surf_tensor: refresh 595.89, World walking 9.93, Server 37.93.
//
// THE THREE CLAIMS AND WHAT SINKS EACH:
//
//  1. THE COUNTER WAS LYING.  The new "Framerate (INCL. SERVER)" must read
//     ~205 at the tensor2 spawn while "refresh only" still reads ~323, and
//     "REAL frame" must equal Total refresh + Server to the microsecond.  If
//     the two framerates agree, RSPEED_SERVER is not what I think it is and
//     the whole premise of Part 1 is wrong.
//
//  2. THE MARK LOOP.  `mark over 300 frames` must print `index ON` and about
//     2 runs per frame at ~700 leaf visits each on tensor2 -- against 19846
//     available.  On surf_tensor STANDING STILL it should print ~0 runs,
//     because the vis cache hits there; that asymmetry IS the bug, stated as a
//     number.  And the [world] mesh counts must be IDENTICAL to t2after
//     (506 / 20).  Different meshes = the cull changed = the patch is wrong,
//     no matter what the framerate says.
//
//  3. THE SERVER BUCKET.  sv_perfdump splits it. The three rows plus whatever
//     is unaccounted must add up to r_speeds' Server row; if they do not, the
//     instrument is broken and its reading must be thrown away rather than
//     explained.  ticks/frame says how much of the average is one rare tick.
//
// r_fastsky 1 is the ZERO-CODE arm: R_DrawSkyroom returns at gl_warp.c:349
// BEFORE recurse+=1, so tensor2 runs one world pass and the one-slot cache
// becomes reachable. It isolates "two passes" from "the loop is slow".

developer 1
log_developer 1

vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000

cl_maxfps 0
cl_idlefps 0
cl_yieldcpu 0
sv_cheats 1

map surf_tensor2
waitmap 600
waitms 6000
echo ^5=== the [world] lines must still be recurse 0 -> 506, recurse 1 -> 20
echo ^5=== and `bucketed into` must have printed at load, and `mark over 300 frames`

r_speeds 2
waitms 2000
noclip
waitms 1000

// ---- A0: the headline, matched to t2after's A0 exactly --------------------
//
// A NAMED SUSPECT FOR THE SERVER BUCKET, and this vantage tests it.
// VBSP_HeadnodeVisible (mod_vbsp.c:5372) is a FULL recursive descent of the world
// node tree, entered from VBSP_EdictInFatPVS (:5467) for any entity whose
// pvscache.num_leafs is -1 -- which VBSP_FindTouchedLeafs sets (:4944-4947) when
// the entity's box touches >= MAX_TOTAL_ENT_LEAFS, storing headnode = topnode.
// For anything straddling the root plane topnode IS the root, so ONE such entity
// costs ~2 x 19846 node visits on tensor2 and nothing at all on a small map.
// That is the right SHAPE for a 47x gap: a presence/absence switch, not a ratio.
//
// It has TWO call sites and they land in DIFFERENT r_speeds buckets:
//   - sv_ents.c, per entity per client per server frame  -> `Server`
//   - the prop cull in VBSP_PrepareFrame (~:7093)        -> `World walking`
// so this run must not assume which. sv_perfdump's `Snapshot build` row answers
// the first; `prop_census`'s headnode counter answers the second. If BOTH are
// small the hypothesis is dead and the bucket is something else entirely.
// sv_perfdump RESETS what it prints, so every reading below is taken as a PAIR:
// the first call throws away the settling window (map load, shader compiles,
// the setpos itself), the second is the clean one.  Read the SECOND of each pair.
echo ^5=== A0 spawn yaw 0, shipped settings (was refresh 3094 / walk 1677 / server 1791)
setpos -11776 -13632 13720 0 0 0
waitms 2000
sv_perfdump
waitms 3000
echo ^5--- A0 sv_perfdump (THIS one counts)
sv_perfdump
waitms 300
prop_census
waitms 500
r_speeds_dump
waitms 500
screenshot p273_spawn_x
waitms 800
screenshot p273_spawn
waitms 800

// ---- A0F: same vantage, skyroom pass removed with no code -----------------
echo ^5=== A0F same spawn, r_fastsky 1 -- one world pass, cache reachable
r_fastsky 1
waitms 2000
sv_perfdump
waitms 3000
echo ^5--- A0F sv_perfdump (THIS one counts; server must NOT move -- renderer-only cvar)
sv_perfdump
waitms 300
r_speeds_dump
waitms 500
r_fastsky 0
waitms 1500

// ---- the stages, shipped settings ----------------------------------------
echo ^5=== D3 stage 3 (was 284 fps pre-271)
setpos -11136 -10475 8720 0 0 0
waitms 3000
r_speeds_dump
waitms 300

echo ^5=== D5 stage 5 (t2after: 449 fps refresh-only)
setpos 6624 -6955 11472 0 0 0
waitms 2000
sv_perfdump
waitms 3000
echo ^5--- D5 sv_perfdump (THIS one counts)
sv_perfdump
waitms 300
r_speeds_dump
waitms 500
screenshot p273_stage5_x
waitms 800
screenshot p273_stage5
waitms 800

// ---- A DENSE vantage, because the spawn flatters the cluster index --------
// The risk this patch carries is a map/vantage where MOST clusters are visible:
// there the bucket walk does the same leaf visits plus the byte tests plus an
// indirection, and could be SLOWER. The main END is the widest view on the map.
echo ^5=== D9 main END -- the dense-PVS check, walk must not be WORSE than t2after
setpos 15216 4096 -7088 0 0 0
waitms 3000
r_speeds_dump
waitms 500

// ---- the control: no sky_camera, so the cache hits and marks should be ~0 --
echo ^5=== F0 CONTROL surf_tensor (t2after: refresh 595.89, walk 9.93, server 37.93)
map surf_tensor
waitmap 600
waitms 6000
r_speeds 2
noclip
waitms 2000
sv_perfdump
waitms 3000
echo ^5--- F0 sv_perfdump (THIS one counts -- expect the whole thing near 38us)
sv_perfdump
waitms 300
prop_census
waitms 500
r_speeds_dump
waitms 1000

echo ^5=== END OF RUN ===
waitms 500
quit
