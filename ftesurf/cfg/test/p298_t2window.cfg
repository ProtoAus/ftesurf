cfg_save_auto 0
// Patch 298 -- THE TENSOR2 WINDOW, AT LEX'S OWN VANTAGE AT LAST.
//
// Two previous runs at this question were VOID because I guessed the camera
// (p297c: an enclosed rainy courtyard, no sky in frame at all; p297d: three
// vantages derived from sky-face centroids, one of which put the camera flat
// against a tiled wall).  This one is Lex's save011, taken while he was looking
// at the window with the fault on screen:
//     data/saves/surf_tensor2/save011/state.txt
//     origin -7563.2915 10425.6309 -974.1351   angles 1.9775 -0.3900
// So the fault is in frame BY CONSTRUCTION.  No derived geometry this time.
//
// THE REPORT: out this window CS:S shows near-solid blue fog with only the
// faintest smokestack silhouettes (screenshots/surf_tensor20000.jpg, read and
// confirmed).  FTESurf shows sharp near-BLACK buildings with distinctly black
// windows -- Lex's words, "bright black".
//
// WHAT IS ALREADY PROVEN, so this run does not re-ask it:
//   - the gamecode emits it and the renderer HOLDS it:
//     "Current skyroomfog 23.437500 ... bias 11.7188"
//   - r_fog_linear is 1 (cfg/default.cfg:1163), so `density` IS the fog END and
//     `depthbias` IS the START, and gl_warp.c:414 correctly skips the /64.
//   - nearest skyroom face 264u from the sky_camera, median 3510u, against an
//     end of 23.4u.  100% of it must be flat fog colour.
//   - R_DrawSkyroom runs here ("[world] recurse 1 ... 20 meshes in 2 batches").
//   - the hl2 VMT programs all carry `!!permu FOG` and call fog4().
//
// WHY THIS RUN IS A MAGENTA PROBE AND NOT AN ON/OFF TOGGLE.  An on/off A/B only
// answers "did the frame change".  Painting the fog a colour that exists nowhere
// on this map answers the far more useful question: WHICH PIXELS ARE RECEIVING
// SKYROOM FOG AT ALL.  That distinguishes "the fog reaches the buildings but the
// numbers are too weak" from "the fog never reaches them", which are different
// bugs in different files.
//
// THE CONTROL IS r_fastsky, NOT vbsp_skyroom.  gl_warp.c:371 `if
// (r_fastsky.value) return false;` aborts R_DrawSkyroom outright, and it is a
// live cvar.  vbsp_skyroom 0 is INERT mid-map -- the QC sets VF_SKYROOM_CAMERA
// once in CSQC_WorldLoaded and cannot retract it -- which is a trap I have
// already walked into once on this exact question.
//
// PRE-REGISTERED READ-OUTS.  Judged against A4/A6, the two repeat controls.
//   A2 (end 1u, magenta) paints the buildings MAGENTA
//       -> skyroom fog reaches them.  The bug is then the MATH: our 23.4375 /
//          11.7188 produce too little fog.  Next stop is the linear blend in
//          gl_backend.c:5385.
//   A2 leaves the buildings UNCHANGED, but A7 floods the main view GREEN
//       -> the fog path works this frame and the skyroom surfaces simply never
//          see r_refdef.globalfog.  The bug is the handoff at gl_warp.c:388-415.
//   A2 paints the sky dome but NOT the buildings
//       -> fog reaches some surface types and not others; a material/program
//          split, and "bright black buildings against fogged sky" is exactly
//          what that looks like.
//   A5 (r_fastsky 1) must REMOVE the buildings.  If it does not, they are not
//          skyroom geometry at all and every reading above is about the wrong
//          object -- this is the run's own validity check, and it is the one
//          thing both previous attempts lacked.
//   A7 must flood the frame green.  If it does not, the fog path is dead at this
//          vantage and NOTHING else in this run means anything.
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000
wait 200

developer 1
log_developer 1
log_enable 1
log_dir logs
log_name p298_t2window
cl_maxfps 0
cl_idlefps 0
sv_cheats 1
con_notifylines 0
con_notifytime 0.01
r_drawviewmodel 0

map surf_tensor2
waitmap 600
waitms 9000
waitms 3000
noclip
waitms 1000

// Lex's save011, verbatim from state.txt.  Re-issued before every screenshot so
// no arm can silently inherit a drifted camera.
alias vwin "setpos -7563.2915 10425.6309 -974.1351 1.9775 -0.39 0; waitms 2000"

vwin
echo ^5=== VANTAGE: save011, the window with the fault in frame
fog
skyroomfog
shader_here

// ---- A1: exactly what Lex sees ----
echo ^5=== A1: shipped defaults
vwin
screenshot p298_a1_default

// ---- A2: skyroom fog MAXIMISED and MAGENTA (end 1u, start 0) ----
// Every skyroom surface is >=264u away, so all of it is past a 1u end.
// Anything that is NOT magenta here is not receiving skyroom fog.
skyroomfog 1 1 0 1 1 0
echo ^5=== A2: skyroomfog end 1u, MAGENTA -- names every skyroom-fogged pixel
vwin
screenshot p298_a2_magenta_max

// ---- A3: magenta at the map's REAL distances ----
// Same colour, the numbers the map actually asks for.  A3 vs A2 is how much of
// the fog the real numbers are delivering.
skyroomfog 23.4375 1 0 1 1 11.7188
echo ^5=== A3: skyroomfog MAGENTA at the real 23.4375 / 11.7188
vwin
screenshot p298_a3_magenta_real

// ---- A4: restored -- repeat control for A1 ----
skyroomfog 23.4375 0.160784 0.258824 0.352941 1 11.7188
echo ^5=== A4: restored -- repeat control for A1
vwin
screenshot p298_a4_repeat

// ---- A5: skyroom not drawn at all (validity check) ----
r_fastsky 1
echo ^5=== A5: r_fastsky 1 -- R_DrawSkyroom returns false at gl_warp.c:371
vwin
screenshot p298_a5_noskyroom

// ---- A6: skyroom back -- second repeat control ----
r_fastsky 0
echo ^5=== A6: r_fastsky 0 -- second repeat control
vwin
screenshot p298_a6_repeat2

// ---- A7: MAIN-VIEW fog, green, end 1u -- proves the fog path is alive ----
// Last, so nothing needs restoring.  Everything that stays un-green is sky or
// skyroom, which also gives an independent second reading of A5.
fog 1 0 1 0 1 0
echo ^5=== A7: main fog end 1u GREEN -- whatever stays un-green is sky/skyroom
vwin
screenshot p298_a7_mainfog_green

echo ^5=== END OF RUN ===
waitms 500
quit
