// cfg_save_auto 0 FIRST: this run sets archived cvars and must never write them
// into ftesurf.cfg (cl_main.c:2535).
cfg_save_auto 0

// ===========================================================================
//  P438VIEW -- the evidence sidecar's cold reload must not cost seconds.
//    python tools/p438view.py           (generates the .view, runs, compares)
//
//  THE DEFECT (BACKLOG, Patch 431 review).  cl_replay.qc's Rec_ViewLoaded reloads
//  the run's `.view` with buf_loadfile, which splits with VFS_GETS -- one VFS_READ
//  per byte -- and Windows memory-maps only files up to 5 MB (fs_win32.c:480).
//  Above that every byte is a ReadFile.  Patch 431 measured the same shape on a
//  `.rec`: 13.4 s for surf_rookie's 6.7 MB, and moved the viewer to FILE_READ
//  (34 ms) but left this one, calling it evidence code.  It is not only evidence
//  code: this is the CLIENT's frame, during a save-load, and a sidecar is 2.93 KB
//  per second of run -- a ten-minute attempt is ~1.8 MB and an hour is ~10 MB, so
//  the cap is reachable by a long run rather than by a corner case.
//
//  THE FIX.  Watch_BufLoad, Patch 431's own speller: FILE_READ loads the file
//  whole on the first fgets and splits it in memory.  Same buffer, same blank-line
//  rule, same size.  cl_replay.qc compiles before cl_watch.qc, so it takes a
//  prototype rather than a move.
//
//  PATCH 441 made the reload line a dprint -- it was a plain print on a path every
//  save-state rewind takes, i.e. console spam in a player's game -- and gated
//  `sl_replay` on sv_cheats (arm R1g below).  This cfg already sets `developer 1`
//  and `log_developer 1`, so it reads the line exactly as before.
//
//  THE SUBJECT IS A GENERATED FILE, AND THE DRIVER OWNS IT.  No file in data/ is
//  over the cap and a run long enough to make one is not scriptable, so
//  tools/p438view.py writes one from the real header and the real line shape into
//  C:\FTESurf\p438view\save901\run.view and points cl_saveroot at that directory
//  (it has to be inside the basedir: the client's file layer cannot reach %TEMP%).
//  Nothing in data/ is touched, and the generated bytes are kept for the
//  comparison at the end.
//
//  THE LINE COUNT IS THE DELIVERABLE, AND THE ROUND TRIP IS NOT MEASURED.  A load
//  puts the file into rec_rp_view and the reader's own dprint reports how many
//  lines it got, which is what says the read was complete rather than fast and
//  truncated.  R2 below was meant to write the buffer back out through
//  Rec_ViewSaved and have the driver compare the bytes -- but that comparison read
//  the file the DRIVER generated, i.e. it compared one file with itself, and a run
//  kept with --keep shows the client writes no sidecar there at all (only
//  `data/p438view/save<n>/seq.txt` and the server's state.txt).  Patch 441 made the
//  driver say NOT MEASURED instead of printing a pass for it.  The gesture is left
//  in place because it is also what exercises the save path after a big read.
//
//  ARMS
//   R0 a real run, so the sidecar buffer EXISTS: `zone_goto 0` into the start box
//      and `+forward` out of it, WALKING.  A jump out is the wrong gesture on this
//      map: `run_rearmhop 1` re-arms the start on the first one and the second is
//      read as a hopped start, which the start rule refuses -- both measured.
//      Rec_ViewLoaded is called only for a
//      load event the client may act on (`rec_rp_slseq != 0 || seq == 1`), and a
//      save/load outside a run produces no sidecar at all -- so without this the
//      reader is never reached and the arm measures nothing.
//   R1g PATCH 441 GATED `sl_replay` ON sv_cheats, and this arm is that gate: the
//      same command, once with cheats off.  It must be REFUSED, in its own words,
//      with no cold-reload line behind it.  The reason is this arm's own subject --
//      the event `sl_replay` fires is the one Rec_ViewLoaded acts on, and that
//      TRUNCATES the live sidecar to the slot's remembered mark or REPLACES the
//      buffer from the slot's file, so ungated it let any client drop its own angle
//      evidence mid-run without taking a save.  Every configuration where the
//      command still works is one where the run does not rank (run_cheatwatch 1
//      taints it; 0 makes every run practice).
//   R1 the cold load: `cmd sl_replay 901`.  NOT `sl_load`: the client's save root
//      is stuffed from the server's own `data/saves/<map>`, so a real save cannot
//      read the driver's 6 MB file at all -- and the server stuffs the root back
//      over any `+set` a harness tries.  `sl_replay` (Patch 438, sv_saveloc.qc) is
//      the handle this arm needs: it fires SLOP_LOADED for an absolute slot and
//      nothing else -- no placement, no clock, no row, no state file -- charged
//      like any other sl_ command.
//   R2 the write-back: `cmd sl_goto 901; cmd sl_save`, which writes state.txt and
//      the sidecar from the buffer the load just filled.
//
//  PRE-REGISTERED PREDICTIONS
//   R1g `save: sl_replay needs sv_cheats 1`, and NO `p438 cold reload` line in
//      that section.  On a pre-441 build the command is accepted and the reload
//      line appears with cheats OFF, which is the defect.
//   R1 `p438 cold reload took N ms for L lines` with L the generated line count
//      and N inside the driver's budget (2000 ms at 5.6 MB).  The control build
//      reads the same file with buf_loadfile and its N is the measurement this
//      patch exists for; Patch 431's 13.4 s for 6.7 MB of .rec is the scale to
//      expect.
//   R1b the SAME READER on a 1.6 KB sidecar (slot 902): under a millisecond, and
//      the control that says a failure at R1 would have been the file rather than
//      the path.  It is also how the harness found that FS_LoadFile locates with
//      FS_GAME, so a scratch path outside the gamedir opens nothing at all and
//      fopen returns -1 with no "Access denied" line -- which reads as a reader
//      bug and is a path bug.
//   R2 NOT MEASURED -- see above; the driver reports it rather than grading it.
//   No QC fault.  The old check for this could never fire: it looked for the string
//      `QC error`, which the engine never prints -- 0 hits across all 1550 logs in
//      ftesurf/logs, while PR_StackTrace's `<file>.qc:<line>: <name>` frame line
//      hits the 9 that hold a real fault.  Patch 441 grades that shape instead.
//   And no `replay: angle sidecar hit the N-line cap` (FS_VIEWMAX is
//      above the generated count; if it prints, the file was too big and the count
//      comparison is meaningless).
//  FALSIFIED IF R1 prints no line at all (the load never reached the reader, so
//   the arm measured nothing), or the line count differs, or the written file
//   differs, or R1's ms is over budget on the fixed build.
//
//  RESULT (2026-09-23, both arms run, driver exit 0 each way).  Same generated
//  file, same bytes back out, 130x apart:
//                        control (HEAD's cl_replay.qc)   fixed
//    R1 cold reload      11971 ms / 11920 ms             92 ms / 82 ms / 113 ms
//    R1 lines read       193162                          193162
//    R2 file on disk     byte-identical                  byte-identical
//   So the reader is the whole of the difference and it costs 6 MB a frame in the
//   control build -- about 40 s of client frames at the 100 fps this harness runs,
//   which is the stall the BACKLOG item describes.  Both spellings count the same
//   193162 lines (4 header + 193158 samples): buf_loadfile's `while (VFS_GETS)`
//   stops at EOF and Watch_BufLoad's fgets loop stops at the file size, so the
//   round trip is byte-identical either way and the count comparison proves the
//   read is complete rather than proving the spellings differ.
//   THREE RUNS THIS ARM GOT WRONG BEFORE IT MEASURED ANYTHING, all recorded
//   because each one is a trap the next reader will hit:
//    - `cmd sl_load` cannot reach a scratch path: the server stuffs
//      `set cl_saveroot "data/saves/<map>"` back over any `+set`, so the harness
//      needs `sl_replay <slot>` (Patch 438, sv_saveloc.qc), which fires the load
//      event for an absolute slot and nothing else.
//    - A sidecar only exists inside a run, and starting one on surf_4am takes a
//      WALK out of the start box: `run_rearmhop 1` re-arms on the first jump out
//      and the start rule refuses the second ("hopped start"), and the box runs to
//      y 64 while a straight walk stops at y 96 -- `+right` alone only turns.
//    - The scratch directory has to be inside the GAMEDIR (FS_GAME), not the
//      install root and not %TEMP%.
log_enable 1
log_dir logs
log_name p438view
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
sv_port 27668
sv_public 0
sv_cheats 0
set run_resume 0
waitms 5000
map surf_4am
waitmap 3000
waitms 3000
menu_restart
ui_close
waitms 1200

echo ==== R0 a real run, so a sidecar exists to reload ====
zone_goto 0 90 0
waitms 2000
cmd viewpos
waitms 500
// WALK OUT, DO NOT JUMP.  surf_4am's start region spans x 256..1472 y 64..780 at
// z 14144..14400 and the placement lands at 608 592 14144, so the yaw is aimed at
// the box's edge and +forward alone leaves it.  A jump out is the WRONG gesture:
// `run_rearmhop 1` re-arms the start on the first one ("start re-armed -- one jump
// out of the start") and the second is read as a hopped start, which the start rule
// refuses (`hopped start -- one jump out of the start, or walk out`).  Measured
// both ways before this line was written.
+forward
waitms 2500
-forward
waitms 500
cmd viewpos
waitms 500
// The walk stopped at y 96, inside a region that runs to y 64 -- 32 units short
// of the leave edge, and `start: ok 0` says so.  +right alone only TURNS (the body
// stayed at y 96 while the yaw went -90 to -143.7), so the last stretch is both
// keys at once.
+right
+forward
waitms 1500
-right
-forward
waitms 500
cmd viewpos
waitms 500
echo ---- R0 must read running / recording 1, or R1 reaches no reader ----
cmd timer
waitms 700

echo ==== R1g THE GATE: the same command with sv_cheats 0 ====
cmd sl_replay 901
waitms 900
// And now the switch the harness handle needs.  It taints this run (cheatlatch),
// which costs this arm nothing: what follows measures a READER and a round trip,
// and a load has already made the run practice.
sv_cheats 1
waitms 500

echo ==== R1 the cold load: the reader, timed ====
cmd sl_replay 901
waitms 3000
echo ==== R1b THE SAME READER ON A 1.6 KB SIDECAR ====
cmd sl_replay 902
waitms 2000

echo ==== R2 the write-back: the same bytes out again ====
cmd sl_goto 901
cmd sl_save
waitms 5000

quit
