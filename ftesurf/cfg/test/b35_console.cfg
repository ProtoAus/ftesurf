// Console interaction/rendering regression:
//   * completion count before and after Down selects a row
//   * unchanged/changed cvar values in the dropdown
//   * closed floating-console output at top-left in the 8px notify font

log_enable 1
log_name b35_console
cfg_save_auto 0
developer 0
vid_fullscreen 0

wait 200
map surf_null
waitmap 240
wait 60

con_window 1
con_window_rect "240 180 800 480"
con_displaypossibilities 2
con_completiondown 1
con_completionrows 12
cl_c2sdupe 0

toggleconsole
wait 20
con_settext cl_c
waitms 750
screenshot b35_clc_unselected

// The harness sends one physical Down key during this gap.
waitms 2500
screenshot b35_clc_selected_default
waitms 300

cl_c2sdupe 2
waitms 300
screenshot b35_clc_selected_changed
waitms 300

con_settext
toggleconsole
clear
con_notifylines 6
con_notifytime 1
con_notifyfade 2
con_notify_x 0
con_notify_y 0
con_notify_w 1
echo notify-line-one
echo notify-line-two
echo notify-line-three
waitms 100
screenshot b35_notify_fresh
waitms 1400
screenshot b35_notify_fading
waitms 2500
screenshot b35_notify_expired

cl_c2sdupe 0
echo === b35 done ===
wait 20
quit
