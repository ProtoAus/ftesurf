// Patch 882 recording arm: a timed run on surf_affliction's lody bonus (!b 5), whose start
// and end both sit inside the bhop-limit trigger *141 (cool 0.2).  Walk out of the start,
// then hold +jump; the walk falls off and the run fails back into the start (~2 s), and the
// failed attempt (data/parts/0-fail.rec, streamed: rec_stream 1) is replayed in this session --
// it is deleted when dropped, so there is no `quit`: the harness times the client out and the
// part stays in the retained rig for p882rec2.cfg.  Grade: its pin carries momlimit=64 momcool=0.2 at pmsrcver=10 and
// pm_recsim says `pin 73/73 ... EXACT REPLAY` with the open loop never past 1u.  The server
// prints `momlimit <name>: limit 64 slide 0 cool 0.2`.
//   python tools/runlines_smoke.py ftesurf/cfg/test/p882rec.cfg --mount --timeout 400 \
//     --ssqc <qwprogs> --csqc <csprogs> --mqc <menu> --client <exe> --output-dir <task root>/artifacts
cfg_save_auto 0
log_enable 1
log_dir logs
log_name runlines_smoke
con_notifytime 0
cl_idlefps 0
cl_maxfps 100
vid_vsync 0
vid_fullscreen 0
vid_width 1280
vid_height 720
sv_public 0
set run_resume 0
set rec_stream 1
developer 1
log_developer 1
waitms 1500

map surf_affliction
waitmap 120
waitms 6000
menu_restart
ui_close
waitms 500
echo ==== R1 lody bonus start ====
say !b 5
waitms 2500
cmd viewpos
cmd timer
waitms 300
echo ==== R2 walk out, then hold jump ====
setpos -8320 15104 12700 0 225 0
waitms 1500
+forward
waitms 1500
cmd timer
+jump
waitms 3000
-jump
-forward
waitms 500
cmd timer
cmd viewpos
waitms 500
echo ==== R3 replay the failed attempt while it is kept ====
pm_recsim data/parts/0-fail.rec
waitms 3000
echo RUNLINES COMPLETE
waitms 600000
