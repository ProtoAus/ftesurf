// Build 66 step 3, verified against a REAL DEDICATED SERVER on the machine it
// ships to, rather than against a listen server pretending to be a lobby.
//
// Everything up to here has been measured on Windows, in one process, with the
// client and the server sharing a disk.  Three of the claims step 3 makes are
// not testable that way and each has bitten this project before:
//
//   1. THE ENGINE.  Streaming is fopen mode 9 (Patch 316) and the Pi's server
//      binary was built on 7 September, forty-seven patches before it.  On an
//      engine without the patch the open fails and NOTHING IS RECORDED -- a
//      safe failure and a silent one.  So the arm that matters is: a freshly
//      built aarch64 binary, on the Pi, writing a file.
//   2. THE DISK.  A lobby's .rec lands on the SERVER's disk.  On a listen
//      server that is the same disk as the client's and every path in the code
//      is satisfied by accident.  This is the first time the two are different
//      machines.
//   3. THE CLIENT'S TWO GATES.  Turning the recorder on for lobbies changes
//      what the CLIENT does, in two places that have nothing to do with the
//      recorder: Rec_ViewEnd would start writing an 800 KB sidecar per finish
//      that pairs with a .rec on another continent, and cl_lobbytime's writer
//      would STOP putting lobby times in the Local tab, because its gate reads
//      LS_NOREC and that bit has just changed meaning.  Both are silent, both
//      are on the player's own machine, and neither can be seen from a listen
//      server -- Rec_ServerIsRemote returns FALSE there by construction.
//
// PREDICTION:
//   on the Pi      data/runs/bhop_eazy/main/<slug>-<8 hex>_cheat.rec exists and
//                  the server log says `timer: streamed ...`
//   on this PC     NO .view anywhere under data/runs (gate 3a), and the lobby
//                  time stub `<ticks>_lobby.rec` IS written (gate 3b)
//
// FALSIFIED IF: the server log says "cannot stream to" (the binary is not the
// patched one, or mode 9 regressed on aarch64); or the file has no player
// segment (the GUID did not survive a real network connect -- it is computed
// against the server's sv_guidkey and this is the first time that path has been
// exercised); or a .view appears here; or no _lobby.rec appears here.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name b66pi
log_developer 1
developer 1

cl_sendguid 1
name "^3Lex On The Pi"

// A scripted `connect` leaves the menu up; that blanks CSQC panels but does not
// affect the run, and nothing here draws.
waitms 6000
connect 192.168.1.102:27599
waitms 12000

echo ^5==== b66pi: connected ====
cmd timer
waitms 1500

// The same flight as b66who: zone_goto arms in the start box, setpos pins only
// the heading, noclip makes it continuous movement so the end zone is swept for
// real.  Cheats are available because the test server runs one slot.
// EVERY WAIT IS LONGER THAN b66who's, and that is not padding.  These are
// forwarded client commands crossing a real network to a real server: zone_goto,
// setpos and noclip each take a round trip before the state they set is the
// state the next command acts on, and +forward held for b66who's ten seconds
// left one run 897 ticks in and STILL RUNNING -- a flight that started before
// its heading had landed and never met the end zone.  A test that ends mid-run
// does not fail, it reports nothing, which is the worse of the two.
cmd zone_goto 0
waitms 2500
setpos -352 -352 144 0 335.3 0
waitms 2500
noclip
waitms 1500
+forward
waitms 9000
cmd timer
waitms 9000
-forward
waitms 2500

echo ^5==== b66pi: after the end zone ====
cmd timer
waitms 3000

echo ^5==== b66pi: done ====
quit
