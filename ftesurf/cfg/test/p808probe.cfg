// Patch 808 probe: the rewind after surf_dune's fail teleport put the run back in
// its start (Patch 775 re-arms it). Is the failed attempt's line still there to
// rewind, and what does an S save on it make?
cfg_save_auto 0
name P808
fs_cache 0
log_enable 1
log_dir logs
log_name p808probe
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
waitms 3000
connect 127.0.0.1:27561
waitmap 60
waitms 8000
menu_restart
ui_close
hud_trail 1
hud_trail_prev 1
rec_savelock 1
cl_slpredict 1
waitms 1000
cmd zone_goto 0
waitms 400
+forward
waitms 2800
-forward
waitms 800
echo ==== PROBE AFTERFAIL ====
cmd timer
cmd viewpos
trail
rewind
waitms 150
rewind
waitms 500
rewind status
echo ==== PROBE SAVE ====
rewind seek -0.6
waitms 200
rewind status
rewind key 115
waitms 300
rewind key 115 up
waitms 1200
rewind status
saveloc
echo ==== PROBE LOAD ====
+sl_hold
waitms 900
saveloc
cmd timer
trail
-sl_hold
waitms 300
trail
cmd timer
echo ==== PROBE END ====
waitms 500
quit
