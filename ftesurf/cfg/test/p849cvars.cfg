// Patch 849: r_budget/r_frametime are registered once. Each renderer start used to re-register
// them and print "Can't register variable ..., already defined" six times.
// <exe> -basedir C:\FTESurf -manifest C:\FTESurf\default.fmf -window +exec cfg/test/p849cvars.cfg
// Control: the same against an exe before 849 must print the six lines after each restart.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p849cvars
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
vid_winmaximize 0
vid_width 1280
vid_height 720
waitms 2000
echo ==== P849 vid_reload ====
vid_reload
waitms 3000
echo ==== P849 vid_restart ====
vid_restart
waitms 4000
echo ==== P849 registered ====
cvarlist r_budget
cvarlist r_frametime
echo ==== P849 done ====
waitms 500
quit
