// Patch 419 -- IS THE STARTING OFFSET PREDICTABLE?  Arm A (server on 27696).
//
// `run_startjitter 2` moves the start box by up to two units so a run cannot be
// replayed from a known start.  The offset is drawn with QuakeC `random()`,
// which is `(rand()&0x7fff)/0x8000` with `rand()` seeded ONCE from `time(0)` at
// COM_Init (common.c) -- so two servers that boot in the same second draw the
// same stream, and the `startjit` line in their recordings is the same pair of
// numbers.  The run nonce (Patch 416) is mixed from the same stream.
//
// This arm and p419b.cfg are the same run against two servers STARTED IN THE
// SAME SECOND on two ports.  Start them together, from C:\FTESurf:
//   C:\FTEQuake\fteqwsv64.exe +set sv_port 27696 +set sv_public 0 +set sv_cheats 1
//     +set rec_enable 1 +set rec_runarchive 1 +set developer 1
//     +set log_enable 1 +set log_dir logs +set log_name p419sva +map bhop_eazy &
//   C:\FTEQuake\fteqwsv64.exe +set sv_port 27697 ... +set log_name p419svb +map bhop_eazy &
// then this cfg, copy the .rec away, then p419b.cfg.
//
// PRE-REGISTERED PREDICTIONS (before the fix)
//  J1  both recordings carry `startjit 2.0000 <dx> <dy> 0.0000` with THE SAME
//      dx and dy.  That is the leak: the offset is a pure function of the boot
//      second, and a player who knows it knows where the box will be.
//  J2  the two `nonce` lines DIFFER anyway -- the seed mixes sv_port, which the
//      two servers do not share.  Stated so the arm cannot be read as "the
//      nonce is fine because it differs": it differs for a reason that has
//      nothing to do with entropy.
// FALSIFIED IF the two startjit offsets differ on the pre-fix build; then the
//   stream is not shared and the leak is somewhere else.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p419a
developer 1
cl_idlefps 0
cl_maxfps 100
set rec_enable 1
set rec_hid 0
set rec_upload 0
name "^3P419A"

waitms 5000
connect 127.0.0.1:27696
waitms 12000

echo ================================ P419 A -- cross the start line
cmd zone_goto 0
waitms 1500
setpos -352 -352 144 0 335.3 0
waitms 1500
+jump
waitms 700
-jump
waitms 2500
cmd timer
waitms 1500

echo ================================ P419 A -- fly to the end zone so the .rec is written
noclip
waitms 500
+forward
waitms 1500
waitms 2900
waitms 2000
-forward
waitms 1500
cmd timer
waitms 2500

echo ================================ P419 A done
quit

// RESULT (2026-09-21).  J1 IS FALSIFIED AND THAT IS THE FINDING.
//
//   Two servers started in the same second (10:06:06, ports 27696/27697), same
//   scripted run against each:
//     A  startjit 2.0000  0.9614  1.5100   nonce 80d0720871577...
//     B  startjit 2.0000 -0.4312 -0.5104   nonce 03ff809503fe3...
//   DIFFERENT offsets -- but "the attack does not exist" is NOT what that
//   shows, and the first version of this block said it anyway.  A second
//   reviewer checked the premise instead of the conclusion: `srand(time(0))` at
//   common.c:6861 is the ONLY live seeding in a dedicated server (zone.c's is
//   behind a debug ifdef, sv_master.c's runs only when Sys_RandomBytes FAILS,
//   and it demonstrably did not), and both servers really did boot in the same
//   second -- logs/p419sva.log and p419svb.log both stamp 10:06:04.  So the two
//   processes shared a seed and still produced different offsets, which leaves
//   exactly one explanation: THEY WERE AT DIFFERENT STREAM POSITIONS, because
//   the arm ran the two clients sequentially and the mod draws random() on
//   events the script does not control (a connection, a spawn, a map timer).
//   Draw position is this arm's uncontrolled variable.  The honest verdict is
//   NOT DEMONSTRATED, and the weakness is probably real -- which argues FOR the
//   patch, not against it.  J2 held, for the stated uninteresting reason.
//
//   THE STRONGER ATTACK DID NOT REPRODUCE EITHER.  `startjit`'s two values are
//   consecutive `random()` draws (sv_timer.qc: off_x then off_y), and
//   PF_random is `(rand()&0x7fff)/32768 + 0.5/32768`, so each printed value
//   names its draw to +-1 count.  Inverting the pair and brute-forcing the 17
//   unknown bits of an msvcrt LCG state (the low 16, plus bit 31, which the
//   output drops) gives 10 candidates.  10 is what the +-1 TOLERANCE on both
//   observations produces -- roughly 3x3 spellings of one true state -- so the
//   count neither confirms nor refutes the model.  Rolling each candidate
//   forward 3,000,000 draws did not place the NEXT run's pair (same server
//   process) anywhere in the stream.  Three runs, same server: (0.9614,
//   1.5100), (1.6249, -1.7158), (-1.2833, 0.7637).  A negative from a search
//   whose model was never confirmed is weak evidence, and it is recorded as
//   that rather than as an all-clear.
//
//   So the plan's retraction -- "the draw count is published, therefore the
//   stream is recoverable" -- is not supported by measurement.  A published
//   output names ITS OWN draw; it does not say how many draws happened since,
//   and between two runs on an idle server that number is larger than three
//   million or the generator is not the LCG the arithmetic assumed.
//
//   PATCH 419 IS MADE ANYWAY, and the reason is cost rather than proof: the
//   engine already has `Sys_RandomBytes` for master-server challenges, two
//   builtins expose it to the server VM, and the question stops being one.
//   A claim that rests on "nobody managed it in an afternoon" is not the claim
//   this layer wants to make about the rule that exists so a run cannot be
//   planned against a known start.
//
//   POST-FIX (10:18-10:42, logs/p419fix.log and p419final.log):
//     J3  `timer: randomness from the OS (Patch 419)` once, and zero degraded
//         prints.
//     J4  four consecutive runs: (-1.7104, -0.6400), (1.3246, 1.3000),
//         (1.0783, 0.4673), (1.8389, -1.0794).  All inside +-2.
//     J5  the recording still verifies: `reccheck` ok on the .rec AND its
//         .view, 0 faults, and `VERIFY ... PASS ticks 829 rows 815` on
//         re-simulation -- the offset is recorded and replayed exactly as
//         before, only its source moved.
//
//   AND THE DEGRADED BRANCH IS MEASURED TOO, because the first cut of this
//   block asserted it without running it.  Rebuilt with the two builtins
//   UNREGISTERED -- which is exactly the rollout case, new progs on an engine
//   older than 419 -- and ran the same arm with `developer` unset
//   (logs/p419old.log, 10:39):
//     `timer: NO OS RANDOMNESS -- the start jitter and the run nonce are drawn
//      from random(), whose published offsets each name their own draw.  Patch
//      419 is not in force on this engine.`
//   once, at normal verbosity, and the run still recorded
//   (`startjit 2.0000 0.6923 1.1326`).  Before the review that branch was
//   UNREACHABLE: the latch it tested is a progs global that loads as 0, which
//   was the same value the branch set, so the one case the message exists for
//   said nothing at all while the healthy case announced itself.
//
//   The arm now leaves its own evidence: SV_RecOpen dprints `timer: startjit
//   <u> <dx> <dy>`, so a future run of this fixture is readable from the log
//   without keeping a copy of the .rec.
