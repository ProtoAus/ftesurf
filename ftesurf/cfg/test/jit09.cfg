// ***************************************************************************
//  BUILD 47 / ENGINE PATCH 269b -- REACHING THE FRAMERATE AT LAST.
//
//  EVERY capture in this investigation has been run below the regime it was
//  about, and I did not notice until the user said "uncap it, it works best at
//  12000".  The numbers:
//
//      jit01   200 fps     (cl_idlefps capped an unfocused window)   -- known
//      jit05   ~1270 fps   19 rendered frames per command
//      jit06   ~1270 fps   19
//      jit07    340 fps    5   (deliberately -- the archived cl_maxfps)
//      jit08   ~1370 fps   20.6, UNCAPPED at 320x240 -- and still 1370
//
//  jit08 is the tell.  Uncapped, at a quarter of a quarter of the resolution,
//  it landed on the same ~1300 as jit05.  That is not a rendering limit, it is
//  a sleep: cl_yieldcpu gives the CPU up between frames, and the user's own
//  ftesurf.cfg says so in the cl_maxfps description -- "Set cl_yieldcpu 0 if
//  you're trying to benchmark."  So every "verified fixed" result so far was
//  taken at a tenth of the user's framerate, and the defect is defined by how
//  many rendered frames share one command.
//
//  cl_yieldcpu 0 is the whole point of this file.  log_developer is OFF: the
//  dump uses Con_Printf, not DPrintf, so nothing is lost, and per-frame
//  developer prints are exactly the console traffic that throttles a capture.
//
//  The dump is now one line per record instead of five -- jit08's five-line
//  form took 100 seconds for 4096 records and ran off the end of the script's
//  waits, which is how that run died mid-capture.
//
//  READ frames/cmd IN EVERY SECTION FIRST.  Below ~100 this file has failed to
//  do the one thing it exists to do, and a clean result from it means nothing.
// ***************************************************************************

log_developer 0

waitms 2000

map surf_colin_blaster_69000
waitmap 240
wait 60

cl_yieldcpu 0           // <-- THE POINT.  Removes the inter-frame sleep.
cl_maxfps 0
cl_idlefps 0
cl_netfps 66.6667
hud_predicted 1
hud_update -1
hud_round 1
hud_debug 1
hud_speed 1
hud_strafe 1
cl_predict_velblend 0
wait 200

echo ^5=== framerate reached, WITH cl_yieldcpu 0.  Read before anything else.
show_fps 1
waitms 3000

// ---------------------------------------------------------------------------
echo ^5=== 1: UNTOUCHED CONTROL at the real framerate.  Never pressed a key.
// ---------------------------------------------------------------------------
cl_predtrace 3000
waitms 25000

// ---------------------------------------------------------------------------
echo ^5=== 2: THE REPRODUCTION.  Tap +forward, release, wait 1s, trace.
// This is the section the whole investigation now rests on.
// ---------------------------------------------------------------------------
+forward
waitms 400
-forward
waitms 1000
cl_predtrace 3000
waitms 25000

// ---------------------------------------------------------------------------
echo ^5=== 3: POSITIVE CONTROL -- old blend restored, same framerate.
// ---------------------------------------------------------------------------
cl_predict_velblend 1
+forward
waitms 400
-forward
waitms 1000
cl_predtrace 3000
waitms 25000

// ---------------------------------------------------------------------------
echo ^5=== 4: fix again, 5 seconds after release rather than one.
// ---------------------------------------------------------------------------
cl_predict_velblend 0
+forward
waitms 400
-forward
waitms 5000
cl_predtrace 3000
waitms 25000

// ---------------------------------------------------------------------------
echo ^5=== 5: the drawn panel at the real framerate, WITH the fix.
// ---------------------------------------------------------------------------
+forward
waitms 400
-forward
waitms 1000
screenshot jit09_fix_a
waitms 50
screenshot jit09_fix_b
waitms 50
screenshot jit09_fix_c
waitms 50
screenshot jit09_fix_d
waitms 50
screenshot jit09_fix_e
waitms 50
screenshot jit09_fix_f
waitms 400

// ---------------------------------------------------------------------------
echo ^5=== 6: the same panel with the OLD blend, as the comparison.
// ---------------------------------------------------------------------------
cl_predict_velblend 1
+forward
waitms 400
-forward
waitms 1000
screenshot jit09_old_a
waitms 50
screenshot jit09_old_b
waitms 50
screenshot jit09_old_c
waitms 50
screenshot jit09_old_d
waitms 50
screenshot jit09_old_e
waitms 50
screenshot jit09_old_f
waitms 400

echo ^5=== END OF RUN ===
wait 20
quit
