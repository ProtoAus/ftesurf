// LM666F -- the decisive one.  r_decal_lightmap.
//
// THE DIAGNOSIS.  What the user is looking at is not the world face shader_here
// named; it is an info_overlay lying on top of it.  Parsing LUMP_OVERLAYS out of
// surf_666.bsp puts BOTH probe points at |plane distance| 0.00 INSIDE an overlay
// footprint, and the pair is CROSSED:
//   probe -1408 -13545 11148, base face dev/dev_concretefloor006a
//        -> overlay #30 "666/brickwall004a_overlay", 1792x1280, 512px tiled 14x9
//   probe  -416 -14722 11814, base face brick/brickwall004a
//        -> overlay #19 "666/dev_concretefloor006a_overlay", 896x576, tiled 7x4.5
// A 512px texture tiled 6-14 times across a wall and drawn unlit IS the flat
// bright high-frequency noise in the screenshot -- and it is why shader_here
// named a concrete floor on a brick wall and vice versa.  It cannot do better:
// CL_TraceShaderUnderCrosshair reports Mod_GetSurfaceNearPoint(cl.worldmodel)'s
// face, and an overlay is scenetris with no msurface_t at all.
//
// WHY THEY ARE BRIGHT.  Both overlay VMTs are LightmappedGeneric + "$decal 1"
// with no $translucent, so they draw OPAQUE over the base face, and hl2_decallit
// (default 1) correctly keeps them on program vmt/lightmapped.  But the decal's
// BATCH has no lightmap page: CL_Decal_SetupCtx sets ctx->dolm from
// r_decal_lightmap (cl_ents.c:3722), whose default is "0" (r_part.c:603), so
// adddecal_static stores lightmap[0] = -1, and gl_backend.c:1405 does
//     if ((unsigned short)curbatch->lightmap[0] >= numlightmaps) t = r_whiteimage;
// (unsigned short)-1 == 65535, so s_lightmap binds WHITE and lightmapped.glsl:185
// multiplies the albedo by 1.0 * e_lmscale.  Every one of the 319 placed overlays
// on this map is drawn unlit, on top of a world face the BSP lights to a mean of
// 0.013-0.052.
//
// The gate itself was already fixed for Source worlds -- cl_ents.c:3713-3721 says
// so in its own comment, testing lightmaps.surfstyles>0 && lightmaps.count>0
// instead of a game id.  Only the cvar DEFAULT was left at 0.
//
// PREDICTIONS, stated before the run:
//   - the flat bright regions go DARK and gain the surrounding lighting gradient
//   - the change is confined to the overlay footprints, so the whole-frame diff
//     is large but the brown walls and tiled floor are untouched
//   - the brick region's mean falls from 141.7 toward the base face's own value
// If instead nothing changes, this diagnosis is wrong.
//
// Set BEFORE `map` so the decals are clipped with dolm already true -- the cvar
// is read at placement time, not at draw time, so setting it afterwards would
// need a vid_restart to re-clip and would look like a null result.

log_enable 1
log_dir "logs"
log_name "lm666f"
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 0
vid_fullscreen 0
developer 1
log_developer 1
con_notifytime 0
con_notifylines 0
con_notifytime_error 0

wait 200

r_decal_lightmap 1
map surf_666
waitmap 1800
waitms 9000
sv_cheats 1
waitms 400
noclip
waitms 400
setpos -100.325 -13112.070 11281.580 3.148 -130.446 0
waitms 2500
developer 0
waitms 1500

echo ^5=========== r_decal_lightmap 1 =====================================
screenshot lm666f_on
waitms 900

echo ^5=========== and back to the shipped default, re-clipped ============
r_decal_lightmap 0
waitms 500
vid_restart
waitms 6000
setpos -100.325 -13112.070 11281.580 3.148 -130.446 0
waitms 2500
developer 0
waitms 1500
screenshot lm666f_off
waitms 900

echo ^5=== lm666f done ===
wait 30
quit
