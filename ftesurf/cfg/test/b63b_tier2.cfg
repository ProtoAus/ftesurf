cfg_save_auto 0

// ===========================================================================
// BUILD 63, ARM SET B -- Tier 1 AND Tier 2 together.
//
// Tier 2 adds button and door STATE with no geometry: Lock / Unlock / Press /
// PressIn / PressOut on buttons, Open / Close on doors, and the OnIn / OnOut /
// OnUseLocked / OnOpen / OnClose outputs.  Nothing moves, and nothing claims
// to have arrived anywhere -- OnFullyOpen and OnFullyClosed stay dead on
// purpose, because they are statements about where a brush IS.
//
// PRE-REGISTERED.
//
// ARM A -- surf_kitsune.  THE ARM THAT DECIDES WHETHER TIER 2 WORKS AT ALL.
//   Its secret button is spawnflags 1025 = Use-Activates PLUS Don't-Move: a
//   button Source itself never moves, wired OnIn -> kitsune,Alpha 75 and
//   OnOut -> kitsune,Alpha 0.  Alpha is already a named no-op, so the fires
//   are observable in ent_io without any visual change.
//   MUST still show 28 / 50 / 1 (target case / wired / teleports DISABLED).
//   MUST NO LONGER census 'OnIn' or 'OnOut' -- build 63's ARM A censused both,
//   and that is the single line that says Tier 2 landed.
//   MUST show "no refusals".
//
// ARM B -- surf_forbidden_tomb4.  153 relays, 0 buttons.  Tier 1 regression:
//   MUST still wire 2394 outputs and MUST NOT census OnTrigger or OnSpawn.
//
// ARM C -- surf_ny_platinum.  MUST NOT census OnCase01..16 or OnDefault.
//   func_movelinear's OnFullyOpen/OnFullyClosed MUST STILL be censused --
//   they are Tier 3 and firing them here would be the lie Tier 2 refuses.
//
// ARM D -- surf_centipedes.  12 of the library's 20 OnLockedUse doors.
//   MUST NOT census 'OnLockedUse'.  This is the arm that would catch the
//   SF_DOOR_PUSE gate silencing real maps: 19 of those 20 doors set bit 256,
//   so if this map goes quiet the census guess was wrong.
//
// ARM E -- bhop_miku_v2.  MUST load, MUST name the map in a red refusal line,
//   and the refusal MUST now name the PER-ENTITY ceiling (1024), not the
//   map-wide one -- the previous run reported the wrong ceiling.
//
// ARM F -- surf_kitsune restore.  Must match ARM A.
// ===========================================================================

log_enable 1
log_dir logs
log_name b63b_tier2
developer 1
log_developer 1
cl_maxfps 100
con_notifylines 0

// The engine is not ready yet -- a map issued here is silently dropped.
waitms 5000

echo ^5=== ARM A: surf_kitsune regression + Tier 2 OnIn/OnOut ===
map surf_kitsune
waitmap 45
waitms 6000
ent_io
waitms 1500
ent_census
waitms 1500

echo ^5=== ARM B: surf_forbidden_tomb4, 153 relays ===
map surf_forbidden_tomb4
waitmap 45
waitms 6000
ent_io
waitms 1500
ent_census
waitms 1500

echo ^5=== ARM C: surf_ny_platinum, cases + counters ===
map surf_ny_platinum
waitmap 45
waitms 6000
ent_io
waitms 1500
ent_census
waitms 1500

echo ^5=== ARM D: surf_centipedes, 12 OnLockedUse doors ===
map surf_centipedes
waitmap 45
waitms 6000
ent_io
waitms 1500
ent_census
waitms 1500

echo ^5=== ARM E: bhop_miku_v2, the cap ===
map bhop_miku_v2
waitmap 90
waitms 12000
ent_io
waitms 2500

echo ^5=== ARM F: surf_kitsune restore ===
map surf_kitsune
waitmap 45
waitms 6000
ent_io
waitms 1500
ent_census
waitms 2500

echo ^5=== END OF RUN ===
quit
