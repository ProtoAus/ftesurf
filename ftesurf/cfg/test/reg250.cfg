// REG250 -- Patch 250 regressions.
//
// Nothing in this patch should move any of these.  The one at risk is the VMT
// key dispatch: every material in the library now passes through a changed
// terminal branch in VMT_ParseBlock, and a key that used to fall through to a
// warning now falls into a census.  If that got the ordering wrong, materials
// stop resolving and the overlay/decal/sprite counts move.
//
//   surf_rise     overlays 103 of 105 placed, sprites 1 of 1
//   bhop_canals   decals 81 of 416, overlays 41 of 53
//   bhop_arcane   1122 func_bhop, overlays 5 of 5
//   surf_kitsune  target case: 28
log_enable 1
log_dir "logs"
log_name "reg250"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
con_notifylines 0

wait 200

echo ^5=========== surf_rise ===========
map surf_rise
waitmap 1800
waitms 6000
cmd ent_census
waitms 1500

echo ^5=========== bhop_canals ===========
map bhop_canals
waitmap 1800
waitms 6000
cmd ent_census
waitms 1500

echo ^5=========== bhop_arcane ===========
map bhop_arcane
waitmap 1800
waitms 6000
cmd ent_census
waitms 1500

echo ^5=========== surf_kitsune ===========
map surf_kitsune
waitmap 1800
waitms 6000
cmd ent_census
waitms 1500

echo ^5=== reg250 done ===
wait 30
quit
