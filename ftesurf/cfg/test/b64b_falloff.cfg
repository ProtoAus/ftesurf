cfg_save_auto 0

// ===========================================================================
// BUILD 64, ARM SET B -- the radius->attenuation fix, verified.
//
// WHY THIS RUN EXISTS.  Arm set A shipped a radius conversion derived from
// FTE's own falloff: FTE fades a channel LINEARLY to silence at
// snd_nominaldistance / attenuation (snd_dma.c:3383), so attenuation =
// 1000 / radius reproduces Source's radius as an audible distance exactly.
// Every step of that is true, and it is still wrong -- Source fades in dB, and
// matching the point where a sound reaches ZERO says nothing about how loud it
// is everywhere before that point.
//
// Arm set A's S7 (surf_halloween_tf2) was consequently deafening: 253
// ambient_generic share one targetname, one sample and radius 6100, and a
// single logic_auto OnMapSpawn -> PlaySound starts all of them.  That wiring is
// authentic and the delivery was right; carrying each emitter 8600 units
// instead of 1849 is what stacked a hundred full-volume copies of one slime
// loop on top of each other.  It was reported by a PERSON, not by the log --
// see "WHAT THIS RUN FIXES ABOUT THE INSTRUMENTS" below.
//
// THE CORRECTION, transcribed from Source rather than fitted:
//     ComputeSoundlevel  (game/server/sound.cpp:55-69)
//         dB_loss = 20 * log10(radius / 36)      36 = REFERENCE_dB_DISTANCE
//         sndlvl  = (int)(40 + dB_loss)
//     SNDLVL_TO_ATTN     (public/soundflags.h:106)
//         attn    = (sndlvl > 50) ? 20 / (sndlvl - 50) : 4
// The units are shared: soundflags.h:108 says Source "encodes attenuation * 64
// in 8 bits, so the maximum is (255/64)", and FTE writes
// bound(0, attenuation*64, 255) at sv_send.c:1260.  Same wire encoding, same
// scale -- which is what makes transcribing the number legitimate.
//
// SECOND CHANGE IN THIS BUILD: SOUNDFLAG_RELIABLE is no longer set on loops.
// Arm set A set it so that a player who was elsewhere when a loop started would
// still receive it -- but SV_StartSound skips the PHS for reliable sounds
// (sv_send.c:1340-1343), so that hand-disabled the engine's own audibility
// culling, which is precisely the mechanism that stops 253 emitters stacking.
// Late joiners are handled once per player by SV_AmbientResend instead.
//
// PRE-REGISTERED.  The predictions were computed offline from each map's
// entity lump using the Source formula above (scratchpad/attnpred.py) BEFORE
// this run.  `ent_io` must print a new "widest ambient" line reading exactly:
//
//   ARM  map                   MUST print                    was (arm set A)
//   F1   kz_secret_temple      attn 1.250, audible ~800      1.302 /   768
//   F2   surf_era              attn 0.465, audible ~2150     0.056 / 18000  <--
//   F3   surf_lt_unicorn       attn 0.625, audible ~1600     0.220 /  4544
//   F4   surf_halloween_tf2    attn 0.541, audible ~1849     0.116 /  8600  <--
//   F5   surf_kitsune          NO widest-ambient line at all
//   F6   kz_secret_temple      identical to F1 -- restore arm
//
// The two marked rows are the bug.  surf_era had an ambient with radius 18000,
// which the old formula turned into attenuation 0.056 -- audible for 18,000
// units, i.e. the entire map at close to full volume.  surf_halloween_tf2's
// widest carried 8,600.
//
// F5 IS A NEGATIVE CONTROL AND IT MUST STAY NEGATIVE.  surf_kitsune's single
// ambient is ATTN_NONE (its music plays everywhere), and ATTN_NONE is excluded
// from the widest-carry figure deliberately -- it is not a falloff, it is
// "play everywhere", and averaging it in would hide the thing the number
// exists to show.  If F5 prints a widest-ambient line, the exclusion is wrong.
// The same applies to bhop_floodwaters (all soundscript names) and
// bhop_miku_v2 (12 ambients, all ATTN_NONE), which is why neither is an arm
// here -- they have nothing to say about falloff.
//
// WHAT THIS RUN FIXES ABOUT THE INSTRUMENTS, which matters more than the fix.
// Arm set A's log DID contain the evidence: S7 printed "269 loop(s) playing"
// against a pre-registered prediction of 0.  That is a 269-fold miss sitting
// in plain text, and it scrolled past inside a 2.8 MB log while the run was
// judged on whether the maps loaded.  Two instruments are added as a result:
//   * the "widest ambient" line, so the number that was WRONG is printed --
//     arm set A printed every count correctly and none of them could have
//     revealed a falloff error.
//   * a yellow line above 32 simultaneous loops, so the count that WAS right
//     cannot be skimmed past again.
// A number nobody reads is not an instrument, and a correct count that cannot
// express the failure is not one either.
//
// `volume 0` IS SET BELOW AND IS NOT OPTIONAL.  The previous run of this
// feature went to a person's speakers at full volume.  A verification run of a
// sound fix reads numbers out of a log; it has no reason to make a sound, and
// every reason not to.
// ---------------------------------------------------------------------------
// RESULTS, 2026-09-13.  logs/b64b_falloff.log.  qwprogs.dat 1112726.
//
//   ARM  map                  predicted            actual
//   F1   kz_secret_temple     1.250 / ~800         1.250, ~800 units    ok
//   F2   surf_era             0.465 / ~2150        0.465, ~2150 units   ok
//   F3   surf_lt_unicorn      0.625 / ~1600        0.625, ~1600 units   ok
//   F4   surf_halloween_tf2   0.541 / ~1849        0.541, ~1850 units   ok*
//   F5   surf_kitsune         NO widest line       no widest line       ok
//   F6   kz_secret_temple     identical to F1      identical            ok
//
// ALL SIX ARMS HIT, INCLUDING THE NEGATIVE CONTROL.  F5 stayed silent, so
// ATTN_NONE really is excluded from the widest-carry figure rather than
// accidentally reported as 0.
//
// * F4 predicted 1849 and printed 1850.  That is the PREDICTOR rounding, not a
//   behaviour difference: 1000 / (20/37) is 1850.0 exactly, and the offline
//   script's integer floor on a float landed a unit low.  Recorded rather than
//   quietly reconciled, because "the prediction was off by one" and "the engine
//   was off by one" look identical in a table and are not the same finding.
//
// THE FIX, MEASURED.  surf_era's widest ambient carried 18,000 units before
// this change -- radius 18000 through `1000/radius` gives attenuation 0.056,
// i.e. the entire map at close to full volume -- and now carries 2,150.
// surf_halloween_tf2's went from 8,600 to 1,850.  Those two maps are the
// reason the arithmetic mattered; the other four barely moved, which is the
// other half of the result: the old formula was not uniformly wrong, it was
// wrong AT LARGE RADII, exactly where stacking emitters do damage.
//
// ---------------------------------------------------------------------------
// ONE UNPREDICTED NUMBER, RUN DOWN RATHER THAN WAVED PAST.
//
// F2 reported 56 loops playing where arm set A's S2 reported 62.  Nothing in
// this build should change how many loops START, so the delta was chased.
//
// It is not the code.  The tell is in the delivery count beside it: surf_era
// reported 3 inputs delivered in run A and 11 in run B, while EVERY OTHER ARM
// was byte-identical across the two runs (117/18, 2239/8, 50/0, 43/276).  A
// code change cannot deliver more inputs on one map and exactly as many on the
// rest; more time can.
//
// Confirmed rather than left as an inference.  surf_era carries TEN
// logic_timers, six of them named ducksound1timer..ducksound8timer with
// RefireTime 10, 13, 16, 20 and 30 seconds, and every one of those fires both
// StopSound AND PlaySound at ambient_generic -- the 13 copies of
// skarsounds/duck/duck-quacking animals038.wav in the census.  So the map's
// loop count genuinely oscillates, and the two runs snapshotted it 8 input
// deliveries apart, with six ducks mid-silence.
//
// THE FINDING IS ABOUT THIS TEST, NOT ABOUT THE GAME: surf_era's loop count is
// a TIME-VARYING quantity and must never be pre-registered as a fixed number
// again.  Its attenuation, which is what this arm set actually asserts, is a
// map property and is stable -- it hit exactly.  Build 63's logic_timer work
// is what makes those six timers run at all, so this is also the first
// evidence of Tier 1 and the sound layer driving each other on a real map.
// ---------------------------------------------------------------------------
// ===========================================================================

log_enable 1
log_dir logs
log_name b64b_falloff
developer 1
log_developer 1
cl_maxfps 100
con_notifylines 0

// See the header.  Muted before the first map, not after it.
volume 0
bgmvolume 0

waitms 5000

echo ^5=== F1: kz_secret_temple -- expect attn 1.250, audible ~800 ===
map kz_secret_temple
waitmap 45
waitms 6000
ent_io
waitms 1500

echo ^5=== F2: surf_era -- expect attn 0.465, audible ~2150 (was 18000) ===
map surf_era
waitmap 60
waitms 8000
ent_io
waitms 1500

echo ^5=== F3: surf_lt_unicorn -- expect attn 0.625, audible ~1600 ===
map surf_lt_unicorn
waitmap 45
waitms 6000
ent_io
waitms 1500

echo ^5=== F4: surf_halloween_tf2 -- expect attn 0.541, audible ~1849 (was 8600) ===
map surf_halloween_tf2
waitmap 45
waitms 6000
ent_io
waitms 1500

echo ^5=== F5: surf_kitsune -- NEGATIVE CONTROL, no widest-ambient line ===
map surf_kitsune
waitmap 45
waitms 6000
ent_io
waitms 1500

echo ^5=== F6: kz_secret_temple again -- the restore arm ===
map kz_secret_temple
waitmap 45
waitms 6000
ent_io
waitms 2500

echo ^5=== END OF RUN ===
quit
