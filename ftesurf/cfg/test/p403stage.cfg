// P403STAGE -- does a STAGE TIME post from a booster launch, with run_stagecap
// (290) live?  p403ride measured the internal state -- "stage fill: prime 1
// launch 0 tk 1 tkspd 1809 cap 290" -- and this arm asks for the harm itself.
//
// SV_StageLaunch (sv_timer.qc:6525) computes the launch speed from `e.velocity`
// alone (6533) and clears run_st_prime above run_t_stagecap (6567).  The push
// carrier lives in .run_basevel, NOT .velocity, so a body carried out of the box
// by a booster reads as a standing start.  SV_StageQualifies refuses a stage that
// is not primed; if prime survives, the stage posts.
//
// NO CHEATS.  Round 1 drove the body in with `setpos`, which sets run_t_cheat, and
// SV_StageQualifies then refused the stage for being dirty -- so the cap was never
// what blocked it (the log still read "prime 1 launch 0 ... cap 290", and
// "dirty 1", posts 0).  This round uses `!r`, the ordinary restart, which is not a
// cheat: the fixture start zone has no teleDest, so SV_ZoneDest drops the body at
// the polygon centroid -- which is INSIDE the *88 booster.  Patch 400 clears the
// carrier on that placement, and the push then re-arms it on the very next tick,
// which is the "a map output already due on the player refills the carrier" hole
// the plan records as still open.  sv_cheats 0.
//
// SETUP: copy cfg/test/p403stage.zones.json -> maps/zones/local/bhop_arcane.json.
// AFTER: delete it, and data/runs/bhop_arcane.
// The fixture is p403ride's plus a SECOND segment at y 3620..3680, just past the
// booster stack, so the opening stage closes at full booster speed.
//
// PRE-REGISTERED
//  S1 the opening stage closes and is POSTED: the log shows a stage fill line
//     with prime 1 and posts >= 1, and the .rec carries a stage record for
//     segment 1.
//  S2 the launch it was judged on reads far below the body's real speed --
//     `launch` well under 290 while the samples show ~1800 u/s.
// FALSIFIED IF the stage is refused (prime 0, or no post).  That would mean
// something downstream of SV_StageLaunch already catches the carrier, and the
// stage gate is sound after all.
//
// RESULT (2026-09-20).  S1 and S2 HELD, and the run is worse than the arm asked.
// On current HEAD -- Patch 400 included -- with sv_cheats 0 and `!r` as the ONLY
// input, the harness produced a CLEAN RANKED PERSONAL BEST launched at 1800 u/s:
//
//   timer: running on bhop_arcane
//   stage: wrote data/runs/bhop_arcane/stage_1/0000062_pb.rec (15 samples)
//   timer: wrote data/runs/bhop_arcane/main/0000062_pb.rec (19 samples, 4 padding)
//   stage fill: prime 0 launch 0 tk 1 tkspd 1809 cap 290 posts 0
//
//   flags 4                       <- TF_HAVEPB alone.  NOT practice, NOT cheat,
//                                    NOT segment.  It ranks.
//   seed 6910.86 2738.97 -120.36  0 0 0  1
//                                 ^^^^^  ^ velocity zero, ON THE GROUND
//   0.2400  6910.86 3092.97       <- 60 u per 0.03 s ...
//   0.2700  6910.86 3146.97       <- ... = 2000 u/s, then 1800
//   ride 0 358 arm  1400 / ride 7 381 arm 3200 / ride 8 382 arm 1800
//   ride 14 415 pay 1800
//
//   p403stageverify: VERIFY data/runs/bhop_arcane/main/0000062_pb.rec PASS
//
// So the plan's "still open, same class" note is not theoretical.  Patch 400 DOES
// clear the carrier on the `!r` placement -- and the push re-arms it on the very
// next tick, because the body was put down inside the booster.  Nothing between
// there and the board looks at the speed:
//   - SV_StageLaunch reads `.velocity` (sv_timer.qc:6533), which is 0.  The
//     run_stagecap 290 gate we already ship therefore sees a STANDING START.
//   - the start latch is taken on trust and the seed simply states velocity 0.
//   - pm_verify replays the recorded `ride` records faithfully and PASSes.
// The grounded-carrier branch is the hole; a player who JUMPS out takes the
// takeoff branch where run_st_launch = run_st_tkspd = 1809 and the cap does bite.
//
// Round 1 of this arm drove the body in with `setpos` and the stage was refused
// for `dirty 1`, not by the cap -- which is why this one uses no cheats at all.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p403stage
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
sv_cheats 0
fs_missingwarn 0
set run_resume 0
sv_port 27682

wait 200
map bhop_arcane
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 1000
zone_list

// cl_netfps stays pinned to pm_ticrate so a command is still one 10 ms tick
// (lowering it just makes ONE longer command -- measured: "cl_netfps 20 -> one
// usercmd per 50 ms").  cl_c2spps DROPS outgoing packets instead (cl_input.c:3570,
// at most 2 in a row), and QW carries the backup moves, so the packet that does go
// out holds up to 3 commands.  That is the multi-command packet.
cl_c2spps 10
waitms 200
cl_c2spps

echo ^5=== S: restart into the booster, clean ===
say !r
waitms 100
cmd viewpos
cmd timer
waitms 200
cmd viewpos
waitms 200
cmd viewpos
waitms 200
cmd viewpos
cmd timer
waitms 400
cmd viewpos
cmd timer
waitms 1200
cmd viewpos
cmd timer
waitms 2000
cmd viewpos
cmd timer

echo ^5=== L: grounded under the upward push (bonus 1) ===
cmd setpos 1535 -10700 13650 0 0 0
waitms 300
cmd viewpos
cmd timer
waitms 500
cmd viewpos
cmd timer
waitms 1500
cmd viewpos
cmd timer
waitms 2500
cmd viewpos
cmd timer
waitms 2000
cmd viewpos
cmd timer

echo ^5=== P403RIDE DONE ===
waitms 1000
quit
