// P395WIN -- Patch 395: `replay window <leg>` (Watch_StageWindow) opens a stage of a
// full-run recording: seek to its start minus 1 s, pause ONCE at its end.  The window
// is the file's `stagepost <seg> <dur>` closed by the next `stage`/`end` tick, else
// the `stage` records.  Offline listen server, lobby_dir ""; the files come from the
// cache by id (`replay online <id>`).  Run p395cache first (its fixtures), then this
// with +set log_name.  Expected lines: `python tools/onlinecache.py windows <file>`.
//
// PRE-REGISTERED (the window lines verbatim; status t within 0.0001)
//  A1 surf_aura r18, `replay window 2`:
//     replay: stage 2 window 7.8750..17.2350 s from 6.8750 (ticks 525..1149, stagepost)
//     status t 6.8750 paused 0.  At 4x for 6 s: exactly one
//     `replay: stage 2 window end 17.2350 -- paused`, status t 17.2350 paused 1.
//     `replay play` 1.5 s: paused 0, t > 17.735, no second window-end line.
//  A2 `replay window 1`: ... 0.0000..6.6300 s from -1.0000 (ticks 0..442, stagepost)
//     (t0 is -1.665: no clamp); 4 s later `stage 1 window end 6.6300 -- paused`.
//  A6 `replay window 9`: `replay: no window for stage 9 in this file`.
//  A3 `replay window 6`: ... 226.2750..248.3100 s from 225.2750 (ticks 15085..16555,
//     stagepost) -- the end is t1, the last sample, not 248.325; after `replay seek
//     247` + play: `stage 6 window end 248.3100 -- paused`, status paused 1.
//  A4 bhop_eazy r16 (100 Hz): window 3 23.7800..36.8600 from 22.7800 (2378..3686,
//     stagepost); window 2 10.4800..22.2600 from 9.4800 (1048..2226, stage records);
//     window 4 36.8600..49.0200 from 35.8600 (3686..4903, stage records).
//  A5 surf_aesthetic r3 (REC 4, no stagepost): window 2 8.5350..20.5500 from 7.5350
//     (569..1370, stage records).
//  A7 surf_beginner r990042 (the abandon fixture): the open line ends `(abandoned)`;
//     window 5 23.3100..27.1950 from 22.3100 (1554..1813, stage records); at 4x one
//     `window end 27.1950 -- paused`; status `abandoned 1  state 2  finrow 0`.
//  A8 CONTROL r990044 (same cut, no `abandon`): no `(abandoned)`; at `seek end` status
//     `abandoned 0  state 3  finrow 1` -- the finish row A7 must not draw.
//  No QC / PR_ExecuteProgram line.
// CONTROL: this cfg on the pre-395 csprogs, BEFORE building: `replay online` reads as
//  a path ("online is not a .rec") and no window line appears -- every arm FAILS.
//
// RESULT (2026-09-20, +set sv_csqc_progname csprogs395.dat).  CONTROL p395win-ctl:
//  FAILED as registered (`replay: online is not a .rec`, `window is not a .rec`).
//  p395win: every window line verbatim as above; A1 t 6.8750 paused 0, then one end
//  line, t 17.2350 paused 1, then t 23.2552 paused 0; A2 end 6.6300; A3 end 248.3100;
//  A7 `(abandoned)`, end 27.1950, `abandoned 1  state 2  finrow 0`; A8 `abandoned 0
//  state 3  finrow 1`.  4 end lines, one per window played to its end.  No QC error.
//  Noted: a `replay status` in the same frame as `replay window` reads the pre-seek
//  tick/state (Watch_Sample has not run yet); the next frame is current.
cfg_save_auto 0
log_enable 1
log_dir logs
developer 1
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0
set run_resume 0
sv_public 0
sv_port 27676
set lobby_dir ""

wait 200
map surf_aura
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 1000
set hud_watch_skipidle 0
echo ^5=== p395win A1 ===
replay online 18
waitms 1500
replay window 2
replay status
replay speed 4
waitms 6000
replay status
replay play
waitms 1500
replay status
echo ^5=== p395win A2 ===
replay window 1
waitms 4000
replay status
echo ^5=== p395win A6 ===
replay window 9
echo ^5=== p395win A3 ===
replay window 6
replay seek 247
replay play
waitms 3000
replay status
replay stop
waitms 500

map bhop_eazy
waitmap 1800
waitms 3000
set hud_watch_skipidle 0
echo ^5=== p395win A4 ===
replay online 16
waitms 1000
replay window 3
replay status
replay window 2
replay window 4
replay stop
waitms 500

map surf_aesthetic
waitmap 1800
waitms 3000
set hud_watch_skipidle 0
echo ^5=== p395win A5 ===
replay online 3
waitms 1000
replay window 2
replay status
replay stop
waitms 500

map surf_beginner
waitmap 1800
waitms 3000
set hud_watch_skipidle 0
echo ^5=== p395win A7 ===
replay online 990042
waitms 1000
replay window 5
replay speed 4
waitms 3000
replay status
replay stop
waitms 500
echo ^5=== p395win A8 ===
replay online 990044
waitms 1000
replay seek end
replay status
replay stop
echo ^5=== p395win DONE ===
waitms 500
quit
