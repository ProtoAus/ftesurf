// P262A -- did putting the prop colours in a GPU buffer remove the cost?
//
// hl2_lt_baked_vc is LIVE, so this is a same-build, same-vantage, same-frame A/B:
// vc 0 binds nothing (the plugin sets vertlightbytes NULL) and vc 1 binds the
// per-instance colours.  Before Patch 262 that pair read 1000fps vs 300 on
// surf_boreas with the 3D skybox off, and 440 vs 35 with it on.  If the buffer
// works, both members of each pair should now read the same.
//
// Deliberately NOT compared against the numbers Lex measured: those were taken
// at "the start zone !r, Crazy dip" and this runs at spawn, so only the WITHIN-
// pair difference is meaningful here.  That is also the only thing being claimed.
//
// show_fps rather than timerefresh: timerefresh never runs CSQC_UpdateView, so
// it cannot measure a frame this game actually draws.  cl_maxfps 0 so nothing
// caps the result -- with a cap, both halves of a pair read the cap and the
// measurement says nothing.
//
// Screenshots come in pairs because `screenshot` captures one frame behind and
// the fps counter is an average that needs a moment to settle after a toggle.

log_enable 1
log_dir "logs"
log_name "p262a"
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 0
vid_fullscreen 0
sv_cheats 1
show_fps 1

wait 200
echo ^5=== p262a: Patch 262, the per-vertex prop lighting cost ===

map surf_boreas
waitmap 1800
waitms 6000

vbsp_skyroom 0
waitms 2000

echo ^5------------------- boreas, skybox OFF, vc 1 (bound) -------------------
hl2_lt_baked_vc 1
waitms 3000
prop_census
waitms 500
screenshot p262a_1_skyoff_vc1
waitms 900
screenshot p262a_1_skyoff_vc1
waitms 900

echo ^5------------------ boreas, skybox OFF, vc 0 (control) ------------------
hl2_lt_baked_vc 0
waitms 3000
screenshot p262a_2_skyoff_vc0
waitms 900
screenshot p262a_2_skyoff_vc0
waitms 900

vbsp_skyroom 1
waitms 3000

echo ^5------------------- boreas, skybox ON, vc 0 (control) ------------------
hl2_lt_baked_vc 0
waitms 3000
screenshot p262a_3_skyon_vc0
waitms 900
screenshot p262a_3_skyon_vc0
waitms 900

echo ^5-------------------- boreas, skybox ON, vc 1 (bound) -------------------
hl2_lt_baked_vc 1
waitms 3000
prop_census
waitms 500
screenshot p262a_4_skyon_vc1
waitms 900
screenshot p262a_4_skyon_vc1
waitms 900

echo ^5--------------- boreas, skybox OFF, vc 1 again (drift check) -----------
// The same setting as step 1.  Anything that differs between them is drift --
// the map animating, the counter still settling, thermals -- and only what the
// vc0-vs-vc1 gap exceeds THAT is the feature.
vbsp_skyroom 0
waitms 3000
screenshot p262a_5_skyoff_vc1_again
waitms 900
screenshot p262a_5_skyoff_vc1_again
waitms 900

echo ^5=== p262a done ===
wait 30
quit
