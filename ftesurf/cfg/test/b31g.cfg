// Build 31, third pass.
//
// TWO THINGS, and the first is a regression check on a real bug this run's own
// diagnostic caught.
//
// 1. THE LATCH RATE.  hud_update -1 was written against servercommandframe,
//    which reads plausibly and never advances in this build -- a client of this
//    mod is `isindependant` with no SV_RunClientCommand, so nothing drives the
//    acknowledgement CSQC can see.  `hud_edit status` printed `latch 4.0 Hz`,
//    the 0.25s stall floor, instead of the ~67 it claimed.  It is
//    clientcommandframe now, which is the client's own outgoing input sequence
//    at cl_netfps 66.6667 and is the literal reading of "per tick" anyway.
//
//    So: measure it at all three kinds of setting, one second of wall clock
//    each.  -1 must read ~67, 0 must read the frame rate (hundreds), 10 must
//    read ~10.  Anything reading 4.0 is the floor firing and the edge is dead.
//
// 2. THE TOOL PANEL'S OWN DRAG, which b31a's picture showed was needed: the
//    panel sits in the left margin and so do four of the ten elements, and it
//    has to block clicks, so those four could not be grabbed at all.
//
//      b31g-1-left    panel where it ships, title bar visible with `move`
//      b31g-2-right   driven to 0.55 -- the four left-margin placeholders are
//                     uncovered and grabbable
//      b31g-3-scale3  hud_scale 3.  The HUD triples; the PANEL must not, or it
//                     runs off a 720-line window and takes `done` with it.

waitms 2000

echo ^5=== b31g: latch rate and the tool panel ===

scr_conalpha 0
con_notifytime 0
hud_debug 1

map surf_null
waitmap 240
wait 60

echo ^5--- latch: hud_update -1 (per input frame, expect ~67) ---
hud_update -1
waitms 2500
hud_edit status
waitms 200

echo ^5--- latch: hud_update 0 (every frame, expect the frame rate) ---
hud_update 0
waitms 2500
hud_edit status
waitms 200

echo ^5--- latch: hud_update 10 (expect ~10) ---
hud_update 10
waitms 2500
hud_edit status
waitms 200

hud_update -1
waitms 200

echo ^5--- the tool panel ---
seta hud_edit_panel_x 0.010
seta hud_edit_panel_y 0.080
seta hud_scale 2
wait 10

hud_edit
wait 25
screenshot b31g-1-left
wait 20

seta hud_edit_panel_x 0.55
wait 25
screenshot b31g-2-right
wait 20

seta hud_scale 3
wait 25
screenshot b31g-3-scale3
wait 20

seta hud_scale 2
seta hud_edit_panel_x 0.010
hud_edit off
wait 15

echo ^5=== b31g done ===
wait 30
quit
