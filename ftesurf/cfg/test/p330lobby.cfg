// P330 addendum check -- the lobby/mode layer at cfg/lobby/.
// Exec'd by bare name (+exec p330lobby): the fallback must find cfg/test/.
// Then +exec mode_bhop on the command line already proved the cfg/lobby/ leg
// of the fallback before this file runs; the bhop map below proves the
// SERVER's mode layer reads cfg/lobby/mode_bhop.cfg (pm_ticrate 0.01 in the
// fullserverinfo, against 0.015 on every surf map).
log_enable 1
log_dir "logs"
log_name "p330lobby"
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
vid_width 640
vid_height 480
con_notifytime 0
con_notifylines 0
developer 1
log_developer 1
echo ^5=== P330 LOBBY: bare-name exec reached cfg/test/ ================
wait 200
map bhop_24
waitmap 900
waitms 12000
echo ^5=== P330 LOBBY: bhop fullserverinfo above (pm_ticrate 0.01) ===
waitms 500
echo ^5=== P330 LOBBY CHECK DONE ======================================
wait 60
quit
