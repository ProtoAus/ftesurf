// Patch 340, menu arm -- the name gate's predicate and its screen.
// Headless: ftesurf64.exe -WindowStyle Minimized +exec cfg/test/p340m.cfg
// menu_restart first: menu.dat loads lazily and +exec boots skip it (AGENTS).
developer 2
log_enable 1
log_dir "logs"
log_name "p340m"
vid_fullscreen 0
vid_width 1280
vid_height 720
wait 200
menu_restart
waitms 2000

echo === predicate, word shapes:
ui_name test Player
ui_name test player
ui_name test Lex
ui_name test unnamed
ui_name test quake

echo === predicate, the live cvar, engine shapes:
name (1)Player
ui_name
name Player
ui_name
name TestPilot
ui_name

echo === force the screen and shoot it:
togglemenu
waitms 500
ui_name screen
waitms 1000
screenshot p340m_screen
quit
