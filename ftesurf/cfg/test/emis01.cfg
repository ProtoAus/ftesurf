// EMIS01 -- Patch 250: $emissiveblendenabled, Source's scrolling emissive pass.
//
// emissive_scroll_blended_pass_ps20b.fxc:31-48, drawn additively (helper:174):
//     emis = tex2D(selfillum, flow.xy + scroll*time)
//     rgb  = base.rgb * emis.rgb * tint * strength;  a = 0
//
// All six materials in the library that use it have their $basetexture COMMENTED
// OUT and set $additive 1, so the base pass contributes nothing and the emissive
// pass IS the material.  Before this patch they drew as nothing at all.
//
// GEOMETRY, learned the hard way.  The three summoning circles are ZERO-THICKNESS
// planes at z=14976.5 (*72 func_brush, *73 func_rotating, *74 func_brush, all on
// the same 896x896 footprint) and the world floor above them is at z=14977.  A
// camera above therefore sees the floor and nothing else -- the first run of this
// config looked straight down from z=15236 and photographed stonecladding.  They
// are ceiling decals for the room BELOW, so the camera goes underneath and looks
// up.  The two credits banners are the same story, 500 units to the north-east.
//
// shader_here is no use on any of these: CL_TraceShaderUnderCrosshair traces
// cl.worldmodel only, and every one of them is a brush ENTITY, so the trace goes
// straight through to the world behind.  The evidence is the [shader] line at
// load time (prog 1 = a program is attached) plus a pixel diff of the two
// screenshots -- "the shader was generated" and "the shader drew something" are
// different claims and the first does not imply the second.
//
// developer is dropped to 0 before each screenshot: the notify overlay was
// covering the top half of the frame with texture-resolution errors, and
// log_developer 1 keeps the log complete regardless.

log_enable 1
log_dir "logs"
log_name "emis01"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
developer 1
log_developer 1
con_notifytime 0
con_notifylines 0
con_notifytime_error 0

wait 200

hl2_emissive 1
map surf_demise
waitmap 1800
waitms 9000
sv_cheats 1
developer 0
waitms 500

echo ^5=========== hl2_emissive 1 -- from BELOW, looking up ===============
setpos -12160 -3968 14776 -90 0 0
waitms 1500
screenshot emis03_circle_on
waitms 700

setpos -12440 -3968 15072 0 180 0
waitms 1200
screenshot emis03_credits_on
waitms 700

developer 1
echo ^5--- vmt_keys: the emissiveblend keys should be GONE from the list ---
vmt_keys
waitms 800

echo ^5=========== hl2_emissive 0 -- back to nothing ======================
hl2_emissive 0
waitms 3000
developer 0
waitms 500
setpos -12160 -3968 14776 -90 0 0
waitms 1500
screenshot emis03_circle_off
waitms 700

setpos -12440 -3968 15072 0 180 0
waitms 1200
screenshot emis03_credits_off
waitms 700

echo ^5=== emis01 done ===
wait 30
quit
