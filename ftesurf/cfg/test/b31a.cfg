// Build 31 -- the layout editor, the rect registry, and the rounding step.
//
// What a headless run CAN settle here, and does:
//
//   b31a-1-plain    the ordinary HUD, editor closed.  The baseline: none of the
//                   registry work may change a single drawn pixel when
//                   hud_edit is not open, and this is the picture that says so.
//   b31a-2-edit     hud_edit open.  Every panel outlined and named, the side
//                   panel on the left, the six snap guides faint across the
//                   screen.  A panel that drew this frame gets a blue solid
//                   outline; one that did not (the two menus, a faded column)
//                   gets a dim filled placeholder at its cvars' own position.
//   b31a-3-moved    hud_speed_x driven from the console to 0.25 -- the editor's
//                   outline has to follow the panel, which is the whole claim
//                   that the registry reads the real layout instead of guessing.
//   b31a-4-detach   hud_board_x/y off the -1 sentinel.  The board panel stops
//                   stacking under the strafe bar and its box moves.
//   b31a-5-r0 .. -8-r5   the SAME position, standing still, at hud_round
//                   0/1/2/5.  `e` by the crosshair must quantise across the
//                   four and nothing else on screen may move.
//
// `hud_edit status` is printed twice -- closed and open -- so the console text
// is in the log beside the pictures.
//
// PERSISTENCE is the other half and it is checked in the log rather than in a
// picture: `hud_edit reset` writes ten pairs of cvars through localcmd("seta"),
// cfg_save writes ftesurf.cfg, and the runner greps the file for `seta
// hud_timer_x`.  That is the CSQC path end to end -- if the seta rule were
// wrong the line would come out as plain `set`, or not at all.

waitms 2000

echo ^5=== b31a: the HUD layout editor ===

scr_conalpha 0
hud_debug 1

map surf_null
waitmap 240
wait 60

echo ^5--- 1: the plain HUD, editor closed ---
hud_edit status
wait 10
screenshot b31a-1-plain
wait 20

echo ^5--- 2: hud_edit open ---
hud_edit
wait 20
hud_edit status
wait 10
screenshot b31a-2-edit
wait 20

echo ^5--- 3: move the speedometer from the console; the outline must follow ---
seta hud_speed_x 0.25
wait 20
screenshot b31a-3-moved
wait 20
seta hud_speed_x 0.5
wait 10

echo ^5--- 4: detach the board panel from the strafe bar ---
seta hud_board_x 0.22
seta hud_board_y 0.62
wait 20
hud_edit status
wait 10
screenshot b31a-4-detach
wait 20
seta hud_board_x -1
seta hud_board_y -1
wait 10

echo ^5--- 5: the rounding step, standing still ---
hud_edit off
wait 20

hud_round 0
wait 15
screenshot b31a-5-r0
wait 15
hud_round 1
wait 15
screenshot b31a-6-r1
wait 15
hud_round 2
wait 15
screenshot b31a-7-r2
wait 15
hud_round 5
wait 15
screenshot b31a-8-r5
wait 15
hud_round 1
wait 10

echo ^5--- 6: hud_update, and the 0.25s stall floor ---
// At 1 Hz the numbers must still be THERE -- the floor is what stops a latched
// readout freezing blank when nothing is advancing.  Standing still, so the
// value itself is not expected to change.
hud_update 1
wait 30
screenshot b31a-9-slow
wait 20
hud_update -1
wait 10

echo ^5--- 7: reset writes through localcmd(seta), then save ---
hud_edit reset
wait 20
cfg_save
wait 30
hud_edit status
wait 10

echo ^5=== b31a done ===
wait 30
quit
