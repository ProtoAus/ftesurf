// Private overlay (tools/runlines_smoke.py).  Patch 630: hud_edit's second text
// sizes as boxes, the speedometer's speed / both / energy choice, the trainer's
// and the graph's size rungs, and one size for the key block and the mouse pad.
// Graded from the log by tools/test_p630hud.py; the screenshots are for a person.
// Every click goes through `hud_edit ui` (hover, then mouse1 down and up).
// `wait 4` after a wait: waitms counts from the frame's start, so a screenshot or a
// long dump before it can leave one frame between a change and its read.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name runlines_smoke
con_notifytime 0
con_notifylines 0
cl_idlefps 0
cl_maxfps 100
// 900 lines: the panel keeps its full scale with a pane open (it halves when it
// would not fit), which is the size its labels have to fit at.
vid_fullscreen 0
vid_winmaximize 0
vid_width 1600
vid_height 900
vid_conautoscale 1
waitms 2000
wait 4
// A config saved with the energy line off (hud_energy 0 was "off"): moved at load.
set hud_energy 0
set hud_speed_show 1
map surf_dune
waitmap 60
waitms 4000
wait 4
menu_restart
ui_close
echo ==== P630 MIGRATION ====
echo P630 read migrated energy
hud_energy
echo P630 read migrated show
hud_speed_show
// CSQC registers these at load, so they are set after the map.
set hud_scale 2
set hud_speed 1
set hud_speed_x 0.5
set hud_speed_y 0.68
set hud_speed_size 0
set hud_energy 1
set hud_energy_ref 1
set hud_energy_size 0
set hud_speed_show 1
set hud_timer 1
set hud_timer_sub_size 0
set hud_keys 1
set hud_keys_x 0
set hud_keys_y 0.84
set hud_keys_size 1
set hud_mouse 1
set hud_mouse_x -1
set hud_mouse_y -1
set hud_trainer 0
set hud_trainer_size 0
set hud_linegraph_size 0
set hud_edit_panel_x 0.010
set hud_edit_panel_y 0.080
waitms 800
wait 4

echo ==== P630 MODES ====
screenshot p630_both.png
set hud_speed_show 0
waitms 600
wait 4
screenshot p630_speed.png
set hud_speed_show 2
waitms 600
wait 4
screenshot p630_energy.png
set hud_speed_show 1
waitms 300
wait 4
// The drawn box is published only while the editor is open.
hud_edit on
waitms 600
wait 4
echo P630 mode both
hud_edit status
set hud_speed_show 0
waitms 600
wait 4
echo P630 mode speed
hud_edit status
set hud_speed_show 2
waitms 600
wait 4
echo P630 mode energy
hud_edit status
// hud_energy 0 was "no energy line": still so under the speed, and the energy
// alone is still drawn.
set hud_energy 0
waitms 600
wait 4
echo P630 mode energy-legacy
hud_edit status
set hud_speed_show 1
waitms 600
wait 4
echo P630 mode both-legacy
hud_edit status
set hud_energy 1
waitms 300
wait 4

echo ==== P630 SPEED PANE ====
hud_edit speed
waitms 800
wait 4
echo P630 pane speed
hud_edit ui
screenshot p630_pane_speed.png
hud_edit ui hover he_o_hud_energy_size64
hud_edit ui down mouse1
waitms 100
hud_edit ui hover he_o_hud_energy_size64
hud_edit ui up mouse1
waitms 400
wait 4
echo P630 read energy64
hud_energy_size
screenshot p630_pane_speed_64.png
hud_edit ui hover he_o_hud_energy_size64
hud_edit ui down mouse1
waitms 100
hud_edit ui hover he_o_hud_energy_size64
hud_edit ui up mouse1
waitms 400
wait 4
echo P630 read energyauto
hud_energy_size
hud_edit ui hover he_o_hud_speed_show
hud_edit ui down mouse1
waitms 100
hud_edit ui hover he_o_hud_speed_show
hud_edit ui up mouse1
waitms 400
wait 4
echo P630 read show2
hud_speed_show
hud_edit ui hover he_o_hud_speed_show
hud_edit ui down mouse1
waitms 100
hud_edit ui hover he_o_hud_speed_show
hud_edit ui up mouse1
waitms 400
wait 4
echo P630 read show0
hud_speed_show
hud_edit ui hover he_o_hud_speed_show
hud_edit ui down mouse1
waitms 100
hud_edit ui hover he_o_hud_speed_show
hud_edit ui up mouse1
waitms 400
wait 4
echo P630 read show1
hud_speed_show
hud_edit ui hover he_o_hud_energy
hud_edit ui down mouse1
waitms 100
hud_edit ui hover he_o_hud_energy
hud_edit ui up mouse1
waitms 400
wait 4
echo P630 read unit2
hud_energy
hud_edit ui hover he_o_hud_energy
hud_edit ui down mouse1
waitms 100
hud_edit ui hover he_o_hud_energy
hud_edit ui up mouse1
waitms 400
wait 4
echo P630 read unit1
hud_energy

echo ==== P630 TIMER PANE ====
hud_edit timer
waitms 800
wait 4
echo P630 pane timer
hud_edit ui
screenshot p630_pane_timer.png
hud_edit ui hover he_o_hud_timer_sub_size20
hud_edit ui down mouse1
waitms 100
hud_edit ui hover he_o_hud_timer_sub_size20
hud_edit ui up mouse1
waitms 400
wait 4
echo P630 read sub20
hud_timer_sub_size
screenshot p630_pane_timer_20.png
hud_edit ui hover he_o_hud_timer_sub_size20
hud_edit ui down mouse1
waitms 100
hud_edit ui hover he_o_hud_timer_sub_size20
hud_edit ui up mouse1
waitms 400
wait 4
echo P630 read subauto
hud_timer_sub_size

echo ==== P630 TRAINER AND GRAPH PANES ====
hud_edit trainer
waitms 800
wait 4
echo P630 pane trainer
hud_edit ui
screenshot p630_pane_trainer.png
hud_edit graph
waitms 800
wait 4
echo P630 pane graph
hud_edit ui
screenshot p630_pane_graph.png

echo ==== P630 MOUSE PANE ====
hud_edit mouse
waitms 800
wait 4
echo P630 pane mouse
hud_edit ui
echo P630 size S
hud_edit status
mousepad
screenshot p630_pane_mouse_s.png
hud_edit ui hover he_o_hud_keys_size2
hud_edit ui down mouse1
waitms 100
hud_edit ui hover he_o_hud_keys_size2
hud_edit ui up mouse1
waitms 600
wait 4
echo P630 read keys2
hud_keys_size
echo P630 size XL
hud_edit status
mousepad
screenshot p630_pane_mouse_xl.png
// a plain choice has no auto: the lit box clicked again stays
hud_edit ui hover he_o_hud_keys_size2
hud_edit ui down mouse1
waitms 100
hud_edit ui hover he_o_hud_keys_size2
hud_edit ui up mouse1
waitms 400
wait 4
echo P630 read keys2again
hud_keys_size
hud_edit ui hover he_o_hud_keys_size1.25
hud_edit ui down mouse1
waitms 100
hud_edit ui hover he_o_hud_keys_size1.25
hud_edit ui up mouse1
waitms 600
wait 4
echo P630 read keys125
hud_keys_size
echo P630 size M
hud_edit status
mousepad
hud_edit ui hover he_o_hud_keys_size1
hud_edit ui down mouse1
waitms 100
hud_edit ui hover he_o_hud_keys_size1
hud_edit ui up mouse1
waitms 600
wait 4
echo P630 read keys1
hud_keys_size
echo P630 size S2
hud_edit status
mousepad
hud_edit off
waitms 400
wait 4

echo ==== P630 SCALE 3 ====
// The size-S block has no floor gap here (it ends past a 900-line window, as it
// did before the patch): a larger one stands on the bottom edge, S times its size.
hud_edit on
set hud_scale 3
set hud_keys_size 1
waitms 600
wait 4
echo P630 scale3 S
hud_edit status
set hud_keys_size 2
waitms 600
wait 4
echo P630 scale3 XL
hud_edit status
screenshot p630_scale3_xl.png
set hud_keys_size 1
set hud_scale 2
hud_edit off
waitms 400
wait 4

echo ==== P630 HALF-SCALE PANEL ====
// hud_scale 1 draws the panel at half scale: the labels have to fit there too.
set hud_scale 1
hud_edit timer
waitms 800
wait 4
screenshot p630_half_timer.png
hud_edit speed
waitms 800
wait 4
screenshot p630_half_speed.png
hud_edit off
set hud_scale 2
waitms 400
wait 4

echo ==== P630 PLAY VIEW AT XL ====
set hud_keys_size 2
waitms 600
wait 4
screenshot p630_play_xl.png
set hud_keys_size 1
waitms 300
wait 4
echo RUNLINES COMPLETE
quit
