// cfg_save_auto 0 FIRST: this run sets archived cvars and must never write them
// into ftesurf.cfg (cl_main.c:2535).
cfg_save_auto 0

// ===========================================================================
//  B57ECLIPSE -- the scoreboard lists stage 1, and a staged surf map agrees.
//
//  THE COMPLAINT THIS ANSWERS, verbatim: "Completing stage 1 as a stage is
//  impossible since it considers it a 'main' and the scoreboard has 1 less stage
//  as it counts the first stage as 'main' which is all of them."
//
//  surf_eclipse is the smallest staged map in the library: THREE segments plus an
//  end, and its zone file says stagesEndAtStageStarts true.  So under build 57
//  the leg list must read exactly
//
//      main, stage 1, stage 2, stage 3
//
//  where every build before 57 showed main + stage 1..2 -- one short, with the
//  labels shifted down by one.
//
//  GEOMETRY, read out of maps/zones/online/surf_eclipse.json rather than guessed
//  (centre of each region's points, z = bottom + height/2):
//
//      START    (seg 0)   -11558    9873   13114    tele stage1
//      stage 2  (seg 1)   -10231   -4050   12516    tele stage2
//      stage 3  (seg 2)     4862   -2395    2303    tele stage3
//      END                  4962  -14304    -572
//
//  A CONFIG CANNOT SURF, and this map is a real surf map: the legs are far apart
//  in all three axes, so there is no single-plane flight as there is on
//  bhop_eazy.  This file therefore does NOT try to fly a run -- it asks the two
//  questions that do not need one:
//
//    1  what does the LEG TABLE say?  `!s 1`, `!s 2`, `!s 3` and `!m` each arm a
//       leg and `cmd timer` names it.  A map with three stages must accept
//       `!s 3` and must refuse `!s 4`.  Stage 1 accepting AT ALL is the fix.
//    2  what does the SCOREBOARD build?  +showscores reads the leg list from the
//       same segment count, so `cl scores` reports the rows it would draw.
//
//  The flying half -- a clean stage 1 recorded at the stage-2 boundary -- is
//  b57stage.cfg's job on bhop_eazy, where one plane makes it possible.
//
//  PORT 27600, never 27500 or 27510-27550.
// ===========================================================================

log_enable 1
log_dir "logs"
log_name "b57eclipse"
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
sv_cheats 1
fs_missingwarn 0
con_notifylines 0
sv_port 27600

wait 200
echo ^5=== b57eclipse: surf_eclipse, build 57 ===
map surf_eclipse
waitmap 2400
waitms 3000

// The table as this build reads it.  zone_list is a CLIENT command (cl_zones.qc)
// -- `cmd zone_list` is a bad user command and prints nothing.
echo ^5=== b57eclipse: the zone table -- expect 3 segments + an end ===
zone_list
waitms 800

// ---------------------------------------------------------------------------
//  1. THE LEG TABLE.  Each chat command arms a leg; `cmd timer` names it.
//
//  EXPECT, in order: stagerun 0 (the map) -- then stagerun 1 with leg 1, which is
//  the request that was impossible before this build -- then legs 2 and 3 -- then
//  a refusal for stage 4, which does not exist -- then back to the map.
// ---------------------------------------------------------------------------
echo ^5=== b57eclipse 1a: !m -- expect stagerun 0, leg 0 ===
noclip
say !m
waitms 1200
cmd viewpos
cmd timer

echo ^5=== b57eclipse 1b: !s 1 -- expect stagerun 1, leg 1 (THE FIX) ===
say !s 1
waitms 1200
cmd viewpos
cmd timer

echo ^5=== b57eclipse 1c: !s 2 -- expect stagerun 1, leg 2 ===
say !s 2
waitms 1200
cmd viewpos
cmd timer

echo ^5=== b57eclipse 1d: !s 3 -- expect stagerun 1, leg 3 ===
say !s 3
waitms 1200
cmd viewpos
cmd timer

echo ^5=== b57eclipse 1e: !s 4 -- expect a REFUSAL, and the leg unchanged ===
say !s 4
waitms 1200
cmd viewpos
cmd timer

echo ^5=== b57eclipse 1f: !m again -- expect stagerun 0 ===
say !m
waitms 1200
cmd viewpos
cmd timer

// ---------------------------------------------------------------------------
//  2. THE SCOREBOARD'S LEG LIST.
//
//  Scores_BuildLegs derives its rows from the segment count, so this is the row
//  set the board would draw.  EXPECT FOUR: main, stage 1, stage 2, stage 3.
//  Three rows -- or rows labelled stage 0..2 -- is the old behaviour.
// ---------------------------------------------------------------------------
// `scores` -- the command cl_scores.qc:1364 registers, NOT "cl scores", which is
// nothing at all and printed nothing on the first run of this file.  Its dump
// (cl_scores.qc:1247-1250) prints "N leg(s) derived from M zone(s)" and then one
// line per leg with its track, leg number and name, which is precisely the row
// set the board draws.
echo ^5=== b57eclipse 2: the leg list -- expect main + stage 1,2,3 ===
scores
waitms 900
timer
waitms 900

echo ^5=== b57eclipse: done ===
waitms 400
quit
