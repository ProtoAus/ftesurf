// B43ZONES -- reconnaissance only.  Dump the zone table for the two candidate
// maps so the stage test that follows can be aimed with numbers rather than by
// flying around and hoping.
//
// The stage arm/fail rule cannot be tested from a config without CROSSING a
// stage boundary, and a config cannot surf.  What it CAN do is noclip along a
// straight line -- so the test needs the start zone's centre and the stage-1
// zone's centre, and the yaw and pitch between them.  zone_list prints exactly
// that: `idx type trk seg pts bottom..top centre`.
//
// Two maps because the answer decides which one the real test uses:
//   bhop_eazy    3 stage legs on disk, the map the run_stagehop question has to
//                be settled on
//   surf_colin_blaster_69000   8 stages, and the map whose first staged runs
//                are quoted in SV_StageWrite's own tbase essay

log_enable 1
log_dir "logs"
log_name "b43zones"
developer 1
log_developer 1
cfg_save_auto 0
vid_fullscreen 0
sv_cheats 1
fs_missingwarn 0

wait 200
echo ^5=== b43zones: bhop_eazy ===
map bhop_eazy
waitmap 1800
waitms 2500
zone_list
waitms 600

echo ^5=== b43zones: surf_colin_blaster_69000 ===
map surf_colin_blaster_69000
waitmap 1800
waitms 2500
zone_list
waitms 600

echo ^5=== b43zones: done ===
quit
