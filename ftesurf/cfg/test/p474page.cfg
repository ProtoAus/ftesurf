// ===========================================================================
//  P474PAGE -- Patch 474: the online board pages as the list scrolls.
//    python tools/p474page.py        (runs this, then grades the log)
//    lobby_dir is the Pi's surfd on the LAN; surf_utopia's imported board
//    holds ~15,900 rows, so every page below exists.  (surf_aquaflow, the first
//    choice, crashes this PC headless on every engine and csprogs tried.)
//
//  PRE-REGISTERED
//   A  board_fetch: 100 rows, ranks 1..100, `more 1`.
//   B  three board_more: 400 rows, ranks 1..400 contiguous and unique.
//   C  THE SCROLL TRIGGER, the path a player uses: the board on the imported
//      tab is a fresh 100 (an explicit board_fetch -- opening the board does not
//      re-ask for one already asked for); `scores oscroll 85` (within 20 of the end) brings
//      it to 200; `scores oscroll 0` adds NOTHING (far from the end);
//      `scores oscroll 185` brings it to 300.  Ranks contiguous throughout.
//   D  eight more board_more: held 1000 of 1000, `more 0`, and one further
//      board_more answers "not asked".
//   E  a page asked for, then another board in the same frame: the board shown
//      is the ranked one with its own rows only, ranks from 1 -- the imported
//      page landing on it would show as rows past that board's count.
//  CONTROL: the pre-474 csprogs answers `Unknown command` to board_more and
//  holds 64 rows at A, so A-D fail on it.
//
//  RESULT (2026-10-03, this PC, engine e847d3ae, surfd on the Pi):
//    fixed   csprogs 48D1E28C63E5EE52: all 10 checks pass -- A 100, B 400,
//            C1 100 / C2 200 / C3 200 / C4 300, D 1000 and more 0, D2 refused,
//            E ranked with its own 2 rows, Q 0 unknown commands and 0 QC frames.
//    control 680143FF276EDAB3 (HEAD 96483d0, the build live on the lobbies):
//            9 of 10 fail -- 64 rows, 13 `Unknown command`.  E passes: the
//            control cannot append at all, so E says nothing there.
//    mutant  A7C98E5A861B1E3C (all four append guards removed: the supersede
//            in Online_Fetch and Online_Clear, the epoch/state test, the offset
//            test): E FAILS, `rows 102 of ranked 2, ranks NOT contiguous` -- the
//            imported page landed on the ranked board.  Which reply lands first
//            is not controlled, so E is a race the guards win, not a proof.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p474page
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
waitms 5000
lobby_dir "http://192.168.1.102:8084"
map surf_utopia
waitmap 60
waitms 5000
menu_restart
ui_close
waitms 1500

echo ==== P474 A ====
board_fetch 0 0 imported clean
waitms 2500
board_status
waitms 500

echo ==== P474 B ====
board_more
waitms 2000
board_more
waitms 2000
board_more
waitms 2000
board_status
waitms 500

echo ==== P474 C1 ====
scores tab imported
board_fetch 0 0 imported clean
waitms 2500
scores open
waitms 1500
board_status
waitms 300
scores oscroll 85
waitms 2500
echo ==== P474 C2 ====
board_status
waitms 300
scores oscroll 0
waitms 2500
echo ==== P474 C3 ====
board_status
waitms 300
scores oscroll 185
waitms 2500
echo ==== P474 C4 ====
board_status
waitms 300
scores close
waitms 500

echo ==== P474 D ====
board_more
waitms 2000
board_more
waitms 2000
board_more
waitms 2000
board_more
waitms 2000
board_more
waitms 2000
board_more
waitms 2000
board_more
waitms 2000
board_more
waitms 2000
board_status
waitms 500
echo ==== P474 D2 ====
board_more
waitms 500

echo ==== P474 E ====
board_fetch 0 0 imported clean
waitms 2500
board_more; board_fetch 0 0 ranked clean
waitms 3000
board_status
waitms 500

echo ==== P474 END ====
quit
