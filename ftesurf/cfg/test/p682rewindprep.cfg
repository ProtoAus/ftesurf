// Owned dedicated overlay only; never run against install player data.
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
cl_netfps 100
cl_sendguid 1
cl_predict_qchook 1
cl_predict_trace 0
log_enable 1
log_name runlines_smoke
log_developer 1
developer 1
map surf_dune
wait 500
cmd join
wait 200
menu_restart
ui_close
say !m
wait 200
+forward
wait 110
-forward
cmd timer
cmd viewpos
cmd rewindprep_test
wait 150
echo REWINDPREP CLIENT COMPLETE
echo RUNLINES COMPLETE
quit
