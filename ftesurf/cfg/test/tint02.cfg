// TINT02 -- WHICH HALF IS LYING?
//
// tint01 photographed the bug: at save007 an ivy decal renders as a FLAT
// OPAQUE OLIVE RECTANGLE with only the leaves masked, and the COMBINEGLASS
// panels render as opaque glowing slabs instead of glass.
//
// The VMT side insists it did its job.  From tint01.log, every one of the
// fourteen DECALS/* materials reports:
//
//   [vmt] decals/ivy02: alpha 0.000 translucent 1 additive 0 animpass 0
//                       blendfunc src_alpha one_minus_src_alpha
//
// and the map summary says "23 translucent".  So $translucent parsed, and a
// blendfunc was chosen.  Yet the surface is opaque.
//
// The engine-side half of that story is supposed to be gl_shader.c:6506's
//   [shader] <name> sort N prog P passes N bits0 0x..
// (11 = SHADER_SORT_BLEND, 5 = SHADER_SORT_OPAQUE) -- the line Patch 219 added
// for exactly this question.  It printed ZERO times in tint01 despite
// developer 1 being set before the map.  So the one instrument that would
// answer this is itself not reporting, which is worth knowing separately.
//
// So ask the question a different way, with a cvar instead of a print.
// hl2_translucent 0 is documented (mat_vmt.c:1877-1899) as deliberately making
// every blended world surface OPAQUE by withholding the blendfunc:
//
//   if (!hl2_translucent || hl2_translucent->ival)
//       st->blendfunc = "src_alpha one_minus_src_alpha";
//
// It is CVAR_SHADERSYSTEM, so writing it reloads every shader.  Therefore:
//
//   IF the pair of screenshots at 1 and 0 DIFFER -> the blend is reaching the
//      renderer, and the opaque rectangle is something else (a lost alpha
//      channel, or a sort that never became SHADER_SORT_BLEND).
//   IF they are IDENTICAL -> the blend is being dropped downstream of the VMT
//      generator no matter what it emits, which is the Patch 219 failure shape
//      all over again and localises the fix to Shader_Finish, not mat_vmt.
//
// r_reflectcube is the second A/B.  It is the ONLY thing that sets
// PERMUTATION_REFLECTCUBEMASK (gl_backend.c:4384-4418), so at 0 the
// `diffuse_f.rgb += cube_t * refl` term in lightmapped.glsl:227 cannot run.
// If the glowing glass goes dark, that term is what is washing it out.

log_enable 1
log_dir "logs"
log_name "tint02"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
sv_cheats 1
developer 0

wait 200
echo ^5=== tint02: A/B the two switches at save007 ===

map bhop_futile
waitmap 900
waitms 2500
con_clear

/*
  NOCLIP FIRST, AND EXACTLY ONCE.

  The first cut of this file fell out of the sky through all four shots and the
  A/B was worthless: 96.3% of pixels differed between EVERY pair, which is a
  camera moving, not a shader changing.

  FTESurf's setpos is not the engine's.  `Cmd_AddCommand("setpos", NULL)`
  (cl_main.c:6269) is a null handler, i.e. forward-to-server, so the console
  reaches SV_ParseClientCommand's own arm (sv_player.qc:581) and the engine's
  Cmd_SetPos_f never runs.  The QC one shadows it ON PURPOSE and its comment
  lists "it forces MOVETYPE_NOCLIP and leaves you in it" as a REASON NOT TO --
  so it moves you and leaves you in MOVETYPE_WALK, falling.

  `noclip` is a toggle (sv_player.qc:394-412), so it goes here, once, before
  any setpos -- never after one, and never repeated between shots.  Issuing it
  per-shot is what inverted the b37a drop test.
*/
noclip
waitms 300

// save007, the ivy decal + glass view.
setpos 540.3427 4427.8555 7510.5981 11.9092 143.9758 0
wait 150
waitms 600

echo ^5--- A: shipped defaults (hl2_translucent 1, r_reflectcube 1) ---
hl2_translucent 1
r_reflectcube 1
waitms 1500
screenshot tint02_A_default
waitms 1200

echo ^5--- B: hl2_translucent 0 -- deliberately force every blend opaque ---
hl2_translucent 0
waitms 1500
screenshot tint02_B_notrans
waitms 1200

echo ^5--- C: back on, cubemap off -- kills the += cube_t * refl term ---
hl2_translucent 1
r_reflectcube 0
waitms 1500
screenshot tint02_C_nocube
waitms 1200

echo ^5--- D: both off ---
hl2_translucent 0
r_reflectcube 0
waitms 1500
screenshot tint02_D_both
waitms 1200

r_reflectcube 1
hl2_translucent 1
echo ^5=== tint02 done ===
wait 30
quit
