// Patch 457 -- the `hud_player` customizer, after the font / drag / dress fixes.
//
// WHAT IS UNDER TEST, and all three are visible in one panel:
//
//   1. THE FACE AND THE TYPE SCALE.  Av_Draw shipped with the closing Font_Reset
//      and no Font_Set, so it drew in FONT_DEFAULT (the 8 px bitmap) and Font_Px
//      matched no ladder and returned each request unchanged (sh_font.qc:184).
//      The log line `hud_player: face <slot>, snapped 16/12/8 at hud_scale 2` can
//      only be printed by a build that selects the face first: the pre-fix build
//      prints 16/12/10, the unsnapped request.  THAT LINE IS THE GRADE; the
//      screenshot is what says the glyphs are also Roboto and not conchars.
//
//   2. DRESSING WITHOUT A LOBBY.  This is a LISTEN server with no lobby, so
//      cl_pcolour reads 0 -- and Av_Dress used to RETURN on exactly that, leaving
//      the preview body identity white with no trail.  The premise is printed
//      below so a reader can see the 0; the body's colour in the shot is the
//      result.  `lobbyrgb "255 40 200"` is deliberately NOT a palette entry, so a
//      body wearing it cannot be a palette fallback that happened to look right.
//
//   3. THE PARTICLE RATE.  lobbyfx 3 is trail + motes.  Pre-fix, Av_GhostDress
//      read a stamp only Av_Preview wrote and wrote none back; this arm does not
//      reach the ghost, so the burst is NOT what this measures -- the motes here
//      only have to be present and finite.
//
// HOW IT IS RUN, AND IT NEEDS BOTH HALVES:
//
//   pwsh> $s=@{FilePath="C:\FTESurf\ftesurf64.exe";
//             ArgumentList="-WindowStyle","Minimized","+exec","cfg/test/p457av.cfg";
//             WorkingDirectory="C:\FTESurf"}
//   pwsh> (Start-Process @s -PassThru).WaitForExit()
//
// The working directory is load-bearing: the basedir is the cwd, and a shell left
// in ftesurf/ produces no log at all and simply sits there.
//
// CONTROL: run it once against a build with the fixes compiled out (git checkout
// the three files, build -NoDeploy), rename ftesurf/screenshots/p457_panel.png to
// p457_panel_control.png, restore, rebuild, run again.  One picture of a panel is
// not a measurement of a font.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p457av
con_notifytime 0            // the console overlay is not wanted in the shot
// BOTH, AND EARLY.  `developer` alone prints to the console and NOT to the log
// file: Con_DPrintf is gated a second time on log_developer (common.c:9173),
// which defaults to 0 so that "unimportant messages will not fill up your log
// files".  AGENTS.md:899 says so and 525 arms here already set it.  Early
// because r_partinfo below runs long before the panel does.
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
vid_width 1280
vid_height 720
fs_missingwarn 0
sv_public 0
sv_port 27691
set lobby_dir ""
// A SAVED RUN RESUMES AS A PAUSED ONE AND THE BODY IS HELD (MOVETYPE_NONE), so
// +forward moves nothing and a distance-emitted trail never fires.  The first
// cut of this arm sat in "PAUSED RUN 0:42.945" and measured a stationary body.
// p440font.cfg carries the same line for the same reason.
set run_resume 0

// HARNESS TRAP (b63a_logic, b65a_hud, p440font): a +exec'd config runs while the
// engine is still initialising and a `map` issued then is SILENTLY DROPPED.
waitms 4000
set sv_gravity 0            // a still camera: no fall, no slide, no respawn loop
map surf_dune
waitmap 45
waitms 5000
menu_restart
waitms 500
ui_close
waitms 1500

// The layout the measurement depends on.  SET, not assumed: this machine's
// archived ftesurf.cfg overrides default.cfg and its values drift.
set hud_scale 2
set hud_player_x 0.32
set hud_player_y 0.5
waitms 500

echo === PREMISE: a listen server with no lobby, so cl_pcolour must read 0.
echo === Av_Dress returned on exactly this and dressed nothing at all.
cl_pcolour

echo === wear a triple no palette entry matches, plus trail and motes:
setinfo lobbyrgb "255 40 200"
setinfo lobbyfx 3
waitms 800

// Trail length (Patch 457): stop 2 of 0..3, in cyan, so the strip in the panel
// has to be three-quarters lit and cyan rather than the wearer's magenta.
echo === trail: colour 7 (cyan) at length stop 2
setinfo lobbytrail 7
setinfo lobbylen 2
waitms 600

// THE ONLY PROOF THE CLIENT ACTUALLY HAS THE RENAMED BLOCKS.  A server-side
// particleeffectnum verifies nothing -- SV_ParticlePrecache_Add cannot consult
// the clients, so a name with a typo precaches happily, resolves to P_INVALID
// on arrival and draws nothing, silently (p278a.cfg:16-19 says so first).
// Patch 457 renamed every trail block, so this is the arm that would catch it.
// WANT: 48 ftesurf_avtrail<1..4>_<1..12> and 12 ftesurf_avmote_<n>.
echo === r_partinfo: the client's own table
r_partinfo

// THE 2D SCALE, because it decides whether a BAKED size is drawn at its own
// pixel size or upscaled.  PR_CL_ChooseFont (pr_menu.c:114) picks the bake
// nearest the size drawstring was handed, and that size is in CONSPACE units --
// so if conwidth is half the real width, a 12 px bake is blown up to 24 real
// pixels and reads soft no matter how well it snapped.  Font_Px cannot see any
// of this.  WANT: conwidth == width, or the ladder is being drawn at 2x.
echo === the 2D scale: conwidth/conheight against the real framebuffer
vid_conwidth
vid_conheight
vid_width
vid_height
vid_conautoscale

echo === both must still read 1 here, or the grade line below cannot reach the log:
developer
log_developer

echo === the panel.  Two shots 700 ms apart: the oscillating preview body must
echo === differ between them, which is what says the scene rendered at all.
echo === GRADE: `hud_player: face <n>, snapped 20/16/12 at hud_scale 2`.
echo === All three are exact rungs of "8 12 16 20 24 28 32", so a second line
echo === saying OFF THE LADDER must NOT appear.  The pre-fix build prints
echo === 16/12/10 -- the request, unsnapped -- or, with no Font_Set at all,
echo === nothing, because the line did not exist yet.  It was 16/12/8 until the
echo === asks were re-cut: 5*2 = 10 ties between rungs 8 and 12 and Font_Px
echo === breaks the tie downward, so the small text was 8 by accident.
hud_player open
waitms 1500
screenshot p457_panel
waitms 700
screenshot p457_panel_b
waitms 300

// THE PLUS-CROSS (Patch 457).  Through the mod's own keys, not the engine's --
// the panel writes these and the resolve publishes topcolor/bottomcolor in the
// 0xRRGGBB form for the shirt/pants overlay.  Two saturated, clearly different
// colours so a seam is unmistakable and a flip would be obvious.
// WANT: a red waist band and a red vertical bar on each face, over a blue body,
// and the panel's cross/body/plain chips with "cross" lit.
echo === the plus-cross: red cross on a blue body
setinfo lobbymark "255 40 40"
setinfo lobbybody "40 80 255"
waitms 1200
screenshot p457_halves
waitms 300

hud_player close
waitms 500

// ---- THE TRAIL, FOR REAL -------------------------------------------------
// r_partinfo above lists only effects that currently HOLD PARTICLES (its "Full
// list" is the allocated types, not the registered table -- it printed one line,
// ftesurf_fire, because that is all that was running).  So the name check needs
// the trail to actually emit, and emitting needs a MOVING body drawn in a view
// that renders the world: the panel's preview is VF_DRAWWORLD 0 and can never
// do it.  Ghost mode is that view -- the stand-in is the player's own body, it
// keeps its velocity when the camera detaches, and Av_GhostDress emits on it.
//
// WANT: a ftesurf_avtrail3_7 line (stop 2, cyan).  Anything else -- especially
// nothing at all -- means the name QC builds and the name the generator wrote
// have drifted, which precaches and draws silently.
// sv_gravity BACK ON: it was 0 to hold the camera still for the panel shots,
// and a body that is never grounded is a body ground acceleration never reaches.
sv_gravity 800
waitms 700
echo === before: the server's own speed read (Patch 435 prints horizontal N)
cmd viewpos

// STOP 0 FOR THE EMISSION PROOF, and the arithmetic is why.  `step` is units of
// travel per particle, so the DENSEST stop is the one that fires soonest: 16
// units at stop 0 against 48 at stop 2.  A first cut sampled at stop 2, 300 ms
// after ghosting, with the body already down to 75 u/s -- 22 units of travel,
// i.e. half of one particle, and it read "no trail" when the real answer was
// "not far enough yet".  One name proves the sprintf; all 48 blocks are proven
// to exist by the generator's own count (60 = 48 trail + 12 mote).
// WANT: ftesurf_avtrail1_7.
setinfo lobbylen 0
waitms 300

// ---- THE SELF-TRAIL (Patch 457), A/B'd INSIDE ONE RUN --------------------
// Nothing drew your own trail before this: lobby_av_self is 0, so the engine
// drops your avatar before networking it back to you, and the trail everyone
// else sees is emitted for that avatar.  Av_SelfTrail emits the same block from
// your own feet, client side.
//
// cl_trailself is the control and it needs no second build: OFF first (so the
// pool is clean), move, and the client's table must hold NO ftesurf_avtrail
// type; then ON, the same movement, and it must.  Off is run first because
// particles outlive their emitter -- stop 0 dies in 0.45-0.70 s, hence the wait
// between the halves.
echo === CONTROL: own trail OFF, moving and ATTACHED.  WANT: no avtrail type.
cl_trailself 0
+forward
waitms 1200
r_partinfo
-forward
waitms 2500

echo === SUBJECT: own trail ON, same movement.  WANT: ftesurf_avtrail1_7.
cl_trailself 1
+forward
waitms 1200
r_partinfo

echo === build speed, then ghost so the body is in frame with its trail
waitms 600
echo === after +forward, still attached:
cmd viewpos
ghost
-forward
echo === r_partinfo IMMEDIATELY, while the body is still near full speed:
r_partinfo
cmd viewpos
waitms 250
echo === and again, after a little more travel:
r_partinfo
cmd viewpos
screenshot p457_trail
waitms 400
screenshot p457_trail_b
waitms 300
quit
