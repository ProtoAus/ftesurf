// P393SENS -- Patch 393: hud_strafe_sens scales the strafe bar's fill,
// frac = err * sens / (4 * band); sens 4 is the pre-393 bar (err / band), exactly
// (x4 and /4 are exact in floating point).  Listen server, bhop_eazy, the fill
// driven by a replay (data/online/16.rec, a bhop run); `hud_strafe_probe` prints
// the last drawn err and frac.  One run with +set log_name.
//
// PRE-REGISTERED
//  A `hud_strafe_sens` is 1 with nothing set (default.cfg).
//  B on every probe with |frac| < 1: frac = err * sens / 4 within 1e-5, at sens 4
//    (i.e. the old err/band) and at sens 1; with |err*sens/4| >= 1, frac = +-1.
//  C at least 4 probes per sens land on an in-air frame with err != 0.
//  D the hud_edit strafe pane shows "Sensitivity" as its third row (screenshot).
// FALSIFIED IF A, B or C fails, or D does not show the row.
//
// RESULT (2026-09-20).  ALL HELD.  A "1" (default).  B/C 9 in-air probes per sens:
//   sens 4 frac == err (-0.40395, -0.93417, ...), sens 1 frac == err/4 (-0.53990
//   -> -0.13498, -1.00000 -> -0.25000, 0.15462 -> 0.03865).  D the pane's third
//   row reads 1x (screenshots/bhop_eazy_041.png; the dev console hides its label).
cfg_save_auto 0
log_enable 1
log_dir logs
developer 1
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
sv_cheats 1
fs_missingwarn 0
set run_resume 0
sv_port 27682
hud_scale 2

wait 200
map bhop_eazy
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 1000
echo ^5=== p393 A ===
hud_strafe_sens
echo ^5=== p393 D ===
hud_edit on
waitms 600
hud_edit strafe
waitms 800
screenshot
waitms 600
hud_edit off
waitms 500
echo ^5=== p393 B ===
replay data/online/16.rec
waitms 3000
replay play
waitms 2500
hud_strafe_sens 4
waitms 300
hud_strafe_probe
waitms 400
hud_strafe_probe
waitms 400
hud_strafe_probe
waitms 400
hud_strafe_probe
waitms 400
hud_strafe_probe
waitms 400
hud_strafe_probe
hud_strafe_sens 1
waitms 300
hud_strafe_probe
waitms 400
hud_strafe_probe
waitms 400
hud_strafe_probe
waitms 400
hud_strafe_probe
waitms 400
hud_strafe_probe
waitms 400
hud_strafe_probe
hud_strafe_sens 4
waitms 300
hud_strafe_probe
waitms 400
hud_strafe_probe
waitms 400
hud_strafe_probe
hud_strafe_sens 1
waitms 300
hud_strafe_probe
waitms 400
hud_strafe_probe
waitms 400
hud_strafe_probe
screenshot
waitms 500
replay stop
echo ^5=== p393 DONE ===
waitms 500
quit
