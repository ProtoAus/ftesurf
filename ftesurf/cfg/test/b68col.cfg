// RETIRED (Patch 355): arms using `scores tier community` and the Carol/Erin
// seed rows no longer apply -- the board draws ranked only.  Kept as the record.
// Build 68: does the online board have a replay column, and does it say the
// right word?
//
// WHAT THIS CAN AND CANNOT PROVE.
//
//   PROVEN HERE.  That the column table actually widened (rec_sb_cols, which is
//   set by the DRAW and read back by `scores status`), that a row carrying a
//   replay id reads "watch", and that the same row on a board with no replay
//   reads the other word.  All three are numbers and strings the drawer itself
//   produced, not recomputations.
//
//   NOT PROVEN HERE, AND IT CANNOT BE.  The CELL.  It is a sui row and no cfg
//   in this tree drives a cursor -- the same limit cl_scores.qc already records
//   for the online row, which is why board_replay exists and why build 68 folds
//   the replay word into board_status' per-row line rather than adding a ninth
//   argument nothing would have printed.  So what is checked is the string the
//   cell is handed, one layer under the pixels.
//
//   NOT PROVEN HERE.  The colour.  SBC_GOOD vs SBC_DIM is a vector argument and
//   nothing prints it.
//
// PREDICTION:
//   arm 1  cols 83          (76 before this build; if it reads 76 the defines
//                            did not take and everything below is meaningless)
//   arm 2  the surf_kitsune ranked row's line ENDS IN "watch" -- surfd serves
//          rep 1 for it, verified over https the same hour
//   arm 3  the community board holds no rows, so it proves only that asking for
//          it does not fault
//   arm 5  bhop_eazy's two ranked rows both end in "none"
//   arm 6  bhop_eazy's community row ends in "remote", BESIDE its "no ruleset"
//          -- the two columns coexist rather than one displacing the other
//
// FALSIFIED IF: cols reads 76; or a row's word is missing or is the word for
// another case; or any "QC"/"PR_ExecuteProgram"/"runaway" line appears.
//
// READ `cols 0` AS "NOT DRAWN YET", NOT AS A FAILURE.  rec_sb_cols is assigned
// at the top of the DRAWER, so `scores status` reports 0 until the board has
// been drawn at least once since the CSQC load -- and a `map` reloads CSQC, so
// it returns to 0 at every map change.  How many frames that takes is not
// deterministic in a scripted run: the measured run has eleven 0 readings and
// four 83s, with arms 1-2 reading 0 on one pass and 83 on another at the same
// wait.  The assertion that means anything is therefore NOT "arm 1 prints 83"
// but "every non-zero reading is 83 and none is 76", which is exactly what a
// `grep -o "cols [0-9]*" | sort | uniq -c` over the log answers.  The row words
// do not share this problem -- board_status reads the parsed rows directly and
// does not depend on anything having been drawn.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name b68col
developer 1

name "^3Lex Col"

// FORTY SECONDS.  The engine's own startup is a ~91,000-file filesystem scan
// here; a cfg that starts issuing commands before that finishes is issuing them
// into a console that has not registered anything yet.  See
// cfg/test/b67join.cfg's header for the full version of this trap and for
// the SECOND one (menu_restart), which does not apply to this file because
// nothing here is a menuqc command -- `scores` and `board_*` are CSQC, and CSQC
// is loaded by the map below.
waitms 40000

// `map`, NEVER `connect`.  A scripted connect leaves a menu up and notmenu 0
// blanks every CSQC panel, so the board would never draw and cols would never
// be set -- which would read exactly like the defines not taking.
map surf_kitsune
waitmap 30

echo ^5==== b68col arm 1: the table widened ====
// `scores` on its own TOGGLES, and the toggle is the point: rec_sb_cols is set
// by the drawer, so it does not exist until the board has been drawn at least
// once.  `scores status` alone would report whatever was left from last time.
scores
waitms 1500
scores status
waitms 500

echo ^5==== b68col arm 2: the ranked row carries a replay ====
scores tab online
scores tier ranked
scores refresh
waitms 5000
board_status
waitms 500

echo ^5==== b68col arm 3: the other tier does not fault ====
scores tier community
scores refresh
waitms 5000
board_status
waitms 500

echo ^5==== b68col arm 4: cols again, with the online tab up ====
scores status
waitms 500

// THE OTHER TWO WORDS, AND WHY THEY NEED A SECOND MAP.
//
// surf_kitsune's board is one row and that row HAS a recording, so arms 1-3
// exercise exactly one of Online_RepString's three answers.  Leaving it there
// would be the shape of test this tree keeps having to redo: the branch that
// fired is proven and the two that did not are assumed.
//
// bhop_eazy is the map that separates them, and it does so with rows that were
// already on the live board rather than anything staged for this test -- five
// rows, all predating build 66's recorder, so all of them carry rep 0:
//   ranked/clean      Bob, Alice   -> "none"    (one should exist and does not)
//   community/clean   Carol        -> "remote"  (set where we hold nothing)
// That is the tier distinction the word exists to draw, on real data, and it is
// also the one case surfd's own note says the wire cannot distinguish further.
map bhop_eazy
waitmap 30

echo ^5==== b68col arm 5: ranked rows with no recording say "none" ====
scores
waitms 1500
scores tab online
scores tier ranked
scores refresh
waitms 5000
board_status
waitms 500

echo ^5==== b68col arm 6: a community row says "remote" ====
scores tier community
scores refresh
waitms 5000
board_status
waitms 500

echo ^5==== b68col arm 7: cols is the same table on the other map ====
scores status

echo ^5==== b68col: done ====
waitms 2000
quit
