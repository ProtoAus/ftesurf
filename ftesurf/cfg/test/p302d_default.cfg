cfg_save_auto 0
// Patch 302 -- does the DEFAULT actually take effect?
//
// A default flip is the one change that is easy to make and easy to not verify:
// every arm that sets the cvar explicitly passes either way, so the thing being
// tested is precisely the path where NOBODY SETS IT.  This run never writes
// hl2_lt_worldlight at all until the last arm.
//
// PRE-REGISTERED:
//   F1 (untouched, default) must reproduce p302a_a2_on -- the arm that had the
//   cvar explicitly at 1 -- to within the harness noise floor, which on this map
//   and vantage measured 0.000% (the two off-arms of p302a were bit-identical).
//   F2 sets it to 0 by hand and must reproduce p302a_a1_off, the pre-patch look.
//   If F1 matches F2 instead, the default did not land.
vid_fullscreen 0
vid_restart
waitms 3000
wait 200

developer 1
log_developer 1
log_enable 1
log_dir logs
log_name p302d_default
cl_maxfps 0
cl_idlefps 0
sv_cheats 1
con_notifylines 0
con_notifytime 0.01
r_drawviewmodel 0

map surf_tensor2
waitmap 600
waitms 9000
waitms 3000
noclip
waitms 1000

alias vs12 "setpos -12300.9990 10799.1201 -9654.1191 3.1311 43.4784 0; waitms 2500"

echo ^5=== F1: cvar NEVER SET -- this is the default and the whole point
vs12
screenshot p302d_f1_default
waitms 1200

echo ^5=== F2: explicit 0 -- must be the pre-patch look
hl2_lt_worldlight 0
waitms 2500
vs12
screenshot p302d_f2_off
waitms 1200

echo ^5=== F3: explicit 1 -- must equal F1
hl2_lt_worldlight 1
waitms 2500
vs12
screenshot p302d_f3_on
waitms 1200

echo ^5=== END OF RUN ===
waitms 500
quit
