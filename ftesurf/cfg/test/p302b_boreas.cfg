cfg_save_auto 0
// Patch 302 -- the boreas control, done properly this time.
//
// THE FIRST ATTEMPT ASKED THE WRONG QUESTION.  p302a asserted that the two arms
// must be BIT-IDENTICAL across the whole frame.  They were not: 96.9% of pixels
// differed by >=1 level, signed mean +0.23.  That assertion was wrong in two
// ways at once and I could not tell which from the run I had:
//
//   1. surf_boreas ANIMATES.  There is falling snow in the frame.  A whole-frame
//      equality test on an animated map cannot pass, and p302a had no repeat arm
//      to measure that -- surf_tensor2's indoor room gave a 0.000% noise floor
//      and I wrongly carried that expectation across to a different map.
//   2. THE PATCH IS SUPPOSED TO CHANGE SOME OF THIS FRAME.  Only BAKED STATIC
//      PROPS must be untouched.  Every other model lit through LightPointValues
//      -- anything that is not a static prop -- SHOULD gain the direct term,
//      exactly as Source's light cache gives it to them.  "The whole frame is
//      identical" was never the claim; "baked props are identical" is.
//
// So this run measures the map's own frame-to-frame variation FIRST, and asks
// the prop question with NUMBERS instead of pixels.
//
// PRE-REGISTERED:
//   C1 vs C2 is the same cvar twice.  Whatever it shows IS the noise floor of
//   this map at this vantage.  Nothing below means anything until it is known.
//
//   C1 vs C3 (the cvar actually flipping) must be INDISTINGUISHABLE from C1 vs
//   C2 on the baked-prop population.  If C1-C3 is materially larger than C1-C2,
//   the suppression is broken and Patch 302 is re-lighting props that were
//   already correct.
//
//   C4 returns to 0 and must reproduce C1 within the C1-C2 floor.
//
//   THE DECIDING EVIDENCE IS THE prop_census LINES, NOT THE SCREENSHOTS.  A bare
//   `prop_census` prints only usage -- that is what made the first attempt
//   useless -- so each arm censuses three props BY INDEX.  Those lines carry the
//   lighting the renderer actually applied.  For a baked prop they must be
//   character-for-character identical between C1 and C3.
vid_fullscreen 0
vid_restart
waitms 3000
wait 200

developer 1
log_developer 1
log_enable 1
log_dir logs
log_name p302b_boreas
cl_maxfps 0
cl_idlefps 0
sv_cheats 1
con_notifylines 0
con_notifytime 0.01
r_drawviewmodel 0

map surf_boreas
waitmap 600
waitms 9000
waitms 3000
noclip
waitms 1000

alias vbor "setpos 10085.2373 -14374.5410 3199.9836 17.1716 39.4080 0; waitms 2500"

echo ^5=== C1: worldlight 0
hl2_lt_worldlight 0
waitms 2500
vbor
screenshot p302b_c1_off
waitms 800
echo ^5--- census C1
prop_census 0
waitms 600
prop_census 500
waitms 600
prop_census 1000
waitms 600

echo ^5=== C2: worldlight 0 AGAIN -- this is the noise floor, nothing else
vbor
screenshot p302b_c2_off_repeat
waitms 800

echo ^5=== C3: worldlight 1 -- baked props must not move
hl2_lt_worldlight 1
waitms 2500
vbor
screenshot p302b_c3_on
waitms 800
echo ^5--- census C3
prop_census 0
waitms 600
prop_census 500
waitms 600
prop_census 1000
waitms 600

echo ^5=== C4: back to 0
hl2_lt_worldlight 0
waitms 2500
vbor
screenshot p302b_c4_off_again
waitms 800

echo ^5=== END OF RUN ===
waitms 500
quit
