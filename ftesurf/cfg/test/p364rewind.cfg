// P364REWIND -- the recorder's counters across a rewind (listen server).
// Zones: cfg/test/p360sf.zones.json as maps/zones/local/surf_666.json (DELETE
// AFTER); back up data/runs/surf_666 first -- this writes local runs.
//
// Arm L: walk, sl_save, walk on, sl_load (the buffered recorder rewinds to the
//        save's mark), walk to the finish -> a shadow run's .rec.
// Arm R: walk, rec_retry (map_restart, the prefix reloaded from the retry slot),
//        walk to the finish.
// Arm C: sl_last (L's save 6) after R's restart (no buffer: the cold path), finish.
//        `sl_load` here loads save 1: the cursor resets with the map.
// Arm D (review): retry, sl_save late, retry again, sl_last at once, finish.
//        The serial restarted with each map load, so the save matched the second
//        retry's buffer and rewound WARM across a counter restart: no `pause`.
//        PREDICTED before the fix: FAIL "movetick goes backwards" (the save's rows
//        are ~3 s of counter past the reload).  After: v10 ok, `pauses retry,
//        retry, load` -- the save's own retry, the second retry, then the load.
// The claim under test: after a rewind the trailer's counts agree with the body,
// and a prefix read off disk continues in a v10 session (Patch 364).
// PREDICTIONS (Patch 364): L v9, 0 faults (warm, no pause).  R v10, 0 faults,
// `sessions 1`, `pauses retry`.  C v10, 0 faults, `pauses load`.  CONTROL: R's
// file minus pause/session/seed (trailer back to 10 fields) must fault.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p364rewind
developer 1
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
sv_port 27631
sv_cheats 0
waitms 5000
map surf_666
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 500
set rec_terms 1
echo ^5==== L: save, walk, load, finish ====
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 1500
cmd sl_save
waitms 1000
-forward
waitms 300
cmd sl_load
waitms 500
+forward
waitms 5000
-forward
waitms 1500
cmd timer
echo ^5==== R: retry, finish ====
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 1500
-forward
waitms 300
cmd rec_retry
waitms 6000
+forward
waitms 5000
-forward
waitms 1500
cmd timer
echo ^5==== C: cold load of L's save after the restart, finish ====
cmd sl_last
waitms 1500
+forward
waitms 5000
-forward
waitms 1500
cmd timer
echo ^5==== D: retry, save late, retry, load at once, finish ====
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 1000
-forward
waitms 300
cmd rec_retry
waitms 6000
+forward
waitms 3000
-forward
waitms 300
cmd sl_save
waitms 300
+forward
waitms 500
-forward
waitms 300
cmd rec_retry
waitms 6000
cmd sl_last
waitms 500
+forward
waitms 5000
-forward
waitms 1500
cmd timer
echo ^5==== done ====
waitms 500
quit

