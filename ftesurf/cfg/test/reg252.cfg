// REG252 -- usercmds are paced to a whole number of physics ticks.
//
// THE ASSERTION, and it is the same file that found the bug.  netv10b.cfg set
// cl_netfps 100 on a surf map (pm_ticrate 0.015) and recorded
//
//     packet interval 10.00 ms,  motion in ticks 101101101101101...
//     117 of 351 usercmds moved the player ZERO units
//
// because PMSrc_PlayerMove runs whole ticks and carries the remainder
// (pm_source.c:2984), so 10 ms commands into a 15 ms mover stall every third
// one.  Patch 252 rounds the command interval to the nearest whole tick, so the
// SAME settings must now record 15.00 ms packets and 111111111.
//
// THREE ARMS, all at cl_netfps 100 except C:
//
//   A  cl_netfps 100   snap 1    the bug's exact settings -> must read 1111
//   B  cl_netfps 100   snap 0    the control.  cl_netfps_snap is a bisection,
//                                so this must put the 011 back.  If A and B
//                                read the same, the cvar is not doing anything
//                                and A proves nothing.
//   C  cl_netfps 33.33 snap 1    asking for FEWER packets must still work:
//                                30 ms = 2 whole ticks, so 2222, uniform.
//                                The patch removes the non-integer relationship,
//                                not the user's ability to send less often.
//
// CVARS ARE SET AFTER waitmap, ALWAYS.  cl_netfps is CVAR_ARCHIVE and the saved
// ftesurf.cfg loads after a +exec'd cfg -- an earlier attempt at this test set
// it at the top of the file, printed `"cl_netfps" is "100"` on the next line,
// and produced a null result.  That override is the bug's own delivery
// mechanism, so tripping over it inside its own regression test would be
// especially silly.
//
// Each arm re-arms with zone_goto and walks again, so each sl_save writes its
// own recording.  Three saves are created under data/saves/surf_rise/ and the
// caller deletes them; surf_rise's save000-002 are the user's and must survive.

log_enable 1
log_dir "logs"
log_name "reg252"
developer 1
log_developer 1
cfg_save_auto 0
sv_cheats 0
fs_missingwarn 0
cl_idlefps 0
vid_fullscreen 0
con_notifylines 0
scr_conalpha 0

wait 200
map surf_rise
waitmap 1800
waitms 3000

// ---- A: the bug's settings, snapped -----------------------------------------
echo ^5=== reg252: A -- cl_netfps 100, snap 1, MUST read 1111 ===
cl_netfps 100
cl_netfps_snap 1
waitms 600
cl_netfps
cl_netfps_snap
pm_ticrate
waitms 400
cmd zone_goto 0 16.18 0
waitms 900
+forward
waitms 4000
-forward
waitms 500
cmd sl_save
waitms 1500

// ---- B: the control ---------------------------------------------------------
echo ^5=== reg252: B -- cl_netfps 100, snap 0, MUST read 011 again ===
cl_netfps 100
cl_netfps_snap 0
waitms 600
cl_netfps_snap
waitms 400
cmd zone_goto 0 16.18 0
waitms 900
+forward
waitms 4000
-forward
waitms 500
cmd sl_save
waitms 1500

// ---- C: fewer packets, still uniform ----------------------------------------
echo ^5=== reg252: C -- cl_netfps 33.3333, snap 1, MUST read 2222 ===
cl_netfps 33.3333
cl_netfps_snap 1
waitms 600
cl_netfps
waitms 400
cmd zone_goto 0 16.18 0
waitms 900
+forward
waitms 4000
-forward
waitms 500
cmd sl_save
waitms 1500

echo ^5=== reg252: done ===
waitms 600
quit
