// Patch 338 -- TELEPORT_SEND_PLAYER under power, take 2.  trig_tp 1 walk
// places us west of the -129 face; ONE `cmd noclip` then lands in NOCLIP
// (engine flips to WALK, the mod's QC handler flips back -- the documented
// double-toggle), which flies level instead of falling out of the volume.
// Crossing the face must fire kind 1 on the client (mapspawn-ON since
// load+0.5 s) with no correction beyond the entry-edge class.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p338e
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
wait 600
connect 127.0.0.1:27666
waitms 15000
cl_prederror 2
cl_trigdebug 1
echo === approach:
trig_tp 1 walk
waitms 800
cmd noclip
waitms 800
+forward
waitms 1500
-forward
waitms 1500
echo === pos (expect TELE_LEVEL_1 == spawn -6080 8192 1):
cmd viewpos
waitms 800
echo === p338e done
quit
