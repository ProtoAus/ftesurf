// PATCH 349 + QC BUILD 88 -- pm_verify: does the replay, run through the live
// timer's own zone scan, finish the run where and when the file says?
//
//   ftesurf64.exe +set log_name p349verify +exec p349verify
//
// SUBJECT  data/b88fin.rec -- FINISHED v9 on bhop_eazy (b88fin.cfg: jump start,
//          duck, speed, then a noclip flight into END; so it carries a `pm`
//          record for the noclip switch at row 289).  end ticks 662, instart
//          604 604, inend 1266, zseed evzone=-1 azone=0 track 0 twarp=1.
// NEGATIVE CONTROLS (derived from the subject, one edit each):
//   N1 p349_ticks.rec  end ticks +1                  -> HOLD "ticks"
//   N2 p349_zcrc.rec   zonecrc deadbeef              -> REFUSE "zone table"
//   N3 p349_cut.rec    last 40 rows cut, inend/end
//                      rewritten to match            -> HOLD "no finish"
//   N4 p349_samp.rec   one mid-run sample x +0.01    -> HOLD "state ... row"
// OUT OF SCOPE (must REFUSE, never HOLD):
//   b87warp.part (v9, unfinished), b85ride.part (v8), e3trace.rec (v6)
//
// PRE-REGISTERED
//   1  b88fin: "VERIFY data/b88fin.rec PASS ticks 662 rows 634".
//   2  N1 HOLD ticks (663 vs 662... the zones say 662, the file 663).
//   3  N2 REFUSE a different zone table; N3 HOLD no finish; N4 HOLD state,
//      first at the edited sample's packet.
//   4  the three out-of-scope files REFUSE with the stated reason.
// FALSIFIED IF: the subject is not PASS at 662; any negative control PASSes;
// an out-of-scope file HOLDs.
log_enable 1
log_dir logs
developer 0
set rec_enable 0
set rec_stream 0
cl_idlefps 0
cl_maxfps 100

waitms 6000
map bhop_eazy
waitmap 45
waitms 4000
echo ================================ P349 S b88fin.rec
pm_verify data/b88fin.rec
waitms 1500
echo ================================ P349 N1 ticks
pm_verify data/p349_ticks.rec
waitms 1500
echo ================================ P349 N2 zcrc
pm_verify data/p349_zcrc.rec
waitms 1500
echo ================================ P349 N3 cut
pm_verify data/p349_cut.rec
waitms 1500
echo ================================ P349 N4 samp
pm_verify data/p349_samp.rec
waitms 1500
echo ================================ P349 O1 b87warp.part
pm_verify data/b87warp.part
waitms 1500
echo ================================ P349 O3 e3trace.rec
pm_verify data/e3trace.rec
waitms 1500
map surf_ecosystem
waitmap 60
waitms 4000
echo ================================ P349 O2 b85ride.part
pm_verify data/b85ride.part
waitms 1500
echo ================================ P349 done
waitms 500
quit
