// Patch 229 + Build 34 -- do props actually stop the player now?
//
// The reported symptom was ahop_coast props with no collision plus a client/server
// fight on contact.  Two separate defects, and BOTH have to land or nothing changes:
//
//   Build 34 (QC)   worldspawn now sets sv_gameplayfix_setmodelrealbox 1 and
//                   sv_gameplayfix_setmodelsize_qw 1.  Without them PF_setmodel
//                   leaves .mins/.maxs at '0 0 0' for QW progs (pr_cmds.c:3156),
//                   and AddEntityToPmove bails on exactly that at sv_user.c:7049.
//   Patch 229 (eng) SOLID_PHYSICS_TRIMESH/BOX added to AddLinksToPmove's solid
//                   filter, and AddEntityToPmove given a branch that attaches the
//                   model, angles and scale.
//
// MEASURED SETUP, from the map's own entity lump:
//   ahop_coast carries 284 prop_* entities -- 263 prop_dynamic_override, 18
//   prop_dynamic, 2 prop_ragdoll, 1 prop_physics -- of which 269 write "solid" "6"
//   (VPhysics).  Every one is modelscale 1.0.
//   The barrels under the reporter's save-lock are models/props_c17/oildrum001.mdl
//   at z = -14643.0, and save003 sits at (-12838.46, -6255.48, -14384.63): almost
//   directly above one, 258 units up and ~12 units off-axis, well inside an
//   oildrum's radius.
//
// THE TEST, which is the reporter's own: drop from the save-lock and read where
// the player comes to rest.  An oildrum001 is ~44 units tall, so:
//
//   collision WORKS   -> rest near z = -14599 (barrel top)
//   collision ABSENT  -> fall straight through to the floor at/below z = -14643
//
// That is a >40 unit gap; there is no ambiguity to argue about.
//
// Two readings before the drop:
//   `props:` must say 284 spawned (269 solid, 0 scaled) and must NOT print
//   "with NO BOUNDS" -- that counter is new in Build 34 and is the direct
//   evidence that setmodel handed over real bounds.
//   r_showhull 1 draws the hull the client believes it is colliding with;
//   CLQ1_AddVisibleHulls walks exactly SOLID_PHYSICS_* edicts, so it is the right
//   instrument here and is deliberately useless for prop_static.

log_enable 1
log_name p229ctl
developer 0
cfg_save_auto 0
cl_idlefps 0
sv_cheats 1

wait 200
echo ^5=== p229ctl (PRE-PATCH CONTROL): prop collision, server side ===

map ahop_coast
waitmap 900
wait 120

echo ^5--- 1. did the bounds arrive? (expect 284 spawned (269 solid, 0 scaled), NO "NO BOUNDS") ---
waitms 600

echo ^5--- 2. the drop. from the reporter's save003, onto an oildrum001 ---
echo ^5(barrel base z -14643, barrel top ~ -14599, floor at/below -14643)
setpos -12838.46 -6255.48 -14384.63
wait 60
echo ^5(falling...)
wait 300
echo ^5(resting position -- z near -14599 means the barrel held us:)
viewpos
waitms 800

echo ^5--- 3. second drop, same spot, to confirm it is stable and not a one-frame catch ---
setpos -12838.46 -6255.48 -14384.63
wait 360
viewpos
waitms 800

echo ^5--- 4. the hull the client predicts against ---
r_showhull 1
wait 120
screenshot
waitms 800
r_showhull 0

echo ^5=== p229ctl (PRE-PATCH CONTROL) done ===
wait 30
quit
