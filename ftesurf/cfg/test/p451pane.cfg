// P451PANE -- the hud_edit pane with the run line's twenty-one rows on it.
// The editor refuses to open while a replay is up, so this opens it with none.
// A non-contiguous HE_OptDef row truncates the pane SILENTLY, so the check is
// that the last row (Units) is on screen and the reset button still reaches it.
log_enable 1
log_dir "logs"
log_name p451pane
developer 0
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0
sv_public 0
sv_port 27711
set lobby_dir ""
wait 200
map surf_aesthetic
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 1500
hud_edit lines
waitms 1200
screenshot screenshots/p451pane.png
waitms 800
hud_edit status
waitms 400
hud_edit off
waitms 300
quit
