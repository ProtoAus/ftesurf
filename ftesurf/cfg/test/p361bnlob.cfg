// P361BNLOB -- the banner on a lobby, placements from the server's keys.
// Server: p360sfsv.cfg (lobby.cfg, the p360sf.zones.json fixture), stub
// `b65stub.py cert 8131 1` (1 s reply delay).  Client half; see p360sfsv.cfg.
//
// PREDICTIONS (pre-registered):
//   A  t=1.3 s (stage 1 posted at the S2 boundary, answer pending): compact
//      "STAGE 1" | "..." / "asking the leaderboard".
//      t=2.4 s: "STAGE 1" | "#3 of 17" / "TOP 10".
//      t=5.3 s (just finished): full "MAP COMPLETE" | "..."; tail leg 4 "...".
//      t=7.2 s: full "#3 of 17" / "TOP 10"; tail "#3 of 17" / "TOP 10".
//   R  `!s 2` from the S2 box: full "STAGE 2 COMPLETE" read from *wrank leg 2.
//   K  `results` during the hold (review fix): the banner starts to leave
//      (outat set), the card is shown with the cursor (p361B_results); a second
//      `results` closes it.
//   CARD  the results card is held while the full banner is up (p361B_full shows
//      no card) and fades in after it leaves (p361B_card at 10.5 s: card, kind 0).
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p361bnlob
developer 0
cl_idlefps 0
cl_maxfps 100
rate  2000000
drate 5000000
vid_fullscreen 0
vid_conautoscale 0
vid_conwidth 1280
vid_conheight 720
waitms 6000
connect 127.0.0.1:27631
waitms 12000
menu_restart
waitms 300
ui_close
waitms 300
set rec_terms 1
hud_scale 2
set hud_banner 1
set hud_banner_stages 1
set hud_banner_hold 3.5
echo ^5==== A: walk ====
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 1300
echo ^5--- A 1.3 ---
banner
waitms 1100
echo ^5--- A 2.4 ---
banner
screenshot p361B_stage
waitms 2900
echo ^5--- A 5.3 ---
banner
waitms 1900
echo ^5--- A 7.2 ---
banner
screenshot p361B_full
waitms 3300
echo ^5--- A 10.5 (banner gone) ---
banner
screenshot p361B_card
-forward
waitms 3000
echo ^5==== R: !s 2 ====
say !s 2
waitms 1500
+forward
waitms 1800
banner
waitms 1500
banner
-forward
waitms 1000
echo ^5==== K: results during the hold ====
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 6000
-forward
results
waitms 400
banner
screenshot p361B_results
results
waitms 300
banner
echo ^5==== done ====
quit

