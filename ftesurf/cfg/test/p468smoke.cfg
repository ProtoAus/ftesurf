cfg_save_auto 0
// PATCH 468 smoke: raw input enumerates and registers the precision touchpad.
// Needs no hand on the pad -- the acceptance itself is cfg/test/p468pad.cfg.
// `in_restart` re-runs the raw-input init with developer on and the log open,
// since the startup init prints before either is set.
//
// READ logs/p468smoke.log for, in this order:
//   "Raw input: precision touchpad [N] \\?\HID#..."      the digitizer collection
//   "Raw input: initialized with N mice, M keyboards and 1 touchpads"
//   "Raw input: precision touchpad registered -- handle-less motion accepted within 0.5 s of its reports"
// On a machine with no precision touchpad the second line ends "and 0 touchpads"
// and the other two are absent; that is the no-change case, not a failure.

exec cfg/test/_quiet.cfg

developer 1
log_developer 1
log_enable 1
log_dir logs
log_name p468smoke

waitms 2500
echo ^5=== P468 smoke: in_restart
in_restart
waitms 2500
in_rawinput_touchpad
echo ^5=== END OF RUN ===
waitms 500
quit
