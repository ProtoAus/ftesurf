// FOG02 -- Patch 254 stage 2: fog you can actually SEE, plus the cull guard.
//
// fog01 proved the numbers reaching the engine are the map's own, but every map
// it used starts the player in an enclosed room inside the fog start distance,
// so the screenshots showed no fog and proved nothing about pixels.  These three
// maps put fog right on top of the spawn point.
//
//   surf_legends    start 0, end 2700, m 1, grey 192.  Fully fogged at 2700
//                   units from the eye, and fogstart 0 -- which is also the
//                   condition the fog far-plane cull needs, see below.
//                   expect: fog 2700, rgb .752941 x3, a 1, bias 0
//
//   bhop_bowling    start 0, end 5000, m 0.1.  THE reparametrisation test, and
//                   the most visual one in the library: Source takes min(m,u),
//                   so end' = 0 + 0.1*5000 = 500.  A naive m*u implementation
//                   emits 5000 with alpha 0.1 and draws the fog TEN TIMES too
//                   thin.  Both look like "fog"; only one looks like Source.
//                   expect: fog 500, rgb .650980 .850980 1.000000, a 0.1, bias 0
//
//   surf_sidistic   start 50, end 3600, m 0.97, near-black red 47 0 0.
//                   expect: fog 3493.5, rgb .184314 0 0, a 0.97, bias 50
//
// THE CULL GUARD.  R_SetFrustum inserts a fog far-plane by solving the EXP2
// equation for the 2/255 cut-off, reading `density` as a rate.  Under
// r_fog_linear that field is a DISTANCE, so the solve returns ~0.0004 units and
// the entire world is culled.  Its gate needs alpha>=1 AND depthbias==0 AND
// (r_fog_cullentities 2 or r_skyfog>=1).  surf_legends satisfies the first two
// exactly, so setting r_skyfog 1 on it arms the trap deliberately: with Patch
// 254's guard the map still draws, without it the screen goes empty.
//
// r_skyfog is restored to 0 afterwards -- it is 0 in default.cfg because
// otherwise fog washes every skybox 50% toward the fog colour.

log_enable 1
log_dir "logs"
log_name "fog02"
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 0
vid_fullscreen 0
con_notifytime 0
con_notifylines 0
con_notifytime_error 0
vbsp_fog 1
wait 200

echo ^5=========== surf_legends -- grey fog, fully saturated at 2700 ======
map surf_legends
waitmap 1800
waitms 9000
echo ^3-- expect: 2700 (r:0.752941 g:0.752941 b:0.752941, a:1.000000 bias:0)
fog
waitms 500
screenshot fog02_legends_on
waitms 800
vbsp_fog 0
waitms 1500
screenshot fog02_legends_off
waitms 800

echo ^5=========== surf_legends -- ARM THE CULL TRAP (r_skyfog 1) =========
vbsp_fog 1
waitms 1500
r_skyfog 1
waitms 1500
echo ^3-- world must still be drawn.  empty screen here = cull guard regressed.
screenshot fog02_legends_cullguard
waitms 800
r_skyfog 0
waitms 1000

echo ^5=========== bhop_bowling -- m=0.1, end must be 500 not 5000 ========
map bhop_bowling
waitmap 1800
waitms 9000
echo ^3-- expect: 500 (r:0.650980 g:0.850980 b:1.000000, a:0.100000 bias:0)
echo ^3-- a naive m*u implementation prints 5000 and draws fog 10x too thin
fog
waitms 500
screenshot fog02_bowling_on
waitms 800
vbsp_fog 0
waitms 1500
screenshot fog02_bowling_off
waitms 800
vbsp_fog 1
waitms 1000

echo ^5=========== surf_sidistic -- m=0.97, dark red ======================
map surf_sidistic
waitmap 1800
waitms 9000
echo ^3-- expect: 3493.5 (r:0.184314 g:0.000000 b:0.000000, a:0.970000 bias:50)
fog
waitms 500
screenshot fog02_sidistic_on
waitms 800
vbsp_fog 0
waitms 1500
screenshot fog02_sidistic_off
waitms 800
vbsp_fog 1
waitms 1000

echo ^5=========== done ==================================================
log_enable 0
