cfg_save_auto 0
// Build 64: does a connected client actually HAVE a guid to submit under?
//
// WHY THIS IS THE LAST UNTESTED LINK. Lobby_SubmitRun's fourth gate is
// `infokey(e,"guid") == ""` and it returns silently. sv_main.c:1855 never asks
// a client for a GUID unless sv_guidkey is set, and sv_main.c:137 warns in as
// many words "do NOT treat the client's GUID as something that is secure" --
// so the value exists only if the server asked and the client answered. Every
// submission the board has ever seen was curl'd in by hand or came from the
// probe; NOTHING has ever proved that a real connected player produces a
// non-empty guid, which is the one thing standing between a finished run and
// a row on the leaderboard.
//
// TESTED ON A LISTEN SERVER because that is the only kind this harness can
// drive, and the gate does not care: infokey(e,"guid") is read the same way
// for a local client as for a remote one.
//
// THE PROBE IS THE INSTRUMENT. lobby_run_probe submits one synthetic run for
// the first player on the server, and build 64 made the identity gate speak:
//   guid present -> "^5board: submitting bhop_eazy track 0 leg 0 ..."
//   guid empty   -> "^1board: this server cannot identify you ..."
// Two distinguishable outcomes from one probe, neither of which can reach a
// real leaderboard: the probe forces TF_CHEAT, which surfd refuses a board.
//
// lobby_master POINTS AT A DEAD PORT (127.0.0.1:1). The gates under test are
// all reached BEFORE uri_post, so nothing has to answer -- and pointing a test
// at the live directory would put a fake lobby in the players' picker.
//
// PREDICTIONS, registered before the run:
//   ARM A  sv_guidkey UNSET, probe fired -> the amber "cannot identify you"
//          line, exactly once. This is the control: it proves the probe
//          reached the identity gate at all, so ARM B's silence about it
//          means the guid was present rather than the probe never running.
//   ARM A2 probe fired a second time -> NO second line. The latch is per
//          client and once-only; a message on every finish would be spam on a
//          bhop map where a finish is ten seconds apart.
//   ARM B  sv_guidkey SET, reconnected, probe fired -> "submitting", and no
//          identity complaint.
//
// FALSIFIED IF: ARM B still says "cannot identify you" -- then a real player
// on the Pi's lobbies produces no guid either, every finish there is being
// dropped at the same gate, and the board can never receive a genuine run.
//
// wall clock, not frames, before the first `map` -- see p313ruleset.cfg.
log_enable 1
log_dir logs
log_name b64guid
waitms 5000

set lobby_master     "http://127.0.0.1:1"
set lobby_master_key "not-a-real-key"
sv_guidkey ""

map bhop_eazy
waitmap 45
waitms 3000

echo ==== ARM A CONTROL: sv_guidkey unset (expect "cannot identify you") ====
set lobby_run_probe 1
waitms 2000

echo ==== ARM A2: fire it again (expect NO second complaint -- latched) ====
set lobby_run_probe 1
waitms 2000

// A guid is handed over at CONNECT, so the cvar has to be set before the
// client attaches. Reloading the map is the cheapest way to redo that.
echo ==== ARM B: sv_guidkey set, reconnect, probe again (expect "submitting") ====
sv_guidkey "ftesurf-test-salt"
waitms 300
map bhop_eazy
waitmap 45
waitms 3000
set lobby_run_probe 1
waitms 2500

echo ==== done ====
waitms 500
quit
