// Test-only SSQC; use dedicated owned overlay, never an install/lobby progs swap.
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
cl_netfps 100
cl_sendguid 1
cl_predict_qchook 1
cl_predict_trace 0
log_enable 1
log_name runlines_smoke
log_developer 1
developer 1
map surf_dune
wait 500
cmd join
wait 200
cmd moveprep_test
wait 200
echo MOVEPREP CLIENT COMPLETE
cmd zoneprep_test
wait 200
echo ZONEPREP CLIENT COMPLETE
echo RUNLINES COMPLETE
quit
