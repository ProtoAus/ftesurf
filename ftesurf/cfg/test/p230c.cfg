// Patch 230 regression pass.  The win is measured; this is the "did I break the
// two things that were fixed an hour ago" check.
//
// 1. bhop_ambience -- Patch 228's static props.  72 of them, and the trees are the
//    whole point.  All 5 distinct models are one-bone $staticprop, so ALL of them
//    now take the rigid path: if rigid geometry were wrong, this is where it shows
//    up first and most visibly.
// 2. ahop_coast -- Patch 229 + Build 34's collision, re-run unchanged from p229a.
//    This map is the interesting one for P230 because it is MIXED: 220 rigid models
//    and 18 with real rigs (up to 56 bones -- the ragdolls). Both kinds have to load
//    and draw in the same frame.
//    The drop is the same one the reporter set up: from save003, onto an oildrum001.
//      collision WORKS  -> rest near z = -14583 (measured post-P229)
//      collision ABSENT -> fall through to the floor at/below z = -14643
//    A rigid-prop change has no business touching collision at all (the .phy hull is
//    loaded separately by Mod_PHY_CollisionMesh and never saw a bone), so a moved
//    number here means something is wrong that I did not predict.

log_enable 1
log_name p230c
developer 1
cfg_save_auto 0
cl_idlefps 0
sv_cheats 1

wait 200
echo ^5=== p230c: P228 + P229 regression under P230 ===

echo ^5--- 1. bhop_ambience: the trees (expect 72 props, 5 models, all RIGID) ---
map bhop_ambience
waitmap 900
wait 240
screenshot
waitms 800

echo ^5--- 2. ahop_coast: mixed rigid + rigged, and the collision drop ---
map ahop_coast
waitmap 900
wait 120
waitms 600

echo ^5(expect: props: 284 spawned (269 solid, 0 scaled), NO "NO BOUNDS")
setpos -12838.46 -6255.48 -14384.63
wait 60
echo ^5(falling...)
wait 300
echo ^5(resting position -- near -14583 means the barrel still holds us:)
viewpos
waitms 800

setpos -12838.46 -6255.48 -14384.63
wait 360
viewpos
waitms 800
screenshot

echo ^5=== p230c done ===
wait 30
quit
