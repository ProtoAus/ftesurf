// P351CASE -- the online board on a map whose FILE name has capitals, and the
// room list's absorb.  Live read-only GETs against the default lobby_dir.
//
// REGISTERED BEFORE THE RUN (curl, 2026-09-18):
//   bhop_mukiology ranked/clean: counts ranked 0 (rows [])
//   bhop_eazy      ranked/clean: counts ranked 1 ((1)Proto 3323 ticks)
//
// PREDICTIONS -- this build:
//   ARM M  map Bhop_Mukiology, board open 6 s: board_status "ok", 0 rows;
//          scores status "shows 1"; screenshot p351case_m says "no clean
//          times", NOT "asking the leaderboard".
//   ARM E  map bhop_eazy (lowercase file, the CONTROL): "shows 1",
//          "room list: 1 best time(s)".
// PRE-CHANGE build (csprogs from 0d872fa), the arm that must FAIL:
//   ARM M  board_status "ok" but "shows 0" and the screenshot says "asking".
//   ARM E  "shows 1" (control unchanged) but "room list: 0".
// FALSIFIER: this build printing "shows 0" on M, or "room list: 0" on E.
//
// SETUP (b21b pattern): no capitalised map ships zone data, and a zoneless map
// never draws the board (legs 0), so the runner copies the Momentum mount's
// maps/zones/online/bhop_eazy.json to ftesurf/maps/zones/local/Bhop_Mukiology.json
// before the run and deletes it after.  Without it arm M is vacuous (legs 0).
// The pre-change arm swaps in a csprogs built from 0d872fa plus ONLY the
// witness lines (cl_scores.qc), so the one variable is the two fixes.
cfg_save_auto 0
log_enable 1
log_dir "logs"
log_name "p351case"
developer 1
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
sv_public 0
vid_conautoscale 0
vid_conwidth 1280
vid_conheight 720

// wall clock before the first map (see p313ruleset.cfg): without it the map never loads.
waitms 5000
map Bhop_Mukiology
waitmap 45
waitms 4000
menu_restart
waitms 300
ui_close
set rec_terms 1
waitms 500
echo ==== ARM M: Bhop_Mukiology (expect ok 0 rows, shows 1, no "asking") ====
scores legs
scores open
waitms 6000
scores status
board_status
screenshot p351case_m
waitms 1000
scores close

map bhop_eazy
waitmap 45
waitms 4000
set rec_terms 1
echo ==== ARM E: bhop_eazy control (expect shows 1, room list: 1) ====
scores open
waitms 6000
scores status
board_status
screenshot p351case_e
waitms 1000
quit

// RESULT (2026-09-18):
//   this build:  M  zones 7 (local), legs 6, board ok, shows 1, screenshot
//                   "no ranked clean times on this leg yet".
//                E  shows 1, room list: 1 best time(s).
//   pre-change:  M  board ok, shows 0, screenshot "asking the leaderboard..."
//                E  shows 1, room list: 0 best time(s).
//   All four predictions held.  First attempt without the zone file: M read
//   legs 0 / shows 0 in BOTH builds -- vacuous, as the review warned.
//   The *wrank %d fix is NOT exercised here (a 1M-tick run cannot be scripted).
