// Patch 338 -- the IO mirror's first E2E.  bhop_mom_training_beta, the map
// whose IO-gated teleports produced the 6956u snapback in real play.
// Static half first: the load summary must show the output rows captured,
// TELEPORT_SEND_PLAYER predicted (mapspawn enabler) and teleport_safeguard
// still skipped (trigger_userinput enablers are not a class the server
// itself implements).  trig_dump/trig_io carry the graph.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p338a
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0
wait 600
connect 127.0.0.1:27666
waitms 15000
cl_prederror 2
cl_trigdebug 1
echo === static census:
trig_dump
waitms 600
trig_io
waitms 1200
echo === mapspawn should have fired by now (+0.5 s):
trig_dump
waitms 400
echo === p338a done
quit
