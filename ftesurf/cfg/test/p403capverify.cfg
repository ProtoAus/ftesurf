// P403CAPVERIFY -- Patch 403 arm C3: the CLAMPED run still verifies.
// Subject: the recording p403stage writes on Patch 403 progs, whose first ride
// record carries the trimmed carrier (1400 -> 288.56).  The question is whether
// a clamped carrier replays exactly -- it must, because `ride arm` is written
// from .run_basevelocity AFTER the clamp, so the file states the clamped number.
//
// SETUP: copy cfg/test/p403stage.zones.json -> maps/zones/local/bhop_arcane.json
// (the file's header pins that fixture's zonecrc, and pm_verify refuses on a
// zone-table mismatch before it replays a single tick -- sv_ccmds.c:5088).
// Then run p403stage and point the path below at the .rec it writes; the tick
// count is in the name and moves run to run.
//
// PRE-REGISTERED
//  C3 pm_verify prints PASS.
// FALSIFIED IF it HOLDs: then the clamp and the record disagree and the patch
// cannot ship.
//
// RESULT (2026-09-20, after the review fixes).
//   subject data/runs/bhop_arcane/main/0000065_pb.rec
//     ride 0 430 arm -1.26132345e-05 288.55722 -0     <- the clamped carrier
//   VERIFY data/runs/bhop_arcane/main/0000065_pb.rec PASS ticks 65 rows 45
//   body 45 in rows, 35 samples, 16 packets, 0 warps, 6 rides; 5 arm, 1 pay.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p403capverify
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
sv_cheats 1
fs_missingwarn 0
set run_resume 0
sv_port 27681

wait 200
map bhop_arcane
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 1000

echo ^5=== p403capverify ===
pm_verify data/runs/bhop_arcane/main/0000065_pb.rec
waitms 4000
echo ^5=== P403CAPVERIFY DONE ===
waitms 500
quit
