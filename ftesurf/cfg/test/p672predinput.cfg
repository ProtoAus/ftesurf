// Test fixture CSQC required; owned overlay, real dedicated socket only.
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
cl_netfps 10
cl_predict_qchook 1
cl_predict_trace 0
log_enable 1
log_name runlines_smoke
log_developer 1
developer 1
set test_predinput 0
map surf_dune
wait 500
cmd join
wait 200
echo PREDINPUT NOOP BEGIN
trig_dump
wait 100
cl_maxfps 10
set test_predinput 1
echo PREDINPUT BODY BEGIN
wait 60
set test_predinput 2
echo PREDINPUT HOLD BEGIN
wait 30
cl_predict_qchook 0
set test_predinput 1
echo PREDINPUT DISABLED BEGIN
cl_predtrace 1
wait 20
cl_predict_qchook 1
set test_predinput 0
cl_maxfps 100
echo PREDINPUT NOOP END
wait 100
echo RUNLINES COMPLETE
quit
