// cfg_save_auto 0 FIRST: this run sets archived cvars and must never write them
// into ftesurf.cfg (cl_main.c:2535).
cfg_save_auto 0

// ===========================================================================
//  P437WIN -- the board line's stage window is the replay's window.
//    python tools/p437win.py      (stages the fixture row, runs, parses, restores)
//    or by hand, from C:\FTESurf: copy ftesurf/data/runs/surf_4am/main/cheat.rec
//    to ftesurf/data/runs/surf_4am/main/0000437_p437win_run.rec (a fixture, left
//    in the tree by the driver and removed by it), then
//    ftesurf64.exe -WindowStyle Minimized +exec cfg/test/p437win.cfg
//
//  THE DEFECT (BACKLOG, Patch 433 review).  A board line built from another run's
//  file cut itself to a stage window found by Watch_LineJobWindow, a SECOND
//  SPELLING of the same question the replay answers in Watch_WindowFind: the line
//  job took the LAST `stage seg` record where the replay takes the one BEFORE the
//  first `stage seg+1`.  Rows whose leg is > 0 always carry a `stagepost`, so the
//  two agreed there; the difference was reachable only through an old file opened
//  another way.  MEASURED, and it is worse than a spelling: pass one's budget
//  (WT_LJ_PASS1, 6000 lines a frame) and its first-byte filter mean the job never
//  reaches the `stage` records of a 20290-sample file at all, so its own fallback
//  had nothing to fall back to and the line drew the WHOLE FILE with `scores: no
//  window for stage 1 in that run`.
//
//  THE FIX.  Watch_LineJobWindow asks Watch_WindowFind when pass one found no
//  `stagepost`, and keeps its own reading only if that answers "no window".  Pass
//  one now fills rec_wt_ev* and rec_wt_endticks from THIS file, because a line job
//  reads another file's handle and the finder reads the replay's globals -- a
//  stale table from a replay opened earlier would answer for the wrong file.  The
//  finder reads EVERY `stage` record the file has, not the two this job's spelling
//  looked for, and answers in ticks the job already multiplies by its own
//  `tickrate`.
//  `sb_ln_lineleg` (cl_scores.qc) is the harness handle that makes the arm
//  reachable at all: a LOCAL row's line leg is always 0, so without it no board
//  line ever asks for a stage and neither spelling is exercised.
//
//  THE FIXTURE IS A REAL FILE FROM THE CORPUS, COPIED -- TWICE.  surf_4am's
//  cheat.rec is FTESURF-REC 4 (pre-`stagepost`), 6 `stage` records and no
//  `stagepost` at all:
//      stage 1 483   stage 2 1369   stage 3 2349
//      stage 4 9238  stage 5 10702  stage 6 18383   end 20290
//  The driver copies it to main/0000437_p437win_run.rec and to
//  stage_1/0000483_p437win_pb.rec -- the names the local board resolves for a
//  main row at 437 ticks and a stage-1 row at 483 (that leg's own recording is
//  475 ticks, so the copy sorts second and is row 1) -- so the board's own line job
//  (cl_scores.qc -> Watch_LineJobStart) reads it and Watch_LineJobWindow falls to
//  the `stage` records.  Nothing here is invented: no synthetic file, no
//  hand-written ticks.
//
//  ARMS
//   W1 the board, local, main leg, opened and refreshed: the row must resolve to
//      the fixture (`scores: line 1 on:`) and build.
//   W2 the line job's window, from `scores lines`: the WHOLE file, on both builds.
//   W3 THE SAME QUESTION PUT TO THE REPLAY: `replay <path>` and `replay window 1`,
//      which prints Watch_WindowFind's own answer and its own source (`stage
//      records`, not `stagepost`).
//   W4 the same read again, so the pair comes from one file.
//   W5 THE ARM THAT DECIDES, and it needs a handle.  `sb_ln_leg[i] = 0` for every
//      LOCAL row (cl_scores.qc), so a stage window is unreachable through the
//      board at all: with the handle at 0 both W2 and W5b read the whole file and
//      this patch moves neither.  `set sb_ln_lineleg 1` above is added to the
//      row's leg, so the builder is asked for stage 1 of the file -- the same
//      question `replay window 1` asks.  W5b is the fixture's row on the stage-1
//      leg; W5a is that leg's own row, which the board refuses to line at all.
//
//  PRE-REGISTERED PREDICTIONS (surf_4am's own `stage` records, tickrate 0.015)
//   W2 `t 0.0000..7.2423` -- the main row's line, asked for leg 1.  The builder's
//      `t b` is the LAST KEPT SAMPLE's time, one sample inside the boundary the
//      replay prints, which is the 0.0027 difference and not a disagreement.
//      The control build reads `t 0.0000..304.3340`: its own spelling's a/b are
//      -1, so it keeps the whole file.  With `sb_ln_lineleg 0` both builds read
//      the whole file, which is why the handle has to be on for this arm to mean
//      anything.
//   W3/W4 `ticks 0..483, stage records` -- the replay's window for leg 1, i.e.
//      the segment before `stage 1 483`.  Both builds: Watch_WindowFind is not
//      what this patch edits.
//   W5a the stage-1 leg's OWN row is RT_LOBBY, and Scores_LineKey returns "" for
//      one: `no recording behind that row`.  A local board can only line a
//      non-lobby row, which is why the fixture is a copied `_pb`.
//   W5b THE FIX: `t 0.0000..7.2423` (ticks 0..483 x 0.015, less the last sample's
//      step), agreeing with W3.  The control build draws the WHOLE FILE instead --
//      not a wrong window, no window at all: pass one reads at most WT_LJ_PASS1
//      (6000) lines a frame and its filter is a line's first BYTE, which every
//      sample row fails, so on a 20290-sample file it stops at sample ~6000 with
//      wt_lj_sa and wt_lj_sb BOTH -1.  Its fallback then gives -1..20290 and its
//      own `pb <= pa` test refuses it: `scores: no window for stage 1 in that
//      run`, and the line draws every sample.
//   W6 (PATCH 441) the OPEN replay's `end`, `window`, `cut`, `view` and `events`
//      read the same before and after a board line is built under it.  On the
//      control build at least one differs: Watch_LineJobStart clears rec_wt_evn and
//      rec_wt_endticks -- the replay's splits and finish -- and the job then asks
//      Watch_WindowFind, whose job is to SET the replay's cut, so the file being
//      watched is re-cut to the board row's stage.  Patch 441 gave the job its own
//      table (Watch_StageSpan src 1) and left the finder to the replay.
//   No QC fault anywhere in the log (the frame line PR_StackTrace prints; the old
//      check looked for `QC error`, which the engine never prints at all).
//  FALSIFIED IF W1 or W5b does not resolve the fixture (the board found no
//   recording and the window measured nothing), or W3 does not say `stage records`
//   (the file has a `stagepost` after all and neither spelling is exercised), or
//   W5b reads 0.0000..7.2423 on the CONTROL build (the defect does not reproduce),
//   or W6's two readings are UNCHANGED on the control build (then the wipe does not
//   reproduce either and W6 is measuring nothing).
//  NOT COVERED: a file whose `stage` records are out of order or missing a
//   boundary (the finder's `b = rec_wt_endticks` default), a `stagepost` file --
//   unchanged by this patch, and p433line's L1/L3 are its arms -- and the online
//   board, where every row carries a `stagepost`.
//
//  RESULT (2026-09-23, both arms run, driver exit 0 each way).  The fix moves the
//   reading from "no window at all" to the replay's own:
//                        control (HEAD's cl_watch.qc)   fixed
//    W2/W5b line window  0.0000..304.3340 (20264 pts,   0.0000..7.2423 (485 pts,
//                        `scores: no window for stage    2 tele) -- ticks 0..483,
//                        1 in that run`)                 one sample inside W3's
//    W3/W4 replay        ticks 0..483, stage records    ticks 0..483, stage records
//    W5a stage-1 row 0   `no recording behind that row` (RT_LOBBY, both builds)
//   THREE PREDICTIONS THIS FILE GOT WRONG, all recorded because each one is a fact
//   about the code that the arm was written against:
//    - The control's reading is NOT its last-stage spelling (0..275.7450, which is
//      what the BACKLOG item claimed the two spellings differed by).  Pass one
//      never reaches the `stage` records of a file this size -- the 6000-lines-a-
//      frame budget runs out at sample 6000 of 20290, and the byte filter skips
//      every sample row anyway -- so sa/sb are -1 and the job refuses a window.
//      The defect is wider than a spelling: an old file's line was never cut at
//      all.  The debug print that settled it: `win leg 1 fleg 0 pa -1 pb -1 sa -1
//      sb 483 end 20290 tick 0`.
//    - The two spellings are not comparable through the board alone: `sb_ln_leg[i]
//      = 0` for every LOCAL row, so a stage window is unreachable and W2/W5b read
//      the whole file on both builds.  `sb_ln_lineleg` (cl_scores.qc) is the
//      handle that reaches it, and this cfg sets it to 1 after the map because a
//      CSQC-registered cvar is reset at registercvar -- a `+set` on the command
//      line is lost the moment CSQC loads.
//    - The builder's `t b` is the LAST KEPT SAMPLE's time, one sample inside the
//      boundary the replay prints, so the identity holds to a tick and not to the
//      fourth decimal (7.2423 against 7.2450).
log_enable 1
log_dir logs
log_name p437win
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
vid_fullscreen 0
sv_port 27667
sv_public 0
sv_cheats 0
set run_resume 0
set hud_watch_skipidle 0
// THE LEG ASKED OF THE LINE BUILDER, and it lives HERE rather than on the command
// line for one reason: a CSQC-registered cvar is reset to its default at
// registercvar, so a `+set` before the map is lost the moment CSQC loads (the
// same trap as cl_trigdebug).  This build is the first to create the cvar, so no
// archived ftesurf.cfg can hold one; if it ever becomes archived, set it on the
// command line instead and delete this line.
set sb_ln_lineleg 1
waitms 5000
map surf_4am
waitmap 3000
waitms 3000
menu_restart
ui_close
waitms 1200

echo ==== W1 the board, local, main leg ====
scores legs
scores open
scores tab local
scores leg 0
scores refresh
waitms 2500
scores status
waitms 500
scores line 0
waitms 3000

echo ==== W2 the line job's window, asked for leg 1 ====
scores lines
waitms 800

echo ==== W3 the replay's own window, the authority ====
replay data/runs/surf_4am/main/0000437_p437win_run.rec
waitms 2500
replay window 1
waitms 1200

echo ==== W4 and again, so the pair is read from one file ====
replay window 1
waitms 1200
replay stop
waitms 500

echo ==== W5 THE ARM THAT DECIDES: the stage-1 leg's row and its line ====
scores line 0
waitms 500
scores leg 1
scores refresh
waitms 2500
echo ---- W5a row 0, the leg's own 475-tick recording: the whole file, both builds ----
scores line 0
waitms 3500
scores lines
waitms 800
echo ---- W5b row 1, the fixture: fixed t 0.0000..7.2450, control t 0.0000..275.7450 ----
scores line 1
waitms 4000
scores lines
waitms 800

echo ==== W6 PATCH 441: A REPLAY OPEN WHILE A BOARD LINE IS BUILT ====
// Patch 437 gave the line job the REPLAY's event table and finish tick to work in
// (rec_wt_ev*, rec_wt_endticks, cleared at every job start) and had it ask
// Watch_WindowFind, whose job is to SET the replay's cut.  So opening a board line
// while watching a replay wiped that replay's splits and its finish and retargeted
// its cut -- the duration in the title, the playhead clamp and the FINISH row all
// read those.  Patch 441 gave the job its own table (Watch_StageSpan src 1).
// The reading is an IDENTITY, not a number: `replay status` twice over the same
// open file, with a line job in between.  A is before, B after.
// W5b left row 1's line ON, and `scores line <n>` TOGGLES -- so it goes off here
// and on again below, where the job start is what matters.  (First cut of this arm
// turned it off in W6b and measured two identical readings of nothing happening.)
scores line 1
waitms 600
replay data/runs/surf_4am/main/0000437_p437win_run.rec
waitms 2500
echo ---- W6a A: end / events / cut / view of the open replay, before any line ----
replay status
waitms 900
echo ---- W6b B: the same four, with a line job started under it ----
scores line 1
waitms 4000
replay status
waitms 900
replay stop
waitms 500

quit
