cfg_save_auto 0
// PATCH 313 -- FALSIFIER.  The *ruleset serverinfo key (plan item P296): can QC
// see the whole "were the physics locked" predicate, or only the half it has?
//
// WHAT IS ACTUALLY WRONG TODAY.  sh_defs.qc's TF_CHEAT comment says it in as
// many words: "the authoritative predicate for 'were the physics locked' is the
// engine's SV_MovementLocked() = pm_lockmovement.defaultstr && !sv_cheats, and
// QC can see only half of it... So this bit means 'cheats were off', not 'the
// ruleset was locked'."  QC may NOT re-derive the other half from
// cvar("pm_lockmovement") -- that reads the LIVE value, and the engine reads
// defaultstr precisely because the live one can be changed by the thing being
// policed.  Result: a server whose pm_lockmovement default is 0 runs with
// cheats off, every mover cvar wherever the config left it, and every run on it
// stamped clean.
//
// WHAT THE PATCH PUBLISHES.  *ruleset "<locked> <off> <seq> <breach>" in svs.info, which
// SSQC reads with serverkey() straight out of svs.info -- no network, no clone.
//   locked  SV_MovementLocked(), 0 or 1.  BOTH halves.
//   off     how many cvars in pms_lockedmovevars[] currently differ from
//           SV_MovementCanonical().  0 by construction while locked.
//   seq     incremented on every set of a table cvar to an off-canonical value,
//           WHETHER OR NOT THE LOCK IS ENGAGED.  Never reset.
//   breach  the subset of those that STOOD -- the lock was off, so nothing
//           reverted them.  The ONLY field a taint may read: seq counts
//           attempts, and an attempt the lock refused changed no physics.
//
// WHY FOUR FIELDS AND NOT THE ONE THE QC COMMENT ASKED FOR ("a one-line engine
// patch publishing SV_MovementLocked()").  One field answers "is the lock
// engaged" and leaves the case that comment is actually worried about exactly as
// invisible as before: `locked 0` says the lock is off, it does not say whether
// the numbers were right anyway.  And `off` alone is a SNAPSHOT -- a cvar moved
// and moved back inside a run reads 0 at both ends of it.  That is the sixth
// instance of this tree's recurring lesson (301 cvar-vs-grant, 306
// not-counted-vs-counted-zero, 307 true-at-start-vs-throughout, 310
// snapshot-vs-change, 312 a-sparse-record-cannot-mark-a-span), and ARM C below
// is the arm that exists to prove the counters are not redundant with the
// census, and ARM B the one that proves the two counters are not each other.
//
// PRE-REGISTERED, before either run.  THE BEFORE HALF is this same cfg on the
// pre-313 binary, where `movement` prints no *ruleset line at all and the key is
// absent from serverinfo.  Absence is its own third state and must stay readable
// as one -- "this engine cannot answer" is not "the ruleset was unlocked".

log_enable 1
log_dir logs
log_name p313ruleset

developer 0
// WALL CLOCK, NOT FRAMES, BEFORE THE FIRST `map`.  `wait N` counts FRAMES
// (cmd.c:4720) and at the menu this engine renders in the high hundreds, so
// `wait 200` can elapse in a quarter of a second -- and a `map` issued before
// the engine has finished initialising is dropped SILENTLY: no error, no map,
// and the following waitmap then sits out its whole timeout looking like a
// hang.  This ran fine as `wait 200`, which is exactly the problem: that was
// luck of the framerate, not a margin.  waitms is the wall clock cmd.c:257
// says to use when the thing being waited for is not frame-count based.
// (Measured by the concurrent session, which lost six arms to it first.)
waitms 5000

// ---------------------------------------------------------------- ARM A
// CONTROL.  A base-ruleset map, lock engaged, nothing touched.
//
// PREDICT: movement prints `no overrides - every value is cfg/default.cfg's`
//          and *ruleset "1 0 0 0".
// FALSIFIED IF: locked reads 0 on a stock install (then default.cfg:99's
//          pm_lockmovement 1 is not reaching defaultstr and Patch 170 has been
//          inert all along), or off reads non-zero with no overrides in force
//          (then the census is comparing against the wrong canonical).

map surf_beginner
waitmap 60
waitms 4000
echo ================================ P313 ARM A -- control
movement
waitms 500
serverinfo
waitms 1500

// ---------------------------------------------------------------- ARM B
// AN ATTEMPT THE LOCK REFUSES.  sv_airaccelerate is in pms_lockedmovevars and
// the callback reverts it.
//
// PREDICT: the CON_WARNING revert line, then *ruleset "1 0 1 0".
// THIS ARM PROVES TWO THINGS AT ONCE.  off must read 0 before and after -- the
// revert is what makes it 0 -- so seq moving 0 -> 1 is the ONLY record anywhere
// that the attempt happened, outside a console line nobody parses.  AND breach
// must STAY 0, because the lock reverted it and no physics tick ever saw the
// value.  That is what stops QC calling this run unruled: a mistyped cvar name
// is not a ruleset violation, and a taint that fired here would state something
// false about an honest player.
// FALSIFIED IF: seq stays 0 (the counter is below the SV_MovementLocked test
//          and the patch's central claim is false); or off reads 1 (the revert
//          did not happen and Patch 170 is broken); or BREACH READS 1, which
//          would make the consumer a false-accusation machine.

echo ================================ P313 ARM B -- refused under the lock
sv_airaccelerate 9999
waitms 500
movement
waitms 1500

// ---------------------------------------------------------------- ARM C
// THE SPAN.  Unlock, move a mover cvar, re-lock.  A run spanning this window
// sees off == 0 at BOTH ends while the physics were not the ruleset's in the
// middle of it.
//
// PREDICT, in order:
//   sv_cheats 1        -> *ruleset "0 0 1 0"  lock off, nothing moved yet
//   sv_airaccelerate   -> *ruleset "0 1 2 1"  NOT reverted; off AND breach move
//   sv_cheats 0        -> *ruleset "1 0 2 1"  re-latch restores; off back to 0
//
// So off is 0, 1, 0 and breach is 0, 1, 1.  Sampled only at the two ends of the
// window -- which is what a run does -- off says nothing happened and breach says
// it did.  That is the whole argument for the fourth field, and breach is the
// value SV_TimerRuleset latches at run start and differences at the finish.
// FALSIFIED IF: off does not reach 1 in the middle (the census is not reading
//          live values), or breach does not reach 1 (the taint would be inert),
//          or either counter moves on the sv_cheats 0 restore (the restore is
//          being counted as a violation, which would make the counter accuse
//          the mechanism that fixes the problem).

echo ================================ P313 ARM C1 -- cheats on, nothing moved
sv_cheats 1
waitms 500
movement
waitms 1500
echo ================================ P313 ARM C2 -- moved, no revert
sv_airaccelerate 9999
waitms 500
movement
waitms 1500
echo ================================ P313 ARM C3 -- cheats off, re-latched
sv_cheats 0
waitms 500
movement
waitms 1500

// ---------------------------------------------------------------- ARM D
// THE FALSE-ACCUSATION ARM, and the reason this patch is not two lines.
// mode_bhop.cfg overrides six cvars in the locked table, sv_airaccelerate 1000
// and pm_ticrate 0.01 among them.  Those are the RULESET on a bhop map, not a
// departure from it -- SV_MovementCanonical returns the override, not
// defaultstr.
//
// PREDICT: movement prints the override table with a non-zero count, every row
//          unhighlighted (live == base), and *ruleset "1 0 2 1".
// FALSIFIED IF: off reads 6.  That is the Patch 305 failure mode exactly -- the
//          flagship check calling the game's own ruleset a violation -- and it
//          would refuse EVERY bhop run on a correctly configured server.  If
//          this arm fails the patch is worse than nothing and must not ship.

echo ================================ P313 ARM D -- a gamemode override is not a violation
map bhop_eazy
waitmap 60
waitms 4000
movement
waitms 500
serverinfo
waitms 2000

echo ================================ P313 DONE
log_enable 0
waitms 1000
quit
