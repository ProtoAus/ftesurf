// `r_part` with no arguments: does the engine actually HOLD any ftesurf.* type?
//
// ftesurf-3d verified the whole chain from engine source and it checks out on
// paper, which leaves exactly two possibilities and one command that separates
// them:
//
//   ftesurf.* present -> the cfg loaded and parsed; failure is downstream
//   ftesurf.* absent  -> particles/ftesurf.cfg was never found or never parsed,
//                        and the emitter feature has never drawn a pixel
//
// Three arms, because the second possibility has a named suspect:
//   A  as the saved config leaves it (r_particledesc "classic")
//   B  r_particledesc "" while NOT connected, then load -- the callback only
//      reloads when cls.state != ca_connected (p_script.c:3821-3852), and my
//      earlier attempt at this may have been a no-op because "" asks for
//      nothing to be loaded rather than asking for the default set
//   C  r_particledesc "high", a real set, so the callback has something to load
//
// r_part output goes through Con_Printf, so plain log_enable catches it; but
// developer stays on because the interesting failures are DPrintf.

developer 1
log_developer 1
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000
cl_maxfps 0
cl_idlefps 0
cl_yieldcpu 0
sv_cheats 1

echo ^5=== ARM A: saved config, before any map
echo ^5--- r_particledesc is:
r_particledesc
waitms 300
echo ^5--- r_part (no args), no map loaded yet:
r_part
waitms 1500

map surf_anubis
waitmap 600
waitms 8000
echo ^5=== ARM A2: same, WITH the map up
r_part
waitms 2000

echo ^5=== ARM B: r_particledesc "" then reload
disconnect
waitms 2000
r_particledesc ""
waitms 500
map surf_anubis
waitmap 600
waitms 8000
echo ^5--- r_part after arm B:
r_part
waitms 2000
r_partinfo
waitms 1500

echo ^5=== ARM C: r_particledesc "high" then reload
disconnect
waitms 2000
r_particledesc "high"
waitms 500
map surf_anubis
waitmap 600
waitms 8000
noclip
waitms 1000
setpos -307 -558 -5184 0 90 0
waitms 4000
echo ^5--- r_part after arm C:
r_part
waitms 2000
r_partinfo
waitms 1500
screenshot t2rp_armc_x
waitms 1000
screenshot t2rp_armc
waitms 1000

echo ^5=== END ===
waitms 500
quit
