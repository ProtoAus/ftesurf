// Build 66: the run recorder, streamed to disk instead of held in memory.
//
// A FINISH *CAN* BE SCRIPTED, and my own notes said it could not.  That note
// was built on two true facts and one wrong conclusion:
//
//   * `zone_goto` and `setpos` both call SV_TimerWarped, which re-anchors the
//     swept-trace origin -- so TELEPORTING INTO the end box does not fire the
//     end event.  True.
//   * bhop_eazy main reported `checkpoints: 0 crossed`.  True, and it is a
//     REPORT LINE, not a refusal: sh_zones.qc says in as many words that
//     `checkpointsRequired` is one of the keys the parser still ignores, and
//     SV_TimerEvent's finish gate is only `state == TS_RUNNING` and the end
//     zone being on your track.  Nothing counts checkpoints.
//
// So the way in is CONTINUOUS MOVEMENT to the end zone.  `noclip` does NOT call
// SV_TimerWarped -- it changes movetype and nothing else -- so a noclip flight
// sweeps normally and crosses the end zone for real.  The run is classified
// `cheated`, which is exactly right and does not matter here: SV_RecClose runs
// in full either way, and the close is the half of this build that a mid-run
// measurement cannot reach.
//
// WHAT IS UNDER TEST, in the order it happens:
//   1. SV_RecOpen opens a STREAM instead of a strbuf     -> `recorder: STREAM`
//   2. samples land on disk WHILE THE RUN IS GOING       -> the part file grows
//      (this is the whole patch; the run script measures it from the shell)
//   3. SV_RecClose writes the trailer, seeks back to the reserved `flags` line,
//      rewrites it at the same width, closes and RENAMES the part file to the
//      name the run earned.
//
// PREDICTION:
//   before arming   recorder: buffer -1  (stream would be 1)
//   mid-run         recorder: STREAM fh >=1000 -> data/parts/0.rec, and that
//                   file GROWS between samples -- a buffered run would leave it
//                   at 0 bytes until the end
//   after finishing data/parts/0.rec is GONE, data/runs/bhop_eazy/main/cheat.rec
//                   exists, its `flags` line is a real non-zero taint word at
//                   the same width it was reserved at, and its last line is the
//                   `end` trailer
//
// FALSIFIED IF: `recorder: buffer` mid-run (rec_stream did not take, or the
// engine is not the patched one and fopen mode 9 returned -1 -- the log says
// "cannot stream to" in that case); or the part file stays 0 bytes (the stream
// is buffering after all); or cheat.rec is missing or ends without `end` (the
// rename lost it); or its flags line is a different LENGTH from the reserved
// one (the seek-back wrote the wrong width and ate the line after it).
cfg_save_auto 0
log_enable 1
log_dir logs
log_name b66rec
log_developer 1
developer 1

// The arm.  0 would be today's behaviour and would test nothing.
//
// `set`, NOT a bare `rec_stream 1`, and the first run of this file lost its
// whole arm to that.  Both cvars are registered in worldspawn, which does not
// run until the map loads -- so at this point in the file neither name exists,
// and a bare `<name> <value>` line for a name that is not a command and not a
// cvar is simply `Unknown command`.  It says so in the log and then the run
// proceeds to test the default.  `set` creates the cvar, and registercvar
// declines to overwrite one that already exists, so the value survives the map
// load.  (The mirror of the registercvar-beside-the-read trap: there the
// default never lands, here the override never lands.)
set rec_enable 1
set rec_stream 1

// A `map` inside a startup +exec is silently dropped -- the exec is processed
// before the mod initialises -- so this wait is mandatory, and it is waitms
// (wall clock) rather than wait (frames, which passes on luck of the framerate).
waitms 6000
map bhop_eazy
waitmap 45
waitms 3000

echo ^5==== b66rec: the zones, so the flight below is computed and not guessed ====
zone_list
waitms 500

echo ^5==== b66rec: before arming ====
cmd timer
waitms 1000

// zone_goto drops us in the start box and arms.  The setpos that follows only
// pins the HEADING -- zone_goto's own optional angles were measured not to hold
// (it turned 180 degrees between two samples on this very map).
cmd zone_goto 0
waitms 1000
setpos -352 -352 144 0 335.3 0
waitms 1000

// Straight line from the start box to the end box: dx 2992, dy -1376, so yaw
// atan2(-1376, 2992) = -24.7 = 335.3, and the distance is ~3293 units.  Pitch 0
// keeps the flight on the zones' single z plane (64..224, centre 144).
noclip
waitms 500

// ---- ARM 1: the DISCARD path -------------------------------------------
// Run for a moment, then re-arm.  SV_TimerArm calls SV_RecDiscard
// unconditionally, so this is the `!r` path: the stream is closed and the part
// file REMOVED.  It is the one thing the buffer got for free -- "nothing was
// opened, so there is nothing to remove" -- and the one place streaming has to
// do real work to stand still.
+forward
waitms 1200
echo ^5==== b66rec: arm 1, running -- a part file should EXIST now ====
cmd timer
-forward
waitms 500

echo ^5==== b66rec: voiding by re-arming -- the part file must DISAPPEAR ====
cmd zone_goto 0
waitms 2000
cmd timer
waitms 1500

// ---- ARM 2: the FINISH path --------------------------------------------
setpos -352 -352 144 0 335.3 0
waitms 700
+forward
waitms 1500

echo ^5==== b66rec: running -- the part file should be growing NOW ====
cmd timer
waitms 2000
cmd timer
waitms 2000
cmd timer
waitms 3000

-forward
waitms 1000
echo ^5==== b66rec: after the end zone ====
cmd timer
waitms 2000

echo ^5==== b66rec: done ====
quit
