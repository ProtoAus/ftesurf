// B43STAGE -- the stage arm, start and fail rule, driven from a config.
//
// THE REPORT: "only record the stage time/demo/line that actually completes,
// don't record every fail of the stage, every fail should cause a time reset for
// timing of that stage."  And the rule chosen for what a fail IS: "Re-entering
// the stage start zone, AND re-arming ... stage times are counted with no
// pre-speed, so jump start, or walking out of the start zone."
//
// A CONFIG CANNOT SURF, so a stage boundary has never been crossable by a
// headless check and the whole build-24 filter shipped unobserved -- SV_TimerReport's
// own comment says as much.  bhop_eazy makes it possible: FOUR ZONES ON ONE
// PLANE, every one of them at z 64..224 with a centre at z 144, so the route
// from the start to stage 1 is a pure yaw with no pitch and no geometry in the
// way once noclip is on.  Measured with zone_list, not guessed:
//
//     0  start   trk 0 seg 0   centre  -352  -352  144
//     1  stage   trk 0 seg 1   centre  2624   512  144
//     4  end     trk 0 seg 4   centre  2640 -1728  144
//
//   start -> stage 1   dx 2976  dy  864   yaw  16.18   dist 3099
//   here  -> end       dx  840  dy -1928  yaw -66.46   dist 2103
//
// NOCLIP MAKES THIS PRACTICE AND THAT IS FINE.  What is under test is the state
// machine -- armed / held / fails / the clock base -- and none of those consult
// the taint.  What noclip CANNOT test is the taint forgiveness itself, because
// it is on for the whole flight; that half is left to play.
//
// EVERY SAMPLE IS A NUMBER IN THE LOG AND NOT A SCREENSHOT.  `cmd timer` grew
// two lines in this build precisely so this run can read the machine's state
// directly, and a screenshot in this engine lands one step behind the command
// that set it up -- which cost three builds on the last feature.

log_enable 1
log_dir "logs"
log_name "b43stage"
developer 1
log_developer 1
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
sv_cheats 1
fs_missingwarn 0

wait 200
echo ^5=== b43stage: bhop_eazy ===
map bhop_eazy
waitmap 1800
waitms 2500

// ---------------------------------------------------------------------------
// 1. THE CVARS EXIST AND CARRY THEIR DEFAULTS.
//
// This is the trap SV_TimerMapInit's essay is about and it is worth one echo:
// StartFrame reaches SV_TimerMapInit BEFORE worldspawn, reading an unregistered
// cvar in FTE creates it as the EMPTY STRING, and registercvar then declines to
// overwrite it -- so a registration anywhere else leaves the feature silently
// off with `(default)` printed beside it.  An empty value here is the failure.
// ---------------------------------------------------------------------------
echo ^5=== b43stage: the four cvars ===
run_stagefail
run_stagearm
run_stageclean
run_stagehop

// ...and the CACHED copies, which is a different question: a cvar can read 1
// while the global the per-tick code actually consults reads 0.  The `stage
// rules:` line of `cmd timer` is the answer, and it is new in this build.
echo ^5=== b43stage: armed at the start ===
noclip
cmd zone_goto 0 16.18 0
waitms 700
cmd timer

// ---------------------------------------------------------------------------
// 2. THE FLIGHT.  Start -> out of the start box -> across stage 1's boundary.
//
// Sampled once a second rather than once at the end, because the interesting
// part is a TRANSITION and the end state cannot show it: the trace should read
// armed 0 (no stage) -> leg 1 armed 1 held 1 (inside the box, clock base still
// the crossing) -> leg 1 armed 0 (left it, clock base MOVED).  One reading at
// the end would show the last of those and prove nothing about the other two.
//
// viewpos beside each one so a surprising state can be tied to a position.
// Note it prints as `setpos x y z pitch yaw roll`, deliberately, so the line
// pastes back in -- grepping for "viewpos" finds nothing.
// ---------------------------------------------------------------------------
echo ^5=== b43stage: flying start -> stage 1 ===
+forward
waitms 1000
echo ^5--- t1 ---
cmd viewpos
cmd timer
waitms 1000
echo ^5--- t2 ---
cmd viewpos
cmd timer
waitms 1000
echo ^5--- t3 ---
cmd viewpos
cmd timer
waitms 1000
echo ^5--- t4 ---
cmd viewpos
cmd timer
waitms 1000
echo ^5--- t5 ---
cmd viewpos
cmd timer
waitms 1000
echo ^5--- t6 ---
cmd viewpos
cmd timer
waitms 1000
echo ^5--- t7 ---
cmd viewpos
cmd timer
waitms 1000
echo ^5--- t8 ---
cmd viewpos
cmd timer
waitms 1000
echo ^5--- t9 ---
cmd viewpos
cmd timer
waitms 1000
echo ^5--- t10 ---
cmd viewpos
cmd timer
waitms 1000
echo ^5--- t11 ---
cmd viewpos
cmd timer
waitms 1000
echo ^5--- t12 ---
cmd viewpos
cmd timer
-forward
waitms 400

// ---------------------------------------------------------------------------
// 3. THE FAIL.  Back into stage 1's own box.
//
// setpos and not a flight, and that is not a shortcut: the fail detector is a
// POINT test on the boundary box, so it fires on arrival however you arrive.
// setpos also keeps the run -- build 24 changed it from voiding to marking
// practice -- so the clock, the splits and the segment all survive the jump.
//
// EXPECT: fails 1, armed 1 held 1, a `stage 1 reset` line, and the run clock
// UNCHANGED.  The last of those is the one to check hardest: build 12's
// decision is that a stage reset does not touch run_t_start, and the whole
// feature is wrong if the total goes backwards.
// ---------------------------------------------------------------------------
//
// READ THIS TRACE BY THE STRINGCMD ORDER, NOT BY THE ECHOES.  A local `echo`
// runs in the client console immediately while `cmd timer` is queued as a
// stringcmd and sent on the next outgoing packet, so the echoes drift AHEAD of
// the replies by one block -- the same family of trap as the screenshot that
// lands one step behind.  `cmd viewpos` is itself a stringcmd, so it stays in
// order with `cmd timer` and is the marker to read.
echo ^5=== b43stage: re-entering stage 1's box -- expect fails 1 ===
setpos 2624 512 144 0 16 0
waitms 800
cmd viewpos
cmd timer

// ...and once more, to prove the fail fires ONCE per entry and not once per
// tick.  Standing in the box for another second must still read fails 1.
echo ^5=== b43stage: still standing in it -- expect fails STILL 1 ===
waitms 1200
cmd viewpos
cmd timer

// ---------------------------------------------------------------------------
// 4. THE START.  Out of the box again.
//
// 1800 200 is 830 units from the box centre, comfortably outside any zone quad
// on this map.  EXPECT: armed 0, and `from` LATER than it read above -- that
// number moving is the measurement change, and it is the whole of run_stagearm.
// ---------------------------------------------------------------------------
echo ^5=== b43stage: leaving the box -- expect armed 0 and a LATER from ===
setpos 1800 200 144 0 -66.46 0
waitms 800
cmd viewpos
cmd timer

// ---------------------------------------------------------------------------
// 4b. THE PER-STAGE TAINT, FORGIVEN.
//
// "if a stage is done in practice mode, but the next one has been started legit,
// then that stage should be counted as legit and recorded."
//
// The run is unrecoverably practice by now -- it has been noclipped and setpos'd
// half a dozen times, and run_t_dirty is latched until the next arm.  What must
// NOT still be true is that the STAGE is dirty: SV_StageOpen reads the taint
// from the LEVEL, so a stage reopened while the player is walking is clean even
// inside a filthy run.
//
// noclip OFF first -- it is a toggle, so this is the second of exactly two in
// this file and it lands back in MOVETYPE_WALK.  Then setpos back into the box,
// which fails the stage, which reopens it: the reopen is the moment the taint is
// re-read, and it must read WALK.
//
// EXPECT: `practice 1` on the run line and `dirty 0` on the stage line, in the
// same report.  Those two disagreeing IS the feature; before this build they
// were one field and could not.
//
// No boundary is crossed here, so nothing is written and no personal best can
// move -- which is deliberate, because this map's stage PBs belong to the user.
// ---------------------------------------------------------------------------
echo ^5=== b43stage: taint forgiven -- expect practice 1 with dirty 0 ===
noclip
waitms 300
setpos 2624 512 100 0 16 0
waitms 900
cmd viewpos
cmd timer
waitms 400
noclip

// ---------------------------------------------------------------------------
// 5. FINISH, so the .rec is actually written and can be read back.
//
// A practice run is still written -- the flag only decides whether it is a
// personal best -- so this lands in data/runs/bhop_eazy/main/last.rec with the
// `stage`, `restart` and `stagestart` records in it.  tools/reccheck.py then
// reads the grammar this build invented, which is the point of finishing at all.
// ---------------------------------------------------------------------------
//
// RE-AIMED FIRST.  Step 4b's setpos carries its own yaw (16, back down the
// original approach) and `+forward` in noclip flies along the VIEW vector, so
// without this the finish flies off the far side of the map -- which is exactly
// what the first run of this file did, ending with no .rec to check.  Back to
// 1800 200 on the -66.46 heading, which is the geometry the earlier arm proved.
setpos 1800 200 144 0 -66.46 0
waitms 600
echo ^5=== b43stage: flying to the end ===
+forward
waitms 7000
cmd viewpos
cmd timer
waitms 3000
-forward
cmd viewpos
cmd timer

// ---------------------------------------------------------------------------
// 6. AND THE REPLAY STILL DRAWS.
//
// Timer_DrawPanel gained a parameter in this build and the replay path is one
// of its two callers -- it passes '0 0 0', because a .rec carries no stage-arm
// state.  A signature change with a caller that compiles is not a caller that
// works, so open the file that was just written.
// ---------------------------------------------------------------------------
echo ^5=== b43stage: replay the run just written ===
replay data/runs/bhop_eazy/main/last.rec
waitms 1500
replay status
waitms 500

echo ^5=== b43stage: done ===
replay stop
waitms 400
quit
