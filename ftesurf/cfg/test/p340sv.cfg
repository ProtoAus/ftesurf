// Patch 340 harness SERVER -- a real dedicated server on a real socket, the
// p335sv2 shape.  Launched from the C:\FTESurf basedir:
//
//   C:\FTEQuake\fteqwsv64.exe +set sv_port 27667 +exec cfg/test/p340sv.cfg
//
// lobby_enable/lobby_avatars are what put the avatar system -- and with it the
// 1 Hz colour resolve that publishes tc/lc and cl_pcolour -- on the air.
// sv_guidkey is set so infokey(e,"guid") is real and Lobby_ClientConnect has a
// hash to publish (*phash); without it the panel says "no id", which is the
// listen-server arm (p340b).
// sv_public 0: a harness must not heartbeat (p335sv2's lesson).
log_enable 1
log_dir logs
log_name p340sv
developer 1
sv_public 0
sv_maxrate 0
sv_maxdownloadrate 0
set sv_guidkey "p340-harness-key"
set lobby_enable 1
set lobby_avatars 1
set lobby_av_colors 1
set lobby_av_fx 1
map bhop_mom_training_beta
