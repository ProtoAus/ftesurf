cfg_save_auto 0
log_enable 1
log_dir logs
log_name p335g
developer 1
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0
sv_cheats 1
wait 200
map bhop_arcane
waitmap 1800
waitms 2500
echo === slot 53 identity ===
trig_probe 53 1672 0 14400
waitms 400
echo === client: what contains the walk line ===
trig_at 1672 0 14400
waitms 400
trig_at 1810 0 14400
waitms 400
trig_at 1500 0 14400
waitms 400
echo === server: same points ===
cmd ent_info trigger_teleport 1672 0 14410
waitms 600
cmd ent_info trigger_teleport 1810 0 14410
waitms 600
cmd ent_info trigger_teleport 1500 0 14410
waitms 800
quit
