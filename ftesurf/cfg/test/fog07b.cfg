// FOG07b -- the same first-map probe with r_fog_linear 0 (EXP fog).
// r_fog_linear 1 is Patch 254's default.cfg line; exp is the pre-existing path.
// If the first map fails here too, the bug predates this work.
log_enable 1
log_dir "logs"
log_name "fog07b"
cfg_save_auto 0
cl_maxfps 0
vid_fullscreen 0
vbsp_fog 0
r_fog_linear 0
wait 200
map bhop_bowling
waitmap 1800
waitms 11000
fog 64 1 0 0 1 0
waitms 1500
screenshot fog07b_bowling_FIRSTMAP_EXP
waitms 900
map surf_simplistic
waitmap 1800
waitms 9000
map bhop_bowling
waitmap 1800
waitms 11000
fog 64 1 0 0 1 0
waitms 1500
screenshot fog07b_bowling_SECONDLOAD_EXP
waitms 900
echo ^5=========== done =====
log_enable 0
