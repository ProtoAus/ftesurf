// Patch 746 (its review): a stage's own PB beside the whole run's.  Private overlay:
//   python tools/runlines_smoke.py ftesurf/cfg/test/raceghost_stagepb.cfg
//       --put data/runs/surf_kitsune/main/0009998_pb.rec=<a surf_kitsune PB .rec>
//       --put data/runs/surf_kitsune/stage_2/0000161_pb.rec=<its stage 2, cut out>
//   python tools/test_raceghost.py <live rig>/ftesurf --pb <the PB> --stagepb <this rig>/ftesurf
// Standing in stage 2's box the stage PB is already loaded; it is the ghost of the
// stage run; once it has finished (+4 s offset: past its 2.415 s and the 1.5 s hold)
// the whole run's PB must not stand in for it; and three attempts read it once.
cfg_save_auto 0
name RaceGhostStagePB
log_enable 1
log_dir logs
log_name runlines_smoke
cl_idlefps 0
cl_maxfps 100
con_notifytime 0
waitms 2000
map surf_kitsune
waitmap 60
waitms 5000
menu_restart
ui_close
hud_ghost 1
hud_ghost_sync 0
hud_ghost_pb 1
hud_ghost_lines 0
hud_ghost_offset 0
say !s 2
waitms 1500
echo ==== INBOX ====
raceghost
+moveright
waitms 800
-moveright
waitms 300
+forward
waitms 1750
echo ==== STAGEPB ====
raceghost
-forward
waitms 300
hud_ghost_offset 4
say !s 2
waitms 1000
+moveright
waitms 800
-moveright
waitms 300
+forward
waitms 1750
echo ==== FINISHED ====
raceghost
-forward
waitms 300
hud_ghost_offset 0
say !s 2
waitms 1000
+moveright
waitms 800
-moveright
waitms 300
+forward
waitms 1750
echo ==== AGAIN ====
raceghost
-forward
waitms 300
echo RUNLINES COMPLETE
waitms 100
quit
