cfg_save_auto 0
// PATCH 468 -- FALSIFIER.  A Windows precision touchpad turns the view again,
// and the journal says which reports were accepted on its say-so.
//
// WHY.  The OS synthesises a precision touchpad's cursor motion itself and hands
// it to raw input as RIM_TYPEMOUSE with hDevice NULL -- the shape Patch 306
// counts as injected and drops.  Measured on the owner's laptop (Pixart
// 093a:0255) with a raw-input probe outside the game, 2026-10-02: 2137 of 2137
// motion and button reports had no handle, the pad's own RIM_TYPEMOUSE
// collection sent nothing, and its digitizer collection (page 0x0D usage 5)
// sent 8746 reports, each 0.2 ms (median) before the motion it caused, 15 ms
// at p90, 268 ms worst (a tap's synthesised button-up).  So with raw input on
// the pad could not turn the view at all, and every honest swipe was recorded
// as an injection attempt (14.7 per second on the one recording from that
// machine).
//
// THE FIX accepts a handle-less mouse report only inside 0.5 s of a report from
// the pad's digitizer collection (or when it releases a button the pad itself
// pressed, stripped to that release), routes it to a `touchpad` device of its
// own, and counts it apart from the rejections: 'p <dt> <accepted> <digitizer>
// <released>' records in the journal body and two trailer fields that sum the
// first two; the third is at most the pad's own presses.
//
// THIS ARM NEEDS A HAND ON THE PAD, so no harness can drive it: the owner runs
// it and swipes when the screen says so.  From C:\ftesurf:
//     ftesurf64.exe +exec cfg/test/p468pad.cfg
// then   python tools/p468pad.py
//
// PRE-REGISTERED:
//   ARM A  in_rawinput_touchpad 1 (the default), 12 s, SWIPE THE PAD THE WHOLE
//          TIME -> data/p468_A.hid
//          The view MUST turn.  'm' records MUST carry a devid the closing devmap
//          claims as `touchpad`; the trailer's accepted field MUST be > 0 and
//          COVER those 'm' records (accepted >= m: a tap's two button reports
//          and any report delivered while the mouse was free are accepted but
//          write no 'm'); the digitizer field MUST be > 0.  The injected field
//          MUST be under a tenth of the accepted count.  hidcheck MUST find no
//          fault.
//   ARM B  in_rawinput_touchpad 0, 12 s, SWIPE AGAIN -> data/p468_B.hid
//          The view MUST NOT turn.  No 'm' record from the touchpad devid
//          (buttons and keys are not graded: on a laptop whose only raw mouse
//          collection is the pad's own silent one, the pad takes devid 0, which
//          legacy clicks and the keyboard share); accepted MUST be 0; digitizer
//          MUST be > 0 (the pad was touched); injected MUST be > 0 and within a
//          factor of four of A's accepted count.  Same gesture, now rejected:
//          the control that shows the acceptance is the cvar's doing.  hidcheck
//          faults "no frame markers" here when nothing was drained, and that is
//          the only fault the grader allows (allowed, not required: a keypress
//          drains a frame).
//   ARM C  in_rawinput_touchpad 1, 6 s, HANDS OFF -> data/p468_C.hid
//          accepted 0, injected 0, digitizer 0, no motion records at all (keys
//          are not graded).  The counters do not tick on their own, and a
//          resting pad reports nothing for the window to cover.  Same rule for
//          "no frame markers" as B.
//   ALL    the unenumerated field MUST stay 0 (nothing is hot-plugged); the
//          header's `rawpads` MUST read 1 and the opening `dev` table MUST list a
//          `touchpad` entry in every arm, since enumeration does not depend on
//          the cvar.
//
// WHAT THIS DOES NOT SHOW: whether a synthesised report timed inside the window,
// while a finger rests on the pad, is accepted.  It is, by construction -- the
// window is a presence test and cannot tell them apart -- and the design takes
// that: such a report becomes ordinary counts on the touchpad device, which the
// counts identity and the turn statistics judge like any other motion.

exec cfg/test/_quiet.cfg

developer 1
log_developer 1
log_enable 1
log_dir logs
log_name p468pad
cl_maxfps 100
cl_idlefps 0
sv_cheats 0
con_notifylines 4
con_notifytime 6
r_drawviewmodel 0

wait 200
map bhop_eazy
waitmap 600
waitms 3000

echo ^5=== P468: the raw input state in force
in_rawinput
in_rawinput_touchpad

echo ^5=== P468 ARM A: SWIPE THE TOUCHPAD NOW, keep swiping for 12 seconds
in_rawinput_touchpad 1
in_journal_begin
waitms 12000
in_journal_note p468-arm-A-accept
waitms 200
in_journal_end data/p468_A.hid
waitms 1500

echo ^5=== P468 ARM B: cvar OFF. SWIPE AGAIN for 12 seconds (the view should NOT turn)
in_rawinput_touchpad 0
in_journal_begin
waitms 12000
in_journal_note p468-arm-B-reject
waitms 200
in_journal_end data/p468_B.hid
waitms 1500

echo ^5=== P468 ARM C: HANDS OFF the pad for 6 seconds
in_rawinput_touchpad 1
in_journal_begin
waitms 6000
in_journal_note p468-arm-C-control
waitms 200
in_journal_end data/p468_C.hid
waitms 1000

echo ^5=== END OF RUN ===
waitms 1000
quit
