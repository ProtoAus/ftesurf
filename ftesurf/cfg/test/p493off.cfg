// Patch 493 -- THE OFF SWITCH.  Launched with `+set run_movebound 0` ON THE
// COMMAND LINE, not with a `set` inside this cfg: run_t_movebnd is latched in
// SV_TimerMapInit beside run_startcap, so the cvar has to hold its value before
// the map loads -- the same reason run_evidence_ul is a `+set` (a serverinfo key
// is published at map init).  A `set` above the `map` line would also work, but
// SSQC registercvar at map init is exactly the reset trap this tree keeps
// recording, and the command line is the route that has been measured.
//
//   Start-Process -FilePath .\ftesurf64.exe -WorkingDirectory "C:\FTESurf" `
//     -ArgumentList '-WindowStyle','Minimized','+set','run_movebound','0', `
//                     '+exec','test/p493off.cfg'
//
// PRE-REGISTERED PREDICTIONS
//  P1  `cmd timer` reads `movebnd: bound 0  over 0  worst 0  moveoor 0` even
//      while +forward is held at cl_forwardspeed 5000 -- the check returns before
//      it looks at anything, so nothing is counted and nothing is marked.
//  P2  THE FILE CARRIES NO `movebnd` KEY AT ALL.  Absent is a state a reader can
//      see, on the `proprule` precedent, and it is what stops reccheck.py from
//      judging the bit in either direction for a server that applied no bound.
//  P3  The run still RECORDS and still archives: turning the observation off must
//      not touch the recorder.
// FALSIFIED IF bound reads 2000 (the `+set` did not reach the map init), or if a
//   `movebnd` key appears in the file, or if `over`/`worst` are non-zero.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p493off
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
set rec_enable 1
set rec_hid 0
set rec_upload 0
set rec_runarchive 1
// run_resume 0: a park would leave `flags 0` in the file (the flags word is only
// rewritten at a real close), and this arm needs a closed file with no `movebnd`
// key to prove the absence is visible to a reader.
set run_resume 0
name "^3P493OFF"
set cl_forwardspeed 5000
set cl_sidespeed 450
set cl_upspeed 450
set cl_movespeedkey 1
echo P493 OFF PRECONDITION cl_forwardspeed $cl_forwardspeed

// A PORT OF ITS OWN: another session runs arms on bhop_eazy too, and a
// listen server that cannot bind is an arm that measures nothing while
// looking like a hang.
// waitms BEFORE the map and waitmap AFTER it -- the recipe in b89zdl.cfg's
// own comment, which is the trap this cfg hit on its first run: with
// neither, every command ran while the engine was still initialising, the
// map never loaded, and the whole arm read `Can't "cmd", not connected`.
waitms 4000
set sv_port 27894
map bhop_eazy
waitmap 45
sv_cheats 1
waitms 500
echo ================================ P493 OFF -- the run
cmd zone_goto 0
waitms 1500
setpos -352 -352 144 0 335.3 0
waitms 1000
+jump
waitms 700
-jump
waitms 1500
+forward
waitms 1500
cmd timer
waitms 1500
-forward
waitms 1000
echo ================================ P493 OFF -- the line this arm must print
cmd timer
waitms 1500

echo ================================ P493 OFF -- FINISH it, b88fin.cfg's route
set cl_forwardspeed 450
waitms 1000
// BACK TO b88fin's LAUNCH POINT, and this is not decoration: phases A and B move
// the body (B at cl_forwardspeed 5000), so a flight from wherever B left it goes
// somewhere else entirely -- the first run of this arm flew 2785 units down +x and
// never crossed the end region (`checkpoints: 0 crossed`).  A setpos mid-run adds
// a `warp` record and taints the attempt, both of which are already true here, and
// it does NOT re-arm: only `zone_goto` does that, so the counters this arm is
// measuring survive it.
setpos -352 -352 144 0 335.3 0
waitms 1000
noclip
waitms 500
+forward
waitms 1500
cmd timer
waitms 500
waitms 2900
cmd timer
waitms 2000
-forward
waitms 1500
echo ================================ P493 OFF -- after the end zone: expect FINISHED
cmd timer
waitms 2500

echo ================================ P493 OFF done
quit

// RESULT (2026-10-05, graded by tools/p493move.py's arm C, part of its 26 checks
// / 0 failed):
//   C1  five samples, every one `movebnd: bound 0  over 0  worst 0  moveoor 0`,
//       with cl_forwardspeed 5000 held -- the check returns before it looks at
//       anything, so an off switch is really off and not a bound of infinity.
//   C3  the run still recorded and still finished: the file closed as
//       data/runs/bhop_eazy/main/cheat.rec.
//   C2  that file carries NO `movebnd` key, and reccheck.py reports
//       `movebnd not stated (no bound applied)` and
//       `moveoor not judged (no movebnd key; worst 5000)` -- it says it abstained
//       rather than reporting a clean verdict, and faults nothing.
//   The `worst 5000` in that abstention is the useful part: the reader still
//   reports the largest value the file contains, so "no bound was applied" is not
//   the same silence as "nothing was over it".
