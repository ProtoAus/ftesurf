// P329B -- void fog arm (r_voidfog 0, the patch OFF -- the pre-329 picture).
//
// THE QUESTION.  Patch 329 zeroes the frame's blended globalfog density while
// r_voidview is true -- in the void, noclipping, r_voidvis agreeing -- so a
// player who flies out of a fogged Source map to look at it is not staring at
// fog colour.  surf_tensor2 is the map the fog documentation already cites:
// one enabled controller (master_fog) whose negative fogstart puts the fog
// factor at 0.857 even at ZERO depth, so from a vantage above the map every
// surface is fully fogged.  If the patch works, arm A's void shot shows the
// map's actual colours and THIS arm's (r_voidfog 0) is a silhouette in fog
// colour.
//
// PRE-REGISTERED, before either arm ran:
//   * BOTH logs carry Surf_VoidVisReport's "VOID VIEW" line at the vantage --
//     the void state is identical in both arms and r_voidview really fired;
//   * the INDOOR control shot at spawn is the same fogged picture in both
//     arms (patch must not touch fog inside the map);
//   * mean saturation/brightness of the void shot: A > B by a wide margin
//     (B is nearly a flat fog-colour field);
//   * arm A's RETURN shot, back at spawn, is fogged again like the indoor
//     control -- cl.fog is never modified, only the per-frame blend.
log_enable 1
log_dir "logs"
log_name "p329b"
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
vid_width 640
vid_height 480
con_notifytime 0
con_notifylines 0
developer 1
log_developer 1

r_voidvis 1
r_voidfog 0

wait 200
map surf_tensor2
waitmap 900
waitms 15000
sv_cheats 1
waitms 500

echo ^5=== P329B: indoor control at spawn, fog must be ON ==============
cmd run_eyeinfo
waitms 2000
screenshot p329b_indoor
waitms 700

echo ^5=== P329B: noclipping to the void vantage =======================
noclip
waitms 400
setpos -11776 -13632 24000 90 0 0
waitms 3000
cmd run_eyeinfo
waitms 500
screenshot p329b_void
waitms 700

echo ^5=== P329B: back inside -- fog must have returned ================
setpos -11776 -13632 13681 0 90 0
waitms 3000
cmd run_eyeinfo
waitms 500
screenshot p329b_return
waitms 700

echo ^5=== P329B DONE ==================================================
wait 60
quit
