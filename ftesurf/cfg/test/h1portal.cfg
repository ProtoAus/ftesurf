// H1 -- did the aperture stop being half-size?
//
// momentum.fgd:5366-5372 declares `width`/`height` as HALF-extents ("Half-Width
// (G)", via the orientedwidthheighthalf helper).  Both cl_portal.qc:339 and
// sv_entities.qc:1033 halved them a second time, so every door was drawn -- and
// entered -- at half its size in each axis.
//
// The number to beat is already measured, twice, from the G15/G16 shots:
// portal_hub_exit's frame opening in the `kitsune` func_brush is 176.12 units
// wide read from 200 units back and 176.15 read from 100 units back, and its top
// edge is at z 272.15 against a door origin of z 184 (so 88.15 half-height).
// The painted quad measured 88.0 x 88.0.  It must now measure 176.
//
// HOW THE MEASUREMENT WORKS, without touching the shader: shoot each position
// twice, once with vbsp_portal_render 1 and once with 0.  vbsp_portal_render 0 makes
// FS_PortalPredraw return PREDRAW_NEXT (cl_portal.qc:166), so the aperture is not
// drawn at all and everything else in the frame is identical.  The bounding box
// of the differing pixels IS the painted aperture, exactly, with no probe colour
// to install and revert.
//
// Same camera as G16 so the before/after is directly comparable.

cfg_save_auto 0
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "h1_portal"
scr_sshot_type png
cl_yieldcpu 0
cl_maxfps 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0
r_speeds 2

waitms 2500
map surf_kitsune
waitmap 240
waitms 8000
sv_cheats 1

// ---------------------------------------------------------------- 100 units
echo "@@@ H1 hub 100, aperture ON"
vbsp_portal_render 1
setpos 0 -620 150 0 90 0
waitms 3000
r_speeds_dump
waitms 400
screenshot_mega h1_hub100_on 1280 720
waitms 800

echo "@@@ H1 hub 100, aperture OFF (the subtrahend)"
vbsp_portal_render 0
waitms 2000
screenshot_mega h1_hub100_off 1280 720
waitms 800

// ---------------------------------------------------------------- 200 units
echo "@@@ H1 hub 200, aperture ON"
vbsp_portal_render 1
setpos 0 -720 150 0 90 0
waitms 2500
screenshot_mega h1_hub200_on 1280 720
waitms 800

echo "@@@ H1 hub 200, aperture OFF"
vbsp_portal_render 0
waitms 2000
screenshot_mega h1_hub200_off 1280 720
waitms 800

// ---------------------------------------------------------------- oblique
// A yawed door is the case a bounding rectangle could never have covered, and
// now also the case where a doubled quad has the most room to go wrong.
echo "@@@ H1 oblique, aperture ON"
vbsp_portal_render 1
setpos -90 -620 150 0 55 0
waitms 2500
screenshot_mega h1_oblique_on 1280 720
waitms 800

echo "@@@ H1 oblique, aperture OFF"
vbsp_portal_render 0
waitms 2000
screenshot_mega h1_oblique_off 1280 720
waitms 800

vbsp_portal_render 1
echo "@@@ H1 DONE"
waitms 1000
quit
