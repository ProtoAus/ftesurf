// P429SV -- who is watching you (clients: p429t.cfg target, p429w.cfg watcher).
// p385sv.cfg's lobby settings (spectate offered: lobby, avatars, stream).  Run
// from C:\FTESurf:  <server exe> +set sv_port 27636 +set log_name <n> +map bhop_eazy
//   +exec cfg/test/p429sv.cfg
cfg_save_auto 0
log_enable 1
log_dir logs
sv_public 0
// Three clients (viewer, owner, second target): default.cfg allows 2.
set sv_playerslots 4
sv_maxrate 0
sv_maxdownloadrate 0
developer 1
// The refusal arm (R) uses `cmd rec_watch 1`, which needs nothing; no cheats.
sv_cheats 0
// P17: a spectate window's usercmds carry no time, so NEWSPEEDCHEATPROT's
// anti-hover forces 13 ms moves on the held body (sv_send.c); this prints them.
sv_showpredloss 1
set lobby_master ""
set lobby_enable 1
set lobby_avatars 1
set lobby_nocollide 1
set lobby_av_self 0
set lobby_av_stream 1
set lobby_av_colors 1
set lobby_vote 0
set run_spec_countdown 3
// Fixture hygiene: no run files, no parked Multi-Session slot on quit.
set rec_enable 0
set run_resume 0

// pm_ticrate 0.015 (a bhop_ map otherwise loads cfg/lobby/mode_bhop.cfg, 0.01).
sv_gamemode none

map bhop_eazy
echo ^5---- p429sv: tick (want 0.015), countdown (want 3) ----
pm_ticrate
run_spec_countdown
echo ^5---- p429sv: fs_spec should read 1 once Lobby_Frame has run ----
serverinfo
waitms 110000
quit
