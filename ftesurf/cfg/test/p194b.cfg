// FTESurf Patch 194b: the two bugs the first run found.
//
// Run p194 gave the right counts (kitsune 18, kitsune2 30, tripportals 116, all
// predicted from the entity lumps first) but two real faults:
//
//  1. CROSS 1 ended up back where it started while CROSS 2 arrived at its
//     partner -- the same event an odd and an even number of times.  Arriving at
//     the partner's origin leaves the player inside the PARTNER'S trigger, so it
//     sends them back, and they ping-pong.  Both crossings were placed exactly
//     on the portal centre (depth 0), which is why the mirror had no sign to
//     work with.  Fixed by clamping the arrival clear of the exit's volume.
//
//  2. bhop_aberrant reported "1 linked, 1 with no partner" -- CORRECT, my
//     control was wrong, it really does have two.  But `p2` names `p1` as its
//     partner and `p1` names nobody, and the unpaired one was being REMOVED --
//     so the pair broke.  A door with no partnername is a destination.
//
// This run enters at a definite depth so the mirror is unambiguous.
// portal_s3_exit is at -11264 -10504 -2024 yaw 270, so its forward is (0,-1,0):
//   entering 10 units along forward  -> -11264 -10514 -2024
//   entering 10 units against it     -> -11264 -10494 -2024
// The partner portal_s4_entry is at -8192 -15352 -2856 yaw 90, forward (0,+1,0),
// so the two arrivals should straddle it by the 24-unit clamp: y -15376 and
// y -15328 respectively.  Anything else and the transform is wrong.
//
// Each crossing is then held for a further ~1.3s and printed AGAIN: if the
// ping-pong is really gone the second reading matches the first.

cfg_save_auto 0
log_name p194b
developer 1
waitms 2500

echo "=== P194B ==="

echo "### MAP bhop_aberrant (expect 1 linked, 1 with no partner -- and p1 KEPT)"
map bhop_aberrant
waitmap 180
waitms 4000

echo "### MAP surf_kitsune"
map surf_kitsune
waitmap 180
waitms 6000
sv_cheats 1

echo "### CROSS A: enter portal_s3_exit from the +forward side (-11264 -10514 -2024)"
echo "### EXPECT arrival near -8192 -15376 -2856"
setpos -11264 -10514 -2024 0 0 0
noclip
wait 30
echo "### ARRIVED-A:"
viewpos
wait 80
echo "### STILL-A (must match ARRIVED-A -- no ping-pong):"
viewpos
wait 10

echo "### CROSS B: enter portal_s3_exit from the -forward side (-11264 -10494 -2024)"
echo "### EXPECT arrival near -8192 -15328 -2856"
setpos -11264 -10494 -2024 0 0 0
noclip
wait 30
echo "### ARRIVED-B:"
viewpos
wait 80
echo "### STILL-B (must match ARRIVED-B):"
viewpos
wait 10

echo "### CROSS C: portal_s4_exit at -8192 -8552 -4232 -> portal_s5_entry -5120 -15352 -5320"
setpos -8192 -8562 -4232 0 0 0
noclip
wait 30
echo "### ARRIVED-C:"
viewpos
wait 80
echo "### STILL-C (must match ARRIVED-C):"
viewpos
wait 10

echo "=== P194B DONE ==="
waitms 1500
quit
