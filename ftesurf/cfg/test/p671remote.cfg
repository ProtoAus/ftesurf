// Disposable socket rig only; preload a valid 9000 override to prove dedicated ignores it.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name runlines_smoke
log_developer 1
developer 1
con_notifytime 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
vid_winmaximize 0
vid_width 1600
vid_height 900
vid_conautoscale 1
set run_resume 0
waitms 2000
map surf_voyager
waitmap 60
waitms 5000
menu_restart
ui_close
set hud_scale 2
waitms 500
echo P670 REMOTE begin
sv_maxvelocity
zone_edit
wait 4
zone_edit settings
zone_edit setting sv_maxvelocity 5000
zone_edit savesettings
zone_edit press ze_mssave
wait 4
zone_edit pointer 980 438
vote key 512 1
vote key 512 0
wait 4
zone_edit savesettings
echo P670 REMOTE end
echo RUNLINES COMPLETE
quit
