// P440FONT -- Patch 440: the Google face's outline and its grey drop shadow.
// One process, listen server on surf_rookie (its textures load from the Steam
// mount -- surf_kitsune's skyroom does not, and a missing sky FLASHES between
// frames, which is a noise floor no pixel diff survives; the first run of this
// arm proved it).  sv_gravity 0 before the map so the player never falls or
// slides: the camera is then exactly still and every changed pixel is ours.
//
// WHAT IS MEASURED.  hud_font_outline has three states and each pair of shots
// below differs in that cvar and in NOTHING else.  The outline is a draw-side
// ring -- eight copies of the string one pixel out in each direction, under the
// body -- so it adds no glyph-atlas cells; the regions are fractions of the
// shot, and every element that owns one is set explicitly rather than trusted
// from this machine's archived ftesurf.cfg:
//   MAPINFO  x 0.70-1.00  y 0.00-0.25   the map-info block: MONO   -- SUBJECT
//   DEBUG    x 0.00-0.13  y 0.49-0.75   the debug readout:  ROBOTO -- CONTROL
//   SPEED    x 0.35-0.65  y 0.60-0.85   speed + energy line: BEBAS -- CONTROL
//   PANEL    x 0.005-0.19 y 0.30-0.48   the panel's element rows: ROBOTO, and
//                                       the control for arm B.  The fixed block
//                                       below them is excluded on purpose: the
//                                       feature's own chip lives there and its
//                                       label and lit state MUST change.
// The debug block and the panel are parked low on purpose: at their defaults
// they sit over the SKY, whose clouds move, and a control that moves is not a
// control.
//
// PRE-REGISTERED PREDICTIONS (graded by tools/p440font.py):
//  P1 `hud_edit status` prints `hud_font_outline N (state)` once per arm and the
//     state names match the cvar that arm set.
//  P2 NOISE FLOOR: A_a against A_b (same cvar, ~0.7 s apart) changes under 200
//     pixels in MAPINFO and under 200 in DEBUG.  hud_mapinfo_timeleft is 0
//     precisely so this is a floor and not a countdown.
//  P3 A_b (fx0) -> B_b (fx1): MAPINFO changes by more than 500 pixels; DEBUG
//     and SPEED each change by fewer than 50.  A 1 px ring around every glyph
//     moves a two-line mono block a lot, and moves no Roboto or Bebas pixel.
//  P4 B_b (fx1) -> C_b (fx2): MAPINFO changes by more than 150 pixels (the
//     shadow, offset at least 2 px because the ring already owns the 1 px
//     neighbourhood); DEBUG and SPEED still under 50.
//  P5 the editor pair ed0_b against ed2_b: PANEL under 50 pixels, MAPINFO over
//     500.  Same frame, same panel, one cvar -- the panel is the largest text
//     surface in this arm and not one glyph of it is mono.
//  P6 the panel still FITS with HE_FIXEDROWS at 5: bottom edge under the window
//     height, both collapsed and with the seq pane open (the tallest).  edpane_b
//     is the eyeball for `done` still being reachable.
//
// FALSIFIED IF P2's floor is not small, because then P3-P5 are measuring the
// world and not the font; or a CONTROL region moves as much as MAPINFO does --
// the gate is `ui_font_cur == ui_font_mono`, so a control that moved would mean
// a Roboto or Bebas block is drawing through the mono face.
//
// ALSO WATCHED, not pre-registered because it is a regression hunt rather than a
// prediction: the speedometer's number is the cell an earlier cut of this patch
// corrupted (a second baked font slot tipping the shared glyph atlas into a
// plane flush; see sh_font.qc and BACKLOG.md).  SPEED under 50 in P3/P4 is that
// watch: the number is Bebas and must not move at all.
//
// RESULT (2026-09-24, tools/p440font.py, 1280x720 windowed, surf_rookie):
//   P1 ok    states read plain, outline, outline+shadow in order.
//   P2 ok    floor 0 / 0 (MAPINFO / DEBUG).  The only changed pixels in the whole
//            frame pair are the fps counter, bottom right, outside every region.
//   P3 ok    MAPINFO 2224, DEBUG 0, SPEED 0.
//   P4 ok    MAPINFO 373, DEBUG 0, SPEED 0.  373 is the shadow's 2 px sliver on a
//            four-line block; at 1 px (the first cut) it measured 117 and was
//            invisible under the ring, which is why the offset has a floor of 2.
//   P5 ok    MAPINFO 2347, PANEL 0 -- the editor's ten element rows, all Roboto,
//            are pixel-identical with the feature on and off.
//   P6 ok    collapsed 340x502 at y 333 -> 835 of 1111, `done` lit at y 807; with
//            the seq pane open the panel clamps to y 279 -> 1111 and `done` is lit
//            at y 1083, i.e. the last row is still on screen and clickable.
//   Eyeball  p440_crop_fx0/1/2.png: plain, a clean 1 px dark ring, then the ring
//            plus a grey echo down-right.  Nothing moves between states.
//   PREDICTIONS THAT FAILED ON THE WAY, kept because they are the findings:
//     - first arm used surf_kitsune: its skyroom textures are not in the Steam
//       mount and the missing sky FLASHES, so the floor read 239133 in DEBUG.
//       surf_rookie + sv_gravity 0 made the floor exactly 0.
//     - with the console notify on screen (no con_notifytime 0), the speedometer's
//       number drew at (224,226,234) -- the console's ^7 white -- in states 1 and
//       2, 410 changed pixels, while every other Bebas and Roboto block stayed
//       put.  Needs the notify AND this patch's extra draws AND a busy HUD:
//       speed-only and speed+mapinfo cfgs never showed it.  Engine-side font
//       batch colour; BACKLOG.md has the entry, con_notifytime 0 keeps the arm
//       clean and the feature is not implicated.
//     - an earlier cut baked a second outlined font slot instead of drawing the
//       ring, and showed the same 410 px dim.  The dim turned out to be the
//       notify interaction above, NOT atlas corruption -- that reading is
//       withdrawn.  The draw-side ring is what ships anyway: the engine's own
//       outline is a bake read at slot definition for every slot in the process
//       (r_font_postprocess_outline re-bakes the console and menu fonts), and a
//       second slot doubles this face's cells in the four-plane atlas every
//       font shares, for no look the ring cannot draw.

cfg_save_auto 0
log_enable 1
log_dir logs
log_name p440font
developer 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
vid_width 1280
vid_height 720
fs_missingwarn 0
con_notifytime 0            // the status dumps are for the LOG, not the pixels
set run_resume 0
sv_public 0
sv_port 27684
set lobby_dir ""

// HARNESS TRAP (b63a_logic, b65a_hud): a +exec'd config runs while the engine is
// still initialising and a `map` issued then is SILENTLY DROPPED.
waitms 4000
set sv_gravity 0             // a still camera: no fall, no slide, no respawn loop
map surf_rookie
waitmap 45
waitms 5000
menu_restart
waitms 500
ui_close
waitms 1500

echo ==== p440 arm A: the HUD at rest ====
// The layout this arm's regions are written against.  Set, not assumed.
set hud_scale             2
set hud_mapinfo           1
set hud_mapinfo_x      0.99
set hud_mapinfo_y      0.02
set hud_mapinfo_timeleft  0      // a ticking digit is not a font change
set hud_timer             1
set hud_timer_x        0.5
set hud_timer_y     0.035
set hud_speed             1
set hud_speed_x         0.5
set hud_speed_y        0.68
set hud_debug             1      // the Roboto control block, parked off the sky
set hud_debug_x           0
set hud_debug_y         0.5
set hud_keys              0
set hud_mouse             0
set hud_strafe            0
set hud_board             0
set hud_boarding          0
set hud_seq               0
set hud_specby            0
set hud_crosshair         0
set hud_net               0
set hud_banner            0
set hud_edit_panel_x   0.010
set hud_edit_panel_y   0.300     // off the sky: the panel is a control region
waitms 1000
hud_edit status

set hud_font_outline 0
hud_edit status
waitms 700
screenshot p440_A_a
waitms 700
screenshot p440_A_b          // P2's floor is A_a against A_b
set hud_font_outline 1
hud_edit status
waitms 700
screenshot p440_B_a
waitms 700
screenshot p440_B_b
set hud_font_outline 2
hud_edit status
waitms 700
screenshot p440_C_a
waitms 700
screenshot p440_C_b
echo ==== p440 arm A shot ====
hud_edit status

echo ==== p440 arm B: the editor's panel, all Roboto ====
set hud_debug             0      // the left strip belongs to the panel alone
hud_edit on
waitms 1000
set hud_font_outline 0
waitms 700
screenshot p440_ed0_a
waitms 700
screenshot p440_ed0_b
set hud_font_outline      2
hud_edit status
waitms 700
screenshot p440_ed2_a
waitms 700
screenshot p440_ed2_b
echo ==== p440 arm B shot ====
hud_edit status

echo ==== p440 arm C: the tallest pane, does the panel still fit ====
hud_edit seq
waitms 1000
screenshot p440_edpane_a
waitms 700
screenshot p440_edpane_b
hud_edit off
waitms 500

echo ==== p440 done ====
set hud_font_outline 2
log_enable 0
waitms 500
quit
