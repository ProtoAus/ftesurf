// Private dedicated overlay only (a real socket, with the server holding packets back):
//   python tools/runlines_smoke.py ftesurf/cfg/test/runlines_livelag.cfg --dedicated
//       --map surf_kitsune --server-arg "+set sv_minping 120" --output-dir <owned root>
//   python tools/test_runlines_livelag.py <rig>/ftesurf [--control <rig of an older build>/ftesurf]
// Patch 611: the live line's samples behind a ping.  One scripted ride: walk off the start
// platform onto surf_kitsune's first ramp, slide down it and off its lower edge.  The saves
// are spread over the 0.3 s between that exit and the reset trigger below it, so one of them
// holds the server's own recording of the ride (data/saves/surf_kitsune/save*/run.rec in the
// rig), which is what the grader measures the line against.
cfg_save_auto 0
name RunlinesControl
log_enable 1
log_dir logs
log_name runlines_smoke
cl_idlefps 0
cl_maxfps 100
hud_trail 1
hud_trail_fade 1
set hud_rewind_chase 0
rec_savelock 1
waitms 2000
map surf_kitsune
waitmap 60
waitms 6000
menu_restart
ui_close
hud_trail 1
cmd zone_goto 0
waitms 800
echo ==== RIDE ====
+moveright
waitms 800
-moveright
waitms 300
+forward
waitms 2500
sl_save
waitms 50
sl_save
waitms 50
sl_save
waitms 50
sl_save
waitms 50
sl_save
waitms 50
sl_save
waitms 50
sl_save
waitms 50
sl_save
waitms 50
sl_save
waitms 50
sl_save
waitms 50
sl_save
waitms 50
sl_save
// Released before the wait: held, the body walks out of the start again and the
// report below would be a second run's.
-forward
waitms 600
echo ==== RIDEEND ====
trail
replay marks 9
replay marks 10
cmd timer
echo RUNLINES COMPLETE
waitms 100
quit
