// P262C -- Patch 262's collision half, across the maps it changes most and the
// two it must not touch at all.
//
// Offline census says, per map, how many props ask to be solid and how many of
// those ship no .phy:
//
//     surf_garden    420 solid, 420 with no .phy   (112 ivoryshrub, 35 cypress1)
//     bhop_canals   2065 solid, 2065 with no .phy
//     surf_demise   2334 solid, 1525 with no .phy
//     surf_boreas     11 solid,    0 with no .phy  <-- must not move
//     surf_nyx       798 solid,    0 with no .phy  <-- must not move
//
// The engine has to agree with those numbers, arrived at by a completely
// different route -- the census parses the sprp lump and probes the VPKs, the
// engine loads the models.  Two independent counts landing on the same figure is
// the check; one figure on its own would only be this patch agreeing with itself.

log_enable 1
log_dir "logs"
log_name "p262c"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
sv_cheats 1
developer 1
log_developer 1

wait 200
echo ^5=== p262c: Patch 262 collision, hl2_propcollision_nophy 0 (default) ===

map surf_garden
waitmap 1800
waitms 6000
echo ^5----------------------------- surf_garden ------------------------------
prop_census
waitms 600
prop_census ivoryshrub
waitms 600

map bhop_canals
waitmap 1800
waitms 6000
echo ^5----------------------------- bhop_canals ------------------------------
prop_census
waitms 600

map surf_demise
waitmap 1800
waitms 6000
echo ^5----------------------------- surf_demise ------------------------------
prop_census
waitms 600

map surf_boreas
waitmap 1800
waitms 6000
echo ^5-------------------- surf_boreas (must report none) --------------------
prop_census
waitms 600

map surf_nyx
waitmap 1800
waitms 6000
echo ^5--------------------- surf_nyx (must report none) ----------------------
prop_census
waitms 600

echo ^5=== p262c done ===
wait 30
quit
