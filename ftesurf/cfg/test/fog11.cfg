// FOG11 -- classify the one thing on surf_boreas still not fogging.
// After the vertexlit fix the deck, railings and trees all go solid red, but a
// thin tan structure near the left does not, and it SURVIVED hl2_propdist 1 --
// so it is not a static prop.  r_drawentities picks the class apart:
//   1 = all, 2 = skip brush entities, 3 = skip mod_alias (static props)
// whichever value makes it vanish names what it is.
log_enable 1
log_dir "logs"
log_name "fog11"
cfg_save_auto 0
cl_maxfps 0
vid_fullscreen 0
con_notifytime 0
con_notifylines 0
con_notifytime_error 0
vbsp_fog 0
wait 200
map surf_boreas
waitmap 1800
waitms 13000
fog 1 1 0 0 1 0
waitms 1500
screenshot fog11_all
waitms 800
r_drawentities 2
waitms 1500
fog 1 1 0 0 1 0
waitms 1000
screenshot fog11_nobrushents
waitms 800
r_drawentities 3
waitms 1500
fog 1 1 0 0 1 0
waitms 1000
screenshot fog11_noalias
waitms 800
r_drawentities 1
waitms 1000
vbsp_sprites 0
waitms 1500
fog 1 1 0 0 1 0
waitms 1000
screenshot fog11_nosprites
waitms 800
vbsp_sprites 1
echo ^5=========== done =====
log_enable 0
