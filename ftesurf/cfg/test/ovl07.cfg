// OVL07 -- which switch survives gfx_menu key 7, and why.
//
// Key 7 is `retry`, which is `map_restart`: the SERVER respawns and CSQC is
// re-initialised, but Mod_ForName hands back the cached world model.  So the
// prediction is:
//
//   vbsp_overlays   is read by CSQC's per-map entity walk  -> WORKS on retry
//   hl2_overlays  is read inside the BSP loader          -> CANNOT work on retry
//
// The loader prints "VBSP: <map>: N of N baked overlays synthesised" at
// Con_DPrintf level, so developer 1 + log_developer 1 makes the difference
// directly visible: if that line is absent after a retry, the loader did not
// run and no load-time cvar could possibly have applied.

log_enable 1
log_dir "logs"
log_name "ovl07"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
sv_cheats 1
developer 1
log_developer 1

wait 200
echo ^5=== BASELINE ===
hl2_overlays 1
vbsp_overlays 1
map surf_rise
waitmap 1800
waitms 4000

echo ^5=== vbsp_overlays 0 + retry -- expect: overlays found, none placed ===
vbsp_overlays 0
retry
waitmap 1800
waitms 4000

echo ^5=== vbsp_overlays 1 + retry -- expect: back to 103 of 105 ===
vbsp_overlays 1
retry
waitmap 1800
waitms 4000

echo ^5=== hl2_overlays 0 + retry -- expect: NO CHANGE, and no VBSP line ===
hl2_overlays 0
retry
waitmap 1800
waitms 4000

echo ^5=== ovl07 done ===
wait 30
quit
