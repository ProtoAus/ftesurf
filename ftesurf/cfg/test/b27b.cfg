// BUILD 27 -- LOOK AT THE SKY.
//
// b27a proved the MECHANISM (which sky is chosen, that all six faces resolve,
// that the up face now takes $basetexture).  It could not show the sky, because
// the spawn on this map is inside a closed room and the notify overlay covered
// the frame anyway.
//
// So: kill the overlay (con_notifylines is a COUNT -- con_notifytime is a
// duration and does not empty it, the build 21 finding), noclip well clear of
// the geometry, look up, and take the A/B.

developer 0
log_developer 0
cfg_save_auto 0
con_notifylines 0
hud_debug 0

wait 200
map surf_colin_blaster_69000
waitmap 120

// out of the start room and high enough that the sky is most of the frame.
// pitch -75 is near-vertical without being degenerate.
noclip
wait 10
cmd zone_goto 0
wait 30
viewpos
wait 6

echo "=== A: r_skybox_default sky_cape_hill -- the up face fixed ==="
setpos 0 0 6000 -75 0
wait 40
viewpos
wait 6
screenshot skyA_fixed
wait 20

echo "=== B: no default at all -- what the map drew before ==="
r_skybox_default ""
wait 30
setpos 0 0 6000 -75 0
wait 40
screenshot skyB_none
wait 20

echo "=== C: the default back, straight up ==="
r_skybox_default "sky_cape_hill"
wait 30
setpos 0 0 6000 -89 0
wait 40
screenshot skyC_straightup
wait 20

echo "=== D: a side, for comparison with the top ==="
setpos 0 0 6000 0 90
wait 40
screenshot skyD_side
wait 20

echo "=== b27b done ==="
wait 20
exit
