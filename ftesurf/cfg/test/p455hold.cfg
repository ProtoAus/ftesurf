// P455HOLD -- the hold refusal, the branch Patch 455 added that no arm has driven.
//
// REQUIRES PATCH 455 (rounds 5+6, f8cca10 or later).  On any earlier build the
// gate has no reason codes and this arm reports NOT DEMONSTRATED rather than
// failing: an arm that goes red on a build that predates its subject teaches
// nobody anything.
//
// WHAT IT DRIVES.  The gate refuses to take a finish's forgiveness while the
// body is HELD, because a hold reads 0 u/s and hands the speed back on release
// (sv_saveloc.qc:3140).  Driving that needs four things true at once, and three
// of them are easy to get wrong silently:
//
//   1  a save to hold, taken while the tag is DOWN.  The load's tag handling is
//      RAISE-ONLY, so a `hopped 0` save neither raises the tag nor clears the
//      pending forgiveness -- but a `hopped 1` save calls SV_HopFgvClear and the
//      gate goes inert, which would read exactly like the branch not existing.
//   2  the tag up and a finish behind it, so finfgv is armed.
//   3  the take NOT already fired.  It fires 0.25 s after the body is grounded
//      at or under the cap, and this fixture walks out at ~260 against a cap of
//      260, so a walked exit hands the take the window.  The exit is therefore
//      GROUND FIRST, AIR SECOND: +forward alone to the cap, then +jump added to
//      carry that speed across the end region and keep `ong` false afterwards,
//      which holds the streak open for as long as the key is down.
//      THE ORDER IS THE WHOLE TRICK.  Run 2 held +jump from the box onwards and
//      the body hopped ON THE SPOT for two seconds -- the same two z values over
//      and over, no travel, no crossing, no finish and so nothing armed.  A jump
//      from a standstill is vertical motion, because +forward adds nothing in
//      the air; the speed has to exist before the body leaves the ground.
//   4  `cmd sl_load` and `cmd sl_hold` in ONE server frame.  A bare sl_hold is a
//      no-op: SV_SaveLocHold requires rec_sl_loadt == time, the same row and seq,
//      and the body within one unit of the save's origin.  b30a.cfg:44-49 sends
//      the pair on consecutive lines with no wait and it lands; this copies it.
//
// THE PREMISES ARE GRADED, NOT ASSUMED.  Every one of the four prints something
// this arm reads, so "no refusal" is never ambiguous: it is either the branch
// failing or a premise that did not hold, and tools/p455hold.py says which.
// The hold itself is proven WITHOUT reference to the gate -- two `viewpos` lines
// 400 ms apart while +forward is held, which must be identical because the hold
// is MOVETYPE_NONE and re-places the origin every tick (b24a.cfg:67-72 uses the
// same evidence for the same reason).
//
// PRE-REGISTERED
//  H1 premise: `hopped 0` at the save, `hopped 1` after the chain, and STILL
//     `hopped 1` after the load -- the raise-only path, measured not traced.
//  H2 premise: the two viewpos lines under +forward are identical. If they are
//     not, the hold did not land and H3 is NOT DEMONSTRATED rather than failed.
//  H3 the held refusal fires: reason 1, "is held, so the forgiveness is NOT
//     measured".
//  H4 after sl_holdoff, the settling refusal fires (reason 4) and then the take,
//     with `at rest for X s over N clear reads`, X >= 0.25 and N >= 8.
//  H5 order: held, then settling, then taken. A take before the release would
//     mean the hold did not stop the streak.
//  H6 the OVER-CAP clause refuses -- round 8's reason 6, "over the cap: X u/s
//     against the mover's Y, grounded and level". It had never refused anything:
//     this fixture crosses at exactly 260 against a cap of 260, so every refusal
//     before round 8 was the airborne clause wearing a shared message. Section M
//     moves the cap instead of the body.
log_enable 1
log_dir logs
log_name p455hold
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
sv_port 27706
sv_cheats 0
set run_resume 0
vid_fullscreen 0
waitms 5000
map bhop_eazy
waitmap 2400
waitms 3000
menu_restart
ui_close
waitms 1200

echo ==== S the save, taken while MOVING and while the tag is DOWN ====
// THE STRAFE DID NOT MOVE THE BODY.  This section used +moveright for 600 ms,
// and Patch 455's hold dprint says what that actually parked:
//     hold: took on row 0, parking 0.000 u/s
// A save writes `velocity %.4f` from e.velocity at the instant it is taken
// (sv_saveloc.qc:1058), so a stationary save parks a stationary row, the load
// hands back nothing, and section M has no speed to be over the cap with.
// H3 was passing on a hold that held an actual zero -- which is CLAUDE.md's own
// "an sl_hold with an empty cursor" one word over: it fired, and it measured
// nothing.  A confined start box is the likely reason a sideways strafe went
// nowhere; +forward demonstrably travels, since run 2 crossed the end region
// with it.
//
// SHORT, THEN.  300 ms reaches the cap (ground acceleration is ~0.2 s to
// maxspeed) and covers ~60 units, well short of the end region that 900 ms
// crossed.  The save must be taken with the tag DOWN -- a `hopped 1` save calls
// SV_HopFgvClear on load and the gate goes inert -- so it happens here, before
// run_starthop, and the parked speed is graded rather than assumed.
+forward
waitms 300
cmd sl_save
waitms 200
-forward
waitms 400
cmd timer
waitms 300

echo ==== C the tag, then the key UP ====
// The jump key is RELEASED here, which run 2's route did not do.  Holding it
// into the next section is what made the body hop on the spot: +jump from a
// standstill is vertical motion at one origin, because +forward alone adds
// nothing in the air.  Speed has to be built on the ground first.
run_starthop
waitms 300
cmd timer
waitms 600
+jump
waitms 1400
-jump
waitms 400
cmd timer
waitms 300

echo ==== F build speed, THEN carry it over the end ====
// Ground first, air second.  +forward alone accelerates to the cap while
// grounded; adding +jump after that carries the speed across the end region and
// keeps `ong` false afterwards, which is what holds the dwell's streak open
// long enough for the hold to land.  Run 2 had the two in the other order and
// never travelled at all.
+forward
waitms 700
+jump
waitms 1400
cmd timer
waitms 300

echo ==== H load and hold, in one frame ====
cmd sl_load
cmd sl_hold
waitms 300
viewpos
waitms 400
viewpos
cmd timer
waitms 300

echo ==== M the cap moves, not the body ====
// KEYS UP FIRST, AND THAT IS THE WHOLE OF ROUND 8'S FAILURE.  +jump is pressed
// in F to hold the window open and was not released until R, so `sl_holdoff`
// handed the body back its speed with the jump key still down: it launched,
// stayed airborne to the end of the cfg, never came to rest, and so neither the
// take nor the over-cap refusal could happen.  Four `not grounded` refusals and
// no take -- the gate was right every time and the route was wrong.
// The hold itself keeps the streak broken while these are released, so letting
// go here costs nothing.
-jump
-forward
waitms 200

// THE GESTURE IS ARTIFICIAL AND THE BRANCH IS REAL.  No player has sv_maxspeed
// lowered under them mid-run; the clause they meet is the shipped one, and it
// had never refused anything because this fixture crosses at exactly 260
// against a cap of 260.
//
// `.maxspeed` is refreshed from sv_mv_maxspeed on every PreThink
// (sv_player.qc:499-500), so lowering the cvar lowers the mover's cap on the
// next tick.  Releasing the hold then hands back the 260 u/s the save parked,
// onto a GROUNDED, LEVEL body whose cap is now 200 -- which is reason 6.
//
// Round 8 gave that clause its own line, so this no longer depends on reason 1
// sitting between two reason-2s to be heard.  Before it did: `!ong`, `rising`
// and `over the cap` shared one message and one said-once latch, so an
// over-cap refusal straight after an airborne one was silent.
sv_maxspeed 200
waitms 200
cmd sl_holdoff
waitms 700
cmd timer
waitms 300
// Back where it was, so nothing downstream inherits a 200 cap.
sv_maxspeed 260
waitms 400

echo ==== R settle and take ====
// The keys came up in M; this is the settle the dwell needs, with the cap back
// at 260 so the body is under it and level.
waitms 1800
cmd timer
waitms 400

quit
