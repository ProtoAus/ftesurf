cfg_save_auto 0

// ===========================================================================
//  P441FAST -- and what the clean arm is WORTH: a ranked run at 400 u/s.
//    python tools/p441void.py --arm fast
//  The defect, the fix, the fixtures and the zones fixture are all in
//  cfg/test/p441void.cfg's header.  This arm differs in one line of one file:
//  save902 carries `velocity 400 0 0` where 901 is at rest.
//
//  WHY THE SECOND ARM.  A save with speed on it is the case the Patch 435 gate
//  deliberately does NOT fire for (SL_RowSpeed >= SL_ARM_SPEED, which is 1), so
//  on the control build the arm edge can only come from the latch SV_TimerVoid
//  cleared -- this arm isolates that one cause, where p441void's at-rest fixture
//  reaches the same state through either the gate or the void.  And it measures
//  the consequence rather than the state: the body coasts out of the box while
//  ARMED, which STARTS the run, so the control build files a clean run whose
//  first tick is 400 u/s out of a start box.
//
//  FIRST CUT PREDICTED THE COAST AND WAS WRONG, which is worth the two lines:
//  400 u/s with no key held does not leave the box.  Ground friction stops the
//  body in ~120 units and the box wall is 196 away, so the first run of this arm
//  read `arm zone 0` at +2.5 s -- still inside.  So the walk-out is a GESTURE now,
//  and that is also the honest one: leaving the box is what starts a run.
//
//  PRE-REGISTERED PREDICTIONS
//   C1  `timer: running`, `recording 1` -- the premise (Patch 441 voids only
//       where SV_RecEnabled(), and this server records).
//   S   both builds: `run cancelled (the save's recording could not be restored)`.
//   S   CONTROL (HEAD, pre-441): `timer: armed` -- the void's cleared latch became
//       an arm edge against a body still in the box.  FIXED: `timer: idle`.
//       `class: clean` and `practice 0` read the SAME on both builds here (on the
//       control because SV_TimerArm cleared the taint, on the fixed build because
//       they are an IDLE report's defaults), so `state` is the discrimination --
//       the same correction p441void.cfg carries, found by an audit of these arms.
//   S2  after walking out of the box: CONTROL `timer: running` with `class: clean`
//       and `practice 0` -- a ranked run started at the speed the save carried,
//       which is what the clean arm was worth.  FIXED: `timer: idle`, and
//       `arm zone -1` because the body has now left the box it was placed in.
//  FALSIFIED IF C1 does not read running+recording 1, or S reads `armed` on the
//   fixed build, or S2 reads `running` on the fixed build, or S2 reads `idle` on
//   the control build (then nothing was laundered and the arm measured nothing).
//
//  RESULT (2026-09-26, round 3, both builds, driver exit 0 each way; qwprogs
//   3096B6F5468BEE3A fixed / 830A76438E00EFA4 control, logs kept as
//   ftesurf/logs/p441fast.log.fixed and .control)
//   C0 row 2 of `sl_list` reads 400 u/s -- the fixture is the one with speed.
//   S  the load event carries slot 902, so the clamp did not silently hand this arm
//      the at-rest row.  CONTROL `timer: armed`; FIXED `timer: idle`, `arm zone 0`.
//   S2 after walking out of the box:
//      CONTROL `timer: running` with a clock counting from zero (0:01.170 on disk --
//      a FRESH run, not the parked 0:05.000): a new run started out of a load whose
//      recording could not be restored.  `class: clean` and `practice 0` read the
//      same on the fixed side too (there the run is idle and they are its defaults),
//      so `state` and the clock are what discriminate; and `recorder: buffer 17`,
//      which is the line that would say a recording is open for it, is in the log
//      but NOT read by this arm -- the driver has no `buffer` entry for `fast`.
//      FIXED `timer: idle`, `arm zone -1 (armed from -1)`, clock still the parked
//      0:05.000 and `recorder: buffer -1`: leaving a box the latch says you were
//      standing in is not a start.
//   NOT MEASURED HERE: the body's own speed at S2.  The arm reads the ROW's 400 u/s
//   at C0 and the run's class at S2, and infers the rest; a `cmd viewpos` in S2
//   would close that and is the obvious next line for whoever touches this file.
log_enable 1
log_dir logs
log_name p441fast
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
sv_port 27692
sv_cheats 0
set run_resume 0
vid_fullscreen 0
waitms 5000
map bhop_eazy
waitmap 2400
waitms 3000
menu_restart
ui_close
waitms 1200

echo ==== C0 the list ====
cmd sl_list
waitms 800

echo ==== C1 leave the start box: must read running / recording 1 ====
+forward
waitms 1500
-forward
waitms 700
cmd timer
waitms 800

echo ==== S SUBJECT: load row 2, 400 u/s, whose recording prefix is gone ====
// One gesture -- see p441void.cfg: `sl_goto` is itself the load.
cmd sl_goto 2
waitms 1600
cmd timer
waitms 900

echo ==== S2 walk out of the box: on the control build that STARTS the run ====
+forward
waitms 1200
-forward
waitms 600
cmd timer
waitms 800

quit
