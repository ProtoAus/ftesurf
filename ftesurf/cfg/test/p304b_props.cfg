cfg_save_auto 0
// Patch 304 follow-up -- the fold on a POPULATION, not on the one prop it was
// designed against.
//
// p304a verified stage2_detail02 to the last printed digit in both arms.  That
// is the prop the offline model was built on, so it is the weakest possible
// place to stop: a fold fitted to one cube and checked on the same cube has not
// been tested at all.  This censuses every prop whose model name contains
// "detail" in both arms, at a vantage where they have actually drawn (a prop
// that has never been solved prints STALE and is excluded rather than counted
// as zero).
//
// PRE-REGISTERED, from the 200-leaf-cube study:
//   * For EVERY prop, base must FALL and the lit end must move far less than the
//     base does.  That is the re-anchoring; a prop where both fall together is a
//     prop being dimmed, which is the failure mode this patch must not have.
//   * The direction must be identical between the arms ONLY where the legacy
//     unsigned solve happened to agree with the signed one; elsewhere it flips.
//   * No prop may come back with base or lit end at exactly 0 -- that would mean
//     the zero-length-direction guard fired, and on a real cube it should not.
vid_fullscreen 0
vid_restart
waitms 3000
wait 200

developer 1
log_developer 1
log_enable 1
log_dir logs
log_name p304b_props
cl_maxfps 0
cl_idlefps 0
sv_cheats 1
con_notifylines 0
con_notifytime 0.01
r_drawviewmodel 0

map surf_tensor2
waitmap 600
waitms 9000
waitms 3000
noclip
waitms 1000

setpos -12300.9990 10799.1201 -9654.1191 3.1311 43.4784 0
waitms 3000

echo ^5=== ARM A: hl2_lt_fold 1 (default)
hl2_lt_worldlight 1
hl2_lt_dirsign 0
hl2_lt_fold 1
waitms 3000
prop_census detail
waitms 1500
prop_census stage
waitms 1500

echo ^5=== ARM B: hl2_lt_fold 0 (legacy)
hl2_lt_fold 0
waitms 3000
prop_census detail
waitms 1500
prop_census stage
waitms 1500

echo ^5=== END OF RUN ===
waitms 500
quit
