// Patch 415 on a LIVE LOBBY -- player A, the one who leaves a save.
//
// p415reset.cfg drove `!r` on a listen server. Two paths it could not reach are
// lobby-only: SL_Blk splits the save rows per player (Patch 333), and
// lobby_nosaveloc refuses the picker. This pair of cfgs drives the first one
// against the real fleet; B is the second player, from a SEPARATE install so it
// carries its own qkey and therefore its own guid.
//
// Run (both, A first):
//   ftesurf64.exe +set log_name p415lobA +set p415_target play.proto.bar:27540 +exec cfg/test/p415lobA.cfg
//   <other install>\ftesurf64.exe +set log_name p415lobB +set p415_target ... +exec cfg/test/p415lobB.cfg
//
// PREDICTION, registered before the run:
//   A1  `!m`, then a save taken WHILE MOVING inside the start box: its own
//       `sl_list` row reads a NON-ZERO u/s. If it reads 0, A2 proves nothing.
//   A2  `!r` lands on that save ("your save"), and a save taken immediately
//       after reads 0 u/s at the same spot -- the placement hands back an origin,
//       never the velocity (the prespeed-injector the load version would have been).
//   A3  the clock still reads 0:00.000 and the run is clean/armed throughout.
// FALSIFIED IF the post-`!r` row carries speed, or `!r` reports the map start
// while A's own save sits in the box, or the run tains.
cfg_save_auto 0
log_enable 1
log_dir logs
developer 0
cl_idlefps 0
cl_maxfps 100
name "^3P415 A"
waitms 22000
echo ======== P415A connect $p415_target
connect $p415_target
waitms 22000
echo ======== P415A who am I, and the rows before anything
cmd sl_list
waitms 900
say !m
waitms 2500
cmd viewpos
cmd timer
waitms 900
echo ======== P415A save WHILE MOVING (row must carry u/s)
+back
waitms 250
cmd sl_save
waitms 150
-back
waitms 1500
cmd sl_list
cmd timer
waitms 1200
echo ======== P415A !r must land on that save
say !r
waitms 2500
cmd viewpos
waitms 600
echo ======== P415A save again: this row must read 0 u/s
cmd sl_save
waitms 1200
cmd sl_list
cmd timer
waitms 1500
echo ======== P415A holding while B connects
waitms 45000
echo ======== P415A done
waitms 800
quit
