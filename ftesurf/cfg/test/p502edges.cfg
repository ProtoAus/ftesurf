// Patch 502 review falsifiers. Only run inside p502segments.py's private rig.
cfg_save_auto 0
fs_cache 0
log_enable 1
log_dir logs
log_name p502edges
cl_idlefps 0
cl_maxfps 100
hud_trail 1
rec_savelock 1
cl_slpredict 0
hud_rewind_chase 0
waitms 5000
map surf_dune
waitmap 60
waitms 8000
menu_restart
ui_close
hud_trail 1
rec_savelock 1
cl_slpredict 0
hud_rewind_chase 0
waitms 1000
// E: go+save in one frame must not overwrite the go acknowledgement.
echo ==== P502 EDGE GO ====
cmd sl_goto 2
waitms 400
+forward
waitms 900
-forward
rewind
waitms 200
rewind
waitms 300
rewind seek -0.3
rewind go
sl_save
waitms 400
rewind status
cmd timer
waitms 200
echo ==== P502 EDGE HOLD1 ====
saveloc
cmd timer
waitms 900
echo ==== P502 EDGE HOLD2 ====
saveloc
cmd timer
waitms 250
echo ==== P502 EDGE RELEASE ====
waitms 2300
rewind status
saveloc
cmd timer
waitms 500
echo ==== P502 EDGE ADVANCE ====
cmd timer
waitms 300
// Fresh same-lineage run: second rewind reaches before its first cut.
echo ==== P502 EDGE WARMSETUP ====
cmd zone_goto 0
waitms 400
+forward
waitms 3000
-forward
rewind
waitms 200
rewind
waitms 250
rewind seek -0.3
rewind go
waitms 400
cmd timer
waitms 3100
+forward
waitms 700
-forward
echo ==== P502 EDGE WARM ====
rewind
waitms 200
rewind
waitms 250
rewind seek -2.6
rewind status
rewind go
waitms 3500
rewind status
cmd timer
waitms 300
// F: one event stat, two distinct captured replay prefixes.
echo ==== P502 EDGE OVERLAP ====
replay data/saves/surf_dune/save002/run.rec
waitms 600
replay pause
replay seek 0.2
sl_save
replay seek 0.5
sl_save
waitms 1000
saveloc
replay stop
waitms 250
// G: save001's picture was parked. B's line must not become A's.
echo ==== P502 EDGE MISSING ====
cmd zone_goto 1
waitms 300
+forward
waitms 1800
-forward
trail
cmd sl_goto 1
waitms 500
trail
cmd viewpos
cmd timer
waitms 300
// H: after finalization, save a back-scrubbed placement, not its tail.
echo ==== P502 EDGE ENDED ====
+forward
waitms 1600
-forward
cmd rec_watch 1
waitms 150
cmd rec_watch 0 void
waitms 300
cmd timer
rewind
waitms 250
rewind seek -0.7
rewind status
sl_save
waitms 600
saveloc
waitms 200
+sl_hold
waitms 400
trail
cmd viewpos
waitms 200
-sl_hold
// I: vote retains priority; both key edges still work.
echo ==== P502 EDGE VOTE ====
rewind
waitms 250
vote fake open 1 120 3
vote fake label 1 first
vote fake label 2 second
waitms 1000
vote status
vote key 49 1
vote key 49 0
waitms 300
vote status
vote fake off
echo ==== P502 EDGE VOTEEND ====
rewind go
waitms 3600
// J: actual board state between edges, before any explicit open.
echo ==== P502 EDGE BOARD ====
rewind
waitms 300
vote key 9 1
+showscores
waitms 150
scores status
vote key 9 0
-showscores
waitms 150
scores status
vote key 9 1
+showscores
waitms 150
scores status
vote key 9 0
-showscores
waitms 150
scores status
rewind go
waitms 3600
// Accepted live save must precede a load in the same command-buffer pass.
echo ==== P502 EDGE ORDER ====
cmd zone_goto 1
waitms 500
cmd viewpos
sl_save
+sl_hold
waitms 800
cmd viewpos
saveloc
waitms 200
-sl_hold
// Both queued viewer saves finish before the following load exits the viewer.
echo ==== P502 EDGE SAVELOAD ====
replay data/saves/surf_dune/save002/run.rec
waitms 600
replay pause
replay seek 0.2
sl_save
replay seek 0.5
sl_save
+sl_hold
waitms 1200
replay status
saveloc
cmd viewpos
waitms 200
-sl_hold
// Low-FPS control and queued gesture: load/hold must share server time.
cl_maxfps 10
cmd sl_goto 2
waitms 400
+sl_hold
waitms 400
echo ==== P502 EDGE HOLDCTRL1 ====
saveloc
cmd timer
cmd viewpos
waitms 600
echo ==== P502 EDGE HOLDCTRL2 ====
saveloc
cmd timer
cmd viewpos
waitms 200
-sl_hold
waitms 400
echo ==== P502 EDGE HOLDCTRLRELEASE ====
saveloc
cmd timer
waitms 200
cmd sl_goto 2
waitms 400
+forward
waitms 500
-forward
sl_save
+sl_hold
waitms 500
echo ==== P502 EDGE HOLDQUEUE1 ====
saveloc
cmd timer
cmd viewpos
waitms 600
echo ==== P502 EDGE HOLDQUEUE2 ====
saveloc
cmd timer
cmd viewpos
waitms 200
-sl_hold
waitms 400
echo ==== P502 EDGE HOLDQUEUERELEASE ====
saveloc
cmd timer
cl_maxfps 100
waitms 200
// Display reset must not erase the outstanding save's correlation.
echo ==== P502 EDGE OFF ====
replay data/saves/surf_dune/save002/run.rec
waitms 600
replay pause
replay seek 0.4
cl_maxfps 1
waitms 1200
sl_save
hud_trail 0
waitms 2200
saveloc
cl_maxfps 100
hud_trail 1
+sl_hold
waitms 500
replay status
saveloc
cmd viewpos
waitms 200
-sl_hold
echo ==== P502 EDGE END ====
waitms 100
log_enable 0
quit
