// cfg_save_auto 0 FIRST: this run sets archived cvars and must never write them
// into ftesurf.cfg (cl_main.c:2535).
cfg_save_auto 0

// ===========================================================================
//  B88BROWSE -- the map browser's four build-88 changes, headless.
//    python tools/b88browse.py
//
//  WHAT IT MEASURES, and why each one needs the engine rather than a reading of
//  the data files:
//
//    the gutter   ui_dl_gutter asks the FONT.  Roboto is proportional, so the
//                 only thing that can say whether "re-get 999.9 MB" fits in the
//                 old flat 92 px is the engine that draws it.  The arm fails if
//                 the old width was in fact sufficient -- that would mean the
//                 reported chop had some other cause and this fix is aimed at
//                 the wrong thing.
//    tier order   ui_refilter's counting sort, walked over the view it built.
//                 The HISTOGRAM beside the verdict is what stops this passing
//                 on a list that holds one rank: "ascending" is trivially true
//                 of a column of identical values.
//    ksf tiers    ui_meta_load's fallback, counted out of ms_meta after it ran.
//    best times   ui_wr_load, counted out of ms_wr.
//    the library  all three settings driven through the REAL ui_refilter, not
//                 re-derived, so a broken filter cannot agree with the arm.
//
//  ui_browse prints every one of them itself.  Nothing here grades a
//  consequence: a screenshot would pass on a build with all five compiled out,
//  because the failure of each is a row that looks ordinary.
// ===========================================================================

log_enable 1
log_dir logs
log_name b88browse
log_developer 1
developer 1

// FORTY SECONDS, THEN menu_restart -- menu.dat loads lazily and nothing in a
// scripted run needs a menu, so without this every arm prints
// `Unknown command "ui_browse"`.  p466reget.cfg's header records the three runs
// this cost there.
waitms 40000
menu_restart
waitms 4000

// ui_browse calls ui_load_maps itself, so unlike p466reget there is no separate
// ui_maplist to prime it -- but the lazy-load trap is the same one and it is
// worth knowing which call is doing it.
echo ^5==== b88 arm 0: the browser, measured ====
ui_browse surf_ace
waitms 3000

// A SECOND READING, after everything has settled.  ui_load_maps runs again, so
// this also says whether the counts are stable across a reload rather than an
// artefact of the first one -- the tier fallback writes into ms_meta, which
// ui_meta_load rebuilds from scratch each time, and a fallback that accumulated
// would show up here as a rising ksf count.
echo ^5==== b88 arm 1: again, to see it is not a one-shot ====
ui_browse surf_666
waitms 2000

quit
