// Patch 865 review round 2 arm, listen server, through tools/runlines_smoke.py:
//   python tools/runlines_smoke.py ftesurf/cfg/test/p865r2.cfg --mount --timeout 400 \
//     --ssqc <qwprogs> --csqc <csprogs> --mqc <menu> --output-dir <task root>/artifacts
// Control: the round-1 build.
//   V surf_leesriize *357 -> gladosspeech004 after 2.5 s (-12096 12120 -3104, angles 0 270 0,
//     no UseDestinationAngles).  Subject: the view ends at yaw 270 (-90).  Round 1 lost x=0
//     angles in the stash and read the absent key as "keep the view": yaw stays 0.
//   T surf_happyhug *301 sMako_next: OnSpawn retargets it to "tp_sRoxy"; the destination is
//     tp_sroxy (-848 -3232 4552).  Round 1 stored the case as written: no teleport.
//   G surf_qlimax_q *149: gravity 1 behind filter allowt (team 2) on a CT map.  Subject prints
//     "trigger_gravity *149: gravity 1"; round 1 filtered it out.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name runlines_smoke
con_notifytime 0
cl_idlefps 0
cl_maxfps 100
vid_vsync 0
vid_fullscreen 0
vid_width 1280
vid_height 720
sv_public 0
set run_resume 0
developer 1
log_developer 1
waitms 1500

map surf_leesriize
waitmap 120
waitms 6000
menu_restart
ui_close
waitms 500
echo ==== V point_teleport angles ====
setpos -13816 11472 -6712 0 0 0
waitms 4000
cmd viewpos
waitms 300

map surf_happyhug
waitmap 120
waitms 6000
echo ==== T retarget case ====
setpos 12144 7008 12040 0 0 0
waitms 1500
cmd viewpos
waitms 300

map surf_qlimax_q
waitmap 120
waitms 6000
echo ==== G filtered gravity ====
setpos 12568 -1644 -8736 0 0 0
waitms 1000
echo RUNLINES COMPLETE
quit
