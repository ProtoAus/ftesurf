cfg_save_auto 0

// ===========================================================================
// BUILD 65, ARM SET A -- DOES ANY OF IT DRAW.
//
// This is not the feature test; build65.cfg is, and it needs a player.  This is
// the one question a script CAN answer, and it is the question that has to be
// answered first: a QC runtime error in a drawer takes the whole HUD off the
// screen, and every interactive test below it would then be testing a blank.
//
// WHAT IS BEING CHECKED, in the order the log will show it:
//
//   1  the VM loads at all.  `FTESurf CSQC loaded` in the log.  Twelve files
//      changed and one of them is new; a bad .src slot is a silent no-HUD.
//   2  `hud_edit status` prints FIFTEEN rows.  HE_MAX went 12 -> 16 and HE_Add
//      drops an overflow SILENTLY -- the exact trap the table's own comment
//      records firing once before -- so a count of 11 or 12 here means the
//      constant did not take and four elements simply do not exist.
//   3  crosshair should print `--` for x and y, not 0.0000.  It is the first
//      element in the tree with no position cvars and cvar("") returns 0, which
//      would read as "pinned top-left" -- a plausible number for a question with
//      no answer.
//   4  the panes open.  `hud_edit <id>` is new this build and exists precisely
//      because a pane opens by CLICKING and a capture run has no hand.  Three
//      are shot: seq (ten options, the tallest pane and the one the height
//      formula is most likely to be wrong about), crosshair (the only pane whose
//      element cannot be dragged) and speed (which carries the energy options,
//      including the one size cvar that is not on he_cvsize).
//   5  the crosshair textures load.  Three drawpics at screen centre; a missing
//      file draws nothing at all rather than erroring, so this is a LOOK.
//
// PREDICTIONS, registered before the run:
//   * 15 rows from `hud_edit status`, ids in table order ending net, results,
//     crosshair
//   * the editor panel fits on screen with the seq pane open
//   * shots 4-6 differ from each other (three different crosshairs)
//
// FALSIFIED IF: the status dump lists 11, or the panel runs off the bottom, or
// the three crosshair shots are identical (the pics did not load and the engine
// crosshair is what is in all three).
//
// screenshot CAPTURES ONE FRAME BEHIND, so every shot below is taken twice and
// the SECOND of each pair is the one to read.
// ===========================================================================
log_enable 1
log_dir logs
log_name b65a_hud
developer 1

// Its own prefix.  Another session shares this gamedir and screenshots/ already
// holds 2300 files; a run whose output cannot be told from everyone else's is a
// run whose output you cannot cite.  scr_sshot_mapname is left on, so these come
// out as b65a_surf_kitsune_NNN.png.
scr_sshot_prefix "screenshots/b65a_"

hud_scale 2
cl_maxfps 250
con_notifylines 0

// HARNESS TRAP 1, recorded in b63a_logic.cfg and hit again by the first cut of
// this file: a +exec'd config runs while the engine is still initialising, and a
// `map` issued then is SILENTLY DROPPED -- no error, no map, and waitmap then
// sits out its whole timeout looking like a hang.  The tell in the log is that
// there is no "SpawnServer:" line at all and every CSQC command afterwards
// reports "Unknown command", because the client VM never loaded.
waitms 5000

map surf_kitsune
waitmap 45

// The map is loaded; the HUD is not necessarily drawing yet.  CSQC_Init and the
// first CSQC_UpdateView are a frame or two behind SpawnServer, and a screenshot
// taken between them is a picture of a world with no HUD on it -- which is also
// exactly what this run is trying to rule out.
waitms 4000

echo ==== 1. the element table ====
hud_edit status

echo ==== 2. the HUD, no editor ====
hud_crosshair 0
screenshot
waitms 600
screenshot
waitms 600

echo ==== 3. the editor, collapsed: 15 rows ====
hud_edit on
waitms 400
screenshot
waitms 600
screenshot
waitms 600

echo ==== 4. the segments pane -- ten options, the tallest ====
hud_edit seq
waitms 400
screenshot
waitms 600
screenshot
waitms 600

echo ==== 5. the crosshair pane -- the one element with no position ====
hud_edit crosshair
waitms 400
screenshot
waitms 600
screenshot
waitms 600

echo ==== 6. the speed pane -- energy's three options live here ====
hud_edit speed
waitms 400
screenshot
waitms 600
screenshot
waitms 600

hud_edit off
waitms 400

echo ==== 7. the three crosshairs, and the engine's ====
hud_crosshair 1
waitms 400
screenshot
waitms 600
screenshot
waitms 600

hud_crosshair 2
waitms 400
screenshot
waitms 600
screenshot
waitms 600

hud_crosshair 3
waitms 400
screenshot
waitms 600
screenshot
waitms 600

echo ==== 8. sizes: the two the ask named larger ====
hud_timer_size 64
hud_energy_size 48
hud_seq_size 20
waitms 400
screenshot
waitms 600
screenshot
waitms 600

echo ==== 9. and back to build 64's look ====
hud_timer_size 0
hud_energy_size 0
hud_seq_size 0
hud_crosshair 0
waitms 400
screenshot
waitms 600
screenshot
waitms 600

echo ==== status again, to catch anything the run changed ====
hud_edit status

echo ==== END ====
waitms 800
log_enable 0
waitms 500
quit
