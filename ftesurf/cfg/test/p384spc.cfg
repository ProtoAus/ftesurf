// PATCH 384 -- SPACE pairs its release like the mouse buttons (CLB_SPC), and the
// ghost's flight/stand-in are callable from elsewhere (Ghost_Fly, Ghost_DrawBodyAt).
// Listen server.  Run from C:\FTESurf:
//   ftesurf64.exe -WindowStyle Minimized +exec cfg/test/p384spc.cfg
//
// ARM S (the stuck key): a chat draft is open (chat_say) and SPACE is released without
//   the chain having taken its press -- the key was held when the draft opened.
//   `vote key <scan> <0|1>` runs the whole CSQC_InputEvent chain and prints `took`;
//   `took 0` is what makes keys.c run the stored -jump (keys.c:3860-3861, 3971-3976).
//   (A synthetic IN_KeyEvent does not reach the bind path in a minimized headless
//   client -- tried first; z never moved -- so the decision is probed directly.)
// PREDICTED (new csprogs): S1 unpaired up `took 0`; S2 paired down/up `took 1`, `took 1`.
// CONTROL (the pre-384 csprogs, same cfg): S1 `took 1` -- the draft eats the release and
//   +jump stays held (the build-56 class); S2 unchanged.
// ARM G (smoke, no behaviour change): `ghost`, +forward 1 s, `ghost status` twice --
//   the camera moves by roughly ghost speed (pm_noclipspeed x sv_maxspeed) x 1 s, in
//   both builds alike.
// FALSIFIED IF S1 is not `took 0` on the new build or not `took 1` on the control,
// or S2 changes between the builds.
//
// RESULT (2026-09-19, listen server, bhop_eazy): ALL HELD.
//   control (pre-384 csprogs): S1 took 1, S2 took 1 / took 1.
//   new (worktree HEAD+384):    S1 took 0, S2 took 1 / took 1.
//   G: the camera flew 1047 u (control) and 1041 u (new) in 1 s at ghost speed 1040.
//   Re-run under Patch 385 (its cl_btn_down repeat gate), 2026-09-20: S1 took 0,
//   S2 took 1 / took 1, G 1049 u -- unchanged; again after review 2's fixes
//   (S1 0, S2 1/1, G 1042 u) and on the final 385 build (S1 0, S2 1/1, G 1050 u).
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p384spc
cl_idlefps 0
cl_maxfps 100
set run_resume 0
set pm_autobunny 1
bind space +jump
sv_port 27644
wait 300
map bhop_eazy
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 2000
echo "=== P384 G ghost"
ghost
waitms 1000
ghost status
+forward
waitms 1000
-forward
ghost status
ghost
waitms 500
echo "=== P384 S draft open"
chat_say p384
waitms 300
echo "=== P384 S1 unpaired SPACE up (its press went to the game)"
vote key 32 0
echo "=== P384 S2 paired: down then up inside the draft"
vote key 32 1
vote key 32 0
echo "=== P384 done"
quit
