// Build 39: do the board PANEL and the board ROW print the same number now?
//
// THE REPORT: "one will say I lost -169 e and the other will read -179 e and I
// don't know which is true?"
//
//   board panel, under the strafe bar   "board -179 e   contact 1420"
//        <- board_losse = (vin.n)^2/2g, a closed form for an orthogonal
//           projection.  This one was always right.
//   segment column, the live board row  "-169 e  board"
//        <- was Strafe_Energy(org,vel) - Strafe_Energy(org,vin), and vin is
//           latched INSIDE TryPlayerMove while vel is the end-of-tick value, so
//           the subtraction straddled a gravity half-step that nothing paid for.
//
// Both now come out of Board_StepE on the same latched pair, so they cannot
// disagree.  hud_board_exact 0 puts the disagreement back, which is the only way
// to see the ten units.
//
// This has to actually BOARD a ramp, which a cfg cannot aim.  Run forward with
// jump held off the start block and take a lot of shots; if the board panel
// never populates, that is the answer to "can this be scripted" and the
// comparison goes to a human.  Set hud_board_exact AFTER the map -- see the
// header of p241jump0.cfg for why a pre-map cvar set is silently a no-op here.

log_enable 1
log_name p241board
developer 1
log_developer 1
cfg_save_auto 0
cl_idlefps 0
sv_cheats 1
cl_maxfps 100
fs_missingwarn 0

hud_debug 1
hud_seq_units 1
hud_seq_board 1
hud_seq_live 1
hud_board 1

wait 200
map surf_aesthetic
waitmap 900
wait 200

// GROUND FIRST, then jump.  The first attempt held +jump from frame one, which
// with pm_autobunny means you never touch the ground long enough to
// ground-accelerate -- so the whole run sat on the start block at 30 u/s,
// which is the air cap, and the strafe bar said "too slow to grade" for all
// thirteen shots.  Run flat to build speed, then leave.
echo ^5=== p241board: running forward off the start ===
+forward
wait 250
screenshot
+jump
wait 60
screenshot
wait 40
screenshot
wait 40
screenshot
wait 40
screenshot
wait 40
screenshot
wait 40
screenshot
wait 40
screenshot
wait 40
screenshot
wait 40
screenshot
wait 40
screenshot
wait 40
screenshot
wait 40
screenshot
-forward
-jump
wait 60
screenshot

echo ^5=== p241board done ===
wait 30
quit
