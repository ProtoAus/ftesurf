cfg_save_auto 0
// THE ONLY QUESTION THAT MATTERS AFTER A LIVE DEPLOY: does a client that joins
// a live lobby get a working game?
//
// Three cuts of b64live.cfg came back with no board drawn, and I chased the
// menu twice and was wrong twice.  Measured since: notmenu reads 1 on a live
// lobby, so the 2D pass is NOT being gated -- which means the board's absence
// is about the scripted menu state in that arm, not about the deploy.
//
// This strips the question to its bones: join, dismiss nothing, open nothing,
// take a picture of what a player would actually see.  No `scores` command at
// all, because the scoreboard is the thing whose harness is in doubt.
//
// PREDICTIONS, registered before the run:
//   1  the HUD draws -- run timer, speed readout, key display
//   2  no menu is on screen
//   3  the log says `FTESurf CSQC loaded`
//
// FALSIFIED IF: the screen shows the world with no HUD (then the deployed
// csprogs.dat and the live lobbies genuinely do not agree and this must be
// rolled back -- qwprogs.dat.b64rollback-* and csprogs.dat.b64rollback-* are
// on the Pi beside the live files).
log_enable 1
log_dir logs
log_name b64hud
waitms 5000

// Before the connect: initialises menu.dat so the ENGINE's fallback menu is
// never the thing on screen.  Measured to leave notmenu at 1 once in game.
menu_restart
waitms 1500

connect play.proto.bar:27540
waitms 20000

echo ==== HUD: what a joining player sees ====
screenshot
waitms 1500
screenshot
waitms 1500

echo ==== END ====
disconnect
waitms 1000
log_enable 0
waitms 500
quit
