// p486injrn.cfg -- PATCH 486: the journal's identity counters reach the server.
//
// WHAT THIS ARM EXISTS TO PROVE.  Engine Patch 484 computes the .hid's own angle
// identity inside IN_Journal_View and publishes five read-only cvars.  Patch 486
// is the CONSUMER it deliberately did not ship: cl_replay.qc reads them and sends
// them over sendevent("injrn", ...), sv_timer.qc stores them on the player entity
// and `cmd timer` prints them.  Nothing gates on them and nothing may yet -- see
// the IJ_* block in sh_defs.qc and BACKLOG item C.
//
// WHY IT IS THE CONSUMER AND NOT A GATE.  The fleet collects zero journals
// (measured 2026-10-05: 19 rcpt, 14 view, 4 rec, 0 hid), so every input check
// built over the .hid ran only when an operator typed a path at a file that is
// not there.  This is the verdict travelling instead of the file.  But over the
// 113 local journals the honest corpus carries 11 violations on 3 files, all of
// them yaw-and-pitch frames on a large instantaneous jump -- the shape a server
// angle set has.  A threshold from 11 events on 3 files is a guess, and this
// tree's rule is that a check which faults an honest run is worse than no check.
//
// PRE-REGISTERED PREDICTIONS.  Each names an observable this change can move.
//
//   ARM 1 -- BEFORE any journal, after the map and ui_close:
//          1a `cmd timer` prints a `jrnident:` line at all        (the consumer exists)
//          1b said 1                                              (the event arrived)
//          1c have 16                                             (all five cvars exist on a 484 engine)
//          1d frames -1  ghosts -1  viol -1  bad -1  skip -1      (never measured, NOT zero)
//          1d IS THE IMPORTANT ONE.  Patch 484's arm A failed on its first run
//          because the counters published 0 with no journal open -- an unmeasured
//          state wearing a clean measurement's clothes.  If this reads 0 the
//          consumer has re-introduced exactly that defect one layer up.
//
//   ARM 2 -- ONE journal, KEYBOARD ONLY, then `cmd timer` again:
//          2a frames is NOT -1                                    (the subject acted)
//          2b frames != the ARM 1 reading                         (it CHANGED, so it is carried)
//          2c viol 0 and ghosts 0                                 (honest input is not accused)
//          2b IS THE FALSIFIER FOR A DEAD CHANNEL.  A sendevent whose name the
//          server does not have answers silence, and silence reads as "never
//          spoke" -- said 0, every counter unchanged.  ARM 1 already prints -1,
//          so ARM 2 must print something ELSE or nothing was carried at all.
//
//          Keyboard and not mouse, deliberately: `spectate look` pushes an event
//          through the input chain but does not aim, and a minimized harness
//          receives no real WM_INPUT.  +left/+right aim at exactly cl_yawspeed,
//          and the identity counts a RECORDED keyboard turn as a cause -- which
//          is what makes frames governable here at all.
//
//   ARM 3 -- THE CHANNEL A CONSOLE CANNOT WRITE.  This is the build-78/79
//          argument and it gets its own arm rather than being assumed:
//          3a `setinfo injrn "0 999999 0 0 0 0"` is accepted as a userinfo key
//             (setinfo always is) AND `cmd timer` still prints the EVENT's numbers
//          3b no `jrnident` column moves as a result of the typed line
//          There is deliberately NO diagnostic setinfo copy of this report -- see
//          Rec_JrnIdentReport -- so 3a's key has no reader at all.  The arm still
//          runs, because "the console can write a key nobody reads" and "the
//          console can write the fact" are different statements and only the
//          second one would be a defect.
//
//   ARM 4 -- CONTROL, MUST FAIL.  A pre-486 server has no CSEv_injrn_ffffff, so
//          the same run against it prints said 0 and every counter -1 at BOTH
//          arms, i.e. ARM 2's frames stays -1 and 2b cannot hold.  This is the
//          control that keeps the arm from passing on a harness that merely got
//          looser.  Graded off-log by tools/p486injrn.py, which FAILS if 2b does
//          not hold, so running this cfg against an old build is the control.
//
// NOT VERIFIED BY THIS ARM, and it is the same gap Patch 484 has: nothing here
// can make `viol` NONZERO.  A minimized harness cannot fire a WM_INPUT, so the
// subject -- injected or rewritten motion -- cannot be driven from inside a cfg.
// This arm proves the counters are CARRIED and that an unmeasured state still
// reads as unmeasured.  It does not prove the server can see a violation.
//
// A CONNECTION IS NOT OPTIONAL AND THE FIRST TWO RUNS OF THIS FILE HAD NONE.
// Both printed `Can't "cmd", not connected` at all four arms and measured nothing
// on the server side, which reads exactly like "the consumer does not work".
// Run 1 used `map` alone: that starts NO server, so `cmd` has no stringcmd to
// send and sendevent has no netchan to put clcfte_qcrequest on.  Run 2 added
// `sv_port` + `map` + `connect 127.0.0.1` and got `Connecting to ...` then
// `Connection lost or aborted` THREE TIMES, all before the map had loaded -- a
// bare `map` in this mod does not stand up a joinable server.
// So this is the tree's documented two-process pattern: p486sv.cfg on
// fteqwsv64.exe at port 27601, and this file connects to it.  Both processes
// share the C:\FTESurf basedir, so the csprogs the server serves and the one
// tools/seed_csprogs.py cached under downloads/csprogsvers/ are the same file.
//
// THE CSQC DOWNLOAD IS THE OTHER SILENT KILLER (b65rankcl.cfg's lesson, restated
// because it applies here too): a networked client fetches the SERVER's csprogs
// under a versioned name, so a byte-identical local copy is not used, and at the
// default `rate` that is 85 s of window in which every QC command reads
// `Unknown command`.  `python tools/seed_csprogs.py` after every csprogs rebuild,
// plus the rate cvars below.
//
// RESULT, written after the run -- including the predictions that were wrong.
// Run 2026-10-05, ftesurf64.exe at Patch 484 (in_jrn484_* present) against
// fteqwsv64.exe of Sep 28 (PRE-484, and deliberately so: the consumer is QC, in
// the qwprogs.dat and csprogs.dat both processes share, so a server binary that
// predates the engine half still exercises all of it).  tools/p486injrn.py:
// 37 checks, 0 failed.
//
//   ARM 1  said 1  have 16  frames -1  ghosts -1  viol -1  bad -1  skip -1
//          ALL FOUR PREDICTIONS HELD.  1d is the one that matters: -1 and not 0,
//          so the consumer did NOT re-introduce one layer up the defect Patch
//          484's own arm A caught -- an unmeasured state wearing a clean
//          measurement's clothes.
//   ARM 2  said 1  have 16  frames 181  ghosts 0  viol 0  bad 0  skip 0
//          ALL HELD, and 181 EQUALS the engine's own in_jrn484_frames printed
//          three lines later in the same arm.  Two ends of one channel,
//          independently printed, agreeing exactly -- not approximately.
//          2b is the falsifier for a dead channel and it holds: ARM 1 read -1,
//          ARM 2 reads 181, so something was carried.
//   ARM 3  THE STRONGEST RESULT AND IT HELD.  The log shows
//          `SETINFO Proto: injrn=0 999999 0 0 0 0` -- the console really did
//          write the hostile key -- and the server's very next line reads
//          `frames 181`.  Not 999999.  The event's number, not the typed one.
//   ARM 4  said 1  have 16  frames 0  ghosts 0  viol 0  bad 0  skip 0
//          HELD, and 0 against ARM 2's 181 proves the reset propagates: a cache
//          that never re-sent would have left the server holding 181.
//
// THE GRADER IS ITSELF GRADED.  tools/p486mut.py mutates the log six ways -- each
// a defect this patch could really have -- and all six are caught with a named
// failure, with the unmutated log as a control that must pass: the console
// forging the fact, ARM 1 reading 0 instead of -1, a dead channel, a reset that
// never propagates, the two ends drifting by one, and an honest run accused.
// THE FIRST CUT OF THAT SCRIPT HARD-CODED `frames 183` AND THE RUN IT WAS POINTED
// AT HAD PRODUCED 181, so three mutants mutated NOTHING, the grader passed them,
// and the script reported "3 not caught" while looking like a grader bug.  A
// mutant that does not mutate is the same false green as a grader that does not
// grade and it is silent in the same way; it now reads the numbers out of the log.
//
// PREDICTIONS THAT FAILED, i.e. THE THREE RUNS THIS TOOK.  Registered before each
// run and wrong each time, all three about the harness and none about the patch:
//   1. `map surf_rookie` alone printed `Can't "cmd", not connected` at all four
//      arms.  A bare `map` starts NO server, so sendevent had no netchan.  The
//      whole arm measured nothing and read exactly like "the consumer does not
//      work".
//   2. Adding `sv_port` + `map` + `connect 127.0.0.1` gave `Connecting to ...`
//      then `Connection lost or aborted` THREE TIMES, all timestamped BEFORE the
//      map had loaded -- in this mod a bare `map` does not stand up a joinable
//      server.  Fixed by the two-process pattern: p486sv.cfg on fteqwsv64.exe.
//   3. The mutant script's hard-coded 183, above.
//
// STILL NOT VERIFIED, unchanged from the header: nothing here can make `viol`
// NONZERO.  A minimized harness cannot fire a WM_INPUT, so injected or rewritten
// motion cannot be driven from inside a cfg.  This arm proves the counters are
// CARRIED, honest about what they have not measured, and unforgeable from a
// console.  It does NOT prove a server can see a violation; coverage of the rule
// itself is tools/p484ident.py Part 2, over 113 real journals.
//
// ALSO OBSERVED, NOT EXPLAINED, AND NOT THIS PATCH'S: the journal this arm wrote
// has 182 `v` records and ZERO `f` records, and its end line reads
// `in_journal_end: loadworker_3, 0 events / 0 frames / 0 dropped / 0 hidden, 11k`
// -- "0 frames" against an identity counter that governed 181 of them.  A census
// of all 123 journals in the tree says this is COMMON AND OLD, not a regression:
// 61 have f=0 and 62 have f>0, and the f=0 half includes p305_*, p385_* and THREE
// real gameplay recordings (0000007_pb, 0000008_pb, 0000009_pb).  So `f` is not
// written on every run and nothing here changed that.  Two separate things are
// worth a look and neither is mine:
//   * what makes a run write `f` records at all (the split is ~50/50 and includes
//     honest PBs on the empty side, so `f`-dependent checks silently cover half
//     the corpus);
//   * the journal naming itself `loadworker_3` on EVERY end line of EVERY run,
//     which is the engine `va()` rotating-buffer trap AGENTS.md already records
//     (FS_Remove restarts the loader threads, whose names come from va(), and a
//     download was once saved as "loadworker_3").  Cosmetic, but it means no
//     journal's own end line names the file it wrote.
// BACKLOG carries the first.
//
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
sv_cheats 1
rate  2000000
drate 5000000
log_enable 1
log_dir logs
log_name p486injrn
developer 1
log_developer 1

// Wait for `spawn`, not a fixed guess: a stringcmd sent before the server has
// spawned the client vanishes from BOTH logs with no error anywhere, which is the
// same shape as "the command did nothing".
connect 127.0.0.1:27601
waitms 12000

// The engine's builtin menu is open from boot and until it closes notmenu=0 skips
// the whole HUD stack -- and with it CSQC_UpdateView, which is where the per-frame
// driver that sends all three reports lives.  No ui_close, no event, and the arm
// would measure silence and call it a bug in the consumer.
menu_restart
ui_close
waitms 800

echo ================================ P486 ARM 1 -- no journal open yet.  Expect said 1, have 16, every counter -1.
cmd timer
waitms 600
echo ---------------- 1: the engine's own cvars, to compare against what the server was told.
in_jrn484_frames
in_jrn484_ghosts
in_jrn484_violations
in_jrn484_badframes
in_jrn484_skipped

echo ================================ P486 ARM 2 -- one journal, keyboard only.  Expect frames to CHANGE from -1.
in_journal_begin
waitms 500
+left
waitms 900
-left
waitms 300
+right
waitms 900
-right
waitms 300
+forward
waitms 700
-forward
waitms 300
+lookup
waitms 600
-lookup
waitms 500
in_journal_end p486_B.hid
waitms 1500
echo ---------------- 2: the server's copy, which must NOT read -1 any more.
cmd timer
waitms 600
echo ---------------- 2: and the engine's own, which the server's must agree with.
in_jrn484_frames
in_jrn484_ghosts
in_jrn484_violations
in_jrn484_badframes
in_jrn484_skipped

echo ================================ P486 ARM 3 -- the console writes the key nobody reads.  Expect no column to move.
setinfo injrn "0 999999 0 0 0 0"
waitms 500
cmd timer
waitms 600

echo ================================ P486 ARM 4 -- a fresh journal MUST reset, and the server MUST see the reset.
in_journal_begin
waitms 400
in_journal_end p486_D.hid
waitms 1500
cmd timer
waitms 600
echo ---------------- 4: frames here must be far below ARM 2's.  A cumulative carry would read higher.

echo ================================ END OF RUN ===
quit
