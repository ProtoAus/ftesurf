// Regression: cvar values are literal data, never completion-row markup.
log_enable 1
log_name b36_markup
cfg_save_auto 0
developer 0
vid_fullscreen 0

wait 200
map surf_null
waitmap 240
wait 60

con_window 1
con_window_rect "240 180 800 480"
con_displaypossibilities 2
con_completiondown 1
con_completionrows 8

cl_c2sdupe "^1FAKE ^[/quit^]"
toggleconsole
wait 20
con_settext cl_c2s
waitms 500
screenshot b36_markup_literal
waitms 250

cl_c2sdupe 0
quit
