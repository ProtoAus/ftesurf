// Shared SUI prototype. Disposable dedicated install/config; never owner data.
// Predictions: classic has no round work; modern does. Long tooltip delays,
// wraps/caches, fits edges and clears on hold/focus loss. Same real selection
// acts in both styles; dirty close saves only here, releases cursor and stops
// SUI frames. Driver grades pixels and a fresh missing-asset control separately.
// Injected handler-route tests are not OS-device or ImGui performance acceptance.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name ui_modern
con_notifytime 0
con_notifylines 0
developer 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
vid_winmaximize 0
vid_width 1280
vid_height 720
vid_conautoscale 1
vid_vsync 0
r_fullbright 1
set run_resume 0
set lobby_dir ""
name ui-modern-test
waitms 5000
exec test/ui_modern_connect.cfg
waitms 6000
menu_restart
waitms 500
ui_close
set hud_scale 1
set hud_edit_panel_x 0.05
set hud_edit_panel_y 0.05
set hud_font_outline 0
set hud_mapinfo_timeleft 0
set ui_tooltip_delay 0.35
set ui_style 0
hud_edit on
waitms 700
hud_edit ui hover he_done
waitms 200
echo === sui A ===
hud_edit ui
screenshot sui_A
waitms 400
screenshot sui_A_repeat
hud_edit ui hover he_sel_seq
hud_edit ui down mouse1
waitms 100
hud_edit ui hover he_sel_seq
hud_edit ui up mouse1
waitms 200
hud_edit ui
hud_edit off
set ui_style 1
hud_edit on
waitms 600
hud_edit ui hover he_done
waitms 200
echo === sui B ===
hud_edit ui
screenshot sui_B
waitms 400
screenshot sui_B_repeat
hud_edit ui hover he_fontfx
waitms 80
echo === sui delayed ===
hud_edit ui
waitms 650
echo === sui visible ===
hud_edit ui
screenshot sui_tip
waitms 500
echo === sui cached ===
hud_edit ui
hud_edit ui down mouse1
waitms 200
echo === sui held ===
hud_edit ui
hud_edit ui hover he_fontfx
hud_edit ui up mouse1
waitms 100
hud_edit ui hover he_sel_seq
hud_edit ui down mouse1
waitms 100
hud_edit ui hover he_sel_seq
hud_edit ui up mouse1
waitms 200
echo === sui action ===
hud_edit ui
hud_edit ui hover he_fontfx
waitms 650
hud_edit ui focus 0
waitms 500
echo === sui focuslost ===
hud_edit ui
hud_edit ui focus 1
hud_edit ui hover he_fontfx
waitms 650
echo === sui focusback ===
hud_edit ui
hud_edit ui focus -1 0
waitms 500
echo === sui keyboardlost ===
hud_edit ui
hud_edit ui focus -1 1
hud_edit ui hover he_fontfx
waitms 650
echo === sui keyboardback ===
hud_edit ui
// Place panel near the lower-right edge; no layout write via the editor yet.
set hud_edit_panel_x 0.99
set hud_edit_panel_y 0.99
waitms 300
hud_edit ui hover he_fontfx
waitms 650
echo === sui edge ===
hud_edit ui
screenshot sui_edge
hud_edit status
hud_edit off
waitms 200
echo === sui closed1 ===
hud_edit ui
waitms 600
echo === sui closed2 ===
hud_edit ui
echo === sui done ===
quit
