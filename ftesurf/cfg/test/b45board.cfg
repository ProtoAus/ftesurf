// B45BOARD -- the fourth tag as the leaderboard and the console see it.
//
// THE FAILURE THIS FILE EXISTS FOR IS SILENCE.  cl_scores.qc's directory scan
// parses <ticks>_<tag>.rec and SKIPS any file whose tag word it cannot map -- it
// does not mislabel the row, it drops it.  So a build that writes cheat.rec and
// has not taught the scan about `cheat` shows a leaderboard with the run simply
// ABSENT: no gap, no count, nothing to notice.  That is the opposite of the
// report's own words, "written, labelled, never ranked", and it is why build 45
// moved the word list into FS_TagFromName beside FS_TagName rather than adding a
// fourth `else if` to a list that already existed twice.
//
// bhop_eazy/main holds exactly three files when this runs, and their headers say
// what each row must be:
//
//   0005354_pb.rec   flags 4    havepb, no practice          -> clean
//   last.rec         flags 5    practice + havepb, no reason -> practice
//   cheat.rec        flags 397  practice|havepb|shadow|segment|cheat -> cheated
//
// So: all 3, clean 1, cheated 1, stitched 1 -- and 1+1+1 = 3 is the invariant.
// The `cheated` row is the one that did not exist before this build; if the scan
// has not learned the word, `all` reads 2 and every other count still adds up.
// THE TOTAL IS THE ASSERTION, not the individual filters.
//
// `flags 397` is also the precedence case on disk: that run loaded a save AND
// noclipped, so it carries TF_SHADOW, and under build 44's tag chain it would
// have been filed as an ARCHIVED `_shadow.rec` -- a stamped name accumulating one
// junk file per lap inside the list this config reads.
//
// AND THE CONSOLE WORD.  `replay <tag>` was the second copy of the name->RT_* map
// and now dispatches on FS_TagArchived: an archived tag searches the leg for its
// fastest file, an unstamped one has exactly one path.  All three are exercised
// because the refactor could break `last` and `pb` while `cheat` worked.

log_enable 1
log_dir "logs"
log_name "b45board"
developer 1
log_developer 1
cfg_save_auto 0
vid_fullscreen 0
fs_missingwarn 0
sv_cheats 0

wait 200
map bhop_eazy
waitmap 1800
waitms 2500

echo ^5=== b45board: all -- expect 3 rows, one of them `cheated` ===
scores open
waitms 600
scores filter all
waitms 300
scores status
waitms 600

echo ^5=== b45board: clean -- expect 1 ===
scores filter clean
waitms 300
scores status
waitms 600

echo ^5=== b45board: stitched -- expect 1 (last.rec, the bare-practice residual) ===
scores filter stitched
waitms 300
scores status
waitms 600

echo ^5=== b45board: cheated -- expect 1, and it is cheat.rec ===
scores filter cheated
waitms 300
scores status
waitms 600

scores close
waitms 400

// ---------------------------------------------------------------------------
// THE THREE CONSOLE WORDS, through one dispatch.
//
// `pb` takes the archived branch (search the leg, first name sorts fastest);
// `last` and `cheat` take the unstamped branch (one known path).  `replay status`
// prints the file it opened, so the log says which branch answered.
// ---------------------------------------------------------------------------
echo ^5=== b45board: replay cheat -- the new word ===
replay cheat
waitms 900
replay status
waitms 400
replay stop
waitms 400

echo ^5=== b45board: replay last -- the regression on the unstamped branch ===
replay last
waitms 900
replay status
waitms 400
replay stop
waitms 400

echo ^5=== b45board: replay pb -- the regression on the archived branch ===
replay pb
waitms 900
replay status
waitms 400
replay stop
waitms 400

echo ^5=== b45board: pm_selftest ===
pm_selftest
waitms 1200

echo ^5=== b45board: zone_selftest ===
zone_selftest
waitms 1200

echo ^5=== b45board: done ===
quit
