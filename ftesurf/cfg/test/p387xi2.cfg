cfg_save_auto 0
// P387XI2 -- the X11 grant (engine Patch 387): XInput2 publishes in_rawmice = R,
// the core-pointer fallback publishes 0, and only a vid_restart moves it.
// Linux client, listen server on bhop_eazy, X11 renderer (boot-time DPrintfs need
// the +sets on the command line):
//   env -u WAYLAND_DISPLAY DISPLAY=:0 ./fteqw64 -nosound +set vid_renderer gl
//     +set developer 1 +set log_enable 1 +set log_dir logs +set log_name p387xi2
//     +exec cfg/test/p387xi2.cfg
// ORACLE R, taken just before launch: `xinput list --long`, enabled slave pointers
// whose name does not end " XTEST pointer" and whose valuators 0/1 are not
// "Mode: absolute" (WSLg: xwayland-relative-pointer [+ -pointer-gestures];
// Xvfb: 1).  GATE: the log shows "Using XInput2" at boot, else the run is void.
// `vid_restart; waitms 100; waitms N`: the restart runs after the cbuf yields,
// so the first waitms expires inside it (20 s on WSL over drvfs) and only the
// second is post-restart time -- one waitms read `cmd timer` before CSQC reported.
// `cmd timer` prints `inprof: ev "<have> <raw> <filt> <acc> <bad> <grant>"`;
// have is 14 on Linux (no in_rawinput cvar).  <bad> is the edge counter and is
// not what these arms test.
//
// PRE-REGISTERED
//   A  in_restart: log `XInput2: <mouse|tablet|xtest> "<name>"` per slave pointer,
//      mouse lines = the oracle, one `xtest` line, "X11 input grant: R raw
//      mice"; `in_rawmice` R; said 2, ev "14 0 0 0 0 R", would 0.
//      data/p387_A.hid: rawinput -1, rawkbd -1, rawmice R, rawkbds 0, nolegacy -1,
//      nolegacylive -1; dev keyboard - "x11", R mouse, 1 xtest unset; trailer
//      ends `0 -1 -1`; hidcheck: input_backend "X11 XInput2", no rawinput or
//      rawmice note, no fault but "no frame markers" (a scripted window drains
//      no input; p306_A.hid faults the same way on Windows).
//   B  x11_allow_xi2 0; vid_restart: "Using X11 mouse", in_rawmice 0, ev grant 0,
//      would 1.  data/p387_B.hid: dev keyboard/mouse "x11"; hidcheck as A plus
//      the "rawmice 0 on a non-Windows backend" note.
//   B' x11_allow_xi2 1, NO restart: in_rawmice still 0, would 1.
//   C  vid_restart: "Using XInput2", in_rawmice R, ev grant R, would 0.
// FALSIFIED IF A reads would 1 or R != oracle; B or B' reads would 0; C reads
// would 1.
// CONTROL (must fail): the same cfg on a pre-387 binary reads in_rawmice -1,
// ev grant -1 and would 0 in B -- the rank bypass this patch closes.  If it
// does not, these arms do not measure the patch.

exec cfg/test/_quiet.cfg

developer 1
log_developer 1
log_enable 1
log_dir logs
log_name p387xi2
cl_maxfps 100
cl_idlefps 0
sv_cheats 0
m_filter 0
m_accel 0
cl_nocsqc 0

wait 200
map bhop_eazy
waitmap 600
waitms 5000

echo ^5=== P387 ARM A: XI2.  Expect in_rawmice R, ev grant R, would 0.
in_restart
waitms 2500
in_rawmice
cmd timer
in_journal_begin
waitms 2000
in_journal_end data/p387_A.hid
waitms 1500

echo ^5=== P387 ARM B: x11_allow_xi2 0; vid_restart.  Expect 0, would 1.
set x11_allow_xi2 0
vid_restart
waitms 100
waitms 4000
in_rawmice
cmd timer
in_journal_begin
waitms 2000
in_journal_end data/p387_B.hid
waitms 1500

echo ^5=== P387 ARM B': x11_allow_xi2 1, no restart.  Expect still 0, would 1.
set x11_allow_xi2 1
waitms 2500
in_rawmice
cmd timer
waitms 1500

echo ^5=== P387 ARM C: vid_restart.  Expect R, would 0.
vid_restart
waitms 100
waitms 4000
in_rawmice
cmd timer
waitms 1500

echo ^5=== END OF RUN ===
waitms 1000
quit

