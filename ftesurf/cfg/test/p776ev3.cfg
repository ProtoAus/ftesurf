// FTESurf Patch 776, review round 3 -- a pinned teleport keeps its own reply when the
// server rewrote its target's case.  surf_kitsune's *1 (a fail floor, x -15936..-14784,
// y -15360..-11504, z -128..-96) has "target" "Red" in the lump; SV_RepairTargetCase makes
// it "red", the destination's spelling, so the reply's second line says target 'red'.
// From above it, looking down, mouse1 pins it and mouse2 copies it.
//   Control (exact-case compare): "copied [enthere] class=trigger_teleport model=*1 ...
//   and its N keys" with NO server's answer.  Subject: "... and the server's answer".
// Run like p776ev.cfg (tools/runlines_smoke.py --mount, the build's csprogs).
cfg_save_auto 0
exec cfg/test/_quiet.cfg
log_enable 1
log_dir "logs"
log_name "runlines_smoke"   // tools/runlines_smoke.py reads this log
scr_sshot_type png
cl_yieldcpu 0
cl_idlefps 0
cl_maxfps 100
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0

waitms 2500
map surf_kitsune
waitmap 240
waitms 8000
sv_cheats 1
noclip
waitms 500
ent_view
setpos -15360 -13432 0 89 0 0
waitms 2500

echo "@@@ P776C 1. what is under the crosshair"
ent_here
waitms 1500
echo "@@@ P776C 2. pin it and copy it"
vote key 512 1
vote key 512 0
waitms 2000
vote key 513 1
vote key 513 0
waitms 800
screenshot p776ev3_pin
waitms 800

echo "@@@ P776C DONE"
echo RUNLINES COMPLETE
waitms 1000
quit
