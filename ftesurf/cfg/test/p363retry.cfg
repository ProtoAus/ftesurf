// P363RETRY -- the counted clock across a counter restart (listen server).
// `cmd rec_retry` writes the run to the retry slot and map_restarts; the mover
// counter (run_movetick) starts again at 0, and SV_TimerResume used to rebase
// run_t_starttick to `movetick - ticks` -- negative -- so SV_TickCounted
// returned -1 and the run silently went back to the rounded sampled clock.
//
// PREDICTIONS (pre-registered):
//   BEFORE (the 361 progs): after the retry `tick: counted -1 ...` or a line
//     with `ranks sampled` -- the counted clock is lost.
//   AFTER (Patch 363): `ranks counted`, counted within 2 of sampled, and still
//     so 2 s later (the carry keeps counting).
//   CONTROL, no retry: before the retry the same line reads `ranks counted`.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p363retry
developer 0
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
sv_port 27631
waitms 5000
map bhop_eazy
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 500
set rec_retry 1
cmd zone_goto 0 16.18 0
waitms 1500
+forward
waitms 2000
-forward
waitms 500
echo ^5==== control: before the retry ====
cmd timer
waitms 800
echo ^5==== retry ====
cmd rec_retry
waitms 6000
echo ^5==== after the retry ====
cmd timer
waitms 2000
echo ^5==== after the retry, 2 s on ====
cmd timer
waitms 800
echo ^5==== done ====
quit

// RESULT (2026-09-18):
//   BEFORE (361 progs): after the retry "tick: not latched ... ranks sampled",
//     2 s on the same -- as predicted.
//   AFTER, first cut (carry only): "counted 712 ... ranks sampled".  The resume
//     runs from PutClientInServer before the engine has written this edict's
//     mover fields: rate 0 (so run_t_clock went 0) and SV_ClockSec was still
//     `time`.  Fixed by latching on the first live packet (SV_TimerFreezeFrame),
//     rebasing the seconds' origin there too.
//   AFTER, second cut: "ranks counted" but gap -116 -- the REPORT's sampled side
//     (run_t_startwall, report only) was never rebased by any resume, so every
//     save-load and retry printed a meaningless gap.  Rebased with the rest.
//   FINAL: "counted 707 sampled 706 gap -1 ... ranks counted", 2 s on
//     907/906 gap -1 -- the control's shape.
