// P371ANNL -- chat announcements on a listen server (Patch 371).
// Run from C:\FTESurf with the fixture in place and surf_666's runs moved aside:
//   copy cfg/test/p360sf.zones.json -> ftesurf/maps/zones/local/surf_666.json
//   move ftesurf/data/runs/surf_666 and surf_666.pb aside (restore after)
//   ftesurf64.exe -WindowStyle Minimized +exec cfg/test/p371annl.cfg
// then grep "finish:" and "welcome to" in logs/p371annl.log.
// bhop_eazy ticks 0.01 s: 5000 = 0:50.000.  The key: map track leg ticks state
// rank of stored prevms tier (sh_defs.qc).
//
// PREDICTIONS (registered before the run), colour codes stripped:
//  F1 #3 of 17 stored 1   finish: 0:50.000  -0:03.540  NEW PB  #3 of 17  TOP 10
//  F2 #1 of 17 stored 1   finish: 0:50.000  -0:03.540  NEW PB  #1 of 17  WR
//  F3 5400 vs 5000, #1 stored 0
//                         finish: 0:54.000  +0:04.000  #1 of 17  PB STANDS
//  F4 tier 1, flags 512   finish: 0:50.000  -0:03.540  NEW PB  UNRANKED  no journal
//  F5 no key              finish: 0:50.000  -0:03.540  NEW PB
//  F6 flags 1 (practice)  finish: 0:50.000  -0:03.540  PRACTICE  not saved
//  F7 stage 3             finish: stage 3 0:13.890  -0:00.110  NEW PB
//  C  hud_banner_chat 0: `banner chat` writes no line (7 lines in all so far).
//  L  a real fixture walk on surf_666 (no board, server PB): exactly one more
//     finish: line, with FIRST TIME and a LOCAL placement; 0 "welcome to" and
//     0 "board:" chat lines (the host is neither welcomed nor told its own best;
//     the server log's copy of what the others heard reads "said> board: ...").
//
// RESULTS 2026-09-19 (run 2; run 1 identical but for the echo prefix): ALL HELD.
//  F1-F7 exactly as predicted; C wrote nothing.  L: one line, "finish: 0:04.500
//  FIRST TIME  #1 of 1  LOCAL", in the chatbox (shot p371annl_l).  Run 1 found the
//  server-log copy (dprint, log_developer) in the same log as the chat, which is
//  why it now reads "said> ...": the host's own join and best appear only so.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p371annl
developer 0
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
sv_port 27643
sv_cheats 0
set run_resume 0
vid_conautoscale 0
vid_conwidth 1280
vid_conheight 720
waitms 5000
map bhop_eazy
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 500
set hud_banner 1
set hud_banner_hold 2
set hud_banner_chat 1
set hud_results 0
echo ==== F1 ====
banner fake "bhop_eazy 0 0 5000 1 3 17 1 20000 0"
banner test 0 0 5000 5354 0
banner chat
echo ==== F2 ====
banner fake "bhop_eazy 0 0 5000 1 1 17 1 20000 0"
banner test 0 0 5000 5354 0
banner chat
echo ==== F3 ====
banner fake "bhop_eazy 0 0 5400 1 1 17 0 20000 0"
banner test 0 0 5400 5000 0
banner chat
echo ==== F4 ====
banner fake "bhop_eazy 0 0 5000 1 3 17 1 20000 1"
banner test 0 0 5000 5354 512
banner chat
echo ==== F5 ====
banner fake
banner test 0 0 5000 5354 0
banner chat
echo ==== F6 ====
banner test 0 0 5000 5354 1
banner chat
echo ==== F7 ====
banner test 0 3 1389 1400 0
banner chat
echo ==== C ====
set hud_banner_chat 0
banner chat
set hud_banner_chat 1
banner off
waitms 500
echo ==== L ====
map surf_666
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 500
set hud_banner_chat 1
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 6000
-forward
waitms 7000
echo ==== L done ====
screenshot p371annl_l
waitms 500
quit
