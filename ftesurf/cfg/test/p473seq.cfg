// P473SEQ -- Patch 473: a replay's Segments column is built at the recording's tick.
//    python tools/p473seq.py
//
// The driver stages data/p473seq.rec: the fixture's samples under a header
// re-ticked to 0.01 (synthetic -- it grades the arithmetic).  The replay opens it
// twice, once with the server at pm_ticrate 0.015 and once at 0.01, and dumps the
// column each time (`replay seq`: kind, sub, tick, duration, dE, ceiling, %).
//
// PRE-REGISTERED
//  S1 the two dumps are identical, row for row -- the column depends on the
//     file's tick and not on the server's.
//  S2 the column has air rows with a ceiling, so S1 is about something.
// CONTROL: this tree with Watch_BuildSeq's `board_ov_tick = rec_wt_tickrate`
//  removed, so Board_Tick falls back to the server's: S1 fails -- which is also
//  what shows the client saw the server's tick change at all.
//
// RESULT (2026-10-03): as predicted, both ways.  Numbers in tools/p473seq.py.
cfg_save_auto 0
log_enable 1
log_dir "logs"
log_name p473seq
developer 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0
set run_resume 0
sv_public 0
sv_port 27711
set lobby_dir ""
con_notifytime 0

wait 200
map surf_colin_blaster_69000
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 1000

// The movement lock reverts a typed pm_ticrate; sv_cheats 1 is its own way off
// (engine sv_phys.c SV_MovementVar_Callback).  Set for BOTH halves.
sv_cheats 1
waitms 300
pm_ticrate 0.015
waitms 1000
echo ^5=== p473seq server 0.015 ===
pm_ticrate
replay data/p473seq.rec
waitms 2500
replay seq
waitms 800
replay stop
waitms 800

pm_ticrate 0.01
waitms 1000
echo ^5=== p473seq server 0.01 ===
pm_ticrate
replay data/p473seq.rec
waitms 2500
replay seq
waitms 800
replay stop
waitms 800
echo ^5=== p473seq done ===
quit
