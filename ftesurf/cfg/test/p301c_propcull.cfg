cfg_save_auto 0
// Fault 4, run 3 -- CONFIRM THE DARK BLOCK IS A STATIC PROP.
//
// Established by runs 1-2 and by offline reads of the map:
//   - it is an ENTITY: r_drawentities 0 erases all its texture and shape and
//     leaves a flat fogged mass.
//   - it is NOT LIGHTMAPPED: under r_fullbright 1 the floor goes 22.8 -> 143.2
//     and the ceiling 35.0 -> 214.2, while the block does not move one level
//     off [9.6 14.1 18.1].
//   - it is not a brush entity: no brush model's geometry bounds contain the
//     view ray under either origin convention.
//   - exactly one static prop lies ahead of this camera within 2600 units and
//     900 off-axis: models/props/surf/tensor2/stage2_detail02.mdl at
//     (-10688, 11744, -9728), 2181 forward, 88 off-axis -- dead centre.
//   - surf_tensor2 ships ZERO .vhv files in its pakfile, so every one of its
//     232 static props is lit from the leaf ambient cube alone, and the map's
//     603 entries in LUMP_WORLDLIGHTS are never read by the hl2 plugin.
//
// entity + not lightmapped + one prop dead centre = static prop.  hl2_propdist
// culls fade-less static props per frame and touches nothing else, so it is the
// discriminator that r_drawentities 0 could not be (that removes props AND
// brush entities AND sprites at once).
//
// PRE-REGISTERED:
//   D2 (hl2_propdist 1) must flatten the block the same way D4 (r_drawentities
//   0) does.  If the block SURVIVES propdist but dies under drawentities, it is
//   not a prop and the identification above is wrong.
//   D3 must reproduce D1 exactly -- it is the proof propdist was reversible and
//   that nothing else drifted between arms.
//   The side-wall blowout is expected to survive D2 and die in D4: those are
//   the 158 light01.mdl lens quads, which are UnlitGeneric $selfillum on
//   lights/white005 -- and that texture is DXT1 with NO ALPHA, so Patch 299
//   cannot have touched it either way.
vid_fullscreen 0
vid_restart
waitms 3000
wait 200

developer 1
log_developer 1
log_enable 1
log_dir logs
log_name p301c_propcull
cl_maxfps 0
cl_idlefps 0
sv_cheats 1
con_notifylines 0
con_notifytime 0.01
r_drawviewmodel 0

map surf_tensor2
waitmap 600
waitms 9000
waitms 3000
noclip
waitms 1000

alias vblock "setpos -10751.1777 9562.7969 -9789.3184 -0.0934 89.4342 0; waitms 2000"

echo ^5=== D1: baseline
vblock
screenshot p301c_d1_base

echo ^5=== D2: hl2_propdist 1 -- static props culled, nothing else
hl2_propdist 1
waitms 2500
vblock
screenshot p301c_d2_nopropx
hl2_propdist 0
waitms 2000

echo ^5=== D3: propdist back to 0 -- reversibility control, must equal D1
vblock
screenshot p301c_d3_repeat

echo ^5=== D4: r_drawentities 0 -- props AND brush ents AND sprites
r_drawentities 0
waitms 2500
vblock
screenshot p301c_d4_noents
r_drawentities 1
waitms 2000

echo ^5=== D5: what the plugin thinks it is lighting
prop_census
waitms 1500

echo ^5=== END OF RUN ===
waitms 500
quit
