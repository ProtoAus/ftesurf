// P398TELE -- Patch 398: a trigger_teleport without a landmark snaps your angles
// to the destination's whatever UseLandmarkAngles says (Source, and Momentum's
// mom_triggers.cpp:930).  3,596 no-landmark teleports on 131 maps write it 0 and
// used not to turn you.  Listen server (the client's trigger prediction is off),
// three such teleports, pre-teleport yaw set by `cmd setpos` to a value no
// destination uses.  Run NEW and CONTROL (+set sv_progs qwprogs394ctl) with
// +set log_name.
//
// PRE-REGISTERED (destinations from the BSP entity lumps)
//  T1 surf_colours *7 (a fail slab, dest stage10_start (8960,-7168,944) yaw 90),
//     entered at yaw 45: NEW viewpos yaw 90.0 at x 8960 y -7168; CONTROL the same
//     position with yaw 45.0.
//  T2 surf_colours *11 (dest stage9_start (6144,-7168,944) yaw 90), entered at
//     yaw 200: NEW yaw 90.0; CONTROL yaw 200.0 (-160.0).
//  T3 surf_island *55 (dest s (0,1072,14488) yaw 270), entered at yaw 45: NEW
//     yaw 270.0 (-90.0); CONTROL yaw 45.0.
// FALSIFIED IF a NEW yaw differs from the destination's by more than 0.1, or a
// CONTROL yaw is not the entry yaw (then this harness does not see the bug).
//
// RESULT (2026-09-20, the release engine's listen server).
//   NEW T1 yaw 90.0, T3 yaw -90.0: HELD.  T2 yaw 89.0: 1.0 short, FALSIFIED by the
//   threshold -- the engine's delta fixangle truncates to whole degrees
//   (sv_send.c `int newa`, fixed by engine Patch 396); T1/T3's deltas were whole.
//   CONTROL T1 45.0, T2 -160.0, T3 45.0: the entry yaw kept, the bug visible.
cfg_save_auto 0
log_enable 1
log_dir logs
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
sv_cheats 1
fs_missingwarn 0
set run_resume 0
sv_port 27682

wait 200
map surf_colours
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 1000
echo ^5=== p398 T1 ===
cmd setpos 8960 -4793 -990 0 45 0
waitms 1500
cmd viewpos
waitms 2500
echo ^5=== p398 T2 ===
cmd setpos 6784 -4800 -990 0 200 0
waitms 1500
cmd viewpos
waitms 2500

map surf_island
waitmap 1800
waitms 3000
echo ^5=== p398 T3 ===
cmd setpos 10020 -3984 -1720 0 45 0
waitms 1500
cmd viewpos
waitms 2500
echo ^5=== p398 DONE ===
waitms 500
quit
