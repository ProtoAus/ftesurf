cfg_save_auto 0
// Patch 302 follow-up -- does hl2_lt_dirsign now matter, when it did not before?
//
// WHY THIS RUN EXISTS.  A numpy round-trip of Patch 302's cube fold through the
// reconstruction the prop path actually performs (unweighted six-face mean plus
// one dominant direction -- NOT Valve's n^2 convex combination, which only runs
// under #AMBIENTCUBE and is gated off) says:
//
//     hl2_lt_dirsign 0 (default):  recovered direction is wrong by
//                                  min 90.8 deg, MEAN 130.3 deg, max 179.6 deg
//     hl2_lt_dirsign 1:            wrong by 0.0 deg, exactly
//
// The unsigned arm points AWAY from the light -- which is what Patch 268 C2's
// own essay says, and why the fixed arm exists.  It was left off by default, and
// that was defensible: before 302 the cube held VRAD's bounce alone, which has
// almost no direction in it, so the sign of a nearly-isotropic cube changed
// little.  PATCH 302 HAS JUST PUT REAL DIRECTIONAL LIGHT INTO THAT CUBE.  The
// same defect is now being fed a signal it can actually get wrong.
//
// PRE-REGISTERED:
//   G1 is the shipping pair (worldlight 1, dirsign 0) and must reproduce today's
//   measured block/wall of ~1.25.
//   G2 flips dirsign to 1 and MUST MOVE THE BLOCK.  If it does not move at all,
//   the direction term is not reaching this prop and the round-trip model is
//   describing code that does not run here -- that kills the hypothesis.
//   Which way it moves is NOT pre-registered: correcting a 130-degree error
//   redistributes light between the lit and unlit faces, and which of those this
//   camera sees is a property of the vantage, not of the fix.  What IS
//   registered is the target: CS:S measures block/wall 0.99, we are at 1.25, so
//   the arm that lands nearer 0.99 is the better pair.
//   G3 returns to 0 and must reproduce G1 -- proof the live invalidation covers
//   dirsign as well as worldlight.
//   The LEFT WALL must not move in any arm.  It is a lightmapped world brush and
//   neither cvar can touch it; if it moves, something else is wrong.
vid_fullscreen 0
vid_restart
waitms 3000
wait 200

developer 1
log_developer 1
log_enable 1
log_dir logs
log_name p302e_dirsign
cl_maxfps 0
cl_idlefps 0
sv_cheats 1
con_notifylines 0
con_notifytime 0.01
r_drawviewmodel 0

map surf_tensor2
waitmap 600
waitms 9000
waitms 3000
noclip
waitms 1000

alias vs12 "setpos -12300.9990 10799.1201 -9654.1191 3.1311 43.4784 0; waitms 2500"

echo ^5=== G1: worldlight 1, dirsign 0 -- the shipping pair
hl2_lt_worldlight 1
hl2_lt_dirsign 0
waitms 2500
vs12
screenshot p302e_g1_dirsign0
waitms 1200

echo ^5=== G2: dirsign 1 -- must move the block
hl2_lt_dirsign 1
waitms 2500
vs12
screenshot p302e_g2_dirsign1
waitms 1200

echo ^5=== G3: back to 0 -- reversibility
hl2_lt_dirsign 0
waitms 2500
vs12
screenshot p302e_g3_dirsign0_again
waitms 1200

echo ^5=== G4: worldlight 0 + dirsign 1 -- is dirsign visible WITHOUT the new term?
hl2_lt_worldlight 0
hl2_lt_dirsign 1
waitms 2500
vs12
screenshot p302e_g4_nowl_dirsign1
waitms 1200

echo ^5=== G5: worldlight 0 + dirsign 0 -- the pre-302 baseline for G4
hl2_lt_dirsign 0
waitms 2500
vs12
screenshot p302e_g5_nowl_dirsign0
waitms 1200

echo ^5=== END OF RUN ===
waitms 500
quit
