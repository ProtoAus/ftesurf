// P355RK -- the online tab has no tier chips, and `scores tier` no longer toggles
// the board.  Listen server on `poop` with the p355keep temporary zone file.
// PREDICTIONS: screenshot p355rk_online shows online/segmented/local tabs and a
// refresh chip, NO ranked/community chips; `scores tier community` prints "the
// board shows ranked times only" and the next status still reads "pinned"
// (CONTROL for the fall-through trap: an unhandled word toggles the board shut);
// `board_fetch 0 0 community clean` + `board_status` still says tier community.
cfg_save_auto 0
log_enable 1
log_dir "logs"
log_name "p355rk"
developer 1
cl_idlefps 0
cl_maxfps 100
sv_public 0
waitms 5000
map poop
waitmap 45
waitms 3000
menu_restart
waitms 300
ui_close
set rec_terms 1
scores tab online
scores open
waitms 3000
scores status
screenshot p355rk_online
waitms 800
scores tier community
scores status
board_fetch 0 0 community clean
waitms 3000
board_status
quit

