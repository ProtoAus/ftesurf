// B43PVS -- is the replay's missing geometry a STALE SERVER PVS?
//
// THE REPORT: "surf_fiellu Demo playback like on some maps, doesn't show some
// of the models or ramps, playing the map is fine."
//
// THE HYPOTHESIS, and it is only that until this run comes back.  A replay does
// not reload the map: the client overrides VF_ORIGIN/VF_ANGLES and flies the
// camera, while `cmd rec_watch 1` pins the player MOVETYPE_NONE where they stood.
// sv_saveloc.qc:1331-1333 says "the server is never told where the recording
// goes".  So the server keeps computing this client's PVS from the FROZEN BODY
// (sv_ents.c:4375) and drops every entity that fails it (sv_ents.c:4163).  The
// world BSP keeps drawing because it is client-side and follows the overridden
// view -- which is why the map is a skeleton rather than a void.  FTESurf
// spawns surf ramps as func_brush/func_slide and decorations as prop_dynamic,
// both SERVER ENTITIES; prop_static is not an entity at all and should survive.
//
// THE TWO ARMS, AND THE SECOND ONE IS THE POINT:
//
//   sv_nopvs 1  nulls the server's camera list outright (sv_ents.c:4450-4451),
//               so NOTHING is culled.  If the ramps and props come back, the
//               fault is server-side entity delivery.
//   r_novis 1   is the CLIENT-side world cull and must NOT fix it.  If r_novis
//               brings the geometry back, the diagnosis above is WRONG and the
//               whole .view2 plan is wasted work.
//
// A known failure mode is not a diagnosis.  This run is what makes it one.
//
// A/B/A: the baseline is taken again after sv_nopvs goes back to 0, so a
// difference between shots 1 and 2 cannot be drift, a late precache or the
// replay simply having moved.  The camera is PAUSED and seeked to the same
// three ticks in every arm, so all four shots at a given seek are the same
// viewpoint to the unit -- `viewpos` beside each one is the receipt for that.
//
// Three seek points because I do not know where on this map the content goes
// missing; 12 s is early (near the start, likely INSIDE the frozen body's own
// PVS and therefore expected to look FINE in every arm -- that shot is itself a
// control), 35 s and 52 s are deep into the run and far away.
//
// Single process, single map load -- `map x` twice does not reload the world.

log_enable 1
log_dir "logs"
log_name "b43pvs"
developer 1
log_developer 1
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
sv_cheats 1
fs_missingwarn 0

// The path overlay is off for every shot: this run is about what the WORLD
// draws, and a bright ribbon down the middle of the frame is the last thing a
// before/after comparison needs.
hud_watch_path 0
hud_watch_info 0

wait 200
echo ^5=== b43pvs: surf_fiellu, replay PVS ===

map surf_fiellu
waitmap 1800
waitms 3000

// Prove the content is CLEAN before blaming the renderer for anything.  A
// missing .mdl would be a checkerboard, not an absence, but saying so is
// cheaper than assuming it.
echo ^5=== b43pvs: content check (must be quiet, or this run means nothing) ===
hl2_missing
waitms 500

// Bare, NOT `cmd ent_census`: it is registered in CSQC (cl_zones.qc:188) and
// its handler does the forwarding itself (:558).  Sending `cmd` here would
// reach the server twice over.
echo ^5=== b43pvs: what this map actually spawned ===
ent_census
waitms 500

replay data/runs/surf_fiellu/main/0003991_pb.rec
waitms 800
replay pause
replay status

// ---------- ARM 1: the baseline, exactly as the report saw it ----------
echo ^5=== b43pvs ARM 1: BASELINE (sv_nopvs 0, r_novis 0) ===
replay seek 12
waitms 600
viewpos
screenshot b43pvs_a1_t12
replay seek 35
waitms 600
viewpos
screenshot b43pvs_a1_t35
replay seek 52
waitms 600
viewpos
screenshot b43pvs_a1_t52

// ---------- ARM 2: the server stops culling ----------
echo ^5=== b43pvs ARM 2: sv_nopvs 1 -- if the ramps return, it is the PVS ===
sv_nopvs 1
waitms 1200
replay seek 12
waitms 600
viewpos
screenshot b43pvs_a2_t12
replay seek 35
waitms 600
viewpos
screenshot b43pvs_a2_t35
replay seek 52
waitms 600
viewpos
screenshot b43pvs_a2_t52

// ---------- ARM 3: back to the baseline, to prove arm 2 was the cvar ----------
echo ^5=== b43pvs ARM 3: sv_nopvs 0 again -- must match ARM 1, not ARM 2 ===
sv_nopvs 0
waitms 1200
replay seek 35
waitms 600
viewpos
screenshot b43pvs_a3_t35
replay seek 52
waitms 600
viewpos
screenshot b43pvs_a3_t52

// ---------- ARM 4: the control that must FAIL to fix it ----------
echo ^5=== b43pvs ARM 4: r_novis 1 -- the CLIENT cull.  Must NOT bring them back ===
r_novis 1
waitms 1200
replay seek 35
waitms 600
viewpos
screenshot b43pvs_a4_t35
replay seek 52
waitms 600
viewpos
screenshot b43pvs_a4_t52
r_novis 0

echo ^5=== b43pvs: done ===
replay stop
waitms 400
quit
