// cfg_save_auto 0: this run sets archived cvars (vid_*, cl_maxfps); never let it write them into ftesurf.cfg (cl_main.c:2535)
cfg_save_auto 0
// em_boreas_b -- arm B: vbsp_emit_ratemax 1000 so SpawnRate 333 is honoured; then arm C: Source-exact blocks by name.
log_dir "logs"
log_name "em_boreas_b"
log_enable 1
developer 1
log_developer 1
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000
cl_maxfps 0
cl_idlefps 0
cl_yieldcpu 0
sv_cheats 1
set vbsp_emit_ratemax 1000
wait 200
map surf_boreas
waitmap 600
waitms 2000
noclip
setpos 12160 0 11000 -20 90 0
waitms 8000
echo ^5=== B V2 ratemax 1000 steady state
emit_list
r_partinfo
screenshot em_boreas_b_v2_x
waitms 700
screenshot em_boreas_b_v2
waitms 700
setpos 3584 5120 -4608 -60 -31 0
waitms 3000
echo ^5=== B V1 spawn
r_partinfo
screenshot em_boreas_b_v1_x
waitms 700
screenshot em_boreas_b_v1
waitms 700
// V3: inside the func_dustcloud (centre 9728 12160 192, radius 1507, DistMax 4096) -- the only vantage where BOTH emitters are in cull
setpos 9728 10000 200 0 90 0
waitms 8000
echo ^5=== B V3 both emitters in cull
emit_list
r_partinfo
screenshot em_boreas_b_v3_x
waitms 700
screenshot em_boreas_b_v3
waitms 700
echo ^5=== C Source-exact blocks: redefine dustmote_0 / dustcloud_0 by name, pool restarts from 0
exec particles/ftesurf_src.cfg
waitms 300
r_partinfo
setpos 12160 0 11000 -20 90 0
waitms 8000
echo ^5=== C V2 steady state
r_partinfo
screenshot em_boreas_c_v2_x
waitms 700
screenshot em_boreas_c_v2
waitms 700
setpos 3584 5120 -4608 -60 -31 0
waitms 3000
echo ^5=== C V1 spawn
screenshot em_boreas_c_v1_x
waitms 700
screenshot em_boreas_c_v1
waitms 700
setpos 9728 10000 200 0 90 0
waitms 8000
echo ^5=== C V3 both emitters in cull
emit_list
r_partinfo
screenshot em_boreas_c_v3_x
waitms 700
screenshot em_boreas_c_v3
waitms 700
echo ^5=== D restore shipped blocks (falsifier for C)
// back to V1 so em_boreas_d_v1 is shot from the same vantage as em_boreas_b_v1 (the C V3 block above moved the camera)
setpos 3584 5120 -4608 -60 -31 0
exec particles/ftesurf.cfg
waitms 8000
r_partinfo
screenshot em_boreas_d_v1_x
waitms 700
screenshot em_boreas_d_v1
waitms 500
quit
