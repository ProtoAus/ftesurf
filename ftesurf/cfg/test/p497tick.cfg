// P497TICK -- Patch 497: a replay turns ticks into seconds at the MOVER's rate.
//    python tools/p497tick.py
//
// The .rec grammar (the block over SV_RecOpen) says of `movetickrate`: "A reader
// that turns ticks into seconds must prefer this one when it is present", 0
// meaning the engine stated no value.  cl_online.qc's header scan already did;
// cl_watch.qc's two did not -- the replay's (Watch_Scan) and the board-line job's
// (Watch_LineJobStep), which is the pair that feeds ln_tick, the seek index, the
// window and the strafe bar.
//
// The driver stages two files from one real recording of this map, with THREE
// different rates in play so every verdict names its own cause: this map's
// server runs 0.01 (pm_ticrate is a locked mover cvar, so default.cfg's 0.015
// never reaches it), p497diff.rec says `tickrate 0.025` / `movetickrate 0.008`,
// and p497same.rec says 0.02 for both.  Nothing flew either at those rates --
// they are synthetic headers over real samples, which is fine for what is
// graded here: which key the reader took.
//
// PRE-REGISTERED.  Every figure is a rate the reader PRINTS, in four places:
//  T1 `replay status`'s `bar tick` reads 0.00800 on p497diff -- rec_wt_tickrate,
//     which is what the strafe bar (cl_hud.qc) grades a replay's turn rate at.
//  T2 `replay colours 0`'s `lnmv` reads 0.00800 -- Line_Tick's slot 0.
//  T3 `scores lineat 1` + `replay colours 1`'s `lnmv` reads 0.00800 -- the
//     board-line job's own path, a separate hunk from T1/T2.
//  T4 `replay seq`'s `lnsb` reads 0.008 -- rec_wt_tickrate again, second print.
//  T5 (SELF-CONTROL, must hold on both builds) p497same reads 0.02 in T1-T4:
//     the two keys agree, so the preference is a no-op, and 0.02 is neither the
//     server's rate nor the diff file's -- which is what proves the reader took
//     a value out of the file rather than printing a constant or falling back.
//  T6 no observable reads the server's 0.01, i.e. nothing fell back to PM_TICK.
//
// CONTROL: the csprogs from a `git worktree` at the commit before this one,
// built by hand (`fteqcc64 cl_progs.src`, 0 warnings) and copied over the
// install's -- tools/p497tick.py prints the hash it ran.
// Predicted on the control: T1-T4 read 0.02500 -- the file's `tickrate`, and not
// the server's 0.01, so a fallback is told apart from the defect -- and T5/T6
// still hold.  The control therefore cannot tell the two files' mover rates
// apart, which is the defect.
//
// RESULT (2026-10-06): every prediction held, on both builds.
//   subject  csprogs F70C4AA299CC05FD -- T1-T6 PASS, 6 checks 0 failed:
//     bar tick 0.00800, lnmv 0.00800 (slot 0) and 0.00800 (slot 1), lnsb 0.008;
//     the same-key file 0.02000 in all four; nothing read the server's 0.01.
//   control  csprogs 9D5ED103856B8D9A (git worktree at HEAD, fteqcc by hand,
//     0 warnings) -- T1-T4 FAIL at 0.02500, i.e. the file's `tickrate` and not
//     the server's 0.01, so a fallback is told apart from the defect; T5/T6 PASS
//     on it too, which is what makes them controls rather than subjects.
//   Two grader bugs the first run caught, both worth keeping in mind: the cfg's
//   `=== ... colours 0 ===` sub-echoes matched the section regex and dropped the
//   section they sat in (a marker inside a section must not end it), and
//   `replay status`'s `t ... tick %g` field is rec_wt_TICKS, an integer count,
//   not the rate -- `bar tick %.5f` is the rate print.
//   Also measured here and not predicted: this map's server runs pm_ticrate 0.01
//   although default.cfg sets 0.015 -- it is a locked mover cvar, restored to the
//   engine's default at map load, which is the trap AGENTS.md records.
log_enable 1
log_dir "logs"
log_name p497tick
developer 0
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0
set run_resume 0
sv_public 0
sv_port 27713
set lobby_dir ""
set hud_watch_skipidle 0
set hud_watch_path 1
set hud_strafe 1
set hud_strafe_minspeed 200
con_notifytime 0

wait 200
map bhop_eazy
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 1000

echo ^5=== p497tick live ===
pm_ticrate

echo ^5=== p497tick diff ===
replay data/p497diff.rec
waitms 2000
replay pause
replay status
echo ^5=== p497tick colours 0 ===
replay colours 0 2
echo ^5=== p497tick seq ===
replay seq
echo ^5=== p497tick line 1 ===
scores lineat 1 data/p497diff.rec
waitms 5000
replay colours 1 2
replay stop
waitms 800

echo ^5=== p497tick same ===
replay data/p497same.rec
waitms 2000
replay pause
replay status
echo ^5=== p497tick colours 0 ===
replay colours 0 2
echo ^5=== p497tick seq ===
replay seq
echo ^5=== p497tick line 1 ===
scores lineat 1 data/p497same.rec
waitms 5000
replay colours 1 2

echo ^5=== p497tick done ===
replay stop
waitms 300
quit
