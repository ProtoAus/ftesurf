// Build 41: does the parity build load and run, and what IS the eye height?
//
// THE REPORT: "viewhight is like 32units to high? I believe your eye-height is
// 64units in CSS / Momentum mod."
//
// Reading the code says the standing eye is feet+64.06 and that no offset is
// applied twice.  That is the same kind of claim that was made about the
// crouch-jump twice and was wrong both times, so this measures it instead:
// the new `eye` row prints the camera height above a TRACED floor, beside the
// live hull height, so a wrong origin cannot hide inside the number.
//
// WHAT TO LOOK FOR:
//   * the "Momentum movement" banner: jump 301.993, hull 62/45, eye 64/47,
//     viewscale 0.5 (mid-air duck shifts the origin 8.5), maxvel 3500/axis.
//     Build 40 printed "CS:S movement ... jump 268.328, hull 72/54".
//   * the eye row in hud_debug: standing on flat ground it must read 64.xx and
//     hull 62.  Amber means it disagrees with the shipped constant by >1.5.
//
// hud_eyetrace <N> dumps every term of the eye maths for N frames.
//
// Single process, single map load -- `map x` twice does not reload.
// hud_* are csprogs cvars and do not exist until csprogs loads, so they are set
// AFTER waitmap or they are silent no-ops.

log_enable 1
log_name b41eye
developer 1
log_developer 1
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
sv_cheats 1
fs_missingwarn 0

wait 200
map surf_aesthetic
waitmap 900
wait 300

// AFTER waitmap.
hud_debug 1
hud_debug_y 0.30
wait 60

echo ^5=== b41eye: standing on spawn ===
hud_eyetrace 12
wait 20
wait 40
screenshot
wait 30

echo ^5=== b41eye: the movement banner, for the record ===
pm_selftest
wait 60

echo ^5=== b41eye: done ===
wait 40
quit
