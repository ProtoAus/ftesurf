// P369CTL -- control for p369verify: an engine before Patch 369
// (ftesurf64_p362.exe) on a live restart run.  Predicted: REFUSE "a stage restart".
//   ftesurf64_p362.exe +exec cfg/test/p369ctl.cfg
log_enable 1
log_dir logs
log_name p369ctl
cl_idlefps 0
cl_maxfps 100
set rec_enable 0
waitms 5000
map surf_deathstar
waitmap 1800
waitms 2000
pm_verify data/p369/surf_deathstar.rec
waitms 500
quit
