// P355UNRSV -- server half of p355unr: the run reply's tier/stored/prevms reach
// `*wrank`, and a demoted run is TOLD (chat) rather than ranked.
//
// Run from C:\FTESurf:  C:\FTEQuake\fteqwsv64.exe +set sv_port 27631
//   +set sv_public 0 +set lobby_master "http://127.0.0.1:8131" +exec cfg/test/p355unrsv.cfg
// against `python surfd/b65stub.py cert 8131 2` (arms R, U) or `... rank 8131 2`
// (the old-surfd control).  Client: p355unrcl.cfg.
//
// Probe 1 = TF_CHEAT (tier ranked in cert mode); probe 3 = TF_CHEAT|TF_NOPROFILE
// (tier community).  Real surfd answers 204 to both: no row can be forged.
log_enable 1
log_dir logs
log_name p355unrsv
log_developer 1
developer 1
sv_guidkey "ftesurf-p355-probe"
sv_maxrate         0
sv_maxdownloadrate 0
set lobby_master_key  "stub-key-not-a-real-one"
set lobby_master_rate 30
map bhop_eazy
waitms 30000
echo ^5==== ARM R: probe 1 ====
set lobby_run_probe 1
waitms 12000
echo ^5==== ARM U: probe 3 ====
set lobby_run_probe 3
waitms 20000
quit
