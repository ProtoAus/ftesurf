// cfg_save_auto 0: this run sets archived cvars (vid_*, cl_maxfps); never let it write them into ftesurf.cfg (cl_main.c:2535)
cfg_save_auto 0
// Patch 293c -- the real fix, after the review.
//
// 293b chased a SCALE.  It was the wrong lever: the darkening is THE ONE CLAMP.
// vcraw was normalised to the unclamped encpeak while baked took the clamped gain,
// so a clamped prop darkened WHOLE by the overshoot (p50 1.423x, p95 2.536x) instead
// of just having its peak capped.  293 raised the clamp's firing rate from 1.8% of
// props (boreas, 4-byte) to 11.6% (fantasy, 12-byte), which is the darkening that
// showed up on screen.  Now inv carries the overshoot too.
//
// Also fixed: the three basis colours are averaged as STORED BYTES, not as decoded
// linear values.  Decode is convex, so the old form was brighter every time --
// p50 +1.4%, p95 +10.0%, max +16.8% over surf_fantasy's 2345 props.
//
// hl2_lt_baked_scale STAYS AT ITS DEFAULT 2 in every arm.  If a scale is still
// needed after this, that is a finding, not a knob to turn during the measurement.
//
// ARMS:
//   1  fantasy vhv12 1  -- the fix.  Must read "props: 2345 of 2345" and must NOT be
//                          darker than arm 3; near-black on the rock crop must come
//                          back down from the 46% that 293 produced.
//   2  boreas  vhv12 1  -- CONTROL.  4-byte map, "1587 of 1587".  The clamp change can
//                          only touch the 1.8% of its props where the clamp fires, so
//                          this must be very close to identical -- that is the claim
//                          being tested, and "very close" is measured, not assumed.
//   3  fantasy vhv12 0  -- the fallback, today's shipped picture, the reference.
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000
wait 200

developer 1
log_developer 1
log_enable 1
log_dir logs
log_name p293c_verify
cl_maxfps 0
cl_idlefps 0
sv_cheats 1
con_notifylines 0
con_notifytime 0
con_notifytime_error 0
r_drawentities 1
r_lightstylescale 1
hl2_cubelight 0
hl2_bumpgreenfix 0
hl2_lt_dirsign 0
r_cubelight 1

alias shot_rock "setpos -9001.9434 -14301.5703 6205.6196 30.9814 38.5675 0; waitms 2500; cmd viewpos"
alias shot_pine "setpos 7095.0 -14443.4 -10790.5 -12 0 0; waitms 2500"
alias shot_s2   "setpos -10560.2393 -12718.2324 4593.5737 18.5669 164.0588 0; waitms 2500"

// ---------------- ARM 1: fantasy, the fix ----------------
hl2_lt_vhv12 1
echo ^5=== p293c ARM 1: surf_fantasy vhv12 1 -- expect props: 2345 of 2345
map surf_fantasy
waitmap 600
waitms 9000
waitms 3000
noclip
waitms 1000
shot_rock
screenshot p293c_fix_rock
shot_pine
screenshot p293c_fix_pine
shot_s2
screenshot p293c_fix_s2

// ---------------- ARM 2: boreas CONTROL ----------------
echo ^5=== p293c ARM 2: surf_boreas CONTROL -- 4-byte, expect 1587 of 1587, near-identical
map surf_boreas
waitmap 600
waitms 9000
waitms 3000
noclip
waitms 1000
setpos 9440 -15488 3741 0 90 0
waitms 2500
cmd viewpos
screenshot p293c_ctl_boreas_ramp
setpos 12672 1568 11840 0 180 0
waitms 2500
screenshot p293c_ctl_boreas_s1

// ---------------- ARM 3: fantasy, fallback (reference) ----------------
hl2_lt_vhv12 0
echo ^5=== p293c ARM 3: surf_fantasy vhv12 0 -- the shipped fallback, expect 0 of 2345
map surf_fantasy
waitmap 600
waitms 9000
waitms 3000
noclip
waitms 1000
shot_rock
screenshot p293c_off_rock
shot_pine
screenshot p293c_off_pine
shot_s2
screenshot p293c_off_s2

echo ^5=== END OF RUN ===
waitms 500
quit
