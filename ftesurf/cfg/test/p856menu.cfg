// P856 Story screen rig: a third list and dated levels.  tools/story_fixture.py --story
// <the real list plus a Halloween list dated around today> on 127.0.0.1:18854, then
// tools/runlines_smoke.py this cfg --mount --mqc <menu.dat> --put data/consent.txt,
// data/mapmeta.txt, data/mapdl.net.txt (as p854story.cfg).
// PREDICTIONS: four tabs (Story, Events, Halloween, Players); tab 2 probes "list
// halloween" with "ends in" on level 1, "opens in" on level 5, "ended" on level 7;
// tab 0 level 2 has no dates ("when """); the Halloween rows say so in gold text.
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
vid_vsync 0
mastervolume 0
set rec_terms 7
set rec_upload 0
set lobby_dir "http://127.0.0.1:18854"
set ui_name_chosen 1
name StoryFixture
log_enable 1
log_dir logs
log_name runlines_smoke
log_developer 1
developer 1
waitms 15000
map surf_dune
waitmap 60
waitms 6000
menu_restart
waitms 2000
set rec_terms 7
set lobby_dir "http://127.0.0.1:18854"
developer 0
con_notifytime 0
con_notifylines 0
ui_story
waitms 5000
ui_story sel 2
waitms 800
ui_story probe
waitms 500
ui_story tab 2
waitms 1500
ui_story sel 1
waitms 800
ui_story probe
screenshot p856_halloween
waitms 1500
ui_story sel 5
waitms 800
ui_story probe
screenshot p856_halloween_soon
waitms 1500
ui_story sel 7
waitms 800
ui_story probe
screenshot p856_halloween_ended
waitms 1500
ui_story tab 3
waitms 4000
ui_story probe
screenshot p856_players
waitms 1500
echo RUNLINES COMPLETE
quit
