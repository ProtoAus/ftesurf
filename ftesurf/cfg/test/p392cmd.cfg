// P392CMD -- Patch 392: `cl_showfps` is an alias of show_fps (default.cfg), and
// `chat_open` opens the chat draft like chat_say/messagemode (cl_chat.qc).
// Listen server.  Run with +set log_name: NEW (the build) and CONTROL (the
// progs deployed before 392; default.cfg already carries the alias, so the
// alias control is HEAD's default.cfg having no cl_showfps line).
//
// PRE-REGISTERED
//  A `cl_showfps 1` then `show_fps` prints "show_fps" is "1"; bare `cl_showfps`
//    prints the same; `cl_showfps 0` then `show_fps` prints "0".
//  B console `chat_open`: chat_rows reads typing 1; ESC closes it (typing 0).
//  C `bind t chat_open` + `vote key 116 1`: took 1 and typing 1.
//  D a non-chat bind on t (`bind t "echo p392 t"`): took 0, typing 0.
//  CONTROL: B prints Unknown command and typing 0; C took 0, typing 0.
// FALSIFIED IF any of A-D fails on NEW, or B/C do not fail on CONTROL.
//
// RESULT (2026-09-20).  ALL HELD.  NEW: A "1" / "1" / "0" (default); B typing 1,
//   ESC took 1 and typing 0; C took 1, typing 1; D took 0, typing 0.  CONTROL:
//   B Unknown command "chat_open", typing 0; C took 0.
cfg_save_auto 0
log_enable 1
log_dir logs
developer 1
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
sv_cheats 1
fs_missingwarn 0
set run_resume 0
sv_port 27682

wait 200
map bhop_eazy
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 1500

echo ^5=== p392 A ===
show_fps 0
cl_showfps 1
show_fps
cl_showfps
cl_showfps 0
show_fps
waitms 300

echo ^5=== p392 B ===
chat_open
waitms 400
chat_rows
vote key 27 1
vote key 27 0
waitms 300
chat_rows

echo ^5=== p392 C ===
bind t chat_open
vote key 116 1
vote key 116 0
waitms 400
chat_rows
vote key 27 1
vote key 27 0
waitms 300

echo ^5=== p392 D ===
bind t "echo p392 t"
vote key 116 1
vote key 116 0
waitms 400
chat_rows
unbind t
echo ^5=== p392 DONE ===
waitms 500
quit
