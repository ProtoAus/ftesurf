// BUILD 85 -- THE CARRIER RECORD, capture arm.  Does the format carry the RIDE?
//
// SITE: E5's fourth and only working one, reused rather than re-searched.
// e5push.cfg records why the other three failed and carries the geometry:
// surf_ecosystem start box x -2400..-2224, y +-496, z 4944..5456; push origin
// (-2634, 0, 4825), speed 1700, pushdir -X -- 234 u past the box's -X edge and
// 119 u below, so the walk leaves the box FIRST and then drops onto the pad.
//
// GROUND TRUTH IS NOT INFERRED FROM THE RECORDING (E3's rule).  `run_bv_debug 1`
// makes SV_BaseVelocityFrame print each cash-out as it happens; the recording is
// the thing under test, so the witness must come from a different statement.
// E5 lost this once -- its two measured runs predate e5rec.cfg's log block, so
// the `basevel: paid` lines reached a console and nowhere else.
//
// PRE-REGISTERED, BEFORE THE RUN:
//   1  `timer: running` BEFORE the first `basevel: paid`.  Three of E5's four
//      sites failed exactly this, and a cash-out outside a run reaches no file.
//   2  The part file's first line is `FTESURF-REC 8`.
//   3  The first `ride` is an `arm` -- the floor record.
//   4  At least one `ride ... pay`, magnitude agreeing with the console witness
//      (about 1700 u/s on -X, `[AddOutput 0]`).
//   5  Every `pay` immediately followed by `arm 0.00 0.00 0.00`.
//   6  reccheck.py: 0 faults, and a `rides` info line counting both kinds.
//   7  ZERO `warp` records of kind `push` -- E5's census found one SF_PUSH_ONCE
//      trigger_push in 1310 maps and it is not on a timeable one.
//
// FALSIFIED IF: the cash-out precedes the start; `viewpos` shows the walk
//      stalled; the run comes out tainted; the file is v7; or the recorded
//      carrier disagrees with the console witness.
//
// RESULT (2026-09-18): 1, 2, 4, 5, 6, 7 held.  3 DID NOT -- the file opens
//      `pay -1700` then `arm 0`, both at the horizon tick, because the inherited
//      ride ended on the first recorded command and the cash-out runs before the
//      hand-over.  The true invariant is weaker: the first `ride` states the
//      carrier the run INHERITED, as an `arm` if still riding and a `pay` if it
//      ended there.  Chasing it also found that a bare `pay` is the AddOutput
//      shape (never armed, never handed over).  Both are in the grammar block now.
//
// WHAT THIS ARM DOES NOT TEST.  pm_recsim (Patch 328) does not know this record,
// so this proves the format CARRIES the ride, not that a re-simulation crosses
// it.  The trailer and `inend` are covered by tools/test_reccheck.py instead --
// SV_RecClose has one call site and it is the finish, which a scripted walk
// does not reach.  A multi-command SPAN needs a hand-played run: E5 established
// that every map a config can steer to a booster has the booster at the start.
//
// `set` on every cvar: rec_enable, rec_stream and run_bv_debug are read with a
// bare cvar() and registered in worldspawn or not at all, so a bare assignment
// before the first map load is Unknown command and the default silently stands.
//
// The recording is copied WHILE THE RUN IS LIVE -- an abandoned stream's part
// file is cleaned up on quit, so the hold at the bottom is the copy window.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name b85ride
developer 0

sv_cheats 0

set rec_enable 1
set rec_stream 1
set rec_runarchive 1

set run_startjitter 2
set run_bv_debug 1

cl_yawspeed 210

waitms 6000
map surf_ecosystem
waitmap 60
waitms 4000

echo ================================ B85 -- loaded.  Expect NOT running.
viewpos
cmd timer
waitms 700

cmd zone_goto 0
waitms 1500
echo ================================ B85 -- after zone_goto
viewpos
waitms 700

// x near the box's -X edge, y centred, yaw 180 = -X.
setpos -2300 0 5000 0 180 0
waitms 1500
echo ================================ B85 -- armed and aimed
viewpos
cmd timer
waitms 700

// ---------------------------------------------------------------------------
// The run starts HERE, on leaving the box at x = -2400.  The pad is a further
// 234 u down -X and 119 u below.  Nothing below may warp or noclip -- setpos is
// not one of SV_RecWarp's call sites, so a post-start setpos would be an
// UNRECORDED position discontinuity and would confound the reading.
// ---------------------------------------------------------------------------
+forward
waitms 1200
echo ================================ B85 -- walking out
viewpos
cmd timer
waitms 600

echo ================================ B85 -- approaching the pad
viewpos
cmd timer
waitms 1200

echo ================================ B85 -- on or past the pad
viewpos
cmd timer
waitms 1500

echo ================================ B85 -- after the launch 1
viewpos
cmd timer
waitms 1500

echo ================================ B85 -- after the launch 2
viewpos
cmd timer
waitms 1500

-forward
waitms 600
echo ================================ B85 -- settled
viewpos
cmd timer
waitms 800

// THE COPY WINDOW.  The run is still open here and data/parts/0.rec is still on
// disk; a poller outside this process takes it during this hold.
echo ================================ B85 -- HOLD (copy window opens)
cmd timer
waitms 9000
echo ================================ B85 -- HOLD 2
viewpos
cmd timer
waitms 9000
echo ================================ B85 -- HOLD 3
cmd timer
waitms 9000

echo ================================ B85 -- last read before quit
cmd timer
waitms 1000

echo ================================ B85 done
waitms 500
quit
