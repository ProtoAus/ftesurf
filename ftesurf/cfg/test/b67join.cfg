// Build 67: does pressing Start put you on a real server?
//
// WHAT THIS CAN AND CANNOT PROVE.
//
//   PROVEN HERE.  The whole client half: that ui_launch's ask reaches
//   /api/join, that the reply is parsed, that a READY answer is checked
//   against ui_addr_ok AND ui_host_allowed before it reaches the console, that
//   a refused host falls back to a LOCAL map instead of failing, that a
//   directory which is not configured is not an error, and that the deferred
//   state machine reports itself between frames.
//
//   NOT PROVEN HERE, AND IT CANNOT BE.  The BUTTON.  Start is a sui element
//   picked with the mouse and no cfg in this tree can drive a cursor -- the
//   same limit cl_scores.qc records for the online row, which is why
//   board_replay exists.  So `ui_join <map>` drives the identical path from
//   Lob_JoinAsk onward: the same request, the same callback, the same
//   ui_join_tick, the same two address gates, the same fallback.  What it
//   skips is exactly the pick, plus ui_launch's one-line `ui_play_online`
//   test, which is read rather than executed.
//
//   NOT PROVEN HERE, DELIBERATELY.  The live fleet.  lobby_dir points at a
//   THROWAWAY surfd on port 8085 with its own database and its own key,
//   talking to a throwaway lobby on 27599 in its own gamedir.  The five public
//   lobbies and the real directory on 8084 are not involved and are not
//   touched.  What is untested here is nginx's copy of the route, exactly as
//   in b66rep.
//
// PREDICTION:
//   arm 1  ui_join reports state 0, lobby_dir set, ui_play_online 1
//   arm 2  no directory  -> "nothing to ask", and NO request
//   arm 3  host refused  -> "will not connect to", then LOCAL surf_ace starts
//   arm 4  allowed       -> "online: joining 192.168.1.102:27599 for surf_lux"
//
// FALSIFIED IF: any "QC"/"PR_ExecuteProgram"/"runaway" line appears; or arm 3
// connects anyway; or arm 4 reports ready without an address; or ui_join never
// leaves state 1.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name b67join
log_developer 1
developer 1

name "^3Lex Join"

// THE THROWAWAY DIRECTORY, NOT play.proto.bar and not the Pi's live 8084.
// See the header.
set lobby_dir "http://192.168.1.102:8085"
set ui_play_online 1

// FORTY-FIVE SECONDS BEFORE THE FIRST ARM, AND THIS IS NOT PADDING.
//
// The first version of this file opened with `waitms 4000` and every single
// arm printed `Unknown command "ui_join"`.  The menu progs had not been
// initialised yet: the log puts `Initializing menu.dat` at 01:26:35 and the
// arms at 01:26:16 through 01:26:33, so the whole test ran against a VM that
// did not exist and reported, accurately, that the command was unknown.
//
// m_main.qc already records this trap in its own words -- "`+ui_maplist`
// cannot work: the command buffer drains during startup, before M_Init has
// registered anything" -- and it applies to a waitms'd cfg too, because the
// engine's own startup (a 1312-map filesystem scan among other things) takes
// longer than any wait anybody would think to write.  The failure LOOKS like
// an unregistered command, which sends you to the wrong file.
// FORTY SECONDS, AND THEN `menu_restart`.  TWO TRAPS, AND THE SECOND ONE
// MASQUERADES AS A BUG IN THE CODE UNDER TEST.
//
//   THE WAIT.  m_main.qc already records that `+ui_maplist` cannot work
//   because "the command buffer drains during startup, before M_Init has
//   registered anything".  That applies to a waitms'd cfg too -- the engine's
//   own startup (a 91,000-file filesystem scan among other things) takes about
//   forty seconds here.
//
//   THE menu_restart, WHICH COST THREE RUNS.  NO menuqc CONSOLE COMMAND WORKS
//   FROM A CFG WITHOUT IT.  menu.dat is loaded lazily and nothing in a scripted
//   run needs a menu, so the VM never starts: every arm printed
//   `Unknown command "ui_join"` and the log put `Initializing menu.dat` AFTER
//   the final arm -- triggered by `quit`, which raises FTE's confirm prompt.
//   `togglemenu` does NOT fix it; it opens the engine's BUILT-IN menu instead
//   (the tell is "gfx/ttl_main.lmp did not resolve" and a missing menu1.wav).
//   menu_restart calls MP_Init directly (menu.c:1513) and is the only thing
//   that does.
//
//   THE FAILURE IS INDISTINGUISHABLE FROM AN UNREGISTERED COMMAND, which sends
//   you to m_consolecommand and registercommand -- both of which were correct
//   the whole time.  cfg/test/b67ctl.cfg is the control that settled it: it
//   calls `ui_lobbypop`, a build-66 command with nothing to do with this work,
//   and that was unknown too.  Keep that control; the next person will need it.
waitms 40000
menu_restart
waitms 4000

echo ^5==== b67join arm 1: the control -- nothing asked yet ====
ui_join
waitms 500

echo ^5==== b67join arm 2: no directory is not an error ====
set lobby_dir ""
ui_join surf_lux
waitms 1500
ui_join
waitms 500

echo ^5==== b67join arm 3: the address gate, and the fallback behind it ====
set lobby_dir "http://192.168.1.102:8085"
// 192.168.1.102 is in the shipped lobby_hosts default, so it has to be taken
// OUT to exercise the refusal.  This is the gate that stops a compromised or
// substituted directory choosing what host every player's game connects to.
set lobby_hosts "example.invalid"
ui_join surf_ace
waitms 3000
ui_join
waitms 500

echo ^5==== b67join arm 3b: ...and the local map really did start ====
status
waitms 2000
disconnect
waitms 2000

echo ^5==== b67join arm 4: allowed, so it joins ====
set lobby_hosts "play.proto.bar proto.bar 180.150.62.57 192.168.1.102"
ui_join surf_lux
waitms 1000
ui_join
waitms 6000
ui_join

echo ^5==== b67join: done ====
waitms 2000
quit
