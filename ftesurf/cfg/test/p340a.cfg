// Patch 340, client arm A -- the customization surfaces against the p340sv
// dedicated server (port 27667).  Verifies by LOG (the identity mirrors, the
// chat echo, the colour resolve) and by SCREENSHOT (the chatbox, the
// customizer, the room list beside the board).
//
//   C:\FTEQuake\fteqwsv64.exe +set sv_port 27667 +exec cfg/test/p340sv.cfg
//   ftesurf64.exe -WindowStyle Minimized +exec cfg/test/p340a.cfg
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p340a
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
vid_width 1280
vid_height 720
fs_missingwarn 0
set name "PatchTest"
wait 600
connect 127.0.0.1:27667
waitms 12000
// The engine's BUILTIN menu is up from boot and `togglemenu` re-opens rather
// than closes it (M_ToggleMenu_f falls through to M_Menu_Main_f while
// menu.dat is unloaded).  Load the menu VM, then close through IT: first
// toggle opens our menu, second closes it and hands the keys to the game.
menu_restart
waitms 500
ui_close              // m_toggle(1) only opens; ui_close is the way back
waitms 500

echo === identity mirrors (want: cl_pcolour 1..12, the hash is on the panel,
 echo === it rides a star infokey now -- a stuffed set latches and cvar_string
echo === reads the latch, so there is no console cvar to print any more):
cl_pcolour

echo === chat, three lines, two seconds apart:
cmd say first line
waitms 2000
cmd say second line
waitms 2000
cmd say ^3third line has its own colour
waitms 1000
// the draft's own submit route, verbatim: quoted cvar then
// cmd say $var -- a ; inside must survive as plain text
set cl_safetmp "safetmp route works; semicolons stay"
cmd say $cl_safetmp
waitms 1000
screenshot p340a_chat

echo === pick colour 5 and the long trail + glow:
setinfo lobbycolor 5
setinfo lobbyfx 9
waitms 2500
echo === cl_pcolour must now read 5:
cl_pcolour

echo === customizer panel:
hud_player open
waitms 800
screenshot p340a_custom
hud_player close

echo === board + room list:
scores open
waitms 1500
screenshot p340a_players
scores close

waitms 500
quit
