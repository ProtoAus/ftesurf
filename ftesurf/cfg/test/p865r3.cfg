// Patch 865 review round 3 arm, listen server, through tools/runlines_smoke.py:
//   python tools/runlines_smoke.py ftesurf/cfg/test/p865r3.cfg --mount --timeout 400 \
//     --ssqc <qwprogs> --csqc <csprogs> --mqc <menu> --output-dir <task root>/artifacts
// Control: the round-2 build.  bhop_cheesemania is a bhop map: a START re-entered while
// running arms only at the jump.
//   E out to *29 (gravity 0.33, the run starts), then put east of the spawn and walked
//     west INTO the START (a setpos or a drop inside it counts as a map teleport, which
//     re-arms like `!r` and resets in both builds).  Subject: the reset prints on the
//     walk-in with no re-arm line; round 2 prints nothing (no arm, no jump).
//   R *29 again, then `!r`: both builds reset (round 2 at the arm, round 3 on the entry).
cfg_save_auto 0
log_enable 1
log_dir logs
log_name runlines_smoke
con_notifytime 0
cl_idlefps 0
cl_maxfps 100
vid_vsync 0
vid_fullscreen 0
vid_width 1280
vid_height 720
sv_public 0
set run_resume 0
developer 1
log_developer 1
waitms 1500

map bhop_cheesemania
waitmap 120
waitms 6000
menu_restart
ui_close
waitms 500
echo ==== E1 walk into the start from 400 east ====
setpos 6166 1690 -3590 0 0 0
waitms 1500
setpos 2576 2688 70 0 180 0
waitms 500
+forward
waitms 2500
-forward
waitms 500
echo ==== E2 walk into the start from 700 east ====
setpos 6166 1690 -3590 0 0 0
waitms 1500
setpos 2876 2688 70 0 180 0
waitms 500
+forward
waitms 3500
-forward
waitms 500
echo ==== R gravity then !r ====
setpos 6166 1690 -3590 0 0 0
waitms 1500
say !r
waitms 1500
echo RUNLINES COMPLETE
quit
