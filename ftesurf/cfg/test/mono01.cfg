// MONO01 -- Build 4, surf_monolith.  OBSERVE ONLY.  No code, no edits, no fix.
//
// The plan is explicit that this run comes before any change, and that one of
// the four readings is DESTROYED by the obvious next step:
//
//   "fs_cache: surf_monolith, N files" and the "not proven:" lines.
//   CAPTURE BEFORE fs_cache_clear -- clearing destroys the only artefact.
//
// So this cfg deliberately does NOT call fs_cache_clear, and must not be edited
// to.  If a later run needs a cold cache, take that reading in a SEPARATE run
// after this log is safely on disk.
//
// The four things being read, and what each would mean:
//
// 1. sky "sky138a": rt,bk,lf,ft,up,dn = ...   (gl_shader.c:1004)
//    Printed at load.  m=material, f=filename, X=MISSING.
//    The content is PROVABLY PRESENT -- all six sky138a faces are in the map's
//    own pak with both .vmt and .vtf, and the VMTs are trivial UnlitGeneric.  So:
//      six names  -> the sky LOADED and the fault is downstream (r_fastsky,
//                    forcedsky), which is a different bug entirely.
//      any X      -> the sky PATH cannot find assets that are demonstrably in
//                    the pak.  That is the interesting one, and it is the only
//                    case in which the gl_warp.c r_blackimage/missing_texture
//                    fix in the plan is justified.
//
// 2. "N material(s) did not resolve" + hl2_unresolved / hl2_unresolved_visible.
//    EXPECT 44.  A different number means the measurement this build is based on
//    has moved and the mapdeps entry should not be written until it is understood.
//    hl2_missing separates "named in texdata but on no drawn face" (invisible,
//    harmless) from "on something you can actually look at".
//
// 3. fs_automount_state / fs_automount_spec.
//    0 = needs no pack, 1 = its pack is mounted, 2 = served from the asset cache,
//    3 = names a pack that is NOT installed, 4 = unknown (automount off, or no
//    data/mapdeps.txt entry).  The 44 unresolved materials all resolve their
//    $basetexture to shared game content -- de_train, de_nuke/hr_nuke, cs_havana,
//    cs_italy, de_aztec/hr_aztec, concrete/hr_c, metal/hr_metal, asphalt/hr_c --
//    and the hr_ families are CS:GO.  If this reads 4, surf_monolith simply has
//    no mapdeps.txt line and the fix is one data entry, not code.
//
// 4. fs_cache_info and the "fs_cache: ... not proven:" Con_DPrintf lines, which
//    is why developer 1 AND log_developer 1 are both set.

log_enable 1
log_dir "logs"
log_name "mono01"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
con_notifylines 0
developer 1
log_developer 1

wait 200

// Read the filesystem state BEFORE the map load too, so the delta is visible.
echo ^5=== PRE-LOAD filesystem state ===
fs_automount_state
fs_automount_spec
fs_assetcache
fs_cache
waitms 300

echo ^5=== loading surf_monolith ===
map surf_monolith
waitmap 2400
waitms 10000

echo ^5=== POST-LOAD: automount ===
fs_automount_state
fs_automount_spec
waitms 300

echo ^5=== POST-LOAD: unresolved materials (expect 44) ===
hl2_unresolved
hl2_unresolved_visible
waitms 300
hl2_missing
waitms 1200

echo ^5=== POST-LOAD: asset cache (do NOT clear) ===
fs_cache_info
waitms 800

echo ^5=== ladder default check (expect pm_ladders 1) ===
pm_ladders
waitms 300

// Visual evidence: one shot looking at the world, one straight up at the sky.
echo ^5=== screenshots ===
setpos 0 0 0 0 0 0
waitms 1500
screenshot mono01_spawn
waitms 800
setpos 0 0 0 0 0 -89
waitms 1200
screenshot mono01_sky
waitms 800

echo ^5=== mono01 done ===
wait 30
quit
