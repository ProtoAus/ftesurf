// BUILD 25 stage 1 -- the save-lock rebuilt, the serverinfo cap, the ramp
// instrument, and the open segment across a save.
//
// WHAT THIS CAN AND CANNOT PROVE.  A config cannot surf, so nothing here rides a
// ramp: the ramp report will read `ticks 0` throughout and that is the correct
// answer for a player standing on flat ground, not a failure.  What it CAN do is
// exercise every path that does not need a mouse -- the save list at three
// digits, the new commands, the serverinfo publish, the open-segment round trip
// through both the warm snapshot and the cold file, and the replay reader's new
// rates against a synthetic v4 recording.
//
// `wait 200` BEFORE `map` is not optional -- exec INSERTS its text at the front
// of the command buffer, so a waitmap with no wait ahead of it blocks the very
// buffer the map load is queued in.  Build 19 lost three launches to that.

developer 1
log_developer 1
cfg_save_auto 0

wait 200
map surf_aesthetic
waitmap 90

echo ""
echo "=== 1. serverinfo maxfps -- the cap that bounds cl_netfps ==="
// Absent, the client falls back to 72 and CL_FilterTime clamps the USERCMD rate
// to it (cl_input.c:2286).  66.6667 sits under 72, so this changes nothing today
// and everything at 100 tick.  The key has to be PRESENT and 1000.
serverinfo
echo ""

echo "=== 2. the save list, at three digits ==="
// A clean start: build 25 widened the folder name and the old two-digit states
// were deleted with the build, so this should open empty.
cmd sl_list
wait 5

// setpos rather than +forward: surf_aesthetic's start box runs a long way in the
// direction zone_goto faces, and 3 seconds of walking does not leave it.  Build
// 24 made setpos taint rather than void, so the clock runs and the recorder is
// open -- which is what gives the saves below something to carry.
zone_goto 0
wait 10
setpos -15200 200 1100
wait 20
cmd timer
wait 5

cmd sl_save
wait 10
cmd sl_save
wait 10
cmd sl_save
wait 10
cmd sl_list
wait 5
echo ""

echo "=== 3. the four navigation commands ==="
// All four move the cursor AND load.  sl_goto is the console's own way in and
// does not move the cursor's meaning, so the list line after each is the check.
cmd sl_first
wait 8
cmd sl_list
wait 3
cmd sl_last
wait 8
cmd sl_list
wait 3
cmd sl_prev
wait 8
cmd sl_list
wait 3
cmd sl_next
wait 8
cmd sl_list
wait 3
echo ""

echo "=== 4. sl_load acts on the CURSOR, which is the reported bug ==="
// Step to the first save, then load.  Before build 25 the menu-closed key sent
// sl_loadlast, which read the list LENGTH -- so this sequence would have landed
// on save 3.  sl_loadlast no longer exists; asking for it must say so.
cmd sl_first
wait 8
cmd sl_load
wait 8
cmd sl_list
wait 3
cmd sl_loadlast
wait 5
cmd sl_dellast
wait 5
echo ""

echo "=== 5. the ramp instrument ==="
// Flat ground, so every counter is legitimately zero.  What this proves is that
// the line EXISTS and its fields parse -- the numbers need a ramp and a mouse.
cmd timer
wait 5
echo ""

echo "=== 6. delete-all ==="
cmd sl_list
wait 3
cmd sl_delall
wait 15
cmd sl_list
wait 5
echo ""

echo "=== 7. the replay reader's new rates, on a v4 fixture ==="
replay data/testrun/ramp_drop.rec
wait 20
replay status
wait 5
replay seek 0.5
wait 10
replay status
wait 5
hud_watch_info 1
wait 20
replay seek end
wait 10
replay status
wait 5
replay stop
wait 10
hud_watch_info 0
echo ""

echo "=== 8. regressions ==="
pm_selftest
wait 10
zone_selftest
wait 10
echo ""

echo "=== b25a done ==="
wait 20
quit
