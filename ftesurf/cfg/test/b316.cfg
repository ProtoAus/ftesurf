// Engine Patch 316: does a QC write reach the disk before fclose?
//
// TWO ARMS, AND THE CONTROL IS THE POINT.  FILE_WRITE (2) is the mode the run
// recorder would have used and is the reason it does not: it grows a malloc'd
// buffer and hands the whole thing to COM_WriteFile at fclose, so the file is
// ZERO BYTES on disk for the entire life of the handle.  FS_FILE_WRITESTREAM
// (9) is the new mode and must be full size while still open.
//
// The measurement is NOT in here.  Nothing inside the engine can tell the two
// apart -- fseek reports the same position, the same lines went in, and both
// read back correctly after close -- so the run script polls the two files from
// the shell during the HOLDING windows this config opens.
//
// PREDICTION:
//   data/b316_buffered.txt   0 bytes (or absent) while HOLDING, ~100 KB at CLOSED
//   data/b316_stream.txt     ~100 KB while HOLDING, unchanged at CLOSED
//   both files' line 0 reads "XXXXX ..." -- the seek-back rewrite landed, which
//   is what lets the recorder reserve a header field and correct it at the end
//
// FALSIFIED IF: the two arms measure the same during HOLDING (either the patch
// did nothing, or the harness is not looking in the window), or line 0 comes
// back unrewritten on the stream arm (fseek does not reach a VFS handle), or
// fopen returns -1 for mode 9 (this engine is not the patched one).
//
// See b66pop.cfg for why menu_restart is here and why the first wait is long.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name b316
log_developer 1
developer 1

waitms 20000
menu_restart
waitms 3000

echo ^5==== b316: CONTROL, the buffered mode the recorder cannot use ====
ui_fstream open buffered
waitms 14000
ui_fstream close
waitms 3000

echo ^5==== b316: ARM, the streaming mode ====
ui_fstream open stream
waitms 14000
ui_fstream close
waitms 3000

echo ^5==== b316: done ====
quit
