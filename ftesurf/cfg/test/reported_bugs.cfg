// Board strokes and their independently enabled name/number labels.
cfg_save_auto 0
con_savehistory 0
log_enable 1
log_dir logs
log_name runlines_smoke
log_readable 1
con_notifylines 0
con_notifytime 0
cl_idlefps 0
cl_maxfps 100
sv_public 0
set lobby_enable 0
set lobby_dir ""
set lobby_master ""
set cl_board_url ""
set cl_run_upload 0
set rec_upload 0
set run_resume 0
vid_fullscreen 0
vid_width 1280
vid_height 720
waitms 2000
map surf_voyager
waitmap 60
waitms 5000
menu_restart
ui_close
set hud_scale 2
set hud_linegraph 0
set hud_lines_order 4
set hud_lines_color_others 5
set hud_lines_nums 2
set hud_lines_marks 1
set hud_lines_marked 64
set hud_lines_declutter 0
set hud_lines_label_far 3000
set hud_lines_speed 1
set hud_lines_energy 1
set hud_lines_vz 0
set hud_lines_delta 0
set hud_lines_time 0
set hud_lines_names 1
set hud_linegraph_labels 1
set hud_watch_path 0
set hud_lines_demo 0
replay cfg/test/p492voy.rec
waitms 3000
replay pause
replay seek 20
waitms 1000
scores lines clear
scores lineat 5 cfg/test/p492voy.rec
waitms 3000
set hud_lines_board 1
waitms 600
echo ==== REPORTED PATH ON ====
linegraph status
lines native
screenshot reported_path_on.png
set hud_lines_board 0
waitms 600
echo ==== REPORTED PATH OFF ====
linegraph status
lines native
screenshot reported_path_off.png
set hud_lines_nums 0
set hud_linegraph_labels 0
waitms 600
echo ==== REPORTED LABELS OFF ====
linegraph status
screenshot reported_labels_off.png
set hud_lines_nums 2
set hud_lines_board 1
set hud_linegraph_labels 0
set hud_lines_order 0
set hud_lines_label_far 0
replay marks 5
replay seek 6
waitms 600
screenshot reported_boarding.png
echo RUNLINES COMPLETE
quit
