// cfg_save_auto 0 FIRST: this run sets archived cvars and must never write them
// into ftesurf.cfg (cl_main.c:2535).
cfg_save_auto 0

// ===========================================================================
//  B89JOIN -- does joining a lobby fetch the map first?
//    python tools/b89join.py
//
//  Lex, kicked from a public lobby on surf_rookie: "can it just download the
//  latest to the game directory automatically when connecting to a public lobby
//  and there's a disagreement on map files".  ui_prejoin is that, and this is
//  whether it works.
//
//  THREE CASES, AND THE TWO THAT MUST NOT HOLD MATTER AS MUCH AS THE ONE THAT
//  MUST.  A pre-join check that holds the connect when it should not is a
//  player who cannot join anything.
//
//    arm 1  a map this box HAS, size agreeing with the Pi  -> held=0, no fetch
//    arm 2  a name no list has at all                      -> held=0, no fetch
//    arm 3  a map this box does NOT have                   -> held=1, fetches,
//                                                             then connects
//
//  Arm 3 is against the REAL mirror on the Pi, because that is the thing being
//  claimed -- a stub would prove the state machine and not the feature.  The
//  address is 127.0.0.1:27699, a port nothing listens on: the connect it issues
//  fails, which is fine, because what is under test is that it was ISSUED.
//
//  ui_prejoin calls ui_load_maps itself, so there is no ui_maplist here -- but
//  the lazy-load trap is the same one p466reget records and is worth knowing.
// ===========================================================================

log_enable 1
log_dir logs
log_name b89join
log_developer 1
developer 1

// FORTY SECONDS, THEN menu_restart -- menu.dat loads lazily and nothing in a
// scripted run needs a menu, so without this every arm prints
// `Unknown command "ui_prejoin"`.
waitms 40000
menu_restart
waitms 4000

echo ^5==== b89join arm 1: a map we have, and agree about ====
ui_prejoin surf_ace
waitms 2000

echo ^5==== b89join arm 2: a map that does not exist ====
ui_prejoin surf_no_such_map_anywhere
waitms 2000

echo ^5==== b89join arm 3: a map we do not have ====
ui_prejoin bhop_back_and_forth
waitms 3000

// Across the transfer.  562 KB from the Pi at its 1 MB/s cap is about a second,
// but the poll is what proves the hand-off rather than the wait.
waitms 3000
ui_dlmap
waitms 3000
ui_dlmap
waitms 3000
ui_dlmap
waitms 3000
ui_dlmap

echo ^5==== b89join arm 4: settled ====
dir maps/bhop_back_and_forth.bsp
waitms 1000

quit
