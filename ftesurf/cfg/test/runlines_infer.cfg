// Private overlay (tools/runlines_smoke.py).  Inferred ramp contact on an
// imported run, graded by tools/test_runlines_infer.py against tools/rampinfer.py.
//   --recording  the owner's re-imported Momentum run of surf_voyager's main track
//                (data/momentum/surf_voyager/main/, `momdemo` in its header)
// Two tracked files beside this one: p492voy.rec, that same run flown again by this
// engine (a native recording, bit 16 measured), and momflag.rec, an import with no
// `momdemo`.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name runlines_smoke
con_notifytime 0
cl_idlefps 0
cl_maxfps 100
set hud_watch_skipidle 0
set hud_watch_path 1
set hud_lines_board 1
set hud_lines_order 0           // Patch 624's window is the draw's; a board line is read whole here
waitms 2000
map surf_voyager
waitmap 60
waitms 4000
menu_restart
ui_close
hud_lines_marks 1
hud_lines_nums 1
hud_lines_speed 1
hud_lines_energy 0
hud_lines_names 1
hud_lines_vz 0
hud_lines_delta 0
hud_lines_time 1
hud_lines_numsize 18
hud_lines_declutter 0
echo ==== IMPORT ====
replay cfg/test/runlines_sample.rec
waitms 2500
replay pause
replay seek 20
waitms 1000
replay status
replay marks 0
replay seq
replay colours 0 2
replay marktrace 2
waitms 1000
screenshot runlines_infer.png
// The playhead's own contact twice more: in the air between two rides, and
// standing on the ground the run lands on at 46.6 s.
replay seek 6
waitms 600
echo ---- AIR ----
replay status
replay seek 46.8
waitms 600
echo ---- GROUND ----
replay status
echo ==== BOARDLINE ====
scores lineat 1 cfg/test/runlines_sample.rec
waitms 4000
scores lines
replay marks 1
scores lines clear
echo ==== NATIVE ====
replay stop
waitms 300
replay cfg/test/p492voy.rec
waitms 2500
replay pause
replay seek 20
waitms 1000
replay status
replay marks 0
replay seq
replay marktrace 2
waitms 1000
screenshot runlines_infer_native.png
echo ==== UNAVAILABLE ====
replay stop
waitms 300
// No wait before the prints: a replay of another map's file (this one is
// surf_skatelife's) is closed on its first frame.
replay cfg/test/momflag.rec
replay status
replay marks 0
replay seq
scores lineat 3 cfg/test/momflag.rec
waitms 3000
replay marks 3
echo RUNLINES COMPLETE
quit
