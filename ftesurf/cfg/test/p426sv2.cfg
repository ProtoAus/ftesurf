// P426SV2 -- p426sv.cfg at run_evidence_ul 2 (the journal is asked for too):
// a kept abandon's receipt must ask for NO upload (Patch 426 round 5).
// A lobby-mode DEDICATED server, because a kept-evidence abandon needs a posted
// stage (Lobby_SubmitStage) and a remote client (the sidecar upload).
// Run from C:\FTESurf with cfg/test/p426.zones.json copied to
// ftesurf/maps/zones/local/surf_666.json (DELETE IT AFTER -- it shadows the
// shipped zones), against `python surfd/b65stub.py cert 8131`:
//   C:\FTEQuake\fteqwsv64.exe +set sv_port 27632 +set sv_public 0
//     +set lobby_master "http://127.0.0.1:8131" +exec cfg/test/p426sv.cfg
// then p426cl.cfg in a client.  Server log: logs/p426sv.log.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p426sv2
developer 1
exec cfg/lobby/lobby.cfg
sv_cheats 0
set lobby_master "http://127.0.0.1:8131"
sv_guidkey "ftesurf-p426-probe"
sv_maxrate         0
sv_maxdownloadrate 0
set lobby_master_key  "stub-key-not-a-real-one"
set lobby_master_rate 30
set run_evidence_ul 2
map surf_666
waitms 150000
quit

