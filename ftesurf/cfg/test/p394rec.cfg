// P394REC -- Patch 394: a recorded run that crosses a trigger_teleport_relative.
// surf_sirius with the fixture zones cfg/test/p394rec.zones.json copied to
// maps/zones/local/surf_sirius.json for the run (and removed after): the start
// zone sits over the drop into a relative trigger (p394b S1), the end zone
// around its landing.  (surf_4am's box *9 is a sealed closet, reachable only by
// `!s`.)  data/runs/surf_sirius does not exist before the run; it is removed.  Listen server, sv_cheats 0.  Run NEW and
// CONTROL (+set sv_progs qwprogs394ctl) with +set log_name; copy each finish's
// .rec to data/p394/{new,old}.rec.  p394verify.cfg replays them.
//
// PRE-REGISTERED
//  R1 both arms finish: zone_goto 0 drops the body out of the start zone into the
//     relative trigger, which puts it in the end zone (NEW) -- CONTROL lands
//     elsewhere (p394b S1: -1328 -864), so CONTROL may not finish.
//  R2 new.rec holds exactly one `warp telerel` whose velocity is 0 0 0 and
//     whose origin is the trigger centre + offset (then rests at -384 -832 -512);
//     old.rec's telerel (if kept) carries entry origin + offset and the fall speed.
//  R3 tools/reccheck.py: 0 faults on both.
// FALSIFIED IF any fails.
//
// RESULT (2026-09-20).  surf_4am's box was run 1 (the approach is a pit: it fell
// to -5728 and never touched the box); surf_sirius from run 2.  With the end zone
// 128 tall the warp was the final packet; it is 40 tall now, so 20 rows follow.
//   R1 NEW finished, 50 ticks (data/p394/new.rec); CONTROL landed at
//     (-1329,-863,-1920) and did not finish -- no old.rec.
//   R2 `warp 30 346 30 telerel -384 -832 -448 0 0 0 0`: centre + offset, velocity 0.
//   R3 reccheck: 0 faults.
cfg_save_auto 0
log_enable 1
log_dir logs
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
sv_cheats 0
fs_missingwarn 0
set run_resume 0
sv_port 27682

wait 200
map surf_sirius
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 1000
zone_list
echo ^5=== p394rec run ===
cmd zone_goto 0 270 0
waitms 3000
cmd viewpos
cmd timer
waitms 1500
cmd viewpos
cmd timer
waitms 2500
echo ^5=== p394rec DONE ===
waitms 500
quit
