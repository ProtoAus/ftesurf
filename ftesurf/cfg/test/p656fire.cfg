// cfg_save_auto 0: this run sets archived cvars; never let it write them into ftesurf.cfg
cfg_save_auto 0
// p656fire -- env_fire's smoke, the floor it is lit on, and its reach (Patch 656).
// tools/p656fire.py grades the log and the pictures.
// surf_road_to_hell: 106 fires of all four sizes, every one with smoke and "Don't drop".
//   S  as it is: "smoke over 106 fires, 10 of 10 smoke effects answering"; three shots of a
//      medium fire (vistasmokev1) under a pale sign
//   L  beside a large fire, K beside a small one: the engine's count of their smoke particles
//   N  vbsp_emit_firesmoke 0, S's three shots again: what its smoke is measured against
// surf_dune: 65 fires, 64 of them tiny (smoke1), all "Don't drop".
//   U  still without smoke, three shots of one brazier; T, the same with it
// surf_lost2: 178 fires over func_brush pedestals 24 units under them.
//   B  "178 lit on what is under them", and by how much
// surf_anubis: 161 fires, none nearer than 2,800 units to a spawn.
//   R  6,000 units straight above a large fire, looking down at it, torches off: two shots,
//      then one with vbsp_emit_fire 0 once the flames have gone (the limit was 4,000)
// surf_classics2: 233 fires, none with spawnflags 16.
//   D  "233 lit on what is under them"; two shots of where the one lit 565 units under its
//      entity burns (before 656 it burned up there, out of this view)
// Shots are 2.5 s apart: see cfg/test/p643fire.cfg.
log_dir "logs"
log_name "p656fire"
log_enable 1
developer 1
log_developer 1
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000
cl_maxfps 100
cl_idlefps 0
sv_cheats 1
r_bloom 0
con_notifylines 0
scr_sshot_type png
fov 90
wait 200
map surf_road_to_hell
waitmap 600
waitms 2000
menu_restart
ui_close
set hud_speed 0
set hud_energy 0
set hud_keys 0
set vbsp_emit_dust 0
noclip
setpos -5582 2969 10567 5 90 0
waitms 8000
echo ^5=== S smoke
emit_list
r_partinfo
screenshot p656fire_s1
waitms 2500
screenshot p656fire_s2
waitms 2500
screenshot p656fire_s3
waitms 800
setpos -14048 -177 6300 5 90 0
waitms 7000
echo ^5=== L large
r_partinfo
waitms 300
setpos 540 2807 -13291 -15 -25 0
waitms 7000
echo ^5=== K small
r_partinfo
waitms 300
echo ^5=== N none
set vbsp_emit_firesmoke 0
map surf_road_to_hell
waitmap 600
waitms 2000
menu_restart
ui_close
set hud_speed 0
set hud_energy 0
set hud_keys 0
noclip
setpos -5582 2969 10567 5 90 0
waitms 8000
emit_list
screenshot p656fire_n1
waitms 2500
screenshot p656fire_n2
waitms 2500
screenshot p656fire_n3
waitms 800
echo ^5=== U dune without
map surf_dune
waitmap 600
waitms 2000
menu_restart
ui_close
set hud_speed 0
set hud_energy 0
set hud_keys 0
noclip
setpos -11606 15997 14790 10 0 0
waitms 8000
emit_list
screenshot p656fire_u1
waitms 2500
screenshot p656fire_u2
waitms 2500
screenshot p656fire_u3
waitms 800
echo ^5=== T dune with
set vbsp_emit_firesmoke 1
map surf_dune
waitmap 600
waitms 2000
menu_restart
ui_close
set hud_speed 0
set hud_energy 0
set hud_keys 0
noclip
setpos -11606 15997 14790 10 0 0
waitms 8000
emit_list
r_partinfo
screenshot p656fire_t1
waitms 2500
screenshot p656fire_t2
waitms 2500
screenshot p656fire_t3
waitms 800
echo ^5=== B brush floors
map surf_lost2
waitmap 600
waitms 2000
menu_restart
ui_close
waitms 3000
emit_list
waitms 300
echo ^5=== R reach
map surf_anubis
waitmap 600
waitms 2000
menu_restart
ui_close
set hud_speed 0
set hud_energy 0
set hud_keys 0
set vbsp_emit_stack 0
noclip
setpos -896 3456 3837 90 0 0
waitms 8000
emit_list
screenshot p656fire_r1
waitms 2500
screenshot p656fire_r2
waitms 800
set vbsp_emit_fire 0
waitms 5000
screenshot p656fire_r0
waitms 800
set vbsp_emit_fire 1
set vbsp_emit_stack 1
echo ^5=== D drop
map surf_classics2
waitmap 600
waitms 2000
menu_restart
ui_close
set hud_speed 0
set hud_energy 0
set hud_keys 0
noclip
setpos 12823 11950 12250 5 90 0
waitms 8000
emit_list
screenshot p656fire_d1
waitms 2500
screenshot p656fire_d2
waitms 800
echo RIGDONE
quit
