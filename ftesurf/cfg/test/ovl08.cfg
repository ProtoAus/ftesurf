// OVL08 -- the new gfx_menu Overlays row, driven through the menu's own console
// handle rather than by pressing digits at it.
//
// `gfx_menu cycle 13` goes through the REAL Gfx_Cycle path -- seta and all --
// so this tests the row as the user will use it, not a shortcut around it.
//
// Sequence: baseline -> cycle the row (On -> Off) -> retry -> the count must
// drop to "none placed".  Then cycle back and retry, and it must return.  That
// is the whole claim: the row responds to key 7, which hl2_overlays cannot.

log_enable 1
log_dir "logs"
log_name "ovl08"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
sv_cheats 1

wait 200
vbsp_overlays 1
map surf_rise
waitmap 1800
waitms 4000

echo ^5=================== the whole table, with inert reasons ==================
gfx_menu status
waitms 800

echo ^5=================== page 3, where the new row lives ======================
gfx_menu page 3
waitms 800
screenshot ovl08_page3

echo ^5=== cycle row 13 (Overlays) On -> Off, then reload ===
gfx_menu cycle 13
waitms 300
vbsp_overlays
retry
waitmap 1800
waitms 4000

echo ^5=== cycle row 13 back Off -> On, then reload ===
gfx_menu cycle 13
waitms 300
vbsp_overlays
retry
waitmap 1800
waitms 4000

echo ^5=== ovl08 done ===
wait 30
quit
