// Patch 386: Linux library names, the GLX preference and Steam search paths.
// Run in the Debian rig (runtime libraries only, no -dev symlinks) with tools/linux/rig-run.sh:
//   rig-run.sh <install> x11|wayland|default <log_name> cfg/test/p386lin.cfg
// Pre = a 3dd8f93c5 build, post = the 386 build.  Pre-registered:
//   x11      pre "XRandR library not available."; post has no such line.
//   wayland  pre "libEGL library not loadable" then no video mode; post "OpenGL (Wayland) renderer initialized".
//   default  (both displays set, default.cfg's line) post "OpenGL renderer initialized" (GLX), not Wayland.
//   steam    HOME set to one layout each (plain / snap / debian-installation / XDG_DATA_HOME / none):
//            pre resolves only plain; post resolves all four and prints the vdf it found; none stays NOT FOUND.
// Control: the Ubuntu-22.04 distro (dev symlinks present) prints the same x11/wayland lines pre and post.
// Result 2026-09-19 (Debian 13 rig, portable builds 3dd8f93c5 vs 23f1ce06b = 386's code): all as
//   predicted -- x11 pre XRandR-na 2 lines, post 0; wayland pre libEGL not loadable, post Wayland
//   initialized; default GLX on both, and with +set vid_renderer "" (the no-line control) Wayland.
//   steam pre ok=3 only for plain; post ok=3 for plain/snap/deb/xdg, each prints its vdf; none: NOT FOUND.
//   The VidMode line printed in no arm (vacuous).  The Ubuntu dev-symlink control was not run.
cl_idlefps 0
cl_maxfps 100
waitms 2000
echo ======== P386 renderer
vid_renderer
echo ======== P386 steam
fs_steamlibs
echo ======== P386 done
quit
