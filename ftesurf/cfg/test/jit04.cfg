// BUILD 47 / ENGINE PATCH 269 -- where does a standing player's velocity come
// from?
//
// jit02 and jit03 established the SHAPE and the SOURCE, and both stand:
//   * standing still after a tap, the predicted position is frozen to three
//     decimals forever while the predicted velocity flickers 0 <-> ~0.6;
//   * hud_predicted 0 (the server's own velocity stat) is clean over 300
//     frames, hud_predicted 1 is not, A/B/A 100 / 0 / 104.
//
// So it is the client's prediction.  What NEITHER run could see is why, because
// pmove_vel is the very last value the prediction produces -- CSQC is handed the
// answer, not the arithmetic.  THREE separate mechanisms were proposed from
// reading cl_pred.c and cl_input.c and all three are refuted by the source:
//
//   1. "the pending command keeps a stale forwardmove after a send."  It does
//      keep it -- cl_input.c:3457-3464 clears only msec and impulse -- but
//      CL_AccumlateInput's nscale (cl_input.c:1893) is 1 whenever cmd->msec is
//      0, so the very next accumulate frame REPLACES forwardmove outright.
//   2. "the extrapolation replays the last SENT command, which still carries
//      the key."  It does fall back to that (cl_pred.c:1394-1397), but a sent
//      command's forwardmove reaches 0 within one command frame of the release,
//      and the flicker persists indefinitely.
//   3. "a partial tick of friction manufactures speed."  Friction only removes,
//      and Source zeroes a sub-stopspeed velocity outright.
//
// A fourth guess would be worth nothing.  cl_predtrace is the instrument that
// replaces guessing: it dumps, per RENDERED frame, how many commands were
// replayed, whether the extrapolated partial command ran and which usercmd it
// copied, that command's movement values, the two velocities being blended, the
// blend fraction, and the simvel/simorg CSQC will be handed.
//
// READ THE DUMP LIKE THIS:
//   * simvel non-zero while fromvel and tovel are both zero -> the BLEND is
//     inventing it (impossible arithmetically, so it would mean simvel is being
//     written somewhere else entirely).
//   * tovel non-zero with `extrap none` -> the replay loop produced it, and the
//     extrapolation is innocent; the bug is in the mover or the seeding.
//   * tovel non-zero with `extrap pending/lastsent` and cmd fwd/side NON-ZERO
//     -> confirms an input residual after all, and names which cmd carries it.
//   * tovel non-zero with cmd fwd/side ZERO -> the partial tick itself is
//     manufacturing velocity out of no input, which points at pm_source.c's
//     tick accumulator rather than at cl_pred.c's command choice.
//
// Section A is the control that jit02 never isolated: NEVER TOUCH A KEY.  If A
// already flickers, the tap is irrelevant and every input-residual theory dies
// at once.  Section B is the reported gesture.

log_developer 1

waitms 2000

map surf_colin_blaster_69000
waitmap 240
wait 60

cl_idlefps 0
cl_maxfps 0
hud_debug 1
hud_speed 1
wait 60

echo ^5=== how fast are we actually rendering?
show_fps 1
wait 120

echo ^5=== A: NEVER TOUCHED.  Control -- does this need a tap at all?
cl_predtrace 100
wait 300

echo ^5=== A-vel: the CSQC view of the same moment, for cross-checking
hud_veltrace 60
wait 200

// waitms, not wait: `wait` counts FRAMES, and at the uncapped framerate this
// run exists to reproduce, a 20-frame tap is ~14ms and need not span even one
// 15ms command.  The gesture has to be wall-clock or it is not the gesture.
echo ^5=== B: tap forward, release, wait, THEN trace -- the reported gesture
+forward
waitms 250
-forward
waitms 1000
cl_predtrace 200
wait 500

echo ^5=== B-vel: the CSQC view again
hud_veltrace 60
wait 200

echo ^5=== END OF RUN ===
wait 20
quit
