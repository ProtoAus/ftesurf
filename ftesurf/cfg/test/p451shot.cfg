// P449SHOT -- what the marks LOOK like, which no count establishes, plus the
// hud_edit pane the house rule asks for (registercvar + HE_OptDef row + a `set`
// line in default.cfg).  Screenshots: a ramp exit and a bhop chain, marks on
// and off, so the difference is the patch rather than the view.
log_enable 1
log_dir "logs"
log_name p451shot
developer 0
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0
sv_public 0
sv_port 27711
set lobby_dir ""
set hud_watch_skipidle 0
wait 200
map surf_aesthetic
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 1000
replay data/runs/surf_aesthetic/main/0005191_pb.rec
waitms 1500
replay pause
replay seek 40
waitms 1500
echo ^5=== p451shot marks off ===
hud_lines_marks 0
waitms 900
screenshot screenshots/p451shot_off.png
waitms 600
echo ^5=== p451shot marks and numbers on ===
hud_lines_marks 1
hud_lines_size 6
hud_lines_nums 2
hud_lines_speed 1
hud_lines_energy 1
hud_lines_ref 1
hud_lines_numsize 12
hud_seq_units 1
waitms 900
screenshot screenshots/p451shot_on.png
waitms 600
echo ^5=== p451shot window 6/2 ===
hud_lines_win 6
hud_lines_winf 2
waitms 900
screenshot screenshots/p451shot_win.png
waitms 600
hud_lines_win 0
hud_lines_winf 0
echo ^5=== p451shot hud_edit pane ===
hud_edit status
waitms 500
hud_edit lines
waitms 900
screenshot screenshots/p451shot_pane.png
waitms 600
hud_edit off
waitms 300
replay stop
waitms 300
quit
