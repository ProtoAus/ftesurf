// H4 -- is the far side dark because its lightmaps were never UPLOADED, or because
// the recursed view does not BIND them?
//
// H3 established that the recursion runs and draws the correct geometry: through
// portal_hub_exit you can see stage 1's red grid floor, and it differs from the
// portal-off control in 28% of pixels.  What is missing through the aperture is
// every surface that needs a lightmap -- the rainbow wall and the graded walls --
// while the self-illuminated NEONS/* grid lines come through fine.  Centre-of-frame
// brightness: 4.3 through the portal, 92.4 standing in the same room.
//
// Those two causes make OPPOSITE predictions, so one run separates them:
//
//   COLD  -- look through the portal having never been to stage 1.
//   WARM  -- walk into stage 1, look around so its surfaces are drawn in the MAIN
//            view, come back to the identical hub camera, and look again.
//
//   if WARM is lit and COLD is dark  -> lightmaps are uploaded lazily by the main
//                                       view only; the portal view never triggers it
//   if both are dark                 -> the recursed view does not bind lightmaps at
//                                       all, and visiting the room changes nothing
//
// h4_cold and h4_warm use the SAME camera, so they are directly differenceable.

cfg_save_auto 0
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "h4"
scr_sshot_type png
cl_yieldcpu 0
cl_maxfps 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0
r_voidvis 1
vbsp_portal_render 1

waitms 2500
map surf_kitsune
waitmap 240
waitms 8000
sv_cheats 1

echo "@@@ H4 COLD -- through the portal, never having been to stage 1"
setpos 0 -640 184 0 90 0
waitms 4000
screenshot_mega h4_cold 1280 720
waitms 600

echo "@@@ H4 visiting stage 1 in the main view"
setpos -15360 -15252 904 0 90 0
waitms 3000
screenshot_mega h4_visit1 1280 720
waitms 400
setpos -15360 -14800 904 0 90 0
waitms 2000
setpos -15360 -14000 904 0 270 0
waitms 2000
screenshot_mega h4_visit2 1280 720
waitms 400
setpos -15360 -13000 904 0 90 0
waitms 2000

echo "@@@ H4 WARM -- back to the identical hub camera"
setpos 0 -640 184 0 90 0
waitms 4000
screenshot_mega h4_warm 1280 720
waitms 600

echo "@@@ H4 WARM again, to show it is settled and not mid-upload"
waitms 3000
screenshot_mega h4_warm2 1280 720
waitms 600

echo "@@@ H4 DONE"
waitms 1000
quit
