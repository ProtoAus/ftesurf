// Patch 208 verification, part C -- cost only.
//
// Split out because g2b set r_speeds 0 at the top and never raised it, so every
// r_speeds_dump in that run answered "needs r_speeds 2 or higher" and the whole
// cost arm was lost.  The sampler only runs at 2.
//
// Interleaved, three passes, best of each read: a single sample on this engine
// is worthless -- repeated renders of an identical scene have measured a 14x
// spread -- and blocked arms put drift entirely on one side.

cfg_save_auto 0
developer 1
log_developer 1
cl_yieldcpu 0
cl_maxfps 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0
r_portalrecursion 2
r_portalmaxviews 2
r_portaldebug 0
vbsp_portal_render 1
r_portalscissor 1
r_speeds 2

waitms 2500
map surf_kitsune
waitmap 180
waitms 4000
sv_cheats 1

echo "### COST kitsune, 0 -765 97, 18 doors"
setpos 0 -765 133 0 90 0
waitms 3000
echo "--- warmup, discarded ---"
r_speeds_dump
waitms 800

echo "--- pass 1 ---"
echo "[scissor0]"
r_portalscissor 0
waitms 1000
r_speeds_dump
waitms 500
echo "[scissor1]"
r_portalscissor 1
waitms 1000
r_speeds_dump
waitms 500
echo "[portalsoff]"
vbsp_portal_render 0
waitms 1000
r_speeds_dump
waitms 500
vbsp_portal_render 1
waitms 500

echo "--- pass 2 ---"
echo "[scissor0]"
r_portalscissor 0
waitms 1000
r_speeds_dump
waitms 500
echo "[scissor1]"
r_portalscissor 1
waitms 1000
r_speeds_dump
waitms 500
echo "[portalsoff]"
vbsp_portal_render 0
waitms 1000
r_speeds_dump
waitms 500
vbsp_portal_render 1
waitms 500

echo "--- pass 3 ---"
echo "[scissor0]"
r_portalscissor 0
waitms 1000
r_speeds_dump
waitms 500
echo "[scissor1]"
r_portalscissor 1
waitms 1000
r_speeds_dump
waitms 500
echo "[portalsoff]"
vbsp_portal_render 0
waitms 1000
r_speeds_dump
waitms 500
vbsp_portal_render 1
waitms 500

echo "### COST tripportals, 116 doors"
map surf_tripportals
waitmap 240
waitms 8000
echo "[scissor1]"
r_portalscissor 1
waitms 1200
r_speeds_dump
waitms 500
echo "[scissor0]"
r_portalscissor 0
waitms 1200
r_speeds_dump
waitms 500
echo "[scissor1]"
r_portalscissor 1
waitms 1200
r_speeds_dump
waitms 500

// ---------------------------------------------------------------------------
// The two hook tests g2b THOUGHT it ran and did not.  Both were silent no-ops:
//   - r_shadow_realtime_world 1 logged "No lights detected in map", so
//     Sh_DrawLights returned at its own early-out, BEFORE the trailing
//     BE_Scissor(NULL) that is the entire reason the aperture clip had to become
//     an ambient one.  A light has to be MADE first.
//   - con_window 1 only puts the console in window mode; it still has to be
//     OPENED to draw anything, so the screenshot was of an ordinary frame.
// Run last, because both of them put things on screen.
// ---------------------------------------------------------------------------
echo "### HOOK1 rtlights with a light that actually exists"
map surf_kitsune
waitmap 180
waitms 6000
sv_cheats 1
r_speeds 0
setpos 0 -765 133 0 90 0
waitms 3000
screenshot_mega g2H_before_light 1280 720
waitms 500
r_editlights 1
waitms 400
r_editlights_spawn
waitms 400
r_shadow_realtime_dlight 1
r_shadow_realtime_world 1
waitms 2000
screenshot_mega g2H_rtlight_on 1280 720
waitms 800
r_editlights 0
r_shadow_realtime_world 0
r_shadow_realtime_dlight 0
waitms 800

echo "### HOOK2 2d scissor, console actually open"
con_window 1
waitms 400
toggleconsole
waitms 1500
screenshot_mega g2H_conwindow_open 1280 720
waitms 800
con_window 0
waitms 500

echo "### COST DONE"
waitms 800
quit
