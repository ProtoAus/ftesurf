// Private overlay, run by tools/p646wheel.py on p635board.py's surfd (bonus 2 of
// surf_voyager: 130 rows, so a second page exists).  Patch 646: the mouse wheel
// scrolls the board's lists while it is pinned and the cursor is over one, and
// scrolling is what asks for the next page.  Anywhere else it stays +jump.
// Graded from `scores status` (scroll: the list's top row), `board_status`
// (rows held), each `vote key` line's own `took`, and the row a click lands on
// (`scores: click row N`, a dprint).  515/516: wheel up/down.
cfg_save_auto 0
developer 1
log_developer 1
log_enable 1
log_dir logs
log_name runlines_smoke
con_notifytime 0
con_notifylines 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
vid_winmaximize 0
vid_width 1600
vid_height 900
vid_conautoscale 1
sv_public 0
waitms 2000
map surf_voyager
waitmap 60
waitms 4000
wait 4
menu_restart
ui_close
// menu_restart reloads consent: the synthetic test cvar goes after it (p545mom.cfg).
set rec_terms 4
set lobby_dir "http://127.0.0.1:27634"
set hud_scale 2
scores open
waitms 3000
wait 4
scores leg 2
waitms 3000
wait 4

echo ==== P646 START ====
scores status
board_status

// Pinned, the cursor on the filter switch: not a list, so the wheel is not taken.
echo ==== P646 OFF ====
hud_edit ui hover sb_flt
waitms 200
wait 4
vote key 516 1
vote key 516 0
waitms 200
wait 4
scores status

// A click with the cursor at rest in the middle of the list: the row there.
echo ==== P646 CLICK ====
hud_edit ui hover sb_online
waitms 200
wait 4
hud_edit ui down mouse1
waitms 100
hud_edit ui up mouse1
waitms 300
wait 4

echo ==== P646 DOWN ====
vote key 516 1
vote key 516 0
vote key 516 1
vote key 516 0
vote key 516 1
vote key 516 0
vote key 516 1
vote key 516 0
vote key 516 1
vote key 516 0
waitms 300
wait 4
scores status
// ...and a click there, the mouse not moved since: five rows further down.
hud_edit ui down mouse1
waitms 100
hud_edit ui up mouse1
waitms 300
wait 4

echo ==== P646 UP ====
vote key 515 1
vote key 515 0
vote key 515 1
vote key 515 0
waitms 300
wait 4
scores status

// Seventy notches on: the bottom row drawn comes within OB_MOREAHEAD of the 100
// held, and the list asks for the rest.
echo ==== P646 PAGE ====
alias p646ten "vote key 516 1; vote key 516 0; vote key 516 1; vote key 516 0; vote key 516 1; vote key 516 0; vote key 516 1; vote key 516 0; vote key 516 1; vote key 516 0; vote key 516 1; vote key 516 0; vote key 516 1; vote key 516 0; vote key 516 1; vote key 516 0; vote key 516 1; vote key 516 0; vote key 516 1; vote key 516 0"
p646ten
wait 4
p646ten
wait 4
p646ten
wait 4
p646ten
wait 4
p646ten
wait 4
p646ten
wait 4
p646ten
waitms 3000
wait 4
scores status
board_status
screenshot p646_paged.png

// Held, not pinned: no cursor, and the wheel is the player's.
echo ==== P646 HELD ====
scores close
waitms 400
+showscores
waitms 600
wait 4
vote key 516 1
vote key 516 0
waitms 200
wait 4
scores status
-showscores
waitms 400

echo ==== P646 CLOSED ====
vote key 516 1
vote key 516 0
waitms 200
echo ==== P646 END ====
echo RUNLINES COMPLETE
quit
