// Patch 386 rig (d)(2): p386case.cfg without r_imagelist, for the drvfs arms.  Under fs_cache 0
// on /mnt/c each listed image re-locates its file by linear scan over 9p (~0.22 s an image measured
// on bhop_eazy), and the cumulative listing would outrun a 30 min timeout; the load-time lines
// (hl2_missing, "did not resolve from any wad", Couldn't load, execs, fs:) are all kept.
// Predictions and results: p386case.cfg (P3).  Regenerate from p386case.cfg if that changes.
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
developer 1
log_developer 1
fs_loadstats 1
mod_warnmodels 1
waitms 3000
echo ======== P386CASE setup
version
fs_cache
path
fs_steamlibs
echo ======== P386CASE map bhop_eazy
map bhop_eazy
waitmap 180
waitms 12000
echo ======== P386CASE report bhop_eazy
mapname
hl2_unresolved
hl2_unresolved_visible
hl2_missing
echo ======== P386CASE end bhop_eazy
