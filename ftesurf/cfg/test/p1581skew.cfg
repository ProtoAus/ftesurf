cfg_save_auto 0
// P1581: pm_verify names the prop models a lobby failed to load beside a state/physents HOLD.
// python tools/p1581skew.py --exe <exe> --out <root>. Subjects are P349's b88fin.rec and its one-sample edit
// p349_samp.rec, each also with a `propmiss` header added (p1581_s/p1581_n).
log_enable 1
log_dir logs
log_name p1581skew
developer 0
set rec_enable 0
set rec_stream 0
cl_idlefps 0
cl_maxfps 100
waitms 6000
map bhop_eazy
waitmap 45
waitms 4000
echo ==== P1581 S ====
pm_verify data/b88fin.rec
waitms 1500
echo ==== P1581 SM ====
pm_verify data/p1581_s.rec
waitms 1500
echo ==== P1581 N ====
pm_verify data/p349_samp.rec
waitms 1500
echo ==== P1581 NM ====
pm_verify data/p1581_n.rec
waitms 1500
echo ==== P1581 END ====
quit
