cfg_save_auto 0

// ===========================================================================
// BUILD 65, ARM SET B -- the one question arm set A could not answer.
//
// Arm set A established:
//   * 32 channels are live on surf_tensor2 (21 field_loop3 + 9 dam_water + 2
//     of Quake's own ambience), and the vbsp_sound 0 CONTROL dropped it to 2 --
//     so the 30 ARE ours, conclusively.
//   * the backend is Creative's "Generic Software" OpenAL, AL_VERSION 1.1,
//     advertising AL_EXT_LINEAR_DISTANCE.
//   * s_al_distancemodel is 2 = Linear, which is the model build 64's falloff
//     arithmetic assumes -- so that arithmetic is right FOR THIS BACKEND.
//   * ch->vol[] is never written on the OpenAL path (OpenAL_ChannelUpdate
//     reads chan->master_vol at snd_al.c:940 and writes no per-channel volume),
//     so `soundinfo` files every channel as "inactive" and `s_show` reports
//     active=0.  NO VOLUME IS READABLE ON THIS BACKEND.
//
// WHAT IS STILL OPEN.  30 permanent channels existing is EXPECTED -- a static
// sound is a permanent client channel by design, and distance is supposed to
// silence the far ones.  Arm set A cannot tell whether that is happening,
// because the only numbers OpenAL exposes are the ones it does not fill in.
//
// THE TEST.  FTE's SOFTWARE mixer does fill them in: snd_dma.c:3836 calls
// SND_Spatialize and :3843 combines identical statics, neither of which runs
// under OpenAL (snd_dma.c:3828 hands the channel to the driver and continues).
// So switching the backend converts an unanswerable question into a printed
// number, at the same map and the same position.
//
// PRE-REGISTERED.  At the surf_tensor2 spawn the offline model says ZERO
// emitters are in range, and the user's own ent_io agreed (`here: 0.00x full
// scale from 0 emitter(s)`).  Therefore:
//
//   B1  OpenAL, at spawn      -> 0 active / 32 known.  The 0 is MEANINGLESS
//                                here; it is the baseline that shows the
//                                counter is dead on this backend.
//   B2  software, at spawn    -> MUST be 0 active / N known.  If the software
//                                mixer ALSO says nothing is audible at spawn,
//                                then silence is the correct behaviour there,
//                                and anything the user hears on OpenAL is the
//                                OpenAL path failing to attenuate.
//                             -> If it says active > 0, the model is wrong and
//                                build 64's falloff needs re-opening, not the
//                                backend.
//   B3  software, at a KNOWN-LOUD point (an emitter's own position)
//                             -> MUST be active > 0.  Without this, a 0 at
//                                spawn proves nothing -- it could just mean
//                                the counter never moves.  THIS IS THE ARM
//                                THAT MAKES B2 READABLE.
//
// B3 is the control and it is the whole reason this file has three arms
// instead of two.  Arm set E already made the mistake of reading a 0.00x as
// evidence when the instrument could not produce anything else.
//
// `volume 0` throughout.  Channel bookkeeping does not depend on gain.
// ---------------------------------------------------------------------------
// RESULTS: (written back here after the run)
// ---------------------------------------------------------------------------
// ===========================================================================

log_enable 1
log_dir logs
log_name b65b_backend
developer 1
log_developer 1
cl_maxfps 100
con_notifylines 0

volume 0
bgmvolume 0

waitms 5000

vbsp_sound 1
map surf_tensor2
waitmap 60
waitms 9000

echo ^5=== B1: OpenAL at spawn (baseline -- the counter is dead here) ===
soundinfo
waitms 2000

echo ^5=== B2: software mixer, same spawn ===
s_device "dsound"
snd_restart
waitms 4000
soundinfo
waitms 2500

echo ^5=== B3: software mixer, AT an emitter (the control) ===
setpos -224 -6080 -1184
waitms 3000
soundinfo
waitms 2500

echo ^5=== restore the backend ===
s_device ""
snd_restart
waitms 3000
echo ^5=== END OF RUN ===
quit
