// G17 -- smoke test of the final Patch 210 binary, plus the one change G16 could
// not have exercised.
//
// G16 ran a build in which T_GEN_REFRACTION still consulted only r_refract_fbo,
// so a portal with r_refract_fbo 0 sampled a copy of the current framebuffer
// instead of the texture it had just been rendered into.  That defaults to 1, so
// it never bit -- but "the doorway is black" is exactly what it produces, and
// that is the symptom this whole evening has been chasing, so it is not a trap to
// leave armed.  The third shot below is the only proof that the fix works,
// because with r_refract_fbo 1 both code paths agree by accident.
//
//   g17_fbo1  and  g17_fbo0  must show the SAME doorway contents.
//   Before the fix, g17_fbo0 would have been black.
//
// r_refract_fbo is not latched, so no vid_reload is needed between them; the
// texture binding is resolved per draw.

cfg_save_auto 0
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "p210_g17"
scr_sshot_type png
cl_yieldcpu 0
cl_maxfps 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0
r_speeds 2
vbsp_portal_render 1

waitms 2500

map surf_kitsune
waitmap 240
waitms 8000
sv_cheats 1

echo "@@@ G17 hub 100, r_refract_fbo 1 (the default)"
setpos 0 -620 150 0 90 0
waitms 3000
r_speeds_dump
waitms 400
screenshot_mega g17_fbo1 1280 720
waitms 600

echo "@@@ G17 hub 100, r_refract_fbo 0 -- must match the shot above"
r_refract_fbo 0
waitms 3000
screenshot_mega g17_fbo0 1280 720
waitms 600
r_refract_fbo 1
waitms 1000

// The user's map.  Nothing in Patch 210 addresses their second report (entities
// not loading, the level appearing to despawn through a portal), so this is a
// baseline picture and batch count for it, not a test of anything.
echo "@@@ G17 surf_aircontrol baseline"
map surf_aircontrol
waitmap 240
waitms 10000
sv_cheats 1
r_speeds_dump
waitms 400
screenshot_mega g17_aircontrol 1280 720
waitms 800

echo "@@@ G17 DONE"
waitms 1000
quit
