// P371A -- the finisher (server: p371sv.cfg).  Walks the p360sf fixture ten times.
// PREDICTIONS (registered before the run):
//   exactly 1 "server: welcome to FTESurf lobby (patch 270) -- on surf_666"
//   exactly 10 "finish:" lines, one per walk:
//     W1 FIRST TIME .. #3 of 17;  W2, W5 #3 of 17;  W3, W8 #1 of 17  WR;
//     W4 #3 of 17 .. PB STANDS;  W6 #12 of 40;  W7 #2 of 40;
//     W5's line at least 3 s after the server's "submitting surf_666 track 0 leg 0"
//     for that walk (it waits for the slow answer, BN_CHATWAIT 5 s);
//     W9, W10 (no board) no "#" from the board: a LOCAL placement or none.
//   0 "AnnA set" / "AnnA finished" chat lines (the finisher is not told of itself).
// RESULTS 2026-09-19 (run 2): 1 welcome, 10 finish lines, 0 lines about itself.
//  W1 "FIRST TIME  #3 of 17  TOP 10"; W3/W8 "#1 of 17  WR"; W4 "... PB STANDS";
//  W5 at 11:10:54, 3 s after its post; W6 #12 of 40; W7 #2 of 40; W10 "#5 of 5
//  LOCAL".  PREDICTION FAILED for W9: "#1 of 17  WR" -- the server stopped
//  submitting, W9 tied W8 at 299 ticks, and the unanswered *wrank still named
//  W8's subject, so Results_KeyRank matched it.  The banner draws the same (the
//  line is built from it); a board that goes away mid-map is not a lobby case.
//  Run 1 had no finish lines at all: this cfg lacked menu_restart + ui_close, and
//  notmenu skips Banner_Frame (AGENTS.md's screenshot rule applies to it too).
//  Run 3 (after the review fixes): ten lines; W4 tied W3's 300 ticks and read its
//  own "PB STANDS", not W3's WR (the line now waits to see its own PENDING).
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p371a
developer 0
cl_idlefps 0
cl_maxfps 100
rate  2000000
drate 5000000
vid_fullscreen 0
set name AnnA
waitms 16000
connect 127.0.0.1:27641
waitms 12000
menu_restart          // the builtin menu is up from boot: notmenu skips the banner
waitms 500
ui_close
waitms 500
set hud_banner_chat 1
set hud_chat_time 600
waitms 3000
echo ==== W1 ====
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 6000
-forward
waitms 4000
echo ==== W2 ====
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 6000
-forward
waitms 4000
echo ==== W3 ====
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 6000
-forward
waitms 4000
echo ==== W4 ====
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 6000
-forward
waitms 4000
echo ==== W5 (slow answer) ====
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 6000
-forward
waitms 4000
echo ==== W6 ====
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 6000
-forward
waitms 4000
echo ==== W7 ====
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 6000
-forward
waitms 4000
echo ==== W8 ====
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 6000
-forward
waitms 4000
echo ==== W9 (no board) ====
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 6000
-forward
waitms 4000
echo ==== W10 (slower) ====
set cl_forwardspeed 180
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 9000
-forward
waitms 4000
set cl_forwardspeed 400
echo ==== A idle through the changelevel and the map_restart ====
waitms 58000
echo ==== A disconnects ====
disconnect
waitms 3000
quit
