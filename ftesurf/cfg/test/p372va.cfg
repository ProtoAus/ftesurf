// P372VA -- time limit and votes end to end, the first voter (server: p372sv.cfg,
// second voter: p372vb.cfg).  C = this cfg's start; the server's S is ~C-5.
// PREDICTIONS (registered before the run; decolourised logs):
//  N  A "rock the vote opens in" (C+25); "!nominate one of bhop_eazy surf_utopia bhop_HeLL";
//     server "vA nominated bhop_HeLL" (typed BHOP_hell, the draft's split shape);
//     "vB nominated surf_utopia"; B "bhop_HeLL is already nominated"; A "you are on
//     surf_666 already"; A "nosuch is not in this lobby's rotation".
//  X  vote 1 (extend, B's): A status "id 1 kind 2 n 2 left" in [17,20], "pick 0";
//     "no extension (1 yes, 1 no)"; B "!extend again in"; vote 2 (A's) passes
//     "extended -- 2 more minutes on surf_666 (2 yes, 0 no)"; A's two mapclock
//     readings (C+56, C+86) differ by +120.0 in <end>; "!timeleft" "left on surf_666";
//     "!nextmap" "the map vote opens 3:00 before the end".  (Run 3, after the
//     review, rewords these two without a ": " after the tag.)
//  E  lobby_cycle 150: "2:30 left on surf_666"; the map vote opens only when
//     the cooldown ends: "1 bhop_HeLL 2 surf_utopia 3 bhop_eazy 4 Extend +2 min"
//     (nominations first, in order); A 1, B 2: "bhop_HeLL wins (1 of 2 votes)"
//     (a tie goes to the first); A "next map is bhop_HeLL (voted)".
//  H  lobby_cycle 60 with A mid-run: "bhop_HeLL in one minute", then at the deadline
//     "bhop_HeLL waits for the runs in progress" (the voted map keeps the hold);
//     A status "waiting for runs".
//  R  !rtv in the hold (next already voted): "rock the vote passed", "bhop_HeLL in
