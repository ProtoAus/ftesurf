//     them"; server "vote: forced change to bhop_HeLL"; the park says "(rotate,".
//  R2 bhop_HeLL, !rtv x2: "rock the vote passed -- pick the next map, keys 1-3";
//     server "open #1 kind 3" with "1 surf_666 2 bhop_eazy 3 surf_utopia" (no
//     Extend); A status "kind 3 n 3"; "bhop_eazy wins (2 of 2 votes)", "bhop_eazy
//     in ten seconds" (no runs: no "paused").
//  K  bhop_eazy, lobby_cycle 150: A status shows a vote (kind 1); after the admin
//     changelevel to surf_utopia A status "vote: none" and a mapclock.
//  C  control, lobby_vote 0 on surf_utopia: ZERO "vote: open" on that map; A
//     "votes are off here"; "bhop_HeLL in one minute" and the change still happen.
//  One "vB joined" in A's log in all (no repeat across four map changes).
// FALSIFIERS: "(server," in R; a hold line in R2; a vote line on the change frame.
// RESULTS 2026-09-19 (run 2): ALL HELD.  N as predicted (B "bhop_HeLL is already
//  nominated", "!extend again in 27 s"); X status "left 19.0 pick 0", mapclock
//  1800.0 -> 1920.0, "30:36 left on surf_666", "opens 3:00 before the end"; E
//  "2:30 left on surf_666", "open #3 kind 1 ... 1 bhop_HeLL 2 surf_utopia 3
//  bhop_eazy 4 Extend +2 min", tie -> "bhop_HeLL wins (1 of 2 votes)", "(voted)";
//  H hold lines naming bhop_HeLL, status "waiting for runs 0:25"; R "rock the vote
//  passed", the paused line, "forced change to bhop_HeLL", "parked vA's run ...
//  (rotate, recording stream)"; R2 "open #1 kind 3 ... 1 surf_666 2 bhop_eazy 3
//  surf_utopia", status "kind 3 n 3 left 17.8", "bhop_eazy in ten seconds" with no
