//  ahead by the end), and printed "2 minutes left" at 60.05 s -- the five-minute
//  line now says the clock ("2:30 left").
//  Run 3 (after the review: votes wait out a vote's last ten seconds, extensions
//  add, a cleared lobby_maps drops the voted map, rtv ratio 0, reworded replies):
//  every arm again -- "!nominate one of ...", "next map is bhop_HeLL (voted)",
//  "1:01 left on surf_utopia" at the control's pull-in.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p372va
developer 0
cl_idlefps 0
cl_maxfps 100
rate  2000000
drate 5000000
vid_fullscreen 0
set name vA
waitms 8000
connect 127.0.0.1:27642
waitms 12000
menu_restart
waitms 500
ui_close
waitms 500
set hud_chat_time 600
waitms 4000
echo ==== A C+25: N ====
say !rtv
waitms 3000
say !nominate
waitms 3000
cmd say !nominate BHOP_hell
waitms 9000
say !nominate surf_666
waitms 3000
say !nominate nosuch
waitms 4000
echo ==== A C+47: X ====
vote status
waitms 1000
vote 2
waitms 8000
vote status
waitms 24000
echo ==== A C+80: !extend ====
say !extend
waitms 6000
vote status
waitms 2000
say !timeleft
waitms 2000
say !nextmap
waitms 22000
echo ==== A C+112: E ====
vote status
waitms 3000
vote 1
waitms 5000
say !nextmap
waitms 50000
echo ==== A C+170: a run, held ====
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 2000
-forward
waitms 16000
vote status
waitms 2000
echo ==== A C+192: !rtv in the hold ====
say !rtv
waitms 30000
echo ==== A C+222: !rtv on bhop_HeLL ====
say !rtv
waitms 4000
vote status
waitms 1000
vote 2
waitms 39000
echo ==== A C+266: K ====
vote status
waitms 22000
vote status
waitms 14000
echo ==== A C+302: C ====
say !rtv
waitms 12000
vote status
waitms 51000
quit
