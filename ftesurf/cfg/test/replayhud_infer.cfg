// Patch 750: a replay's panels for a file with no board, stage or cp records.
//   python tools/runlines_smoke.py ftesurf/cfg/test/replayhud_infer.cfg --timeout 400
//       --put data/runs/surf_kitsune/main/0009998_pb.rec=<a Kitsune PB>
//       --put data/test/pb_asimport.rec=<that PB as an import: `foreign`, no board/stage/
//             cp/stagestart/stagepost records, plane columns zeroed, ramp bit kept>
//       --put data/test/pb_inferred.rec=<the same, ramp bit cleared, `momdemo`: inferred>
//       --put data/momentum/surf_dune/main/mom.rec=<a surf_dune Momentum import>
//   python tools/test_replayhud.py <this rig>/ftesurf
// NATIVE is the truth the two copies are graded against: their split ticks from the
// zones, their boards from the contact, the map's plane and the sample before.
cfg_save_auto 0
name ReplayHud
log_enable 1
log_dir logs
log_name runlines_smoke
con_notifytime 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
vid_width 1600
vid_height 900
waitms 2000
map surf_kitsune
waitmap 60
waitms 5000
menu_restart
ui_close
set hud_trainer 1
set hud_boarding 1
set hud_boarding_fade 999
set hud_board 1
set hud_board_fade 999
set hud_seq 1
replay data/runs/surf_kitsune/main/0009998_pb.rec
waitms 2500
replay pause
replay seek end
waitms 1500
wait 4
echo ==== NATIVE ====
replay boards
timer
replay status
replay seek 40
waitms 800
wait 4
echo ==== NATIVE 40 ====
boarding
screenshot replayhud_native40.png
replay stop
waitms 300
replay data/test/pb_asimport.rec
waitms 2500
replay pause
replay seek end
waitms 1500
wait 4
echo ==== ASIMPORT ====
replay boards
timer
replay status
replay seek 40
waitms 800
wait 4
echo ==== ASIMPORT 40 ====
boarding
screenshot replayhud_asimport40.png
replay stop
waitms 300
replay data/test/pb_inferred.rec
waitms 2500
replay pause
replay seek end
waitms 1500
wait 4
echo ==== INFERRED ====
replay boards
timer
replay status
replay stop
waitms 300
map surf_dune
waitmap 60
waitms 5000
menu_restart
ui_close
replay data/momentum/surf_dune/main/mom.rec
waitms 2500
replay pause
replay seek end
waitms 1500
wait 4
echo ==== MOM ====
replay boards
timer
replay status
replay seek 40
waitms 800
wait 4
echo ==== MOM 40 ====
boarding
timer
screenshot replayhud_mom40.png
replay stop
echo RUNLINES COMPLETE
waitms 100
quit
