// P385REC -- a ranked run recorded across a Patch 385 spectate window (review 2's
// medium: every earlier spectated file came from a raw `cmd rec_spec` while the
// client kept sending timed usercmds).  Listen host A on surf_666 in lobby mode,
// target p382t.cfg (B, entnum 2).  NEEDS Patch 380's engine for the host.
// Setup: cfg/test/p360sf.zones.json as maps/zones/local/surf_666.json (DELETE
// AFTER); park data/runs/surf_666 and data/saves/surf_666 (restore after).
// Run from C:\FTESurf, together:
//   C:\msys64\home\Lex\fteqw\engine\release\fteqw64.exe -WindowStyle Minimized +exec cfg/test/p385rec.cfg
//   C:\FTEQuake\fteqw64.exe -WindowStyle Minimized +exec cfg/test/p382t.cfg
// then, on the finish's data/runs/surf_666/main/<t>_*_run.rec (and its _pb.hid):
//   python tools/reccheck.py <file>
//   engine\release\fteqwsv64 +pm_verify <file> (Windows now; the Pi binary at deploy)
//   python tools/hidcheck.py <pb.hid>
//
// PRE-REGISTERED
//  S  the 385 client path, mid-air: leave the start, jump, `spectate p382t`
//     (Spec_Request), a look, SPACE to third, SPACE to free, fly 1 s, ESC
//     (`vote key 27`), the 3 s countdown, then walk to the finish.
//  R1 reccheck: 0 faults, spectated yes, 1 window.
//  R2 pm_verify PASS "1 window(s), 0 lines inside" on the new engine.
//  R3 `spec 1` and `spec 0 ... leave` equal in fields 2-11; the header flags hold
//     32768 and not 1 (practice).
//  R4 the host's log holds "forcing ... (anti-hover)" lines between the entry and
//     the release (the window sends no time), and the finish line says SPECTATED.
//  R5 the pb .hid holds `spec 1` then `spec 0`; hidcheck notes no ZERO-count
//     frame and no identity violation.
//  DESCRIBED, no gate: the rows from `spec 0` to the first row with input --
//     their <ticks>, repeats (zero-length rows) and count.
//  CONTROL (derived): the same file with `spec 0`'s <mt> + 1 must HOLD (as
//     p382verify's N1), or pm_verify cannot see this window.
// FALSIFIED IF R1-R5 fail or the control PASSes.
//
// RESULT (2026-09-20, host engine\release\fteqw64 with Patch 380 and review 2's
// fixes -- review 3 changed only key handling; the file is data/p385/s.rec).
//   R1 reccheck 0 faults, spectated yes, 1 window, held 8.556 s, `leave`.  R2 PASS
//   (p385verify.cfg).  R3 edges equal in 2-11 (mt 3470, vel z 157.99), flags 32768.
//   R4 "proto: forcing ... (anti-hover)": 454 inside the window, 1 before it,
//   1 after the release; the finish line "0:04.500  SPECTATED".  R5 VOID: the
//   lobby's listen host has no guid, so the finish is `s0` with no pb and no
//   .hid (p385hid.cfg carries the .hid).  DESCRIBED: after `spec 0`, `in 60 3470`
//   restates the edge, then `in 61 3470 0.0130001307` -- ONE forced 13 ms move,
//   no tick (the one forcing line after "released"), then the client's 15 ms
//   rows; no zero-length row.  Online that forced run lasts about one round trip.  "prederr: origin
//   off by 4.52" once at the release: the client predicted nothing in the window.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p385rec
developer 1
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
sv_port 27682
sv_cheats 0
vid_conautoscale 0
vid_conwidth 1280
vid_conheight 720
set lobby_enable    1
set lobby_avatars   1
set lobby_nocollide 1
set lobby_av_stream 1
set lobby_norec     0
set lobby_vote      0
set run_resume      0
set run_spec_countdown 3
set sv_showpredloss 1
waitms 5000
map surf_666
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 500
set rec_terms 1
sensitivity 3
bind space +jump
echo ^5==== p385rec: waiting for p382t ====
waitms 45000
status
serverinfo
echo ^5==== p385rec: S ====
cmd zone_goto 0 90 0
waitms 2000
+forward
waitms 1200
+jump
waitms 150
-jump
spectate p382t
-forward
waitms 1500
spectate status
spectate look 300 0
waitms 500
vote key 32 1
vote key 32 0
waitms 1000
vote key 32 1
vote key 32 0
waitms 500
+forward
waitms 1000
-forward
waitms 1000
spectate status
echo ^5==== p385rec: ESC ====
vote key 27 1
vote key 27 0
waitms 3600
spectate status
+forward
waitms 7000
-forward
waitms 3000
echo ^5==== p385rec: done ====
quit
