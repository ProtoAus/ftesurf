// Patch 335, ARM B client -- THE END-TO-END PREDICTION TEST.  Connects to the
// dedicated server p335sv.cfg started on 127.0.0.1:27666 (a real socket, not
// a listen server, so the sv.state gate that arm A proved does not apply and
// the hook must run).
//
// PREDICTIONS, registered before the run:
//   D  "trig: prediction hook alive" appears once, shortly after spawn.  Its
//      absence means the engine never called CSQC_PredictPlayerMove and every
//      number below is about nothing.
//   E  trig_tp 0 puts the player inside teleport #0's box (target 'rise').
//      NOTE, MEASURED: on loopback the server touches and teleports within
//      one tick of applying the setpos, so the FIRST acked state the client
//      ever sees is already the destination -- the prediction chain never
//      replays a command that starts inside the box and the client mirror
//      correctly has nothing to fire.  Arm E therefore asserts the SERVER
//      half (viewpos == destination, not box centre); the client-fires-first
//      half is arm G, where the player crosses a volume under their own
//      power and the pending command is predicted locally before the server
//      has even received it.
//   F  The fire prints a bounded number of times: the chain replays the
//      crossing command on every rendered frame until it is acked, so a few
//      repeats are the design; a print every frame forever means the replay
//      is re-firing against a state that already contains the teleport.
//   G  THE CLIENT-FIRES-FIRST ARM: +forward for six and a half seconds walks
//      out of the start and eventually off into the map's fall-reset volumes.
//      "trig: seq N kind 1 fired" lines must appear from cl_trigdebug, and
//      ordinary movement must stay clean: no errors, no NaN line.
//
// FALSIFIED IF: no hook-alive line (D), viewpos still in the box (E's client
// half -- the server alone would have moved it by the second viewpos, so E is
// read off the cl_trigdebug line's TIMESTAMP vs the setpos line), fires every
// frame for seconds (F), or a QC error / NaN anywhere (G).
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p335b
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0
menu_restart
waitms 1500

set cl_trigdebug 1
connect 127.0.0.1:27666
waitms 25000

echo ^5=== p335b D: hook alive above? census: ===
trig_dump
waitms 500

echo ^5=== p335b E: into teleport #0 (server half) ===
cmd viewpos
waitms 400
trig_tp 0
waitms 250
cmd viewpos
waitms 1200
cmd viewpos
waitms 400

echo ^5=== p335b E2: fall onto the rise destination from above -- must NOT re-fire ===
cmd setpos -3120 -496 2400
waitms 400
cmd viewpos
waitms 900
cmd viewpos
waitms 900
cmd viewpos
waitms 400

echo ^5=== p335b E3: fall into the ramp-end reset carpet -- client must fire ===
cmd setpos -800 -497 900
waitms 400
+forward
waitms 1200
cmd viewpos
waitms 800
-forward
cmd viewpos
waitms 1200
cmd viewpos
waitms 600

echo ^5=== p335b G: ordinary movement regression -- walk off into the map ===
+forward
waitms 2000
cmd viewpos
waitms 2000
cmd viewpos
waitms 2500
-forward
waitms 400
cmd viewpos
waitms 400

echo ^5=== p335b done ===
waitms 300
quit
