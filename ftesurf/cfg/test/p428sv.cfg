// P428SV -- 999 save states a player in a lobby (client: p428cl.cfg).
// Lobby mode (per-player blocks), a test guid key so the saves land in their
// own @<guid> folder under data/saves/bhop_eazy/.  Run from C:\FTESurf:
//   C:\FTEQuake\fteqwsv64.exe +set sv_port 27635 +set sv_public 0
//     +set pr_enable_profiling 1
//     +set log_name <n> [+set sv_progs <control progs>] +map bhop_eazy
//     +exec cfg/test/p428sv.cfg
// The client drives everything, including the changelevel (rcon) that forces
// the rescan, so this only has to stay up.
cfg_save_auto 0
log_enable 1
log_dir logs
developer 1
log_developer 1
exec cfg/lobby/lobby.cfg
sv_guidkey "ftesurf-p428-probe"
// After the lobby exec: lobby.cfg sets its own, and a +set loses to it (the
// first run logged `Bad rcon` and never changed level).  Local test server only.
set rcon_password p428-local
set log_developer 1
sv_maxrate         0
set run_resume 0
map bhop_eazy
waitms 170000
quit
