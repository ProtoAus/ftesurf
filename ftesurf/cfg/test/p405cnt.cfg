// P405CNT -- `cl_prydoncursor 0` silences the Patch 376 mouse-count channel, and the server can
// SEE it happen (listen server, one client, bhop_eazy).
//   ftesurf64.exe +set vid_winmaximize 0 -WindowStyle Minimized +exec cfg/test/p405cnt.cfg
// The run has to be RUNNING for SV_RecCounts to be reached, and `vote key` cannot drive movement
// (it runs the input chain, not the bind).  `+forward` IS a console command, so the cfg walks the
// body out of the start zone itself.
// `cmd timer` prints `mouse counts: N record(s) ...` and, since Patch 405, a second line when a
// command arrived carrying cursor data and no version marker.
//
// PREDICTIONS (registered before the run):
//  C0 default cl_prydoncursor "" -- the engine's string test fails, so CL_SendCounts runs:
//     `mouse counts:` N>0 record(s), and NO `counts suppressed` line at all.
//  C1 cl_prydoncursor 0 -- `*string` is now true and `ival >= 0` is true, so the PRYDON branch
//     wins and the counts stop: the mc record count stops climbing, and `counts suppressed`
//     appears with a non-zero command count.  This is the whole finding: the value that reads
//     like switching something off is the value that switches the anti-cheat channel off.
//  C2 back to "" -- counts resume on the next run (the cvar is not latched).
// A legacy client cannot be told from C0 by absence alone, which is why the detector keys on
// cursor data PRESENT with no marker rather than on silence.  Not testable from one binary.
//
// RESULTS 2026-09-20 (logs/p405cnt.log): ALL THREE ARMS AS PREDICTED.
//  C0  mouse counts: 1 record(s), 0 disagreement(s)      -- and no suppressed line.
//  C1  mouse counts: 0 record(s)                          -- and:
//      counts suppressed: 217 command(s) sent cursor data and no marker (cl_prydoncursor)
//  C2  mouse counts: 1 record(s)                          -- and no suppressed line.
//  So the finding is real and live: one console word, not cheat-gated and not latched, turns off
//  the channel that answers the momentum.dll class, and pm_verify would then print
//  "counts none -- the client predates Patch 376" and PASS.  217 of ~250 commands in the window
//  carried cursor data, which is the positive signature the detector keys on.
//  `1 record(s)` in C0/C2 is not a shortfall: an `mc` is written only when the payload CHANGES,
//  and a harness that never moves the mouse changes it once.
//
// WHAT THIS DOES NOT DO: it counts and prints.  No taint bit is set, so a suppressed run still
//  ranks exactly as before -- attaching one demotes real players and is Lex's call.  Nor does it
//  close the hole: only an engine change (counts winning over the cursor when the server asked
//  for them) does that, and that needs a client release.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p405cnt
developer 0
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
sv_port 27648
sv_cheats 0
set run_resume 0
vid_fullscreen 0
vid_width 1280
vid_height 720
waitms 5000
map bhop_eazy
waitmap 1800
waitms 1000

echo ==== C0 default (counts should flow) ====
set cl_prydoncursor ""
say !r
waitms 800
+forward
waitms 2500
-forward
waitms 300
cmd timer
waitms 800

echo ==== C1 cl_prydoncursor 0 (counts should stop) ====
say !r
waitms 800
set cl_prydoncursor 0
waitms 300
+forward
waitms 2500
-forward
waitms 300
cmd timer
waitms 800

echo ==== C2 back to default ====
say !r
waitms 800
set cl_prydoncursor ""
waitms 300
+forward
waitms 2500
-forward
waitms 300
cmd timer
waitms 800

echo ==== END ====
waitms 500
quit
