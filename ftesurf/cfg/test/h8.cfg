// H8 -- walk the camera up to the aperture.
//
// Every measurement of the portal view so far has been taken from 120 units back,
// where the 176-unit aperture subtends a cone and most of the far room is outside
// it.  "The far room renders black" and "the far room is mostly outside the hole"
// look identical from there and have nothing in common as bugs.
//
// So close the distance.  At 20 units the aperture covers essentially the whole
// screen, and the through-view becomes directly comparable to h3_crossed -- the
// same room, entered on foot, which measures centre brightness 90.5 and saturation
// 0.758.  Three distances, because a monotonic trend is itself the answer:
//
//   brightness rises as we approach -> the room IS being drawn and the cone was
//                                      the limit; nothing is broken but framing
//   brightness stays ~4             -> the far side is genuinely being shaded
//                                      black and distance was never the issue
//
// portal_hub_exit is at y -520 facing -y, so the camera sits at -540 / -580 / -640
// for 20 / 60 / 120 units of standoff.  vbsp_portal_debug 1 makes the log state which
// door was offered and at what range, so the standoff is recorded rather than
// assumed.

cfg_save_auto 0
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "h8"
scr_sshot_type png
cl_yieldcpu 0
cl_maxfps 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0
r_voidvis 1
vbsp_portal_render 1

waitms 2500
map surf_kitsune
waitmap 240
waitms 8000
sv_cheats 1
vbsp_portal_debug 1

setpos 0 -560 184 0 90 0
waitms 3000

echo "@@@ H8 120 units back"
setpos 0 -640 184 0 90 0
waitms 4000
screenshot_mega h8_d120 1280 720
waitms 600

echo "@@@ H8 60 units back"
setpos 0 -580 184 0 90 0
waitms 4000
screenshot_mega h8_d60 1280 720
waitms 600

echo "@@@ H8 20 units back -- aperture fills the frame"
setpos 0 -540 184 0 90 0
waitms 4000
screenshot_mega h8_d20 1280 720
waitms 600

echo "@@@ H8 DONE"
waitms 1000
quit
