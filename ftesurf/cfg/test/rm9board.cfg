// cfg_save_auto 0 FIRST: this arm sets lobby_dir and rec_terms near its end and
// must never write them into ftesurf.cfg.
cfg_save_auto 0

// ROADMAP 9 -- the map screen's leaderboard panel (src/menu/m_board.qc), against
// the REAL directory in lobby_dir, with the online terms accepted.
//
//   cd C:\FTESurf
//   ftesurf64.exe +exec cfg/test/rm9board.cfg
//
// Grade the `board:` lines in logs/rm9board.log: each `asked id` has one
// `reply id` (or `failed id` / `dropped the reply to id`) with its tier,
// offset, rows and counts, and the first/last row as parsed.
//
// Expected, from the directory on 2026-10-04 (counts move):
//   rm9_ksf       surf_kitsune KSF: 26 rows, one page, tail "end of the list"
//   rm9_mom       Momentum 100 of ~12624; tabs read KSF 26, FTESurf none
//   rm9_mom_p2    `scroll 105`: a second `asked` at offset 100, top row 105
//   rm9_mom_cap   `scroll 2000`: pages to 1000, tail "the first 1000 of ..."
//   rm9_ours      FTESurf on surf_kitsune: "Nobody has set a time ..."
//   rm9_beginner  surf_beginner FTESurf: 1 row
//   rm9_mesa      surf_mesa KSF: "KSF has no times on surf_mesa"
//   (no shot)     a tab switched with its page out, and a panel closed with
//                 its page out: each prints `dropped the reply to id N`
//   rm9_closed    `esc`: the panel gone, the create screen and its button
//   rm9_unreach   lobby_dir on a closed port: "could not reach ... no
//                 connection" (or the 10 s deadline), and a retry button
//   rm9_off       rec_terms 1: "Online play is off" and "read the terms"

log_enable 1
log_dir logs
log_name rm9board
cl_idlefps 0
cl_maxfps 100
// The board: lines would otherwise print over the top of every shot.
con_notifytime 0

// Startup takes ~40 s here, and menu.dat loads lazily: no menu command works
// before menu_restart (cfg/test/b67join.cfg has both traps).
waitms 40000
menu_restart
waitms 4000
togglemenu 1
waitms 2000

echo ^5==== rm9 arm 1: KSF, one page ====
ui_board_test surf_kitsune ksf
waitms 8000
ui_board_test
screenshot rm9_ksf
waitms 3000

echo ^5==== rm9 arm 2: Momentum, first page ====
ui_board_test tab momentum
waitms 5000
ui_board_test
screenshot rm9_mom
waitms 3000

echo ^5==== rm9 arm 3: scrolled past the first page ====
ui_board_test scroll 105
waitms 6000
ui_board_test
screenshot rm9_mom_p2
waitms 3000

echo ^5==== rm9 arm 4: scrolled to the cap ====
ui_board_test scroll 2000
waitms 20000
ui_board_test
screenshot rm9_mom_cap
waitms 3000

echo ^5==== rm9 arm 5: FTESurf, empty here ====
ui_board_test tab ranked
waitms 5000
screenshot rm9_ours
waitms 3000

echo ^5==== rm9 arm 6: FTESurf with a row ====
ui_board_test surf_beginner ranked
waitms 5000
ui_board_test
screenshot rm9_beginner
waitms 3000

echo ^5==== rm9 arm 7: KSF empty ====
ui_board_test surf_mesa ksf
waitms 5000
screenshot rm9_mesa
waitms 3000

echo ^5==== rm9 arm 8: replies to a tab and a panel already left ====
ui_board_test tab momentum
ui_board_test tab ranked
waitms 5000
ui_board_test surf_beginner momentum
ui_board_test close
waitms 5000
ui_board_test

echo ^5==== rm9 arm 9: ESC closes the panel, not the screen ====
ui_board_test surf_kitsune ksf
waitms 5000
ui_board_test esc
waitms 1000
ui_board_test
screenshot rm9_closed
waitms 3000

echo ^5==== rm9 arm 10: an unreachable directory ====
set lobby_dir "http://127.0.0.1:9"
ui_board_test surf_kitsune ksf
waitms 12000
ui_board_test
screenshot rm9_unreach
waitms 3000

echo ^5==== rm9 arm 11: the online terms not accepted ====
set rec_terms 1
ui_board_test retry
waitms 1500
ui_board_test
screenshot rm9_off
waitms 3000

echo ^5==== rm9: done ====
quit
