// BUILD 47 / ENGINE PATCH 267 -- two checks in one run.
//
// (1) `!r` must stop parking the player a unit in the air.
//     zone_dests' `moved` column is vlen(dest - your current origin): where you
//     ARE against where the destination COMPUTES.  Teleport in, let it settle,
//     and ask.  moved 0 = build 47.  moved 1 = the old unconditional lift.
//     Sampled repeatedly because a SETTLE is what is being measured -- a value
//     that starts at 1 and becomes 0 would mean the lift is still there and
//     only the sample timing changed.
//
// (2) the per-map velocity ceiling.  surf_null asks for 10000 in its own
//     logic_auto and has been running at 3500 since forever.  `movement` must
//     now show a per-map line naming cfg/map_surf_null.cfg, and sv_maxvelocity
//     must read 10000 against a base of 3500.
//
//     surf_colin_blaster_69000 is the control: it has NO map cfg, so `movement`
//     must show no per-map line and sv_maxvelocity must read 3500.  It is also
//     visited LAST, after surf_null, which makes it the leak test -- pms_over is
//     shared between the mode layer and the map layer, and a map ceiling that
//     survived into the next map would show up here as 10000.

log_developer 1

waitms 2000

map surf_colin_blaster_69000
waitmap 240
wait 60

echo ^5=== (1) at map spawn -- moved is the spawn-to-dest distance, not 0
cmd zone_dests
wait 20

echo ^5=== (1) teleport into zone 0, then sample three times
cmd zone_goto 0
wait 30
cmd zone_dests
wait 30
cmd zone_dests
wait 60
cmd zone_dests
wait 20

echo ^5=== (1) a stage zone too, to show it is not special to the start
cmd zone_goto 4
wait 60
cmd zone_dests
wait 20

echo ^5=== (2) control BEFORE surf_null: no map cfg, expect 3500 and no per-map line
movement
wait 20
sv_maxvelocity
wait 10

map surf_null
waitmap 240
wait 60

echo ^5=== (2) surf_null asks for 10000 in its own logic_auto
movement
wait 20
sv_maxvelocity
wait 10

map surf_colin_blaster_69000
waitmap 240
wait 60

echo ^5=== (2) THE LEAK TEST -- back to a map with no cfg, must be 3500 again
movement
wait 20
sv_maxvelocity
wait 20

echo ^5=== END OF RUN ===
wait 10
quit
