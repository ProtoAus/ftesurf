// BUILD 47 stage 2 -- the integration, on the map the report came from.
//
// surf_colin_blaster_69000 (note the underscore; the report spelled it
// "colinblaster").
//
// WHAT EACH BLOCK ASKS
//
//   net       cl_netfps is deliberately set WRONG before the map loads, to the
//             archived 100 that ftesurf.cfg carries.  Net_MatchTicrate runs at
//             CSQC_WorldLoaded and must correct it to match pm_ticrate, and
//             must SAY so.  A second map load must then print nothing, because
//             the value already agrees.
//
//   selftest  all 53 checks, of which the 21 pre-build-47 ones must be green
//             UNCHANGED -- they are the safety net for the Zone_XYInRing and
//             Zone_ClipZ extractions.
//
//   zone_list the new trigger line, which must read the HULL wording and must
//             agree with the serverinfo key rather than a client cvar.
//
//   dests     the three-state destination audit.  "edge" is a state that could
//             not be printed before build 47 and is the interesting one: a
//             destination outside the ring but inside the hull band is FINE
//             under the new rule and was reported as OUTSIDE under the old.
//
// Nothing here writes to data/runs or data/saves.

waitms 2000

echo ^5=== build 47: cl_netfps starts deliberately wrong ===
cl_netfps 100
cl_netfps

map surf_colin_blaster_69000
waitmap 240
wait 30

echo ^5=== net: Net_MatchTicrate should have corrected it above ===
cl_netfps
pm_ticrate
cl_netfps_snap

echo ^5=== the ruleset, as published to the client ===
serverinfo

echo ^5=== geometry self-test (53 checks) ===
zone_selftest

echo ^5=== zone_list: where is the trigger? ===
zone_list

echo ^5=== zone_dests: inside / edge / OUTSIDE ===
zone_dests

echo ^5=== END OF RUN ===
wait 10
quit
