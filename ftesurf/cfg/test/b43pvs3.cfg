// B43PVS3 -- is the .view2 eye COMPLETE, or does it merely help?
//
// b43pvs proved the diagnosis and b43pvs2 proved the mechanism works: at an
// identical camera and tick, brush entities went 0 -> 4 with rec_watch_pvs 1 and
// back to 0 with rec_watch_pvs 0.  Neither run answers the question that
// actually matters, which is whether 4 is ALL OF THEM.
//
// It is tempting to compare against `sv_nopvs 1`, and that is wrong: sv_nopvs
// sends EVERY entity on the map, so its 41 is surf_fiellu's total brush-entity
// count and not what should be visible from anywhere.  Measuring against it
// would condemn a correct fix.
//
// THE RIGHT REFERENCE IS A BODY STANDING AT THE CAMERA'S OWN POSITION, because
// that is by definition what the server would send if it knew where the camera
// was -- which is the whole of what this change is trying to achieve.  And it
// can be measured without noclip, which matters: noclip trips r_voidvis
// (r_surf.c:2409, "VOID VIEW"), which marks every leaf visible client-side and
// would inflate the reference arm into meaninglessness.  Opening a replay pins
// the player MOVETYPE_NONE wherever they happen to be, so `setpos` first and
// `replay` second parks a body at the camera's position and holds it there.
//
// THREE ROUNDS, all at t=12, all at the same camera:
//   OLD    body at spawn, rec_watch_pvs 0   -- build 42.  Expect the fewest.
//   FIX    body at spawn, rec_watch_pvs 1   -- the eye.
//   BODY   body AT the camera position, rec_watch_pvs 0  -- the reference.
//
// PASS: FIX == BODY.  If FIX is between OLD and BODY the eye is helping but not
// complete, and the gap is the thing to chase next -- most likely the areaportal
// test at gl_q2bsp.c:7233, which runs BEFORE the leaf test and which
// SV_AddCameraEntity does union a second area into (sv_ents.c:4349-4362).
//
// t=12 is chosen because it is where b43pvs2 measured a real difference
// (brush 4 against brush 0); a tick where both arms already agreed would prove
// nothing either way.  The .rec's origin is the FEET, so setpos lands the body
// exactly where the recorded player was and its eye where the camera will be.
//
// Each round seeks AWAY and back, because the entity census only prints when
// the view cluster changes (r_surf.c:2418-2420) -- a second seek to the same
// tick would be silent and look like the arm did nothing.

log_enable 1
log_dir "logs"
log_name "b43pvs3"
developer 1
log_developer 1
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
sv_cheats 1
fs_missingwarn 0

hud_watch_path 0
hud_watch_info 0

wait 200
echo ^5=== b43pvs3: is the eye complete? ===

map surf_fiellu
waitmap 1800
waitms 3000

// ---------- ROUND OLD ----------
echo ^5=== b43pvs3 ROUND OLD: body at spawn, rec_watch_pvs 0 (build 42) ===
rec_watch_pvs 0
replay data/runs/surf_fiellu/main/0003991_pb.rec
waitms 800
replay pause
replay seek 44
waitms 800
replay seek 12
waitms 1500
screenshot b43pvs3_old_t12

// ---------- ROUND FIX ----------
echo ^5=== b43pvs3 ROUND FIX: body at spawn, rec_watch_pvs 1 (the eye) ===
rec_watch_pvs 1
waitms 500
replay seek 44
waitms 1000
replay seek 12
waitms 1500
screenshot b43pvs3_fix_t12

// ---------- ROUND BODY: the reference ----------
echo ^5=== b43pvs3 ROUND BODY: body AT the camera, rec_watch_pvs 0 (reference) ===
replay stop
waitms 600
setpos -1882.67 -5812.02 11642.27 22.8 -66.4 0
waitms 100
rec_watch_pvs 0
replay data/runs/surf_fiellu/main/0003991_pb.rec
waitms 800
replay pause
replay seek 44
waitms 800
replay seek 12
waitms 1500
screenshot b43pvs3_body_t12
viewpos

echo ^5=== b43pvs3: done ===
replay stop
waitms 400
quit
