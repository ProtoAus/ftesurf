// P427SV2 -- a sound name with a space no longer stalls a join (client: p427cl.cfg).
// surf_themeless precaches "MGS3 SE THEME2.WAV" (the second map in the report),
// a spaced name this install does not have, so every joining client asks
// the server for it.  Run from C:\FTESurf:
//   <server exe> +set sv_port 27634 +set sv_public 0 +exec cfg/test/p427sv2.cfg
// Server log: logs/<log_name>.  The pass/fail line is the SERVER's
// `said> server: <name> joined` -- a client stuck on a download never spawns.
cfg_save_auto 0
log_enable 1
log_dir logs
developer 1
sv_maxrate         0
sv_maxdownloadrate 0
map surf_themeless
waitms 75000
quit
