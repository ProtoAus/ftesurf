// P428SLOTA -- a lobby slot's saves stay with the player who made them (Patch 428).
// Two players in ONE slot, one after the other, on one map (server p428sv.cfg):
//   A = this install (C:\FTESurf qkey):  C:\FTESurf\ftesurf64.exe +exec cfg/test/p428slota.cfg
//   B = the same exe with -homedir <dir> holding a fresh random `qkey` (FS_ROOT reads it
//       there, so B is another guid): +exec cfg/test/p428slotb.cfg, started after A quits.
// A makes three saves and leaves; B takes the freed slot and lists its own.
// BEFORE: nothing released the slot's rows, so B's `sl_list` reads
//   `3 saved on data/saves/bhop_eazy/@<B's guid>` -- A's rows under B's folder.
// AFTER: `nothing saved on this map`.
// FALSIFIED IF B sees rows after the patch, or none before it (no control).
// REVIEW ROUND 1: A leaves and REJOINS the same slot before B.  The first
//   cut cleared the block at every ClientConnect, so a rejoin rescanned
//   (a player-triggered stall at 999 rows); the owner check keeps A's rows.
//   Server log (developer 1): bb581da prints `saveloc: 3 save state(s)` at
//   A's rejoin; the fix prints none there.  A lists 3 both times; B none.
// RESULT, ROUND 1: bb581da logged `saveloc: 3 save state(s)` at A's rejoin;
//   the fix logged none.  A listed its 3 both times, B `nothing saved`.
// RESULT 2026-09-22: control (HEAD progs as sv_progs): A `3 saved on
//   ...@765bdaf0...`; B `3 saved on data/saves/bhop_eazy/@8703062c...`, the same
//   three rows.  Patch 428: B `nothing saved on this map`, A still sees its own.
cfg_save_auto 0
log_enable 1
log_dir logs
developer 1
cl_idlefps 0
cl_maxfps 100
rate  2000000
drate 5000000
vid_fullscreen 0
name "^3P428A"
waitms 4000
connect 127.0.0.1:27635
waitms 12000
cmd sl_save
waitms 300
cmd sl_save
waitms 300
cmd sl_save
waitms 300
cmd sl_list
waitms 800
disconnect
waitms 2000
echo p428slota: reconnect
connect 127.0.0.1:27635
waitms 12000
cmd sl_list
waitms 800
echo p428slota: done
disconnect
waitms 500
quit
