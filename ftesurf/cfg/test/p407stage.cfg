// P407STAGE -- the stage gate reads the EFFECTIVE speed, so a boundary crossed on a push
// carrier is no longer judged a standing start.
//   ftesurf64.exe +set run_startcap 0 +set vid_winmaximize 0 -WindowStyle Minimized \
//     +exec cfg/test/p407stage.cfg
//
// SETUP, by hand before the run (p403ride's fixture, reused rather than copied):
//   copy cfg/test/p403ride.zones.json -> ftesurf/maps/zones/local/bhop_arcane.json
//   park ftesurf/data/runs/bhop_arcane if it exists
// AFTER: delete that local zone file (bhop_arcane ships a real one and local wins) and
// restore data/runs/bhop_arcane.
//
// `run_startcap 0` IS THE POINT AND MUST BE ON THE COMMAND LINE.  Patch 403 clamps the START
// box to 290, so with it live the body leaves at 290 and the stage boundary is crossed
// legitimately -- which measures nothing about this patch.  Disabling it restores the
// pre-403 world, where the booster carries the body out at ~1800, and that is the case
// Patch 407 is about: a carrier crossing a MID-RUN stage boundary, which 403 never covers.
//
// SV_StageLaunch took `hv = e.velocity`.  A trigger_push does not write velocity -- it arms
// .run_basevel, ridden as pmove.basevelocity and cashed out at (1 + run_bv_tick * 0.5)
// (sv_entities.qc:997).  So the ground branch judged a body doing 1809 as a standing start.
//
// PRE-REGISTERED
//  L1 `stage fill:` reports a launch at the body's REAL speed (four figures), not 0.
//  L2 run_st_prime is 0 -- the stage is refused by run_stagecap on its own terms, rather
//     than relying on the tick branch to catch it.
// FALSIFIED IF launch still reads 0 while tkspd reads ~1809.
//
// CONTROL, run first and recorded in the same log: with run_startcap LIVE (the default 290)
// the same fixture must read `prime 1 launch 290` -- the two patches composing, not fighting.
//
// RESULTS 2026-09-20, both arms on the same build:
//   run_startcap 290 (control):  stage fill: prime 1 launch 290  tk 0 tkspd 0    cap 290
//   run_startcap 0   (subject):  stage fill: prime 0 launch 1406.99 tk 1 tkspd 1809 cap 290
//   HEAD, recorded by p403ride:  stage fill: prime 1 launch 0    tk 1 tkspd 1809 cap 290
//  So L1 and L2 both hold, and the OUTCOME moves: prime 1 -> prime 0.  launch 0 -> 1406.99 is
//  the gate ceasing to be blind; prime 1 -> 0 is the stage actually being refused.
//  (1406.99 rather than 1809 because the cash-out scale is applied at the tick the boundary was
//  crossed, not at the push's face value -- the same quantity SV_StartCapClamp uses.)
//
// EXPOSURE, MEASURED BEFORE THE CHANGE, on the whole live corpus: 49 files, 69 `stagepost`
//  records, 61 `ride` records of which 8 carry a non-zero horizontal value -- and ZERO stage
//  posts made while a carrier was armed.  One file holds both kinds (surf_deoa/main/
//  0014484_kap) and its four posts (launch 260-273) all precede its first armed carrier.
//  So nothing already standing on a board moves.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p407stage
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
sv_cheats 1
fs_missingwarn 0
set run_resume 0
sv_port 27683
wait 200
map bhop_arcane
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 1000

echo ^5=== the booster inside the start zone, then out across the stage boundary ===
cmd setpos 6912 2300 -120 0 90 0
waitms 100
cmd timer
waitms 300
cmd timer
waitms 400
cmd timer
waitms 600
cmd timer
waitms 800
cmd timer
echo ^5=== END ====
waitms 400
quit
