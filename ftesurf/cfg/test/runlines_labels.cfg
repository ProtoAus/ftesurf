// Private overlay; --recording supplies a surf_kitsune control .rec.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name runlines_smoke
set hud_lines_edge 0            // Patch 628: this arm grades the last-contact stamp (tools/p449mark.py)
con_notifytime 0
cl_idlefps 0
cl_maxfps 100
set hud_watch_skipidle 0
set hud_watch_path 1
waitms 2000
map surf_kitsune
waitmap 60
waitms 4000
menu_restart
ui_close
replay cfg/test/runlines_sample.rec
waitms 1500
replay pause
replay seek 40
waitms 1000
hud_lines_marks 1
hud_lines_nums 1
hud_lines_speed 1
hud_lines_energy 1
hud_lines_names 1
hud_lines_vz 1
hud_lines_delta 1
hud_lines_time 1
hud_lines_ref 1
hud_seq_units 1
hud_lines_numsize 18
hud_lines_gap 24
hud_lines_declutter 1
echo ==== SPARSE ====
replay marktrace 2
waitms 1000
screenshot runlines_sparse.png
hud_lines_declutter 0
echo ==== COMPLETE ====
replay marktrace 2
waitms 1000
screenshot runlines_complete.png
replay marks 0
wait 10
hud_lines_nums 0
echo ==== NUMSOFF ====
replay marktrace 2
waitms 1000
hud_lines_nums 1
hud_lines_marks 0
echo ==== MARKSOFF ====
replay marktrace 2
waitms 1000
echo RUNLINES COMPLETE
quit
