cfg_save_auto 0
// PATCH 346-349 + QC 87/88, DEPLOYED -- does a LOBBY now write an exact v9 file,
// and does the Pi replay it exactly?
//
// Connects to lobby 4 (bhop_eazy) and flies b83live's scripted hop route, then
// HOLDS the run open: a lobby streams to data/parts/<slot>.rec on the Pi and an
// abandoned stream is removed on disconnect, so the driver copies the part file
// over ssh during the hold.  The copy is then replayed ON THE PI by the deployed
// engine (pm_recsim, a headless process on a spare port).
//
// PRE-REGISTERED
//   1  the part file is FTESURF-REC 9 with `pmpin` (70 names), `seed`, `zseed`
//      -- i.e. the Pi's engine publishes the pin (Patch 346) and QC 87/88 write it;
//   2  pm_recsim on the Pi: "EXACT REPLAY", ARM 4 N of N packets text-identical,
//      physents all rows matching;
//   3  bhop_eazy's lobby reports pm_ticrate 0.01 (the mode layer applies again).
// FALSIFIED IF: no pin/seed (engine not live), or any ARM 4 / physents mismatch.
log_enable 1
log_dir logs
log_name p349live
developer 0
name "verifytest"
waitms 8000
menu_restart
waitms 2000
echo ================================ P349LIVE -- connect to lobby 4 (bhop_eazy)
connect play.proto.bar:27540
waitms 22000
status
cmd timer
waitms 1000
cmd zone_goto 0
waitms 2000
alias hop  "+jump;waitms 70;-jump;waitms 110"
alias goL  "+moveleft;-moveright;+left;-right"
alias goR  "-moveleft;+moveright;-left;+right"
alias cyc  "goL;hop;hop;goR;hop;hop"
cl_yawspeed 210
+forward
+jump
waitms 120
-jump
waitms 120
cyc
echo ================================ P349LIVE -- running?
cmd timer
cyc
cyc
cyc
cyc
cyc
cyc
cyc
cyc
-forward
-moveleft
-moveright
-left
-right
echo ================================ P349LIVE -- HOLD (copy window)
cmd timer
waitms 25000
echo ================================ P349LIVE -- done
disconnect
waitms 1000
quit
