// RESULT (2026-09-18, fleet on engine 349 + QC 88): the lobby file carried pmpin,
// seed and zseed; replayed on the Pi, ARM 4 1119/1119 exact -- but physents 0/1126,
// which with sv_playerslots 32 became 1126/1126: the digest hashed absolute entity
// numbers.  Fixed by engine Patch 352; see p352live.cfg.  ARM 1 also read one move
// "off by 2127": the part file was copied mid-write and ended in half a row.
