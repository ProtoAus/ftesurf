// Patch 749: the race ghost's body ducks and faces as the recording's view did.
//   python tools/runlines_smoke.py ftesurf/cfg/test/raceghost_pose.cfg
//       --put data/runs/surf_kitsune/main/0009998_pb.rec=<a surf_kitsune PB .rec>
//   python tools/test_raceghost.py --pose <this rig>/ftesurf --pb <that .rec>
// A rewind puts the ghost at its cursor plus the offset, an exact clock: each POSE is
// one moment of the PB, at its three ducks (12.08-12.35, 29.52-29.90, 32.67-32.84 on
// Lex's 0009998), where its view and its travel part (32.91, 78.43, 149.45), each side
// of a duck's two edges (12.065/12.070, 12.350/12.355: the nearer sample decides), and
// a turn across 0/360 (42.98, between -0.4 and 0.4).  The cursor lands on 0.21.
cfg_save_auto 0
name RaceGhostPose
log_enable 1
log_dir logs
log_name runlines_smoke
cl_idlefps 0
cl_maxfps 100
con_notifytime 0
waitms 2000
map surf_kitsune
waitmap 60
waitms 5000
menu_restart
ui_close
hud_ghost 1
hud_ghost_sync 0
hud_ghost_pb 1
hud_ghost_lines 0
hud_ghost_offset 0
hud_ghost_names 1
cmd zone_goto 0
waitms 800
+moveright
waitms 800
-moveright
waitms 300
+forward
waitms 2000
-forward
waitms 3500
// The ride has fallen back into the start by now: one press opens the rewind.
rewind
waitms 800
hud_ghost_offset 12.0
rewind seek 0.2
waitms 150
echo ==== POSE ====
raceghost
hud_ghost_offset 12.0
rewind seek 0.3
waitms 150
echo ==== POSE ====
raceghost
hud_ghost_offset 29.4
rewind seek 0.2
waitms 150
echo ==== POSE ====
raceghost
hud_ghost_offset 32.5
rewind seek 0.25
waitms 150
echo ==== POSE ====
raceghost
hud_ghost_offset 32.7
rewind seek 0.25
waitms 150
echo ==== POSE ====
raceghost
hud_ghost_offset 78.2
rewind seek 0.25
waitms 150
echo ==== POSE ====
raceghost
hud_ghost_offset 149.2
rewind seek 0.25
waitms 150
echo ==== POSE ====
raceghost
hud_ghost_offset 5.0
rewind seek 0.2
waitms 150
echo ==== POSE ====
raceghost
hud_ghost_offset 20.0
rewind seek 0.2
waitms 150
echo ==== POSE ====
raceghost
hud_ghost_offset 11.855
rewind seek 0.2
waitms 150
echo ==== POSE ====
raceghost
hud_ghost_offset 11.86
rewind seek 0.2
waitms 150
echo ==== POSE ====
raceghost
hud_ghost_offset 12.14
rewind seek 0.2
waitms 150
echo ==== POSE ====
raceghost
hud_ghost_offset 12.145
rewind seek 0.2
waitms 150
echo ==== POSE ====
raceghost
hud_ghost_offset 42.77
rewind seek 0.2
waitms 150
echo ==== POSE ====
raceghost
echo RUNLINES COMPLETE
waitms 100
quit
