// P408CHAT -- `!s N` and `!b N` keep their number when the sender split them into separate
// tokens, which is what the chat draft does (listen server, surf_666 -- it has bonuses).
//   ftesurf64.exe +set vid_winmaximize 0 -WindowStyle Minimized +exec cfg/test/p408chat.cfg
//
// THE TWO SEND SHAPES ARE NOT THE SAME ON THE WIRE, and that is the whole bug.
//   `say !b 3`      Cmd_ForwardToServer QUOTES the text, so it arrives whole:
//                   argv(1) = "!b 3", cmdargc 2.  This shape always worked.
//   `cmd say !b 3`  bypasses that quoting: argv(1) = "!b", argv(2) = "3", cmdargc 3.
// The chat draft MUST use the second (Chat_RunSafe, cl_chat.qc -- `cmd` stops Patch 341's
// CSQC_ChatSay hook re-entering itself), so from the chatbox the tail read empty, stof("")
// gave 0, and SV_ZoneChatCommand's `if (n < 1) n = 1` turned every !b N into bonus 1.
// Reported live 2026-09-20: "when I do !b 3 i get B1, or S1 when trying to pick any stage".
//
// PRE-REGISTERED
//  C1 `cmd say !b 3`  -> the reply names bonus 3.        <- the reported bug
//  C2 `cmd say !s 2`  -> the reply names stage 2.        <- the reported bug
//  C3 `say !b 3`      -> bonus 3 (the shape that already worked; must not regress)
//  C4 `say !s 2`      -> stage 2 (ditto)
//  C5 `cmd say !m`    -> start of the map (no tail to rebuild; must not change)
//  C6 `cmd say hello world` -> ordinary chat, NOT a warp: the rebuilt tail must only ever be
//     read when the first word is one of the four commands.
// FALSIFIED IF C1/C2 name bonus 1 or stage 1.
//
// RESULTS 2026-09-20 (logs/p408chat.log), both builds, surf_666:
//   ARM (fixed)              CONTROL (the deployed build, fix stashed)
//   C1 !b -- bonus 3         C1 !b -- bonus 1      <- the report, reproduced
//   C2 !s -- stage 2         C2 !s -- stage 1      <- the report, reproduced
//   C3 !b -- bonus 3         C3 !b -- bonus 3      (unchanged, as required)
//   C4 !s -- stage 2         C4 !s -- stage 2      (unchanged)
//   C5 !m -- start of the map      same            (unchanged)
//   C6 "Proto: hello world"        same            (still chat, not a warp)
// So all six hold, and the control fails exactly the two arms the player reported and no
// others -- which is also the proof that the spaced `say` form was never broken and that
// rebuilding the tail cannot turn ordinary chat into a teleport.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p408chat
developer 0
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
sv_port 27649
sv_cheats 0
set run_resume 0
vid_fullscreen 0
waitms 5000
map surf_666
waitmap 1800
waitms 2000

echo ==== C1 split bonus: cmd say !b 3 ====
cmd say !b 3
waitms 900
echo ==== C2 split stage: cmd say !s 2 ====
cmd say !s 2
waitms 900
echo ==== C3 whole bonus: say !b 3 ====
say !b 3
waitms 900
echo ==== C4 whole stage: say !s 2 ====
say !s 2
waitms 900
echo ==== C5 no tail: cmd say !m ====
cmd say !m
waitms 900
echo ==== C6 ordinary chat: cmd say hello world ====
cmd say hello world
waitms 900
echo ==== END ====
waitms 500
quit
