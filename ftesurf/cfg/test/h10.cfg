// H10 -- Patch 218, the blended-surface ordering, as a one-cvar A/B.
//
// surf_kitsune's nine GRIDS/GRID_* materials carry $alpha 0.75, so its floors and
// walls are genuinely translucent -- the census now says so out loud:
//     maps/surf_kitsune.bsp: 0 water material(s) ..., 11 translucent
// and the world walk emits them near-to-far, which is backwards for blending.
//
//   r_blendsort 0  emit order (nearest first) -- the old behaviour
//   r_blendsort 1  reversed, which for a BSP order is exact back-to-front
//
// Both arms use the same camera, so they difference directly.  Arm 3 returns to 1
// to show the cvar is what moved the picture rather than drift or animation -- and
// that control matters more than usual here, because CUSTOM/RAINBOWSCROLL is a
// scrolling material and two frames of the same camera are never identical.  The
// arm-1-vs-arm-3 number is the noise floor; the arm-1-vs-arm-2 number has to beat
// it to mean anything.
//
// Two viewpoints: the hub doorway (grid walls seen face-on, layered) and stage 1
// after a real crossing (the rainbow wall behind translucent grid floors, which is
// where overlapping translucent surfaces actually stack).

cfg_save_auto 0
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "h10"
scr_sshot_type png
cl_yieldcpu 0
cl_maxfps 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0
r_voidvis 1
vbsp_portal_render 1

waitms 2500
map surf_kitsune
waitmap 240
waitms 8000
sv_cheats 1

// ---------------------------------------------------------------- hub
setpos 0 -700 184 0 90 0
waitms 3000

echo "@@@ H10 hub, r_blendsort 1"
r_blendsort 1
waitms 2500
screenshot_mega h10_hub_on 1280 720
waitms 500

echo "@@@ H10 hub, r_blendsort 0"
r_blendsort 0
waitms 2500
screenshot_mega h10_hub_off 1280 720
waitms 500

echo "@@@ H10 hub, r_blendsort 1 again (noise floor)"
r_blendsort 1
waitms 2500
screenshot_mega h10_hub_on2 1280 720
waitms 500

// ---------------------------------------------------------------- stage 1
echo "@@@ H10 cross into stage 1"
+forward
waitms 1400
-forward
waitms 2500

echo "@@@ H10 stage1, r_blendsort 1"
r_blendsort 1
waitms 2000
screenshot_mega h10_s1_on 1280 720
waitms 500

echo "@@@ H10 stage1, r_blendsort 0"
r_blendsort 0
waitms 2000
screenshot_mega h10_s1_off 1280 720
waitms 500

echo "@@@ H10 stage1, r_blendsort 1 again (noise floor)"
r_blendsort 1
waitms 2000
screenshot_mega h10_s1_on2 1280 720
waitms 500

echo "@@@ H10 DONE"
waitms 1000
quit
