// Patch 746: what the race ghost looks like.  Private overlay, listen server:
//   python tools/runlines_smoke.py ftesurf/cfg/test/raceghost_look.cfg
//       --put data/runs/surf_kitsune/main/0009998_pb.rec=<a surf_kitsune PB .rec>
//   python tools/test_raceghost.py <live rig>/ftesurf --pb <that .rec> --look <this rig>/ftesurf
// A -30 s offset holds the ghost where its run starts.  Each ride turns round in the
// start box (+left at cl_yawspeed 210 for 860 ms, about 180 degrees) and backs out along
// raceghost_live.cfg's route, then turns onto the box the ghost stands in.
cfg_save_auto 0
name RaceGhostLook
log_enable 1
log_dir logs
log_name runlines_smoke
cl_idlefps 0
cl_maxfps 100
con_notifytime 0
waitms 2000
map surf_kitsune
waitmap 60
waitms 5000
menu_restart
ui_close
hud_ghost 1
hud_ghost_sync 0
hud_ghost_pb 1
hud_ghost_offset -30
hud_ghost_dither 1
hud_ghost_alpha 0.55
hud_ghost_near 96
cl_yawspeed 210
cl_pitchspeed 90
// ---- dither
cmd zone_goto 0
waitms 800
+left
waitms 860
-left
+moveleft
waitms 800
-moveleft
waitms 300
+back
waitms 1500
-back
// The held ghost stands ~56 degrees left of this view and ~24 up: turn onto it.
+right
+lookup
waitms 267
-right
-lookup
waitms 60
echo ==== DITHER ====
raceghost
screenshot raceghost_dither.png
waitms 400
// ---- blend
hud_ghost_dither 0
cmd zone_goto 0
waitms 800
+left
waitms 860
-left
+moveleft
waitms 800
-moveleft
waitms 300
+back
waitms 1500
-back
// The held ghost stands ~56 degrees left of this view and ~24 up: turn onto it.
+right
+lookup
waitms 267
-right
-lookup
waitms 60
echo ==== BLEND ====
raceghost
screenshot raceghost_blend.png
waitms 400
// ---- both: the body and its highlight, the ghost moving (offset 0)
hud_ghost_dither 1
hud_ghost 3
hud_ghost_offset 0
cmd zone_goto 0
waitms 800
+left
waitms 860
-left
+moveleft
waitms 800
-moveleft
waitms 300
+back
waitms 1500
-back
// The held ghost stands ~56 degrees left of this view and ~24 up: turn onto it.
+right
+lookup
waitms 267
-right
-lookup
waitms 60
echo ==== HIGHLIGHT ====
raceghost
replay marktrace 1
waitms 100
screenshot raceghost_highlight.png
waitms 400
// ---- off
hud_ghost 0
hud_ghost_offset -30
cmd zone_goto 0
waitms 800
+left
waitms 860
-left
+moveleft
waitms 800
-moveleft
waitms 300
+back
waitms 1500
-back
// The held ghost stands ~56 degrees left of this view and ~24 up: turn onto it.
+right
+lookup
waitms 267
-right
-lookup
waitms 60
echo ==== OFF ====
raceghost
screenshot raceghost_off.png
waitms 400
// The hud_edit pane: its rows, and its first chip cycles hud_ghost on from 0.
set hud_edit_panel_x 0.010
set hud_edit_panel_y 0.080
hud_edit ghost
waitms 800
wait 4
echo ==== PANE ====
hud_edit ui
screenshot raceghost_pane.png
hud_edit ui hover he_o_hud_ghost
hud_edit ui down mouse1
waitms 100
hud_edit ui hover he_o_hud_ghost
hud_edit ui up mouse1
waitms 400
wait 4
echo ==== PANECLICK ====
hud_ghost
hud_edit off
waitms 300
// With a rewind open the ghost follows its cursor (display only).
hud_ghost 1
hud_ghost_offset 0
cmd zone_goto 0
waitms 800
+moveright
waitms 800
-moveright
waitms 300
+forward
waitms 2000
-forward
waitms 3500
// The ride has fallen back into the start by now: one press opens the rewind.
rewind
waitms 800
rewind seek 0.5
waitms 600
echo ==== REWIND ====
rewind status
raceghost
waitms 300
echo RUNLINES COMPLETE
waitms 100
quit
