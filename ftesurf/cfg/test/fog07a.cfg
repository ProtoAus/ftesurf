// FOG07a -- is it "the first map of the session", or is it surf_legends?
// Same red probe, but bhop_bowling FIRST.  It scored 99.8% as load #2.
// If it now fails, the variable is the load ORDER, not the map.
log_enable 1
log_dir "logs"
log_name "fog07a"
cfg_save_auto 0
cl_maxfps 0
vid_fullscreen 0
vbsp_fog 0
wait 200
map bhop_bowling
waitmap 1800
waitms 11000
fog 1 1 0 0 1 0
waitms 1500
fog
waitms 400
screenshot fog07a_bowling_FIRSTMAP
waitms 900
echo ^5--- now change map and come BACK, same probe
map surf_simplistic
waitmap 1800
waitms 9000
map bhop_bowling
waitmap 1800
waitms 11000
fog 1 1 0 0 1 0
waitms 1500
screenshot fog07a_bowling_SECONDLOAD
waitms 900
echo ^5=========== done =====
log_enable 0
