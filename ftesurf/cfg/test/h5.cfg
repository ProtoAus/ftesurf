// H5 -- is the far side dark because it is UNLIT, or because it is never DRAWN?
//
// H3 settled that the recursion runs (28% of pixels differ from the portal-off
// control) and that it draws real far-side geometry: stage 1's floor comes through
// looking exactly as it does in the main view -- black with a red neon grid.  What
// does NOT come through is everything further away: the walls, the rainbow band and
// the sky.  Centre-of-frame brightness through the aperture is 4.3 against 92.4 for
// the same room entered on foot.
//
// "Unlit" and "not drawn" look identical on a black background and have completely
// different fixes, so this run separates them with one cvar:
//
//   r_novis 1 marks every leaf visible and bypasses the PVS entirely.
//
//   if the far side LIGHTS UP under r_novis 1  -> the recursed view is culling it;
//                                                 the bug is which PVS origin the
//                                                 portal view marks leaves from
//   if it stays dark                            -> the surfaces are being drawn and
//                                                 shaded black; the bug is render
//                                                 state (lightmap/lightstyle binding)
//
// The camera never moves across the three arms, so they difference directly, and
// arm 3 returns to r_novis 0 to prove the change was the cvar and not drift.

cfg_save_auto 0
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "h5"
scr_sshot_type png
cl_yieldcpu 0
cl_maxfps 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0
r_voidvis 1
vbsp_portal_render 1

waitms 2500
map surf_kitsune
waitmap 240
waitms 8000
sv_cheats 1

// settle at the doorway first, exactly as h3 did, so the camera lands where h3's did
setpos 0 -560 184 0 90 0
waitms 3000

echo "@@@ H5 arm 1 -- r_novis 0 (normal)"
r_novis 0
setpos 0 -640 184 0 90 0
waitms 4000
screenshot_mega h5_novis0 1280 720
waitms 600

echo "@@@ H5 arm 2 -- r_novis 1 (no culling at all)"
r_novis 1
waitms 4000
screenshot_mega h5_novis1 1280 720
waitms 600

echo "@@@ H5 arm 3 -- back to r_novis 0 (control)"
r_novis 0
waitms 4000
screenshot_mega h5_novis0b 1280 720
waitms 600

echo "@@@ H5 DONE"
waitms 1000
quit
