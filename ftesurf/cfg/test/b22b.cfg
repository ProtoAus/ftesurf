// FTESurf build 22 -- the cap, the ring overflow, and the write sandbox.
//
// THE CAP CANNOT BE REACHED HONESTLY.  in_journal_maxkb defaults to 8192 KB,
// which is about seven minutes of real 1000 Hz input; a test that waited for it
// would be a seven-minute test that still proved nothing a 64 KB one does not.
// So the cap is lowered and the injector fills it.  The file must end
// `truncated` and then `end` -- both, in that order.  A truncated journal is
// useless as an audit, and the whole point of the marker is that it must not be
// mistakable for a complete one.
//
// THE RING OVERFLOW.  EVENTQUEUELENGTH is 1024 and IN_Commands drains once per
// video frame, so injecting well past 1024 between two frames forces
// in_newevent() down its NULL branch.  Before build 22 that discarded silently
// and nothing in the engine had ever reported it; now it counts, and the next
// frame marker emits a '!' line.  A journal that loses events without saying so
// is the one failure mode that cannot be detected from outside the file, so this
// is the check that matters most in this config.
//
// THE SANDBOX.  Three refusals, and the third is the interesting one:
// QC_FixFileName by itself ACCEPTS "cfg/" as a writable prefix (it was widened
// for the mod's own configs), so a journal run through it alone could overwrite
// a config.  in_journal_end requires a data/ prefix ON TOP of it.  All three of
// these must be refused, and nothing may appear outside the gamedir.

cfg_save_auto 0
log_name b22b
developer 1
log_developer 1
con_notifytime 0

wait 200
map surf_666
waitmap 60
waitms 500

// ===========================================================================
echo "=========== 1. THE CAP -- expect a file <= 64KB ending truncated,end ==========="
// ===========================================================================
in_journal_maxkb 64
waitms 200
in_journal_begin
waitms 200
in_journal_synth 900
waitms 250
in_journal_synth 900
waitms 250
in_journal_synth 900
waitms 250
in_journal_synth 900
waitms 250
in_journal_synth 900
waitms 250
in_journal_synth 900
waitms 400
in_journal_end data/runs/b22b-cap.hid
waitms 400

// ===========================================================================
echo "=========== 2. RING OVERFLOW -- expect a '!' line and dropped > 0 ==========="
// ===========================================================================
// Back to a cap that cannot be what stops it, so a missing '!' means a missing
// '!' and not a truncation.
in_journal_maxkb 8192
waitms 200
in_journal_begin
waitms 200
// 4000 in one command, against a 1024-entry ring drained once per frame.
in_journal_synth 4000
waitms 500
in_journal_end data/runs/b22b-drop.hid
waitms 400

// ===========================================================================
echo "=========== 3. THE SANDBOX -- all three must be REFUSED ==========="
// ===========================================================================
echo "--- 3a: parent traversal ---"
in_journal_begin
in_journal_end ../../../b22-evil.hid
waitms 300

echo "--- 3b: absolute path with a drive letter ---"
in_journal_begin
in_journal_end C:/b22-evil.hid
waitms 300

echo "--- 3c: cfg/, which QC_FixFileName alone would ALLOW ---"
in_journal_begin
in_journal_end cfg/b22-evil.cfg
waitms 300

echo "--- 3d: the control -- data/ is accepted ---"
in_journal_begin
in_journal_synth 20
waitms 200
in_journal_end data/runs/b22b-sandbox-ok.hid
waitms 400

echo "=========== done ==========="
waitms 400
quit
