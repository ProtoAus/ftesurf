// P360SF2SV -- stage fill-in review fixes, server half (client: p360sf2cl.cfg).
// Same zone fixture and launch as p360sfsv.cfg, stub `b65stub.py cert 8131 2`
// (2 s reply delay).  One mid-session `map` reload: arm M's map change.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p360sf2sv
developer 1
exec cfg/lobby/lobby.cfg
sv_cheats 0
set lobby_master "http://127.0.0.1:8131"
sv_guidkey "ftesurf-p360-probe"
sv_maxrate         0
sv_maxdownloadrate 0
set lobby_master_key  "stub-key-not-a-real-one"
set lobby_master_rate 30
map surf_666
waitms 110000
echo ^5==== server: map reload (arm M) ====
map surf_666
waitms 70000
quit
