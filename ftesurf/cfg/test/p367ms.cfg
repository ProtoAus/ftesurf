// P367MS -- a Multi-Session finish on bhop_eazy, so pm_verify's v10 path can be
// run on the Pi's aarch64 binary as well (surf_666 is not on the Pi).  Route as
// b352fin.cfg: jump start, then PARK (map reload, why server), resume, duck,
// speed, a noclip flight into END.  Noclip taints it (cheat.rec): back up
// data/runs/bhop_eazy/main/cheat.* first; the driver copies the finish to
// data/p367/eazy.rec and restores them.
// PREDICTED: a v10 finish, `pauses server`, sessions 1, reccheck ok; pm_verify
// PASS at its end ticks on Windows AND on the Pi binary (same line).
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p367ms
developer 1
sv_cheats 0
cl_idlefps 0
cl_maxfps 100
set rec_enable 1
set rec_stream 0
set rec_runarchive 1
set run_resume_min 1
set run_resume_countdown 1
in_speedbutton 1
waitms 6000
map bhop_eazy
waitmap 45
waitms 3000
menu_restart
waitms 500
ui_close
waitms 500
cmd zone_goto 0
waitms 1000
setpos -352 -352 144 0 335.3 0
waitms 1000
echo ==== jump: the run starts
+jump
waitms 700
-jump
waitms 1300
cmd timer
echo ==== park (map reload)
map bhop_eazy
waitmap 45
waitms 3000
menu_restart
waitms 500
ui_close
waitms 500
cmd ms_resume
waitms 3000
cmd timer
echo ==== duck, speed, fly
+duck
waitms 700
-duck
waitms 300
+speed
waitms 700
-speed
waitms 300
noclip
waitms 500
+forward
waitms 6000
-forward
waitms 1500
cmd timer
echo ==== done
waitms 500
quit

