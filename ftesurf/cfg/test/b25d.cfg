// BUILD 25 stage 1, fourth pass -- leave a save behind so its seq.txt can be
// read from outside the game.
//
// b25c proved the open segment is SAVED and RESTORED (both paths fired), but
// not what the file says: FTE has no `type`/`cat`, and `dir` gives only a size.
// So this one takes the save and stops, and the file is read with Python
// afterwards.  It is the same gesture b25c makes, minus the tidy-up.
//
// z 1100 at this spot is over a pit, so the player is genuinely falling and the
// segment machine has an AIR segment open when the save is taken.

developer 1
log_developer 1
cfg_save_auto 0

wait 200
map surf_aesthetic
waitmap 90

zone_goto 0
wait 10
setpos -15200 200 1100
wait 12
cmd timer
wait 4
cmd sl_save
wait 15
cmd sl_list
wait 5

echo "=== b25d done -- save001 left on disk deliberately ==="
wait 20
quit
