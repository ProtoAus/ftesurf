// B45LINE -- the screen-space demo line, after the winding fix.
//
// WHAT BUILD 43 LEFT BEHIND.  Mode 2 computed correct geometry, emitted 900-1800
// quads a frame with a screen bbox over the viewport, and drew nothing.  Every
// measurement taken at the time was right; the conclusion was not.  The quads
// were wound the opposite way round from every other 2D polygon in the engine,
// the untextured 2D shader defaults to single-sided, and the entire path was
// backface-culled.  One sign in the perpendicular.
//
// THE ASSERTION IS THE PROBE PAIR, NOT THE PRETTY PICTURE.
//
//   probe 1   the magenta square, engine-standard winding      MUST DRAW
//   probe 4   the SAME square, same calls, wound backwards     MUST NOT DRAW
//   probe 5   probe 4 with DRAWFLAG_TWOSIDED                   MUST DRAW
//
// 1 against 4 is the whole diagnosis and it is airtight in a way "the line is
// there now" is not: same coordinates, same shader, same four builtins, same
// point in the frame, differing only in the order the vertices are handed over.
// If 4 also draws, this build's 2D shader is no longer culling and the fix
// landed for some other reason -- which is exactly the thing a screenshot of a
// working line cannot tell you.  5 says the flag is what saves it.
//
// THE A/B IS AT AN IDENTICAL CAMERA.  Same file, same seek, paused, only
// hud_watch_path_mode differs, so a difference between two shots is the drawer
// and cannot be the camera having moved.  Mode 1 is taken second here rather
// than first: mode 2 is now the default and it is the one on trial.
//
//   mode 1   thick, soft-edged, width growing with distance, HIDDEN by walls
//   mode 2   thin, crisp, constant width, VISIBLE THROUGH WALLS
//
// The last of those is the deliberate cost of drawing after the scene and the
// reason mode 1 is kept rather than deleted.
//
// EVERY SHOT IS TAKEN TWICE AND THE SECOND ONE IS THE EVIDENCE.  `screenshot`
// lands one step behind the command that set the state up -- build 43's own
// probes proved it, with probe2's PNG containing probe1's square.  A throwaway
// first and read the second.
//
// sv_cheats 0, DELIBERATELY.  From build 44 sv_cheats is itself a taint, and
// b43line's `sv_cheats 1` boilerplate would mark anything this touched.
// Nothing here records a run, but the habit is cheaper than the exception.

log_enable 1
log_dir "logs"
log_name "b45line"
developer 1
log_developer 1
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
sv_cheats 0
fs_missingwarn 0

// The path is the subject; keep the rest of the overlay out of the frame.
hud_watch_path 1
hud_watch_path_ahead 1
hud_watch_info 0
hud_watch_skipidle 0

wait 200
echo ^5=== b45line: the screen-space path, after the winding fix ===

map surf_rise
waitmap 1800
waitms 2500

replay data/runs/surf_rise/main/last.rec
waitms 800
replay pause

echo ^5=== b45line: MODE 2, screen space.  This is the one on trial ===
hud_watch_path_mode 2
waitms 300
replay seek 40
waitms 900
replay status
screenshot b45line_m2_t40_x
waitms 700
screenshot b45line_m2_t40
replay seek 45
waitms 900
replay status
screenshot b45line_m2_t45_x
waitms 700
screenshot b45line_m2_t45
replay seek 48
waitms 900
replay status
screenshot b45line_m2_t48_x
waitms 700
screenshot b45line_m2_t48

echo ^5=== b45line: THE PROBE PAIR -- 1 draws, 4 must not, 5 draws ===
// hud_watch_path STAYS 1 and hud_watch_path_mode STAYS 2.  The first cut of
// this file switched the path off so that "a blank frame means blank", which
// silently disabled the probes as well: Watch_Path2D returns on
// !hud_watch_path BEFORE it reaches the probe block, so all four shots came
// back with zero magenta pixels including the drawfill control.  The path
// drawing underneath is not in the way, because the assertion counts MAGENTA
// and no speed colour is magenta -- the ramp runs blue (0.25 0.45 1.00) to
// yellow (0.85 0.90 0.15) and never has a low green with a high red and blue.
hud_watch_path_probe 1
waitms 600
screenshot b45line_probe1_x
waitms 600
screenshot b45line_probe1
hud_watch_path_probe 4
waitms 600
screenshot b45line_probe4_x
waitms 600
screenshot b45line_probe4
hud_watch_path_probe 5
waitms 600
screenshot b45line_probe5_x
waitms 600
screenshot b45line_probe5
hud_watch_path_probe 3
waitms 600
screenshot b45line_probe3_x
waitms 600
screenshot b45line_probe3
hud_watch_path_probe 0
waitms 400

echo ^5=== b45line: MODE 1, the ribbon, same three seeks, same camera ===
hud_watch_path_mode 1
waitms 300
replay seek 40
waitms 900
screenshot b45line_m1_t40_x
waitms 700
screenshot b45line_m1_t40
replay seek 45
waitms 900
screenshot b45line_m1_t45_x
waitms 700
screenshot b45line_m1_t45
replay seek 48
waitms 900
screenshot b45line_m1_t48_x
waitms 700
screenshot b45line_m1_t48

echo ^5=== b45line: MODE 2 at 8px -- does the missing mitre show? ===
// The no-mitre decision is only defensible while the line is thin: the wedge on
// the outside of a turn is (width/2)*tan(theta/2).  If it shows at 8, the
// follow-on is a 2D mitre.  This could never be asked before now.
hud_watch_path_mode 2
hud_watch_path_px 8
waitms 300
replay seek 45
waitms 900
screenshot b45line_m2fat_t45_x
waitms 700
screenshot b45line_m2fat_t45
hud_watch_path_px 3

echo ^5=== b45line: back to MODE 2, must match the first three ===
waitms 300
replay seek 45
waitms 900
replay status
screenshot b45line_m2b_t45_x
waitms 700
screenshot b45line_m2b_t45

echo ^5=== b45line: done ===
replay stop
waitms 400
quit
