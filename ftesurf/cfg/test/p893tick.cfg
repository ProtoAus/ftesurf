// Patch 893 arm: a command of several ticks meets a thin trigger on every tick.
//   python tools/runlines_smoke.py ftesurf/cfg/test/p893tick.cfg --mount --timeout 400 \
//     --ssqc <qwprogs> --csqc <csprogs> --mqc <menu> --client <exe> --output-dir <task root>/artifacts
// bhop_cloudburst's tool teleport (Patch 892) at y 448..512 is 64 thick: with the 32-unit hull a body
// overlaps it for 96 units of y.  Noclip at 4000 u/s (pm_noclipspeed 16) moves 40 a 10 ms tick, so a
// per-tick touch never misses it; at cl_netfps 20, set after the map loads (CSQC's Net_MatchTicrate sets it per map
// at load), a command is 50 ms, five of the map's 10 ms ticks, 200 units, and a per-command touch
// misses it unless a step lands in the window.  The steps start where the command does, so the
// passes start at y 250..420: a 200-unit step from y <= 328 lands in 432..528, one from further on
// jumps it.  Expected: sv_tickparts 1 catches all eight; 0 (the control, same build) catches the
// three from 250, 280 and 310 and misses the five from 340 on.  A caught pass ends near bh7 (x -3644); a missed one at x -2080.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name runlines_smoke
con_notifytime 0
cl_idlefps 0
cl_maxfps 100
vid_vsync 0
vid_fullscreen 0
vid_width 1280
vid_height 720
sv_public 0
set run_resume 0
developer 1
log_developer 1
waitms 1500

map bhop_cloudburst
waitmap 120
waitms 5000
menu_restart
ui_close
waitms 500
cl_netfps 20
waitms 300
echo ==== L0 the lock: sv_tickparts 0 without sv_cheats is put back ====
sv_tickparts 0
waitms 100
sv_tickparts
// sv_tickparts is a locked movevar (Patch 893 review 4): the movement lock puts a change back
// unless sv_cheats is on, so it is set here, after the map; each half prints the value it ran with.
sv_cheats 1
pm_noclipspeed 16
noclip
waitms 300
echo ==== T1 sv_tickparts 1 ====
sv_tickparts 1
sv_tickparts
setpos -2080 250 800 0 90 0
waitms 300
+forward
waitms 250
-forward
waitms 300
cmd viewpos
waitms 200
setpos -2080 280 800 0 90 0
waitms 300
+forward
waitms 250
-forward
waitms 300
cmd viewpos
waitms 200
