// Patch 386 rig (d)(2): does Linux on a case-sensitive filesystem resolve what Windows resolves?
// Loads 12 maps in one session and prints, per map: the load's fs: line, hl2_unresolved(_visible),
// hl2_missing, r_imagelist (developer 1 lists failed images) and every exec.  Parse two logs with
//   python tools/linux/rigcompare.py <a.log> <b.log>
// Subjects (tools/linux/casecensus.py, lc = only a loose file spelled differently from the
// lowercased reference has it; asis = ... from the string the engine issues):
//   top 3 by lc     surf_okeycavetrails 11 (asis 7), bussn-bonus 10 (5), surf_blastpit 7 (3) --
//                   all CS:S loose materials (RealWorldTextures2/, Silkroad/, Skyppy_pack_misc/, tl/)
//   mixed-case BSPs bhop_addict_V2 bhop_HaddocK bhop_HeLL Bhop_Mukiology surf_prottos_NightMare
//                   surf_Rebel_Resistance_Revamp: census 0 (their content is in VPKs or the pakfile)
//   controls        bhop_eazy 0, surf_demise 0, bhop_woodenspace 0 (zstd subject, mounts mount/)
// Arms (Linux = Debian 13 rig, 386 build 23f1ce06b, rig-run.sh x11; Windows = 0.1.10 3ee3baf4d,
// scratch stage copy; engine code differs only in fs.c's Unix Steam arm and the Linux GL loaders):
//   W1  Windows, +set fs_cache 1          L1  Linux ext4 fakesteam, +set fs_cache 1
//   L0  Linux ext4, +set fs_cache 0 (NEGATIVE CONTROL)
//   D0  Linux, steam_libraries.txt -> /mnt/c/Program Files (x86)/Steam (drvfs), +set fs_cache 0
//   Z   Linux ext4 with the pre-386 archive plugin (3dd8f93c5), zstd control on bhop_woodenspace
// PRE-REGISTERED 2026-09-19, before any arm ran:
//   P1 L1 == W1 on every map: hl2_unresolved, _visible, missing list, failed images, execs,
//      Couldn't-load lines; every fs: line says "hash valid".
//   P2 L0 (control): hl2_unresolved rises by exactly the census's asis VMT rows --
//      surf_okeycavetrails +5, bussn-bonus +4, surf_blastpit +3 -- and the new names are those
//      rows; the other nine maps do not move.  If nothing moves the rig cannot see the problem.
//      Any other extra miss (a gamedir file, an exec) is a case-dependent lookup outside content.
//   P3 D0 == L1 (drvfs is case-insensitive, so it masks the problem: the rig needs ext4).
//   P4 zstd: 0 "auxiliary compression" lines on bhop_woodenspace with the 386 plugin.  The task
//      says the archive plugin shows > 0; by its strings it links ZSTD_decompress too and has no
//      "needs a build with zstd" text, so I predict 0 there as well (then it is no control).
// RESULTS 2026-09-19 (ftesurf/logs/linux/p386case_<arm>.log; hl2_unresolved per arm):
//   map              W1  L1 L0x D0x W0x |  L0 D0q  W0   (L0, D0q, W0: fs_cache 0 from boot)
//   okeycavetrails    3   3   8   3   3 |   9   4   4
//   bussn-bonus       0   0   4   0   0 |   7   3   3
//   blastpit         14  14  17  14  14 |  17  14  14
//   woodenspace       0   0   1   0   0 |   1   0   0
//   other 8 maps: L1 = L0x = D0x = W0x = W1 on every content field (L0/D0q/W0 lose 0-59 to no VPKs).
//   P1 HELD on content: W1 vs L1 same unresolved, missing, failed images, texture misses, execs,
//      load failures on 12/12.  FAILED on the fs: line: L1's first load said STALE -- the listen
//      server wrote $basedir/privkey.pem mid-load (p386first.cfg).  Missed lookups differ by <= 11 on
//      the 11 loads with a valid hash; bhop_eazy (stale) W1 443 vs L1 4247.
//   P2 FAILED AS RUN, then HELD: fs_cache 0 from boot mounts NO VPK on either platform (6 search-
//      paths; the deferred pack reload lives in FS_RebuildFSHash, fs.c:2235, which fs_cache 0 never
//      calls), so L0 is not case-only.  L0x (p386case0.cfg) adds exactly the census VMTs: +5, +4,
//      +3 -- and woodenspace +1 (watersource/waterfall/waterfallfull_1024_clear), which "the other
//      nine do not move" missed: the texdata name starts "materials/", mat_vmt.c:4432 does not
//      re-prefix it, and only CS:S's loose WaterSource/Waterfall/WaterfallFULL_1024_CLEAR.vmt has
//      it.  casecensus.py modelled Source's double prefix; fixed.
//   P3 HELD: D0x (p386caseq0.cfg, drvfs) == L1 on unresolved/missing/load failures/execs, 12/12;
//      the rest is late texture probes on slow 9p lookups (CORRECTED by review: rigcompare says
//      DIFF on 2/12 -- bhop_eazy's extra gfx/menudot4-6.lmp misses in D0x, woodenspace's 11 texture
//      misses in L1; failed images were never compared, caseq0 has no r_imagelist).  D0q vs L0 is
//      DIFF on 9/12, not only the census rows (log lines land in the wrong map's section).  The
//      conclusion stands: ext4 is needed.  W0x == W1 on 11/12 (woodenspace: the same late probes).
//   P4 HELD: see p386zstd.cfg (0 / 0 / 4).
//   Also (CORRECTED: only installs on the ext4 fakesteam crashed; p386det_lcl and p386lobby_A/B
//   exited cleanly): every such Linux fs_cache 1 run with log_enable 1 died with SIGSEGV at quit, and one fs_cache 0
//      run mid-map: Log_String -> FSSTDIO_OpenVFS -> FS_AddFileHash -> Hash_GetInsensitiveBucket on
//      buckets of a freed searchpath (fs_stdio.c:281 inserts on every write/append open; fs_win32.c
//      only for a new file).  The P196 class, Linux-only.
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
developer 1
log_developer 1
fs_loadstats 1
mod_warnmodels 1
waitms 3000
echo ======== P386CASE setup
version
fs_cache
path
fs_steamlibs
