cfg_save_auto 0

// ===========================================================================
// BUILD 65.1 -- THE LIVE ROW, WHICH IS THE ONE THE GRID WAS MOST WRONG ABOUT.
//
// b65c_align caught the committed rows only: every shot was taken with the
// player standing still, so nlive was 0 and the bottom row was never drawn.
// That is the row that matters most to this fix.  A committed air row carries a
// percentage and was therefore shifted left by its width; the live row never has
// one and was drawn on the raw anchor, so before 65.1 it sat about five
// characters RIGHT of every row above it -- the same offset a Board row shows,
// reachable without a ramp.
//
// So: hop to build a few committed rows, then jump and shoot WHILE AIRBORNE.
// 200 ms after the jump is comfortably inside a 0.75 s arc.
//
// PREDICTIONS:
//   * the bottom row's ':' shares an x with the committed rows above it
//   * its duration counts up rather than reading 0.75s, and still sits in the
//     same column
//   * its absolute tracks continuously (build 65's live-absolute claim)
//
// FALSIFIED IF: the bottom row is offset right, or its duration is in a
// different column from the ones above.
// ===========================================================================
log_enable 1
log_dir logs
log_name b65d_live
developer 1

hud_scale 2
hud_seq_size 20
cl_maxfps 250
con_notifylines 0

hud_seq 1
hud_seq_name 1
hud_seq_abs 1
hud_seq_delta 1
hud_seq_time 1
hud_seq_pct 1
hud_seq_live 1
hud_seq_units 1
hud_seq_hopbreak 1

hud_strafe 0
hud_splits 0

waitms 5000
map surf_kitsune
waitmap 45
waitms 4000

// Three hops for committed rows to line up against.
+jump
waitms 120
-jump
waitms 520
+jump
waitms 120
-jump
waitms 520
+jump
waitms 120
-jump
waitms 900

// And now one more, shot in mid-air.  screenshot captures one frame behind, so
// the pair is taken close together and the SECOND is the one to read -- both are
// still inside the arc.
+jump
waitms 120
-jump
waitms 80
screenshot
waitms 120
screenshot
waitms 900

// Again, later in the arc, so the duration column has grown.
+jump
waitms 120
-jump
waitms 280
screenshot
waitms 120
screenshot
waitms 900

echo ==== END ====
waitms 800
log_enable 0
waitms 500
quit
