cfg_save_auto 0
log_enable 1
log_dir logs
log_name runlines_smoke
log_developer 0
developer 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
vid_width 1024
vid_height 768
set run_resume 0
set lobby_dir ""
waitms 1500
map surf_dune
waitmap 2400
waitms 6000
menu_restart
waitms 700
ui_close
waitms 500

// Real walking starts the recording; row 1 is saved before any noclip.
cmd zone_goto 0
waitms 1000
+forward
waitms 1800
-forward
waitms 200
echo P718 A CLEAN RUN
cmd timer
cmd sl_save
waitms 80

noclip
waitms 120
echo P718 B NOCLIP ACTED
cmd timer
screenshot p718-noclip.png
waitms 600
cmd sl_save
waitms 600
noclip
waitms 400
cmd sl_goto 1
cmd sl_hold
waitms 200
echo P718 C CLEAN RUNNING SAVE
cmd timer
screenshot p718-cleanload.png
waitms 600
cmd sl_holdoff

cmd sl_goto 2
waitms 700
echo P718 D PRACTICE SAVE
cmd timer

cmd sl_goto 1
cmd sl_hold
waitms 200
cmd sl_holdoff
noclip
waitms 400
cmd sl_goto 1
waitms 120
echo P718 E ACTIVE NOCLIP
cmd timer
noclip
waitms 400
cmd sl_goto 1
cmd sl_hold
waitms 200
echo P718 F CLEAN AGAIN
cmd timer
waitms 200
cmd sl_holdoff

cmd zone_reset
waitms 1200
cmd sl_save
waitms 700
echo P718 G CLEAN START SAVED
cmd timer
+forward
waitms 1800
-forward
noclip
waitms 400
noclip
waitms 400
cmd sl_goto 3
waitms 900
echo P718 H CLEAN START LOADED
cmd timer
+forward
waitms 1800
-forward
waitms 300
echo P718 I FRESH RUN
cmd timer

waitms 300
// Public UI handles exercise both legacy reason-bit presentations.
banner test 0 0 1000 0 257
waitms 400
banner chat
waitms 200
screenshot p718-banner.png
waitms 300
banner stage 0 1 1000 0 72
waitms 400
banner off
// tools/p718tags_fixtures.py supplies six header-only rows on untouched stage 2.
scores tab local
scores leg 2
scores filter clean
waitms 300
scores filter stitched
waitms 300
scores filter practice
waitms 300
scores filter cheated
waitms 300

echo RUNLINES COMPLETE
waitms 500
quit
