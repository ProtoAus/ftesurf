// Patch 865 arm, listen server, through tools/runlines_smoke.py with the subject's progs:
//   python tools/runlines_smoke.py ftesurf/cfg/test/p865ents.cfg --mount --timeout 700 \
//     --ssqc <qwprogs> --csqc <csprogs> --mqc <menu> --output-dir <task root>/artifacts
// Grade the server's own lines (late spawn, addoutput, trigger_gravity, break, shot, damage,
// point_teleport) and each `cmd viewpos` against the expected landing:
//   A bhop_landmark2: *83 (class "active") must NOT send a classless player; after *85 renames
//     the player it must (land_dest_1 at x 2048).  A fail-open build teleports both times.
//   B surf_graphia: inside the T *56 / CT *55 overlap, land at ct_jail3 (2457 -13301), team 3.
//   C bhop_decimus *128: gravity -1 persist 0, then "left, gravity restored" once out.
//   D bhop_cheesemania *29: gravity 0.33 with no persist key: no restore line on leaving;
//     trigger_once *331 breaks tower2 (*420).
//   E bhop_eazy_v2: +attack at the damage-activated button *383 (a grate) -> OnDamaged -> glass *382 breaks.
//   F surf_frus: trigger_multiple *6 (b1endzone) -> point_teleport frustele -> 5376 7168 15368.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name runlines_smoke
con_notifytime 0
cl_idlefps 0
cl_maxfps 100
vid_vsync 0
vid_fullscreen 0
vid_width 1280
vid_height 720
sv_public 0
set run_resume 0
developer 1
log_developer 1
waitms 1500

map bhop_landmark2
waitmap 120
waitms 6000
menu_restart
ui_close
waitms 500
echo ==== A1 class gate, no class ====
setpos 0 -2261 288 0 90 0
waitms 1500
cmd viewpos
waitms 500
echo ==== A2 rename ====
setpos 0 2944 -1660 0 90 0
waitms 1500
echo ==== A3 class gate, class active ====
setpos 0 -2261 288 0 90 0
waitms 1500
cmd viewpos
waitms 500

map surf_graphia
waitmap 120
waitms 6000
echo ==== B team overlap ====
setpos 2791 -10797 15283 0 0 0
waitms 1500
cmd viewpos
waitms 500

map bhop_decimus
waitmap 120
waitms 6000
echo ==== C gravity persist 0 ====
setpos -1736 1680 -2352 0 0 0
waitms 2500
setpos -1736 1680 -1600 0 0 0
waitms 1500

map bhop_cheesemania
waitmap 120
waitms 6000
echo ==== D gravity, no persist key ====
setpos 6166 1690 -3590 0 0 0
waitms 1500
echo ==== D2 leave it, break trigger ====
setpos 3088 -320 2006 0 0 0
waitms 1500

map bhop_eazy_v2
waitmap 120
waitms 6000
echo ==== E shot ====
setpos 5600 1992 -232 0 180 0
waitms 800
// Landed, the eye is at -184, under the button (-176..-160): 4 degrees up crosses x 5376 at -168.
setpos 5600 1992 -247 -4 180 0
+attack
waitms 300
-attack
waitms 800

map surf_frus
waitmap 120
waitms 6000
echo ==== F point_teleport ====
setpos -8320 -10752 40 0 0 0
waitms 1500
cmd viewpos
waitms 500
echo RUNLINES COMPLETE
quit
