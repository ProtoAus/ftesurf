echo ^5==== M ====
banner fake "bhop_eazy 0 0 5000 1 3 17 1 20000 0"
set hud_banner_size 80
banner test 0 0 5000 5354 0
waitms 800
banner
vid_conwidth 800
vid_conheight 450
waitms 1500
banner
screenshot p361_M
waitms 500
vid_conwidth 1280
vid_conheight 720
set hud_banner_size 0
waitms 1000
echo ^5==== T ====
set hud_banner_hold 3.5
banner test 0 0 5000 5354 0
waitms 100
banner
waitms 900
banner
waitms 3500
banner
echo ^5==== U: a tie, the board's PB standing ====
set hud_banner_hold 60
banner fake "bhop_eazy 0 0 5000 1 3 17 0 20000 0"
banner test 0 0 5000 5000 0
waitms 300
banner
echo ^5==== S ====
banner sound end
echo ^5==== done ====
waitms 500
quit

