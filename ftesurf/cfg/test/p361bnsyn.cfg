// P361BNSYN -- the completion banner, synthetic (listen server, no run).
// `banner test|stage` raise a banner with a stated subject; `banner fake` is the
// key it reads.  bhop_eazy ticks 0.01 s: 5000 = 0:50.000, -354 = -0:03.540.
//
// PREDICTIONS (pre-registered), each read off `banner` "draws" lines:
//   A  #3 of 17 stored 1         "MAP COMPLETE" "0:50.000" | "-0:03.540  NEW PB" |
//                                "#3 of 17" / "TOP 10"        (3/17 <= 0.5, r <= 10)
//   B  #1 of 17 stored 1         "#1 of 17" / "WR", accent gold '1 0.84 0.3'
//   C  #1 of 17 stored 0, 5400   "+0:04.000" (no NEW PB) | "#1 of 17" / "PB STANDS", no gold
//   D  tier 1 (community), flags 512    "UNRANKED" / "no journal"
//   E  state 0                   "..." / "asking the leaderboard"
//   F  state 4                   "ON THE BOARD" / "no rank given"
//   G  state 3                   "NOT SUBMITTED" / "board unreachable"
//   H  #12 of 60 -> "TOP 25%";   #10 of 11 -> "" (no word);  #40 of 60 -> ""
//   I  FALSIFIER: key ticks 5001 -> state -1, placement "" "" (no local archive)
//   K  stage 0 3 1389 pb 1400 word 384, key #4 of 30  -> "STAGE 3" "0:13.890" |
//      "-0:00.110  NEW PB" | "#4 of 30" / "TOP 10"
//   L  flags 1 -> "PRACTICE"/"not saved"; 257 -> "CHEATED"; 137 -> "SHADOW"/"from a save"
//   M  vid_conwidth 800, size 80: drawu 1.875 (2.5 * 0.75, the one fallback step)
//      where 1280 wide draws drawu 2.5
//   T  hold 3.5: kind 1 at +0.1 s and +1.0 s (outat -1), kind 0 at +4.5 s
//   U  (after the review) a tie, stored 0: "+0:00.000  TIED" | "#3 of 17" / "TOP 10  PB STANDS"
//   S  no sound files: "sound 1 end 0 pb 0 wr 0", and no load warning in the log
// Screenshots: p361_A, p361_B, p361_D, p361_K, p361_L, p361_M.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p361bnsyn
developer 0
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
sv_port 27631
vid_conautoscale 0
vid_conwidth 1280
vid_conheight 720
waitms 5000
map bhop_eazy
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 500
hud_scale 2
set hud_banner 1
set hud_banner_size 0
set hud_banner_x 0.5
set hud_banner_y 0.25
set hud_banner_hold 60
set hud_results 0
waitms 500
echo ^5==== A ====
banner fake "bhop_eazy 0 0 5000 1 3 17 1 20000 0"
banner test 0 0 5000 5354 0
waitms 1000
banner
screenshot p361_A
waitms 500
echo ^5==== B ====
banner fake "bhop_eazy 0 0 5000 1 1 17 1 20000 0"
banner test 0 0 5000 5354 0
waitms 1000
banner
screenshot p361_B
waitms 500
echo ^5==== C ====
banner fake "bhop_eazy 0 0 5400 1 1 17 0 20000 0"
banner test 0 0 5400 5000 0
waitms 600
banner
echo ^5==== D ====
banner fake "bhop_eazy 0 0 5000 1 3 17 1 20000 1"
banner test 0 0 5000 5354 512
waitms 1000
banner
screenshot p361_D
waitms 500
echo ^5==== E ====
banner fake "bhop_eazy 0 0 5000 0 0 0 0 0 0"
banner test 0 0 5000 5354 0
waitms 300
banner
echo ^5==== F ====
banner fake "bhop_eazy 0 0 5000 4 0 0 1 0 0"
banner test 0 0 5000 5354 0
waitms 300
banner
echo ^5==== G ====
banner fake "bhop_eazy 0 0 5000 3 0 0 0 0 0"
banner test 0 0 5000 5354 0
waitms 300
banner
echo ^5==== H ====
banner fake "bhop_eazy 0 0 5000 1 12 60 1 20000 0"
banner test 0 0 5000 5354 0
waitms 300
banner
banner fake "bhop_eazy 0 0 5000 1 10 11 1 20000 0"
banner test 0 0 5000 5354 0
waitms 300
banner
banner fake "bhop_eazy 0 0 5000 1 40 60 1 20000 0"
banner test 0 0 5000 5354 0
waitms 300
banner
echo ^5==== I (falsifier) ====
banner fake "bhop_eazy 0 0 5001 1 3 17 1 20000 0"
banner test 0 0 5000 5354 0
waitms 300
banner
echo ^5==== K ====
banner fake "bhop_eazy 0 3 1389 1 4 30 1 20000 0"
banner stage 0 3 1389 1400 384
waitms 1000
banner
screenshot p361_K
waitms 500
echo ^5==== L ====
banner fake
banner test 0 0 5000 5354 1
waitms 300
banner
