// Patch 337 push E2E, instrumented.  trig_dump prints cl_trigdebug as CSQC
// sees it -- the k2 run walked a live 400 u/s pad with zero fire prints, and
// the cvar is read per command, so the pre-connect `set` demonstrably did not
// survive to the hook.  This run brackets the walk with dumps and re-arms the
// cvar AFTER connect (registered by then, bare assignment legal).
cfg_save_auto 0
log_enable 1
log_dir logs
log_name p335k3
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0
wait 600
connect 127.0.0.1:27666
waitms 15000
echo === cvar as CSQC sees it, pre-set:
trig_dump
waitms 400
cl_prederror 2
cl_trigdebug 1
echo === cvar as CSQC sees it, post-set:
trig_dump
waitms 400
echo === warp west of pad 17 (pushdir +x, speed 400)
cmd setpos 7900 -10688 -2400 0 0 0
waitms 400
cmd noclip
waitms 2500
cmd viewpos
waitms 500
echo === walk east across the pad (3 s)
+forward
waitms 3000
echo === stop, cash-out window (3 s)
-forward
waitms 3000
cmd viewpos
waitms 500
echo === p335k3 done
waitms 300
quit
