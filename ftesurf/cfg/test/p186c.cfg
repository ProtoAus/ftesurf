// P186: two packs at once, and the full purge.
//
// surf_monotony declares BOTH "steam:Team Fortress 2/tf" and
// "steam:Counter-Strike Global Offensive/csgo", so its manifest must carry two `pack`
// lines and the skip must require BOTH to match.  This is the case that would break a
// naive "one pack per map" manifest.
//
// Ends by purging everything and confirming the maps go back to mounting.
fs_loadstats 1
fs_automount 1
fs_autounmount 1
fs_assetcache 1
developer 0
waitms 4000
echo "=== P186-C: two packs, then purge ==="
echo "--- 1. surf_monotony first visit (mounts TF2 AND CS:GO) ---"
map surf_monotony
waitms 40000
echo "--- 2. bhop_aberrant (drops both, flushes) ---"
map bhop_aberrant
waitms 25000
echo "--- 3. surf_monotony confirming visit ---"
map surf_monotony
waitms 40000
echo "--- 4. bhop_aberrant ---"
map bhop_aberrant
waitms 25000
echo "--- 5. surf_monotony PROVEN: must mount NEITHER pack ---"
map surf_monotony
waitms 30000
fs_cache_info
waitms 2000
echo "--- 6. full purge ---"
fs_cache_clear
waitms 3000
fs_cache_info
waitms 2000
echo "--- 7. surf_utopia must mount TF2 again (cache is gone) ---"
map surf_utopia
waitms 25000
echo "=== P186-C DONE ==="
waitms 1000
quit
