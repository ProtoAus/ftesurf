// SEAM03 -- the A/B that can actually measure, on a map without the smoke.
//
// WHY SEAM01 AND SEAM02 MEASURED NOTHING.  Both ran on surf_demise, and both
// vantages turned out to sit behind elly/animated_smoke_skybox -- a translucent
// sheet whose shader carries #SCROLL=0.019924,0.001743, i.e. it never stops
// moving.  seam02 took two screenshots in an IDENTICAL state four seconds apart
// and they differed by 72.82% of pixels.  Every toggle in both runs came back at
// 57-73%, which is the floor, not a result.  The routing evidence from those runs
// stands (the shader line reads
// prog=vmt/transition#SEAMLESS=0.000488#BLENDMOD#BUMP2, and the load census
// counts 7 and 6); the pixel numbers do not.
//
// TWO CHANGES.
//
// 1. surf_outra instead: 28 $seamless_scale materials over 1175 world faces and
//    21 $bumpmap2 over 1999, the most of any map in the library, and no scrolling
//    sheet across the camera.  Vantages come from the same displaced-vertex
//    reconstruction, so they are aimed at the real geometry.
//
// 2. `slowmo 0` (sv_gamespeed) before the shots, to stop server time.  If the
//    noise floor below still comes back at tens of percent then it did NOT reach
//    the client's e_time and the floor is what it is -- either way the floor is
//    measured first and every toggle is read against it.  A toggle that does not
//    clear its own floor is reported as unmeasured, not as zero.

log_enable 1
log_dir "logs"
log_name "seam03"
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 0
vid_fullscreen 0
developer 1
log_developer 1
con_notifytime 0
con_notifylines 0
con_notifytime_error 0

wait 200

hl2_seamless 1
hl2_bumpmap2 1
map surf_outra
waitmap 1800
waitms 12000
sv_cheats 1
waitms 400
noclip
waitms 400
slowmo 0
waitms 1000

setpos 10757.0 9155.6 73.4 35.00 45.00 0
waitms 3000
developer 1
shader_here seam03A
light_here seam03A
waitms 500
developer 0
waitms 2000

echo ^5---------- NOISE FLOOR --------------------------------------------------
screenshot seam03_a_floor1
waitms 4000
screenshot seam03_a_floor2
waitms 900

echo ^5---------- hl2_seamless 0 ----------------------------------------------
hl2_seamless 0
waitms 4000
screenshot seam03_a_seam_off
waitms 900
hl2_seamless 1
waitms 4000
screenshot seam03_a_seam_on
waitms 900

echo ^5---------- hl2_bumpmap2 0 ----------------------------------------------
hl2_bumpmap2 0
waitms 4000
screenshot seam03_a_bump_off
waitms 900
hl2_bumpmap2 1
waitms 4000
screenshot seam03_a_bump_on
waitms 900

echo ^5########## vantage B ###################################################
developer 1
setpos 608.6 -11589.8 -173.1 35.00 45.00 0
waitms 3000
shader_here seam03B
waitms 500
developer 0
waitms 2000
screenshot seam03_b_floor1
waitms 4000
screenshot seam03_b_floor2
waitms 900
hl2_seamless 0
waitms 4000
screenshot seam03_b_seam_off
waitms 900
hl2_seamless 1
waitms 4000
screenshot seam03_b_seam_on
waitms 900
hl2_bumpmap2 0
waitms 4000
screenshot seam03_b_bump_off
waitms 900
hl2_bumpmap2 1
waitms 4000
screenshot seam03_b_bump_on
waitms 900

echo ^5=== seam03 done ===
wait 30
quit
