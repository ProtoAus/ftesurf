// cfg_save_auto 0 FIRST: this run sets archived cvars and must never write them
// into ftesurf.cfg (cl_main.c:2535).
cfg_save_auto 0

// ===========================================================================
//  P436PEND -- a restored `pendarm` must not hand back a clean stage run.
//    python tools/p436pend.py     (stages the fixture, runs, parses, restores)
//    or by hand: PARK ftesurf/data/saves/bhop_eazy (a shared fixture), copy
//    cfg/test/p436state.txt to ftesurf/data/saves/bhop_eazy/save901/state.txt,
//    then ftesurf64.exe -WindowStyle Minimized +exec cfg/test/p436pend.cfg
//    (cwd MUST be C:\FTESurf; log ftesurf/logs/p436pend.log)
//
//  THE DEFECT (BACKLOG, Patch 428 review).  Finishing a stage leaves
//  run_t_pendarm holding the NEXT stage's zone, and SV_TimerFrame's FINISHED
//  branch waits for the body to leave that box and then calls SV_TimerArm --
//  which zeroes run_t_flags.  SV_SaveWriteState writes `pendarm` and
//  SV_SaveApplyState restored it, so a save taken anywhere after a stage finish
//  carried a pending arm the player could fire on demand: load, and the next
//  scan arms a CLEAN stage run at whatever speed the save held.  Repeatable, and
//  the arm is the one thing that clears a load's TF_SEGMENT|TF_PRACTICE.
//
//  THE FIX.  The loader reads the key and DROPPES it (`if (k == "pendarm")
//  { continue; }`, named rather than left to the unknown-key skip), and the
//  restore writes -1.  A pending arm is an arm that has NOT happened, and the
//  legitimate handover is reached by CROSSING the finish -- not by being placed
//  somewhere with one already owed.  The writer keeps the line so the file's
//  shape does not move under an older build.
//
//  THE FIXTURE IS THE WHOLE ARM.  save901 is a hand-written state.txt: state 3
//  (TS_FINISHED), ticks 300, `azone 1` (inside bhop_eazy's stage-1 box, x 2528
//  ..2720 y 384..640) with the body placed at its centre 2624 512 64.0312, and
//  `pendarm 2` -- the stage-2 box, which is at x -480..-288 y -1856..-1600, i.e.
//  the other end of the map.  That distance is what makes this measurable
//  without driving anything: the handover's condition is `!SV_ZoneIn(pendarm, p,
//  hull)`, so it is TRUE on the FIRST scan after the load.  No walk, no flight,
//  no +forward -- one packet.
//
//  NO CHEATS AND NOTHING MOVES THE BODY, deliberately.  The observable is the
//  class, and noclip or setpos would taint it themselves (SV_TimerCheat sets the
//  run_t_cheat latch, which survives SV_TimerArm and would read `cheated` on both
//  builds).  The fixture's own `reclines 300` with no run.rec beside it makes
//  SV_RecRewind fail, so Patch 434's branch ends the restored run -- which is
//  correct and is not what is under test here: the timer state, the pending arm
//  and the class are all read before that matters, and Patch 434 only acts on a
//  TS_RUNNING restore.
//
//  ARMS
//   P1 one packet after the load.  THE SUBJECT, and the only line that decides.
//   P2 ~1.5 s later: the same read, so a handover that lands late is still seen.
//   P3 CONTROL for the gesture: a REAL save taken by this run, loaded back.  It
//      must restore and keep its own state -- if every load came back broken, P1
//      reading `finished` would prove nothing.
//
//  PRE-REGISTERED PREDICTIONS
//   P1 CONTROL BUILD (HEAD~): `timer: running`, `practice 0`, `class: clean`,
//      `stagerun 1`, ticks near 0 -- the restored pendarm armed a clean stage run
//      one packet after the load, and SV_TimerStart ran with it.
//   P1 FIXED BUILD: `timer: finished`, `practice 1`, `class: segmented`, ticks
//      `0:03.000` -- the save's own clock, still owing its handover, still wearing
//      the load's taint.
//   `pending arm` is NOT a discriminator and is only reported: the fixed build
//      drops it at the load and the control build spends it on the arm, so both
//      read -1.  The state, the class and the clock are what differ.
//   P2 the same as P1 on both builds (nothing arms later either).
//   P3 on both builds: a real save restores (`run resumed` or `armed`) and the
//      class reads what the run earned -- NOT `pending arm 2`.
//  FALSIFIED IF P3 does not restore (the loader is broken for every save, so P1
//   proves nothing), or P1 reads `finished` on the control build, or `running` on
//   the fixed one.
//
//  RESULT (2026-09-23, both arms run, driver exit 0 each way).  The handover is
//   real and repeatable, and it takes TWO packets, not one:
//                        control (HEAD's sv_saveloc.qc)   fixed
//    P1 (load's packet)  finished, pending arm 2,         finished, pending arm -1,
//                        practice 1, segmented            practice 1, segmented
//    P2 (1.5 s later)    running, stagerun 1,             finished, pending arm -1,
//                        practice 0, class: clean         practice 1, segmented
//    P3 (a real save)    running, restored                running, restored
//   So on the control build the load restores FINISHED with the pendarm standing,
//   and the very next scan spends it: a CLEAN stage-1 run (stagerun 1, flags 0,
//   ticks back to ~0) from a hand-written file, with no gesture but `sl_load`.
//   The fixed build drops the key, so the state stays FINISHED at the save's own
//   0:03.000 and keeps the load's TF_SEGMENT|TF_PRACTICE.
//   ONE PREDICTION WRONG: P1 was registered as `running` on the control build.
//   The arm happens in SV_TimerFrame, which runs once per PACKET, so the load's
//   own packet cannot contain it -- the first scan after it can.  The driver
//   grades the pre-fix predictions on P2 and reports P1's readings, which are the
//   handover's own footprint (`pending arm 2`, still standing).
//  NOT COVERED: a save taken while the pendarm is still owed and the body IS
//   inside that box (the fixture places it 3000 u away, which is why the
//   handover fires at all).  Same code path -- the loader drops the key either
//   way -- but the walk-out gesture that a real player would use is not driven
//   here, and neither is a STAGE-TRACK save on a map with a bonus track.
log_enable 1
log_dir logs
log_name p436pend
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
sv_port 27665
sv_cheats 0
set run_resume 0
vid_fullscreen 0
waitms 5000
map bhop_eazy
waitmap 2400
waitms 3000
menu_restart
ui_close
waitms 1200

echo ==== Z the zone table and the one row this arm staged ====
zone_list
waitms 600
cmd sl_list
waitms 800

echo ==== P1 SUBJECT: load the finished save, read one packet later ====
cmd sl_goto 1
cmd sl_load
echo ---- P1 control build: running / clean / stagerun 1.  fixed: finished / segmented / 0:03.000 ----
cmd timer
waitms 700
cmd viewpos
waitms 500

echo ==== P2 the same read 1.5 s on, in case the handover lands late ====
waitms 1500
cmd timer
waitms 700
cmd viewpos
waitms 500

echo ==== P3 CONTROL for the gesture: a real save, taken and loaded back ====
cmd zone_goto 0
waitms 900
+forward
waitms 1500
-forward
waitms 600
cmd sl_save
waitms 900
cmd sl_list
waitms 600
cmd sl_goto 2
cmd sl_load
waitms 1200
echo ---- P3 a real save must restore, or P1's verdict means nothing ----
cmd timer
waitms 700
cmd viewpos
waitms 600

quit
