// Patch 390/391 post-deploy check: a headless client joins a live lobby (never ui_join).
// Run: ftesurf64.exe +set p390_target 192.168.1.102:27510 +exec cfg/test/p390pi.cfg
// Pre-registered: "FTESurf CSQC loaded"; mousepad on 1 src 1 box 970 605 166 104 (1280x720, scale 2);
//   after `spectate look 1022.7273 0` pos 0.7500 (took 0); saveloc: locked 0 (no run) and the
//   server's saveloc reply.  Void without "FTESurf CSQC loaded".
// RESULT 2026-09-20 03:25, lobby 1 (27510) right after the -Pi deploy (csprogs 5d468bdd...): CSQC
//   loaded; took 0; mousepad on 1 src 1 pos 0.7500 0.5000, box 970 605 166 104 px 1; saveloc
//   locked 0 refkey 0, server "nothing saved on this map".  Held.
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
set log_enable 1
set log_dir logs
set log_name p390pi
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_conautoscale 0
vid_conwidth 1280
vid_conheight 720
waitms 5000
connect $p390_target
waitms 30000
menu_restart
waitms 500
ui_close
waitms 500
hud_scale 2
set hud_keys 1
set hud_keys_x 0
set hud_keys_y 0.84
set hud_mouse 1
set hud_mouse_x -1
set hud_mouse_y -1
set sensitivity 1
set m_yaw 0.022
set in_xflip 0
set hud_mouse_span 90
echo ======== P390 pad
mousepad reset
waitms 300
spectate look 1022.7273 0
waitms 300
mousepad
echo ======== P391 gate
saveloc
waitms 2000
disconnect
quit
