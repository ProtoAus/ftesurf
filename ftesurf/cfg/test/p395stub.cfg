cfg_save_auto 0
log_enable 1
log_dir logs
developer 1
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0
set run_resume 0
sv_public 0
sv_port 27677
set lobby_dir "http://127.0.0.1:8395"

wait 200
map surf_aura
waitmap 1800
waitms 3000
menu_restart
waitms 500
ui_close
waitms 1000
set hud_watch_skipidle 0
echo ^5=== p395stub T1 ===
scores legs
scores open
scores tab online
scores leg 2
scores refresh
waitms 3000
board_status
echo ^5=== p395stub T2 ===
scores olpick 1
waitms 1000
echo ^5=== p395stub T3 ===
scores olpick 0
waitms 4000
replay status
replay stop
waitms 500
echo ^5=== p395stub T4 ===
board_replay row 0
echo ^5=== p395stub T5 ===
scores close
board_fetch 0 3
waitms 3000
board_replay row 0
waitms 3000
board_status
waitms 500

map surf_beginner
waitmap 1800
waitms 3000
set hud_watch_skipidle 0
echo ^5=== p395stub T6 ===
scores legs
scores open
scores tab online
scores leg 5
scores refresh
waitms 3000
board_status
scores olpick 0
waitms 4000
replay status
replay stop
scores close
echo ^5=== p395stub DONE ===
waitms 500
quit
