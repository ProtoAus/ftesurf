// Patch 750: a KSF v2 replay (no ground flag): ground read from vz, its ramp contact
// inferred, then its boards and leaves as an import's.
//   python tools/runlines_smoke.py ftesurf/cfg/test/replayhud_ksf.cfg --timeout 300
//       --put data/ksf/ksf_monolith.rec=<a converted KSF v2 surf_monolith clip>
//   python tools/test_replayhud.py --ksf <this rig>/ftesurf
cfg_save_auto 0
name ReplayHudKsf
log_enable 1
log_dir logs
log_name runlines_smoke
con_notifytime 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
vid_width 1600
vid_height 900
waitms 2000
map surf_monolith
waitmap 60
waitms 5000
menu_restart
ui_close
set hud_trainer 1
set hud_boarding 1
set hud_boarding_fade 999
set hud_board 1
set hud_board_fade 999
set hud_seq 1
replay data/ksf/ksf_monolith.rec noview
waitms 2500
replay pause
replay seek end
waitms 1500
wait 4
echo ==== KSF ====
replay boards
timer
replay status
replay seek 10
waitms 800
wait 4
echo ==== KSF 10 ====
boarding
trainer status
replay seq live
screenshot replayhud_ksf10.png
replay stop
echo RUNLINES COMPLETE
waitms 100
quit
