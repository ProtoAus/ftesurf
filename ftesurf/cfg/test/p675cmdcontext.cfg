// Test-only SSQC fixture + real dedicated socket. Use --mount.
// No body operation is enabled; normal CSQC has no P672 consumer.
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
cl_netfps 10
cl_predict_qchook 1
cl_predict_trace 0
log_enable 1
log_name runlines_smoke
log_developer 1
developer 1
map surf_dune
wait 500
cmd join
wait 200
echo CMDCONTEXT CONTROL BEGIN
trig_dump
wait 100
cl_maxfps 10
wait 120
cmd viewpos
cl_maxfps 100
wait 100
echo CMDCONTEXT CLIENT COMPLETE
echo RUNLINES COMPLETE
quit
