cfg_save_auto 0
log_enable 1
log_dir logs
log_name p335k4
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0
wait 600
connect 127.0.0.1:27666
waitms 15000
cl_prederror 2
cl_trigdebug 1
echo === warp ONTO pad 17 (8096 -10688, slab top -2425)
cmd setpos 8096 -10688 -2380 0 0 0
waitms 400
cmd noclip
waitms 2500
echo === standing check:
trig_here
waitms 400
trig_probe 17 8096 -10688 -2429
waitms 400
echo === walk east 2 s:
+forward
waitms 2000
-forward
waitms 1500
echo === k4 done
waitms 300
quit
