// PATCH 484 -- the angle identity, computed where it is produced.
//
// WHY.  Patch 293 put the device counts and the angle they produced on one line
// of the .hid journal, and hidcheck.py closes the identity over it.  That works
// and it is still the right place for the full arithmetic -- but the journal is
// the ONE evidence file that reaches no server.  `run_evidence_ul` is 1 on the
// fleet, which uploads the .view and not the .hid, and the client's 4 MiB staging
// cap refuses any journal past about 38 s of run at 110 KB/s.  Measured on the
// live host while this was written: 19 receipts, 14 sidecars, 4 recordings and
// ZERO journals.  So every input check the tree built -- the angle identity on
// both axes, the injection counters, the counts join, the device-provenance table
// -- ran only when an operator typed a path at a file that is not there.
//
// WHAT THE PATCH ADDS.  Four read-only cvars (CVAR_NOSET|CVAR_NOSAVE, in the
// shape Patch 301 set for in_rawmice): in_jrn484_frames, _ghosts, _violations,
// _skipped.  They are computed inside IN_Journal_View, which is the only place
// that can: the identity is a statement about the counts an angle was built
// from, and a rewrite that sits where the usercmd is built changes the angle
// with no counts and no recorded keyboard turn behind it.  BELOW this line the
// two are indistinguishable; ABOVE it the counts do not exist yet.  That is the
// property, and it is the same argument Patch 376 made for the mouse counters.
//
// -1 MEANS "NO JOURNAL HAS RUN IN THIS PROCESS", which is not 0 and is not a
// measurement of nothing -- the same rule in_rawmice follows, and the reason a
// reader must never see an unmeasured state as a clean one.
//
// ---------------------------------------------------------------------------
// PRE-REGISTERED, before this was run.
// ---------------------------------------------------------------------------
// ARM A  control, no journal open.  All FIVE cvars MUST read -1.
//        FALSIFIER: any of them reading 0 or a positive number here means the
//        counter reports a measurement of nothing, which is the exact failure
//        Patch 301's essay warns about.  THIS ARM FOUND IT: the first cut
//        published ghosts and violations unguarded, so they read 0 before any
//        journal had run -- an unmeasured state wearing a clean measurement's
//        clothes.  The guard is now a `journal has been opened` flag, not a test
//        on the counters themselves, because a journal whose frames were all
//        skipped has run and governed nothing and must read 0, not unknown.
//
// ARM B  one journal, opened and closed in this process, driven by KEYBOARD ONLY
//        (+left / +right, which reach cl_input.c:1416 and land in the recorded
//        keyboard turn).  Predictions:
//          B1 in_jrn484_frames > 0            -- the counter is alive
//          B2 in_jrn484_violations == 0       -- honest input is not accused
//          B3 in_jrn484_ghosts == 0           -- nothing moved without a cause
//          B4 the .hid hidcheck writes agrees with the cvars EXACTLY on all
//             four numbers.  This is the arm that matters: the engine's C
//             arithmetic and hidcheck's independent Python arithmetic are two
//             implementations of one rule, and if they disagree the engine's
//             numbers cannot be trusted as a summary of the file's.
//
// ARM C  synthetic mouse motion into the SAME process (in_journal_synth, which
//        calls IN_MoveMouse directly and marks the journal synthetic).
//        Predictions:
//          C1 in_jrn484_violations stays 0.  NOT a claim that the patch sees
//             injection -- it is the opposite.  Synthetic motion has real counts
//             behind it, so the identity HOLDS, and any nonzero here would mean
//             the check is accusing a legitimate path.  Reaching the view at all
//             is Patch 306's business (raw input rejects it and counts it); this
//             arm only says the identity does not misfire on motion the engine
//             did see.
//          C2 the counters still move (frames rises), i.e. the tap is alive on
//             the synthetic path and is not gated on something WM_INPUT-only.
//
// WHAT THIS ARM CANNOT SHOW, stated so the result is not overread: a minimized
// harness receives no real mouse motion and cannot fire a WM_INPUT, so no arm
// here can produce a NONZERO violations counter from genuine injected input.
// The subject that would do that is p306inj's external SendInput harness.  What
// is proven here is that the counters are alive, that they read -1 rather than 0
// before any journal, that honest keyboard input is not accused, and that the
// engine's arithmetic and hidcheck's agree exactly.
//
// ---------------------------------------------------------------------------
// RESULT, written after the run -- including the predictions that were wrong.
// ---------------------------------------------------------------------------
// Run 2026-10-05 on the Patch 484 build (in_jrn484_* present in ftesurf64.exe,
// five cvars, verified by byte count in the binary).  tools/p484ident.py: 18
// checks, 0 failed.
//
// ARM A  all five cvars read -1 with no journal open.  PASSED, ON THE SECOND TRY.
//        THE FIRST RUN FAILED IT AND THE FAILURE WAS THE FINDING: ghosts and
//        violations read 0, because the first cut published them unguarded while
//        frames and skipped were guarded on `!count && !skip`.  An unmeasured
//        state wearing a clean measurement's clothes -- a reader would have been
//        told the input was checked on a client that had journalled nothing.  The
//        guard is now a `journal has been opened` flag, which is also what
//        in_rawmice_live is for in_rawmice, because a counter cannot say whether
//        it has been measured.
//
// ARM A2 all five refuse `set` ("variable in_jrn484_X is readonly") and still
//        read -1.  PASSED.  This is the property that makes the channel mean
//        anything: a counter a console can assign is one a server's stufftext can
//        assign, and then an attacker publishes 0 violations.
//
// ARM B  FAILED ITS OWN PREDICTION, and the prediction was the wrong one.
//        Predicted frames > 0 with violations 0 and ghosts 0.  Measured frames 0,
//        skipped 180, violations 0, ghosts 0.  The reason is in the file: ALL 181
//        of the journal's 'v' rows carry flags 4 (VF_FREE), because
//        Key_MouseShouldBeFree() is true with no window focus and a minimized
//        harness has none -- `ui_close` does not change that.  So the counter was
//        CORRECT and abstaining on every frame, which is indistinguishable by
//        number from a dead counter.  This is the tree's standing rule firing on
//        this patch: PROVE THE SUBJECT ACTED.  It did not, so this arm proves
//        only that the counters publish, abstain and reset.
//        What it does prove by agreement: skipped 180 EQUALS hidcheck's own
//        not_governed for the same file, and hidcheck independently reports
//        "fewer than two frames to compare".  Two implementations, one abstention.
//
// ARM C  same shape, and its prediction C1 (violations stay 0) held vacuously --
//        no governed frames means nothing was judged.
//
// ARM D  a fresh journal resets rather than continues.  PASSED.
//
// THE COVERAGE ARM B COULD NOT PROVIDE is tools/p484ident.py PART 2: a
// transcription of IN_Journal_CheckIdentity's gates, run over all 113 journals in
// the tree (113 files, 210,678 governed frames, recorded during focused play).
// It agrees with hidcheck on ALL THREE counters on EVERY file -- violations,
// ghosts and badframes, zero mismatches.  Corpus totals: governed 210678,
// skipped 364, ghosts 152, violations 11, badframes 163.
//
// THE NUMBER THAT SETTLES THE PITCH CHECK, and it is not "zero violations":
// 3 of 110 files carry any violation, 11 frames in 210,678 (0.0052%), and on
// every one of them YAW AND PITCH VIOLATIONS ARE EQUAL AND ARE THE SAME FRAMES --
// PITCH-ONLY IS 0.  They are large instantaneous jumps with no input behind them
// (dpitch -41.8, -28.1, -49.0 against predictions of ~0.02 deg), i.e. server
// angle sets, which the yaw rule has faulted on since Patch 293.  So the honest
// claim is not "honest play is never accused" but the checkable one: THE PITCH
// CHECK ACCUSES NO FILE THE SHIPPED YAW CHECK DOES NOT ALREADY.
//
// A CLAMP BOUND THAT WAS MEASURED RATHER THAN ASSUMED, and getting it wrong is
// not a small error: pitch is clamped (cl_input.c) and yaw is not, and the bound
// is a SERVERINFO value the file does not carry -- cl_main.c reads minpitch/
// maxpitch out of cl.serverinfo, the engine default is -70/+80, and
// cfg/default.cfg sets -89/+89.  Sweeping the corpus with -70/+80 ASSUMED against
// files recorded at +-89 produced 910 pitch failures of which 892 were PITCH-ONLY,
// i.e. 892 false accusations on one honest PB, against 18 with the right bound.
// So a frame whose predicted pitch would leave the envelope is SKIPPED AND
// COUNTED, never modelled.  The engine reads cl.maxpitch/cl.minpitch, which is
// the client's own live value.
//
// ALSO MEASURED AND NOT ASSUMED: the sign.  Sweeping all eight combinations of
// (angle column, key column, count column, sign) over two PBs, exactly two fit at
// ~0 failures -- pitch from dy with kpitch and a POSITIVE sign, yaw from dx with
// kyaw and a NEGATIVE sign -- and the wrong sign gives 38,744 failures against 0.
// hidcheck.py's own comment says the opposite ("The sign convention is the OPPOSITE
// of what it looks like") and that comment is wrong: the measured convention is
// dyaw = -m_yaw*sens*dx + kyaw, which is what the engine does at IN_MoveMouse
// (viewanglechange[YAW] -= m_yaw * mouse_x).  The check was always right; only its
// comment misleads, and this file is the record of which is which.
//
// STILL NOT PROVEN, and it is the important gap: NO ARM HERE CAN MAKE
// in_jrn484_violations NONZERO.  A minimized harness receives no real mouse
// motion and cannot fire a WM_INPUT, so the subject -- injected or rewritten
// motion -- cannot be driven from inside this cfg.  The arm that would is
// p306inj's external SendInput harness, and even that path is rejected and
// COUNTED upstream by Patch 306 rather than reaching the identity.  What is
// proven is that the counters are alive, publish, resist assignment, reset per
// journal, abstain on exactly the frames hidcheck abstains on, and that the C
// gates are the gates calibrated on 210,678 real frames.
//
// NOT DONE, deliberately: nothing consumes these cvars yet.  They are published
// and unverified in the field, and a gate that reads a counter nobody has ever
// seen nonzero is a gate nobody can calibrate.  The consumer (a QC publish beside
// `inprof`, a header key in the .rec, and a pm_verify HOLD) is BACKLOG, and it
// needs the fleet to be collecting journals at all first -- run_evidence_ul is 1,
// so the fleet holds ZERO .hid files and there is no corpus to calibrate against.
//
// ONE JOURNAL PER PROCESS is deliberate: the counters are per-journal (reset in
// IN_JournalBegin_f, NOT cumulative), because they end up in a recording's header
// and a counter that survived a journal begin would attribute one run's ghosts to
// the next one -- the defect SV_RecOpen's reset block exists to prevent.  With one
// journal in the process the cvars and the file describe the same window, which is
// what makes B4 a comparison rather than a coincidence.
//
cfg_save_auto 0
exec cfg/test/_quiet.cfg

developer 1
log_developer 1
set log_enable 1
set log_dir logs
set log_name p484ident

set cl_idlefps 0
set cl_maxfps 100
set rec_hid 1

map surf_rookie
waitmap 45
waitms 3000

// THE CURSOR MUST NOT BE FREE, or every frame is skipped and the arm measures
// nothing.  Key_MouseShouldBeFree() (keys.c) returns true while key_dest is a
// menu or the console, and the engine's BUILTIN menu is open from boot -- so the
// first run of this arm read frames 0 / skipped 180, which looks exactly like a
// dead counter and was in fact a correct one abstaining on every frame.  ui_close
// is the way back (togglemenu only OPENS).  cl_prydoncursor is the other route to
// a free cursor and is read back below rather than assumed to be 0.
ui_close
waitms 500
cl_prydoncursor
key_dest

echo ================================ P484 ARM A -- CONTROL, no journal has run.  Expect -1 -1 -1 -1.
in_jrn484_frames
in_jrn484_ghosts
in_jrn484_violations
in_jrn484_badframes
in_jrn484_skipped
echo ---------------- ARM A: the settings the identity abstains under, read back.  Expect m_filter 0, m_accel 0.
m_filter
m_accel
sensitivity
m_pitch
m_yaw

echo ================================ P484 ARM A2 -- the counters must NOT be settable.  This is the security property, not a tidy-up.
// A counter a console can assign is a counter a server's stufftext can assign,
// and then it says nothing about the player.  CVAR_NOSET is what makes the four
// read-only; this arm tries to break it and MUST still read -1 afterwards.
// FALSIFIER: any of these reading anything but -1 means the counter is writable
// and the whole channel is worthless -- an attacker would publish 0 violations.
set in_jrn484_violations 0
set in_jrn484_ghosts 0
set in_jrn484_frames 999999
set in_jrn484_badframes 0
set in_jrn484_skipped 0
in_jrn484_frames
in_jrn484_ghosts
in_jrn484_violations
in_jrn484_badframes
in_jrn484_skipped

echo ================================ P484 ARM B -- one journal, KEYBOARD ONLY.  Expect frames > 0, violations 0, ghosts 0.
in_journal_begin
waitms 500
echo ---------------- B: turning with the keyboard.  This is a RECORDED keyboard turn, so it is a cause the file carries.
+left
waitms 900
-left
waitms 300
+right
waitms 900
-right
waitms 300
+forward
waitms 700
-forward
waitms 300
+back
waitms 700
-back
waitms 300
+lookup
waitms 600
-lookup
waitms 300
+lookdown
waitms 600
-lookdown
waitms 500
echo ---------------- B: closing the journal to data/p484_B.hid BEFORE reading the counters.
in_journal_end p484_B.hid
waitms 1500
in_jrn484_frames
in_jrn484_ghosts
in_jrn484_violations
in_jrn484_badframes
in_jrn484_skipped
echo ---------------- B4: hidcheck's own verdict on the same file, for the comparison.
echo (graded off-log by tools/p484ident.py, which reads both and compares)

echo ================================ P484 ARM C -- synthetic motion into the same process.  Expect violations to STAY 0.
in_journal_begin
waitms 500
in_journal_synth 40
waitms 800
in_journal_end p484_C.hid
waitms 1500
in_jrn484_frames
in_jrn484_ghosts
in_jrn484_violations
in_jrn484_badframes
in_jrn484_skipped

echo ================================ P484 ARM D -- a fresh journal MUST reset the counters, not continue them.
in_journal_begin
waitms 400
in_journal_end p484_D.hid
waitms 1500
in_jrn484_frames
in_jrn484_ghosts
in_jrn484_violations
in_jrn484_badframes
in_jrn484_skipped
echo ---------------- D: frames here MUST be far below ARM C's.  A cumulative counter would read higher.

echo ================================ END OF RUN ===
quit
