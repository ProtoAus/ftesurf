// Patch 273 -- the headnode memo: is it FASTER, and does it send the SAME entities?
//
// The second question is the one that matters. This cache decides whether an
// entity is transmitted to the client at all. If it is wrong, things vanish or
// appear through walls, and the framerate win would be entirely fake. So every
// arm records BOTH the cost and what was actually sent.
//
// WHY IT SHOULD BE EXACT.  VBSP_HeadnodeVisible(mod, nodenum, visbits) reads
// nothing but its arguments and writes nothing. For a fixed model its answer is a
// pure function of (nodenum, visbits). The memo is keyed on the model pointer, on
// nodenum, and on a full memcmp of visbits -- not on a frame counter, not on the
// view origin, not on a hash. Same bits, same answer, or the key is broken.
//
// MEASURED BEFORE THE MEMO (p273c/p273d, same vantage, developer off):
//     Snapshot build      1761.01 / 1657.26 us    (sv_nopvs 1: 32.31 / 30.39)
//     real framerate       192.0 / 210.2          (sv_nopvs 1: 398.1 / 411.8)
//     4000ms window       573,246 tests, 31,104 descents, 341,374,532 node visits
//
// ARMS, alternated A B A B because the Server row is a per-render-frame average
// and moves when the framerate moves:
//     A  hl2_pvscache 1  (new default)
//     B  hl2_pvscache 0  (the old recompute-every-time path, byte for byte)
//
// THE CORRECTNESS GATE.  `Ent Batches` and `Draw Indicies` in r_speeds are what
// the client actually received and drew. They must be IDENTICAL across A and B.
// A faster arm that draws fewer entities has not made anything faster; it has
// broken the cull, and that is the failure this run exists to catch.

vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000

cl_maxfps 0
cl_idlefps 0
cl_yieldcpu 0
sv_cheats 1

map surf_tensor2
waitmap 600
waitms 9000
r_speeds 2
noclip
waitms 1000
setpos -11776 -13632 13720 0 0 0
waitms 3000

echo ^5=== A1 hl2_pvscache 1 (memo ON)
hl2_pvscache 1
waitms 2500
vbsp_pvsstat
sv_perfdump
waitms 4000
echo ^5--- A1 readings
vbsp_pvsstat
sv_perfdump
waitms 300
r_speeds_dump
waitms 600

echo ^5=== B1 hl2_pvscache 0 (memo OFF -- the old path)
hl2_pvscache 0
waitms 2500
vbsp_pvsstat
sv_perfdump
waitms 4000
echo ^5--- B1 readings
vbsp_pvsstat
sv_perfdump
waitms 300
r_speeds_dump
waitms 600

echo ^5=== A2 hl2_pvscache 1 again
hl2_pvscache 1
waitms 2500
sv_perfdump
waitms 4000
echo ^5--- A2 readings
sv_perfdump
waitms 300
r_speeds_dump
waitms 600

echo ^5=== B2 hl2_pvscache 0 again
hl2_pvscache 0
waitms 2500
sv_perfdump
waitms 4000
echo ^5--- B2 readings
sv_perfdump
waitms 300
r_speeds_dump
waitms 600
hl2_pvscache 1
waitms 1000

// ---- a MOVING correctness check --------------------------------------------
// Standing still is the memo's easiest case: one cluster, one PVS, everything
// hits. Crossing clusters is where a stale answer would show, so walk the stages
// and screenshot each with the memo on. Any entity popping in or out against the
// same vantage in p273b's shots is the tell.
echo ^5=== M moving across clusters, memo ON
setpos -11136 -10475 8720 0 0 0
waitms 2500
r_speeds_dump
waitms 400
setpos 6624 -6955 11472 0 0 0
waitms 2500
sv_perfdump
waitms 3000
sv_perfdump
waitms 300
r_speeds_dump
waitms 600
screenshot p273e_stage5_x
waitms 900
screenshot p273e_stage5
waitms 900
setpos 15216 4096 -7088 0 0 0
waitms 2500
r_speeds_dump
waitms 600

echo ^5=== F CONTROL surf_tensor (memo should barely matter here)
map surf_tensor
waitmap 600
waitms 9000
r_speeds 2
noclip
waitms 2500
sv_perfdump
waitms 3500
sv_perfdump
waitms 300
r_speeds_dump
waitms 800

echo ^5=== END OF RUN ===
waitms 500
quit
