// ---------------------------------------------------------------------------
//  cfg/lobby5.cfg -- the BHOP (HARD) lobby.  QC build 57.
//  See cfg/lobby1.cfg for why the port is the identity and why they are spaced
//  by ten, and cfg/lobby4.cfg for which bhop maps were left out and where the
//  bhop physics come from; only the three per-lobby values live here.
//
//  Momentum tiers 3 to 6 (data/mapmeta.txt column 3).  It stops at
//  bhop_gigaheish, a 6: bhop_plars_hell (8) and bhop_4tele (10) are too hard
//  for a public rotation.
//
//  THE RCON PASSWORD IS INHERITED FROM cfg/lobby.cfg AND IS IN THE REPOSITORY --
//  see the block in cfg/lobby4.cfg.  Move it into cfg/lobby_local.cfg and rotate
//  it before UDP 27550 is forwarded.
//
//  bhop_arcane TALKS TO THE WHOLE LOBBY, AND STAYS ANYWAY.  Its six map outputs
//  `say Secret N Found` pass SV_IOCommand's say/echo/print allow-list
//  (sv_entities.qc), so whoever finds a secret announces it to everyone on the
//  server.  It is kept because it is the only staged map in either bhop
//  rotation (5 stages), which makes it the bhop case for stage 1.
// ---------------------------------------------------------------------------
set sv_port     27550
set hostname    "FTESurf -- bhop (hard)"

set lobby_maps  "bhop_benchpressed bhop_fur bhop_furret bhop_badges_mini bhop_pharma bhop_tranquility bhop_arcane bhop_ragequit bhop_gigaheish"
set lobby_cycle 1800
