// FTESurf build 61 -- the CLIENT-SIDE per-map render baseline.
//
// WHAT THIS IS.  CSQC_WorldLoaded execs this file on every map load, and then
// execs cfg/render_<mapname>.cfg over the top of it if one exists.  This file is
// the general case; the map file is the specific case and wins a conflict.
//
// WHY IT EXISTS AT ALL, since every value in it is already the cvar's own
// registered default: A PER-MAP OVERRIDE HAS TO BE UNDONE.  Without this file,
// cfg/render_surf_tensor2.cfg's `vbsp_glare_interval 0.2` would still be in
// force on the next map you loaded, and on every map after it, with nothing to
// put it back -- which is exactly how mode_bhop.cfg's `cl_netfps 100` ended up
// riding onto every surf map. So the baseline is re-applied first, every time.
//
// WHICH MEANS EVERY LINE HERE IS DUPLICATED IN cl_main.qc's registercvar CALLS,
// and they must agree.  If you change a default in one place, change it in the
// other.  The registercvar value is what you get with these files deleted; this
// file is what you get back after a map override.
//
// NOT THE SAME FILE AS cfg/map_<mapname>.cfg.  That one is the SERVER's ruleset
// layer (Patch 267): it runs in SV_SpawnServer, is counted in the `movement`
// report beside sv_maxvelocity because a run's time is a claim about the
// physics it was set under, and resolves cvars before the CSQC progs have
// registered any of theirs.  Rendering preferences do not belong in it and
// would not reliably work there.  Nothing in THIS file may affect movement,
// prediction, or anything a run's class or time depends on.

// ---- glare occlusion tracing -------------------------------------------
//  The staleness bound for a glare's occlusion answer, in SECONDS.  0 disables
//  the deadline and falls back to vbsp_glare_traces as a fixed per-frame ray
//  count, which is the build 60 behaviour.  See the essay at its registercvar.
set vbsp_glare_interval 0.025
