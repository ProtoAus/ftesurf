// ---------------------------------------------------------------------------
//  cfg/lobby1.cfg -- the TIER 1 lobby.  Patch 275.
//
//  Exec'd AFTER cfg/lobby.cfg, which holds everything the three lobbies share.
//  This file holds only the three things that must differ between them: the
//  port, the name, and the rotation.
//
//  THE PORT IS THE IDENTITY.  sv_lobby.qc's heartbeat sends node="p<sv_port>"
//  and surfd's lobbies table has node as its PRIMARY KEY, so two servers that
//  shared a port would overwrite each other's row and the picker would show one
//  lobby flickering between two maps.  The port is also what makes the node id
//  survive a map change, which an id derived from the map name would not --
//  every rotation would leave the old map advertised beside the new one until
//  surfd's 30-second TTL expired it.
//
//  Spaced by ten rather than consecutive, to leave room underneath each lobby
//  for mapcluster children: sv_cluster.c binds a forked child at sv_port+N.
//  Nothing uses that yet (that is Stage 5), but the numbering is free now and
//  would not be later.
//
//  THE RANGE STARTS AT 27510, NOT 27500, AND THAT IS DELIBERATE.  27500 is the
//  port an unconfigured QuakeWorld server binds by default, so it is the one
//  port that must NOT be forwarded at the router: anything that ends up
//  listening on it -- a test server, someone's listen server, a mistake -- would
//  be exposed to the internet without anyone choosing to expose it.  Leaving
//  27500 closed makes that whole class of accident unreachable rather than
//  merely unlikely.  Renumbered from 27500/27510/27520 in Stage 10.
//
//  TIER 1 IS THE FRONT DOOR.  These are the maps someone who has never surfed
//  can finish, and the list is ordered so the first one loaded is the gentlest.
//  Every entry is confirmed present on the server with an online zone file --
//  a map in this list that is not installed leaves changelevel printing an
//  error and the server sitting exactly where it was.
// ---------------------------------------------------------------------------
set sv_port     27510
set hostname    "FTESurf -- tier 1 (beginner)"

set lobby_maps  "surf_kitsune surf_utopia surf_lux surf_mom surf_ace surf_legends"
set lobby_cycle 1800
