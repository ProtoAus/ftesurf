// Texture tagging.  Aim at a surface and press a key; every press writes one
// greppable line into qconsole.log, which -condebug is already recording.
//
//   F5  noise      -- white-noise static instead of a picture
//   F6  black      -- solid black / missing
//   F7  wrong      -- loads, but it is the wrong texture
//   F8  flat       -- unlit / no lightmap
//   F9  other      -- anything else worth a look
//
// Afterwards:  grep shaderhere ftesurf\qconsole.log
bind F5 "shader_here noise"
bind F6 "shader_here black"
bind F7 "shader_here wrong"
bind F8 "shader_here flat"
bind F9 "shader_here other"
echo "^2texture tagging armed^7 -- aim and press F5 noise / F6 black / F7 wrong / F8 flat / F9 other"
