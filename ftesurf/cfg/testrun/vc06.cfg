// VC06 -- Patch 259 with the scatter: do the colours land on the right vertices?
//
// vc01 bound the .vhv straight onto our vertex array and the fountain came out
// covered in dark blotches -- the counts agreed, the ORDER did not.  VRAD writes
// one colour per LOD0 strip-group vertex, in strip order, so the model's vhvmap
// now says where each one belongs and the plugin scatters through it.
//
// EXPECTED:
//   the drawn count and the used count agree again (the scatter makes every
//   model addressable, so "declined" should be 0 where the map builds one), and
//   the vc1 screenshot is SHADED where the vc0 one is flat -- not blotchy.
//
// The three screenshots are the A/B plus its own noise floor: a and c are the
// same setting, so whatever differs between them is the map animating, and only
// what a-vs-b exceeds that is the feature.

log_enable 1
log_dir "logs"
log_name "vc06"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
sv_cheats 1

wait 200
echo ^5=== vc06: Patch 259 with the VTX scatter ===

map surf_garden
waitmap 1800
waitms 6000

echo ^5-------------------------- surf_garden vc 1 ---------------------------
hl2_lt_baked_vc 1
waitms 1500
prop_census
waitms 400
screenshot vc06_a_pervertex
waitms 700
screenshot vc06_a_pervertex
waitms 700

echo ^5-------------------------- surf_garden vc 0 ---------------------------
hl2_lt_baked_vc 0
waitms 1500
prop_census
waitms 400
screenshot vc06_b_mean
waitms 700
screenshot vc06_b_mean
waitms 700

echo ^5----------------------- surf_garden vc 1 again -------------------------
hl2_lt_baked_vc 1
waitms 1500
screenshot vc06_c_pervertex_again
waitms 700
screenshot vc06_c_pervertex_again
waitms 700
prop_census 170
waitms 600

echo ^5============================ conc_school ==============================
map conc_school
waitmap 1800
waitms 5000
prop_census
waitms 600

echo ^5============================ surf_demise ==============================
map surf_demise
waitmap 1800
waitms 5000
prop_census
waitms 600
screenshot vc06_d_demise
waitms 700
screenshot vc06_d_demise
waitms 700

echo ^5=== vc06 done ===
wait 30
quit
