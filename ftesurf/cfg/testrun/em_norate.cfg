// cfg_save_auto 0: this run sets archived cvars; never let it write them into ftesurf.cfg
cfg_save_auto 0
// em_norate -- Build 53 emitter fix, FINDING 1 (the named rate<=0 counter) and FINDING 2
// (rgbdeltatime on ftesurf_fire).  No shipped entity has SpawnRate <= 0, so the wrapper
// (WF\chain4.ps1) edits the LIVE data/mapparticles.txt for this run only: the first
// "psys surf_tensor2 ..." line gets rate 0 (field 4), and the file is restored afterwards.
// EXPECT in emit_list: "info_particle_system ... 1 with a rate <= 0, skipped (Source: one
// particle, ever)" and NO "unaccounted" line.  r_exportalleffects writes particles/export.cfg;
// the ftesurf_fire block there must carry "rgbchangetime 1.1".
log_enable 1
log_dir logs
log_name em_norate
developer 1
log_developer 1
vid_fullscreen 0
cl_idlefps 0
con_notifylines 0
wait 200
map surf_tensor2
waitmap 600
waitms 8000
echo ^5=== em_norate: emit_list with one tensor2 psys line at rate 0
emit_list
waitms 500
r_exportalleffects
waitms 500
echo ^5=== END OF RUN ===
waitms 300
quit
