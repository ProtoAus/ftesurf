// FTESurf b58spr2 -- the arm b58spr was missing, plus the occlusion ceiling.
//
// b58spr reproduced the artefact and split it the OPPOSITE way from my plan:
// at Lex's own worst vantage, mean luminance was 64.37 with everything on,
// 48.44 with env_lightglow off, and 41.96 with every sprite off.  So the 166
// flares carry +15.93 of the lift and the 263 sprites +6.48 -- the flares are
// 71% of it, not the sprites.  That contradicts my measurement that our
// env_lightglow matches Source per channel at 1.000, so one of the two is
// wrong and this run exists to say which.
//
// WHY THE ARMS NEED REDOING RATHER THAN SUBTRACTING.  b58spr's three arms are
// not perfectly independent: its own census moved from "51 glows inside an
// occluder" (A) to 38 (B) to 0 (C), because vbsp_sprites 0 empties the sprite
// table the occluder skips are counted against.  a1-b1 is therefore ALMOST the
// flares alone but not provably so.  Arm F below turns the sprites off and the
// flares ON -- the arm that did not exist -- so the flare contribution is
// measured directly instead of by subtraction.
//
// ARMS
//   R  everything on.  A same-run baseline; must match b58spr's a1, and if it
//      does not then something outside these cvars is moving between runs and
//      no cross-run number in this investigation means anything.
//   F  flares ONLY (vbsp_sprites 0, vbsp_lightglow 1).  R - F is the sprites,
//      F - (b58spr c1) is the flares, and F must land near 48-58 meanL if the
//      subtraction was honest.
//   G  everything on with vbsp_glare 0, which substitutes glare = 1 for every
//      sprite and skips the occlusion trace entirely.  This is the CEILING: what
//      the frame looks like when occlusion contributes nothing.  b58spr's census
//      said 411 of 422 glares hidden and only 2 of 166 glows drawn, so if G is
//      far brighter than R then the trace is carrying nearly all of the
//      restraint, and any change to it is a change to the whole look.
//
// Same capture rules as b58spr: plain screenshot, two shots per arm, read the
// second, and a same-setting control pair on R for this run's noise floor.
// vbsp_sprites and vbsp_lightglow are load-time, so every arm reloads with
// vbsp_sprite_debug 2 before it shoots.
cfg_save_auto 0
exec cfg/testrun/_quiet.cfg
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "b58spr2"
scr_sshot_type png
cl_yieldcpu 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
// con_notifytime 0 DOES NOT SUPPRESS THE NOTIFY TEXT -- it is read as "never
// expire", so b58spr's arms carried a different amount of console spam over the
// top of the 3D view and every cross-arm luminance number in that run is
// contaminated by it.  A small positive time expires them instead, and
// con_notifylines 0 stops them being drawn at all.  developer stays 1 because
// the census lines this run exists to read are dprints.
con_notifytime 0.01
con_notifylines 0

fov 100

waitms 2500
map surf_tensor2
waitmap 240
waitms 8000
sv_cheats 1
noclip
waitms 500

// ---------------------------------------------------------------- R: baseline
echo "@@@ B58SPR2 R. everything on -- must match b58spr a1"
vbsp_sprites 1
vbsp_lightglow 1
vbsp_glare 1
vbsp_sprite_debug 2
waitms 2000
setpos -10688.5 -1773.8 -8587.1 6.3 91.1 0
waitms 2000
screenshot b58b_r1_x
waitms 900
screenshot b58b_r1
waitms 900
screenshot b58b_r1_ctl
waitms 900

// THE OFF ARM GOES LAST, AND THAT IS NOT COSMETIC.  b58spr's arm D set
// vbsp_sprites back to 1, reloaded with vbsp_sprite_debug 2, and got nothing:
// d1 is byte-identical to c1 (sprites off), and so is e1, so its last two arms
// measured an empty sprite table and its r_renderscale test never happened.
// Once vbsp_sprites 0 has emptied the table the debug-2 reload does not
// repopulate it -- a real bug, reported separately.  So this run never needs to
// turn anything back ON: every arm that switches something off is downstream of
// every arm that needs it on.
//
// ---------------------------------------------------------------- G: no occlusion
// Still everything on, so this is safe to run before F.
echo "@@@ B58SPR2 G. everything on, vbsp_glare 0 -- the ceiling"
vbsp_glare 0
waitms 1500
setpos -10688.5 -1773.8 -8587.1 6.3 91.1 0
waitms 1500
screenshot b58b_g1_x
waitms 900
screenshot b58b_g1
waitms 900
vbsp_glare 1
waitms 1000
// vbsp_glare is read per frame, not at load, so it needs no reload -- and
// restoring it here is testable: R2 must match R1.
screenshot b58b_r2_x
waitms 900
screenshot b58b_r2
waitms 900

// ---------------------------------------------------------------- F: flares only
// LAST.  Nothing after this arm needs a sprite.
echo "@@@ B58SPR2 F. env_lightglow only, every env_sprite off"
vbsp_sprites 0
vbsp_lightglow 1
vbsp_sprite_debug 2
waitms 2000
setpos -10688.5 -1773.8 -8587.1 6.3 91.1 0
waitms 1500
screenshot b58b_f1_x
waitms 900
screenshot b58b_f1
waitms 900

// One more census at the end, with the trace back on, so the log carries the
// glow breakdown (reached / one-sided / trace-hidden / out of fade / drawn) at
// this exact vantage rather than at the spawn.
vbsp_sprite_debug 1
waitms 1000

echo "@@@ B58SPR2 DONE"
waitms 1200
quit
