// IMPOSTER02 -- Patch 263, the two checks imposter01 cannot make in one process.
//
// 1. hl2_imposter 0.  It is CVAR_MAPLATCH, so it has to be set BEFORE the map
//    that reads it.  On surf_monolith the imposter slab is 4 units under the
//    map's real sky brush, so nodraw should reveal sky138a -- and sky138a is
//    six 1024x1024 BLUE faces.  Blue here and red in imposter01 is the pair of
//    readings that proves both branches work and that the two are distinct.
//
//    This is also the check that the salmon was an OCCLUDER, not a broken sky.
//
// 2. Generic, not per-map.  surf_polytron carries 22 WindowImposter materials,
//    bhop_angst 13 -- the two heaviest users in the library.  Different maps in
//    one process are fine; it is `map x` TWICE that does not reload, so
//    hl2_imposter is set once per map, before each load.
//
// bhop_angst is doing double duty: it was also a Patch 261 verification map, so
// its tp_refract_cyan/_green should still resolve.  A regression there would
// mean this patch disturbed the include path, which it should not have.

log_enable 1
log_dir "logs"
log_name "imposter02"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
con_notifylines 0
developer 1
log_developer 1

wait 200

echo ^5=== hl2_imposter 0 BEFORE the load -- it is MAPLATCH ===
hl2_imposter 0
waitms 300
map surf_monolith
waitmap 2400
waitms 10000

hl2_imposter
waitms 500
echo ^5=== nodraw: the material should carry surfaceparm nodraw, no program ===
r_showshader fakeskies/mpa45
waitms 800

sv_cheats 1
waitms 300
noclip
waitms 400

echo ^5=== bonus 4 with the slab invisible: expect BLUE sky138a, not red ===
setpos -10975.05 -5482.11 15936.03 -70 178 0
waitms 1600
screenshot imp02_x
waitms 700
screenshot imp02_monolith_nodraw_up
waitms 700

setpos -10975.05 -5482.11 15936.03 0 178 0
waitms 1600
screenshot imp02_b_x
waitms 700
screenshot imp02_monolith_nodraw_fwd
waitms 700

echo ^5=== surf_polytron: 22 imposters, the heaviest user in the library ===
hl2_imposter 1
waitms 300
map surf_polytron
waitmap 2400
waitms 10000
hl2_unresolved
hl2_unresolved_visible
waitms 800
screenshot imp02_polytron_x
waitms 700
screenshot imp02_polytron_spawn
waitms 700

echo ^5=== bhop_angst: 13 imposters, and a Patch 261 regression check ===
map bhop_angst
waitmap 2400
waitms 10000
hl2_unresolved
hl2_unresolved_visible
waitms 800
echo ^5=== Patch 261 must still hold here ===
r_showshader effects/tp_refract_cyan
waitms 700
r_showshader effects/tp_refract_algetic
waitms 700
screenshot imp02_angst_x
waitms 700
screenshot imp02_angst_spawn
waitms 700

echo ^5=== imposter02 done ===
wait 30
quit
