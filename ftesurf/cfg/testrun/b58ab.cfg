// FTESurf b58ab -- build 58's Source dimming, A/B'd in ONE process at the two
// vantages Lex photographed against Source.
//
// His reference pair shows what this has to match: in Source the door lights are
// tight compact glows with clean falloff and there are NO large translucent
// rectangles anywhere; in ours the same lights are about the right size but the
// frame carries big hard-edged boxes and a haze over everything. Measured at his
// own worst vantage, the flares alone lifted the frame +17.30 mean luma and the
// sprites +10.26, against an everything-off baseline of 40.29 and a zero floor.
//
// WHAT BUILD 58 CHANGED, and what each arm is therefore testing:
//   sprites -- renderamt is applied TWICE for kRenderGlow/kRenderWorldGlow
//              (Source folds it into RGB and again as the vertex alpha the
//              additive blend multiplies), plus an inverse-square distance fade
//              clamp((1200/dist)^2,0,1). We had one renderamt and no fade.
//   flares  -- the occlusion answer is now a FRACTION (five rays against
//              Source's own proxy quad) instead of 1-or-0.
//   both    -- gated on vbsp_sprite_source, read per frame, so this file can
//              toggle it live. That is the point: the pixel noise floor is
//              per-run, so an A/B across two processes is not honest.
//
// THE 6-SECOND SETTLE IS NOT PADDING. The occlusion fraction reaches a glare
// through Sprite_Glare's amortised round-robin, and the budget counts RAYS: at
// vbsp_glare_traces 8 that is 1.6 glares a frame over 429, so a full pass takes
// ~4.5 s. Screenshotting straight after a toggle photographs the PREVIOUS arm's
// fractions still ramping -- the frozen-cache trap, which has already cost this
// project one wrong conclusion. Every arm waits 6 s before it shoots.
//
// A/B/A, not A/B: the third arm must match the first, or something other than
// the cvar moved between them.
//
// PASS: the on arms are visibly dimmer than the off arms, the rectangles are
//       gone or much fainter, the door lights stay recognisable rather than
//       vanishing, and the census line reports a non-zero "sprite(s) dimmed"
//       whenever the switch is on and zero when it is off. That counter is the
//       liveness proof a stale frame cannot fake.
// FAIL: identical arms with the counter moving  -> the maths is a no-op.
//       identical arms with the counter at zero -> the switch never reached it.
cfg_save_auto 0
exec cfg/testrun/_quiet.cfg
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "b58ab"
scr_sshot_type png
cl_yieldcpu 0
vid_vsync 0
crosshair 0
// con_notifytime 0 means NEVER EXPIRE, not never show -- it contaminated the
// first measurement run with console text. A small positive value expires them.
con_notifytime 0.01
con_notifylines 0

// His settings, so the framing matches his screenshots.
fov 100

waitms 2500
map surf_tensor2
waitmap 240
waitms 8000

// NO noclip and NO setpos anywhere in this file: these are the two places he
// actually photographed -- the map's own spawn, and `say !s 1`. The space in
// "!s 1" is required (sv_player.qc:911); "!s1" is a different, dead path.

// ================================================================= SPAWN
echo "@@@ B58AB spawn / source dimming ON"
vbsp_sprite_source 1
vbsp_glare_rays 5
waitms 6000
vbsp_sprite_debug 1
waitms 500
screenshot b58ab_spawn_on_x
waitms 900
screenshot b58ab_spawn_on
waitms 900
screenshot b58ab_spawn_on_ctl
waitms 900

echo "@@@ B58AB spawn / source dimming OFF -- what he reported"
vbsp_sprite_source 0
waitms 6000
vbsp_sprite_debug 1
waitms 500
screenshot b58ab_spawn_off_x
waitms 900
screenshot b58ab_spawn_off
waitms 900

echo "@@@ B58AB spawn / back ON -- must match the first arm"
vbsp_sprite_source 1
waitms 6000
screenshot b58ab_spawn_on2_x
waitms 900
screenshot b58ab_spawn_on2
waitms 900

// ================================================================= STAGE 1
say !s 1
waitms 4000

echo "@@@ B58AB stage1 / source dimming ON"
vbsp_sprite_source 1
waitms 6000
vbsp_sprite_debug 1
waitms 500
screenshot b58ab_s1_on_x
waitms 900
screenshot b58ab_s1_on
waitms 900

echo "@@@ B58AB stage1 / source dimming OFF"
vbsp_sprite_source 0
waitms 6000
vbsp_sprite_debug 1
waitms 500
screenshot b58ab_s1_off_x
waitms 900
screenshot b58ab_s1_off
waitms 900

echo "@@@ B58AB stage1 / back ON"
vbsp_sprite_source 1
waitms 6000
screenshot b58ab_s1_on2_x
waitms 900
screenshot b58ab_s1_on2
waitms 900

// ================================================================= WORST FRAME
// The two vantages above are where Lex photographed, and they are NOT where the
// artefact is worst -- the census reports only 11 of 429 sprites and 2 glows
// surviving the cull at spawn, so there is very little there for the fix to dim
// and the measured effect is correspondingly small (+0.46 mean luma at spawn,
// +0.74 at stage 1). This third vantage is the one the artefact was measured at:
// sample 0 of his own 3,173-frame recording of the run he reported, where the
// sprites and flares together lift the frame by +27.56 mean luma against an
// everything-off baseline of 40.29. If the fix does not move THIS frame, it does
// not fix the thing that was reported.
//
// noclip only to hold the position; the frame is what a player sees.
sv_cheats 1
noclip
waitms 500
setpos -10688.5 -1773.8 -8587.1 6.3 91.1 0
waitms 2000

echo "@@@ B58AB worst / source dimming ON"
vbsp_sprite_source 1
waitms 6000
vbsp_sprite_debug 1
waitms 500
screenshot b58ab_worst_on_x
waitms 900
screenshot b58ab_worst_on
waitms 900
screenshot b58ab_worst_on_ctl
waitms 900

echo "@@@ B58AB worst / source dimming OFF"
vbsp_sprite_source 0
waitms 6000
vbsp_sprite_debug 1
waitms 500
screenshot b58ab_worst_off_x
waitms 900
screenshot b58ab_worst_off
waitms 900

echo "@@@ B58AB worst / back ON"
vbsp_sprite_source 1
waitms 6000
vbsp_sprite_debug 1
waitms 500
screenshot b58ab_worst_on2_x
waitms 900
screenshot b58ab_worst_on2
waitms 900

// And the flare half on its own, so the two mechanisms can be told apart at the
// vantage where both are largest: rays 1 restores the old binary occlusion while
// leaving the sprite dimming on.
echo "@@@ B58AB worst / rays 1 -- sprite dimming on, flare fraction off"
vbsp_glare_rays 1
waitms 6000
vbsp_sprite_debug 1
waitms 500
screenshot b58ab_worst_r1_x
waitms 900
screenshot b58ab_worst_r1
waitms 900
vbsp_glare_rays 5
waitms 1000

echo "@@@ B58AB DONE"
waitms 1200
quit
