// TINT06 -- Patch 237 verification on surf_rise.
//
// Two fixes, both visible in the program NAME, so this is checkable without
// having to find the right wall first.
//
// surf_rise's fences and grates are authored:
//
//   soniccolours/sonicfence.vmt
//       $alphatest 1   $alphatestreference 0.3
//       $envmap "env_cubemap"   $envmaptint "[0 0 0]"
//   soniccolours/sonicwallgratea.vmt
//       $alphatest 1   $alphatestreference 0.3
//       $envmap "env_cubemap"   $envmaptint "[0.02 0.01 0.01]"
//
// BEFORE:
//   #MASK=0.5      -- $alphatestreference parsed at :789 and never read again,
//                     so a wire authored to survive to 0.3 was cut at 0.5
//   no #ENVTINT for sonicfence, because `envmaptint_b > 0.0f` cannot tell
//                     "said nothing" from "said none" -> shader default
//                     1.0,1.0,1.0 -> the cubemap (this map's own sky) added at
//                     FULL WHITE where the author asked for none
//   #ENVTINT present for sonicwallgratea, whose blue is 0.01 and therefore
//                     non-zero -- which is exactly why this read as "some
//                     surfaces and not others"
//
// EXPECTED AFTER:
//   sonicfence       ... #MASK=0.300000#MASKLT ... #ENVTINT=0.000000,0.000000,0.000000
//   sonicwallgratea  ... #MASK=0.300000#MASKLT ... #ENVTINT=0.020000,0.010000,0.010000
//
// CONTROL: bhop_futile's de_nuke/nuke_metalgrate_01 writes $alphatest 1 with NO
// $alphatestreference, so it must still say #MASK=0.500000 -- Source's default,
// and the value the old constant happened to be right about.  That one is
// checked in tint07 rather than here so this run stays on one map.

log_enable 1
log_dir "logs"
log_name "tint06"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
sv_cheats 1
developer 0

wait 200
echo ^5=== tint06: Patch 237 on surf_rise ===

map surf_rise
waitmap 1800
waitms 4000
con_clear

echo ^5=========== the two fences and the grate ===========
r_shaderpasses soniccolours/sonicfence
waitms 400
r_shaderpasses soniccolours/sonicfence2
waitms 400
r_shaderpasses soniccolours/sonicwallgratea
waitms 400

echo ^5=========== the cubemap-patched clones VBSP actually draws ===========
r_shaderpasses maps/surf_rise/soniccolours/sonicfence_8960_-4352_1280
waitms 400
r_shaderpasses maps/surf_rise/soniccolours/sonicfence2_8960_-4352_1280
waitms 400

echo ^5=========== BODY of one, to read the args in order ===========
r_showshader soniccolours/sonicfence
waitms 400

noclip
waitms 300
screenshot tint06_rise_spawn
waitms 1200

echo ^5=== tint06 done ===
wait 30
quit
