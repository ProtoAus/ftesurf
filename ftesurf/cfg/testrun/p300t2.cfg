// FTESurf Patch 300 -- verification run 1 of 2: does the additive fog fix work?
//
// THE BUG.  A shader with no TOP-LEVEL program takes BE_ProglessFogBegin, which
// enables fixed-function GL fog.  That fog mixes toward GL_FOG_COLOR on RGB and
// cannot know the surface is additive.  surf_tensor2's light sprites are
// gl_one/gl_one with a BGR888 texture -- no alpha channel at all -- so black IS
// the mask, and a black texel mixed toward the fog colour comes out as
// fogcolour*(1-fac) and is then ADDED.  The masked part of the quad stops being
// masked and the sprite draws as a flat translucent rectangle.  Lex's words:
// "a big square of transucent color".
//
// THE FIX (Patch 300).  Additive materials now get a real top-level program
// (vmt/unlit + #ADDITIVE), which skips that path entirely and calls
// sys/fog.h's fog4additive() -- `c * vec4(fac,fac,fac,1)`, i.e. fade toward
// BLACK.  Black stays black, so the mask survives.
//
// ===================================================================
// THE PRE-REGISTERED PREDICTION, written before the run, so it can fail.
// ===================================================================
// surf_tensor2: fogstart -2500, fogend 15000, fogcolor 41 66 90.
//     fac(z) = (15000 - z) / (15000 + 2500) = (15000 - z)/17500
// At the vantage below the dominant sprites are ~2896 units out:
//     fac(2896) = 12104/17500 = 0.6917
//
// OLD (fixed-function, mixes toward fog colour): a BLACK texel becomes
//     fogcolour * (1 - 0.6917) = 0.3083 * (41,66,90) = (12.6, 20.3, 27.7)
// and that is ADDED.  That is the rectangle.
//
// NEW (fog4additive): black * 0.6917 = BLACK.  Nothing added.  The glow cores
// dim to 69% of their unfogged value, which is correct -- fog dims a distant
// light, it does not paint a box around it.
//
// THE DECISIVE ARM IS A-vs-B, AND IT IS BINARY.
// r_fog_progless gates the program-LESS path only.  After Patch 300 the sprites
// are on a program, so toggling it must no longer change them AT ALL:
//     PASS: arm A and arm B are identical over the sprite region (within the
//           same-setting noise floor that A/A_ctl establishes).
//     FAIL: they differ -- then the materials did not actually move onto the
//           program, whatever the census line claims.
// This is a much stronger test than "does it look better", because it cannot be
// satisfied by the fix merely changing the artefact's colour.
//
// WHY THERE IS NO "WORLD STILL FOGS" CONTROL IN THIS FILE, and why that is not
// an oversight: tensor2's world faces are LightmappedGeneric, which has ALWAYS
// emitted a top-level program, so r_fog_progless never moved them either.  After
// Patch 297 fixed the 2D half, this map may have nothing left that progless
// affects -- which would make A==B trivially true and prove nothing on its own.
// THAT IS WHAT p300bor.cfg IS FOR: surf_boreas's cloud layer is program-less by
// design (Patch 266) and MUST still respond to progless.  Run both.  One file
// showing no change is not a result; the pair is.
//
// vbsp_lightglow_scale 1, NOT the 10 saved in ftesurf.cfg.  At 10 this vantage
// reads luma 238 -- a white-out that cannot show a (13,20,28) difference, which
// is exactly how nine arms of b58box were wasted.
cfg_save_auto 0
exec cfg/testrun/_quiet.cfg
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "p300t2"
scr_sshot_type png
cl_yieldcpu 0
vid_vsync 0
crosshair 0
fov 100
con_notifylines 0
con_notifytime 0.01
cl_maxfps 100

// Default is 1; set explicitly so the log records which arm generated the
// shaders, rather than leaving it to whatever ftesurf.cfg last saved.
hl2_additivefog 1

waitms 2500
map surf_tensor2
waitmap 240
waitms 8000
sv_cheats 1
noclip
waitms 500

vbsp_sprites 1
vbsp_lightglow 1
vbsp_lightglow_scale 1
vbsp_sprite_source 1
r_renderscale 2
show_fps 1

// Lex's own worst vantage: two 2304-unit sprites at ~2900 units plus 24 flares,
// against a dark wall that a faint additive lift reads against.
setpos -10688.5 -1773.8 -8587.1 6.3 91.1 0
waitms 6000

// Record what the translator actually did.  vmt_stat_addprog/addpass print at map
// load; this is here so the numbers sit beside the arms in one log.
echo "@@@ P300T2 state -- expect: 263 Sprite + 166 UnlitGeneric additive moved"
hl2_additivefog
r_fog_progless
r_fog_linear
waitms 1200

echo "@@@ P300T2 A. r_fog_progless 1 (default)"
r_fog_progless 1
waitms 2000
screenshot p300t2_A_x
waitms 1000
screenshot p300t2_A
waitms 1000
screenshot p300t2_A_ctl
waitms 1000

echo "@@@ P300T2 B. r_fog_progless 0 -- MUST match A on the sprites"
r_fog_progless 0
waitms 2000
screenshot p300t2_B_x
waitms 1000
screenshot p300t2_B
waitms 1000

echo "@@@ P300T2 C. back to 1 -- must match A"
r_fog_progless 1
waitms 2000
screenshot p300t2_C_x
waitms 1000
screenshot p300t2_C
waitms 1000

echo "@@@ P300T2 DONE"
waitms 1200
quit
