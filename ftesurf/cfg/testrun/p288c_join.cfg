// FTESurf p288c -- JOIN half.  Same map, same vantages, as a CONNECTED client.
//
// Compare strictly against:
//     p288a_hub.png  vs  p288c_hub.png
//     p288a_s1.png   vs  p288c_s1.png
// and both against the Sept 4 baselines p220_hub100.png / p220_s1.png.
//
// WHAT COULD LEGITIMATELY DIFFER, so a difference is attributable rather than
// merely observed:
//   * FS_AutoMountForMap has exactly one call site, sv_ccmds.c:1091 inside
//     SV_Map_f -- so a JOINING client never automounts a map's extra Steam
//     pack.  surf_kitsune carries no line in data/mapdeps.txt, so this one is
//     ruled out HERE, but it is live for the nine rotation maps that do.
//   * cl_parse.c:3441-3444 switches the client's gamedir to whatever the server
//     names, which moves every material search path.
//   * CSQC may fail to load (Patch 282); that changes the HUD, not world alpha.
//
// NO rcon_password in this file.  p278b_join.cfg:72 carries one and it is a
// leak from the client end; the build-57 rcon value is burned and must be rotated, not
// copied into another config.
cfg_save_auto 0
exec cfg/testrun/_quiet.cfg
developer 1
// log_enable, not just log_developer -- it defaults to "0" (common/log.c:11)
// and a config setting only the name writes no file and says nothing about it.
log_enable 1
log_developer 1
log_dir "logs"
log_name "p288c"
scr_sshot_type png
cl_yieldcpu 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0

wait 200
echo "@@@ P288C connecting to the host on 27600"
connect 127.0.0.1:27600

// Long, because the loading screen spends frames and `wait` counts FRAMES.
wait 900
waitms 8000

// Prove WHICH server and WHICH gamedir this picture came from, so the pair
// cannot later be mistaken for two runs of the same configuration.
echo "@@@ P288C identity"
fs_game
cl_serverinfo

echo "@@@ P288C hub exit (cf. p288a_hub, p220_hub100)"
setpos 0 -620 150 0 90 0
waitms 3000
screenshot_mega p288c_hub 1280 720
waitms 800

echo "@@@ P288C stage 1 entry -- the rainbow corridor (cf. p288a_s1, p220_s1)"
setpos -15360 -15252 870 0 270 0
waitms 3000
screenshot_mega p288c_s1 1280 720
waitms 800

echo "@@@ P288C stage 1, oblique"
setpos -15360 -15252 870 0 315 0
waitms 2500
screenshot_mega p288c_s1_oblique 1280 720
waitms 800

echo "@@@ P288C DONE"
waitms 1000
quit
