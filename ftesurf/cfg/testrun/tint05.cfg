// TINT05 -- Patch 236 verification.
//
// BEFORE (tint03.log, same map, same vantage):
//   body:      program "vmt/vertexlit#VERTEXCOL#VERTEXALPHA"
//   resolved:  decals/ivy02  noLIGHTMAP  sort=6  passes=6  prog=<none>
//   on screen: flat opaque olive rectangle with only the ivy leaves masked
//
// EXPECTED AFTER:
//   body:      program "vmt/lightmapped#VERTEXCOL#VERTEXALPHA"
//   resolved:  decals/ivy02  HASLIGHTMAP  sort=11 (SHADER_SORT_BLEND)  prog=vmt/lightmapped
//   on screen: a decal -- masked, blended, and lit by the wall it is on
//
// The controls are deliberately materials this patch must NOT move:
//   concrete/concretefloor024a   a plain lit wall, no $decal   -> unchanged, sort 5
//   de_nuke/nuke_metalgrate_01   $alphatest, no $decal         -> unchanged
//   glass/combineglass001a       $envmap+$translucent, no $decal -> unchanged, sort 11
// If any of those move, the condition is too wide.

log_enable 1
log_dir "logs"
log_name "tint05"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
sv_cheats 1
developer 0

wait 200
echo ^5=== tint05: Patch 236 verification on bhop_futile ===

map bhop_futile
waitmap 900
waitms 2500
con_clear

echo ^5=========== RESOLVED: the four decal materials (want a real prog) ===========
r_shaderpasses decals/ivy02
waitms 300
r_shaderpasses decals/ivy03
waitms 300
r_shaderpasses decals/decalstain002a
waitms 300
r_shaderpasses cs_assault/assault_crate_decal_1
waitms 300

echo ^5=========== CONTROLS: must be unchanged ===========
r_shaderpasses concrete/concretefloor024a
waitms 300
r_shaderpasses de_nuke/nuke_metalgrate_01
waitms 300
r_shaderpasses glass/combineglass001a
waitms 300

echo ^5=========== BODY, to confirm the routing ===========
r_showshader decals/ivy02
waitms 400

// noclip ONCE, before any setpos.
noclip
waitms 300

echo ^5--- save007: the ivy decal + the black panels ---
setpos 540.3427 4427.8555 7510.5981 11.9092 143.9758 0
wait 150
waitms 800
screenshot tint05_s7
waitms 1200

echo ^5--- save005: the grate ---
setpos 5482.3599 2014.7155 9158.1182 -0.1978 -0.4285 0
wait 150
waitms 800
screenshot tint05_s5
waitms 1200

echo ^5--- save006 ---
setpos 5592.3066 5815.3398 7559.6045 0.1758 88.5168 0
wait 150
waitms 800
screenshot tint05_s6
waitms 1200

echo ^5=== tint05 done ===
wait 30
quit
