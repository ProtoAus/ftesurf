// Build 32 -- the other side of "ghost flies at noclip speed".
//
// b32a measured the GHOST at 1040 u/s and 2080 held, and matched it against a
// number read out of PMSrc_NoClipMove.  That is half a proof: it shows ghost
// obeys the formula, not that noclip does.  Both halves are cheap, so measure
// both rather than trusting a source read on one of them -- the claim being
// made to Lex is "these two are the same speed", and nothing so far has put a
// stopwatch on noclip.
//
// Same method, same durations, so the two logs difference directly: hold
// +forward for two wall-clock seconds and difference the position.  `viewpos`
// is the readout here because the body is what moves in noclip; `ghost status`
// was the readout there because the camera is.
//
// Expected, if the two agree:  ~2080 units plain, ~4160 with +speed held.

waitms 2000

echo ^5=== b32c: what does noclip actually fly at? ===

scr_conalpha 0
con_notifytime 0
cl_idlefps 0

map surf_null
waitmap 240
wait 60

noclip
waitms 500

// +jump HELD FOR THE WHOLE MEASUREMENT, and the first run of this file is why.
//
// Mark 3 -> 4 crossed one of surf_null's resets: the position jumped to an
// unrelated part of the map and the angle row went from `0 -180 0` to `0 0 0`,
// which is a teleport snapping the aim.  A distance differenced across that is
// not a speed, and it looked like one.
//
// Build 13's SV_TeleportBypassed is the intended way out -- noclip AND +jump
// together pass through a trigger_teleport, noclip alone does not, deliberately.
// The key costs nothing here because PMSrc_NoClipMove drops upmove while
// BUTTON_JUMP is held (Patch 154), so holding it does not also fly us upward.
//
// Which is a small joke at this file's expense: the thing that spoiled the
// control run is the same thing build 32 is fixing on the ghost side.
+jump
waitms 300

echo ^5--- plain: expect ~2080 units over 2s (4 x 260) ---
echo ^5(noclip mark 1)
cmd viewpos
waitms 300
+forward
waitms 2000
-forward
waitms 300
echo ^5(noclip mark 2)
cmd viewpos
waitms 300

echo ^5--- +speed: expect ~4160 units over 2s ---
+speed
waitms 300
echo ^5(noclip mark 3)
cmd viewpos
waitms 300
+forward
waitms 2000
-forward
waitms 300
echo ^5(noclip mark 4)
cmd viewpos
-speed
waitms 300

-jump
noclip
waitms 300

echo ^5=== b32c done ===
wait 30
quit
