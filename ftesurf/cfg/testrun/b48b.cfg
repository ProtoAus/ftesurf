// B48B -- the red ! mark on a cheated stage row, read as a NUMBER (row class
// word) and as a PICTURE (the gutter glyph), with two controls: the
// hud_splits_class 0 arm draws no marks, and a replay of the .rec this run
// writes rebuilds the list with class 0 (a .rec carries no per-stage word --
// SF_KNOWN clear) and so draws none either.
log_enable 1
log_dir "logs"
log_name "b48b"
developer 1
log_developer 1
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0
sv_cheats 1
wait 200
map bhop_eazy
waitmap 1800
waitms 2500
hud_results 1
hud_results_toast 1
hud_splits 1
hud_splits_class 1
echo ^5=== b48b: 1. start ===
noclip
cmd zone_goto 0 0 0
waitms 700
+forward
waitms 1000
-forward
waitms 400
echo ^5=== b48b: 2. boundary 1 -> row stage 1 ===
setpos 2200 512 144 0 0 0
waitms 300
+forward
waitms 1000
-forward
waitms 500
echo ^5=== b48b: 3. boundary 2 -> row stage 2 ===
setpos 200 -1728 144 0 180 0
waitms 300
+forward
waitms 1000
-forward
waitms 600
cmd viewpos
timer
waitms 600
screenshot b48b_marks_x
waitms 700
screenshot b48b_marks
echo ^5=== b48b: 4. falsifier -- hud_splits_class 0 draws no mark ===
hud_splits_class 0
waitms 500
screenshot b48b_nomark_x
waitms 700
screenshot b48b_nomark
hud_splits_class 1
echo ^5=== b48b: 5. boundary 3 and the end, so a .rec exists to replay ===
setpos 2200 -864 144 0 0 0
waitms 300
+forward
waitms 1000
-forward
waitms 400
setpos 2640 -1300 144 0 -90 0
waitms 300
+forward
waitms 900
-forward
waitms 800
cmd viewpos
timer
waitms 900
echo ^5=== b48b: 6. replay control -- rows rebuilt from the file carry class 0 ===
replay data/runs/bhop_eazy/main/cheat.rec
waitms 2500
replay status
timer
waitms 600
screenshot b48b_replay_x
waitms 700
screenshot b48b_replay
replay stop
waitms 400
echo ^5=== b48b: done ===
quit
