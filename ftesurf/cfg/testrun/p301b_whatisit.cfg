cfg_save_auto 0
// Fault 4, run 2 -- NAME THE BLACK BLOCK.
//
// Run 1 settled the following and they are not re-tested here:
//   - MDLF_NEEDOVERBRIGHT agrees: r_texdiag prints shift=1 overbright=1 for BOTH
//     maps/surf_tensor2.bsp and *101:maps/surf_tensor2.bsp.  Hypothesis dead.
//   - gl_overbright is INERT at runtime on a VBSP map: 0, 1, 2 and
//     gl_overbright_all 1 all produced byte-identical region means (to 0.1).
//     So run 1's B2/B4/B6 are DISCARDED, not read as "the brush ignores
//     overbright".  If overbright is ever to be tested it needs +set at launch.
//   - there is NO global exposure crush: floor and ceiling are ratio 1.000
//     between r_drawentities 1 and 0, while the walls are 4-6.4x.
//
// WHAT RUN 1 FOUND, and why this run exists:
//   at Lex's save008 (the startzone) a large block dead centre draws at
//   [9.6 14.1 18.1] against a floor at [22.8 29.7 38.0].  Backing out the fog
//   (14.3% of 41 66 90 even at zero range, because fogstart is -2500) that is a
//   surface colour of [4.3 5.5 6.1] against the floor's [19.7 23.7 29.3].
//   AND the side walls blow out to [225 236 251] -- but only with entities on;
//   with r_drawentities 0 they sit at a sane [35 47 61].  That is a SECOND and
//   quite separate fault, a glow/sprite one, and it is captured here too.
//
// I HAVE NOT VERIFIED THE BLOCK IS *101.  The projected screen box of *101 from
// this camera is y 600..984 spanning the full width, which is the lower part of
// the frame, NOT the centre block.  So the block may be a different entity
// entirely and every offline measurement of *101 may be about the wrong object.
// That is what this run settles, and nothing else should be concluded until it
// does.  shader_here / solidhere name what is under the crosshair; Patch 264's
// CL_SH_PrintCandidates lists brush ENTITIES too, which lighthere cannot.
vid_fullscreen 0
vid_restart
waitms 3000
wait 200

developer 1
log_developer 1
log_enable 1
log_dir logs
log_name p301b_whatisit
cl_maxfps 0
cl_idlefps 0
sv_cheats 1
con_notifylines 0
con_notifytime 0.01
r_drawviewmodel 0

map surf_tensor2
waitmap 600
waitms 9000
waitms 3000
noclip
waitms 1000

// same camera as run 1 / Lex's save008, then three aims from it.
alias vblock "setpos -10751.1777 9562.7969 -9789.3184 -0.0934 89.4342 0; waitms 2000"
alias vfloor "setpos -10751.1777 9562.7969 -9789.3184 35.0 89.4342 0; waitms 2000"
alias vwall  "setpos -10751.1777 9562.7969 -9789.3184 -0.0934 160.0 0; waitms 2000"

echo ^5=== C1: crosshair on the BLACK BLOCK
vblock
shader_here blockcentre
solidhere blockcentre
lighthere blockcentre
screenshot p301b_c1_block

echo ^5=== C2: crosshair on the FLOOR -- the control surface
vfloor
shader_here floor
solidhere floor
lighthere floor
screenshot p301b_c2_floor

echo ^5=== C3: crosshair on the BLOWN-OUT LEFT WALL
vwall
shader_here wallglow
solidhere wallglow
lighthere wallglow
screenshot p301b_c3_wall

echo ^5=== C4: r_fullbright 1 -- does the block have a lightmap problem or a texture problem?
r_fullbright 1
waitms 2000
vblock
screenshot p301b_c4_fullbright
vwall
screenshot p301b_c5_fullbright_wall
r_fullbright 0
waitms 2000

echo ^5=== C6: entities off, crosshair on the block -- is the block still there?
r_drawentities 0
waitms 2000
vblock
shader_here block_noents
solidhere block_noents
screenshot p301b_c6_block_noents
r_drawentities 1
waitms 2000

echo ^5=== C7: repeat control -- must equal C1
vblock
screenshot p301b_c7_repeat

echo ^5=== END OF RUN ===
waitms 500
quit
