// SPR06 -- the frame cost, with an instrument that actually includes CSQC.
//
// SPR05 USED THE WRONG TOOL AND ITS NUMBERS MEAN NOTHING.  `timerefresh` calls
// R_RenderView() directly in a loop (gl_rmisc.c:462-490); it never runs
// CSQC_UpdateView, so nothing R_BeginPolygon queues is in the scene it times.
// It also takes its FRAME COUNT as the second argument -- `timerefresh 512` is
// finish=512, frames=128.  Both arms were timing the same sprite-free scene,
// which is exactly why the ON arm came out FASTER than the OFF arm.
//
// show_fps 1 is a framerate average over a whole second of real frames, so it
// includes CSQC_UpdateView and everything queued from it.  cl_maxfps is 340 in
// the shipped config and would flatten both arms to the same number, so it goes
// to 0 here, and cl_yieldcpu 0 as the cvar's own description advises for
// benchmarking.
//
// surf_grotto from the SPR03 camera: 464 beams, 425 of them past the cull.
// Two samples per arm, interleaved, three seconds of settling before each shot.

log_enable 1
log_dir "logs"
log_name "spr06"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
sv_cheats 1
rec_retry 1
vbsp_sprites 1
cl_maxfps 0
cl_yieldcpu 0
vid_vsync 0
show_fps 1
hud_debug 0
hud_keys 0
hud_speed 0

wait 200
vbsp_spotlights 1
map surf_grotto
waitmap 1800
waitms 6000
noclip
waitms 300
setpos 2324 -1998 3388 13.5 0.0 0
waitms 4000
screenshot spr06_on_1
waitms 1000

vbsp_spotlights 0
retry
waitmap 1800
waitms 5000
noclip
setpos 2324 -1998 3388 13.5 0.0 0
waitms 4000
screenshot spr06_off_1
waitms 1000

vbsp_spotlights 1
retry
waitmap 1800
waitms 5000
noclip
setpos 2324 -1998 3388 13.5 0.0 0
waitms 4000
screenshot spr06_on_2
waitms 1000

vbsp_spotlights 0
retry
waitmap 1800
waitms 5000
noclip
setpos 2324 -1998 3388 13.5 0.0 0
waitms 4000
screenshot spr06_off_2
waitms 1000

echo ^5=== spr06 done ===
wait 30
quit
