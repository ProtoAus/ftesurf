// Patch 220 -- the aperture was being submitted with another model's mesh header.
//
// The claim: GLBE_GenerateBatchTextures renders whole scenes (GLR_DrawPortal ->
// R_RenderScene) between GLBE_SubmitMeshesSortList's buildmeshes call and its
// GLBE_SubmitBatch, and R_GAlias_DrawBatch hands every alias batch in the engine
// a pointer to ONE file-static mesh_t.  So by the time the doorway quad is
// submitted, batch->mesh describes whichever alias model the recursed view built
// last -- a prop's index count read out of a four-vertex quad's element buffer,
// which rasterises nothing.  The far view in the FBO was correct the whole time.
//
// THE LOG IS THE EVIDENCE, NOT THE PICTURE.  This map animates (CUSTOM/
// RAINBOWSCROLL scrolls at rate 1) and a screenshot pair seconds apart has
// already produced one false positive on this bug.  So the decisive line is the
// new one, printed only when the rebuild actually changes the header:
//
//   [portal] ftesurf_portal: mesh clobbered by the recursed view --
//            was about to submit idx <N> vert <N> firstelem <N>,
//            rebuilt to idx 6 vert 4 firstelem 0
//
// If that line does not appear at all, the mechanism did not fire on this map
// and Patch 220 is not the fix for the black doorway (it is still correct).
// If it appears and the doorway is still black, the fix is necessary but not
// sufficient -- go to the debug-colour experiment in the plan.
//
// The four cameras are G15/G16's, deliberately, so the shots are directly
// comparable with screenshots/g16_new_hub100.png, g16_new_oblique.png and
// g16_new_s1.png taken on the pre-220 binary.

cfg_save_auto 0
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "p220"
scr_sshot_type png
cl_yieldcpu 0
cl_maxfps 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0
vbsp_portal_render 1
r_portalfbo 1
r_refract_fbo 1
r_portalrecursion 2
r_portalmaxviews 2

waitms 2500

map surf_kitsune
waitmap 240
waitms 8000
sv_cheats 1

echo "@@@ P220 hub exit, 100 units back (cf. g16_new_hub100)"
setpos 0 -620 150 0 90 0
waitms 3000
screenshot_mega p220_hub100 1280 720
waitms 800

echo "@@@ P220 hub exit, oblique (cf. g16_new_oblique)"
setpos -90 -620 150 0 55 0
waitms 3000
screenshot_mega p220_oblique 1280 720
waitms 800

echo "@@@ P220 s1 entry, 100 units back (cf. g16_new_s1)"
setpos -15360 -15252 870 0 270 0
waitms 3000
screenshot_mega p220_s1 1280 720
waitms 800

// A second sample of the same camera, a beat later.  Two shots of the same
// frame prove nothing about an animated material; two shots a second apart
// bound how much of any difference is just the scroll phase.
echo "@@@ P220 s1 entry again, for the scroll-phase noise floor"
waitms 1200
screenshot_mega p220_s1_again 1280 720
waitms 800

echo "@@@ P220 DONE"
waitms 1000
quit
