// LADDER01 -- Patch 260, the A/B: does the player actually climb?
//
// Map and position come from the Patch 260 precondition run (probe259.cfg):
// bhop_monster_jam's ladder brush 1, (6640 -4164 3776)-(6672 -4160 3964),
// contents 0x30000008 = LADDER|TRANSLUCENT|GRATE -- the GRATE family, which is
// 73.0% of the library's 1750 ladder brushes, so it is the representative case
// rather than a convenient one.  The probe measured 0x10034000
// LADDER|PLAYERCLIP|MONSTERCLIP in trace.contents there under the UNMODIFIED
// MASK_PLAYERSOLID, which is why this build is a mover port and not a mask fix.
//
// WHY THE PLAYER IS PLACED BACK FROM THE LADDER AND MADE TO WALK IN.
// LadderDistance() is 2 units while unattached and 10 once attached
// (mom_gamemovement.cpp:71).  The probe fired a 24-unit trace and hit at
// fraction 0.2423 -- a 5.8-unit gap from the hull face -- so a player merely
// setpos'd near the ladder is NOT within reach of the 2-unit probe and would
// never attach.  That is correct Source behaviour, not a bug: you walk into a
// ladder to grab it.  So the test holds +forward and lets the mover do it.
//
// THE MEASUREMENT IS Z.  run_eyeinfo prints the eye's origin z, and climbing is
// the only thing at this spot that raises it -- the ladder is 188 units tall
// against a wall.  A ladder that does not work leaves z flat, because walking
// into a wall goes nowhere.
//
// Each state is run twice.  A single number here is worth very little: if the
// two A runs disagree with each other as much as A disagrees with B, the run has
// measured noise rather than the cvar.

log_enable 1
log_dir "logs"
log_name "ladder01"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
con_notifylines 0
developer 1
log_developer 1

wait 200
map bhop_monster_jam
waitmap 1800
waitms 8000
sv_cheats 1
waitms 400
pm_dispprobe 0
pm_ladderprobe 0

echo ^5=== A1: pm_ladders 0 (expect no climb) ===
pm_ladders 0
waitms 300
setpos 6656 -4186 3780 0 90 0
waitms 1200
cmd run_eyeinfo
waitms 600
+forward
waitms 3000
cmd run_eyeinfo
waitms 600
-forward
waitms 400
cmd run_eyeinfo
waitms 800

echo ^5=== B1: pm_ladders 1 (expect climb) ===
pm_ladders 1
waitms 300
setpos 6656 -4186 3780 0 90 0
waitms 1200
cmd run_eyeinfo
waitms 600
+forward
waitms 3000
cmd run_eyeinfo
waitms 600
-forward
waitms 400
cmd run_eyeinfo
waitms 800

echo ^5=== A2: pm_ladders 0 again ===
pm_ladders 0
waitms 300
setpos 6656 -4186 3780 0 90 0
waitms 1200
cmd run_eyeinfo
waitms 600
+forward
waitms 3000
cmd run_eyeinfo
waitms 600
-forward
waitms 400
cmd run_eyeinfo
waitms 800

echo ^5=== B2: pm_ladders 1 again ===
pm_ladders 1
waitms 300
setpos 6656 -4186 3780 0 90 0
waitms 1200
cmd run_eyeinfo
waitms 600
+forward
waitms 3000
cmd run_eyeinfo
waitms 600
-forward
waitms 400
cmd run_eyeinfo
waitms 800

// Descend: back away from the rungs while attached should climb DOWN, not
// detach.  Held for the same 3s from the top of the previous climb.
echo ^5=== B3: pm_ladders 1, climb then descend ===
pm_ladders 1
waitms 300
setpos 6656 -4186 3780 0 90 0
waitms 1200
+forward
waitms 3000
-forward
waitms 200
cmd run_eyeinfo
waitms 600
+back
waitms 2000
-back
waitms 400
cmd run_eyeinfo
waitms 800

// Jump off: velocity should be replaced by normal*270 and the player should
// leave the ladder rather than stick to it.
echo ^5=== B4: pm_ladders 1, climb then jump off ===
pm_ladders 1
waitms 300
setpos 6656 -4186 3780 0 90 0
waitms 1200
+forward
waitms 2500
cmd run_eyeinfo
waitms 400
+jump
waitms 200
-jump
-forward
waitms 1200
cmd run_eyeinfo
waitms 800

echo ^5=== CONTROL: pm_ladders 1 on open ground, must not attach ===
setpos 10529.1 -324.1 5361.3 0 123.7 0
waitms 1200
cmd run_eyeinfo
waitms 400
+forward
waitms 1500
-forward
waitms 400
cmd run_eyeinfo
waitms 800

echo ^5=== ladder01 done ===
pm_ladders 0
wait 30
quit
