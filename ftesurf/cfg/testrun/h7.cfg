// H7 -- through a portal: DRAWN BUT UNLIT, or NOT DRAWN?
//
// Where this run starts from, so the arms mean something:
//   * the recursion runs -- portal on vs off differs in 28% of pixels (h3)
//   * it draws the correct far-side geometry -- stage 1's red neon grid floor
//     comes through looking as it does in the main view (h3)
//   * it is NOT vis culling -- r_novis 1 gave a PIXEL-IDENTICAL frame (h5)
//   * it is NOT the skyroom -- r_fastsky 1 left saturation at 0.632 vs 0.634, and
//     the control arm differed MORE than the test arm (h6)
//   * the PVS origin is already correct -- cl_portal.qc's FS_PortalTransformView
//     writes trace_endpos = lpd_ob + lpd_fb*8, the exit doorway a step into the
//     room, which pr_csqc.c:8800 reads into r_refdef.pvsorigin
//
// So the surfaces are reaching the renderer and coming out black.  These three
// cvars say which stage eats them, and they disagree with each other cleanly:
//
//   r_fullbright 1  draws every surface at full brightness with no lightmap.
//                   If the far room APPEARS, the geometry is being submitted and
//                   only its lighting is lost -> lightmap/lightstyle binding under
//                   recursion.  If the aperture stays black while the rest of the
//                   hub brightens, the geometry never reaches the backend.
//   r_lightmap 1    draws the lightmap alone.  Names which of the two it is.
//   r_showtris 1    draws wireframe over everything, INCLUDING surfaces that
//                   shaded to black -- so it sees geometry that r_fullbright
//                   cannot explain away.
//
// Arm 5 restores the baseline; if it does not match arm 1 the toggles are not what
// moved the picture.  vbsp_portal_debug 1 makes the log name every door offered to
// the renderer, so "which portal am I even looking at" stops being an inference.

cfg_save_auto 0
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "h7"
scr_sshot_type png
cl_yieldcpu 0
cl_maxfps 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0
r_voidvis 1
vbsp_portal_render 1

waitms 2500
map surf_kitsune
waitmap 240
waitms 8000
sv_cheats 1
vbsp_portal_debug 1

// settle exactly as h3 did, so the camera lands where h3's did
setpos 0 -560 184 0 90 0
waitms 3000
setpos 0 -640 184 0 90 0
waitms 4000

echo "@@@ H7 arm 1 -- baseline"
screenshot_mega h7_base 1280 720
waitms 600

echo "@@@ H7 arm 2 -- r_fullbright 1"
r_fullbright 1
waitms 3000
screenshot_mega h7_fb 1280 720
waitms 600
r_fullbright 0
waitms 2000

echo "@@@ H7 arm 3 -- r_lightmap 1"
r_lightmap 1
waitms 3000
screenshot_mega h7_lm 1280 720
waitms 600
r_lightmap 0
waitms 2000

echo "@@@ H7 arm 4 -- r_showtris 1"
r_showtris 1
waitms 3000
screenshot_mega h7_tris 1280 720
waitms 600
r_showtris 0
waitms 2000

echo "@@@ H7 arm 5 -- baseline again (control)"
waitms 2000
screenshot_mega h7_base2 1280 720
waitms 600

echo "@@@ H7 DONE"
waitms 1000
quit
