// VC02 -- is the surf_leesriize_ksf crash in vc01 caused by Patch 259, or was
// it already there?
//
// vc01 died mid-load on that map with no Sys_Error and no dump.  It is also the
// map the fixup census singled out (819 props whose vertex order is not VRAD's),
// so "my new code did it" is the obvious reading and has to be tested rather
// than assumed.  hl2_lt_baked is CVAR_MAPLATCH, so the mode comes in on the
// command line; run this three times:
//
//   +set hl2_lt_baked 2 +set log_name vc02_m2   the new path
//   +set hl2_lt_baked 1 +set log_name vc02_m1   Patch 163's path, unchanged
//   +set hl2_lt_baked 0 +set log_name vc02_m0   no bake read at all
//
// If 1 and 0 die at the same point, the per-vertex array is not the cause.

log_enable 1
log_dir "logs"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
sv_cheats 1

wait 200
echo ^5=== vc02: surf_leesriize_ksf ===
hl2_lt_baked
waitms 200

map surf_leesriize_ksf
waitmap 1800
waitms 6000

echo ^5================= it survived the load. now the census ==================
prop_census
waitms 800
screenshot vc02_lees
waitms 600
screenshot vc02_lees
waitms 600

echo ^5=== vc02 done ===
wait 30
quit
