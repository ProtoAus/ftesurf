// VMT261 -- verify the half of Patch 261 that surf_monolith cannot verify.
//
// surf_monolith exercises the BACKSLASH cause only:
//     include "materials\effects\tp_refract_algetic.vmt"
// The census found a second cause on surf_doomsday, worth 3 of the 23:
//     include "MATERIALS/PK02/PK02_SAND01.vmt"
// which double-prefixes because strncmp is case-SENSITIVE, not because of any
// separator.  That path is otherwise untested in-game, so it gets its own run.
//
// The three affected materials are the per-cubemap variants Source generates
// under maps/<mapname>/, each a `patch` around a shared base:
//     maps/surf_doomsday/pk02/pk02_sand01_7464_-936_-1360
//     maps/surf_doomsday/metal/metal_grate02_sg_7464_-936_-1360
// If the include now resolves, r_showshader prints a material with a real
// diffusemap; before the fix the include failed and the whole material fell back
// to no_texture.  The base each one includes is printed as the control -- it
// always resolved, so the two should agree.
//
// bhop_angst is the largest single case in the library (7) and is loaded second
// as a second opinion.  Two different maps in one process is fine; it is `map x`
// TWICE that does not reload.

log_enable 1
log_dir "logs"
log_name "vmt261"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
con_notifylines 0
developer 1
log_developer 1

wait 200
map surf_doomsday
waitmap 2400
waitms 9000

echo ^5=== surf_doomsday: resolve counters ===
hl2_unresolved
hl2_unresolved_visible
waitms 1000

echo ^5=== the case-prefix patch materials ===
r_showshader maps/surf_doomsday/pk02/pk02_sand01_7464_-936_-1360
waitms 700
r_showshader maps/surf_doomsday/metal/metal_grate02_sg_7464_-936_-1360
waitms 700
echo ^5=== controls: the bases they include ===
r_showshader pk02/pk02_sand01
waitms 700
r_showshader metal/metal_grate02_sg
waitms 700

echo ^5=== second opinion: bhop_angst, 7 backslash includes ===
map bhop_angst
waitmap 2400
waitms 9000
hl2_unresolved
hl2_unresolved_visible
waitms 1000
r_showshader effects/tp_refract_cyan
waitms 700
r_showshader effects/tp_refract_green
waitms 700
r_showshader effects/tp_refract_algetic
waitms 700

echo ^5=== vmt261 done ===
wait 30
quit
