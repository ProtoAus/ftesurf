waitms 2500

echo "@@@ B60S B. cull 1.25, adaptive 0, traces 40 -- build 59"
vbsp_glare_cull 1.25
waitms 8000
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 700
