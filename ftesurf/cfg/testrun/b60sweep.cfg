waitms 2500

echo "@@@ B60S C. cull 1.25, adaptive 8, traces 40 -- build 60"
vbsp_glare_adaptive 8
waitms 8000
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 700
