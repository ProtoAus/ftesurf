// FTESurf build 60 -- THE SWEEP LATENCY, MEASURED WITH THE RIGHT DENOMINATOR.
//
// WHY THIS RUN EXISTS, AND IT IS A CORRECTION.  The census line I added in
// build 59 divided the map's sprite count by the glares TRACED per frame to get
// "frames per sweep".  That is the wrong denominator: the round-robin cursor
// advances once per VISIT, and a culled glare is exactly a visit that costs no
// rays and still advances the cursor.  So the figure understated every cull.
// It told me the view cull moved the sweep from 54 frames to 50, and on the
// strength of that I told Lex the cull "bought almost nothing" -- while the
// same census was printing 68 culled and 20 traced in one frame, i.e. 88 visits
// and a sweep five times shorter than the line claimed.
//
// The census now prints VISITS and divides by that.  This run reads the four
// configurations that matter with the corrected figure, several samples each
// because visits-per-frame legitimately varies with where the cursor happens to
// be: glares are clustered by region, so one frame's 40 rays may be spent
// crossing a stretch that is all culled and the next may be all visible.
// THE MEAN OVER SAMPLES IS THE MEASUREMENT; a single sample is not.
//
// ===================================================================
// PREDICTION, REGISTERED BEFORE THE RUN
// ===================================================================
//   A  cull 0    adaptive 0   traces 40  -- build 58: 8 traced, 8 visits,
//                                           sweep ~54 frames.  This is the one
//                                           arm where the old formula was right,
//                                           because with no cull visits == traced.
//   B  cull 1.25 adaptive 0   traces 40  -- build 59: ~32 visits, sweep ~13.
//                                           If B is near 50 the correction is
//                                           wrong and the old line was right.
//   C  cull 1.25 adaptive 8   traces 40  -- build 60: ~120 visits, sweep ~4.
//   D  cull 1.25 adaptive 8   traces 12  -- build 60 at build 58's price.
//   E  cull 1.25 adaptive 0   traces 40  -- B again.  A and E are the controls
//                                           for every claim made about B and C.
//
// fps is expected to track the RAY BUDGET only: A/B/C/E all spend 40 rays a
// frame and should read the same ~405-415, D should read ~635.  fps moving
// between A, B and C would mean the cull or the adaptive path costs real time
// per visit, which is the one way this could be a bad trade.
//
//   FAIL: B's sweep is not several-fold better than A's -> the cull really is
//         inert and the build 59 line was right after all.
//   FAIL: C's fps is below A's by more than the A-vs-E spread -> the adaptive
//         branch costs more per visit than the rays it saves.
cfg_save_auto 0
exec cfg/testrun/_quiet.cfg
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "b60sweep"
scr_sshot_type png
cl_yieldcpu 0
vid_vsync 0
crosshair 0
fov 100
con_notifylines 0
con_notifytime 0.01
cl_maxfps 0

r_fog_progless 1
hl2_additivefog 1

waitms 2500
map surf_tensor2
waitmap 240
waitms 8000
sv_cheats 1
noclip
waitms 500

vbsp_sprites 1
vbsp_lightglow 1
vbsp_lightglow_scale 1
vbsp_sprite_source 1
vbsp_glare 1
vbsp_glare_rays 5
vbsp_glare_traces 40
vbsp_glare_brush 2
r_renderscale 1
show_fps 1

setpos -10688.5 -1773.8 -8587.1 6.3 91.1 0
waitms 25000

echo "@@@ B60S A. cull 0, adaptive 0, traces 40 -- build 58"
vbsp_glare_cull 0
vbsp_glare_adaptive 0
waitms 8000
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 700
