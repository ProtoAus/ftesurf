cfg_save_auto 0
// BUILD 79 AGAINST THE LIVE FLEET -- does the journal qcrequest survive the real
// path?
//
// b79hid.cfg measured six arms on a listen server, which is one process talking
// to itself.  This asks the same question of the deployed build over the path a
// player actually takes: a Windows x86-64 client, the router, the public
// internet, and an aarch64 dedicated server running the qwprogs.dat that
// build.ps1 -Pi put there.  That is the b73live lesson -- verifying against
// 127.0.0.1 "is not the path any player takes" -- applied before a claim rather
// than after one.
//
// AND IT COVERS ONE THING THE LISTEN-SERVER RUN STRUCTURALLY CANNOT.  On a listen
// server the csprogs emitting the event and the qwprogs dispatching it were built
// in the same second by the same fteqcc, so a build-79 client is guaranteed to be
// talking to a build-79 server.  Here they are two artefacts on two machines and
// two architectures, joined by a function NAME no compiler on either side checks.
// b78live's log read `Downloading csprogsvers/<hash>.dat`, so the client is
// expected to run the LOBBY's csprogs rather than its own -- which is the half of
// the trust argument that makes the other half worth anything, and is recorded
// below as a control rather than assumed.
//
// PRE-REGISTERED, on lobby 4 (bhop_eazy, 27540):
//
//   A  CONTROL.  Stock, journal on.  MUST read `said 1  hid 1  would 0`.  A
//      `said 0` here means the event did not survive the trip and the fleet is
//      stamping TF_NOJOURNAL on every run; nothing below would mean anything.
//      A `hid 0` means no consent record on this install -- wrong install, and
//      every arm below reads hid 0 for a reason this file is not testing.
//
//   B  THE FORGERY, which is the arm the whole build exists for, measured
//      against a server a player could actually be standing on:
//          rec_hid 0 ; setinfo rechid 1
//      MUST read `key "1"` -- the string build 78 read and accepted -- beside
//      `said 1  hid 0  would 1`.
//
//   C  RECOVERY AND THE CACHE.  rec_hid 1.  MUST read `hid 1  would 0`.  Note
//      the key is "1" in both B and C, so this arm is only observable in the
//      `hid` column at all: a forged claim of journalling and an honest one are
//      the same four bytes.  A stale `hid 0` here is the event having been sent
//      outside Rec_HidReport's cache, and it would demote a player who had just
//      turned their journal back on.
//
// FALSIFIED IF A reads said 0 or hid 0, or B reads would 0, or C reads would 1.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name b79live
developer 0

name "^3Lex Journal79"

rec_hid 1
cl_nocsqc 0

waitms 40000
menu_restart
waitms 3000

echo ================================ B79LIVE -- connect to lobby 4 (bhop_eazy)
connect play.proto.bar:27540
waitms 20000

echo ================================ B79LIVE ARM A -- control.  Expect said 1, hid 1, would 0.
waitms 4000
cmd timer
waitms 3000

echo ================================ B79LIVE ARM B -- the forgery.  Expect key "1", hid 0, would 1.
rec_hid 0
waitms 2500
setinfo rechid 1
waitms 4000
cmd timer
waitms 3000

echo ================================ B79LIVE ARM C -- recovery.  Expect hid 1, would 0.
rec_hid 1
waitms 4000
cmd timer
waitms 3000

echo ================================ B79LIVE done
rec_hid 1
waitms 1000
quit

// ============================================================================
// MEASURED 2026-09-14, lobby 4 over the public internet, QC build 79 deployed
// to all twelve.  Every arm met its pre-registered expectation.
//
//   arm  key   said  hid  nojournal  would  exp
//   A    "1"    1     1       0        0     0   CONTROL
//   B    "1"    1     0       0        1     1   THE FORGERY
//   C    "1"    1     1       0        0     0   recovery + cache
//
// THE CONTROL THAT SAYS THIS IS REMOTE AT ALL, because a client that silently
// fell back to a listen server would produce this exact table and mean nothing:
//
//     Connecting to play.proto.bar:27540...
//     180.150.62.57:27540: challenge
//     180.150.62.57:27540: Connected to play.proto.bar:27540 (plain-text).
//
// -- the public IP, not the LAN address and not loopback.  (b78live notes that
// `status` is NOT this control: it reports the LOCAL server and printed "Server
// is not running" there.  Not repeated in this script for that reason.)
//
// AND THE CONTROL THAT SAYS THE TRUST ARGUMENT HOLDS END TO END:
//
//     Downloading csprogsvers/59db0f43.dat...
//
// The client refused its own copy and ran the lobby's.  So the chain measured
// here is the whole one: the server publishes its csprogs hash, the client pulls
// the server's, THAT csprogs emits the qcrequest, and an aarch64 qwprogs.dat
// dispatches it into CSEv_rechid_f.  Nothing in arm B's verdict came from code
// the player could edit.
//
// THAT HASH ALSO SETTLED A DOUBT WORTH WRITING DOWN.  Build 78's csprogs was
// `bdef4f37` and build 79's is `59db0f43` -- and both are 2,857,250 bytes,
// exactly.  Adding a sendevent call to cl_replay.qc changed the content and left
// the size unmoved, which is a coincidence of fteqcc's layout and not a mistake.
// It is recorded because the wrong inference was available and tempting: an
// unchanged byte count looked for a moment like a csprogs that had not rebuilt,
// i.e. like arm A being about to fail for a build reason.  A size is not a
// version, and the engine agrees -- it pins the HASH.
//
// ARM B IS THE ONE THAT MATTERS AND IT IS NOW MEASURED SOMEWHERE A PLAYER COULD
// STAND.  `rec_hid 0 ; setinfo rechid 1` is the same two console lines that
// ranked a journal-less run under build 78, against a server on the other side
// of a router: key clean, CSQC says otherwise, would 1.
//
// ARMS B AND C SHARE A `key` AND DIFFER IN `hid`, which is the argument for the
// whole patch surviving the trip intact: there is no reading of that userinfo
// key, however careful, that could have separated the forgery from the recovery.
// ============================================================================
