// cfg/testrun/p270_net.cfg -- Patch 270 Stage 1b self-test.
//
// Proves BOTH new things with ONE client and no second person, by using
// lobby_av_self 1 to make the client receive its own avatar:
//
//   1. hud_net's "per body" figure tracks lobby_av_rate.  This is the
//      load-bearing measurement of the whole lobby design -- if the avatar
//      were networked the way a player edict is, it would read ~66.7 whatever
//      the rate cvar said (SVFTE_DeltaCalcBits, sv_ents.c:998-1006).
//   2. lobby_av_self 0 really does stop the entity being SENT, not merely
//      drawn -- the body count must fall to 0, because .nodrawtoclient is a
//      `continue` in the entity gather (sv_ents.c:4213) and a client cannot
//      count an entity it was never told about.
//
// THE LEADING `wait` IS LOAD-BEARING AND COST TWO RUNS TO FIND.
//
// A startup +exec is processed BEFORE the mod is initialised -- the log puts
// "execing cfg/testrun/p270_net.cfg" ABOVE "------- FTESurf Initialized -------"
// -- and a `map` issued that early is silently dropped.  No error, no map, and
// the script cheerfully goes on to take three screenshots of the engine's
// built-in fallback menu, all of which LOOK like a rendering bug rather than a
// scripting one.  Putting `+map` on the command line instead does not help
// either: exec is hoisted ahead of it.
//
// One `wait` past the end of startup is all it takes, and it has to be here in
// the buffer rather than expressed as command-line ordering.  Run:
//
//   ftesurf64.exe +set hud_net 1 +set lobby_enable 1 +set lobby_avatars 1 \
//                 +set lobby_av_rate 15 +set lobby_av_self 1 \
//                 +exec cfg/testrun/p270_net.cfg

wait 200
echo "^3p270:^7 loading map"
map surf_borderlands

// THE PLAYER HAS TO BE MOVING, and a still player is not a broken counter.
//
// The first run of this script read `upd/s 0.0` beside `bodies 1`, which looks
// exactly like a counter that does not work.  It was right.  A stationary
// player's avatar has an unchanging origin and yaw, so the delta compressor
// sends nothing at all, and zero updates a second is the correct and desirable
// answer -- it is the entire reason a separate entity was used instead of the
// player edict, which would have gone on re-sending regardless
// (SVFTE_DeltaCalcBits, sv_ents.c:998-1006).
//
// +left rather than +forward, because turning cannot be stopped by a wall: the
// yaw changes on every pose for the whole run, so the measured rate is not
// quietly capped by the geometry half way through a window.
wait 120
+left

// `wait n` counts FRAMES, not seconds (Patch 164), and this runs uncapped at
// around a thousand a second on a small window -- so these are ~1-2 s each,
// comfortably more than the panel's one-second sampling window.
wait 1500
echo "^3p270:^7 shot 1, lobby_av_rate 15"
screenshot p270_net_rate15

wait 60
lobby_av_rate 5
wait 1500
screenshot p270_net_rate5

wait 60
lobby_av_self 0
wait 1500
screenshot p270_net_selfoff

wait 60
quit
