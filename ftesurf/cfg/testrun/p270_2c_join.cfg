// cfg/testrun/p270_2c_join.cfg -- Patch 270 Stage 2, the guest half.
//
// Connects to the host on 127.0.0.1 and photographs what it can see.
//
// THE DISCRIMINATOR IS hud_net's "bodies" FIGURE, not the picture.  A body can
// be hard to spot in a screenshot of a large map -- the other player may be
// behind you, or a dark silhouette against dark geometry -- so the panel is
// what turns this from "I think I see someone" into a number.  It counts
// entities carrying a player model that are ACTIVE in the current snapshot
// (cl_netmon.qc), so:
//
//   bodies 1   the host's avatar arrived and is being networked.  Expected.
//   bodies 0   either no avatar was spawned (the lobby_avatars registration
//              trap) or it is not reaching this client at all.
//
// It must read 1 and not 2: lobby_av_self is 0, so this client is not sent its
// OWN avatar -- .nodrawtoclient is a `continue` in the entity gather
// (sv_ents.c:4211-4214), so it is never told about it rather than merely not
// drawing it.
//
// `connect` needs the same leading wait as `map` does, and for the same reason.

wait 200

// CAP THE FRAME RATE, OR `wait` MEANS NOTHING.
//
// `//` AND NEVER `/* */`.  FTE's config parser has no block comments at all:
// Cbuf_ExecuteLevel's only comment test is text[i]=='/' && text[i+1]=='/'
// (cmd.c:493), so every line between a /* and a */ is EXECUTED AS A COMMAND.
// This block used to be a /* */ pair and every run of this script silently
// issued `CAP` and `*/` -- twelve Unknown-command lines across six runs in
// logs/p270join.log, none of which anyone noticed, because neither happens to
// be a real command.  That is luck, not safety: a comment containing the word
// `quit`, `map`, `kill` or `disconnect` at the start of a line would have fired
// it in the middle of a test.  Found in Patch 278.
// `wait n` counts FRAMES (Patch 164), and ftesurf.cfg sets cl_maxfps 0 -- so at
// the menu this client renders at ~1900 fps and `wait 6000` is THREE SECONDS.
// The first attempt at this test used 6000 expecting it to cover a connect plus
// a surf_borderlands load, screenshotted the engine's built-in fallback menu,
// and looked exactly like the menu VM had failed to load.
//
// Capped at 100, `wait n` is n centiseconds of RENDERED time, and time spent
// stalled in a map load does not advance it -- which is the property wanted
// here: the waits below are measured from when the client is actually drawing.
cl_maxfps 100

// A `connect` NEEDS MUCH LONGER THAN A `map` DOES, and the second attempt at
// this test is why the number is 1500 rather than 200.
//
// 200 frames is enough for `map` (Stage 1b) but not for this: the connect goes
// out before the client's networking is ready, fails, and RETRIES -- and the
// retry loop happily eats the whole rest of the script.  The log reads
//
//     Connecting to 127.0.0.1:27600...
//     Connection lost or aborted (127.0.0.1:27600)      x8
//     p270: guest shot                                  <- screenshot here
//     ...
//     Initializing menu.dat                             <- mod only starts NOW
//
// so the screenshots were taken while disconnected and showed the engine's
// built-in fallback menu -- which looks exactly like the menu VM having failed
// to load rather than like a timing bug.  The connection then succeeded on a
// later retry, after the script had already finished with it: the HOST's log
// says "GUESTPLAYER connected" and "entered the game" for a run whose pictures
// show a main menu.
//
// 15 s at the capped rate puts this well past "Initializing menu.dat".
wait 1500

echo "^3p270:^7 guest connecting"
connect 127.0.0.1:27600

// 90 s of rendered frames.  40 was not enough and the reason is not obvious:
// the client renders the LOADING SCREEN at the capped rate too, so the map load
// spends the wait rather than pausing it.  The budget has to cover the whole
// load plus time in the game, not just time in the game.
wait 9000
echo "^3p270:^7 guest shot"
screenshot p270_2c_join

// Second shot one step later.  `screenshot` captures the frame BEFORE the
// command is processed, so a single shot taken right after a state change
// photographs the state before it (Stage 1b, the hard way).
wait 100
screenshot p270_2c_join2

// Disconnect cleanly rather than being killed, because the DISCONNECT is itself
// under test: PVSF_NOREMOVE used to make an avatar impossible to remove at all,
// so a player who left stood frozen on every other screen until the edict slot
// recycled.  The host's log is where that shows.
wait 200
disconnect
wait 300
quit
