// B46SELF -- the two selftests, against the build 46 progs.
//
// Build 46 is four lines in the taint chain (SV_CheatsOn, SV_CheatLevel's
// comment, SV_NoclipWatch's essay, one gate in sv_saveloc) and touches neither
// the player move nor the zone parser, so these are expected to be unchanged.
// Run anyway: "expected to be unchanged" is the state in which a regression is
// cheapest to miss and most expensive to find later.
//
// EXPECT: pm_selftest "all checks passed", zone_selftest "all 22 checks passed".

log_enable 1
log_dir "logs"
log_name "b46self"
developer 1
log_developer 1
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0
sv_cheats 0

wait 200
map bhop_eazy
waitmap 1800
waitms 2500

echo ^5=== b46self: selftests ===
pm_selftest
waitms 400
zone_selftest
waitms 400

echo ^5=== b46self: done ===
waitms 600
quit
