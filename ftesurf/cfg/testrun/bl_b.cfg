// BL_B -- surf_borderlands_h: same art (mapRevision 20), HDR lump, 3266/3266 lit faces aligned. The control.
//   ftesurf64.exe +set vid_fullscreen 0 +set log_dir logs +set log_name bl_b +exec cfg/testrun/bl_b.cfg
log_enable 1
log_dir "logs"
developer 1
log_developer 1
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 0
con_notifytime 0
con_notifylines 0
con_notifytime_error 0
sv_cheats 1
r_texdiag 1
r_novis 1
r_lightmap 0
wait 200
echo ^5=== bl_b: surf_borderlands_h ===
map surf_borderlands_h
waitmap 2400
waitms 9000
noclip
// V1: the spawn, info_player_start 10496 -16112 11369 angles 0 90 0
setpos 10496 -16112 11369 0 90 0
waitms 2500
cmd viewpos
screenshot bl_b_x
waitms 700
screenshot bl_b_1_spawn
waitms 700
// V2: face 128, SKYPPY3/METAL_PLATE01A, 400 luxels, x 5632..7424 z 1952..4976 at y=-3008, normal +y; camera 700 out looking -y.
setpos 6528 -2308 3232 0 270 0
waitms 2500
cmd viewpos
screenshot bl_b_x
waitms 700
screenshot bl_b_2_plate
waitms 700
r_lightmap 1
waitms 700
screenshot bl_b_x
waitms 700
screenshot bl_b_3_plate_lm
r_lightmap 0
waitms 700
hl2_missing
r_showshader SKYPPY3/METAL_PLATE01A
r_shaderpasses SKYPPY3/METAL_PLATE01A
waitms 1000
quit
