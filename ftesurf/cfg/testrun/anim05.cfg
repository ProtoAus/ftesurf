// ANIM05 -- the #UNLIT fix, on the maps that actually have unlit flipbooks.
//
// WHAT THIS IS CHECKING.  hl2_animated 1 reroutes 927 materials across 269 maps,
// and 456 of them -- 49% -- are UnlitGeneric.  mat_vmt.c's UnlitGeneric arm
// (:2001) draws an unclaimed one as a plain pass with NO lightmap, because unlit
// means unlit; vmt/animated multiplied by one unconditionally, and `!!samps
// lightmap` is not passive -- it sets SHADER_HASLIGHTMAP, which is the flag
// Mod_LightmapAllocSurf gates on, so the surface was handed a real page with the
// room's real lighting.  Patch 252 gates the sampler declaration itself on
// `!UNLIT` (gl_shader.c:2137-2143) so no page is allocated at all.
//
// THE MAPS ARE CHOSEN FROM A STATIC CENSUS OF THE PAKFILES, and the expected
// numbers are written down HERE, before the run, so the new census line is a
// check and not a readout:
//
//     surf_the_internet    41 flipbooks, 34 unlit   (screens: youtube clips)
//     bhop_avantasia       50 flipbooks, 42 unlit   (animated ads)
//     surf_axil            50 flipbooks, 50 unlit   (all of them)
//     surf_demise           4 flipbooks,  0 unlit   (the smoke -- regression)
//
// surf_the_internet is first because a later map in the same process can
// undercount: a shader already registered is not re-parsed on a revisit, and two
// maps that share a material name share its shader.  These four are by different
// authors so the overlap should be nil, but first place is the one reading that
// cannot be explained away.
//
// surf_boreas and surf_garden have ZERO flipbooks between them, which is worth
// stating: the plan named them as the maps to validate on, and for this feature
// they cannot say anything.  That is why the map list changed.
//
// PREDICTIONS:
//   - the census line reproduces all four pairs above.
//   - shader_here on a screen prints vmt/animated#...#UNLIT.
//   - the ON screenshots show the screens LIT AT FULL BRIGHTNESS, not dimmed to
//     the room's lighting.  If #UNLIT were missing they would be visibly darker
//     than the OFF shot, in a room that is itself dim.
//   - no GLSL compile errors, on a permutation that has never been built before.

log_enable 1
log_dir "logs"
log_name "anim05"
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 0
vid_fullscreen 0
developer 1
log_developer 1
con_notifytime 0
con_notifylines 0
con_notifytime_error 0

wait 200

echo ^5=========== surf_the_internet -- expect 41 flipbooks, 34 unlit ====
hl2_animated 1
map surf_the_internet
waitmap 1800
waitms 12000
sv_cheats 1
waitms 400
shader_here internet_on
waitms 800
developer 0
waitms 2000
screenshot anim05_internet_on
waitms 900
hl2_animated 0
waitms 3000
screenshot anim05_internet_off
waitms 900

echo ^5=========== bhop_avantasia -- expect 50 flipbooks, 42 unlit =======
developer 1
hl2_animated 1
map bhop_avantasia
waitmap 1800
waitms 12000
sv_cheats 1
waitms 400
shader_here avantasia_on
waitms 800
developer 0
waitms 2000
screenshot anim05_avantasia_on
waitms 900
hl2_animated 0
waitms 3000
screenshot anim05_avantasia_off
waitms 900

echo ^5=========== surf_axil -- expect 50 flipbooks, 50 unlit ============
developer 1
hl2_animated 1
map surf_axil
waitmap 1800
waitms 12000
sv_cheats 1
waitms 400
shader_here axil_on
waitms 800
developer 0
waitms 2000
screenshot anim05_axil_on
waitms 900
hl2_animated 0
waitms 3000
screenshot anim05_axil_off
waitms 900

echo ^5=========== surf_demise -- expect 4 flipbooks, 0 unlit ============
developer 1
hl2_animated 1
map surf_demise
waitmap 1800
waitms 12000
developer 0
waitms 2000
screenshot anim05_demise_on
waitms 900

echo ^5=== anim05 done ===
wait 30
quit
