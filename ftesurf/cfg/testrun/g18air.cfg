// G18 -- surf_aircontrol renders white.  Which kind of white?
//
// G17 caught the user's other report on their own map, and the counters rule out
// the obvious reading.  This is NOT "nothing is drawn":
//
//     24 World Batches, 5441 Draw Indicies, 91.97 us World walking
//     voidvis: cluster 829  pmovetype 0 (noclip 0)  r_voidvis 1  -> off
//
// So the camera is in a real cluster (829, not -1, so the surf_lastgoodcluster
// substitution is NOT involved), the BSP walk runs, and two dozen batches reach
// the backend -- and the screen is white with one "Map Bonus" sign on it, which
// is the only thing that looks like a texture.  24 batches is also very low for a
// map this size; kitsune's spawn is 261.
//
// Two candidate failures, and they need different fixes:
//
//   SHADING -- the geometry is there and is being drawn white (missing material,
//   white lightmap, fullbright gone wrong).  Wireframe would then show the room
//   in outline, and r_novis would not change the batch count much.
//
//   VISIBILITY -- almost everything is culled and the white is one big near
//   surface or the sky filling the frame.  Wireframe would then be as empty as
//   the shaded view, and r_novis 1 would make the batch count jump.
//
// The last arm is the user's own observation, which is the strongest clue in the
// whole report: "only visable when in the void".  If the world appears from
// outside the map, the geometry and its materials are fine and the fault is in
// what the renderer decides is visible from inside.

cfg_save_auto 0
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "p210_g18"
scr_sshot_type png
cl_yieldcpu 0
cl_maxfps 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0
r_speeds 2

waitms 2500
map surf_aircontrol
waitmap 240
waitms 10000
sv_cheats 1

echo "@@@ G18 A baseline"
r_speeds_dump
waitms 400
screenshot_mega g18_a_baseline 1280 720
waitms 600

echo "@@@ G18 B wireframe -- is the geometry there at all?"
r_wireframe 1
waitms 2000
screenshot_mega g18_b_wireframe 1280 720
waitms 600
r_wireframe 0
waitms 1000

echo "@@@ G18 C r_novis 1 -- does the batch count jump?"
r_novis 1
waitms 3000
r_speeds_dump
waitms 400
screenshot_mega g18_c_novis 1280 720
waitms 600
r_novis 0
waitms 1000

echo "@@@ G18 D fullbright"
r_fullbright 1
waitms 2000
screenshot_mega g18_d_fullbright 1280 720
waitms 600
r_fullbright 0
waitms 1000

// The user's own observation, and the one that most constrains the answer.
echo "@@@ G18 E from the void, looking back down"
noclip
waitms 500
setpos 0 0 16000 0 0 -89
waitms 4000
r_speeds_dump
waitms 400
screenshot_mega g18_e_void 1280 720
waitms 600

echo "@@@ G18 DONE"
waitms 1000
quit
