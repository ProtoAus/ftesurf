// FTESurf Patch 300 -- boreas body for the cross-process on/off A/B.
// Not run directly: p300boron.cfg / p300boroff.cfg set hl2_additivefog first.
//
// p300bor.cfg already proved the two things this patch had to prove about this
// map: r_fog_progless still moves the cloud layer by 21.74 meanabs and reverts
// exactly (so the program-less path is intact and Patch 266 works), and the
// translator reports `cloods: additive 0 blendfunc src_alpha
// one_minus_src_alpha` (so the clouds never enter the changed branch).
//
// This run converts "structurally cannot change" into a measured number, which
// is the difference between a claim and a control.  What SHOULD move here is
// exactly two materials -- project_tendies/tendies_endsmoke (8 displacement
// faces) and project_tendies/alch_symbols_alpha (1 face on func_brush *54) --
// plus the env_sun glow overlay.  Those fading toward black instead of toward
// the fog colour is the FIX arriving on a second map, not breakage.
//
// PASS: the difference is small and confined; the cloud layer's own region is
//       at the noise floor.
// FAIL: the clouds move -- then VMT_AdditiveProgramOK is not gating on what its
//       comment says it gates on, and the patch is wrong.
cfg_save_auto 0
exec cfg/testrun/_quiet.cfg
developer 1
log_enable 1
log_developer 1
log_dir "logs"
scr_sshot_type png
cl_yieldcpu 0
vid_vsync 0
crosshair 0
fov 100
con_notifylines 0
con_notifytime 0.01
cl_maxfps 100

r_fog_progless 1
r_fog_linear 1

waitms 2500
map surf_boreas
waitmap 240
waitms 8000
sv_cheats 1
noclip
waitms 500

r_renderscale 1
show_fps 0
setpos 0 0 -8600 -60 90 0
waitms 25000

echo "@@@ P300BORAB state -- the value under test"
hl2_additivefog
r_fog_progless
waitms 1500

screenshot p300borab_x
waitms 1200
screenshot p300borab_1
waitms 1200
screenshot p300borab_2
waitms 1200

echo "@@@ P300BORAB DONE"
waitms 1200
quit
