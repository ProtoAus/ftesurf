// SEAM05 -- does toggling the cvar actually change the PROGRAM?
//
// seam04 finally had a clean noise floor (0.01-0.76%) and two vantages genuinely
// aimed at blend materials, and every toggle came back AT the floor:
// hl2_seamless 1->0 moved 0.07% at vantage B and 0.76% at C.  That is a real
// negative and it needs explaining before anything is claimed either way.
//
// The suspicious number: seam04 toggles a CVAR_SHADERSYSTEM cvar eight times and
// the log contains only THREE "Reloading shaders" lines.  So the question is not
// "does the projection look different" but the one before it -- does setting
// hl2_seamless 0 actually regenerate this material without the #SEAMLESS
// permutation?
//
// shader_here prints prog=, which carries the permutation string.  Calling it in
// every state answers it directly:
//
//   seamless 1 -> prog=vmt/transition#SEAMLESS=...#BLENDMOD#BUMP2
//   seamless 0 -> prog=vmt/transition#BLENDMOD#BUMP2          (regenerate worked)
//   seamless 0 -> prog=vmt/transition#SEAMLESS=...            (cvar not reaching)
//
// Note shader_here itself calls Shader_GetShaderBody -> Shader_Regenerate, so it
// rebuilds the material at the CURRENT cvars before printing -- which is exactly
// the property the Patch 250 reflection census was built around.  If the prog
// string changes here but the SCREEN does not, the generator is fine and the
// projection genuinely looks the same at this scale; if the prog string does not
// change, the cvar never reached the generator and seam04 measured nothing.

log_enable 1
log_dir "logs"
log_name "seam05"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
developer 1
log_developer 1
con_notifytime 0
con_notifylines 0
con_notifytime_error 0

wait 200

hl2_seamless 1
hl2_bumpmap2 1
map surf_outra
waitmap 1800
waitms 12000
sv_cheats 1
waitms 400
noclip
waitms 400
slowmo 0
waitms 800

setpos 3900.0 1662.0 4984.5 55.00 0.00 0
waitms 3000

echo ^5---------- state 1: seamless 1, bumpmap2 1 ----------------------------
shader_here S1
waitms 800

echo ^5---------- state 2: seamless 0 ---------------------------------------
hl2_seamless 0
waitms 3000
shader_here S2
waitms 800

echo ^5---------- state 3: seamless 1 again ---------------------------------
hl2_seamless 1
waitms 3000
shader_here S3
waitms 800

echo ^5---------- state 4: bumpmap2 0 ---------------------------------------
hl2_bumpmap2 0
waitms 3000
shader_here S4
waitms 800

echo ^5---------- state 5: both 0 -------------------------------------------
hl2_seamless 0
waitms 3000
shader_here S5
waitms 800

echo ^5=== seam05 done ===
wait 30
quit
