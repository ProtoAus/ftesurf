// Build 52 -- IS THE TRACE ACTUALLY GATING THE GLARES?
//
// glare01's arm C did not test what it claimed. It froze the traces AFTER two
// arms had already run them, so every glow kept its last answer and stayed
// visible -- which is correct behaviour and proved nothing. A frozen cache is
// not the same as an untraced one. This replaces it with a test that cannot be
// satisfied by a stale answer.
//
// THE INSTRUMENT, not a screenshot: vbsp_sprite_debug now prints
//     glare N in frame, H hidden by the trace, F mid-fade
// H is the number the occlusion trace suppressed. Because vbsp_sprite_dist
// defaults to 0 (unlimited), every one of surf_tensor2's 263 sprites passes the
// distance test and roughly half pass the behind-camera test -- and from any
// vantage inside the map, most of those are in OTHER ROOMS. So H must be a large
// fraction of N. If H is 0, the glares are drawing through the world and the
// feature is worse than what it replaced.
//
// Read at three unrelated vantages, because one could be a coincidence.

developer 0
log_developer 0
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000
cl_maxfps 0
cl_idlefps 0
cl_yieldcpu 0
sv_cheats 1

map surf_tensor2
waitmap 600
waitms 9000
noclip
waitms 1000

// Trace everything every frame, so the counters describe the geometry and not
// the round-robin budget. 300 > 263, so one frame covers the whole map.
vbsp_glare 1
vbsp_glare_traces 300
waitms 1000

echo ^5=== V1 spawn
setpos -11776 -13632 13720 0 0 0
waitms 3000
vbsp_sprite_debug 1
waitms 1000

echo ^5=== V2 stage 5
setpos 6624 -6955 11472 0 0 0
waitms 3000
vbsp_sprite_debug 1
waitms 1000

echo ^5=== V3 main END
setpos 15216 4096 -7088 0 0 0
waitms 3000
vbsp_sprite_debug 1
waitms 1000

// ---- the control: same three, glare OFF. `hidden` must not print at all, and
// ---- `passed the cull` must be HIGHER, because nothing is being suppressed.
echo ^5=== W1 spawn, glare OFF
vbsp_glare 0
setpos -11776 -13632 13720 0 0 0
waitms 2500
vbsp_sprite_debug 1
waitms 1000

echo ^5=== W2 stage 5, glare OFF
setpos 6624 -6955 11472 0 0 0
waitms 2500
vbsp_sprite_debug 1
waitms 1000

echo ^5=== W3 main END, glare OFF
setpos 15216 4096 -7088 0 0 0
waitms 2500
vbsp_sprite_debug 1
waitms 1000

// ---- and the never-traced case, done properly: traces 0 from a FRESH map load,
// ---- so nothing has ever been traced. Untraced glares start hidden, so
// ---- `hidden` must equal `in frame` and NOTHING should be drawn.
echo ^5=== X fresh load with traces 0 from the start -- expect hidden == in frame
vbsp_glare 1
vbsp_glare_traces 0
map surf_tensor2
waitmap 600
waitms 9000
noclip
waitms 1000
setpos -11776 -13632 13720 0 0 0
waitms 3000
vbsp_sprite_debug 1
waitms 1000
screenshot glare_X_x
waitms 900
screenshot glare_X
waitms 900

vbsp_glare_traces 8
echo ^5=== END OF RUN ===
waitms 500
quit
