// BUILD 47 -- did `!r` stop parking the player one unit in the air?
//
// REPORTED: "when I !r I think it takes me to the ground, however when I move
// I swear I lower by like 1unit or so".
//
// THE CAUSE, and it was unconditional: SV_ZoneDest drops the destination to the
// floor with a tracebox and then returned `trace_endpos + '0 0 1'`.  The lift is
// Source's own (CTriggerTeleport::Touch does tmp.z++) and guards a real failure
// -- a resting position with zero clearance can start-solid on the next move --
// but a tracebox already stops DIST_EPSILON short of what it hits, so in the
// ordinary case there was nothing for it to fix and every teleport paid for it.
// Build 47 tries the floor itself and lifts ONLY if resting there is solid.
//
// THE INSTRUMENT IS ALREADY IN THE TREE and needs no new print.  zone_dests'
// `moved` column is vlen(dest - your current origin): where you ARE against
// where the destination COMPUTES.  So teleport into a zone, let it settle, and
// ask:
//
//     moved 0   <- build 47.  You are standing exactly where !r puts you.
//     moved 1   <- build 46.  It put you a unit up and you fell back down.
//
// Sampled three times over two seconds because a settle is what is being
// measured: a value that starts at 1 and becomes 0 would mean the lift is still
// there and only the timing of the sample changed.  All three must read 0.
//
// surf_colin_blaster_69000 is the reported map and its 28 zones carry real
// info_teleport_destination entities (ZTD_NAME, `moved 64` from map spawn), so
// it exercises the drop path rather than the legacy bottom+2 arm.

log_developer 1

waitms 2000

map surf_colin_blaster_69000
waitmap 240
wait 60

echo ^5=== before: standing at map spawn, so moved is the spawn-to-dest distance
cmd zone_dests
wait 20

echo ^5=== teleport into zone 0 and let it settle
cmd zone_goto 0
wait 30

echo ^5=== sample 1 -- moved for zone 0 MUST be 0
cmd zone_dests
wait 30

echo ^5=== sample 2
cmd zone_dests
wait 60

echo ^5=== sample 3, two seconds after the teleport
cmd zone_dests
wait 20

echo ^5=== and a stage zone, to show it is not special to the start
cmd zone_goto 4
wait 60
cmd zone_dests
wait 20

echo ^5=== END OF RUN ===
wait 10
quit
