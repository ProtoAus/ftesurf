// Engine Patch 322 -- the anti-cheat plan's experiment E4, one arm.
//
// The SAME cfg runs on Windows/x86-64 and on the Pi/aarch64.  Nothing here is
// platform-specific on purpose: the whole experiment is "same map, same fixed
// inputs, two builds -- do the bits agree", so any difference in the harness
// itself would be indistinguishable from the answer.
//
// surf_kitsune is the map because its bytes are already PROVEN identical on both
// machines -- engine Patch 321's own verification read 676de275 from the Windows
// client and from the Pi's server for this exact file.  pm_dettest prints that
// hash back as `mapcrc`, so the first line of the output is the control: if the
// two runs disagree there, they were not looking at the same geometry and
// nothing below means anything.
//
// PREDICTION, registered before either arm was run.  I genuinely do not know
// the answer to this one; that is the point of the experiment.  What is already
// verified BY READING is the mechanism that would make `trace` differ:
// BIH_Sort_X/Y/Z return `am > bm` -- never negative -- so qsort's ordering of
// equal-key leaves is implementation-defined, and the three `enterfrac <=`
// tie-breaks then let the LAST surface visited win.  glibc and msvcrt do not
// have to sort equal keys the same way.
//
//   mapcrc  MUST match.  It is the control.
//   libm    sin/cos/atan2 are not IEEE-specified; sqrt is.  A difference here
//           is expected-ish and means the mover cannot leave this libm without
//           in-tree replacements.
//   trace   a difference here means the BIH suspicion is confirmed and
//           re-simulation cannot cross architectures until the comparator is
//           fixed.
//   mover   the answer that matters.  It can only match if both of the above
//           do.
//
// FALSIFIED IF: mapcrc differs between the arms (wrong map -- stop and fix that
//          before reading anything else); or the two arms differ while all three
//          component hashes match, which would mean the harness is hashing
//          something it is not printing.
cfg_save_auto 0
log_enable 1
log_dir logs
developer 0

waitms 5000

map surf_kitsune
waitmap 60
waitms 4000

echo ================================ P322 E4 -- determinism probe
pm_dettest
waitms 4000

echo ================================ P322 done
waitms 500
quit
