// FTESurf b58tune -- pick the flare intensity by eye, at Lex's own vantage.
//
// Everything measurable is now settled. The sprite half of build 58 is fixed and
// verified: renderamt applied twice plus Source's inverse-square fade takes a
// 2304-unit billboard at 2,895 units to 0.686 x 0.172 = 0.118 of its old
// brightness, and the frame drops from +27.56 over baseline to +23.63 with a
// zero noise floor and a pixel-perfect A/B/A. The flare half is faithful --
// measured term by term it reads dist 2895, fade 0.921, glare 1.000, half 65x35
// at a 100-unit basis, col 0.678 0.804 0.886, every one of them what
// glow_overlay.cpp and c_lightglow.cpp specify -- and it still contributes
// +17.25 mean luma over 42.76% of the frame, which Lex's Momentum reference at
// the same places does not show.
//
// WHY THAT IS NOT A CONTRADICTION, AND WHY THIS IS A KNOB: Momentum forces
// mat_hdr_level 2 with dynamic tonemapping, auto-exposure clamped 0.5-2.0
// (cdll_client_int.cpp:917-929). Every additive contribution there is composited
// through an exposure scale we do not have. A term that is correct in isolation
// is being composited into a frame that is not, so the fix is not in the flare
// maths -- it is a scale, and which value looks right is Lex's call, not mine.
//
// The tail is what makes the rectangle: the quad is 66 degrees across and its
// texture is still at ~8/255 where the quad stops, so the boundary is visible
// against a dark wall. Halving that puts it at 4/255, which is roughly where
// Momentum's exposure would land it.
//
// Four arms at one vantage, one process, nothing moving but the one cvar:
//   1.00  Source's own arithmetic, the default
//   0.50  what Momentum's exposure clamp would roughly do
//   0.25  clearly under
//   0.00  flares muted entirely, for reference against the other three
// Plus a same-setting control pair on the first arm for this run's noise floor.
cfg_save_auto 0
exec cfg/testrun/_quiet.cfg
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "b58tune"
scr_sshot_type png
cl_yieldcpu 0
vid_vsync 0
crosshair 0
con_notifytime 0.01
con_notifylines 0
fov 100

waitms 2500
map surf_tensor2
waitmap 240
waitms 8000
sv_cheats 1
noclip
waitms 500

vbsp_sprite_source 1
vbsp_glare_rays 5
vbsp_lightglow 1
setpos -10688.5 -1773.8 -8587.1 6.3 91.1 0
waitms 6000

echo "@@@ B58TUNE 1.00 -- Source's own arithmetic"
vbsp_lightglow_scale 1
waitms 1500
screenshot b58t_100_x
waitms 900
screenshot b58t_100
waitms 900
screenshot b58t_100_ctl
waitms 900

echo "@@@ B58TUNE 0.50 -- what Momentum's exposure clamp would roughly do"
vbsp_lightglow_scale 0.5
waitms 1500
screenshot b58t_050_x
waitms 900
screenshot b58t_050
waitms 900

echo "@@@ B58TUNE 0.25"
vbsp_lightglow_scale 0.25
waitms 1500
screenshot b58t_025_x
waitms 900
screenshot b58t_025
waitms 900

echo "@@@ B58TUNE 0.00 -- flares muted, the reference floor"
vbsp_lightglow_scale 0
waitms 1500
screenshot b58t_000_x
waitms 900
screenshot b58t_000
waitms 900

vbsp_lightglow_scale 1
waitms 1000

echo "@@@ B58TUNE DONE"
waitms 1200
quit
