cfg_save_auto 0

// ===========================================================================
// BUILD 63, ARM SET D -- map-load latency across the entity-count range.
//
// WHY THIS EXISTS NOW AND NOT BEFORE.  FTE's map-cluster system
// (engine/server/sv_cluster.c, specs/mapcluster.txt) is compiled into the
// shipped binaries, and under a cluster a leaf server is forked on demand --
// so map load stops being a once-per-restart cost and becomes SPAWN LATENCY
// sitting in front of a player who just picked a map.  Anything O(n^2) in
// entity count moves out of the boot budget and into that one.
//
// THE STATIC FINDING THIS IS TESTING.  SV_RepairTargetCase walks every edict,
// and for each non-empty .target/.landmark calls SV_TargetCaseFix, which does
// an exact find() and THEN -- on a miss -- walks every edict again with
// strcasecmp.  That is O(n^2), it runs at map load, and it runs before
// SV_EntityIOBuild so the new vbsp_output edicts do not inflate it.
//
// CENSUSED FIRST, over all 1315 maps, so the arms are chosen against the real
// distribution rather than guessed:
//   * median map is 587 entities
//   * MOST maps force ZERO rescans -- their targets resolve exactly, and the
//     expensive branch is never taken
//   * the worst product of (entities x rescans) in the whole library is
//     bhop_sqee at 1324 x 341 ~= 451k strcasecmp
//
// PRE-REGISTERED PREDICTION.  Load time is dominated by BSP/material work, not
// by QC, so:
//   * surf_gradient (6815 ents, 0 rescans) is the entity-count ceiling and
//     MUST NOT be slower than bhop_sqee -- if it is, the cost is linear in
//     entities and not the rescan at all.
//   * bhop_sqee (1324 ents, 341 rescans) is the O(n^2) worst case.  If
//     SV_RepairTargetCase mattered, THIS is the map where it shows.
//   * If bhop_sqee's load is within noise of similarly-sized maps with zero
//     rescans, the quadratic is real but not worth fixing, and that is a
//     legitimate result to record rather than a disappointing one.
//
// bhop_miku_v2 is included as the pathological upper bound: 416,464 declared
// outputs, capped at 1024 per entity by build 63.  It is the only map in the
// library where the entity-I/O layer itself is a measurable share of load.
//
// ---------------------------------------------------------------------------
// RESULTS, 2026-09-13.  logs/b63d_latency.log.  "spawn->IO" is wall clock from
// "SpawnServer: X" to the "entity I/O: N output(s) wired" line, i.e. the whole
// server-side load including SV_RepairTargetCase and SV_EntityIOBuild.
//
//   map                          spawn->IO   fs load    wired   rescans
//   surf_kitsune                        1s    1056ms       50     small
//   bhop_sqee                           3s    2987ms      697       341  <--
//   surf_gradient                      23s   22495ms       42         0  <--
//   bhop_inmomentum_gfl_final           9s    9021ms      605       259
//   surf_lt_omnific                    11s   10910ms      452         0
//   surf_forbidden_tomb4                2s    2633ms     2394         0
//   bhop_miku_v2                       41s   40994ms     4194         -
//   surf_kitsune (restore)              1s    1056ms       50     small
//
// THE PREDICTION HELD, AND THE ANSWER IS "DO NOT FIX IT".
//
// spawn->IO tracks `fs load` to within the timestamp resolution on every
// single arm -- 1s/1056ms, 3s/2987ms, 23s/22495ms, 41s/40994ms.  The entire
// load latency is BSP, material and filesystem work.  QC is not in it.
//
// The two marked rows are the whole argument.  bhop_sqee is the O(n^2) worst
// case in the entire 1315-map library -- 1324 entities x 341 forced rescans,
// ~451k strcasecmp -- and it loads in 3.0s.  surf_gradient has FIVE TIMES the
// entities, ZERO rescans and only 42 outputs, and takes 22.5s: seven times
// longer.  If SV_RepairTargetCase's quadratic mattered, the ordering would be
// the other way round.  It does not show above the noise of loading a bigger
// map.
//
// surf_forbidden_tomb4 is the useful cross-check on the entity-I/O layer
// itself: 2,394 outputs -- the most of any loadable map -- built in 2.6s,
// faster than five of the other arms.  SV_EntityIOBuild is not a cost either.
//
// So the quadratic is real in SHAPE and immaterial in PRACTICE, and the reason
// is in the census rather than the clock: most maps force zero rescans, because
// the expensive branch only runs for a target that fails an exact find().
// Recorded as a measured negative so nobody re-derives the static finding and
// "fixes" it for nothing.
//
// WHAT THIS DOES FLAG FOR A CLUSTER, since that is why it was run: 41s for
// bhop_miku_v2 and 23s for surf_gradient are real spawn-latency numbers if a
// leaf server is forked on demand in front of a waiting player.  Neither is
// entity I/O.  Both are material and BSP load, which is where that budget
// should be spent.
//
// CAVEAT ON THE ABSOLUTE NUMBERS -- ADDED AFTER THE FACT, DO NOT QUOTE THESE
// AS CLUSTER FIGURES.  Every arm above was measured on ftesurf64.exe, which is
// a CLIENT build running a listen server: the log's own header shows the GL
// renderer coming up (GL_RENDERER: NVIDIA GeForce RTX 2080 SUPER) before the
// first map.  So material parsing, lightmap upload and VTF decode are all
// inside these figures, and NONE of them exist in a cluster leaf, which on the
// Pi is fteqw-svarm64, a true SERVERONLY build with no renderer to feed.
//
// The peer session's Patch 298 A/B on that box measured surf_affliction at
// 23604ms -> 6102/5705ms and 832.6 MB -> 493.0 MB, same map and same patch,
// purely from dropping the renderer.  If that ~4x holds, the heavy maps here
// land nearer 6-10s on a leaf rather than 23-41s.
//
// This does NOT touch the conclusion above -- the O(n^2) refutation rests on
// the ORDERING of the arms (bhop_sqee 3.0s vs surf_gradient 22.5s, measured on
// one binary against each other) and on spawn->IO tracking `fs load`, neither
// of which a constant factor can invert.  It touches only the absolute
// spawn-latency numbers, and it moves them in the good direction: a heavy map
// is a pre-warmable wait, not a fatal one.  Re-measure on a SERVERONLY build
// before anyone quotes a leaf figure.
// ---------------------------------------------------------------------------
// ===========================================================================

log_enable 1
log_dir logs
log_name b63d_latency
developer 1
log_developer 1
cl_maxfps 100
con_notifylines 0

// The engine is not ready yet -- a map issued here is silently dropped, and
// `wait` is the wrong tool because it counts FRAMES, not time.
waitms 5000

echo ^5=== L1: surf_kitsune (small control) ===
map surf_kitsune
waitmap 45
waitms 4000

echo ^5=== L2: bhop_sqee (1324 ents, 341 rescans -- the O(n^2) worst case) ===
map bhop_sqee
waitmap 45
waitms 4000

echo ^5=== L3: surf_gradient (6815 ents, 0 rescans -- entity ceiling) ===
map surf_gradient
waitmap 45
waitms 4000

echo ^5=== L4: bhop_inmomentum_gfl_final (1697 ents, 259 rescans) ===
map bhop_inmomentum_gfl_final
waitmap 45
waitms 4000

echo ^5=== L5: surf_lt_omnific (4947 ents, 0 rescans) ===
map surf_lt_omnific
waitmap 45
waitms 4000

echo ^5=== L6: surf_forbidden_tomb4 (2394 outputs) ===
map surf_forbidden_tomb4
waitmap 45
waitms 4000

echo ^5=== L7: bhop_miku_v2 (416k declared outputs, capped) ===
map bhop_miku_v2
waitmap 90
waitms 8000

echo ^5=== L8: surf_kitsune again (restore) ===
map surf_kitsune
waitmap 45
waitms 4000

echo ^5=== END OF RUN ===
quit
