// B45SCALE -- does the screen-space line survive a rescaled viewport?
//
// THE PLAN NAMED THIS AS A HAZARD AND PRESCRIBED A GUARD: compare VF_SCREENVSIZE
// against VF_SIZE and fall back to mode 1 if they disagree.  That guard is NOT
// written, deliberately, because it is a guess about a mechanism and the
// mechanism can be measured instead -- and because as stated it would fire on a
// case that is already correct.  project() returns
// out[0]*r_refdef.vrect.width + r_refdef.vrect.x (pr_csqc.c:2096-2097), i.e. it
// already carries the viewport's OFFSET as well as its size, so a 3D viewport
// that is merely smaller than the screen needs no fallback at all; a guard
// keyed on "the two sizes differ" would switch drawers on a frame the drawer
// handles correctly.
//
// What is left as a real hazard is the two knobs that move the two spaces
// independently of each other:
//
//   r_renderscale   sub/supersamples into an FBO, and gl_backend.c:6058-6059
//                   rewrites r_refdef.vrect.width to vid.fbvwidth*scale.  If
//                   project follows that and 2D drawing does not, the line
//                   lands at the wrong scale and this is where it shows.
//   vid_conwidth    fixes the virtual 2D screen independently of the physical
//   vid_conheight   one, which is the same question from the other side.
//
// THE ASSERTION IS `replay status`, NOT THE PICTURE.  It prints the projected
// position of a probe 256 units dead ahead together with VF_SCREENVSIZE.  Dead
// ahead is the centre of the viewport under ANY projection, so probe == half of
// screen means the two spaces agree, and any other answer says by how much they
// do not.  A screenshot cannot separate "shifted" from "scaled" and this can.

log_enable 1
log_dir "logs"
log_name "b45scale"
developer 1
log_developer 1
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
sv_cheats 0
fs_missingwarn 0

hud_watch_path 1
hud_watch_path_mode 2
hud_watch_path_ahead 1
hud_watch_info 0
hud_watch_skipidle 0

wait 200
echo ^5=== b45scale ===

map surf_rise
waitmap 1800
waitms 2500

replay data/runs/surf_rise/main/last.rec
waitms 800
replay pause
replay seek 45
waitms 900

echo ^5=== b45scale: baseline, r_renderscale 1 ===
replay status
screenshot b45scale_base_x
waitms 700
screenshot b45scale_base

echo ^5=== b45scale: r_renderscale 2 (supersample) ===
r_renderscale 2
waitms 1200
replay status
screenshot b45scale_ss2_x
waitms 700
screenshot b45scale_ss2

echo ^5=== b45scale: r_renderscale 0.5 (subsample) ===
r_renderscale 0.5
waitms 1200
replay status
screenshot b45scale_ss05_x
waitms 700
screenshot b45scale_ss05

r_renderscale 1
waitms 1200

echo ^5=== b45scale: vid_conwidth 960 / vid_conheight 600 ===
vid_conwidth 960
vid_conheight 600
waitms 1500
replay status
screenshot b45scale_con960_x
waitms 700
screenshot b45scale_con960

echo ^5=== b45scale: back to defaults, must match the baseline ===
vid_conwidth 0
vid_conheight 0
waitms 1500
replay status
screenshot b45scale_backd_x
waitms 700
screenshot b45scale_backd

echo ^5=== b45scale: done ===
replay stop
waitms 400
quit
