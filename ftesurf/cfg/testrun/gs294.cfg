// FTESurf Patch 294 -- sv_gamespeed joins the locked movement ruleset.
//
// WHY THIS TEST EXISTS.  The patch is one entry in pms_lockedmovevars[]
// (sv_phys.c:2985) plus one extern.  That table is an array of POINTERS, so no
// amount of grepping the binary proves the entry landed -- only a runtime set
// does.  This is that set.
//
// The mechanism: SV_MovementVar_Callback (sv_phys.c:3111) fires AFTER the value
// is committed and reverts it, so the tell is the value going back to 1 plus the
// warning line.  It early-returns unless sv.state == ss_active, which is why a
// map has to be loaded first.
//
// PASS:
//   arm 1  sv_gamespeed 0.5  -> reverts to 1, prints "part of the locked
//                               movement ruleset"
//   arm 2  slowmo 0.25       -> same (proves the alias funnels to one cvar)
//   arm 3  sv_cheats 1 then
//          sv_gamespeed 0.5  -> STICKS at 0.5
// FAIL:
//   arm 1 or 2 sticks        -> the table entry is not in the binary
//   arm 3 reverts            -> something broader is wrong; the lock would be
//                               refusing the cvar unconditionally rather than
//                               reading sv_cheats, and arm 1 would be passing
//                               for the wrong reason.
//
// Arm 3 is the control and it is the half that makes arms 1-2 mean anything.
exec cfg/testrun/_quiet.cfg
log_dir logs
log_name gs294
log_enable 1
cl_maxfps 100
wait 100

map surf_beginner
wait 1200

echo "GS294: ---- baseline: expect 1 ----"
sv_gamespeed
wait 20

echo "GS294: ---- ARM 1: sv_gamespeed 0.5, expect revert to 1 + warning ----"
sv_gamespeed 0.5
wait 20
sv_gamespeed
wait 20

echo "GS294: ---- ARM 2: slowmo 0.25 (the alias), expect revert to 1 ----"
slowmo 0.25
wait 20
sv_gamespeed
wait 20

echo "GS294: ---- ARM 3 CONTROL: sv_cheats 1, then 0.5 must STICK ----"
sv_cheats 1
wait 20
sv_gamespeed 0.5
wait 20
sv_gamespeed
wait 20

echo "GS294: ---- restore ----"
sv_cheats 0
wait 20
sv_gamespeed 1
wait 20
sv_gamespeed

echo "GS294: ---- end ----"
wait 100
quit
