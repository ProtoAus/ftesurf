// B46CHEAT -- sv_cheats taints a CLEAN run, at run_class 0.
//
// THE HOLE THIS ASSERTS CLOSED.  Build 44 gated SV_CheatsOn on run_class, on
// the reasoning that run_class 0 should be "build 43 exactly".  It was -- and
// build 43 did not watch sv_cheats at all, so at run_class 0 an sv_cheats run
// was clean, was not practice, and RANKED.  A cvar named after the vocabulary
// was deciding the ruleset.  Build 46 drops the gate: sv_cheats taints at every
// setting, and run_class now bisects only what the taint is CALLED.
//
// WHY THIS FILE EXISTS WHEN b44off.cfg ALREADY TYPES `sv_cheats 1`.  b44off
// noclips two arms earlier and never turns it off, so by the time it reaches the
// cheats arm the attempt is already practice and already dirty from something
// else.  Both readings are `practice 1 dirty 1` before AND after the fix, so
// that arm cannot see this bug -- it is the shape of trap 6 in the A/B notes,
// a control that agrees with every hypothesis.  The assertion needs a run that
// is CLEAN at the moment the cvar is typed, and nothing else touching it.
//
// SO STEP 2 IS THE HALF THAT MATTERS AS MUCH AS STEP 3.  If step 2 does not read
// `class: clean` with `practice 0 dirty 0`, the run was already spoiled and step
// 3 proves nothing whatever it prints.  Read them as a pair or not at all.
//
//   EXPECT
//     1. armed          class: clean      practice 0  dirty 0   cheats now 0
//     2. running        class: clean      practice 0  dirty 0   cheats now 0
//     3. sv_cheats 1    class: practice   practice 1  dirty 1   cheats now 1
//                       seg 0 cheat 0 cheatlatch 0  -- NO new bit at run_class 0
//                       stage class: stitch 0 cheat 1  -- the LEVEL half
//     4. sv_cheats 0    class: practice   practice 1  dirty 1   cheats now 0
//                       i.e. it does not wash off; only a re-arm forgives it
//
//   BEFORE BUILD 46, step 3 read exactly like step 2 and step 4 like step 1.
//
// run_class 0 IS SET BEFORE `map`, WHICH IS LOAD-BEARING -- SV_TimerMapInit
// caches it once per map load, so a value typed after the map is on screen is
// read by nothing until the next one.  And `sv_cheats 0` is at the top on
// purpose: the boilerplate `sv_cheats 1` most testrun cfgs carry is itself the
// taint under test from build 44 on, and would erase the control before it ran.
//
// NOTHING IS RECORDED.  The run is never finished, so no .rec is written and the
// user's data/runs is not touched -- deliberate, because the assertion is about
// the live flags and a finish would cost a leaderboard row to clean up.
//
// LOCAL LINES RUN NOW, `cmd` LINES RUN ON THE NEXT PACKET.  `sv_cheats 1` takes
// effect immediately while a `cmd timer` above it is still queued, so a reply can
// arrive already carrying the new value and read like the change happening a step
// early.  Hence a full waitms between the last reply of one step and the cvar set
// of the next, and `cmd viewpos` before every `cmd timer` as the in-order marker.

log_enable 1
log_dir "logs"
log_name "b46cheat"
developer 1
log_developer 1
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0

sv_cheats 0
run_class 0

wait 200
map bhop_eazy
waitmap 1800
waitms 2500

echo ^5=== b46cheat: the cvar, as the server cached it ===
run_class

// zone_goto with no declared destination drops you on the box FLOOR, so the walk
// out below is plain MOVETYPE_WALK and the attempt stays clean.  No noclip
// anywhere in this file -- that is the whole point of it.
echo ^5=== b46cheat: 1. armed in the start box, must read CLEAN ===
cmd zone_goto 0 16.18 0
waitms 700
cmd viewpos
cmd timer
waitms 800

echo ^5=== b46cheat: 2. walked out, clock running, must STILL read clean ===
+forward
waitms 2200
-forward
waitms 400
cmd viewpos
cmd timer
waitms 800

echo ^5=== b46cheat: 3. sv_cheats 1 -- THE ASSERTION ===
sv_cheats 1
waitms 900
cmd viewpos
cmd timer
waitms 800

echo ^5=== b46cheat: 4. sv_cheats 0 -- and the taint does not wash off ===
sv_cheats 0
waitms 900
cmd viewpos
cmd timer
waitms 800

// ---------------------------------------------------------------------------
// 5 and 6 REACH THE ONE LINE NOTHING ELSE DOES.
//
// Build 46 had to add a THIRD run_class gate, in sv_saveloc.qc, on the direct
// `run_t_flags |= TF_CHEAT` that a save-lock LOAD uses to stop the file laundering
// a cheat.  That write was safe ungated only because run_t_cheat could not BE true
// at run_class 0 -- every source of the latch was gated upstream.  Ungating the
// sv_cheats source makes it reachable, and without the new gate the bit would
// arrive at run_class 0 through a save-load and through nothing else.
//
// REACHING IT NEEDS AN ARM, WHICH IS WHY STEP 5 EXISTS.  Steps 3 and 4 print
// `cheatlatch 0`: mid-run, SV_NoclipWatch sets the per-STAGE field and funnels to
// practice, but run_t_cheat itself is only written by SV_TimerArm and the teleport
// path.  So arm again with cheats ON, and only then save and load.
//
//   EXPECT
//     5. re-armed       class: practice   cheatlatch 1   cheats now 1
//                       seg 0 cheat 0  -- still no bit, that is the contract
//     6. save + load    class: practice   seg 0 cheat 0   -- THE GATE
//                       without it this row reads `class: cheated (seg 0 cheat 1)`
//                       at a setting whose entire promise is "no new bit"
//
// This writes one save under data/saves/bhop_eazy/ and nothing else; no run is
// finished, so data/runs is still untouched.  Delete the save after the run.
// ---------------------------------------------------------------------------
echo ^5=== b46cheat: 5. re-arm with cheats ON -- the latch, not just the level ===
sv_cheats 1
waitms 400
cmd zone_goto 0 16.18 0
waitms 900
cmd viewpos
cmd timer
waitms 800

echo ^5=== b46cheat: 6. save + load -- TF_CHEAT must NOT arrive at run_class 0 ===
cmd sl_save
waitms 600
cmd sl_load
waitms 900
cmd viewpos
cmd timer
waitms 800

echo ^5=== b46cheat: done ===
waitms 600
quit
