// BUILD 25 stage 1, fifth pass -- THE OPEN SEGMENT ROUND TRIP, measured.
//
// b25d left a save whose `open` line read `valid 0`, and that was the config's
// fault rather than the code's: setpos from the block to the pit is a 580-unit
// jump, past SEG_JUMPDIST, so the teleport guard correctly voided the segment.
// A voided segment restores as voided and proves nothing.
//
// So: land first, then rise 293 units STRAIGHT UP from where zone_goto put us.
// Under the 512-unit guard, so the air segment that opens is valid.
//
// AND THE MEASUREMENT IS THE `dur` FIELD, which is what makes this a test rather
// than a screenshot.  Save at duration D, fall for another twenty ticks, load,
// and save again immediately:
//
//   restore WORKS   slot 2's open dur is D plus the tick or two since the load
//   restore FAILS   slot 2's open dur is ~0, because Board_Warped killed the
//                   segment and a fresh one opened at the load
//
// Two files, one number, and the two outcomes are nowhere near each other.

developer 1
log_developer 1
cfg_save_auto 0

wait 200
map surf_aesthetic
waitmap 90

zone_goto 0
wait 25
cmd timer
wait 4
echo "--- (must read a GROUND phase: the segment machine has nothing open) ---"

// 293 units up, same x and y.  Inside the guard, so the air segment is valid.
setpos -15744 0 1350
wait 20
cmd timer
wait 4
echo "--- (must read an AIR phase now) ---"

echo "--- save 1: the segment has been open for about 0.3s ---"
cmd sl_save
wait 20

echo "--- fall on, so a FRESH segment would read near zero ---"
wait 20

echo "--- load, then save again at once ---"
cmd sl_load
wait 6
cmd sl_save
wait 15
cmd sl_list
wait 5

echo "=== b25e done -- save001 and save002 left on disk deliberately ==="
wait 20
quit
