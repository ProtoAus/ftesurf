// Patch 271 -- the AFTER run.  Same vantages, same yaws, same session shape as
// t2perf.cfg so the two logs are directly comparable.
//
// BEFORE (t2perf.log / t2vis.log, exe of 13:25):
//     [world] recurse 1 -> 24762 meshes in 76 batches   (== nummodelsurfaces)
//     [world] recurse 0 ->   506 meshes in 23 batches
//     spawn   236 fps, 304,787 draw indices
//     spawn, vbsp_skyroom 0   545 fps, 12,605 indices
//     stage 5 320 fps ; surf_tensor control 1337 fps
//
// THE PREDICTIONS, and any one of them failing sinks the patch:
//   1. recurse 1 emits a HANDFUL of meshes, not 24,762.  The PVS at the
//      sky_camera's cluster 1534 admits 30 world faces, so expect ~30 and
//      certainly < 100.
//   2. recurse 0 is UNCHANGED at ~506.  If the main view moved, the poison is
//      wrong and the player's view is being culled against the sky camera --
//      the one regression this patch can cause, and it would look like chunks
//      of the map missing.
//   3. `vbsp_skyroom 0` STOPS MATTERING at the spawn.  Before it was worth
//      2.3x; after, the pass it removes is nearly free, so the two arms should
//      land close together.  This is the strongest single check, because it is
//      the one that cannot be produced by any unrelated speedup.
//   4. The 3D skybox is STILL DRAWN.  Screenshots, not numbers.
developer 1
log_developer 1

vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000

cl_maxfps 0
cl_idlefps 0
cl_yieldcpu 0
sv_cheats 1

map surf_tensor2
waitmap 600
waitms 5000
echo ^5=== the [world] lines above: recurse 1 must be TINY, recurse 0 must be ~506

developer 0
log_developer 0
r_speeds 2
waitms 2000
noclip
waitms 1000

// ---- the headline A/B, repeated exactly ---------------------------------
echo ^5=== A0 spawn yaw 0   vbsp_skyroom 1  (was 236 fps / 304787 indices)
setpos -11776 -13632 13720 0 0 0
waitms 2500
r_speeds_dump
screenshot t271_spawn_on_x
waitms 800
screenshot t271_spawn_on
waitms 800

echo ^5=== B0 spawn vbsp_skyroom 0  (was 545 fps -- must now be CLOSE to A0)
vbsp_skyroom 0
waitms 2500
r_speeds_dump
screenshot t271_spawn_off_x
waitms 800
screenshot t271_spawn_off
waitms 800
vbsp_skyroom 1
waitms 2000

echo ^5=== A1 spawn yaw 180 (was 291 fps)
setpos -11776 -13632 13720 0 180 0
waitms 2500
r_speeds_dump
screenshot t271_spawn180_x
waitms 800
screenshot t271_spawn180
waitms 800

// ---- the stages, shipped settings ---------------------------------------
echo ^5=== D3 stage 3  (was 284 fps)
setpos -11136 -10475 8720 0 0 0
waitms 2500
r_speeds_dump
echo ^5=== D5 stage 5  (was 320 fps)
setpos 6624 -6955 11472 0 0 0
waitms 2500
r_speeds_dump
screenshot t271_stage5_x
waitms 800
screenshot t271_stage5
waitms 800
echo ^5=== D9 main END (was 338 fps)
setpos 15216 4096 -7088 0 0 0
waitms 2500
r_speeds_dump

// ---- props: the second half of the same bug ------------------------------
// In the old skyroom pass the prop PVS test was skipped (it is guarded
// `if (surfvis && ...)`), so hl2_propdist 8000 was worth 233 -> 390 fps.
// With a real PVS in that pass it should now be worth much less.
echo ^5=== C2 hl2_propdist 8000 at the spawn (was 233 -> 390 fps)
setpos -11776 -13632 13720 0 0 0
waitms 2000
hl2_propdist 8000
waitms 2500
r_speeds_dump
hl2_propdist 0
waitms 500

// ---- the control, unchanged ---------------------------------------------
echo ^5=== F0 CONTROL surf_tensor, no sky_camera (was 1337 fps -- must not move)
map surf_tensor
waitmap 600
waitms 4000
r_speeds 2
noclip
waitms 2000
r_speeds_dump
waitms 1000

echo ^5=== END OF RUN ===
waitms 500
quit
