// G12 -- Patch 210: does the portal fill the DOORWAY instead of a square box?
//
// The user's report: "I can see a portal, it's a square box, and not the size of
// the doorway, I assume it's a texture on a plane? you can't just fill the plane?"
// It was not a texture on a plane -- it was the far scene painted over the whole
// screen and scissored to the aperture's bounding RECTANGLE (Patch 208).  Now it
// is literally a texture on the plane, so the answer to this run is a picture.
//
// Three things must be true, and the first two are checkable from the log alone:
//
//  1. the material PARSED with the new keyword.  r_showshader must report
//     `sort 3 (SHADER_SORT_PORTAL)` and one pass whose map is `$refraction`.
//     If `portalfbo` were unknown, developer 1 prints "Unknown shader directive
//     parsing ftesurf_portal" and the pass would still be there -- which would
//     render the far view through the REFRACTION path (same view, just clipped)
//     and look like a slightly wrong copy of the wall rather than a portal.
//     That failure is subtle on screen and obvious in the log, so check the log.
//
//  2. the PROGRAM loaded.  glsl/ftesurf_portal.glsl is a gamedir file, not a
//     builtin, so if it is missing or fails to compile there is no fallback that
//     does the right thing: the pass would sample $refraction with the quad's own
//     UVs and the far room would appear stretched across the door like wallpaper.
//     A GLSL compile error prints with the shader name in it.
//
//  3. it looks right.  Screenshots, below.
//
// log_developer is safe to leave on now: Patch 209a capped the skyroom flood that
// killed the G3 run on this exact map.  If the log fills with "Skyroom position
// ... in solid" again, 209a regressed and that is worth knowing too.

cfg_save_auto 0
developer 1
log_developer 1
log_dir "logs"
log_name "p210_g12"
scr_sshot_type png
cl_yieldcpu 0
cl_maxfps 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0
r_speeds 2
vbsp_portal_render 1

waitms 2500

// ------------------------------------------------------------------ kitsune
map surf_kitsune
waitmap 240
waitms 8000
sv_cheats 1

echo "@@@ G12 shader as parsed -- want sort 3 and one $refraction pass"
r_showshader ftesurf_portal
waitms 500

echo "@@@ G12 kitsune spawn -- the area with the portal in it"
r_speeds_dump
waitms 400
screenshot_mega g12_kitsune_spawn 1280 720
waitms 800

echo "@@@ G12 kitsune exit hall 0 -765 133 yaw 90 -- Patch 208 read 261 world batches here"
setpos 0 -765 133 0 90 0
waitms 3000
r_speeds_dump
waitms 400
screenshot_mega g12_kitsune_exit 1280 720
waitms 800

// Close in on the aperture.  The bounding-rectangle artefact is at its worst at
// an angle, because that is when the projected quad is a trapezoid and its box
// is much bigger than it is.  Straight on, a rect and a quad agree, which is
// exactly why this was easy to miss.
echo "@@@ G12 kitsune oblique -- the angle where a rect and a quad disagree most"
setpos 0 -765 133 0 45 0
waitms 2000
screenshot_mega g12_kitsune_oblique 1280 720
waitms 800

// ------------------------------------------------------- the user's map
// surf_aircontrol is the map they had open when they reported the entities not
// loading.  Nothing in Patch 210 addresses that; this is a baseline, so the next
// session has a picture and a batch count for it instead of a description.
echo "@@@ G12 surf_aircontrol baseline"
map surf_aircontrol
waitmap 240
waitms 9000
sv_cheats 1
r_speeds_dump
waitms 400
screenshot_mega g12_aircontrol_spawn 1280 720
waitms 800

echo "@@@ G12 DONE"
waitms 1000
quit
