// Isolated visual verification for the closed-console notification overlay.
log_enable 1
log_name b36_notify
cfg_save_auto 0
developer 0
vid_fullscreen 0

wait 200
map surf_null
waitmap 240
wait 60

// Deliberately make the floating console text large and move its saved window.
// Closed-console notifications must still use 8px text at screen origin.
con_window 1
con_window_rect "240 180 800 480"
con_textsize 16
con_notifylines 6
con_notifytime 1
con_notifyfade 2
con_notify_x 0
con_notify_y 0
con_notify_w 1

clear
echo notify-fresh-one
echo notify-fresh-two
echo notify-fresh-three
waitms 100
screenshot b36_notify_fresh

wait 20
clear
echo notify-fading-one
echo notify-fading-two
echo notify-fading-three
waitms 1400
screenshot b36_notify_fading

wait 20
clear
echo notify-expired-one
echo notify-expired-two
echo notify-expired-three
waitms 3500
screenshot b36_notify_expired

echo === b36 notify done ===
wait 20
quit
