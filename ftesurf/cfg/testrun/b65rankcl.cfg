// Build 65: the CLIENT half of the world-rank test.  See b65ranksv.cfg.
//
// IT POLLS RATHER THAN SLEEPING TO A SCHEDULE.  The three states this has to
// observe -- nothing submitted, submitted and waiting, answered -- are
// separated by a map load, a csprogs download and an HTTP round trip, none of
// which has a knowable duration.  A config that slept to fixed times would
// either miss a transition or "pass" by sampling the same state three times.
// Sampling every 1.5s across the whole window makes the transitions visible
// in the log WITH their timestamps, so the run reports what happened rather
// than whether a guess held.
//
// `results wrank <track> <leg> <ticks>` NAMES THE SUBJECT, which is the whole
// reason that argument exists.  A headless client never finishes a run, so the
// card's own subject is 0/0/0 forever and the two answers that matter -- "this
// IS your run" and "this is NOT your run" -- could not both be produced.  The
// probe submits track 0, leg 0, 1234 ticks (sv_lobby.qc, Lobby_Frame).
//
// PREDICTIONS, registered before the run:
//   A  before the probe fires: *wrank unset, state -1, the row draws
//      "--  not submitted"  (board=ranked: the server IS pointed and keyed,
//      it simply has not submitted anything about this run).
//   B  within ~2s of the probe: state 0 (WR_PENDING), row "...  asking the
//      leaderboard".  The stub holds its answer 2s precisely so this state
//      lasts long enough to be sampled at all.
//   C  after that: state 1 (WR_RANKED), rank 3 of 17, row "#3 of 17".
//   D  the same key, asked about 1235 ticks: state -1, and the row must NOT
//      say "#3 of 17".  THIS IS THE FALSIFIER FOR THE WHOLE DESIGN -- a rank
//      drawn against a run it is not about is the failure the subject exists
//      to prevent, and it is worse than the dash the card drew before build
//      65 because it is wrong and it is believed.
//   E  wrong track, and wrong leg: the same, one field at a time, so a reader
//      that compared only some of them cannot pass.
//
// FALSIFIED IF: C never appears (the answer is not reaching the player), or D
// or E come back with a rank (the subject is not being checked).
cfg_save_auto 0
log_enable 1
log_dir logs
log_name b65rankcl

// THE CSQC DOWNLOAD IS THE REASON THE FIRST RUN OF THIS FILE MEASURED NOTHING.
//
// A client does not run its own csprogs.dat on a network game -- it fetches
// the server's under a VERSIONED name (csprogsvers/<crc>.dat), so a local copy
// that is byte-identical is not used and a download always happens on a new
// build.  At the default `rate` of 30000 that is 2.7 MB at ~32 KB/s, i.e. 85
// seconds, and the whole poll window above ran inside it: every sample printed
// `Unknown command "results"` because CSQC had not started yet, which looks
// exactly like a command that was never registered.
//
// Two fixes, both kept, because either alone is a single point of failure in a
// harness: the rate cvars below, and seeding b65_downloads/csprogsvers/ with
// the file the server serves so the download is skipped outright.
rate  2000000
drate 5000000

waitms 6000
connect 127.0.0.1:27599

// Enough for the handshake and the map load; the csprogs fetch is cached.
waitms 12000

echo ^5==== b65rank: polling.  A=unset  B=pending  C=ranked ====
alias b65s "echo ^5---- sample ----; results wrank 0 0 1234"

b65s
waitms 1500
b65s
waitms 1500
b65s
waitms 1500
b65s
waitms 1500
b65s
waitms 1500
b65s
waitms 1500
b65s
waitms 1500
b65s
waitms 1500
b65s
waitms 1500
b65s
waitms 1500
b65s
waitms 1500
b65s
waitms 1500
b65s
waitms 1500
b65s
waitms 1500
b65s
waitms 1500
b65s
waitms 1500
b65s
waitms 1500
b65s
waitms 1500
b65s
waitms 1500
b65s
waitms 1500
b65s
waitms 1500
b65s
waitms 1500
b65s
waitms 1500
b65s
waitms 1500
b65s
waitms 1500
b65s
waitms 1500
b65s
waitms 1500
b65s
waitms 1500
b65s
waitms 1500
b65s
waitms 2000

echo ^1==== ARM D: the SAME key, asked about 1235 ticks -- expect NOTHING ====
results wrank 0 0 1235
waitms 800

echo ^1==== ARM E1: wrong track -- expect NOTHING ====
results wrank 1 0 1234
waitms 800

echo ^1==== ARM E2: wrong leg -- expect NOTHING ====
results wrank 0 1 1234
waitms 800

echo ^3==== ARM F: the CARD's own subject (0/0/0, never finished) ====
results wrank
waitms 800

echo ^5==== b65rank: done ====
disconnect
waitms 500
quit
