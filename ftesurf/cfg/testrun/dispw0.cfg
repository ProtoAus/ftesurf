// DISPW0 -- Patch 256, hl2_dispwinding OFF (the previous build).  Pair of dispw1.cfg.
//
// WHAT IS BEING MEASURED, and why it is a POINT trace rather than a fall.
//
// A BIH collision triangle carries four units of solid behind its face plane.
// On a side==1 displacement that plane is inverted, so the solid sits ON TOP of
// the visible surface and a downward trace stops 4/|n_z| units high.  With the
// winding fixed it stops flush.
//
// run_eyeinfo (sv_zones.qc SV_EyeInfo) traces straight down from the origin and
// prints `floor %.2f` -- a SERVER-side traceline, so brush entities count, and a
// point trace, so nothing depends on the player falling, settling or sliding.
//
// THE COORDINATES COME FROM THE ENGINE, NOT FROM AN OFFLINE PARSER, and that is
// the whole reason this file works.  Two earlier versions of it aimed at points
// computed by reimplementing VBSP_LoadDisplacements, and both missed everything:
// Strata widens dface_t to 72 bytes AND the edge lump's vertex indices to 32
// bits, so the base quads came out of the wrong vertices and the coordinates
// looked plausible and were nowhere near the terrain.  The plugin now prints the
// centroid of its own flattest re-wound and untouched displacements at
// developer 1; these six are copied from that.
//
// THEY ARE STACKED PAIRS AT THE SAME XY -- an untouched displacement about 54
// units above a re-wound one -- so each probe starts 16 units above ITS OWN
// surface and below the other.  Aiming from higher up would hit the wrong one,
// which is the same "probe landed on the thing in front" trap as before.
//
// EXPECTED:
//   re-wound  118/122/126 : floor 4.00 LOWER here than in dispw0
//   untouched 117/121/125 : floor IDENTICAL in both runs
// If the untouched controls move, the change is not doing what it says.
// If nothing moves, check hl2_dispcollision 0 first -- dispw2.cfg -- because a
// probe that is really hitting a brush cannot show a displacement change.

log_enable 1
log_dir "logs"
log_name "dispw0"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
con_notifylines 0
developer 1
log_developer 1

hl2_dispwinding 0

wait 200
map bhop_arcane
waitmap 1800
waitms 8000
sv_cheats 1
waitms 400
noclip
waitms 600

echo ^5=== re-wound 118 (surface -5173.88) ===
setpos 11776.0 4352.0 -5157.9 0 0 0
waitms 900
cmd run_eyeinfo
waitms 900

echo ^5=== re-wound 122 (surface -5173.75) ===
setpos 11776.0 3840.0 -5157.8 0 0 0
waitms 900
cmd run_eyeinfo
waitms 900

echo ^5=== re-wound 126 (surface -5173.75) ===
setpos 11776.0 3328.0 -5157.8 0 0 0
waitms 900
cmd run_eyeinfo
waitms 900

echo ^5=== untouched 117 (surface -5120.00) -- CONTROL ===
setpos 11776.0 4352.0 -5104.0 0 0 0
waitms 900
cmd run_eyeinfo
waitms 900

echo ^5=== untouched 121 (surface -5122.25) -- CONTROL ===
setpos 11776.0 3840.0 -5106.2 0 0 0
waitms 900
cmd run_eyeinfo
waitms 900

echo ^5=== untouched 125 (surface -5122.25) -- CONTROL ===
setpos 11776.0 3328.0 -5106.2 0 0 0
waitms 900
cmd run_eyeinfo
waitms 900

echo ^5=== dispw0 done ===
wait 30
quit
