// PATCH264 -- verify all three halves in one process.
//
// 1. THE LISTING (surf_monolith).  shaderhere01.cfg established, before any
//    code changed, that shader_here already named the surface the trace stopped
//    on: every probe gave surf_minigolf/grid at z=16296, matching Patch 263's
//    own probe table to the unit.  So this is NOT a before/after on the reported
//    name -- texture= must be IDENTICAL to the pre-patch run, and if it is not,
//    the change is a regression and not a fix.
//
//    What is new is the cand list.  Expected at the bonus-4 ceiling:
//      cand0  surf_minigolf/grid   off=+0.03   <-- REPORTED
//      cand1  fakeskies/mpa45      off=+4.03
//      cand2  fakeskies/mpa45      off=+6.03
//      cand3  tools/toolsskybox    off=+8.03   (at the slab edge, may be cut)
//    That is the entire diagnosis of Patch 263 printed by one keypress, and it
//    is the thing no instrument in the tree could say.
//
//    Also new on that line: side= should name a real material instead of the
//    literal FIXME, from mod_vbsp.c's VBSP_LoadTexInfo fill.
//
//    D_control_down must still print exactly one candidate and still name
//    pietu/monolith/concretefloor001a -- the control that says the walk is not
//    inventing neighbours where there are none.
//
// 2. THE .hdr.vtf FALLBACK (surf_agony, surf_bikini_bottom).  surf_agony names
//    cubemaps/blur_whitenebula 45 times with no .hdr suffix and the plain .vtf
//    does not exist; surf_bikini_bottom is the original report, 1 reference.
//    Expect the per-material Con_DPrintf and the per-map census line.
//
// 3. THE FALLBACK IS NOT AN OVERRIDE (surf_era).  13,291 baked cubemaps in the
//    library ship BOTH cX_Y_Z.vtf and cX_Y_Z.hdr.vtf -- 56,132 references -- and
//    every one must keep taking the tone-mapped LDR file.  surf_era is one of the
//    heaviest.  Expect NO census line at all on this map.  A number here means
//    the probe is firing when the plain file exists, and the patch is wrong.
//
// No screenshots and no r_showshader: console text only.  r_showshader forces
// shader and texture loads and moves the state being measured -- that is what
// produced Patch 263's phantom 35% regression.

log_enable 1
log_dir "logs"
log_name "patch264"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
con_notifylines 0
developer 1
log_developer 1

wait 200
map surf_monolith
waitmap 2400
waitms 10000

sv_cheats 1
waitms 300
noclip
waitms 400

echo ^5=== 1a: bonus 4 ceiling -- the four-layer stack should print in order ===
setpos -11125 -5511 15936 -89 178 0
waitms 1200
shader_here A_userpaste_up
waitms 1200

echo ^5=== 1b: the column Patch 263 probed ===
setpos -13500 -5400 15936 -89 178 0
waitms 1200
shader_here B_probecol_up
waitms 1200
solid_here B_probecol_up
waitms 1200

echo ^5=== 1c: the save004 vantage ===
setpos -10975.05 -5482.11 15936.03 -70 178 0
waitms 1200
shader_here C_save004_yaw178
waitms 1200

echo ^5=== 1d: CONTROL -- floor, unambiguous, must be one candidate only ===
setpos -10975.05 -5482.11 15936.03 89 178 0
waitms 1200
shader_here D_control_down
waitms 1200

echo ^5=== 2a: surf_agony -- 45 refs to blur_whitenebula, hdr-only ===
map surf_agony
waitmap 2400
waitms 10000
hl2_unresolved
hl2_unresolved_visible
waitms 1200

echo ^5=== 2b: surf_bikini_bottom -- the original report, 1 ref ===
map surf_bikini_bottom
waitmap 2400
waitms 10000
hl2_unresolved
hl2_unresolved_visible
waitms 1200

echo ^5=== 3: surf_era -- both .vtf and .hdr.vtf present, expect NO census line ===
map surf_era
waitmap 2400
waitms 10000
hl2_unresolved
hl2_unresolved_visible
waitms 1200

echo ^5=== patch264 done ===
wait 30
quit
