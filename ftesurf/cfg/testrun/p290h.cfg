// FTESurf p290h -- WHAT is the dark object at save006, before anything is fixed.
//
// p290g's picture shows it plainly: a large block filling the middle of the view
// is near-black while the concrete walls either side of it are lit normally.  So
// this is not exposure and not a global lightmap problem -- it is one object.
//
// AND IT IS NOT WORLD GEOMETRY.  shader_here at that exact vantage returned
// metal/metaltrack001a at -10727 11136 -9729, which is 1090 units along +Y --
// past the block, on a wall well behind it.  The engine's trace runs against the
// world model, so a ray that goes THROUGH the object says the object is not in
// the world model: a brush entity, or a static prop.
//
// The last time this exact shape came up (memory: r_drawentities 0 identifies
// "an entity", never WHICH entity) the answer was a static prop and a patch was
// written against the wrong object first.  So this run does not toggle anything
// coarse.  It asks directly:
//
//   ent_here      my own inspector -- MOVE_EVERYTHING against the CSQC world,
//                 which carries a SOLID_BBOX copy of every brush entity.  If it
//                 names one, it is brushwork.  If it finds nothing, it is a prop.
//   r_texdiag 1   SET BEFORE THE MAP, because it prints from the lightmap build
//                 and setting it afterwards is too late -- p290g set it after
//                 and got no LM/LUX lines at all.
//   ent_view      the volume overlay, so the answer is visible and not just a
//                 line of text.
cfg_save_auto 0
exec cfg/testrun/_quiet.cfg
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "p290h"
scr_sshot_type png
cl_yieldcpu 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0

// BEFORE the map, or it prints nothing.
r_texdiag 1
waitms 1500

map surf_tensor2
waitmap 240
waitms 9000
r_texdiag 0
sv_cheats 1
noclip
waitms 500

setpos -10727.2881 10045.7559 -9831.4062 -2.4445 89.8352 0
waitms 3000
hl2_colourcorrection 0
waitms 1000

echo "@@@ P290H ent_here -- brush entity, or nothing?"
ent_here
waitms 2500

echo "@@@ P290H ent_view overlay"
ent_view 1
waitms 2000
screenshot p290h_entview
waitms 1500
ent_view 0
waitms 1000

echo "@@@ P290H aim slightly DOWN at the block's lower face"
setpos -10727.2881 10045.7559 -9831.4062 10 89.8352 0
waitms 2000
shader_here
waitms 1200
light_here
waitms 1200
ent_here
waitms 2000
screenshot p290h_down
waitms 1200

echo "@@@ P290H DONE"
waitms 1200
quit
