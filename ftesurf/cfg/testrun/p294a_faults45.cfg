// cfg_save_auto 0: this run sets archived cvars (vid_*, cl_maxfps); never let it write them into ftesurf.cfg (cl_main.c:2535)
cfg_save_auto 0
// Patch 294a -- DIAGNOSTIC ONLY, no engine change.  Faults 4 and 5 from Lex's
// screenshots, neither of which has been investigated yet.
//
// FAULT 4: "brush entity that is darker than in counter-strike ... probably a
//          func_detail? it despawns when I noclip into the void" -- his overlay
//          named it func_brush #101 on surf_tensor2.
// FAULT 5: "I don't know when 3d skyboxes are supposed to spawn in ... on
//          counter-strike I see nothing out the windows in the skybox. but in my
//          game, I render a bunch of random crap? it's not PVSing correctly?"
//
// METHOD: ONE process, camera pinned at LEX'S OWN save-lock (data/saves/
// surf_tensor2/save008: origin -10751.1777 9562.7969 -9789.3184, angles
// -0.0934 89.4342).  Every arm is the same camera with ONE cvar moved, so the
// pixel diff between arms localises the change by itself -- I do not need to
// know where in frame the windows are, only that something moved.
//
// A/B inside one process is deliberate: the cross-run pixel floor hides a 7-18%
// swing (pixel-noise-floor-across-runs), and a repeat-shot pair at the top
// measures this run's OWN floor so every later number has a scale.
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000
wait 200

developer 1
log_developer 1
log_enable 1
log_dir logs
log_name p294a_faults45
cl_maxfps 0
cl_idlefps 0
sv_cheats 1
con_notifylines 0
con_notifytime 0
con_notifytime_error 0
r_drawentities 1

alias lexpos "setpos -10751.1777 9562.7969 -9789.3184 -0.0934 89.4342 0; waitms 2000"

echo ^5=== p294a: surf_tensor2, Lex's save008 vantage
map surf_tensor2
waitmap 600
waitms 9000
waitms 3000
noclip
waitms 1000

// ---- NOISE FLOOR: two shots, same everything, nothing touched between them.
// Any later arm that moves fewer pixels than these two differ by is NOISE.
lexpos
cmd viewpos
screenshot p294a_floor_a
waitms 700
screenshot p294a_floor_b

// ---- FAULT 5 ARMS: sky / skyroom.  Default first.
echo ^5=== ARM sky1: defaults (r_sky_forcedepth default, vbsp_skyroom default)
lexpos
screenshot p294a_sky1_default

echo ^5=== ARM sky2: r_sky_forcedepth 2 -- mask Source sky too (gl_warp.c:483-504)
r_sky_forcedepth 2
waitms 1500
lexpos
screenshot p294a_sky2_forcedepth

echo ^5=== ARM sky3: vbsp_skyroom 0 -- skyroom pass off entirely (cl_main.qc:384)
r_sky_forcedepth 1
vbsp_skyroom 0
waitms 1500
lexpos
screenshot p294a_sky3_noskyroom

// restore
vbsp_skyroom 1
r_sky_forcedepth 1
waitms 1500

// ---- FAULT 4 ARMS: the dark brush entity.
echo ^5=== ARM b1: defaults, brush entity reference
lexpos
screenshot p294a_b1_default

echo ^5=== ARM b2: hl2_bumpstride 0 -- if the map is unbumped this must be a no-op
hl2_bumpstride 0
waitms 1500
lexpos
screenshot p294a_b2_nobumpstride

echo ^5=== ARM b3: hl2_bumpmap 0 -- bump off entirely
hl2_bumpstride 1
hl2_bumpmap 0
waitms 1500
lexpos
screenshot p294a_b3_nobumpmap

echo ^5=== ARM b4: r_texdiag 1 -- read LM/LUX/BAT for *101 vs world (r_surf.c:4819-4853)
hl2_bumpmap 1
r_texdiag 1
waitms 2000
lexpos
screenshot p294a_b4_texdiag
r_texdiag 0
waitms 1000

echo ^5=== END OF RUN ===
waitms 500
quit
