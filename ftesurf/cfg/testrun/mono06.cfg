// MONO06 -- name the surface BEHIND bonus 4's see-through shell.  Observe only.
//
// Where mono05 got to, and why it is not the answer yet:
//
//   Every wall, ceiling and far end at bonus 4 traces to surf_minigolf/grid,
//   whose VMT is UnlitGeneric + $translucent 1 + $additive 1 + $color
//   [0.33 0.33 0.33].  FTE compiles that to sort 12, blendFunc add, rgbGen
//   const 0.33, NO lightmap pass -- a faithful translation of what the mapper
//   wrote.  And the VTF is real: 128x128 I8, present in the pak, and only 2044
//   of its 22101 image bytes are non-zero (every mip from 64x64 down is pure
//   black), i.e. thin bright lines on black.  Drawn additive, black is
//   invisible.  So the shell is SEE-THROUGH by construction.
//
//   It is also definitely not FTE's fallback: missing_texture is 16x16
//   (r_2d.c:290) and shader_here reported 128x128.
//
// So the pink/black checkerboard is something FURTHER ALONG THE RAY, and
// shader_here stops at the first world face -- the additive shell.  This run
// walks the camera through the shell and asks again at each step.  If the
// checker is a real material it gets named here; if the probe passes the wall
// and finds nothing, the checker is being drawn where there is no geometry,
// which is a completely different (and more interesting) failure.
//
// The march is along the ray mono05's b4_fwd already measured: from the user's
// save004 origin -10975.05 -5482.11 15936.03 to the hit at -16296 -5296 16093,
// which is 5327 units of delta (-5321, 186, 157).  Sampling at 1000 / 2500 /
// 4000 / 5200 / 5400 puts the last two just short of and just past the wall.
//
// noclip once, before the first setpos, never between (it is a toggle).
// 1500ms per pair: setpos is a stringcmd applied server-side, shader_here runs
// locally off the client's view.

log_enable 1
log_dir "logs"
log_name "mono06"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
con_notifylines 0
developer 1
log_developer 1

wait 200
map surf_monolith
waitmap 2400
waitms 10000

sv_cheats 1
waitms 300
noclip
waitms 400

echo ^5=== t=1000 along the b4_fwd ray ===
setpos -11974 -5447 15965 0 178 0
waitms 1600
shader_here t1000
waitms 400

echo ^5=== t=2500 ===
setpos -13472 -5395 16010 0 178 0
waitms 1600
shader_here t2500
waitms 400

echo ^5=== t=4000 ===
setpos -14971 -5342 16054 0 178 0
waitms 1600
shader_here t4000
waitms 400

echo ^5=== t=5200, just short of the wall ===
setpos -16169 -5300 16089 0 178 0
waitms 1600
shader_here t5200
waitms 400
screenshot mono06_t5200_x
waitms 700
screenshot mono06_t5200
waitms 700

echo ^5=== t=5400, PAST the wall, looking back at it ===
setpos -16369 -5294 16095 0 358 0
waitms 1600
shader_here t5400_back
waitms 400
screenshot mono06_t5400_x
waitms 700
screenshot mono06_t5400_back
waitms 700

echo ^5=== t=5400, still facing away from the room ===
setpos -16369 -5294 16095 0 178 0
waitms 1600
shader_here t5400_fwd
waitms 400

echo ^5=== does r_fastsky change the checker?  if yes it is the SKY behind ===
r_fastsky 1
waitms 800
setpos -10975.05 -5482.11 15936.03 -70 178 0
waitms 1600
screenshot mono06_fastsky_x
waitms 700
screenshot mono06_fastsky_ceiling
waitms 700
r_fastsky 0
waitms 400

echo ^5=== mono06 done ===
wait 30
quit
