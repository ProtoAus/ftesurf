cfg_save_auto 0
// PATCH 312 -- FALSIFIER.  The m-vs-v cross-check (plan item P294b): does the
// view delta equal the raw reports the ring actually delivered?
//
// WHY THIS IS THE CHECK THAT MATTERS.  Patch 293 put the counts and the angle on
// one line and proved dyaw == -m_yaw*sens*scale*mx exactly.  But BOTH sides of
// that identity come from the engine's own mx, so it tests the engine's
// multiplication and not the player.  A hook that rewrites the accumulated delta
// UPSTREAM of mx -- which is where this entire class of cheat lives, and is
// exactly what momentum.dll does to CInput::ApplyMouse -- gets a conforming
// Patch 293 record for free.  That gap is documented in 293's own essay.
//
// The 'm' records are written by IN_Commands straight off the event ring.  The
// 'v' delta is tapped in IN_MoveMouse.  Those are opposite sides of precisely
// the window such a hook occupies, so a DISAGREEMENT BETWEEN THEM IS THAT HOOK.
//
// MEASURED FIRST, BEFORE ANY CODE, because the plan required it: assuming a
// frame correspondence is the mistake that made the .hid/.view cross-check
// impossible.  Across every journal in the tree -- 45,447 'v' records including
// one real 4976-tick PB (runs/bhop_eazy/main/0004976_pb.hid, 42,973 v / 41,159 f
// / 42,908 m) -- the join HOLDS on 45,384 of 45,384 covered frames, 100.000000%.
// So 'v' needs no sequence number and this patch adds no record kind.
//
// Simulated against that same real run, a delta-mutating hook touching 93.68% of
// frames moves P293's median residual from 0.121000 to 0.121001 degrees -- the
// SIXTH decimal -- while moving the m-vs-v break rate from 0.00% to 93.68%.
// Detection is integer-exact per frame against a measured false-positive floor of
// zero, so the threshold is a SINGLE frame.
//
// WHAT THE MEASUREMENT ALSO FOUND, which the plan did not anticipate: two
// legitimate exemptions, both of which the file already discloses itself.
//   (1) the FIRST v of a file -- counts that arrived before `begin`.
//   (2) a window containing an 'a' record.  An absolute position flips the
//       pointer to M_TOUCH (in_generic.c:1954) and the delta then comes from the
//       absolute path including a hardcoded `mx *= 1.75` (in_generic.c:~2143,
//       "boost sensitivity so that the default works okay").  Measured at
//       exactly 1.75x on every instance.  The real PB run has ZERO 'a' records:
//       absolute mode engages only when the cursor is free, i.e. not playing.
//
// AND TWO GAPS THIS PATCH HAS TO CLOSE, both of which would ACCUSE AN HONEST
// PLAYER -- the Patch 305 failure mode, where the flagship check called the
// game's own core mechanic a cheat on 10,091 frames of a clean PB:
//
//   GAP 1 -- in_xflip.  in_generic.c:2071 does `if(in_xflip.value) mx *= -1;`
//   UPSTREAM of the journal tap, and the cvar is recorded NOWHERE in the .hid.
//   An honest player with in_xflip 1 therefore produces v.dx == -sum(m.dx) on
//   EVERY FRAME: a 100% break, from a cvar that is not CVAR_CHEAT and not even
//   archived.  A reader cannot tell that from a sign-flipping hook.
//
//   GAP 2 -- counts discarded while the cursor is free.  in_generic.c:2076
//   zeroes mx BEFORE the tap, so in_jrn_vdx stays 0, the quiet-frame early
//   return in IN_Journal_View fires, and NO v LINE IS EMITTED -- while the 'm'
//   records were already written.  Those counts are then orphaned into the next
//   v window, which reads as a break on a player who merely opened the console
//   or alt-tabbed.  Note the emit rule's own essay already makes the mirror of
//   this argument ("an angle that moved without counts behind it is the
//   signature, not the noise"); counts that moved no angle are the same kind of
//   evidence and are currently dropped.
//
// PRE-REGISTERED, before either run.  THE BEFORE HALF was this same cfg run
// against the UNPATCHED shipped binary (25253344A8B8) writing data/p312pre_*.hid
// -- so every prediction below is a prediction of FAILURE, and an arm that
// PASSED there would have falsified my reading of the source.  The AFTER half is
// the same four arms writing data/p312_*.hid.
//
//   ARM A  control: cursor grabbed, synth motion -> data/p312_A.hid
//          sum(m) MUST equal v.dx on every covered frame.  If this breaks, the
//          join does not hold and the whole check is wrong.
//   ARM B  in_xflip 1 set BEFORE the journal -> data/p312_B.hid
//          The header MUST contain no xflip key at all, and sum(m) MUST equal
//          -v.dx on every frame -- i.e. a 100% break with nothing in the file to
//          explain it.  THIS IS THE FALSE ACCUSATION the patch must prevent.
//   ARM C  in_xflip toggled 1 then 0 INSIDE the journal -> data/p312_C.hid
//          There MUST be no record of either change.  A reader comparing start
//          against end sees nothing happened, and the sign flipped mid-file.
//   ARM D  console opened mid-journal, synth motion while free -> data/p312_D.hid
//          The console-period 'm' records MUST appear with NO v line carrying
//          them, and the next v after the console closes MUST then be short by
//          exactly those counts.  That is the orphaning described in GAP 2.
//
// WHY SYNTH MOTION RATHER THAN A HAND.  in_journal_synth calls IN_MouseMove,
// which enqueues IEV_MOUSEDELTA into the same ring the backend uses, so it
// drives the full ring -> m -> ptr[].delta -> IN_MoveMouse -> v path under test.
// Verified on a shipped file: p311_B.hid carries 32 'm' records from `synth 32`.
// These journals are marked `synth 1`, which is correct and does not weaken a
// MECHANISM test -- the question here is what the engine does with counts, not
// where they came from.  It also means these arms need no external injection
// harness and no human at the keyboard, which is why all four are scriptable.

exec cfg/testrun/_quiet.cfg

developer 1
log_developer 1
log_enable 1
log_dir logs
log_name p312mvsv
cl_maxfps 100
cl_idlefps 0
sv_cheats 0
con_notifylines 0
con_notifytime 0.01
r_drawviewmodel 0

wait 200
map bhop_eazy
waitmap 600
waitms 5000

in_xflip 0
waitms 500

echo ^5=== P312 ARM A: control, cursor grabbed
in_journal_begin
waitms 500
in_journal_synth 24
waitms 800
in_journal_note p312-arm-A-control
waitms 200
in_journal_end data/p312_A.hid
waitms 1000

echo ^5=== P312 ARM B: in_xflip 1 set BEFORE the journal
in_xflip 1
waitms 500
in_journal_begin
waitms 500
in_journal_synth 24
waitms 800
in_journal_note p312-arm-B-xflip-preset
waitms 200
in_journal_end data/p312_B.hid
waitms 1000
in_xflip 0
waitms 500

echo ^5=== P312 ARM C: in_xflip toggled INSIDE the journal
in_journal_begin
waitms 400
in_journal_synth 12
waitms 400
in_xflip 1
waitms 400
in_journal_synth 12
waitms 400
in_xflip 0
waitms 400
in_journal_synth 12
waitms 400
in_journal_note p312-arm-C-xflip-midrun
waitms 200
in_journal_end data/p312_C.hid
waitms 1000

echo ^5=== P312 ARM D: console open, counts discarded while cursor free
in_journal_begin
waitms 400
in_journal_synth 8
waitms 600
toggleconsole
waitms 600
in_journal_synth 8
waitms 600
toggleconsole
waitms 600
in_journal_synth 8
waitms 600
in_journal_note p312-arm-D-freecursor
waitms 200
in_journal_end data/p312_D.hid
waitms 1000

in_xflip 0
echo ^5=== END OF RUN ===
waitms 1000
quit

// ===========================================================================
// MEASURED -- 2026-09-13.  A REAL BEFORE/AFTER ON TWO BINARIES: the same cfg and
// the same four arms, run against the deployed pre-312 build (25253344A8B8) and
// then the Patch 312 build (B88F71EA1A8D).
//
// Each synth batch is a known constant, so the arithmetic is checkable by hand:
// `in_journal_synth 8` is 29 counts, 12 is 43, 24 is 90.
//
//   arm                        pre-312                      post-312
//   A  control                 sum(m)=90 -> v.dx +157.5      d 90 -2 / v 157.5 -3.5
//   B  in_xflip 1              sum(m)=90 -> v.dx -157.5      input in_xflip "1" "0"
//                              NO xflip key anywhere         + d 90 -2 / v -157.5
//   C  in_xflip toggled x2     three windows +/-/+ , c=0     TWO 'c' records
//   D  console open            v.dx 50.75 vs sum(m) 58       a THIRD v line,
//                              (one batch ORPHANED)          flags 4, d 29 -3
//
// ARM B PRE-312 IS THE POINT.  Identical synthetic input, sign inverted, and not
// one key in the header to say why.  An honest player with a cvar that is
// neither CVAR_CHEAT nor CVAR_ARCHIVE was indistinguishable from a sign-flipping
// hook -- a 100% failure of the flagship check against someone who did nothing.
// That is the Patch 305 failure mode, which cost 10,091 frames of a clean PB.
//
// ARM D PRE-312 IS THE OTHER ONE.  v.dx carried 29 counts against sum(m) 58:
// exactly one 29-count batch ORPHANED by one console press, because mx was
// zeroed before the tap, the quiet-frame return then dropped the 'v' line
// entirely, and the 'm' records fell into the next window.  Post-312 there is a
// third 'v' -- `v 0 0 4` with `d 29 -3` -- and it is the FIRST record carrying
// flags bit 4 in ANY journal in this tree.  The free-cursor path was unmeasured
// across all 45,402 previously recorded 'v' records; it is measured now.
//
// THE FINAL RUN EXERCISED THE HARDEST CASE BY ACCIDENT AND PASSED.  The launcher
// leaves the window unfocused, so the pointer sat in M_TOUCH and every frame took
// the hardcoded `mx *= 1.75` boost: `d 90 -2` against `v 157.5 -3.5`.  The join
// still closes, because the join is made against the value the engine STATED
// rather than against a transform the reader guessed.  It also means arms A and B
// have few joinable windows in that run (an 'a' record makes a window
// unjoinable); the substantive joinable measurement is the real PB below.
//
// THE CORPUS.  hidcheck's counts join over every journal in the tree:
//   runs/bhop_eazy/main/0004976_pb.hid   42,972 joinable windows, 0 broken
//   all 7 real .hid recordings           validate ok
//   pooled with the arms                 43,801 / 43,801 = 100.000000%
//
// WHAT IT CATCHES, demonstrated on a real file rather than asserted.  Taking
// p312_A.hid and applying THE FAITHFUL HOOK -- v.dx +1 AND yaw -k, which is what
// a real delta-mutating hook produces because the engine does its own arithmetic
// on the doctored value -- hidcheck reports:
//     identity   exact on all 1 governed frames      <- Patch 293 sees NOTHING
//     FAULT      COUNTS JOIN BROKEN ... sum(m)=(90,-2) but raw=(91,-2)
// One count in ninety.  That is the gap 293 documented in its own essay and
// could not close, closed.
//
// Simulated at scale against the real PB, a hook touching 93.68% of frames moves
// 293's median residual from 0.121000 to 0.121001 degrees -- the SIXTH decimal --
// and moves this check from 0.00% to 93.68%.
//
// WHAT IT DOES NOT CATCH, from a red-team pass over the patch: an edit to the
// EVENT RING before the drain is transcribed by the 'm' record as truth, so both
// ends agree; same for an overwrite of the _GRID GetRawInputData pointer, which
// is a single static and therefore a data write rather than a code patch.
// Anyone who can hook IN_Journal_Raw authors the whole file.  This check spans
// the ring read to the delta read and claims nothing outside it.
//
// The same pass found SEVEN more transforms between the 'm' record and Patch
// 293's tap, six silent on an honest client -- the Key_Dest_Has(~kdm_game)
// zeroing (whose destinations are NOT all covered by flags bit 4: opening chat
// discards counts with flags reading 0), CSQC_MouseMove (on by default, and this
// game ships CSQC panels), the two menu consumers, the weapon wheel (which
// returns true on the key alone regardless of its threshold) and the touch
// boost.  ALL SIX ARE DOWNSTREAM OF THE SINGLE TAP, so one line covers them and
// covers the seventh nobody has written yet.  A flag bit per discard site would
// have needed six correct edits and would fail silently when someone adds a
// seventh.
//
// hidcheck.py: 'd' parsed, `input` collected as a repeating header line beside
// `render`, and check_counts_join added BESIDE check_identity rather than inside
// it -- that function's early returns all concern the sensitivity pipeline
// DOWNSTREAM of v.dx and would have suppressed this check on exactly the files
// it exists for.  A pre-312 file reports the join as UNANSWERABLE rather than
// broken, because without a 'd' record an honest in_xflip player and a
// sign-flipping hook produce byte-identical files.  SIX new suite cases; 104
// checks, 0 failed.
//
// PRE-REGISTRATION CORRECTION, recorded rather than reworded.  The block at the
// top of this file registered the design as "two legitimate exemptions the
// reader applies", one of them being the 1.75 touch boost marked by an 'a'
// record.  THAT DESIGN WAS WRONG AND THE MEASUREMENT KILLED IT: Patch 202
// DEDUPES unchanged absolute positions for size, so a run spent entirely
// ungrabbed carries ONE 'a' record for a state that lasts the whole file.  The
// exemption would have covered one window and faulted every other.  A sparse
// record cannot mark a span -- the fifth time this tree has landed on that
// lesson, after 301, 306, 307 and 310 -- so the boost is disclosed per frame by
// a 'd' record instead, and the 'a' exemption survives only for its OTHER and
// narrower job: a window where counts entered the view as 'a' and never as 'm'.
// The final run above is the proof, every frame boosted and every frame stated.
