// SEAM04 -- the A/B, aimed at material that actually carries the keys.
//
// seam03 got the METHOD right and the AIM wrong.  slowmo 0 on surf_outra dropped
// the noise floor from 72.82% to 0.01%, so the measurement finally works -- but
// shader_here reported maz/train_brick_wall_01_d and concrete/concretefloor023a
// at the two vantages, both plain vmt/lightmapped.  The camera was placed at the
// centroid of each displacement's BOUNDING BOX, which on a patch spanning 4109
// units is buried inside the terrain, so the frames contained none of the
// material under test and every toggle read 0.01-0.15%, i.e. the floor.
//
// These positions are 260 units out along the face plane normal from a REAL
// DISPLACED VERTEX at the middle of the patch (the disp01.cfg geometry from
// Patch 250, which did land), restricted to upward-facing ground so the camera
// stands in open air, then pulled back 200 units so the frame is not 100% floor.
// shader_here at every stop names what the crosshair found; if it is not a
// blend material the run has failed again and the numbers mean nothing.
//
// slowmo 0 stays. Floor first, at every vantage, at the same 4s spacing as the
// toggles.

log_enable 1
log_dir "logs"
log_name "seam04"
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 0
vid_fullscreen 0
developer 1
log_developer 1
con_notifytime 0
con_notifylines 0
con_notifytime_error 0

wait 200

hl2_seamless 1
hl2_bumpmap2 1
map surf_outra
waitmap 1800
waitms 12000
sv_cheats 1
waitms 400
noclip
waitms 400
slowmo 0
waitms 1000

echo ^5######### vantage A -- maz/gravel01yellow_caverockyellow_blend #########
setpos 4548.0 1910.0 4105.6 55.00 -180.00 0
waitms 3000
developer 1
shader_here seam04A
light_here seam04A
waitms 500
developer 0
waitms 2000
screenshot seam04_a_floor1
waitms 4000
screenshot seam04_a_floor2
waitms 900
hl2_seamless 0
waitms 4000
screenshot seam04_a_seam_off
waitms 900
hl2_seamless 1
waitms 4000
screenshot seam04_a_seam_on
waitms 900
hl2_bumpmap2 0
waitms 4000
screenshot seam04_a_bump_off
waitms 900
hl2_bumpmap2 1
waitms 4000
screenshot seam04_a_bump_on
waitms 900

echo ^5######### vantage B -- maz/caverockyellow_sulphurrock_blend ############
developer 1
setpos 3900.0 1662.0 4984.5 55.00 0.00 0
waitms 3000
shader_here seam04B
waitms 500
developer 0
waitms 2000
screenshot seam04_b_floor1
waitms 4000
screenshot seam04_b_floor2
waitms 900
hl2_seamless 0
waitms 4000
screenshot seam04_b_seam_off
waitms 900
hl2_seamless 1
waitms 4000
screenshot seam04_b_seam_on
waitms 900
hl2_bumpmap2 0
waitms 4000
screenshot seam04_b_bump_off
waitms 900
hl2_bumpmap2 1
waitms 4000
screenshot seam04_b_bump_on
waitms 900

echo ^5######### vantage C -- maz/grass_sand_blend ############################
developer 1
setpos 10952.0 -14832.0 7556.2 55.00 -180.00 0
waitms 3000
shader_here seam04C
waitms 500
developer 0
waitms 2000
screenshot seam04_c_floor1
waitms 4000
screenshot seam04_c_floor2
waitms 900
hl2_seamless 0
waitms 4000
screenshot seam04_c_seam_off
waitms 900
hl2_seamless 1
waitms 4000
screenshot seam04_c_seam_on
waitms 900

echo ^5=== seam04 done ===
wait 30
quit
