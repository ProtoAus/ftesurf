// BUILD 37c -- REGRESSION, and the one map that caught a real one.
//
// The change touches three shared paths, and each could quietly cost a map that
// was working:
//
//   trigger_teleport_touch  gained a StartDisabled gate and a filter gate.  A
//                           surf map whose resets stopped firing would be a far
//                           worse bug than the one being fixed.
//   trigger_multiple        went from "deleted model, inert" to a real trigger
//                           -- but ONLY when the map wires an output to it.  On
//                           every other map it must stay exactly as inert as it
//                           was, and cost no extra networked entities.
//   the catch-all           lost func_bhop from its non-solid list.
//
// SURF_KITSUNE IS NOT A PASSIVE CONTROL.  It wires 50 outputs of its own, and
// its `SecretTeleporter` carries StartDisabled 1 with a func_button that fires
// `SecretTeleporter Enable`.  Before build 37 FTESurf ignored StartDisabled, so
// that secret was permanently ON; honouring it WITHOUT honouring the button
// would have made it permanently OFF -- a secret nobody can reach, silently.
// Step 2 is that whole loop end to end: stand in the disabled volume (must not
// teleport), press the button, be teleported.  It is the +use path, the
// OnPressed path and the Enable input in one reading.
//
// bhop_ambience is the passive control: a bhop map with a PB recorded against
// build 36 physics, no func_bhop, and no wiring at all.

log_enable 1
log_dir "logs"
log_name "b37c"
developer 0
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
sv_cheats 1

wait 200
echo ^5=== b37c: regression ===

echo ^5--- 1. surf_kitsune: load report ---
map surf_kitsune
waitmap 900
waitms 2000
echo ^5(expect "target case: 28 reference(s) repaired" UNCHANGED from build 36,
echo ^5 "entity I/O: 50 output(s) wired", and "teleports: 1 spawned DISABLED".)
ent_census
waitms 1000

echo ^5--- 2. the secret: disabled volume, then the button that enables it ---
echo ^5(SecretTeleporter is a 512x512x80 volume centred 12288 3584 -2456, target
echo ^5 `spawn` at 0 -1964 395.  The func_button is a 24x24x8 plate at
echo ^5 12288 3584 -2444, inside it.)
setpos 12288 3520 -2480 23.6 90 0
wait 100
echo ^5(A. standing IN the disabled teleport. Must still be at x~12288 -- if we are
echo ^5 at 0 -1964 then StartDisabled is being ignored, which was build 36.)
viewpos
waitms 800

echo ^5(B. now press it. +use traces 80 units from the eye along v_angle.)
+use
wait 10
-use
wait 100
echo ^5(expect 0 -1964 396 = `spawn`: the button fired OnPressed, Enable turned the
echo ^5 teleporter on, and it took us. Still at x~12288 means the press did nothing.)
viewpos
waitms 1000

echo ^5--- 3. bhop_ambience: the passive control ---
map bhop_ambience
waitmap 900
waitms 2000
echo ^5(expect NO "entity I/O" line and NO "func_bhop" line: this map wires nothing.)
ent_census
waitms 1000

echo ^5--- 4. the kill switch: vbsp_entity_io 0 must restore build 36 on futile ---
vbsp_entity_io 0
map bhop_futile
waitmap 900
waitms 2000
echo ^5(expect NO "entity I/O" line at all.)
echo ^5(and the drop must then reproduce the ORIGINAL BUG on demand: teleported to
echo ^5 `start` at y~272.  The switch gates the map's WIRING -- outputs AND filters,
echo ^5 since AddOutput writes the name and the filter reads it.)
setpos 5439.26 1793.67 8909.18
wait 250
viewpos
waitms 800

vbsp_entity_io 1

echo ^5=== b37c done ===
wait 30
quit
