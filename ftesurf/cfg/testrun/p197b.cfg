// FTESurf Patch 197b -- the ordering test, which is the fault P186 was actually shipped off for.
//
// P186's mount put <gamedir>_cache ABOVE the fs_addons.txt games, because FS_RemountAddons
// runs at the END of FS_ReloadPackFilesFlags and the cache was mounted in the middle of it.
// The real order was
//     gamedirs > _downloads > _cache > cstrike > hl2 > momentum > automounted packs
// so a cached file could outrank the CS:S / HL2 / Momentum copy a surf map was built
// against.  P197 mounts the cache from FS_AutoMountForMap instead, i.e. after
// FS_RemountAddons has already run, and in the slot the pack it replaces would have had --
// the LAST position, below every game.
//
// Asserting that from the source is not the same as showing it, so this plants a booby trap:
// a file named maps/zones/online/surf_utopia.json, which really exists inside the mounted
// Momentum install, is written into surf_utopia's TF2 cache directory with junk in it.
// Under P186's ordering the cache would win and the junk would be parsed.  Under P197's the
// Momentum copy wins and nothing changes.
//
// Two independent readouts, one mechanical and one behavioural:
//   * flocate says which searchpath actually served the name.
//   * the zone loader prints "zones: 6 on surf_utopia (maps/zones/online)" when it parses the
//     real file.  Six zones is surf_utopia's own count, established in Workstream A; the junk
//     file cannot produce it.
//
// Requires surf_utopia to already be PROVEN, so run this straight after p197.cfg.

cfg_save_auto 0
log_name p197b
developer 0
fs_loadstats 1
fs_automount 1
fs_autounmount 1
fs_assetcache 1
waitms 4000

echo "=== P197B: cached load with a shadowing file planted in the cache ==="
map surf_utopia
waitmap 240
waitms 12000

echo "--- must be served by momentum, NOT by ftesurf_cache ---"
flocate maps/zones/online/surf_utopia.json
echo "--- and these must be served by ftesurf_cache, since TF2 is not mounted ---"
flocate materials/skybox/sky_dustbowl_01_hdrside.vtf
flocate materials/concrete/computerwall001.vtf
fs_cache_info

echo "=== P197B DONE ==="
waitms 2000
quit
