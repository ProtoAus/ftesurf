// FTESurf Patch 300 -- the shared body of the cross-process A/B.  Not run
// directly: p300on.cfg and p300off.cfg set hl2_additivefog and then exec this.
//
// WHY CROSS-PROCESS, having argued in p300t2b.cfg that it should not be.
// p300t2b toggled hl2_additivefog inside one process and every arm came back
// PIXEL-IDENTICAL -- 0.0000 meanabs, A vs B vs C.  That is not a null result,
// it is a broken test, and the log says why: after `hl2_additivefog 0` there is
// no second `[vmt] sprites/light_glow03` line.  CVAR_SHADERSYSTEM is documented
// as "change flushes shaders" (cvar.h:133) and it does recompile GLSL, but it
// does not re-run the hl2 material loader for a shader that is already loaded,
// so the generated script -- which is where this patch's decision lives -- was
// never rebuilt.  The cvar changed and nothing downstream of it did.
//
// Recording that rather than quietly switching methods, because an arm that
// measures nothing and reports 0.0000 looks exactly like an arm that measured
// something and found no effect.  That trap has now cost this investigation
// three separate runs.
//
// So the A/B is three PROCESSES: on, off, on.  The third exists solely to give
// the cross-process noise floor its own number, because the within-run floor
// (0.01% of pixels, from p300t2) does not bound a fresh process and a 7-18%
// run-to-run swing has been measured on this game before.  Without run 3 a
// difference between run 1 and run 2 cannot be attributed to the cvar.
cfg_save_auto 0
exec cfg/testrun/_quiet.cfg
developer 1
log_enable 1
log_developer 1
log_dir "logs"
scr_sshot_type png
cl_yieldcpu 0
vid_vsync 0
crosshair 0
fov 100
con_notifylines 0
con_notifytime 0.01
cl_maxfps 100

// The artefact only exists while the program-less fog path is ENABLED, and
// ftesurf.cfg currently saves this as 0.  An arm that inherits that shows no
// difference and reads as "the fix does nothing".
r_fog_progless 1
r_fog_linear 1

waitms 2500
map surf_tensor2
waitmap 240
waitms 8000
sv_cheats 1
noclip
waitms 500

vbsp_sprites 1
vbsp_lightglow 1
vbsp_lightglow_scale 1
vbsp_sprite_source 1
r_renderscale 2
// Off: it draws a changing string, and this run measures a whole-frame ratio.
show_fps 0

setpos -10688.5 -1773.8 -8587.1 6.3 91.1 0
// 25s: p300t2 showed the scene still converging at 20s, and its entire arm A
// measured warm-up as a result.
waitms 25000

echo "@@@ P300AB state -- the value under test"
hl2_additivefog
r_fog_progless
r_fog_linear
waitms 1500

screenshot p300ab_x
waitms 1200
screenshot p300ab_1
waitms 1200
screenshot p300ab_2
waitms 1200

echo "@@@ P300AB DONE"
waitms 1200
quit
