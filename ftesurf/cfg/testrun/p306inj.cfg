cfg_save_auto 0
// PATCH 306 -- FALSIFIER.  The journal now counts the WM_INPUT reports that raw
// input REJECTS, instead of dropping them in silence.
//
// WHY.  INS_RawInput_MouseRead matches raw->header.hDevice against the
// enumerated device table and returns if it is not there.  That drop is the
// defence -- it is why injected SendInput motion never reaches the view -- and
// it leaves NO TRACE AT ALL.  So today a .hid from a session where nobody
// cheated and a .hid from a session where forty thousand synthesized events were
// thrown away are BYTE-IDENTICAL.  The one artifact a defeated attack produces
// is being deleted at the moment it is generated.
//
// TWO COUNTERS, NEVER ONE.  A report with no device handle (hDevice == NULL) is
// synthesized input and has no innocent reading.  A report with a REAL handle
// that is not in our table is a mouse hot-plugged after INS_RawInput_Init, or an
// RDP device excluded by in_rawinput_rdp -- entirely innocent, and also a live
// usability bug, because that device's motion is going nowhere.  Collapsing them
// into one number would let "you hot-plugged a mouse" read as "you were
// attacked", and the second of those is an accusation about a person.
//
// THIS ARM CANNOT BE DRIVEN FROM HERE.  Unlike Patch 305's +left/+right, there
// is no console command that synthesizes a WM_INPUT.  The injection is fired by
// an EXTERNAL harness written for this test -- it calls the documented SendInput
// API and touches no other process -- which watches for each arm's .hid
// appearing on disk and fires into the window during the next arm.  File
// appearance is used as the clock rather than a log line because COM_WriteFile
// is unbuffered and an echo is not.  The harness is NOT kept under tools/ and
// the MEASURED block at the end of this file says why, and specifies it well
// enough to rebuild.
//
// PRE-REGISTERED, before the harness was run:
//   ARM A  journal open ~2.5 s, NOTHING injected -> data/p306_A.hid
//          The `end` trailer's two new fields MUST read `0 0`, and there MUST be
//          no 'i' record anywhere in the file.  This is the control that says
//          the counter does not tick on its own.
//   ARM B  200 synthesized mouse moves -> data/p306_B.hid
//          At least one 'i' record MUST appear, and the trailer's injected total
//          MUST be non-zero.  The sum of the 'i' deltas MUST equal the trailer
//          total (two independent statements of one quantity).
//   ARM C  50 synthesized mouse moves -> data/p306_C.hid
//          Same, and B's total MUST be about FOUR TIMES C's.  Presence/absence
//          alone would not show the counter COUNTS; the ratio does.
//          Exact equality with the number sent is the strong form and is
//          reported either way -- Windows may batch, and a measured shortfall is
//          a result, not a failure to be explained away.
//   ALL    the unenumerated total MUST stay 0 in every arm: no device is
//          hot-plugged during this test, so any tick there is the mouse/keyboard
//          dwType guard leaking and the counter accusing ordinary input.
//
// WHAT THIS TEST DOES NOT SHOW, stated here so the result is not overread: a
// non-zero count means an injection was REJECTED, not that one succeeded.  These
// events never reached the view -- that is why they are countable at all.  And
// it is blind to the two paths that are actually open: injected mouse BUTTONS
// still arrive as legacy WM_*BUTTONDOWN, and with in_rawinput_keyboard 0 every
// keystroke is legacy.  Neither passes the handle check, so neither is counted.

exec cfg/testrun/_quiet.cfg

developer 1
log_developer 1
log_enable 1
log_dir logs
log_name p306inj
cl_maxfps 100
cl_idlefps 0
sv_cheats 0
con_notifylines 0
con_notifytime 0.01
r_drawviewmodel 0

wait 200
map bhop_eazy
waitmap 600
waitms 5000

echo ^5=== P306: the raw input state in force
in_rawinput
in_rawinput_keyboard
in_rawinput_rdp

echo ^5=== P306 ARM A: control, nothing injected
in_journal_begin
waitms 2500
in_journal_note p306-arm-A-control
waitms 200
in_journal_end data/p306_A.hid
waitms 1500

echo ^5=== P306 ARM B: 200 injected moves land in this window
in_journal_begin
waitms 3500
in_journal_note p306-arm-B-inject200
waitms 200
in_journal_end data/p306_B.hid
waitms 1500

echo ^5=== P306 ARM C: 50 injected moves land in this window
in_journal_begin
waitms 3500
in_journal_note p306-arm-C-inject50
waitms 200
in_journal_end data/p306_C.hid
waitms 1500

echo ^5=== END OF RUN ===
waitms 1000
quit

// ===========================================================================
// MEASURED -- engine\release\fteqw64.exe DE6476AE6FFB, 2026-09-12.
//
// THE HARNESS IS DELIBERATELY NOT IN tools/.  A ready-made input injector is
// the one thing this whole subsystem exists to stop, and tools/ ships with the
// game.  It is 40 lines and fully specified here so an auditor can rebuild it:
// SendInput with INPUT.type=INPUT_MOUSE and MOUSEEVENTF_MOVE, dx alternating
// +3/-3, dy 0, sent in bursts of 10 with a 70 ms gap; the game window is raised
// with AttachThreadInput + SetForegroundWindow, because WM_INPUT registered with
// hwndTarget NULL follows the KEYBOARD FOCUS and a plain SetForegroundWindow is
// refused -- silently -- when the caller is not already foreground.
//
// FOUR RUNS.  Runs 1-3 are kept because three of them failed for reasons that
// are themselves results.
//
//   RUN 0 (kept as p306ctl_A/B/C.hid)  The harness did not fire at all: a
//     backtick inside a PowerShell double-quoted here-string was interpreted as
//     an escape and broke the C# compile.  So all three arms ran with zero
//     injection, which is a wider control than the one arm A was meant to be.
//     Result: `end ... 0 0` on all three, no 'i' record anywhere.
//
//   RUN 1 (p306r1_*)  Arm B's SetForegroundWindow was refused, so its 200
//     events went to the PowerShell window instead of the game.  The journal
//     recorded 0.  THAT IS THE CORRECT ANSWER and it is a control worth more
//     than the arm it replaced: 200 events were synthesized ON THE MACHINE and
//     the engine did not claim to have seen them.  The counter reports what
//     reached this process, not what happened on the desktop.
//     Arm C did land: 50 sent -> 50 counted, in 5 records of exactly 10.
//
//   RUN 2 (p306r2_*)  AttachThreadInput reported success and delivered nothing;
//     all three arms zero.  The raise is granted and lost again before the
//     events are sent.  Recorded rather than discarded because it is why the
//     final harness re-confirms focus around EVERY burst.
//
//   RUN 3 (p306_A/B/C.hid)  Focus confirmed before and after each burst.
//
// RUN 3 RESULT, against the pre-registration above:
//
//   arm   injected sent   counted   'i' records   honest 'm'   unenum
//   A         0             0           0             0           0
//   B       200           200          20 x 10      1100          0
//   C        50            50           5 x 10         0          0
//
//   - EXACT on both arms, and the record structure matches the BURST structure
//     (20 bursts of 10, 5 bursts of 10), which is a stronger statement than the
//     totals: the counter tracks events, not occasions.
//   - B:C = 200:50 = exactly 4.00, as pre-registered.
//   - The trailer total equals the sum of the 'i' deltas in both arms.
//   - unenum stayed 0 everywhere: the dwType guard does not leak.
//
// THE CONTROL I COULD NOT HAVE SCRIPTED.  Arm B carried 1,100 GENUINE mouse
// reports in the same window (a real hand on the mouse during the run), and not
// one of them touched either counter.  Their (dx,dy) distribution settles that
// they are not the injection leaking through by another path: 650 of the 1,100
// have dy != 0 and the values span -7..+4, while every injected event was
// dy == 0, dx == +-3.  Only 48 of 1,100 coincide with the injection signature
// against the 200 that would appear if it were being accepted.
//
//   50 injected -> 50 counted.  459 honest (run 1) and 1,100 honest (run 3) ->
//   0 counted.  Perfect discrimination, in both directions, measured.
//
// AND THE VIEW WAS NOT PERTURBED.  hidcheck reports arm B as `ok` with the P293
// identity EXACT on all 133 governed frames while 200 synthesized reports were
// being rejected.  So the injection is counted AND still dead.
//
// PRE-REGISTRATION CORRECTION, recorded rather than reworded.  The B arm was
// registered as "about four times C".  It came out at exactly four, but only on
// the fourth attempt; the first three produced 0 and would have read as "the
// patch does nothing" to anyone who stopped there.  What separated them was not
// the engine but whether the events reached the process at all -- which is a
// warning about this class of test, not about this patch.
//
// KNOWN, AND NOT CLOSED BY THIS PATCH:
//   - A non-zero count is a REJECTED attempt.  It is not proof of a successful
//     cheat, and it has innocent causes -- remote desktop, accessibility tools,
//     screen sharing and some tablet/macro drivers all synthesize input.
//     hidcheck reports it as a NOTE and must never auto-reject on it.
//   - Injected mouse BUTTONS are still accepted, via the legacy WM_*BUTTONDOWN
//     path in_win.c keeps for click-state tracking.  Not counted here.
//   - With in_rawinput_keyboard 0 (the default) no keyboard WM_INPUT is
//     registered at all, so an injected KEYSTROKE passes this counter unseen.
//   - A hardware replay device enumerates as a real mouse and is counted as
//     neither.  That remains the ceiling.
//
// hidcheck.py: 'i' parsed, the trailer widened to 7-or-9 fields, the two-way
// cross-check added, and FOUR new suite cases (31 checks, 0 failed).
// Arms A and the run-0 control still fault with "no frame markers" -- that is
// the known scripted-capture trap, not this patch: a cfg-driven arm drains no
// real input, and the 'f' marker is only emitted on a non-empty drain.
