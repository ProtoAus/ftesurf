// FTESurf p287c -- WHY is the kitsune doorway black?  Split the two mechanisms.
//
// Established so far, by A/B:
//   * scripts/common.shader is NOT the cause (p287a vs p287b, pixel-identical).
//   * the material parses correctly: sort 3 (SHADER_SORT_PORTAL), one $refraction
//     pass, `portalfbo` accepted, program ftesurf_portal named.
//   * the doors exist: 18 apertures, matching the server.
//   * a portal IS being rendered at this vantage -- "1 in view, 1 rendered" and
//     "N scene renders last frame" both move.
//
// So the far view is being DRAWN and is arriving black.  Two ways that happens,
// and they are distinguishable with one cvar:
//
//   (1) THE PAINT.  r_portalfbo 1 renders the far view to a texture and paints it
//       on the aperture polygon.  If the FBO is rendered but sampled wrong -- or
//       never resolved -- the polygon paints black over a hole, which is exactly
//       what the screenshots show.
//   (2) THE VIEW.  The far scene itself may be empty: a recursed view that gets
//       no PVS renders nothing, and nothing is black.  Patch 271 is on record for
//       precisely this class of bug on the Source path ("a recursed view got no
//       PVS at all"), so it is not a hypothetical.
//
// r_portalfbo 0 falls back to the Patch 206-208 design -- the far view is painted
// over the whole screen and masked back off.  That path shares mechanism (2) and
// does NOT share mechanism (1).  So:
//
//   far view appears with fbo 0  =>  the view is fine, the FBO paint is broken (1)
//   still black with fbo 0       =>  the far view itself is empty (2)
//
// Either answer removes half the search space, which is the point of running it.
//
// r_portalfbo is CVAR_RENDERERLATCH and is read when MATERIALS ARE PARSED, so it
// needs a vid_reload to take effect -- setting it alone would change nothing and
// would read as "fbo makes no difference", the wrong conclusion from a no-op.
cfg_save_auto 0
exec cfg/testrun/_quiet.cfg
developer 1
log_developer 1
log_dir "logs"
log_name "p287c"
scr_sshot_type png
cl_yieldcpu 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0

waitms 2500

map surf_kitsune
waitmap 240
waitms 8000
sv_cheats 1

echo "@@@ P287C cvars in effect"
r_portalfbo
r_portalscissor
r_portalmaxviews
r_portalrecursion
vbsp_portal_render
waitms 300

// ---------------------------------------------------------------- fbo ON
echo "@@@ P287C fbo ON -- today's behaviour, expected black"
setpos 0 -765 133 0 90 0
waitms 3000
screenshot_mega p287c_fbo_on 1280 720
waitms 800

// ---------------------------------------------------------------- fbo OFF
echo "@@@ P287C fbo OFF -- the Patch 206-208 whole-screen path"
r_portalfbo 0
vid_reload
waitms 6000
setpos 0 -765 133 0 90 0
waitms 3000
screenshot_mega p287c_fbo_off 1280 720
waitms 800

// Walk right up to the aperture.  The physics log says the refusal distance at
// the vantage above is 228.9 units; standing in the doorway removes any doubt
// about whether the thing being looked at is even the portal.
echo "@@@ P287C close range, fbo OFF"
setpos 0 -600 133 0 90 0
waitms 2500
screenshot_mega p287c_close_off 1280 720
waitms 800

echo "@@@ P287C DONE"
waitms 1000
quit
