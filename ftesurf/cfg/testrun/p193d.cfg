// FTESurf Patch 193, run D: what does hl2_propdist buy, and what does it cost to look at?
//
// The measured problem, from runs A and B at surf_demise's own info_player_start:
//   base              23.23 fps   Opaque 26.92ms   5,230,080 indices   1453 EntB
//   r_drawentities 3 271.44 fps   Opaque  1.34ms   1,119,782 indices     57 EntB   (props off)
//   r_drawentities 2  22.90 fps   -- brush entities cost NOTHING
// so the props are 4.11M of 5.2M indices and 25.6ms of 26.9ms.  All 2350 of them
// declare FadeMaxDist 0, and the median prop distance from this viewpoint is 24,185
// units, so nothing culls them by distance and FTE has no MDL LOD either.
//
// hl2_propdist 0 is the FIRST arm on purpose: it is the control, and it must reproduce
// 23fps on this new binary or the cvar has changed default behaviour and every other
// number here is suspect.
//
// Each arm gets a screenshot from the same position, because the whole question is how
// much scenery a given distance costs you, and that cannot be read off a framerate.

cfg_save_auto 0
log_name p193d
developer 0
scr_sshot_type png
cl_yieldcpu 0
cl_maxfps 0
vid_vsync 0
r_speeds 2
waitms 2500

echo "=== P193D hl2_propdist sweep, surf_demise start ==="
map surf_demise
waitmap 180
waitms 6000

echo "### DUMP propdist 0 (CONTROL -- must reproduce 23fps)"
hl2_propdist 0
setpos -12192 -3920 15128 0 0 0
wait 300
r_speeds_dump
wait 10
screenshot_mega p193d_demise_dist0 1280 720

echo "### DUMP propdist 20000"
hl2_propdist 20000
setpos -12192 -3920 15128 0 0 0
wait 300
r_speeds_dump
wait 10
screenshot_mega p193d_demise_dist20000 1280 720

echo "### DUMP propdist 12000"
hl2_propdist 12000
setpos -12192 -3920 15128 0 0 0
wait 300
r_speeds_dump
wait 10
screenshot_mega p193d_demise_dist12000 1280 720

echo "### DUMP propdist 8000"
hl2_propdist 8000
setpos -12192 -3920 15128 0 0 0
wait 300
r_speeds_dump
wait 10
screenshot_mega p193d_demise_dist8000 1280 720

echo "### DUMP propdist 4000"
hl2_propdist 4000
setpos -12192 -3920 15128 0 0 0
wait 300
r_speeds_dump
wait 10
screenshot_mega p193d_demise_dist4000 1280 720

// and a second viewpoint down in the cave, in open air this time -- the earlier
// 7223 -6287 4763 came from a shader_here dump, which reports the TRACED SURFACE
// point, so it buried the camera in a rock face.  This one is 100 units above a
// prop that the collision test proved the player can stand on.
echo "### DUMP cave propdist 0"
hl2_propdist 0
setpos 9152 -4800 7906 0 90 0
wait 300
r_speeds_dump
wait 10
screenshot_mega p193d_cave_dist0 1280 720

echo "### DUMP cave propdist 8000"
hl2_propdist 8000
setpos 9152 -4800 7906 0 90 0
wait 300
r_speeds_dump
wait 10
screenshot_mega p193d_cave_dist8000 1280 720

hl2_propdist 0
echo "=== P193D DONE ==="
waitms 1500
quit
