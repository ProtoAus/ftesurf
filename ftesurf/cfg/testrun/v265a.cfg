// V265A -- verify Patch 265 on the build that has it.
//
// Two independent fixes, two independent vantages on surf_boreas.
//
// FIX 1 (gl_warp.c, the forcedsky RDF_SKIPSKY branch now consults
// SKYMUSTBEMASKED).  At save009 the stock build drew hard-edged pale plates --
// the skyroom's cloud planes -- through solid rock, because the sky brush at
// y=6144 wrote depth ~880 units in front of the mountain and the mountain was
// depth-rejected.
//
//   A  save009, skyroom 1, r_sky_forcedepth 1 (stock)  -- plates must be GONE
//   B  save009, skyroom 0                              -- control for A
//   C  save009, skyroom 1, r_sky_forcedepth 2          -- plates must COME BACK
//
// C is the falsifier that matters.  2 means "always mask" and makes
// SKYMUSTBEMASKED true again, so it should reproduce the OLD picture exactly.
// If C looks like A, the branch is not the one doing the work and fix 1 is
// wrong about its own mechanism.  A-vs-B should be near the noise floor and
// A-vs-C should be large.
//
// FIX 2 (mod_vbsp.c, SURF_TRIGGER now maps to TI_NODRAW).  At save011 a
// screen-filling blue-grey panelled slab -- *29, func_dustmotes, 6 faces all
// TOOLS/TOOLSTRIGGER, flags 0x0440 -- covered the snow slope.
//
//   D  save011, skyroom 1  -- slab must be GONE, slope visible behind it
//
// The hl2_hidetools 0 control for D is in v265b.cfg and must be its own
// process: hl2_hidetools is CVAR_MAPLATCH, and `map x` twice does not reload.
//
// E is for the other session: does a face that has gone SURF_NODRAW still
// appear in Patch 264's shader_here candidate listing, or does it drop out?
// Either answer is fine, but it should be recorded rather than guessed.
//
// Probes trace from r_refdef.vieworg, a RENDER value, so every setpos needs a
// drawn frame after it -- 2500ms, per the harness rule.  Screenshots capture
// one frame behind, hence the throwaway shot before each real one.

log_enable 1
log_dir "logs"
log_name "v265a"
developer 1
log_developer 1
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 0
vid_fullscreen 0
con_notifytime 0
con_notifylines 0
con_notifytime_error 0

wait 200
echo ^5=== v265a: Patch 265 verification ===

map surf_boreas
waitmap 1800
waitms 9000
sv_cheats 1
waitms 300
noclip
waitms 300
developer 0
waitms 300

echo ^5========== A: save009, skyroom 1, forcedepth 1 (stock) ==========
setpos 10229.4 5262.8 14725.9 17.2046 139.3616 0
waitms 2500
vbsp_skyroom 1
r_sky_forcedepth 1
waitms 2500
screenshot v265a_x
waitms 800
screenshot v265a_a_009_fixed
waitms 800

echo ^5========== B: save009, skyroom 0 (control) ==========
vbsp_skyroom 0
waitms 2500
screenshot v265a_x
waitms 800
screenshot v265a_b_009_skyoff
waitms 800

echo ^5========== C: save009, skyroom 1, forcedepth 2 (old behaviour) ==========
vbsp_skyroom 1
r_sky_forcedepth 2
waitms 3000
screenshot v265a_x
waitms 800
screenshot v265a_c_009_fd2
waitms 800
r_sky_forcedepth 1
waitms 1000

echo ^5========== D: save011, skyroom 1 -- the func_dustmotes slab ==========
setpos 13826.6 -2739.2 12105.6 16.3367 163.2788 0
waitms 2500
screenshot v265a_x
waitms 800
screenshot v265a_d_011_noslab
waitms 800

echo ^5---------- E: what is under the crosshair at save011 now ----------
developer 1
waitms 300
shader_here p265_011
waitms 1000
developer 0
waitms 300

echo ^5========== F: save011 with r_drawentities 0 (was the old reveal) ==========
r_drawentities 0
waitms 2500
screenshot v265a_x
waitms 800
screenshot v265a_f_011_noents
waitms 800
r_drawentities 1
waitms 500

echo ^5=== v265a done ===
wait 30
quit
