// Patch 277(b) -- the cluster bound in VBSP_LoadLeafs and the bitofs[] bound in ClusterPVS/PHS.
// Two made fixtures (the library has no map that trips the clamp -- census, 1310 maps, 0 rewrites),
// their two untouched originals as controls, and one big vised map.
// developer stays ON: the pass/fail line is the developer-gated Patch 273
// "N of M leafs bucketed into K clusters" line, which the fixtures change and the controls must not.
log_enable 1
log_dir "logs"
log_name "p277b"
wait 200
developer 1
log_developer 1
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000
cl_maxfps 0
cl_idlefps 0
sv_cheats 1

echo ^5=== 1 p277_bad20 -- v20 (surf_protopede), leaf 96 -> 114 and leaf 255 -> 117 against a 114-cluster vis lump
map p277_bad20
waitmap 600
waitms 4000
vbsp_pvsstat
waitms 500

echo ^5=== 2 p277_bad25 -- v25 Strata (surf_testballs), leaf 11 -> -7 and leaf 42 -> 2147483647 against 17
map p277_bad25
waitmap 600
waitms 4000
vbsp_pvsstat
waitms 500

echo ^5=== 3 surf_protopede -- untouched original of fixture 1, control
map surf_protopede
waitmap 600
waitms 4000
vbsp_pvsstat
waitms 500

echo ^5=== 4 surf_testballs -- untouched original of fixture 2, control
map surf_testballs
waitmap 600
waitms 4000
vbsp_pvsstat
waitms 500

echo ^5=== 5 surf_tensor2 -- big vised map with a sky_camera, the Patch 273 baseline
map surf_tensor2
waitmap 600
waitms 7000
vbsp_pvsstat
waitms 500

echo ^5=== END OF RUN ===
waitms 500
quit
