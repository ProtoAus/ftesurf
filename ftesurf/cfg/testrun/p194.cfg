// FTESurf Patch 194: linked_portal_door.
//
// Two things to prove, and the second is the one that matters.
//
// 1. The load-time count.  surf_kitsune must report 18 portal doors, and a map
//    with none (bhop_aberrant) must print no line at all.  Predicted from the
//    entity lumps BEFORE this run, the same way Patch 191's target-case counts
//    were: kitsune 18, kitsune2 30, tripportals 116, aberrant 0.
//
// 2. That crossing one actually arrives at its partner.  kitsune's pairs, read
//    from its entity lump:
//       portal_s3_exit  at -11264 -10504 -2024  ->  portal_s4_entry at -8192 -15352 -2856
//       portal_s4_exit  at  -8192  -8552 -4232  ->  portal_s5_entry at -5120 -15352 -5320
//    So: setpos into the first, drop out of noclip so the player moves and the
//    trigger fires, then print where they ended up.  `viewpos` prints the current
//    position in setpos's own argument order, so the answer lands in the log as
//    text and can be compared against the partner's origin arithmetically rather
//    than by eye.  (Build 24 gave the read half its own name; it used to be the
//    no-argument form of setpos.)
//
// The re-entry guard is on trial here too: arriving inside the partner's own
// volume must NOT bounce the player straight back, so a correct result is "near
// the partner", not "back where I started".

cfg_save_auto 0
log_name p194
developer 1
waitms 2500

echo "=== P194 linked_portal_door ==="

echo "### MAP bhop_aberrant (control -- expect NO portal doors line)"
map bhop_aberrant
waitmap 180
waitms 4000

echo "### MAP surf_kitsune (expect: portal doors: 18 linked)"
map surf_kitsune
waitmap 180
waitms 6000
sv_cheats 1

echo "### CROSS 1: into portal_s3_exit at -11264 -10504 -2024"
echo "### EXPECT to arrive near portal_s4_entry at -8192 -15352 -2856"
setpos -11264 -10504 -2024 0 0 0
noclip
wait 60
echo "### ARRIVED-1:"
viewpos
wait 10

echo "### CROSS 2: into portal_s4_exit at -8192 -8552 -4232"
echo "### EXPECT to arrive near portal_s5_entry at -5120 -15352 -5320"
setpos -8192 -8552 -4232 0 0 0
noclip
wait 60
echo "### ARRIVED-2:"
viewpos
wait 10

echo "### MAP surf_kitsune2 (expect: portal doors: 30 linked)"
map surf_kitsune2
waitmap 180
waitms 6000

echo "### MAP surf_tripportals (expect: 116 linked, 14 of them startactive 0)"
map surf_tripportals
waitmap 180
waitms 6000

echo "=== P194 DONE ==="
waitms 1500
quit
