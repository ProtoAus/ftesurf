// FTESurf Patch 196, run C -- p196b was not a fair control, so this is.
//
// p196b predicted a crash from a populated <gamedir>_downloads with fs_assetcache 0, and
// got a CLEAN EXIT.  Written down rather than quietly dropped, because the prediction
// being wrong is informative: it means "an SPF_ADDON directory searchpath that contains
// files" is NOT sufficient on its own.
//
// And p196b had a second difference from p196a that I did not control for: it loaded ONE
// map.  p196a loaded THREE.  That matters, because the poison this crash needs is the
// dangling buckets left behind when a TEMPORARY pack is freed -- COM_FlushTempoaryPacks
// (fs.c:3972) calls FS_FlushFSHashFull, which by its own comment only sets com_fschanged
// and leaves the freed pack's buckets linked in filesystemhash.  A session's FIRST map has
// no previous map, so COM_FlushTempoaryPacks finds no temporary pack, and per Finding 1 of
// Workstream B it does not even set the flag.  One map load can therefore never poison the
// hash; two can.
//
// So this run is p196a with exactly one variable changed: fs_assetcache 0.  Same three map
// loads, same automount mount/drop/remount of TF2, ftesurf_cache left populated but
// unmounted (P186's own "clean" arm), and the 64 probe files still sitting in
// ftesurf_downloads so the reload still has an addon directory with content to hash.
//
// PREDICTION, again written before the run: this crashes, at the same address, with
// VFSW32_BuildHash walking ftesurf_downloads instead of ftesurf_cache.  If it does, the
// bug is the general one -- FS_AddPathHandle:4596 writes into the name hash without
// checking com_fschanged, the one flag that says the hash may contain freed pointers --
// and P186 is not its cause.  If it exits clean, the cache is doing something specific and
// I have to go and find out what.

cfg_save_auto 0
log_name p196c
developer 0
fs_assetcache 0
fs_loadstats 1
fs_automount 1
fs_autounmount 1
waitms 4000

echo "=== P196C: three maps, cache OFF, downloads populated ==="
fs_cache_info
map surf_utopia
waitmap 180
waitms 10000
map bhop_aberrant
waitmap 180
waitms 8000
map surf_utopia
waitmap 180
waitms 10000
echo "=== P196C: quitting ==="
waitms 2000
quit
