cfg_save_auto 0

// ===========================================================================
// BUILD 64, ARM SET C -- the whole of arm set A, re-run on the FIXED build.
//
// WHY THIS EXISTS RATHER THAN RE-READING b64a_sound.log.  Arm set A ran on the
// build whose radius conversion was wrong, and arm set B fixed the conversion
// but only covered the four maps that HAVE a falloff to check.  So neither log
// is a current, complete picture: A is stale and B is partial.  This is the
// same eight maps as A, on the build B verified, so one file answers "what
// does the sound layer do on this build" without cross-referencing two runs.
//
// It is also the restore arm for the whole feature.  The classification counts
// (static / dynamic / soundscript) MUST NOT have moved between A and C -- the
// fix changed only how far a sound carries, not which bucket it lands in.  If
// a bucket count moves here, the attenuation fix reached something it should
// not have.
//
// PRE-REGISTERED.  Every number below is carried over from arm set A's ACTUAL
// results (the classification, which was right) and arm set B's ACTUAL results
// (the falloff, which was verified), so this asserts equality with two
// measured runs rather than against a fresh prediction:
//
//   ARM  map                  sound line                    widest ambient
//   V1   kz_secret_temple     77 static, 6 dyn, 6 loops     attn 1.250, ~800
//   V2   surf_era             0 static, 163 dyn, SEE BELOW  attn 0.465, ~2150
//   V3   bhop_floodwaters     0/0, + 73 soundscript yellow  NO LINE
//   V4   surf_lt_unicorn      24 static, 55 dyn, 0 loops    attn 0.625, ~1600
//   V5   surf_kitsune         0 static, 1 dyn, 0 loops      NO LINE
//   V6   bhop_miku_v2         0 static, 12 dyn, 0 loops     NO LINE
//   V7   surf_halloween_tf2   0 static, 280 dyn, 269 loops  attn 0.541, ~1850
//   V8   kz_secret_temple     identical to V1               identical to V1
//
// V2's LOOP COUNT IS DELIBERATELY NOT PRE-REGISTERED, and that is a finding
// from arm set B rather than a hedge.  surf_era carries ten logic_timers, six
// of them named ducksound1timer..ducksound8timer with RefireTime 10, 13, 16,
// 20 and 30 seconds, and every one fires both StopSound AND PlaySound at
// ambient_generic.  Its loop count therefore OSCILLATES: arm A snapshotted 62,
// arm B snapshotted 56, and the delivered-input count beside it moved 3 -> 11,
// which is what proved the difference was time rather than code.  Anything in
// roughly the 50s-60s is consistent; a 0 or a 163 would not be.  Its
// ATTENUATION is a map property and IS pre-registered.
//
// THE THREE "NO LINE" ARMS ARE NEGATIVE CONTROLS.  bhop_floodwaters has 73
// ambients and every one names a soundscript rather than a file;
// surf_kitsune's single ambient and all twelve of bhop_miku_v2's are
// SF_AMBIENT_EVERYWHERE, i.e. ATTN_NONE, which is excluded from the
// widest-carry figure on purpose -- it is not a falloff, it is "play
// everywhere", and averaging it in would hide the thing that number exists to
// show.  If any of the three prints a widest-ambient line, the exclusion is
// wrong.
//
// V6 ALSO GUARDS BUILD 63: bhop_miku_v2 must still load and still name the
// per-entity output ceiling in red.  Adding a subsystem must not re-break the
// map build 63 made loadable.
//
// `volume 0` IS SET BELOW AND IS NOT OPTIONAL.  The first run of this feature
// went to a person's speakers at full volume.  This run reads numbers out of a
// log; it has no reason to make a sound and every reason not to.  Hearing it
// is a separate, deliberate act on a build whose numbers already check out.
// ---------------------------------------------------------------------------
// RESULTS, 2026-09-13.  logs/b64c_verify.log.  qwprogs.dat 1114898.
//
//   ARM  map                  sound line                     widest ambient
//   V1   kz_secret_temple     77 static, 6 dyn, 6 loops      1.250, ~800    ok
//   V2   surf_era             0 static, 163 dyn, 62 loops    0.465, ~2150   ok
//   V3   bhop_floodwaters     0/0 + 73 soundscript yellow    (none)         ok
//   V4   surf_lt_unicorn      24 static, 55 dyn, 0 loops     0.625, ~1600   ok
//   V5   surf_kitsune         0 static, 1 dyn, 0 loops       (none)         ok
//   V6   bhop_miku_v2         0 static, 12 dyn, 0 loops      (none)         ok
//   V7   surf_halloween_tf2   0 static, 280 dyn, 269 loops   0.541, ~1850   ok
//   V8   kz_secret_temple     identical to V1                identical      ok
//
// EIGHT OF EIGHT, including all three negative controls: bhop_floodwaters,
// surf_kitsune and bhop_miku_v2 each printed NO widest-ambient line, so
// ATTN_NONE really is excluded rather than silently reported as zero.
//
// NO CLASSIFICATION COUNT MOVED between arm set A and this run.  77/6, 0/163,
// 0/0/73, 24/55, 0/1, 0/12, 0/280 are identical on both builds.  That is the
// assertion this arm set exists for: the attenuation fix changed how far a
// sound carries and touched nothing about which bucket it lands in.
//
// BUILD 63 IS INTACT UNDERNEATH: V5 still reports 28 reference(s) repaired /
// 50 output(s) wired, and V6 still loads bhop_miku_v2, wires 4194 and refuses
// 412270 over the per-entity ceiling.
//
// ---------------------------------------------------------------------------
// V2 CONFIRMS THE surf_era OSCILLATION OUTRIGHT, and this is the best result
// in the file because it converts an inference into a measurement.
//
// Arm set B found surf_era reporting 56 loops where A reported 62, and argued
// from the delivered-input count beside it (3 in A, 11 in B) that the cause
// was elapsed time rather than code -- six ducksound timers firing StopSound
// and PlaySound on 10/13/16/20/30 second cycles.  That was an inference from
// one pair of numbers.
//
// This run landed on 3 input(s) delivered, the same as arm A -- and reported
// 62 loops, the same as arm A.  So across three runs:
//
//      run      delivered    loops playing
//      A                3               62
//      B               11               56
//      C                3               62
//
// The loop count is a deterministic function of how many inputs have been
// delivered, and returns to exactly 62 when the delivery count does.  There is
// no nondeterminism in the sound layer; there are six timers in the map.
// ---------------------------------------------------------------------------
// PROVENANCE, because this is a shared tree and a result has to be
// attributable.  qwprogs.dat here is 1114898 and the build this session made
// was 1112726 -- a peer session rebuilt at 12:14 while working on its own
// Build 64 (the leaderboard).  That rebuild compiled the server sources as
// they stood, which were last written at 05:45 by this session, so the sound
// code under test is this session's as written.  `git diff --stat` over
// src/server, src/defs and src/shared is +687 insertions across exactly four
// files -- sv_entities.qc 638, sv_player.qc 21, sv_main.qc 15, sv_defs.qc 13
// -- all of them this work.  THE PEER TOUCHED NO SERVER FILE.
//
// The stronger attribution is that every number asserted above was computed
// OFFLINE from the maps' own entity lumps, in Python, with no engine in the
// path (scratchpad/sndarms.py and attnpred.py).  A match between a prediction
// derived from the BSP and a number printed by the game is not something a
// peer's client-side changes could manufacture.
// ---------------------------------------------------------------------------
// ===========================================================================

log_enable 1
log_dir logs
log_name b64c_verify
developer 1
log_developer 1
cl_maxfps 100
con_notifylines 0

// See the header.  Muted before the first map, not after it.
