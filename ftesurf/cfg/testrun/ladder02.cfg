// LADDER02 -- Patch 260: the one interaction that could TRAP a player.
//
// FIRST ATTEMPT OVERSHOT: 1.2s at 200 u/s is 240 units against a 188-unit
// ladder, so every sub-test topped out and stood on the ledge at z 3968 -- it
// measured a normal jump from ground, again.  500ms is ~95 units, mid-ladder.
//
// ladder01's B4 jumped at the TOP of the climb, where the player has already
// stepped onto the ledge and is on ground -- so it measured a normal jump, not
// a ladder dismount, and z moved 0.02.  That is an inconclusive sub-test, not a
// passing one.  This jumps MID-CLIMB, which is the case that matters: if the
// jump does not detach, the player is stuck on the ladder with no way off, which
// is worse than ladders not working at all.
//
// Expected: velocity is REPLACED by plane.normal*270 (not added to), the player
// leaves the rungs travelling away from the wall, and gravity resumes -- so z
// should FALL back toward the floor and y should end up further from the ladder
// than it started.  The ladder face is at y=-4164 with the player south of it,
// so its normal points -y and the dismount should carry the player toward more
// negative y.
//
// Also tests the reverse trap: releasing all keys mid-climb must HANG (velocity
// zeroed outright, no friction, no gravity), not slide down.

log_enable 1
log_dir "logs"
log_name "ladder02"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
con_notifylines 0
developer 1
log_developer 1

wait 200
map bhop_monster_jam
waitmap 1800
waitms 8000
sv_cheats 1
waitms 400
pm_dispprobe 0
pm_ladderprobe 0
pm_ladders 1
waitms 300

echo ^5=== J1: climb 1.2s then JUMP mid-ladder ===
setpos 6656 -4186 3780 0 90 0
waitms 1200
+forward
waitms 500
cmd run_eyeinfo
-forward
waitms 100
+jump
waitms 200
-jump
waitms 1500
cmd run_eyeinfo
waitms 1000

echo ^5=== J2: same, repeated ===
setpos 6656 -4186 3780 0 90 0
waitms 1200
+forward
waitms 500
cmd run_eyeinfo
-forward
waitms 100
+jump
waitms 200
-jump
waitms 1500
cmd run_eyeinfo
waitms 1000

echo ^5=== H1: climb 1.2s then RELEASE everything -- must hang, not slide ===
setpos 6656 -4186 3780 0 90 0
waitms 1200
+forward
waitms 500
-forward
waitms 200
cmd run_eyeinfo
waitms 2000
cmd run_eyeinfo
waitms 2000
cmd run_eyeinfo
waitms 800

echo ^5=== ladder02 done ===
pm_ladders 0
wait 30
quit
