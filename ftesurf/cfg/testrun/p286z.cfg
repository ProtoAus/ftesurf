// FTESurf p286z -- the four fixes, after the -Full build that carries patch 288.
//
// EVERY ARM HAS A SAME-SETTING CONTROL AT THE SAME VANTAGE.  p286v read 12.5%
// of the frame differing between hl2_twoframes 1 and 0 and that was entirely the
// shield's own scroll and its 1.08s alpha sine; the control at the same vantage
// read the same number.  A difference is only a result when it is bigger than
// the noise floor measured beside it.
//
// WHAT IS BEING CHECKED, and what would count as a failure:
//
//  1  env_lightglow now DRAWS.  The fade-advance loop in Sprite_Glare gated on
//     `spr_kind != SPRK_BILLBOARD`, which excludes every SPRK_GLOW, so all 166
//     were traced, answered correctly, and then had spr_glare pinned at 0.
//     PASS: vbsp_lightglow 1 vs 0 moves far more of the frame than the control,
//           and vbsp_sprite_debug reports a non-zero `glare N in frame` with
//           most of them NOT hidden.
//     FAIL: still inside the control -- then the ramp was not the only gate.
//
//  2  THE FLIPBOOK, with a switch that actually switches.  hl2_twoframes is a
//     plugin cvar and its flags are masked to `flags&1` on the way through
//     Plug_Cvar_GetNVFDG, so CVAR_SHADERSYSTEM never reaches Cvar_Get2 and
//     setting it triggered no shader reload at all.  It is now ALSO a live
//     !!cvarf uniform that pins the layer to 0, so the two arms are one command
//     apart with the map still loaded.
//     PASS: 1 vs 0 exceeds the control, and the web is visibly denser at 1.
//
//  3  COLOUR CORRECTION (patch 288), which has never been on screen.  Two LUTs
//     at .25 and .15, so a 40% blend -- surf_tensor2 is the GENTLEST graded map
//     in the library and 13 of the other 14 grade at weight 1.0.  Also live.
//     PASS: whites move toward (203,217,250), shadows crush, and the census
//           line reports 2 active.
//     FAIL: the whole screen paints one colour -- a missing .raw binding
//           missing_texture -- or nothing changes, which means the stage never
//           ran.  Both are visible in one picture.
//
//  4  THE INSPECTOR, both candidate causes in one run.  ent_view_solid 0 is
//     SOLID_BSPTRIGGER (the design) and 1 is SOLID_BBOX of the same extents;
//     ent_here now prints the table size, the live copy count and the trace
//     result on failure, so whichever arm misses says why.
//
// The ungraded wall shot at the end is the input to the ONE thing patch 288
// cannot answer on its own: Source applies correction after tonemapping and FTE
// has no tonemapper, so the range reaching the LUT may not be Source's.  That
// picture is the FTE half of the comparison; the Momentum half is taken at the
// same setpos afterwards.
cfg_save_auto 0
exec cfg/testrun/_quiet.cfg
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "p286z"
scr_sshot_type png
cl_yieldcpu 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0

waitms 2500

map surf_tensor2
waitmap 240
waitms 8000
sv_cheats 1
noclip
waitms 500

echo "@@@ P286Z ---- state ----"
r_colourcorrection
hl2_colourcorrection
hl2_twoframes
vbsp_lightglow
waitms 800

// ------------------------------------------------- 1: env_lightglow
echo "@@@ P286Z lightglow A / A2 control / B"
vbsp_lightglow 1
waitms 1500
setpos -11776 -13000 13800 0 90 0
waitms 2500
screenshot_mega p286z_glow_a 1280 720
waitms 1200
screenshot_mega p286z_glow_a2 1280 720
waitms 1000
vbsp_sprite_debug 1
waitms 1000
vbsp_lightglow 0
waitms 1500
screenshot_mega p286z_glow_b 1280 720
waitms 1000
vbsp_lightglow 1
waitms 1200

// ------------------------------------------------- 3: colour correction
echo "@@@ P286Z colour correction A / A2 control / B, same vantage"
hl2_colourcorrection 1
waitms 1200
screenshot_mega p286z_cc_on 1280 720
waitms 1200
screenshot_mega p286z_cc_on2 1280 720
waitms 1200
hl2_colourcorrection 0
waitms 1200
screenshot_mega p286z_cc_off 1280 720
waitms 1200
hl2_colourcorrection 0.5
waitms 1200
screenshot_mega p286z_cc_half 1280 720
waitms 1000
hl2_colourcorrection 1
waitms 1000

// ------------------------------------------------- 2: the flipbook
echo "@@@ P286Z shield at 200 units: A / A2 control / B"
setpos -11776 -11020 13744 0 90 0
waitms 2000
hl2_twoframes 1
waitms 1200
screenshot_mega p286z_frames_a 1280 720
waitms 1200
screenshot_mega p286z_frames_a2 1280 720
waitms 1200
hl2_twoframes 0
waitms 1200
screenshot_mega p286z_frames_b 1280 720
waitms 1200
hl2_twoframes 1
waitms 1000

echo "@@@ P286Z shield at 70 units: A / A2 control / B"
setpos -11776 -10890 13744 0 90 0
waitms 2000
screenshot_mega p286z_f70_a 1280 720
waitms 1200
screenshot_mega p286z_f70_a2 1280 720
waitms 1200
hl2_twoframes 0
waitms 1200
screenshot_mega p286z_f70_b 1280 720
waitms 1200
hl2_twoframes 1
waitms 1000

// ------------------------------------------------- 4: the inspector, both arms
echo "@@@ P286Z ent_here with ent_view_solid 0 (SOLID_BSPTRIGGER)"
ent_view_solid 0
ent_reload
waitms 1200
setpos -11776 -11020 13744 0 90 0
waitms 1500
ent_here
waitms 1800

echo "@@@ P286Z ent_here with ent_view_solid 1 (SOLID_BBOX)"
ent_view_solid 1
ent_reload
waitms 1500
setpos -11776 -11020 13744 0 90 0
waitms 1500
ent_here
waitms 1800

echo "@@@ P286Z ent_view overlay with whichever arm worked"
ent_view 1
waitms 1500
screenshot_mega p286z_entview 1280 720
waitms 1000
ent_view 0
waitms 500

// ------------------------------------------------- the exposure reference
echo "@@@ P286Z ungraded wall for the Momentum comparison -- setpos is in the log"
hl2_colourcorrection 0
waitms 1500
setpos -11776 -13000 13800 0 90 0
waitms 2500
screenshot_mega p286z_expose_ftesurf_ungraded 1280 720
waitms 1200
hl2_colourcorrection 1
waitms 1200
screenshot_mega p286z_expose_ftesurf_graded 1280 720
waitms 1000

echo "@@@ P286Z DONE"
waitms 1200
quit
