// cfg_save_auto 0: this run sets archived cvars (vid_*, cl_maxfps); never let it write them into ftesurf.cfg (cl_main.c:2535)
cfg_save_auto 0
// em_boreas_a -- surf_boreas snow, arm A: vbsp_emit_ratemax 200 (build 49 behaviour).
log_dir "logs"
log_name "em_boreas_a"
log_enable 1
developer 1
log_developer 1
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000
cl_maxfps 0
cl_idlefps 0
cl_yieldcpu 0
sv_cheats 1
set vbsp_emit_ratemax 200
wait 200
map surf_boreas
waitmap 600
waitms 2000
noclip
// V2: inside the func_dustmotes brush *29 (9088..15232, -14080..14080, 10880..15488), 120 above its floor, looking along +y
setpos 12160 0 11000 -20 90 0
waitms 8000
echo ^5=== A V2 ratemax 200 steady state
emit_list
r_partinfo
screenshot em_boreas_a_v2_x
waitms 700
screenshot em_boreas_a_v2
waitms 700
screenshot em_boreas_a_v2_noise
waitms 700
// V1: the info_player_start, looking up at the brush (centre 12160 0 13184: yaw -31, pitch -60)
setpos 3584 5120 -4608 -60 -31 0
waitms 3000
echo ^5=== A V1 spawn
r_partinfo
screenshot em_boreas_a_v1_x
waitms 700
screenshot em_boreas_a_v1
waitms 700
screenshot em_boreas_a_v1_noise
waitms 500
// V3: inside the func_dustcloud (centre 9728 12160 192, radius 1507, DistMax 4096) -- the only vantage where BOTH emitters are in cull
setpos 9728 10000 200 0 90 0
waitms 8000
echo ^5=== A V3 both emitters in cull
emit_list
r_partinfo
screenshot em_boreas_a_v3_x
waitms 700
screenshot em_boreas_a_v3
waitms 700
quit
