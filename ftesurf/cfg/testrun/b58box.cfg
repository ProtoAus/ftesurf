// FTESurf b58box -- WHICH toggle removes the grey cell behind every glyph?
//
// THE BUG, confirmed from Lex's own two screenshots (boxbug.png = surf_tensor2,
// boxbug2.png = colin blaster, the map that works).  Magnified 12x, the tensor2
// FPS counter "100.0 FPS" shows a faint rectangle around EVERY character --
// same cell for '1' as for '.', visible seams between neighbours, and no box in
// the space between "0" and "F" because a space returns early.  The control
// frame at the same coordinates is clean.  It is the character CELL, not the
// letterform, so it is a quad being drawn, not antialiasing.
//
// WHY MY RIG NEVER REPRODUCED IT, which is what this config exists to fix.
// Measured on b58cc_on.png over ink-free columns only: elevation +0.03 across
// 1289 columns, flat row profile, no plateau.  The reason is the FONT PATH:
// every cfg in this directory sets con_notifylines 0 and never opens a console,
// so the only text my rig ever drew was the built-in 8px bitmap font at 1:1
// through Font_DrawChar.  Lex runs con_textfont GoogleMed.ttf at con_textsize
// 16 with hud_scale 2 -- the SCALED path, Font_DrawScaleChar, a different
// function with its own colour arithmetic.  cfg/default.cfg:919-924 documents
// that the atlas is built at exactly 8px (r_2d.c:1300) and rescaled at draw
// time.  So this config runs HIS font settings, not the rig's.
//
// THE INSTRUMENT IS THE FPS COUNTER, and deliberately not console text.
// SCR_DrawFPS draws through font_console (cl_screen.c:2110), so con_textfont
// and con_textsize reach it -- which is what makes arms F/G/H possible at all.
// With cl_maxfps 100 it reads "100.0 FPS" in every arm: identical glyphs, fixed
// position, nothing scrolling.  Console text was the instrument in b58cc and it
// measured its own scrolling (-85 luma of pure artefact), so it is suppressed
// here and the console is never opened.
//
// ALREADY EXCLUDED, do not re-test: the colour grade (he tested
// r_colourcorrection "" himself, and the 2D pass draws after GLR_RenderView
// pops the scene FBO at gl_rmain.c:3076), r_renderscale 1 vs 2 (he tested
// both), con_colour_back (that quad reads consolecolours[], not the cvar, so
// his test could not have moved it either way), the hl2/VTF asset path (closed
// with six citations by the concurrent session), r_font_linear bleed (he is set
// to 0), and FTE's missing-glyph placeholder (it is opaque white with red hex
// digits; his glyphs are legible with grey cells behind).
// Arms B and C are here anyway as CONTROLS, because an arm that changes nothing
// is what proves the rig is actually toggling something.
//
// PASS: exactly one arm removes the cells and A/A' brackets it with zero drift.
// FAIL: no arm removes them -- then it is not a map feature and not the font
//       size, and the next suspect is the atlas upload itself.
cfg_save_auto 0
exec cfg/testrun/_quiet.cfg
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "b58box"
scr_sshot_type png
cl_yieldcpu 0
vid_vsync 0
crosshair 0
fov 100

// The counter must read the same number in every arm, or the glyphs differ.
cl_maxfps 100

// No console text anywhere near the instrument.
con_notifylines 0
con_notifytime 0.01

waitms 2500
map surf_tensor2
waitmap 240
waitms 8000
sv_cheats 1
noclip
waitms 500

// HIS settings, not the rig's defaults.  This is the whole point.
con_textfont "gfx/fonts/GoogleMed.ttf"
con_textsize 16
hud_scale 2
r_renderscale 2
r_font_linear 0
show_fps 1

// His own worst vantage, recovered from run.view/run.rec -- a dark wall, which
// is the only background a faint additive cell is visible against.
setpos -10688.5 -1773.8 -8587.1 6.3 91.1 0
waitms 6000

echo "@@@ B58BOX A. baseline -- his configuration exactly"
waitms 1500
screenshot b58box_A_x
waitms 900
screenshot b58box_A
waitms 900
screenshot b58box_A_ctl
waitms 900

echo "@@@ B58BOX B. grade off -- CONTROL, expected no change"
r_colourcorrection ""
waitms 1500
screenshot b58box_B_x
waitms 900
screenshot b58box_B
waitms 900
r_colourcorrection "ftesurf/cc/surf_tensor2_ef3661e2"

echo "@@@ B58BOX C. renderscale 1 -- CONTROL, expected no change"
r_renderscale 1
waitms 2000
screenshot b58box_C_x
waitms 900
screenshot b58box_C
waitms 900
r_renderscale 2
waitms 1500

echo "@@@ B58BOX D. sprites off"
vbsp_sprites 0
waitms 1500
screenshot b58box_D_x
waitms 900
screenshot b58box_D
waitms 900
vbsp_sprites 1
vbsp_sprite_debug 2
waitms 1500

echo "@@@ B58BOX E. lightglows off"
vbsp_lightglow 0
waitms 1500
screenshot b58box_E_x
waitms 900
screenshot b58box_E
waitms 900
vbsp_lightglow 1
waitms 1000

// ---- the font path itself.  If any of these clears it, the map is innocent.
echo "@@@ B58BOX F. con_textsize 8 -- the atlas size, drawn 1:1"
con_textsize 8
waitms 1500
screenshot b58box_F_x
waitms 900
screenshot b58box_F
waitms 900

echo "@@@ B58BOX G. con_textsize 32 -- scaled harder"
con_textsize 32
waitms 1500
screenshot b58box_G_x
waitms 900
screenshot b58box_G
waitms 900

echo "@@@ B58BOX H. built-in font instead of the TTF"
con_textfont ""
con_textsize 16
waitms 1500
screenshot b58box_H_x
waitms 900
screenshot b58box_H
waitms 900

echo "@@@ B58BOX A2. back to baseline -- must match A"
con_textfont "gfx/fonts/GoogleMed.ttf"
con_textsize 16
waitms 2000
screenshot b58box_A2_x
waitms 900
screenshot b58box_A2
waitms 900

echo "@@@ B58BOX DONE"
waitms 1200
quit
