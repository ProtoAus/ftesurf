cfg_save_auto 0
// BUILD 77 / ENGINE PATCH 326 -- does the ranked input profile now see the GRANT?
//
// WHAT THIS IS FALSIFYING.  e1strafe.cfg measured a bypass that needs no lie from
// the client:
//
//     in_rawinput 0 ; in_restart ; in_rawinput 1
//
// in_win.c reads in_rawinput_mice ONLY inside INS_RawInput_Init, so after that
// sequence the cvar reads 1 while rawmicecount is 0.  INS_Accumulate's
// GetCursorPos/SetCursorPos fallback is live, injected SendInput motion lands in
// FULL (measured: 16,800 counts -> 232 degrees of view travel, against 0.022
// degrees with raw input genuinely bound), the P293 yaw identity holds EXACTLY
// over the injected motion, hidcheck calls the file clean -- and the server
// reported `noprofile 0  would 0`.  The run ranked.
//
// Patch 326 publishes the grant as the read-only cvar `in_rawmice`; build 77
// carries it as field 7 of `inprof` and FS_ProfileBroken faults a grant of
// exactly 0.  This asks the server whether that worked.
//
// NO INJECTION AND NO WINDOW FOCUS.  Three of four E1 runs failed in the shape of
// a clean pass because the harness never got focus or never synthesized anything;
// this arm asks the server a question and reads its answer, so there is no silent
// way for it to look like it worked.
//
// PRE-REGISTERED, and arm A is the one that makes the rest mean anything:
//
//   A  CONTROL.  Raw input genuinely bound.  The key must read version 2, have 15
//      (RAW|FILTER|ACCEL|GRANT), and a POSITIVE last field -- this machine
//      enumerates 2 mice.  `would 0`.  Without this arm a `would 1` below could
//      just as well mean the new test fires on everybody.
//
//   B  THE BYPASS.  The exact sequence above.  The cvar ends back at 1, so the
//      standing profile is indistinguishable from arm A's except in the grant,
//      which moves 2 -> 0.  MUST report `would 1`.  This is the whole patch.
//
//      IT DOES NOT TEST THE CACHE, and the first draft of this file claimed it
//      did.  Rec_ProfileReport sends on change, and this arm drives in_rawinput
//      through 0 and back, so `raw` misses the cache twice all by itself; the key
//      would have been resent even if `grant` had been added to the grammar and
//      left out of the cached compare.  Arm C is where that is actually decided.
//
//   C  RECOVERY, AND THE CACHE.  in_restart with the cvar ALREADY at 1 -- no cvar
//      is set in this arm at all.  Grant returns to 2, and `would 0`.
//
//      So between B and C the only field of the key that can move is the grant:
//      have, in_rawinput, m_filter, m_accel and bad are all identical across the
//      two readings.  If `grant` were missing from the cached compare in
//      Rec_ProfileReport, this arm would find every compared field unchanged,
//      skip the send, and leave arm B's `... 0` standing on the server forever.
//      The player who had just FIXED their input would stay demoted for the rest
//      of the session with nothing on screen to say why -- which is the failure
//      direction this whole bit is written to avoid.  A `would 1` here with a
//      stale `key "2 15 1 0 0 1 0"` is that bug and nothing else.
//
//      A grant that moves with no cvar touched at all is not exotic: unplugging
//      the mouse, an RDP session toggling in_rawinput_rdp, or a
//      RegisterRawInputDevices that simply refuses all do it. None of those are
//      scriptable from a config, and this arm is the one that stands in for them.
//
//   D  V1 CLEAN.  setinfo inprof "1 7 1 0 0 0" -- the build-72..76 grammar, six
//      fields, no grant.  MUST report `would 0`: unknown grant, and unknown is
//      rankable.
//
//   E  V1 DIRTY.  setinfo inprof "1 7 1 1 0 0" -- the same old grammar with
//      m_filter 1.  MUST report `would 1`.  THIS IS THE REGRESSION ARM.  If the
//      version bump had refused v1 outright, every client in the field would read
//      as "unknown, therefore rankable" and the server would silently stop
//      checking m_filter and m_accel for the entire fleet until a release archive
//      reached players -- a patch that closes one hole by opening three.  A
//      `would 0` here is that failure.
//
//   F  UNKNOWN GRANT.  setinfo inprof "2 15 1 0 0 0 -1" -- a backend that does not
//      report the figure.  MUST report `would 0`.  -1 IS NOT 0: collapsing them
//      would demote every non-Windows player the moment their engine gained the
//      cvar.
//
//   G  THE HONEST LIMIT.  Raw input is left OFF at the engine while the key claims
//      a grant of 2: setinfo inprof "2 15 1 0 0 0 2".  `would 0`, and that is not
//      a defect -- it is this layer's stated boundary.  What the patch changes is
//      that the bypass now requires SAYING something false; arm D above is the
//      cheaper way to say it.  It does NOT raise the threat class: a forged key
//      is one console line, not a patched client.  (The first draft of this file
//      claimed "T2 becomes T4" here.  Arm D refutes it, in this same run.)
//
//   H  A FUTURE GRAMMAR.  setinfo inprof "3 15 1 0 0 0 0" -- version 3, which this
//      build does not know.  MUST report `would 0`.  A reader that guessed at an
//      unknown grammar would be reading field 3 of a future key as m_filter.
//
// FALSIFIED IF arm A reports would 1 (the check fires on honest play and nothing
// below means anything), or arm B reports would 0 (the bypass is still open), or
// arm E reports would 0 (the version bump broke the checks it was extending).

exec cfg/testrun/_quiet.cfg

developer 1
log_developer 1
log_enable 1
log_dir logs
log_name b77grant
cl_maxfps 100
sv_cheats 0
con_notifylines 0
con_notifytime 0.01

// Pin the three the profile reads, so a stray archived value cannot make an arm
// fault for a reason this file is not testing.
m_filter 0
m_accel 0

wait 200
map bhop_eazy
waitmap 600
waitms 5000

echo ^5=== B77 ARM A: CONTROL, raw input genuinely bound.  Expect have 15, grant > 0, would 0.
in_rawinput 1
in_restart
waitms 2500
cmd timer
waitms 1500

echo ^5=== B77 ARM B: THE BYPASS -- cvar back to 1 without re-enumerating.  Expect grant 0, would 1.
in_rawinput 0
in_restart
waitms 1500
in_rawinput 1
waitms 2500
cmd timer
waitms 1500

echo ^5=== B77 ARM C: RECOVERY -- in_restart with the cvar at 1.  Expect grant > 0, would 0.
in_restart
waitms 2500
cmd timer
waitms 1500

echo ^5=== B77 ARM D: V1 CLEAN, the old six-field grammar.  Expect would 0.
setinfo inprof "1 7 1 0 0 0"
waitms 2000
cmd timer
waitms 1500

echo ^5=== B77 ARM E: V1 DIRTY, old grammar with m_filter 1.  Expect would 1.
setinfo inprof "1 7 1 1 0 0"
waitms 2000
cmd timer
waitms 1500

echo ^5=== B77 ARM F: UNKNOWN GRANT (-1), a backend that does not report.  Expect would 0.
setinfo inprof "2 15 1 0 0 0 -1"
waitms 2000
cmd timer
waitms 1500

echo ^5=== B77 ARM G: THE HONEST LIMIT -- a forged grant over a real fallback.  Expect would 0.
setinfo inprof "2 15 1 0 0 0 2"
waitms 2000
cmd timer
waitms 1500

echo ^5=== B77 ARM H: A FUTURE GRAMMAR, version 3.  Expect would 0.
setinfo inprof "3 15 1 0 0 0 0"
waitms 2000
cmd timer
waitms 1500

echo ^5=== END OF RUN ===
waitms 1000
quit

// ============================================================================
// MEASURED 2026-09-14, one process, one map load, engine Patch 326 + QC build 77.
// Every arm met its pre-registered expectation.
//
//   arm  key                        would   expected
//   A    "2 15 1 0 0 0 2"             0       0   CONTROL
//   B    "2 15 1 0 0 1 0"             1       1   THE BYPASS
//   C    "2 15 1 0 0 1 2"             0       0   RECOVERY + CACHE
//   D    "1 7 1 0 0 0"                0       0   v1 clean
//   E    "1 7 1 1 0 0"                1       1   v1 STILL CHECKED
//   F    "2 15 1 0 0 0 -1"            0       0   unknown grant
//   G    "2 15 1 0 0 0 2"             0       0   forged, the honest limit
//   H    "3 15 1 0 0 0 0"             0       0   unknown grammar
//
// ARM A IS WHAT MAKES ARM B READABLE.  `have` reads 15, so all four cvars exist
// on this client and all four arms of FS_ProfileBroken are live rather than
// skipped past a clear mask bit; the grant reads 2, which is the number of mice
// this machine enumerates and the same number E1's arm A measured. A run under
// honest raw input still ranks.
//
// ARM B IS THE FINDING.  Fields 1-5 are character-for-character arm A's.  The
// only difference a server could ever have seen before build 77 is the `bad`
// counter, and that counter is incidental here -- it stepped because the
// sequence passes THROUGH in_rawinput 0, not because of the state it lands in.
// A bypass that set the grant to zero without transiting a watched cvar would
// have left every visible field identical. Now the grant is visible and the run
// does not rank.
//
// ARM C CARRIES TWO RESULTS AND THE SECOND WAS NOT PLANNED.  The intended one is
// that the bit is not sticky.  The one worth keeping is that B -> C is a
// grant-only transition -- no cvar is set in arm C -- so it is the only arm here
// that can falsify the cached compare in Rec_ProfileReport, and it falsifies it
// in the direction that matters: a stale clean-to-dirty key under-reports a
// cheat, but a stale dirty-to-clean key DEMOTES AN HONEST PLAYER WHO HAS ALREADY
// FIXED THE PROBLEM, silently, for the rest of their session.
//
// ARM E IS THE ONE A VERSION BUMP USUALLY GETS WRONG.  `1 7 1 1 0 0` is a
// build-72..76 client with m_filter on, and it reports would 1: the old grammar
// is still READ rather than merely tolerated.  Had FS_ProfileFields refused
// anything but version 2, this arm would read would 0 and so would every player
// in the field until a release archive reached them -- the server half of a
// patch deploys in minutes, the client half does not. That is the b73live skew
// lesson applied before the fact instead of after.
//
// ARMS D AND G TOGETHER ARE THE HONEST LIMIT, AND THEY CORRECT THIS FILE'S OWN
// FIRST CLAIM.  The draft said arm G moved the attack "from T2 to T4".  It does
// not, and arm D is the proof sitting four lines above it: `setinfo inprof
// "1 7 1 0 0 0"` is ONE CONSOLE LINE, it is accepted as a known grammar forever,
// its grant is the unknown -1, and the new clause cannot fire.  Nothing there
// needs a patched client.
//
// Nor was the class any different before build 77 -- e1prof.cfg measured that a
// forged `have` mask defeats all three original clauses from the console, and it
// still does.  The key is userinfo; it has always been assertable.
//
// What genuinely changed is narrower and is still the point: the route that
// needed NO LIE is gone.  Before, a player typed two ordinary commands, the
// client told the truth about every field it had, and the run ranked.  Now every
// remaining route requires a false statement.  Raising the PRICE of a false
// statement above one console line is a different problem -- CSQC cannot
// currently tell that the server's copy of the key is not the one it sent -- and
// this patch does not solve it.
//
// BUILD 78 SOLVED IT, AND NOT BY DEFENDING THE KEY.  b78event.cfg re-runs arms
// D and G of this file verbatim; both now read would 1.  The answer was that a
// userinfo key is a thing the PLAYER sets, so no field could ever have fixed it
// -- the decision moved onto sendevent, which arrives as clcfte_qcrequest and
// which a console cannot produce.  Everything measured in THIS file still
// stands: the grant is still the fact that makes the bypass visible, and build
// 78 only changed which copy of it the server believes.
//
// WHAT THIS DOES NOT MEASURE, stated so a later reader does not assume it did:
// no injection was performed in this run at all.  That injection actually lands
// through the legacy path, and at what magnitude, is e1strafe.cfg's measurement
// (arms C and D); this file only asks whether the server can now SEE the state
// that made it possible.
// ============================================================================
