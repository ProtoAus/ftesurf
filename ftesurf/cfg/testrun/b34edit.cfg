// BUILD 34 -- does the layout editor LIST the new element?
//
// HE_MAX was exactly 10 with exactly 10 HE_Add rows, so an eleventh would have
// been dropped on the floor by HE_Add's own bounds check and the panel would
// simply not have shown it -- silently, which is the failure worth a screenshot.
// It is 12 now; this is the check that the row survived.

log_enable 1
log_dir "logs"
log_name "b34edit"
cfg_save_auto 0
vid_fullscreen 0
scr_sshot_type png

wait 200
map surf_null
waitmap 400
waitms 3000

hud_edit
waitms 2000
screenshot b34_edit_panel
waitms 1500

hud_edit
waitms 500

echo ""
echo "=== b34edit done ==="
wait 20
quit
