// Patch 207 -- the stale-lump window, tested directly.
//
// tripportals (116 doors) -> demise (none) is the transition that exposed it:
// serverkey("map") flips to surf_demise while the entity lump is still
// tripportals', so the loader built 116 phantom apertures on a map with no
// portal doors and took it from ~30 fps to 11.  Expected now: demise reports
// the stale read once, then "lump changed under us" and a silent reload.
cfg_save_auto 0
developer 1
log_developer 1
cl_yieldcpu 0
cl_maxfps 0
vid_vsync 0
r_speeds 2
con_notifytime 0
waitms 2500
map surf_tripportals
waitmap 240
waitms 5000
echo "### STALE tripportals loaded"
wait 200
r_speeds_dump
wait 10
map surf_demise
waitmap 240
waitms 8000
echo "### STALE demise loaded"
wait 200
r_speeds_dump
wait 10
echo "### STALE DONE"
waitms 500
quit
