// H6 -- WHAT IS THE RAINBOW?
//
// Everything so far says the far side of a portal draws its near geometry correctly
// (stage 1's red neon grid floor comes through) and loses the big coloured surfaces.
// r_novis 1 changed the frame by ZERO pixels, so it is not PVS culling.  So the
// question is what those coloured surfaces actually are, because that decides where
// the fix goes and the candidates need completely different work:
//
//   * the map declares skyname "blacksky" -- a BLACK 2D sky -- and also carries a
//     sky_camera at -8192 -4096 0 scale 16, which FTE renders as a SKYROOM.
//     R_DrawSkyroom (gl_warp.c:339) returns false the moment r_fastsky is set.
//   * CUSTOM/RAINBOWSCROLL is a real world material in this map's texdata.
//
// So: stand where the rainbow fills the frame and toggle r_fastsky.
//
//   rainbow VANISHES under r_fastsky 1 -> it is the SKYROOM, and the bug is that the
//                                         skyroom is not surviving portal recursion
//   rainbow UNCHANGED under r_fastsky 1 -> it is ordinary world brushwork wearing
//                                         CUSTOM/RAINBOWSCROLL, and the bug is in
//                                         how that material is shaded in a recursed
//                                         view
//
// Arm 3 restores r_fastsky 0 as the control: if it does not return to arm 1, the
// toggle is not what moved the picture and nothing here can be believed.
//
// The walk-through sequence is copied verbatim from h3, which is the one that
// provably landed in the rainbow room (h3_crossed, timer 0:02.835, centre
// brightness 95.4 / saturation 0.755).  setpos into stage 1 is deliberately NOT
// used -- h4 showed it lands in trigger_teleport volumes and the player ends up
// somewhere else entirely.

cfg_save_auto 0
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "h6"
scr_sshot_type png
cl_yieldcpu 0
cl_maxfps 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0
r_voidvis 1
vbsp_portal_render 1
r_fastsky 0

waitms 2500
map surf_kitsune
waitmap 240
waitms 8000
sv_cheats 1

echo "@@@ H6 walk the hub door into stage 1"
setpos 0 -700 184 0 90 0
waitms 2000
+forward
waitms 1400
-forward
waitms 2500
screenshot_mega h6_room_sky0 1280 720
waitms 600

echo "@@@ H6 same camera, r_fastsky 1 (skyroom disabled)"
r_fastsky 1
waitms 2500
screenshot_mega h6_room_sky1 1280 720
waitms 600

echo "@@@ H6 back to r_fastsky 0 (control)"
r_fastsky 0
waitms 2500
screenshot_mega h6_room_sky0b 1280 720
waitms 600

echo "@@@ H6 DONE"
waitms 1000
quit
