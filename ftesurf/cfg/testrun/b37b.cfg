// BUILD 37b -- bhop_futile: the filter, in BOTH directions.
//
// FROM THE MAP'S OWN ENTITY LUMP.  Block 1 is ordinary world brush with its top
// at z = 8432, and it carries two stacked brush entities:
//
//   trigger_multiple *9   x 5088..5728  y 1648..1904  OnEndTouch
//                         "!activator,AddOutput,targetname block2,0,-1"
//   trigger_teleport *10  same volume   target start  filtername block1filter
//   filter_activator_name block1filter  filtername block2  Negated 0
//
// So block1filter passes an activator NAMED "block2", and you only become
// "block2" by LEAVING block 1.  That is the map's anti-backtrack: arriving
// unnamed you are left alone, returning after you have moved on you are reset.
//
// All 38 of futile's outputs are COMMA-separated (arcane's 23 are ESC), which
// is why b37a and b37b together are the delimiter test.
//
// The user's save-lock save003 is at (5439.26, 1793.67, 8909.18), 477 units
// directly above block 1.  `start` is at (5408, 272, 11472) -- 1500 units away
// in y, so the two outcomes cannot be confused.
//
// THE SECOND HALF MATTERS AS MUCH AS THE FIRST.  A "fix" that just stops the
// false teleport would have disabled the map's anti-skip and looked like a
// pass.  Step 5 walks back onto a block already left and REQUIRES the teleport.

log_enable 1
log_dir "logs"
log_name "b37b"
developer 0
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
sv_cheats 1

wait 200
echo ^5=== b37b: bhop_futile ===

map bhop_futile
waitmap 900
waitms 2000

echo ^5--- 1. the load report ---
echo ^5(expect "entity I/O: 38 output(s) wired" -- futile's are comma-separated.)
waitms 600

echo ^5--- 2. what is still unimplemented on this map ---
ent_census
waitms 800

echo ^5--- 3. THE DROP onto block 1, arriving unnamed. Must NOT teleport. ---
setpos 5439.26 1793.67 8909.18
wait 250
echo ^5(expect y~1794 z~8432 = standing on block 1.
echo ^5 y~272 z~11473 = we were reset to `start`, i.e. the filter is still ignored.)
viewpos
waitms 800

echo ^5--- 4. leave block 1, which is what renames us "block2" (OnEndTouch) ---
setpos 5400 2200 8600
wait 40
echo ^5(off the block, for long enough that the end-touch think fires)
waitms 400

echo ^5--- 5. NOW GO BACK. The anti-backtrack must fire: expect `start`. ---
setpos 5439.26 1793.67 8909.18
wait 250
echo ^5(expect y~272 z~11473 = `start`.  If we are still at y~1794 the filter is
echo ^5 passing everything and the map's anti-skip has been broken instead of fixed.)
viewpos
waitms 800

screenshot b37b_futile
waitms 800

echo ^5=== b37b done ===
wait 30
quit
