// Patch 228 -- the sprp stride, measured rather than assumed.
//
// Five maps, and the point of each is a NUMBER that was derived offline from the
// BSPs themselves (scratchpad/sprp_census.py, all 1310 maps in the library).  A
// map that loads "some props" proves nothing; these have to match exactly.
//
//   REGRESSION GUARDS FIRST.  502 maps are canonical v10@72 and 161 are v6@64 --
//   they were always correct, propextra is 0 on them, and every new branch must be
//   a no-op.  If either of these two moves, the patch is wrong and nothing after
//   it matters.  surf_demise's 2350 is independently corroborated: Patch 193's own
//   essay says "2350 of surf_demise's props, which is ALL of them".
//
//     surf_demise    bsp20 sprp v10 stride 72   expect 2350
//     surf_garden    bsp20 sprp v10 stride 72   expect  429
//
//   THEN THE THREE CLASSES THAT WERE BEING DISCARDED.  Each fails differently:
//
//     bhop_ambience  bsp21 sprp v10 stride 76   expect   72  <- the reported map;
//                    the 4 inserted bytes at offset 72.  This is the one with the
//                    trees, so it is also the only one that gets a screenshot --
//                    "72 props loaded" and "the trees are there" are not the same
//                    claim, and only a picture settles the second.
//     surf_hektik    bsp21 sprp v11 stride 80   expect 2506  <- inserted field AND
//                    a real uniform scale at 76 (4 props at 1.5; 2502 at 1.0).
//     bhop_canals    bsp25 sprp v13 stride 88   expect 3126  <- Strata: 32-BIT leaf
//                    refs (the actual reason its correct 88-byte records failed)
//                    plus the vec3 scale at 76..87.  Before this patch every
//                    Strata prop read its scale from the inserted field and would
//                    have loaded at scale ZERO even if the stride had matched.
//
// developer 1 is needed: the stride line is a Con_DPrintf.  Expect it ONLY on the
// last three -- its absence on demise/garden is itself the regression check.
//
// `wait 200` before the first map: exec INSERTS at the front of the command
// buffer, so a waitmap with no wait ahead of it blocks the buffer the map load is
// queued in.  (b25a.cfg:12-14 -- build 19 lost three launches to that.)

log_enable 1
log_name p228a
developer 1
cfg_save_auto 0
cl_idlefps 0

wait 200
echo ^5=== p228a: sprp stride, leaf-ref width, scale offset ===

// ---------------------------------------------------------------------------
echo ^5--- GUARD 1/2: surf_demise, canonical v10@72 -- expect 2350 props ---
map surf_demise
waitmap 900
wait 60
echo ^5(expect: props: N of 2350 ... and NO "sprp v10 -- ... inserted" line)
waitms 600

// ---------------------------------------------------------------------------
echo ^5--- GUARD 2/2: surf_garden, canonical v10@72 -- expect 429 props ---
map surf_garden
waitmap 900
wait 60
echo ^5(expect: props: N of 429 ... and NO stride line)
waitms 600

// ---------------------------------------------------------------------------
echo ^5--- 1. bhop_ambience, v10@76 -- expect 72 props where there were 0 ---
map bhop_ambience
waitmap 900
wait 90
echo ^5(expect: sprp v10 -- 76-byte records (72 canonical + 4 inserted), 16-bit)
echo ^5(expect: props: N of 72)
waitms 800
screenshot
waitms 800

// ---------------------------------------------------------------------------
echo ^5--- 2. surf_hektik, v11@80 -- expect 2506 props, scale read at 76 ---
map surf_hektik
waitmap 900
wait 90
echo ^5(expect: sprp v11 -- 80-byte records (76 canonical + 4 inserted), 16-bit)
echo ^5(expect: props: N of 2506)
waitms 800

// ---------------------------------------------------------------------------
echo ^5--- 3. bhop_canals, Strata v13@88 -- expect 3126 props, 32-bit leaf refs ---
map bhop_canals
waitmap 900
wait 90
echo ^5(expect: sprp v13 -- 88-byte records (84 canonical + 4 inserted), 32-bit)
echo ^5(expect: props: N of 3126)
waitms 800
screenshot
waitms 800

echo ^5=== p228a done ===
wait 30
quit
