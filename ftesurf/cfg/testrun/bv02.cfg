// BV02 -- the boost, measured where it cannot be missed.
//
// BV01 tried bhop_futile's six OnJump pads and could not land a jump inside
// a 4-unit-thick brush reliably from a script: the pads were touched 125-147
// times each, but never on the exact command the jump condition held.  That
// is a property of the test, not of the code -- other brushes stacked at the
// same spot DID fire OnJump on those commands, which is what proves the
// OnJump path itself is alive.
//
// So this measures the same cash-out through OnStartTouch instead, which
// needs no jump at all: enter the volume, and one command later the carrier
// is cashed out.  All three volumes below are unconditional (no filtername)
// and enormous, so "did the player get inside" is not in question.
//
//   surf_fungus     *209   9728 x 1792 x 1184    basevelocity 0 0 500
//   surf_minuet_ksf *53    1280 x  512 x 2880    basevelocity 0 475 0
//   surf_stitched   *151    896 x  896 x 1856    basevelocity 0 0 -3000
//
// WHAT MUST BE TRUE.  Source scales the cash-out by (1 + tick * 0.5); surf
// runs pm_ticrate 0.015, so the factor is 1.0075:
//
//   fungus    paid '0 0 500'      ->  v +503.8      (was ~7.5 before this patch)
//   minuet    paid '0 475 0'      ->  h +475.0      (was ~0: the horizontal
//                                                    carrier was added before
//                                                    the move and subtracted
//                                                    after, then destroyed)
//   stitched  paid '0 0 -3000'    ->  v -3022.5
//
// The horizontal one is the sharper test of the two: a vertical carrier at
// least delivered speed*frametime per command, so it was wrong by a factor.
// A horizontal carrier that is never cashed out is wrong by ALL of it -- it
// moves you while you are inside and leaves nothing behind.

log_enable 1
log_dir "logs"
log_name "bv02"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0

wait 200

echo ^5=================== surf_fungus: 0 0 500 (vertical) =================
map surf_fungus
waitmap 1800
waitms 6000
sv_cheats 1
run_bv_debug 1
pm_ticrate
waitms 300
setpos -11427 15360 16000
waitms 2000
screenshot bv02_fungus
waitms 500

echo ^5=================== surf_minuet_ksf: 0 475 0 (horizontal) ===========
map surf_minuet_ksf
waitmap 1800
waitms 6000
sv_cheats 1
run_bv_debug 1
waitms 300
setpos 11392 6740 600
waitms 2000
screenshot bv02_minuet
waitms 500

echo ^5=================== surf_stitched: 0 0 -3000 (downward) =============
map surf_stitched
waitmap 1800
waitms 6000
sv_cheats 1
run_bv_debug 1
waitms 300
setpos -14912 -576 10700
waitms 2000
screenshot bv02_stitched
waitms 500

echo ^5=== bv02 done ===
wait 30
quit
