// IMPOSTER03 -- isolate Patch 263 from everything else in the build.
//
// imposter01's spawn-room shot differs from the pre-263 mono04 shot by 37% of
// pixels at the >12 threshold, against a within-run noise floor of 0.04%.  That
// is a real difference and it needs an owner.  Amplitude says it is not mine:
// mean delta is +2.5 of 255 spread evenly over the whole frame, geometry
// identical.  Code says it cannot be mine either -- surf_monolith has exactly
// ONE WindowImposter material and it is the bonus-4 slab, `nobasetex` has a
// single reader inside the UnlitGeneric arm so Patch 263's part C is inert for
// every other class, and part D only prints.  The runs also straddle another
// session's Patch 262 and an engine rebuild.
//
// But "it cannot be mine" is an argument, not a measurement.  This run makes it
// one.  Same build, same vantage, hl2_imposter FLIPPED:
//
//   imp01_a_spawn_yaw270.png   hl2_imposter 1
//   imp04_a_spawn_yaw270.png   hl2_imposter 0   <- this run
//
// If those two agree to the noise floor, Patch 263 provably does not touch the
// spawn room on this build, and the 37% belongs to whatever else changed
// between 13:34 and 16:02.  If they DISAGREE, it is mine and I need to know.
//
// hl2_imposter is MAPLATCH, so it is set before the map, not after.

log_enable 1
log_dir "logs"
log_name "imposter04"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
con_notifylines 0
developer 1
log_developer 1

wait 200
hl2_imposter 1
waitms 300
map surf_monolith
waitmap 2400
waitms 10000

hl2_imposter
waitms 500

sv_cheats 1
waitms 300
noclip
waitms 400

echo ^5=== spawn, the mono04_a / imp01_a vantage EXACTLY ===
setpos 3856 -13872 13490 0 270 0
waitms 1600
screenshot imp04_a_x
waitms 700
screenshot imp04_a_spawn_yaw270
waitms 700

echo ^5=== imposter04 done ===
wait 30
quit
