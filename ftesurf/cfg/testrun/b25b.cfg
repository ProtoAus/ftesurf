// BUILD 25 stage 1, second pass -- the ramp hold, and the open segment across
// a save.
//
// TWO THINGS b25a COULD NOT SHOW.
//
// 1. THE RAMP HOLD.  Board_RampHold bridges a contact gap shorter than the
//    engine's own PMSRC_BOARD_AIRGATE.  A config cannot ride a ramp, but the
//    REPLAY reader runs the same segment machine over a file -- so two fixtures
//    that differ only in whether the ramp bit drops out every fourth tick must
//    produce the SAME number of segment rows.  Without the hold the dropped one
//    would split its single ride into eleven pieces.
//
//    That is a real test of the fix rather than of the fixture: both files
//    contain one continuous 45-tick ride, and only one of them says so in the
//    flags column.
//
// 2. THE OPEN SEGMENT ACROSS A SAVE.  Save while airborne, fly on, load, and the
//    air segment must resume from where it was rather than restarting.  The
//    evidence is in seq.txt -- an `open` line with a kind, an energy and a
//    duration -- and in the segment not being warped away on the load.
//
// `wait 200` before `map`: exec inserts at the FRONT of the command buffer.

developer 1
log_developer 1
cfg_save_auto 0

wait 200
map surf_aesthetic
waitmap 90

echo ""
echo "=== 1. the ramp hold: clean vs dropped, same ride ==="
echo "--- ramp_clean: 45 contact ticks, no gaps ---"
replay data/testrun/ramp_clean.rec
wait 25
replay seek end
wait 15
replay status
wait 5
replay stop
wait 15

echo "--- ramp_drop: the SAME ride with the bit clear every 4th tick ---"
replay data/testrun/ramp_drop.rec
wait 25
replay seek end
wait 15
replay status
wait 5
replay stop
wait 15
echo "    the two 'seq N rows' lines above must MATCH"
echo ""

echo "=== 2. the open segment across a save ==="
zone_goto 0
wait 10
// Off the block and into the air: setpos taints rather than voids (build 24),
// so the clock runs, the recorder is open, and the segment machine has an AIR
// segment open by the time the save is taken.
setpos -15200 200 1400
wait 30
cmd timer
wait 5

echo "--- save while airborne ---"
cmd sl_save
wait 15

echo "--- keep falling, so the live segment moves on ---"
wait 40

echo "--- load it back ---"
cmd sl_load
wait 20
cmd timer
wait 5
echo ""

echo "=== 3. what seq.txt carries ==="
// The `open` line is the whole of item 8a.  dir proves the file exists at the
// three-digit path; the reader read it back above.
dir data/saves/surf_aesthetic/save001/*
wait 5
echo ""

echo "=== 4. tidy up ==="
cmd sl_delall
wait 15
cmd sl_list
wait 5
echo ""

echo "=== b25b done ==="
wait 20
quit
