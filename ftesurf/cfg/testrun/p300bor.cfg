// FTESurf Patch 300 -- verification run 2 of 2: THE CONTROL ARM.
//
// This file exists to try to BREAK Patch 300, not to confirm it.  It does two
// jobs that p300t2.cfg cannot do, and the patch does not ship if either fails.
//
// ===================================================================
// JOB 1: prove r_fog_progless still does something.
// ===================================================================
// p300t2's decisive test is "arm A equals arm B" -- the sprites stop responding
// to r_fog_progless because they are on a program now.  That test is worthless
// on its own, because A==B is ALSO what you get if the progless path is dead
// everywhere, or if the cvar stopped being read, or if fog is off entirely.
//
// surf_boreas is the map where progless is known to matter.  Its cloud layer,
// project_tendies/cloods, is UnlitGeneric -> a real PASS -> program-less, which
// is the whole reason Patch 266 exists.  So here A MUST NOT equal B.
//     PASS: the cloud layer visibly changes between r_fog_progless 1 and 0.
//     FAIL: no change -- then p300t2's A==B proved nothing and both runs are void.
//
// ===================================================================
// JOB 2: prove Patch 300 did not regress Patch 266.
// ===================================================================
// PREDICTION, REGISTERED IN ADVANCE: the clouds are UNCHANGED by Patch 300, and
// the reason is structural rather than measured.  cloods.vmt reads:
//
//     UnlitGeneric
//     {
//         "$basetexture""models\props\cs_office\clouds"
//         "$translucent" "1"
//         //"$additive" 1                     <-- COMMENTED OUT
//         "Proxies"{ "TextureScroll"{ rate 0.005 angle 30.00 } }
//     }
//
// The $additive line is a comment, and COM_ParseType drops // to end of line.
// So st->additive is 0, VMT_AdditiveProgramOK returns false on its first test,
// and the material never enters the changed branch.  It still emits a pass, it
// still gets `blendFunc blend` (src_alpha/one_minus_src_alpha), it still takes
// BE_ProglessFogBegin.  Patch 300 cannot touch it.
//
// That is a stronger guarantee than a screenshot, which is why it is written
// down as the claim and the screenshots are only the check on the claim.  If the
// clouds DO change, the gate is not doing what this comment says and the patch
// is wrong, not the comment.
//
// WHAT SHOULD CHANGE ON THIS MAP, and it is not a regression:
//   - project_tendies/tendies_endsmoke.vmt -- UnlitGeneric, $additive 1,
//     $vertexcolor, $vertexalpha, TextureScroll.  8 displacement faces.  MOVES.
//   - project_tendies/alch_symbols_alpha.vmt -- $additive 1, $nofog 1, Sine
//     proxy on $alpha.  1 face on func_brush *54.  MOVES, and its $nofog starts
//     being obeyed for the first time (it was appended to progargs and this arm
//     had no program to read it).
//   - the env_sun overlay, sprites/light_glow02_add_noz -- additive UnlitGeneric.
// Those fading toward black instead of toward the fog colour is the FIX, on a
// map that happens to contain both cases.  Do not read them as breakage.
//
// NOTE ON MEASURING THE CLOUDS.  A pixel diff is impossible here and always was:
// `tcMod scroll` moves 58.8% of pixels between two frames of the SAME state, so
// the noise floor swallows any real difference.  Patch 266 established the
// method -- regional mean at a setpos-pinned vantage, with a same-setting pair
// as the scroll-noise calibration.  A_ctl below is that pair, and its job is to
// make the A-vs-B number interpretable.  Its reference figures, for scale:
// scroll noise -1.08/-1.03/-1.00; progless 1-vs-0 shallow +6.75/+8.09/+7.69.
cfg_save_auto 0
exec cfg/testrun/_quiet.cfg
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "p300bor"
scr_sshot_type png
cl_yieldcpu 0
vid_vsync 0
crosshair 0
fov 100
con_notifylines 0
con_notifytime 0.01
cl_maxfps 100

hl2_additivefog 1

waitms 2500
map surf_boreas
waitmap 240
waitms 8000
sv_cheats 1
noclip
waitms 500

// The clouds are two displacements at z -8000 and -7232 inside the toolsskybox2d
// room, spanning x[-15784..15808] y[-16192..16320].  Sit BELOW the lower sheet
// and look up, so both layers fill a usable fraction of the frame.  Negative
// pitch is up.
r_renderscale 1
show_fps 1
setpos 0 0 -8600 -60 90 0

// THE SETTLE, and it is 20s because p300t2 proved 6s is not enough.
// In that run the three arm-A frames -- all at the SAME r_fog_progless -- drifted
// monotonically (3.19 -> 2.91 -> 2.58 meanabs against the converged state) while
// every later frame agreed to 0.01% of pixels.  The scene was still converging
// ~20s after the map came up, so the whole A arm measured warm-up and not the
// cvar.  A short settle does not add noise, it adds a FAKE SIGNAL that points
// whichever way the arm order happens to run.
waitms 20000

// Name what is actually under the crosshair, so "the clouds did not change" is a
// statement about cloods and not about whatever else is in frame.
shader_here
waitms 1500

echo "@@@ P300BOR state -- expect addprog to count tendies_endsmoke + alch_symbols_alpha, NOT cloods"
hl2_additivefog
r_fog_progless
r_fog_linear
waitms 1200

echo "@@@ P300BOR A. r_fog_progless 1 (default)"
r_fog_progless 1
waitms 2000
screenshot p300bor_A_x
waitms 1000
screenshot p300bor_A
waitms 1000
screenshot p300bor_A_ctl
waitms 1000

echo "@@@ P300BOR B. r_fog_progless 0 -- the clouds MUST change here, or run 1 is void"
r_fog_progless 0
waitms 2000
screenshot p300bor_B_x
waitms 1000
screenshot p300bor_B
waitms 1000

echo "@@@ P300BOR C. back to 1 -- must match A"
r_fog_progless 1
waitms 2000
screenshot p300bor_C_x
waitms 1000
screenshot p300bor_C
waitms 1000

echo "@@@ P300BOR DONE"
waitms 1200
quit
