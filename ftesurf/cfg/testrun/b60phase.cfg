// FTESurf build 60 -- DID DE-PHASING THE FORCED RE-CHECKS REMOVE THE SPIKE?
//
// WHAT THE FIRST RUN (b60adapt) FOUND.  The adaptive rays worked and the frame
// was pixel-identical, but the saving ARRIVED IN BURSTS.  Three consecutive
// census frames of the same arm:
//     32 traced, 30 cheap, 0 forced -> 1.25 rays/glare, ~9 frames per sweep
//      8 traced,  0 cheap, 6 forced -> 5.00 rays/glare, ~50 frames per sweep
//     26 traced, 22 cheap, 0 forced -> 1.62 rays/glare, ~14 frames per sweep
// Every glare got its first answer in the same load sweep and the counter
// advances once per visit, so all 296 hidden ones came due in the same sweep.
// One sweep in nine therefore cost what build 59 cost, and THE WORST CASE is
// what Lex reported as "up to 1 sec" -- so a good mean with the old worst case
// is only half the job.
//
// THE CHANGE: a glare's FIRST full answer seeds its counter at 1 + (i mod
// adapt) instead of 1.  Same period (adapt+1 visits), phases spread over adapt
// classes.  Nothing else moved.
//
// ===================================================================
// PREDICTION, REGISTERED BEFORE THE RUN
// ===================================================================
// Ten samples of arm A, 400ms apart, which at ~400fps is ~160 frames -- far
// enough apart to land in different sweep phases, which is how the first run
// caught the burst in the first place.
//
//   rays/glare       steady near 1.44 on EVERY sample, no 5.00 outliers
//   frames per sweep steady near 11, and in particular NO ~50
//   forced full      small and non-zero on most samples (a few per frame)
//                    rather than 0 on some and every-traced-glare on others
//   fps              unchanged from the first run's 407.4 / 401.3, because the
//                    ray budget is what sets the cost and it is still 40
//   pixels           central region identical to the adaptive-0 arm again
//
//   FAIL: any sample still reads 5.00 rays/glare with a full sweep of forced
//         re-checks -> the phases are still locked and the seed is not working.
//   FAIL: `forced full` is 0 on all ten samples -> the anti-stickiness path has
//         been seeded out of existence, which would be worse than the spike.
//
// The arithmetic being tested: 296 hidden glares at (8 cheap + 1 full) per 9
// visits plus 6 visible at 5 rays = 296*1.444 + 30 = ~458 rays per sweep, which
// at a 40-ray budget is ~11.5 frames.  A sample far from that is the finding.
cfg_save_auto 0
exec cfg/testrun/_quiet.cfg
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "b60phase"
scr_sshot_type png
cl_yieldcpu 0
vid_vsync 0
crosshair 0
fov 100
con_notifylines 0
con_notifytime 0.01
cl_maxfps 0

r_fog_progless 1
hl2_additivefog 1

waitms 2500
map surf_tensor2
waitmap 240
waitms 8000
sv_cheats 1
noclip
waitms 500

vbsp_sprites 1
vbsp_lightglow 1
vbsp_lightglow_scale 1
vbsp_sprite_source 1
vbsp_glare 1
vbsp_glare_rays 5
vbsp_glare_traces 40
vbsp_glare_cull 1.25
vbsp_glare_brush 2
r_renderscale 1
show_fps 1

setpos -10688.5 -1773.8 -8587.1 6.3 91.1 0
waitms 25000

echo "@@@ B60P A. adaptive 8, traces 40 -- ten samples, looking for the spike"
vbsp_glare_adaptive 8
waitms 8000
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 700
screenshot b60p_A
waitms 2500

echo "@@@ B60P B. adaptive 0, traces 40 -- the control, build 59"
vbsp_glare_adaptive 0
waitms 8000
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 700
screenshot b60p_B
waitms 2500

echo "@@@ B60P C. adaptive 8 again -- same setting as A, the noise floor"
vbsp_glare_adaptive 8
waitms 8000
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 700
screenshot b60p_C
waitms 2500

echo "@@@ B60P D. adaptive 8, traces 12 -- the deliverable: b59 latency, b58 price"
vbsp_glare_traces 12
waitms 8000
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 700
screenshot b60p_D
waitms 2500

echo "@@@ B60P DONE"
waitms 1200
quit
