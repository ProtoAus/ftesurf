// Is `surf_tensor2.spawn_rain01` a real particle type in the engine?
//
// What is known so far: the 44 info_particle_system entities register, the
// handles come back (negative is just the CSQC slot index, pr_csqc.c:3863 --
// it is NOT a failure code, which is what made the first diagnostic useless),
// P_LoadParticleSet prints no "Couldn't find particle description", and yet
// `Particle phys/sort` is 0.00, i.e. not one particle exists.
//
// So the question is narrowed to: did particles/surf_tensor2.cfg parse into
// named types, and are they RUNNING?  r_partinfo answers both -- it lists every
// type with live particles and shouts NOT RUNNING for any that has them but is
// off the run list.
//
// developer stays ON for the whole run: every interesting line here is a
// Con_DPrintf, and log_developer is what puts those in the file at all.
developer 1
log_developer 1
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000

cl_maxfps 0
cl_idlefps 0
cl_yieldcpu 0
sv_cheats 1

map surf_tensor2
waitmap 600
waitms 6000

noclip
waitms 1000
setpos -11776 -13632 13720 -35 90 0
waitms 4000

echo ^5=== r_partinfo: does surf_tensor2.* exist and is it running?
r_partinfo
waitms 2000

echo ^5=== emit_list
emit_list
waitms 1500

// A direct, QC-free emission through the same namespace.  If r_part blocks
// parsed at all, this is the shortest path to proving it -- and it bypasses
// every line of cl_emit.qc, so a difference between this and the QC path
// localises the fault to one side or the other.
echo ^5=== direct: r_part namespace test
r_partinfo
waitms 1000

echo ^5=== END ===
waitms 500
quit
