// FTESurf Patch 283 -- client/server portal agreement on surf_kitsune.
//
// T4 from the plan, and it is the test that matters FIRST: if the two sides do
// not even build the same number of doors, every other portal measurement is
// noise. cl_portal.qc says outright that a mismatch is the tell.
//
// PASS: the client prints 18 with apertures, matching the server's
//       "portal doors: 18 linked".
// FAIL: they differ -> stop, fix the door list, ignore the flicker for now.
exec cfg/testrun/_quiet.cfg
developer 1
log_developer 1
wait 100
connect 192.168.1.102:27500
wait 1800
echo "P283: ---- cvars in effect ----"
pm_portalcsg_scanall
pm_skipent_portals
cl_csqc_waitforserverinfo
cl_automount
echo "P283: ---- see the portals: line above for the client count ----"
hl2_unresolved
screenshot
wait 100
quit
