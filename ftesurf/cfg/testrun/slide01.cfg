// SLIDE01 -- Patch 280, the A/B: does a func_slide face stop being ground?
// surf_mom_training *54: 26.6-degree face, normal.z 0.894, STANDABLE under
// pm_standablenormal 0.7 today.  Hull is 32 wide so the origin rests at
// z = 1160 + (y-9760)*0.5 (1212 at y 9864); probe is 2 above that.  The ramp
// is 104 units long from here: every sample is inside 0.7 s of the setpos, and
// a row reading normal.z 1.000 means the ramp was traversed (it ends on *52, a
// flat func_slide), NOT that the tag failed.  Read cmd replies in ORDER
// (viewpos, then slideinfo); local echo lines drift a block ahead of them.
log_enable 1
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
con_notifylines 0
developer 1
log_developer 1

wait 200
map surf_mom_training
waitmap 120
waitms 8000
sv_cheats 1
waitms 400
pm_dispprobe 0
pm_ladderprobe 0
pm_slide
pm_autobunny

echo ^5=== CTL: world floor at spawn, pm_slide 1, must stand ===
pm_slide 1
waitms 300
setpos 0 0 70 0 0 0
waitms 1200
cmd viewpos
cmd run_slideinfo
waitms 400
cmd run_slideinfo
waitms 800

echo ^5=== A1: pm_slide 0 on *54 (expect stand) ===
pm_slide 0
waitms 300
setpos 7200 9864 1214 0 270 0
waitms 250
cmd viewpos
cmd run_slideinfo
waitms 200
cmd run_slideinfo
waitms 200
cmd run_slideinfo
cmd timer
waitms 800

echo ^5=== B1: pm_slide 1 on *54 (expect slide) ===
pm_slide 1
waitms 300
setpos 7200 9864 1214 0 270 0
waitms 250
cmd viewpos
cmd run_slideinfo
waitms 200
cmd run_slideinfo
waitms 200
cmd run_slideinfo
cmd timer
waitms 1500

echo ^5=== A2: pm_slide 0 again ===
pm_slide 0
waitms 300
setpos 7200 9864 1214 0 270 0
waitms 250
cmd viewpos
cmd run_slideinfo
waitms 200
cmd run_slideinfo
waitms 200
cmd run_slideinfo
waitms 800

echo ^5=== B2: pm_slide 1 again ===
pm_slide 1
waitms 300
setpos 7200 9864 1214 0 270 0
waitms 250
cmd viewpos
cmd run_slideinfo
waitms 200
cmd run_slideinfo
waitms 200
cmd run_slideinfo
waitms 1500

echo ^5=== C: pm_slide 1, *54 has allowjump 0, +jump must NOT jump ===
pm_slide 1
waitms 300
setpos 7200 9864 1214 0 270 0
waitms 300
cmd run_slideinfo
+jump
waitms 150
-jump
cmd run_slideinfo
waitms 200
cmd run_slideinfo
waitms 1500

echo ^5=== D1: pm_slide 1, flat *6 allowjump 1: rest then +jump ===
pm_slide 1
waitms 300
setpos 7008 2872 1154 0 0 0
waitms 1200
cmd viewpos
cmd run_slideinfo
+jump
waitms 100
-jump
cmd run_slideinfo
waitms 250
cmd run_slideinfo
waitms 800

echo ^5=== D0: pm_slide 0, flat *6: rest then +jump (control) ===
pm_slide 0
waitms 300
setpos 7008 2872 1154 0 0 0
waitms 1200
cmd run_slideinfo
+jump
waitms 100
-jump
cmd run_slideinfo
waitms 250
cmd run_slideinfo
waitms 800

echo ^5=== E1: pm_slide 1, flat *6, +forward 700ms (air cap) ===
pm_slide 1
waitms 300
setpos 7008 2872 1154 0 0 0
waitms 1200
+forward
waitms 700
cmd run_slideinfo
-forward
waitms 300
cmd run_slideinfo
waitms 800

echo ^5=== E0: pm_slide 0, flat *6, +forward 700ms (walk) ===
pm_slide 0
waitms 300
setpos 7008 2872 1154 0 0 0
waitms 1200
+forward
waitms 700
cmd run_slideinfo
-forward
waitms 300
cmd run_slideinfo
waitms 800

echo ^5=== slide01 done ===
pm_slide 1
wait 30
quit
