// NETV15B -- the fix arm.  Identical to netv10b.cfg except cl_netfps.
//
// 1/66.6667 = 15.0 ms = exactly one pm_ticrate on a surf map, so every usercmd
// should run exactly one tick and the recorded motion should read 111111111
// where netv10b reads 011011011.  See netv10b.cfg's header for the design and
// for the two mistakes its predecessors made.

log_enable 1
log_dir "logs"
log_name "netv15b"
developer 0
log_developer 0
cfg_save_auto 0
sv_cheats 0
fs_missingwarn 0
cl_idlefps 0
vid_fullscreen 0
con_notifylines 0
scr_conalpha 0

wait 200
map surf_rise
waitmap 1800
waitms 3000

cl_netfps 66.6667
waitms 600
echo ^5=== netv15b: the values actually in force ===
cl_netfps
pm_ticrate
cl_maxfps
waitms 600

echo ^5=== netv15b: walking ===
cmd zone_goto 0 16.18 0
waitms 900
+forward
waitms 4000
-forward
waitms 500
cmd sl_save
waitms 1200

echo ^5=== netv15b: done ===
waitms 500
quit
