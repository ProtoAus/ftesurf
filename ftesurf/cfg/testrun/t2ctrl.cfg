// THE CONTROL RUN.  Does the scripted particle system draw ANYTHING in this
// session -- before any more time goes into why the rain does not?
//
// So far every reading has been consistent with two very different worlds:
//   (a) the bake is broken and ftesurf.cfg's effects are fine
//   (b) no particle draws at all right now, and the bake is irrelevant
// Nothing measured yet separates them.  particleeffectquery looked like it
// would and cannot -- pe->ParticleQuery is implemented by no particle engine
// in this build, so it returns "" for every handle including ones that work.
//
// r_partinfo DOES separate them: it prints `Type <cfg>.<name> = N+M total` for
// every type that has live particles, so it counts rather than asks.
//
// surf_anubis is the control map: 161 env_fire braziers and 498 env_smokestack
// torches, all ftesurf.cfg effects that shipped working in builds 49 and 51.
// If r_partinfo is empty THERE, the particle system is dead in this
// configuration and the rain was never the question.

developer 1
log_developer 1
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000

cl_maxfps 0
cl_idlefps 0
cl_yieldcpu 0
sv_cheats 1

// ---- CONTROL: a map whose particles are known to work -------------------
map surf_anubis
waitmap 600
waitms 8000
echo ^5=== CONTROL surf_anubis: emit_list then r_partinfo
emit_list
waitms 1500
r_partinfo
waitms 2000
screenshot t2ctrl_anubis_x
waitms 900
screenshot t2ctrl_anubis
waitms 900

// ---- THE CASE: the baked namespace --------------------------------------
map surf_tensor2
waitmap 600
waitms 8000
noclip
waitms 1000
setpos -11776 -13632 13720 -35 90 0
waitms 4000
echo ^5=== CASE surf_tensor2: emit_list then r_partinfo
emit_list
waitms 1500
r_partinfo
waitms 2000
screenshot t2ctrl_tensor_x
waitms 900
screenshot t2ctrl_tensor
waitms 900

echo ^5=== END ===
waitms 500
quit
