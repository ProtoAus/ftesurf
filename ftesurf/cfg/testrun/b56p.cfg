// FTESurf b56p -- did the engine actually LOAD the corrected particle sizes?
//
// tools/pcf.py now converts a Source particle radius r as 4*sqrt(2)*r instead of
// 4r: FTE places a particle's four vertices at distance `scale` from its centre
// with the texture's CORNERS on them (p_script.c:7030-7053), so the texture's
// visible half-width is scale/sqrt(2), and the old factor drew every particle at
// 71% of its Source size.  surf_tensor2.cfg and surf_boreas.cfg were re-baked
// with it on 2026-09-09 and nothing else in either file moved.
//
// A PICTURE CANNOT PROVE THIS WELL.  Particles are born at random positions with
// random sizes, so two screenshots differ whatever the scale is.  This asks the
// engine instead: r_exportalleffects writes every loaded r_part definition, as
// the engine holds it, to particles/export.cfg (PScript_Query mode 1,
// p_script.c:2685).  The runner backs up any existing export.cfg first and puts
// it back afterwards, because that file was already in the gamedir.
//
// PASS: the exported surf_tensor2_portal_blue block carries scaledelta 6.914
//   (the old bake said 4.889), and the blocks that had `scale 4` now carry 5.66.
// FAIL modes worth telling apart:
//   old numbers    -> the engine is loading a stale copy of the .cfg
//   block missing  -> the CSQC exec did not survive the map load (the
//                     r_particledesc callback trap Patch 272 fixed)
cfg_save_auto 0
exec cfg/testrun/_quiet.cfg
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "b56p"

waitms 2500
map surf_tensor2
waitmap 240
waitms 9000

echo "@@@ B56P exporting every loaded effect"
r_exportalleffects
waitms 1500

echo "@@@ B56P DONE"
waitms 800
quit
