// Patch 188, decisive case: models/dreams/heart*.mdl carry $color2 "{255 0 0}"
// over a $basetexture of dreams/white.  If the key were still being dropped
// they would be pure white.  The umbrella already reads blue, but it sits in a
// blue-lit room, so a PURE RED prop is the one that cannot be explained by
// lighting.
//
// Four camera positions, approaching from +Y rather than +X -- the first
// attempt put the camera in the void and rendered black.
cfg_save_auto 0
log_name p188b
developer 0
scr_sshot_type png
waitms 2500
map surf_unrequited
waitms 30000
noclip
waitms 500

setpos 1536 -9096 -3020 20 270 0
waitms 1000
screenshot_mega p188b_heartA 1280 720
waitms 1200

setpos -1792 -7944 -5080 20 270 0
waitms 1000
screenshot_mega p188b_heartB 1280 720
waitms 1200

setpos -2560 -10120 -4824 20 270 0
waitms 1000
screenshot_mega p188b_heartC 1280 720
waitms 1200

setpos -3584 -9096 -4056 20 270 0
waitms 1000
screenshot_mega p188b_heartD 1280 720
waitms 1200

echo "=== P188B DONE ==="
waitms 1000
quit
