// FTESurf build 59 -- WHERE DOES THE 27us PER RAY GO?  The 161 occluders.
//
// WHY THIS RUN EXISTS.  Lex measured 27.1us per glare ray (555-600fps at
// vbsp_glare_traces 8, 360-420 at 40, 200-220 at 120 -- three points on a
// straight line).  That is roughly 30x what a BSP traceline against a world
// model should cost, so something is making each ray expensive rather than
// there being too many of them.
//
// THE SUSPECT, and it is my own Build 53 work: the client instantiates copies
// of the map's brush entities so the glare trace has something to hit --
// surf_tensor2's census says "sprite occluders: 161 of 622 brush entities".
// Every single ray is therefore tested against the world model PLUS 161
// SOLID_BSP entities, and I never measured what that costs per ray.
//
// WHAT HAS ALREADY BEEN MEASURED, and one of these numbers is a correction to a
// claim this file used to make.  fps is set by the RAY BUDGET alone; what the
// other two changes bought is sweep LATENCY, measured with visits per frame as
// the denominator (build 60 -- the build 59 census divided by glares TRACED,
// which pretends a culled glare does not advance the round-robin cursor, and
// that error made the view cull look inert when it is worth 5x):
//
//        config                              rays/frame   fps    frames/sweep
//   b58  traces 40, no cull, no adaptive         40       383.4      53.6
//   b59  traces 40, cull, no adaptive            40       399-412    11.2, 10.8
//   b60  traces 40, cull + adaptive 8            40       396.8      3.7, 3.8, 3.4
//   b60  traces 12, cull + adaptive 8            12       577-633    9.8
//
// (frames/sweep from build 60 on is COUNTED between cursor wraps, not derived.)
//
// So rays-per-glare and which-glares are both done, and both were free in fps
// because the budget is saturated either way.  THE ONE LEVER LEFT IS THE PRICE
// OF A RAY, which is this run: at 27.1us it is ~30x what a BSP trace should
// cost, and lowering it is what would let the budget be raised again.
//
// METHOD.  vbsp_glare_brush is read when the occluder set is built, and
// vbsp_sprite_debug 2 rebuilds it in place -- so this is a genuine one-process
// A/B and does not need a map reload or a second launch.
//
// ONE SCREENSHOT PER ARM.  A 1920x1111 PNG costs ~700ms to write and bursting
// them collapsed an earlier run from 60fps to 1.4; show_fps gets 8 undisturbed
// seconds to average before each single capture.
//
// PREDICTION, REGISTERED BEFORE THE RUN:
//   If the occluders are the per-ray cost, arm B (0 occluders) should be
//   dramatically faster than arm A at the same ray budget -- at 40 rays/frame
//   and 27.1us, removing most of that recovers most of the ~1.1ms/frame the
//   traces are spending, i.e. roughly 440 -> 600fps.
//   If fps barely moves, the cost is the traceline itself and the occluder set
//   is exonerated -- in which case the only lever left is fewer rays per glare.
//
// CORRECTNESS, and it is why arm B is not a candidate fix on its own: with no
// occluders, brush entities stop blocking glares, so `hidden by the trace`
// should FALL and more glows should draw. That is the Build 53 bug coming back.
// The census line is what shows it; a faster arm that draws the wrong thing is
// not an improvement and this run must not be read as recommending
// vbsp_glare_brush 0.
cfg_save_auto 0
exec cfg/testrun/_quiet.cfg
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "b59occ"
scr_sshot_type png
cl_yieldcpu 0
vid_vsync 0
crosshair 0
fov 100
con_notifylines 0
con_notifytime 0.01
cl_maxfps 0

r_fog_progless 1
hl2_additivefog 1

waitms 2500
map surf_tensor2
waitmap 240
waitms 8000
sv_cheats 1
noclip
waitms 500

vbsp_sprites 1
vbsp_lightglow 1
vbsp_lightglow_scale 1
vbsp_sprite_source 1
vbsp_glare 1
vbsp_glare_rays 5
vbsp_glare_traces 40
vbsp_glare_cull 1.25
// adaptive 0 deliberately: the 27.1us/ray figure was taken under build 59
// conditions, and this run is about the price of a ray, not how many are fired.
// The budget is saturated either way, so both arms fire exactly 40.
vbsp_glare_adaptive 0
r_renderscale 1
show_fps 1

setpos -10688.5 -1773.8 -8587.1 6.3 91.1 0
waitms 25000

echo "@@@ B59OCC A. vbsp_glare_brush 2 -- 161 occluders, the shipped default"
vbsp_glare_brush 2
vbsp_sprite_debug 2
waitms 10000
vbsp_sprite_debug 1
waitms 1500
screenshot b59o_A
waitms 2500

echo "@@@ B59OCC B. vbsp_glare_brush 0 -- no occluder entities at all"
vbsp_glare_brush 0
vbsp_sprite_debug 2
waitms 10000
vbsp_sprite_debug 1
waitms 1500
screenshot b59o_B
waitms 2500

echo "@@@ B59OCC C. back to 2 -- must match A"
vbsp_glare_brush 2
vbsp_sprite_debug 2
waitms 10000
vbsp_sprite_debug 1
waitms 1500
screenshot b59o_C
waitms 2500

echo "@@@ B59OCC DONE"
waitms 1200
quit
