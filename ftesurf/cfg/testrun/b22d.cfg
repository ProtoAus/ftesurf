// FTESurf build 22 -- the consent gate reading its own record off disk.
//
// b22c proved the gate CLOSED with nothing on disk, and proved it open when the
// mirror cvar was set by hand.  Neither exercised the path that matters most in
// practice: data/consent.txt being read by csprogs itself.
//
// That path exists because b22c's own log found the cvar unreliable -- it printed
// `Unknown command "rec_terms"` on a headless launch that had already finished
// loading surf_666, i.e. the menu VM had not run and the mirror did not exist.
// The direction was safe, but a player who HAS accepted would have had a run
// written with `hid 0` in its sidecar, which is a false statement about them.
//
// This config is driven three times from outside, with data/consent.txt absent,
// then holding version 0, then version 1.  It does one thing: start a run, then
// try to close a journal by hand.  "no journal open" means the gate held; a file
// means it opened.  THE FIXTURE FILE IS DELETED AFTERWARDS -- a consent record
// is a record that a person agreed, and a test must not leave one lying around
// claiming that anybody did.

cfg_save_auto 0
developer 1
log_developer 1
con_notifytime 0

wait 200
map surf_666
waitmap 60
waitms 500

echo "--- what the mirror cvar says (may legitimately be unregistered) ---"
rec_terms
waitms 300

cmd zone_goto 0
waitms 900
+back
waitms 1600
-back
waitms 700

echo "--- running; now try to close a journal ---"
cmd timer
waitms 600
in_journal_end data/runs/b22d.hid
waitms 500

echo "=========== done ==========="
waitms 300
quit
