cfg_save_auto 0

// ===========================================================================
// BUILD 65, ARM SET B -- THE BHOP A/B, WHICH IS THE ONE CLAIM THAT COULD BE
// SIMPLY WRONG.
//
// Build 65 says a chain of bhops was coming out as ONE merged Air row because
// the ground phase between two hops is a single tick (0.015 s) against a 0.10 s
// merge-break threshold.  That is a reading of two lines of code, and a reading
// is not a measurement.  This runs the same chain of hops twice with the new
// cvar on and off, and the row COUNT in the segment column is the whole answer.
//
//   hud_seq_hopbreak 1   the column should carry one Air row PER HOP
//   hud_seq_hopbreak 0   build 64: the same hops should collapse toward one row
//
// TWO MAP LOADS, NOT ONE.  The segment ring is cleared by a new RUN, not by a
// cvar, so flipping the switch mid-chain would leave rows from arm A sitting
// above arm B's and the count would be of both.  A fresh load is the cheapest
// honest reset.
//
// THE HOPS ARE SCRIPTED, which bounds what this can prove.  +jump held for 120 ms
// and released for 520 is a rhythm, not a bhop -- there is no strafing and no
// speed, so the ROWS will be small and the percentages poor.  That is fine: this
// arm counts rows, it does not grade them.  Whether the rows are worth anything
// is build65.cfg's b65_hop, with hands.
//
// THE STRAFE BAR IS IN THE SAME PICTURE, deliberately.  hud_strafe_groundhold is
// the other half of the same landing, so the shots taken during the chain are
// also the flicker evidence -- a frame caught mid-landing with the bar blanked
// is the defect, and with the gate on there should be no such frame.
//
// PREDICTIONS, registered before the run:
//   * arm A (hopbreak 1) shows MORE Air rows than arm B (hopbreak 0)
//   * arm B shows one, or very few
//   * no frame in either arm has the bar's fill missing while airborne
//
// FALSIFIED IF: A and B show the same number of rows.  Then the merge is not
// what is folding the hops together and the diagnosis in cl_board.qc is wrong.
// ===========================================================================
log_enable 1
log_dir logs
log_name b65b_hop
developer 1

scr_sshot_prefix "screenshots/b65b_"

hud_scale 2
cl_maxfps 250
con_notifylines 0

// Everything on, so the column shows every column it has.
hud_seq 1
hud_seq_name 1
hud_seq_abs 1
hud_seq_delta 1
hud_seq_time 1
hud_seq_pct 1
hud_seq_units 1
hud_seq_live 1
hud_strafe 1

// Harness trap 1 (b63a_logic.cfg): a `map` issued while the engine is still
// initialising is silently dropped.
waitms 5000

// ---------------------------------------------------------------------------
echo ==== ARM A: hud_seq_hopbreak 1 -- expect one Air row per hop ====
// ---------------------------------------------------------------------------
map surf_kitsune
waitmap 45
waitms 4000

hud_seq_hopbreak 1
hud_strafe_groundhold 0.12

// Five hops.  The hold is longer than a tap so the jump definitely registers;
// the gap is long enough for the arc to finish and the air segment to close.
+jump
waitms 120
-jump
waitms 520
+jump
waitms 120
-jump
waitms 520
+jump
waitms 120
-jump
waitms 520
+jump
waitms 120
-jump
waitms 520
+jump
waitms 120
-jump
waitms 900

echo ---- arm A column ----
screenshot
waitms 700
screenshot
waitms 700

// ---------------------------------------------------------------------------
echo ==== ARM B: hud_seq_hopbreak 0 -- build 64, expect them merged ====
// ---------------------------------------------------------------------------
map surf_kitsune
waitmap 45
waitms 4000

hud_seq_hopbreak 0
hud_strafe_groundhold 0

+jump
waitms 120
-jump
waitms 520
+jump
waitms 120
-jump
waitms 520
+jump
waitms 120
-jump
waitms 520
+jump
waitms 120
-jump
waitms 520
+jump
waitms 120
-jump
waitms 900

echo ---- arm B column ----
screenshot
waitms 700
screenshot
waitms 700

echo ==== END ====
waitms 800
log_enable 0
waitms 500
quit
