// B44CLASS -- segmented, cheated and practice, driven from a config.
//
// THE REPORT: "stitched runs are legit settings but save locked, anything else
// cheated, sv_cheats, noclipped is a cheated run." ... "that needs to be labeled
// 'cheated run' not segmented."
//
// EVERY GESTURE IN THE TABLE IS REACHABLE HEADLESSLY, which was not obvious and
// is the reason this file exists rather than a note saying "test by hand":
//
//   noclip      an engine command; the watcher reads the MOVETYPE, not the verb
//   setpos      the QC's own, and it takes its arguments on the command line
//   sv_cheats   a cvar, so `sv_cheats 1` is one line and the watcher is a level
//   save-lock   `cmd sl_save` / `cmd sl_load` / `cmd sl_hold` / `cmd sl_holdoff`
//               are four separate client commands (sv_player.qc:627-636), one
//               per action precisely so a key cannot send the wrong verb -- which
//               is also what makes them typeable
//
// bhop_eazy AND THE PLAYER WALKS.  zone_goto drops you on the box FLOOR (the
// `no declared destination` branch), so +forward in MOVETYPE_WALK genuinely
// walks out of the start box and starts a CLEAN run -- which no earlier testrun
// config has ever produced.  It is the control every case below is measured
// against: without one clean run in the log, "this reads cheated" proves nothing.
//
// READ THIS TRACE BY THE STRINGCMD ORDER, NOT BY THE ECHOES.  A local `echo`
// runs in the client console immediately while `cmd timer` is queued and sent on
// the next outgoing packet, so the echoes drift AHEAD of the replies by a block.
// `cmd viewpos` is itself a stringcmd, stays in order with `cmd timer`, and
// prints as `setpos x y z pitch yaw roll` -- that is the marker to read.

log_enable 1
log_dir "logs"
log_name "b44class"
developer 1
log_developer 1
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0

// NOT sv_cheats 1 at the top, unlike every other testrun config in this folder.
// This build makes that cvar a taint, so the usual boilerplate would mark every
// run in the file cheated before it started and the control case would be gone.
sv_cheats 0

wait 200
echo ^5=== b44class: bhop_eazy ===
map bhop_eazy
waitmap 1800
waitms 2500

// ---------------------------------------------------------------------------
// 1. THE CVARS EXIST AND CARRY THEIR DEFAULTS.
//
// The registercvar trap SV_TimerMapInit's essay is about: StartFrame reaches
// that function BEFORE worldspawn, reading an unregistered cvar in FTE creates
// it as the EMPTY STRING, and registercvar then declines to overwrite it.  An
// empty value here is the failure, and it would leave the whole feature off with
// `(default)` printed beside it.
// ---------------------------------------------------------------------------
echo ^5=== b44class: the two cvars ===
run_class
run_cheatwatch

// ---------------------------------------------------------------------------
// 2. THE CONTROL.  Arm clean, walk out clean.
//
// EXPECT: `class: clean (seg 0 cheat 0 cheatlatch 0)` and `cheats now 0` while
// armed, and the same after the clock starts.  If this row is not clean the rest
// of the file measures nothing.
// ---------------------------------------------------------------------------
echo ^5=== b44class: armed, clean ===
cmd zone_goto 0 16.18 0
waitms 700
cmd viewpos
cmd timer

echo ^5=== b44class: walking out -- expect a CLEAN running run ===
+forward
waitms 2200
-forward
waitms 400
cmd viewpos
cmd timer

// ---------------------------------------------------------------------------
// 3. THE SAVE-LOCK HOLD.  A stitch, and it is the one genuinely new taint.
//
// Before build 44 a hold froze the clock and left the run rankable.  EXPECT a
// `^3segmented run` line on screen, `class: segmented (seg 1 ...)`, and `held`
// under the timer -- and the RUN CLOCK UNCHANGED across the hold, which is what
// the freeze has always done and must keep doing.
// ---------------------------------------------------------------------------
echo ^5=== b44class: save, then hold -- expect SEGMENTED ===
cmd sl_save
waitms 400
cmd sl_hold
waitms 900
cmd viewpos
cmd timer
cmd sl_holdoff
waitms 400
cmd viewpos
cmd timer

// ...and a LOAD, which is the other stitch.  No second message: the class is
// already segmented and the print fires on an UPGRADE, not on every gesture.
// TF_SHADOW joins it here, because the clock came out of the save as well.
echo ^5=== b44class: load -- expect segmented + shadow, and NO second print ===
cmd sl_load
waitms 900
cmd viewpos
cmd timer

// ---------------------------------------------------------------------------
// 4. THE UPGRADE.  Segmented, then noclip.
//
// This is the case the build-43 print could not report: the umbrella was already
// up, so a run going from `segmented` to `cheated` said nothing.  EXPECT a
// SECOND line, `^3cheated run`, and the class moving to cheated with BOTH bits
// set -- seg 1 cheat 1 -- which is exactly the run FS_RunClass's precedence
// exists for.
// ---------------------------------------------------------------------------
echo ^5=== b44class: noclip on a segmented run -- expect an UPGRADE to cheated ===
noclip
waitms 700
cmd viewpos
cmd timer

// ---------------------------------------------------------------------------
// 4b. AND THE LAUNDER THAT MUST NOT WORK.
//
// The save in step 3 was taken while the run was CLEAN, and SV_SaveApplyState
// restores run_t_flags out of the file -- so loading it now would wipe the
// TF_CHEAT that the noclip above just set and finish the run labelled
// `segmented`.  A load rewinds the clock; it does not rewind your hands.
//
// EXPECT: still `class: cheated`, and NO fourth message -- the class did not get
// worse, it merely failed to get better, and the line reports upgrades only.
//
// Three gestures in an order nobody writes down, which is why it is in the file.
// ---------------------------------------------------------------------------
echo ^5=== b44class: load a CLEAN save after cheating -- expect STILL cheated ===
cmd sl_load
waitms 900
cmd viewpos
cmd timer

// ---------------------------------------------------------------------------
// 5. THE FINISH, so the header can be read back off disk.
//
// A cheated run is still WRITTEN -- the class only decides whether it ranks --
// so this lands in data/runs/bhop_eazy/main/last.rec with `flags 385`
// (practice|shadow|segment|cheat).  tools/reccheck.py then reads it, which is
// the point of finishing at all: every assertion above is about a live field and
// this is the only one about the file.
//
// Re-aimed first: step 2 left the view on the start->stage heading and +forward
// in noclip flies along the VIEW vector.  -66.46 is the here->end bearing that
// build 43's zone_list measurement worked out.
// ---------------------------------------------------------------------------
setpos 1800 200 144 0 -66.46 0
waitms 600
echo ^5=== b44class: flying to the end ===
+forward
waitms 7000
cmd viewpos
cmd timer
waitms 3000
-forward
cmd viewpos
cmd timer

echo ^5=== b44class: done ===
waitms 600
quit
