// BUILD 24 stage 1b -- .rec v4 actually WRITES the board telemetry.
//
// The three panels build 23 refused to draw needed a ramp contact and a pre-clip
// velocity that the file did not carry.  v4 carries them, and this proves the
// WRITER: seventeen columns per sample, a reserved `flags` header line, and a
// plane that is a unit vector whenever the flags say there is one.
//
// A CONFIG CANNOT FINISH A RUN ON A SURF MAP, so SV_RecClose never fires here
// and no archived .rec is produced.  What it CAN do is take a save state, and a
// save state writes the recording's PREFIX to disk with buf_writefile -- the
// same buffer, the same header, the same sample lines.  So the file this leaves
// at data/saves/<map>/save01/run.rec is a real v4 recording that stops early,
// which is exactly what reccheck.py's is_prefix() case exists for.
//
// What this therefore does NOT prove and b24d cannot either: the `flags` header
// line being REWRITTEN at close, which needs a finished run.  Stated rather than
// implied -- the read-back check in SV_RecClose refuses rather than corrupts if
// the index is ever wrong, so the failure mode is a missing flag and not a
// broken header, but that is a design property and not a measurement.
//
// `wait 200` BEFORE `map` is not optional -- exec INSERTS its text at the front
// of the command buffer, so a waitmap with no wait ahead of it blocks the very
// buffer the map load is queued in.

developer 1
log_developer 1
cfg_save_auto 0

wait 200
map surf_aesthetic
waitmap 90

// A CONSOLE +forward IS NOT ENOUGH ON THIS MAP, and the first cut of this
// config lost a launch to finding out.  surf_aesthetic's start box runs a long
// way in the direction zone_goto's teleDest faces: 3.2 seconds of walking moved
// the player 304 units and left `arm zone 0` still set, so the clock never
// started and every sl_save reported "no run".
//
// setpos is the reliable way out of it, and build 24 is exactly the build that
// made it usable for this -- it marks the attempt PRACTICE and keeps the clock
// instead of voiding the run.  A practice run is still recorded (SV_TimerFinish's
// own comment: "the only thing the flag decides is whether it is a personal
// best"), so the buffer this leaves behind is a real v4 recording.
// Whatever a previous run of this config left behind, through the game's own
// delete rather than from outside it -- sl_del removes all four files of a slot
// (build 20 added seq.txt to that list), and an orphan pairing with a fresh
// state.txt is a failure that looks exactly like it worked.
echo "=== B24C: clear any slots this config left last time ==="
cmd sl_dellast
wait 10
cmd sl_dellast
wait 10
cmd sl_dellast
wait 10
cmd sl_list

echo "=== B24C: arm in the start box ==="
cmd zone_goto 0
wait 40
cmd timer

// -15200 200 1100 is over a pit: the run starts (the player leaves the start
// zone airborne, the clock runs, the recorder opens and the pre-start ring is
// flushed into it) and then the map's own fall-off teleport puts them back in
// the start box about a second later, where SV_TimerTryArm cancels it.
//
// THAT WINDOW IS THE TEST.  A save taken inside it writes the live buffer's
// prefix -- which by then holds the whole padding ring plus every sample since
// the clock started -- so the file on disk is a real v4 recording with samples
// from BOTH writers: SV_RecOpen's ring flush (rec_pad_norm) and the per-tick
// SV_RecLine.  Waiting for the walk, as the first cut of this config did, lets
// the teleport cancel the run first and every save then reports "no run".
echo "=== B24C: out of the box with setpos, which starts the clock ==="
setpos -15200 200 1100
wait 25
cmd timer
cmd sl_save
wait 25
cmd sl_list

echo "=== B24C: and again, for a second prefix to compare against ==="
cmd zone_goto 0
wait 40
setpos -15200 -200 1100
wait 25
cmd timer
cmd sl_save
wait 25
cmd sl_list
cmd timer

echo "=== B24C: the scoreboard's own view of the same disk ==="
scores open
scores
wait 20

echo "=== B24C: regression ==="
pm_selftest
zone_selftest

echo "=== B24C: done ==="
wait 30
quit
