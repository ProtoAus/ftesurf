cfg_save_auto 0
// Patch 296 -- SHIPPED-DEFAULTS smoke test.  Deliberately sets NONE of the
// patch's cvars: the point is to check what a player actually gets, not what a
// cfg can force.  Two maps, different from each other, so both are real loads.
//
// PREDICTIONS, from the p294g arms that DID force them:
//   surf_boreas  : props 1587 of 1587, mean 31.8 32.7 34.0   (curve 1 = new default)
//   surf_fantasy : props 2345 of 2345, mean 78.3 80.3 67.2   (vhv12 1 + curve 1 = new defaults)
// If either differs, the default in VBSP_LoadPropBakedLight and the one at the
// registration block disagree -- which is the exact failure the two-site comment
// in that file warns about.
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000
wait 200

developer 1
log_developer 1
log_enable 1
log_dir logs
log_name p296_defaults
cl_maxfps 0
cl_idlefps 0
sv_cheats 1
con_notifylines 0
con_notifytime 0.01
r_texdiag 1

echo ^5=== p296 DEFAULTS: surf_boreas -- expect 1587 of 1587, mean 31.8 32.7 34.0
map surf_boreas
waitmap 600
waitms 9000
waitms 3000
echo ^5--- cvar readback ---
hl2_lt_vhv12
hl2_lt_baked_curve
hl2_lt_baked_dir
r_sky_forcedepth

echo ^5=== p296 DEFAULTS: surf_fantasy -- expect 2345 of 2345, mean 78.3 80.3 67.2
map surf_fantasy
waitmap 600
waitms 9000
waitms 3000

echo ^5=== END OF RUN ===
waitms 500
quit
