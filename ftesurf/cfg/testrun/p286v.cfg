// FTESurf p286v -- verify what is actually DEPLOYED: engine patch 286 (the
// combine-shield flipbook) and QC build 54 (env_lightglow, the buried-glare fix,
// and the entity inspector).  Patch 288's colour correction is NOT in these
// binaries and is not tested here.
//
// FIVE THINGS, and each one has a stated failure as well as a stated pass,
// because "it looks different" is worth nothing without the arm that reproduces
// the old behaviour at the same vantage.
//
//   1  THE FLIPBOOK (286).  comshieldwall.vtf is 31 frames and its proxy picks
//      one by distance: clamp(dist*0.2 - 24, 0, 30), so frame 0 inside 120 units
//      and frame 30 beyond 270.  Four distances from the spawn portal's own
//      plate (func_brush *19, origin -11776 -10816 13744, a 96 x 8 x 128 plate,
//      so its near face is at y = -10820), with hl2_twoframes 1 and 0.
//      PASS: the web gets DENSER as you approach at 1, and is identical at all
//            four distances at 0.
//      FAIL: the two arms are pixel-identical -- then #FRAMES never applied and
//            the material took the old two-sampler arm.
//
//   2  THE BURIED GLARE (QC 54).  That same func_brush is the clean case: the
//      glow sits at its exact geometric centre, the plate is 8 thick in Y, and
//      the trace backed off 4 units landed precisely on the plane, so it could
//      never be visible from any angle.  The shots in 1 are the shots for this.
//      PASS: a glare on the portal at all.  The count is in the log.
//
//   3  env_lightglow (QC 54).  166 on this map, all HorizontalGlowSize 65 /
//      VerticalGlowSize 35 -- a 1.857:1 stretch, which is the reported "looks
//      like a lens flare almost".  The pair at (-12216,-11264,13840) and
//      (-11336,-11264,13840) face each OTHER (angles 0 0 0 and 0 180 0), so a
//      vantage between them in X and south of them in Y sees both, at 1791 units
//      -- inside MinDist 500 / MaxDist 2500, so fade is about .65.
//      PASS: two flares, visibly WIDER THAN TALL, that vanish at
//            vbsp_lightglow 0 and come back at 1.
//      FAIL: round flares -- the two sizes did not reach the quad.
//
//   4  THE INSPECTOR (QC 54).  ent_here at the portal must report func_brush and
//      *19; at the teleport pad it must report trigger_teleport.  ent_view draws
//      the volumes.  This is the feature whose whole point is being able to
//      report the next bug correctly, so it is checked by pointing at two things
//      whose right answer is known from the entity lump.
//
//   5  THE DARK BRUSHWORK (report 5, diagnostic only, no fix).  save006's own
//      vantage with r_texdiag 1.  Ray-casting it against every submodel bbox hit
//      NOTHING but worldspawn within 4000 units and the nearest faces carry
//      styles [0,255,255,255], so it is world geometry and not a lightstyle.
//      What is wanted is the per-model shift/overbright pair and the LUX mean:
//      shift and overbright disagreeing between the world and a submodel is a
//      factor of four and would look exactly like this.
cfg_save_auto 0
exec cfg/testrun/_quiet.cfg
developer 1
log_developer 1
log_dir "logs"
log_name "p286v"
scr_sshot_type png
cl_yieldcpu 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0

waitms 2500

map surf_tensor2
waitmap 240
waitms 8000
sv_cheats 1
noclip
waitms 500

// ---------------------------------------------------- 3: env_lightglow, on
echo "@@@ P286V lightglow ON -- expect two WIDE flares at 1791 units"
vbsp_lightglow 1
waitms 1500
setpos -11776 -13000 13800 0 90 0
waitms 2500
screenshot_mega p286v_glow_on 1280 720
waitms 800

echo "@@@ P286V lightglow OFF -- both flares must disappear"
vbsp_lightglow 0
waitms 1500
setpos -11776 -13000 13800 0 90 0
waitms 2500
screenshot_mega p286v_glow_off 1280 720
waitms 800

echo "@@@ P286V lightglow ON again -- reproduce on demand"
vbsp_lightglow 1
waitms 1500
setpos -11776 -13000 13800 0 90 0
waitms 2500
screenshot_mega p286v_glow_on2 1280 720
waitms 800

// ---------------------------------------------------- 1+2: the shield, frames ON
echo "@@@ P286V shield hl2_twoframes 1 -- the web must get DENSER as we approach"
hl2_twoframes 1
waitms 1000
setpos -11776 -11820 13744 0 90 0
waitms 2000
screenshot_mega p286v_frames1_d1000 1280 720
waitms 600
setpos -11776 -11420 13744 0 90 0
waitms 1500
screenshot_mega p286v_frames1_d600 1280 720
waitms 600
setpos -11776 -11020 13744 0 90 0
waitms 1500
screenshot_mega p286v_frames1_d200 1280 720
waitms 600
setpos -11776 -10890 13744 0 90 0
waitms 1500
screenshot_mega p286v_frames1_d70 1280 720
waitms 600

// ---------------------------------------------------- 1: the shield, frames OFF
echo "@@@ P286V shield hl2_twoframes 0 -- frame 0 at every distance"
hl2_twoframes 0
waitms 1000
setpos -11776 -11820 13744 0 90 0
waitms 2000
screenshot_mega p286v_frames0_d1000 1280 720
waitms 600
setpos -11776 -11420 13744 0 90 0
waitms 1500
screenshot_mega p286v_frames0_d600 1280 720
waitms 600
setpos -11776 -11020 13744 0 90 0
waitms 1500
screenshot_mega p286v_frames0_d200 1280 720
waitms 600
setpos -11776 -10890 13744 0 90 0
waitms 1500
screenshot_mega p286v_frames0_d70 1280 720
waitms 600
hl2_twoframes 1
waitms 800

// ---------------------------------------------------- 4: the inspector
echo "@@@ P286V ent_here at the spawn portal -- expect func_brush *19"
setpos -11776 -11020 13744 0 90 0
waitms 1500
ent_here
waitms 1200
ent_view 1
waitms 1500
screenshot_mega p286v_entview_portal 1280 720
waitms 800
ent_view 0
waitms 500

echo "@@@ P286V ent_here at a teleport pad -- expect trigger_teleport"
setpos -11776 -13000 13700 20 90 0
waitms 1500
ent_here
waitms 1200

// ---------------------------------------------------- 5: the dark brushwork
echo "@@@ P286V save006 vantage, r_texdiag 1 -- read shift/overbright and LUX"
setpos -10727 10046 -9831 -2.4 89.8 0
waitms 2500
screenshot_mega p286v_dark_before 1280 720
waitms 800
r_texdiag 1
waitms 2500
setpos -10727 10046 -9831 -2.4 89.8 0
waitms 2000
screenshot_mega p286v_dark_texdiag 1280 720
waitms 1500
r_texdiag 0

echo "@@@ P286V DONE"
waitms 1200
quit
