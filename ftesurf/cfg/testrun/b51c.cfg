// b51c -- WHY does particles/ftesurf.cfg parse and still not resolve.
//
// State after b51b: cl_emit.qc's localcmd exec DOES run ("execing
// particles/ftesurf.cfg" three times), and the particle system builds
// ftesurf_dot_blend / ftesurf_dot_add shaders from it -- which it can only do
// from a parsed r_part block whose texname is ftesurf_dot, and that string
// exists nowhere else in the gamedir.  So types are being created.
//
// And yet particleeffectquery on ftesurf_dustmote_0 returns "".
// PScript_FindParticleType's dotless arm (p_script.c:649-660) walks every type
// comparing part_type[i].name, so the only ways to miss are: the name is not
// what we think, or loaded == 0.
//
// THE DISCRIMINATOR.  Run the identical exec from three places and see which
// resolve:
//   1  as it is now: CSQC localcmd, RESTRICT_INSECURE, at map load
//   2  console exec, RESTRICT_LOCAL, mid-map, renderer long since up
//   3  the engine's own dump of every effect it holds
// If 2 resolves and 1 does not, the fault is the exec LEVEL or the cbuf the
// block body is read from (P_ParticleEffect_f reads it with
// Cbuf_GetNext(Cmd_ExecLevel), p_script.c:1130).
// If neither resolves, the file is being rejected and the dump says how.

log_dir  "logs"
log_name "b51c"
log_enable 1

developer 2
log_developer 1
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000
cl_maxfps 0
cl_idlefps 0
cl_yieldcpu 0
sv_cheats 1

map surf_anubis
waitmap 600
waitms 8000
noclip
waitms 1000
setpos -307 -558 -5184 0 90 0
waitms 4000

echo ^5=== 1  AFTER the CSQC localcmd exec (insecure, at map load)
emit_test dustmote_0 100
waitms 1500
r_partinfo
waitms 1000

echo ^5=== 2  now exec the SAME file from the console at RESTRICT_LOCAL
exec particles/ftesurf.cfg
waitms 2000
echo ^5=== 2b  and ask again
emit_test dustmote_0 400
waitms 1500
r_partinfo
waitms 1000
screenshot b51c_after_x
waitms 1000
screenshot b51c_after
waitms 1000

echo ^5=== 3  the engine's own dump of every effect it holds
r_exportalleffects
waitms 2000

echo ^5=== END ===
waitms 500
quit
