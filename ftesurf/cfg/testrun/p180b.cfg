// FTESurf Patch 180 measurement, arm B: the FIX.
// Identical to p176a.cfg except fs_maploadhash 1, so the only difference between the
// two logs is the one COM_FlushFSCache added after COM_FlushTempoaryPacks.
fs_loadstats 1
fs_maploadhash 1
developer 0
waitms 4000
echo "=== P180 ARM B (fs_maploadhash 1) ==="
echo "--- cold: surf_utopia ---"
map surf_utopia
waitms 25000
echo "--- warm: surf_tensor2 ---"
map surf_tensor2
waitms 25000
echo "=== ARM B DONE ==="
waitms 1000
quit
