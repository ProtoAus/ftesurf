// FTESurf build 22 -- the consent gate, and the gamecode's begin/end edges.
//
// TWO ARMS, and arm A is the one that matters.  The terms screen is only the
// visible half of a consent gate; the half that does real work is that somebody
// who has never seen it IS NOT RECORDED.  So arm A runs with no acceptance on
// disk and must produce a run with NO journal at all -- not a journal that is
// thrown away later, none started.
//
// HOW ARM B GETS PAST THE GATE, stated plainly because it matters.  It sets the
// rec_terms MIRROR cvar directly.  It does NOT write data/consent.txt, so no
// consent record is forged and nothing here claims a person agreed to anything;
// this exercises the code path the menu's accept button would enable.  The menu
// button itself needs a real click and is not tested here.
//
// HOW THE EDGES ARE OBSERVED WITHOUT FINISHING A RUN.  A config cannot surf, so
// a scripted run never crosses an end zone and never becomes a PB -- and
// Rec_HidEnd writes only for a PB.  Two things close that gap:
//
//   * the BEGIN edge is proved by closing the gamecode's own journal from the
//     console mid-run, into a file.  If Rec_HidBegin never ran there is nothing
//     to close and in_journal_end says so; if it did, the file exists, carries
//     the right map, a real movesequence range, and any save/load marks.
//   * the END edge is proved by the discard print.  A non-PB run makes
//     Rec_HidEnd issue a bare in_journal_end, which now prints what it threw
//     away -- the only way a discard can be seen at all, since it leaves no file.
//
// The two are tested in that order and in separate runs, because closing the
// journal by hand is exactly what stops the end edge from having one to discard.

cfg_save_auto 0
log_name b22c
developer 1
log_developer 1
con_notifytime 0
pm_autobunny 1

// ===========================================================================
echo "=========== ARM A -- no consent on disk ==========="
// ===========================================================================
wait 200
map surf_666
waitmap 60
waitms 500

echo "--- A0: rec_terms must be 0, and rec_hid 1 (on, but gated) ---"
rec_terms
rec_hid
waitms 400

cmd zone_goto 0
waitms 900
+back
waitms 1600
-back
waitms 600

echo "--- A1: the run is going ---"
cmd timer
waitms 700

echo "--- A2: expect 'no journal open' -- Rec_HidBegin must not have run ---"
in_journal_end data/runs/b22c-A.hid
waitms 500

// ===========================================================================
echo "=========== ARM B -- rec_terms 1, the BEGIN edge ==========="
// ===========================================================================
map surf_666
waitmap 60
waitms 500

set rec_terms 1
waitms 200

echo "--- B0: rec_terms must be 1 ---"
rec_terms
waitms 400

cmd zone_goto 0
waitms 900
+back
waitms 1600
-back
waitms 600

echo "--- B1: the run is going, and a journal should be open ---"
cmd timer
waitms 700

echo "--- B2: a save and a load mid-run, for the '#' marks ---"
cmd sl_save
waitms 700
cmd sl_load
waitms 900

echo "--- B3: close it by hand.  Expect a real file with map/marks/seq ---"
in_journal_end data/runs/b22c-B.hid
waitms 500

// ===========================================================================
echo "=========== ARM C -- rec_terms 1, the END edge ==========="
// ===========================================================================
map surf_666
waitmap 60
waitms 500

echo "--- C0: rec_terms survives the map change? ---"
rec_terms
waitms 300

cmd zone_goto 0
waitms 900
+back
waitms 1600
-back
waitms 800

echo "--- C1: running, journal open, nothing touched by hand ---"
cmd timer
waitms 700

echo "--- C2: void the run.  Expect 'in_journal_end: discarded, N events' ---"
// zone_reset is the console alias for the `!r` chat command (sv_player.qc:600);
// a config cannot type into chat.
cmd zone_reset
waitms 1200
cmd timer
waitms 700

echo "--- C3: and now there is nothing left to close ---"
in_journal_end data/runs/b22c-C.hid
waitms 500

echo "--- C4: the save state the B arm wrote, so it can be cleaned up ---"
cmd sl_list
waitms 600

echo "=========== done ==========="
waitms 400
quit
