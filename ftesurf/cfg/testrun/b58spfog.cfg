// FTESurf b58spfog -- does the 2D fog bug ALSO explain the light sprites?
//
// Lex asked "r_fog_progless 0 fixed the glow issue??"  I do not know, and this
// config exists because I nearly answered from the mechanism instead of from a
// measurement.  b58fog.cfg -- the run that proved the fog term on 2D text -- had
// vbsp_sprites 0 and vbsp_lightglow_scale 0.  THE SPRITES WERE MUTED IN THE ONLY
// RUN THAT TESTED THE FIX.  So the sprite half is, as of now, predicted and not
// observed, and predicted-not-observed has been wrong twice today already.
//
// WHAT THE MECHANISM PREDICTS, so it can fail:
// light_glow02/03 are UnlitGeneric, so their shader has no top-level program, so
// they enter BE_ProglessFogBegin in the SCENE pass exactly as the 2D quads did.
// Fixed-function fog mixes toward GL_FOG_COLOR on RGB only.  On an additive
// gl_one/gl_one pass a texel that should contribute nothing -- black, which is
// the ONLY mask these textures have, being BGR888 with no alpha channel -- comes
// out as (6,9,13) and is then ADDED.  The whole quad therefore glows faintly
// blue instead of masking, which is "showing the whole texture square where parts
// should be transparent" verbatim.
//
// NOTE WHAT THIS MEANS FOR THE SHIPPED FIX: Patch 296 guards force2d, and a
// scene-pass sprite is NOT force2d.  So if this run shows the sprites improving
// under r_fog_progless 0, then PATCH 296 DOES NOT FIX THIS HALF and the glows
// will still be wrong after it deploys.  That is the single most important thing
// this config can tell anyone.
//
// AND WHY r_fog_progless 0 STILL MUST NOT BE THE DEFAULT even if it "works":
// it disables program-less fog everywhere, including legitimate world fog, and
// re-breaks the surf_boreas cloud layers that Patch 266 exists for.  The real fix
// for this half is GL_FOG_COLOR forced black on additive passes, which needs a
// boreas control arm before it ships.
//
// vbsp_lightglow_scale is set to 1 here, NOT the 10 saved in Lex's ftesurf.cfg.
// At 10 this vantage reads luma 238 -- a white-out that cannot show a (6,9,13)
// difference -- which is exactly how nine arms of b58box were wasted.
//
// RUN AGAINST THE ARCHIVED PRE-296 BINARY (md5 331B51AC03BD), because the bug has
// to be present for the A/B to mean anything, and the live exe is about to be
// overwritten by the fix.
//
// PASS: the translucent rectangles are visibly weaker or gone in B and back in C.
// FAIL: no change -- then the sprite half is a different bug and the additive-pass
//       follow-up is chasing the wrong thing.
cfg_save_auto 0
exec cfg/testrun/_quiet.cfg
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "b58spfog"
scr_sshot_type png
cl_yieldcpu 0
vid_vsync 0
crosshair 0
fov 100
con_notifylines 0
con_notifytime 0.01
cl_maxfps 100

waitms 2500
map surf_tensor2
waitmap 240
waitms 8000
sv_cheats 1
noclip
waitms 500

// Sprites and glows ON, at the value that matches Source rather than his saved 10.
vbsp_sprites 1
vbsp_lightglow 1
vbsp_lightglow_scale 1
vbsp_sprite_source 1
r_renderscale 2
show_fps 1

// His own worst vantage: two 2304-unit sprites at ~2900 units plus 24 flares, and
// a dark wall behind them to read a faint additive lift against.
setpos -10688.5 -1773.8 -8587.1 6.3 91.1 0
waitms 6000

echo "@@@ B58SPFOG A. r_fog_progless 1 -- the shipped default, bug present"
r_fog_progless 1
waitms 2000
screenshot b58sf_A_x
waitms 1000
screenshot b58sf_A
waitms 1000
screenshot b58sf_A_ctl
waitms 1000

echo "@@@ B58SPFOG B. r_fog_progless 0"
r_fog_progless 0
waitms 2000
screenshot b58sf_B_x
waitms 1000
screenshot b58sf_B
waitms 1000

echo "@@@ B58SPFOG C. back to 1 -- must match A"
r_fog_progless 1
waitms 2000
screenshot b58sf_C_x
waitms 1000
screenshot b58sf_C
waitms 1000

echo "@@@ B58SPFOG DONE"
waitms 1200
quit
