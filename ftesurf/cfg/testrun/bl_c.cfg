// BL_C -- bhop_24: ZERO bumped faces, 6805 of 9046 lit faces off the grid.
//   ftesurf64.exe +set vid_fullscreen 0 +set log_dir logs +set log_name bl_c +exec cfg/testrun/bl_c.cfg
//   ftesurf64.exe +set vid_fullscreen 0 +set log_dir logs +set log_name bl_c0 +set hl2_lightmap_repack 0 +exec cfg/testrun/bl_c.cfg   (run first, rename bl_c_*.png to bl_c0_*)
log_enable 1
log_dir "logs"
developer 1
log_developer 1
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 0
con_notifytime 0
con_notifylines 0
con_notifytime_error 0
sv_cheats 1
r_texdiag 1
r_novis 1
r_lightmap 0
wait 200
echo ^5=== bl_c: bhop_24 ===
map bhop_24
waitmap 2400
waitms 9000
noclip
// V1: info_player_terrorist 1064 -128 779.558 angles 0 0 0
setpos 1064 -128 779.558 0 0 0
waitms 2500
cmd viewpos
screenshot bl_c_x
waitms 700
screenshot bl_c_1_spawn
waitms 700
// V2: ECEL/ECEL_CRETEFLOOR03B floor faces at z=-3000 sharing the edge y=2576 (x -528..-32), both 1056 luxels; camera 600 above, pitch 89 yaw 180 (+y is screen-right).
//   LEFT  face 5501  y 2080..2576  lightofs 3662613 (off the grid by 1)  predicted 96% exact zero
//   RIGHT face 5503  y 2576..3072  lightofs 3668396 (aligned)            predicted lit
setpos -280 2576 -2400 89 180 0
waitms 2500
cmd viewpos
screenshot bl_c_x
waitms 700
screenshot bl_c_2_floor
waitms 700
r_lightmap 1
waitms 700
screenshot bl_c_x
waitms 700
screenshot bl_c_3_floor_lm
r_lightmap 0
waitms 700
hl2_missing
r_showshader ECEL/ECEL_CRETEFLOOR03B
r_shaderpasses ECEL/ECEL_CRETEFLOOR03B
waitms 1000
quit
