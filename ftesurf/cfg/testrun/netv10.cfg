// NETV10 -- does cl_netfps 100 really produce 10 ms usercmds and the 0,1,1 tick
// cycle?  Paired with netv15.cfg, which is the same file with one number changed.
//
// The .rec files already on disk say it does (surf_rise/main/last.rec and
// surf_garden/stage_1/0000416_pb.rec are both 10.0 ms packets and both read
// 011011011...), but those were recorded under an unknown config on an unknown
// build.  This pair reproduces it deliberately, on the current build, with only
// cl_netfps differing.
//
// bhop_eazy, walk out of the start box, hold forward, save-lock.  sl_save is what
// writes run.rec outside of a finished run, so nothing is ever finished and
// data/runs stays untouched.  ONE save is created, under
// data/saves/bhop_eazy/, and the caller deletes it -- as b46cheat.cfg's header
// requires of anything that uses this trick.
//
// cl_maxfps 333 in BOTH arms: 3 ms frames divide both 10 and 15 exactly, so the
// command interval is the threshold itself and not a frame-grid rounding of it.
// That keeps the only difference between the two files the one under test.

log_enable 1
log_dir "logs"
log_name "netv10"
developer 0
log_developer 0
cfg_save_auto 0
sv_cheats 0
fs_missingwarn 0
cl_idlefps 0
vid_fullscreen 0
con_notifylines 0
scr_conalpha 0

cl_maxfps 333
cl_netfps 100

wait 200
map bhop_eazy
waitmap 1800
waitms 2500

echo ^5=== netv10: cl_netfps 100, walking ===
cl_netfps
cmd zone_goto 0 16.18 0
waitms 900
+forward
waitms 4000
-forward
waitms 500
cmd sl_save
waitms 1200

echo ^5=== netv10: done ===
waitms 500
quit
