// Build 66, THE LEDGER DEPLOY: does the new finish path fault on the real
// binary, with the real gamedir?
//
// WHAT THIS CAN AND CANNOT PROVE, stated up front because the gap is the whole
// reason this file needs a header.
//
// The change adds three things to the finish: SV_RecClose now takes the
// recorder's own byte offset and latches rec_rec_saved, SV_RecKeptLeaf rebuilds
// the recording's basename, and Lobby_SubmitRun carries it to surfd.  Only the
// first two are reachable here.
//
//   REACHED.  SV_RecKeptLeaf is evaluated as an ARGUMENT at the call site, so
//   it runs on every finish whatever Lobby_SubmitRun then decides to do with
//   it.  So does the new fseek, so do the four reset sites.  That is the whole
//   crash surface of this change, and a QC fault on a finish would take a
//   public lobby down -- which is why it is worth a flight rather than an
//   argument.
//
//   NOT REACHED.  The submission itself.  This server deliberately does NOT
//   exec cfg/lobby_local.cfg, so it holds no master key and Lobby_SubmitRun
//   returns at its second gate.  That keeps this process off /lobbies.json --
//   without the key it cannot heartbeat, so it can never appear as a phantom
//   lobby beside the five real ones.  The cost is that the ledger row is not
//   exercised here.
//
//   AND CANNOT BE REACHED FROM A CONFIG AT ALL.  The only way a script crosses
//   an end zone is a noclip flight, TF_CHEAT beats every other tag, and
//   FS_TagArchived(RT_CHEAT) is FALSE -- so this finish takes the UNSTAMPED
//   name `<who>_cheat.rec`, SV_RecKeptLeaf correctly returns "", and surfd
//   would answer 204 even if the key were here.  Proving a row lands in
//   `replays` needs a CLEAN finish, which needs a person.  That is stated in
//   the report rather than faked here.
//
// PREDICTION:
//   server log   `timer: streamed data/runs/bhop_eazy/main/<who>_cheat.rec`
//                with a who segment, and NO QC error anywhere
//   cmd timer    reports the finish; `recorder: buffer -1 (stream would be 1)`
//   client       no .view written here (the server's disk is not this one)
//
// FALSIFIED IF: any "QC" / "PR_ExecuteProgram" / "runaway" line appears; or the
// finish produces no file; or the file has no player segment.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name b66led
log_developer 1
developer 1

cl_sendguid 1
name "^3Lex Ledger"

waitms 4000
echo ^5==== b66led: connecting ====
connect 192.168.1.102:27599

// Long: the first connect to a server whose csprogs this client has not seen
// downloads it in ~2,700 chunks, which ate a whole run budget once already.
waitms 95000

echo ^5==== b66led: connected ====
cmd timer
waitms 2000

// The b66pi flight, unchanged: zone_goto arms in the start box, setpos pins the
// heading only, noclip makes it continuous so the end zone is swept for real.
// Every wait is a real network round trip, so none of them is padding.
cmd zone_goto 0
waitms 2500
setpos -352 -352 144 0 335.3 0
waitms 2500
noclip
waitms 1500
+forward
waitms 9000
cmd timer
waitms 9000
-forward
waitms 2500

echo ^5==== b66led: after the end zone ====
cmd timer
waitms 3000

echo ^5==== b66led: done ====
quit
