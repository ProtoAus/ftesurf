cfg_save_auto 0
// BUILD 58 -- FALSIFIER for "no journal, no rank" (TF_NOJOURNAL, bit 512).
//
// THE CLAIM: the SERVER now knows, and records, whether the client was taking a
// raw input journal for this run.  Until build 58 the only record of `rec_hid 0`
// was the `hid` key in the .view header -- a file written by the client, i.e. by
// the same party that turned the journal off.
//
// PRE-REGISTERED, and it is two words in one report line:
//   ARM A  (+set rec_hid 1)   `journal: said "1"  nojournal 0`
//   ARM B  (+set rec_hid 0)   `journal: said "0"  nojournal 1`
// Both read AFTER the clock is running, because SV_TimerJournal latches at
// SV_TimerStart.  The line before the walk is printed too, and in BOTH arms it
// must read `nojournal 0` -- an armed-but-not-started attempt has not been
// stamped yet, and a bit that appeared there would mean the latch is firing
// somewhere other than where it is documented to.
//
// A FAILED ARM A IS THE SERIOUS ONE.  `nojournal 1` on a journalled run means
// the server is stamping runs that have perfectly good evidence beside them --
// a false statement about a player on that player's own screen, which is the
// one failure mode this feature may not have.  See TF_NOJOURNAL's essay.
//
// WHY THERE IS NO FINISH HERE, after three attempts at driving one.  A finish
// cannot be scripted on this map:
//   * `cmd zone_goto <stage>` does not PASS a stage -- it teleports to that
//     stage's own start box and ARMS A STAGE RUN there, discarding the main run
//     (`armed ... stagerun 1 startseg 1 leg 2` in the log).
//   * Teleporting straight into an end box does not finish either: setpos and
//     zone_goto both go through SV_TimerWarped, which VOIDS the attempt.  The
//     log shows `event zone 4` and the timer going to `idle`, not finished.
//     Arrivals fire point-tested events; a finish is swept, and a warp has no
//     sweep.  So an end box has to be WALKED into.
//   * Walking it is ~9000 units of route on main, and the bonus lane -- which
//     needs no intermediate checkpoints -- has a wall at the north edge of its
//     start box, so `+forward` from the arm point travels 104 units and stops.
// None of that is a fault in the patch, and chasing it further would only be
// testing the harness.  The report line is read instead, which is where the bit
// is set; that it then reaches the .rec is SV_RecClose's existing path, shared
// with TF_GHOST, and its mask strips only TF_RECORDING and TF_FROZEN.
//
// rec_hid comes from the COMMAND LINE (+set rec_hid N), not from a line in here.
// Rec_ViewInit calls registercvar("rec_hid", "1"), and registercvar declines to
// overwrite a cvar that already exists -- so a +set on the launch line survives
// it, while a `rec_hid 0` written here would be fighting the map load.
//
// sv_cheats 0 AND NO setpos, DELIBERATELY.  Every other testrun cfg opens with
// sv_cheats 1, and from build 44 on that is itself a taint; setpos is classified
// TF_CHEAT outright (sh_defs.qc's TF_CHEAT essay, confirmed in an earlier run of
// this file: `class: cheated (cheat 1 cheatlatch 1)`).  Neither would break the
// test -- TF_NOJOURNAL is orthogonal to all three classes and both arms would
// take the same mark -- but a control that reads `class: clean` makes the two
// flags words differ in exactly one bit, which is the strong form of the result.

exec cfg/testrun/_quiet.cfg

developer 1
log_developer 1
log_enable 1
log_dir logs
log_name b58hid
cl_maxfps 100
cl_idlefps 0
sv_cheats 0
con_notifylines 0
con_notifytime 0.01
r_drawviewmodel 0

wait 200
map bhop_eazy
waitmap 600
waitms 6000

echo ^5=== B58: rec_hid as launched
rec_hid

// cmd viewpos before each cmd timer as the in-order marker: a local `echo` runs
// immediately while `cmd` is queued to the next outgoing packet, so reading this
// log by its echoes gives every reply the wrong label.  viewpos prints as
// `setpos x y z pitch yaw roll`, deliberately, so it pastes back.
echo ^5=== B58: arm at the main start box -- NOT started yet, expect nojournal 0 in BOTH arms
cmd zone_goto 0
waitms 2000
cmd viewpos
cmd timer
waitms 1500

echo ^5=== B58: walk out of the start box -- this is what starts the clock and fires the latch
+forward
waitms 3000
-forward
waitms 1500

echo ^5=== B58: THE MEASUREMENT -- expect running, and journal said/nojournal per the arm
cmd viewpos
cmd timer
waitms 2000

echo ^5=== END OF RUN ===
waitms 1000
quit
