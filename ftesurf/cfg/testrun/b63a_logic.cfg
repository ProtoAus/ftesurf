cfg_save_auto 0

// ===========================================================================
// BUILD 63, ARM SET A -- Tier 1 of the Source entity I/O expansion.
//
// WHAT BUILD 63 ADDED, and what these arms are meant to falsify:
//
//   logic_relay     Trigger / CancelPending / Toggle inputs, OnTrigger and
//                   OnSpawn outputs, the once-only and fast-retrigger
//                   spawnflags, and a refire lockout whose flag is set BEFORE
//                   the fire rather than after (SV_IORelayTrigger).
//   logic_case      InValue / PickRandom / PickRandomShuffle -> OnCase01..16
//                   and OnDefault.  6,258 outputs across 112 maps, none of
//                   which could ever fire before, because the class had no
//                   spawn function and the catch-all deleted it.
//   logic_branch    SetValue / SetValueTest / Toggle / ToggleTest / Test, and
//   logic_compare   the four comparison outputs.
//   math_counter    Subtract / Multiply / Divide / GetValue / SetHitMax /
//                   SetHitMin, OnHitMin, and CLAMPING -- see ARM D.
//   logic_timer     the SF_TIMER_UPDOWN oscillator, OnTimerHigh/OnTimerLow.
//   any entity      FireUser1..4 -> OnUser1..4; TouchTest -> OnTouching.
//   the layer       a recursion fuse, an output-table cap, and `ent_io`.
//
// PRE-REGISTERED, WRITTEN BEFORE THE RUN.  Each arm says what it MUST show.
//
// ---------------------------------------------------------------------------
// TWO HARNESS TRAPS THIS FILE HIT, RECORDED SO THE NEXT ONE DOES NOT.
//
// 1. `map` ISSUED TOO EARLY IS SILENTLY DROPPED.  A +exec'd config runs while
//    the engine is still initialising -- in the first attempt the echo landed
//    at 04:27:57 and "FTESurf Initialized" at 04:27:58 -- and the map command
//    went nowhere.  No error, no map, and then `waitmap` sat out its whole
//    timeout looking like a hang.  Hence the `waitms 5000` before the first
//    map.  Verified: with it, "SpawnServer: surf_kitsune" appears; without it,
//    the run sits on the menu.
//
// 2. `waitmap`'s ARGUMENT IS A TIMEOUT IN SECONDS, not frames and not a dwell
//    (common/cmd.c).  The first attempt used `waitmap 600` on six arms, which
//    is a potential hour of nothing.  45 is what the working configs in this
//    directory use.
//
// 3. A SERVER COMMAND ISSUED JUST BEFORE `quit` NEVER RUNS.  ent_io and
//    ent_census are forwarded to the server, and the first attempt's log ends
//    "Flushed command ent_census" -- they were still in the buffer when the
//    connection closed.  Hence a waitms after each.
// ---------------------------------------------------------------------------
//
// ARM A -- surf_kitsune, THE REGRESSION ARM.  Runs first: if Tier 1 broke
//          something that already worked, nothing after it matters.
//
//   MUST show, all three unchanged from build 62 (b37c.cfg:39-67):
//     "target case: 28 reference(s) repaired"
//     "entity I/O: 50 output(s) wired"
//     "teleports: 1 spawned DISABLED"
//   MUST still census OnIn/OnOut as unfired -- those are Tier 2, not this
//   build, and their absence here would mean something fired that should not.
//   MUST show "no refusals" from ent_io.
//
// ARM B -- surf_forbidden_tomb4.  153 logic_relay, 13 logic_case, 0 buttons:
//          the cleanest relay test in the library.
//
//   MUST show a non-zero "input(s) delivered" in ent_io.  Before build 63 this
//   map delivered NOTHING into a relay, so a zero means Trigger is not landing.
//   MUST NOT census 'OnTrigger' or 'OnSpawn' as unfired.
//   MUST NOT show any refusal.  If the fuse trips on legitimate wiring it
//   trips here first.
//   RECORD the peak depth -- it is the evidence for or against MAXDEPTH 32.
//
// ARM C -- surf_ny_platinum.  39 logic_case + 39 math_counter + 44 relays.
//
//   MUST NOT census OnCase01..16 or OnDefault -- this is the 6,258-output
//   family at its densest.
//   RECORD peak depth: case -> relay -> case is the cycle shape the fuse is
//   for, and this map wires all three classes together.
//
// ARM D -- bhop_arcane.  The math_counter DOES-NOT-REGRESS arm.
//
//   Build 63 makes SV_IOCounter clamp into [min,max] as Source does, which is
//   new behaviour for 505 of the library's 546 counters across 112 maps.
//   MUST still census nothing new, and MUST NOT census OnHitMax.
//   This arm cannot PROVE the clamp -- nothing here drives a counter past max
//   -- so it is a regression arm only.  The clamp wants its own test against a
//   map that overshoots.  Said plainly rather than left implied.
//
// ARM E -- bhop_miku_v2.  THE CAP ARM, and this map has never loaded.
//
//   416,464 declared outputs, 416,366 of them on ONE logic_relay, against
//   pr_maxedicts 131072 and one edict per output.  The next densest map in the
//   library is 2,494 and the median is 14.
//   MUST load at all -- that alone is the result.
//   MUST print the red "declares more than 32768 outputs" line NAMING THE MAP.
//   MUST NOT crash, and ent_io MUST still answer afterwards.
//
// ARM F -- surf_kitsune again, THE RESTORE ARM.  Must match ARM A exactly.
//          Without it, a failure in C/D/E and a wedged harness are the same
//          picture.
// ===========================================================================

log_enable 1
log_dir logs
log_name b63a_logic
developer 1
log_developer 1

cl_maxfps 100
con_notifylines 0

// See harness trap 1.  The engine is not ready yet.
waitms 5000

echo ^5=== ARM A: surf_kitsune, regression baseline ===
map surf_kitsune
waitmap 45
waitms 6000
ent_io
waitms 1500
ent_census
waitms 1500

echo ^5=== ARM B: surf_forbidden_tomb4, 153 relays ===
map surf_forbidden_tomb4
waitmap 45
waitms 6000
ent_io
waitms 1500
ent_census
waitms 1500

echo ^5=== ARM C: surf_ny_platinum, 39 cases + 39 counters ===
map surf_ny_platinum
waitmap 45
waitms 6000
ent_io
waitms 1500
ent_census
waitms 1500

echo ^5=== ARM D: bhop_arcane, math_counter does-not-regress ===
map bhop_arcane
waitmap 45
waitms 6000
ent_io
waitms 1500
ent_census
waitms 1500

echo ^5=== ARM E: bhop_miku_v2, the cap -- this map has NEVER loaded ===
map bhop_miku_v2
waitmap 90
waitms 15000
ent_io
waitms 2500

echo ^5=== ARM F: surf_kitsune again, restore ===
map surf_kitsune
waitmap 45
waitms 6000
ent_io
waitms 1500
ent_census
waitms 2500

echo ^5=== END OF RUN ===
quit
