// FTESurf p290f -- the grade on a map that is NOT tensor2, and on one with no
// grade at all.  Two things this catches that a single-map test cannot:
//
//   * the shader name is content-derived (map base + FNV-1a of the files and
//     weights) precisely because R_LoadShader RETURNS AN EXISTING SHADER when
//     one already carries the name and discards the body it was handed.  A fixed
//     name would silently give the second graded map of a session the FIRST
//     one's grade.  Two maps in one process is the only test for that.
//   * surf_demise grades at weight 1.0 where tensor2 is 0.40 -- 13 of the
//     library's 15 actually-graded maps are at full strength, so tensor2 is the
//     gentlest case in the library and a bug that only shows at full weight
//     would never appear on it.
//
// surf_tensor is the negative control: no color_correction entity at all, so
// r_colourcorrection must come back EMPTY and the stage must never arm.
cfg_save_auto 0
exec cfg/testrun/_quiet.cfg
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "p290f"
scr_sshot_type png
cl_yieldcpu 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0

waitms 2500

// ============================================ 1. a full-weight graded map
map surf_demise
waitmap 240
waitms 9000
sv_cheats 1
noclip
waitms 800
echo "@@@ P290F demise state"
r_colourcorrection
waitms 800
hl2_colourcorrection 1
waitms 1500
screenshot p290f_demise_on
waitms 1200
screenshot p290f_demise_on2
waitms 1200
hl2_colourcorrection 0
waitms 1500
screenshot p290f_demise_off
waitms 1200
hl2_colourcorrection 1
waitms 1000

// ============================================ 2. back to tensor2 in the SAME
//    process -- the shader-name collision test
map surf_tensor2
waitmap 240
waitms 9000
sv_cheats 1
noclip
waitms 800
echo "@@@ P290F tensor2-after-demise state"
r_colourcorrection
waitms 800
setpos -11684 -12864 13936 0 0 0
waitms 2000
screenshot p290f_t2_after
waitms 1200

// ============================================ 3. a map with no grade
map surf_tensor
waitmap 240
waitms 9000
echo "@@@ P290F tensor (ungraded) state -- must be empty"
r_colourcorrection
waitms 1000
screenshot p290f_tensor_nograde
waitms 1200

echo "@@@ P290F DONE"
waitms 1200
quit
