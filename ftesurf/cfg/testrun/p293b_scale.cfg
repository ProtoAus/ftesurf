// cfg_save_auto 0: this run sets archived cvars (vid_*, cl_maxfps); never let it write them into ftesurf.cfg (cl_main.c:2535)
cfg_save_auto 0
// Patch 293b -- IS IT THE LEVEL?
//
// 293 reads surf_fantasy's 12-byte baked prop lighting correctly (props: 0 of 2345 ->
// 2345 of 2345) but the props come out DARKER than the leaf-ambient-cube fallback they
// replace: at Lex's save001, centre third, mean luminance -11.45 and near-black
// 0.02% -> 46.06%.  The read is right; the level is in question.
//
// hl2_lt_baked_scale is the lever.  It is read INSIDE VBSP_LoadPropBakedLight
// (mod_vbsp.c:4503), i.e. once per prop at MAP LOAD, so every arm needs its own load.
// `map x` twice in a row does not reload, so each arm goes via a different map first.
//
// ARMS, all at the same pinned vantage:
//   A  vhv12 0            -- the fallback, today's picture, the reference
//   B  vhv12 1  scale 2   -- the patch as written (known too dark)
//   C  vhv12 1  scale 4
//   D  vhv12 1  scale 8
// If no scale lands on A's level with MORE structure than A, the level is not a scalar
// and the answer is elsewhere -- that is a real outcome, not a failed run.
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000
wait 200

developer 1
log_developer 1
log_enable 1
log_dir logs
log_name p293b_scale
cl_maxfps 0
cl_idlefps 0
sv_cheats 1
con_notifylines 0
con_notifytime 0
con_notifytime_error 0
r_drawentities 1
r_lightstylescale 1
hl2_cubelight 0
hl2_bumpgreenfix 0
hl2_lt_dirsign 0
r_cubelight 1

alias shot_rock "setpos -9001.9434 -14301.5703 6205.6196 30.9814 38.5675 0; waitms 2500; cmd viewpos"
alias shot_pine "setpos 7095.0 -14443.4 -10790.5 -12 0 0; waitms 2500"

// ---------------- ARM A: fallback (reference) ----------------
hl2_lt_vhv12 0
echo ^5=== p293b ARM A: vhv12 0 -- the leaf-ambient fallback, today's picture
map surf_fantasy
waitmap 600
waitms 9000
waitms 3000
noclip
waitms 1000
shot_rock
prop_census rock
screenshot p293b_A_off_rock
shot_pine
screenshot p293b_A_off_pine

// ---------------- ARM B: vhv12 1, scale 2 ----------------
map surf_boreas
waitmap 600
waitms 6000
hl2_lt_vhv12 1
hl2_lt_baked_scale 2
echo ^5=== p293b ARM B: vhv12 1, hl2_lt_baked_scale 2
map surf_fantasy
waitmap 600
waitms 9000
waitms 3000
noclip
waitms 1000
shot_rock
prop_census rock
screenshot p293b_B_s2_rock
shot_pine
screenshot p293b_B_s2_pine

// ---------------- ARM C: vhv12 1, scale 4 ----------------
map surf_boreas
waitmap 600
waitms 6000
hl2_lt_baked_scale 4
echo ^5=== p293b ARM C: vhv12 1, hl2_lt_baked_scale 4
map surf_fantasy
waitmap 600
waitms 9000
waitms 3000
noclip
waitms 1000
shot_rock
screenshot p293b_C_s4_rock
shot_pine
screenshot p293b_C_s4_pine

// ---------------- ARM D: vhv12 1, scale 8 ----------------
map surf_boreas
waitmap 600
waitms 6000
hl2_lt_baked_scale 8
echo ^5=== p293b ARM D: vhv12 1, hl2_lt_baked_scale 8
map surf_fantasy
waitmap 600
waitms 9000
waitms 3000
noclip
waitms 1000
shot_rock
screenshot p293b_D_s8_rock
shot_pine
screenshot p293b_D_s8_pine

hl2_lt_baked_scale 2
hl2_lt_vhv12 0
echo ^5=== END OF RUN ===
waitms 500
quit
