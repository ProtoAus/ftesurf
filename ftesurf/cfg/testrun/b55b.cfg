// FTESurf b55b -- does the MENU still draw after build 55's m_main.qc change?
//
// b55a tried to screenshot the menu from inside a loaded map with
// `togglemenu 1` and got a picture of the world instead: the log shows
// "Initializing menu.dat" at 08:49:26, which is AFTER that screenshot and
// during the quit.  So b55a proved nothing about the menu and said so.
//
// This run starts with NO map, which is the state the menu is actually drawn
// in, and lets it settle.
//
// WHAT IT PROVES: m_main.qc compiles into a menu.dat that initialises AND
// draws.  Build 55 added ui_host_of / ui_host_allowed and the lobby_hosts
// allow-list to that file, and a fault in menu QC takes the whole picker with
// it -- there is no partial menu.
//
// WHAT IT DOES NOT PROVE: that the allow-list REFUSES anything.  ui_connect is
// reachable only by clicking a lobby row, so the refusal path is not exercised
// here.  It is verified by compile and by reading; say so rather than letting
// a green menu imply more than it shows.
//
// The lobby rows come from lobby_dir (the Pi at 192.168.1.102:8084) and need
// the poll to land, hence the long settle.
cfg_save_auto 0
exec cfg/testrun/_quiet.cfg
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "b55b"
scr_sshot_type png
cl_yieldcpu 0
vid_vsync 0
con_notifytime 0

// TWO THINGS THE FIRST ATTEMPT GOT WRONG, both recorded because both cost a run:
//
// 1. screenshot_mega CANNOT capture the menu.  It re-renders the 3D scene at a
//    chosen size, and with no map loaded there is no scene: the log said
//    "Unable to capture screenshot" and no file appeared.  Plain `screenshot`
//    grabs the framebuffer and is the only form that works here.  (It still
//    lands in screenshots/ -- build 21 fixed the NAMED form to honour
//    scr_sshot_prefix, which it used to ignore.)
//
// 2. The menu VM is LAZY.  "Initializing menu.dat" appeared at the very end of
//    the run, after the screenshot and during the quit -- so the menu had
//    never been opened and a picture of it could not have existed.  A cfg that
//    runs from +exec and quits never opens it on its own.  togglemenu has to
//    be asked for explicitly, and then given frames to initialise and draw.
// 3. _quiet.cfg ALREADY calls menu_restart for exactly this reason (its own
//    comment explains the lazy load and says the stock FTE menu appearing "was
//    never a fault in the game").  It runs at the TOP of the preamble though,
//    which is too early here -- the first attempt still got the built-in menu
//    and "Initializing menu.dat" still landed at quit.  Call it again once the
//    filesystem is fully up, then open the menu, then give it frames.
menu_restart
waitms 4000
togglemenu 1
waitms 10000

echo "@@@ B55B main menu"
screenshot b55b_1_main
waitms 1500

echo "@@@ B55B DONE"
waitms 800
quit
