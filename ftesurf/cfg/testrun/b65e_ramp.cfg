cfg_save_auto 0

// ===========================================================================
// BUILD 65.1 -- GET AN ACTUAL "Ramp:" AND "Board:" ROW ON SCREEN.
//
// b65c/b65d could only reach Air rows, and the ask names all three:
//
//     "so Air: Board: and Ramp: the semi-colin lines up"
//
// Air rows alone cannot falsify the fix, because the rows that were WORST
// aligned are the short ones: a Board row has no duration and no percentage, so
// before 65.1 it was missing two columns and sat further right than anything
// else in the block.  Those are exactly the two columns 65.1 pays for in spaces
// and in pctres.
//
// The live rows have the same reachability problem for the same reason -- they
// are gated on seg_live_kind == SEG_RAMP (cl_hud.qc), so no amount of bhopping
// on a flat produces one.
//
// THE WAY IN IS zone_goto, not setpos.  `cmd zone_goto <n>` teleports to the
// zone centre; on a surf map a stage start box hangs in the air above the first
// ramp, so simply ARRIVING and doing nothing drops the player onto a ramp under
// gravity.  No heading is needed, which dodges trap 10 (zone_goto's angle
// arguments do not hold), and no setpos is used.
//
// It cannot FINISH -- zone_goto routes through SV_TimerWarped, which voids --
// so this writes nothing into the user's data/runs and owes no cleanup.  That
// is fine: this run wants a picture, not a time.
//
// A BURST OF SHOTS, NOT ONE.  Where the fall lands and how long the ramp
// contact lasts are not predictable from a script, so the run shoots every
// ~300 ms across the whole descent and slide and then reads whichever frames
// caught a ramp.  Shooting blind and picking afterwards is cheaper than
// pretending to know the geometry.
//
// PREDICTIONS:
//   * at least one frame carries a grey "Ramp:" row or an orange "Board:" row
//   * its ':' shares an x with every Air row in the same frame
//   * a Board row's missing duration shows as EMPTY SPACE in the duration
//     column, not as the row sliding right
//
// FALSIFIED IF: a Board or Ramp row appears and its colon is not on the Air
// rows' x.
// ===========================================================================
log_enable 1
log_dir logs
log_name b65e_ramp
developer 1

sv_cheats 0

hud_scale 2
hud_seq_size 20
cl_maxfps 250
con_notifylines 0

hud_seq 1
hud_seq_name 1
hud_seq_abs 1
hud_seq_delta 1
hud_seq_time 1
hud_seq_pct 1
hud_seq_board 1
hud_seq_live 1
hud_seq_units 1
hud_seq_rows 15

hud_strafe 0
hud_splits 0

waitms 5000
map surf_kitsune
waitmap 45
waitms 4000

echo ==== zone 1 ====
cmd zone_goto 1
waitms 400
screenshot
waitms 300
screenshot
