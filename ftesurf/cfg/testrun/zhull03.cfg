// BUILD 47 stage 3 -- the destination audit, which is a SERVER client-command
// and therefore needs `cmd`, not a bare console word.  zhull02 asked for it
// bare and got `Unknown command "zone_dests"`, which is what that looks like.
//
// Three states now, where there was a boolean:
//     (blank)  point inside the ring
//     edge     point outside, HULL still overlapping -- fine under run_zone_hull
//              1, and reported as OUTSIDE by every build before 47
//     OUTSIDE  clear of the box under either rule
//
// surf_doodles is the map worth looking at beside it: its stage-1 box overlaps
// its start box by 480 units, so it is where destination-vs-zone questions
// actually bite.

waitms 2000

map surf_colin_blaster_69000
waitmap 240
wait 30

echo ^5=== colin_blaster: destinations ===
cmd zone_dests
wait 20

map surf_doodles
waitmap 240
wait 30

echo ^5=== doodles: destinations (overlapping start/stage boxes) ===
cmd zone_dests
wait 20

echo ^5=== END OF RUN ===
wait 10
quit
