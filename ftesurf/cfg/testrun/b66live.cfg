// Build 66, POST-DEPLOY: can a player still connect to a live lobby?
//
// The deploy replaced the engine binary, both progs and lobby.cfg on the five
// public servers.  Everything verified so far was verified on the SERVER side:
// the units restarted, the heartbeats came back, and a throwaway process read
// the intended cvar values off the live config.  None of that is the thing
// that matters to a player, which is whether the game still works.
//
// This arm is deliberately the dumbest possible test and that is the point.
// It connects to lobby 1 exactly as a player would, from a client that is NOT
// the one the deploy was built alongside, and asks three questions:
//
//   1. Does the connection complete at all?  The client downloads the server's
//      csprogs.dat -- ~2,700 chunks, which is why every wait here is long --
//      and runs the SERVER's CSQC, so a bad progs deploy shows up here and
//      nowhere else.
//   2. Does CSQC start?  `cmd timer` goes to SSQC and the reply is drawn by
//      CSQC, so an answer means both halves are alive.
//   3. What ruleset does the client actually see?  `serverinfo` prints the
//      keys the server publishes, which is where pm_slide and *ruleset live.
//      THIS IS THE ONE THAT MATTERS: the deploy gates func_slide off with
//      `set pm_slide 0` in the Pi's cfg/default.cfg, and a value set anywhere
//      else would be reverted by the locked-mover table without saying so.
//      Reading it back from the client is the end of that chain.
//
// PREDICTION:  connected, `serverinfo` carries pm_slide 0, *ruleset "1 0 0 0".
// FALSIFIED IF: the connect stalls or is refused; serverinfo shows pm_slide 1
//      (the default.cfg edit did not become canonical); or *ruleset's first
//      field is 0 (the lock is not engaged on a live lobby, which would mean
//      every run there is unrankable).
//
// It plays nothing and finishes nothing -- a lobby has 32 slots so SV_MayCheat
// is false and no config can cross an end zone.  Nothing is written anywhere.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name b66live
log_developer 1
developer 1

cl_sendguid 1
name "^3Lex Post Deploy"

waitms 4000
echo ^5==== b66live: connecting to lobby 1 ====
connect 192.168.1.102:27510

// Long, because the first connect after a progs deploy downloads csprogs.dat
// in ~2,700 chunks and that ate an entire run budget the last time it was
// underestimated.
waitms 90000

echo ^5==== b66live: connected? ====
status
waitms 3000

echo ^5==== b66live: the ruleset the CLIENT sees ====
serverinfo
waitms 3000

echo ^5==== b66live: timer round trip (SSQC answers, CSQC draws) ====
cmd timer
waitms 4000

echo ^5==== b66live: done ====
quit
