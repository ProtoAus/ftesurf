cfg_save_auto 0

// ===========================================================================
// BUILD 66.3/66.5 -- THE SEGMENT COLUMN, AND THE THINGS AROUND IT.
//
// Four claims a screenshot can settle:
//
//   * hud_seq_units reaches the ABSOLUTE column now, not just the delta.  At 0
//     both numbers are u/s; at 1 both are energy; at 2 the pair stacks and the
//     columns line up with each other.
//   * there is no space before a unit anywhere -- 1204u/s, +52e.
//   * a bhop chain reads Jump: then Bhop: Bhop: Bhop:, not four Air: rows.
//   * the colons still share one x in every mode, which is build 65.1's
//     property and the thing the grid re-cut is most likely to have broken.
//
// zone_goto 1 first, so the run is on the ground at a stage start and the hops
// below are a real chain rather than a fall.  It voids the run (SV_TimerWarped)
// and writes no .rec, so it owes the data dir nothing.
//
// PREDICTIONS, registered before the run:
//   * shot 1 (units 1): every row `Nnnne  +nnne  n.nns`, colons on one x
//   * shot 2 (units 0): the SAME rows with both columns in u/s, colons still
//     on one x, and the block a little wider
//   * shot 3 (units 2): two lines per row, the u/s line's columns directly
//     under the energy line's
//   * shot 4: the first air row of the chain reads Jump: and the rest Bhop:
//   * shot 5 (hopname 0): all of them read Air: again
//
// FALSIFIED IF: a colon in any shot is off the column's x, or a unit has a
// space in front of it, or every row of the chain carries the same word.
// ===========================================================================
log_enable 1
log_dir logs
log_name b66b_rows
developer 1

sv_cheats 0

hud_scale 2
hud_seq_size 20
cl_maxfps 250
con_notifylines 0

hud_seq 1
hud_seq_name 1
hud_seq_abs 1
hud_seq_delta 1
hud_seq_time 1
hud_seq_pct 1
hud_seq_board 1
hud_seq_live 1
hud_seq_rows 15
hud_seq_hopbreak 1
hud_seq_hopname 1

hud_strafe 0
hud_splits 0

waitms 5000
map surf_kitsune
waitmap 45
waitms 4000

cmd zone_goto 1
waitms 2500

// A walk, then the chain.  The first hop follows >0.25s of ground contact and
// must read Jump:; the rest follow one tick and must read Bhop:.
+jump
waitms 120
-jump
waitms 560
+jump
waitms 120
-jump
waitms 520
+jump
waitms 120
-jump
waitms 520
+jump
waitms 120
-jump
waitms 900

echo ==== 1. energy both columns ====
hud_seq_units 1
waitms 400
screenshot
waitms 500
screenshot
waitms 500

echo ==== 2. u/s both columns ====
hud_seq_units 0
waitms 400
screenshot
waitms 500
screenshot
waitms 500

echo ==== 3. both, stacked ====
hud_seq_units 2
waitms 400
screenshot
waitms 500
screenshot
waitms 500

echo ==== 4. names off -- hopname 0 puts Air back ====
hud_seq_units 1
hud_seq_hopname 0
waitms 400
screenshot
waitms 500
screenshot
waitms 500

echo ==== END ====
waitms 800
log_enable 0
waitms 500
quit
