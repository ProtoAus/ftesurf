// B43LINE -- the demo line in screen space against the world-space ribbon.
//
// THE REPORT: "Make demolines 2d lines, they look so much better then the wavy
// slug like lines we have now."
//
// The slug was a world-space camera-facing quad strip whose width varied per
// vertex with distance, which is what made two adjacent quads fail to share an
// edge.  Mode 2 projects to screen first, so the width is a literal pixel count
// and there is nothing to face and nothing to mitre.
//
// A/B AT AN IDENTICAL CAMERA.  Same file, same seek, paused, only
// hud_watch_path_mode differs -- so any difference between the two shots is the
// drawer and cannot be the camera having moved.  Then back to mode 2, because a
// two-armed test cannot tell "the change worked" from "something drifted".
//
// WHAT TO LOOK FOR:
//   mode 1   thick, soft-edged, width growing with distance, hidden by walls
//   mode 2   thin, crisp, constant width, VISIBLE THROUGH WALLS
//
// The last of those is the deliberate cost and the reason mode 1 is kept: a
// screen-space line is drawn after the scene and cannot be occluded by it.
// Shot 3 is aimed at it specifically -- a point on the run where the route
// doubles back behind geometry, so the two modes should differ by whether the
// line continues through the wall or stops at it.
//
// hud_watch_path_px 3 is the default.  8 is also taken in mode 2, because the
// no-mitre decision is only defensible while the line is thin: at 8 px the
// wedge on the outside of a turn is (width/2)*tan(theta/2) and starts to be
// something you could see.  If it shows at 8, the follow-on is a 2D mitre.

log_enable 1
log_dir "logs"
log_name "b43line"
developer 1
log_developer 1
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
sv_cheats 1
fs_missingwarn 0

// The path is the subject; keep the rest of the overlay out of the frame.
hud_watch_path 1
hud_watch_path_ahead 1
hud_watch_info 0
hud_watch_skipidle 0

wait 200
echo ^5=== b43line: screen-space path against the ribbon ===

map surf_rise
waitmap 1800
waitms 2500

replay data/runs/surf_rise/main/last.rec
waitms 800
replay pause

echo ^5=== b43line: MODE 1, the build-26 ribbon ===
hud_watch_path_mode 1
replay seek 40
waitms 900
screenshot b43line_m1_t40_x
waitms 700
screenshot b43line_m1_t40
replay seek 45
waitms 900
screenshot b43line_m1_t45_x
waitms 700
screenshot b43line_m1_t45
replay seek 48
waitms 900
screenshot b43line_m1_t48_x
waitms 700
screenshot b43line_m1_t48

// EVERY SHOT IS TAKEN TWICE AND THE SECOND ONE IS THE EVIDENCE.
//
// `screenshot` in this engine lands one step behind the command that set the
// state up -- the first three probes in this very file proved it, with probe2's
// PNG containing probe1's square and probe3's containing probe2's line.  It
// cost three builds of chasing a 2D drawer that had been working the whole
// time, because a shot named for the state it was asked for showed the state
// before it.  Taking a throwaway first and reading the second removes the
// question entirely.
echo ^5=== b43line: MODE 2, screen space.  Same three seeks, same camera ===
//
// `replay status` after each, for the `path mode / 2d quads / clipped / first`
// line.  "The line is not there" has three causes that look identical on a
// screenshot -- never ran, clipped away, or drawn off-screen -- and the three
// want three different fixes.
hud_watch_path_mode 2
waitms 300
replay seek 40
waitms 900
replay status
screenshot b43line_m2_t40_x
waitms 700
screenshot b43line_m2_t40
replay seek 45
waitms 900
replay status
screenshot b43line_m2_t45_x
waitms 700
screenshot b43line_m2_t45
replay seek 48
waitms 900
replay status
screenshot b43line_m2_t48_x
waitms 700
screenshot b43line_m2_t48

// A known-good 2D quad through exactly the calls the path uses.  If the magenta
// square lands and the path does not, the 2D polygon path works and the fault
// is the path's own geometry.  If neither lands, it is these four calls.
echo ^5=== b43line: which 2D primitive draws from here ===
hud_watch_path_probe 1
waitms 600
screenshot b43line_probe1
hud_watch_path_probe 2
waitms 600
screenshot b43line_probe2
hud_watch_path_probe 3
waitms 600
screenshot b43line_probe3
hud_watch_path_probe 0

echo ^5=== b43line: MODE 2 at 8px -- does the missing mitre show? ===
hud_watch_path_px 8
waitms 300
replay seek 45
waitms 900
screenshot b43line_m2fat_t45_x
waitms 700
screenshot b43line_m2fat_t45
hud_watch_path_px 3

echo ^5=== b43line: back to MODE 1, must match the first three ===
hud_watch_path_mode 1
waitms 300
replay seek 45
waitms 900
screenshot b43line_m1b_t45_x
waitms 700
screenshot b43line_m1b_t45

echo ^5=== b43line: done ===
replay stop
waitms 400
quit
