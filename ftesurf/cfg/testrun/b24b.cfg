// BUILD 24 arm B -- setpos marks the run PRACTICE instead of voiding it.
//
// b24a could not prove this and said so: it printed `timer` before the setpos
// rather than after, and with an idle clock there is nothing for a taint to be
// about anyway.  This one gets the clock actually RUNNING first.
//
// A config cannot surf, but it can walk: zone_goto 0 puts the player in the
// start box and arms the timer, and a console +forward is a command-buffer entry
// that moves the player perfectly well -- it just never passes through
// in_newevent, which is the property build 22's negative control was built on.
// Leaving the start box is what starts the clock.
//
// THE THREE LINES THAT MATTER, in order:
//    timer: running ... practice 0     <- a clean attempt, clock ticking
//    Client command: setpos ...
//    timer: running ... practice 1     <- SAME STATE, clock still ticking
//
// Before build 24 the third line read `idle 0:00.000`: setpos called
// SV_TimerVoid and threw the attempt away, which is what made it unusable for
// the thing it is actually reached for mid-run.

developer 1
log_developer 1
cfg_save_auto 0

wait 200
map surf_aesthetic
waitmap 90

echo "=== B24B: arm in the start box ==="
cmd zone_goto 0
wait 40
cmd timer

echo "=== B24B: walk out of it, which starts the clock ==="
+forward
wait 120
-forward
wait 20

echo "=== B24B: RUNNING, and clean ==="
cmd timer
wait 20
viewpos

echo "=== B24B: setpos mid-run ==="
setpos -15200 200 1100
wait 40

echo "=== B24B: still RUNNING, clock kept, and now PRACTICE ==="
cmd timer
wait 20
viewpos

echo "=== B24B: and the clock is still moving, not latched ==="
wait 60
cmd timer

echo "=== B24B: viewpos during a replay is the PLAYER, not the camera ==="
replay data/runs/surf_aesthetic/main/0005471_pb.rec
wait 10
replay pause
replay seek 41
echo "--- replay status: the camera, out at -13532 10162 1251 ---"
replay status
echo "--- viewpos: the frozen player, somewhere else entirely ---"
viewpos
replay stop
wait 20

echo "=== B24B: done ==="
wait 30
quit
