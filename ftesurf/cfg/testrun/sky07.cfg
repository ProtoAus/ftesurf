// SKY07 -- confirm WHY the clouds take no distance fog.
//
// sky02 measured the symptom: with skyroomfog forced to dense red, the 3D
// skybox's mountains and trees go red and the CLOODS layer stays grey.
//
// Candidate cause.  shader_here says the clouds' shader is
//     shader=project_tendies/cloods    prog=-    haspass=0
//     { map "materials/models\props\cs_office\clouds.vtf"
//       tcMod scroll 0.004330 0.002500
//       blendFunc blend }
// i.e. a raw PASS with no program.  mat_vmt.c:2106 says why: "UnlitGeneric is
// the one arm that emits a real PASS rather than a program".  Everything else in
// that view runs a program (the terrain is vmt/transition#ENVFROMNORM#...).
//
// And fog on this build is a program permutation.  gl_backend.c:4377
//     if (r_refdef.globalfog.density) perm |= PERMUTATION_FOG;
// is inside the permutation builder, so a shader with no program never reaches
// it.  The ONE other fog path, gl_backend.c:7420, is
//     if (density && (!gl_config.arb_shader_objects || !r_fog_permutation.ival))
//         BE_SelectFog(...)
// -- legacy fixed-function fog, gated off whenever GLSL is available AND
// r_fog_permutation is 1, which is the default.
//
// So r_fog_permutation 0 should route fog through BE_SelectFog instead, and if
// the reading is right the clouds should start taking the red fog.  If they
// still do not, the pass/program split is not the reason and the note above is
// wrong.

log_enable 1
log_dir "logs"
log_name "sky07"
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 0
vid_fullscreen 0
con_notifytime 0
con_notifylines 0
con_notifytime_error 0

wait 200
echo ^5=== sky07: why the clouds take no fog ===

map surf_boreas
waitmap 1800
waitms 9000
sv_cheats 1
waitms 300
noclip
waitms 300
vbsp_skyroom 1
setpos 12000 -8000 14000 -12 180 0
waitms 2500

r_fog_permutation
waitms 500

echo ^5========== A: red skyroom fog, r_fog_permutation 1 (default) ==========
r_fog_permutation 1
skyroomfog 0.02 1 0 0 1 0
waitms 3000
screenshot sky07_x
waitms 800
screenshot sky07_a_perm1
waitms 800

echo ^5========== B: same fog, r_fog_permutation 0 ==========
r_fog_permutation 0
waitms 3500
screenshot sky07_x
waitms 800
screenshot sky07_b_perm0
waitms 800

echo ^5========== C: no fog, r_fog_permutation 1 (baseline) ==========
r_fog_permutation 1
skyroomfog 0
waitms 3000
screenshot sky07_x
waitms 800
screenshot sky07_c_nofog
waitms 800

echo ^5=== sky07 done ===
wait 30
quit
