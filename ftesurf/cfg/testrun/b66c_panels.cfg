cfg_save_auto 0

// ===========================================================================
// BUILD 66 -- THE RETEST, AND THE PANELS A FLAT CANNOT REACH.
//
// PART 1 re-runs the one thing b66b falsified.  hud_seq_hopname 0 left the rows
// reading Jump / Bhop / Jump, because the gate was at the MEASUREMENT and the
// sub-kind is stored -- so it relabelled nothing already in the ring.  The gate
// moved into HUD_SeqName.  This run is the check that it now takes effect on
// every row at once.
//
// PART 2 is the strafe bar's three new switches and the crosshair cycle, both
// of which a flat can show.
//
// PART 3 needs a RAMP -- the Board panel's parts, the Boarding window with its
// two rows gone, and a committed Board row's blank duration.  Where the fall
// lands and how long contact lasts are not predictable from a script, so it
// shoots a burst across the descent and the frames that caught one are read
// afterwards.  Cheaper than pretending to know the geometry.
//
// PREDICTIONS:
//   * shot pair 1: every row reads Air:, none reads Jump: or Bhop:
//   * pair 2: no digits above the bar, best line still there
//   * pair 3: digits back, best line reads "u/s/tick"
//   * pair 4: no best line at all
//   * pair 5/6/7: the three crosshairs, 32 px, centred
//   * pair 8: no crosshair at all
//   * the burst: a Board row with SIX SPACES where 0.01s used to be, a Board
//     panel carrying a ramp angle, and a Boarding window of exactly two rows
//
// FALSIFIED IF: any row still reads Jump:/Bhop: in shot 1, or a committed Board
// row prints a duration.
// ===========================================================================
log_enable 1
log_dir logs
log_name b66c_panels
developer 1

sv_cheats 0

hud_scale 2
hud_seq_size 20
cl_maxfps 250
con_notifylines 0

hud_seq 1
hud_seq_rows 15
hud_seq_units 1
hud_seq_hopbreak 1
hud_seq_hopname 1
hud_splits 0

waitms 5000
map surf_kitsune
waitmap 45
waitms 4000

cmd zone_goto 1
waitms 2500

+jump
waitms 120
-jump
waitms 560
+jump
waitms 120
-jump
waitms 520
+jump
waitms 120
-jump
waitms 900

echo ==== 1. hopname 0 must relabel EVERY row, not just new ones ====
hud_strafe 0
hud_seq_hopname 0
waitms 400
screenshot
waitms 500
screenshot
waitms 500

echo ==== 2. strafe bar, rate digits off ====
hud_seq 0
hud_strafe 1
hud_strafe_rates 0
waitms 500
screenshot
waitms 500
screenshot
waitms 500

echo ==== 3. digits back, best line short ====
hud_strafe_rates 1
hud_strafe_best 1
waitms 500
screenshot
waitms 500
screenshot
waitms 500

echo ==== 4. best line off ====
hud_strafe_best 0
waitms 500
screenshot
waitms 500
screenshot
waitms 500

echo ==== 5-8. the crosshair cycle ====
hud_strafe 0
hud_crosshair 1
waitms 400
screenshot
waitms 400
screenshot
waitms 400
hud_crosshair 2
waitms 400
screenshot
waitms 400
screenshot
waitms 400
hud_crosshair 3
waitms 400
screenshot
waitms 400
screenshot
waitms 400
hud_crosshair 0
waitms 400
screenshot
waitms 400
screenshot
waitms 400

echo ==== 9. a ramp, for Board / Boarding / the Board row's duration ====
hud_crosshair 1
hud_seq 1
hud_seq_hopname 1
hud_board 1
hud_boarding 1
hud_strafe 1
hud_strafe_rates 1
hud_strafe_best 2
waitms 400

cmd zone_goto 2
waitms 400
screenshot
waitms 300
screenshot
waitms 300
screenshot
waitms 300
screenshot
waitms 300
screenshot
waitms 300
screenshot
waitms 300
screenshot
waitms 300
screenshot
waitms 300
screenshot
waitms 300
screenshot
waitms 300
screenshot
waitms 300
screenshot

cmd zone_goto 3
waitms 400
screenshot
waitms 300
screenshot
waitms 300
screenshot
waitms 300
screenshot
waitms 300
screenshot
waitms 300
screenshot
waitms 300
screenshot
waitms 300
screenshot
waitms 300
screenshot
waitms 300
screenshot
waitms 300
screenshot
waitms 300
screenshot

echo ==== END ====
waitms 800
log_enable 0
waitms 500
quit
