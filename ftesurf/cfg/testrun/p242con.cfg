// Patch 242: the on-screen console -- ordering, line count, and the error hold.
//
// THE REPORT: "Can the console print start at the top, forever new command, and
// older commands go below it down the screen, fading out over time? or make an
// option for the same thing but the bottom left... I want to see the full list
// of errors if they appear and I don't have the console open."
//
// THE MAP LOADS FIRST, AND THAT IS NOT OPTIONAL.  The notify overlay is drawn
// from the game screen; at the main menu there is no game screen and nothing is
// drawn, which is stock behaviour and not the thing under test.  A first pass of
// this cfg echoed everything at the menu and produced seven screenshots of an
// empty main menu -- exactly the shape of trap 3 in the A/B notes, a control
// that never ran.
//
// con_* are ENGINE cvars, so unlike hud_*/zone_* they need no waitmap of their
// own; they are set up here so the map load's own warnings land under them.
//
// WHY `echo "^&C0..."` IS A FAIR TEST AND NOT A CHEAT.  There is no print level
// in this engine; an error announces itself by beginning with the CON_ERROR
// colour marker "^&C0" (CON_WARNING is "^&E0"), which is how all 438 error
// sites spell themselves -- and cmd.c:1101 emits one through `echo` in exactly
// this way.  Con_PrintCon tests that prefix on the raw text, so this exercises
// the real path.
//
// WHAT TO LOOK FOR:
//   * style 1: the NEWEST line at the TOP, older ones below it, dimming down.
//   * style 2 (notify_bottomleft): newest at the BOTTOM, block hugging it.
//   * style 0: the historical layout, for comparison.
//   * after 8 seconds: the ordinary lines are gone and the two marked ones are
//     still there.  That is con_notifytime 6 against con_notifytime_error 20.

log_enable 1
log_name p242con
developer 1
log_developer 1
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0

con_notifylines 12
con_notifytime 6
con_notifytime_error 20
con_notifyfade 2
con_notify_x 0
con_notify_y 0

wait 200
map surf_aesthetic
waitmap 900
wait 300

// Let the map-load chatter age out, so what follows is only what this cfg says.
wait 800

echo ^5=== p242con: style 1, newest at the top ===
con_notifystyle 1
wait 30
echo AAAA line one -- oldest
wait 5
echo BBBB line two
wait 5
echo "^&E0CCCC warning: this one should linger"
wait 5
echo DDDD line four
wait 5
echo "^&C0EEEE error: so should this one"
wait 5
echo FFFF line six -- newest
wait 30
screenshot
wait 20

echo ^5=== p242con: style 2, bottom left, newest at the bottom ===
notify_bottomleft
wait 30
screenshot
wait 20

echo ^5=== p242con: style 0, the historical layout ===
con_notifystyle 0
con_notify_y 0
wait 30
screenshot
wait 20

echo ^5=== p242con: back to style 1 ===
con_notifystyle 1
wait 30
screenshot

echo ^5=== p242con: waiting out con_notifytime ===
wait 800
screenshot
wait 100
screenshot
wait 20

echo ^5=== p242con: a burst of 20, to prove the 24-line ceiling is gone ===
echo burst 01
echo burst 02
echo burst 03
echo burst 04
echo burst 05
echo burst 06
echo burst 07
echo burst 08
echo burst 09
echo burst 10
echo burst 11
echo burst 12
echo burst 13
echo burst 14
echo burst 15
echo burst 16
echo burst 17
echo burst 18
echo burst 19
echo burst 20
wait 30
screenshot
wait 20

echo ^5=== p242con: 20 lines with con_notifylines 20 ===
con_notifylines 20
echo second 01
echo second 02
echo second 03
echo second 04
echo second 05
echo second 06
echo second 07
echo second 08
echo second 09
echo second 10
echo second 11
echo second 12
echo second 13
echo second 14
echo second 15
echo second 16
echo second 17
echo second 18
echo second 19
echo second 20
wait 30
screenshot
wait 20

echo ^5=== p242con: done ===
wait 50
quit
