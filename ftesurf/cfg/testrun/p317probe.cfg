// P317PROBE -- arm the collision probe, then go and hit YOUR wall.
//
// v2: no `developer 1`.  That was the lag, not the probe -- it floods the console
// with `mark/300f: 300 runs, 186300 leaf visits` every frame.  The [dispprobe]
// lines are Con_Printf and land in the log without it.
//
// pm_dispprobe 4 = HARD STOPS ONLY (fraction < 0.05, or startsolid), latched.
// Riding a ramp clips every single tick at a healthy fraction of 0.4-0.8, and
// those are the lines that bury the interesting one.  A wall is a fraction at or
// near zero.  On the last log this filter turns 190 contacts into about four.
//
// WHAT TO DO
//   1. map surf_boreas
//   2. cmd sl_goto 11
//   3. SURF IT THE WAY YOU NORMALLY WOULD -- strafe, hold your line.  The last
//      log was a no-input slide, which drifts sideways off the route and runs
//      head-on into a player-clip wall at (11447 -13126 2492).  That clip is not
//      a bug: your own PB passes 17.7 units clear of it, riding alongside.  So a
//      hands-off ride cannot show me your wall.
//   4. quit, and send ftesurf/logs/p317probe.log
//
// READING THE `via plane` LINE on the tick you stop:
//   via plane 0 FACE, steep face norm   the ramp really is that shape. not a bug.
//   via plane 1 BACK-SLAB(+4)           the four-unit slab -- the winding. Should
//                                       not happen now; if it does, say so.
//   via plane 2/3/4 (edge ...) / bevel #N   one triangle's own edge plane or bevel
//                                       standing proud of the surface. That is a
//                                       real collision bug, Patch 258's family.
//   via plane 10x axial +-x/y/z         the axial block, same family.
//   hit: BIH_BRUSH "..." contents 0x..  a brush, not the prop. 0x...10000 is
//                                       PLAYERCLIP, which Source blocks too.
//   hit: nothing recorded               nothing was hit; you were not stopped by
//                                       geometry at all.
//
// The `tri idx a/b/c` triple names the exact face -- it maps straight onto an
// offline .phy dump, so send it.

log_enable 1
log_dir "logs"
log_name "p317probe"
con_notifylines 4

pm_dispprobe 4

echo ^5=== probe armed: HARD STOPS ONLY. hl2_phywinding is:
hl2_phywinding
echo ^5=== map surf_boreas, then `cmd sl_goto 11`, then SURF IT normally.
echo ^5=== on map load you should see: ".phy collision hulls re-wound ... 488 of 488"
echo ^5=== if that line is missing the fix is not active (it is MAPLATCH and prop
echo ^5===    models are cached, so it needs a FRESH PROCESS, not a map reload).
echo ^5=== log: ftesurf/logs/p317probe.log
