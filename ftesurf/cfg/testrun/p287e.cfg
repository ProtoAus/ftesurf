// FTESurf p287e -- THE MISSING CONTROL.
//
// p287c showed the doorway black with r_portalfbo 1 and showing a white band
// with r_portalfbo 0, and I read that as "the far view renders, the FBO paint is
// broken".  That reading has a hole in it: nothing has established that the band
// visible with fbo 0 is the FAR view rather than the ordinary geometry BEHIND the
// doorway, seen through an aperture that simply drew nothing.  Those two look
// identical from a single screenshot, and the second one means the portal is not
// working on either path.
//
// (This is the trap recorded in the A/B-testing memory: a missing control once
// read a working flipbook as frozen.  Same shape, so run the control.)
//
// vbsp_portal_render 0 "turns the apertures off completely while leaving the
// doors in place" (cfg/default.cfg:2928).  So:
//
//   portals OFF differs from fbo 0   =>  fbo 0 really is drawing the far view,
//                                        and the FBO path specifically is broken.
//   portals OFF identical to fbo 0   =>  neither path draws anything; the far
//                                        view is not being produced at all and
//                                        the FBO is innocent.
//
// The second reading is the one the readback now supports: the probe reported
// "fbo centre mean 63 max 255", and 63 is not "some content" -- it is exactly
// what 8x8 RGBA pixels of (0,0,0,255) average to (64*255/256 = 63.75).  The FBO
// is opaque black, which is the probe's own "the recursion drew nothing" case.
//
// All three pictures come from ONE run at ONE vantage so nothing but the cvar
// differs between them.
cfg_save_auto 0
exec cfg/testrun/_quiet.cfg
developer 1
log_developer 1
log_dir "logs"
log_name "p287e"
scr_sshot_type png
cl_yieldcpu 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0

waitms 2500

map surf_kitsune
waitmap 240
waitms 8000
sv_cheats 1

// ------------------------------------------------- 1: apertures ON, fbo ON
echo "@@@ P287E apertures ON, fbo ON"
setpos 0 -765 133 0 90 0
waitms 3000
screenshot_mega p287e_1_on_fbo 1280 720
waitms 800

// ------------------------------------------------- 2: apertures ON, fbo OFF
echo "@@@ P287E apertures ON, fbo OFF"
r_portalfbo 0
vid_reload
waitms 6000
setpos 0 -765 133 0 90 0
waitms 3000
screenshot_mega p287e_2_on_nofbo 1280 720
waitms 800

// ------------------------------------------------- 3: apertures OFF (control)
echo "@@@ P287E apertures OFF -- the control"
vbsp_portal_render 0
waitms 3000
setpos 0 -765 133 0 90 0
waitms 2500
screenshot_mega p287e_3_off 1280 720
waitms 800

echo "@@@ P287E DONE"
waitms 1000
quit
