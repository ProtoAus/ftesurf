// BUILD 23 arm B -- the checkpoint row survives a save, and the .pb it feeds.
//
// THE BUG THIS PROVES FIXED.  run_run_cp[] was the one part of a run's state a
// save file did not carry.  `retry` restores verbatim and deliberately does NOT
// mark the run practice -- the map reset around you, you did not move -- so a
// retried run can still set a personal best, and SV_TimerFinish copies the
// checkpoint row wholesale into run_pb_cp.  SV_PBSave writes a `cp` line only
// where the value is above zero, so a retried PB rewrote the .pb with NO cp
// lines at all: the map's entire checkpoint record deleted by the act of beating
// your own time, with nothing printed and no second copy.
//
// A config cannot surf, so the checkpoints cannot be crossed by running through
// them.  What a config CAN do is round-trip a fixture through the real reader
// and the real writer, which is where the bug was and is the whole of it: slot
// 5 is a hand-written state.txt carrying three runcp lines, and saving after
// loading it must produce a state.txt carrying the same three.  If the parser
// drops them the new file has none; if the writer drops them, likewise.
//
// It only READS the existing saves.  Slot 5 is a fixture this test owns.

developer 1
log_developer 1
cfg_save_auto 0

wait 200
map surf_utopia
waitmap 90

echo "=== B23B: the save list ==="
cmd sl_list
wait 20

echo "=== B23B: load the fixture (seq 99, so it is LAST in the list) ==="
cmd sl_goto 5
wait 30
cmd timer

echo "=== B23B: and save it straight back out ==="
cmd sl_save
wait 30
cmd sl_list

echo "=== B23B: done ==="
wait 30
quit
