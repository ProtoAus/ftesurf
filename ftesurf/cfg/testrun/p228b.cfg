// The purple trees -- a SECOND bug, isolated.
//
// Patch 228 made bhop_ambience's 72 static props load, and the trees are now
// visibly there.  They are also magenta, which the reporter saw and described as
// "the trees don't render, they are purple".  Two separate faults, and only the
// first one is fixed.
//
// What is already known, measured rather than guessed:
//   - Both tree materials are plain `vertexlitgeneric` with identical $treesway
//     fields (extracted from csgo/pak01_dir.vpk).  The ONLY meaningful difference
//     is that the leaves carry `$alphatest 1` + `$nocull 1` and the trunk does not.
//   - beech_bark_01 (TRUNK, renders correctly) is DXT1/BC1.
//     beech_branch_01 (LEAVES, renders magenta) is DXT5/BC3.
//   - The leaf texture's own BC3 colour endpoints average RGB (103,113,83) -- a
//     muted GREEN.  So the asset is fine and something here is inverting or
//     replacing it.  Alpha is clearly correct: the leaf silhouettes cut properly.
//   - img_vtf.c maps VMF_BC3=15 -> PTI_BC3_RGBA correctly, and the engine
//     supports BC3 everywhere (image.c:5009, :12532).  So it is NOT the enum.
//
// Four shots, each removing one suspect.  The screenshots auto-number, so the
// order below IS the identification:
//
//   _001 baseline                 -- reproduce it, same as p228a
//   _002 gl_load24bit 1           -- THE DECISIVE ONE.  Decompresses to RGBA
//                                    instead of uploading BC3.  If the leaves go
//                                    green here, the fault is in the compressed
//                                    upload path; if they stay magenta, the fault
//                                    is in the shader and the texture is innocent.
//   _003 r_reflectcube 0          -- this map logs "no env_cubemaps built ... using
//                                    the map's cubemapdefault, WHICH IS ALSO
//                                    MISSING", so an unbound envmap sampler is a
//                                    live suspect for an added colour.
//   _004 hl2_bumpmap 0            -- the other per-material sampler that could be
//                                    reading something that is not there.
//
// vid_reload after each: these are texture/shader state, not per-frame values.

log_enable 1
log_name p228b
developer 0
cfg_save_auto 0
cl_idlefps 0

wait 200
echo ^5=== p228b: isolating the magenta leaves ===

map bhop_ambience
waitmap 900
wait 90

echo ^5--- _001 baseline (expect: magenta leaves, green-ish grass) ---
screenshot
waitms 800

echo ^5--- _002 gl_load24bit 1 -- decompress instead of uploading BC3 ---
gl_load24bit 1
vid_reload
wait 240
screenshot
waitms 800

echo ^5--- _003 r_reflectcube 0 (gl_load24bit back to 0) ---
gl_load24bit 0
r_reflectcube 0
vid_reload
wait 240
screenshot
waitms 800

echo ^5--- _004 hl2_bumpmap 0 ---
r_reflectcube 1
hl2_bumpmap 0
vid_reload
wait 240
screenshot
waitms 800

echo ^5=== p228b done ===
wait 30
quit
