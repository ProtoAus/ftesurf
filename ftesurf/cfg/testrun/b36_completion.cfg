// Isolated visual verification for completion values and the ordinal row.
log_enable 1
log_name b36_completion
cfg_save_auto 0
developer 0
vid_fullscreen 0

wait 200
map surf_null
waitmap 240
wait 60

con_window 1
con_window_rect "240 180 800 480"
con_displaypossibilities 2
con_completiondown 1
con_completionrows 12
cl_c2sdupe 0

toggleconsole
wait 20
con_settext cl_c
waitms 750
screenshot b36_clc_default

// The harness posts exactly one Down key to the FTESurf window here.
waitms 5000
screenshot b36_clc_selected_default
waitms 400

cl_c2sdupe 2
waitms 400
screenshot b36_clc_selected_changed
waitms 400

cl_c2sdupe 0
echo === b36 completion done ===
wait 20
quit
