// p277a -- Patch 277: the Q2/Q3 vis cache across a mirror pass, on q3dm0.
// NEEDS maps/q3dm0.bsp and scripts/common.shader (mirror2 :221/:225, portal_sfx :279/:288) in the gamedir; remove after.
// q3dm0 has exactly two portal-keyword faces: mirror2 (face 4536, centroid -1154 -1341 55.5, normal +Y)
// and portal_sfx (face 4868, centroid -1152 -1877 60.3, normal +Y). Both are at -Y of the vantage; the disc
// is in PVS(1524), in the frustum and drawable, and r_portalmaxviews 2 would recurse BOTH, so this sets 1.
// Vantage -1154 -1277 55.5 yaw -90: leaf 3081, cluster 1524, 511 of 3330 leafs lit. Mirror pvsorigin: cluster 1529, 222 lit.
// cfg_save_auto 0: archived cvars are set below and cl_main.c:2535 would write them to ftesurf.cfg otherwise.
cfg_save_auto 0
log_dir  "logs"
log_name "p277a"
log_enable 1
developer 1
log_developer 1
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000
cl_maxfps 0
cl_idlefps 0
cl_yieldcpu 0
sv_cheats 1
r_temporalscenecache 0
r_portalrecursion 1
r_portalmaxviews 1
r_novis 0
wait 200
map q3dm0
waitmap 600
waitms 2500
echo ^5=== spawn: the first 16 [world] census lines are above this
noclip
waitms 300
setpos -1154 -1277 55.5 0 -90 0
waitms 2500
cmd viewpos
q23bsp_markstat
waitms 3000
echo ^5=== A1 mirror in view, r_portalrecursion 1, r_portalmaxviews 1, 3000ms window
q23bsp_markstat
screenshot p277a_a1_x
waitms 700
screenshot p277a_a1
waitms 700
r_portalrecursion 0
waitms 500
q23bsp_markstat
waitms 3000
echo ^5=== A2 mirror in view, r_portalrecursion 0 (no recursed pass), 3000ms window
q23bsp_markstat
screenshot p277a_a2_x
waitms 700
screenshot p277a_a2
waitms 700
r_portalrecursion 1
setpos -1154 -1277 55.5 0 90 0
waitms 500
cmd viewpos
q23bsp_markstat
waitms 3000
echo ^5=== A3 both portal faces behind the camera, r_portalrecursion 1, 3000ms window
q23bsp_markstat
q23bsp_markstat
r_novis 1
waitms 300
r_novis 0
waitms 300
echo ^5=== A4 r_novis 1 then 0 while still, no portal in view
q23bsp_markstat
echo ^5=== END
quit
