cfg_save_auto 0
// PATCH 303 -- FALSIFIER.  Device provenance in the .hid.
//
// THE CLAIM: the journal names the hardware it recorded, instead of recording an
// anonymous small integer.  Before this patch a reader had FTE's devid and
// nothing else, so "devid 0 moved 4000 counts" could not distinguish a real
// mouse from a virtual one -- which is the only question the file is kept to
// answer.
//
// TWO ARMS IN ONE PROCESS, because the second arm tests a REGRESSION THIS PATCH
// COULD HAVE CAUSED and that is worth more than a second launch.
//
// PRE-REGISTERED:
//   ARM A  a plain journal -> data/p303_A.hid
//          MUST contain one or more `dev` lines between `m_accel_senscap` and
//          `begin`, each  dev <type> <devid|unset|-> "<name>".
//          MUST still contain every pre-303 header key, unchanged -- this patch
//          adds lines, it does not rewrite the ones Patch 293 and 301 put there.
//          MUST contain `devmap` lines before `end`.
//          The `system` pseudo-devices MUST print `-`, not 0.  A device that has
//          never been touched MUST print `unset`, not 0.  0 is a real devid
//          belonging to a real device and neither of those is it.
//   ARM B  the same, plus in_journal_synth -> data/p303_B.hid
//          MUST read `synth 1`.
//
// WHY ARM B IS THE ONE THAT MATTERS HERE.  IN_JournalSynth_f finds the poison
// line with a strstr for "\nsynth 0\n" and overwrites it IN PLACE, fixed width.
// Patch 303 had to move `begin` OUT of the header's snprintf -- the device list
// is unbounded and that buffer is 1024 bytes -- so it edited the exact literal
// block that poke depends on.  If `synth 0` had shifted or lost a newline the
// poke would silently find nothing and every future forged-input journal would
// have quietly reported itself as clean.  A patch about evidence integrity that
// breaks the poison flag is worse than no patch, so it is tested here.
//
// WHAT THIS CFG CANNOT TEST, stated so nobody reads its silence as a pass:
// the devid column RESOLVING to a number needs real mouse motion, and a second
// physical mouse appearing as a second device needs a second physical mouse.
// Both are Lex's to check on a played run.  A scripted arm can prove the table
// is emitted, correctly shaped and honest about what it does not know; it
// cannot prove the mapping half.  hidcheck.py therefore REPORTS the resolved
// count rather than faulting on it.
//
// ---------------------------------------------------------------------------
// MEASURED 2026-09-12, on engine/release/fteqw64.exe 8A1F3F51113D.  Both arms
// behaved as registered, and two things came out that were NOT registered:
//
// 1. ARM A FAULTS, AND THE FAULT IS CORRECT AND NOT 303's.  It reads "no frame
//    markers -- nothing was ever drained while the journal was open", because a
//    SCRIPTED arm produces no real input at all and in_generic.c emits the `f`
//    marker only on a non-empty drain.  I failed to predict this when writing
//    the arms.  It is pre-303 behaviour and a true statement about an idle
//    journal.  So arm A's pre-registration is hereby TIGHTENED rather than
//    waived: arm A must fault on THAT LINE AND NOTHING ELSE.  Any other fault
//    in arm A is a real failure of this patch.  (Arm B does not hit it, because
//    the three synthetic events force a drain.)
//
// 2. THE ATTRIBUTION CHECK CAUGHT THE SYNTHETIC EVENTS BY ITSELF, which is not
//    what it was written for.  Arm B reports "devid 0 produced 4 events but no
//    device in the table claims it" -- the injected events carry a devid no
//    enumerated device owns, so they are flagged as unattributed INDEPENDENTLY
//    of the `synth 1` poison flag.  That is a second, unrelated witness against
//    the plugin-injection vector, arriving free.
//    DO NOT OVERSTATE IT.  It fires on "events from a devid nothing
//    enumerates", which injected events happen to have; it is not a general
//    injection detector, and it stays a NOTE rather than a fault because a
//    device unplugged mid-run leaves exactly the same trace.
//
// Both arms show `rawmice 2` against exactly two `dev mouse` lines carrying real
// device paths, and `rawkbds 0` against zero real keyboards -- so Patch 301's
// bound-device COUNT and Patch 303's device TABLE are written from the same
// array and agree, which neither patch could demonstrate on its own.

exec cfg/testrun/_quiet.cfg

developer 1
log_developer 1
log_enable 1
log_dir logs
log_name p303dev
cl_maxfps 100
cl_idlefps 0
sv_cheats 0
con_notifylines 0
con_notifytime 0.01
r_drawviewmodel 0

wait 200
map bhop_eazy
waitmap 600
waitms 5000

echo ^5=== P303: the device table the engine can see right now
in_deviceids

echo ^5=== P303 ARM A: a plain journal
in_journal_begin
waitms 1500
in_journal_note p303-arm-A
waitms 500
in_journal_end data/p303_A.hid
waitms 1500

echo ^5=== P303 ARM B: same, poisoned -- proves the strstr poke survived
in_journal_begin
waitms 1500
in_journal_note p303-arm-B
in_journal_synth 3
waitms 500
in_journal_end data/p303_B.hid
waitms 1500

echo ^5=== END OF RUN ===
waitms 1000
quit
