// SHADERHERE01 -- REPRODUCE BEFORE PATCHING.
//
// Patch 263's record says shader_here named the wrong coplanar surface on
// surf_monolith bonus 4, and lists a fix for it under "Counted, not fixed".
// Before writing that fix, check the claim.  A review of the map data says the
// stated mechanism cannot be what happened:
//
//   * Mod_GetSurfaceNearPoint (pr_bgcmd.c:1187-1224) ranks candidates by SQUARED
//     3D distance to the nearest point on the face.  BIH_Trace puts the endpoint
//     exactly DIST_EPSILON = 0.03125 in front of the plane it stopped on
//     (com_bih.c:107,750).  A face 0.03 away scores 0.00098; one 4.03 away scores
//     16.2.  It cannot prefer the far one, in either scan order.
//   * The mpa45 brushes carry Source contents 0x10000002/0x18000002
//     (CONTENTS_WINDOW|TRANSLUCENT) over 27 brush sides, and mod_vbsp.c:5601
//     puts every brush in the BIH regardless of contents, so a ~0 trace DOES
//     stop on the slab.
//   * All 111 mpa45 faces and all 1227 toolsskybox faces are in model 0, so
//     neither is outside firstmodelsurface..nummodelsurfaces.
//   * Every mpa45 face has numedges >= 4, so none is mesh-less.
//
// So either the report is wrong, or the mechanism is one nobody has named --
// the likeliest unnamed candidate being a brush SIDE whose visible face VBSP
// culled or split away (27 sides -> 111 faces is not 1:1), leaving the trace
// stopped on a plane that carries no msurface_t at all.
//
// Three columns, because the original report and the geometry probe are NOT the
// same place and that has never been reconciled:
//
//   A  -11125 -5511    the column in the user's own shader_here paste, whose
//                      endpoint was z=16320 -- ABOVE the 16304 sky brush
//   B  -13500 -5400    the column Patch 263 probed, with the documented stack
//                      16296 grid / 16300+16302 mpa45 / 16304 toolsskybox
//   C  -10975 -5482    the save004 vantage the patch note prescribes for testing
//
// shader_here AND solid_here at each: shader_here says which surface is named,
// solid_here says where the two traces stop and what the contents are.  If the
// geom trace stops at 16300 and shader_here still says toolsskybox, the report
// is right and the mechanism is the missing-face one.  If shader_here says
// fakeskies/mpa45, the report is WRONG and ENGINE_PATCHES.md needs the
// correction, not view.c.
//
// No screenshots and no r_showshader: this run reads console text only, and
// r_showshader would force loads that move the very state being measured
// (Patch 263's 35% phantom regression).

log_enable 1
log_dir "logs"
log_name "shaderhere01"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
con_notifylines 0
developer 1
log_developer 1

wait 200
map surf_monolith
waitmap 2400
waitms 10000

sv_cheats 1
waitms 300
noclip
waitms 400

echo ^5=== A: the column from the user's own paste, at=-11125 -5511 16320 ===
setpos -11125 -5511 15936 -89 178 0
waitms 1200
shader_here A_userpaste_up
waitms 900
solid_here A_userpaste_up
waitms 900

echo ^5=== B: the column Patch 263 probed -- documented 4-unit stack ===
setpos -13500 -5400 15936 -89 178 0
waitms 1200
shader_here B_probecol_up
waitms 900
solid_here B_probecol_up
waitms 900

echo ^5=== B2: same column, lower, so the ray is longer ===
setpos -13500 -5400 14700 -89 178 0
waitms 1200
shader_here B2_probecol_low
waitms 900
solid_here B2_probecol_low
waitms 900

echo ^5=== C: the save004 vantage the patch note prescribes, pitch -70 yaw 178 ===
setpos -10975.05 -5482.11 15936.03 -70 178 0
waitms 1200
shader_here C_save004_yaw178
waitms 900
solid_here C_save004_yaw178
waitms 900

echo ^5=== C2: same spot, straight up ===
setpos -10975.05 -5482.11 15936.03 -89 178 0
waitms 1200
shader_here C2_save004_up
waitms 900
solid_here C2_save004_up
waitms 900

echo ^5=== CONTROL: an unambiguous wall/floor, where the answer is not in doubt ===
setpos -10975.05 -5482.11 15936.03 89 178 0
waitms 1200
shader_here D_control_down
waitms 900
solid_here D_control_down
waitms 900

echo ^5=== shaderhere01 done ===
wait 30
quit
