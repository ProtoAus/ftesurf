// VC07 -- Patch 259 regression sweep.
//
// The four maps Patch 228's table names, plus the two that exercised the two
// failure classes.  Each must load, and prop_census must report the drawn count
// and the used count agreeing -- a gap now means a model with no scatter table,
// which is legitimate but should be rare and visible rather than silent.
//
// surf_leesriize_ksf is deliberately NOT here: it crashes on load with an access
// violation, at hl2_lt_baked 0 and with every one of this patch's model-loader
// changes neutralised, so it is a pre-existing fault and its own job.

log_enable 1
log_dir "logs"
log_name "vc07"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
sv_cheats 1

wait 200
echo ^5=== vc07: Patch 259 regression sweep ===

map surf_boreas
waitmap 1800
waitms 5000
echo ^5---------------------------- surf_boreas ------------------------------
prop_census
waitms 600

map bhop_ambience
waitmap 1800
waitms 5000
echo ^5--------------------------- bhop_ambience -----------------------------
prop_census
waitms 600

map surf_hektik
waitmap 1800
waitms 5000
echo ^5---------------------------- surf_hektik ------------------------------
prop_census
waitms 600

map bhop_canals
waitmap 1800
waitms 5000
echo ^5---------------------------- bhop_canals ------------------------------
prop_census
waitms 600

map surf_nyx
waitmap 1800
waitms 5000
echo ^5------------------------------ surf_nyx -------------------------------
prop_census
waitms 600

map surf_garden
waitmap 1800
waitms 5000
echo ^5----------------------------- surf_garden -----------------------------
prop_census
waitms 600

echo ^5=== vc07 done ===
wait 30
quit
