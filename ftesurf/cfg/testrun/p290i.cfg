// FTESurf p290i -- does Patch 290 still work on somebody else's binaries.
//
// A concurrent session relinked the engine and the hl2 plugin INCREMENTALLY on
// top of my 10:22 objects for their own Patch 268 Part B.  Their verification
// checks that THEIR patch is inert by default, which is the right check for
// them and does not test mine at all.
//
// This matters more than a routine regression check because the failure 290
// fixed was surf_tensor2 loading to a BLACK SCREEN.  That is the one defect in
// this tree that costs the whole picture rather than one effect, and it has
// already shipped to the user once.  So it gets re-checked on every binary that
// claims to carry it, not assumed from a successful link.
//
// FOUR THINGS, and all four must hold:
//   1. no "unexpected indentation" in the log
//   2. [shader] ftesurf/cc/surf_tensor2_* ... prog 1 passes 3
//   3. two [cclut] ... 32x32x32 lines
//   4. hl2_colourcorrection 1 vs 0 moves ~90% of the frame against a small
//      same-setting control
//
// PLAIN screenshot, never screenshot_mega: mega forces an FBO and gl_rmain.c
// :2841-2845 clears RDF_ALLPOSTPROC when dofbo is set, so a mega shot contains
// no post-processing at all and would report a working grade as a no-op.
cfg_save_auto 0
exec cfg/testrun/_quiet.cfg
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "p290i"
scr_sshot_type png
cl_yieldcpu 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0

waitms 2500
map surf_tensor2
waitmap 240
waitms 9000
sv_cheats 1
noclip
waitms 500

setpos -11684 -12864 13936 0 0 0
waitms 2500

echo "@@@ P290I state"
r_colourcorrection
hl2_colourcorrection
waitms 800

echo "@@@ P290I grade A / A2 control / B"
hl2_colourcorrection 1
waitms 1500
screenshot p290i_cc_a
waitms 1200
screenshot p290i_cc_a2
waitms 1200
hl2_colourcorrection 0
waitms 1500
screenshot p290i_cc_b
waitms 1200
hl2_colourcorrection 1
waitms 1000

echo "@@@ P290I guard -- a shader name that cannot resolve must NOT go black"
r_colourcorrection "ftesurf/cc/deliberately_not_a_shader"
waitms 2000
screenshot p290i_guard
waitms 1500

echo "@@@ P290I sprites + flares still alive"
vbsp_sprite_debug 1
waitms 1500

echo "@@@ P290I DONE"
waitms 1200
quit
