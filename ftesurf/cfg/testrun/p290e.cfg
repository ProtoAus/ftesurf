// FTESurf p290e -- the lens-flare stretch, on screen or not.
//
// vbsp_lightglow is read ONCE, in Sprite_LoadForMap (cl_sprites.qc:1095), so
// toggling it in the console changes nothing until the sprite table is rebuilt.
// Screenshotting either side of a bare `vbsp_lightglow 0` is a null test that
// looks exactly like the feature not working, and that trap has already cost one
// wrong conclusion on this report.  vbsp_sprite_debug 2 re-runs the load for
// precisely this reason, so every arm below pairs the cvar with a rebuild.
//
// The vantage is the corridor the counters were measured at: at 13312 5860 7204
// looking down -Y, the glow-only line read
//     166 reached, 65 one-sided away, 98 trace-hidden, 0 out of fade range, 3 drawn
// so three flares are in view and the A/B has something to move.
//
// PASS: on vs off moves far more of the frame than the same-setting control, and
//   the difference is visibly WIDER THAN TALL -- 65 by 35 half-extents at a fixed
//   100 units from the eye is about 66 degrees across, so it cannot be subtle.
cfg_save_auto 0
exec cfg/testrun/_quiet.cfg
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "p290e"
scr_sshot_type png
cl_yieldcpu 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0

waitms 2500
map surf_tensor2
waitmap 240
waitms 8000
sv_cheats 1
noclip
waitms 500

setpos 13312 5860 7204 0 270 0
waitms 2500

echo "@@@ P290E flares ON"
vbsp_lightglow 1
vbsp_sprite_debug 2
waitms 2000
screenshot p290e_on
waitms 1000
screenshot p290e_on2
waitms 1000
vbsp_sprite_debug 1
waitms 1000

echo "@@@ P290E flares OFF -- cvar AND rebuild"
vbsp_lightglow 0
vbsp_sprite_debug 2
waitms 2000
screenshot p290e_off
waitms 1000
vbsp_sprite_debug 1
waitms 1000

echo "@@@ P290E flares back ON"
vbsp_lightglow 1
vbsp_sprite_debug 2
waitms 2000
screenshot p290e_back
waitms 1000

echo "@@@ P290E DONE"
waitms 1200
quit
