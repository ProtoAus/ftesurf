// SKY05 -- is the see-through caused by surf_boreas having no 2D skybox loaded?
//
// What the sky04 probes established: at save009 the crosshair at pitch 17/10/6/2
// all land on `sky/tools/toolsskybox`, NOT on rock.  So a sky brush is the first
// solid thing along those rays -- the rock is BEHIND it.  And the shader body is
//
//     shader=sky/tools/toolsskybox
//     sort sky
//     surfaceparm nodlight
//     skyparms - - -
//
// with prog=- and haspass=0: no program, no skydome textures, ZERO passes.  Yet
// worldspawn declares `skyname "tendies_sky"` and the pakfile ships all six
// faces (materials/skybox/tendies_sky{up,dn,lf,rt,ft,bk}.vmt).  So `forcedsky`
// is NULL and every sky surface falls through to its own empty shader.
//
// That empty shader is what makes the two states differ in R_DrawSkyChain:
//   skyroom OFF -- no RDF_SKIPSKY; skyboxtex invalid, numpasses 0, so the
//                  batch->meshes arm draws NOTHING and writes no depth.  The
//                  rock behind the sky brush paints over it and the frame looks
//                  right by accident.
//   skyroom ON  -- RDF_SKIPSKY; the arm at gl_warp.c:586 computes `opaque` only
//                  from passes[0], so a zero-pass shader can never be opaque,
//                  and GL_DrawSkySphere runs.
//
// If that is the chain, then giving the engine a real skybox should change the
// picture.  r_skybox is CVAR_SHADERSYSTEM|RENDERERCALLBACK so it applies live.
//
//   A  skyroom 1, stock                       (the artefact)
//   B  skyroom 1, r_skybox tendies_sky        (forcedsky populated)
//   C  skyroom 0, r_skybox tendies_sky        (control for B)
//   D  skyroom 1, r_skybox "" again           (must return to A)
//
// `sky` with no argument prints what the engine thinks it has, which is the one
// fact none of the previous runs recorded.

log_enable 1
log_dir "logs"
log_name "sky05"
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 0
vid_fullscreen 0
con_notifytime 0
con_notifylines 0
con_notifytime_error 0

wait 200
echo ^5=== sky05: does a real 2D skybox fix the see-through? ===

map surf_boreas
waitmap 1800
waitms 9000
sv_cheats 1
waitms 300
noclip
waitms 300
setpos 10229.4 5262.8 14725.9 17.2046 139.3616 0
waitms 2000

echo ^5---------- what the engine thinks its sky is ----------
sky
waitms 800
r_skybox
waitms 500

echo ^5========== A: skyroom 1, stock ==========
vbsp_skyroom 1
waitms 2500
screenshot sky05_x
waitms 800
screenshot sky05_a_stock
waitms 800

echo ^5========== B: skyroom 1, r_skybox tendies_sky ==========
r_skybox tendies_sky
waitms 3000
sky
waitms 800
screenshot sky05_x
waitms 800
screenshot sky05_b_realsky
waitms 800

echo ^5========== C: skyroom 0, r_skybox tendies_sky ==========
vbsp_skyroom 0
waitms 2500
screenshot sky05_x
waitms 800
screenshot sky05_c_realsky_skyoff
waitms 800

echo ^5========== D: back to stock, skyroom 1 ==========
r_skybox ""
vbsp_skyroom 1
waitms 3000
screenshot sky05_x
waitms 800
screenshot sky05_d_backtostock
waitms 800

echo ^5=== sky05 done ===
wait 30
quit
