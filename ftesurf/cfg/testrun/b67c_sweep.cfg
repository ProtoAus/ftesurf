cfg_save_auto 0

// ===========================================================================
// BUILD 67, ARM SET C -- Patch 315 across the heaviest ambient beds, and the
// first honest measurement of what is left.
//
// WHY A SWEEP.  Patch 315 is not an ambient_generic fix, it is an ENGINE fix:
// it changes how every stereo sample in the game is buffered whenever it is
// played positionally.  b67a and b67b proved it correct on three maps.  Five
// maps is not proof either, but it is the difference between "it worked where
// I looked" and "it worked across the worst cases I could find".
//
// These are the five heaviest static ambient beds in the library, by two
// different measures, so the set is not chosen to flatter the patch:
//
//     kz_secret_temple   77 static emitters   (most in the library)
//     surf_milkyway      68
//     surf_sanguine      58
//     surf_twilight      46   summed 10.00x from 27 simultaneous emitters
//     surf_happyhands4   31   summed 10.42x from 23 simultaneous emitters
//
// PRE-REGISTERED, from the entity lumps and each sample's fmt chunk
// (scratchpad, offline, before this run).  Counts are of DISTINCT SAMPLES --
// the mono fold is cached per sfx, so 22 emitters sharing one sample give ONE
// line.  Several samples are not in Momentum's mount/hl2_dir.vpk (they are
// packed in the BSP or come from the CS:S VPK), so those are UNKNOWN offline
// and the floor is stated rather than an exact figure -- this run is what
// resolves them, which is a reason to run it rather than a weakness:
//
//   ARM  map                static  distinct  downmix lines  unknown samples
//   C1   kz_secret_temple      77      4       >= 0               4
//   C2   surf_milkyway         68      4       >= 1               1
//   C3   surf_sanguine         58      3       >= 1               1
//   C4   surf_twilight         46      1       == 0               0  <- all mono
//   C5   surf_happyhands4      31      2       >= 1               1
//
// C4 IS THE ARM WITH AN EXACT PREDICTION AND IT IS THE ONE THAT CAN FAIL.
// surf_twilight's 46 emitters share a single MONO sample, fully resolved
// offline, so the patch has nothing to do there.  Any downmix line on C4 means
// the guard is folding something it should not.
//
// ---------------------------------------------------------------------------
// THE SECOND PURPOSE, AND THE MORE INTERESTING ONE.  ent_io prints
//
//     here: Nx full scale from M emitter(s)
//
// which SV_AmbientSum computes from the QC's own attenuation.  Until today
// that number was disconnected from the speakers -- OpenAL was discarding the
// attenuation it models, so it described a mixer this machine does not use.
// With Patch 315 the stereo samples are finally subject to the falloff the
// number assumes, so for the first time this figure means something.
//
// It is being READ, not asserted: spawn is wherever the map puts us and is not
// the worst point.  The offline census says surf_twilight and surf_happyhands4
// reach 10.00x and 10.42x SOMEWHERE, and those are beds of correctly
// attenuated emitters stacking -- nothing to do with stereo, and nothing
// Patch 315 addresses.  If this run shows a large figure at spawn on either,
// that is a NEW finding about a DIFFERENT problem, and it belongs to the user's
// "leave the loudness true" call rather than to this patch.
//
// Muted throughout.  Every assertion is a count in a log.
// ---------------------------------------------------------------------------
// RESULTS, 2026-09-13.  logs/b67c_sweep.log.
//
// FIVE OF FIVE.  282 static emitters across five maps, every count matched.
//
//   ARM  map                static  downmix  named
//   C1   kz_secret_temple      77      0     -- all four samples are MONO
//   C2   surf_milkyway         68      1     wind/wasteland_wind
//   C3   surf_sanguine         58      2     wind/dry_air_short_tunnel,
//                                            water/lake_water
//   C4   surf_twilight         46      0     EXACT prediction held
//   C5   surf_happyhands4      31      1     canals/dam_water_loop2
//
// C4 IS THE RESULT THAT COUNTS.  46 emitters sharing one fully-resolved MONO
// sample, and the patch left every one of them alone.  A guard that folded on
// "is it a positional source" rather than "is it a positional source with a
// stereo buffer" would have printed a line here and still have looked correct
// on all four other arms.
//
// C1 IS THE SECOND-BEST RESULT AND IT IS A NEGATIVE ONE.  The library's
// heaviest bed -- 77 emitters -- needed NOTHING from this patch.  So "many
// emitters" was never the predictor; "stereo" is.  Had the fix been the
// duplicate-static cap this plan originally proposed, kz_secret_temple would
// have been mangled for no reason.
//
// THE SWEEP RESOLVED SAMPLES THE OFFLINE CENSUS COULD NOT.  Six of the ten
// samples here are not in Momentum's mount/hl2_dir.vpk, so the census could
// only bound them.  In-game: kz_secret_temple's four are all mono, and
// surf_sanguine's dry_air_short_tunnel is STEREO -- and that one carries 57
// emitters across 2 maps in the census's "not found" bucket.  So the library
// figure of "at least 370 stereo emitters across 53 maps" is confirmed as a
// genuine floor, not a hedge: the real number is higher.
//
// ---------------------------------------------------------------------------
// THE `here:` FIGURES, READ NOT ASSERTED, AND WHAT THEY DO AND DO NOT SAY.
//
//   C1 kz_secret_temple  0.60x from 1 emitter(s)
//   C2 surf_milkyway     0.30x from 1
//   C3 surf_sanguine     0.30x from 1
//   C4 surf_twilight     0.00x from 0
//   C5 surf_happyhands4  0.00x from 0
//
// All modest, all at spawn, and spawn is not the worst point -- the offline
// census puts surf_twilight at 10.00x and surf_happyhands4 at 10.42x SOMEWHERE
// on those maps.  This run neither confirms nor refutes those, and saying so is
// the point: an arm that reads a number at one position has measured that
// position.
//
// AND A CAVEAT ON THE 10x FIGURES THAT SHOULD BE STATED BEFORE ANYONE ACTS ON
// THEM.  The census evaluates the sum at each EMITTER'S OWN ORIGIN, because
// that is cheap and is guaranteed to be near something.  Ambient emitters are
// routinely buried in ceilings, inside brushwork and outside the playable
// volume, so the worst point it finds may be somewhere no player can stand.
// The figure is an upper bound on a reachable one, not a measurement of it.
// Confirming it needs a walkable position per map, which is real work and is
// NOT this patch's business: those beds are correctly attenuated mono emitters
// stacking, which is a loudness question, and the user's standing call on
// loudness is to leave it true.
// ===========================================================================

log_enable 1
log_dir logs
log_name b67c_sweep
developer 1
log_developer 1
cl_maxfps 100
con_notifylines 0

volume 0
bgmvolume 0

vbsp_sound 1
s_al_downmix3d 1

waitms 5000

echo ^5=== C1: kz_secret_temple -- 77 static, 4 samples, all unknown offline ===
snd_restart
waitms 1500
map kz_secret_temple
waitmap 90
waitms 9000
ent_io
waitms 2000

echo ^5=== C2: surf_milkyway -- 68 static, expect >= 1 ===
snd_restart
waitms 1500
map surf_milkyway
waitmap 90
waitms 9000
ent_io
waitms 2000

echo ^5=== C3: surf_sanguine -- 58 static, expect >= 1 ===
snd_restart
waitms 1500
map surf_sanguine
waitmap 90
waitms 9000
ent_io
waitms 2000

echo ^5=== C4: surf_twilight -- 46 static, ONE MONO sample, expect EXACTLY 0 ===
snd_restart
waitms 1500
map surf_twilight
waitmap 90
waitms 9000
ent_io
waitms 2000

echo ^5=== C5: surf_happyhands4 -- 31 static, census says 10.42x somewhere ===
snd_restart
waitms 1500
map surf_happyhands4
waitmap 90
waitms 9000
ent_io
waitms 2000

echo ^5=== END OF RUN ===
quit
