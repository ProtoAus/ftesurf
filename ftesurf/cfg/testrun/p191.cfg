// Patch 191: case-insensitive target repair.
//
// Every count below was predicted from the BSP entity lump BEFORE the run, so
// this is a check and not a rubber stamp.  Expected "target case: N
// reference(s) repaired":
//
//     surf_kitsune    28      (of 44 trigger_teleports -- the reported map)
//     surf_tycho      74      (worst in the library)
//     surf_prevail    52
//     surf_mesa_mine  48
//     surf_delight    41
//     bhop_aberrant    0      CONTROL -- must print NO line at all
//
// A map that prints more than predicted means the pass is repairing something
// it should not; fewer means a destination did not survive the spawn pass.
cfg_save_auto 0
log_name p191
developer 0
waitms 3000

echo "=== P191 CONTROL: bhop_aberrant, expect NO target-case line ==="
map bhop_aberrant
waitms 20000

echo "=== P191: surf_kitsune, expect 28 ==="
map surf_kitsune
waitms 25000

echo "=== P191: surf_tycho, expect 74 ==="
map surf_tycho
waitms 35000

echo "=== P191: surf_prevail, expect 52 ==="
map surf_prevail
waitms 35000

echo "=== P191: surf_mesa_mine, expect 48 ==="
map surf_mesa_mine
waitms 35000

echo "=== P191: surf_delight, expect 41 ==="
map surf_delight
waitms 35000

echo "=== P191 DONE ==="
waitms 1000
quit
