// ***************************************************************************
// SUPERSEDED BY jit05/jit06 AND ENGINE PATCH 269.  Its MEASUREMENTS stand and
// are still cited; its CONCLUSION does not.  This file blames the engine's
// per-rendered-frame extrapolation, and cl_predtrace later showed that block
// runs ZERO times in 3,200 traced frames -- it was never involved.  The real
// cause is the velocity blend at the end of CL_PredictMovePNum, which mixes the
// live predicted velocity with a network field that is not maintained for your
// own player and freezes at the last speed you were moving at.
//
// The observation below that the bad sample is the FIRST rendered frame of each
// command frame is correct, and the new explanation PREDICTS it (small blend
// fraction f => large (1-f)*stale), where this file had to work around it.
// ***************************************************************************

// BUILD 47 -- the jitter, measured at a REAL framerate this time.
//
// jit01 ran at ~200 fps (3 rendered frames per command frame) because an
// unfocused FTE window is capped by cl_idlefps, default 60 -- cl_main.c:7428,
// "if (idle && cl_idlefps.value > 0)".  A capture that does not reach the
// framerate the report is about proves nothing about it, and jit01's clean
// result must not be read as one.  cl_idlefps 0 removes the cap without needing
// the window focused at all.
//
// WHAT jit01 DID ESTABLISH, and it stands: the INPUT layer is clean.  After a
// key release hud_wishtrace shows fore decaying 179 -> 38 -> 16 -> 0 within
// about four rendered frames, and 0 for every frame after.  That is
// CL_AccumlateInput's time-weighted average draining, not a stale command being
// held -- so a residual that DECAYS cannot be the cause of a flicker that
// persists while you wait.
//
// SO THE QUESTION HERE IS THE NEXT ONE DOWN: with the input at zero, does the
// PREDICTED state still move between rendered frames?
//
//     hud_veltrace prints per RENDERED frame, with clientcommandframe first.
//     Many frames share one command frame at high fps.
//
//     numbers CONSTANT within a command frame  -> nothing to fix here; the
//         wobble is a display or latch question after all.
//     numbers MOVING while the command frame does not  -> it is the engine's
//         extrapolation.  cl_pred.c runs one extra partial command per rendered
//         frame of msec = (simtime - to.time)*1000, which sawtooths across a
//         send cycle, so consecutive frames carry different amounts of extra
//         simulation off the SAME input.  That is framerate-dependent, absent at
//         60, and it is the shape the report describes.
//
// The trailing `wait` after each arm is longer than the trace, so the dump
// cannot be cut off by the next command.

log_developer 1

waitms 2000

map surf_colin_blaster_69000
waitmap 240
wait 60

cl_idlefps 0
cl_maxfps 0
hud_debug 1
hud_speed 1
hud_strafe 1
wait 60

echo ^5=== how fast are we actually rendering?
show_fps 1
wait 120

echo ^5=== A: standing still, untouched.  Baseline for everything below.
hud_veltrace 120
wait 200

echo ^5=== B: tap forward and release, then trace 400 frames of doing nothing
+forward
wait 20
-forward
wait 10
hud_veltrace 400
wait 500

echo ^5=== C: same again with a strafe key
+moveright
wait 20
-moveright
wait 10
hud_veltrace 400
wait 500

echo ^5=== D: the control the report names -- at 60 fps it does not happen
cl_maxfps 60
cl_idlefps 60
wait 120
+forward
wait 20
-forward
wait 10
hud_veltrace 200
wait 400

echo ^5=== END OF RUN ===
wait 20
quit
