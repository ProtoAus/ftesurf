// BUILD 26 stage 1, third pass -- THE ANCHOR, with a grounded control.
//
// b26b left one file and no way to read the other, so it could show that the
// anchor came back but not WHAT it came back as.  Three saves instead, each
// answering one question, and none of them deleted:
//
//   save001  taken STANDING on the start block.  The anchor is the ground under
//            us and there is nothing to argue about: this is the control, and it
//            is what the other two must match.
//   save002  taken 293 units up, airborne, INSIDE the 512-unit guard.  Its
//            anchor must STILL be the block -- being in the air does not move
//            the reference, only jumping does, and the guard must not fire on a
//            move this short.
//   save003  taken after moving ~580 units (past the guard, so the live
//            reference is provably destroyed) and loading save002 back.  Its
//            anchor must equal save002's.
//
// save001 == save002 says the guard behaves.  save002 == save003 says the
// restore works.  A failure in either shows as a ~293-unit difference, which is
// nowhere near a rounding error.

developer 1
log_developer 1
cfg_save_auto 0

wait 200
map surf_aesthetic
waitmap 90

echo ""
echo "=== save 1: STANDING on the start block -- the control ==="
cmd zone_goto 0
wait 25
viewpos
wait 4
cmd sl_save
wait 20
echo ""

echo "=== save 2: 293 units up, airborne, inside the guard ==="
setpos -15744 0 1350
wait 6
viewpos
wait 4
cmd sl_save
wait 20
echo ""

echo "=== ~580 units away: past the guard.  The live reference dies here. ==="
setpos -15200 200 1100
wait 20
viewpos
wait 4
echo ""

echo "=== load save 2 back, then save 3 immediately ==="
cmd sl_goto 2
wait 8
viewpos
wait 4
cmd sl_save
wait 20
cmd sl_list
wait 6
echo ""

echo "=== b26c done -- three saves left on disk deliberately ==="
wait 20
quit
