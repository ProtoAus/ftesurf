// Build 66, step 2: WHO SET THE RUN, in the recording's filename.
//
// The name was <ticks7>_<tag>.rec and had no player dimension at all, so two
// people finishing the same leg on the same tick wrote the same path and the
// second silently replaced the first.  cfg/lobby.cfg:183 has carried that as a
// reason not to record on a lobby since Patch 270, beside the memory reason
// that build 66's streaming recorder retired.  This is the other half.
//
// THREE ARMS IN ONE LAUNCH, because two of the three questions cannot be asked
// of the same process state:
//
//   ARM 0  ui_who, before any map.  The GRAMMAR, self-checking, against a table
//          of hostile names written into m_main.qc -- traversal, backslashes,
//          underscores, colour codes, a name that slugs to seven digits.  A run
//          produces ONE name and takes a map load to do it; this produces
//          fourteen and needs no map.  It also proves digest_hex works at all,
//          which is a first call anywhere in this tree.
//   ARM 1  lobby_enable 1, a real finish.  The half only the server knows: that
//          Lobby_Active() is what turns the segment on, that the GUID actually
//          arrives over the wire, and that the name reaches the DISK with a
//          segment in it.  Two finishes under two names, the second a path
//          traversal, so "the file did not escape data/runs" is answered by the
//          filesystem rather than by a string check.
//   ARM 2  lobby_enable 0, a third finish.  The CONTROL, and the one that
//          matters most for what is already on this disk: off a lobby the name
//          must be byte-for-byte what build 65 wrote, because 83 recordings and
//          every .view sidecar the client spells are named that way.
//
// A FINISH IS SCRIPTED BY FLYING TO THE END ZONE UNDER `noclip` -- see
// b66rec.cfg for why that works and why `zone_goto` into the end box does not.
// The runs classify as `cheated`, which is right and does not matter here: the
// tag is unstamped, and build 66 gives the UNSTAMPED names a player segment
// too (last.rec and cheat.rec are fixed names, i.e. one shared write target for
// thirty-two people).  So `cheat` is the arm that tests the harder half of the
// grammar, not a degenerate one.
//
// PREDICTION:
//   arm 0   ui_who: all rows pass
//   arm 1   would write data/runs/bhop_eazy/main/<slug>-<8 hex>_pb.rec
//           and on the disk afterwards: <slug>-<8 hex>_cheat.rec, twice, under
//           two different slugs sharing ONE id (same install, two names)
//   arm 2   would write data/runs/bhop_eazy/main/0000000_pb.rec  -- no segment
//           and on the disk: a plain cheat.rec beside the two above
//
// FALSIFIED IF: any ui_who row fails; or arm 1's filename has no segment (the
// GUID never arrived -- the fallback prints as `s0`, which is a DIFFERENT and
// also-correct answer that this run must be able to tell apart from success);
// or the two arm-1 files share a name (the collision is not fixed); or their
// ids differ (a rename orphans a player's runs); or arm 2's name is anything
// other than today's; or anything at all appears outside data/runs.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name b66who
log_developer 1
developer 1

// `set`, not a bare assignment: all four are registered in worldspawn, which
// has not run yet, so a bare line is `Unknown command` and the run silently
// tests the default.  That cost b66rec.cfg its whole arm once already.
set rec_enable 1
set lobby_enable 1
set lobby_norec 0
set sv_guidkey b66who

// The client half of the GUID.  With this empty the client sends one only when
// the server offers a salt; forcing it removes a variable from an arm whose
// whole point is that the identity arrives.
cl_sendguid 1

// ---- ARM 0: the grammar, before anything else ---------------------------
//
// menu_restart is MANDATORY and is not a delay.  menuQC is initialised lazily
// -- at the very end of startup, in practice when something forces it -- so a
// `ui_*` command issued from a +exec answers `Unknown command` no matter how
// long the wait before it.  Three launches were lost to that once.
waitms 6000
menu_restart
waitms 3000
echo ^5==== b66who arm 0: the filename grammar ====
ui_who
waitms 1000

// ARM 0b: the pruner's pattern, against real files through the engine's own
// enumerator.  It is here rather than in the run because SV_RecPrune fires only
// for an ARCHIVED tag and every finish a config can produce is a cheated one,
// which is never archived -- so the one change in this build that can DELETE a
// player's runs is otherwise unreachable from a harness.
echo ^5==== b66who arm 0b: the pruner glob ====
ui_who glob
waitms 1000

map bhop_eazy
waitmap 45
waitms 3000

echo ^5==== b66who arm 1: a lobby run, under a readable name ====
name "^1Lex The Great!"
waitms 500
cmd timer

// zone_goto drops us in the start box and arms; the setpos after it only pins
// the heading (zone_goto's own angles do not hold).  Straight line to the end
// box: dx 2992, dy -1376, so yaw atan2(-1376,2992) = 335.3, pitch 0 to stay on
// the zones' single z plane.
cmd zone_goto 0
waitms 1000
setpos -352 -352 144 0 335.3 0
waitms 1000
noclip
waitms 500
+forward
waitms 9000
-forward
waitms 1500
echo ^5==== b66who arm 1a: after the end zone ====
cmd timer
waitms 1500

// ---- ARM 1b: the same install, a hostile name ---------------------------
// The slug must keep the letters and drop everything that could leave the
// directory, and the id must be IDENTICAL to arm 1a's: same install, different
// name.  That pair is what makes a player's runs still group after a rename.
echo ^5==== b66who arm 1b: the same player under ../../autoexec ====
name "../../autoexec"
waitms 500
cmd timer
cmd zone_goto 0
waitms 1000
setpos -352 -352 144 0 335.3 0
waitms 1000
+forward
waitms 9000
-forward
waitms 1500
cmd timer
waitms 1500

// ---- ARM 2: the control ------------------------------------------------
// Off a lobby there is one player on the disk by definition, so the name must
// not change.  This is the arm that protects what is already written.
echo ^5==== b66who arm 2: lobby off -- the name must be unchanged ====
lobby_enable 0
waitms 500
cmd timer
cmd zone_goto 0
waitms 1000
setpos -352 -352 144 0 335.3 0
waitms 1000
+forward
waitms 9000
-forward
waitms 1500
cmd timer
waitms 2000

echo ^5==== b66who: done ====
quit
