// FTESurf Patch 193, run B: the A/B arms, aimed by run A's baseline.
//
// Run A found TWO different problems on demise and did not reproduce the complaint on
// sodacity's start zone at all:
//
//   demise/start    24.6 fps   Opaque Batches 27.1ms of 40.7 (67%), 5,230,080 indices,
//                              1453 Ent Batches vs 59 World Batches.  Geometry/submission.
//   demise/smoke     7.4 fps   PREDICTION 127.6ms of 135.1 (94%) + Server 59.5ms.
//                              Opaque only 5.3ms.  Not the renderer at all.
//   sodacity/start 110.5 fps   nothing wrong here.
//   utopia/start   771.7 fps   control.
//   aberrant/start1196.5 fps   504 brush models.  The brush-entity theory is dead.
//
// So the arms split by problem rather than by cvar.
//
// A. demise/start -- where do 5.2M indices come from?
//    r_drawentities 3 skips mod_alias (gl_alias.c:3403); Source props are mod_alias
//    (mod_hl2.c:1021), so that is PROPS OFF.  r_drawentities 2 skips mod_brush
//    (gl_alias.c:3396) = BRUSH ENTITIES OFF, cheat-gated.  r_drawentities 0 returns
//    before both (gl_alias.c:3268).  The three arms have to add up to the baseline.
//
// B. demise/smoke -- is the Prediction bucket the prop collision hulls?
//    pr_csqc.c:8930-8936 already WROTE this hypothesis down and bracketed the bucket to
//    test it: "dominated by CL_PredictMove tracing against every SOLID_PHYSICS_TRIMESH
//    prop with no broadphase: PM_TransformedHullCheck's convex-hull branch calls
//    PM_HullTrace and returns BEFORE the cheap AABB rejects".  That is pmovetst.c:407-411
//    (cm==2, the default) returning true before the rejects at :436-442, and the rotated
//    path at :421-433 which has no reject at all.
//    sv_prop_collision 1 is the exact discriminator: it takes the SAME props down the
//    fall-through NativeTrace path, which DOES have the AABB rejects.  If Prediction
//    collapses there, the missing reject is the cause and nothing else changed.
//    cl_nopred 1 is the sanity check that the bucket is what it says it is.
//
// C. sodacity -- the complaint says "very low FPS like demise" but the start zone is
//    110fps, so find where it actually lives.  Positions are the map's own stage-start
//    teleport destinations plus its two densest static-prop cells (955 props total).

cfg_save_auto 0
log_name p193b
developer 0
scr_sshot_type png
cl_yieldcpu 0
cl_maxfps 0
vid_vsync 0
r_speeds 2
waitms 2500

echo "=== P193B A/B ARMS ==="

// ================================================== A: demise/start, the geometry split
echo "### MAP surf_demise"
map surf_demise
waitmap 180
waitms 6000
sv_cheats 1

echo "### DUMP A demise-start base"
setpos -12192 -3920 15128 0 0 0
wait 300
r_speeds_dump
wait 10
screenshot_mega p193b_demise_base 1280 720

echo "### DUMP A demise-start props-off"
r_drawentities 3
setpos -12192 -3920 15128 0 0 0
wait 300
r_speeds_dump
wait 10
screenshot_mega p193b_demise_noprops 1280 720

echo "### DUMP A demise-start brushents-off"
r_drawentities 2
setpos -12192 -3920 15128 0 0 0
wait 300
r_speeds_dump
wait 10
screenshot_mega p193b_demise_nobrush 1280 720

echo "### DUMP A demise-start allents-off"
r_drawentities 0
setpos -12192 -3920 15128 0 0 0
wait 300
r_speeds_dump
wait 10
screenshot_mega p193b_demise_noents 1280 720
r_drawentities 1

// ================================================== B: demise/smoke, the prediction split
echo "### DUMP B demise-smoke base"
setpos 7223 -6287 4763 0 0 0
wait 300
r_speeds_dump
wait 10
screenshot_mega p193b_smoke_base 1280 720

echo "### DUMP B demise-smoke propcol1 (AABB-rejecting path)"
sv_prop_collision 1
setpos 7223 -6287 4763 0 0 0
wait 300
r_speeds_dump
wait 10
screenshot_mega p193b_smoke_propcol1 1280 720

echo "### DUMP B demise-smoke propcol0 (props non-solid)"
sv_prop_collision 0
setpos 7223 -6287 4763 0 0 0
wait 300
r_speeds_dump
wait 10
sv_prop_collision 2

echo "### DUMP B demise-smoke nopred"
cl_nopred 1
setpos 7223 -6287 4763 0 0 0
wait 300
r_speeds_dump
wait 10
cl_nopred 0

echo "### DUMP B demise-smoke allents-off"
r_drawentities 0
setpos 7223 -6287 4763 0 0 0
wait 300
r_speeds_dump
wait 10
r_drawentities 1

// ================================================== C: where is sodacity actually slow?
echo "### MAP surf_sodacity"
map surf_sodacity
waitmap 180
waitms 6000
sv_cheats 1

echo "### DUMP C sodacity-hub"
setpos -3040 14128 -11374 0 180 0
wait 300
r_speeds_dump
wait 10
screenshot_mega p193b_soda_hub 1280 720

echo "### DUMP C sodacity-stage2s"
setpos -288 11616 -2504 0 180 0
wait 300
r_speeds_dump
wait 10
screenshot_mega p193b_soda_stage2s 1280 720

echo "### DUMP C sodacity-stage4door"
setpos -8704 9756 15780 0 180 0
wait 300
r_speeds_dump
wait 10
screenshot_mega p193b_soda_stage4door 1280 720

echo "### DUMP C sodacity-propdense1"
setpos -4864 14080 -11008 0 180 0
wait 300
r_speeds_dump
wait 10
screenshot_mega p193b_soda_dense1 1280 720

echo "### DUMP C sodacity-propdense2"
setpos 14080 11520 -1280 0 180 0
wait 300
r_speeds_dump
wait 10
screenshot_mega p193b_soda_dense2 1280 720

echo "### DUMP C sodacity-propdense3"
setpos -13568 -9984 256 0 180 0
wait 300
r_speeds_dump
wait 10
screenshot_mega p193b_soda_dense3 1280 720

echo "=== P193B DONE ==="
waitms 1500
quit
