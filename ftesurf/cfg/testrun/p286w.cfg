// FTESurf p286w -- p286v again, with the two things it was missing.
//
// 1. log_enable 1.  p286v set log_dir and log_name and no log was written, so
//    every census line -- the glare-skip count, "lightglows N of M drawn", the
//    UnlitTwoTexture census and the animpass script dump -- was lost, and the
//    only evidence left was pixels.
//
// 2. A SAME-SETTING CONTROL AT EACH VANTAGE.  p286v compared hl2_twoframes 1
//    against 0 and read 12.5% of the frame differing at 70 units.  That is not
//    evidence: comshieldwall SCROLLS its second layer at .1 and pulses its alpha
//    on a 1.08s sine, so two shots of it a second apart differ by a large amount
//    with nothing changed at all.  Without a same-setting pair at the same
//    vantage there is no noise floor to compare against, and a scrolling
//    material has already put one at 72% once in this project.
//
//    So every arm here is THREE shots: A, A again, then B.  If (A vs A2) is the
//    same size as (A vs B), the difference is the animation and the flipbook is
//    not visible in a still.
//
// The mechanical proof is the log, not the pictures: the generated shader body
// is dumped at developer 1 for any material whose program lives in a pass, so
// "#FRAMES" and "map $2darray:" appearing in it is what says the arm was taken.
cfg_save_auto 0
exec cfg/testrun/_quiet.cfg
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "p286w"
scr_sshot_type png
cl_yieldcpu 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0

waitms 2500

map surf_tensor2
waitmap 240
waitms 8000
sv_cheats 1
noclip
waitms 500

echo "@@@ P286W ---- cvar state ----"
vbsp_lightglow
hl2_twoframes
hl2_twotexture
vbsp_glare_brush
waitms 800

// ---------------------------------------------------- env_lightglow, with a control
echo "@@@ P286W lightglow: ON, ON again (control), OFF -- 1791 units from a facing pair"
vbsp_lightglow 1
waitms 1500
setpos -11776 -13000 13800 0 90 0
waitms 2500
screenshot_mega p286w_glow_a 1280 720
waitms 1200
screenshot_mega p286w_glow_a2 1280 720
waitms 1200
vbsp_lightglow 0
waitms 1500
screenshot_mega p286w_glow_b 1280 720
waitms 1000
vbsp_lightglow 1
waitms 1000

// a second vantage: much closer to one of the pair, still outside MinDist 500
echo "@@@ P286W lightglow at ~900 units, looking straight at the -12216 one"
setpos -11776 -12100 13840 0 155 0
waitms 2000
screenshot_mega p286w_glow_c 1280 720
waitms 1000

// ---------------------------------------------------- the shield, with controls
echo "@@@ P286W shield at 70 units: ON, ON again (control), OFF"
hl2_twoframes 1
waitms 1200
setpos -11776 -10890 13744 0 90 0
waitms 2000
screenshot_mega p286w_s70_a 1280 720
waitms 1200
screenshot_mega p286w_s70_a2 1280 720
waitms 1200
hl2_twoframes 0
waitms 1500
setpos -11776 -10890 13744 0 90 0
waitms 1500
screenshot_mega p286w_s70_b 1280 720
waitms 1000

echo "@@@ P286W shield at 600 units: ON, ON again (control), OFF"
hl2_twoframes 1
waitms 1500
setpos -11776 -11420 13744 0 90 0
waitms 2000
screenshot_mega p286w_s600_a 1280 720
waitms 1200
screenshot_mega p286w_s600_a2 1280 720
waitms 1200
hl2_twoframes 0
waitms 1500
setpos -11776 -11420 13744 0 90 0
waitms 1500
screenshot_mega p286w_s600_b 1280 720
waitms 1000
hl2_twoframes 1
waitms 800

// ---------------------------------------------------- the inspector
echo "@@@ P286W ent_here at the spawn portal -- expect func_brush *19"
setpos -11776 -11020 13744 0 90 0
waitms 1500
ent_here
waitms 1500
echo "@@@ P286W ent_reload then ent_here again"
ent_here
waitms 1500

echo "@@@ P286W looking down at the floor -- expect a trigger or worldspawn"
setpos -11776 -13000 13720 45 90 0
waitms 1500
ent_here
waitms 1500

echo "@@@ P286W DONE"
waitms 1200
quit
