// cfg/testrun/p278a.cfg -- Patch 278, one client, the things one client can prove.
//
// A single listen server with lobby_av_self 1, so this client IS sent its own
// avatar and ghost mode can look at it.  Two clients are needed for the colour
// COMPARISON (that is p278b) but not for any of the following, all of which are
// about whether the machinery came up at all:
//
//   1. THE REGISTRATION TRAP.  The log must contain NO "Created QC Cvar" line
//      for lobby_av_colors, lobby_av_fx or lobby_av_fxmax.  All three are read
//      from Lobby_Frame, which runs on a StartFrame that precedes worldspawn,
//      and two of the three have non-zero defaults -- exactly the shape that
//      silently killed lobby_avatars.  If a line appears, the default never
//      landed and the feature is inert.
//
//   2. THE PARTICLE FILE.  "execing particles/ftesurf_avatar.cfg" must appear,
//      and r_partinfo must list ftesurf_avtrail_* / ftesurf_avmote_* types.  A
//      server-side particleeffectnum does NOT verify anything -- a name that
//      resolves nowhere precaches happily and draws nothing, silently -- so
//      r_partinfo is the only proof the client actually has these.
//
//   3. THE MODEL HEIGHT.  ghost mode, backed off, on flat ground.  See p278a-4.
//
// PORT 27600.  Never the default: a test that binds 27500 loses the race
// against the developer's own server, and the client then connects to THEIRS.

sv_port 27600

// `wait n` counts FRAMES and ftesurf.cfg sets cl_maxfps 0, so uncapped this
// renders ~1900 fps at the menu and every wait below is meaningless.  Capped at
// 100, `wait n` is n centiseconds of RENDERED time.
cl_maxfps 100

// Con_DPrintf is where "Created QC Cvar" and the particle census go.
log_developer 1
developer 1

wait 200
echo "^3p278:^7 loading map"
map surf_null

wait 600

// Lobby from the CONSOLE, not from cfg/lobby.cfg.  Deliberate: lobby.cfg `set`s
// these before the map loads, so the value is already there and the default
// never has to land -- which is exactly what hid the registration bug the first
// time.  Typing them after the map is up is the path that was broken.
lobby_enable    1
lobby_avatars   1
lobby_av_self   1
lobby_av_colors 1
lobby_av_fx     1
echo "^3p278:^7 lobby on"

// Ask for both effects on this client's own avatar.
setinfo lobbyfx 3

wait 300

// Report what the cvars actually READ.  Anything printing "" here is the trap
// back again, and the point of echoing them is that the log carries the proof
// rather than the intention.
echo "^3p278:^7 --- cvar readback ---"
lobby_av_colors
lobby_av_fx
lobby_av_fxmax
lobby_av_rate
cl_lerp_maxdistance

// The particle pool.  Lists every loaded type with a live count, plus the free
// list -- p_script.c:2794-2836.  This is the instrument for the whole effects
// budget; the "83% of the pool" figure in default.cfg is an ARITHMETIC estimate
// and not a measurement, so do not cite it as one.
echo "^3p278:^7 --- r_partinfo ---"
r_partinfo

wait 200
screenshot p278a-1-first

// Ghost off the body and back away, so the avatar is in frame.
ghost
wait 100
screenshot p278a-2-ghost

wait 400
screenshot p278a-3-body

// THE HEIGHT SHOT, AND IT IS A SIGN TEST RATHER THAN A MEASUREMENT.
//
// Eye is at 64 and the crown is now at 62, so the margin is TWO UNITS -- a few
// pixels at any real distance, and not something to judge by eye.  But at pitch
// 0 the crosshair sits exactly at eye height, so the question becomes binary:
//
//     after the fix  (crown 62 < eye 64):  NO model above the crosshair.
//     before the fix (crown 72 > eye 64):  8 units of model above it.
//
// That flips sign across the change, which is what makes it a real test rather
// than an agreement.  The negative control is to rebuild with
// `mkplayermodel.py --no-hull-check` and HEIGHT_STAND 72 and re-shoot.
//
// BACK THE CAMERA OFF FIRST.  `ghost` detaches the camera but leaves it exactly
// where the body is, so without this the body is behind the near plane and the
// shot is of the empty room.  The first run of this test did exactly that.
echo "^3p278:^7 crown-vs-crosshair: NOTHING may sit above the crosshair"
+back
wait 220
-back
wait 120
screenshot p278a-4-crown

// Falsify the master switch.  With lobbyfx still 3, this must produce NO
// particles at all -- an ignored master switch looks exactly like success.
echo "^3p278:^7 --- lobby_av_fx 0, effects must vanish ---"
lobby_av_fx 0
wait 300
r_partinfo
screenshot p278a-5-fxoff

// And colours off: the avatar must go back to plain flat green, byte-identical
// to before Patch 278.
echo "^3p278:^7 --- lobby_av_colors 0, avatar must be flat green ---"
lobby_av_colors 0
wait 300
screenshot p278a-6-coloff

wait 200
quit
