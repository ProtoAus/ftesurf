// FTESurf b58fog -- FIXED-FUNCTION FOG IS BEING APPLIED TO THE 2D PASS.
//
// THE CAUSE, and it is mine. BE_ProglessFogBegin (gl/gl_backend.c:5304) has no
// shaderstate.force2d guard, and the comment at :5301-5302 says why it was left
// out: "2D is safe without a guard: it draws at an eye-space depth of ~0, where
// both fog modes give a factor of 1, i.e. no fog."  That is true for a POSITIVE
// fog start and false for a negative one.  :5338 passes GL_FOG_START =
// r_refdef.globalfog.depthbias, and surf_tensor2's env_fog_controller has
// fogstart -2500, fogend 15000, fogcolor 41 66 90.  At 2D depth:
//
//     f = 15000 / (15000 - (-2500)) = 0.857143
//     added = (1 - f) * colour = 0.142857 * (41,66,90) = (5.86, 9.43, 12.86)
//
// EVERY PROGRAM-LESS 2D QUAD THEREFORE GETS (6,9,13) ADDED.  Predicted with no
// free parameters and already measured four ways off disk:
//   boxbug.png (Lex's own)            median (6.20, 8.87, 12.93)  n=223
//   b58cc_on_ctl - b58cc_on           EXACTLY (6,9,13) on 3163 px
//   b58box_H - b58box_A               EXACTLY (6,9,2)  (blue clipped, bg B=253)
//   boxbug2.png (colin_blaster)       (6.87,6.80,6.73) neutral -- that map's
//                                     fogstart is +2000, so no fog term at all;
//                                     its residue is plain antialiasing.
// A blue-dominant residue matching fogcolour x 0.142857 on all three channels is
// something no font, atlas or blend mechanism can produce -- they can only give a
// multiple of the text colour (224,227,231, near-neutral) or of $whiteimage.
//
// WHY BOTH SHAPE REPORTS WERE RIGHT.  The fog supplies the FILL; the font path
// supplies the SHAPE, and there are two:
//   gl_font.c:3366-3372  BITMAPPLANE: sw = c->advance, sh = font->charheight
//                        -> the whole CHARACTER CELL.  Console notify and any
//                        failed CSQC loadfont slot draw this way.
//   gl_font.c:3380-3386  default (atlas): sw = c->bmw, sh = c->bmh
//                        -> the GLYPH INK BBOX.  The GoogleMed TTF path.
// So Lex's "a grey square behind every letter" (cell-shaped, console) and my
// measurement that the '.' of "100.0" has no box above it (bbox-shaped, counter)
// are both correct and describe different surfaces.  I spent an hour treating
// them as contradictory.
//
// WHY IT LOOKS MAP-SPECIFIC: of 1339 BSPs only SEVEN have fogenable, maxdensity
// >= 1 and fogstart < 0, and tensor2 is by far the worst at 14.3%.  surf_tensor
// -- the control used in Patch 273 -- is -100/15000, i.e. 0.2/255, invisible.
// So the "only on tensor2" framing was not contrast, as I had guessed; it is a
// real property of that map's fog keys.
//
// WHAT THIS CONFIG DOES: the one clean switch. r_fog_progless is read in exactly
// one place (gl_backend.c:5310) and the engine's only other qglEnable(GL_FOG)
// (gl_rmain.c:2235) has its sole call site commented out at gl_rmain.c:3043.
//
// NOTE THE GATE AT :5319-5320: the function already declines when
// (!r_fog_linear.ival && depthbias), so this bug needs r_fog_linear 1.  The arm
// order below records the live value before touching anything.
//
// PASS: boxes gone in B, back in C, and the WORLD's distance fog unchanged in
//       all three (this is a 2D bug; the scene must not move).
// FAIL: no change -- then the arithmetic above is a coincidence and the four
//       measured deltas need another explanation.
//
// r_fog_progless 0 IS NOT THE FIX and must not ship as one: it would re-break the
// surf_boreas cloud layers that Patch 266 exists for.  The fix is one line,
// `if (shaderstate.force2d) return false;` at the top of BE_ProglessFogBegin,
// plus the same guard on the GLSL side at gl_backend.c:4448-4449.
cfg_save_auto 0
exec cfg/testrun/_quiet.cfg
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "b58fog"
scr_sshot_type png
cl_yieldcpu 0
vid_vsync 0
crosshair 0
fov 100
con_notifylines 0
con_notifytime 0.01

waitms 2500
map surf_tensor2
waitmap 240
waitms 8000
sv_cheats 1
noclip
waitms 500

con_textfont "gfx/fonts/GoogleMed.ttf"
con_textsize 16
hud_scale 2
r_renderscale 2
show_fps 1
// Muted, so the 2D text is readable rather than sitting on a white-out.
vbsp_lightglow_scale 0
vbsp_sprites 0
setpos -10688.5 -1773.8 -8587.1 6.3 91.1 0
waitms 5000

// Record the fog state this map actually installed, and the two cvars the gate
// at :5310 and :5319-5320 reads.
echo "@@@ B58FOG state"
r_fog_progless
r_fog_linear
r_fog_exp2
waitms 1200

echo "@@@ B58FOG A. r_fog_progless 1 -- the shipped default"
r_fog_progless 1
waitms 1500
screenshot b58fog_A_x
waitms 1000
screenshot b58fog_A
waitms 1000
screenshot b58fog_A_ctl
waitms 1000

echo "@@@ B58FOG B. r_fog_progless 0 -- fixed-function fog off"
r_fog_progless 0
waitms 1500
screenshot b58fog_B_x
waitms 1000
screenshot b58fog_B
waitms 1000

echo "@@@ B58FOG C. back to 1 -- must match A"
r_fog_progless 1
waitms 1500
screenshot b58fog_C_x
waitms 1000
screenshot b58fog_C
waitms 1000

echo "@@@ B58FOG DONE"
waitms 1200
quit
