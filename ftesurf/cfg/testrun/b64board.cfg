cfg_save_auto 0
// Build 64 arm 1: does CSQC actually fetch and parse a board from surfd?
//
// This tests the NETWORK AND PARSE PATH ONLY -- cl_online.qc draws nothing, on
// purpose, so that this arm exists before any tab does and a later change to
// the tabs cannot break the fetch without failing here.
//
// SEEDED ON THE Pi BEFORE THIS RUNS, so the expected rows are known exactly:
//   ranked/clean     Bob   3500 ticks   (r 1)
//                    Alice 4108 ticks   (r 2)
//   community/clean  Carol 5200 ticks, flags 1024 (TF_NORULESET)
// Carol was submitted as ranked and DEMOTED by surfd, which is the live proof
// that TF_NORULESET does something -- she is faster than nobody, but she is on
// a different board than she asked for.
//
// PREDICTIONS, registered before the run:
//   ARM A  board_status before any fetch  -> "idle", 0 rows
//   ARM B  ranked fetch   -> ok, 2 rows, Bob first then Alice, counts 2/1
//   ARM C  community fetch-> ok, 1 row, Carol, flags 1024, counts 2/1
//   ARM D  segmented style-> ok, 0 rows (nothing segmented was seeded)
//   ARM E  a bogus map via a leg that does not exist -> ok, 0 rows, not a fault
//
// FALSIFIED IF: any arm reports "failed" with a code (then the responsecode
// test is inverted -- success is 0, not 200, and getting that wrong is the
// single most likely defect in this file), or if the rows come back in
// submission order rather than by time (then the server's ORDER BY is not
// reaching the client), or if counts read 0 (then json_find_object_child is
// not walking the nested "counts" object).
//
// wall clock, not frames, before the first `map` -- see p313ruleset.cfg.
log_enable 1
log_dir logs
log_name b64board
waitms 5000

// Point at the Pi.  Set explicitly rather than relying on the archived value,
// so this arm does not depend on what a previous session left in ftesurf.cfg.
lobby_dir "http://192.168.1.102:8084"

map bhop_eazy
waitmap 45
waitms 4000

echo ==== ARM A: before any fetch (expect idle, 0 rows) ====
board_status
waitms 500

echo ==== ARM B: ranked/clean (expect Bob 3500 then Alice 4108, counts 2/1) ====
board_fetch 0 0 ranked clean
waitms 2500
board_status
waitms 500

echo ==== ARM C: community/clean (expect Carol 5200 flags 1024) ====
board_fetch 0 0 community clean
waitms 2500
board_status
waitms 500

echo ==== ARM D: ranked/segmented (expect ok, 0 rows) ====
board_fetch 0 0 ranked segmented
waitms 2500
board_status
waitms 500

echo ==== ARM E: a leg with nothing on it (expect ok, 0 rows, NOT a fault) ====
board_fetch 0 7 ranked clean
waitms 2500
board_status
waitms 1000

echo ==== END ====
log_enable 0
waitms 500
quit
