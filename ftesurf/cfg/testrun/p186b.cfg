// P186: the asset cache against surf_tensor2 (CS:GO) -- a much larger dependency set than
// utopia's, and the map from the original "still has missing textures" complaint.
//
// Also tests three things the first run did not:
//   * that surf_utopia's state-1 manifest SURVIVES A RESTART (it was written last session)
//   * fs_cache_clear <map>, which must forget the manifest but KEEP the files, so the
//     re-proof costs one mount and copies ZERO files
//   * that tensor2 still reports nothing unresolved when loaded from the cache
fs_loadstats 1
fs_automount 1
fs_autounmount 1
fs_assetcache 1
developer 0
waitms 4000
echo "=== P186-B ==="
echo "--- 0. surf_utopia: manifest was written LAST SESSION, must still be trusted ---"
map surf_utopia
waitms 20000
echo "--- 1. surf_tensor2 first visit (mounts CS:GO, harvests) ---"
map surf_tensor2
waitms 35000
echo "--- 2. bhop_aberrant (drops CS:GO, flushes) ---"
map bhop_aberrant
waitms 25000
echo "--- 3. surf_tensor2 confirming visit (mounts CS:GO, should harvest nothing) ---"
map surf_tensor2
waitms 35000
echo "--- 4. bhop_aberrant (drops CS:GO) ---"
map bhop_aberrant
waitms 25000
echo "--- 5. surf_tensor2 PROVEN: must not mount CS:GO ---"
map surf_tensor2
waitms 30000
fs_cache_info
waitms 2000
echo "--- 6. forget just tensor2; files stay, proof does not ---"
fs_cache_clear surf_tensor2
waitms 2000
echo "--- 7. surf_tensor2 must mount CS:GO again, and copy ZERO files ---"
map surf_tensor2
waitms 35000
echo "--- 8. bhop_aberrant to flush that ---"
map bhop_aberrant
waitms 20000
fs_cache_info
waitms 2000
echo "=== P186-B DONE ==="
waitms 1000
quit
