// SPR03 -- orientation, and an A/B whose two cameras are actually the same.
//
// THE ORIENTATION TEST.  kz_anubis carries six env_sprite_oriented in a row at
// y=-3902, z=-350, x from -2683 to -2517, all at angles "0 90 0" scale .25 and
// all on timer/digits_sprite.vmt.  Digits, like the wall numbers that settled
// the overlay orientation in Patch 246: a glow looks identical mirrored,
// upside-down or rotated, and a digit does not.  The camera stands along the
// sprite's AUTHORED forward (yaw 90 -> +Y) at 160 units, which is where Source
// says the viewer is -- CSpriteOriented::Spawn adds 180 to the yaw precisely
// because the authored forward points OUT of the face.
//
// If the row reads upright and left-to-right, the yaw+180, the right/up basis
// and the V direction are all correct.  Any one of them wrong shows here.
//
// THE A/B FIX.  In SPR02 the OFF shot fell to the floor: noclip does not
// survive `retry`, which respawns you in MOVETYPE_WALK.  So noclip is re-issued
// after every reload, not once at the top.  It is not a toggle in that
// position -- a fresh spawn is always walking.

log_enable 1
log_dir "logs"
log_name "spr03"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
sv_cheats 1
rec_retry 1
vbsp_sprites 1
vbsp_spotlights 1

wait 200

// ------------------------------------------- the orientation test, close up
map kz_anubis
waitmap 1800
waitms 5000
noclip
waitms 300
setpos -2616 -3742 -350 0 -90 0
waitms 1500
screenshot spr03_digits
waitms 600
// and from behind, which must show them mirrored -- if it looks identical, the
// quad is being drawn two-sided with no winding and the test proves nothing.
setpos -2616 -4062 -350 0 90 0
waitms 1500
screenshot spr03_digits_behind
waitms 600

// ------------------------------------------- bhop_rpg from its own spawn
map bhop_rpg
waitmap 1800
waitms 5000
noclip
waitms 300
setpos 928 -640 -184 32.5 -14.0 0
waitms 1500
screenshot spr03_rpg_on
waitms 600
vbsp_sprites 0
retry
waitmap 1800
waitms 5000
noclip
waitms 300
setpos 928 -640 -184 32.5 -14.0 0
waitms 1500
screenshot spr03_rpg_off
waitms 600
vbsp_sprites 1

// ------------------------------------------- grotto, matched cameras
map surf_grotto
waitmap 1800
waitms 5000
noclip
waitms 300
setpos 2324 -1998 3388 13.5 0.0 0
waitms 1500
screenshot spr03_grotto_on
waitms 600
vbsp_spotlights 0
retry
waitmap 1800
waitms 5000
noclip
waitms 300
setpos 2324 -1998 3388 13.5 0.0 0
waitms 1500
screenshot spr03_grotto_off
waitms 600
vbsp_spotlights 1

echo ^5=== spr03 done ===
wait 30
quit
