// Build 31, second pass -- the tool panel's own drag, and the gap it closes.
//
// b31a proved the registry and the rounding but showed a real functional gap in
// the picture: the tool panel sits in the left margin, and so do four of the ten
// elements (splits 0.045, debug 0.012, save menu and video menu both 0.018).
// The panel has to block clicks -- one that fell through would start dragging
// whatever was behind it -- so those four could not be grabbed at all.
//
//   b31b-1-left     panel where it starts.  Its title bar is a distinct strip
//                   with `move` on the right; the four left-margin placeholders
//                   are behind it.
//   b31b-2-right    hud_edit_panel_x driven to 0.55 from the console.  The
//                   panel is elsewhere and all four are uncovered and grabbable.
//   b31b-3-scale3   hud_scale 3.  The HUD triples; the PANEL must not, or it
//                   would be 843 px tall on a 720-line window and take the
//                   `done` button off the bottom of the screen with it.
//   b31b-4-units    hud_seq_units 0 -- the u/s switch, which is the chip that
//                   answers "change the energy readings back to u/s".  The board
//                   panel's rows and the segment column both follow it.
//
// con_notifytime 0 because b31a's shots were unreadable under the console's own
// notify area -- every echo in the script was drawn over the thing being
// photographed.

waitms 2000

echo ^5=== b31b: the tool panel ===

scr_conalpha 0
con_notifytime 0
hud_debug 1

map surf_null
waitmap 240
wait 60

// Put it back where it ships, in case a previous run left it moved.
seta hud_edit_panel_x 0.010
seta hud_edit_panel_y 0.080
seta hud_scale 2
wait 10

hud_edit
wait 25
screenshot b31b-1-left
wait 20

seta hud_edit_panel_x 0.55
wait 25
hud_edit status
wait 10
screenshot b31b-2-right
wait 20

seta hud_scale 3
wait 25
screenshot b31b-3-scale3
wait 20
seta hud_scale 2
seta hud_edit_panel_x 0.010
wait 20

hud_edit off
wait 15
hud_seq_units 0
wait 15
screenshot b31b-4-units
wait 15
hud_seq_units 1
wait 10

echo ^5=== b31b done ===
wait 30
quit
