// ANIM01 -- Patch 250 stage 4: does hl2_animated 1 hold up on the reported maps?
//
// "this one is visually wrong" was elly/animated_smoke on surf_demise.  It is a
// 24 fps flipbook whose frames all live in one 14 MB VTF, and hl2_animated
// defaults to 0 -- "draw frame 0", which is what every build has done.  So the
// smoke is a single still frame of an animation.  That is the whole of the
// visual half of the report; nothing about masking or alpha is involved.
//
// The cvar covers 3,342 materials across 741 maps and its own help text says the
// vmt/animated path (GLSL 130, a 2D array sampler) has never been exercised at
// scale.  So the question is not "does it look better" but "does it hold up":
//   - does the smoke actually route to vmt/animated (animpass 1, not 0)?
//   - what does it cost on the densest map?
//   - does anything else on the map break?
//
// hl2_animated is CVAR_SHADERSYSTEM: it invalidates every shader and applies on
// the next frame, so this is a straight before/after on one map load per map --
// no reload needed, which also sidesteps the "map x twice does not reload" trap.
//
// The smoke probe is a real displaced vertex (see disp01.cfg for why that
// matters); the camera sits 32 units above it looking straight down, so
// shader_here lands on the smoke and prints the program permutation.
//
// FPS is read off the HUD corner in the screenshots. cl_maxfps 0 so the number
// means something -- and NOT timerefresh, which never runs CSQC_UpdateView and
// so cannot measure anything this HUD or these shaders do.

log_enable 1
log_dir "logs"
log_name "anim01"
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 0
vid_fullscreen 0
developer 1
log_developer 1
con_notifytime 0
con_notifylines 0
con_notifytime_error 0

wait 200

echo ^5=========== surf_demise, hl2_animated 0 (shipped default) =========
hl2_animated 0
map surf_demise
waitmap 1800
waitms 9000
sv_cheats 1
waitms 300
setpos -2944 7552 4865 90 0 0
waitms 2000
shader_here smoke-anim0
waitms 300
developer 0
waitms 2500
screenshot anim01_demise_off
waitms 700

echo ^5=========== surf_demise, hl2_animated 1 ============================
developer 1
hl2_animated 1
waitms 4000
shader_here smoke-anim1
waitms 300
developer 0
waitms 2500
screenshot anim01_demise_on
waitms 700
screenshot anim01_demise_on2
waitms 700

echo ^5=========== surf_boreas ===========================================
developer 1
hl2_animated 0
map surf_boreas
waitmap 1800
waitms 9000
developer 0
waitms 2500
screenshot anim01_boreas_off
waitms 700
hl2_animated 1
waitms 4000
screenshot anim01_boreas_on
waitms 700

echo ^5=========== surf_garden ===========================================
hl2_animated 0
map surf_garden
waitmap 1800
waitms 9000
developer 0
waitms 2500
screenshot anim01_garden_off
waitms 700
hl2_animated 1
waitms 4000
screenshot anim01_garden_on
waitms 700

echo ^5=== anim01 done ===
wait 30
quit
