// Patch 230, CONTROL arm: the pre-patch behaviour, from the post-patch binary.
// Setting hl2_rigidprops 0 makes every Source model carry bone weights again,
// which is exactly what shipped before, so this and p230b_on differ by one cvar
// and nothing else -- same exe, same plugin, same map, same viewpoint, same run
// length.  A binary A/B would also have differed by whatever else got rebuilt.
log_enable 1
log_name p230b_off
hl2_rigidprops 0
exec cfg/testrun/p230b.cfg
