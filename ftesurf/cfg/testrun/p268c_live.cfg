// cfg_save_auto 0: this run sets archived cvars (vid_*, cl_maxfps); never let it write them into ftesurf.cfg (cl_main.c:2535)
cfg_save_auto 0
// Patch 268 C (per-pixel ambient-cube relief on bumped props), Patch 291 (shader_here names
// a model), and the surf_fantasy trees (Momentum's mount, per map, from data/mapdeps.txt).
//
// LIVE A/B, one process, for the reason pixel-noise-floor-across-runs records: two runs of the
// same binary differ by up to 18% of a frame from the async texture-load race, while a runtime
// cvar toggled at a pinned setpos differs by nothing else at all.
//
//   r_cubelight     runtime: 1/0/1 at each rock vantage.  0 uploads an empty cube, which makes
//                   the shader's ratio exactly 1.0, so the middle shot is the pre-268-C picture.
//   hl2_bumpgreenfix SHADERSYSTEM: toggled live once at save001 (a regenerate, so a longer wait).
//   hl2_lt_dirsign  plain cvar, invalidates the static-prop light cache: 0/1/0 on surf_aura,
//                   which ships no .vhv, so its props keep the directional term it changes.
//
// Map order: surf_fantasy FIRST in a fresh process, so its pine trees cannot borrow
// surf_boreas's pakfile copies through the name-keyed model cache -- the reason the last log
// warned about only 2 of the 6 missing models.  surf_boreas last, as the regression control
// against p268b_live_bor_ramp7_on1 (same cvars, pre-268-C binary).
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000
wait 200

developer 1
log_developer 1
log_enable 1
log_dir logs
log_name p268c_live
cl_maxfps 0
cl_idlefps 0
sv_cheats 1
con_notifylines 0
con_notifytime 0
con_notifytime_error 0
r_drawentities 1
r_lightstylescale 1

hl2_envcubemap 1
hl2_envmap_source 7
r_envcubemap 1
r_reflectcube_nosky 0
hl2_cubelight 1
hl2_bumpgreenfix 0
hl2_lt_dirsign 0
r_cubelight 1
echo ^5=== p268c LIVE: hl2_cubelight 1 compiled in; toggling r_cubelight, hl2_bumpgreenfix, hl2_lt_dirsign

// ============================ surf_fantasy ============================
map surf_fantasy
waitmap 600
waitms 9000
waitms 3000
echo ^5=== fs_automount for surf_fantasy:
fs_automount_state
fs_automount_spec
noclip
waitms 1000

// save001 -- Lex's saveloc, the island rock (models/fan/island1cluster1.mdl, fan/moss + fan/moss_n)
setpos -9001.9434 -14301.5703 6205.6196 30.9814 38.5675 0
waitms 2500
cmd viewpos
r_cubelight 1
waitms 900
shader_here fan_s1_on1
screenshot p268c_fan_s1_on1
r_cubelight 0
waitms 900
shader_here fan_s1_off
screenshot p268c_fan_s1_off
r_cubelight 1
waitms 900
shader_here fan_s1_on2
screenshot p268c_fan_s1_on2
prop_census island1cluster1

// the green flip, live -- a SHADERSYSTEM regenerate, so it gets a long settle
hl2_bumpgreenfix 1
waitms 6000
shader_here fan_s1_green1
screenshot p268c_fan_s1_green1
hl2_bumpgreenfix 0
waitms 6000
shader_here fan_s1_green0
screenshot p268c_fan_s1_green0

// save002 -- Lex's second saveloc (models/fan/island2cluster2.mdl)
setpos -10560.2393 -12718.2324 4593.5737 18.5669 164.0588 0
waitms 2500
cmd viewpos
r_cubelight 1
waitms 900
shader_here fan_s2_on1
screenshot p268c_fan_s2_on1
r_cubelight 0
waitms 900
shader_here fan_s2_off
screenshot p268c_fan_s2_off
r_cubelight 1
waitms 900
shader_here fan_s2_on2
screenshot p268c_fan_s2_on2

// the trees.  Instances from the sprp lump (wf2/vantage.py): camera 520u due west of the
// prop looking east, eye 150u above its origin, pitched up for the tall ones.
// tree_pine_cluster_01 #2134, one of the two models the old log named
setpos -9424.4 -15577.9 6155.6 -12 0 0
waitms 2500
cmd viewpos
shader_here fan_tree_cluster
screenshot p268c_fan_tree_cluster
// fern01 #982, the other; small, so 180u away and looking down
setpos -9212.0 -14488.0 6141.0 20 0 0
waitms 2500
cmd viewpos
shader_here fan_tree_fern
screenshot p268c_fan_tree_fern
// tree_pine04 #38, one of the 110 pines the old log never warned about
setpos 7095.0 -14443.4 -10790.5 -12 0 0
waitms 2500
cmd viewpos
shader_here fan_tree_pine04
screenshot p268c_fan_tree_pine04
prop_census tree_pine

// ============================ surf_aura ============================
// No .vhv in its pakfile (wf2/novhv.py), so its props light from the leaf cube alone and keep
// the directional term.  hl2_lt_dirsign decides which side of each prop that term lights.
map surf_aura
waitmap 600
waitms 9000
waitms 2000
noclip
waitms 1000

// stone_trim_b_35 #590 (1058 on the map)
setpos 13496.2 3936.2 -1659.4 15 45 0
waitms 2500
cmd viewpos
hl2_lt_dirsign 0
waitms 900
shader_here aura_trim_sign0a
screenshot p268c_aura_trim_sign0a
hl2_lt_dirsign 1
waitms 900
shader_here aura_trim_sign1
screenshot p268c_aura_trim_sign1
hl2_lt_dirsign 0
waitms 900
shader_here aura_trim_sign0b
screenshot p268c_aura_trim_sign0b

// fir_tree_3_35 #662
setpos -1239.8 15464.2 -738.0 15 45 0
waitms 2500
cmd viewpos
hl2_lt_dirsign 0
waitms 900
shader_here aura_fir_sign0a
screenshot p268c_aura_fir_sign0a
hl2_lt_dirsign 1
waitms 900
shader_here aura_fir_sign1
screenshot p268c_aura_fir_sign1
hl2_lt_dirsign 0
waitms 900
shader_here aura_fir_sign0b
screenshot p268c_aura_fir_sign0b

// ============================ surf_boreas ============================
// Lex's two sunlit ramp vantages from Patch 268 B.  The r_cubelight 0 shot is the regression
// control against p268b_live_bor_ramp7_on1; the on shots are the ramp's own normal map
// (ramp_wood_nm), which is exactly the "no bump-mapping" half of the original report.
map surf_boreas
waitmap 600
waitms 9000
noclip
waitms 1000

setpos 12243.8 3632 11789 38.16 0 0
waitms 2500
cmd viewpos
r_cubelight 1
waitms 900
shader_here bor_ramp7_on1
screenshot p268c_bor_ramp7_on1
r_cubelight 0
waitms 900
shader_here bor_ramp7_off
screenshot p268c_bor_ramp7_off
r_cubelight 1
waitms 900
shader_here bor_ramp7_on2
screenshot p268c_bor_ramp7_on2

setpos 12349.3 3882 11738.2 27.2 -59 0
waitms 2500
cmd viewpos
r_cubelight 1
waitms 900
screenshot p268c_bor_ramp7b_on1
r_cubelight 0
waitms 900
screenshot p268c_bor_ramp7b_off
r_cubelight 1
waitms 900
screenshot p268c_bor_ramp7b_on2

echo ^5=== END OF RUN ===
waitms 500
quit
