// Build 73 against the LIVE fleet: the RELEASE SKEW WINDOW.
//
// This is the one arm that had to be measured before build 73 could be called
// safe, and the reason is the shape of the deploy, not the shape of the code.
//
// THE TWO HALVES OF THIS COMPARISON SHIP BY DIFFERENT ROUTES.  The server's
// half -- `infokey(world, "*mapcrc")` -- went out with the progs and the engine
// and is live on all twelve lobbies the moment build.ps1 -Pi finishes.  The
// client's half is the map checksum the client computes at prespawn, and that
// number is produced by the hl2 PLUGIN (`VBSP_ComputeChecksum`, engine Patch
// 321), which reaches a player ONLY in a release archive.  So there is a window
// -- starting now and ending whenever the next release is installed -- in which
// every single player on the fleet is running a client that cannot compute the
// number the server is about to compare against.
//
// If TF_NOMAP reads that as a MISMATCH, build 73 demotes every run by every
// player for as long as the window lasts, and it does it silently, because a
// demotion is deliberately not an accusation and says nothing on screen.  That
// is a worse outcome than the hole the patch closes.  It is the same trap as
// LB_MAX's lead time, one layer down: a comparison whose two halves have
// different deploy latencies must read UNKNOWN in the skew, never MISMATCH.
//
// So `SV_MapForeign` is a pure predicate that returns FALSE unless BOTH sides
// are non-empty strings AND they differ, and `PF_infokey_Internal` maps a zero
// checksum to "" rather than to "00000000" -- zero is the value an un-updated
// client reports, and it is also the value the ENGINE's own world model carried
// on 1287 of 1312 maps before Patch 321, which is exactly why sv_mapcheck had
// never fired in its entire existence.
//
// Both halves of that were verified by reading and on a listen server.  Neither
// is what a player traverses.  This file runs the real path: a real client, over
// the real internet, to a real aarch64 qwprogs on the Pi.
//
// TWO ARMS, TWO PROCESSES, because the difference between them is a DLL:
//
//   arm OLD   fteplug_hl2_x64.dll.prev  (bd5ab1ab, built before Patch 321)
//             -- this is what every player on earth is running right now.
//   arm NEW   fteplug_hl2_x64.dll       (56aa3d2a, carries the wmod fix)
//             -- this is what a player gets after the next release.
//
// PREDICTION, registered before either arm was run:
//
//   arm OLD   ours "<8 hex>"   theirs ""          nomap 0   would 0
//             The server knows its own map; the client cannot say.  UNKNOWN.
//             Not ranked down, not marked, not mentioned.
//   arm NEW   ours "<8 hex>"   theirs "<same>"    nomap 0   would 0
//             Both sides speak and agree.
//
// The two `ours` values MUST be the same string as each other and MUST be the
// same string as `theirs` in arm NEW.  That is the control: it proves the two
// processes looked at the same map and that the hash crossed x86-64 -> aarch64
// -> x86-64 intact, so a `would 0` in arm OLD means "the client was silent"
// rather than "the comparison never ran".
//
// FALSIFIED IF: arm OLD reads would 1 or nomap 1 -- the skew demotes players and
//          build 73 must come straight back off the fleet; or arm NEW reads
//          theirs "" -- the fixed plugin is not actually reporting, so the check
//          is inert in the direction that looks like success (which is precisely
//          how sv_mapcheck hid for a decade); or the two arms disagree on
//          `ours`, in which case they were not on the same map and neither line
//          means anything.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name b73live
developer 0

name "^3Lex MapCRC"

waitms 40000
menu_restart
waitms 3000

echo ================================ B73LIVE -- connect to lobby 4 (bhop_eazy)
connect play.proto.bar:27540
waitms 20000

echo ================================ B73LIVE -- who am I talking to
status
waitms 1500

echo ================================ B73LIVE -- the mapcrc row
cmd timer
waitms 4000

echo ================================ B73LIVE done
waitms 1000
quit
