// B43IDLE -- the dead air: marked red, and skipped.
//
// THE REPORT: "the UI of the demo playback should mark parts where the player
// doesn't move as red, and have a selectable option that simply skips those
// parts during playback."
//
// Spans are built ONCE at load, inside the pass that already tokenizes every
// sample to choose control points, and the bar and the skip both count into
// that table.  Per-frame detection was never on the table: a scrub runs the
// clock backwards and re-deriving spans on every frame of a drag would be six
// thousand iterations per frame.
//
// THE TEST DATA IS REAL AND WAS CHOSEN BY MEASUREMENT, not by hoping a run
// happened to have a pause in it.  Modelling the same thresholds outside the
// game over all 58 recordings finds 9 with still time, and these two are the
// interesting ends of it:
//
//   surf_rise/main/last.rec        3 spans, 33.9 s of a 51.9 s file
//        still     1.400 ..  21.811   (20.4s)
//        still    23.124 ..  23.842   (0.7s)
//        still    24.691 ..  37.473   (12.8s)
//   bhop_monster_jam .../0151957_shadow.rec   71 spans, 806.9 s
//        -- more than WT_IDLEMAX (64), so it is also the OVERFLOW test.
//
// PASS:
//   1. surf_rise reports `still 3 stretch(es)`.  Not 2 (the 0.7 s one is over
//      hud_watch_idle_time and must be kept), not 4.
//   2. With skip ON and the clock started just before the first span, the clock
//      lands PAST 21.811 rather than crawling through twenty seconds of it.
//   3. With skip OFF from the same start, it does not.
//   4. bhop_monster_jam reports `still 64` with `(+7 dropped)` AND prints the
//      overflow line.  A cap that drops silently looks exactly like a run that
//      stopped idling, which is the mistake the segment column already makes.
//
// TWO MAPS IN ONE PROCESS IS FINE -- the reload trap is about loading the SAME
// map twice, which is what does not reload the world.

log_enable 1
log_dir "logs"
log_name "b43idle"
developer 1
log_developer 1
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
sv_cheats 1
fs_missingwarn 0

hud_watch_path 0

wait 200
echo ^5=== b43idle: still stretches, marked and skipped ===

map surf_rise
waitmap 1800
waitms 2500

replay data/runs/surf_rise/main/last.rec
waitms 800
replay pause

echo ^5=== b43idle: the census.  Want `still 3 stretch(es)` ===
replay status

// Paused INSIDE the long first span, so the screenshot shows the playhead
// sitting in a red band rather than beside one.
echo ^5=== b43idle: the bar, paused inside the 1.4..21.8 stretch ===
replay seek 10
waitms 800
screenshot b43idle_bar

echo ^5=== b43idle: SKIP OFF -- from t=1.0, two seconds of play stays in the span ===
hud_watch_skipidle 0
replay seek 1.0
replay speed 1
replay play
waitms 2000
replay pause
echo ^3--- want a clock of roughly 3.0, i.e. still inside 1.4..21.8
replay status

echo ^5=== b43idle: SKIP ON -- same start, same two seconds, must clear the span ===
hud_watch_skipidle 1
replay seek 1.0
replay play
waitms 2000
replay pause
echo ^3--- want a clock PAST 21.811, and past 23.842 and 37.473 as well:
echo ^3--- the second and third spans are inside the same two seconds of play
replay status

echo ^5=== b43idle: and the marks are still there with skip on ===
screenshot b43idle_bar_skipped

replay stop
waitms 400

// ---------------------------------------------------------------------------
echo ^5=== b43idle: the overflow.  71 spans against a cap of 64 ===
map bhop_monster_jam
waitmap 1800
waitms 2500

replay data/runs/bhop_monster_jam/main/0151957_shadow.rec
waitms 1500
replay pause
echo ^3--- want `still 64 stretch(es) (+7 dropped)` and a console warning above it
replay status
waitms 400
screenshot b43idle_overflow

echo ^5=== b43idle: done ===
replay stop
waitms 400
quit
