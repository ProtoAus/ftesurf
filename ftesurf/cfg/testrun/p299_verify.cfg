cfg_save_auto 0
// Patch 299 -- VERIFICATION.  Fog the colour, leave the alpha to the blender.
//
// THE FIX: the hl2 VMT programs ended in fog4(diffuse_f), and fog4() is
// `vec4(fog3(rgb), 1.0) * regularcolour.a` (gl_vidcommon.c:1887) -- it
// multiplies the fogged colour by the surface's own alpha.  Source does not use
// base-texture alpha as opacity unless the material says so; on an opaque
// VertexLitGeneric it is a MASK ($basealphaenvmapmask and friends).  With no fog
// the opaque blend discards it, so nothing shows.  With fog it multiplies every
// pixel.  Eight programs now emit vec4(fog3(rgb), a) instead, behind
// hl2_fog_alphamul (default 0 = fixed, 1 = the old picture bit-for-bit).
//
// WHY THIS RUN CAN BE JUDGED STRICTLY.  The pixel noise floor on this vantage
// measured 0.000% both within a run and ACROSS SEPARATE PROCESSES (p298 A1 vs
// p298c C3, and p298 A2 vs p298e E5).  So the two "restore the old behaviour"
// arms are not judged by eye -- they must reproduce the PREVIOUS runs exactly.
//
// PRE-REGISTERED:
//   G2 (alphamul 1)  MUST equal p298_a4_repeat.png to within the 0.000% floor.
//                    If it does not, the cvar is not restoring the old path and
//                    nothing else in this run can be trusted.
//   G5 (alphamul 1, white fog end 1u) MUST reproduce p298f_f2_white's numbers:
//                    fogged props mean 137.7 147.4 163.3, std 38.5 38.2 38.8.
//   G4 (alphamul 0, white fog end 1u) is the fix, and the claim is specific:
//                    the SAME pixels must now go to ~255 255 255 with std ~0,
//                    because a saturated fog no longer carries the alpha mask.
//   G1 (alphamul 0, default fog) is what Lex will actually look at: the church
//                    cluster and the far-left block should sink into the fog
//                    like every other building, and the black window grids
//                    should go with them.
//   G6/G7 are the translucent-regression check.  The antenna material is
//                    $translucent 1 with mean base alpha 0.094, and glass and
//                    grates elsewhere are $alphatest -- all of them get BRIGHTER
//                    under the fix, which is intended (mat_vmt.c:3719/3885 emit
//                    src_alpha one_minus_src_alpha, so GL was already applying
//                    the alpha and fog4 applied it a second time).  What must
//                    NOT happen is a translucent surface going opaque or a
//                    sprite blowing out; G7 is a normal-play vantage for that.
vid_fullscreen 0
vid_restart
waitms 3000
wait 200

developer 1
log_developer 1
log_enable 1
log_dir logs
log_name p299_verify
cl_maxfps 0
cl_idlefps 0
sv_cheats 1
con_notifylines 0
con_notifytime 0.01
r_drawviewmodel 0

map surf_tensor2
waitmap 600
waitms 9000
waitms 3000
noclip
waitms 1000

alias vwin   "setpos -7563.2915 10425.6309 -974.1351 1.9775 -0.39 0; waitms 2500"
alias vstage "setpos -10751.1777 9562.7969 -9789.3184 -0.0934 89.4342 0; waitms 2500"

echo ^5=== cvar readback
hl2_fog_alphamul

// ---- G1: the fix, as shipped ----
echo ^5=== G1: hl2_fog_alphamul 0 (shipped default) -- THE FIX
vwin
screenshot p299_g1_fixed

// ---- G2: the old behaviour -- must equal p298_a4_repeat.png ----
hl2_fog_alphamul 1
waitms 2500
echo ^5=== G2: hl2_fog_alphamul 1 -- must reproduce p298_a4_repeat exactly
vwin
screenshot p299_g2_old

// ---- G3: back to fixed -- repeat control for G1 ----
hl2_fog_alphamul 0
waitms 2500
echo ^5=== G3: back to 0 -- repeat control for G1
vwin
screenshot p299_g3_repeat

// ---- G4/G5: white fog at end 1u, the saturation test, both ways ----
skyroomfog 1 1 1 1 1 0
echo ^5=== G4: WHITE fog end 1u, alphamul 0 -- must now saturate to 255 std ~0
vwin
screenshot p299_g4_white_fixed

hl2_fog_alphamul 1
waitms 2500
echo ^5=== G5: WHITE fog end 1u, alphamul 1 -- must reproduce p298f_f2_white
vwin
screenshot p299_g5_white_old

hl2_fog_alphamul 0
waitms 2500
skyroomfog 23.4375 0.160784 0.258824 0.352941 1 11.7188

// ---- G6/G7: translucent and alphatest regression check, main view ----
echo ^5=== G6: save008 main view, alphamul 0
vstage
screenshot p299_g6_stage_fixed

hl2_fog_alphamul 1
waitms 2500
echo ^5=== G7: save008 main view, alphamul 1 -- the before picture
vstage
screenshot p299_g7_stage_old

echo ^5=== END OF RUN ===
waitms 500
quit
