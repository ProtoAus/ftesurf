cfg_save_auto 0
// PATCH 305 -- FALSIFIER.  The 'v' record now carries the NON-MOUSE half of the
// angle change, so the Patch 293 yaw identity closes on a keyboard turn.
//
// WHY THIS PATCH EXISTS, measured rather than supposed.  On Lex's first real
// recorded run (bhop_eazy 0004976_pb, 42,973 'v' records, a clean PB) the P293
// identity  dyaw == -m_yaw*sensitivity*scale*dx  FAILED ON 57.67% OF FRAMES.
// The residual was perfectly bimodal with a three-decade empty gap:
//     no turn key held   30,934 frames, median 2.0e-6 deg, max 2.3e-5
//     turn key held      12,038 frames, median 0.0558 deg, NONE below 1e-4
// Sign matched CL_AdjustAngles 8,433 times of 8,437 under +left; dividing by
// cl_yawspeed*elapsed gave a median of 1.0014.  Pitch was exact (median residual
// 0.000000000) because cl_pitchspeed is 0 -- which is the control proving the
// MOUSE path was never wrong.  The RECORD was incomplete.
//
// +left/+right are SHIPPED DEFAULT BINDS (cfg/default.cfg:794,805) and this
// game's prestrafe calibration (default.cfg:409-425) is derived from turning
// with them while holding a strafe key.  Keyboard turn is how a bhop run starts.
// Without this column the flagship input check accused the player of the game's
// own core mechanic on 10,091 frames of one honest run.
//
// THIS IS THE RARE INPUT PATCH A CONFIG CAN FULLY TEST, because +left and +right
// are console COMMANDS.  Unlike the mouse half -- which needs a hand on a mouse
// and defeated every scripted attempt -- the keyboard term can be driven from
// here, so all three arms below are real.
//
// PRE-REGISTERED:
//   ARM A  a journal with no turning at all -> data/p305_A.hid
//          Every 'v' line MUST have 9 fields (kind dt dx dy flags pitch yaw
//          kpitch kyaw), and every kyaw MUST be exactly 0.
//   ARM B  +left held ~1.5 s -> data/p305_B.hid
//          kyaw MUST be POSITIVE on the turning frames (CL_AdjustAngles does
//          viewanglechange[YAW] += quant*KeyState(in_left)).
//          The SUM of kyaw MUST be within a few percent of cl_yawspeed * 1.5.
//          hidcheck MUST report the identity EXACT: zero violations AND zero
//          ghost frames.  Before 305 this same input produced a ghost on every
//          turning frame, because the yaw moved with no counts behind it.
//   ARM C  +right held ~1.5 s -> data/p305_C.hid
//          kyaw MUST be NEGATIVE.  Same exactness requirement.
//
// THE FALSIFIER PROPER is run afterwards in Python, on arm B's own file: force
// the kyaw column to 0 and re-run the identity.  Violations MUST reappear.  If
// they do not, the column is decorative and this patch does nothing -- which is
// exactly the failure mode a "the check now passes" result cannot rule out on
// its own.  A patch that makes a check pass by weakening it is worse than no
// patch, and that is the risk this arm exists to close.

exec cfg/testrun/_quiet.cfg

developer 1
log_developer 1
log_enable 1
log_dir logs
log_name p305kbd
cl_maxfps 100
cl_idlefps 0
sv_cheats 0
con_notifylines 0
con_notifytime 0.01
r_drawviewmodel 0

wait 200
map bhop_eazy
waitmap 600
waitms 5000

echo ^5=== P305: the turn rate in force
cl_yawspeed
cl_pitchspeed
cl_anglespeedkey

echo ^5=== P305 ARM A: no turning
in_journal_begin
waitms 1500
in_journal_note p305-arm-A-noturn
waitms 300
in_journal_end data/p305_A.hid
waitms 1200

echo ^5=== P305 ARM B: +left held
in_journal_begin
waitms 300
+left
waitms 1500
-left
waitms 300
in_journal_note p305-arm-B-left
waitms 300
in_journal_end data/p305_B.hid
waitms 1200

echo ^5=== P305 ARM C: +right held
in_journal_begin
waitms 300
+right
waitms 1500
-right
waitms 300
in_journal_note p305-arm-C-right
waitms 300
in_journal_end data/p305_C.hid
waitms 1200

echo ^5=== END OF RUN ===
waitms 1000
quit

// ---------------------------------------------------------------------------
// MEASURED 2026-09-12 on engine/release/fteqw64.exe B523C7213CBB.
//   ARM A   1 v record, 9 fields, kyaw 0.0000                      PASS
//   ARM B   145 v records, kyaw sum +89.9372 vs 60*1.5 = 90        PASS
//   ARM C   152 v records, kyaw sum -90.3000                       PASS
//   kpitch summed exactly 0 in all three, as cl_pitchspeed 0 requires.
//   hidcheck: "exact on all 144 governed frames (mouse + recorded keyboard
//   turn)", 0 violations, 0 ghost frames.
//
// THE CONTROL, run on arm B's own file with kyaw forced to 0 and nothing else
// changed:  144 of 144 turning frames become "no recorded cause", against 0
// with the column present.  Total discrimination, so the column is doing the
// work rather than the check having been loosened to pass.
//
// PRE-REGISTRATION CORRECTION, recorded rather than quietly reworded: this cfg
// registered the control as "violations MUST reappear".  They reappear as
// GHOST frames instead -- the bucket for "no counts AND no recorded cause" --
// which is the correct classification and not the one predicted.  The
// discrimination is total either way, but the prediction named the wrong
// bucket.
//
// Arms A/B/C also each fault with "no frame markers", which is trap 13 and is
// NOT this patch: a scripted arm drains no input events, so no 'f' marker is
// written.  The identity check had to be moved above hidcheck's frameless
// early return before any of this was visible at all.
