// Build 64 stage 3 -- the run submission probe server.
//
// NOT a lobby.  A throwaway sixth process on a port nothing else uses, in a
// CLONED gamedir (ftesurf_t), so the five live lobbies keep their own
// qwprogs.dat and are not touched.  It does heartbeat, so it appears in the
// directory for up to 30s after it stops -- hence the hostname.
hostname "FTESurf b64 board probe -- ignore"
sv_port 27610

// THE ARM S FIRST FALSIFIER.  The player id the submission sends is the
// engine s GUID, and with sv_guidkey unset the engine never asks the client
// for one (sv_main.c:1855) -- infokey returns "" and Lobby_SubmitRun refuses
// to submit an unidentified run.  So a probe that prints nothing at all with
// this line removed is the gate working, not the feature missing.
sv_guidkey "ftesurf-b64-probe"

lobby_enable 1
lobby_master "http://127.0.0.1:8084"
// lobby_master_key is NOT set here.  It comes from cfg/lobby_local.cfg, which
// the launch line execs after this file, mode 0600, never in a repo.

// `set`, NOT a bare assignment: this cfg is exec d at STARTUP, before the
// progs have run registercvar, so the cvar does not exist yet and a bare line
// is parsed as a command -- "Unknown command lobby_run_probe", silently
// leaving the probe disarmed.  Same family as the registercvar-beside-the-read
// trap; lobby.cfg declares lobby_master_key the same way.
// Armed now; it waits for a player and fires when the client connects.
set lobby_run_probe 1
