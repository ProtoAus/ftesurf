// FTESurf b56a -- the entity inspector's mouse mode (QC build 56).
//
// A cfg cannot move a mouse, so every path the mouse takes has a scripted twin
// and this run drives those twins:
//   ent_cursor         take / give back the cursor (MOUSE3 does the same by hand)
//   ent_click          a click on the world at screen centre -- resolved in
//                      Ev_Draw through unproject, exactly as a real click is
//   ent_copyrow <n>    what clicking key line n copies
//   ent_copyall        the "copy all" chip
//
// THE CENTRAL CHECK IS A CONTROL, NOT A PICTURE.  At screen centre the mouse ray
// and the crosshair ray are the same ray, so `ent_click` with no arguments MUST
// select exactly what `ent_here` reported a moment earlier at the same vantage.
// If the two lines differ, the unproject/virtual-pixel mapping is wrong and no
// screenshot of a nice-looking panel would have caught it.
//
// Vantage: the spawn portal, where ent_here found trigger_teleport *36 in p286z.
//
// NOT testable from here, and said so rather than implied: a real press on a
// panel row, and the "release over the panel never picks the world" test in
// Ev_InputEvent -- ent_click sets the pending pick directly and so bypasses that
// check.  Those two need a hand on a mouse.
cfg_save_auto 0
exec cfg/testrun/_quiet.cfg
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "b56a"
scr_sshot_type png
cl_yieldcpu 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0

waitms 2500
map surf_tensor2
waitmap 240
waitms 8000
sv_cheats 1
noclip
waitms 500

setpos -11776 -11020 13680 0 90 0
waitms 2500

echo "@@@ B56A 1. the crosshair path, which must be unchanged from build 54"
ent_here
waitms 1800

echo "@@@ B56A 2. ent_click without the cursor must refuse"
ent_click
waitms 800

echo "@@@ B56A 3. ent_cursor opens the overlay and takes the mouse"
ent_cursor
waitms 1500
screenshot b56a_cursor_on
waitms 1200

echo "@@@ B56A 4. a centre click must pick what ent_here picked (the control)"
ent_click
waitms 1800
screenshot b56a_after_click
waitms 1200

echo "@@@ B56A 5. copy a line, an impossible line, and everything"
ent_copyrow 0
waitms 600
ent_copyrow 999
waitms 600
ent_copyall
waitms 1500
screenshot b56a_copied
waitms 1200

echo "@@@ B56A 6. the leaderboard opens -> the inspector must let go of the mouse"
+showscores
waitms 1800
screenshot b56a_board_open
waitms 1000
echo "@@@ B56A 6b. and must refuse to take it back while the board is up"
ent_cursor
waitms 1000
+showscores
waitms 1500

echo "@@@ B56A 7. ent_view off must release the cursor with the overlay"
ent_cursor
waitms 1000
ent_view
waitms 1000
ent_click
waitms 800

echo "@@@ B56A 8. ent_here on world geometry prints the static-prop hint"
setpos -10727.2881 10045.7559 -9831.4062 -2.4445 89.8352 0
waitms 2500
ent_here
waitms 1800

echo "@@@ B56A DONE"
waitms 1200
quit
