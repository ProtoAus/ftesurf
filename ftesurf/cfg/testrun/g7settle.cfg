// G7 -- is the G4 sweep's "0 world batches / black frame" real, or did I sample too early?
//
// The sweep gave surf_conc 0 world batches and a 96%-black frame.  G6, same map, same spawn,
// one extra second of settle, gave 7 world batches and a bright sky with pink missing-texture
// geometry.  Same build, same position -- so one of the two runs is lying, and the suspect is
// the sweep's 5s settle: g6black.log shows "shaders ... reload from SCR_UpdateScreen (per
// frame)", i.e. materials were still resolving while the sweep was taking its measurement.
//
// If that is right then the sweep's entire "25 maps draw nothing" result is a sampling
// artifact and must be withdrawn, not reported.  This settles it: same maps, same probes,
// but sampled at 5s AND at 20s, so the two can be compared directly against each other.

cfg_save_auto 0
developer 0
log_developer 0
scr_sshot_type png
cl_yieldcpu 0
cl_maxfps 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0
r_speeds 2
vbsp_portal_render 1
r_portalscissor 1

waitms 2500

map surf_cavediver
waitmap 240
waitms 5000
echo "@@@ cavediver EARLY 5s"
r_speeds_dump
waitms 300
screenshot_mega g7_cavediver_early 1280 720
waitms 15000
echo "@@@ cavediver LATE 20s"
r_speeds_dump
waitms 300
screenshot_mega g7_cavediver_late 1280 720
waitms 500

map surf_closecall
waitmap 240
waitms 5000
echo "@@@ closecall EARLY 5s"
r_speeds_dump
waitms 300
screenshot_mega g7_closecall_early 1280 720
waitms 15000
echo "@@@ closecall LATE 20s"
r_speeds_dump
waitms 300
screenshot_mega g7_closecall_late 1280 720
waitms 500

map surf_grabbag
waitmap 240
waitms 5000
echo "@@@ grabbag EARLY 5s"
r_speeds_dump
waitms 300
screenshot_mega g7_grabbag_early 1280 720
waitms 15000
echo "@@@ grabbag LATE 20s"
r_speeds_dump
waitms 300
screenshot_mega g7_grabbag_late 1280 720
waitms 500

map df_elco-gbparadise
waitmap 240
waitms 5000
echo "@@@ elco EARLY 5s"
r_speeds_dump
waitms 300
screenshot_mega g7_elco_early 1280 720
waitms 15000
echo "@@@ elco LATE 20s"
r_speeds_dump
waitms 300
screenshot_mega g7_elco_late 1280 720
waitms 500

echo "@@@ G7 DONE"
waitms 800
quit
