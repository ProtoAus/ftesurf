// G14 -- does the aperture pass rasterise AT ALL?
//
// G13 established what is NOT wrong: the material parsed (no unknown-directive
// line for it), the budget passed it ("portals: depth 0, 1 in view, 1 rendered,
// 0 closed"), and GLR_DrawPortal ran ("portals: 2 scene renders last frame"),
// which between them prove GLBE_GenerateBatchTextures was reached and produced an
// FBO.  So the far view exists.  What is unproven is whether the SURFACE draws it.
//
// surf_kitsune is a black-and-white grid map, which makes "is that the far room
// or the near one?" genuinely ambiguous in a screenshot -- both look like white
// lines on black.  So the program is temporarily rigged to remove the ambiguity:
// solid MAGENTA everywhere the aperture rasterises, except a vertical strip down
// the middle which shows the real lookup tinted GREEN.
//
//   magenta doorway     -> the pass draws.  The geometry, sort order, depth and
//                          budget are all fine and the bug is the texture lookup.
//   green strip too     -> the lookup works as well, and the far view is simply
//                          hard to tell from the near one on this map.
//   unchanged doorway   -> the pass never rasterises; the FBO is being rendered
//                          and then thrown away, and the fault is downstream of
//                          GenerateBatchTextures in the submit.
//
// Two positions because G13's exit-hall shot looked identical under r_portalfbo
// 0 and 1, which suggests the doorway I aimed at is not the aperture at all --
// the QC said the nearest one was 228.9 units away.  Spawn is where the user
// says the portal is.

cfg_save_auto 0
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "p210_g14"
scr_sshot_type png
cl_yieldcpu 0
cl_maxfps 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0
r_speeds 0
vbsp_portal_render 1

waitms 2500

map surf_kitsune
waitmap 240
waitms 8000
sv_cheats 1

echo "@@@ G14 spawn -- the user says this area has the portal"
waitms 2000
screenshot_mega g14_spawn 1280 720
waitms 600

echo "@@@ G14 exit hall, same spot as G13"
setpos 0 -765 133 0 90 0
waitms 3000
screenshot_mega g14_exit 1280 720
waitms 600

// Sweep the yaw at spawn.  With 18 apertures on the map, one of them is
// somewhere; magenta is visible from any angle and at any distance, so this is a
// cheap way to find out where they actually are rather than guessing.
echo "@@@ G14 yaw sweep at spawn"
setpos 0 -765 133 0 0 0
waitms 1500
screenshot_mega g14_yaw000 1280 720
waitms 400
setpos 0 -765 133 0 180 0
waitms 1500
screenshot_mega g14_yaw180 1280 720
waitms 400
setpos 0 -765 133 0 270 0
waitms 1500
screenshot_mega g14_yaw270 1280 720
waitms 400

echo "@@@ G14 DONE"
waitms 1000
quit
