// SKY06 -- r_sky_forcedepth 0.  The one setting of that cvar not yet tried.
//
// The chain, now that sky04 has named the surface and sky05 has ruled out the
// 2D skybox:
//
//   * At save009 the crosshair lands on `sky/tools/toolsskybox` at y=6144 --
//     a sky WALL about 880 units in front, with the mountain behind it.
//   * `sky` reports the per-map skybox is tendies_sky, so `forcedsky` is set and
//     R_DrawSkyChain takes the FIRST branch (gl_warp.c:527).
//   * That branch tests RDF_SKIPSKY before anything else:
//
//         if (r_refdef.flags & RDF_SKIPSKY)
//         {
//             if (r_worldentity.model->fromgame != fg_quake3)
//                 GL_SkyForceDepth(batch);
//             return true;
//         }
//
//     -- unconditional for a non-Quake3 BSP.  It does NOT consult
//     SKYMUSTBEMASKED, which is the macro that exempts Source maps everywhere
//     else in this file.  GL_SkyForceDepth's own gate is
//     `r_sky_forcedepth.ival || !cls.allow_unmaskedskyboxes`, and the default is
//     1, so the sky surface WRITES DEPTH at 880 units and the mountain behind it
//     is depth-rejected.
//   * RDF_SKIPSKY is set only by GLBE_DrawWorld:7313, i.e. only once the skyroom
//     has actually drawn -- which is exactly "only there when I turn on 3d
//     skybox".
//
// This also explains sky02's oddest number: r_sky_forcedepth 2 changed EXACTLY
// 0 pixels.  2 only widens SKYMUSTBEMASKED, and this call site never reads it.
// 0 is the setting that turns the write off, and it has never been tried.
//
// Prediction: B looks like the skyroom-off control in the rock, while KEEPING
// the 3D skybox where the sky is genuinely open.  If B still shows the plates,
// the depth write is not the mechanism and this whole reading is wrong.

log_enable 1
log_dir "logs"
log_name "sky06"
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 0
vid_fullscreen 0
con_notifytime 0
con_notifylines 0
con_notifytime_error 0

wait 200
echo ^5=== sky06: r_sky_forcedepth 0 ===

map surf_boreas
waitmap 1800
waitms 9000
sv_cheats 1
waitms 300
noclip
waitms 300
setpos 10229.4 5262.8 14725.9 17.2046 139.3616 0
waitms 2000

echo ^5========== A: skyroom 1, r_sky_forcedepth 1 (stock) ==========
vbsp_skyroom 1
r_sky_forcedepth 1
waitms 2500
screenshot sky06_x
waitms 800
screenshot sky06_a_stock
waitms 800

echo ^5========== B: skyroom 1, r_sky_forcedepth 0 ==========
r_sky_forcedepth 0
waitms 2500
screenshot sky06_x
waitms 800
screenshot sky06_b_fd0
waitms 800

echo ^5========== C: skyroom 0, r_sky_forcedepth 1 (control) ==========
r_sky_forcedepth 1
vbsp_skyroom 0
waitms 2500
screenshot sky06_x
waitms 800
screenshot sky06_c_skyoff
waitms 800

echo ^5========== D: second vantage -- save011, skyroom 1 ==========
vbsp_skyroom 1
setpos 13826.6 -2739.2 12105.6 16.3367 163.2788 0
waitms 2500
screenshot sky06_x
waitms 800
screenshot sky06_d11_stock
waitms 800

echo ^5========== E: save011, r_sky_forcedepth 0 ==========
r_sky_forcedepth 0
waitms 2500
screenshot sky06_x
waitms 800
screenshot sky06_e11_fd0
waitms 800
r_sky_forcedepth 1

echo ^5=== sky06 done ===
wait 30
quit
