// FTESurf p290a -- does the picture come back, and which gate eats the flares.
//
// ONE: the black screen.  Patch 288's generated grade script carried an outer
//   brace; Shader_LoadMaterialString does not strip one (gl_shader.c:8386-8390,
//   unlike Shader_DefaultScript at :7379-7391), so the whole body became a single
//   PASS, `program` bound pass->prog instead of shader->prog, and the next `{` hit
//   the pass-level brace handler at :5758-5771.  The stage then drew nothing --
//   and drawing nothing is NOT harmless here, because R_RenderPostProcess hands
//   the rest of the chain a render target it allocated and never wrote (:2639,
//   :2659).  Hence black.
//   PASS: no "unexpected indentation", census reads prog 1 passes 3, picture normal.
//
// TWO: the guard.  r_colourcorrection is pointed at a name that cannot resolve.
//   PASS: the picture stays normal and one warning prints.  FAIL: black -- which
//   would mean the guard tests the wrong thing.
//
// THREE: the flares.  vbsp_glare 0 substitutes glare = 1 for every sprite
//   (cl_sprites.qc:1867) and skips Sprite_Glare entirely, so it isolates the
//   occlusion ramp from everything else in ONE command.  If the flares appear at 0
//   and not at 1, the trace is the gate and nothing else is.
//
// FOUR: a pitch ladder at a vantage we already have a picture from, for the sprite
//   orientation work.  An upright billboard and a camera-facing one are IDENTICAL
//   at pitch 0 -- the difference only exists when the view is tilted, which is why
//   the report is "from underneath".  Same x/y each time so the only variable is
//   the pitch.
cfg_save_auto 0
exec cfg/testrun/_quiet.cfg
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "p290a"
scr_sshot_type png
cl_yieldcpu 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0

waitms 2500

map surf_tensor2
waitmap 240
waitms 8000
sv_cheats 1
noclip
waitms 500

echo "@@@ P290A ---- state ----"
r_colourcorrection
hl2_colourcorrection
vbsp_lightglow
vbsp_glare
waitms 800

// ===================================================== 1. the picture is back
echo "@@@ P290A picture at spawn"
setpos -11684 -12864 13936 0 0 0
waitms 2500
screenshot_mega p290a_spawn 1280 720
waitms 1200

echo "@@@ P290A grade A / A2 control / B"
hl2_colourcorrection 1
waitms 1200
screenshot_mega p290a_cc_a 1280 720
waitms 1200
screenshot_mega p290a_cc_a2 1280 720
waitms 1200
hl2_colourcorrection 0
waitms 1200
screenshot_mega p290a_cc_b 1280 720
waitms 1200
hl2_colourcorrection 1
waitms 1000

// ===================================================== 2. the guard
echo "@@@ P290A guard: point the grade at a shader that cannot exist"
r_colourcorrection "ftesurf/cc/deliberately_not_a_shader"
waitms 1500
screenshot_mega p290a_guard 1280 720
waitms 1200
echo "@@@ P290A guard: back to the map's own"
r_colourcorrection ""
waitms 1200

// ===================================================== 3. the flares
echo "@@@ P290A flares: glare ON (the shipped default)"
setpos 13312 5860 7204 0 270 0
waitms 2200
vbsp_glare 1
waitms 1500
screenshot_mega p290a_flare_glare1 1280 720
waitms 800
screenshot_mega p290a_flare_glare1b 1280 720
waitms 800
vbsp_sprite_debug 1
waitms 900

echo "@@@ P290A flares: glare OFF -- occlusion ramp bypassed, glare = 1 for all"
vbsp_glare 0
waitms 1500
screenshot_mega p290a_flare_glare0 1280 720
waitms 800
vbsp_sprite_debug 1
waitms 900
vbsp_glare 1
waitms 800

// ===================================================== 4. the pitch ladder
echo "@@@ P290A pitch ladder at the g1 corridor -- same x/y, pitch only"
setpos 13312 5860 7204 -40 270 0
waitms 1800
screenshot_mega p290a_pitch_up40 1280 720
waitms 700
setpos 13312 5860 7204 -20 270 0
waitms 1500
screenshot_mega p290a_pitch_up20 1280 720
waitms 700
setpos 13312 5860 7204 0 270 0
waitms 1500
screenshot_mega p290a_pitch_00 1280 720
waitms 700
setpos 13312 5860 7204 25 270 0
waitms 1500
screenshot_mega p290a_pitch_dn25 1280 720
waitms 700

echo "@@@ P290A DONE"
waitms 1200
quit
