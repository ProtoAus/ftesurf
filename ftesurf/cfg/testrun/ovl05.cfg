// OVL05 -- the regression check.  adddecal_static's signature CHANGED (alpha,
// aspect and lifetime now share one vector, because eight arguments is the
// hard ceiling), so the plain infodecal path has to be proved unbroken, not
// assumed unbroken.
//
// bhop_canals is the right map for it twice over:
//   * 416 infodecals, of which 81 placed before any of this work.  That number
//     must still be 81.  Not "about 81" -- exactly 81, or something in the
//     projection changed.
//   * it is also a lump-45 VERSION 1 map (the 356-byte Strata record) with 53
//     overlays, so the same run exercises the widened-header decode.
//
// Then bhop_futile as the no-overlay control: it has no lump 45 at all, so no
// overlay line may appear on it under any setting.

log_enable 1
log_dir "logs"
log_name "ovl05"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
sv_cheats 1

wait 200
echo ^5=== bhop_canals: infodecals must still be 81 of 416 ===
map bhop_canals
waitmap 1800
waitms 5000
ent_census
waitms 800

echo ^5=== and with overlays OFF -- infodecals must be identical ===
vbsp_overlays 0
map bhop_canals
waitmap 1800
waitms 5000

echo ^5=== bhop_futile: no lump 45, no overlay line, either way ===
vbsp_overlays 1
map bhop_futile
waitmap 1800
waitms 4000
ent_census
waitms 800

echo ^5=== ovl05 done ===
wait 30
quit
