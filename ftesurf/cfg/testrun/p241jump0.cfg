// The control for p241jump.cfg: the SAME arc on build 38's three-clock path.
//
// Its own process, because `map <same map>` twice in one session does not reload
// the world and an in-session A/B of this kind has reported the first phase's
// numbers for both phases before.
//
// hud_predicted IS SET AFTER THE MAP, and that is not a style choice.  The HUD's
// cvars are registered by csprogs (HUD_RegisterCvars), which does not exist until
// a map is loading -- so a `hud_predicted 0` in the pre-map block above is an
// unknown command, silently, and the run comes out on the DEFAULT path while
// claiming to be the control.  That is exactly what the first attempt at this
// file did, and the `src` row is what caught it: it read `pred` for all eight
// shots of a run whose whole purpose was to read `stat`.  Check that row before
// believing anything else on the sheet.
//
// What to compare: p241jump's `E` sits flat across the arc.  Here it should
// sweep, by roughly (one snapshot of lag) * v_z / 1 -- a couple of units each
// way between a hard rise and a hard fall, which is the "starts at 45~ and
// counts up to 50" report.  The `src` row reads `stat` throughout, which is how
// you know the control is actually the control.

log_enable 1
log_name p241jump0
developer 1
log_developer 1
cfg_save_auto 0
cl_idlefps 0
sv_cheats 1
cl_maxfps 100
fs_missingwarn 0

hud_debug 1
hud_energy 1
hud_energy_ref 1

wait 200
map surf_aesthetic
waitmap 900
wait 100
hud_predicted 0
wait 200

echo ^5=== p241jump0: standing, hud_predicted 0 ===
screenshot
wait 20

echo ^5=== p241jump0: the arc ===
+jump
wait 8
screenshot
wait 12
screenshot
wait 14
screenshot
wait 20
screenshot
wait 20
screenshot
-jump
wait 40
echo ^5=== p241jump0: landed ===
screenshot
wait 30
screenshot

echo ^5=== p241jump0 done ===
wait 30
quit
