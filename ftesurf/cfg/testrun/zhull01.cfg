// BUILD 47 stage 1 -- the hull geometry, pinned.
//
// zone_selftest is a CSQC command, so it needs a map up even though the test
// itself is pure arithmetic on synthetic rings.  surf_666 is the one b16a used
// for the same reason: it loads fast and nothing here reads its zones.
//
// WHAT MUST BE TRUE
//
//   * the 21 pre-build-47 checks stay green UNCHANGED.  They only call
//     Zone_PointInside and Zone_SegmentInside, whose guts build 47 moved into
//     Zone_XYInRing and Zone_ClipZ -- so they ARE the safety net for that
//     extraction, and any red line among them means the refactor changed an
//     answer rather than a location.
//
//   * every new hull check passes.  The load-bearing ones:
//       "ONLY condition (c) finds this"   -- drop the edge-crossing arm and the
//                                            timer walks through a wall
//       "500 units in one tick"           -- the case a substep cap would fail
//       "no upward expansion"             -- origin-at-the-feet, mins_z 0
//       "STANDING hull" vs "DUCKED hull"  -- the 17 units run_zone_hull_live is
//
// Nothing here touches data/runs or data/saves.

waitms 2000

echo ^5=== build 47: hull geometry self-test ===

map surf_666
waitmap 120
wait 30

zone_selftest

wait 10
echo ^5=== END OF RUN ===
wait 10
quit
