// B44OFF -- run_class 0, which has to be build 43 and nothing in between.
//
// A BISECTION CVAR THAT DOES NOT ACTUALLY RESTORE THE OLD BEHAVIOUR IS WORSE
// THAN NONE, because it is the thing you reach for when the new behaviour is
// suspected and it would then quietly confirm the suspicion.  So the claim is
// tested rather than asserted: with this at 0, every gesture build 44 renamed
// must still taint the run exactly as much as it did before, must say the old
// word, and must set neither new bit.
//
// BUILD 46 BROKE ONE ROW OF THIS FILE ON PURPOSE, AND THAT IS THE POINT.  "Build
// 43 exactly" turned out to include "sv_cheats taints nothing", because build 43
// did not watch the cvar at all -- so at run_class 0 an sv_cheats run was
// RANKABLE, and the file below asserted that as correct.  The user's call was to
// close it.  sv_cheats is now a taint at every setting of run_class; only the
// WORD is bisected.  The last arm's expectation is rewritten in place rather than
// deleted, so this file still fails if the fix is ever reverted, and b46cheat.cfg
// is the positive assertion for the same change.  Every other arm is unchanged
// and must still read exactly as it did.
//
// SET BEFORE `map`, WHICH IS LOAD-BEARING.  SV_TimerMapInit caches the cvar once
// per map load, so a `run_class 0` typed after the map is on screen would be
// read by nothing until the next one -- the same latching every stage rule in
// that function has, and for the same reason (an A/B must not change under a
// live run).
//
//   EXPECT, at every reading below:
//     class: practice (seg 0 cheat 0 cheatlatch 0)
//     the save-lock hold prints `^3practice run`, not `segmented run`
//     noclip prints NOTHING extra -- the umbrella is already up and there is no
//       class to upgrade to, which is precisely build 43's behaviour
//     stage class: stitch 0 cheat 0
//   ...while `practice 1` and `dirty 1` are set throughout, because the taints
//   themselves are untouched by this cvar.  That pair is the whole assertion:
//   the run is exactly as spoiled and exactly as differently described.

log_enable 1
log_dir "logs"
log_name "b44off"
developer 1
log_developer 1
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0

sv_cheats 0
run_class 0

wait 200
map bhop_eazy
waitmap 1800
waitms 2500

echo ^5=== b44off: the cvar, as the server cached it ===
run_class

echo ^5=== b44off: armed, clean ===
cmd zone_goto 0 16.18 0
waitms 700
cmd viewpos
cmd timer

echo ^5=== b44off: walking out ===
+forward
waitms 2200
-forward
waitms 400
cmd viewpos
cmd timer

echo ^5=== b44off: save + hold -- expect `practice run`, seg 0 ===
cmd sl_save
waitms 400
cmd sl_hold
waitms 900
cmd viewpos
cmd timer
cmd sl_holdoff
waitms 400

echo ^5=== b44off: noclip -- expect practice, cheat 0, no new line ===
noclip
waitms 900
cmd viewpos
cmd timer

// BUILD 46: THIS ARM'S EXPECTATION IS THE ONE THAT CHANGED.  It used to read
// "and sv_cheats, which this cvar makes invisible", and invisible meant
// unrankable-runs-becoming-rankable.  Now:
//
//   cheats now        0 -> 1        (SV_CheatsOn no longer gated by run_class)
//   stage class       cheat 0 -> 1  (the LEVEL half, set every tick by the watcher)
//   class             practice      UNCHANGED -- no new bit at run_class 0
//   seg/cheat/cheatlatch  0 0 0     UNCHANGED, same reason
//   practice / dirty  1 / 1         unchanged HERE only because the noclip arm
//                                   above already spoiled the attempt; b46cheat.cfg
//                                   is the version of this arm that starts clean,
//                                   which is what actually proves the fix
sv_cheats 1
waitms 900
cmd viewpos
cmd timer

echo ^5=== b44off: done ===
waitms 600
quit
