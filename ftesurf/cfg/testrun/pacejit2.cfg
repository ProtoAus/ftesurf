// PACEJIT2 -- pacejit1's arms, at the viewpoint the judder was actually reported
// from, plus the cl_maxfps 1000 hazard arm.
//
// WHAT PACEJIT1 GOT WRONG.  It measured surf_4am from the map's own spawn and
// read 1180-1202 fps there -- FASTER than surf_rise (569-966).  So its "heavy
// map vs light map" comparison was not testing what it claimed: at that
// viewpoint 4am is the lighter of the two, and the reporter's ~500 fps is
// somewhere else entirely.  The mode-1 vs mode-4 result stands (it is a
// same-map, same-viewpoint, same-cap comparison and viewpoint cancels), but the
// map-weight claim does not, and this file exists to stop repeating it.
//
// WHERE THIS ONE STANDS.  data/saves/surf_4am/save002/state.txt is a real
// mid-run position from the reporter's own play:
//
//     origin  -1795.8083 -10591.3271 8832.0312
//     angles  29.5312 -15.5237
//     velocity 250.5152 -69.5855 0     elapsed 13.969784
//
// That is out in the map at running speed, not on the spawn block.  setpos takes
// its arguments in exactly the order `viewpos` prints them (sv_player.qc:733-740
// prints "setpos %.1f ..." specifically so it pastes back), so the numbers below
// are that file, transcribed.
//
// setpos forces MOVETYPE_NOCLIP and taints the run -- both are fine and neither
// is measured here.  No run is started, nothing is finished, and surf_4am has no
// data/runs directory: it must still have none when this exits.
//
// THE ARMS.  Same three as pacejit1 plus one:
//
//   A  cl_maxfps 0    pacing 1   the reporter's shipped config (ftesurf.cfg:344)
//   B  cl_maxfps 300  pacing 1   frame-START pacing, what FTESurf ships
//   C  cl_maxfps 300  pacing 4   PRESENT pacing
//   D  cl_maxfps 1000 pacing 4   THE HAZARD ARM, and it is expected to be WORSE
//                                than C.  Sys_FramePacePresent rounds every
//                                present up to the next 1/cl_maxfps slot
//                                (sys_win.c:2198) -- a 1 ms lattice at 1000 --
//                                while the simulation stays continuous.  If the
//                                map cannot hold 1000, presents land 2 or 3
//                                slots apart and the quantisation IS a beat.
//                                default.cfg:842 currently ships cl_maxfps 1000,
//                                so this arm decides whether mode 4 can simply
//                                be turned on there or needs the cap lowered
//                                with it.
//
// Yaw in place at 90 deg/s, 4000 ms per arm = exactly one revolution, so every
// arm draws the same content.  developer 0 / log_developer 0 / notify off, for
// the reason b45perf.cfg's header gives.
//
// NOTE ON THE PER-FRAME SPIKE LOG, WHICH PACEJIT1 MISREAD.  At
// cl_debug_spike_ms 0.001 every frame prints, and the print costs ~3.6 ms per
// frame: pacejit1's spike block reported host_frametime 4.939 ms against a
// 1.308 ms in-frame total, i.e. the instrument was three quarters of the
// measurement.  It is not repeated here.  Frame-period alternation cannot be
// measured with a per-frame Con_Printf and needs a ring buffer instead.

log_enable 1
log_dir "logs"
log_name "pacejit2"
developer 0
log_developer 0
cfg_save_auto 0
sv_cheats 0
fs_missingwarn 0

cl_idlefps 0
vid_vsync 0
vid_fullscreen 0
con_notifylines 0
con_notifytime 0
scr_conalpha 0
cl_yawspeed 90

wait 200
map surf_4am
waitmap 1800
waitms 5000
clear

echo ^5=== pacejit2: to the reported viewpoint ===
setpos -1795.8 -10591.3 8832.0 29.5 -15.5 0
waitms 1200
cmd viewpos
waitms 800
echo ^5=== pacejit2: settling ===
waitms 3000

// ---- round 1 --------------------------------------------------------------
echo ^5=== pacejit2: 4am r1 A -- cl_maxfps 0 pacing 1 ===
cl_maxfps 0
sys_framepacing 1
waitms 800
+left
waitms 4000
sys_framepacing_stats
waitms 400
-left
waitms 600

echo ^5=== pacejit2: 4am r1 B -- cl_maxfps 300 pacing 1 ===
cl_maxfps 300
sys_framepacing 1
waitms 800
+left
waitms 4000
sys_framepacing_stats
waitms 400
-left
waitms 600

echo ^5=== pacejit2: 4am r1 C -- cl_maxfps 300 pacing 4 ===
cl_maxfps 300
sys_framepacing 4
waitms 800
+left
waitms 4000
sys_framepacing_stats
waitms 400
-left
waitms 600

echo ^5=== pacejit2: 4am r1 D -- cl_maxfps 1000 pacing 4 ===
cl_maxfps 1000
sys_framepacing 4
waitms 800
+left
waitms 4000
sys_framepacing_stats
waitms 400
-left
waitms 600

// ---- round 2 --------------------------------------------------------------
echo ^5=== pacejit2: 4am r2 A -- cl_maxfps 0 pacing 1 ===
cl_maxfps 0
sys_framepacing 1
waitms 800
+left
waitms 4000
sys_framepacing_stats
waitms 400
-left
waitms 600

echo ^5=== pacejit2: 4am r2 B -- cl_maxfps 300 pacing 1 ===
cl_maxfps 300
sys_framepacing 1
waitms 800
+left
waitms 4000
sys_framepacing_stats
waitms 400
-left
waitms 600

echo ^5=== pacejit2: 4am r2 C -- cl_maxfps 300 pacing 4 ===
cl_maxfps 300
sys_framepacing 4
waitms 800
+left
waitms 4000
sys_framepacing_stats
waitms 400
-left
waitms 600

echo ^5=== pacejit2: 4am r2 D -- cl_maxfps 1000 pacing 4 ===
cl_maxfps 1000
sys_framepacing 4
waitms 800
+left
waitms 4000
sys_framepacing_stats
waitms 400
-left
waitms 600

// ---- round 3 --------------------------------------------------------------
echo ^5=== pacejit2: 4am r3 A -- cl_maxfps 0 pacing 1 ===
cl_maxfps 0
sys_framepacing 1
waitms 800
+left
waitms 4000
sys_framepacing_stats
waitms 400
-left
waitms 600

echo ^5=== pacejit2: 4am r3 B -- cl_maxfps 300 pacing 1 ===
cl_maxfps 300
sys_framepacing 1
waitms 800
+left
waitms 4000
sys_framepacing_stats
waitms 400
-left
waitms 600

echo ^5=== pacejit2: 4am r3 C -- cl_maxfps 300 pacing 4 ===
cl_maxfps 300
sys_framepacing 4
waitms 800
+left
waitms 4000
sys_framepacing_stats
waitms 400
-left
waitms 600

echo ^5=== pacejit2: 4am r3 D -- cl_maxfps 1000 pacing 4 ===
cl_maxfps 1000
sys_framepacing 4
waitms 800
+left
waitms 4000
sys_framepacing_stats
waitms 400
-left
waitms 600

echo ^5=== pacejit2: render cost at this viewpoint ===
cl_maxfps 0
sys_framepacing 1
waitms 800
r_speeds 2
waitms 1500
r_speeds_dump
waitms 400
r_speeds 0
waitms 600

echo ^5=== pacejit2: done ===
waitms 600
quit
