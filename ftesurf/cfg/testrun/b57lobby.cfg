// cfg_save_auto 0 FIRST: this run sets archived cvars (cl_maxfps, vid_*, sv_port)
// and must never write them into ftesurf.cfg (cl_main.c:2535).
cfg_save_auto 0

// ===========================================================================
//  B57LOBBY -- the lobby-time GATE, proved locally, both directions.
//
//  WHY THIS FILE EXISTS.  Build 57 saves a lobby time on the PLAYER'S OWN DISK
//  the moment a stage is beaten, because a lobby server writes nothing (its
//  cfg/lobby.cfg sets lobby_nopb 1 and lobby_norec 1, and an SSQC write would
//  land on the Pi anyway).  The client decides entirely from one stat:
//
//      STAT_FS_LOBBY   bit 0 LS_LOBBY   this is a lobby
//                      bit 1 LS_NOPB    the server keeps no personal best
//                      bit 2 LS_NOREC   the server records no replay
//
//  cl_lobbytime.qc writes ONLY when the server keeps NEITHER -- all three bits,
//  value 7 -- so that a listen server, which writes its own files, can never
//  double-write.  That gate is the whole feature and it is testable here.
//
//  THIS IS NOT A SIMULATION OF A LOBBY, IT IS THE SAME CODE.  Lobby_Active() is
//  `cvar("lobby_enable") != 0` and NoPB/NoRec are that AND their own cvar
//  (sv_lobby.qc:226-228).  A listen server with the three cvars set publishes
//  byte-identical stats to the Pi's lobbies, so the client cannot tell them
//  apart -- which is precisely what makes this a fair test of the client half.
//
//  WHAT IT CANNOT PROVE, STATED UP FRONT.  A stage is only written when the
//  server marks it QUALIFYING, and SV_StageQualifies refuses a stage that was
//  cheated (run_st_dirty is an umbrella over stitch and cheat).  Every route a
//  config has for crossing 3099 units of bhop_eazy is noclip.  So the positive
//  case -- a clean stage actually producing a file -- CANNOT be reached from a
//  script and is left to a human on a real lobby.  What IS proved here:
//
//    1  the three lobby bits reach the client and read 7, not 1 and not 0;
//    2  LT_StatsAreMine() is true for the local player, the ownership test that
//       decides whether a time may be written to THIS disk at all;
//    3  a CHEATED stage close is REFUSED -- the negative control.  Without 3,
//       "no file appeared" after a clean run would be indistinguishable from a
//       gate that is simply never open, and 1 and 2 would prove nothing.
//
//  PORT 27600, NOT 27500, and never 27510-27550: a test that binds the default
//  port silently joins or blocks Lex's own game, and those five are the public
//  lobbies.  This server never heartbeats -- lobby_master is empty in QC and
//  nothing here sets it -- so it cannot appear in the directory.
//
//  Route and yaw are bhop_eazy's, measured by zone_list in b43stage.cfg and
//  re-checked in b57stage.cfg:  start (-352 -352 144) -> stage 1 (2624 512 144),
//  yaw 16.18, distance 3099.
// ===========================================================================

log_enable 1
log_dir "logs"
log_name "b57lobby"
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
sv_cheats 1
fs_missingwarn 0
con_notifylines 0
sv_port 27600

// Present this server EXACTLY as cfg/lobby.cfg presents the Pi's five.
// `set`, not a bare name: a bare unknown token is parsed as a COMMAND and
// reports "Unknown command" while silently changing nothing.
set lobby_enable 1
set lobby_nopb   1
set lobby_norec  1

// rec_lobbytimes is the player's off switch for the whole feature; it must be
// on for this test to mean anything, and its own falsification (0 writes
// nothing) belongs on a real lobby with a clean run.
set rec_lobbytimes 1

wait 200
echo ^5=== b57lobby: bhop_eazy, presented as a lobby ===
map bhop_eazy
waitmap 1800
waitms 2500

// ---------------------------------------------------------------------------
//  1 and 2.  The gate and the ownership test.
//
//  `timer` WITHOUT `cmd` is the CSQC console command -- the one that prints the
//  `cl lobby:` lines.  `cmd timer` asks only the server and prints none of them.
//
//  EXPECT:  cl lobby: stat 7 (lobby 1 nopb 1 norec 1)
//           cl lobby: mine 1 (localent 1 localnum 0) ...
//
//  stat 1 would mean the server calls itself a lobby while still keeping the
//  player's records -- the one combination the client must refuse, because both
//  halves would write the same file.
// ---------------------------------------------------------------------------
echo ^5=== b57lobby 1+2: expect stat 7 (lobby 1 nopb 1 norec 1) and mine 1 ===
timer
waitms 900

// ---------------------------------------------------------------------------
//  3.  THE NEGATIVE CONTROL: a cheated stage must be refused.
//
//  noclip, arm at the START, fly across segment 1's boundary.  The leg machine
//  runs normally -- b57stage.cfg proves a close happens here -- but the stage is
//  dirty, so SV_StageQualifies refuses it and no lobby time may be written.
//
//  EXPECT: a stage close for leg 1 that does NOT carry the qualifying flag, and
//  NO `stage 1 saved` line from the client.  A file appearing in
//  data/runs/bhop_eazy/ after this run is a FAILURE, not a success.
// ---------------------------------------------------------------------------
//  PIN THE HEADING WITH setpos, DO NOT TRUST zone_goto's YAW ARGUMENT.
//  The first run of this file flew zone_goto's 16.18 and came back
//    631 -347 (yaw 0.5) -> 1614 -61 (yaw 179.5) -> 1749 -63 -> 1884 -64
//  i.e. it turned around between the first two samples and then crawled ~135
//  units a second into geometry instead of covering ~1000 toward stage 1 at
//  2624 512.  It never reached segment 1, so the refusal it was supposed to
//  demonstrate never happened and "nothing was saved" meant nothing at all.
//  b57stage.cfg documents the same trap for its step B and fixes it the same
//  way: setpos carries the yaw, and it marks practice rather than voiding --
//  which this run already is.
echo ^5=== b57lobby 3: cheated stage 1 -- expect a close that does NOT qualify ===
noclip
cmd zone_goto 0 16.18 0
waitms 700
setpos -352 -352 144 0 16.18 0
waitms 600
echo ^5--- c0: expect -352 -352 144, yaw 16.18 ---
cmd viewpos
cmd timer

+forward
waitms 1000
echo ^5--- c1 ---
cmd viewpos
waitms 1000
echo ^5--- c2 ---
cmd viewpos
waitms 1000
echo ^5--- c3 ---
cmd viewpos
waitms 1000
echo ^5--- c4 ---
cmd viewpos
cmd timer
waitms 1000
echo ^5--- c5 ---
cmd viewpos
waitms 1200
-forward
waitms 500

echo ^5=== b57lobby 3: across the boundary -- expect NOT qualifying, nothing saved ===
cmd viewpos
cmd timer
timer
waitms 900

echo ^5=== b57lobby: done ===
waitms 400
quit
