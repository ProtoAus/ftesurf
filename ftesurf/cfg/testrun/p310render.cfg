cfg_save_auto 0
// PATCH 310 -- FALSIFIER.  The .hid now records the settings that change what
// the player could SEE, and every mid-run change to them.
//
// WHY.  Patches 293/301/303 put the input pipeline's constants in this file
// because a record of mouse counts proves nothing without the numbers that turn
// them into an angle.  The same argument applies to the renderer and had never
// been made.  A run recorded with the fog switched off, or the world drawn
// fullbright, is a different run from the one the .hid described -- and nothing
// in the evidence said so.
//
// r_fog_progless 0 is the concrete case: it restores the pre-Patch-266 behaviour
// in which program-less surfaces take no distance fog, which on a fogged map
// means seeing through the fog across a large share of the world.  It is
// CVAR_ARCHIVE and NOT CVAR_CHEAT, so it survives a restart and no server gate
// touches it.  Worse: r_fullbright and r_drawflat carry NO FLAGS AT ALL.
//
// RECORD RATHER THAN BLOCK, for now.  Blocking needs a client-cvar enforcement
// channel this game does not have yet, and a block with no record is
// unfalsifiable after the fact -- an auditor still could not tell what a run was
// played with.  Recording ships today, composes with a gate later, and is the
// same architecture as every other column here: the file states what happened
// and the validator decides what it means.
//
// THE VALUE AND THE DEFAULT ON ONE LINE, for the Patch 293 reason: a reader that
// knows only the value needs its own table of what is normal, that table drifts
// from the engine's, and the check silently starts measuring the wrong thing.
//
// PRE-REGISTERED, before the run:
//   ARM A  everything at its default -> data/p310_A.hid
//          A `render` line for EVERY cvar in the table, each with value equal to
//          default, and NO 'c' record anywhere.
//   ARM B  r_fog_progless 0 set BEFORE the journal opens -> data/p310_B.hid
//          The header MUST read `render r_fog_progless "0" "1"` -- value and
//          default differing on one line, so the reader needs no table of its
//          own.  Still no 'c' record: nothing changed DURING this journal.
//   ARM C  journal opened at the default, then r_fog_progless 0 mid-run
//          -> data/p310_C.hid
//          The header MUST say 1 and there MUST be exactly one 'c' record
//          naming r_fog_progless with the new value.
//   ARM D  set to 0 and back to 1, both inside the journal -> data/p310_D.hid
//          THE ARM THIS DESIGN EXISTS FOR.  The header says 1 and the final
//          value is 1, so a reader comparing start against end sees NOTHING
//          HAPPENED.  There MUST be TWO 'c' records.  Change is tracked by
//          modifiedcount, not by comparing values, precisely so a set-and-
//          set-back cannot hide -- and "it was briefly something else" is the
//          fact a snapshot-based reader would miss.
//
// WHAT THIS DOES NOT DO: it does not stop anyone setting these.  It makes the
// setting part of the evidence.  A ranked GATE is a separate piece of work and
// needs a client-cvar channel that does not exist yet.

exec cfg/testrun/_quiet.cfg

developer 1
log_developer 1
log_enable 1
log_dir logs
log_name p310render
cl_maxfps 100
cl_idlefps 0
sv_cheats 0
con_notifylines 0
con_notifytime 0.01
r_drawviewmodel 0

wait 200
map bhop_eazy
waitmap 600
waitms 5000

r_fog_progless 1
waitms 500

echo ^5=== P310 ARM A: everything default
in_journal_begin
waitms 1500
in_journal_note p310-arm-A-default
waitms 200
in_journal_end data/p310_A.hid
waitms 1000

echo ^5=== P310 ARM B: r_fog_progless 0 set BEFORE the journal
r_fog_progless 0
waitms 500
in_journal_begin
waitms 1500
in_journal_note p310-arm-B-preset
waitms 200
in_journal_end data/p310_B.hid
waitms 1000

echo ^5=== P310 ARM C: changed DURING the journal
r_fog_progless 1
waitms 500
in_journal_begin
waitms 700
r_fog_progless 0
waitms 800
in_journal_note p310-arm-C-midrun
waitms 200
in_journal_end data/p310_C.hid
waitms 1000

echo ^5=== P310 ARM D: set and set BACK, both inside the journal
r_fog_progless 1
waitms 500
in_journal_begin
waitms 500
r_fog_progless 0
waitms 500
r_fog_progless 1
waitms 500
in_journal_note p310-arm-D-therebackagain
waitms 200
in_journal_end data/p310_D.hid
waitms 1000

r_fog_progless 1
echo ^5=== END OF RUN ===
waitms 1000
quit

// ===========================================================================
// MEASURED -- engine\release\fteqw64.exe 83D007EA974E, 2026-09-13.  First
// attempt, no harness needed: cvars are console commands, so unlike the mouse
// and button patches this one is fully scriptable.
//
//   arm  header r_fog_progless        'c' records
//    A   render r_fog_progless "1" "1"     0        AS REGISTERED
//    B   render r_fog_progless "0" "1"     0        AS REGISTERED
//    C   render r_fog_progless "1" "1"     1  (="0")  AS REGISTERED
//    D   render r_fog_progless "1" "1"     2  (0 -> 1) AS REGISTERED
//
// ARM D IS THE RESULT WORTH READING.  Its header says 1 and its final value is
// 1, so a reader comparing the start against the end sees NOTHING HAPPENED --
// and the fog was off for half a second in the middle.  Tracking modifiedcount
// instead of the value is what makes that survive into the record.  A
// value-comparison design would have passed this arm while being wrong.
//
// The full table recorded in arm A, all eleven at their defaults:
//   r_fog_progless "1" "1"        r_fog_linear "1" "1"
//   r_fog_exp2 "1" "1"            r_fullbright "0" "0"
//   r_drawflat "0" "0"            r_drawentities "1" "1"
//   r_novis "0" "0"               r_lightmap_saturation "1" "1"
//   r_shadow_realtime_world "0" "0"
//   r_showtris "0" "0"            r_showbboxes "0" "0"
//
// THE ENGINE CORRECTED THE TABLE, which is worth writing down.  The source asks
// for `r_wireframe`; the file records `r_showtris`.  renderer.c:162 declares
// `cvar_t r_wireframe = CVARAFD("r_showtris", ...)` -- the C identifier and the
// console name differ, and the lookup found it by its alias.  Recording
// cvar->name rather than the string we asked for means the file always names
// the cvar the engine actually has.  A reader grepping a .hid for r_wireframe
// will not find it, and that is correct rather than a bug.
//
// WHAT THIS DOES NOT DO, stated so the patch is not oversold: it does not stop
// anyone setting these.  It makes the setting part of the evidence.  A ranked
// GATE needs a client-cvar enforcement channel that does not exist yet, and a
// block with no record would be unfalsifiable after the fact anyway -- an
// auditor still could not tell what a run was played with.  hidcheck reports
// off-default values as NOTES and never faults: this tool records what a run
// was played with, it does not decide the rules.
//
// hidcheck.py: `render` collected as a repeating header line (like `dev` -- a
// dict would have kept the last of eleven), 'c' parsed, off-default values and
// mid-run changes reported, `-` handled as "no such cvar in that build" rather
// than as 0.  FIVE new suite cases; 80 checks, 0 failed.
// Arms still fault with "no frame markers" -- the scripted-capture trap, not
// this patch.
