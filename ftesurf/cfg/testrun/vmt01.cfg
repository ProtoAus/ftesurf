// VMT01 -- Patch 250: the .vmt key census, and the end of the developer-1 flood.
//
// The report was "developer 2 floods with Unknown field lines on surf_demise,
// surf_boreas and surf_garden -- record all the missing keys, deal with the ones
// you can".  This run is both the check and the record.
//
// An offline census of the three maps' packed VMTs (387 files) found 114 distinct
// $keys, 45 of them unknown to this build.  Widening to a 90-map random sample:
// 11096 VMTs, 371 keys, 274 unknown -- of which only 101 are real Source shader
// parameters and 173 are names Source does not declare either.  That split is why
// the fix is a class test (VMT_IsKnownSourceParam, generated from Source's own
// 441 SHADER_PARAM declarations) rather than 45 more entries in an allow-list:
// the second group is proxy result variables a mapper invents freely and can
// never be enumerated.
//
// WHAT TO CHECK, in order:
//   1. Zero "Unknown field" lines at the default hl2_vmtkeys 0. That string was
//      the flood; it should not appear anywhere in this log.
//   2. vmt_keys lists the same keys the offline census predicted. Anything extra
//      came from a VPK rather than the map's own pakfile -- the offline pass reads
//      pakfiles only, and surf_garden pulls CS:GO via data/mapdeps.txt. That gap
//      is the whole reason for running this rather than trusting the static list.
//   3. hl2_vmtkeys 1 on the last map prints each distinct key ONCE. Compare its
//      line count against vmt_keys' distinct count -- they must agree.
//
// developer 1 + log_developer 1 both: log_developer is what puts Con_DPrintf in
// the log file, developer alone only echoes to the console.

log_enable 1
log_dir "logs"
log_name "vmt01"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
developer 1
log_developer 1
hl2_vmtkeys 0

wait 200

echo ^5=================== surf_demise ===================================
map surf_demise
waitmap 1800
waitms 9000
echo ^5--- vmt_keys: surf_demise ---
vmt_keys
waitms 1000

echo ^5=================== surf_boreas ===================================
map surf_boreas
waitmap 1800
waitms 9000
echo ^5--- vmt_keys: surf_boreas ---
vmt_keys
waitms 1000

echo ^5=================== surf_garden ===================================
map surf_garden
waitmap 1800
waitms 9000
echo ^5--- vmt_keys: surf_garden ---
vmt_keys
waitms 1000

echo ^5=========== hl2_vmtkeys 1: one line per distinct key ==============
hl2_vmtkeys 1
map surf_demise
waitmap 1800
waitms 9000
echo ^5--- vmt_keys again, for the count to compare against ---
vmt_keys
waitms 1000

echo ^5=== vmt01 done ===
wait 30
quit
