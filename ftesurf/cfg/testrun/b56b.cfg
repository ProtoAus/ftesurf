// FTESurf b56b -- build 56 follow-ups, after the review fixes.
//
// 0. STANDING INSIDE A VOLUME.  The review found that a trace starting inside a
//    probe copy's box never returns it, so the trigger you stand in could not be
//    named.  The camera goes inside env_embers *116 -- a 256x256x448 brush volume
//    that does nothing on touch (bounds from the BSP models lump plus origin,
//    checked against *36's south face at y=-10840, where b56a's trace hit).
//    PASS: "you are inside the bounding box of 1 volume; the smallest is
//    env_embers *116" from BOTH steps, and NEITHER selects *116.  Step 0's ray
//    stops on world 128 units ahead (frac 0.0156), so the answer is the world
//    diagnostics; step 0b's finds trigger_multiple *109 below, a nearer entity
//    than the volume the camera stands in.  Before the fix, step 0 selected
//    *116 over that world hit and printed no diagnostics at all.
//    NOT EXERCISED HERE: the fallback's other half, where a ray reaches EV_PROBE
//    touching nothing and the enclosing volume IS the answer.  On a map this
//    dense every direction hits something; it needs a hand test in open space.
//
// 1. b56a's step 7 did NOT test what it said.  It checked that `ent_view` off
//    releases the inspector's cursor, but the leaderboard from step 6 was still
//    up: a second `+showscores` from a cfg does not close the board, because the
//    engine treats TAB as still held until it sees `-showscores`.  So ent_cursor
//    was refused ("close the leaderboard first") and the release was never
//    exercised.  Re-done here with no leaderboard anywhere in the run.
//    1c. A scripted point ON the panel must print "that point is on the panel"
//        and select nothing.  1500 300 is inside it at the 1920x1111 window these
//        runs get (panel x 992..1888 from y 192 at hud_scale 2).
//    1d. A bare ent_copyrow must print usage, not copy row 0.
//
// 2. The ent_info cooldown (sv_zones.qc SV_EntInfo, build 56): a per-client
//    0.25 s silent refusal.  COUNTED OVER THE WHOLE LOG, NOT BETWEEN ECHOES --
//    a local `echo` runs ahead of queued `cmd` replies (ftesurf-scripted-capture
//    trap 9), and ent_here's server request goes out through localcmd, so echo
//    markers cannot bracket the replies reliably.  This run causes exactly
//    four separated trigger_teleport requests, one of them a burst:
//        step 1b   one centre click          -> 1 reply
//        step 2    five ent_here in one line -> 1 reply (4 refused silently)
//        step 2b   one ent_here, 1.5 s later -> 1 reply
//        step 3    one centre click          -> 1 reply
//    PASS: exactly 4 "ent_info: 'trigger_teleport'" lines in the log.
//    Without the cooldown it would be 8.  (Step 0's reply names env_embers, and
//    step 0b must produce NO reply at all.)
//
// 3. The panel after the review's layout fixes: two shots, read the second
//    (a screenshot captures one step behind -- scripted-capture trap 7).
//    PASS: the panel's left edge is right of screen centre, clear of the
//    selected teleport's volume at the crosshair.
cfg_save_auto 0
exec cfg/testrun/_quiet.cfg
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "b56b"
scr_sshot_type png
cl_yieldcpu 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0

waitms 2500
map surf_tensor2
waitmap 240
waitms 8000
sv_cheats 1
noclip
waitms 500

setpos -11200 10560 160 0 0 0
waitms 2500
echo "@@@ B56B 0. ent_here from inside env_embers *116"
ent_here
waitms 1500

// 0b. Still inside it, aimed DOWN.  PASS: the inside note, and an [enthere] for
//     whatever the ray finds below (trigger_multiple *109) -- never *116, the
//     volume the camera is standing in.  Its server reply is also the case that
//     found the zero-volume sentinel bug in SV_EntInfo: model '-', volume 0.
setpos -11200 10560 160 90 0 0
waitms 2000
echo "@@@ B56B 0b. aimed at world from inside the volume -- must not select it"
ent_here
waitms 1500

setpos -11776 -11020 13680 0 90 0
waitms 2500

echo "@@@ B56B 1. ent_cursor on, ent_view off, then ent_click must refuse"
ent_cursor
waitms 1000
ent_view
waitms 1000
ent_click
waitms 1000

echo "@@@ B56B 1b. ent_cursor must work again, and a centre click selects"
ent_cursor
waitms 1200
ent_click
waitms 2000
screenshot b56b_panel_x
waitms 900
screenshot b56b_panel
waitms 1000

echo "@@@ B56B 1c. a scripted point on the panel must not pick through it"
ent_click 1500 300
waitms 1000
echo "@@@ B56B 1d. a bare ent_copyrow prints usage"
ent_copyrow
waitms 500
ent_cursor
waitms 1000

echo "@@@ B56B 2. five ent_here in one burst"
ent_here; ent_here; ent_here; ent_here; ent_here
waitms 1500

echo "@@@ B56B 2b. one more after the cooldown"
ent_here
waitms 2000

// 3. The panel-lift path, which only shows at a scale where the full-height
//    panel does not fit: hud_scale 4 on this 1111-high window needs a lift.
//    PASS: the panel is drawn whole, with a key list in it, not clipped away.
echo "@@@ B56B 3. panel at hud_scale 4"
ent_cursor
waitms 800
ent_click
waitms 1200
hud_scale 4
waitms 1500
screenshot b56b_scale4_x
waitms 900
screenshot b56b_scale4
waitms 900
hud_scale 2
waitms 800
ent_cursor
waitms 800

echo "@@@ B56B DONE"
waitms 1200
quit
