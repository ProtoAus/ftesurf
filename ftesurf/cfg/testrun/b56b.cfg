// FTESurf b56b -- build 56 follow-ups, after the review fixes.
//
// 1. b56a's step 7 did NOT test what it said.  It checked that `ent_view` off
//    releases the inspector's cursor, but the leaderboard from step 6 was still
//    up: a second `+showscores` from a cfg does not close the board, because the
//    engine treats TAB as still held until it sees `-showscores`.  So ent_cursor
//    was refused ("close the leaderboard first") and the release was never
//    exercised.  Re-done here with no leaderboard anywhere in the run.
//
// 2. The ent_info cooldown (sv_zones.qc SV_EntInfo, build 56): a per-client
//    0.25 s silent refusal.  COUNTED OVER THE WHOLE LOG, NOT BETWEEN ECHOES --
//    a local `echo` runs ahead of queued `cmd` replies (ftesurf-scripted-capture
//    trap 9), and ent_here's server request goes out through localcmd, so echo
//    markers cannot bracket the replies reliably.  This run causes exactly
//    three separated requests plus one burst:
//        step 1b   one centre click          -> 1 reply
//        step 2    five ent_here in one line -> 1 reply (4 refused silently)
//        step 2b   one ent_here, 1.5 s later -> 1 reply
//    PASS: exactly 3 "ent_info: 'trigger_teleport'" lines in the log.
//    Without the cooldown it would be 7.
//
// 3. The panel after the review's layout fixes: two shots, read the second
//    (a screenshot captures one step behind -- scripted-capture trap 7).
cfg_save_auto 0
exec cfg/testrun/_quiet.cfg
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "b56b"
scr_sshot_type png
cl_yieldcpu 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0

waitms 2500
map surf_tensor2
waitmap 240
waitms 8000
sv_cheats 1
noclip
waitms 500

setpos -11776 -11020 13680 0 90 0
waitms 2500

echo "@@@ B56B 1. ent_cursor on, ent_view off, then ent_click must refuse"
ent_cursor
waitms 1000
ent_view
waitms 1000
ent_click
waitms 1000

echo "@@@ B56B 1b. ent_cursor must work again, and a centre click selects"
ent_cursor
waitms 1200
ent_click
waitms 2000
screenshot b56b_panel_x
waitms 900
screenshot b56b_panel
waitms 1000
ent_cursor
waitms 1000

echo "@@@ B56B 2. five ent_here in one burst"
ent_here; ent_here; ent_here; ent_here; ent_here
waitms 1500

echo "@@@ B56B 2b. one more after the cooldown"
ent_here
waitms 2000

echo "@@@ B56B DONE"
waitms 1200
quit
