// Is r_particledesc "classic" what has been killing every scripted particle?
//
// cfg/default.cfg:3168-3170 says, in as many words:
//     "NOTHING sets r_particledesc: writing it while connected kills every
//      effect and does not reload them (p_script.c:3817-3822)"
// and the user's ARCHIVED ftesurf.cfg line 334 is `r_particledesc "classic"`.
// ftesurf.cfg execs after default.cfg, so the rule is broken by the saved
// config on every single boot.
//
// The previous run established the fact this explains: on surf_anubis -- 161
// env_fire and 498 env_smokestack, all shipped working in builds 49/51 --
// r_partinfo reports NO type with a live particle.  So this is not about the
// new rain at all; it is why `surf_anubis is missing fire` is still in
// C:\FTESurf\report despite build 51 having implemented the torches.
//
// Set AFTER boot and BEFORE connecting: ftesurf.cfg would overwrite anything
// set on the command line, and setting it while connected is the destructive
// case the essay warns about.
//
// A/B in one session, same map, same vantage:
//   arm 1  r_particledesc as the saved config leaves it   -> expect nothing
//   arm 2  r_particledesc ""                              -> expect fire

developer 1
log_developer 1
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000
cl_maxfps 0
cl_idlefps 0
cl_yieldcpu 0
sv_cheats 1

echo ^5=== ARM 1: r_particledesc left as the saved config set it
r_particledesc
waitms 500
map surf_anubis
waitmap 600
waitms 8000
r_partinfo
waitms 2000
screenshot t2desc_before_x
waitms 900
screenshot t2desc_before
waitms 900

echo ^5=== ARM 2: r_particledesc "" then RELOAD the map
r_particledesc ""
waitms 500
map surf_anubis
waitmap 600
waitms 8000
r_partinfo
waitms 2000
screenshot t2desc_after_x
waitms 900
screenshot t2desc_after
waitms 900

// And the rain, on the same clean setting.
echo ^5=== ARM 3: surf_tensor2 with r_particledesc ""
map surf_tensor2
waitmap 600
waitms 8000
noclip
waitms 1000
setpos -11776 -13632 13720 -35 90 0
waitms 4000
r_partinfo
waitms 2000
screenshot t2desc_rain_x
waitms 900
screenshot t2desc_rain
waitms 900

echo ^5=== END ===
waitms 500
quit
