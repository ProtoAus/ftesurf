// G6 -- why are so many maps black at spawn, and does the void really bring them back?
//
// The G4 sweep rendered 100+ maps and a large minority came out essentially black with a
// red "N materials missing -- this map wants an asset pack" banner.  That banner is NOT the
// explanation: df_elco-gbparadise is missing exactly one material and it is
// textures/common/weapclip, an invisible tool texture.  So the blackness has another cause,
// and there are only three candidates worth separating:
//
//   LIGHTING   -- geometry and materials are fine, the lightmaps are black.
//                 r_fullbright 1 brings the map back.
//   MATERIALS  -- surfaces resolve to a null/black shader.
//                 r_fullbright changes nothing; r_showtris still shows the geometry.
//   CULLED     -- the surfaces are not submitted at all.
//                 World Batches collapses, and hl2_novis 1 / the void restores it.
//
// Each map gets all four probes from ONE camera so the arms are comparable.  The user's
// actual report -- "only visible when in the void" -- is the last probe, and it is done
// WITH noclip because r_voidvis only fires when the view is in the void AND the player is
// noclipping (r_surf.c:2509); without noclip the engine substitutes the last good cluster
// instead, which is a different code path entirely.

cfg_save_auto 0
developer 1
log_developer 0
scr_sshot_type png
cl_yieldcpu 0
cl_maxfps 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0
r_speeds 2
vbsp_portal_render 1
r_portalscissor 1

waitms 2500

// ---------------------------------------------------------------- surf_conc (v25, black)
map surf_conc
waitmap 240
waitms 6000
sv_cheats 1
echo "@@@ conc 1 stock"
r_speeds_dump
waitms 400
screenshot_mega g6_conc_1stock 1280 720
waitms 500
echo "@@@ conc 2 fullbright -- is it LIGHTING?"
r_fullbright 1
waitms 1500
r_speeds_dump
waitms 400
screenshot_mega g6_conc_2fullbright 1280 720
waitms 500
r_fullbright 0
waitms 400
echo "@@@ conc 3 novis -- is it CULLED?"
hl2_novis 1
waitms 1500
r_speeds_dump
waitms 400
screenshot_mega g6_conc_3novis 1280 720
waitms 500
hl2_novis 0
waitms 400
echo "@@@ conc 4 the void, noclipping"
noclip
waitms 600
setpos 0 0 20000 0 90 0
waitms 2500
r_speeds_dump
waitms 400
screenshot_mega g6_conc_4void 1280 720
waitms 600

// ------------------------------------------------------------ surf_okeycave (v25, black)
map surf_okeycave
waitmap 240
waitms 6000
sv_cheats 1
echo "@@@ okeycave 1 stock"
r_speeds_dump
waitms 400
screenshot_mega g6_okeycave_1stock 1280 720
waitms 500
echo "@@@ okeycave 2 fullbright"
r_fullbright 1
waitms 1500
r_speeds_dump
waitms 400
screenshot_mega g6_okeycave_2fullbright 1280 720
waitms 500
r_fullbright 0
waitms 400
echo "@@@ okeycave 3 novis"
hl2_novis 1
waitms 1500
screenshot_mega g6_okeycave_3novis 1280 720
waitms 500
hl2_novis 0
waitms 400
echo "@@@ okeycave 4 the void, noclipping"
noclip
waitms 600
setpos 0 0 20000 0 90 0
waitms 2500
r_speeds_dump
waitms 400
screenshot_mega g6_okeycave_4void 1280 720
waitms 600

// ----------------------------------------------------- df_elco-gbparadise (v25, 1 mat)
// The cleanest case: one missing material and it is an invisible tool texture, so if this
// one is black the missing content cannot be the reason.
map df_elco-gbparadise
waitmap 240
waitms 6000
sv_cheats 1
echo "@@@ elco 1 stock"
r_speeds_dump
waitms 400
screenshot_mega g6_elco_1stock 1280 720
waitms 500
echo "@@@ elco 2 fullbright"
r_fullbright 1
waitms 1500
r_speeds_dump
waitms 400
screenshot_mega g6_elco_2fullbright 1280 720
waitms 500
r_fullbright 0
waitms 400
echo "@@@ elco 3 the void, noclipping"
noclip
waitms 600
setpos 0 0 20000 0 90 0
waitms 2500
r_speeds_dump
waitms 400
screenshot_mega g6_elco_4void 1280 720
waitms 600

echo "@@@ G6 DONE"
waitms 800
quit
