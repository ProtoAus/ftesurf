// ANIM06 -- aim at an actual unlit flipbook, and prove #UNLIT at the allocation.
//
// WHY ANIM05'S SCREENSHOT WAS WORTHLESS.  Its surf_the_internet shot differed by
// 0.01% between hl2_animated 0 and 1 -- no flipbook was in the frame at all, and
// shader_here landed on a matrixportal.  That is trap 7 exactly: a picture of the
// wrong thing looks like a picture of nothing happening.  aimanim.py finds the
// faces instead of hoping: 144 world faces on this map wear one of its 34 unlit
// flipbooks, and GRAN/YOUTUBE/RICKROLL is 3104 units across.  Camera 160 units
// off it along its own plane normal, so it fills the frame.
//
// THE TWO-SIDED TEST FOR #UNLIT, inside ONE build.
// The claim being checked is not "the screen is bright" -- that is an opinion --
// but "no lightmap page is allocated for it".  `!!samps lightmap` sets
// prog->defaulttextures |= S_LIGHTMAP0, Shader_Finish sets SHADER_HASLIGHTMAP,
// and Mod_LightmapAllocSurf gates on exactly that flag.  Gating the DECLARATION
// on !UNLIT is what stops the allocation; skipping the sample in the fragment
// would not have.
//
// So light_here is pointed at both permutations of the same shader:
//   - surf_the_internet's screen  -> vmt/animated#...#UNLIT  -> expect
//     haslightmap=0 and lmpage -1,-1,-1,-1.
//   - surf_demise's smoke         -> vmt/animated (no #UNLIT) -> expect
//     haslightmap=1 and a real page with a decoded mean.
// One build, two permutations, opposite answers.  That is a control, not an
// assertion about a build nobody can run any more.
//
// PREDICTIONS:
//   - shader_here on the screen prints vmt/animated#...#UNLIT.
//   - light_here on the screen prints haslightmap=0, lmpage -1.
//   - light_here on the smoke prints haslightmap=1 and a page.
//   - the ON pair 2 s apart differs substantially (the video plays); the OFF shot
//     is a different, still frame.

log_enable 1
log_dir "logs"
log_name "anim06"
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 0
vid_fullscreen 0
developer 1
log_developer 1
con_notifytime 0
con_notifylines 0
con_notifytime_error 0

wait 200

hl2_animated 1
map surf_the_internet
waitmap 1800
waitms 12000
sv_cheats 1
waitms 400
noclip
waitms 400
setpos 10608.0 -13344.0 6000.0 0.00 -90.00 0
waitms 2500

echo ^5=========== the screen: routing and lightmap allocation ======
shader_here screen_on
waitms 800
light_here screen_on
waitms 800
developer 0
waitms 1500

screenshot anim06_screen_on_t0
waitms 2000
screenshot anim06_screen_on_t1
waitms 900

echo ^5=========== same screen, hl2_animated 0 =====================
developer 1
hl2_animated 0
waitms 3000
setpos 10608.0 -13344.0 6000.0 0.00 -90.00 0
waitms 1500
shader_here screen_off
waitms 800
developer 0
waitms 1200
screenshot anim06_screen_off
waitms 900

echo ^5=========== the LIT permutation of the same shader ===========
developer 1
hl2_animated 1
map surf_demise
waitmap 1800
waitms 12000
sv_cheats 1
waitms 400
setpos -2944 7552 4865 90 0 0
waitms 2500
shader_here smoke_on
waitms 800
light_here smoke_on
waitms 800

echo ^5=== anim06 done ===
wait 30
quit
