// FTESurf b58cc -- is the COLOUR GRADE what is squaring the fonts and sprites?
//
// Lex, 2026-09-12: "When I load tensor2 specifically, the font on the console,
// and fps display, I can see a faint background to every letter as if it's a
// grey square behind every one. it's showing me the full 'sprite' square when I
// should see the letter, sort of like the light sprites, they have a overly
// bright fadeout, which I can see the whole textures when parts of it should be
// 'masked' or transparent." And: the menu, off tensor2, is clean.
//
// THAT IS ONE CAUSE, NOT TWO. The glow sprites are BGR888 -- no alpha channel
// at all (measured: light_glow02/03 are 3 bytes per pixel, neither ONEBITALPHA
// nor EIGHTBITALPHA set). Their only "mask" is that black contributes nothing
// through an additive blend. A font glyph's surround is transparent the same
// way. So anything that lifts black off zero, or disturbs the blend, reveals the
// entire texture square in both cases at once -- which is exactly what he
// describes, on the one map that has something no other map has.
//
// surf_tensor2 is the only map in this project's library that ships TWO
// color_correction LUTs, and this session shipped the stage that applies them
// (patches 288/290). The tensor2 grade is already known to be extreme: its first
// eight steps are byte-identical on all three axes, i.e. every input from 0 to
// about 66 maps to ONE output value. If that value is not black, then black is
// not black any more.
//
// r_colourcorrection is re-read EVERY FRAME (gl_rmain.c:2747,
// `if (*r_colourcorrection.string) ccpostproc = R_RegisterCustom(...)`), so this
// needs no reload and no rebuild -- the cleanest possible A/B.
//
// PLAIN screenshot throughout, never screenshot_mega: mega forces an FBO and
// clears RDF_ALLPOSTPROC, so it cannot see a post-process stage at all and would
// photograph both arms identical. That trap already cost this project one wrong
// conclusion about this very feature.
//
// PASS (grade is the cause):  the boxes behind the glyphs are present in the ON
//      arms and gone in the OFF arm, and the third arm brings them back.
// FAIL (grade is innocent):   all three arms identical around the text -- then
//      the cause is elsewhere and this rules out the one map-specific suspect.
cfg_save_auto 0
exec cfg/testrun/_quiet.cfg
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "b58cc"
scr_sshot_type png
cl_yieldcpu 0
vid_vsync 0
crosshair 0
fov 100

// Text ON SCREEN is the instrument, so the notify overlay is wanted here --
// unlike every other cfg in this directory, where it is contamination.
con_notifylines 8
con_notifytime 45

waitms 2500
map surf_tensor2
waitmap 240
waitms 8000
sv_cheats 1
noclip
waitms 500

// A dark, quiet wall to read the glyph boxes against, and the FPS counter he
// named. Facing a plain surface so the text is not over a bright area.
setpos -10688.5 -1773.8 -8587.1 6.3 91.1 0
show_fps 1
waitms 2000

echo "@@@ B58CC the quick brown fox jumps over the lazy dog 0123456789"
echo "@@@ B58CC MMMMMMMM iiiiiiii ........ ________ ######## @@@@@@@@"
echo "@@@ B58CC if a grey box sits behind each glyph, the grade is lifting black"
waitms 1500

echo "@@@ B58CC A. grade ON -- the state he is reporting"
screenshot b58cc_on_x
waitms 900
screenshot b58cc_on
waitms 900
screenshot b58cc_on_ctl
waitms 900

// The empty string is the off switch: the stage is skipped entirely rather than
// registered with a null shader, which is the guard patch 290 added.
echo "@@@ B58CC B. grade OFF"
r_colourcorrection ""
waitms 1500
screenshot b58cc_off_x
waitms 900
screenshot b58cc_off
waitms 900

echo "@@@ B58CC C. grade back ON -- must match A"
r_colourcorrection "ftesurf/cc/surf_tensor2_ef3661e2"
waitms 1500
screenshot b58cc_on2_x
waitms 900
screenshot b58cc_on2
waitms 900

// And the sprites at the same two settings, since he reports the same fault in
// both: if one cause explains both, the flare squares move with the glyph boxes.
echo "@@@ B58CC D. grade OFF, flares at their default"
r_colourcorrection ""
vbsp_lightglow_scale 1
waitms 1500
screenshot b58cc_spr_off_x
waitms 900
screenshot b58cc_spr_off
waitms 900

r_colourcorrection "ftesurf/cc/surf_tensor2_ef3661e2"
waitms 1000

echo "@@@ B58CC DONE"
waitms 1200
quit
