// FTESurf build 59 -- does the glare view cull buy framerate, and does it cost
// correctness?
//
// TWO QUESTIONS, ONE SCREENSHOT PER ARM:
//   perf    -- read show_fps off the frame.
//   correct -- cull ON and cull OFF must look THE SAME once both have converged.
//              If the cone is too tight, some glare on screen keeps a stale
//              answer and the two frames differ. That is the failure this test
//              exists to catch, and it is more important than the fps number.
//
// EXACTLY ONE SCREENSHOT PER ARM, AND THAT IS THE WHOLE REASON THIS FILE IS
// SHAPED LIKE THIS.  The previous two attempts at timing the glare system took
// 24 screenshots at 100-200ms and the FIRST frame of each arm read 59.9 FPS
// while the LAST read 1.4 -- a 1920x1111 PNG costs ~700ms to write, so bursting
// them collapsed the game 40x and every number in both runs was void.  A
// screenshot is not a free observation; here it is taken once, at the end of a
// dwell, and show_fps has had 8 seconds of undisturbed frames to average over.
//
// cl_maxfps 0 deliberately: this is a throughput measurement, and a cap would
// measure the cap.  (timerefresh is not an option -- it never runs
// CSQC_UpdateView, so it cannot see anything cl_sprites.qc draws.)
//
// ===================================================================
// PREDICTION, REGISTERED BEFORE THE RUN
// ===================================================================
// Lex measured 27.1us/ray, and at traces 40 that is 8 glares/frame = 40 rays.
// surf_tensor2 has 429 glares and roughly 50 on screen at this vantage, so the
// cull should not change the COST PER FRAME at all -- the budget is still 40
// rays either way and it will still find 8 glares to spend them on.
//
// WHAT IT BUYS IS LATENCY, NOT FPS:
//     cull off: sweep = 429 / 8 = ~54 frames
//     cull on:  sweep =  ~50 / 8 =  ~7 frames
// so the census line is the measurement and fps is the CONTROL -- it should be
// roughly UNCHANGED. If fps rises a lot, the cull is skipping glares the budget
// would have spent rays on, which means the budget was not saturated and the
// map has fewer visible glares than I think. If fps FALLS, the per-visit dot
// product is costing more than the rays it saves, which would be a bad trade at
// 429 visits a frame.
//
//   PASS: census shows a large `culled` with a non-zero `traced`, sweep frames
//         drop several-fold, arm A and arm C agree, and A vs B look the same.
//   FAIL: A and B differ visibly -> the cone is too tight and is starving a
//         glare that is on screen.
cfg_save_auto 0
exec cfg/testrun/_quiet.cfg
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "b59cull"
scr_sshot_type png
cl_yieldcpu 0
vid_vsync 0
crosshair 0
fov 100
con_notifylines 0
con_notifytime 0.01
cl_maxfps 0

r_fog_progless 1
hl2_additivefog 1

waitms 2500
map surf_tensor2
waitmap 240
waitms 8000
sv_cheats 1
noclip
waitms 500

vbsp_sprites 1
vbsp_lightglow 1
vbsp_lightglow_scale 1
vbsp_sprite_source 1
vbsp_glare 1
vbsp_glare_rays 5
vbsp_glare_traces 40
r_renderscale 1
show_fps 1

setpos -10688.5 -1773.8 -8587.1 6.3 91.1 0
waitms 25000

echo "@@@ B59CULL state"
vbsp_glare_cull
vbsp_glare_traces
vbsp_sprite_dist
waitms 1500

echo "@@@ B59CULL A. cull 1.25 (the new default)"
vbsp_glare_cull 1.25
waitms 8000
vbsp_sprite_debug 1
waitms 1500
screenshot b59c_A
waitms 2500

echo "@@@ B59CULL B. cull 0 -- build 58, walks all 429"
vbsp_glare_cull 0
waitms 8000
vbsp_sprite_debug 1
waitms 1500
screenshot b59c_B
waitms 2500

echo "@@@ B59CULL C. back to 1.25 -- must match A"
vbsp_glare_cull 1.25
waitms 8000
vbsp_sprite_debug 1
waitms 1500
screenshot b59c_C
waitms 2500

echo "@@@ B59CULL DONE"
waitms 1200
quit
