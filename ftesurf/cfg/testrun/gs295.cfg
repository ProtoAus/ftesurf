// FTESurf Patch 295 + the submit warning banner.
//
// TWO CLAIMS, ONE RUN.
//
// 1. in_journal_maxkb defaults to 262144 (was 8192), so a real run never
//    truncates and the submission rule never has to carry a third state.
//    Checked by printing it.
//
// 2. HUD_DrawSubmitWarn puts "RUNS WILL NOT SUBMIT" at the top of the screen
//    when the run could not be submitted.  Checked as an A/B with a control,
//    because "a banner appeared" on its own does not distinguish "the gate
//    works" from "it always draws".
//
// PASS:
//    in_journal_maxkb reads 262144
//    warn_off.png  (rec_hid 1) -- NO banner
//    warn_on.png   (rec_hid 0) -- banner, orange, top centre
//    warn_back.png (rec_hid 1) -- NO banner again, so it tracks the cvar
//                                 rather than latching once
// FAIL:
//    a banner in warn_off/warn_back -> the gate is inverted or always true
//    no banner in warn_on          -> it is not being called, or Font_Set is
//                                     leaving it invisible
//
// rec_terms is NOT touched by this test.  It is the consent record and it is
// archived; setting it to 0 to exercise the other arm would leave the player
// facing the consent screen on next launch if this run died early.  That arm
// differs only in which two strings are picked, which is readable in the source.
exec cfg/testrun/_quiet.cfg
log_dir logs
log_name gs295
log_enable 1
cl_maxfps 100
wait 100

echo "GS295: ---- claim 1: in_journal_maxkb should be 262144 ----"
in_journal_maxkb
wait 20

map surf_beginner
wait 1200

echo "GS295: ---- control: rec_hid 1, expect NO banner ----"
rec_hid 1
wait 60
screenshot warn_off
wait 60

echo "GS295: ---- rec_hid 0, expect the banner ----"
rec_hid 0
wait 60
screenshot warn_on
wait 60

echo "GS295: ---- back to rec_hid 1, expect NO banner ----"
rec_hid 1
wait 60
screenshot warn_back
wait 60

echo "GS295: ---- end ----"
wait 100
quit
