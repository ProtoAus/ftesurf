// Build 33 -- does the cfg_save_auto warning actually fire?
// It is a branch nothing else reaches, and an unfired warning is worse than no
// warning: it reads as reassurance.  Lex's own config sets cfg_save_auto 0, so
// this is his real state, not a contrived one.
log_enable 1
log_name b33d
developer 0
cfg_save_auto 0
waitms 2000
map surf_null
waitmap 240
wait 60
echo ^5--- cfg_save_auto 0: the warning MUST appear ---
gfx_menu status
waitms 300
echo ^5--- cfg_save_auto 1: it MUST NOT ---
cfg_save_auto 1
waitms 300
gfx_menu status
waitms 300
cfg_save_auto 0
echo ^5=== b33d done ===
wait 30
quit
