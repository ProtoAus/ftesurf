// cfg_save_auto 0: this run sets archived cvars (vid_*, cl_maxfps); never let it write them into ftesurf.cfg (cl_main.c:2535)
cfg_save_auto 0
// REGRESSION CONTROL for the build carrying Patch 268 C, 291 and 292.
//
// surf_boreas FIRST in a fresh process, exactly as p268b_live ran it, with every Patch 268 B
// cvar at p268b_live's values and every newer switch at its default (hl2_cubelight 0,
// hl2_bumpgreenfix 0, hl2_lt_dirsign 0, r_cubelight 1).  The shots are p268b_live's: compare
// p292a_bor_ramp7_on1 against p268b_live_bor_ramp7_on1 and the same for ramp7b.
//
// The p268c_live run could not answer this: it loaded boreas THIRD, after two other maps,
// and read 85% of the centre changed against p268b -- which is what the per-run texture-load
// race and a different map history can do on their own.  Known difference that remains even
// here: data/mapdeps.txt now automounts CS:GO for boreas, for one prop's $envmap
// (project_tendies/models/plaster01.vmt -> cubemaps/urban_cube01), which is not in this view.
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000
wait 200

developer 1
log_developer 1
log_enable 1
log_dir logs
log_name p292a_boreas
cl_maxfps 0
cl_idlefps 0
sv_cheats 1
con_notifylines 0
con_notifytime 0
con_notifytime_error 0
r_drawentities 1
r_lightstylescale 1

hl2_envcubemap 1
hl2_envmap_source 7
r_reflectcube_nosky 0
hl2_cubelight 0
hl2_bumpgreenfix 0
hl2_lt_dirsign 0
r_cubelight 1
echo ^5=== p292a: boreas first, p268b_live's cvars, new switches at default

map surf_boreas
waitmap 600
waitms 9000
noclip
waitms 1000

setpos 12243.8 3632 11789 38.16 0 0
waitms 2500
cmd viewpos
r_envcubemap 1
waitms 900
shader_here bor_ramp7_on1
screenshot p292a_bor_ramp7_on1
r_envcubemap 0
waitms 900
shader_here bor_ramp7_off
screenshot p292a_bor_ramp7_off
r_envcubemap 1
waitms 900
shader_here bor_ramp7_on2
screenshot p292a_bor_ramp7_on2

setpos 12349.3 3882 11738.2 27.2 -59 0
waitms 2500
cmd viewpos
r_envcubemap 1
waitms 900
screenshot p292a_bor_ramp7b_on1
r_envcubemap 0
waitms 900
screenshot p292a_bor_ramp7b_off
r_envcubemap 1
waitms 900
screenshot p292a_bor_ramp7b_on2

echo ^5=== END OF RUN ===
waitms 500
quit
