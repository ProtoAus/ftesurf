// Build 73: does the `mapcrc` line actually reach a recording's header?
//
// This is the half of build 73 that pays for Phase 3, and it is separate from
// the TF_NOMAP half in a way that matters.  TF_NOMAP is a CLIENT-ASSERTED
// comparison -- the client says which map it has, and a modified client can say
// anything.  The header line is the SERVER's own hash of the bytes it loaded,
// which no client can influence at all.  A re-simulation verifier that wants to
// know which geometry to replay against has to read this line, and a map NAME
// cannot answer it: six maps in this library ship one name at two builds.
//
// TWO TRAPS THIS FILE WALKED INTO BEFORE IT WORKED, both already written down
// in this tree, both of which produced a MISSING FILE -- i.e. the same symptom
// the feature failing would produce, which is why they are recorded here:
//
//   1. `cmd zone_goto 0` ARMS a run; it does not START one.  The first attempt
//      read `armed on bhop_eazy, tick 0.01, start on jump` and sat there.  The
//      start condition is in the timer's own line and it is a JUMP.
//   2. `rec_enable`/`rec_stream` are registered in worldspawn, which does not
//      run until the map loads, so a BARE `rec_enable 1` before `map` is
//      `Unknown command` and the default silently stands.  It must be `set`.
//      b66rec.cfg lost a whole arm to exactly this and says so.
//
// AND THE REASON THIS DRIVES A FULL FINISH rather than reading the part file
// mid-run: `SV_RecClose` has exactly ONE call site in the whole tree, at the
// finish.  There is no abandon path that writes a file.  A run cannot be
// finished from a config except by a noclip flight -- zone_goto and setpos both
// void via SV_TimerWarped, while noclip only changes movetype -- so this lands
// as TF_CHEAT and the file is `cheat.rec`.  That is FINE here and it is worth
// being explicit about why: the tag describes how the end zone was reached, and
// the header line under test is written by SV_RecOpen at the START, from the
// server's own map hash, with no dependence on how the run ends or what it is
// tagged.  The flight is borrowed verbatim from b66rec.cfg, where it is
// computed from zone_list rather than guessed: start box -352 -352 144, yaw
// 335.3 = atan2(-1376, 2992), ~3293 units on the zones' single z plane.
//
// PREDICTION, registered before the run:
//   data/runs/bhop_eazy/main/cheat.rec exists, and its header carries
//     mapcrc 676de275
//   -- the same eight characters the live Pi reported as `ours` and the same
//   ones this client independently computed as `theirs` in b73live.cfg.  So the
//   VALUE is already known from two other measurements and this arm is checking
//   the PLUMBING, not the arithmetic.
//
// FALSIFIED IF: the file has no `mapcrc` line at all (SV_RecOpen's write is not
//          reached -- most likely the `mcrc != ""` guard, which exists so a
//          server with no map loaded writes nothing rather than an empty
//          value); or it carries a different hash (the QC is reading a
//          different key than `cmd timer` reads); or it writes `mapcrc` with an
//          empty argument, which is a grammar violation reccheck.py must
//          reject and is the exact failure the guard exists to prevent.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name b73hdr
developer 0

sv_cheats 0
set rec_enable 1
set rec_stream 1
set rec_runarchive 1

waitms 6000
map bhop_eazy
waitmap 45
waitms 3000

echo ================================ B73HDR -- zones, so the flight is computed not guessed
zone_list
waitms 500

echo ================================ B73HDR -- arm, aim, and go continuous
cmd zone_goto 0
waitms 1000
setpos -352 -352 144 0 335.3 0
waitms 1000
noclip
waitms 500

+forward
waitms 1500
echo ================================ B73HDR -- running; a part file should exist NOW
cmd timer
waitms 2000
cmd timer
waitms 2000
cmd timer
waitms 3000
-forward
waitms 1500

echo ================================ B73HDR -- after the end zone
cmd timer
waitms 2500

echo ================================ B73HDR done
waitms 500
quit
