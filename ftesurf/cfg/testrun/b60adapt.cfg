// FTESurf build 60 -- THE ADAPTIVE RAYS.  Does spending 1 ray on a glare that
// was already hidden buy back the framerate the responsiveness fix cost?
//
// WHERE THIS CAME FROM.  Lex measured build 59's ray budget directly:
//     vbsp_glare_traces 8    555-600 fps
//     vbsp_glare_traces 40   360-420 fps   <- the current default, needed for
//     vbsp_glare_traces 120  200-220 fps      responsiveness
// Three points on a straight line at 27.1us per ray.  The first thing tried --
// culling glares outside the view -- removed only 7% of them and bought nothing
// measurable, because the census says 302 of surf_tensor2's 429 glares really
// ARE in the frustum and 296 of those are HIDDEN, which only a trace can know.
// So the waste is not which glares are traced, it is that each of the 296 fires
// five rays to learn what its first ray already said.
//
// ===================================================================
// PREDICTION, REGISTERED BEFORE THE RUN -- AND FPS IS NOT THE HEADLINE
// ===================================================================
// The budget counts RAYS, so at vbsp_glare_traces 40 both arms fire 40 rays a
// frame and the frame cost is the SAME.  What changes is how far those 40 rays
// go: at 1.44 rays per hidden glare instead of 5 they cover ~28 glares instead
// of 8.  Therefore:
//
//   A vs B at traces 40:  fps ROUGHLY UNCHANGED (this is the control -- if fps
//                         jumps here, the budget was not saturated and the ray
//                         accounting in the new code is wrong)
//                         rays/glare  5.00 -> ~1.4
//                         frames per sweep  ~50 -> ~14
//
//   D, adaptive 8 + traces 12:  the deliverable.  Build 59's responsiveness at
//                         build 58's price -- ~50 frames per sweep AND
//                         ~550-600 fps.  If D is both as responsive as A and as
//                         fast as the old traces 8, the change has paid.
//
// CORRECTNESS IS THE MORE IMPORTANT HALF, and there are two independent checks:
//   1. `hidden` must not move.  A vs B must both read `296 hidden by the trace`.
//      The cheap path claims a hidden glare stays hidden; if that claim is wrong
//      this number is where it shows, and it costs nothing to read.
//   2. The pixel diff A vs B must be ~0.  The corners sit only ~2.8 units from
//      the centre ray, so a wrong cheap answer needs an occluder silhouette
//      within 2.8 units -- rare, and worth 1/5 or 2/5 of one glare when it
//      happens.  Measured, not assumed.
//   3. `forced full` must be NON-ZERO over the run.  That is the anti-stickiness
//      proof: if it is always 0, a glare that opened up behind a thin edge could
//      keep confirming a stale 0 forever.  It is 1 in every 9 visits to a given
//      glare, so it will be small, not zero.
//
//   FAIL: `hidden` differs between A and B, or the A/B pixel diff is above the
//         same-setting floor (A vs C), or `forced full` is 0 in every frame.
//
// ONE SCREENSHOT PER ARM.  A 1920x1111 PNG costs ~700ms to write and bursting
// them collapsed an earlier run from 60fps to 1.4, so every number in it was
// void.  Each arm gets 8 undisturbed seconds for show_fps to average, then one
// capture.  The 25s settle before arm A is not padding either: three
// same-setting frames earlier drifted 3.19 -> 2.91 -> 2.58 while everything
// after 25s agreed to 0.01%.
//
// A and C are the SAME setting.  Their spread is the noise floor for every fps
// comparison in this run; build 59's cull run read 438.8 and 487.6 on two
// identical arms, which is why no single pair of numbers here means anything
// without them.
cfg_save_auto 0
exec cfg/testrun/_quiet.cfg
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "b60adapt"
scr_sshot_type png
cl_yieldcpu 0
vid_vsync 0
crosshair 0
fov 100
con_notifylines 0
con_notifytime 0.01
cl_maxfps 0

r_fog_progless 1
hl2_additivefog 1

waitms 2500
map surf_tensor2
waitmap 240
waitms 8000
sv_cheats 1
noclip
waitms 500

vbsp_sprites 1
vbsp_lightglow 1
vbsp_lightglow_scale 1
vbsp_sprite_source 1
vbsp_glare 1
vbsp_glare_rays 5
vbsp_glare_traces 40
vbsp_glare_cull 1.25
vbsp_glare_brush 2
r_renderscale 1
show_fps 1

setpos -10688.5 -1773.8 -8587.1 6.3 91.1 0
waitms 25000

echo "@@@ B60 state"
vbsp_glare_adaptive
vbsp_glare_traces
vbsp_glare_rays
waitms 1500

echo "@@@ B60 A. adaptive 8, traces 40 -- the new default"
vbsp_glare_adaptive 8
waitms 8000
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 700
screenshot b60_A
waitms 2500

echo "@@@ B60 B. adaptive 0, traces 40 -- build 59 exactly"
vbsp_glare_adaptive 0
waitms 8000
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 700
screenshot b60_B
waitms 2500

echo "@@@ B60 C. adaptive 8, traces 40 -- must match A"
vbsp_glare_adaptive 8
waitms 8000
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 700
screenshot b60_C
waitms 2500

echo "@@@ B60 D. adaptive 8, traces 12 -- build 59 latency at build 58 price"
vbsp_glare_traces 12
waitms 8000
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 700
screenshot b60_D
waitms 2500

echo "@@@ B60 E. adaptive 0, traces 12 -- what 12 rays used to buy"
vbsp_glare_adaptive 0
waitms 8000
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 700
screenshot b60_E
waitms 2500

echo "@@@ B60 DONE"
waitms 1200
quit
