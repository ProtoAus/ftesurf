cfg_save_auto 0
// Patch 298b -- WHAT ARE THE BLACK OBJECTS IN THE SKYROOM?
//
// WHAT p298 ESTABLISHED, at Lex's own save011 vantage (so the fault is in frame
// by construction, unlike the two void runs before it):
//   - the buildings ARE skyroom geometry: r_fastsky 1 (gl_warp.c:371 aborts
//     R_DrawSkyroom) removed them.
//   - skyroom fog WORKS and SATURATES: painting it magenta turned most of the
//     town magenta, and `end 1u` (A2) was indistinguishable from the map's real
//     `end 23.4375 / start 11.7188` (A3).  So the numbers are already delivering
//     full fog.  The Patch 254 linear mapping is not at fault.
//   - they ignore main-view fog: A7 flooded the main fog green and the town did
//     not take any of it.  Correct -- they are on the skyroom path.
//   - BUT a SPECIFIC SUBSET stayed PURE BLACK through both magenta arms: the
//     church-and-town cluster centre-right, and the block at the far left.
//     Those are exactly the objects Lex calls "bright black".
//
// So the question is no longer "does skyroom fog work".  It is: WHAT IS THAT
// SUBSET, and why does it receive neither fog nor light?
//
// THE HYPOTHESIS.  The magenta objects are world brush faces drawn by the
// skyroom's world pass; the black ones are ENTITIES -- prop_static models, or
// brush-model submodels -- which are drawn in the same pass but shaded through a
// different path that picks up neither r_refdef.globalfog nor any usable light.
// That would also join up with the still-open fault 4 (the func_brush *101 on
// this same map rendering darker than CS:S): one root cause, brush/prop ENTITY
// shading diverging from world shading.
//
// TWO ORTHOGONAL DISCRIMINATORS, each a single cvar off a known state:
//   r_drawentities 0  -- removes models and brush-entity submodels, not world.
//                        If the black objects VANISH they are entities.
//                        If they REMAIN they are world faces and the split is
//                        per-material instead, which points at $nofog / NOFOG.
//   r_fullbright 1    -- if the black objects LIGHT UP they are black for want
//                        of light (which is the known prop-lighting fault: the
//                        hl2 plugin lights .vhv-less static props from the leaf
//                        ambient cube alone and never reads LUMP_WORLDLIGHTS).
//                        If they STAY BLACK it is their texture or material, and
//                        the VTF 7.6 zstd trap is the first place to look.
//
// PRE-REGISTERED, judged against B3/B5, the two repeat controls:
//   B4 removes the black cluster  -> entities.  B6/B7 then confirm it exactly:
//      the ONLY difference between them must be the black set.
//   B4 leaves it  -> world faces; go read the materials, not the draw path.
//   B2 brightens it -> lighting.   B2 leaves it black -> material/texture.
// If B3 or B5 fails to reproduce B1, the run is void and nothing above holds.
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000
wait 200

developer 1
log_developer 1
log_enable 1
log_dir logs
log_name p298b_whatisblack
cl_maxfps 0
cl_idlefps 0
sv_cheats 1
con_notifylines 0
con_notifytime 0.01
r_drawviewmodel 0

map surf_tensor2
waitmap 600
waitms 9000
waitms 3000
noclip
waitms 1000

// Lex's save011, verbatim from state.txt.  Re-issued before every screenshot.
alias vwin "setpos -7563.2915 10425.6309 -974.1351 1.9775 -0.39 0; waitms 2000"

// ---- B1: baseline ----
echo ^5=== B1: shipped defaults
vwin
screenshot p298b_b1_default

// ---- B2: is the black a LIGHTING failure? ----
r_fullbright 1
echo ^5=== B2: r_fullbright 1 -- do the black objects light up?
vwin
screenshot p298b_b2_fullbright

// ---- B3: repeat control for B1 ----
r_fullbright 0
echo ^5=== B3: r_fullbright 0 -- repeat control, must reproduce B1
vwin
screenshot p298b_b3_repeat

// ---- B4: are the black objects ENTITIES? ----
r_drawentities 0
echo ^5=== B4: r_drawentities 0 -- do the black objects vanish?
vwin
screenshot p298b_b4_noents

// ---- B5: repeat control 2 ----
r_drawentities 1
echo ^5=== B5: r_drawentities 1 -- repeat control 2, must reproduce B1
vwin
screenshot p298b_b5_repeat2

// ---- B6/B7: the same question again, against MAGENTA fog ----
// Magenta makes the fogged set unmistakable, so B7 minus B6 is exactly the
// entity set and can be compared pixel-for-pixel with the black set in p298 A2.
skyroomfog 1 1 0 1 1 0
r_drawentities 0
echo ^5=== B6: magenta fog, NO entities
vwin
screenshot p298b_b6_magenta_noents

r_drawentities 1
echo ^5=== B7: magenta fog, entities back -- B7 minus B6 IS the entity set
vwin
screenshot p298b_b7_magenta_ents

echo ^5=== END OF RUN ===
waitms 500
quit
