// BUILD 24 arm A -- the replay reader, against a real recording.
//
// WHAT THIS PROVES AND WHY IT CAN BE PROVEN HEADLESSLY.  Every input to the
// reader is a file on disk, so unlike the run that produced them this needs no
// mouse at all.  The one thing a config cannot do is LOOK at the result, and
// `replay status` exists for exactly that: every number it prints is the one the
// frame actually used rather than a recomputation, so the camera can be checked
// against the file it came out of.
//
// The decisive line is the seek to `end`: the origin printed there must equal
// the last sample of 0005471_pb.rec to two decimals.  If the index, the cursor,
// the record-skipping or the interpolation is wrong in any way, that one number
// is wrong, because it is the far end of every one of them.
//
// `wait 200` BEFORE `map` is not optional -- exec INSERTS its text at the front
// of the command buffer, so a waitmap with no wait ahead of it blocks the very
// buffer the map load is queued in.  Three launches were lost to this in build
// 19 and it is written down in the benchmarking memory.

developer 1
log_developer 1
cfg_save_auto 0

wait 200
map surf_aesthetic
waitmap 90

echo "=== B24A: nothing loaded yet ==="
replay status

echo "=== B24A: open the run ==="
replay data/runs/surf_aesthetic/main/0005471_pb.rec
wait 10
replay pause
replay status

echo "=== B24A: the very first sample (the padding, t is NEGATIVE) ==="
replay seek -999
replay status

echo "=== B24A: t=0, where the clock starts ==="
replay seek 0
replay status

echo "=== B24A: the middle, then away, then BACK to it ==="
echo "--- these two status blocks must be identical ---"
replay seek 41
replay status
replay seek 5
replay seek 78
replay seek 41
replay status

echo "=== B24A: the end.  org must equal the .rec's last sample ==="
replay seek end
replay status

echo "=== B24A: speed is a clock, not a sample rate ==="
replay speed 0.1
replay seek end
replay status
replay speed 4
replay seek end
replay status
replay speed 1

echo "=== B24A: the freeze.  These two viewpos lines must be IDENTICAL ==="
echo "--- (and note they are the PLAYER, not the replay camera above) ---"
viewpos
cmd timer
wait 60
viewpos
cmd timer

echo "=== B24A: stop, and the player is given back ==="
replay stop
replay status
wait 20
cmd timer

echo "=== B24A: viewpos / setpos are now one verb each ==="
echo "--- bare setpos must explain itself, not print a position ---"
setpos
viewpos
echo "--- and setpos marks PRACTICE now, not void: the clock must survive ---"
cmd zone_goto 0
wait 40
cmd timer
setpos -15731 -80 1060
wait 20
viewpos
cmd timer

echo "=== B24A: a leg with no recording must say so, not fault ==="
replay bonus 7 0
replay stage 9

echo "=== B24A: and a file that is not a .rec ==="
replay data/runs/surf_aesthetic/best.pb

echo "=== B24A: regression ==="
pm_selftest
zone_selftest

echo "=== B24A: done ==="
wait 30
quit
