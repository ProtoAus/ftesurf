// BUILD 47 -- does the server now find the legacy BSP zones?
//
// THE BUG (confirmed by zhull05, and pre-existing rather than a build 47
// regression): StartFrame is called BEFORE the map's entity lump is spawned --
// sv_main.qc's own report block says so and sv_timer.qc's registercvar essay is
// built on it -- and StartFrame called SV_ZoneFrame unconditionally.  So the
// deferred load ran in front of the entities, find() matched no
// trigger_momentum_timer_*, and the empty answer was cached under zone_loaded
// and never revisited.  32 of the 1317 installed maps take that path; on all of
// them the client drew the cages off the raw lump and the server timed nothing.
//
// zhull05 proved the entities DO exist afterwards: ent_census, which runs well
// after worldspawn, listed 1 start / 10 stage / 1 stop on surf_summer_ksf.  So
// the cause was ordering, not spawning.
//
// THE FIX: zone_entsready, set by the same post-worldspawn block in StartFrame
// that already runs SV_RepairTargetCase and SV_EntityIOBuild for exactly this
// reason.  Until it is set SV_ZoneFrame declines to load rather than loading
// nothing, so the defensive `if (!zone_loaded) SV_ZoneFrame()` calls in the
// client commands cannot cache an empty map either.
//
// WHAT MUST CHANGE, and it is one line:
//     zones(sv): 0 on surf_summer_ksf (none)          <- BEFORE
//     zones(sv): 12 on surf_summer_ksf (bsp entities) <- AFTER
// and it must now print AFTER "FTESurf: worldspawn", not before it.  The print
// ORDER is the actual evidence; the count alone could be a coincidence.
//
// surf_a is the second legacy map (6 timer entities), included so this is not a
// one-map result.  surf_colin_blaster_69000 is the JSON control: it never took
// the broken path, so its count must be unchanged.

log_developer 1

waitms 2000

map surf_summer_ksf
waitmap 240
wait 60

echo ^5=== summer_ksf: server zone count and load ORDER ===
zone_list
wait 10
cmd zone_dests
wait 20

map surf_a
waitmap 240
wait 60

echo ^5=== surf_a: the second legacy map ===
zone_list
wait 10
cmd zone_dests
wait 20

map surf_colin_blaster_69000
waitmap 240
wait 60

echo ^5=== colin_blaster: the JSON control, must be unchanged ===
zone_list
wait 20

echo ^5=== END OF RUN ===
wait 10
quit
