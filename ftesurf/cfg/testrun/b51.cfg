// 6. surf_borderlands IS STILL OPEN, and I am handing it over UNSOLVED rather
//    than guessing.  Four tests, in order, each of which can come out either
//    way.  Any one of them settles something.
//
//    WHAT IS ESTABLISHED.  The map data is innocent: all 21 materials resolve,
//    all 34 VTFs decode, no lump defect.  Driving the engine's OWN lightmap
//    conversion over the BSP's own lighting lump predicts those walls should
//    render at 38-152/255, which is what Momentum renders.  FTESurf draws 53%
//    of the geometry band and 98% of the foreground floor at exactly RGB 0,0,0.
//    The light is in the file and is not reaching the screen.
//
//    TWO REAL BUGS WERE FOUND AND NEITHER EXPLAINS IT, which is why this needs
//    your eyes and not more analysis:
//
//      (a) surf_borderlands' lighting lump stores an extra 1 byte per luxel
//          per face, so 71.8% of its lit faces get a lightofs that is not
//          4-byte aligned -- and r_surf.c:1556 reads it as
//          `((unsigned int*)src)[i]`.  Confirmed, and confirmed to affect
//          exactly 9 maps of 1310.  But a misaligned face decodes to black
//          SPECKLED WITH SATURATED CYAN/MAGENTA, and the screenshot has 30
//          isolated bright pixels in the whole frame and no structure at 8x
//          gain.  The signature is visible in about EIGHT places, not on 2264
//          faces.
//      (b) the world shader never lights from a normal map.  Real, but the
//          envmap term is ADDITIVE (`diffuse_f.rgb +=`, lightmapped.glsl:291),
//          so it cannot multiply anything to zero.
//
//    The split that DOES fit is material-shaped: the six SKYPPY3 materials
//    that render black all carry $bumpmap + $normalmapalphaenvmapmask and NO
//    $envmap, and the large material that renders correctly (DEV/VALUESAND40)
//    is the one with no $bumpmap.  Alignment is uncorrelated with orientation
//    and nearly equal across both material groups, so it cannot make that
//    pattern.  Something multiplies to EXACT zero on bumpmapped faces.
//
//      map surf_borderlands_h
//
//    THE BEST TEST, and it needs no code.  _h is the same map, same geometry,
//    same materials -- and its lighting lump is 100.0% 4-byte aligned
//    (3266/3266) where the plain one is 71.8% misaligned.
//      _h RENDERS CORRECTLY -> misalignment IS the cause after all, and the
//                              pixel-signature argument against it is wrong.
//      _h IS ALSO BLACK     -> misalignment is NOT the cause; it is the
//                              bumpmapped-material path.  This is what I expect.
//
//      map bhop_24
//
//    THE CONTROL THAT SEPARATES THEM.  bhop_24 has ZERO bumped faces and is
//    75.2% misaligned -- the worst in the library.
//      bhop_24 BLACK  -> misalignment alone does it, bump is irrelevant.
//      bhop_24 FINE   -> misalignment alone is not sufficient.
//    Between this and _h the two candidates are fully separated.
//
//      map surf_borderlands ; r_lightmap 1
//
//    WHICH SIDE OF THE MULTIPLY.  Aliased as p_lm in ftesurf.cfg.
//      black wedges GREY/LIT -> the lightmap page is right and the shader is
//                               losing it.  A .glsl fault.
//      black wedges STAY BLACK -> the page itself is black.  A
//                               VBSP_LoadLighting / lightmap-allocation fault.
//      r_lightmap 0          // put it back
//
//      r_texdiag 1 ; map surf_borderlands
//      hl2_missing
//
