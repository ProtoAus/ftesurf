// cfg_save_auto 0 FIRST: this run sets archived cvars (cl_maxfps) and must never
// write them into ftesurf.cfg (cl_main.c:2535).
cfg_save_auto 0

// ===========================================================================
//  B57MENU -- the create-server screen, at whatever resolution the LAUNCH says.
//
//  RUN IT LIKE THIS, and the +set part is not optional:
//
//    ftesurf64.exe -game ftesurf +set vid_fullscreen 0 \
//        +set vid_width 1280 +set vid_height 720 \
//        +set ui_bootcheck 2 +set ui_bootterms 1 \
//        +set log_name b57menu720 +exec cfg/testrun/b57menu.cfg
//
//  TWO THINGS THAT MUST HAPPEN BEFORE THIS FILE RUNS, both learned the hard way
//  on the first attempt, which hung at the menu and wrote a 2 KB log:
//
//  1. ui_bootcheck HAS TO BE A `set`, AND IT HAS TO BE EARLY.  The menu registers
//     it (m_main.qc:3473) -- so before menu.dat has initialised the name does not
//     exist, and a bare `ui_bootcheck 2` line is parsed as a COMMAND: the log says
//     `Unknown command "ui_bootcheck"` and then `Initializing menu.dat` on the
//     very next line.  `set` creates it regardless of order, and registercvar
//     then declines to overwrite the value -- the usual trap working FOR us here.
//     It must exist before init because m_main.qc:3491 reads it there to decide
//     whether the driver runs at all; setting it afterwards is too late.
//
//  2. THE RESOLUTION COMES FROM THE COMMAND LINE, NOT FROM vid_restart.  The
//     driver is frame-driven out of m_draw, so with the cvar already set the
//     frames start ticking immediately -- straight through the ~1.4 s a
//     vid_restart takes, which would put the early screenshots at the OLD size.
//     +set vid_width/vid_height at launch means there is nothing to restart.
//
//  WHAT LEX ASKED FOR, and where each answer appears:
//    "Remove server name"          -> ui_menu_create.png: no name field
//    "Remove the source tab"       -> no source strip; gametype chips in its place
//    "only Momentum Mod and CS:S"  -> the "(N of M)" total, M = 1334
//    "put other in gametype other" -> the climb + other line is non-empty
//    "toggle gametypes, two at a
//     time, surf bhop by default"  -> the ui_maps_modes line, and the two-part
//                                     rule check (bhop off leaves surf; the last
//                                     lit chip refuses to switch off)
//    "use this space for more maps"-> the row count, visible in the shot
//    "5 public lobbies"            -> ui_menu_main.png draws five cells in a row
//
//  ui_bootcheck 2 STOPS AND QUITS ITSELF at frame 180 (m_main.qc:2364-2368).
//  Mode 3 would go on to launch a real map -- a different test, and one that
//  leaves a server running -- so this stays at 2 and cannot hang.
//
//  cl_maxfps 100: the driver counts FRAMES, and at an uncapped rate the 180 of
//  them pass before the map list has finished loading.  Every harness in this
//  folder uses the same number for the same reason.
// ===========================================================================

log_enable 1
log_dir "logs"
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0

// A menu-only run binds no server.  Set the port anyway, so a copy of this file
// with ui_bootcheck 3 -- which does launch one -- cannot land on 27500 or on a
// lobby port (27510-27550).
sv_port 27600
