// B48C -- a ghost inside stage seg 1 of a run that finishes, then reccheck on
// the produced .rec.  The stage itself is refused for being dirty (noclip),
// so what THIS proves is: the ghost record pair and header bit in the run's
// own .rec still agree (build 30 grammar, unchanged), the close word for seg 1
// carries SF_GHOST (16), and the row draws NO mark for it (ghost is not a taint
// in build 48).  The WRITTEN ghosted stage file (SV_StageLine rebasing,
// SV_StageWrite's synthetic opener, run_stageghost 0 as falsifier) needs a
// clean stage and is handed over -- see the hand protocol below.
log_enable 1
log_dir "logs"
log_name "b48c"
developer 1
log_developer 1
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0
sv_cheats 1
wait 200
map bhop_eazy
waitmap 1800
waitms 2500
hud_results 1
hud_results_toast 1
hud_splits 1
hud_splits_class 1
echo ^5=== b48c: 1. start and boundary 1 ===
noclip
cmd zone_goto 0 0 0
waitms 700
+forward
waitms 1000
-forward
waitms 400
setpos 2200 512 144 0 0 0
waitms 300
+forward
waitms 1000
-forward
waitms 500
echo ^5=== b48c: 2. ghost on, body parked in seg 1 -- expect ghost 1 ghosted 1, stage ghosted 1 ===
ghost on
waitms 1200
cmd viewpos
timer
waitms 700
echo ^5=== b48c: 3. ghost off -- expect ghost 0 ghosted 1 ===
ghost off
waitms 600
cmd viewpos
timer
waitms 700
echo ^5=== b48c: 4. boundary 2 -- expect endseg 1 with bit 16 in endst, and NO mark on row stage 2 ===
setpos 200 -1728 144 0 180 0
waitms 300
+forward
waitms 1000
-forward
waitms 600
cmd viewpos
timer
waitms 600
screenshot b48c_rows_x
waitms 700
screenshot b48c_rows
echo ^5=== b48c: 5. boundary 3 and the end -> data/runs/bhop_eazy/main/cheat.rec ===
setpos 2200 -864 144 0 0 0
waitms 300
+forward
waitms 1000
-forward
waitms 400
setpos 2640 -1300 144 0 -90 0
waitms 300
+forward
waitms 900
-forward
waitms 1000
cmd viewpos
timer
waitms 900
echo ^5=== b48c: done ===
quit
