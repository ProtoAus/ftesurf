// OVL06 -- does hl2_overlays 0 actually take effect, and when?
//
// hl2_overlays is CVAR_MAPLATCH and the synthesis happens inside the BSP
// loader, so it can only change on a load that REALLY re-runs that loader.
// Mod_ForName hands back the cached world model unless the file's mtime moved,
// so "map <same map>" is not necessarily such a load.  Three attempts, in
// increasing order of force, to find which one is the honest answer:
//
//   A  set it and re-issue `map surf_rise`          (may hit the model cache)
//   B  set it and `retry`                            (what gfx_menu key 7 does)
//   C  set it, load a DIFFERENT map, come back       (cache pressure)
//
// EXPECTED if it works: the "overlays:" line disappears entirely, because with
// the synthesis off there are no info_overlay blocks for CSQC to count.

log_enable 1
log_dir "logs"
log_name "ovl06"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
sv_cheats 1

wait 200
echo ^5=== BASELINE: hl2_overlays 1 ===
hl2_overlays 1
map surf_rise
waitmap 1800
waitms 4000

echo ^5=== A: hl2_overlays 0 then `map surf_rise` again ===
hl2_overlays 0
hl2_overlays
map surf_rise
waitmap 1800
waitms 4000

echo ^5=== B: still 0, now `retry` (gfx_menu key 7) ===
retry
waitmap 1800
waitms 4000

echo ^5=== C: still 0, via a different map and back ===
map bhop_futile
waitmap 1800
waitms 3000
map surf_rise
waitmap 1800
waitms 4000

echo ^5=== RESTORE: hl2_overlays 1 + retry ===
hl2_overlays 1
retry
waitmap 1800
waitms 4000

echo ^5=== ovl06 done ===
wait 30
quit
