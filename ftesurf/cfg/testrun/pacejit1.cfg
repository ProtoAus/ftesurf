// ---- the per-frame record, uncapped, short window --------------------------
// cl_debug_spike_ms 0.001 logs EVERY frame (cl_main.c:7774), so this is kept to
// ~700 ms.  `gfx=` is the render bucket -- its frame-to-frame difference IS the
// C_n - C_n-1 term above -- and `hostft=` is the simulation delta the frame was
// built from.  Costs a Con_Printf per frame, so it is deliberately the LAST
// thing done on this map and never overlaps a cadence arm.
echo ^5=== pacejit1: 4am per-frame spike log, uncapped ===
cl_maxfps 0
sys_framepacing 1
waitms 800
+left
waitms 500
cl_debug_spike_ms 0.001
cl_debug_spikes 1
waitms 700
cl_debug_spikes 0
waitms 300
-left
waitms 600

echo ^5=== pacejit1: 4am render cost table ===
r_speeds 2
waitms 1500
r_speeds_dump
waitms 400
r_speeds 0
waitms 600

// ===========================================================================
//  surf_rise -- the light control.  Same arms, same order.
// ===========================================================================
