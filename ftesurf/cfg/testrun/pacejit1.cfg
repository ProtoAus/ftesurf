// PACEJIT1 -- is the camera judder present-cadence jitter, and does it track the
// map's render cost?
//
// THE CLAIM UNDER TEST.  Sys_DoubleTime() is sampled ONCE per frame, at the top
// of the main loop before any work (sys_win.c:5000 -> cl_main.c:7341, the only
// write to `realtime` in the client).  The buffer swap happens a whole render
// later (gl_screen.c:344).  So frame n depicts T_n and is shown at T_n + C_n,
// and the present-to-present spacing is  dt + (C_n - C_n-1)  while the
// simulation advanced only dt.  The displayed timing error is therefore the
// FRAME-TO-FRAME VARIANCE OF RENDER COST, not its magnitude.
//
// On a fixed-refresh panel the scanout grid partly masks that.  The reporter is
// on a 360Hz VRR display, where the monitor follows the present, so the error
// arrives 1:1 as forward/back motion error while moving.  Their report: bad on
// surf_4am (122 MB VBSP), smooth on lighter maps, gone at 66 fps.
//
// SO THE ASSERTION IS A COMPARISON, NOT A THRESHOLD: present-cadence jitter must
// be materially higher on surf_4am than on surf_rise under identical settings.
// If it is not, the diagnosis is wrong and nothing downstream of it should ship.
//
// WHY YAW AND NOT WALK.  The mechanism needs the leaf set and batch list to
// change per frame, which is what motion does to render cost -- but walking puts
// each arm at a different place in the map, so the arms would no longer be
// comparable.  Yawing in place changes the drawn set just as violently and
// returns to where it started.  cl_yawspeed is pinned to 90 here rather than
// trusted from the config (default.cfg:696 currently says 60), so each 4000 ms
// arm is EXACTLY one revolution and every arm draws the same total content.
// Nobody leaves the start box, so no run is ever started and data/runs is not
// touched -- surf_4am has no runs directory at all and must still have none
// afterwards.
//
// developer 0 AND log_developer 0, per b45perf.cfg's header: that file records a
// measurement invalidated because developer spam differed between arms and the
// fps number moved with the spam rather than with the thing under test.  Same
// reason for con_notifylines 0 -- sys_framepacing_stats prints ~20 lines per arm
// and drawing them would be charged to the next arm's frames.
//
// THE INSTRUMENT.  sys_framepacing_stats (sys_win.c:2258) ends with a "Present
// cadence (last N swaps)" block fed by Sys_FramePace_RecordPresent(), which runs
// UNCONDITIONALLY IN EVERY MODE at gl_screen.c:348 -- so it reports even when the
// pacer itself is inert.  Read `jitter (stddev)` and `spread`.  The ring is 128
// entries; 4000 ms holds 500+ frames at every rate used here, so each arm's ring
// is entirely its own samples.
//
// EXPECT THE "Wait accuracy" BLOCK TO BE EMPTY IN THE cl_maxfps 0 ARMS, and that
// absence is itself a result: it proves Sys_FramePacedWait was never called, i.e.
// that sys_framepacing 1/2/3 cannot have been doing anything in the reporter's
// shipped configuration (seta cl_maxfps "0", ftesurf.cfg:344, overrides
// default.cfg:842's 1000).
//
// THREE ARMS, INTERLEAVED THREE TIMES rather than blocked, because thermal drift
// and background load move slowly and a block layout charges them to whichever
// arm ran last:
//
//   A  cl_maxfps 0                    the reporter's actual shipped config
//   B  cl_maxfps 300 + framepacing 1  frame-START pacing, what FTESurf ships
//   C  cl_maxfps 300 + framepacing 4  PRESENT pacing (Patch 47 measured this at
//                                     67us stddev vs mode 2's 865us on a 360Hz
//                                     VRR panel at cl_maxfps 300, IN FULLSCREEN)
//
// ARM C IS EXPECTED TO READ WORSE THAN IT SHOULD HERE, deliberately.  Patch 47's
// note says mode 4 is fullscreen-only because windowed/DWM owns the present and
// G-Sync will not engage; this harness runs vid_fullscreen 0 like every other
// testrun cfg.  So C measures the pacing, not the display path, and the
// fullscreen arm is a separate hand test.  Do not read a poor C here as mode 4
// being useless.
//
// WHAT THIS FILE CANNOT ANSWER.  The judder is a visual report.  These numbers
// are a proxy for it and nothing here decides whether it still looks wrong.  The
// second mechanism -- whole-tick movement quantisation, where a 16 ms usercmd
// carries 15 ms of motion (pm_source.c:2984 runs whole ticks and carries the
// remainder) -- is invisible to this file: it moves the ORIGIN, and no per-frame
// origin record exists anywhere on disk.  That one is the cl_maxfps ladder, and
// it has to be felt.

log_enable 1
log_dir "logs"
log_name "pacejit1"
developer 0
log_developer 0
cfg_save_auto 0
sv_cheats 0
fs_missingwarn 0

cl_idlefps 0
vid_vsync 0
vid_fullscreen 0
con_notifylines 0
con_notifytime 0
scr_conalpha 0

// pinned, not inherited -- see the header
cl_yawspeed 90

wait 200
echo ^5=== pacejit1: subsystem state before anything ===
sys_framepacing_stats
waitms 400

// ===========================================================================
//  surf_4am -- the map the judder was reported on
// ===========================================================================
map surf_4am
waitmap 1800
waitms 4000
clear
echo ^5=== pacejit1: 4am loaded, settling ===
waitms 3000

// ---- round 1 --------------------------------------------------------------
echo ^5=== pacejit1: 4am r1 A -- cl_maxfps 0 (shipped config) ===
cl_maxfps 0
sys_framepacing 1
waitms 800
+left
waitms 4000
sys_framepacing_stats
waitms 400
-left
waitms 600

echo ^5=== pacejit1: 4am r1 B -- cl_maxfps 300 framepacing 1 ===
cl_maxfps 300
sys_framepacing 1
waitms 800
+left
waitms 4000
sys_framepacing_stats
waitms 400
-left
waitms 600

echo ^5=== pacejit1: 4am r1 C -- cl_maxfps 300 framepacing 4 ===
cl_maxfps 300
sys_framepacing 4
waitms 800
+left
waitms 4000
sys_framepacing_stats
waitms 400
-left
waitms 600

