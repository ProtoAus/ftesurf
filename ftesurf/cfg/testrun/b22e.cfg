// FTESurf build 22 -- the regression.  Nothing here is about the journal; it is
// about everything the journal must not have broken.
//
// The shared engine tree means an input-path change touches every game on it, and
// the QC change touches all three progs, so the sweep is the usual one: both
// selftests, the shipped zone file still readable, and every build-22 cvar and
// command present and non-empty.  A cvar that boots as "" is the build 20 trap --
// the feature is silently off and prints "(default)" beside it.

cfg_save_auto 0
log_name b22e
developer 0
con_notifytime 0

wait 200
map surf_666
waitmap 60
waitms 500

echo "--- the shipped zones must still read 6 segments ---"
cmd zone_dests
waitms 700

echo "--- build 22 knobs: none of these may be empty ---"
rec_hid
rec_terms
in_journal_maxkb
waitms 400

echo "--- and the four commands must exist (an unknown one prints so) ---"
cmdlist in_journal
waitms 400

echo "--- earlier builds' cvars, unchanged ---"
run_rearmhop
run_starthop
run_teleport_warp
hud_splits_y
log_dir
scr_sshot_prefix
waitms 400

echo "--- pm_selftest ---"
pm_selftest
waitms 1500

echo "--- zone_selftest ---"
zone_selftest
waitms 1500

echo "=========== done ==========="
waitms 400
quit
