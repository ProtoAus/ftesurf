// B45PERF -- is the screen-space line actually cheaper than the ribbon?
//
// THE REPORT ASKED FOR THIS EXPLICITLY: "can we have something similar that's
// low effect / low cpu expense if we need to print hundreads of runs at once?"
// Watch_Path2D's essay claims about eight builtins a segment against the
// ribbon's fifteen -- five normalize, one crossproduct and three vlen all go,
// because in screen space there is nothing to face and the width is a literal.
// That is an argument, not a measurement.
//
// WHY THE B45LINE SHOTS DO NOT SETTLE IT.  They carry an fps counter and it
// reads 33.3 for mode 1 and 51.6 for mode 2, which looks like the answer and is
// not: those shots ran developer 1, so each frame also drew however many lines
// of console spam had accumulated by then, and the two arms had visibly
// different amounts of it.  A number that moves with something other than the
// thing under test is not a measurement of the thing under test.
//
// SO: developer 0, console cleared, fixed paused camera, no frame cap, and the
// three arms INTERLEAVED four times rather than run in three blocks -- thermal
// drift and background load move slowly, so a block layout charges them to
// whichever arm ran last.  Mode 0 is the control: it is the same frame with the
// drawer switched off entirely, so mode1-minus-mode0 and mode2-minus-mode0 are
// the two costs, and if mode 0 itself drifts across the file the run is noise
// and must be thrown away rather than read.
//
// timerefresh IS NOT USABLE HERE and this is why the arms are screenshots.  It
// calls R_RenderView in a loop and never runs CSQC_UpdateView, so it cannot see
// anything CSQC draws -- it would report the two arms identical and the ribbon
// free.  show_fps with cl_maxfps 0 is the only thing that measures the frame
// this feature is actually in.
//
// The fps counter is read out of the bottom-right corner of each PNG.

log_enable 1
log_dir "logs"
log_name "b45perf"
developer 0
log_developer 0
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 0
vid_vsync 0
vid_fullscreen 0
sv_cheats 0
fs_missingwarn 0
show_fps 1

hud_watch_path 1
hud_watch_path_ahead 1
hud_watch_path_px 3
hud_watch_info 0
hud_watch_skipidle 0

wait 200
echo ^5=== b45perf ===

map surf_rise
waitmap 1800
waitms 2500

replay data/runs/surf_rise/main/last.rec
waitms 800
replay pause
replay seek 45
waitms 900
// The counters for the frame under test, taken once: this is how many quads the
// two arms are being asked for.
replay status
clear
// Long settle before the first sample -- the map has just loaded and the first
// seconds after that are not representative of anything.
waitms 3000

// ---- round 1 --------------------------------------------------------------
hud_watch_path_mode 0
waitms 1500
screenshot b45perf_r1_m0_x
waitms 900
screenshot b45perf_r1_m0
hud_watch_path_mode 1
waitms 1500
screenshot b45perf_r1_m1_x
waitms 900
screenshot b45perf_r1_m1
hud_watch_path_mode 2
waitms 1500
screenshot b45perf_r1_m2_x
waitms 900
screenshot b45perf_r1_m2

// ---- round 2 --------------------------------------------------------------
hud_watch_path_mode 0
waitms 1500
screenshot b45perf_r2_m0_x
waitms 900
screenshot b45perf_r2_m0
hud_watch_path_mode 1
waitms 1500
screenshot b45perf_r2_m1_x
waitms 900
screenshot b45perf_r2_m1
hud_watch_path_mode 2
waitms 1500
screenshot b45perf_r2_m2_x
waitms 900
screenshot b45perf_r2_m2

// ---- round 3 --------------------------------------------------------------
hud_watch_path_mode 0
waitms 1500
screenshot b45perf_r3_m0_x
waitms 900
screenshot b45perf_r3_m0
hud_watch_path_mode 1
waitms 1500
screenshot b45perf_r3_m1_x
waitms 900
screenshot b45perf_r3_m1
hud_watch_path_mode 2
waitms 1500
screenshot b45perf_r3_m2_x
waitms 900
screenshot b45perf_r3_m2

// ---- round 4 --------------------------------------------------------------
hud_watch_path_mode 0
waitms 1500
screenshot b45perf_r4_m0_x
waitms 900
screenshot b45perf_r4_m0
hud_watch_path_mode 1
waitms 1500
screenshot b45perf_r4_m1_x
waitms 900
screenshot b45perf_r4_m1
hud_watch_path_mode 2
waitms 1500
screenshot b45perf_r4_m2_x
waitms 900
screenshot b45perf_r4_m2

echo ^5=== b45perf: done ===
replay stop
waitms 400
quit
