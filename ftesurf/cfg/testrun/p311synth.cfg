cfg_save_auto 0
// PATCH 311 -- FALSIFIER.  The journal's `synth` poison now fires at the
// INJECTION POINT rather than in one known caller.
//
// WHAT WAS WRONG.  in_jrn_synth was set by IN_JournalSynth_f because THE COMMAND
// set it, not because the INJECTION did.  So the flag described one caller
// rather than the property it is named for, and every other way into
// IN_KeyEvent / IN_MouseMove produced a journal saying `synth 0` -- a clean
// evidence file -- over forged input.
//
// THAT IS NOT HYPOTHETICAL.  plugins/plugin.h:356-360 hands a plugin RAW
// POINTERS to IN_KeyEvent, IN_MouseMove, IN_JoystickAxisEvent, IN_Accelerometer
// and IN_Gyroscope (the input table in common/plugin.c).  A plugin is an
// ordinary native DLL a player can drop in: no cheat gate, no memory patching,
// no hook.  It calls the same function the Windows backend calls, the event
// lands in the same ring, and until now the journal could not tell.
//
// THE ARM THAT PROVES IT NEEDED A REAL PLUGIN.  Nothing already in the tree
// exercises that path on this machine -- openxr.c:1648 is the only in-tree
// caller and it needs a VR runtime -- so plugins/p311test/ was written for this
// test: ~40 lines, one console command, injecting a fixed meaningless pattern.
// It is built STANDALONE with gcc and never through `make plugins-rel`, which
// would rebuild the concurrent session's hl2 plugin.  A test that cannot reach
// the code under test is not a test.
//
// PRE-REGISTERED, before the run:
//   ARM A  control, nothing injected -> data/p311_A.hid
//          Header MUST say `synth 0` and there MUST be no SYNTH note.
//   ARM B  in_journal_synth 32 -> data/p311_B.hid
//          Header MUST say `synth 1`.  This is the REGRESSION arm: the poison
//          was refactored out of the command and into IN_Journal_MarkSynth, so
//          the behaviour that already worked must still work.  It must also now
//          carry a note naming the source `in_journal_synth`.
//   ARM C  p311_inject (the plugin) -> data/p311_C.hid
//          THE NEW ONE.  Header MUST say `synth 1` and the note MUST name the
//          source `plugin`.  Before this patch this arm produced `synth 0`.
//   THE BEFORE/AFTER is run separately against ftesurf64.exe.prev, which is the
//   Patch 310 binary -- the same cfg, the same plugin, one patch apart.
//
// WHY NAME THE SOURCE AT ALL.  `synth 1` alone says the file is inadmissible but
// not why, and "a developer ran in_journal_synth to test the format" and "a
// plugin forged input" are the same flag with very different meanings.
//
// WHAT THIS DOES NOT CATCH, so the result is not overread: a native DLL that
// detours IN_MouseMove itself, or patches the event ring, runs BELOW this mark.
// So does a hardware replay device.  This closes the SANCTIONED injection route
// -- the one that needs no skill at all -- and does not pretend to close others.

exec cfg/testrun/_quiet.cfg

developer 1
log_developer 1
log_enable 1
log_dir logs
log_name p311synth
cl_maxfps 100
cl_idlefps 0
sv_cheats 0
con_notifylines 0
con_notifytime 0.01
r_drawviewmodel 0

wait 200
map bhop_eazy
waitmap 600
waitms 5000

echo ^5=== P311: loading the falsifier plugin
plug_load p311test
waitms 1000
plug_list

echo ^5=== P311 ARM A: control, nothing injected
in_journal_begin
waitms 1500
in_journal_note p311-arm-A-control
waitms 200
in_journal_end data/p311_A.hid
waitms 1000

echo ^5=== P311 ARM B: in_journal_synth (the path that already marked)
in_journal_begin
waitms 500
in_journal_synth 32
waitms 800
in_journal_note p311-arm-B-command
waitms 200
in_journal_end data/p311_B.hid
waitms 1000

echo ^5=== P311 ARM C: the PLUGIN injects
in_journal_begin
waitms 500
p311_inject
waitms 800
in_journal_note p311-arm-C-plugin
waitms 200
in_journal_end data/p311_C.hid
waitms 1000

echo ^5=== END OF RUN ===
waitms 1000
quit

// ===========================================================================
// MEASURED -- 2026-09-13.  A REAL BEFORE/AFTER ON TWO SHIPPED BINARIES: the
// same cfg and the same plugin, run against the deployed Patch 310 build
// (83D007EA974E) and then the Patch 311 build (5A2A722CD7AA).
//
//   arm                         pre-311 (310)      post-311
//   A  control                  synth 0            synth 0
//   B  in_journal_synth 32      synth 1            synth 1  + "SYNTH source in_journal_synth"
//   C  plugin injects 32        synth 0   <-- !!   synth 1  + "SYNTH source plugin"
//
// ARM C PRE-311 IS THE WHOLE POINT.  Thirty-two forged mouse events entered the
// engine through its own published plugin API, were drained into the same event
// ring the mouse uses, and the journal declared itself CLEAN EVIDENCE over the
// top of them.  No cheat gate was bypassed, nothing was patched or hooked: this
// is the documented way for a plugin to send input.
//
// ARM A is the control that says the mark does not fire on its own, and ARM B is
// the regression arm -- the poison was refactored out of IN_JournalSynth_f into
// IN_Journal_MarkSynth, so the behaviour that already worked had to still work.
// It does, and now names its source too.
//
// PRE-REGISTRATION: all three arms landed exactly as registered.  One defect in
// the patch itself was found by running it: the note read `SYNTH source?plugin`
// on the first build, because IN_Journal_Note's sanitiser allows only
// alphanumerics, space, _ . and - and turned the '=' into '?'.  Space-separated
// since.  Worth keeping because the sanitiser is doing its job -- a note is
// gamecode-supplied text and must not be able to forge a record line -- and the
// engine-internal caller has to live within the same rule.
//
// THE PLUGIN.  plugins/p311test/p311test.c, ~40 lines, one console command.
// Built STANDALONE:
//   gcc -DFTEPLUGIN -O2 -w -I<engine>/{client,server,common,gl,d3d,qclib} \
//       -I<engine> -I<engine>/libs -o fteplug_p311test_x64.dll -shared \
//       p311test/p311test.c plugin.c plugin.def -Wl,--support-old-code \
//       -static-libgcc
// NEVER through `make plugins-rel`, which would rebuild the concurrent
// session's hl2 plugin.  THE BUILT DLL IS DELETED AFTER THE RUN and is not kept
// in the game directory: an input-injecting DLL sitting next to the game is
// precisely what this subsystem exists to notice.  The source stays so the
// falsifier can be rebuilt.
//
// WHAT THIS DOES NOT CATCH: a native DLL that detours IN_MouseMove itself, or
// patches the event ring, runs BELOW this mark; so does a hardware replay
// device.  This closes the SANCTIONED injection route -- the one that needs no
// skill at all -- and does not pretend to close the others.
//
// hidcheck.py: the synth note is parsed and the source reported.  The old
// message asserted every synth-flagged file came from in_journal_synth, which
// was true when written and became a FALSE ATTRIBUTION the moment a plugin
// could set the same flag -- a pre-311 file now says the source is unknown
// rather than naming the innocent one.  THREE new suite cases; 88 checks, 0
// failed.
