// FTESurf Patch 193, run A: the FPS baseline.  Workstream D Step A.
//
// Traps this rig exists to avoid, each one a real property of this build:
//
//  * r_speeds_dump prints the LAST COMPLETED 100-frame window (cl_screen.c:150-165 --
//    the sampler only copies rspeeds[] into samplerspeeds[] every frameinterval).  So a
//    viewpoint must be held for >=200 frames before the first dump or the sample
//    straddles the arrival and is a blend of two scenes.
//  * `wait <n>` is FRAMES (Patch 164, cmd.c:238-247), which is the unit the sampler
//    counts in.  waitms is wrong here: it would be 300 frames on a fast map and 30 on a
//    slow one, i.e. exactly backwards.
//  * cl_yieldcpu defaults 1 and ftesurf.cfg:290's own comment says to turn it off when
//    benchmarking.
//  * setpos clears velocity, so the camera cannot drift, and Patch 165 made the
//    pitch/yaw/roll arguments actually stick.  It does NOT force noclip -- the engine's
//    own does (sv_user.c:5591), but FTESurf's SSQC shadows it and deliberately leaves
//    your movetype alone, which is why every viewpoint below turns noclip on itself.
//    Build 24: it marks the run practice rather than voiding it, and the no-argument
//    read form moved to `viewpos`.  Every dump is paired with a screenshot at the same
//    position because a table is worthless if the camera was not where it claims to be.
//  * r_speeds 3 makes RSpeedEnd issue its own qglFinish (gl_screen.c:275), so the
//    per-bucket times become the GPU's.  That is the CPU-bound vs GPU-bound answer and
//    it costs one extra 150-frame hold per viewpoint.
//  * cfg_save_auto 0 -- r_speeds and friends are archived cvars and a test run must not
//    write ftesurf.cfg.
//
// Spawn coordinates read out of each map's entity lump (LZMA-decompressed; the raw
// lump lengths in a VBSP header are COMPRESSED lengths and mean nothing undivided).

cfg_save_auto 0
log_name p193a
developer 0
scr_sshot_type png
cl_yieldcpu 0
cl_maxfps 0
vid_vsync 0
r_speeds 2
waitms 2500

echo "=== P193A BASELINE.  1280x720, vsync 0, maxfps 0, yieldcpu 0 ==="

// ---------------------------------------------------------------- demise, start zone
echo "### MAP surf_demise"
map surf_demise
waitmap 180
waitms 6000
echo "### VP demise/start  setpos -12192 -3920 15128 0 0 0"
setpos -12192 -3920 15128 0 0 0
wait 300
echo "### DUMP demise/start r_speeds2"
r_speeds_dump
wait 10
screenshot_mega p193a_demise_start 1280 720
r_speeds 3
wait 200
echo "### DUMP demise/start r_speeds3 (glFinish)"
r_speeds_dump
wait 10
r_speeds 2

// the position the shader_here dump in the original report was taken from
echo "### VP demise/smoke  setpos 7223 -6287 4763 0 0 0"
setpos 7223 -6287 4763 0 0 0
wait 300
echo "### DUMP demise/smoke r_speeds2"
r_speeds_dump
wait 10
screenshot_mega p193a_demise_smoke 1280 720
r_speeds 3
wait 200
echo "### DUMP demise/smoke r_speeds3 (glFinish)"
r_speeds_dump
wait 10
r_speeds 2

// ---------------------------------------------------------------- sodacity, start zone
echo "### MAP surf_sodacity"
map surf_sodacity
waitmap 180
waitms 6000
echo "### VP sodacity/start  setpos -2336 14272 -11324 0 183.5 0"
setpos -2336 14272 -11324 0 183.5 0
wait 300
echo "### DUMP sodacity/start r_speeds2"
r_speeds_dump
wait 10
screenshot_mega p193a_sodacity_start 1280 720
