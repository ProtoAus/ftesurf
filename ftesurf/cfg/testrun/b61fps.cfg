// FTESurf build 61 -- WHAT DOES THE INTERVAL BUDGET ACTUALLY COST, INTERLEAVED.
//
// WHY A SECOND RUN.  b61int proved the mechanism and the picture: every interval
// arm was BYTE-IDENTICAL to the interval-0 control in the centre region, the
// deadline was met to within a few percent, and `stopped by` read "the interval
// quota" on every sample of every arm.  What it could NOT support is an fps
// claim, because its two same-setting pairs disagreed:
//
//     arm         setting        show_fps
//      A          interval 0      290.9
//      B          interval 0.05   547.7
//      C          interval 0.15   542.3
//      D          interval 0.05   391.0   <- same as B, 157 fps apart
//      E          interval 0      260.9   <- same as A,  30 fps apart
//
// Both pairs drift DOWNWARD in run order and the run as a whole sits ~25% below
// the b60meas run at identical settings (that read 396.8 where A reads 290.9),
// so the machine was slower and getting slower -- most likely thermal, since a
// peer session had just finished four back-to-back arms of its own.  A sequence
// of one-shot arms cannot separate "the setting is faster" from "the machine was
// faster then", and b61int's arm order happens to put both interval arms in the
// middle, i.e. exactly where a warm-then-throttling machine is quickest.
//
// SO INTERLEAVE AND REPEAT.  Four pairs, alternating, each arm short: a
// monotonic drift cancels in the PAIRED differences even if no single number is
// reliable.  Report the four paired deltas and their spread, not one ratio.
//
// AND THERE IS NOW A BETTER PROBE THAN show_fps, which is the point of the
// census line this build added.  The quota is computed as
// spr_n * frametime / interval, so reading it backwards gives an INSTANTANEOUS
// frametime with no averaging window and no screenshot hitch in it:
//
//     frametime = quota * interval / spr_n          (spr_n = 429 here)
//
// b61int's own numbers: B's mean quota of 12.5 gives 1.456 ms = 687 fps where
// show_fps said 547.7, and D's 14.0 gives 1.632 ms = 613 fps where show_fps
// said 391.0.  The quota probe puts B and D 11% apart; show_fps puts them 29%
// apart.  The quota is measured inside the frame that fires the rays, so where
// the two disagree the quota is the one to trust for COST -- but it only exists
// when the interval is on, which is why show_fps still has to carry the
// comparison against interval 0.  Both are recorded below; if they disagree
// about the SIGN of the effect, neither claim gets made.
//
// ===================================================================
// PREDICTION, REGISTERED BEFORE THE RUN
// ===================================================================
// From 27.1 us a ray and b61int's measured ray counts -- 41.8 rays/frame at
// interval 0 against 5.5 at interval 0.05, a saving of 36.3 rays = 0.984 ms:
//
//   at a true 300 fps (3.333 ms) -> 2.349 ms = 426 fps   (+42%)
//   at a true 400 fps (2.500 ms) -> 1.516 ms = 660 fps   (+65%)
//
//   PASS: all four paired deltas have the same sign and the interval arm is
//         faster in every pair.  This is the first change in the series that
//         should move fps at all -- the cull and the adaptive rays could not,
//         because the ray budget was saturated either way.
//   FAIL: the four deltas straddle zero.  Then the saving is inside the noise
//         of this machine and the honest answer is "fewer rays, no measurable
//         fps", which is what I wrongly claimed about the view cull off a
//         broken census and will not claim again without the paired evidence.
//   FAIL: the quota probe and show_fps disagree about the sign.
//
// NOT MEASURED HERE, AND IT IS THE ONE THING THAT MATTERS MOST: whether a
// 50 ms staleness bound is visible WHILE TURNING.  Every arm of b61int was
// pixel-identical because a static camera converges -- 296 of the 302 glares in
// frame are occluded and stay occluded, so there is nothing for a stale answer
// to be stale about.  A cfg cannot pan the view smoothly (setpos jumps), so
// this is for Lex to feel, not for me to claim.
cfg_save_auto 0
exec cfg/testrun/_quiet.cfg
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "b61fps"
scr_sshot_type png
cl_yieldcpu 0
vid_vsync 0
crosshair 0
fov 100
con_notifylines 0
con_notifytime 0.01
cl_maxfps 0

r_fog_progless 1
hl2_additivefog 1

waitms 2500
map surf_tensor2
waitmap 240
waitms 8000
sv_cheats 1
noclip
waitms 500

vbsp_sprites 1
vbsp_lightglow 1
vbsp_lightglow_scale 1
vbsp_sprite_source 1
vbsp_glare 1
vbsp_glare_rays 5
vbsp_glare_traces 40
vbsp_glare_cull 1.25
vbsp_glare_brush 2
vbsp_glare_adaptive 8
vbsp_glare_interval 0
r_renderscale 1
show_fps 1

setpos -10688.5 -1773.8 -8587.1 6.3 91.1 0
// long settle FIRST so the thermal state at pair 1 is the same as at pair 4
waitms 30000

echo "@@@ B61FPS P1off interval 0"
vbsp_glare_interval 0
waitms 6000
vbsp_sprite_debug 1
waitms 600
screenshot b61f_1off
waitms 1500

echo "@@@ B61FPS P1on interval 0.05"
vbsp_glare_interval 0.05
waitms 6000
vbsp_sprite_debug 1
waitms 600
screenshot b61f_1on
waitms 1500

echo "@@@ B61FPS P2off interval 0"
vbsp_glare_interval 0
waitms 6000
vbsp_sprite_debug 1
waitms 600
screenshot b61f_2off
waitms 1500

echo "@@@ B61FPS P2on interval 0.05"
vbsp_glare_interval 0.05
waitms 6000
vbsp_sprite_debug 1
waitms 600
screenshot b61f_2on
waitms 1500

echo "@@@ B61FPS P3off interval 0"
vbsp_glare_interval 0
waitms 6000
vbsp_sprite_debug 1
waitms 600
screenshot b61f_3off
waitms 1500

echo "@@@ B61FPS P3on interval 0.05"
vbsp_glare_interval 0.05
waitms 6000
vbsp_sprite_debug 1
waitms 600
screenshot b61f_3on
waitms 1500

echo "@@@ B61FPS P4off interval 0"
vbsp_glare_interval 0
waitms 6000
vbsp_sprite_debug 1
waitms 600
screenshot b61f_4off
waitms 1500

echo "@@@ B61FPS P4on interval 0.05"
vbsp_glare_interval 0.05
waitms 6000
vbsp_sprite_debug 1
waitms 600
screenshot b61f_4on
waitms 1500

echo "@@@ B61FPS DONE"
waitms 1200
quit
