// SKY04 -- what surface is at the see-through holes, and what is the sky shader?
//
// At save009 the skyroom-on frame has hard-edged pale POLYGONS laid over rock
// that is opaque with the skyroom off.  Straight edges over intact rock reads as
// something being drawn IN FRONT, not as the rock going missing -- and there is
// a path in gl_warp.c that does exactly that:
//
//   R_DrawSkyChain, r_refdef.flags & RDF_SKIPSKY, the non-prog branch (:586)
//       qboolean opaque = false;
//       if (skyshader->numpasses) { ...first pass blendfunc/atest/colormask... }
//       if (!opaque) GL_DrawSkySphere(batch, skyshader);
//
// i.e. under SKIPSKY a sky shader judged non-opaque is still drawn, over the
// skyroom.  A shader with numpasses == 0 never sets opaque, so it draws too.
// Whether boreas takes that branch depends on whether its sky shader has a
// `prog` -- the branch above it (:561) returns early for prog shaders.  So:
// point the crosshair at the sky and print the shader body.
//
// Then walk the crosshair across the frame and name the surface at each blob.
// A traceline stops at CONTENTS_SOLID, and Source sky brushes are solid, so a
// probe that reports TOOLS/TOOLSSKYBOX means the sky brush is in FRONT of the
// rock at that pixel -- which turns "the rock went missing" into "the sky brush
// was always there and only becomes visible once SKIPSKY changes how it draws".
//
// Screenshots at the two probe angles, skyroom on and off, so the crosshair can
// be matched to the blob rather than guessed at.

log_enable 1
log_dir "logs"
log_name "sky04"
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 0
vid_fullscreen 0
con_notifytime 0
con_notifylines 0
con_notifytime_error 0

wait 200
echo ^5=== sky04: naming the surfaces at the holes ===

map surf_boreas
waitmap 1800
waitms 9000
sv_cheats 1
waitms 300
noclip
waitms 300
vbsp_skyroom 1
waitms 500

echo ^5---------- the sky shader itself ----------
setpos 10229.4 5262.8 14725.9 -80 139.3616 0
waitms 2000
shader_here skyup
waitms 600
setpos 10229.4 5262.8 14725.9 -40 139.3616 0
waitms 1500
shader_here sky40
waitms 600

echo ^5---------- the baseline centre (known rock) ----------
setpos 10229.4 5262.8 14725.9 17.2046 139.3616 0
waitms 1500
shader_here centre
waitms 600

echo ^5---------- sweep across the frame ----------
setpos 10229.4 5262.8 14725.9 10 139.3616 0
waitms 1500
shader_here p10y139
waitms 600
setpos 10229.4 5262.8 14725.9 6 139.3616 0
waitms 1500
shader_here p06y139
waitms 600
setpos 10229.4 5262.8 14725.9 2 139.3616 0
waitms 1500
shader_here p02y139
waitms 600
setpos 10229.4 5262.8 14725.9 6 120 0
waitms 1500
shader_here p06y120
waitms 600
setpos 10229.4 5262.8 14725.9 2 120 0
waitms 1500
shader_here p02y120
waitms 600
setpos 10229.4 5262.8 14725.9 10 155 0
waitms 1500
shader_here p10y155
waitms 600

echo ^5---------- correlate: pitch 6 yaw 139, skyroom on then off ----------
setpos 10229.4 5262.8 14725.9 6 139.3616 0
vbsp_skyroom 1
waitms 2500
screenshot sky04_x
waitms 800
screenshot sky04_p06_skyon
waitms 800
vbsp_skyroom 0
waitms 2500
screenshot sky04_x
waitms 800
screenshot sky04_p06_skyoff
waitms 800

echo ^5=== sky04 done ===
wait 30
quit
