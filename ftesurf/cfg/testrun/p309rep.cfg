cfg_save_auto 0
// PATCH 309 -- FALSIFIER.  The '+' and '-' records now say whether the key was
// ALREADY DOWN, so OS auto-repeat stops being recorded as a press.
//
// MEASURED, on Lex's clean bhop_eazy PB (data/runs/bhop_eazy/main/0004976_pb):
//
//     326 '+' records against 130 '-' records.
//
// 196 key-downs -- SIXTY PERCENT of every press record in an honest run -- have
// no matching release, because they are OS auto-repeat and nothing said so.  By
// key:
//
//     e (101)          118 down    9 up      <- +left
//     CapsLock (129)    26 down    6 up      <- +right
//     -------------------------------------
//     turn keys        144 down   15 up      129 phantom = 89.6%
//
// (Lex's turn binds; see Patch 305, where +left/+right turned out to be core
// gameplay rather than an edge case.)  A reader asking how many times the player
// pressed the turn key got 144 for 15.
//
// THAT IS NOT A ROUNDING ERROR, IT IS A DIFFERENT STORY ABOUT THE RUN.  The
// shape auto-repeat invents -- a fast, perfectly even train of presses -- is
// precisely the shape a scripted turn would have.  The record was manufacturing
// the signature it exists to look for, on every honest run, and the only reason
// nobody had been accused by it is that nothing was reading the column yet.
//
// HOW IT IS DERIVED, and this is why the patch is four lines.  Key_Event already
// computes the identical value one line into its own body (`wasdown`, keys.c) to
// block auto-repeat binds.  IN_Commands calls IN_Journal_Event BEFORE the switch
// that dispatches Key_Event, so keydown[] still holds the state from before this
// event -- exactly what Windows' lParam bit 30 means, but DERIVED rather than
// threaded from the wndproc.  So it holds on every backend and on the raw-input
// path too, not only on the Windows legacy one, and Key_Event's scancode -1
// 'release everything' sweep keeps it from going stale on a focus loss.
//
// ON THE RELEASE TOO, because the same bit answers a second question there: a
// '-' whose key was NOT down is an ORPHAN -- a release with no press, meaning a
// press was lost or a release invented.  One field, one meaning, two findings.
//
// PRE-REGISTERED, before the harness was run:
//   ARM A  nothing injected -> data/p309_A.hid
//          No '+' or '-' records at all.
//   ARM B  one clean press: down, up -> data/p309_B.hid
//          Exactly one '+' with prev 0, and one '-' with prev 1.
//   ARM C  one press then NINE repeats, then up -> data/p309_C.hid
//          Exactly ten '+': the FIRST prev 0 and the other NINE prev 1.
//          One '-' with prev 1.  This is the arm the patch exists for: before
//          it, all ten were indistinguishable.
//   ARM D  a release with no press at all -> data/p309_D.hid
//          One '-' with prev 0 -- the orphan -- and no '+'.
//
// WHY A SYNTHETIC REPEAT IS A VALID TEST OF AUTO-REPEAT.  Real typematic repeat
// cannot be scripted: it is generated by the keyboard for a physically held key,
// and SendInput does not produce it.  But the column is not read from any OS
// repeat flag -- it is derived from "a down arrived for a key already down" --
// so an injected second down and a hardware repeat take the identical path and
// must produce the identical answer.  The mechanism is what is under test, and
// it is fully exercised here.  What this cfg canNOT show is the 89.6% figure
// itself; that was measured on the real recording quoted above and is reproduced
// by running hidcheck over it.

exec cfg/testrun/_quiet.cfg

developer 1
log_developer 1
log_enable 1
log_dir logs
log_name p309rep
cl_maxfps 100
cl_idlefps 0
sv_cheats 0
con_notifylines 0
con_notifytime 0.01
r_drawviewmodel 0

wait 200
map bhop_eazy
waitmap 600
waitms 5000

// F12, not a letter.  The machine is in active use during these runs -- a/d/w
// and the mouse buttons appear in every arm from a real hand -- so an injected
// letter cannot be told apart from a typed one.  Nobody presses F12, so every
// record carrying it is unambiguously the harness's.  Unbound so it cannot
// trigger gameplay or a console toggle and end up journalled as a hidden 'x'.
unbind f12

echo ^5=== P308 ARM A: control, nothing injected
in_journal_begin
waitms 2500
in_journal_note p308-arm-A-control
waitms 200
in_journal_end data/p309_A.hid
waitms 1500

echo ^5=== P308 ARM B: one clean press
in_journal_begin
waitms 3500
in_journal_note p308-arm-B-press
waitms 200
in_journal_end data/p309_B.hid
waitms 1500

echo ^5=== P308 ARM C: one press and nine repeats
in_journal_begin
waitms 4500
in_journal_note p308-arm-C-repeats
waitms 200
in_journal_end data/p309_C.hid
waitms 1500

echo ^5=== P308 ARM D: a release with no press
in_journal_begin
waitms 3500
in_journal_note p308-arm-D-orphan
waitms 200
in_journal_end data/p309_D.hid
waitms 1500

echo ^5=== END OF RUN ===
waitms 1000
quit

// ===========================================================================
// MEASURED -- engine\release\fteqw64.exe B8C976C60728, 2026-09-13.
//
// TWO EARLIER RUNS ARE KEPT, both for reasons that outlive them.
//   RUN 1 (p309r1_*)  Arms C and D fired NOTHING.  PowerShell variable names
//     are CASE-INSENSITIVE, so `$seq = $SEQ[$arm[1]]` destroyed the lookup
//     table with its own first result.  Arm B had already run, so the failure
//     looked like a data problem rather than a syntax one.
//   RUN 2 (p309r2_*)  Fired correctly but was UNREADABLE.  The injected key was
//     'b', and the machine is in active use -- a, d, w and both mouse buttons
//     appear in every arm from a real hand -- so an injected letter cannot be
//     told from a typed one.  Switched to F12 with its real scancode (FTE's
//     MapKey reads the SCANCODE out of lParam, not the virtual key, so a
//     vk-only injection arrives as scancode 0 and journals as the dead-key
//     path).  Nobody presses F12, so every key 156 record below is ours.
//
// RUN 3 RESULT, filtered to keycode 156 (F12):
//
//   ARM A  no key records at all.                                    AS REGISTERED
//   ARM B  + 156 prev=0   then   - 156 prev=1                        AS REGISTERED
//   ARM C  10 downs: prev = 0 1 1 1 1 1 0 1 1 1,  then - 156 prev=0
//   ARM D  - 156 prev=0, and no '+' at all -- the orphan.            AS REGISTERED
//
// PRE-REGISTRATION CORRECTION, recorded rather than reworded.  Arm C was
// registered as "the FIRST prev 0 and the other NINE prev 1", and the release
// prev 1.  It came out with TWO prev 0 among the downs and the release prev 0.
//
// THE RECORD EXPLAINS ITSELF, which is the part worth keeping.  Reading the arm
// in order, both unexpected zeros sit immediately after a release-everything
// sweep:
//
//     +  156  0      <- the press
//     +  156  1      x5
//     +  178  0      <- a real mouse button, from the hand on the machine
//     -   -1 -1      <- RELEASE EVERYTHING (focus change)
//     -   -1 -1
//     +  156  0      <- correct: F12 really was not down any more
//     +  156  1      x3
//     -   -1 -1      x3
//     -  156  0      <- correct: the release is an orphan, for the same reason
//
// The sweeps are caused by the harness stealing focus to deliver the keys, and
// Key_Event's scancode -1 handler clears keydown[] for every key.  So after one,
// the next down genuinely WAS a fresh press and the column says so.  The
// registration was wrong because it assumed an uninterrupted hold; the column
// tracked reality instead, including a state change the test itself caused.
// A naive "count the downs and subtract one" would have reported 9 repeats and
// been wrong twice over.
//
// WHAT THIS RUN CANNOT SHOW, stated so the result is not overread: real
// typematic repeat is generated by the keyboard for a physically held key and
// SendInput does not produce it.  But the column is not read from any OS repeat
// flag -- it is derived from keydown[], "a down arrived for a key already down"
// -- so a hardware repeat and an injected second down take the identical path.
// The 89.6% figure is not from this cfg; it is measured on the real recording
// quoted at the top and is reproduced by running hidcheck over it.
//
// hidcheck.py: '+'/'-' widened to 4 (pre-309) or 5 fields, presses and repeats
// counted separately, orphan releases surfaced as a note, scancode -1 excluded
// from both, and a pre-309 file told it CANNOT count its '+' records as
// presses.  FOUR new suite cases; 58 checks, 0 failed.
//   arm B  3 presses / 0 repeats / 2 orphans
//   arm C  3 presses / 8 repeats / 2 orphans   (72.7% of downs were repeats)
//   arm D  1 press  / 0 repeats / 1 orphan
// (the extra presses and orphans in each are the real hand and the focus
// sweeps, which is exactly what those columns are for.)
