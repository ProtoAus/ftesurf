// FTESurf -- RECON ONLY.  Where is surf_tensor2's stage 1, and what do you see?
//
// Lex: "test on !s 1".  A cfg cannot send `!s 1` (that is a chat trigger) and
// sl_goto is a pure client command the CSQC never registers, so the scripted
// equivalent is `cmd zone_goto <idx>` -- which teleports to the zone CENTRE and
// arms a stage run there.  This run exists only to find the index and the
// coordinates, because zone_goto's optional yaw/pitch arguments were measured
// NOT to hold (bhop_eazy: asked for yaw 16.18, got 0.5 then 179.5), so the real
// measurement run has to pin the heading with setpos using numbers read out of
// here rather than angles handed to zone_goto.
//
// Both spellings of the list command are issued because the note records the
// bare form and the `cmd` form in different places and only one will answer.
// Two `viewpos` calls bracket the teleport so the log shows where it started
// and where it landed -- and viewpos PRINTS AS `setpos x y z pitch yaw roll`
// deliberately, so the line pastes straight into the next cfg.
//
// A screenshot at the end answers the question the coordinates cannot: whether
// the stage-1 spawn heading actually looks at any glares.  If it faces a wall
// the A/B there would measure nothing, and I would rather find that out in a
// 60-second recon than inside a two-minute measurement.
//
// NOT A MEASUREMENT.  No arms, no controls, nothing here is quotable.
cfg_save_auto 0
exec cfg/testrun/_quiet.cfg
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "b61zr"
scr_sshot_type png
cl_yieldcpu 0
vid_vsync 0
crosshair 0
fov 100
con_notifylines 0
con_notifytime 0.01
cl_maxfps 0

r_fog_progless 1
hl2_additivefog 1

waitms 2500
map surf_tensor2
waitmap 240
waitms 8000

echo "@@@ ZR zone list, both spellings"
zone_list
waitms 1200
cmd zone_list
waitms 2500

echo "@@@ ZR where am I now (spawn)"
cmd viewpos
waitms 1500

echo "@@@ ZR zone_goto 1 -- the !s 1 equivalent"
cmd zone_goto 1
waitms 3000
cmd viewpos
waitms 1500

echo "@@@ ZR what does it look like, and what is in frame"
vbsp_sprite_debug 1
waitms 600
show_fps 1
waitms 1500
screenshot b61zr_x
waitms 900
screenshot b61zr_stage1
waitms 2500

echo "@@@ ZR also try zone_goto 2 in case stage numbering is offset"
cmd zone_goto 2
waitms 3000
cmd viewpos
waitms 1200
vbsp_sprite_debug 1
waitms 600
screenshot b61zr_y
waitms 900
screenshot b61zr_stage2
waitms 2000

echo "@@@ ZR DONE"
waitms 1200
quit
