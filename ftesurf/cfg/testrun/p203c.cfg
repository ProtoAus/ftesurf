// Patch 203, round 3 -- the crossing, at the speed the map is played at.
//
// Rounds 1-2 established the geometry: portal_s1_entry's 88x88 aperture spans
// z 860..948 and the floor in front of it is at 816.  It is a HOLE YOU FLY
// THROUGH, 44 units above the ground -- surf_kitsune is a surf map and you
// arrive off a ramp, not on foot.  Walking at it can never work and never
// should: PM_PortalCSG's window requires the player's whole box inside the
// aperture, and a standing player's feet are 44 below its bottom edge.
//
// REQUIRES the fixture: copy cfg/testrun/p203_kitsune_saveloc.txt to
//   ftesurf/data/saves/surf_kitsune/save01/state.txt   before running this.
//
// The approach comes from that hand-written saveloc, which is the only thing
// in the game that sets position AND velocity together (sv_saveloc.qc:536-537).
// -1200 u/s from 152 units out crosses in 0.127s; the +50 u/s of lift cancels
// the fall over exactly that interval, so the feet arrive at ~870 -- the middle
// of the [860, 876] band the window accepts.

cfg_save_auto 0
developer 0
log_developer 1
cl_yieldcpu 0
cl_maxfps 0
vid_vsync 0
r_drawviewmodel 0
con_notifytime 0
crosshair 0
set vbsp_portal_debug 0

waitms 1500
map surf_kitsune
waitmap 120
waitms 1200

echo "### P203C load"
cmd sl_goto 1
waitms 40
cmd setpos
waitms 60
cmd setpos
waitms 80
cmd setpos
waitms 150
echo "### P203C after"
cmd setpos
waitms 300
screenshot p203c_1_after
waitms 400

cmd setpos
waitms 300
echo "### P203C DONE"
waitms 400
quit
