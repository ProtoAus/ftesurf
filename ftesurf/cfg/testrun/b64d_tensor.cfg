cfg_save_auto 0

// ===========================================================================
// BUILD 64, ARM SET D -- surf_tensor2, reported as blaring, plus the two maps
// that bracket it.
//
// WHY THIS RUN.  Arm sets A-C verified the radius->attenuation fix and all
// eight arms passed.  A user then reported surf_tensor2 as deafening, which
// means the fix is incomplete and the arm set that "passed" was measuring the
// wrong thing.
//
// THE PATTERN THE CENSUS SUGGESTS, to be confirmed or killed here.  The map
// blamed first (surf_halloween_tf2) is 0 static / 280 dynamic.  surf_tensor2
// is 30 STATIC / 1 dynamic, and kz_secret_temple -- which was in arm set A's
// UNMUTED run, and whose 6 sound files include three from a flash/muc/ (music)
// directory -- is 77 STATIC / 6 dynamic.  So the two maps now suspected of
// blaring are the two dominated by the STATIC bucket, which is the one path
// arm sets A-C never isolated: every arm that passed on falloff was a dynamic
// map, and the only heavily-static arm (kz_secret_temple) asserts a widest
// attenuation that BARELY MOVED between the broken and fixed builds
// (1.302 -> 1.250).  The fix could not have changed what that map sounds like.
//
// That also means the original diagnosis may have named the wrong map.  The
// report was "random sounds all played at once".  surf_halloween_tf2 is 253
// copies of ONE slime loop -- a wall of one sound.  kz_secret_temple is 67
// cr_fire plus a waterfall plus three separate flash/muc/ tracks -- six
// different sounds, several of them music, all starting together.  The second
// description fits the complaint considerably better than the first.
//
// PRE-REGISTERED, from the entity lumps (scratchpad/tensor.py):
//
//   ARM  map                  MUST print
//   T1   surf_tensor2         30 static, 1 dynamic (0 loop(s) playing)
//                             widest ambient: attn 0.606, audible ~1650 units
//   T2   kz_secret_temple     77 static, 6 dynamic (6 loop(s) playing)
//                             widest ambient: attn 1.250, audible ~800 units
//   T3   surf_halloween_tf2   0 static, 280 dynamic (269 loop(s) playing)
//                             widest ambient: attn 0.541, audible ~1850 units
//   T4   surf_tensor2         identical to T1 -- restore arm
//
// surf_tensor2's 31 ambients are 21 x ambient/levels/citadel/field_loop3.wav
// at radius 219 (attn 3.900, audible 256), 9 x canals/dam_water_loop2.wav at
// radius 3424-5480 (attn 0.606-0.690, audible 1450-1650), and one
// music/pretending.mp3 behind a func_button OnPressed -- the only dynamic one,
// and the only one that needs a press, so it is NOT what blares on spawn.
//
// WHAT THIS RUN CANNOT SETTLE, said plainly so the result is not over-read.
// Every number above is a SETUP figure: how many emitters, how loud each is
// declared, how far each carries.  None of them is the sum, and the sum is
// what a person hears.  FTE fades LINEARLY (snd_dma.c:2714, scale = 1.0 - dist)
// and accumulates overlapping channels additively (ch->vol[i] += ..., :2717),
// so N clustered full-volume emitters sum to N x full volume and clip.  Source
// fades on a dB curve, which is far quieter at the same nominal radius when
// emitters cluster.  Matching Source's attenuation NUMBER, which arm set B did
// and verified, does not match Source's GAIN AT A DISTANCE, and this run is
// expected to show exactly that gap rather than to close it.
//
// `volume 0` is set below.  This reads numbers out of a log.
// ---------------------------------------------------------------------------
// RESULTS: (written back here after the run)
// ---------------------------------------------------------------------------
// ===========================================================================

log_enable 1
log_dir logs
log_name b64d_tensor
developer 1
log_developer 1
cl_maxfps 100
con_notifylines 0

volume 0
bgmvolume 0

waitms 5000

echo ^5=== T1: surf_tensor2 -- 30 static / 1 dyn, attn 0.606 ===
map surf_tensor2
waitmap 60
waitms 8000
ent_io
waitms 1500
ent_census
waitms 1500

echo ^5=== T2: kz_secret_temple -- 77 static / 6 dyn, attn 1.250 ===
map kz_secret_temple
waitmap 45
waitms 6000
ent_io
waitms 1500

echo ^5=== T3: surf_halloween_tf2 -- 0 static / 280 dyn, attn 0.541 ===
map surf_halloween_tf2
waitmap 45
waitms 6000
ent_io
waitms 1500

echo ^5=== T4: surf_tensor2 again -- the restore arm ===
map surf_tensor2
waitmap 60
waitms 8000
ent_io
waitms 2500

echo ^5=== END OF RUN ===
quit
