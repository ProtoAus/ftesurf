// BL_A -- surf_borderlands: is the black a per-FACE lightofs alignment fault?
//   ftesurf64.exe +set vid_fullscreen 0 +set log_dir logs +set log_name bl_a +exec cfg/testrun/bl_a.cfg
// Falsifier arm on a Patch 281 build (run FIRST, then rename screenshots/bl_a_*.png to bl_a0_*.png):
//   ftesurf64.exe +set vid_fullscreen 0 +set log_dir logs +set log_name bl_a0 +set hl2_lightmap_repack 0 +exec cfg/testrun/bl_a.cfg
// On a pre-281 binary the second command line is the only arm there is.
log_enable 1
log_dir "logs"
developer 1
log_developer 1
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 0
con_notifytime 0
con_notifylines 0
con_notifytime_error 0
sv_cheats 1
r_texdiag 1
r_novis 1
r_lightmap 0
wait 200
echo ^5=== bl_a: surf_borderlands ===
map surf_borderlands
waitmap 2400
waitms 9000
noclip
// V1: the spawn, info_player_start 10408 -16104.5 11369 angles 0 90 0 -- the user's own vantage
setpos 10408 -16104.5 11369 0 90 0
waitms 2500
cmd viewpos
screenshot bl_a_x
waitms 700
screenshot bl_a_1_spawn
waitms 700
// V2: SKYPPY3/METAL_PLATE01A ($bumpmap) wall faces sharing the edge y=5440 z 576..1536 at x=-2304, normal +x, both 297 luxels.
// Camera 600 out looking -x (yaw 180): +y is screen-right.
//   LEFT  face 1597  y 1472..5440  lightofs 3113219 (off the grid by 3)  predicted 97% exact zero
//   RIGHT face 1599  y 5440..9408  lightofs 3122560 (aligned)            predicted lit
setpos -1704 5440 1056 0 180 0
waitms 2500
cmd viewpos
screenshot bl_a_x
waitms 700
screenshot bl_a_2_pair
waitms 700
r_lightmap 1
waitms 700
screenshot bl_a_x
waitms 700
screenshot bl_a_3_pair_lm
r_lightmap 0
waitms 700
// V3: DEV/VALUESAND40 (no $bumpmap) ramp faces sharing the edge x=-10624, seen from 600 above, pitch 89 yaw 270 (-x is screen-right).
//   LEFT  face 1353  x -10624..-8832   lightofs 2109196 (aligned)            predicted lit
//   RIGHT face 1355  x -12608..-10624  lightofs 2116629 (off the grid by 1)  predicted 98% exact zero
setpos -10624 -139.8 339.9 89 270 0
waitms 2500
cmd viewpos
screenshot bl_a_x
waitms 700
screenshot bl_a_4_sand
waitms 700
hl2_missing
r_showshader SKYPPY3/METAL_PLATE01A
r_shaderpasses SKYPPY3/METAL_PLATE01A
r_showshader DEV/VALUESAND40
waitms 1000
quit
