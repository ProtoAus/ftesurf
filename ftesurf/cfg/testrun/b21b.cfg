// FTESurf build 21 -- the two left-hand blocks, on screen together.
//
// Needs a run that crosses gates AND spends time in the air, because the split
// list is pushed by gate crossings and the energy column by air/ramp segments,
// and the whole complaint is about the two of them at once.  surf_666's real
// zone file is staged with no intermediate checkpoints, so this run uses the
// linear fixture at maps/zones/local/surf_666.json -- concentric shells around
// the real start box, so leaving it in ANY direction crosses cp 1, 2, 3 and
// then the end.  THE FIXTURE IS DELETED AFTER THIS RUN; it shadows the shipped
// zones for surf_666 and must not outlive the test.
//
// con_notifytime 0 FIRST and developer 0: chat prints and the developer line
// land in the notify area, which is exactly where the split list now lives.
// Lines already up are not retired by it, so it has to be set before anything
// prints rather than before the screenshot.
//
// hud_scale 2 is stated rather than assumed -- it is the default and it is the
// case that collided; at scale 1 the blocks were always half as wide.
//
// Two screenshots: the new defaults, then the SAME frame with the block put
// back to its old anchor (0.018 / 0.5).  That second one is the before, and it
// is the only honest way to show a placement change from inside one build.

cfg_save_auto 0
log_name b21b
developer 0
// con_notifytime 0 was NOT enough -- it is a duration, and the first run's shot
// came back with the whole timer report printed across the middle of the screen,
// exactly where the energy column lives.  con_notifylines is the max line COUNT
// (console.c:63) and 0 removes the notify area outright.  Both consoles: server
// sprints land in one and chat in the other.
con_notifylines 0
con_numnotifylines_chat 0
con_notifytime 0
pm_autobunny 1
hud_scale 2

wait 200
map surf_666
waitmap 60
waitms 500

// AFTER the map, not before: these are registered by csprogs, which does not
// exist until a map is loaded, so setting them up top printed "Unknown command"
// and did nothing.  They all default to 1 -- this is belt and braces.
hud_splits 1
hud_splits_speed 1
hud_seq 1
hud_seq_pct 1
waitms 200

echo "--- the fixture: expect 1 segment, 3 checkpoints, an end ---"
cmd zone_dests
waitms 500
cmd zone_cps
waitms 500

cmd zone_goto 0
waitms 900

// Out of the box and all the way through cp 1, 2, 3 and the end ring at
// 800-1600 units out -- about 6 s of walking at 260 u/s, so hold it for 8.
// Jump along the way: each jump is one air segment of ~0.66 s, comfortably over
// SEG_MINTIME, and each closed segment is one row in the energy column.  A
// single tap gives one row and the complaint was about a COLUMN, so: six.
+back
waitms 400
+jump
waitms 200
-jump
waitms 700
+jump
waitms 200
-jump
waitms 700
+jump
waitms 200
-jump
waitms 700
+jump
waitms 200
-jump
waitms 700
+jump
waitms 200
-jump
waitms 700
+jump
waitms 200
-jump
waitms 1500
-back
waitms 1000

// NOTHING PRINTS BETWEEN HERE AND THE SHOTS.  con_notifylines 0 did not empty
// the notify area on its own and the report landed straight across the energy
// column, so the reporting moved AFTER the screenshots and `clear` drops what is
// already up.  The state is identical either side -- the run has finished and
// the player is standing still -- so reading it afterwards costs nothing.
clear
waitms 700

screenshot b21-after
waitms 700

// The before: the same rows, put back to the old anchor.  The only honest way to
// show a placement change from inside one build.
hud_splits_x 0.018
hud_splits_y 0.5
waitms 500
screenshot b21-before-position
waitms 700

echo "--- state, read after the shots so it cannot appear in them ---"
cmd timer
waitms 900

echo "--- done ---"
waitms 400
quit
