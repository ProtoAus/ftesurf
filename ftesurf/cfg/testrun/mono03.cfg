// MONO03 -- Build 4, part 3: get OUTSIDE and settle the sky.  Observe only.
//
// mono02 was taken at the map's own info_player_start (3856 -13872 13488), which
// is inside a roofed spawn room -- looking straight up there photographs a
// ceiling, not the sky, so it could not answer the question.  It did surface one
// real defect: a pink/black missing-texture checkerboard on one wall alcove.
//
// surf_monolith's info_teleport_destinations sit at z 15720 against a world max
// of 16320 -- those are the surf stage starts, which on a surf map are open
// rooms bounded by the skybox.  noclip so the camera holds position instead of
// dropping out of frame.
//
// setpos is x y z PITCH YAW ROLL.  Pitch -89 is straight up here (mono02
// confirmed the sign: -89 photographed the ceiling above the spawn).

log_enable 1
log_dir "logs"
log_name "mono03"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
con_notifylines 0
developer 1
log_developer 1

wait 200
map surf_monolith
waitmap 2400
waitms 10000
sv_cheats 1
waitms 300
noclip
waitms 400

echo ^5=== r_fastsky / sky state ===
r_fastsky
waitms 300

echo ^5=== A: stage start, horizon ===
setpos -8192 -15830 15720 0 90 0
waitms 1500
screenshot mono03_a
waitms 700

echo ^5=== B: stage start, looking up ===
setpos -8192 -15830 15720 -70 90 0
waitms 1200
screenshot mono03_b_up
waitms 700

echo ^5=== C: mid-map high, horizon ===
setpos 0 0 15000 0 0 0
waitms 1500
screenshot mono03_c
waitms 700

echo ^5=== D: mid-map high, looking up ===
setpos 0 0 15000 -70 0 0
waitms 1200
screenshot mono03_d_up
waitms 700

echo ^5=== E: near the top of the world, looking up ===
setpos 0 0 16000 -80 45 0
waitms 1200
screenshot mono03_e_top
waitms 700

echo ^5=== mono03 done ===
wait 30
quit
