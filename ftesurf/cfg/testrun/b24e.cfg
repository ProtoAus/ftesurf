// BUILD 24 stage 1b -- the READER's v4 path, against a synthetic recording.
//
// b24c proved the writer: seventeen columns, a reserved `flags` line, and a
// plane whose value is whatever SV_RecNormal says it is.  What it could not
// prove is the interesting half, because a scripted config cannot surf and
// therefore cannot produce a ramp: no ramp means no flags bit 16, no plane, no
// `board` record, and no segment column to build.
//
// data/testrun/v4fix.rec is a HAND-BUILT v4 recording with all four -- 20
// samples of padding, 40 ticks of free air, one board onto a 35-degree plane,
// 45 ticks of riding, then 40 more of air.  reccheck.py passes it and FAILS all
// eight deliberately-corrupted variants of it (a non-unit plane, a plane in free
// air, a bad board normal, a repeated board counter, a missing ramp bit, shadow
// without practice, v3-width columns under a v4 header, and a board record in a
// v3 file).  So the file is known-good input by an independent reader.
//
// WHAT THIS CONFIG SETTLES, and it is the thing stage 1b is for:
//
//   v4 1              the reader recognised the format from the SAMPLE's column
//                     count and not merely from the header key
//   seq N rows        Watch_BuildSeq ran the REAL Board_Frame over the file and
//                     it produced segments.  0 here would mean the build ran and
//                     found nothing, which is the failure that matters
//   seq (M shown)     Watch_SeqApply counted the right rows for the clock, and
//                     counted FEWER after seeking backwards -- which is the one
//                     property a rebuild-from-table has and an accumulator
//                     driven live does not
//   boards 1 (at K)   the board table parsed, and Board_Compute is being run on
//                     the newest event at or before the clock
//   rc / plane        the flags bit and the per-sample plane reach the override
//                     block, which is what the strafe bar is drawn from
//
// It is a FIXTURE and it is deleted afterwards; nothing here writes to
// data/runs, and v4fix.rec's own header says `flags 1` so even if it were found
// by the leaderboard it would read as practice rather than as a time.

developer 1
log_developer 1
cfg_save_auto 0

wait 200
map surf_aesthetic
waitmap 90

echo "=== B24E: open the fixture ==="
replay data/testrun/v4fix.rec
wait 10
replay pause
replay status

echo "=== B24E: t=0, still in free air.  rc 0, no plane, no rows yet ==="
replay seek 0
replay status

echo "=== B24E: t=0.20, deep in the first air time ==="
replay seek 0.2
replay status

echo "=== B24E: t=0.50, ON THE RAMP.  rc 1, a unit plane, board 0 applied ==="
replay seek 0.5
replay status

echo "=== B24E: t=1.00, off the end and airborne again ==="
replay seek 1
replay status

echo "=== B24E: the end.  every row the run produced is shown ==="
replay seek end
replay status

echo "=== B24E: BACKWARDS to t=0.2.  rows shown must DROP, boards go to -1 ==="
echo "--- this is the one thing an accumulator could not do ---"
replay seek 0.2
replay status

echo "=== B24E: and forward again to exactly where we were ==="
replay seek 1
replay status

echo "=== B24E: speed is a clock -- 4x must not change what is shown ==="
replay speed 4
replay seek 1
replay status
replay speed 1

echo "=== B24E: the path ribbon's own cvars ==="
hud_watch_path_width
hud_watch_path
hud_watch_path_ahead

echo "=== B24E: stop, and the player's own column is handed back ==="
replay stop
replay status
wait 20

echo "=== B24E: regression ==="
pm_selftest
zone_selftest

echo "=== B24E: done ==="
wait 30
quit
