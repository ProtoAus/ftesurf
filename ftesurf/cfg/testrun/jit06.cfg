// BUILD 47 / ENGINE PATCH 269 -- verifying the velocity-blend fix.
//
// jit05 established the mechanism with the arithmetic closed to four decimals:
// standing still one second after a tap, at ~19 rendered frames per command,
// from.state->velocity was FROZEN at 5.2500 across 380 of 400 frames while
// to.state->velocity was 0.0000 and the origin did not move at all.  The blend
// (1-f)*5.25 then swept 0..4.958 as f ramped per rendered frame.  Patch 269
// stops blending velocity while predicting and takes to.state's value, which is
// the freshly predicted one.
//
// FOUR SECTIONS, and section 2 is the one that makes the other three mean
// something -- it puts the OLD behaviour back on the same map, at the same
// framerate, in the same run, so a clean section 1 cannot be a capture that
// simply failed to reproduce (which is exactly how jit04 fooled itself).
//
//   1. velblend 0, after a tap   -> expect 0 nonzero.  The fix.
//   2. velblend 1, after a tap   -> expect ~380 nonzero, max ~5.  The bug, on
//                                   demand, proving the regime is right.
//   3. velblend 0 again          -> expect 0 nonzero.  Proves 2 was the
//                                   variable and not the passage of time.
//   4. velblend 0, KEY HELD      -> expect 400 nonzero, max ~260, origin
//                                   MOVING.  The no-regression control: a real
//                                   velocity must still be reported in full.
//                                   A "fix" that just zeroes the readout would
//                                   pass 1-3 and fail here.
//
// Check the frames-per-command line on every section before reading any of it.

log_developer 1

waitms 2000

map surf_colin_blaster_69000
waitmap 240
wait 60

cl_idlefps 0
cl_maxfps 0
hud_debug 1
hud_speed 1
waitms 500

echo ^5=== 1: velblend 0 (Patch 269) after a tap -- expect ZERO nonzero
cl_predict_velblend 0
+forward
waitms 250
-forward
waitms 1000
cl_predtrace 400
waitms 3000

echo ^5=== 2: velblend 1 (pre-269) after a tap -- expect the bug back
cl_predict_velblend 1
+forward
waitms 250
-forward
waitms 1000
cl_predtrace 400
waitms 3000

echo ^5=== 3: velblend 0 again -- expect ZERO nonzero
cl_predict_velblend 0
+forward
waitms 250
-forward
waitms 1000
cl_predtrace 400
waitms 3000

echo ^5=== 4: velblend 0, KEY HELD -- real velocity must survive in full
cl_predict_velblend 0
+forward
waitms 400
cl_predtrace 400
waitms 3000
-forward
waitms 500

echo ^5=== END OF RUN ===
wait 20
quit
