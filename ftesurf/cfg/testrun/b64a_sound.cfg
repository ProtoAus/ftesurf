cfg_save_auto 0

// ===========================================================================
// BUILD 64, ARM SET A -- ambient_generic, the first server-side sound in the
// project.
//
// Before this build there were ZERO precache_sound and ZERO sound() calls in
// the whole server QC, so "does it work" is not a question about an input
// ladder -- it is a question about a subsystem that did not exist.
//
// WHAT IS BEING TESTED.  ambient_generic splits into two buckets, for two
// engine reasons rather than for taste:
//
//   STATIC   ambientsound() -> sv_staticsounds[], replayed to every client at
//            prespawn (sv_user.c:1823).  Reaches late joiners free, costs
//            nothing per frame, and S_StaticSound force-loops it forever
//            (snd_dma.c:3385) -- so it can ONLY take an entity that never
//            needs stopping, re-levelling, re-pitching or re-aiming.
//   DYNAMIC  sound(), started from the tail of SV_EntityIOBuild, driven by
//            PlaySound/StopSound/ToggleSound/Volume/Pitch, and re-sent to each
//            joining player by SV_AmbientResend.
//
// THE PREDICTIONS BELOW WERE COMPUTED OFFLINE, BEFORE THE RUN, by running the
// same bucket test over each map's entity lump (scratchpad/sndarms.py).  A
// number written after the run is not evidence, and the whole point of the
// split is that it is checkable from outside the game.
//
// PRE-REGISTERED.  `ent_io` must print, per arm, exactly:
//
//   ARM  map                     expected "sound:" line
//   S1   kz_secret_temple        77 static, 6 dynamic (0 loop(s) playing)
//   S2   surf_era                0 static, 163 dynamic (62 loop(s) playing)
//   S3   bhop_floodwaters        (no sound line at all) + yellow: 73 soundscript
//   S4   surf_lt_unicorn         24 static, 55 dynamic (0 loop(s) playing)
//   S5   surf_kitsune            0 static, 1 dynamic (0 loop(s) playing)
//   S6   bhop_miku_v2            0 static, 12 dynamic (0 loop(s) playing)
//   S7   surf_halloween_tf2      0 static, 280 dynamic (0 loop(s) playing)
//   S8   kz_secret_temple        identical to S1 -- the restore arm
//
// S1 IS THE ARM THAT DECIDES WHETHER THE STATIC BUCKET WORKS.  77 of its 83
// ambients qualify: no targetname, audible at spawn, looping, pitch 100.  If
// the bucket test is wrong in either direction this is where it shows, because
// no other arm has a static majority.
//
// S2 IS THE ARM THAT DECIDES WHETHER THE DYNAMIC BUCKET WORKS, and it is also
// the precache ceiling: surf_era needs 91 distinct sounds, the most of any map
// in the library, against MAX_PRECACHE_SOUNDS of 4096 (bothdefs.h:934), whose
// overflow is a fatal PR_BIError.  45x headroom, but it is the only map where
// the number is worth reading rather than assuming.  62 of its 163 dynamic
// ambients are looping-and-audible, so the playing count is a real assertion
// about SV_EntityIOBuild's start pass and not just about parsing.
//
// S3 IS THE HONEST-SCOPE-CUT ARM.  bhop_floodwaters is 73 ambients and not one
// of them names a file: every message is a SOUNDSCRIPT name resolved through
// Source's scripts/game_sounds*.txt, which this game has no parser for.  The
// map MUST report them in yellow rather than precaching 73 names no client can
// load.  It MUST NOT print a "sound:" line, because nothing was set up.
//
// S5 IS THE BUILD 63 REGRESSION ARM.  surf_kitsune must STILL show
// 28 reference(s) repaired / 50 output(s) wired / 1 spawned DISABLED, and must
// still report "no refusals".  Its secret button is wired OnIn -> music
// PlaySound, so the one dynamic ambient is reachable by an actual press.
//
// S6 IS THE CAP ARM.  bhop_miku_v2 must still load and still name the
// per-entity output ceiling in red.  Adding a subsystem must not re-break the
// map build 63 made loadable.
//
// ANY "sound:" LINE THAT DOES NOT MATCH ITS ROW IS A FINDING, in either
// direction: too few means the bucket test rejected something it should have
// taken, too many means it claimed something it cannot honour.
// ---------------------------------------------------------------------------
// RESULTS, 2026-09-13.  logs/b64a_sound.log.  qwprogs.dat 1112058.
//
//   ARM  map                   predicted                 actual
//   S1   kz_secret_temple      77 static / 6 dyn / 0      77 / 6 / 6   <-- MISS
//   S2   surf_era              0 / 163 / 62               0 / 163 / 62   ok
//   S3   bhop_floodwaters      no sound line, 73 script   exactly that   ok
//   S4   surf_lt_unicorn       24 / 55 / 0                24 / 55 / 0    ok
//   S5   surf_kitsune          0 / 1 / 0, and 28/50/1     all four       ok
//   S6   bhop_miku_v2          0 / 12 / 0, loads, capped  all three      ok
//   S7   surf_halloween_tf2    0 / 280 / 0                0 / 280 / 269  <-- MISS
//   S8   kz_secret_temple      identical to S1            identical      ok
//
// SIX OF EIGHT ARMS HIT EXACTLY.  The classification works: the bucket test,
// the soundscript skip, the precache of surf_era's 91 distinct sounds (the
// library's worst case, against a 4096 ceiling), and build 63's numbers all
// came through untouched.
//
// THE TWO MISSES ARE THE SAME MISS AND IT IS IN THE PREDICTION, NOT THE CODE.
// The offline predictor counted only the ambients that start at SPAWN (those
// without SF_AMBIENT_STARTSILENT).  It did not count the ones a map STARTS
// WITH I/O.  Both missed arms are maps whose logic_auto fires PlaySound on
// OnMapSpawn: kz_secret_temple starts 6 that way, surf_halloween_tf2 starts
// 269.  The engine was right and the prediction was incomplete, which is the
// better direction to be wrong in, but it is still a prediction that could not
// have caught what happened next.
//
// ===========================================================================
// AND THEN S7 BLEW SOMEONE'S SPEAKERS.  This is the important part of this
// file and it is written up rather than summarised away.
//
// surf_halloween_tf2 has 253 ambient_generic sharing ONE targetname, ONE
// sample (ambient/levels/canals/toxic_slime_loop1.wav) and radius 6100, and a
// single `logic_auto OnMapSpawn -> security_ambience_slime PlaySound` starts
// every one of them.  SV_IODeliver firing an input at every entity holding a
// targetname is correct and is what Source does, so the 253 emitters and the
// 269 loops are AUTHENTIC.  The map really is like that.
//
// What was wrong was how far each one carried.  This build converted Source's
// radius with `attenuation = 1000 / radius`, reasoning that FTE fades a
// channel linearly to silence at snd_nominaldistance / attenuation
// (snd_dma.c:3383) so the audible distance would match exactly.  Every step of
// that is true.  It is still wrong, because SOURCE DOES NOT FADE LINEARLY --
// it fades in dB, and matching the distance at which a sound reaches ZERO says
// nothing about how loud it is anywhere before that point.  Radius 6100 should
// give attenuation 0.578; it gave 0.164.  A hundred-odd full-volume copies of
// one slime loop ended up stacked on top of each other across the whole map.
//
// THE INSTRUMENT FAILURE IS WORSE THAN THE ARITHMETIC ONE, and it is the thing
// to carry forward.  The evidence was IN THIS LOG: S7 printed "269 loop(s)
// playing" against a pre-registered prediction of 0.  A 269-fold miss, in
// plain text, in a file that was then read for whether the maps loaded.  A
// person reported it before the log did.
//
// Two things follow, and both are in arm set B:
//   * every count in this report was CORRECT, and no combination of them could
//     have expressed the failure -- the number that was wrong (attenuation)
//     existed only inside the sound packet and was never printed.  Hence the
//     new "widest ambient: attn X, audible ~Y units" line.
//   * a correct number nobody reads is not an instrument.  Hence the yellow
//     line above 32 simultaneous loops.
//
// This is the same lesson as build 63's output cap, arriving from the other
// side: there, a cap that REPORTED could be shown to be in the wrong place.
// Here, a report that could not express the failure left the wrong number
// invisible until it was audible.
//
// Superseded by cfg/testrun/b64b_falloff.cfg, which fixes the conversion and
// verifies it.  This file is kept unedited above the line, because the
// prediction that was too narrow and the miss it could not catch are the
// record of how this was found.
// ---------------------------------------------------------------------------
// ===========================================================================

log_enable 1
log_dir logs
log_name b64a_sound
developer 1
log_developer 1
cl_maxfps 100
con_notifylines 0

// The engine is not ready yet -- a map issued here is silently dropped, and
// `wait` counts FRAMES while `waitmap` is a TIMEOUT IN SECONDS.
waitms 5000

echo ^5=== S1: kz_secret_temple -- the STATIC bucket (77 static / 6 dyn) ===
map kz_secret_temple
waitmap 45
waitms 6000
ent_io
waitms 1500
ent_census
waitms 1500

echo ^5=== S2: surf_era -- the DYNAMIC bucket + precache ceiling (163 / 91) ===
map surf_era
waitmap 60
waitms 8000
ent_io
waitms 1500
ent_census
waitms 1500

echo ^5=== S3: bhop_floodwaters -- 73 SOUNDSCRIPT names, all skipped ===
map bhop_floodwaters
waitmap 45
waitms 6000
ent_io
waitms 1500
ent_census
waitms 1500

echo ^5=== S4: surf_lt_unicorn -- mixed (24 static / 55 dyn) ===
map surf_lt_unicorn
waitmap 45
waitms 6000
ent_io
waitms 1500
ent_census
waitms 1500

echo ^5=== S5: surf_kitsune -- build 63 regression, 28/50/1 ===
map surf_kitsune
waitmap 45
waitms 6000
ent_io
waitms 1500
ent_census
waitms 1500

echo ^5=== S6: bhop_miku_v2 -- must still load, cap still reported ===
map bhop_miku_v2
waitmap 90
waitms 12000
ent_io
waitms 2500

echo ^5=== S7: surf_halloween_tf2 -- 280 dynamic, the library's most ===
map surf_halloween_tf2
waitmap 45
waitms 6000
ent_io
waitms 1500
ent_census
waitms 1500

echo ^5=== S8: kz_secret_temple again -- the restore arm ===
map kz_secret_temple
waitmap 45
waitms 6000
ent_io
waitms 2500

echo ^5=== END OF RUN ===
quit
