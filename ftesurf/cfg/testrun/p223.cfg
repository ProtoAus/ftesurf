// P223 -- WHY is the nested doorway black?  It is not being drawn at all.
//
// p222 showed r_portalrecursion 2 and 1 give a pixel-identical doorway, and the
// log says why:  "portals: 1 scene renders last frame" at this camera.  Only the
// depth-0 door gets a scene.  The nested door is not out of budget -- it is not
// in the list.  GLBE_SubmitMeshesPortals returns at gl_backend.c:5883 when the
// recursed view has no portal batches at all.
//
// The suspect is FS_PortalPredraw (cl_portal.qc:159-203).  predraw runs ONCE per
// frame, during the main view's addentities, and its verdict is final for every
// recursed view in that frame.  It culls against
//     eye = getproperty(VF_ORIGIN)
// -- the player's real eye -- on four tests: noclip, behind-the-plane
// (d * lpd_fa <= 0), distance (vbsp_portal_dist, default 3000), and
// checkpvs(eye, self).  A door that is behind you, too far, or out of your PVS is
// therefore never offered to the renderer, EVEN WHEN IT IS THE THING YOU ARE
// LOOKING AT THROUGH A PORTAL, where the recursed eye is right in front of it.
//
// vbsp_portal_debug 1 prints one line per door that survives, with its distance.
//
//   A  defaults                    -- the baseline black doorway
//   B  vbsp_portal_dist 0            -- distance cull off ("0 = no limit")
//   C  vbsp_portal_dist 0 + noclip   -- noclip returns PREDRAW_NEXT for EVERY door,
//                                     so this must be strictly worse; it is the
//                                     control that proves the cull is what moves.
//
// If B lights the nested doorway, the cull is the bug and the fix is to run it
// from the recursed eye, or not at all for a door already inside a portal view.

cfg_save_auto 0
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "p223"
scr_sshot_type png
cl_yieldcpu 0
cl_maxfps 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0
vbsp_portal_render 1
vbsp_portal_debug 1
r_portalfbo 1
r_refract_fbo 1
r_portalrecursion 2
r_portalmaxviews 2
r_portaldebug 0

waitms 2500
map surf_kitsune
waitmap 240
waitms 8000
sv_cheats 1

setpos -15360 -15252 870 0 270 0
fov 20
waitms 2500

echo "@@@ P223 A -- vbsp_portal_dist 3000 (default)"
vbsp_portal_dist 3000
waitms 2000
screenshot_mega p223_A_dist3000 1280 720
waitms 800

echo "@@@ P223 B -- vbsp_portal_dist 0, distance cull disabled"
vbsp_portal_dist 0
waitms 2500
screenshot_mega p223_B_distoff 1280 720
waitms 800

echo "@@@ P223 C -- vbsp_portal_dist 100, distance cull very tight (control)"
vbsp_portal_dist 100
waitms 2000
screenshot_mega p223_C_dist100 1280 720
waitms 800

echo "@@@ P223 DONE"
vbsp_portal_dist 3000
vbsp_portal_debug 0
fov 90
waitms 1000
quit
