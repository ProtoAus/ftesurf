// cfg_save_auto 0: this run sets archived cvars (vid_*, cl_maxfps); never let it write them into ftesurf.cfg (cl_main.c:2535)
cfg_save_auto 0
// em_shade -- surf_shade: 339 func_dustmotes at SpawnRate 10; the budget throttle, and the opened-guard retry.
log_dir "logs"
log_name "em_shade"
log_enable 1
developer 1
log_developer 1
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000
cl_maxfps 0
cl_idlefps 0
cl_yieldcpu 0
sv_cheats 1
wait 200
map surf_shade
waitmap 600
waitms 2000
noclip
// the CT spawn; the nearest mote box is 167 units away at -984 360 -184
setpos -1120 288 -248 0 30 0
waitms 9000
echo ^5=== S1 cull on: 15 of 339 inside DistMax 1024 from here
emit_list
r_partinfo
screenshot em_shade_s1_x
waitms 700
screenshot em_shade_s1
waitms 700
echo ^5=== S2 cull off: all 339, demand 3390 against budget 2000
set vbsp_emit_dist 0
waitms 9000
emit_list
r_partinfo
screenshot em_shade_s2_x
waitms 700
screenshot em_shade_s2
waitms 700
echo ^5=== S3 Source-exact blocks (S 5..12 here: half 0.24..0.58 px at 720p, sub-pixel in Source too)
exec particles/ftesurf_src.cfg
waitms 9000
r_partinfo
screenshot em_shade_s3_x
waitms 700
screenshot em_shade_s3
waitms 700
set vbsp_emit_dist 1
echo ^5=== S4 cross-map latch only; the opened guard has no cfg-forced falsifier
map surf_boreas
waitmap 600
waitms 2000
map surf_shade
waitmap 600
waitms 3000
emit_list
quit
