// G4 sweep batch 8 -- generated, do not hand-edit.
// Loads each map, settles, then records BOTH what was drawn (r_speeds) and how bright it
// came out (screenshot).  developer/log_developer stay OFF: the "Skyroom position ... in
// solid" DPrintf floods thousands of lines per second whenever the view is outside the
// world, which is what killed the previous run.
cfg_save_auto 0
developer 0
log_developer 0
scr_sshot_type png
cl_yieldcpu 0
cl_maxfps 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0
r_speeds 2
vbsp_portal_render 1
r_portalscissor 1
waitms 2000

map sj_mom_training
waitmap 240
waitms 5000
echo "@@@MAP sj_mom_training ver=21 doors=8"
r_speeds_dump
waitms 400
screenshot_mega g4_sj_mom_training 1280 720
waitms 400

