// FTESurf Build 37: the banner draws on hl2_unresolved_visible, not on the raw count.
//
// surf_aesthetic is the case that makes this legible.  With hl2_bottommaterial 0 it
// has one unresolved material on 325 faces -- visible, so the banner is correct and
// must appear.  With it 1 the material resolves, the count is 0, and nothing draws.
//
// A different map is loaded in between on purpose: `map x` twice in a row does not
// reload the world model, so the second half would otherwise screenshot the first.
//
// fs_missingwarn 1, because the banner is the subject.
log_enable 1
log_name p233banner
developer 1
log_developer 1
cfg_save_auto 0
cl_idlefps 0
sv_cheats 1
fs_missingwarn 1

wait 200
echo ^5=== banner SHOULD appear (hl2_bottommaterial 0, 1 miss on 325 faces) ===
hl2_bottommaterial 0
map surf_aesthetic
waitmap 900
wait 150
hl2_unresolved
hl2_unresolved_visible
waitms 400
screenshot
waitms 800

map surf_demise
waitmap 900
wait 60

echo ^5=== banner should NOT appear (hl2_bottommaterial 1, 0 misses) ===
hl2_bottommaterial 1
map surf_aesthetic
waitmap 900
wait 150
hl2_unresolved
hl2_unresolved_visible
waitms 400
screenshot
waitms 800

echo ^5=== p233banner done ===
wait 30
quit
