// H11 -- is the far view never RENDERED, or rendered and never SAMPLED?
//
// Patch 210 changed how an aperture is drawn: the far view is rendered into an
// FBO texture and scripts/portal.shader's pass paints that texture onto the quad
// via `map $refraction`.  So there are two completely separate places the image
// can be lost, and everything measured so far cannot tell them apart:
//
//   * the recursed SCENE draws nothing            -> nothing to sample
//   * the scene draws fine into the texture, and  -> the texgen picks the wrong
//     the quad samples the wrong thing               tex_refraction[] slot, or
//                                                    T_Gen_CurrentRender's
//                                                    `if (r_refdef.recurse) return`
//
// portal.shader documents its own A/B for exactly this, so use it rather than
// guessing:
//
//   r_portalfbo 1   Patch 210 -- FBO texture, painted per-polygon
//   r_portalfbo 0   `portalfbo` sets SHADER_NODRAW instead, and the aperture
//                   reverts to the Patch 207 design: recursed in place over the
//                   whole screen and masked off, bounded by r_portalscissor
//
// The cvar is read at PARSE time, so each arm needs a vid_reload to take.
//
//   far side appears under r_portalfbo 0 -> the scene renders; the FBO/texgen
//                                           path is losing it
//   still black under both               -> the recursed scene itself draws
//                                           nothing, and the FBO is innocent
//
// The old renderer's symptom is a SQUARE larger than the doorway (that is Patch
// 208's scissor-rectangle, the thing 210 replaced), so "a square of rainbow" is a
// PASS here, not a new bug.  Arm 3 returns to 1 as the control.
//
// Camera is the 20-unit standoff, where the aperture fills the frame and the
// through-view measured 3.9 brightness against 90.5 for the same room on foot.

cfg_save_auto 0
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "h11"
scr_sshot_type png
cl_yieldcpu 0
cl_maxfps 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0
r_voidvis 1
vbsp_portal_render 1

waitms 2500
map surf_kitsune
waitmap 240
waitms 8000
sv_cheats 1

setpos 0 -560 184 0 90 0
waitms 3000
setpos 0 -540 184 0 90 0
waitms 3000

echo "@@@ H11 arm 1 -- r_portalfbo 1 (Patch 210, current)"
screenshot_mega h11_fbo1 1280 720
waitms 600

echo "@@@ H11 arm 2 -- r_portalfbo 0 (Patch 207 renderer)"
r_portalfbo 0
vid_reload
waitms 6000
setpos 0 -540 184 0 90 0
waitms 3000
screenshot_mega h11_fbo0 1280 720
waitms 600

echo "@@@ H11 arm 3 -- back to r_portalfbo 1 (control)"
r_portalfbo 1
vid_reload
waitms 6000
setpos 0 -540 184 0 90 0
waitms 3000
screenshot_mega h11_fbo1b 1280 720
waitms 600

echo "@@@ H11 DONE"
waitms 1000
quit
