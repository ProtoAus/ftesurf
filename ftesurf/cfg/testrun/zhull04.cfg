// BUILD 47 stage 4 -- the LEGACY BSP zone path, which nothing else in this
// build's verification touches.
//
// zhull02/03 both ran maps whose zones come from JSON ("source maps/zones/
// local" / "online").  The C6 change is on the OTHER loader: SV_ZoneLoadFromBsp
// builds zones from e.absmin/e.absmax, which SV_LinkEdict has already grown by
// one unit on all six faces (world.c:653-662).  That epsilon is a collision
// margin, not authored geometry, and it made the server test a box two units
// bigger per dimension than cl_zones.qc draws -- so the two VMs have disagreed
// about every legacy zone since the loader was written.  Build 47 deflates it.
//
// WHAT TO CHECK
//   * zone_list reports source ^bsp^ -- if it says local/online this map is not
//     exercising the path and the test proves nothing
//   * the bottom..top column is the BRUSH, not brush+2
//   * zones still load at all: a deflation that inverted a thin box would show
//     up as a missing or degenerate zone here, not as a wrong number
//
// PICKING THE MAP IS THE HARD PART and the first attempt got it wrong.
// "No zone JSON" is necessary but nowhere near sufficient: 776 of the 1317
// installed maps have no JSON, and only 32 of those carry any
// trigger_momentum_timer_* brush at all -- the rest simply have no timer.
// surf_rebel_resistance and bhop_1n5an3 were the first two JSON-less maps
// alphabetically, both reported `0 zones, source none`, and proved nothing.
//
// surf_summer_ksf carries 12 timer entities and surf_a 6, so both reach the
// loader.  (Scan: scratchpad/legacyzones.py.)

waitms 2000

map surf_summer_ksf
waitmap 240
wait 30

echo ^5=== summer_ksf: legacy BSP zones -- source MUST read bsp ===
zone_list
wait 10
cmd zone_dests
wait 20

map surf_a
waitmap 240
wait 30

echo ^5=== surf_a: legacy BSP zones ===
zone_list
wait 20

echo ^5=== END OF RUN ===
wait 10
quit
