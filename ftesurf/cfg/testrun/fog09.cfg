// FOG09 -- surf_boreas: props and brush models reportedly ignore fog.
// The aim-free probe: fog ending at ONE unit makes every world pixel 100% red.
// Anything still showing its texture is a surface the fog is not reaching, and
// the picture names it directly -- no sightline argument possible.
log_enable 1
log_dir "logs"
log_name "fog09"
cfg_save_auto 0
cl_maxfps 0
vid_fullscreen 0
con_notifytime 0
con_notifylines 0
con_notifytime_error 0
vbsp_fog 0
r_fog_linear 1
wait 200
map surf_boreas
waitmap 1800
waitms 13000
echo ^3--- map's own fog first
vbsp_fog 1
waitms 1500
fog
waitms 400
screenshot fog09_boreas_mapfog
waitms 900
echo ^3--- RED probe, end=1: everything drawn must be solid red
fog 1 1 0 0 1 0
waitms 1800
screenshot fog09_boreas_red
waitms 900
echo ^3--- same probe, props off, to separate props from brush models
hl2_propdist 1
waitms 1800
fog 1 1 0 0 1 0
waitms 1200
screenshot fog09_boreas_red_noprops
waitms 900
hl2_propdist 0
waitms 1200
echo ^5=========== done =====
log_enable 0
