// MONO02 -- Build 4, part 2: does the SKY actually render?  Still observe-only.
//
// mono01 answered three of the four questions and answered them differently
// from what the plan expected:
//
//   fs_automount_state = 2, spec "steam:Team Fortress 2/tf,
//   steam:Counter-Strike Global Offensive/csgo"     -> the mapdeps.txt entry
//   the plan wanted written ALREADY EXISTS, and the packs are served from the
//   asset cache.  No "not proven" lines, so the cache is complete.
//
//   hl2_unresolved 0, hl2_unresolved_visible 0      -> the plan expected 44.
//   The only two names that failed are levelshots/surf_monolith and
//   maps/surf_monolith, both loaded AFTER the map and both the loading-screen
//   image, not world materials.
//
//   no sky "sky138a": ... line at all                -> gl_shader.c:993-1001
//   only prints when a face is MISSING or a t-scale is not 1.  Silence means
//   all six faces loaded at normal scale.  The absence IS the reading.
//
// mono01's screenshot confirmed the world textures are fine -- but it was taken
// at setpos 0 0 0, which is indoors, so it could not show the sky.  This run
// spawns normally and looks UP and around, which is the only thing that can
// distinguish "the sky loaded" from "the sky loaded and is drawn".
//
// r_fastsky is printed rather than set: if the sky is a flat colour, the plan's
// downstream suspects are r_fastsky and forcedsky, and reading the value is how
// to tell that apart from a content failure.  Setting it would hide the answer.

log_enable 1
log_dir "logs"
log_name "mono02"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
con_notifylines 0
developer 1
log_developer 1

wait 200
map surf_monolith
waitmap 2400
waitms 10000

echo ^5=== sky-related render state ===
r_fastsky
r_ignoreentpvs
vbsp_skyroom
gl_skyboxname
waitms 400

// surf_monolith's own info_player_start is 3856 -13872 13488, angles 0 90 0
// (read from the entity lump), and worldspawn's skyname is "sky138a".
// setpos takes x y z PITCH YAW ROLL -- mono01 put its -89 in the roll slot by
// mistake and rolled the camera instead of looking up, which is why that shot
// showed a room and proved nothing about the sky.  Both pitch signs are shot
// here so one of them is guaranteed to be aimed at the sky whichever way the
// convention runs.

echo ^5=== A: spawn, horizon ===
setpos 3856 -13872 13490 0 90 0
waitms 1500
cmd run_eyeinfo
screenshot mono02_a_horizon
waitms 800

echo ^5=== B: pitch -60 ===
setpos 3856 -13872 13490 -60 90 0
waitms 1200
screenshot mono02_b_pitchneg
waitms 800

echo ^5=== C: pitch +60 ===
setpos 3856 -13872 13490 60 90 0
waitms 1200
screenshot mono02_c_pitchpos
waitms 800

echo ^5=== D: pitch -89, straight up ===
setpos 3856 -13872 13490 -89 90 0
waitms 1200
screenshot mono02_d_straightup
waitms 800

echo ^5=== E: horizon, opposite yaw ===
setpos 3856 -13872 13490 0 270 0
waitms 1200
screenshot mono02_e_yaw270
waitms 800

echo ^5=== mono02 done ===
wait 30
quit
