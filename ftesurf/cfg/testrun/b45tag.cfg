// B45TAG -- a cheated run stops overwriting last.rec.
//
// THE DEFECT, stated as build 44 shipped it: a cheated run is practice, so it is
// never a personal best; it is not TF_SHADOW unless a save was ALSO loaded; so
// the tag chain fell through to RT_LAST and the run was written as `last.rec`,
// destroying the most recent ORDINARY attempt on that leg.  Five seconds of
// noclip cost you the recording of the run before it -- and the cheated one that
// replaced it is the one recording on the leg nobody will ever want.
//
// It is the identical defect build 17 fixed for shadow runs, one class down, and
// it gets the identical fix: its own tag, its own name.
//
// WHY THE GESTURE HERE IS `noclip` AND NOTHING ELSE.  b44class.cfg finishes a run
// that is cheated AND shadow (it loads a save first), and under build 44 THAT one
// was already safe -- TF_SHADOW caught it and sent it to the archive.  Only a run
// that is cheated and NOT shadow reaches the RT_LAST fall-through, so a save-lock
// anywhere in this file would test the wrong branch and pass.
//
// THE ASSERTION IS OFF DISK, NOT IN THE LOG.  Nothing the game prints says which
// filename it chose.  What this config produces is a finished cheated run; the
// check is `cheat.rec` existing beside an UNTOUCHED `last.rec`, compared against
// the snapshot taken before the run.
//
// Read the trace by the stringcmd order and not by the echoes -- `cmd viewpos` is
// the in-order marker.  See b44class.cfg for why.

log_enable 1
log_dir "logs"
log_name "b45tag"
developer 1
log_developer 1
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0

// The build-44 rule: this cvar is itself a taint, so the boilerplate `sv_cheats 1`
// every older testrun config carries would make the control run below cheated
// before it started.
sv_cheats 0

wait 200
echo ^5=== b45tag: bhop_eazy ===
map bhop_eazy
waitmap 1800
waitms 2500

// ---------------------------------------------------------------------------
// 1. THE CONTROL, and it is the only thing that makes the rest mean anything.
//
// zone_goto with no declared destination drops you on the box FLOOR, so +forward
// in plain MOVETYPE_WALK walks out of the start box and starts a genuinely CLEAN
// run.  EXPECT `class: clean (seg 0 cheat 0 cheatlatch 0)`.
// ---------------------------------------------------------------------------
echo ^5=== b45tag: 1. armed and walking out -- expect CLEAN ===
cmd zone_goto 0 16.18 0
waitms 700
cmd viewpos
cmd timer

+forward
waitms 2200
-forward
waitms 400
cmd viewpos
cmd timer

// ---------------------------------------------------------------------------
// 2. NOCLIP, AND NOTHING ELSE.
//
// One gesture, one bit.  EXPECT a `^3cheated run` line and
// `class: cheated (seg 0 cheat 1 cheatlatch 1)` -- seg 0 is the half that
// matters here: with TF_SEGMENT clear and no save ever loaded, TF_SHADOW is
// clear too, and this run takes the exact path that used to land on last.rec.
// ---------------------------------------------------------------------------
echo ^5=== b45tag: 2. noclip only -- expect CHEATED with seg 0 ===
noclip
waitms 700
cmd viewpos
cmd timer

// ---------------------------------------------------------------------------
// 3. THE FINISH.
//
// Re-aimed first: step 1 left the view on the start->stage heading and +forward
// in noclip flies along the VIEW vector.  -66.46 is the here->end bearing build
// 43's zone_list measurement worked out.
//
// EXPECT on disk afterwards, in data/runs/bhop_eazy/main/:
//
//   cheat.rec        NEW, and `flags 261` -- practice|havepb|cheat, no shadow
//   cheat.view       NEW, the client sidecar, named off the same STAT_FS_RUNTAG
//   last.rec         BYTE-IDENTICAL to the snapshot.  This is the whole test.
//   0005354_pb.*     untouched
//
// And NO .hid: Rec_HidEnd keeps the journal for RT_PB only, so the plan's note
// that a cheated run clobbers "the .rec, .view and .hid" was one file too many.
// ---------------------------------------------------------------------------
setpos 1800 200 144 0 -66.46 0
waitms 600
echo ^5=== b45tag: 3. flying to the end ===
+forward
waitms 7000
cmd viewpos
cmd timer
waitms 3000
-forward
cmd viewpos
cmd timer

echo ^5=== b45tag: done ===
waitms 600
quit
