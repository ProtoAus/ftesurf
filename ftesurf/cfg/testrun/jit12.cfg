// ***************************************************************************
//  ENERGY GAINS OVER A JUMP -- and the prime suspect is Patch 269 itself.
//
//  Report: in colin_blaster's start zone, jump, and `e` starts near 57 and
//  climbs to ~60 during the flight.  Momentum holds a solid 57.
//
//  57 is not a coincidence: pm_jumpvelocity is sqrt(2*800*57) = 301.9933774,
//  so the impulse's own apex is 301.9933774^2 / (2*800) = exactly 57.0, and
//  E = z + |v|^2/(2g) is conserved under gravity.  A jump should therefore
//  read 57.00 flat from takeoff to landing.  It gains ~3.
//
//  THE SUSPECT.  Patch 269 stopped blending the reported velocity and left the
//  reported POSITION blended -- deliberately, and stated as safe because
//  "nothing feeds simvel back into the mover".  That is true of the MOVER and
//  false of the READOUTS, because energy combines the two halves:
//
//      simorg_z = (1-f)*z_from + f*z_to        <- still blended (269 left it)
//      simvel   = v_to                         <- no longer blended (269)
//
//  z_to - z_from is about v_z*dt, so the position lags the velocity by
//  (1-f)*v_z*dt and the energy inherits the error:
//
//      E_error = -(1-f) * v_z * dt
//
//  At takeoff v_z = +302 and dt = 0.015, so the error runs to -4.53 units and
//  E reads LOW; at the apex v_z = 0 and the error vanishes; falling, v_z is
//  negative and E reads HIGH by up to +4.53.  That is a climb of about 4.5
//  units across a jump, in the reported direction, appearing exactly when 269
//  landed -- which is when the user noticed it.
//
//  Before 269 both halves were blended consistently and the same algebra gives
//  E_error = 0.5*g*dt^2*(f^2 - f), whose worst case is 0.0225 units.  So the
//  prediction is stark and falsifiable: cl_predict_velblend 1 should hold the
//  energy flat to hundredths, and 0 should show the climb.  If BOTH climb, the
//  cause is in the mover and this whole theory is wrong.
//
//  No QC instrument is needed: cl_predtrace already records simorg and simvel
//  per rendered frame, so E = z + |v|^2/1600 is computable from the dump.  The
//  anchor is constant during flight, so drift shows up without it.
// ***************************************************************************

log_developer 0

waitms 2000

map surf_colin_blaster_69000
waitmap 240
wait 60

cl_maxfps 0
cl_idlefps 0
cl_yieldcpu 0
hud_predicted 1
hud_debug 1
hud_speed 1
hud_energy 1
hud_energy_ref 1
wait 200

// A jump is 2*301.9933774/800 = 0.755 s of flight.  At the ~1300 fps this
// harness reaches that is about 980 rendered frames, so 1500 covers takeoff,
// apex and landing with room at both ends.

// ---------------------------------------------------------------------------
echo ^5=== 1: JUMP with the SHIPPED behaviour (velblend 0, i.e. Patch 269).
echo ^5    Predicted: E climbs about 4.5 units from takeoff to landing.
// ---------------------------------------------------------------------------
cl_predict_velblend 0
waitms 500
cl_predtrace 1500
+jump
waitms 120
-jump
waitms 20000

// ---------------------------------------------------------------------------
echo ^5=== 2: THE SAME JUMP with the PRE-269 blend (velblend 1).
echo ^5    Predicted: E flat to hundredths.  If this also climbs, the theory
echo ^5    is wrong and the cause is in the mover, not in the readout pair.
// ---------------------------------------------------------------------------
cl_predict_velblend 1
waitms 1500
cl_predtrace 1500
+jump
waitms 120
-jump
waitms 20000

// ---------------------------------------------------------------------------
echo ^5=== 3: standing still, velblend 0 -- the null case.
echo ^5    v_z is 0, so the predicted error is 0 and E must be flat.  This is
echo ^5    the control that separates "the pair is inconsistent" from "energy
echo ^5    is just noisy".
// ---------------------------------------------------------------------------
cl_predict_velblend 0
waitms 1500
cl_predtrace 800
waitms 12000

cl_predict_velblend 0
echo ^5=== END OF RUN ===
wait 20
quit
