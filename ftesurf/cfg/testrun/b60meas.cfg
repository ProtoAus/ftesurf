// FTESurf build 60 -- THE SWEEP, MEASURED, AND THE RE-SYNC CASE THAT KILLED V2.
//
// THREE VERSIONS OF THIS CHANGE AND TWO OF THEM WERE WRONG, so this run exists
// to check the third against the two failures rather than against a prediction:
//
//   v1  counted cheap confirmations, reset on each full answer.  Measured
//       9 / 50 / 14 frames per sweep on three consecutive frames: every glare
//       shared a phase, so one sweep in nine cost the full five rays for
//       everything and took as long as build 59's.  Good mean, build 59's WORST
//       case, and the worst case is what was reported as "up to 1 sec".
//   v2  seeded the first period per glare.  Fixed the load case only: one sweep
//       with the shortcut off -- vbsp_glare_adaptive 0, vbsp_glare_rays 1 or
//       vbsp_sprite_source 0, i.e. EVERY A/B arm in this file -- wrote the same
//       value to every glare and re-synchronised the map permanently.  Three of
//       four review lenses found that independently.
//   v3  a visit counter that never resets; a glare is due a full re-check when
//       its count and its INDEX agree modulo adapt+1.  Phase is a property of
//       the index, so there is no history for a toggle to destroy.
//
// AND THE SWEEP FIGURE IS NOW MEASURED RATHER THAN DERIVED.  The build 59
// census divided by glares TRACED, which pretends a culled glare does not
// advance the cursor; corrected to divide by VISITS, it still rested on this
// frame's visit count being typical of the sweep, and it is not -- the loop
// stops when the ray budget runs out, so a frame crossing culled glares reports
// 160 visits and one crossing lamps reports 20.  A sweep IS one wrap of the
// cursor, so the census now counts frames between wraps.  No denominator.
//
// ===================================================================
// PREDICTION, REGISTERED BEFORE THE RUN
// ===================================================================
//   A  adaptive 8, traces 40, fresh from load   sweep ~4-12 frames
//   B  adaptive 0, traces 40                    sweep ~38-54 frames (build 59)
//   C  adaptive 8 again, AFTER B                MUST match A.  This is the v2
//                                               failure: if C is much worse
//                                               than A, or if any sample reads
//                                               5.00 rays/glare with `forced`
//                                               equal to every traced glare,
//                                               the phase spread is still being
//                                               destroyed by the toggle.
//   D  adaptive 8, traces 12                    the deliverable: B's latency or
//                                               better, at ~580-630 fps
//   E  rays 1, then rays 5, adaptive 8          the OTHER re-sync path (v2 lost
//                                               the phase through this one too)
//   F  adaptive 0 again                         control for B
//
// fps is expected to depend ONLY on the ray budget: A/B/C/E/F all 40 rays and
// ~385-415, D ~580-630.  A and C also give the same-setting fps floor.
//
//   FAIL: C's sweep is worse than A's by more than the A-vs-C fps-style spread.
//   FAIL: any adaptive arm shows `forced full` == `traced` on a sample (a whole
//         frame of re-checks = a phase collapse).
//   FAIL: the centre of the frame differs between an adaptive-on and an
//         adaptive-off arm by more than the same-setting floor.
//   FAIL: `forced full` is 0 across every sample of every adaptive arm -- then
//         nothing is re-checking and a glare can hold a stale 0 forever.
cfg_save_auto 0
exec cfg/testrun/_quiet.cfg
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "b60meas"
scr_sshot_type png
cl_yieldcpu 0
vid_vsync 0
crosshair 0
fov 100
con_notifylines 0
con_notifytime 0.01
cl_maxfps 0

r_fog_progless 1
hl2_additivefog 1

waitms 2500
map surf_tensor2
waitmap 240
waitms 8000
sv_cheats 1
noclip
waitms 500

vbsp_sprites 1
vbsp_lightglow 1
vbsp_lightglow_scale 1
vbsp_sprite_source 1
vbsp_glare 1
vbsp_glare_rays 5
vbsp_glare_traces 40
vbsp_glare_cull 1.25
vbsp_glare_brush 2
vbsp_glare_adaptive 8
r_renderscale 1
show_fps 1

setpos -10688.5 -1773.8 -8587.1 6.3 91.1 0
waitms 25000

echo "@@@ B60M A. adaptive 8, traces 40, fresh from load"
waitms 8000
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 700
screenshot b60m_A
waitms 2500

echo "@@@ B60M B. adaptive 0, traces 40 -- build 59"
vbsp_glare_adaptive 0
waitms 8000
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 700
screenshot b60m_B
waitms 2500

echo "@@@ B60M C. adaptive 8 AFTER an adaptive-0 period -- the v2 killer"
vbsp_glare_adaptive 8
waitms 8000
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 700
screenshot b60m_C
waitms 2500

echo "@@@ B60M D. adaptive 8, traces 12 -- the deliverable"
vbsp_glare_traces 12
waitms 8000
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 700
screenshot b60m_D
waitms 2500

echo "@@@ B60M E. rays 1 then 5 with adaptive 8 -- the other re-sync path"
vbsp_glare_traces 40
vbsp_glare_rays 1
waitms 4000
vbsp_glare_rays 5
waitms 8000
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 700
screenshot b60m_E
waitms 2500

echo "@@@ B60M F. adaptive 0 again -- control for B"
vbsp_glare_adaptive 0
waitms 8000
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 700
screenshot b60m_F
waitms 2500

echo "@@@ B60M DONE"
waitms 1200
quit
