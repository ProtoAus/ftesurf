// cfg_save_auto 0: this run sets archived cvars (vid_*, cl_maxfps); never let it write them into ftesurf.cfg (cl_main.c:2535)
cfg_save_auto 0
// Patch 294 -- the verification run for the prop-lighting patch.
//
// SIX ARMS, ONE PROCESS.  hl2_lt_vhv12 and hl2_lt_baked_curve are read during
// Mod_LoadVBSP, not latched, so they CAN be changed between map loads -- what
// they cannot survive is `map <the same name>` twice, which does not reload at
// all (FTE keeps the world model; this is trap 1 and it voided run 294e).  So
// every consecutive pair below is a DIFFERENT map and every arm is a real load.
// One process also removes the cross-run variance entirely.
//
// PREDICTIONS, WRITTEN BEFORE THE RUN.  All six come from an offline emulator
// that replays VBSP_LoadPropBakedLight's arithmetic against the real .vhv files
// in each map's pakfile.  The point of the run is to find out whether the engine
// agrees with it; if it does not, the loader and the model differ and nothing
// further is trustworthy.
//
//   ARM 1  boreas  curve 0 vhv12 1 -- THE GATE.
//          census MUST read 1587 of 1587.
//          mean MUST be  24.7 25.5 26.8
//          pre-294 column MUST be  177.8 183.3 193.4
//          The second column reproduces the old, inflated line exactly; the
//          first is the level that is actually drawn.  Both have to land or the
//          census edit is in the wrong place.
//   ARM 2  fantasy curve 0 vhv12 1 -- census MUST read 2345 of 2345,
//          mean 77.3 79.4 65.9 (+-3%), pre-294 column ~163 161 133.
//   ARM 3  boreas  curve 1 vhv12 1 -- mean MUST be 31.8 32.7 34.0.
//          This is a PREDICTION, not a null control: the new default curve is
//          expected to move the 4-byte maps by +28%, and that is the finding
//          that boreas props have been drawing too bright, not a regression.
//   ARM 4  fantasy curve 1 vhv12 1 -- mean MUST be 78.3 80.3 67.2.
//   ARM 5  boreas  curve 0 vhv12 0 -- MUST be byte-identical to ARM 1.  The
//          12-byte gate must not be able to reach a 4-byte map in either state.
//   ARM 6  fantasy curve 0 vhv12 0 -- census MUST read 0 of 2345.  The pre-294
//          column MUST be 55.3 61.9 53.9, reproducing run 294e arm 1 and so
//          proving this process agrees with that one.  The MEAN column is
//          res_diffuse and has NEVER BEEN MEASURED -- it is the baseline the
//          vhv12 flip is judged against, and it must be >= 55.3 61.9 53.9
//          because res_diffuse is res_ambient plus the directional deviation.
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000
wait 200

developer 1
log_developer 1
log_enable 1
log_dir logs
log_name p294g_census
cl_maxfps 0
cl_idlefps 0
sv_cheats 1
con_notifylines 0
con_notifytime 0.01
con_notifytime_error 0.01
r_drawentities 1
r_texdiag 1
hl2_lt_baked 2
hl2_lt_baked_vc 1

// Lex's own save-locks on surf_fantasy (data/saves/surf_fantasy).
alias lex1 "setpos -9921.6426 -13870.3916 6350.7290 0.7910 -48.8123 0; waitms 2000"
alias lex2 "setpos -8047.4780 -13422.3525 5602.3896 27.4438 153.7427 0; waitms 2000"
alias lex3 "setpos -7821.1230 -13608.8525 4073.5354 -3.3179 41.3910 0; waitms 2000"

// ---------------- ARM 1: boreas, curve 0 -- THE GATE ----------------
hl2_lt_vhv12 1
hl2_lt_baked_curve 0
echo ^5=== p294g ARM 1: boreas curve 0 vhv12 1 -- GATE; expect 1587 of 1587, mean 24.7 25.5 26.8, pre-294 177.8 183.3 193.4
map surf_boreas
waitmap 600
waitms 9000
waitms 3000
prop_census

// ---------------- ARM 2: fantasy, curve 0, BAKED ----------------
hl2_lt_vhv12 1
hl2_lt_baked_curve 0
echo ^5=== p294g ARM 2: fantasy curve 0 vhv12 1; expect 2345 of 2345, mean 77.3 79.4 65.9, pre-294 ~163 161 133
map surf_fantasy
waitmap 600
waitms 9000
waitms 3000
prop_census
noclip
waitms 1000
lex1
screenshot p294g_a2_bake_lex1
lex2
screenshot p294g_a2_bake_lex2
lex3
screenshot p294g_a2_bake_lex3

// ---------------- ARM 3: boreas, curve 1 (the new default) ----------------
hl2_lt_baked_curve 1
echo ^5=== p294g ARM 3: boreas curve 1 vhv12 1; expect mean 31.8 32.7 34.0
map surf_boreas
waitmap 600
waitms 9000
waitms 3000

// ---------------- ARM 4: fantasy, curve 1 (the new default) ----------------
hl2_lt_baked_curve 1
echo ^5=== p294g ARM 4: fantasy curve 1 vhv12 1; expect mean 78.3 80.3 67.2
map surf_fantasy
waitmap 600
waitms 9000
waitms 3000
noclip
waitms 1000
lex1
screenshot p294g_a4_curve1_lex1
lex2
screenshot p294g_a4_curve1_lex2
lex3
screenshot p294g_a4_curve1_lex3

// ---------------- ARM 5: boreas, vhv12 0 -- the gate must not reach it ----------------
hl2_lt_vhv12 0
hl2_lt_baked_curve 0
echo ^5=== p294g ARM 5: boreas curve 0 vhv12 0; MUST be byte-identical to ARM 1
map surf_boreas
waitmap 600
waitms 9000
waitms 3000

// ---------------- ARM 6: fantasy, vhv12 0 -- the pre-294 baseline ----------------
hl2_lt_vhv12 0
hl2_lt_baked_curve 0
echo ^5=== p294g ARM 6: fantasy curve 0 vhv12 0; expect 0 of 2345, pre-294 column 55.3 61.9 53.9, mean UNKNOWN (res_diffuse)
map surf_fantasy
waitmap 600
waitms 9000
waitms 3000
prop_census
noclip
waitms 1000
lex1
screenshot p294g_a6_nobake_lex1
lex2
screenshot p294g_a6_nobake_lex2
lex3
screenshot p294g_a6_nobake_lex3

echo ^5=== END OF RUN ===
waitms 500
quit
