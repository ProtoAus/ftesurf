// FOG10 -- which PROGRAM does a prop material end up on?
// The trees on surf_boreas are models/props_foliage/arbre01 -- VertexLitGeneric
// with no $nofog -- and they render unfogged while world faces go solid red.
// vmt/vertexlit declares !!permu FOG and calls fog4() in the generated header,
// so either the material is not on that program or the permutation is not
// reaching it.  r_showshader needs no aim, unlike shader_here.
log_enable 1
log_dir "logs"
log_name "fog10"
cfg_save_auto 0
cl_maxfps 0
vid_fullscreen 0
vbsp_fog 1
wait 200
map surf_boreas
waitmap 1800
waitms 13000
echo ^3=== PROP material (tree, VertexLitGeneric, no $nofog)
r_showshader models/props_foliage/arbre01
waitms 600
echo ^3=== WORLD material for comparison
r_showshader project_tendies/end_rock01
waitms 600
echo ^3=== another prop-ish one
r_showshader models/props_foliage/arbre01.vmt
waitms 600
echo ^5=========== done =====
log_enable 0
