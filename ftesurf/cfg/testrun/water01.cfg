// WATER01 -- do the Water keys reach vmt/water.glsl?
//
// Five keys stopped being discarded in Patch 251: $refractamount, $reflectamount,
// $refracttint, $reflecttint, $fogcolor and $scale, which water.glsl has had
// #defines for (STRENGTH_REFR/REFL, TINT_REFR/REFL, FOGTINT, TXSCALE1/2) since it
// was written.  679 Water materials across 256 of the library's 1310 maps carry
// at least one of them.
//
// hl2_water DEFAULTS TO 3 -- the dithered flat mode -- which emits vmt/flatdither
// and reads none of this.  So the test has to set hl2_water 2 first, and that is
// also the honest headline for the patch note: this changes modes 1 and 2 only.
//
// The evidence is the prog= string from shader_here, the same instrument that
// settled $seamless_scale after four failed pixel A/Bs.  Expected at hl2_water 2:
//
//   prog=vmt/water#STRENGTH_REFR=...#STRENGTH_REFL=...#TINT_REFR=...,...,...
//        #TINT_REFL=...#FOGTINT=...#TXSCALE1=...#TXSCALE2=...
//
// and at hl2_water 3 no vmt/water program at all.  A material that writes only
// some of the keys should show only those permutations -- the "_set" flags exist
// so that silence and a written zero stay distinguishable.
//
// hl2_water is CVAR_SHADERSYSTEM, so it applies on the next frame; but it is read
// while the material is GENERATED, so the shot order matters: set it before the
// shader_here that is meant to observe it.

log_enable 1
log_dir "logs"
log_name "water01"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
developer 1
log_developer 1
con_notifytime 0
con_notifylines 0
con_notifytime_error 0

wait 200

hl2_water 2
map surf_garden
waitmap 1800
waitms 12000
sv_cheats 1
waitms 400
noclip
waitms 400
slowmo 0
waitms 800

setpos -8964.0 5372.0 5657.4 35 45 0
waitms 2500
shader_here water-garden-hq
waitms 800
developer 0
waitms 1500
screenshot water01_garden_hq
waitms 900

echo ^5---------- hl2_water 3 (the shipped default) --------------------------
developer 1
hl2_water 3
waitms 4000
shader_here water-garden-dither
waitms 800
developer 0
waitms 1500
screenshot water01_garden_dither
waitms 900

echo ^5=========== surf_boreas ===============================================
developer 1
hl2_water 2
map surf_boreas
waitmap 1800
waitms 12000
sv_cheats 1
waitms 400
noclip
waitms 400
slowmo 0
waitms 800
setpos 13564.0 14588.0 332.9 35 45 0
waitms 2500
shader_here water-boreas-hq
waitms 800
developer 0
waitms 1500
screenshot water01_boreas_hq
waitms 900

echo ^5=== water01 done ===
wait 30
quit
