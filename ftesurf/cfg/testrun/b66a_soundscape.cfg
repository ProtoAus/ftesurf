cfg_save_auto 0

// ===========================================================================
// BUILD 66, ARM SET A -- env_soundscape, the feature surf_tensor2 was missing.
//
// WHAT IS BEING TESTED.  Not loudness.  SELECTION.  The user's diagnosis, after
// four builds of instruments chased the wrong quantity: "Leave the loudness
// true, deafening had to do with the fact I could hear pretty much all sounds
// play?  I think if they were correctly playing when they should volume is
// fine?"  So the assertion is that DIFFERENT PLACES GET DIFFERENT AMBIENCE,
// which is something the game has never been able to do.
//
// surf_tensor2 carries 87 env_soundscape naming 30 distinct soundscapes, and
// EVERY ONE OF THEM HAS radius -1 -- "candidate at any distance" -- so the
// winner is decided purely by nearest-with-an-unobstructed-line-of-sight.
// The trace IS the inside/outside mechanism; there is nothing else.
//
// PRE-REGISTERED, computed offline from the entity lump before this run
// (scratchpad/sspred.py).  Each arm setpos's onto a soundscape's own origin,
// where that soundscape is at distance 0 and must win:
//
//   ARM  position                       active MUST be
//   N1   player start                   spawn_outside   (nearest at 80 units)
//   N2   -11776 -11808 13832            spawn_inside
//   N3   -10688 8992 -9792              stage2
//   N4   2240 -15680 496                bonus4
//   N5   back to the start              spawn_outside   -- the restore arm
//   N6   surf_kitsune                   0 entities, system inert
//
// N1 vs N2 IS THE WHOLE POINT and they are 1,824 units apart on one map: if
// those two report the same soundscape, the feature does not work, and no
// other arm matters.
//
// spawn_outside MUST resolve to 3 looping rules, one of them
// ambient/rain_heavy_sc.wav -- the rain the user expected outdoors and the
// reason this build exists.
//
// N6 IS THE REGRESSION ARM.  surf_kitsune has no env_soundscape at all, so the
// system must load nothing, play nothing, and cost nothing -- and build 63's
// entity I/O must still report 28 / 50 / 1.
//
// READ THE `listener:` LINE ON EVERY ARM.  setpos does not noclip, so a player
// placed at a computed point may fall to the floor or be pushed out of
// geometry.  An arm that asserted only the soundscape NAME could not tell a
// wrong selection from a player who never arrived, and this file would then be
// recording a harness failure as a result -- which is exactly what happened to
// build 65's arm sets B and C.  If `listener:` is far from the setpos target,
// the arm is inconclusive, NOT failed.
//
// `volume 0` throughout, and it costs this run nothing: snd_report prints the
// system's OWN volume bookkeeping (ssl_vol * vbsp_soundscape_vol), which the
// master volume does not touch.  Every assertion here survives muting.  This
// feature has reached a person's speakers twice already.
// ---------------------------------------------------------------------------
// RESULTS, 2026-09-13.  logs/b66a_soundscape.log.  csprogs.dat 2819742.
//
// SIX OF SIX.  Parse: 87 entities, 29 definitions, 125 rules, 1,623 lines from
// 2 scripts (the map's own + scripts/soundscapes.txt), 30 names wanted.
//
//   ARM  listener                 active           traces
//   N1   -11776 -13632 13745      spawn_outside         3
//   N2   -11776 -11808 13745      spawn_inside          1
//   N3   -10688  -2048  -8512     stage2               25
//   N4     2240 -15680    448     bonus4               66
//   N5   -11776 -13632 13744      spawn_outside         3   (restore, = N1)
//   N6   surf_kitsune             NONE, 0 entities      -
//
// N1 vs N2 IS THE RESULT.  Two points 1,824 units apart on one map produce two
// different soundscapes.  The game has never been able to do that.
//
// AND THE RAIN BEHAVES THE WAY THE USER DESCRIBED WANTING:
//
//   N1 outside   ambient/rain_heavy_sc.wav        0.40
//                ambient/sea_breeze.wav           0.30
//                ambient/water/water_run1.wav     0.10
//   N2 inside    ambient/atmosphere/indoor2.wav   0.12
//                ambient/rain_heavy_sc.wav        0.20   <-- SAME RAIN, HALVED
//                ambient/water/water_run1.wav     0.05
//   N3 stage2    ambient/atmosphere/indoor1.wav   0.20  pitch 97
//                ambient/interior_rain_loop.wav   0.40   <-- a DIFFERENT rain
//                ambient/water/drip_loop1.wav     0.20  pitch 95
//   N4 bonus4    ambient/rain_concrete.wav        0.30
//                ambient/wind/wind_rooftop1.wav   0.10
//
// The mapper wrote heavy rain outdoors, the same sample at half volume indoors,
// and a different interior loop in stage2.  None of that could be heard before.
// water_run1.wav appears in N1, N2 and N4, so the slot-reuse rule is also doing
// its job: crossing between those retargets the existing channel instead of
// stopping and restarting it, which is what stops a boundary from popping.
//
// THE TRACE COUNTS VINDICATE THE DISTANCE PRE-TEST.  All 87 entities are
// radius -1, i.e. every one is a candidate at any distance, and Source would
// trace all of them.  Testing distance before tracing costs 3, 1, 25 and 66
// traces instead of 87 every time, at 4 Hz.
//
// LOUDNESS WAS LEFT TRUE AND DID NOT NEED CLAMPING, which is the user's call
// being vindicated rather than merely obeyed: the four soundscapes sum to 0.80,
// 0.37, 0.80 and 0.50 -- every one under unity, because mappers author these
// beds deliberately.  Nothing here is scaled down.
//
// ---------------------------------------------------------------------------
// TWO BUGS THIS RUN FOUND, BOTH IN THE FIRST VERSION, BOTH RECORDED.
//
// 1. THE CONFIG SET CVARS THAT DID NOT EXIST YET.  vbsp_soundscape and its two
//    companions are CSQC cvars, and the CSQC VM does not exist until a map
//    loads -- so setting them at the top of a config produced
//    `Unknown command "vbsp_soundscape"` three times, in a log nobody would
//    grep for it.  They are now set after the first map.
//
// 2. THE READER STOPPED AT THE FIRST BLANK LINE.  The first version used the
//    house idiom from cl_emit.qc:385-389 -- `l = fgets(fh); if (!l) break;` --
//    and fgets returns "" for a blank line, which is FALSY in QC.
//    soundscapes_surf_tensor2.txt is 21,641 bytes of blank-line-separated
//    blocks, so it read 39 LINES OF 1,623 and reported 0 definitions.
//
//    The tell was in the instrument rather than in the symptom: "0 definitions,
//    1 rule" is not a parse that went wrong, it is a parse that never happened,
//    and the `scripts: N of M opened, L lines parsed` line -- added when the
//    first run reported nothing -- turned "it doesn't work" into "it read 39
//    lines" in one run.  Now FILE_READNL plus a strstrofs split.
//
//    cl_emit.qc is NOT wrong today (data/mapparticles.txt is generated and has
//    no blank lines) but the idiom is only safe for files like that, and this
//    is the third place in the tree to copy it.
// ---------------------------------------------------------------------------
// STILL UNVERIFIED: whether it SOUNDS right.  This run was muted, as every run
// of this feature has been.  The listening test is surf_tensor2: walk from
// spawn towards cover and back, and the heavy rain should fade to the muffled
// one over vbsp_soundscape_fade seconds and back again.
// ---------------------------------------------------------------------------
// ===========================================================================

log_enable 1
log_dir logs
log_name b66a_soundscape
developer 1
log_developer 1
cl_maxfps 100
con_notifylines 0

volume 0
bgmvolume 0

waitms 5000

echo ^5=== N1: surf_tensor2 at the player start -- expect spawn_outside ===
map surf_tensor2
waitmap 60
waitms 9000

// SET AFTER THE FIRST MAP, NOT BEFORE IT.  These are CSQC cvars and the CSQC
// VM does not exist until a map loads, so setting them at the top of a config
// gets `Unknown command "vbsp_soundscape"` -- which is what the first run of
// this file did, silently, on all three.  The defaults (1 / 1 / 3) are already
// what the first arm wants; only the fade is shortened, so an arm settles
// inside its dwell rather than being sampled mid-crossfade.  The fade itself
// is tested by the vol -> tvol columns, not by this number.
vbsp_soundscape 1
vbsp_soundscape_vol 1
vbsp_soundscape_fade 0.5
waitms 1500
snd_report
waitms 1500
ent_io
waitms 1500

echo ^5=== N2: spawn_inside origin -- expect spawn_inside (1824 units from N1) ===
setpos -11776 -11808 13832
waitms 4000
snd_report
waitms 1500

echo ^5=== N3: stage2 origin -- expect stage2 ===
setpos -10688 8992 -9792
waitms 4000
snd_report
waitms 1500

echo ^5=== N4: bonus4 origin -- expect bonus4 ===
setpos 2240 -15680 496
waitms 4000
snd_report
waitms 1500

echo ^5=== N5: back to the start -- expect spawn_outside again ===
setpos -11776 -13632 13760
waitms 4000
snd_report
waitms 1500

echo ^5=== N6: surf_kitsune -- no soundscapes, system inert, 28/50/1 intact ===
map surf_kitsune
waitmap 45
waitms 7000
snd_report
waitms 1500
ent_io
waitms 2500

echo ^5=== END OF RUN ===
quit
