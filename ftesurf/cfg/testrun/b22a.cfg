// FTESurf build 22 -- the input journal, structurally, and its negative control.
//
// This config proves the FILE cannot lie about itself.  It cannot prove anything
// about a mouse, and does not try: there is no console command in this engine
// that synthesises a real WM_INPUT report, so what a physical mouse actually
// produces is Item 5 of the plan and needs a hand on one.
//
// THE NEGATIVE CONTROL IS THE FIRST HALF AND IT IS THE MORE IMPORTANT ONE.  A
// console `+forward` is a command-buffer entry -- Cmd_ExecuteString -> IN_ForwardDown
// -- and never passes through in_newevent().  So a journal taken across scripted
// key commands must contain ZERO '+' and '-' lines.  If one shows up, the journal
// is hooked to the wrong thing and every conclusion drawn from it later would be
// about the command buffer rather than about input.
//
// THE SYNTH INJECTOR IS THE SECOND HALF.  in_journal_synth calls IN_KeyEvent and
// IN_MouseMove directly, which is the only route to the key path, the 'm' line
// format and the ring-overflow marker without a human.  It MARKS THE FILE --
// `synth 1` in the header -- so an injected journal is self-declaring and
// inadmissible, which is what makes shipping the command safe.
//
// developer 1 so Con_DPrintf from in_journal_end reaches the log; log_developer
// is needed as well or the dprints never reach -condebug at all (build 20).

cfg_save_auto 0
log_name b22a
developer 1
log_developer 1
con_notifytime 0

wait 200
map surf_666
waitmap 60
waitms 500

echo "--- the cvar and the four commands must all exist ---"
in_journal_maxkb
waitms 300

// ===========================================================================
echo "=========== 1. NEGATIVE CONTROL -- scripted keys must NOT appear ==========="
// ===========================================================================
in_journal_begin
waitms 200
+forward
waitms 400
-forward
+jump
waitms 300
-jump
+moveleft
waitms 300
-moveleft
waitms 400
in_journal_end data/runs/b22a-control.hid
waitms 400

// ===========================================================================
echo "=========== 2. SYNTH -- the key and mouse paths, and the header mark ==========="
// ===========================================================================
in_journal_begin
waitms 200
in_journal_synth 200
waitms 250
in_journal_synth 200
waitms 250
in_journal_synth 200
waitms 400
in_journal_end data/runs/b22a-synth.hid
waitms 400

// ===========================================================================
echo "=========== 3. NOTES -- the save/load marks the gamecode writes ==========="
// ===========================================================================
in_journal_begin
waitms 200
in_journal_synth 40
in_journal_note save 3
waitms 250
in_journal_synth 40
in_journal_note load 3
waitms 250
// and the sanitiser: a note must not be able to forge a record line
in_journal_note f 0.0 999 injected
waitms 250
in_journal_end data/runs/b22a-notes.hid
waitms 400

// ===========================================================================
echo "=========== 4. DISCARD -- no path means no file and a print ==========="
// ===========================================================================
in_journal_begin
waitms 200
in_journal_synth 50
waitms 250
in_journal_end
waitms 400

// ===========================================================================
echo "=========== 5. PRIVACY -- a key typed with a menu up loses its identity ==========="
// ===========================================================================
// data/ is readable by any CSQC, and every server a player joins runs CSQC, so a
// journal written with the console open would carry the scancodes of an
// rcon_password.  The rule: while anything above the game has focus, the TIMING
// and the COUNT of a key event survive -- so a macro bound to a key and fired
// with the console open still shows as a burst -- but the scancode is replaced
// by an 'x' line.  The unicode is never journalled at all.
//
// Three batches so the difference is visible inside ONE file rather than across
// two runs: in game, menu up, in game again.  The middle batch must produce 'x'
// lines and nothing else; the outer two must produce '+'/'-' carrying 32
// (K_SPACE), which is what in_journal_synth injects.
in_journal_begin
waitms 200
in_journal_synth 40
waitms 350
togglemenu
waitms 500
in_journal_synth 40
waitms 500
togglemenu
waitms 500
in_journal_synth 40
waitms 350
in_journal_end data/runs/b22a-privacy.hid
waitms 400

echo "=========== done ==========="
waitms 400
quit
