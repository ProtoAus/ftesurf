// FTESurf b58flare -- the flare contribution ALONE, measured cleanly.
//
// Why this exists: the flare half of build 58 (a fractional occlusion instead of
// a binary ray) measured 0.00 at the worst vantage, because the only two flares
// that reach the draw there are fully visible -- 5 rays of 5 clear -- so there
// was nothing to attenuate. The flares are nevertheless +17 mean luma of the
// +27.56 artefact, and the term-by-term dump says every factor is what Source's
// own code specifies: dist 2895, fade 0.921, glare 1.000, half 65x35 at 100
// units, col 0.678 0.804 0.886. So the question is no longer "is a term wrong"
// but "what does one correct flare actually put on the screen".
//
// THE EARLIER ATTEMPT AT THIS WAS CONTAMINATED. It differenced two frames from
// the first run, which carried different amounts of console text (con_notifytime
// 0 means never expire); the vertical profile came out NEGATIVE at the top of
// the frame, which is text, not flares. Hence a clean pair, same process, same
// vantage, nothing moving between them but the one cvar.
//
// vbsp_lightglow is load-time, so each arm reloads with vbsp_sprite_debug 2 --
// which build 58 repaired: before it, the reload was unreachable once a table
// was emptied, because Sprite_Draw returned above the debug block.
//
// PASS: the arms differ only where the two flares are, the difference image is
//       two radial humps with a gap between them, and the A/B/A third arm
//       matches the first.
cfg_save_auto 0
exec cfg/testrun/_quiet.cfg
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "b58flare"
scr_sshot_type png
cl_yieldcpu 0
vid_vsync 0
crosshair 0
con_notifytime 0.01
con_notifylines 0
fov 100

waitms 2500
map surf_tensor2
waitmap 240
waitms 8000
sv_cheats 1
noclip
waitms 500
setpos -10688.5 -1773.8 -8587.1 6.3 91.1 0
waitms 2000

vbsp_sprite_source 1
vbsp_glare_rays 5

echo "@@@ B58FLARE A. flares ON"
vbsp_lightglow 1
vbsp_sprite_debug 2
waitms 6000
screenshot b58f_on_x
waitms 900
screenshot b58f_on
waitms 900
screenshot b58f_on_ctl
waitms 900

echo "@@@ B58FLARE B. flares OFF -- the same frame without them"
vbsp_lightglow 0
vbsp_sprite_debug 2
waitms 6000
screenshot b58f_off_x
waitms 900
screenshot b58f_off
waitms 900

echo "@@@ B58FLARE C. flares back ON -- must match A, and proves the reload works"
vbsp_lightglow 1
vbsp_sprite_debug 2
waitms 6000
screenshot b58f_on2_x
waitms 900
screenshot b58f_on2
waitms 900

echo "@@@ B58FLARE DONE"
waitms 1200
quit
