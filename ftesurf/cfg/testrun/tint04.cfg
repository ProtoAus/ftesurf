// TINT04 -- THE PROOF, WITH A CVAR AND NO REBUILD.
//
// The chain, now established rather than suspected:
//
//   1. bhop_futile's 14 decal materials are all
//        LightmappedGeneric { $vertexcolor 1 $vertexalpha 1 $translucent 1
//                             $basetexture "Decals/x" $decal 1 }
//   2. mat_vmt.c:1286-1296 appends "#VERTEXCOL#VERTEXALPHA" because it tests
//      st->type, which is still "LightmappedGeneric" at that point.
//   3. mat_vmt.c:1736 THEN reroutes on st->decal into "vmt/vertexlit".
//   4. vertexlit.glsl declares neither permutation -- `grep -c VERTEXCOL` is 0,
//      against 3 in lightmapped.glsl and 1 in transition.glsl.
//   5. r_shaderpasses says the result is
//        decals/ivy02  noLIGHTMAP  sort=6  passes=6  prog=<none>
//      against
//        concrete/concretefloor024a  HASLIGHTMAP  sort=5  prog=vmt/lightmapped
//
//      prog=<none>.  The program does not load, SILENTLY -- there is not one
//      error line in tint03.log -- so the surface loses its program, its
//      lightmap AND its blend, and falls back to generated fixed-function
//      passes.  A flat opaque rectangle of the base texture's RGB: olive for
//      ivy02, black for the big panels.  That is the reported bug.
//
// Patch 232 introduced steps 2 and 4 today.  It is right about what it tested
// -- surf_rise's ivy_blendmodulate (WorldVertexTransition) and ivy_basic
// (LightmappedGeneric, no $decal) -- and neither is a decal, so the
// LightmappedGeneric + $decal combination was never exercised.
//
// hl2_vertexcolor is the switch P232 added for exactly this kind of doubt
// (default 1, CVAR_SHADERSYSTEM, mat_vmt.c:1286-1287).  At 0 the two progargs
// are not appended, the program name becomes plain "vmt/vertexlit", and it
// should load.
//
//   PREDICTION: at 0 the decals come back -- masked, blended, and NOT flat
//   rectangles -- and r_shaderpasses reports a real prog instead of <none>.
//
// If that holds, the diagnosis is proved end to end without compiling anything,
// and the user has a one-line workaround in the meantime.

log_enable 1
log_dir "logs"
log_name "tint04"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
sv_cheats 1
developer 0

wait 200
echo ^5=== tint04: hl2_vertexcolor A/B on the decals ===

map bhop_futile
waitmap 900
waitms 2500
con_clear

// noclip ONCE, before any setpos.
noclip
waitms 300
setpos 540.3427 4427.8555 7510.5981 11.9092 143.9758 0
wait 150
waitms 600

echo ^5--- A: hl2_vertexcolor 1 (shipped) -- expect prog=<none> ---
hl2_vertexcolor 1
waitms 2000
r_shaderpasses decals/ivy02
waitms 500
screenshot tint04_A_vc1
waitms 1200

echo ^5--- B: hl2_vertexcolor 0 -- expect a real prog, and decals that look right ---
hl2_vertexcolor 0
waitms 2000
r_shaderpasses decals/ivy02
waitms 500
screenshot tint04_B_vc0
waitms 1200

echo ^5--- and the same pair at save005, the grate ---
setpos 5482.3599 2014.7155 9158.1182 -0.1978 -0.4285 0
wait 150
waitms 800
screenshot tint04_C_s5_vc0
waitms 1000
hl2_vertexcolor 1
waitms 2000
screenshot tint04_D_s5_vc1
waitms 1000

hl2_vertexcolor 1
echo ^5=== tint04 done ===
wait 30
quit
