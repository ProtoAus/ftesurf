// FOG04 -- WHY does no fog of any kind render on surf_legends?
//
// fog03 settled that this is not the gamecode: `fog 800 1 0 0 1 0` typed
// straight at the engine produced max pixel delta 0 across the whole frame, with
// the 3D skybox on AND off.  bhop_bowling under the identical probe changed
// 99.9% of pixels with max delta 97.  So the fog state is right and the map does
// not draw it.
//
// The obvious suspect is the material: Source's $nofog compiles the VMT shader
// with the NOFOG permutation, which skips fog4() entirely
// (mat_vmt_progs.h -- "#ifdef NOFOG gl_FragColor = diffuse_f").  If surf_legends'
// world materials carry $nofog, then no fog on this map is CORRECT behaviour and
// Source would not draw it either.
//
// shader_here prints the shader and the program permutation for whatever is
// under the crosshair, so it answers this directly.  Probing the floor (look
// straight down) and the wall (look level) on both maps, because "the map" is
// not a material -- it is per-surface, and a map can be mixed.

log_enable 1
log_dir "logs"
log_name "fog04"
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 0
vid_fullscreen 0
con_notifytime 0
con_notifylines 0
con_notifytime_error 0
developer 1
log_developer 1
vbsp_fog 1
wait 200

echo ^5=========== surf_legends -- the map that will not fog =============
map surf_legends
waitmap 1800
waitms 9000
sv_cheats 1
waitms 400

echo ^3--- LEGENDS floor (pitch 89, straight down)
setangles 89 0 0
waitms 800
shader_here legends-floor
waitms 800

echo ^3--- LEGENDS wall/level (pitch 0)
setangles 0 0 0
waitms 800
shader_here legends-level
waitms 800

echo ^5=========== bhop_bowling -- the control that DOES fog =============
map bhop_bowling
waitmap 1800
waitms 9000
sv_cheats 1
waitms 400

echo ^3--- BOWLING floor (pitch 89, straight down)
setangles 89 0 0
waitms 800
shader_here bowling-floor
waitms 800

echo ^3--- BOWLING level (pitch 0)
setangles 0 0 0
waitms 800
shader_here bowling-level
waitms 800

echo ^5=========== done ==================================================
log_enable 0
