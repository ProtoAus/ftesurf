// cfg/testrun/p278b_join.cfg -- Patch 278, two clients, the guest half.
//
// Photographs the host's avatar and reports the numbers that turn the picture
// into evidence.
//
// THREE THINGS THIS ANSWERS, none of which one client can:
//
//   1. COLOUR.  The host is pinned to palette 1, pure red '1.00 0.00 0.00'.
//      colormod multiplies the skin, which is flat green (130 236 83), so the
//      avatar must render RED and not green -- and the shipped colormod value
//      is the palette entry DIVIDED by that skin, which is the whole reason
//      Lobby_ColourMod exists.  The discriminator is the measured pixel hue in
//      the screenshot, not "it looks red".
//
//   2. HEIGHT.  Standing on flat ground, another player's crown is at 62 and
//      your eye is at 64, so the crown sits just BELOW your eye line -- i.e.
//      below the crosshair at pitch 0.  Before Patch 278 the model was 72 and
//      8 units of it stood ABOVE the crosshair.  A sign test, not a
//      measurement: "is there body above the crosshair" flips across the fix.
//
//   3. bodies.  hud_net counts entities carrying a player model that are ACTIVE
//      in the current snapshot.  It must read 1, not 0 and not 2 -- 0 means the
//      avatar never arrived, 2 would mean lobby_av_self is leaking our own body
//      back to us.
//
// `//` COMMENTS ONLY.  See the note in p278b_host.cfg.

wait 200
cl_maxfps 100
log_developer 1

// This client must NOT pick a colour: it has to be able to take palette 1 if
// the host somehow failed to, which is how a silent no-op would show up.
setinfo lobbycolor 0
setinfo lobbyfx 0

// A `connect` needs far longer than a `map`.  200 frames is enough for a map
// load but not for this: the connect goes out before networking is ready,
// fails, and RETRIES, and the retry loop eats the rest of the script -- the
// screenshots then show the engine's built-in fallback menu, which looks
// exactly like the menu VM failing to load rather than like a timing bug.
wait 1500

echo "^3p278b:^7 guest connecting"
connect 127.0.0.1:27602

// 60 s of rendered frames.  The client renders the LOADING SCREEN at the
// capped rate too, so the map load SPENDS this budget rather than pausing it --
// it has to cover the whole load plus time in the game.
wait 6000

hud_net 1
wait 200
echo "^3p278b:^7 guest shot -- read `bodies` on the net panel"
screenshot p278b-1-avatar

// Second shot one step later: `screenshot` captures the frame BEFORE the
// command is processed, so a single shot taken right after a state change
// photographs the state before it.
wait 100
screenshot p278b-2-avatar

// The particle pool, from the side that is actually rendering the host's
// effects.  A server-side particleeffectnum verifies nothing, so this is the
// only proof the trail and motes exist on a machine other than the emitter's.
echo "^3p278b:^7 --- r_partinfo (host's effects, seen from here) ---"
r_partinfo

// Now falsify the colour: off must give back the flat green skin exactly.
wait 200
echo "^3p278b:^7 --- host colours off ---"
rcon_password ""  // BURNED -- removed; set by hand if a test needs rcon
rcon lobby_av_colors 0
wait 300
screenshot p278b-3-coloff

wait 200
disconnect
wait 300
quit
