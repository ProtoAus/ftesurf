cfg_save_auto 0
// PATCH 301 -- FALSIFIER.  The .hid header records the raw-input GRANT, not just
// the request.
//
// THE BUG: `rawinput` in the header is the CVAR.  A cvar is a request.  It is
// granted by INS_RawInput_Init enumerating and binding devices, and that can fail
// while the cvar still reads 1 -- no enumerable mouse, an RDP session (every
// device is the Terminal Services virtual one), a missing user32 export, a
// refused RegisterRawInputDevices.  On every one of those the engine falls back
// to INS_Accumulate's GetCursorPos/SetCursorPos recentre, which is an OS-summed
// and OS-ACCELERATED delta, and the header said `rawinput 1` over the top of it.
// That file is then indistinguishable from a strict-profile recording.
//
// WHICH ARM IS RUN COMES FROM THE LAUNCH LINE, because in_rawinput is read by
// INS_RawInput_Init at STARTUP -- long before any cfg here runs.  That is exactly
// what makes arm C possible.
//
// PRE-REGISTERED:
//   ARM A  launched +set in_rawinput 1 (the shipped default)
//          header:  rawinput 1   rawmice >= 1
//          hidcheck: no fault.  This is the control and it is the arm that must
//          NOT move -- a fault here means the patch is stamping honest journals.
//   ARM B  launched +set in_rawinput 0
//          header:  rawinput 0   rawmice 0
//          hidcheck: the pre-existing `rawinput 0` note, and NO new fault.  The
//          player turned it off; the file says so; the two agree.
//   ARM C  launched +set in_rawinput 0, then `in_rawinput 1` set HERE, after the
//          map, so the cvar changes without re-running INS_RawInput_Init.
//          header:  rawinput 1   rawmice 0        <-- THE CASE THE PATCH IS FOR
//          hidcheck: MUST fault.  This reproduces the RDP/no-device shape exactly
//          -- requested, never granted -- and before Patch 301 this file was
//          byte-indistinguishable from arm A's in everything a reader could check.
//
// Arm C is the whole point of the patch and it is also the arm that proves the
// check can fire at all; A and B are what prove it does not fire on honest files.

exec cfg/testrun/_quiet.cfg

developer 1
log_developer 1
// log_name and the .hid output path are set by cfg/testrun/p301arm.cfg, which is
// exec'd BEFORE this file and is rewritten per arm.  They are per-arm because a
// PowerShell Remove-Item under C:\FTESurf is refused by the sandbox -- and it
// rejects the WHOLE command, not just that line -- so a harness that cleans up
// between arms never runs at all.  Unique names per arm, nothing deleted.
log_enable 1
log_dir logs
cl_maxfps 100
cl_idlefps 0
sv_cheats 0
con_notifylines 0
con_notifytime 0.01
r_drawviewmodel 0

wait 200
map bhop_eazy
waitmap 600
waitms 5000

echo ^5=== P301: cvar as launched, and the live device count
in_rawinput
in_rawinput_keyboard

// ARM C ONLY.  Harmless in A and B: setting a cvar to the value it already has
// (A) or to 1 after the map (C) cannot re-enumerate devices either way, because
// nothing re-runs INS_RawInput_Init on a cvar write.  The launch line is what
// separates the arms; this line is what creates the DISAGREEMENT in arm C.
p301_setraw

echo ^5=== P301: open a journal and write it
in_journal_begin
waitms 2500
in_journal_note p301-falsifier
waitms 500
p301_write
waitms 1500

echo ^5=== END OF RUN ===
waitms 1000
quit
