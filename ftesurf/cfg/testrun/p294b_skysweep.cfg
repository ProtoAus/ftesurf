// cfg_save_auto 0: this run sets archived cvars (vid_*, cl_maxfps); never let it write them into ftesurf.cfg (cl_main.c:2535)
cfg_save_auto 0
// Patch 294b -- FAULT 5, find the direction first, THEN test it.
//
// p294a tested the sky arms at Lex's save008 framing and every arm moved 0.02%
// of pixels -- the same as two identical shots.  The screenshot says why: that
// camera is inside a windowless concrete room, no sky in frame at all.  A null
// result from a camera that cannot see the subject is not evidence about the
// subject, so this run finds a direction that CAN see it.
//
// METHOD: same pinned origin (Lex's save008), 8 yaws at 45 degrees, each shot
// twice -- once with the skyroom pass on, once with vbsp_skyroom 0.  Whichever
// yaw shows a large on/off difference is where the 3D skybox is visible, and
// that difference IS the "random crap" if the complaint is what I think it is.
// The floor pair at the top is this run's own noise floor.
//
// Lex: "on counter-strike I see nothing out the windows in the skybox. but in my
// game, I render a bunch of random crap? it's not PVSing correctly?"
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000
wait 200

developer 1
log_developer 1
log_enable 1
log_dir logs
log_name p294b_skysweep
cl_maxfps 0
cl_idlefps 0
sv_cheats 1
con_notifylines 0
con_notifytime 0
con_notifytime_error 0
r_drawentities 1

// Lex's save008 origin, level pitch, yaw swept.
alias y000 "setpos -10751.1777 9562.7969 -9789.3184 0 0 0;   waitms 1600"
alias y045 "setpos -10751.1777 9562.7969 -9789.3184 0 45 0;  waitms 1600"
alias y090 "setpos -10751.1777 9562.7969 -9789.3184 0 90 0;  waitms 1600"
alias y135 "setpos -10751.1777 9562.7969 -9789.3184 0 135 0; waitms 1600"
alias y180 "setpos -10751.1777 9562.7969 -9789.3184 0 180 0; waitms 1600"
alias y225 "setpos -10751.1777 9562.7969 -9789.3184 0 225 0; waitms 1600"
alias y270 "setpos -10751.1777 9562.7969 -9789.3184 0 270 0; waitms 1600"
alias y315 "setpos -10751.1777 9562.7969 -9789.3184 0 315 0; waitms 1600"

echo ^5=== p294b: surf_tensor2 skyroom yaw sweep
map surf_tensor2
waitmap 600
waitms 9000
waitms 3000
noclip
waitms 1000

y000
cmd viewpos
screenshot p294b_floor_a
waitms 700
screenshot p294b_floor_b

echo ^5=== SWEEP A: skyroom ON (default)
vbsp_skyroom 1
waitms 1200
y000
screenshot p294b_on_y000
y045
screenshot p294b_on_y045
y090
screenshot p294b_on_y090
y135
screenshot p294b_on_y135
y180
screenshot p294b_on_y180
y225
screenshot p294b_on_y225
y270
screenshot p294b_on_y270
y315
screenshot p294b_on_y315

echo ^5=== SWEEP B: vbsp_skyroom 0
vbsp_skyroom 0
waitms 1200
y000
screenshot p294b_off_y000
y045
screenshot p294b_off_y045
y090
screenshot p294b_off_y090
y135
screenshot p294b_off_y135
y180
screenshot p294b_off_y180
y225
screenshot p294b_off_y225
y270
screenshot p294b_off_y270
y315
screenshot p294b_off_y315

vbsp_skyroom 1
echo ^5=== END OF RUN ===
waitms 500
quit
