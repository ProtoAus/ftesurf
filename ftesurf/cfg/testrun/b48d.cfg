// B48D -- the results card, three legs: main, bonus 1, and a !s 3 stage run.
// Do the PBWAS pre-step (restore best.pb) first so pbwas is non-zero on main
// (5354) and on the !s 3 leg (1389).  The card auto-opens on the finish edge
// (build 51's ui_rs_seen fix); the results command TOGGLES, so typing it after
// the auto-open must CLOSE the card.  Use say, not cmd say: the cmd route
// drops the stage number (p270s2.log:572-590).
//
// THE STAGE RUN FINISHES BY setpos INTO ZONE 3, NOT BY FLYING THROUGH IT.
// A stage run's finish sets run_t_pendarm to the box it finished in
// (sv_timer.qc:4930-4937) and the first tick the hull is OUTSIDE that box
// SV_TimerFrame arms AND starts the next stage run (5399-5428): TS_RUNNING,
// which closes the card (cl_results.qc:413-421) and throws the finished run's
// state away (SV_TimerArm, 4449-4464).  A flight cannot stop inside a 192-unit
// box either: noclip release drift is v / (1.5 * sv_friction) = about 170 u
// (pmove.c:1369).  setpos calls only SV_TimerCheat + SV_TimerWarped
// (sv_player.qc:832-836); SV_TimerWarped sets lastorg = origin, and
// Zone_BoxSwept accepts an end already inside the ring (sh_zones.qc:823-824),
// so the finish fires on the next tick with the body PARKED in the box, where
// SV_ZoneIn(pendarm) stays true (5403) and nothing re-arms.
log_enable 1
log_dir "logs"
log_name "b48d"
developer 1
log_developer 1
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
fs_missingwarn 0
sv_cheats 1
wait 200
map bhop_eazy
waitmap 1800
waitms 2500
hud_results 1
hud_results_toast 1
hud_results_rank 1
hud_splits 1
hud_splits_class 1
echo ^5=== b48d: 1. MAIN -- fly all four boundaries ===
noclip
cmd zone_goto 0 0 0
waitms 700
+forward
waitms 1000
-forward
waitms 400
setpos 2200 512 144 0 0 0
waitms 300
+forward
waitms 1000
-forward
waitms 400
setpos 200 -1728 144 0 180 0
waitms 300
+forward
waitms 1000
-forward
waitms 400
setpos 2200 -864 144 0 0 0
waitms 300
+forward
waitms 1000
-forward
waitms 400
setpos 2640 -1300 144 0 -90 0
waitms 300
+forward
waitms 900
-forward
waitms 1200
echo ^5=== b48d: 2. main card -- expect open 1 tag 4 pb 5354 track 0 startseg 0 ===
cmd viewpos
timer
waitms 600
screenshot b48d_main_x
waitms 700
screenshot b48d_main
echo ^5=== b48d: 3. results toggles it CLOSED -- expect open 0 and no card ===
results
waitms 500
timer
waitms 300
screenshot b48d_main_closed_x
waitms 700
screenshot b48d_main_closed
echo ^5=== b48d: 4. BONUS 1 via say -- expect !b -- bonus 1 (teleDestPos, -2112 -17xx 6x) ===
say !b 1
waitms 800
cmd zone_goto 5 90 0
waitms 700
cmd viewpos
timer
waitms 700
+forward
waitms 1300
-forward
waitms 1200
echo ^5=== b48d: 5. bonus card -- expect track 1 startseg 0, leg named bonus 1, pb 0 (first) ===
cmd viewpos
timer
waitms 600
screenshot b48d_bonus_x
waitms 700
screenshot b48d_bonus
echo ^5=== b48d: 6. STAGE RUN via say !s 3 -- expect !s -- stage 3 (teleDestPos, -376 -1728 6x) and startseg 2 ===
say !s 3
waitms 800
cmd viewpos
timer
waitms 700
cmd zone_goto 2 0 0
waitms 600
echo ^5=== b48d: 6a. leave zone 2 (+x) to start the clock -- expect running, startseg 2 ===
+forward
waitms 500
-forward
waitms 600
cmd viewpos
timer
waitms 700
echo ^5=== b48d: 6b. setpos INTO zone 3 -- the finish, body parked inside so the pendarm never fires ===
setpos 2624 -864 144 0 0 0
waitms 1500
echo ^5=== b48d: 7. stage-run card -- expect open 1 startseg 2 pb 1389, card says stage 2, viewpos still 2624 -864 ===
cmd viewpos
timer
waitms 600
screenshot b48d_s3_x
waitms 700
screenshot b48d_s3
waitms 300
echo ^5=== b48d: done ===
quit
