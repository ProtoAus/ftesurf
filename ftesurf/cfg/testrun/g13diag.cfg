// G13 -- why did the Patch 210 aperture render closed?
//
// G12's screenshot shows the doorway with the wall behind it visible through the
// opening and NOTHING painted on the aperture.  That is the "closed" look, which
// is a legitimate outcome of three different refusals, and they are told apart
// only in the log:
//
//   a) the material did not parse the way it was meant to.  r_showshader prints
//      the sort and every pass, so "sort 3 (SHADER_SORT_PORTAL)" plus one pass
//      reading "map $refraction" is the pass condition.  If `portalfbo` was not
//      recognised there is an "Unknown shader directive parsing ftesurf_portal"
//      line, and SHADER_HASPORTAL was never set -- in which case the surface
//      would take the ordinary REFRACTION path instead, not draw nothing, so
//      this one predicts a different picture than the one we got.
//
//   b) the program did not load.  glsl/ftesurf_portal.glsl is a gamedir file
//      with no builtin fallback.
//
//   c) GLR_PortalWouldDraw said no, and the aperture was skipped by the new
//      budget gate in GLBE_GenerateBatchTextures.  Patch 206's own instrument
//      prints "portals: depth 0, N in view, M rendered, K closed" whenever those
//      numbers change, so N=1 M=0 names this outright, and N=0 says the batch
//      never reached GLR_PortalBudgetBegin at all -- which would mean the sort
//      list, not the gate.
//
// G12 could not tell these apart because it set log_developer without
// log_enable, so no file was written at all.  That is the only reason this run
// exists; everything below is the same map and the same two positions.

cfg_save_auto 0
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "p210_g13"
scr_sshot_type png
cl_yieldcpu 0
cl_maxfps 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0
r_speeds 2
vbsp_portal_render 1

waitms 2500

map surf_kitsune
waitmap 240
waitms 8000
sv_cheats 1

echo "@@@ G13 cvars"
r_portalfbo
r_portalrecursion
r_portalmaxviews
r_portalscissor
vbsp_portal_render
waitms 300

echo "@@@ G13 shader as parsed"
r_showshader ftesurf_portal
waitms 500

echo "@@@ G13 at the exit hall doorway -- the portal is dead ahead"
setpos 0 -765 133 0 90 0
waitms 4000
r_speeds_dump
waitms 400
screenshot_mega g13_exit 1280 720
waitms 600

// Walk the budget out of the way entirely, in case the gate is the refusal.
echo "@@@ G13 r_portalmaxviews 0 (uncapped)"
r_portalmaxviews 0
waitms 3000
r_speeds_dump
waitms 400
screenshot_mega g13_uncapped 1280 720
waitms 600
r_portalmaxviews 2

// And the old renderer, for a side-by-side of the same doorway.  r_portalfbo is
// CVAR_RENDERERLATCH, so vid_reload is what makes it take -- and vid_reload is
// also what reparses the material, which is the point of latching it.
echo "@@@ G13 r_portalfbo 0 + vid_reload -- the Patch 208 renderer, same spot"
r_portalfbo 0
vid_reload
waitms 6000
setpos 0 -765 133 0 90 0
waitms 3000
r_speeds_dump
waitms 400
screenshot_mega g13_oldrenderer 1280 720
waitms 600

echo "@@@ G13 DONE"
waitms 1000
quit
