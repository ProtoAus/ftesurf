// PROBE259 -- Build 3 precondition: does FTECONTENTS_LADDER reach a Source-mode
// trace at a real ladder face?
//
// WHY THIS RUN EXISTS.  The QC's ladder essay (sv_entities.qc, "Ladders -- and
// why there is no spawn function here any more") asserts the contents "are
// already in the trace results waiting to be read".  Reading the engine makes
// that claim conditional rather than true:
//
//   bspfile.h : MASK_PLAYERSOLID == SOLID|PLAYERCLIP|WINDOW|BODY.  LADDER
//               (0x4000) is NOT in it.
//   com_bih.c:990 : a brush is only VISITED when
//               node->data.contents & tr->hitcontents
//               -- so a ladder-only brush is not merely unreported, it is
//               skipped, returns fraction 1 and looks like empty space.
//   com_bih.c:783 : but a brush that IS hit reports brush->contents WHOLE,
//               so the ladder bit rides along on any brush carrying a second
//               in-mask bit.
//
// An offline census of all 1310 maps says every one of the 1750 ladder brushes
// in the library carries such a bit (73.0% GRATE, 13.6% WINDOW, 12.9% SOLID,
// 0 ladder-only), so the claim should hold -- by map-data accident, not by
// construction.  Four links in that chain were read; none were executed.  This
// runs them.
//
// bhop_monster_jam is the map because it is already proven to load (it is the
// Patch 258 test map), it has 5 info_ladder markers so its ladders are
// deliberate, and its five ladder brushes cover BOTH of the two big contents
// families -- 0x30000008 LADDER|TRANSLUCENT|GRATE and 0x30000002
// LADDER|TRANSLUCENT|WINDOW.
//
// The player stands OUTSIDE the brush facing it, not inside: GRATE remaps to
// PLAYERCLIP|MONSTERCLIP and WINDOW maps straight through, and both are in
// MASK_PLAYERSOLID, so a ladder brush is SOLID to the player.  You climb it from
// in front, which is the trace the probe fires.  Both sides of each brush are
// tried because which side is open air and which is the wall behind it cannot be
// decided from the brush alone -- one of the two will read startsolid, and that
// is data, not failure.
//
// WHAT TO LOOK FOR, per position:
//   fwd24 PLAYERSOLID  contents ...LADDER   -> chain holds, Build 3 is a pure
//                                              mover port, no mask change.
//   fwd24 PLAYERSOLID  contents no LADDER
//   but fwd24 +LADDER  contents ...LADDER   -> the mask is the defect; the port
//                                              needs a widened trace.
//   fwd24 allbits also shows nothing        -> the bit never survived the
//                                              loader; Build 3 is wasted and the
//                                              defect is in mod_vbsp.c.

log_enable 1
log_dir "logs"
log_name "probe259"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
con_notifylines 0
developer 1
log_developer 1

wait 200
map bhop_monster_jam
waitmap 1800
waitms 8000
sv_cheats 1
waitms 400

pm_dispprobe 0
pm_ladderprobe 1
waitms 400

// ---- brush 1: (6640 -4164 3776)-(6672 -4160 3964)  0x30000008 GRATE ----
echo ^5=== B1-A  grate ladder, south side, facing +y ===
setpos 6656 -4186 3778 0 90 0
waitms 1200
echo ^5=== B1-B  grate ladder, north side, facing -y ===
setpos 6656 -4138 3778 0 270 0
waitms 1200

// same brush, halfway up: a ladder you are climbing, not standing at the foot of
echo ^5=== B1-A-mid  grate ladder, south side, z+90 ===
setpos 6656 -4186 3868 0 90 0
waitms 1200

// ---- brush 2: (1024 -3648 5120)-(1088 -3644 5564)  0x30000002 WINDOW ----
echo ^5=== B2-A  window ladder, south side, facing +y ===
setpos 1056 -3670 5122 0 90 0
waitms 1200
echo ^5=== B2-B  window ladder, north side, facing -y ===
setpos 1056 -3622 5122 0 270 0
waitms 1200

// ---- brush 4: (384 -6800 6272)-(640 -6768 6688)  0x30000008 GRATE, 32u thick --
echo ^5=== B4-A  wide grate ladder, south side, facing +y ===
setpos 512 -6822 6274 0 90 0
waitms 1200
echo ^5=== B4-B  wide grate ladder, north side, facing -y ===
setpos 512 -6746 6274 0 270 0
waitms 1200

// ---- brush 5: (-1792 2576 4416)-(-1790 2600 5048)  0x30000008 GRATE, 2u thin --
echo ^5=== B5-A  thin grate ladder, west side, facing +x ===
setpos -1814 2588 4418 0 0 0
waitms 1200
echo ^5=== B5-B  thin grate ladder, east side, facing -x ===
setpos -1768 2588 4418 0 180 0
waitms 1200

// ---- control: open floor, nowhere near a ladder.  A probe that prints LADDER
// here would mean the reading is an artefact, not a measurement.
echo ^5=== CONTROL  spawn area, no ladder expected ===
setpos 10529.1 -324.1 5361.3 0 123.7 0
waitms 1500

echo ^5=== probe259 done ===
pm_ladderprobe 0
wait 30
quit
