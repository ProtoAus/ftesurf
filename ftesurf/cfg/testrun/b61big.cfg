waitms 1200

echo "@@@ B61BIG s2 interval 0.025"
vbsp_glare_interval 0.025
waitms 6000
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 600
screenshot b61b_s2
waitms 1200

echo "@@@ B61BIG b2 interval 0.2"
vbsp_glare_interval 0.2
waitms 6000
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 600
screenshot b61b_b2
waitms 1200

echo "@@@ B61BIG s3 interval 0.025"
vbsp_glare_interval 0.025
waitms 6000
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 600
screenshot b61b_s3
waitms 1200

echo "@@@ B61BIG b3 interval 0.2"
vbsp_glare_interval 0.2
waitms 6000
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 600
screenshot b61b_b3
waitms 1200

echo "@@@ B61BIG s4 interval 0.025"
vbsp_glare_interval 0.025
waitms 6000
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 600
screenshot b61b_s4
waitms 1200

