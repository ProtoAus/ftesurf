// FTESurf build 61 -- IS 0.2 WORTH ANYTHING OVER 0.025?  Lex wants it on tensor2.
//
// THE REQUEST.  "0.025 is fine for most maps, but I sort of want 0.2 on tensor2
// because of the fps savings."  Before building a per-map mechanism for it,
// find out whether the savings exist, because the arithmetic says they mostly
// do not:
//
//   at interval 0.025 tensor2 already fires 7-12 rays a frame, down from 40-44
//   12 rays * 27.1 us = 0.33 ms, against a 1.74 ms frame at the measured 575 fps
//
// So removing EVERY remaining ray caps 0.2 at 1.41 ms = 709 fps, i.e. at most
// +23% over 0.025 and certainly less, for 8x the staleness (26.8 ms -> ~215).
// The curve already shows the saturation: 0.025 -> 0.05 bought 12 fps for 16 ms.
//
// THAT IS AN EXTRAPOLATION AND THIS RUN EXISTS BECAUSE OF TRAP 25.  The last
// derived figure I trusted without checking it against real output -- frames
// per sweep, divided by the wrong denominator -- was wrong for a whole build
// and I reported it to Lex as a reason to abandon a change that was worth 4.8x.
// An arithmetic ceiling is not a measurement.
//
// METHOD, and it applies the two instrument failures the last three runs found:
//   - THE FIRST ARM IS DISCARDED.  b61curve's first interval-0 control differed
//     from its four later ones by 87.8% of pixels after a 30s settle (a global
//     sub-LSB exposure settle: mean luma 63.6181 vs 63.6253).  Arm W below is a
//     throwaway and is not in any average.
//   - FOUR INTERLEAVED PAIRS, not one of each.  show_fps fell 426.9 -> 369.7
//     monotonically across 90s of b61int on a warm machine, and a one-shot arm
//     order puts whichever setting sits in the middle at the fastest moment.
//     Only the PAIRED deltas are quoted.
//   - THE QUOTA IS THE BETTER CLOCK.  frametime = quota * interval / 429, read
//     out of the frame that fired the rays, no averaging window.  Both arms
//     have an interval, so unlike the earlier runs this comparison does not
//     need show_fps at all -- it is the cross-check, not the measurement.
//
// ===================================================================
// PREDICTION, REGISTERED BEFORE THE RUN
// ===================================================================
// REVISED FOR THIS VANTAGE, AND THE REVISION REVERSES MY ADVICE.  The ceiling
// argument above was computed at the OLD vantage, where 7-12 rays a frame was
// all that was left at 0.025 -- so there was nothing for 0.2 to save and I was
// about to tell Lex his instinct was wrong.  The start box is a different
// regime, and the recon census is why: `glare 415 in frame, 411 hidden`,
// against 302/296 before.  Almost nothing is CULLABLE here (12 of 38 visits),
// so a visit costs ~1.05 rays instead of ~0.35, and the quota converts to rays
// nearly one-for-one:
//
//     interval 0       40-44 rays/frame (budget-capped)   sweep 12 frames
//     0.025            quota ~26  ->  ~27 rays            saving ~15 rays
//     0.2              quota ~3.2 ->  ~3.4 rays           saving ~38 rays
//
// At 27.1 us a ray that is 0.4 ms for 0.025 against 1.03 ms for 0.2, so here
// 0.2 could be worth ~+150 fps OVER 0.025 rather than the +15..85 I predicted
// from the other spot.  Lex asked for this vantage and it is the one that
// decides the question; the curve I already reported does not generalise to it.
//
//   PASS (worth building): all four paired deltas positive AND their mean
//        exceeds the same-setting spread of the 0.025 arms.
//   FAIL (not worth building): the deltas straddle zero, or their mean sits
//        inside the 0.025 arms' own spread.
//
//   PASS (worth building): all four paired deltas positive AND their mean
//        exceeds the same-setting spread of the 0.025 arms.  Then 0.2 buys
//        something a per-map override could deliver.
//   FAIL (not worth building): the deltas straddle zero, or their mean is
//        inside the 0.025 arms' own spread.  Then 0.2 is free fps that does not
//        exist and the 8x staleness is being paid for nothing.
//   FAIL: any 0.2 arm reports `stopped by THE RAY CEILING` -- impossible at
//        1 ray a frame, so it would mean the quota maths is wrong, not the fps.
//
// WHAT THIS STILL CANNOT ANSWER: whether 215 ms of staleness is visible while
// turning.  It is 8x the interval Lex approved at build 59 and 4x the decay
// ramp, so unlike every earlier arm this one is NOT expected to be invisible in
// motion -- a static camera converges and cannot show it.  If the fps turns out
// to be worth having, that trade is his to feel, not mine to claim.
cfg_save_auto 0
exec cfg/testrun/_quiet.cfg
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "b61big"
scr_sshot_type png
cl_yieldcpu 0
vid_vsync 0
crosshair 0
fov 100
con_notifylines 0
con_notifytime 0.01
cl_maxfps 0

r_fog_progless 1
hl2_additivefog 1

waitms 2500
map surf_tensor2
waitmap 240
waitms 8000
sv_cheats 1
noclip
waitms 500

vbsp_sprites 1
vbsp_lightglow 1
vbsp_lightglow_scale 1
vbsp_sprite_source 1
vbsp_glare 1
vbsp_glare_rays 5
vbsp_glare_traces 40
vbsp_glare_cull 1.25
vbsp_glare_brush 2
vbsp_glare_interval 0.025
vbsp_glare_adaptive 8
r_renderscale 1
show_fps 1

// LEX ASKED FOR THIS VANTAGE: "test on !s 1", and then "that wasn't stage 1
// lol" when I went to the wrong one.  `!s N` maps to track 0 SEGMENT N-1 and
// stage 1 IS the start box (sv_zones.qc:1150 and :1154, sh_defs.qc:1312), so
// `!s 1` is zone index 0 -- and the index 1 I first used is `!s 2`.  The engine
// printed `zone_goto: 1 -- stage, track 0, segment 1` and I read "segment 1"
// as "stage 1" without checking an off-by-one its own source documents three
// times.  Recon b61zr2 confirms index 0 answers `start, track 0, segment 0`.
//
// The setpos after it PINS THE CAMERA and is not redundant.  zone_goto's
// optional yaw/pitch were measured not to hold on bhop_eazy (asked 16.18, got
// 0.5 then 179.5 on consecutive samples), and every arm below must share one
// camera exactly or the pixel comparison is meaningless.  The values are
// viewpos's own output from the recon, which prints AS a setpos line for
// exactly this reason.  Default heading (yaw -90) deliberately: it is what a
// player sees on arriving, and it is also the busiest of the three sampled
// (415 glares in frame against 399 at yaw 0 and 224 at yaw 180).
//
// setpos marks the run `cheated`; irrelevant here, nothing reads the timer.
cmd zone_goto 0
waitms 3000
setpos -11200.0 10048.0 -576.0 0.0 -90.0 0.0
waitms 30000

echo "@@@ B61BIG W DISCARD -- first arm, not settled, not averaged"
vbsp_glare_interval 0.025
waitms 6000
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 600
screenshot b61b_W
waitms 1200

echo "@@@ B61BIG s1 interval 0.025"
vbsp_glare_interval 0.025
waitms 6000
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 600
screenshot b61b_s1
waitms 1200

echo "@@@ B61BIG b1 interval 0.2"
vbsp_glare_interval 0.2
waitms 6000
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 600
