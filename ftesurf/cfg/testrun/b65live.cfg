// Build 65: the deployed lobby, not a harness.
//
// Everything else about the world row was measured against a stub directory on
// a local dedicated server.  This asks the five servers that are actually
// running: do the progs on the Pi carry build 65, does the lobby still publish
// board=ranked, and does the new console handle exist there at all.
//
// WHAT IT CANNOT DO is produce a rank, because that needs a finish and a finish
// cannot be reached from a config on a zoned map -- zone_goto and setpos both
// void the run via SV_TimerWarped.  So the expected answer here is the CONTROL
// state, and the control being right is the whole point: on a ranked lobby with
// no finish behind it the row must read "--  not submitted", never a rank and
// never "times here stay on this machine".
//
// PREDICTION:
//   scores status   -> board=ranked  this server posts times to the online board
//   results wrank   -> *wrank (unset), board ranked, state -1,
//                      draws "--  not submitted"
//
// FALSIFIED IF: `Unknown command "results"` (the Pi is serving progs older than
// this build, i.e. the deploy did not take), or board reads anything but
// ranked, or a rank appears from nowhere.
//
// THE LAN ADDRESS rather than play.proto.bar: a hairpin NAT failure would look
// exactly like a server that does not answer, and the thing under test is the
// progs rather than the router.
//
// LOOK FOR THE LOG IN ftesurf/logs, NOT IN THE GAMEDIR YOU LAUNCHED WITH.
// The first run of this file was launched with `-game b65` (an isolated gamedir
// holding a test build, so the other session's progs in ftesurf/ were left
// alone) and its log stopped dead at "Connected", 653 bytes, with the process
// gone -- which reads exactly like a crash on connect against a server you have
// just deployed to, and was investigated as one.  It was not.  The server
// announces `gamedir "ftesurf"`, the client SWITCHES to match, and the switch
// restarts the filesystem ("Clearing memory") -- so everything after the
// connect was written to ftesurf/logs/b65live.log and the b65 copy simply
// stopped.  A gamedir override does not survive connecting to a server that
// uses a different one, and neither does where the log lands.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name b65live
log_developer 1
developer 1

rate  2000000
drate 5000000

waitms 6000
connect 192.168.1.102:27540

// Generous: if the local csprogs does not match the lobby's the client fetches
// 2.7 MB at the lobby's sv_maxrate, which is the shipped 50000 and therefore
// about a minute.  Nothing below exists until that lands.
waitms 60000

echo ^5==== b65live: what does the deployed lobby say? ====
scores status
waitms 1000
results wrank
waitms 1000

echo ^5==== and about the run the probe would submit (nothing should match) ====
results wrank 0 0 1234
waitms 1000

echo ^5==== b65live: done ====
disconnect
waitms 500
quit
