// FTESurf b58spr -- REPRODUCE FIRST.  No code has changed when this runs.
//
// Lex, 2026-09-12: "sprites on Tensor2, the lens flare lights you see always
// facing the camera, and all the other ones on light sources, are now not
// rendering properly but a big square of translucent color? the texture has
// been reduced to flatness?"
//
// THE VANTAGES ARE HIS, NOT DERIVED.  data/saves/surf_tensor2/save008 holds
// 3,173 view samples over 7.06 s of the run he was playing when he saw it;
// run.view carries the angles per frame and run.rec the origins per packet, and
// joining them on the tick clock gives the camera path.  Projecting all 429
// sprites against it at his fov 100 / 1920x1111 says the median frame stacks
// 0.78 screens of additive glow, the 95th percentile 1.97 and the worst 3.05,
// with 54.6% of frames holding one sprite over half the screen wide or tall.
// The three setpos lines below are samples 0, 136 and 1630 of that path -- the
// worst moment and two more at least 0.25 s away from it.
//
// WHAT IS BEING TESTED, and it is not the fix -- there is no fix yet:
//   A. does it reproduce at all.  If these frames look like a normal map, the
//      diagnosis is wrong and the change is off.  That is the whole point of
//      running this before writing any code.
//   B. is it the SPRITES or the FLARES.  They are separate systems and I claim
//      only the sprites are wrong: env_lightglow measures 1.000 against Source
//      per channel at 800/1500/3000 units, so turning the flares off must NOT
//      clear the wash.  If it does, I am wrong about which half to fix.
//   C. is it sprites at all.  With vbsp_sprites 0 the frame must come back to a
//      plain lit room.  If it does not, something other than this system is
//      producing it and Parts 1-3 of the plan are aimed at the wrong code.
//
// THE TOGGLES ARE LOAD-TIME.  vbsp_sprites and vbsp_lightglow are read once in
// Sprite_LoadForMap, so setting either in the console changes nothing until the
// sprite table is rebuilt -- screenshotting either side of a bare toggle is a
// null test that looks exactly like the feature not working.  vbsp_sprite_debug
// 2 re-runs the load, and every arm below uses it.
//
// CAPTURE: plain `screenshot`, never screenshot_mega -- mega forces an FBO and
// clears RDF_ALLPOSTPROC, so it cannot see the colour grade that is live on this
// map.  Two shots per arm and read the SECOND: a screenshot captures one step
// behind.  Arm A1/A1b is a same-setting control pair for the noise floor, which
// is per-run and must be measured in this run, not borrowed from another.
//
// PASS for A:  a1 shows large soft glows washing the scene, with wall texture
//              detail lost where they overlap.
// PASS for B:  b1 (flares off) still shows the wash.
// PASS for C:  c1 (sprites off) does not.
// FAIL:        a1 and c1 are indistinguishable -- then it is not this system.
cfg_save_auto 0
exec cfg/testrun/_quiet.cfg
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "b58spr"
scr_sshot_type png
cl_yieldcpu 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0

// His view, so the framing matches what he saw.  scr_fov_mode 4 is already his
// archived value; fov 100 with it gives 114.2 x 83.6 degrees at this window.
fov 100

waitms 2500
map surf_tensor2
waitmap 240
waitms 8000
sv_cheats 1
noclip
waitms 500

vbsp_sprite_debug 1
waitms 500

// ---------------------------------------------------------------- A: as he saw it
echo "@@@ B58SPR A. his own worst sample, everything on"
setpos -10688.5 -1773.8 -8587.1 6.3 91.1 0
waitms 2500
screenshot b58_a1_x
waitms 900
screenshot b58_a1
waitms 900
// the control pair: same vantage, same settings, nothing touched between them.
screenshot b58_a1_ctl
waitms 900

echo "@@@ B58SPR A2. sample 136"
setpos -10678.6 -1257.3 -8752.3 20.5 87.6 0
waitms 2000
screenshot b58_a2_x
waitms 900
screenshot b58_a2
waitms 900

echo "@@@ B58SPR A3. sample 1630"
setpos -10663.5 5686.3 -10452.4 -9.5 92.0 0
waitms 2000
screenshot b58_a3_x
waitms 900
screenshot b58_a3
waitms 900

// ---------------------------------------------------------------- B: flares off
// If the wash is the 166 env_lightglow rather than the 233 env_sprite, this is
// where it clears.  I claim it will not.
echo "@@@ B58SPR B. env_lightglow off, sprites still on"
vbsp_lightglow 0
vbsp_sprite_debug 2
waitms 2000
setpos -10688.5 -1773.8 -8587.1 6.3 91.1 0
waitms 1500
screenshot b58_b1_x
waitms 900
screenshot b58_b1
waitms 900

// ---------------------------------------------------------------- C: sprites off
echo "@@@ B58SPR C. every sprite off -- the ground truth frame"
vbsp_sprites 0
vbsp_sprite_debug 2
waitms 2000
setpos -10688.5 -1773.8 -8587.1 6.3 91.1 0
waitms 1500
screenshot b58_c1_x
waitms 900
screenshot b58_c1
waitms 900

// ---------------------------------------------------------------- D: back on
// Restores both, and reproves A after the reloads -- if d1 does not match a1 the
// load-time path is not idempotent and every arm above is suspect.
echo "@@@ B58SPR D. both back on, must match A"
vbsp_sprites 1
vbsp_lightglow 1
vbsp_sprite_debug 2
waitms 2000
setpos -10688.5 -1773.8 -8587.1 6.3 91.1 0
waitms 1500
screenshot b58_d1_x
waitms 900
screenshot b58_d1
waitms 900

// ---------------------------------------------------------------- E: his renderscale
// r_renderscale 2 is live in his config and no test has ever used it.  Additive
// results clip per subsample there, so thin additive detail reads dimmer than at
// 1x -- worth one pair so the later A/B is not measured on an axis he does not
// actually run.
echo "@@@ B58SPR E. same frame at r_renderscale 2"
r_renderscale 2
waitms 1500
screenshot b58_e1_x
waitms 900
screenshot b58_e1
waitms 900
r_renderscale 1
waitms 800

vbsp_sprite_debug 1
waitms 800

echo "@@@ B58SPR DONE"
waitms 1200
quit
