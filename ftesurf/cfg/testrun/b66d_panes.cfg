cfg_save_auto 0

// ===========================================================================
// BUILD 66 -- THE PANES THAT GREW.
//
// Board went from two option rows to eight, the strafe bar from five to eight,
// Segments from ten to eleven, and the Timer from none to one.  The panel's
// height formula is what those land on, and it is the thing in stage A most
// likely to be wrong -- it shrinks psc rather than running off the bottom, so a
// failure here looks like a suddenly tiny panel rather than a missing button.
//
// Also checks the size row now reads `size 64 auto` for the timer, which is the
// other half of moving that fallback from 20*scale to 32*scale: if he_base did
// not move with it, the panel would claim 40 under a clock drawing at 64.
//
// PREDICTIONS:
//   * every pane fits, `done` is on screen in all four shots
//   * Timer's pane: `size 64 auto` and one option row
//   * Board's pane: six toggles/cycles plus Fade and Units
//   * Strafe's pane: eight rows ending on Best line
//
// FALSIFIED IF: any pane pushes `done` past the bottom edge.
// ===========================================================================
log_enable 1
log_dir logs
log_name b66d_panes
developer 1

hud_scale 2
cl_maxfps 250
con_notifylines 0

waitms 5000
map surf_kitsune
waitmap 45
waitms 4000

hud_edit on
waitms 600

echo ==== timer ====
hud_edit timer
waitms 700
screenshot
waitms 500
screenshot
waitms 500

echo ==== board ====
hud_edit board
waitms 700
screenshot
waitms 500
screenshot
waitms 500

echo ==== strafe ====
hud_edit strafe
waitms 700
screenshot
waitms 500
screenshot
waitms 500

echo ==== seq, the longest pane ====
hud_edit seq
waitms 700
screenshot
waitms 500
screenshot
waitms 500

echo ==== END ====
hud_edit off
waitms 500
log_enable 0
waitms 500
quit
