// P222 -- is the NESTED portal (a door seen through a door) actually broken,
// or is it just a dark piece of map?
//
// Established by p221: the depth-0 portal WORKS.  Arm A showed the far room,
// arm B (r_portaldebug 1) showed the opaque black clear, arm C
// (vbsp_portal_render 0) showed the red grid wall the doorway is set into.  Three
// different pictures, so the aperture is drawing and the recursed scene is
// reaching it.
//
// What is still black is the little doorway at screen centre INSIDE that view --
// a portal seen through a portal, i.e. recursion depth 1.  The [portal] readback
// reports `fbo centre mean 63` for recurse 1 in every run at every FBO size,
// which is bit-exactly the (0,0,0,255) clear, while recurse 0 varies with the
// camera (111, 127).  But that instrument is counter-limited to 12 reports and
// they all land at the spawn point, so it has never sampled these cameras.
//
// fov 20 magnifies the nested doorway from ~65px to something judgeable.  Then:
//
//   A  r_portalrecursion 2   nested door gets a scene
//   B  r_portalrecursion 1   nested door gets NO scene, so it renders CLOSED --
//                            GLBE_GenerateBatchTextures returns false at
//                            gl_backend.c:6013 and the batch is skipped entirely,
//                            leaving whatever the far room has behind it.
//   C  r_portalrecursion 2 + r_fastsky 1   the skyroom is drawn at recurse 3,
//                            INSIDE the depth-1 portal's FBO render ([world]
//                            recurse 3 is in the p221 log).  r_fastsky makes
//                            R_DrawSkyroom return false at gl_warp.c:348.
//
// A == B means the recursed scene contributes nothing and the nested portal is
// broken.  A != B means it is contributing, and the black is the map.

cfg_save_auto 0
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "p222"
scr_sshot_type png
cl_yieldcpu 0
cl_maxfps 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0
vbsp_portal_render 1
r_portalfbo 1
r_refract_fbo 1
r_portalmaxviews 2
r_portaldebug 0
r_fastsky 0

waitms 2500
map surf_kitsune
waitmap 240
waitms 8000
sv_cheats 1

setpos -15360 -15252 870 0 270 0
fov 20
waitms 2500

echo "@@@ P222 A -- r_portalrecursion 2, nested door rendered"
r_portalrecursion 2
waitms 2000
screenshot_mega p222_A_rec2 1280 720
waitms 800

echo "@@@ P222 B -- r_portalrecursion 1, nested door closed"
r_portalrecursion 1
waitms 2000
screenshot_mega p222_B_rec1 1280 720
waitms 800

echo "@@@ P222 C -- r_portalrecursion 2 + r_fastsky 1"
r_portalrecursion 2
r_fastsky 1
waitms 2000
screenshot_mega p222_C_nosky 1280 720
waitms 800

echo "@@@ P222 DONE"
r_fastsky 0
fov 90
waitms 1000
quit
