// Build 40: does the strafe target still get told you are pressing nothing?
//
// THE REPORT: "When I'm on a ramp, it says over the text of the ideal strafe
// speed in a really faded font I can barely read 'on ramp, no strafe key' or
// something like that, but I definitely am pressing a strafe key?"
//
// THE CAUSE IS NOT ON A RAMP, which is what makes this testable at all.
// HUD_WishDir read input_movevalues, and CSQC_ChangeLocalPlayer republishes
// that every rendered frame from cl_pendingcmd -- the usercmd being
// ACCUMULATED (pr_csqc.c:159-172) -- while CL_SendCmd runs before the screen
// update (cl_main.c:7575 vs :7661) and every full send ends in
// CL_ClearPendingCommands, which memsets it to zero (cl_input.c:1346-1358).
// So a frame that follows a send reads 0/0 with the key still down.
//
// Duty cycle is cl_netfps/framerate.  THAT IS WHY THIS RUNS AT cl_maxfps 67:
// with the frame rate at the send rate, nearly EVERY frame followed a send, so
// the old build would have failed this test on essentially every shot, and a
// pass here is not luck.  b40wish340.cfg is the same run at 340 for contrast.
//
// WHAT TO LOOK FOR: the `wish` row on the debug panel.  Its left half is the
// forward/side the engine handed over.  With +moveleft held it must read
// `0/-400` (or whatever cl_sidespeed is) on EVERY shot.  A `0/0` is the bug.
// `kb` on the right means the keyboard fallback answered instead, which should
// not happen here at all.
//
// Flat ground, no ramp, no aim required -- the whole point.

log_enable 1
log_name b40wish67
developer 1
log_developer 1
cfg_save_auto 0
cl_idlefps 0
sv_cheats 1
fs_missingwarn 0

// The worst case for the old bug: one rendered frame per outgoing command.
cl_netfps 66.6667
cl_maxfps 67

wait 200
map surf_aesthetic
waitmap 900
wait 300

// AFTER waitmap: hud_* are csprogs cvars and do not exist until csprogs loads
// with a map.  Set before, they are unknown commands and silently do nothing --
// which is how build 39's A/B produced eight screenshots of the wrong path.
hud_debug 1
hud_strafe 1
hud_keys 1
// The panel gained two rows in build 40 (`hold` and `wish`) and at its shipped
// y it now runs off the bottom of a short window -- which is how the first pass
// of this run produced twelve screenshots with the row under test cropped out.
hud_debug_y 0.30
wait 20

echo ^5=== b40wish: idle, nothing held -- wish must read 0/0 -> -- ===
screenshot
wait 20

echo ^5=== b40wish: +moveleft held, 12 shots at 67 fps ===
+moveleft
wait 20
// THE ACTUAL PROOF, and it goes to the log rather than to a screenshot: 120
// consecutive frames of what the engine handed HUD_WishDir.  At cl_maxfps 67
// against cl_netfps 66.6667 nearly every one of these frames follows a send,
// so on the old path nearly every line would read raw 0/0 with A held.  Not
// one may.
hud_wishtrace 120
wait 200
screenshot
wait 7
screenshot
wait 7
screenshot
wait 7
screenshot
wait 7
screenshot
wait 7
screenshot
wait 7
screenshot
wait 7
screenshot
wait 7
screenshot
wait 7
screenshot
wait 7
screenshot
wait 7
screenshot
wait 7
-moveleft

echo ^5=== b40wish: +forward +moveright, both axes ===
+forward
+moveright
wait 25
screenshot
wait 8
screenshot
wait 8
screenshot
-forward
-moveright

echo ^5=== b40wish: turn keys only -- wish must be 0/0 and say so ===
+left
wait 25
hud_wishtrace 20
wait 40
screenshot
-left

echo ^5=== b40wish: both strafe keys -- they cancel, and it should say so ===
+moveleft
+moveright
wait 25
hud_wishtrace 20
wait 40
screenshot
-moveleft
-moveright

echo ^5=== b40wish: nothing held at all, for the baseline ===
wait 30
hud_wishtrace 20
wait 40
screenshot

echo ^5=== b40wish: done ===
wait 50
quit
