// FTESurf build 61 -- DOES THE PER-MAP RENDER LAYER STICK?  The whole point.
//
// The layer is worth nothing if it leaks.  cfg/render_surf_tensor2.cfg sets
// vbsp_glare_interval 0.2; if that value is still in force after loading a
// different map then every map in the session inherits tensor2's framerate
// preference and its 197 ms of glare staleness, with nothing to put it back.
// That is not hypothetical -- it is exactly how mode_bhop.cfg's `cl_netfps 100`
// came to ride onto every surf map (see the netfps memory), and it is the
// reason cfg/render_default.cfg exists at all.
//
// Typing a cvar's name with no argument prints its value, so each arm below
// reads the cvar back out of the engine rather than trusting that the exec ran.
//
// ===================================================================
// PREDICTION, REGISTERED BEFORE THE RUN
// ===================================================================
//   A  surf_tensor2   0.2     and a `render: per-map layer` line naming the file
//   B  bhop_eazy      0.025   and NO per-map line (silent: it has no file)
//   C  surf_tensor2   0.2     again -- proves B restored the baseline rather
//                             than the layer having failed to apply in A
//
//   FAIL: B reads 0.2.  The override is sticky and render_default.cfg is not
//         doing its job.
//   FAIL: A or C reads 0.025.  The per-map file is not being found or the
//         ordering is wrong (baseline winning over the map file).
//   FAIL: B prints a `render:` line, or a "couldn't exec" warning for a map
//         with no file.  The absent case must be silent -- 1310 maps have no
//         file and a warning on each would be noise, which is the contract
//         Emit_LoadForMap and Zone_LoadForMap both keep.
//   FAIL: any arm reads "" or the cvar is reported unknown.  That is the
//         registercvar-before-read trap: cvar() auto-creates an unregistered
//         name as "" and registercvar then declines, which has silently killed
//         three features in this codebase.
//
// `map x` TWICE DOES NOT RELOAD, so arm C is a genuine second load only
// because arm B loaded something else in between.  That is deliberate.
cfg_save_auto 0
exec cfg/testrun/_quiet.cfg
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "b61layer"
cl_yieldcpu 0
vid_vsync 0
cl_maxfps 0

waitms 2500

echo "@@@ LAYER A. surf_tensor2 -- expect 0.2 and a render: line"
map surf_tensor2
waitmap 240
waitms 9000
echo "@@@ LAYER A readback:"
vbsp_glare_interval
waitms 2500

echo "@@@ LAYER B. bhop_eazy -- expect 0.025, silently"
map bhop_eazy
waitmap 240
waitms 9000
echo "@@@ LAYER B readback:"
vbsp_glare_interval
waitms 2500

echo "@@@ LAYER C. surf_tensor2 again -- expect 0.2"
map surf_tensor2
waitmap 240
waitms 9000
echo "@@@ LAYER C readback:"
vbsp_glare_interval
waitms 2500

echo "@@@ LAYER DONE"
waitms 1200
quit
