// Patch 279, probe C -- WHICH of the two samplers is black?
//
// Run B settled the shield question in the wrong direction: at sixty units,
// hl2_twotexture 0 draws the dense crackle web and hl2_twotexture 1 draws
// NOTHING AT ALL.  So the new arm is producing black, and the two candidates
// are the 2D-array base and the second layer.
//
// The gamedir copy of glsl/vmt/twotexture.glsl overrides the one compiled into
// the plugin, so the shader can be instrumented without a plugin rebuild.  It
// is currently patched to write the two samples into RED and GREEN:
//
//     red only    s_upper never arrived  -- the uppermap binding is the fault
//     green only  s_base never arrived   -- the $2darray map is the fault
//     yellow      both arrived, and the MULTIPLY is what is dark
//     black       neither
//
// One vantage, sixty units from the shield, sprites off so the map's own
// env_sprite is not painting over the answer.

vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000
cl_maxfps 0
cl_idlefps 0
cl_yieldcpu 0
sv_cheats 1

developer 1
log_developer 1
map surf_tensor2
waitmap 600
waitms 9000
developer 0
log_developer 0

noclip
vbsp_sprites 0
vbsp_sprite_debug 2
waitms 1500

setpos -11776 -10876 13744 0 90 0
waitms 2500
screenshot p279c_probe_x
waitms 900
screenshot p279c_probe
waitms 900

echo ^5=== END OF RUN ===
waitms 500
quit
