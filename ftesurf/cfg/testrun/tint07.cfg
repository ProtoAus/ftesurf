// TINT07 -- Patch 237 control.  A material with $alphatest and NO
// $alphatestreference must still get Source's default 0.5, and the decals fixed
// by Patch 236 must still be fixed.
log_enable 1
log_dir "logs"
log_name "tint07"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
sv_cheats 1
developer 0
wait 200
map bhop_futile
waitmap 900
waitms 2500
con_clear
echo ^5--- CONTROL: $alphatest 1, no reference -> must be MASK=0.500000 ---
r_shaderpasses de_nuke/nuke_metalgrate_01
waitms 400
echo ^5--- Patch 236 must still hold ---
r_shaderpasses decals/ivy02
waitms 400
echo ^5--- and a plain wall, untouched by either patch ---
r_shaderpasses concrete/concretefloor024a
waitms 400
noclip
waitms 300
setpos 540.3427 4427.8555 7510.5981 11.9092 143.9758 0
wait 150
waitms 800
screenshot tint07_futile_s7_after237
waitms 1000
wait 30
quit
