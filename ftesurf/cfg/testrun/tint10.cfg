// TINT10 -- Patch 240 basevelocity, second attempt.
//
// tint09's probe was placed at the exact TOP FACE of the push brush and the
// player was embedded in geometry: all eight samples returned the setpos
// coordinates unchanged, not even falling.  That was a bad probe, not a bad
// patch -- the control in the same run fell and teleported normally.
//
// Brush bounds now read from the BSP models lump rather than guessed:
//   *86  (speed 1800, +Y)   half-size (64, 256, 64)  about origin 6912 3328 -64
//                            => z spans -128..0, so z=0 was the ceiling face.
//   *252 (speed 1250, UP)   half-size (512, 496, 1280) about 1536 -10736 14336
//                            => a 1024 x 992 x 2560 SHAFT, z spans 13056..15616.
//
// *252 is the better instrument and it is the one that DISCRIMINATES:
//
//   pushdir "-90 0 0" is pitch -90, and makevectors gives v_forward = (0,0,1),
//   i.e. straight up at 1250 u/s, through 2560 units of shaft.
//
//   OLD CODE raised the player's OWN .velocity along the push.  Leaving the top
//   of the shaft you would still be carrying 1250 u/s upward and would coast to
//   an apex ~975 units above the exit before gravity won.
//
//   NEW CODE is Source's carrier: the engine adds basevelocity before the move
//   and subtracts it after, so .velocity is never touched.  While inside you
//   rise; the instant you leave you have only your own velocity, which gravity
//   has been driving NEGATIVE the whole time you were held up.  So you should
//   drop away immediately, with no coast.
//
// That difference -- coast versus immediate drop at the top -- is the signal.
// Rising at all also proves the field reaches pmove, since nothing else in the
// engine writes pmove.basevelocity for a QuakeC game.

log_enable 1
log_dir "logs"
log_name "tint10"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
sv_cheats 1

wait 200
echo ^5=== tint10: Patch 240 basevelocity, vertical shaft probe ===

map bhop_arcane
waitmap 1800
waitms 4000

echo ^5====== PROBE A: bottom of the speed-1250 UPWARD shaft (*252) ======
echo ^5====== shaft spans z 13056..15616 at x 1024..2048, y -11232..-10240 ======
setpos 1536 -10736 13100 0 90 0
waitms 200
echo ^3--- A t=0.0
viewpos
waitms 300
echo ^3--- A t=0.3
viewpos
waitms 300
echo ^3--- A t=0.6
viewpos
waitms 300
echo ^3--- A t=0.9
viewpos
waitms 300
echo ^3--- A t=1.2
viewpos
waitms 300
echo ^3--- A t=1.5
viewpos
waitms 300
echo ^3--- A t=1.8
viewpos
waitms 300
echo ^3--- A t=2.1  (should be at or past the top of the shaft by now)
viewpos
waitms 300
echo ^3--- A t=2.4
viewpos
waitms 300
echo ^3--- A t=2.7  (NEW: already falling.  OLD: still coasting upward)
viewpos
waitms 600
echo ^3--- A t=3.3
viewpos
waitms 300
screenshot tint10_shaft

echo ^5====== PROBE B: inside the speed-1800 +Y volume (*86), z corrected ======
echo ^5====== volume spans x 6848..6976, y 3072..3584, z -128..0 ======
setpos 6912 3100 -120 0 90 0
waitms 200
echo ^3--- B t=0.0
viewpos
waitms 300
echo ^3--- B t=0.3
viewpos
waitms 300
echo ^3--- B t=0.6
viewpos
waitms 600
echo ^3--- B t=1.2
viewpos
waitms 600
echo ^3--- B t=1.8
viewpos
waitms 300
screenshot tint10_corridor

echo ^5=== tint10 done ===
wait 30
quit
