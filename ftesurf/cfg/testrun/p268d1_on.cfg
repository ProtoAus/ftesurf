// cfg_save_auto 0: this run sets archived cvars (vid_*, cl_maxfps); never let it write them into ftesurf.cfg (cl_main.c:2535)
cfg_save_auto 0
// Patch 268 D1 -- bumped-lightmap style-walk stride.  ARM: hl2_bumpstride 1
// Twin of p268d1_off.cfg; the ONLY differences are the hl2_bumpstride line, the ARM echo
// and the on/off prefixes.  One process per arm.  Expected in the log: one
// "VBSP: <map> lightmap stride ..." line per map (counts in ENGINE_PATCHES.md Part D1).
// PREDICTED SIGNS (offline decode of the BSP, wf/refute268/luxels.py): affl1 and affl2
// BRIGHTER (x2.05, x2.12 linear) with G/R rising; org1 DARKER (x0.50); flood1 DARKER
// (x0.68); flood2 DARKER (x0.52); sup1 DARKER (x0.77); ctrl_tomb and ctrl_sup IDENTICAL.
// On a build that also carries Patch 281 the sup1 prediction is superseded: see the surf_sup section.
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000
wait 200

developer 1
log_developer 1
log_enable 1
log_dir logs
log_name p268d1_on
cl_maxfps 0
cl_idlefps 0
sv_cheats 1
con_notifylines 0
con_notifytime 0
con_notifytime_error 0
r_drawentities 0
r_lightstylescale 1

hl2_bumpstride 1
echo ^5=== ARM hl2_bumpstride 1

// --- surf_affliction: v20, layout 1/4, 3505 bumped+lightstyled world faces; both vantages BRIGHTEN ---
map surf_affliction
waitmap 600
waitms 9000
noclip
waitms 1000
// face 26797 DEPRESSION/GOTIC/GOTICFLOOR2 34x33 styles 0,37 centroid -11780 219 -2116 normal +x
setpos -11580 219 -2116 0 180 0
waitms 2500
cmd viewpos
screenshot p268d1_on_affl1_x
waitms 700
screenshot p268d1_on_affl1
waitms 700
screenshot p268d1_on_affl1_n
// face 33326 same material 33x34 styles 0,37 centroid -10460 -20 -6042 normal +y
setpos -10460 180 -6042 0 270 0
waitms 2500
cmd viewpos
screenshot p268d1_on_affl2_x
waitms 700
screenshot p268d1_on_affl2
waitms 700
screenshot p268d1_on_affl2_n

