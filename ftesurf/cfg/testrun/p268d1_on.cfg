// --- surf_sup: v21, layout 1/4+trailer.  sup1 is a bumped 2-style floor that must DARKEN;
// ctrl_sup is an UNBUMPED 2-style floor that must be pixel-identical (it would scramble
// under a per-style trailer tag: the refuted design read it x0.94 with garbage exponents) ---
// NOTE (main session, Patch 281 interaction): surf_sup is one of the nine maps that Patch 281
// repacks per face (its lightofs sits off the 4-byte grid), and the repack copies only set 0 of
// each style. So on surf_sup the D1 probe prints
//   "lightmap was repacked per face (Patch 281): one luxel set per lightstyle, no stride tag needed"
// instead of a stride line, and the ON and OFF arms must be PIXEL-IDENTICAL at sup1 and ctrlsup
// (both arms read the repacked data). sup1 still darkens relative to the PRE-patch binary; that is
// Patch 281's effect, not D1's.
map surf_sup
waitmap 600
waitms 9000
noclip
waitms 1000
// face 6376 rubbertrainfloor001a 6x9 styles 0,32 bumped centroid -5650 2662 664 normal +z
setpos -5650 2662 814 89 0 0
waitms 2500
cmd viewpos
screenshot p268d1_on_sup1_x
waitms 700
screenshot p268d1_on_sup1
waitms 700
screenshot p268d1_on_sup1_n
// face 5396 CUSTOM/WATERCOLORPINKISH 33x33 styles 0,32 UNBUMPED centroid -280 4808 -3392 normal +z
setpos -280 4808 -3192 89 0 0
waitms 2500
cmd viewpos
screenshot p268d1_on_ctrlsup_x
waitms 700
screenshot p268d1_on_ctrlsup
waitms 700
screenshot p268d1_on_ctrlsup_n

// --- CONTROL surf_tomb_redone: v20, layout 1/4, ZERO bumped faces, 4124 lightstyled faces ---
map surf_tomb_redone
