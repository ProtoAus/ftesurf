// FTESurf p288b -- HOST half.  The control for "different locally or server".
//
// p288a measured the LISTEN-SERVER side only: surf_kitsune loaded by `map` in
// the same process that renders it.  Both vantages came out matching their
// Sept 4 baselines (p220_hub100.png, p220_s1.png), so the alpha-ordering
// symptom does not reproduce there.  That is one half of a two-sided report and
// on its own it proves nothing -- the missing picture is a client rendering a
// map it did NOT load itself, which is the case Lex is describing.
//
// PORT 27600, NOT the default 27500 -- p270_2c_host.cfg:18-26 explains why at
// length: binding the default silently loses the race against Lex's own server
// and the guest then screenshots somebody else's map.
sv_port 27600

// setpos is cheat-protected and is executed SERVER-side, so the guest's
// vantages are only reachable if the host allows them.  Without this the join
// half screenshots wherever it spawned and the two runs are not comparable.
sv_cheats 1

// The leading wait is load-bearing: a startup +exec runs before the mod is
// initialised and an early `map` is silently dropped (p270_2c_host.cfg:9-12).
wait 200
echo "^3p288:^7 host loading surf_kitsune on 27600"
map surf_kitsune

wait 400
echo "^3p288:^7 host up"

// Does not quit.  Frame budgets are not comparable across two processes, so the
// runner kills this one once the guest is done.
