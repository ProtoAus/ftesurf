// LM666C -- is the "fullbright" look actually the ENVMAP being added on top?
//
// What lm666.cfg established: with r_fullbright 1 the brown walls and the tiled
// floor brighten enormously, while the speckled brick on the right barely moves.
// So those surfaces were ALREADY drawing at close to full brightness -- they are
// not being darkened by the map's (measured: mean luminance 0.013-0.052) lightmap.
//
// The candidate mechanism is not the lightmap at all.  lightmapped.glsl ends with
//
//     #ifdef REFLECTCUBEMASK
//       #if defined(ENVFROMBASE) || !defined(BUMP)
//         #define refl 1.0 - diffuse_f.a
//       #else
//         #define refl 1.0 - texture2D(s_normalmap, tex_c).a
//       #endif
//       diffuse_f.rgb += (cube_t * vec3(refl,refl,refl));
//     #endif
//
// REFLECTCUBEMASK is a !!permu the ENGINE sets when the shader has a reflectcube,
// not something mat_vmt.c asks for -- and shader_here reports haspass=1 with
// surfenv=materials/maps/surf_666/cubemapdefault.vtf on these very surfaces.
// surf_666 was never buildcubemaps'd, so that cube is the flat default grey.
// If `refl` comes out near 1 -- a basetexture whose alpha is 0, or a $bumpmap
// whose file does not resolve (concrete01 asks for materials/de_artcenter/
// concrete01_NRM.vtf while its diffuse lives under RealWorldTextures/) -- then a
// CONSTANT grey is added to every pixel.  Flat, bright, and indistinguishable
// from fullbright, on exactly the materials that get an envmap and no others.
//
// Three cvars kill it at three different depths, so which one works names the layer:
//   r_reflectcube 0  engine runtime gate on the reflection itself
//   hl2_envmap 0     plugin: no $envmap shader path at all
//   hl2_cubemaps 0   plugin: empty the map's baked env_cubemaps (MAPLATCH)
//
// Same vantage as lm666.cfg, noclip first (setpos alone let the player fall into
// a reset trigger and the first run photographed the spawn room).

log_enable 1
log_dir "logs"
log_name "lm666c"
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 0
vid_fullscreen 0
developer 1
log_developer 1
con_notifytime 0
con_notifylines 0
con_notifytime_error 0

wait 200

map surf_666
waitmap 1800
waitms 9000
sv_cheats 1
waitms 500
noclip
waitms 500
setpos -100.325 -13112.070 11281.580 3.148 -130.446 0
waitms 2500

echo ^5=========== A: baseline ============================================
shader_here lm666c-A
waitms 500
developer 0
waitms 2500
screenshot lm666c_a_base
waitms 900

echo ^5=========== B: r_reflectcube 0 -- no cubemap reflection at all =====
developer 1
r_reflectcube 0
waitms 4000
shader_here lm666c-B
waitms 500
developer 0
waitms 2000
screenshot lm666c_b_noreflect
waitms 900

echo ^5=========== C: back on, proving B changed state ====================
r_reflectcube 1
waitms 4000
screenshot lm666c_c_reflectback
waitms 900

echo ^5=========== D: hl2_envmap 0 -- no $envmap shader path ==============
developer 1
hl2_envmap 0
waitms 4000
shader_here lm666c-D
waitms 500
developer 0
waitms 2000
screenshot lm666c_d_noenvmap
waitms 900
hl2_envmap 1
waitms 3000

echo ^5=== lm666c done ===
wait 30
quit
