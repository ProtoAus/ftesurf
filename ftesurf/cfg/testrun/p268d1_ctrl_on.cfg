// cfg_save_auto 0: this run sets archived cvars (vid_*, cl_maxfps); never let it write them into ftesurf.cfg (cl_main.c:2535)
cfg_save_auto 0
// Patch 268 D1 -- re-shoot of the surf_tomb_redone CONTROL vantage only.  ARM: hl2_bumpstride 1
// The original p268d1_off/on cfgs took the tomb control wherever the player happened to be 9 s
// after spawn (no setpos), and the two arms drifted 241 units apart (viewpos 3806.7 629.0 vs
// 4034.7 709.0), so their pixel diff was a moved camera, not a lighting effect.  This twin pins
// the camera at the ON arm's original vantage.  Twin of p268d1_ctrl_off.cfg; the ONLY differences
// are the hl2_bumpstride line, the ARM echo and the on/off prefixes.  One process per arm.
// EXPECTED: tomb has 0 bumped faces, so the stride line says "0 tagged" on both arms and the two
// arms are pixel-identical (effect <= max(floor, floor2)).
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000
wait 200

developer 1
log_developer 1
log_enable 1
log_dir logs
log_name p268d1_ctrl_on
cl_maxfps 0
cl_idlefps 0
sv_cheats 1
con_notifylines 0
con_notifytime 0
con_notifytime_error 0
r_drawentities 0
r_lightstylescale 1

hl2_bumpstride 1
echo ^5=== ARM hl2_bumpstride 1 (tomb control re-shoot)

// --- CONTROL surf_tomb_redone: v20, layout 1/4, ZERO bumped faces, 4124 lightstyled faces ---
map surf_tomb_redone
waitmap 600
waitms 9000
noclip
waitms 1000
setpos 4034.7 709 1024.8 0 180 0
waitms 2500
cmd viewpos
screenshot p268d1_on_ctrl2_x
waitms 700
screenshot p268d1_on_ctrl2
waitms 700
screenshot p268d1_on_ctrl2_n

echo ^5=== END OF RUN ===
waitms 500
quit
