// FTESurf ccglow -- the two things p286z could not settle: patch 288's colour
// grade (whose shader never ran) and env_lightglow (which never had a glow in
// view).  Named for what it tests rather than for a patch number, because it
// covers one engine patch and one QC build.
//
// THE LIGHTGLOW VANTAGES ARE DERIVED, NOT GUESSED.  p286z aimed at a pair of
// glows 440 units off the corridor axis and saw nothing, with 351 of 360 glares
// reported hidden by the occlusion trace -- which is what a glow embedded in a
// side wall looks like and says nothing about the feature.  Each vantage below
// is 1500 units along ONE glow's own forward vector, at its own height, looking
// back at it: inside MinDist 500 / MaxDist 2500 so the fade is about .5, on the
// lit side of a one-sided flare, and with the wall it is mounted on behind it
// rather than between us.  Eight of them, spread at least 3000 units apart, so
// a room that happens to be blocked does not decide the answer.
//
// PASS for the glows: at least one vantage shows a flare that is visibly WIDER
//   THAN TALL (65 x 35 at a fixed 100 units from the eye, so about 66 degrees
//   across), and it disappears at vbsp_lightglow 0.
// FAIL: every vantage identical between the two arms -- then the draw path is
//   still not reached and the ramp fix was not the only gate.
//
// PASS for the grade: hl2_colourcorrection 1 vs 0 moves far more of the frame
//   than the same-setting control, whites move toward (203,217,250) and the
//   shadows crush.  The log must carry "[cclut] ... registered", a "[cclut]
//   <file>: 32x32x32" line per LUT, and a shader line with prog 1 passes 3.
// FAIL modes worth telling apart, and all three are visible in one picture:
//   nothing changes            -> the stage never ran (prog 0 again)
//   the screen goes one colour -> a .raw failed and bound missing_texture
//   it changes the wrong way   -> the LUT axis order, which is the one thing
//                                 here that was measured rather than assumed
cfg_save_auto 0
exec cfg/testrun/_quiet.cfg
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "ccglow"
scr_sshot_type png
cl_yieldcpu 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0

waitms 2500

map surf_tensor2
waitmap 240
waitms 8000
sv_cheats 1
noclip
waitms 500

echo "@@@ CCGLOW ---- state ----"
r_colourcorrection
hl2_colourcorrection
vbsp_lightglow
ent_view_solid
waitms 800

// ============================================ the grade, at the spawn vantage
echo "@@@ CCGLOW grade: A / A2 control / B / half"
setpos -11684 -12864 13936 0 0 0
waitms 2500
hl2_colourcorrection 1
waitms 1200
screenshot_mega ccglow_cc_a 1280 720
waitms 1200
screenshot_mega ccglow_cc_a2 1280 720
waitms 1200
hl2_colourcorrection 0
waitms 1200
screenshot_mega ccglow_cc_b 1280 720
waitms 1200
hl2_colourcorrection 0.5
waitms 1200
screenshot_mega ccglow_cc_half 1280 720
waitms 1000
hl2_colourcorrection 1
waitms 1000

// ============================================ eight glow vantages, ON
echo "@@@ CCGLOW glows ON -- eight vantages, each 1500u along one glow's forward"
vbsp_lightglow 1
waitms 1200

setpos 13312 5860 7204 0 270 0
waitms 2000
screenshot_mega ccglow_g1_on 1280 720
waitms 700
// the control pair goes here, at the first vantage, so there is a noise floor
screenshot_mega ccglow_g1_on2 1280 720
waitms 700
vbsp_sprite_debug 1
waitms 900

setpos -11684 -12864 13936 0 0 0
waitms 1800
screenshot_mega ccglow_g2_on 1280 720
waitms 700
vbsp_sprite_debug 1
waitms 900

setpos -10844 192 -9920 0 180 0
waitms 1800
screenshot_mega ccglow_g3_on 1280 720
waitms 700

setpos 2852 -5824 -10784 0 180 0
waitms 1800
screenshot_mega ccglow_g4_on 1280 720
waitms 700

setpos 804 4928 6656 0 180 0
waitms 1800
screenshot_mega ccglow_g5_on 1280 720
waitms 700

setpos -6812 -4896 13216 0 180 0
waitms 1800
screenshot_mega ccglow_g6_on 1280 720
waitms 700

setpos 2596 -13536 -288 0 180 0
waitms 1800
screenshot_mega ccglow_g7_on 1280 720
waitms 700

setpos -3292 10720 9496 0 180 0
waitms 1800
screenshot_mega ccglow_g8_on 1280 720
waitms 700

// ============================================ the same eight, OFF
echo "@@@ CCGLOW glows OFF -- the same eight vantages"
vbsp_lightglow 0
waitms 1500

setpos 13312 5860 7204 0 270 0
waitms 1800
screenshot_mega ccglow_g1_off 1280 720
waitms 700
setpos -11684 -12864 13936 0 0 0
waitms 1800
screenshot_mega ccglow_g2_off 1280 720
waitms 700
setpos -10844 192 -9920 0 180 0
waitms 1800
screenshot_mega ccglow_g3_off 1280 720
waitms 700
setpos 2852 -5824 -10784 0 180 0
waitms 1800
screenshot_mega ccglow_g4_off 1280 720
waitms 700
setpos 804 4928 6656 0 180 0
waitms 1800
screenshot_mega ccglow_g5_off 1280 720
waitms 700
setpos -6812 -4896 13216 0 180 0
waitms 1800
screenshot_mega ccglow_g6_off 1280 720
waitms 700
setpos 2596 -13536 -288 0 180 0
waitms 1800
screenshot_mega ccglow_g7_off 1280 720
waitms 700
setpos -3292 10720 9496 0 180 0
waitms 1800
screenshot_mega ccglow_g8_off 1280 720
waitms 700
vbsp_lightglow 1
waitms 800

// ============================================ the inspector, shipped default
echo "@@@ CCGLOW ent_here at the spawn portal with the shipped default"
setpos -11776 -11020 13680 0 90 0
waitms 1800
ent_here
waitms 1800

echo "@@@ CCGLOW DONE"
waitms 1200
quit
