// C1 -- is the prop frame CPU-bound or GPU-bound?  Measure before fixing.
//
// The diagnosis so far is solid on MECHANISM and unmeasured on SIZE:
//
//   Source MDLs set both ofs_skel_xyz AND ofs_skel_weight (mod_hl2.c:670-675), so
//   they miss the rigid static-VBO branch at com_mesh.c:2100 and land in the
//   numbones branch.  There, `usebones` comes from gl_alias.c:1954 =
//   shader->prog->supportedpermutations & PERMUTATION_SKELETAL.  Only
//   vmt/vertexlit.glsl declares `!!permu SKELETAL`; lightmapped, unlit,
//   transition, animated, water and refract do not -- and mat_vmt.c:1602 makes
//   vmt/unlit the fallback for ANY unrecognised shader.
//     usebones true  -> static VBO + bone uniform   (com_mesh.c:2196)  cheap
//     usebones false -> Alias_BuildSkeletalMesh CPU skinning (:2143) and *vbop
//                       stays NULL (set :2099) -> dynamic re-upload every frame
//
// Every ms-level attribution of surf_demise's 25.6ms opaque cost in the source
// material was an ESTIMATE with no citation.  This settles it with one cvar:
//
//   r_speeds 3 calls glFinish (render.h:947).  r_speeds 2 does not.
//   Opaque-us(3) ~= Opaque-us(2)  =>  CPU-bound, and the static-VBO fix is the
//                                     whole prize.
//   Opaque-us(3) >> Opaque-us(2)  =>  the GPU is the wall and no amount of
//                                     batching, VBO binding or instancing helps.
//
// Fixed viewpoint: surf_demise's own info_player_start, which is where Patch 193
// took its 23.2 fps / 26.9ms / 5,230,080-index reading.  Do not move -- these
// numbers are only comparable at the same place.
//
// developer 1 from the start, because com_mesh.c:4670's
//   "exceeds gpu bone limit and will be software-skinned"
// only prints at model load.  That is the OTHER cause of CPU skinning, and its
// ABSENCE does not clear the props -- the shader->prog route is a separate
// failure with no message at all.

log_enable 1
log_name p230a
developer 1
cfg_save_auto 0
cl_idlefps 0
sv_cheats 1

wait 200
echo ^5=== p230a: CPU or GPU? ===

map surf_demise
waitmap 900
wait 300

echo ^5--- r_speeds 2 (no glFinish) ---
r_speeds 2
wait 240
screenshot
waitms 800

echo ^5--- r_speeds 3 (WITH glFinish -- the decisive one) ---
r_speeds 3
wait 240
screenshot
waitms 800

echo ^5--- control: r_drawentities 3 skips mod_alias, i.e. exactly the props ---
echo ^5(Patch 193 measured 23.2 -> 271.4 fps here; confirms props are still the cost)
r_drawentities 3
wait 240
screenshot
waitms 800
r_drawentities 1
r_speeds 0

echo ^5=== p230a done ===
wait 30
quit
