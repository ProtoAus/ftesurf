// V268E -- Patch 268 Part E: vid_fullscreen renumbering, vid_winmaximize, and
// exclusive fullscreen matching the display.
//
// TWO INDEPENDENT INSTRUMENTS, neither of which needs anyone to look at a picture:
//
//   1. THE SCREENSHOT'S PIXEL DIMENSIONS (read from the PNG header).
//   2. THE LOG'S MODE LINE, which names the internal mode:
//        internal 0 windowed   -> "Setting windowed mode W*H"
//        internal 1 exclusive  -> "Setting mode W*H bpp [hz]"
//        internal 2 borderless -> "Setting fullscreen windowed"
//      This matters because once exclusive matches the desktop, borderless and
//      exclusive are the SAME SIZE and only the log tells them apart.
//
// Desktop is 1920x1200.
//
//   E1  fs 0, winmax 1, explicit 1280x800   -> 1280x800, "Setting windowed mode"
//        The screenshot-harness case. 154 cfg/testrun scripts run vid_fullscreen 0
//        and compare frames pixel-for-pixel, so an explicit size must stay EXACT.
//   E2  same, winmax 2                      -> WORK AREA, not 1280x800
//        The human case: ftesurf.cfg archives 1920x1200, so "maximize only when no
//        explicit size" would never fire for a real user. This is the escape hatch.
//        NOTE this is the step that failed the first run: gl_vidnt.c's WGL arm
//        called SW_SHOWNORMAL after VID_SetWindowedMode and undid the maximize.
//   E3  fs 1                                -> 1920x1200, "Setting fullscreen windowed"
//   E4  FALSIFIER: order 0, SAME value 1    -> "Setting mode", i.e. EXCLUSIVE
//        E3 and E4 write the SAME NUMBER to vid_fullscreen. If both log the same
//        mode, the translation is inert and the patch does nothing.
//   E5  order 1, value 2                    -> "Setting mode 1920*1200", exclusive
//        at the DESKTOP resolution even though vid_width is still 1280.
//   E6  same but vid_exclusive_desktopres 0 -> "Setting mode 1280*800"
//        E5 vs E6 is the A/B for "exclusive should find your resolution": same mode,
//        same vid_width, and 0 must reproduce the old mode-switching behaviour.

log_enable 1
log_dir "logs"
log_name "v268e"
developer 1
log_developer 1
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 0
con_notifytime 0
con_notifylines 0
con_notifytime_error 0

wait 200
echo ^5=== v268e: Patch 268 Part E ===

echo ^5----- E1: fs 0 + winmax 1 + explicit 1280x800 -> expect 1280x800 windowed -----
vid_fullscreen_order 1
vid_exclusive_desktopres 1
vid_winmaximize 1
vid_fullscreen 0
vid_width 1280
vid_height 800
vid_restart
waitms 5000
screenshot v268e_x
waitms 900
screenshot v268e_1_win_explicit
waitms 1200

echo ^5----- E2: winmax 2 -> expect WORK AREA, not 1280x800 -----
vid_winmaximize 2
vid_restart
waitms 5000
screenshot v268e_x
waitms 900
screenshot v268e_2_win_maximized
waitms 1200

echo ^5----- E3: vid_fullscreen 1 -> expect BORDERLESS 1920x1200 -----
vid_winmaximize 1
vid_fullscreen 1
vid_restart
waitms 5000
screenshot v268e_x
waitms 900
screenshot v268e_3_borderless
waitms 1200

echo ^5----- E4: FALSIFIER -- order 0, same value 1 -> expect EXCLUSIVE -----
vid_fullscreen_order 0
vid_restart
waitms 6000
screenshot v268e_x
waitms 900
screenshot v268e_4_falsifier_exclusive
waitms 1200

echo ^5----- E5: order 1, value 2, desktopres 1 -> expect EXCLUSIVE 1920x1200 -----
vid_fullscreen_order 1
vid_fullscreen 2
vid_restart
waitms 6000
screenshot v268e_x
waitms 900
screenshot v268e_5_exclusive_desktop
waitms 1200

echo ^5----- E6: desktopres 0 -> expect EXCLUSIVE 1280x800 (old behaviour) -----
vid_exclusive_desktopres 0
vid_restart
waitms 6000
screenshot v268e_x
waitms 900
screenshot v268e_6_exclusive_explicit
waitms 1200

echo ^5----- restoring a sane window before exit -----
vid_exclusive_desktopres 1
vid_fullscreen 1
vid_width 0
vid_height 0
vid_restart
waitms 4000

echo ^5=== v268e done ===
wait 30
quit
