// BUILD 49 -- the Source visual entities.  NOTHING BELOW HAS BEEN RUN.
//
// Seven classes that had never drawn a pixel, on roughly 640 of the 1310 maps.
// exec testrun/b49emit and read the console.
//
// ORDER MATTERS.  Step 1 is the one that can invalidate every other step, and
// it is cheap.  Do it first and stop if it fails.
//
//
// ---------------------------------------------------------------------------
// 1. DOES THE EFFECT FILE EXIST AND PARSE?  This is the whole bet.
//
//    The effects live in ftesurf/particles/ftesurf.cfg and are pulled in BY
//    NAME: cl_emit.qc asks particleeffectnum for "ftesurf.dustmote_0", the
//    engine splits that on the dot, fails to find it, and auto-loads
//    particles/ftesurf.cfg (p_script.c:674-675).  That load is QUEUED through
//    the command buffer, so the handle is a promise, not a result -- it is
//    re-resolved a frame or two later by CL_RegisterParticles.
//
//    So `emit_list` will print three handles.  What they mean:
//
//      non-zero, and things draw     everything worked
//      non-zero, nothing draws       the handles were allocated but
//                                    particles/ftesurf.cfg did not parse.
//                                    `r_part` alone in the console lists what
//                                    the engine actually has.
//      zero                          particleeffectnum failed outright, which
//                                    would mean r_particlesystem is not
//                                    "script"
//
//    Two engine cvars this depends on, both already at the right default and
//    therefore both worth printing rather than assuming:
//
echo "--- 1. handles and the two engine defaults ---"
r_particlesystem
r_part_sparks
emit_list
//
//
// ---------------------------------------------------------------------------
// 2. THE COMMON CASE.  func_dustmotes is 4999 instances across 464 maps and is
//    the single most valuable thing here.  bhop_epiphany carries 134 of them --
//    big enough to see, small enough to read a report about.
//
//      map bhop_epiphany
//      emit_list
//
//    Expect one "^3emit:^7 N emitters on bhop_epiphany: ..." line at load.
//    A map that prints NOTHING at load is a map with none of the seven
//    classes, which is deliberate and is roughly half the library.
//
//
// ---------------------------------------------------------------------------
// 3. THE COST TEST, and the only one that can go badly.
//
//    surf_shade holds 339 func_dustmotes -- at the library's median SpawnRate
//    that is 13560 particles/sec and ~54000 live, 83% of the engine's entire
//    particle pool, before any culling.  The budget is what makes that safe,
//    not the distance cull, so this is where to prove the budget works.
//
//    Use show_fps, NOT timerefresh: timerefresh never calls CSQC_UpdateView,
//    so it cannot measure anything CSQC drives -- including all of this.
//
//      map surf_shade
//      cl_maxfps 0 ; show_fps 1
//      // stand somewhere dense, then A/B at the SAME spot, repeatedly:
//      vbsp_emit 0     // <- this is build 48 exactly
//      vbsp_emit 1
//      emit_list       // reports demand/sec, budget, and the throttle
//
//    If throttle reads < 1 the budget is doing its job.  If the frame cost is
//    visible even at throttle 1, lower vbsp_emit_budget rather than reaching
//    for vbsp_emit_dist -- density scales smoothly, distance pops.
//
//
// ---------------------------------------------------------------------------
// 4. THE OTHER SIX CLASSES, worst map first in each case:
//
//      map surf_stonework4     531 env_fire -- the biggest point-class load in
//                              the library.  Then try vbsp_emit_lights 2.
//      map surf_resource       127 func_dustcloud (the alpha-30 family)
//      map surf_leesriize       46 env_spark
//      map surf_minimumwage     55 env_bubbles, in water columns
//      map surf_fortress_ksf    26 env_embers
//
//    func_smokevolume ships OFF -- `vbsp_emit_smoke 1` to see it.  It is an
//    approximation of something Source draws as a static lattice, which is why
//    it is opt-in rather than on.
//
//
// ---------------------------------------------------------------------------
// 5. WHAT `emit_list` IS TELLING YOU.
//
//    Per class: seen / emitting / off.  "off" is a deliberate skip and the
//    numbers are expected to be large for two classes -- 44% of env_embers and
//    40% of env_spark are authored to wait for a trigger this client cannot
//    hear about, because there is no server-to-client entity channel in this
//    game at all.  Those are correctly invisible.
//
//    An "unaccounted" line should read 0 or near it.  It is computed, not
//    tallied, so a number there means something is being read and thrown away
//    by a path that forgot to say so -- report it rather than ignoring it.
//
//    "dropped N past EM_MAX" in red means a map exceeded 768 emitters and the
//    rest were silently not created.  No map in the library should.
//
//
// ---------------------------------------------------------------------------
// 6. THE SETTINGS ROW.  gfx_menu, row 28, "Map particles".  It should grey
//    itself out and read "map has none" on a map with none of the seven, and
//    it should take effect INSTANTLY -- no map reload, no `*` marker.  The
//    per-class cvars are instant too, deliberately.
echo "b49emit: read the comments in cfg/testrun/b49emit.cfg -- step 1 first"
