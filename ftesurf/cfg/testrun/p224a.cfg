// Patch 224 -- the per-gamemode movement ruleset, checked rather than asserted.
//
// Five claims, and each has a step here that could fail:
//
//   1. DETECTION USES THE INDEX FIRST, THE NAME SECOND.  surf_null's mapmeta
//      row exists but its mode column is "-", so it must resolve through the
//      NAME (src `name`); bhop_futile's row says 2, so it must resolve through
//      the INDEX (src `mapmeta`).  One map alone could not tell those apart --
//      a build that only ever read the prefix would pass on both.
//
//   2. THE RULESET ACTUALLY LANDS.  Not "the file was found": the live values
//      are read back one at a time, and the CS:S movement banner (which is
//      printed from movevars, i.e. from what the mover will actually use, not
//      from the cvars) must say 100 Hz.
//
//   3. THE LOCK IS NOW MODE-AWARE.  Typing pm_ticrate 0.015 on a bhop map must
//      be reverted TO 0.01 -- the mode's value -- and the warning names the
//      value it restored, so the log says which one won.  A locked cvar the
//      mode does NOT mention must still revert to default.cfg's number, which
//      is what proves the overlay did not replace the base ruleset wholesale.
//
//   4. NOTHING LEAKS INTO THE NEXT MAP.  Back to surf_null and all six values
//      must be default.cfg's again -- including cl_netfps and run_starthop,
//      which are NOT in the engine's locked table and therefore have to be put
//      back by the overlay teardown rather than by the lock.  This is the step
//      that fails if SV_ClearGamemodeOverrides is wrong, and its symptom would
//      be a surf map quietly running at 100 Hz.
//
//   5. sv_gamemode OVERRIDES BOTH, in both directions: it can force bhop onto
//      a surf map, and `none` can turn the whole thing off on a bhop one.
//
// bhop_futile is the map Lex reported this against, so it is the one used.
//
// `wait 200` before the first `map`: exec INSERTS at the front of the command
// buffer, so a waitmap with no wait ahead of it blocks the buffer the map load
// is queued in.  (b25a.cfg:12-14 -- build 19 lost three launches to that.)

log_enable 1
log_name p224a
developer 0
cfg_save_auto 0
cl_idlefps 0

wait 200
echo ^5=== p224a: per-gamemode movement ruleset ===

// ---------------------------------------------------------------------------
echo ^5--- 1. surf_null: index has no mode, so the NAME must answer ---
// mapmeta.txt row is `meta surf_null - 1 0 0 - - - - -`; column 9 is "-", and
// atoi("-") is 0, which is the file's documented sentinel for unknown.  So the
// expected report is `surf (name)` and NOT `surf (mapmeta)`.
map surf_null
waitmap 240
wait 60

movement
waitms 400

echo ^5(the base ruleset, for comparison against step 4)
pm_ticrate
sv_mintic
sv_maxtic
cl_netfps
sv_airaccelerate
run_starthop
waitms 400

// ---------------------------------------------------------------------------
echo ^5--- 2. bhop_futile: the INDEX must answer, and the ruleset must land ---
// mapmeta row says mode 2.  Expect `bhop (mapmeta)`, cfg/mode_bhop.cfg, and
// the CS:S banner at 100 Hz.
map bhop_futile
waitmap 600
wait 60

movement
waitms 600

echo ^5(the six the ruleset sets)
pm_ticrate
sv_mintic
sv_maxtic
cl_netfps
sv_airaccelerate
run_starthop
waitms 400

// ---------------------------------------------------------------------------
echo ^5--- 3. the lock, against the MODE's value and against the base ---
echo ^5(expect: pm_ticrate reverted to "0.01" -- the MODE's number, not 0.015)
pm_ticrate 0.015
waitms 300
pm_ticrate
waitms 300

echo ^5(expect: sv_maxspeed reverted to "260" -- a locked cvar the mode does
echo ^5 not mention still answers to cfg/default.cfg)
sv_maxspeed 320
waitms 300
sv_maxspeed
waitms 300

// ---------------------------------------------------------------------------
echo ^5--- 4. back to surf: nothing may leak ---
// cl_netfps and run_starthop are the interesting two: neither is in the
// engine's locked table, so the lock will not restore them and the overlay
// teardown has to.
map surf_null
waitmap 240
wait 60

movement
waitms 400

echo ^5(expect: 0.015 0.015 0.015 66.6667 150 1)
pm_ticrate
sv_mintic
sv_maxtic
cl_netfps
sv_airaccelerate
run_starthop
waitms 400

// ---------------------------------------------------------------------------
echo ^5--- 5a. sv_gamemode forces bhop onto a surf map ---
sv_gamemode bhop
map surf_null
waitmap 240
wait 60
movement
waitms 400
echo ^5(expect: forced, and 0.01 / 1000)
pm_ticrate
sv_airaccelerate
waitms 400

// ---------------------------------------------------------------------------
echo ^5--- 5b. sv_gamemode none turns it off on a bhop map ---
sv_gamemode none
map bhop_futile
waitmap 600
wait 60
movement
waitms 400
echo ^5(expect: base ruleset, 0.015 / 150)
pm_ticrate
sv_airaccelerate
waitms 400

sv_gamemode ""
echo ^5=== p224a done ===
wait 30
quit
