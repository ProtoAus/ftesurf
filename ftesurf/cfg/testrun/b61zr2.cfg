// FTESurf -- RECON 2.  `!s 1` is zone index 0, not zone index 1.
//
// I GOT THIS WRONG AND LEX CAUGHT IT.  b61zr used `cmd zone_goto 1` on the
// assumption that "stage 1" meant zone index 1.  It does not:
//
//   sv_zones.qc:1150   !s N  ->  stage N, track 0, SEGMENT N-1
//   sv_zones.qc:1154   "`!s 1` and `!m` go to the SAME zone ... Stage 1 IS the
//                       start."
//   sh_defs.qc:1312    "stage 1's segment is 0 and 0 was already the whole
//                       track"
//
// So `!s 1` is the START zone = index 0, centre -11200 10304 -320, and the
// zone I actually measured (index 1, `stage track 0 segment 1`) is `!s 2`.
// The engine even told me so -- it printed `zone_goto: 1 -- stage, track 0,
// segment 1` and I read "segment 1" as "stage 1" without checking the
// off-by-one that the source documents in three places.
//
// The menu's own self-test uses the same two spellings side by side and is the
// thing I should have read first: m_main.qc:2451 sends `cmd say !s 2` while
// m_main.qc:2462 sends `cmd zone_goto 0 0 0` -- different numbering, same file.
//
// WHY THE RECON AND NOT STRAIGHT TO THE MEASUREMENT: the start box's heading
// decides whether anything glare-heavy is on screen, and a two-minute A/B at a
// vantage facing a wall measures nothing.  This is 50 seconds and it also
// prints the landing coordinates (viewpos prints AS a setpos line) so the real
// run can pin the camera instead of trusting zone_goto's angles, which were
// measured not to hold on bhop_eazy.
//
// Three headings are sampled because the start box's default heading is
// whatever the zone data says and I have no reason to expect it to be the
// interesting direction.  The census line `glare N in frame` is the number
// that picks one.
//
// NOT A MEASUREMENT.  Nothing here is quotable.
cfg_save_auto 0
exec cfg/testrun/_quiet.cfg
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "b61zr2"
scr_sshot_type png
cl_yieldcpu 0
vid_vsync 0
crosshair 0
fov 100
con_notifylines 0
con_notifytime 0.01
cl_maxfps 0

r_fog_progless 1
hl2_additivefog 1

waitms 2500
map surf_tensor2
waitmap 240
waitms 8000

vbsp_sprites 1
vbsp_lightglow 1
vbsp_sprite_source 1
vbsp_glare 1
vbsp_glare_rays 5
vbsp_glare_traces 40
vbsp_glare_cull 1.25
vbsp_glare_brush 2
vbsp_glare_adaptive 8
vbsp_glare_interval 0
r_renderscale 1
show_fps 1

echo "@@@ ZR2 zone_goto 0 -- the real !s 1"
cmd zone_goto 0
waitms 3000
cmd viewpos
waitms 1500
vbsp_sprite_debug 1
waitms 700
screenshot b61z2_x
waitms 900
screenshot b61z2_yaw_default
waitms 2000

echo "@@@ ZR2 same spot, yaw 0"
cmd zone_goto 0 0 0
waitms 2500
cmd viewpos
waitms 1200
vbsp_sprite_debug 1
waitms 700
screenshot b61z2_y
waitms 900
screenshot b61z2_yaw0
waitms 2000

echo "@@@ ZR2 same spot, yaw 180"
cmd zone_goto 0 180 0
waitms 2500
cmd viewpos
waitms 1200
vbsp_sprite_debug 1
waitms 700
screenshot b61z2_z
waitms 900
screenshot b61z2_yaw180
waitms 2000

echo "@@@ ZR2 DONE"
waitms 1200
quit
