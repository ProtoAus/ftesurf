// FTESurf build 61 -- DOES A DEADLINE BEAT A PER-FRAME QUOTA?
//
// WHY THIS RUN EXISTS.  Build 60 shipped a ray budget that is fixed PER FRAME,
// and its own measurements show that the quantity anybody cares about -- how
// stale a glare's occlusion answer may be -- therefore lands somewhere
// different on every map:
//
//     surf_tensor2, 429 glares, 40 rays    3.7 frames = 9.3 ms at 397 fps
//     a 12-glare map, 40 rays              the cursor wraps ~3x per FRAME
//
// 9.3 ms is far finer than an eye needs, and the rays buying it are the ones
// costing ~200 fps.  vbsp_glare_interval asks for the age bound in SECONDS and
// derives the per-frame visit quota from it (spr_n * frametime / interval);
// vbsp_glare_traces stays as the CEILING so a dense map misses the deadline
// rather than dropping a frame.
//
// WHAT IS ALREADY MEASURED, and every figure below is COUNTED between cursor
// wraps rather than derived -- the build 59 census divided by glares TRACED,
// which pretends a culled glare does not advance the cursor, and that error
// made me tell Lex the view cull was worth nothing when it is worth 4.8x:
//
//        config                              rays/frame   fps    frames/sweep
//   b58  traces 40, no cull, no adaptive         40       383.4      53.6
//   b59  traces 40, cull, no adaptive            40       399-412    11.2, 10.8
//   b60  traces 40, cull + adaptive 8            40       396.8      3.7, 3.8, 3.4
//   b60  traces 12, cull + adaptive 8            12       577-633    9.8
//
// ===================================================================
// PREDICTION, REGISTERED BEFORE THE RUN
// ===================================================================
// The quota at 429 glares and 400 fps is 429 * 0.0025 / interval:
//
//   arm  interval  quota/frame   expected rays   expected sweep   expected fps
//    A     0 (off)     --             40          3.7 frames        ~397
//    B     0.05       21.5            ~7.4        ~20 frames        ~610
//    C     0.15        7.2            ~2.5        ~60 frames        ~640
//    D     0.05       21.5            ~7.4        ~20 frames        ~610   (= B)
//    E     0 (off)     --             40          3.7 frames        ~397   (= A)
//
// Rays are predicted as quota * (b60 rays/visit) = quota * 40/116 = quota*0.345,
// so B's 7.4 is an ARITHMETIC consequence of the visit count, not a hope.  fps
// from 27.1us a ray: 2.52 ms/frame now, minus 0.88 ms of rays = 1.64 ms.
//
//   PASS: B's sweep in frames is ~interval*fps (20 +/- a few at 400), and
//         `stopped by` reads "the interval quota" -- the promise is being kept
//         with ray headroom.
//   PASS: B is markedly faster than A in fps.  This is the FIRST change in this
//         series that should move fps at all; the cull and the adaptive rays
//         both could not, because the budget was saturated either way.
//   FAIL: `stopped by` reads "THE RAY CEILING" on B or C.  Then the quota is not
//         being met and the sweep figure is the truth while the interval is a
//         fiction -- exactly the failure the field exists to expose.
//   FAIL: D differs from B, or E from A, by more than the same-setting spread.
//         Both are re-entry controls: spr_gvacc is cleared only on load/reload,
//         so a toggle must not leave the accumulator holding the other arm's
//         debt.
//   FAIL: the centre of the frame differs between an interval arm and A by more
//         than the same-setting floor.  A staleness bound of 50 ms is BELOW the
//         50 ms decay ramp (vbsp_glare_decay 0.05), so the ramp should still be
//         doing the hiding and the picture should not change at this vantage.
//         If it does change, the interval is too coarse to be a free win and
//         the number to report is the one where it stops changing.
//
// NOT A PASS CONDITION, AND DELIBERATELY SO: fps here is measured at ONE
// vantage with 302 glares in frame.  A vantage looking at a wall has a
// different cull fraction and will show a different saving.  The claim this run
// can support is "the deadline is met and costs fewer rays", not a fps number
// that generalises.
cfg_save_auto 0
exec cfg/testrun/_quiet.cfg
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "b61int"
scr_sshot_type png
cl_yieldcpu 0
vid_vsync 0
crosshair 0
fov 100
con_notifylines 0
con_notifytime 0.01
cl_maxfps 0

r_fog_progless 1
hl2_additivefog 1

waitms 2500
map surf_tensor2
waitmap 240
waitms 8000
sv_cheats 1
noclip
waitms 500

vbsp_sprites 1
vbsp_lightglow 1
vbsp_lightglow_scale 1
vbsp_sprite_source 1
vbsp_glare 1
vbsp_glare_rays 5
vbsp_glare_traces 40
vbsp_glare_cull 1.25
vbsp_glare_brush 2
vbsp_glare_adaptive 8
vbsp_glare_interval 0
r_renderscale 1
show_fps 1

setpos -10688.5 -1773.8 -8587.1 6.3 91.1 0
waitms 25000

echo "@@@ B61INT A. interval 0 -- build 60 exactly, the control"
waitms 8000
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 700
screenshot b61i_A
waitms 2500

echo "@@@ B61INT B. interval 0.05 -- a 50ms staleness bound"
vbsp_glare_interval 0.05
waitms 8000
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 700
screenshot b61i_B
waitms 2500

echo "@@@ B61INT C. interval 0.15 -- coarser; is the picture still identical?"
vbsp_glare_interval 0.15
waitms 8000
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 700
screenshot b61i_C
waitms 2500

echo "@@@ B61INT D. back to 0.05 -- must match B (accumulator re-entry)"
vbsp_glare_interval 0.05
waitms 8000
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 700
screenshot b61i_D
waitms 2500

echo "@@@ B61INT E. back to 0 -- must match A"
vbsp_glare_interval 0
waitms 8000
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 400
vbsp_sprite_debug 1
waitms 700
screenshot b61i_E
waitms 2500

echo "@@@ B61INT DONE"
waitms 1200
quit
