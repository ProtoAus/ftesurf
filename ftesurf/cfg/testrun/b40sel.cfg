// Patch 241 / Build 39: the numeric half, before anything is played.
//
// pm_selftest drives the REAL movement functions against a fixed CS:S reference
// set, with no map loaded, so this needs no map and no player.  Two blocks matter
// here:
//
//   the jump block   -- "clamped: inbound 100/140 still reaches 45" are the new
//                       cases and they are the patch.  "addrise 1: build 38 adds
//                       to the rise" is the old pinned answer, kept under the
//                       cvar.  Everything else in that block must be UNCHANGED
//                       from build 38: 43.010 stock standing, 45.000 stock
//                       crouch, 45.000 normalized, 45.000 at 100Hz.
//
//   the hull block   -- new, and nothing in it should ever have been able to
//                       move.  "eye: drops by exactly the hull delta" is the one
//                       that matters: it is what makes the absolute eye position
//                       not move when you duck in mid-air, which is the reported
//                       "check the hull of the player".
//
// Run twice in the one session deliberately: the jump block sets movevars itself
// and restores them, so a second run that disagreed with the first would mean the
// restore is leaky.

log_enable 1
log_name b40sel
developer 1
log_developer 1
cfg_save_auto 0
cl_idlefps 0

wait 60
echo ^5=== p241 selftest run 1 ===
pm_selftest
wait 30
echo ^5=== p241 selftest run 2 (must be identical) ===
pm_selftest
wait 30
echo ^5=== p241 selftest done ===
wait 30
quit
