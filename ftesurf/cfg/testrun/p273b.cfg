// Patch 273 -- the CLEAN run.  p273.cfg's timings were unusable and this says why.
//
// WHAT WENT WRONG THE FIRST TIME.  I left `developer 1` + `log_developer 1` on for
// the whole run, so my own Patch 273 mark census printed 94 times, each line
// formatted, pushed to the console and FLUSHED TO DISK, inside the windows being
// timed.  t2after.cfg -- the baseline everything is compared against -- turns both
// OFF at its line 43 before measuring.  So the two logs were not comparable and the
// A0 numbers came out WORSE than the baseline they were supposed to beat:
//
//     A0 refresh 3550 vs baseline 3094,  Server 2284 vs 1791
//     and the tell: 2d Elements on the CONTROL map went 29.06 -> 189.51us,
//     which is console text, not geometry.  A renderer patch cannot do that.
//
// This is the trap already recorded in this project's own notes -- developer mode
// makes a VBSP map load 7x slower for exactly this reason -- and I walked into it
// by adding a per-300-frame dprint and then measuring with dprints enabled.
//
// SO: developer is ON only long enough to capture the [world] census and one mark
// reading at the spawn, then OFF for every timing.  Con_DPrintf gates on developer,
// so with it off the census costs literally nothing.
//
// BASELINE to beat (t2after.log, developer OFF, same vantages/yaws):
//     A0 spawn : refresh 3094.03  walk 1677.50  server 1790.68  indices 83013
//                refresh-only 323.20  ->  REAL 1/(3094+1791) = 204.7 fps
//     D5 stage5: refresh 2228?    (449 fps refresh-only)
//     D9 END   : refresh 2982.92  walk 1720.71  server 1754.28  indices 33125
//     F0 tensor: refresh 595.89   walk 9.93     server 37.93
//
// WHAT EACH CLAIM NEEDS:
//  1. REAL frame line = Total refresh + Server exactly, and ~205 at A0 pre-fix.
//  2. World walking DOWN at A0 vs 1677.50, and [world] meshes UNCHANGED (506/20).
//  3. sv_perfdump's rows sum to the Server row; `Snapshot build` is expected to
//     own nearly all of it (VBSP_HeadnodeVisible via SV_WriteEntitiesToClient).
//  4. D9 is the dense-PVS check: walk must not be WORSE than 1720.71.

vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000

cl_maxfps 0
cl_idlefps 0
cl_yieldcpu 0
sv_cheats 1

// ---- developer ON, once, purely to capture the two censuses ---------------
developer 1
log_developer 1
map surf_tensor2
waitmap 600
waitms 8000
echo ^5=== CENSUS: [world] must be recurse 0 -> 506 / recurse 1 -> 20, and
echo ^5=== `bucketed into` + one `mark/300f` must appear above this line.
waitms 1500
developer 0
log_developer 0
waitms 2000

r_speeds 2
noclip
waitms 1000

// ---- A0: the headline, developer OFF --------------------------------------
echo ^5=== A0 spawn yaw 0 (baseline: refresh 3094.03 walk 1677.50 server 1790.68 REAL 204.7fps)
setpos -11776 -13632 13720 0 0 0
waitms 2500
sv_perfdump
waitms 3500
echo ^5--- A0 sv_perfdump (THIS one counts)
sv_perfdump
waitms 300
r_speeds_dump
waitms 800
screenshot p273b_spawn_x
waitms 900
screenshot p273b_spawn
waitms 900

// ---- A0F: r_fastsky, the zero-code isolation of the two-pass cost ---------
echo ^5=== A0F same spawn, r_fastsky 1 (one world pass; the vis cache becomes reachable)
r_fastsky 1
waitms 3500
r_speeds_dump
waitms 800
r_fastsky 0
waitms 2000

// ---- stages ---------------------------------------------------------------
echo ^5=== D5 stage 5 (baseline 449 fps refresh-only)
setpos 6624 -6955 11472 0 0 0
waitms 2500
sv_perfdump
waitms 3500
echo ^5--- D5 sv_perfdump (THIS one counts)
sv_perfdump
waitms 300
r_speeds_dump
waitms 800
screenshot p273b_stage5_x
waitms 900
screenshot p273b_stage5
waitms 900

echo ^5=== D9 main END -- DENSE-PVS CHECK, walk must not exceed baseline 1720.71
setpos 15216 4096 -7088 0 0 0
waitms 3500
r_speeds_dump
waitms 800

// ---- control --------------------------------------------------------------
echo ^5=== F0 CONTROL surf_tensor (baseline refresh 595.89 walk 9.93 server 37.93)
map surf_tensor
waitmap 600
waitms 8000
r_speeds 2
noclip
waitms 2500
sv_perfdump
waitms 3500
echo ^5--- F0 sv_perfdump (THIS one counts)
sv_perfdump
waitms 300
r_speeds_dump
waitms 1000

echo ^5=== END OF RUN ===
waitms 500
quit
