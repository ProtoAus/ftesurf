// cfg/testrun/p270_2c_host.cfg -- Patch 270 Stage 2, the host half.
//
// Two real clients, one listen server, so Stage 2 stops being a thing that
// merely compiles.  What this half proves: a lobby comes up from CONSOLE
// COMMANDS rather than from cfg/lobby.cfg, which is the case that was broken
// until the lobby_avatars registration moved -- the cvar read "" and no avatar
// was ever spawned, silently.
//
// THE LEADING `wait` IS LOAD-BEARING.  A startup +exec runs before the mod is
// initialised and a `map` issued that early is silently dropped, with no error;
// the script then goes on happily screenshotting the engine's fallback menu.
// Cost two runs to find the first time (Stage 1b).  `wait n` counts FRAMES.
//
// This half deliberately does NOT quit.  Frame-count timing is not comparable
// across two processes, so the runner kills it once the guest has finished
// rather than trying to guess a matching frame budget here.

// PORT 27600, NOT the default 27500.
//
// A test that binds the default port silently loses the race against the
// developer's own server if one is already up -- this host fails to bind, the
// guest's `connect 127.0.0.1:27500` reaches THEIR server instead, and the run
// produces a screenshot of a different map with `bodies 0`.  Which looks
// exactly like the avatar path having broken, rather than like the test having
// joined the wrong game.  It also puts a stray client in someone else's
// session while they are testing.
sv_port 27600

wait 200
echo "^3p270:^7 host loading map"
map surf_borderlands

wait 400

// Set from the console ON PURPOSE, not via cfg/lobby.cfg.  lobby.cfg `set`s
// these before the map loads, which is exactly what hid the registration bug --
// the value was already there, so the default never had to land.  Typing them
// after the map is up is the path that was broken.
lobby_enable 1
lobby_avatars 1
lobby_nocollide 1
echo "^3p270:^7 host lobby on"

// Report what the cvars actually READ, so the log carries the proof rather than
// the intention.  Anything printing "" here is the trap back again.
lobby_enable
lobby_avatars
vbsp_mp
lobby_retrigger
lobby_nopb
lobby_norec
lobby_nosaveloc
