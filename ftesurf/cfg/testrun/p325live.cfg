// Engine Patch 325 / QC build 74 -- the two clocks, in a real run.  ARM 2 of 2.
//
// Arm 1 (p325tick.cfg) proved the engine counts TICKS and not COMMANDS, offline,
// with no client and no run.  This arm proves the other half: that the count
// reaches QC at all, and that the two clocks can be read side by side on a
// player who is actually moving.
//
// WHAT IS BEING TESTED, precisely, because it is easy to overclaim from this:
//
//   1. THE OPTIONAL FIELDS RESOLVE.  run_movetick/run_movetickrate/run_movecarry
//      are written by the engine BY NAME through GetEdictFieldValue.  A lookup
//      that fails writes NOTHING and leaves the fields at zero -- silently, and
//      indistinguishably from a mover that ran no ticks.  Build 24 moved four
//      fields between files and nearly lost exactly this.  `rate 0.01` in the
//      report is the proof the route works, because 0.01 is a number only the
//      engine knows: it is bhop mode's pm_ticrate, and QC's own run_t_tick is
//      read from the same cvar, so the two agreeing at a NON-DEFAULT value is a
//      stronger statement than both reading 0.015 would be.
//
//   2. THE COUNTED CLOCK ADVANCES AND IS COMPARABLE.  `counted` must climb, and
//      `gap` -- sampled minus counted -- is the measurement this whole build
//      exists to take.
//
//   3. THE RATE CHECK IS LIVE.  `rate 0.01` with no MISMATCH.
//
// WHAT IS *NOT* TESTED HERE, and claiming it would be wrong: this is a NOCLIP
// FLIGHT, which is the only way a config can cross an end zone (zone_goto and
// setpos both void via SV_TimerWarped; noclip only changes movetype).  So the
// run is TF_CHEAT by construction and the file lands as cheat.rec.  That is fine
// for what is under test -- the header line and the clock report are written
// regardless of how the run ends -- but it means the GAP measured here is the gap
// on a noclip flight on one machine over a local loopback, which is the easiest
// possible case.  It is a proof the instrument works, NOT a measurement of the
// gap on a real run over a real network.  That reading has to come from a human
// playing on the live fleet, and it is the next thing this build owes.
//
// The flight is borrowed verbatim from b73hdr.cfg, where it is computed from
// zone_list rather than guessed: start box -352 -352 144, yaw 335.3.
//
// PREDICTION, registered before the run:
//   cmd timer prints a `tick:` line on every call.
//   Before the start:  `tick: not latched  rate 0.01`
//   During the run:    counted > 0 and climbing, frz 0, rate 0.01, no MISMATCH.
//   gap is small -- single-digit ticks -- and this arm cannot say more than that.
//   data/runs/bhop_eazy/main/cheat.rec carries `movetickrate 0.01` in its header
//   and reccheck.py passes it with 0 faults.
//
// FALSIFIED IF: the `tick:` line says `rate --/0.01 (no engine value)` (the
//          field lookup failed, or the binary predates Patch 325); or `counted`
//          stays 0 while the player is plainly moving (the accumulate is not
//          reaching this client); or MISMATCH appears (QC and the mover disagree
//          about the tick length, which is the failure that would silently scale
//          every stored time).
cfg_save_auto 0
log_enable 1
log_dir logs
developer 0

set rec_enable 1
set rec_stream 1
set rec_runarchive 1

waitms 6000
map bhop_eazy
waitmap 45
waitms 3000

echo ================================ P325LIVE -- before the run: not latched
cmd timer
waitms 1500

echo ================================ P325LIVE -- arm, aim, and go continuous
cmd zone_goto 0
waitms 1000
setpos -352 -352 144 0 335.3 0
waitms 1000
noclip
waitms 500

+forward
waitms 1500
echo ================================ P325LIVE -- running
cmd timer
waitms 2000
cmd timer
waitms 2000
cmd timer
waitms 3000
-forward
waitms 1500

echo ================================ P325LIVE -- after the end zone
cmd timer
waitms 2500

echo ================================ P325LIVE done
waitms 500
quit
