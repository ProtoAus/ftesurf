// NETV15 -- the fix arm.  Identical to netv10.cfg except cl_netfps.
// 1/66.6667 = 15.0 ms = exactly one pm_ticrate, so every usercmd should run
// exactly one tick and the recorded motion should read 1111... instead of 011011.
// See netv10.cfg's header for the whole design and the cleanup this owes.

log_enable 1
log_dir "logs"
log_name "netv15"
developer 0
log_developer 0
cfg_save_auto 0
sv_cheats 0
fs_missingwarn 0
cl_idlefps 0
vid_fullscreen 0
con_notifylines 0
scr_conalpha 0

cl_maxfps 333
cl_netfps 66.6667

wait 200
map bhop_eazy
waitmap 1800
waitms 2500

echo ^5=== netv15: cl_netfps 66.6667, walking ===
cl_netfps
cmd zone_goto 0 16.18 0
waitms 900
+forward
waitms 4000
-forward
waitms 500
cmd sl_save
waitms 1200

echo ^5=== netv15: done ===
waitms 500
quit
