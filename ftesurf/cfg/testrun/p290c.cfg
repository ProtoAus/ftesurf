// FTESurf p290c -- the grade A/B, shot the only way that can see it.
//
// EVERY POST-PROCESS A/B IN THIS PROJECT SO FAR HAS BEEN BLIND, and it is worth
// writing down exactly why before the numbers below are trusted.
//
// screenshot_mega "massages the rendering code to redraw the screen with an fbo
// forced" (cl_screen.c:2941-2943) so it can capture above the monitor's
// resolution.  That sets `dofbo`, and gl_rmain.c:2841-2845 reads dofbo and does
//
//     r_refdef.flags &= ~(RDF_ALLPOSTPROC);   //block all of this stuff
//
// -- so a mega screenshot contains NO post-processing at all: no gamma stage, no
// waterwarp, no fxaa, no r_postprocshader, and no colour grade.  Which means the
// p290a/p290b "the grade moves 0.123% against a 0.161% control" measured a stage
// that was switched off for the duration of the capture, and the earlier
// conclusion that the whole thing was a no-op was drawn from pictures that could
// not have shown it either way.  The tell was there and was misread: r_graphics 0
// puts postproc_ascii on the screen and the mega shot of it was ALSO unchanged,
// which is not a subtle effect.
//
// Plain `screenshot` reads the backbuffer through VID_GetRGBInfo -- the frame as
// presented, post-processing included.  So: plain screenshot, at the window's own
// resolution, for anything that lives after the scene.
//
// PASS: cc 1 vs cc 0 moves far more of the frame than the same-setting control,
//   whites move toward (203,217,250) and the shadows crush.
// The guard arm points r_colourcorrection at a name that cannot resolve: the
// picture must stay NORMAL (not black) and one warning must print.
cfg_save_auto 0
exec cfg/testrun/_quiet.cfg
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "p290c"
scr_sshot_type png
cl_yieldcpu 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0

waitms 2500
map surf_tensor2
waitmap 240
waitms 8000
sv_cheats 1
noclip
waitms 500

setpos -11684 -12864 13936 0 0 0
waitms 2500

echo "@@@ P290C grade: A / A2 control / B / half"
hl2_colourcorrection 1
waitms 1500
screenshot p290c_cc_a
waitms 1200
screenshot p290c_cc_a2
waitms 1200
hl2_colourcorrection 0
waitms 1500
screenshot p290c_cc_b
waitms 1200
hl2_colourcorrection 0.5
waitms 1500
screenshot p290c_cc_half
waitms 1200
hl2_colourcorrection 1
waitms 1200

echo "@@@ P290C guard: a shader name that cannot resolve"
r_colourcorrection "ftesurf/cc/deliberately_not_a_shader"
waitms 2000
screenshot p290c_guard
waitms 1500

echo "@@@ P290C control: the real shader again"
r_colourcorrection "ftesurf/cc/surf_tensor2_ef3661e2"
waitms 2000
screenshot p290c_back
waitms 1500

echo "@@@ P290C DONE"
waitms 1200
quit
