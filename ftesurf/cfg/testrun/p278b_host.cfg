// cfg/testrun/p278b_host.cfg -- Patch 278, two clients, the host half.
//
// What this half exists to do: stand somewhere the guest can photograph it, in
// a known colour, with both effects on.
//
// PORT 27602.  Never the default 27500 -- a test that binds it loses the race
// against the developer's own server and the guest then connects to THEIRS,
// producing a screenshot of a different map that looks exactly like the avatar
// path having broken.  That happened once already.
//
// `//` COMMENTS ONLY, NEVER `/* */`.  FTE has no block comments: the only test
// in Cbuf_ExecuteLevel is text[i]=='/' && text[i+1]=='/' (cmd.c:493), so every
// line inside a /* */ pair is executed as a command.  p270_2c_join.cfg did this
// for six runs and silently issued `CAP` and `*/` each time.
//
// This half does NOT quit -- frame-count timing is not comparable across two
// processes, so the runner kills it once the guest is done.

sv_port 27602
cl_maxfps 100
log_developer 1

// PIN THE COLOUR SO THE TEST IS REPRODUCIBLE.  The palette rotation is random
// per map by design, which is right for play and useless for a screenshot that
// has to be compared against an expected RGB.  lobbycolor is the per-player
// override and it is honoured whenever the entry is free, so this pins the
// host to palette 1 = pure red '1.00 0.00 0.00'.
setinfo lobbycolor 1
setinfo lobbyfx 3

wait 200
echo "^3p278b:^7 host loading map"
map surf_null

wait 600

// From the CONSOLE, not from cfg/lobby.cfg.  lobby.cfg `set`s these before the
// map loads, so the value is already present and the default never has to land
// -- which is exactly what hid the lobby_avatars registration bug.  Typing them
// after the map is up is the path that was broken.
lobby_enable    1
lobby_avatars   1
lobby_nocollide 1
lobby_av_colors 1
lobby_av_fx     1
lobby_av_self   0
echo "^3p278b:^7 host lobby on, colour pinned to 1 (red)"

// Walk off the spawn point.  Both clients spawn at the same place, and with
// nocollide on they occupy the same space -- so without this the host's avatar
// is inside the guest's near plane and photographs as nothing at all.
wait 400
+forward
wait 130
-forward

wait 200
echo "^3p278b:^7 host in position"
lobby_av_colors
lobby_av_fx
