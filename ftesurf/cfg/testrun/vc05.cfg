// VC05 -- Patch 259, the assertion the screenshots could not carry.
//
// vc01 proved the files load and allocate.  It could not prove they DRAW: the
// A/B at surf_garden's spawn has a 9.4% pixel-diff noise floor (foliage and
// water animate), against 16.1% for the effect -- suggestive, not conclusive.
//
// So prop_census now counts, at the moment of submission, how many of the props
// that DREW this frame had their per-vertex array bound.  That number is the
// assertion, and it is exact.
//
// EXPECTED:
//   surf_garden      every drawn prop uses it, 0 declined
//   conc_school      287 of its props have VVD fixups -- some drawn props MUST
//                    decline; the two numbers must both be non-zero
//   surf_demise      2350 LDR sp_N.vhv, the control that the ordinary path did
//                    not regress
//   and on surf_garden with hl2_lt_baked_vc 0, "used" must fall to 0 and
//   "declined" must rise to the whole drawn set -- live, with no map reload.

log_enable 1
log_dir "logs"
log_name "vc05"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
sv_cheats 1

wait 200
echo ^5=== vc05: how many props actually DREW from the per-vertex bake ===

map surf_garden
waitmap 1800
waitms 5000
echo ^5------------------------- surf_garden, vc 1 ---------------------------
prop_census
waitms 600
echo ^5----------------- surf_garden, vc 0 (live, no reload) ------------------
hl2_lt_baked_vc 0
waitms 1500
prop_census
waitms 600
echo ^5--------------------- surf_garden, vc 1 again --------------------------
hl2_lt_baked_vc 1
waitms 1500
prop_census
waitms 600

echo ^5========== conc_school: 287 props whose vertex order is not VRAD's =======
map conc_school
waitmap 1800
waitms 5000
prop_census
waitms 600

echo ^5================= surf_demise: the LDR control, 2350 props ==============
map surf_demise
waitmap 1800
waitms 5000
prop_census
waitms 600

echo ^5=== vc05 done ===
wait 30
quit
