// Build 76, arm 2: THE FREEZE, which arm 1 failed to test and said nothing about.
//
// WHY THIS IS A SEPARATE FILE.  b76clock.cfg put the hold four and a half
// seconds after +forward.  The noclip flight crosses bhop_eazy's end zone in
// about three -- the recording came out at 303 ticks -- so every `cmd sl_hold`
// in that file landed on a FINISHED run, SV_TimerFreezeFrame's `state ==
// TS_RUNNING` guard declined, and all five readings printed `frz 0/0.0000`.
// The arm passed and the column it was watching was structurally empty.  That
// is the shape of a test that cannot fail, and it is worth a second file rather
// than a wider `waitms` in the first, because the two arms want opposite
// timings: arm 1 wants a clean lap, this one wants to stop it mid-flight.
//
// WHAT IT IS ACTUALLY TESTING.  Build 76 inverted how the clock stops.  Before,
// the clock was an ORIGIN and a hold re-derived that origin on every frozen
// tick -- three assignments in three branches.  Now the frozen interval is
// ACCUMULATED into run_t_frzticks and run_t_frzsec and every reader subtracts
// it, so the origin is never touched.  Those are two accumulators fed from ONE
// delta in two units, and if they drift apart the .rec's `t` column goes
// backwards across the hold -- which is the backwards-join defect build 17
// found in the save file and which reccheck.py rejects.  So, again, the real
// assertion is reccheck's verdict rather than anything this file echoes.
//
// PREDICTIONS, REGISTERED BEFORE THE RUN:
//
//   Q1  `counted` does not advance across the hold.  It is the clock; a held
//       clock that keeps counting is the whole bug run_t_frzticks exists to
//       prevent, and the mover really does keep ticking for a pinned player
//       (the pm_type test is inside PMSrc_Tick, after the tick is spent).
//   Q2  `frz` reads non-zero and its two halves agree: frzticks * 0.01 ~= frzsec
//       to within one tick.  They are accumulated from the same delta on
//       adjacent lines, so a disagreement means one of them is not being fed.
//   Q3  `sampled` also does not advance, because SV_TickReport now subtracts
//       run_t_frzsec from the wall difference too -- build 75's sampled clock
//       stopped during a hold and a faithful reproduction has to as well.  Arm
//       1 ran before that line existed; this is its first reading.
//   Q4  reccheck.py passes the resulting cheat.rec with 0 faults.  This is the
//       monotonicity of `t` across the hold, and it is the one that matters.
//
// FALSIFIED IF: counted advances while held (the accumulator is not fed); or
//          frzticks and frzsec disagree by more than a tick (they are being fed
//          from different deltas); or reccheck reports time running backwards
//          (the seconds accumulator is over- or under-counting); or `frz` reads
//          0 again, which would mean this arm is as empty as arm 1 was and the
//          timings need moving, NOT that the freeze works.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name b76frz
developer 0

sv_cheats 0
set rec_enable 1
set rec_stream 1
set rec_runarchive 1

waitms 6000
map bhop_eazy
waitmap 45
waitms 3000

echo ================================ B76FRZ -- arm, aim, and go
cmd zone_goto 0
waitms 1000
setpos -352 -352 144 0 335.3 0
waitms 1000
noclip
waitms 500

+forward
waitms 600
echo ================================ B76FRZ -- running.  Baseline before the hold.
cmd timer
waitms 100

// THE HOLD REFUSES WITH NO SAVE TO HOLD AT, and the first version of this file
// did not know that: `SV_SaveLocHold` returns early on `rec_sl_n <= 0` with
// "save: nothing saved on this map", so every reading came back `frz 0/0.0000`
// and the arm was as structurally empty as the one it was written to replace.
// It said so in the log the whole time, on a line this file was not grepping
// for -- the same shape as build 66's `rec_enable` trap, where the refusal was
// printed and the config only looked at the outcome.  So: take a save first.
cmd sl_save
waitms 200

echo ================================ B76FRZ -- HOLD.  Q1/Q2/Q3: both clocks must stop, frz must move.
cmd sl_hold
waitms 700
cmd timer
waitms 1000
cmd timer
waitms 1000
cmd timer
waitms 300
cmd sl_holdoff

echo ================================ B76FRZ -- thawed.  The clock resumes from where it stopped.
waitms 200
cmd timer
waitms 1200
cmd timer
waitms 2500
-forward
waitms 1000

echo ================================ B76FRZ -- after the end zone
cmd timer
waitms 2000

echo ================================ B76FRZ done -- reccheck.py reads the file, not this config
waitms 500
quit
