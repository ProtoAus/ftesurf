// BUILD 27 / engine patch 211 -- what a config can actually prove.
//
// Most of this build is drawn or clicked, and neither is scriptable.  What IS
// scriptable is: every new command exists, every new cvar reads its intended
// value, the screenshot NAMES land where they should, the sky report says which
// sky is in force, and nothing faults.  Everything else is stated as unverified
// rather than implied.
//
// The last line is `exit` on purpose.  If patch 211a did not land, `exit` is an
// unknown command, the game does NOT close, and this run hangs -- which is a
// louder failure than any grep.

developer 1
log_developer 1
cfg_save_auto 0

wait 200

echo ""
echo "=== the new commands must EXIST (an unknown one prints its own error) ==="
// deliberately not RUN, just resolved -- vid_toggle would restart the renderer
// and quit would end the run here.
cmdlist fullscreen
wait 4
cmdlist exit
wait 4
echo ""

echo "=== the new cvars, with their (default) annotations ==="
scr_sshot_mapname
scr_sshot_prefix
con_window_rect
con_window_titlepad
con_scrollwidth
con_colour_back
con_colour_accent
con_palette
con_displaypossibilities
con_completionrows
r_skybox_default
wait 6
echo ""

echo "=== a map that DOES declare a sky: the default must not touch it ==="
map surf_aesthetic
waitmap 90
sky
wait 4
echo "--- (must read 'Current per-map skybox is <something>') ---"
echo ""

echo "=== screenshots: three, named after the map, counting from 000 ==="
screenshot
wait 10
screenshot
wait 10
screenshot
wait 10
echo "--- (must be screenshots/surf_aesthetic_000.png, _001, _002) ---"
echo ""

echo "=== the same command NAMED still honours the folder ==="
screenshot b27named
wait 10
echo "--- (must be screenshots/b27named.png, with no fte- stem) ---"
echo ""

echo "=== scr_sshot_mapname 0 must reproduce the stock date form ==="
scr_sshot_mapname 0
wait 4
screenshot
wait 10
scr_sshot_mapname 1
wait 4
echo ""

echo "=== the map with NO sky of its own -- the whole of item 7 ==="
map surf_colin_blaster_69000
waitmap 120
sky
wait 4
echo "--- (must read 'Map declares no sky; using r_skybox_default ... loaded: yes') ---"
wait 6
screenshot
wait 10
echo ""

echo "=== and with the default cleared, it must go back to what it drew before ==="
r_skybox_default ""
wait 20
sky
wait 4
screenshot
wait 10
r_skybox_default "sky_cape_hill"
wait 20
sky
wait 4
echo ""

echo "=== r_skybox must still OVERRIDE the default, and a real map's own sky ==="
r_skybox "sky_urb01"
wait 20
sky
wait 4
r_skybox ""
wait 20
sky
wait 4
echo "--- (must go user -> default again, with r_skybox_default untouched) ---"
echo ""

echo "=== the palette, both ways.  A screenshot each; the ^ codes must differ ==="
con_palette 1
wait 6
echo "^1red ^2green ^3yellow ^4blue ^5cyan ^6magenta ^7white ^9grey"
wait 6
screenshot
wait 10
con_palette 0
wait 6
echo "^1red ^2green ^3yellow ^4blue ^5cyan ^6magenta ^7white ^9grey"
wait 6
screenshot
wait 10
con_palette 1
wait 6
echo ""

echo "=== regression: the two selftests ==="
pm_selftest
wait 10
zone_selftest
wait 10
echo ""

echo "=== b27a done -- exiting via the NEW command, which is the test ==="
wait 20
exit
