// FTESurf b55a -- does the cursor claim register actually drive a real panel?
//
// WHAT BUILD 55 CHANGED.  Four panels each hand-enumerated the other three to
// decide whether to give the mouse back (cl_hud.qc's claim register block has
// the full account).  Two of the four were provably wrong -- Scores_Close and
// Watch_Close could not test ui_rs_cursor because it is declared in
// cl_results.qc, which compiles after both of them.  All four now call
// UI_CursorClaim / UI_CursorRelease and name nobody.
//
// THIS RUN IS A REGRESSION TEST, NOT THE PROOF OF THE FIX.  Say so plainly:
//
//   WHAT IT PROVES: the register drives a live panel.  hud_edit opening must
//   still capture the mouse and draw its chrome, and closing must still give
//   it back.  That is UI_CursorClaim and UI_CursorRelease each executing once
//   for real, on the owner that is reachable from the console.  If the
//   register were broken -- a claim that never fires, a release that fires
//   too early, a bitmask that never reaches 0 -- the editor would open with
//   no cursor, or close with the mouse still captured and the game unable to
//   turn.
//
//   WHAT IT DOES NOT PROVE: the bug that was actually fixed.  That one needs
//   the RESULTS CARD to have taken the cursor and then a second panel to open
//   and close over it, and the card only appears after a finished run.  The
//   two broken sites were Scores_Close and Watch_Close, and neither is
//   exercised here.  Do not read a pass as "the ordering bug is fixed".
//
// The editor is a modal that eats input, so this toggles it with the console
// command rather than by clicking, and screenshots each state.
cfg_save_auto 0
exec cfg/testrun/_quiet.cfg
developer 1
// log_enable, NOT just log_developer/log_name -- it defaults to "0"
// (common/log.c:11) and a cfg that sets only the name writes no file at all
// and says nothing about it.  b33a.cfg:35 and p288a.cfg:35 both record losing
// a run to exactly this.
log_enable 1
log_developer 1
log_dir "logs"
log_name "b55a"
scr_sshot_type png
cl_yieldcpu 0
vid_vsync 0
crosshair 0
con_notifytime 0

waitms 2500
map surf_kitsune
waitmap 240
waitms 8000

// -------------------------------------------------- 1. baseline, no claim
// The HUD as normal.  If csprogs is unhealthy this is where it shows, before
// anything about the cursor is asked.
echo "@@@ B55A baseline -- HUD up, nobody holds the mouse"
setpos 0 -620 150 0 90 0
waitms 2000
screenshot_mega b55a_1_base 1280 720
waitms 600

// -------------------------------------------------- 2. UI_CursorClaim
// hud_edit is the one cursor owner reachable from the console.  Opening it
// runs UI_CursorClaim(UIC_HUDEDIT), which must take the mask from 0 to 4 and
// therefore call setcursormode(TRUE) exactly once.
echo "@@@ B55A hud_edit OPEN -- UI_CursorClaim(UIC_HUDEDIT), mask 0 -> 4"
hud_edit
waitms 2500
screenshot_mega b55a_2_open 1280 720
waitms 600

// -------------------------------------------------- 3. UI_CursorRelease
// Closing runs UI_CursorRelease(UIC_HUDEDIT).  Nothing else holds a claim, so
// the mask returns to 0 and the mouse goes back to the game.
echo "@@@ B55A hud_edit CLOSE -- UI_CursorRelease, mask 4 -> 0"
hud_edit
waitms 2500
screenshot_mega b55a_3_closed 1280 720
waitms 600

// -------------------------------------------------- 4. the game still turns
// The falsifier for a release that did NOT happen.  If the mask never reached
// 0 the engine is still in key_dest_absolutemouse and this yaw change does
// not land, so picture 4 is identical to picture 3 rather than turned 90
// degrees.  Without this a stuck cursor looks exactly like a pass.
echo "@@@ B55A view turns after the release -- falsifier for a stuck cursor"
setpos 0 -620 150 0 180 0
waitms 2000
screenshot_mega b55a_4_turned 1280 720
waitms 600

// -------------------------------------------------- 5. the menu VM loaded
// m_main.qc grew the lobby_hosts allow-list this build.  A menu that fails to
// compile or faults on open would take the whole picker with it, and the
// lobby rows are drawn by the same file.
echo "@@@ B55A menu -- the VM that carries lobby_hosts"
togglemenu 1
waitms 3000
screenshot_mega b55a_5_menu 1280 720
waitms 800

echo "@@@ B55A DONE"
waitms 1000
quit
