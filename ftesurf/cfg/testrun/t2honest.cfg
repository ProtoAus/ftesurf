// The honest particle test, with vantages computed from the entity lump
// instead of chosen by hand.
//
// MY LAST CONTROL WAS NOT A CONTROL.  I loaded surf_anubis, stood at spawn,
// saw r_partinfo report zero live particles, and concluded the scripted
// particle system was dead.  ftesurf-3d then counted the entities: from ALL 65
// info_player_start positions on that map, the number of env_fire inside build
// 49's 1800-unit cull had a median of 0 and a MAX of 0.  Zero was the correct
// answer to a scene with nothing in it -- the same "a gate cannot be measured
// on a frame with nothing for it to drop" trap that deleted r_voidvis' entity
// modes.  Their cull is now 4000.
//
// So both vantages here are picked by counting, not by eye:
//
//  A  surf_anubis at the DENSEST torch cluster in the map: 33 env_smokestack
//     within 1500 units of -307 -308 -5244, computed from the entity lump.
//     If r_partinfo is empty HERE, the particle system really is dead.
//
//  B  surf_tensor2 at the spawn.  This one was never explained by a cull and
//     is the question that is still open: spawn_rain01 sits 985 units away
//     with a 6000-unit cull, so it passed the distance test, called
//     pointparticles, and produced nothing.  Distance cannot explain it.
//
// r_partinfo is the instrument, not emit_list: `em_live` counts emitters
// CREATED at load, so "44 emitting" can never contradict "0 particles".

developer 1
log_developer 1
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000
cl_maxfps 0
cl_idlefps 0
cl_yieldcpu 0
sv_cheats 1
r_speeds 2

// ---- A: 33 torches in frame ---------------------------------------------
map surf_anubis
waitmap 600
waitms 8000
noclip
waitms 1000
setpos -307 -558 -5184 0 90 0
waitms 5000
echo ^5=== A surf_anubis, 33 env_smokestack within 1500 -- r_partinfo
r_partinfo
waitms 2000
r_speeds_dump
screenshot t2h_anubis_x
waitms 1000
screenshot t2h_anubis
waitms 1000

// ---- B: the rain, in range and unexplained -------------------------------
map surf_tensor2
waitmap 600
waitms 8000
noclip
waitms 1000
setpos -11776 -13632 13720 -35 90 0
waitms 5000
echo ^5=== B surf_tensor2 spawn, spawn_rain01 at 985 units (cull 6000)
r_partinfo
waitms 2000
r_speeds_dump
screenshot t2h_rain_x
waitms 1000
screenshot t2h_rain
waitms 1000

echo ^5=== END ===
waitms 500
quit
