// FTESurf p290j -- the LDR bake at save006, RUN AS ITS OWN PROCESS.
//
// p290g tried this and produced a null result that was not a result at all.  It
// set hl2_favour_ldr 1 and then re-issued `map surf_tensor2` while surf_tensor2
// was ALREADY loaded -- and FTE keeps the world model in that case, so
// Mod_LoadVBSP never ran and the lightmap lump was never re-chosen.  The log
// says "Using lightmap format E5BGR9_UF" in both arms, which is the HDR one, so
// the LDR bake was never loaded and the two pictures were identical for the
// most boring possible reason.  That trap is written down in my own notes and I
// walked into it anyway.
//
// So: the cvar is set BEFORE the first map, in a process that has never loaded
// this map, and the answer is read off the load line rather than off the
// picture.
//
// READ THIS FIRST in the log, before looking at any screenshot:
//     maps/surf_tensor2.bsp: Using lightmap format ...
// If it still says E5BGR9_UF this arm is UNMEASURED again -- either the map has
// no usable LDR lump or the cvar is not reaching the chooser (mod_vbsp.c:9310)
// -- and the screenshot must not be compared against anything.
//
// The vantage is save006's own, verbatim from its state.txt.
cfg_save_auto 0
exec cfg/testrun/_quiet.cfg
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "p290j"
scr_sshot_type png
cl_yieldcpu 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0

// BEFORE the first map load, and this is the whole point of the file.
hl2_favour_ldr 1
r_texdiag 1
waitms 1500

map surf_tensor2
waitmap 240
waitms 9000
r_texdiag 0
sv_cheats 1
noclip
waitms 500

echo "@@@ P290J check the load line above for the lightmap format"
setpos -10727.2881 10045.7559 -9831.4062 -2.4445 89.8352 0
waitms 3000
hl2_colourcorrection 0
waitms 1200
screenshot p290j_ldr
waitms 1500
light_here
waitms 1500

// ============================================ the guard, PROPERLY this time
// p290i pointed r_colourcorrection at a name that cannot resolve and the picture
// stayed normal -- but that proved nothing about the guard.  R_RegisterCustom
// returns NULL for a name with no shader behind it at all, so ccpostproc is NULL
// and NEITHER branch of the guard runs; that path was always safe and was safe
// before Patch 290 too.
//
// The case that actually shipped black is the other one: a shader that EXISTS
// and cannot draw.  sprites/light_glow02_add_noz is exactly that shape -- the
// census reads `prog 0 passes 1`, a real shader object with no program -- so
// pointing the grade at it drives ccpostproc non-NULL with prog NULL, which is
// the branch the guard was written for.
//
// PASS: the picture stays normal AND the log carries
//       "colour correction disabled: shader ... has no program (prog 0, passes 1)"
// FAIL: a black or frozen screen, which is what 288 did.
echo "@@@ P290J guard -- a shader that EXISTS but has no program"
r_colourcorrection "sprites/light_glow02_add_noz"
waitms 2500
screenshot p290j_guard_realpath
waitms 1500
r_colourcorrection ""
waitms 1200

echo "@@@ P290J DONE"
waitms 1200
quit
