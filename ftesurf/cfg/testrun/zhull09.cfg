// BUILD 47 -- did `!r` stop parking the player a unit in the air?
//
// zhull08's attempt at this MEASURED NOTHING and the log looked like a pass.
// It read zone_dests' `moved` column, assuming it was "where you are against
// where the destination computes".  It is not: SV_ZoneDests sets
// `old = [c_x, c_y, zone_bottom[z] + 2]` -- the pre-destination FALLBACK point,
// not the player -- so `moved` is a property of the zone table and is the same
// 64 whether you have teleported or not.  Recording that here because a column
// that does not move is indistinguishable from a column that is correct.
//
// THE RIGHT INSTRUMENT, and it is already in the tree: `stuck` prints
// self.origin SERVER-SIDE at %.0f.  Both it and zone_goto are server client
// commands, so they are processed in order in the same frame -- which makes
// this an exact before/after with no prediction or snapshot latency in it:
//
//     cmd zone_goto 0   <- setorigin runs
//     cmd stuck         <- reads the origin AS PLACED, before any physics
//     wait 60
//     cmd stuck         <- reads it AFTER it has settled
//
//     z identical      -> build 47.  You are placed where you rest.
//     placed = rest+1  -> the old unconditional +1 lift is still there.
//
// A 1-unit fall at sv_gravity 800 takes ~0.05s, about 3 ticks, so a 60-frame
// wait is far longer than the settle and cannot miss it.
//
// surf_colin_blaster_69000 is the reported map, and its zones carry real
// info_teleport_destination entities (ZTD_NAME), so they take the drop path
// that had the lift on it.
//
// surf_summer_ksf is included for a DIFFERENT reason and is not a regression
// check: its legacy BSP zones declare no destination at all, so they take the
// ZTD_NONE arm -- `zone_bottom + 2`, which does no floor trace and which build
// 47 did NOT change.  Those 32 maps only started timing at all this build, so
// what that arm does is now worth knowing rather than assuming.

log_developer 1

waitms 2000

map surf_colin_blaster_69000
waitmap 240
wait 60

echo ^5=== colin start zone: AS PLACED, then SETTLED
cmd zone_goto 0
cmd stuck
wait 60
cmd stuck
wait 20

echo ^5=== colin stage zone 4: AS PLACED, then SETTLED
cmd zone_goto 4
cmd stuck
wait 60
cmd stuck
wait 20

echo ^5=== and a second time into zone 0, to show it is repeatable
cmd zone_goto 0
cmd stuck
wait 60
cmd stuck
wait 20

map surf_summer_ksf
waitmap 240
wait 60

echo ^5=== summer_ksf: the LEGACY arm (zone_bottom+2, no floor trace, unchanged)
cmd zone_goto 0
cmd stuck
wait 60
cmd stuck
wait 20

echo ^5=== END OF RUN ===
wait 10
quit
