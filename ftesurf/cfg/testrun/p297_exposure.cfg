cfg_save_auto 0
// Patch 297 investigation -- IS THE "EVERYTHING IS DARKER" A MISSING EXPOSURE?
//
// Lex, comparing our surf_fantasy against CS:S: "everything is much darker on
// this stage including the ramp still".  Fault 1 (two pines disagreeing) is
// fixed by 296; what is left is a WHOLE-SCENE difference.
//
// THE HYPOTHESIS.  surf_fantasy's own logic_auto fires, on map spawn:
//     tonemap SetAutoExposureMin 0.8 / SetAutoExposureMax 2 / SetTonemapRate 0.2
// so Source multiplies the entire scene by 0.8..2.0 depending on how bright the
// scene is, and settles high in a dark forest.  We apply exactly 1.0.
//
// THE LEVER ALREADY EXISTS: r_hdr_irisadaptation (renderer.c:230, default 0,
// with _multiplier 2 / _minvalue 0.5 / _maxvalue 4 / _fade_up / _fade_down).
// R_UpdateHDR (gl_rlight.c:79-112) computes multiplier/scene_light, clamps to
// [min,max], eases it, and gl_backend.c:7595 multiplies identitylighting by it.
//
// KNOWN LIMIT, stated before the run so the pictures are read correctly:
// identitylighting feeds e_lmscale, which is the WORLD LIGHTMAP term.  Props
// light from e_light_ambient and the 2D skybox is unlit, so NEITHER should move
// in arms 2/3.  If the world brightens and the props do not, the hypothesis is
// confirmed AND the fix is bigger than this cvar.
//
// ARM 5 IS THE REPEAT CONTROL and it is the point of the run: it restores arm
// 1's settings, so arm5 vs arm1 is the noise floor.  Any effect smaller than
// that difference is not an effect.
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000
wait 200

developer 1
log_developer 1
log_enable 1
log_dir logs
log_name p297_exposure
cl_maxfps 0
cl_idlefps 0
sv_cheats 1
con_notifylines 0
con_notifytime 0.01
r_drawviewmodel 0

alias lex1 "setpos -9921.6426 -13870.3916 6350.7290 0.7910 -48.8123 0; waitms 2500"
alias lex2 "setpos -8047.4780 -13422.3525 5602.3896 27.4438 153.7427 0; waitms 2500"

map surf_fantasy
waitmap 600
waitms 9000
waitms 3000
noclip
waitms 1000

// ---- ARM 1: today ----
r_hdr_irisadaptation 0
gl_overbright 1
echo ^5=== ARM 1: today (iris 0, overbright 1)
lex2
screenshot p297_a1_today_lex2
lex1
screenshot p297_a1_today_lex1

// ---- ARM 2: iris on, FTE's own defaults ----
r_hdr_irisadaptation 1
r_hdr_irisadaptation_multiplier 2
r_hdr_irisadaptation_minvalue 0.5
r_hdr_irisadaptation_maxvalue 4
echo ^5=== ARM 2: iris 1, FTE defaults (mult 2, 0.5..4)
lex2
screenshot p297_a2_iris_lex2
lex1
screenshot p297_a2_iris_lex1

// ---- ARM 3: iris on, SOURCE'S OWN min/max for this map ----
r_hdr_irisadaptation_minvalue 0.8
r_hdr_irisadaptation_maxvalue 2
echo ^5=== ARM 3: iris 1, Source's 0.8..2 for surf_fantasy
lex2
screenshot p297_a3_srcrange_lex2
lex1
screenshot p297_a3_srcrange_lex1

// ---- ARM 4: a DIFFERENT lever, for comparison: overbright 2 ----
r_hdr_irisadaptation 0
gl_overbright 2
echo ^5=== ARM 4: iris 0, gl_overbright 2 (doubles the world lightmap)
lex2
screenshot p297_a4_overbright2_lex2
lex1
screenshot p297_a4_overbright2_lex1

// ---- ARM 5: REPEAT CONTROL -- must reproduce ARM 1 ----
r_hdr_irisadaptation 0
gl_overbright 1
echo ^5=== ARM 5: REPEAT CONTROL, must match ARM 1
lex2
screenshot p297_a5_repeat_lex2
lex1
screenshot p297_a5_repeat_lex1

echo ^5=== END OF RUN ===
waitms 500
quit
