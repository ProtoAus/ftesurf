// cfg_save_auto 0: this run sets archived cvars (vid_*, cl_maxfps); never let it write them into ftesurf.cfg (cl_main.c:2535)
cfg_save_auto 0
// Patch 294d -- FAULT 5, the one-cvar test, at a vantage that can SEE the sky.
//
// The yaw sweep localised it: at yaw 045 the window in the upper left shows a
// dark dotted grid of geometry through its panes with the skyroom pass on, and
// clean pale panes with vbsp_skyroom 0.  That is Lex's "random crap out the
// windows", and it is 0.18% of frame against a 0.01% floor.
//
// gl_warp.c:468 states the rule the engine is breaking: "we also MUST mask any
// sky inside skyrooms, or you'll see all the entities outside of the skyroom
// through the room's own sky."  But r_sky_forcedepth defaults to 1 = mask
// Quake/HL/Q2, do NOT mask Source (:483-488), and R_SkyMaskWantedForGame
// returns false for VBSP (:503-504).
//
// r_sky_forcedepth 2 forces the mask on for Source too.  If arm 2 clears the
// dots, the proposed fix is confirmed BEFORE any code changes -- and if it does
// not, the hypothesis is wrong and no patch should be written.
//
// vbsp_skyroom 0 is the positive control: it is known to clear them, by removing
// the skyroom pass entirely (which is not a fix -- it deletes the 3D skybox).
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000
wait 200

developer 1
log_developer 1
log_enable 1
log_dir logs
log_name p294d_sky045
cl_maxfps 0
cl_idlefps 0
sv_cheats 1
con_notifylines 0
con_notifytime 0
con_notifytime_error 0
r_drawentities 1

alias y045 "setpos -10751.1777 9562.7969 -9789.3184 0 45 0; waitms 1800"

echo ^5=== p294d: surf_tensor2 yaw 045, the window
map surf_tensor2
waitmap 600
waitms 9000
waitms 3000
noclip
waitms 1000

y045
cmd viewpos
screenshot p294d_floor_a
waitms 700
screenshot p294d_floor_b

echo ^5=== ARM 1: defaults -- the dots should be PRESENT
r_sky_forcedepth 1
vbsp_skyroom 1
waitms 1500
y045
screenshot p294d_a1_default

echo ^5=== ARM 2: r_sky_forcedepth 2 -- THE TEST.  Dots gone => fix confirmed.
r_sky_forcedepth 2
waitms 1500
y045
screenshot p294d_a2_forcedepth2

echo ^5=== ARM 3: r_sky_forcedepth 0 -- never mask, the other extreme
r_sky_forcedepth 0
waitms 1500
y045
screenshot p294d_a3_forcedepth0

echo ^5=== ARM 4: vbsp_skyroom 0 -- positive control, known to clear them
r_sky_forcedepth 1
vbsp_skyroom 0
waitms 1500
y045
screenshot p294d_a4_noskyroom

// restore
vbsp_skyroom 1
r_sky_forcedepth 1
waitms 1200

echo ^5=== ARM 5: back to defaults -- must reproduce ARM 1, proving the toggle is live
y045
screenshot p294d_a5_default_again

echo ^5=== END OF RUN ===
waitms 500
quit
