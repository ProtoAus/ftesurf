// FTESurf b58hud -- is the colour grade reaching the 2D pass, and does
// r_renderscale change the answer?
//
// Lex, on surf_tensor2 ONLY: "the font on the console, and fps display, I can
// see a faint background to every leter as if it's a grey square behind every
// one ... sort of like the light sprites, they have a overly bright fadeout,
// which I can see the whole textures when parts of it should be 'masked' or
// transparent." Off tensor2 (the menu), clean.
//
// ONE CAUSE, TWO SYMPTOMS. The glow sprites are BGR888 -- no alpha channel at
// all -- so their only mask is that black contributes nothing through an
// additive blend. A font glyph's surround is transparent the same way. Anything
// that disturbs that reveals the whole texture square in both at once.
// surf_tensor2 is the only map in the library carrying colour-correction LUTs,
// which makes the grade (patches 288/290, mine) the map-specific suspect.
//
// WHY THE FIRST ATTEMPT AT THIS WAS THROWN AWAY, and what this file does about
// it: b58cc.cfg compared CONSOLE TEXT between arms, and between the two
// screenshots the console had scrolled -- different lines, in different places.
// "Glyph pixels" in one arm were background in the other, and the -85 luma
// delta it produced measured scrolling, not grading. It looked like a finding.
// That is the same console-contamination trap that spoiled this session's first
// sprite measurement, hit twice in one day.
//
// So: NO console text at all. The probe is the CSQC HUD, whose elements sit at
// fixed screen positions and say the same thing in every arm -- the run timer at
// top centre, the map name block at top right. Identical content, identical
// position, so a difference can only be the grade.
//
// AND THE AXIS NOBODY HAS TESTED: r_renderscale 2 is live in Lex's config and no
// cfg in this directory has ever set it. On that path the scene renders at 2x
// into an FBO and the 2D pass draws at 1x over the resolved result, so scene and
// window resolution diverge -- and anything assuming one where the other is
// meant is wrong by exactly 2x there. Patch 74's god-ray misalignment was that
// class of bug. Both grade arms are therefore run at both scales.
//
// PASS (grade reaches 2D): the HUD glyphs differ between grade on and off.
// PASS (renderscale matters): the on/off difference is larger at 2 than at 1.
// FAIL (both): the HUD is identical across all four arms -- then neither is the
//      cause and the fault is in the sprite/2D blend itself, not the grade.
cfg_save_auto 0
exec cfg/testrun/_quiet.cfg
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "b58hud"
scr_sshot_type png
cl_yieldcpu 0
vid_vsync 0
crosshair 0
fov 100

// The instrument is the HUD, so the console must contribute NOTHING.
con_notifylines 0
con_notifytime 0.01

waitms 2500
map surf_tensor2
waitmap 240
waitms 8000
sv_cheats 1
noclip
waitms 500

// A dark wall, so a faint box behind a glyph has something to be faint against.
setpos -10688.5 -1773.8 -8587.1 6.3 91.1 0
waitms 3000

// ---------------------------------------------------------- renderscale 1
r_renderscale 1
waitms 1500

echo "@@@ B58HUD A. rs1 grade ON"
r_colourcorrection "ftesurf/cc/surf_tensor2_ef3661e2"
waitms 1500
screenshot b58h_rs1_on_x
waitms 900
screenshot b58h_rs1_on
waitms 900
screenshot b58h_rs1_on_ctl
waitms 900

echo "@@@ B58HUD B. rs1 grade OFF"
r_colourcorrection ""
waitms 1500
screenshot b58h_rs1_off_x
waitms 900
screenshot b58h_rs1_off
waitms 900

// ---------------------------------------------------------- renderscale 2
// His setting. Read the SECOND shot of each pair as always, and note the scene
// behind the HUD will differ between scales for legitimate reasons -- it is
// resampled. Only the HUD glyphs are the measurement.
r_renderscale 2
waitms 2500

echo "@@@ B58HUD C. rs2 grade ON -- his configuration exactly"
r_colourcorrection "ftesurf/cc/surf_tensor2_ef3661e2"
waitms 1500
screenshot b58h_rs2_on_x
waitms 900
screenshot b58h_rs2_on
waitms 900
screenshot b58h_rs2_on_ctl
waitms 900

echo "@@@ B58HUD D. rs2 grade OFF"
r_colourcorrection ""
waitms 1500
screenshot b58h_rs2_off_x
waitms 900
screenshot b58h_rs2_off
waitms 900

r_renderscale 1
r_colourcorrection "ftesurf/cc/surf_tensor2_ef3661e2"
waitms 1000

echo "@@@ B58HUD DONE"
waitms 1200
quit
