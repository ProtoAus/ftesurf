// cfg_save_auto 0: this run sets archived cvars (vid_*, cl_maxfps); never let it write them into ftesurf.cfg (cl_main.c:2535)
cfg_save_auto 0
// Patch 268 B -- env_cubemap reflections.  ARM: REFERENCE (today's deployed binary, before the patch).
//
// This cfg names NO new cvar, so it runs unchanged on the pre-patch binary AND on the
// patched one.  It is the baseline every other arm is diffed against.  The twins
// p268b_a/b/c.cfg differ from this file ONLY in the cvar block marked "=== ARM" and in
// the screenshot prefix.  One process per arm.
//
// Geometry (offline, from the BSP + pak MDL/VVD; see RESULTS):
//   prop #7  ramp_s1  origin 12672 1568 11840 yaw 90.  Up-facing ramp_wood01 patch:
//            centroid 12499.32 3632.00 11588.22, normal -0.78632 0 0.61782 (51.8 deg).
//            The SAME plane also carries ice_transparent (interior; wood is the border).
//            Both are VertexLitGeneric + $bumpmap + $envmap env_cubemap.
//            ramp_wood01     tint 0.1 0.2 0.2  contrast 0.6  sat 0.9  $normalmapalphaenvmapmask
//                            (its normal map is DXT1: sampler alpha = 1 => refl 1.0)
//            ice_transparent tint 0.66         contrast 0.6  sat 0.9  NO mask key
//                            (bump alpine_snow01_normal alpha is FLAT 0 => today refl = 1-0 = 1.0)
//   prop #4  ramp_c1m origin 9440 -15488 3740.8 yaw -135, curved.  Up-face patch centroid
//            11307.21 -13373.53 2645.47, normal -0.50226 0.61422 0.60866.
//
// PREDICTIONS for the arms (each is a separate falsifiable claim):
//   ramp7/ramp4  A==reference exactly;  B changes (a teal-tinted view-dependent sheen
//                appears: tint 0.1/0.2/0.2 on wood, 0.66 grey on the ice);  C changes again
//                (contrast 0.6 squares the term, sat 0.9 desaturates, and the add moves
//                after the lighting multiply).
//   ctrl_tree    IDENTICAL in every arm.  models/props_foliage/Arbre01 has no $envmap and
//                no $bumpmap at all.
//   ctrl_terr    IDENTICAL in every arm.  ALPINE_BLENDROCKSNOW already reflects (explicit
//                $envmap cubemaps/cubemap_cave01, so it always had a reflectcube) and its
//                tint/contrast/saturation are all at their defaults, so Source's order and
//                FTE's order agree on it.  It is the strongest control: a REFLECTING surface
//                that must not move.
//   ctrl_ice04   IDENTICAL in every arm.  The patched ice04_* displacements already reflect
//                (baked cubemap by path) and carry $normalmapalphaenvmapmask with a FLAT-255
//                alpha, which is what both the old and the Source mask rule give.
//   world_rock   A==reference;  B CHANGES.  end_rock01_wvt_patch is a WORLD face whose
//                VBSP-written VMT kept the literal "env_cubemap" (167 faces), so it is the
//                world-side half of the same fix.  Under C it changes again and hard:
//                $envmapcontrast 1 squares an already tiny term (tint 0.02) and
//                $envmapsaturation 0 greyscales it.
//
// Read the log for:  "refl batches since last: used=N gated=M envcube used=P gated=Q"
// (P is 0 on every reference/A shot and must be positive on the ramp/world_rock shots in B/C).
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000
wait 200

developer 1
log_developer 1
log_enable 1
log_dir logs
log_name p268b_ref
cl_maxfps 0
cl_idlefps 0
sv_cheats 1
con_notifylines 0
con_notifytime 0
con_notifytime_error 0
// props ARE entities on this path (VBSP_PrepareFrame -> NewSceneEntity), so drawentities
// must be ON -- the D1 cfgs set it to 0 and would have hidden every ramp.
r_drawentities 1
r_lightstylescale 1

echo ^5=== ARM reference (no new cvars set)

map surf_boreas
waitmap 600
waitms 9000
noclip
waitms 1000

// --- ramp7: prop #7's wood+ice slope, camera on the face normal at 325 units ---
setpos 12243.8 3632 11789 38.16 0 0
waitms 2500
cmd viewpos
shader_here ramp7
screenshot p268b_ref_ramp7_x
waitms 700
screenshot p268b_ref_ramp7
waitms 700
screenshot p268b_ref_ramp7_n
shader_here ramp7end

// --- ramp7b: the SAME surface point from a different azimuth, so the reflected vector
// differs while the diffuse texture does not.  Camera at centroid + (-150,250,150). ---
setpos 12349.3 3882 11738.2 27.2 -59 0
waitms 2500
cmd viewpos
shader_here ramp7b
screenshot p268b_ref_ramp7b_x
waitms 700
screenshot p268b_ref_ramp7b
waitms 700
screenshot p268b_ref_ramp7b_n

// --- ramp4: prop #4's curved ramp, a different cubemap (719 units away vs 1275) ---
setpos 11144 -13173.9 2843.3 37.49 -50.73 0
waitms 2500
cmd viewpos
shader_here ramp4
screenshot p268b_ref_ramp4_x
waitms 700
screenshot p268b_ref_ramp4
waitms 700
screenshot p268b_ref_ramp4_n

// --- ctrl_tree: nearest tree_pine05 to prop #7, at 12284 -501 12631.  No envmap, no bump. ---
setpos 12284 -901 12831 0 90 0
waitms 2500
cmd viewpos
screenshot p268b_ref_ctrltree_x
waitms 700
screenshot p268b_ref_ctrltree
waitms 700
screenshot p268b_ref_ctrltree_n

// --- ctrl_terr: straight down at ALPINE_BLENDROCKSNOW disp 58 (displaced centroid
// 13824 2112 11857).  A reflecting world face that must NOT move in any arm. ---
setpos 13824 2112 12457 89 0 0
waitms 2500
cmd viewpos
shader_here ctrlterr
screenshot p268b_ref_ctrlterr_x
waitms 700
screenshot p268b_ref_ctrlterr
waitms 700
screenshot p268b_ref_ctrlterr_n

// --- ctrl_ice04: straight down at the patched ice04 displacement (9277 4752 72). ---
setpos 9200 4752 700 89 0 0
waitms 2500
cmd viewpos
shader_here ctrlice04
screenshot p268b_ref_ctrlice04_x
waitms 700
screenshot p268b_ref_ctrlice04
waitms 700
screenshot p268b_ref_ctrlice04_n

// --- world_rock: the end_rock01_wvt_patch faces (literal env_cubemap on a WORLD face). ---
setpos 9987 8290 627 89 0 0
waitms 2500
cmd viewpos
shader_here worldrock
screenshot p268b_ref_worldrock_x
waitms 700
screenshot p268b_ref_worldrock
waitms 700
screenshot p268b_ref_worldrock_n

echo ^5=== END OF RUN ===
waitms 500
quit
