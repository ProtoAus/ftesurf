cfg_save_auto 0
// P317A -- BASELINE arm (hl2_phywinding 0): .phy hulls exactly as every build
// from 8 to 316 built them.  p317b.cfg is this file with the cvar at 1.
//
// THE QUESTION.  com_bih.c's BIH_ClipToTriangle takes its face plane as
// cross(p1-p2, p3-p2) and gives it four units of solid BEHIND it, so that
// normal must point OUT of the model.  IVP compactledge triangles are wound the
// other way, and mod_phy.c passed them through untouched, so every .phy hull in
// the game should be inside out -- four units of solid stacked ON TOP of the
// visible surface instead of buried under it.
//
// PRE-REGISTERED, from an offline model of BIH_ClipToTriangle over
// ramp_c1m.phy placed at prop #1051 (origin 9440 -15488 3740.8, yaw -135):
//
//   run_eyeinfo at 10116.12 -14549.43, point traceline straight down
//     p317a (winding 0)   floor  2923.10
//     p317b (winding 1)   floor  2916.28
//     delta               -6.81  == 4/|n_z| with n_z 0.587 (a 54 degree ramp)
//
//   CONTROL at the spawn, over displacement terrain Patch 256 already re-wound:
//     both arms IDENTICAL to 0.00.  If the control moves, the two arms differ
//     by more than the cvar and nothing else in either log means anything.
//
// Anything other than -6.81 falsifies this: 6.81 is a prediction, not a fitted
// number.  0.00 means the flip never reached the loader -- check the
// "collision hulls re-wound" line below before reading anything else.
//
// THE RIDE.  pm_dispprobe 2, not 1.  Mode 1 is gated on pmove.onground, and a
// 54-degree ramp is below pm_standablenormal 0.7, so a player RIDING one is
// airborne and mode 1 prints nothing at all -- which is why Patch 258's snag01
// probed this exact map, saw nothing, and ruled it out.  Mode 2 drops the gate
// and change-latches instead.
log_enable 1
log_dir "logs"
log_name "p317a"
cl_idlefps 0
vid_fullscreen 0
con_notifylines 0
developer 1
log_developer 1

hl2_propcollision 1
hl2_phywinding 0

wait 200
map surf_boreas
waitmap 600
waitms 12000
sv_cheats 1
waitms 500

echo ^5=== P317A: which build is this, and did the loader see the cvar?
cmd run_rulesetinfo
waitms 300
echo ^5=== (the "collision shapes" and "re-wound" lines are above, from map load)

echo ^5=== P317A: CONTROL -- displacement terrain at the spawn, must not move
noclip
waitms 400
setpos 12788.09 -11827.59 14736.03 90 82.15 0
waitms 900
cmd run_eyeinfo
waitms 900

echo ^5=== P317A: THE MEASUREMENT -- straight down onto ramp_c1m at lock 11's XY
setpos 10116.12 -14549.43 2990 90 41.64 0
waitms 900
cmd run_eyeinfo
waitms 900
cmd stuck
waitms 900

echo ^5=== P317A: 4 units lower, i.e. inside the slab if the slab is where I think
setpos 10116.12 -14549.43 2920 90 41.64 0
waitms 700
cmd stuck
waitms 700
echo ^5=== P317A: and 8 below the predicted true surface -- hollow or solid?
setpos 10116.12 -14549.43 2908 90 41.64 0
waitms 700
cmd stuck
waitms 900

echo ^5=== P317A: the save list.  CONFIRM row 11 is the 10116/-14549 one.
cmd sl_list
waitms 1500

echo ^5=== P317A: the ride.  No movement keys -- the saved velocity is the input.
// noclip AGAIN: it is a toggle, and the probes above left it ON.  Without this
// the player neither falls nor collides, sl_goto looks like it did nothing, and
// the probe prints not one line -- which is exactly what the first run of this
// file produced.
noclip
waitms 400
pm_dispprobe 2
waitms 200
cmd sl_goto 11
waitms 250
cmd run_eyeinfo
waitms 250
cmd run_eyeinfo
waitms 250
cmd run_eyeinfo
waitms 250
cmd run_eyeinfo
waitms 250
cmd run_eyeinfo
waitms 250
cmd run_eyeinfo
waitms 250
cmd run_eyeinfo
waitms 250
cmd run_eyeinfo
waitms 250
cmd run_eyeinfo
waitms 250
cmd run_eyeinfo
waitms 250
cmd run_eyeinfo
waitms 250
cmd run_eyeinfo
waitms 400

echo ^5=== P317A: where did it end up
cmd run_slideinfo
waitms 500
cmd run_eyeinfo
waitms 600
cmd stuck
waitms 600
screenshot p317a_stop
waitms 800

echo ^5=== P317A DONE ===
pm_dispprobe 0
wait 60
quit
