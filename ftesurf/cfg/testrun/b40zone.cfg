// Build 40: are the timer zones actually visible now, and do the new switches
// do what they say?
//
// THE REPORT: "Make checkpoints/end zone/start zones/stage zones fully visible,
// quake/source uses BSP and can you use PVS to decide if they are rendered?"
//
// PVS WAS NEVER INVOLVED.  The zones are not entities and are never networked
// (sv_zones.qc:5-7) -- both VMs parse the same Momentum JSON at map load, and
// nothing in this game sets .SendEntity, so no server-side PVS test has ever
// touched one.  Three CLIENT-side things were hiding them: a 4096-unit distance
// gate, the depth test, and the fact that a zone is a wire cage with no faces.
//
// WHAT TO LOOK FOR:
//   * the zone_debug dumps.  The first line names the new gates; then one row
//     per zone with dist/radius/dot, then how many passed.  With
//     zone_draw_dist 0 the pass count must be every zone whose TYPE is on.
//   * the screenshots.  xray must show a zone through the wall in front of it;
//     fill must turn the cage into a volume.
//
// All in one process is safe here: zone_* are read fresh every frame by
// Zone_ReadCvars, no map reload is involved, and the map-twice trap does not
// apply because the map is loaded exactly once.

log_enable 1
log_name b40zone
developer 1
log_developer 1
cfg_save_auto 0
cl_idlefps 0
sv_cheats 1
cl_maxfps 100
fs_missingwarn 0

wait 200
map surf_aesthetic
waitmap 900
wait 300

// AFTER waitmap -- zone_* are csprogs cvars, see b40wish.cfg's note.
hud_debug 1

echo ^5=== b40zone: shipped defaults (dist 0, no xray, no fill) ===
zone_draw 1
zone_draw_dist 0
zone_xray 0
zone_fill 0
// zone_pvs was removed in build 40 -- see cl_zones.qc
wait 30
zone_debug 1
wait 10
screenshot
wait 20

echo ^5=== b40zone: the OLD 4096 gate, for contrast ===
zone_draw_dist 4096
wait 20
zone_debug 1
wait 10
screenshot
wait 20

echo ^5=== b40zone: back to no limit, and xray on ===
zone_draw_dist 0
zone_xray 1
wait 20
zone_debug 1
wait 10
screenshot
wait 20

echo ^5=== b40zone: xray + fill ===
zone_fill 1
wait 20
screenshot
wait 20

echo ^5=== b40zone: fill without xray -- depth-tested volume ===
zone_xray 0
wait 20
screenshot
wait 20

echo ^5=== b40zone: a second dump with fill on, so the header line is on record ===
zone_debug 1
wait 10
screenshot
wait 20

echo ^5=== b40zone: the list, for the record ===
zone_list
wait 20

echo ^5=== b40zone: done ===
wait 50
quit
