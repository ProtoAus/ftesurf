cfg_save_auto 0
// Does THIS binary actually have FTE's map-cluster support, or is the string
// merely present in the file?
//
// The question matters because the whole "every map is online" design hangs on
// it: sv_cluster.c is behind #ifdef SUBSERVERS, config_fteqw.h defines it and
// four other configs #undef it, and nothing in the repo records which config
// the shipped build uses.  Greping the binary found `mapcluster` five times --
// but a string in a rodata section is not a registered command, and the first
// probe I ran (`strings`) returned 0 for EVERY symbol including cvars I know
// exist, so this arm exists to answer it from the engine's own mouth.
//
// cmdlist/cvarlist print what is REGISTERED, which is the thing behind the
// ifdef.  Controls included deliberately: pm_lockmovement is a cvar this tree
// patched itself and must appear, so an empty log reads as "the harness
// failed" rather than "the feature is absent".
log_enable 1
log_dir logs
log_name p314cluster
// Wall clock, not frames.  `wait N` counts FRAMES (cmd.c:4720) and this file
// runs at the menu where the framerate is in the high hundreds, so `wait 200`
// is a fraction of a second -- not enough to be sure the engine has finished
// registering commands, which is the very thing this arm is asking about.
// A cvarlist issued too early would print nothing and read as "absent".
waitms 5000
echo ==== CONTROL: a cvar this tree added (must print) ====
cvarlist pm_lockmovement
echo ==== CONTROL: a command that always exists ====
cmdlist quit
echo ==== SUBJECT: the cluster command ====
cmdlist mapcluster
echo ==== SUBJECT: the offload cvar ====
cvarlist sv_autooffload
echo ==== SUBJECT: anything cluster-ish ====
cmdlist cluster
cmdlist ssv
echo ==== END ====
waitms 2000
log_enable 0
waitms 500
quit
