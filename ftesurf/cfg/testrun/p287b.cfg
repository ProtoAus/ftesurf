// FTESurf p287 -- did scripts/common.shader break the kitsune portal projection?
//
// THE REPORT: "they don't visually portal correctly any more, no projection of
// the next level, not even locally anymore" -- and, separately, "the rainbow
// backdrop is being rendered in front of all the alphas sometimes".  Lex says
// they had been making a lot of material edits and suspects themselves.
//
// The only material/shader file in the gamedir with a recent mtime is
// scripts/common.shader (02:18 today), and it is UNTRACKED in git -- a new file,
// and stock Quake 3 content: textures/common/* tool shaders, several of which
// carry the `portal` keyword and hand-written blendfuncs.
//
// This is the B of an A/B: scripts/common.shader has been moved aside for it.
// Nothing else differs, so a difference between the two pictures is caused by
// that file and by nothing else.  If the two are identical, the file is
// exonerated and the cause is elsewhere -- which is worth just as much, because
// it is currently the only suspect.
//
// Vantage and method are lifted verbatim from g12portal.cfg (Patch 210), which
// is the run that established this camera actually frames the doorway.  Reusing
// a known-good vantage rather than inventing one is the whole reason a
// screenshot here means anything -- a new camera that happens to miss the portal
// would read as "no projection" on both sides and prove nothing.
//
// TWO CHECKS, and the first is decisive on its own:
//
//  1. r_showshader ftesurf_portal must report sort 3 (SHADER_SORT_PORTAL) and one
//     pass whose map is $refraction.  If common.shader has displaced or altered
//     the material, it shows up HERE, in text, with no picture needed.
//  2. the pictures.
cfg_save_auto 0
exec cfg/testrun/_quiet.cfg
developer 1
log_developer 1
log_dir "logs"
log_name "p287b"
scr_sshot_type png
cl_yieldcpu 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0

waitms 2500

map surf_kitsune
waitmap 240
waitms 8000
sv_cheats 1

echo "@@@ P287B shader as parsed -- want sort 3 (SHADER_SORT_PORTAL), one $refraction pass"
r_showshader ftesurf_portal
waitms 500

// The client's own door census.  18 is the number this map has had all along and
// the number the server reports; a change here would mean the doors themselves
// stopped being built, which is a different bug from a door that renders wrong.
echo "@@@ P287B see the 'portals: N with apertures' line above"
waitms 300

echo "@@@ P287B portal vantage 0 -765 133 yaw 90 -- straight on"
setpos 0 -765 133 0 90 0
waitms 3000
screenshot_mega p287b_portal 1280 720
waitms 800

// Oblique matters: straight on, a correct portal and a flat wallpapered
// $refraction lookup can look similar.  At an angle they cannot -- a real
// projection shifts with parallax and a texture lookup does not.
echo "@@@ P287B oblique 45"
setpos 0 -765 133 0 45 0
waitms 2000
screenshot_mega p287b_oblique 1280 720
waitms 800

echo "@@@ P287B DONE"
waitms 1000
quit
