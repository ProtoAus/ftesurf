// Patch 188: is $color2 actually reaching the screen?
//
// The start zone is dark walls + white windows, which shows the map is no
// longer white but does not prove a TINT.  The 227 $color2 materials on this
// map are all on PROPS, so this parks the camera in front of the most saturated
// ones -- positions read from the map's own sprp game lump, not guessed:
//
//   models/dreams/heart.mdl        $color2 {255 0 0}      at  1536 -9216 -3056
//   models/dreams/cake.mdl                                at  1536 -9216 -6144
//   models/dreams/umbrella_static  $color2 {47 138 249}   at -4816 -9216  -800
//
// If $color2 were still being dropped every one of these would be pure white:
// their $basetexture is dreams/white.
cfg_save_auto 0
log_name p188col
developer 0
scr_sshot_type png
waitms 2500

map surf_unrequited
waitms 30000
noclip
waitms 500

setpos 1736 -9216 -3020 12 180 0
waitms 1200
screenshot_mega p188_heart 1280 720
waitms 1500

setpos 1736 -9216 -6090 12 180 0
waitms 1200
screenshot_mega p188_cake 1280 720
waitms 1500

setpos -4666 -9216 -740 12 180 0
waitms 1200
screenshot_mega p188_umbrella 1280 720
waitms 1500

echo "=== P188COL DONE ==="
waitms 1000
quit
