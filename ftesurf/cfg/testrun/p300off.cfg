// FTESurf Patch 300 A/B, arm OFF: the pre-P300 behaviour.  Additive materials
// stay on a pass, so they have no top-level program, so BE_ProglessFogBegin
// applies fixed-function fog to them and a black (masking) texel picks up
// fogcolour*(1-fac) and is ADDED.  This arm is the artefact Lex reported.
log_name "p300ab_off"
hl2_additivefog 0
exec cfg/testrun/p300shot.cfg
