// Patch 273 -- IS THE WHOLE-TREE DESCENT ACTUALLY WHAT COSTS 1.7ms A FRAME?
//
// Established so far (p273c, A/B/A/B alternated, developer off):
//     Snapshot build  sv_nopvs 0 : 1761.01 / 1657.26 us per render frame
//                     sv_nopvs 1 :   32.31 /   30.39
//     real framerate             :  192.0 / 210.2  ->  398.1 / 411.8
// So the per-entity visibility test IS the server bucket. What is NOT yet shown
// is WHICH part of it: the ordinary leaf-list compare, or VBSP_HeadnodeVisible,
// the whole-node-tree descent taken when an entity's leaf list overflowed.
//
// THE ARITHMETIC THAT NEEDS CONFIRMING.  1678us/render-frame at ~200fps is
// 0.336 s of CPU per second; at cl_netfps 66.6667 the snapshot runs ~67 times a
// second, so ~5.0ms per SERVER frame.  tensor2 reports 28 live entities, which
// would be ~179us each -- and one full descent of a 19846-leaf tree is ~40,000
// node visits, which at ~4.5ns per pointer-chase is ~180us.  The numbers line up
// EXACTLY, which is suspicious enough to want the counter rather than the model.
//
// WHAT WOULD FALSIFY IT:
//   descents/s near zero, or visits/descent far below ~40,000  -> the descent is
//   NOT the cost, the model above is a coincidence, and the expense is in the
//   leaf-list compare or in the snapshot writing. Go back to the source.
//
// Windows are fixed at 4000ms so calls/s can be derived. Each counter is read as
// a PAIR: the first call clears, the second is the reading.

vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000

cl_maxfps 0
cl_idlefps 0
cl_yieldcpu 0
sv_cheats 1

map surf_tensor2
waitmap 600
waitms 9000
r_speeds 2
noclip
waitms 1000
setpos -11776 -13632 13720 0 0 0
waitms 3000

echo ^5=== A tensor2 spawn, shipped
vbsp_pvsstat
sv_perfdump
waitms 4000
echo ^5--- A readings over a 4000ms window
vbsp_pvsstat
sv_perfdump
waitms 500

echo ^5=== B same, sv_nopvs 1 -- descents must go to ZERO, and that is the control
sv_nopvs 1
waitms 2000
vbsp_pvsstat
sv_perfdump
waitms 4000
echo ^5--- B readings over a 4000ms window
vbsp_pvsstat
sv_perfdump
waitms 500
sv_nopvs 0
waitms 1500

// The prop cull calls the SAME function from the renderer (VBSP_PrepareFrame),
// so `prop_census` and pvsstat together say how the descents split between the
// server's snapshot and the renderer's prop pass.
echo ^5=== C prop side, for the split
prop_census
waitms 800

// ---- control: the claim is that surf_tensor has no overflowing entity -------
echo ^5=== F CONTROL surf_tensor -- expect few or no headnode descents at all
map surf_tensor
waitmap 600
waitms 9000
r_speeds 2
noclip
waitms 2500
vbsp_pvsstat
sv_perfdump
waitms 4000
echo ^5--- F readings over a 4000ms window
vbsp_pvsstat
sv_perfdump
waitms 500

echo ^5=== END OF RUN ===
waitms 500
quit
