// cfg_save_auto 0: this run sets archived cvars (vid_*, cl_maxfps); never let it write them into ftesurf.cfg (cl_main.c:2535)
cfg_save_auto 0
// Patch 294c -- FAULT 4, identify the subject BEFORE testing it.
//
// Two corrections drive this run:
//  1. I claimed the dark octagon in p294a was func_brush *101.  The model bounds
//     refute it: *101 is compiled around an origin brush (symmetric bounds
//     -2417..+2417 x -812..+812 x -373..+373) placed at -10688 10348.6 -10250.5,
//     i.e. a 4834 x 1625 x 747 SLAB whose top face sits at z -9877 -- about 150
//     units BELOW the camera eye.  That is floor-shaped, not octagon-shaped.
//  2. Only two brush entities are anywhere in the forward cone, both ~33 deg
//     below the crosshair.  So the octagon is worldspawn.
//
// r_drawentities 0 removes brush entities and leaves worldspawn.  Diffing it
// against the default therefore PAINTS every brush entity in frame -- that is an
// identification, not an inference, and it settles whether the floor is *101.
//
// Only then are the lighting arms worth anything: p294a's bump arms moved 0.02%
// of pixels, the same as two identical shots, and a null from a camera that may
// not even see the subject says nothing about the subject.
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000
wait 200

developer 1
log_developer 1
log_enable 1
log_dir logs
log_name p294c_fault4
cl_maxfps 0
cl_idlefps 0
sv_cheats 1
con_notifylines 0
con_notifytime 0
con_notifytime_error 0
r_drawentities 1

// A: Lex's own save008 framing.  B: same spot, pitched down so the floor -- the
// candidate *101 -- fills the frame instead of sitting in the bottom third.
alias posA "setpos -10751.1777 9562.7969 -9789.3184 -0.0934 89.4342 0; waitms 1800"
alias posB "setpos -10751.1777 9562.7969 -9789.3184 45 89.4342 0; waitms 1800"

echo ^5=== p294c: surf_tensor2 fault 4
map surf_tensor2
waitmap 600
waitms 9000
waitms 3000
noclip
waitms 1000

posA
cmd viewpos
screenshot p294c_floor_a
waitms 700
screenshot p294c_floor_b

// ---- IDENTIFY: what in this frame is a brush entity at all?
echo ^5=== ARM idA1: vantage A, default
posA
screenshot p294c_A_ents_on
echo ^5=== ARM idA2: vantage A, r_drawentities 0 -- brush entities gone
r_drawentities 0
waitms 1500
posA
screenshot p294c_A_ents_off
r_drawentities 1
waitms 1200

echo ^5=== ARM idB1: vantage B (pitched down at the floor), default
posB
screenshot p294c_B_ents_on
echo ^5=== ARM idB2: vantage B, r_drawentities 0
r_drawentities 0
waitms 1500
posB
screenshot p294c_B_ents_off
r_drawentities 1
waitms 1200

// ---- LIGHTING ARMS at vantage B, where the slab fills the frame.
echo ^5=== ARM L1: vantage B reference
posB
screenshot p294c_B_L1_default
echo ^5=== ARM L2: hl2_bumpstride 0
hl2_bumpstride 0
waitms 1500
posB
screenshot p294c_B_L2_nobumpstride
hl2_bumpstride 1
waitms 1200
echo ^5=== ARM L3: hl2_bumpmap 0
hl2_bumpmap 0
waitms 1500
posB
screenshot p294c_B_L3_nobumpmap
hl2_bumpmap 1
waitms 1200
echo ^5=== ARM L4: r_lightmap 1 -- lightmap only, no albedo
r_lightmap 1
waitms 1500
posB
screenshot p294c_B_L4_lightmaponly
r_lightmap 0
waitms 1200

echo ^5=== END OF RUN ===
waitms 500
quit
