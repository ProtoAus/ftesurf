// Build 42: how high is the eye above the floor YOU ARE STANDING ON?
//
// THE REPORT: "I swear standing eye-height SAYS 64, however in Momentum/CSS
// your eye-line is around the same height you can crouch jump, but in my game
// I'm like 16units~ too high, and when I duck, THEN I'm the correct height for
// standing next to boxes which are 64units."
//
// Build 41 measured camera-minus-pmove_org and got 64.06, and called the
// report not-reproducible.  That number was true and useless: it proves the
// eye is 64 above the ORIGIN, which nobody doubted.  It does not say where the
// origin is relative to the FLOOR.  The floor trace that was meant to cover
// that ran in CSQC, where a traceline falls through brush entities, so it
// reported world geometry 17 units below the func_ the player was standing on
// -- and that wrong number was then explained away as the known trap.
//
// run_eyeinfo runs SERVER side, where a traceline collides brush entities.
//
// WHAT TO LOOK FOR -- one number decides it:
//   EYE ABOVE FLOOR 64.xx  -> the engine is right; the eye is Momentum's, and
//                             the 16 units are in what is being compared
//                             against (a 48-unit crate reads exactly like it).
//   EYE ABOVE FLOOR 81.xx  -> the origin floats ~17 above the floor and the
//                             report is right.
// `feet-above-floor` is the same fact stated as a gap: 0 or 81-64=17.
//
// Ducked repeats it at view_ofs 47, which the report says looks correct.
//
// Single process, single map load -- `map x` twice does not reload.
// A server-side client command is not reachable by typing its bare name from a
// cfg, so every call here goes through `cmd`.

log_enable 1
log_name b42eye
developer 1
log_developer 1
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
sv_cheats 1
fs_missingwarn 0

wait 200
map surf_aesthetic
waitmap 900
wait 300

echo ^5=== b42eye: the movement banner, for the record ===
pm_selftest
wait 60

echo ^5=== b42eye: STANDING on spawn (view_ofs should be 64) ===
cmd run_eyeinfo
wait 40
cmd stuck
wait 40

echo ^5=== b42eye: DUCKED on spawn (view_ofs should be 47) ===
+duck
wait 60
cmd run_eyeinfo
wait 40
-duck
wait 60

echo ^5=== b42eye: STANDING again, to prove the duck round-tripped ===
cmd run_eyeinfo
wait 40

echo ^5=== b42eye: done ===
wait 40
quit
