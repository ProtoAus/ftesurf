// P262B -- p262a again, with an instrument that works.
//
// p262a read 496.5 / 442.0 / 95.0 / 166.5 / 910.7 for a sequence whose FIRST and
// LAST steps were the SAME setting.  An 83% gap between two identical configs
// means the measurement was of the map warming up -- shaders compiling, models
// streaming, lightmaps uploading -- and not of the thing being toggled.  It also
// read the skybox-on CONTROL as slower than the bound case, which is backwards,
// for the same reason.
//
// Two changes:
//   * settle for 25 seconds before measuring anything, not 6;
//   * ALTERNATE, three times per skybox mode, instead of taking one sample each.
//     A single pair cannot tell a real difference from drift; three alternations
//     can, because drift does not reverse sign every time the cvar does.
//
// Each dwell takes two screenshots.  The first is thrown away -- writing a 2MB
// PNG stalls the frame and show_fps is a one-second average, so the shot taken
// immediately after a toggle is measuring the previous setting and the shot after
// that is measuring the screenshot.  The SECOND one, five seconds later, is the
// reading.

log_enable 1
log_dir "logs"
log_name "p262b"
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 0
vid_fullscreen 0
sv_cheats 1
show_fps 1

wait 200
echo ^5=== p262b: Patch 262 cost, interleaved ===

map surf_boreas
waitmap 1800
waitms 25000
echo ^5(settled)

vbsp_skyroom 0
waitms 5000

echo ^5========================= skybox OFF =========================
hl2_lt_baked_vc 1
waitms 5000
screenshot p262b_discard
waitms 5000
screenshot p262b_off_a_vc1
waitms 2000
hl2_lt_baked_vc 0
waitms 5000
screenshot p262b_discard
waitms 5000
screenshot p262b_off_a_vc0
waitms 2000
hl2_lt_baked_vc 1
waitms 5000
screenshot p262b_discard
waitms 5000
screenshot p262b_off_b_vc1
waitms 2000
hl2_lt_baked_vc 0
waitms 5000
screenshot p262b_discard
waitms 5000
screenshot p262b_off_b_vc0
waitms 2000
hl2_lt_baked_vc 1
waitms 5000
screenshot p262b_discard
waitms 5000
screenshot p262b_off_c_vc1
waitms 2000
hl2_lt_baked_vc 0
waitms 5000
screenshot p262b_discard
waitms 5000
screenshot p262b_off_c_vc0
waitms 2000
prop_census
waitms 600

echo ^5========================= skybox ON ==========================
vbsp_skyroom 1
waitms 8000
hl2_lt_baked_vc 1
waitms 5000
screenshot p262b_discard
waitms 5000
screenshot p262b_on_a_vc1
waitms 2000
hl2_lt_baked_vc 0
waitms 5000
screenshot p262b_discard
waitms 5000
screenshot p262b_on_a_vc0
waitms 2000
hl2_lt_baked_vc 1
waitms 5000
screenshot p262b_discard
waitms 5000
screenshot p262b_on_b_vc1
waitms 2000
hl2_lt_baked_vc 0
waitms 5000
screenshot p262b_discard
waitms 5000
screenshot p262b_on_b_vc0
waitms 2000
hl2_lt_baked_vc 1
waitms 5000
screenshot p262b_discard
waitms 5000
screenshot p262b_on_c_vc1
waitms 2000
hl2_lt_baked_vc 0
waitms 5000
screenshot p262b_discard
waitms 5000
screenshot p262b_on_c_vc0
waitms 2000
prop_census
waitms 600

echo ^5=== p262b done ===
wait 30
quit
