// OVL02 -- do arguments 9 and 10 of adddecal_static actually ARRIVE?
//
// MAX_PARMS is 8, so srange/trange are passed through the compiler's
// extra-parameter globals and read back as OFS_PARM0 + 3*n, the same way every
// vararg builtin reads them (PF_sprintf, pr_bgcmd.c:7351).  That is a
// convention, not a guarantee, and if the compiler put them somewhere else the
// engine would read neighbouring globals and get plausible-looking garbage.
//
// This is the test that tells the difference.  Under developer 2 the builtin
// prints the range it received.  Two things must hold:
//
//   surf_rise   almost every overlay must print s 0..1 t 0..1 exactly -- 80.4%
//               of the library is the identity, and garbage is not 0 and 1.
//   surf_theme  is the tiled map: 570 of its 604 overlays repeat their texture,
//               so ranges like s 0..13 must appear.  If every line reads 0..1
//               there, the values are NOT arriving and the whole mechanism is a
//               no-op that happens to look right.

log_enable 1
log_dir "logs"
log_name "ovl02"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
sv_cheats 1
developer 2
log_developer 1

wait 200
echo ^5=== ovl02: extra-parameter arrival check ===

map surf_rise
waitmap 1800
waitms 4000

echo ^5=================== now the tiled map ====================================
map surf_theme
waitmap 1800
waitms 5000

echo ^5=== ovl02 done ===
wait 30
quit
