// cfg/testrun/p278x.cfg -- Patch 278: did the generated r_part blocks PARSE?
//
// The screenshot differential could not answer this.  surf_null carries ~158
// particles of its own, they are animated, and a frame-to-frame diff therefore
// measures moving map dust far more than it measures nine avatar motes.  That
// is a confounded control, so it gets replaced rather than argued with.
//
// r_exportalleffects writes every LOADED effect back out as an r_part block
// (PScript_Query).  It is decisive in a way a picture is not:
//
//   * a block that parsed exports with its own rgb line;
//   * a block that was DISCARDED before Renderer_Start, or killed by the
//     r_particledesc callback, exports with an EMPTY BODY -- which is exactly
//     the signature that identified the Patch 272 bug;
//   * a block that never existed does not export at all.
//
// So this separates "my colour is wrong" from "my block never loaded" from
// "the engine unloaded it", which the screenshot cannot.

sv_port 27601
cl_maxfps 100
log_developer 1

wait 200
map surf_null
wait 600

lobby_enable  1
lobby_avatars 1

wait 200
echo "^3p278x:^7 exporting all loaded effects"
r_exportalleffects
wait 200
quit
