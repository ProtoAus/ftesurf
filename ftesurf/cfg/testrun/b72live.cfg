// Build 72 against the LIVE fleet: does the input profile survive the path a
// player actually takes?
//
// EVERYTHING ABOVE THIS RAN ON A LISTEN SERVER, where the client and the server
// are one process and a userinfo "round trip" is a function call.  This one
// connects to play.proto.bar, so:
//
//   * the csprogs running Rec_ProfileReport is DOWNLOADED from the lobby, not
//     the one on this disk -- which is the only copy a player ever runs, and
//     the reason the HUD work appeared to vanish in build 71;
//   * `setinfo inprof` is a real userinfo update over a real network to a real
//     aarch64 qwprogs, which is where a quoting or a parse difference would
//     show up and where a listen-server test cannot look.
//
// cfg_save_auto 0: m_accel is CVAR_ARCHIVE and this sets it.  Arm 3 restores it
// anyway.
//
// PREDICTION:
//   arm 1  connected to play.proto.bar:275N0, key "1 7 1 0 0 0", would 0
//   arm 2  m_accel 1 -> the key's accel field becomes 1 and would becomes 1,
//          with no reconnect and no map change
//   arm 3  restored -> the key's accel field goes back to 0 but `bad` STAYS 1
//          against a badat of 0, so would STAYS 1.
//
// ARM 3 IS NOT A FAILURE AND THE FIRST VERSION OF THIS FILE PREDICTED IT WRONG.
// Spawning in a lobby arms an attempt -- which is why badat reads 0 here and not
// -1 -- and nothing in this config re-arms one, so all three arms are looking at
// the SAME attempt.  That attempt did cross an off-profile transition, so it is
// marked for the rest of its life.  That is the entire point of the counter: the
// mark must survive the setting being put back.  A FRESH attempt after the count
// has moved is the case that must come back clean, and it cannot be tested here
// because zone_goto does not exist on a lobby -- b72prof.cfg arm 6 covers it on
// a listen server and measured badat 4 / would 0.
//
// FALSIFIED IF: key is "" on the live server (the setinfo does not survive the
//          wire, and every arm of b72prof.cfg proved only that a process can
//          talk to itself); or would does not move in arm 2; or the key's accel
//          field does not go back to 0 in arm 3, which would mean the client
//          stopped republishing rather than that the run stayed marked.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name b72live
developer 0

name "^3Lex ProfLive"

waitms 40000
menu_restart
waitms 3000

echo ================================ B72LIVE arm 1 -- join a real lobby, stock profile
m_accel 0
m_filter 0
in_rawinput 1
waitms 500
connect play.proto.bar:27510
waitms 18000
status
cmd timer
waitms 2000

echo ================================ B72LIVE arm 2 -- m_accel 1, no reconnect
m_accel 1
waitms 2500
cmd timer
waitms 2000

echo ================================ B72LIVE arm 3 -- restored
m_accel 0
waitms 2500
cmd timer
waitms 2000

echo ================================ B72LIVE done
disconnect
waitms 2000
quit
