// REG256 -- Patch 256 regressions.
//
// The reg250/251/253 baselines, unchanged:
//   surf_rise     overlays 103 of 105 placed, sprites 1 of 1
//   bhop_canals   decals 81 of 416, overlays 41 of 53, sprites 74 of 97
//   bhop_arcane   1122 func_bhop, overlays 5 of 5, sprites 180 of 180
//   surf_kitsune  target case: 28
//
// WHAT THIS PATCH PUTS AT RISK, and why these four maps are still the right
// control even though none was chosen for any of it.
//
// 1. BRUSH ENTITY SOLIDITY MOVED ON 372 MAPS.  func_rotating stops being an
//    unconditional SOLID_BSP and starts testing spawnflag 64; func_clip_vphysics
//    becomes non-solid and invisible; func_reflective_glass, func_monitor and
//    func_physbox_multiplayer become aliases of classes that already existed;
//    and 15 more classnames join the non-solid list.  Any of those could in
//    principle be reached through the catch-all on a map that has one, and
//    ent_census counts what the catch-all did.
//
// 2. THE ENTITY I/O LAYER GREW SIX OUTPUTS AND FOUR INPUTS.  OnStartTouchAll
//    and OnEndTouchAll now fire from the SAME two sites that fire OnStartTouch
//    and OnEndTouch, so a mistake there is a mistake in the existing pair --
//    which is exactly what bhop_arcane's 1122 func_bhop and bhop_canals' 416
//    decals sit downstream of.  Output NAMES are also folded now, so every
//    existing output is matched through a code path that did not exist before.
//
// 3. logic_timer SPAWNS AND THINKS.  A point entity that used to be deleted at
//    load now stays and runs a think.  If any of these four maps has one, the
//    entity count moves and this catches it.
//
// 4. trigger_setspeed SPAWNS.  372 volumes across 94 maps stop being stripped
//    by the trigger_ prefix arm.  None of these four is one of the 94, which is
//    the point: the count must not move on a map that has none.
//
// 5. THE DISPLACEMENT WINDING.  hl2_dispwinding changes collision, not counts,
//    so it cannot show up here -- it is verified separately with pm_dispprobe.
//    What CAN show up is the new census line and the extra index array, so the
//    displacement counts are read on any of these that has displacements.
//
// Defaults are left alone on purpose: this asks whether the SHIPPED
// configuration still holds, and that now includes hl2_dispwinding 1 and
// run_setspeed 1.

log_enable 1
log_dir "logs"
log_name "reg256"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
con_notifylines 0
developer 1
log_developer 1

wait 200

echo ^5=========== surf_rise ===========
map surf_rise
waitmap 1800
waitms 6000
cmd ent_census
waitms 1500

echo ^5=========== bhop_canals ===========
map bhop_canals
waitmap 1800
waitms 6000
cmd ent_census
waitms 1500

echo ^5=========== bhop_arcane ===========
map bhop_arcane
waitmap 1800
waitms 6000
cmd ent_census
waitms 1500

echo ^5=========== surf_kitsune ===========
map surf_kitsune
waitmap 1800
waitms 6000
cmd ent_census
waitms 1500

echo ^5=== reg256 done ===
wait 30
quit
