// FTESurf b58pad -- is the glyph box ATLAS PADDING plus magnification?
//
// WHAT THE LAST RUN SETTLED, and it refuted two hypotheses including my own.
// In Lex's boxbug.png the FPS counter reads "100.0 FPS" on 10px cells.  The '.'
// at x1861-1870 has ink only on its baseline rows, so rows y1095-1101 inside its
// cell are glyph-free; the space at x1881-1890 is a guaranteed-empty control
// because Font_DrawChar returns at :3212 for a space without CON_NONCLEARBG.
// Adjacent cells, identical rows, so the scene gradient cannot explain it:
//
//     '.' cell  28.37     space control  31.44     difference  -3.07
//
// The '.' cell is DARKER than the space.  There is NO full-height quad behind a
// narrow glyph, so the boxes are NOT advance x charheight and the CON_NONCLEARBG
// background quad at :3422/:3662 is dead as an explanation -- along with the
// CON_RICHBSHIFT bit-overlap that would have opened its gate.  The lifted area
// tracks each glyph's BITMAP, and "100.0 FPS" is mostly 0/F/P/S, glyphs that
// nearly fill their cell, which is why they read as boxes at 12x while the '.'
// does not.
//
// SO THE SUSPECT IS THE FOREGROUND QUAD SAMPLING OUTSIDE ITS GLYPH.
// gl_font.c:685 adds atlas padding ONLY when IF_LINEAR.  At r_font_linear 0 --
// which cfg/default.cfg:925 sets deliberately, and which Lex has saved -- glyphs
// are packed with ZERO separation.  His draw chain then magnifies an 8px bake
// (r_2d.c:1300, Font_LoadFont(gl_font.string, 8, ...)) through con_textsize 16,
// hud_scale 2 and r_renderscale 2.  Under magnification the quad's edge texel
// at s1 can land on the neighbouring glyph, and with zero padding the
// neighbouring glyph is ink rather than transparency.
//
// r_font_linear is the ONLY cvar that changes atlas padding, which makes this a
// clean single-variable test -- but it is read at ATLAS BUILD time, so every arm
// that changes it must be followed by vid_restart or the old packing is still
// resident.  That is the trap this config exists to avoid.
//
// THE SCENE IS DELIBERATELY KILLED, unlike b58box.  Lex's saved
// vbsp_lightglow_scale 10 blows the frame to luma 238 at this vantage, and a
// faint fringe is invisible against white.  Sprites and glows off gives a dark,
// flat background -- the best case for seeing the thing being measured.  This is
// a FONT test; the map is only a backdrop.
//
// PASS (packing):  arm B removes or visibly changes the fringe, and C restores it.
// PASS (magnification): D (textsize 8, drawn 1:1) removes it.
// FAIL (neither):  the fringe survives every arm -- then it is in the glyph
//      conversion or the upload, not in packing or scale.
cfg_save_auto 0
exec cfg/testrun/_quiet.cfg
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "b58pad"
scr_sshot_type png
cl_yieldcpu 0
vid_vsync 0
crosshair 0
fov 100
cl_maxfps 100
con_notifylines 0
con_notifytime 0.01

waitms 2500
map surf_tensor2
waitmap 240
waitms 8000
sv_cheats 1
noclip
waitms 500

// His font settings.  The scene, however, is muted so the text is readable.
con_textfont "gfx/fonts/GoogleMed.ttf"
con_textsize 16
hud_scale 2
r_renderscale 2
show_fps 1
vbsp_lightglow_scale 0
vbsp_sprites 0

setpos -10688.5 -1773.8 -8587.1 6.3 91.1 0
waitms 6000

echo "@@@ B58PAD A. r_font_linear 0 -- his setting, zero atlas padding"
r_font_linear 0
vid_restart
waitms 6000
screenshot b58pad_A_x
waitms 900
screenshot b58pad_A
waitms 900
screenshot b58pad_A_ctl
waitms 900

echo "@@@ B58PAD B. r_font_linear 1 -- padding added at :685"
r_font_linear 1
vid_restart
waitms 6000
screenshot b58pad_B_x
waitms 900
screenshot b58pad_B
waitms 900

echo "@@@ B58PAD C. back to 0 -- must match A"
r_font_linear 0
vid_restart
waitms 6000
screenshot b58pad_C_x
waitms 900
screenshot b58pad_C
waitms 900

echo "@@@ B58PAD D. con_textsize 8 -- the bake size, drawn 1:1"
con_textsize 8
waitms 2000
screenshot b58pad_D_x
waitms 900
screenshot b58pad_D
waitms 900
con_textsize 16
waitms 1500

echo "@@@ B58PAD E. hud_scale 1"
hud_scale 1
waitms 2000
screenshot b58pad_E_x
waitms 900
screenshot b58pad_E
waitms 900
hud_scale 2
waitms 1500

echo "@@@ B58PAD F. r_renderscale 1"
r_renderscale 1
waitms 2500
screenshot b58pad_F_x
waitms 900
screenshot b58pad_F
waitms 900
r_renderscale 2
waitms 1500

echo "@@@ B58PAD DONE"
waitms 1200
quit
