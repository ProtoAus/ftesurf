// FTESurf p288a -- WHICH BUCKET is the rainbow backdrop in, and which are the alphas?
//
// Lex: "the alpha rendering order is diffrent locally or server, the rainbow
// backdrop is being rendered in front of all the alphas sometimes."
//
// THE MECHANISM THIS TESTS.  The engine has no depth sort between translucent
// surfaces at all: GLBE_SubmitMeshesSortList (gl_backend.c:6393) walks a plain
// linked list, and gl_model.c:3783-3789 HEAD-INSERTS into mod->batches[sort].
// So draw order inside a bucket is reverse batch-creation order, and order
// BETWEEN buckets is the enum at gl_model.h:36-60:
//
//        SHADER_SORT_BLEND    = 11
//        SHADER_SORT_ADDITIVE = 12      <-- drawn AFTER, i.e. on top, always
//
// A surface in ADDITIVE is therefore painted over every surface in BLEND
// regardless of distance.  "In front of all the alphas" is that sentence.
//
// So the question is one number: what sort does the rainbow material end at,
// and what sort do the alphas end at?  gl_shader.c:6580 prints the FINISHED
// sort for every shader at `developer 1` -- the value after every override,
// not what the VMT asked for.  That census IS the measurement; the pictures
// are only here so a human can confirm the census describes what they see.
//
// PASS (hypothesis confirmed): the rainbow material reports sort 12 while the
//      surfaces it covers report sort 11.
// FAIL: they are in the same bucket.  Then this is an intra-bucket ordering
//      problem -- batch creation order -- and the additive/translucent
//      precedence work in mat_vmt.c is NOT the cause, which is worth knowing
//      before anyone edits it.
//
// Nothing here changes any state that persists.  Read-only run.
cfg_save_auto 0
exec cfg/testrun/_quiet.cfg
developer 1
// log_enable, NOT just log_developer/log_name.  log_enable defaults to "0"
// (common/log.c:11) so a config that sets only the name writes no file at all
// and says nothing about it.  b33a.cfg:35 records losing a run to this already.
log_enable 1
log_developer 1
log_dir "logs"
log_name "p288a"
scr_sshot_type png
cl_yieldcpu 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0

waitms 2500

map surf_kitsune
waitmap 240
waitms 8000
sv_cheats 1

// -------------------------------------------------- the hub
echo "@@@ P288A hub exit (cf. g16_new_hub100, p220_hub100)"
setpos 0 -620 150 0 90 0
waitms 3000
screenshot_mega p288a_hub 1280 720
waitms 800

// -------------------------------------------------- the rainbow corridor
// p220.cfg:67 -- "s1 entry".  p220's own header calls stage 1 "a saturated
// rainbow corridor", so this is the backdrop Lex is describing.
echo "@@@ P288A stage 1 entry -- the rainbow corridor"
setpos -15360 -15252 870 0 270 0
waitms 3000
screenshot_mega p288a_s1 1280 720
waitms 800

echo "@@@ P288A stage 1, oblique -- parallax against whatever it covers"
setpos -15360 -15252 870 0 315 0
waitms 2500
screenshot_mega p288a_s1_oblique 1280 720
waitms 800

echo "@@@ P288A DONE"
waitms 1000
quit
