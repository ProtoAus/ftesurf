cfg_save_auto 0
// PATCH 313 / QC BUILD 62 -- FALSIFIER for the CONSUMER.
//
// Engine Patch 313 publishes *ruleset "<locked> <off> <seq> <breach>".  This
// tests the thing that READS it: SV_RulesetBroken / SV_TimerRuleset and the
// TF_NORULESET bit.  The plan's named falsifier is "QC must taint a run started
// with the ruleset unlocked" -- ARM 2 -- but the two arms that actually decide
// whether this ships are ARM 3 and ARM 4.
//
// HOW THIS IS OBSERVED, because it is the part that constrains the design.  A
// run CANNOT BE FINISHED from a config on a zoned map: zone_goto and setpos both
// route through SV_TimerWarped, which voids the attempt, so SV_TimerFinish never
// runs.  Build 58 lost four launches to that and wrote down the lesson -- add a
// report line instead of chasing the finish.  So SV_RulesetBroken is a PURE
// predicate with no side effect, `cmd timer` prints its live answer as `would`
// beside the latched `noruleset`, and `would 1 / noruleset 0` is exactly the
// state a finish would convert into a taint.  Reading `would` tests the real
// function; a second copy of the rule inside the report would test nothing.
//
// sv_cheats 0 AT THE TOP, deliberately.  The boilerplate `sv_cheats 1` most
// testrun cfgs carry is itself a taint from build 44 on and would erase the
// control.  No setpos anywhere in this file either -- setpos marks `cheated`.

log_enable 1
log_dir logs
log_name p313qc

developer 0
sv_cheats 0
// Wall clock, not frames -- see the long note in p313ruleset.cfg.  `wait N`
// counts FRAMES, and a `map` issued before the engine has finished starting is
// dropped in silence, which then reads as a waitmap hang rather than as a
// dropped command.
waitms 5000

map bhop_eazy
waitmap 45
waitms 4000

// ---------------------------------------------------------------- ARM 1
// CONTROL.  A clean armed run under a locked, conforming ruleset.
//
// PREDICT: class clean, key "1 0 0 0", breachat 0, noruleset 0, would 0.
// FALSIFIED IF: noruleset or would is 1 on a stock install -- the check fires on
//          an honest run and everything below it is worthless.

echo ================================ P313QC ARM 1 -- control, clean run
cmd zone_goto 0
waitms 1500
+forward
waitms 1200
cmd viewpos
cmd timer
waitms 1500
-forward
waitms 500

// ---------------------------------------------------------------- ARM 2
// THE PLAN'S NAMED FALSIFIER: a run STARTED with the ruleset unlocked.
// sv_cheats 1 before the arm, so SV_MovementLocked() is false at SV_TimerStart.
//
// PREDICT: key "0 0 0 0", noruleset 1 -- latched AT THE START, not at a finish.
//          cheat 1 as well, from SV_NoclipWatch's own edge; that is expected and
//          is not what this arm is testing.
// FALSIFIED IF: noruleset 0.  The start call is not reading the key.

echo ================================ P313QC ARM 2 -- armed with the ruleset unlocked
sv_cheats 1
waitms 500
cmd zone_goto 0
waitms 1500
+forward
waitms 1200
cmd viewpos
cmd timer
waitms 1500
-forward
sv_cheats 0
waitms 1000

// ---------------------------------------------------------------- ARM 3
// THE FALSE-POSITIVE ARM, and the reason the engine publishes TWO counters.
// A clean run, then a mover cvar typed at the console with NO cheats -- the lock
// refuses it and reverts inside the same Cvar_Set, so no physics tick ever sees
// the value and the run's physics really WERE the ruleset's.
//
// PREDICT: key seq moves to 1 while breach STAYS 0, and would STAYS 0.
//          i.e. key "1 0 1 0", breachat 0, noruleset 0, would 0.
// FALSIFIED IF: would reads 1.  TF_NORULESET's own essay says the bit means "not
//          provably the ruleset's"; setting it here would state the opposite of
//          what the lock just proved, at a player who mistyped a cvar name.
//          That is the Patch 305 failure mode one layer up and it is the single
//          thing this whole four-field design exists to avoid.

echo ================================ P313QC ARM 3 -- a REFUSED set must not taint
cmd zone_goto 0
waitms 1500
+forward
waitms 1200
sv_airaccelerate 9999
waitms 500
cmd viewpos
cmd timer
waitms 1500
-forward
waitms 500

// ---------------------------------------------------------------- ARM 4
// THE SPAN, END TO END, and the only arm that needs the counter at all.
// A run armed and started CLEAN, then unlock / move / re-lock while the clock
// runs.  At the moment of the report the ruleset is locked again and conforming,
// so every snapshot -- locked, off -- reads exactly like ARM 1's control.
//
// PREDICT: key "1 0 <n> <m>" with locked 1 and off 0, breachat 0 from the clean
//          start, and would 1 because breach moved underneath the run.
//          noruleset stays 0 here: this is the mid-run state, and the latch that
//          converts it is SV_TimerFinish, which a config cannot reach.
// FALSIFIED IF: would reads 0.  Then the breach comparison is inert and a run
//          that left the ruleset mid-flight would rank -- which is the entire
//          hole this patch was written to close, and the reason `off` alone was
//          not enough.

echo ================================ P313QC ARM 4 -- unlock, move, re-lock mid-run
cmd zone_goto 0
waitms 1500
+forward
waitms 1200
sv_cheats 1
waitms 400
sv_airaccelerate 9999
waitms 400
sv_cheats 0
waitms 600
cmd viewpos
cmd timer
waitms 1500
-forward
waitms 500

// ---------------------------------------------------------------- ARM 5
// THE ISOLATION ARM.  ARM 4 proves the counter sees the span, but it does NOT
// prove the counter sees anything TF_CHEAT misses -- sv_cheats was 1 across
// several frames there, so SV_NoclipWatch's edge caught it too and the run came
// back `cheated` anyway.  The claim in TF_NORULESET's essay is stronger than
// that: the watch is an EDGE sampled once per PlayerPostThink
// (sv_player.qc:472, `if (sc) if (!e.run_lastcheats)`), so a toggle that goes 1
// and back to 0 BETWEEN two of them sets no TF_CHEAT at all.
//
// All three commands on ONE LINE, so they run in a single command-buffer flush
// and sv_cheats is never 1 at the instant a PlayerPostThink samples it.
//
// PREDICT: class CLEAN (cheat 0) -- the edge detector sees nothing -- while
//          breach moves and would reads 1.  That is the counter catching a
//          window nothing else in the game can see.
// ACCEPTED ALTERNATIVE, registered before the run: if a tick does land inside
//          the flush the class comes back `cheated` and this arm simply
//          degenerates into ARM 4, proving nothing new.  That is a HARNESS
//          limitation, not a failure of the patch, and it must be reported as
//          "not isolated" rather than quietly dropped.
// FALSIFIED IF: would reads 0 while breach moved.

echo ================================ P313QC ARM 5 -- within-frame toggle, isolated from TF_CHEAT
cmd zone_goto 0
waitms 1500
+forward
waitms 1200
sv_cheats 1; sv_airaccelerate 9999; sv_cheats 0
waitms 600
cmd viewpos
cmd timer
waitms 1500
-forward
waitms 500

echo ================================ P313QC DONE -- movement report for the record
movement
waitms 1000
log_enable 0
waitms 1000
quit
