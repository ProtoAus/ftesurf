cfg_save_auto 0
// EXPERIMENT E1 (Phase 0) -- does StrafePro's OUTPUT STAGE reach the view?
//
// StrafePro (C:\FTESurf-private\Cheats\strafepro) is the first cheat sample in
// this project that is SOURCE rather than a binary, and it occupies a cell the
// plan's threat table does not contain: EXTERNAL (like Turnbind) but CLOSED-LOOP
// (like momentum.dll).  It reads momentum.exe's velocity with ReadProcessMemory
// and steers with SendInput.  Patches 293/311/312 all place their taps around
// the IN-PROCESS mouse path and therefore see nothing of it -- there is no
// in-process hook to see.  Its entire catchability rests on one check:
//
//   INS_RawInput_MouseRead (in_win.c:1913) matches raw->header.hDevice against
//   the enumerated device table and returns at :1917 if it is absent, and the
//   legacy GetCursorPos/SetCursorPos delta path is gated off at in_win.c:1860
//   whenever raw input is live.
//
// THE SAMPLE IS NEVER EXECUTED.  Nothing under C:\FTESurf-private is run by this
// test.  Its output stage is REPRODUCED from its published arithmetic, in a
// harness written for this experiment -- which is the whole reason a source
// sample unblocks E1 where a binary one did not.
//
// WHAT IS ALREADY KNOWN, so this arm is not re-run for nothing.  Patch 306's own
// falsifier (cfg/testrun/p306inj.cfg) measured 200 synthesized moves -> 200
// counted, 50 -> 50, 1,559 genuine reports -> 0 counted, and the P293 identity
// exact on all governed frames throughout.  So "SendInput motion is rejected"
// is MEASURED, not assumed.  Three things about StrafePro are NOT covered by it:
//
//   1. MAGNITUDE.  P306 injected dx = +-3.  StrafePro injects EIGHTY-FOUR counts
//      every 10 ms (derived below).  A +-3 nudge that leaked would be invisible;
//      84 counts at 100 Hz is 92 degrees per second and could not be missed.
//      A defence measured only against a whisper has not been measured.
//   2. THE LEGACY FALLBACK.  in_win.c:1860's `if (!rawmicecount)` is the hole,
//      and it has never been measured.  rawmicecount is legitimately 0 for RDP,
//      for a device that failed to register, and for anyone who simply typed
//      `in_rawinput 0` -- which is CVAR_ARCHIVE, so it sticks.
//   3. WHETHER THE EVIDENCE FILE CAN TELL.  If the injection lands via the
//      legacy path it is journalled as ordinary motion.  That is the question
//      the .hid exists to answer and it has not been asked.
//
// THE INJECTION, derived from strafe_pro.py's own constants so the number is the
// tool's and not one I chose:
//
//   AIR_WISHSPEED 30.0, M_YAW 0.022, INTERVAL_PER_TICK 0.010,
//   POWER_PRESETS[3] = 0.50, GAIN_PRESETS[3] = 0.75   (both at maximum)
//   at speed 350 u/s (an ordinary surf speed, above the 280 u/s gate):
//
//     opt_angle    = degrees(asin(30/350)) * 0.75      = 3.68781 deg
//     mouse_delta  = 3.68781 * (0.010/0.010) / 0.022   = 167.628 counts
//     injection    = round(167.628 * 0.50)             = 84 counts
//
// so: dx = +84, dy = 0, every 10 ms, 200 events per arm = 16,800 counts.
// Sign is held CONSTANT rather than alternating with A/D, because this arm asks
// "does it reach the view", and a monotone answer is readable where a symmetric
// one cancels.  The magnitude and the cadence are StrafePro's exactly.
//
// THE ARMS DIFFER IN ONE CVAR.  Identical injection in B and C; only the input
// path changes.  That is the point -- if B and C differ, the defence is a
// CONFIG rather than a structure, and the ranked-profile check that requires
// in_rawinput 1 (TF_NOPROFILE, QC build 72) is load-bearing rather than tidy.
//
// PRE-REGISTERED, before the harness was run:
//
//   ARM A  in_rawinput 1, NOTHING injected            -> data/e1_A.hid
//          `end` trailer's last two fields read `0 0`, no 'i' record anywhere,
//          and the summed 'v' yaw is 0.  The control that says neither the
//          counter nor the view moves on its own.
//
//   ARM B  in_rawinput 1, 200 x 84 counts injected    -> data/e1_B.hid
//          injected total is 200 (or close -- Windows may coalesce; a shortfall
//          is a reading, not a failure), unenum stays 0, and -- THE ARM --
//          the summed 'v' dx is 0 and the summed 'v' yaw is 0.000.  Sixteen
//          thousand eight hundred counts of steering arrive and the view does
//          not move by one hundredth of a degree.
//
//   ARM C  in_rawinput 0 + in_restart, same injection -> data/e1_C.hid
//          FALSIFIES "injection is structurally dead".  Expect the injected
//          counter to read 0 -- there is nothing to reject, because nothing is
//          being checked -- while the summed 'v' dx is LARGE and non-zero and
//          the yaw moves with it.  The exact count is not predicted: Windows
//          pointer ballistics scale injected relative motion, and the legacy
//          path reads ONE OS-summed delta per accumulate rather than per report
//          (in_win.c:327), so the counts the engine sees are not the counts
//          sent.  What IS predicted exactly, and is the damning half:
//
//              sum(v.yaw)  ==  -0.011 * sum(v.dx)      (sens 0.5 * m_yaw 0.022)
//
//          i.e. the Patch 293 identity HOLDS ON THE INJECTED MOTION.  The
//          evidence file cannot tell it from a hand on a mouse, because by the
//          time the journal sees it, it is the same thing.
//
//   ALL    unenum stays 0 in every arm: nothing is hot-plugged during this test,
//          so a tick there would be the dwType guard leaking and the counter
//          miscounting ordinary input as a device fault.

exec cfg/testrun/_quiet.cfg

developer 1
log_developer 1
log_enable 1
log_dir logs
log_name e1strafe
cl_maxfps 100
cl_idlefps 0
sv_cheats 0
con_notifylines 0
con_notifytime 0.01
r_drawviewmodel 0

// Pin both sides of the identity's constant so the prediction above is exact.
sensitivity 0.5
m_yaw 0.022
m_pitch 0.022
m_filter 0
m_accel 0

wait 200
map bhop_eazy
waitmap 600
waitms 5000

echo ^5=== E1: the raw input state in force
in_rawinput
in_rawinput_keyboard
in_rawinput_nolegacy

echo ^5=== E1 ARM A: control, nothing injected, raw input LIVE
in_journal_begin
waitms 3000
in_journal_note e1-arm-A-control-rawinput-1
waitms 200
in_journal_end data/e1_A.hid
waitms 2000

echo ^5=== E1 ARM B: 200 x 84 counts land in this window, raw input LIVE
in_journal_begin
waitms 4500
in_journal_note e1-arm-B-strafepro-magnitude-rawinput-1
waitms 200
in_journal_end data/e1_B.hid
waitms 2000

echo ^5=== E1 ARM C: raw input OFF -- the legacy path is now the input path
in_rawinput 0
in_restart
waitms 1500
in_rawinput
echo ^5=== E1 ARM C: 200 x 84 counts land in this window, raw input OFF
in_journal_begin
waitms 4500
in_journal_note e1-arm-C-strafepro-magnitude-rawinput-0
waitms 200
in_journal_end data/e1_C.hid
waitms 2000

// ---------------------------------------------------------------------------
// ARM D -- the cvar says 1 and the legacy path is live anyway.
//
// The ranked input profile (QC build 72) publishes `inprof` from
// Rec_InputCvar("in_rawinput", ...) -- the CVAR.  in_win.c only reads that cvar
// inside INS_RawInput_Init, which runs at startup and at in_restart.  So the two
// can be made to disagree, and arm C has already done the first half:
//
//     in_rawinput 0 ; in_restart      -> rawmicecount = 0, legacy path live
//     in_rawinput 1                   -> cvar reads 1, NOTHING re-enumerates
//
// Patch 301 saw this coming and records both -- "the pair that matters is
// `rawinput 1` with `rawmice 0`: the request was granted by the config and
// refused by the hardware" -- but that pair lives in the .hid header on the
// PLAYER'S disk, and `inprof` carries only the cvar.  So the server cannot see
// it, and FS_ProfileBroken reads a clean profile.
//
// PRE-REGISTERED:
//   header reads `rawinput 1` beside `rawmice 0`;
//   the injected counter reads 0, exactly as in arm C -- nothing is checking;
//   the counts reach the view, exactly as in arm C;
//   and `cmd timer` reports inprof with its raw field 1 and noprofile 0, i.e.
//   THE SERVER WOULD RANK THIS RUN.
// Falsified if the header reads `rawmice 2` (the cvar re-enumerates on set, and
// there is no disagreement to exploit) or if the view does not move.
in_rawinput 1
waitms 500
in_rawinput
echo ^5=== E1 ARM D: cvar 1, rawmicecount still 0 -- what does the server see?
cmd timer
waitms 500
in_journal_begin
waitms 4500
in_journal_note e1-arm-D-cvar-says-1-legacy-path-live
waitms 200
in_journal_end data/e1_D.hid
waitms 1500
cmd timer
waitms 500

// Put it back PROPERLY -- the cvar alone does not do it, which is the whole
// point of arm D.  cfg_save_auto 0 means ftesurf.cfg is not rewritten either,
// but belt and braces: in_rawinput is CVAR_ARCHIVE and this is a live install.
in_rawinput 1
in_restart
waitms 1000
in_rawinput

echo ^5=== END OF RUN ===
waitms 1000
quit

// ===========================================================================
// THE HARNESS IS DELIBERATELY NOT IN tools/, on the Patch 306 precedent: a
// ready-made input injector is the one thing this subsystem exists to stop, and
// tools/ ships with the game.  It lives in the session scratchpad and is
// specified well enough here to rebuild in forty lines:
//
//   SendInput with INPUT.type = INPUT_MOUSE, dwFlags = MOUSEEVENTF_MOVE,
//   dx = +84, dy = 0, one event every 10 ms, 200 events per arm, paced on a
//   Stopwatch spin rather than Start-Sleep (whose granularity is ~15 ms and
//   would collapse the cadence into bursts).
//
//   PACING MATTERS IN ARM C AND NOT IN ARM B.  The legacy path recentres the
//   cursor on every accumulate and reads the delta since the last one, so a
//   burst of ten events fired inside one frame is 840 px of travel that clips
//   against the screen edge and undercounts.  One event per frame at 100 fps
//   keeps every delta inside the desktop.  Arm B does not care -- nothing is
//   accumulating anything.
//
//   The window is raised with AttachThreadInput + SetForegroundWindow and focus
//   is RE-CONFIRMED around every burst, not once per arm: Patch 306 run 2
//   recorded AttachThreadInput reporting success and delivering nothing, and
//   run 1 recorded a refused SetForegroundWindow sending 200 events into the
//   PowerShell window (the journal read 0, which was the correct answer and a
//   better control than the arm it replaced).
//
//   The clock is FILE APPEARANCE -- the harness waits for data/e1_A.hid to
//   exist before firing into arm B's window -- because COM_WriteFile is
//   unbuffered and an echo to the log is not.
//
// ===========================================================================
// MEASURED -- C:\FTESurf\ftesurf64.exe of 2026-09-14 15:05, QC build 76.
// Four arms in ONE process, one map load, one session.  sens 0.5 x m_yaw 0.022
// = k 0.011 deg/count, m_filter 0, m_accel 0, recorded in every header.
//
//  arm  cvar  rawmice  sent    REJECTED  counts REACHING  view travel   server
//   A     1      2        0        0            0           0.000 deg   ranks
//   B     1      2     16800     200 ev         2           0.022 deg   ranks
//   C     0      0     16800       0        21,405       -235.455 deg   DEMOTED
//   D     1      0     16800       0        21,089       -231.979 deg   RANKS
//
// ARM B IS THE DEFENCE WORKING, AT StrafePro's OWN MAGNITUDE.  Two hundred
// events carrying 16,800 counts -- 184 degrees of steering at this k -- arrive,
// all 200 are counted as rejected by Patch 306, and the view moves 0.022 deg,
// which is two counts of a real hand twitching on a real mouse.  Patch 306's own
// falsifier established this at dx = +-3; it holds at the magnitude a strafe
// optimiser actually uses.  StrafePro, ported to FTE unchanged, does nothing.
//
// ARM C IS THE SAME INJECTION LANDING IN FULL.  One cvar different.  21,405
// counts reach the view and it rotates 235 degrees.  The run is nonetheless
// demoted: `inprof` reports in_rawinput 0 and SV_TimerProfile latches
// TF_NOPROFILE.  So far the two halves compose and the story is clean --
// the defence is a CONFIG, and the config is enforced.
//
// ARM D IS THE FINDING, AND IT BREAKS THAT STORY.
//
//     in_rawinput 0 ; in_restart     rawmicecount -> 0, legacy path live
//     in_rawinput 1                  cvar reads 1, NOTHING re-enumerates
//
// in_win.c reads that cvar only inside INS_RawInput_Init, which runs at startup
// and at in_restart.  Set it back without one and the two disagree permanently.
// Measured in this state: 21,089 counts reach the view, it rotates 232 degrees,
// the Patch 306 counter reads 0 because nothing is being checked -- and the
// server, asked directly:
//
//     inprof:  key "1 7 1 0 0 1"  badat -1  noprofile 0  would 0
//
// in_rawinput reads 1, m_filter 0, m_accel 0, NOPROFILE 0, WOULD 0.  The run
// ranks.  Rec_ProfileReport (cl_replay.qc:416) publishes Rec_InputCvar
// ("in_rawinput"), i.e. the REQUEST; nothing on the wire carries the GRANT.
//
// THE SIXTH FIELD IS THE ONLY TRACE AND IT IS SPENT BEFORE THE RUN.  `bad` reads
// 1 -- the Patch 313-shaped transition counter caught the excursion to 0.  But
// the server LATCHES it at run start and DIFFERENCES it at the finish, precisely
// so a mistyped cvar is not an accusation.  Do the three commands before
// entering the start zone and start == finish == 1, difference 0, clean.  The
// counter is correct and the bypass simply happens outside its window.
//
// AND THE ENGINE ALREADY KNOWS.  Patch 301 put the grant beside the request for
// exactly this reason -- "the pair that matters is `rawinput 1` with
// `rawmice 0`" -- and tools/hidcheck.py is the only thing in the tree that acts
// on it.  Run against these four files it returns ok / ok / ok / FAIL:
//
//   FAULT  rawinput 1 but rawmice 0 -- raw input was REQUESTED and never
//          granted, so every delta here is an OS-summed, OS-accelerated
//          GetCursorPos delta.  The header's own 'rawinput 1' does not
//          describe this file.
//
// So the fact is computed by the engine, written into the journal, and caught by
// the validator -- and is absent from the one channel that decides whether a run
// ranks.  THE FIX IS ONE FIELD: carry in_rawmice_live in the `inprof` grammar
// beside the cvar, on the existing `have`-mask precedent (in_rawinput is
// registered in in_win.c and nowhere else, so a Linux client has neither), and
// let FS_ProfileBroken read the pair.  That is a QC-side change to a grammar
// written once for both ends (sh_defs.qc:1430) plus an engine-side read of a
// variable Patch 301 already maintains.
//
// NOT A REASON TO KICK.  Same argument as sv_mapcheck: rawmicecount is
// legitimately 0 for RDP, for a device that failed to register, and for anyone
// whose mouse enumerates late.  It is a hole in the CERTIFICATION, not something
// the player did -- so it belongs with TF_NOPROFILE's quiet demotion and must
// never print `cheated` at anybody.
//
// AND THE HALF THAT SHOULD WORRY ANYONE READING THE EVIDENCE FILE: in arms C and
// D the Patch 293 identity is EXACT on all governed frames -- worst per-frame
// residual 1.8e-5 and 1.5e-5 degrees -- and hidcheck reports arm C as `ok`.
// Once the injection is on the legacy path it IS ordinary mouse input by the
// time any tap in this engine sees it, and no cross-check between counts and
// angles can ever separate them, because they agree.  Only the header's
// rawinput/rawmice pair distinguishes the file, and only the header.
//
// WHAT IT DOES NOT SHOW.  Nothing here was executed from C:\FTESurf-private; the
// output stage was reproduced from published constants.  This measures whether
// injected MOTION reaches the view.  It says nothing about injected buttons
// (still accepted on the legacy WM_*BUTTONDOWN path, Patch 307 counts them) or
// injected keys (in_rawinput_keyboard defaults 0), and nothing about a hardware
// replay device, which enumerates as a real mouse and lands in arm A's column.
//
// FOUR RUNS.  Three failed, each in the direction that reads as a clean pass,
// which is this class of test's whole hazard -- Patch 306 recorded the same
// thing and the warning did not stop it happening again.
//
//   RUN 0  The harness's INPUT struct carried two trailing pad ints -- the
//     32-bit idiom -- so it marshalled to 48 bytes where x64 wants 40.  Every
//     SendInput returned 0 with ERROR_INVALID_PARAMETER (87) and nothing was
//     ever synthesized.  Kept as e1r0_A/B/C.hid: all three arms read `0 0` with
//     no 'i' record, which is a three-arm zero control, and arm C's header still
//     read `rawinput 0 / rawmice 0`, which is what proved the cfg's
//     `in_rawinput 0 ; in_restart` lever works before any injection landed.
//
//   RUN 1  Struct fixed, 200/200 accepted -- and the raise failed 20 times out
//     of 20, so every event went to the editor that was in front.  The journals
//     read zero.  THAT IS THE CORRECT ANSWER and it is Patch 306 run 1 again:
//     the counter reports what reached this process, not what happened on the
//     desktop.  Kept as e1r1_*.
//
//   RUN 2  Lex clicked the window.  Arms A/B/C landed: 200 rejected in B against
//     18 counts of genuine hand motion, and 23,513 counts / 258 degrees in C.
//     Kept as e1r2_*.  Arm D did not exist yet.
//
//   RUN 3  Arm D added -- and the harness's file-appearance clock matched the
//     PREVIOUS run's e1_A.hid, still on disk, so all three waits fell through at
//     once and every injection fired during map load.  Arm A, which injects
//     nothing, recorded 57 rejected events; arms B and C recorded none.  The
//     arms were not wrong, they were OFFSET.  Kept as e1r3_*, and it is the one
//     run that shows a stale artifact producing a coherent, wrong story.
//
//   RUN 4  Launcher clears data/e1_?.hid first and the wait requires a file
//     newer than the harness start.  The table above.
//
// THE COMMON SHAPE OF ALL THREE FAILURES: 0 injected, 0 counted, view still --
// which is character-for-character what a working defence produces.  Every one
// of them would have been reported as "StrafePro is structurally dead" by
// anyone who stopped there, and arm D says that conclusion is false.
