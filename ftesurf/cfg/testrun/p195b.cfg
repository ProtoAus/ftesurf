// FTESurf Patch 195b: is the flipbook actually advancing?
//
// p195 proved the plumbing: the generated shader is
//   { program "vmt/animated#COLOR=...#SCROLL=...#ANIMRATE=24.000000"
//     map "$2darray:materials/elly/smokeanimated.vtf" }
// and it compiled and linked with no GLSL error, which is the thing most likely
// to have gone wrong (vmt/animated is the first sampler2DArray in this plugin).
// What it did NOT show is the smoke, because the camera I picked was in the void.
//
// This uses surf_demise's own spawn, which is the viewpoint the Patch 187
// screenshot was taken from and which had the smoke band across the valley.
// Three shots two seconds apart at 24fps is 48 frames of a 331-frame flipbook.
//
// The control matters as much as the shots: at hl2_animated 0 the material still
// SCROLLS (Patch 189), so "the picture changed" alone proves nothing.  The
// off-arm shots are taken the same way, so any difference between the two arms
// is the frames and not the scroll.

cfg_save_auto 0
log_name p195b
developer 0
scr_sshot_type png
cl_yieldcpu 0
waitms 2500

echo "=== P195B: animated ON ==="
hl2_animated 1
map surf_demise
waitmap 180
waitms 10000
setpos -12192 -3920 15128 0 0 0
wait 120
screenshot_mega p195b_on_1 1280 720
waitms 2000
setpos -12192 -3920 15128 0 0 0
wait 5
screenshot_mega p195b_on_2 1280 720
waitms 2000
setpos -12192 -3920 15128 0 0 0
wait 5
screenshot_mega p195b_on_3 1280 720

echo "=== P195B: animated OFF (control -- scroll still runs) ==="
hl2_animated 0
waitms 6000
setpos -12192 -3920 15128 0 0 0
wait 120
screenshot_mega p195b_off_1 1280 720
waitms 2000
setpos -12192 -3920 15128 0 0 0
wait 5
screenshot_mega p195b_off_2 1280 720

echo "=== P195B DONE ==="
waitms 1500
quit
