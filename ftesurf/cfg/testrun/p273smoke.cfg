// Patch 273 -- does it break any other map?
//
// The change is in three places and each has a different blast radius:
//   plugins/hl2/mod_vbsp.c   VBSP only -- so every Source map, and no others
//   engine/client/cl_screen.c  a display line, all formats
//   engine/server/sv_*.c       counters and one command, all formats
//
// The plugin change is the one that can hide geometry, and it has two halves
// that a single map cannot exercise on its own:
//   - the cluster-bucket marking walk, which every VBSP map takes
//   - the per-recursion vis cache, which only a map with a sky_camera exercises
//     at recursion level 1
// so this walks both kinds, plus a Q1 map to show the untouched path still runs.
//
// WHAT TO READ.  For each map: it LOADED (fs: maps/<m>.bsp), the [world] census
// emitted a sane, non-zero mesh count at recurse 0, and the framerate is not
// absurd. A map that draws ZERO world meshes, or one whose recurse-0 count is
// suddenly tiny, is the failure this exists to catch -- that is what culling the
// player's view against the wrong PVS would look like.
//
// developer stays ON here on purpose: this run is about the census lines, not
// about timing, and every timing measurement lives in its own log.

developer 1
log_developer 1
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000
cl_maxfps 0
cl_idlefps 0
cl_yieldcpu 0
sv_cheats 1
r_speeds 2

echo ^5=== 1 surf_tensor2 -- HAS a sky_camera (the map this patch was written on)
map surf_tensor2
waitmap 600
waitms 7000
r_speeds_dump
waitms 800

echo ^5=== 2 surf_666 -- 14 real areas, the areaportal case
map surf_666
waitmap 600
waitms 7000
r_speeds_dump
waitms 800

echo ^5=== 3 surf_utopia
map surf_utopia
waitmap 600
waitms 7000
r_speeds_dump
waitms 800

echo ^5=== 4 surf_spectra -- the cubemap-heavy one
map surf_spectra
waitmap 600
waitms 7000
r_speeds_dump
waitms 800

echo ^5=== 5 surf_garden
map surf_garden
waitmap 600
waitms 7000
r_speeds_dump
waitms 800

echo ^5=== 6 surf_tensor -- NO sky_camera, the control for the whole patch
map surf_tensor
waitmap 600
waitms 7000
r_speeds_dump
waitms 800

echo ^5=== END OF RUN ===
waitms 500
quit
