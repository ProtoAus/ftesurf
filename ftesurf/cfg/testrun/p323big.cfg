// Engine Patch 323 -- the determinism probe again, on a map big enough to
// matter.  Same instrument as cfg/testrun/p322det.cfg, one word different.
//
// WHY A SECOND MAP AT ALL.  bhop_eazy answered the question for bhop_eazy.  It
// is a small map, and the thing under test is the ORDER OF EQUAL-KEY LEAVES in
// the collision tree -- so the map with the most leaves and the most coplanar
// geometry is the one where a residual would still be hiding.  surf_affliction
// is one of the heaviest in the library (832 MB resident on the Pi before
// Patch 298; 493 MB after) and is a surf map, i.e. made of exactly the abutting
// ramp faces and .phy hulls that produce ties.
//
// THREE ARMS, and the second is the one that protects the leaderboard:
//
//   W1  Windows x86-64 / msvcrt, WITH Patch 323
//   P0  Pi aarch64 / glibc, WITHOUT it   <-- the control
//   P1  Pi aarch64 / glibc, WITH it
//
// PREDICTION, registered before any of the three:
//   trace   W1 == P1.  This is the claim the patch exists to make: the tree's
//           shape is now a property of the map and not of the libc.
//   trace   P0 == P1.  This is the claim that matters to players.  glibc's
//           qsort is a merge sort, i.e. already stable, so the order it was
//           producing is the order a stable sort produces -- which means the
//           SERVER'S collision does not move and standing records stand.  The
//           whole physics change lands on the Windows CLIENT, which was the
//           side disagreeing with the server it predicts for.
//   mapcrc  identical on both machines.  It is the control: if the two arms
//           disagree here they were not looking at the same geometry and
//           nothing else in the output means anything.
//   libm / mover  identical, as on bhop_eazy.
//
// FALSIFIED IF: P0 != P1, which would mean the Pi's collision moved and the
//          "records stand" claim is wrong -- most likely because glibc chose
//          its introsort fallback rather than the merge sort on an array this
//          big, which is exactly the case bhop_eazy is too small to test; or
//          W1 != P1, which would mean the sort was not the whole residual and
//          something else in the trace path is still build-dependent.
//
// RESULT, appended after the runs.  The prediction above stands unedited.
//
//   mapcrc  34bd7f78 on both machines -- the control passed.
//   trace   04952f47d2caa12b on ALL FOUR arms, including the unpatched
//           Windows one, which was run afterwards as an extra control.
//   mover   801425979c8d1f6a everywhere; libm 5e749b8a83b44107 everywhere.
//
// SO THE PREMISE OF THIS FILE WAS WRONG, and that is worth more than the arms
// it was written to run.  "The heaviest map has the most ties" is not true:
// surf_affliction produced no disagreement at all, before OR after, so it
// cannot discriminate and never could.  Size is not the property that matters
// -- TIE GEOMETRY is, and bhop_eazy has it while this map does not.  Had this
// been the only map measured, the patch would have read as a no-op and the
// real result (Windows moving onto the Pi's answer on bhop_eazy) would have
// been missed entirely.
//
// What it does still buy, which is not nothing:
//   * a second map on which the two architectures agree after the patch;
//   * evidence the patch is not gratuitous -- it changes results ONLY where the
//     old comparator was genuinely producing a different order, and leaves
//     everything else bit-identical;
//   * the heavy-map cost reading: 6014ms to load before, 6054ms after.
cfg_save_auto 0
log_enable 1
log_dir logs
developer 0

waitms 5000

map surf_affliction
waitmap 120
waitms 4000

echo ================================ P323 -- determinism probe, heavy map
pm_dettest
waitms 6000

echo ================================ P323 done
waitms 500
quit
