cfg_save_auto 0

// ===========================================================================
// BUILD 66.1 -- THE EDITOR'S NEW SHAPE.
//
// Stage A changes four things a screenshot can settle and one it cannot:
//
//   * the list is SEVEN rows, not fifteen -- seven elements were hidden
//   * each row is [ name ][ square ][ reset ], with no 'x' glyph anywhere
//   * a selected element's pane has no `reset pos` row at the bottom
//   * the fixed block is rate/step, xhair/reset all, done -- no `scale`
//
// WHAT THIS RUN CANNOT TEST: the tooltips.  sui only re-hit-tests on mouse
// MOTION (sui_sys.qc:384-420) and no console command moves the cursor, so
// nothing is ever hovered in a scripted run and ui_he_tip is "" in every frame.
// That half is for hands.  Said here rather than left as a silent gap, because
// a green run on this file does not mean the tooltips work.
//
// hud_edit <id> is the hook that opens a pane without a click -- build 65 added
// it for exactly this reason.
//
// PREDICTIONS, registered before the run:
//   * shot 1: seven rows, three boxes each, and an empty toggle box on any
//     element that is switched off
//   * shot 2: the Segments pane open, ending on its last option (Rows kept) and
//     NOT on a reset row
//   * shot 3: `hud_edit mapinfo` refuses in the console and the panel is
//     unchanged from shot 1
//   * the status dump lists fifteen ids with seven marked (unlisted)
//
// FALSIFIED IF: the list still has fifteen rows, or the toggle box is not
// square, or a `reset pos` row appears under the open pane.
// ===========================================================================
log_enable 1
log_dir logs
log_name b66a_editor
developer 1

hud_scale 2
cl_maxfps 250
con_notifylines 0

waitms 5000
map surf_kitsune
waitmap 45
waitms 4000

echo ==== status BEFORE anything, fifteen rows, seven unlisted ====
hud_edit status
waitms 500

echo ==== 1. the list ====
hud_edit on
waitms 800
screenshot
waitms 600
screenshot
waitms 600

echo ==== 2. a pane, and it must not end on a reset row ====
hud_edit seq
waitms 800
screenshot
waitms 600
screenshot
waitms 600

echo ==== 3. a hidden element refuses rather than opening onto nothing ====
hud_edit mapinfo
waitms 600
screenshot
waitms 600
screenshot
waitms 600

echo ==== 4. speed's pane, which has three option rows and a size row ====
hud_edit speed
waitms 800
screenshot
waitms 600
screenshot
waitms 600

echo ==== resetall, then status again ====
hud_edit off
waitms 400
hud_edit resetall
waitms 800
hud_edit status
waitms 500

echo ==== END ====
waitms 800
log_enable 0
waitms 500
quit
