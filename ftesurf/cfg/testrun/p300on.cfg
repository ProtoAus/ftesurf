// FTESurf Patch 300 A/B, arm ON: the fix active, additive materials on
// vmt/unlit, fog4additive.  Set before `map` so the material loader sees it
// when it generates the shader -- it is read at generation time and toggling it
// afterwards does nothing (see the essay in p300shot.cfg).
log_name "p300ab_on"
hl2_additivefog 1
exec cfg/testrun/p300shot.cfg
