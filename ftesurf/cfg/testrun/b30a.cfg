// Build 30 Stage 1 verification -- the save-lock readouts on the PRESS.
//
// WHAT THIS PROVES, and how to read the pictures.
//
// surf_null save001 stores velocity 212.2650 -331.5121 -1411.6719, i.e.
//
//     horizontal |v| = sqrt(212.265^2 + 331.512^2) = 393.6 u/s
//     full  |v|^2     = 2148249, so |v|^2/2g at sv_gravity 800 = 1342.7 units
//
// Before this build a load printed 0.00 for the first of those and dropped the
// second out of `e` entirely, for as long as the load key was held.  So:
//
//   b30a-2-held     hud_debug's `xy` must read ~393.6, NOT 0.00,
//                   and the new `hold` row must read `park`.
//   b30a-3-released after sl_holdoff the SAME numbers must still be on screen.
//                   That is the actual fix: the release used to be where every
//                   number arrived, and is now a no-op on screen.
//
// The `ehist` row is the second fix's handle: it must be 0 or near it right
// after the load (the ring is dropped) and must NOT grow while parked.

waitms 2000

echo ^5=== b30a: build 30 stage 1, save-lock readouts ===

hud_debug 1
hud_energy 1
scr_conalpha 0

map surf_null
waitmap 240
wait 60

echo ^5--- the list the server scanned ---
cmd sl_list
wait 10

// Where we are BEFORE any load, for the contrast: spawned, standing still.
screenshot b30a-1-spawn
wait 20

echo ^5--- load save 1 and hold it, exactly as pressing 2 does ---
// cl_saveloc.qc's SaveLoc_LoadKey sends these two, in this order, on the key
// DOWN edge.  Sending them by hand is the same path with no keyboard.
cmd sl_goto 1
wait 10
cmd sl_load
cmd sl_hold
wait 30

echo ^5--- viewpos + timer while parked ---
viewpos
cmd timer
wait 10

screenshot b30a-2-held
wait 20

echo ^5--- release: the numbers must not change ---
cmd sl_holdoff
wait 20

screenshot b30a-3-released
wait 20

echo ^5=== b30a done ===
wait 30
quit
