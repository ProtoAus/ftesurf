// IMPOSTER01 -- Patch 263, WindowImposter.  The "after" half of an across-run A/B.
//
// A plugin cannot be swapped mid-process and `map x` twice does not reload, so
// the "before" half is the set of artefacts already on disk from the diagnosis
// pass.  Every vantage below is byte-identical to the one that produced them:
//
//   before                                after (this run)          what changed
//   mono04_b_bonus4.png                    imp01_b_bonus4.png        salmon/black
//   mono04_c_bonus4_up.png                 imp01_c_bonus4_up.png     checkerboard
//   mono04_d_bonus4_back.png               imp01_d_bonus4_back.png   -> the mpa45
//   mono04_e_bonus4_side.png               imp01_e_bonus4_side.png      cubemap
//   mono04_a_spawn_yaw270.png              imp01_a_spawn_yaw270.png  UNCHANGED
//
// The spawn shot is the regression check: it is Patch 261's verification vantage
// and this patch must not touch it.
//
// WHAT COUNTS AS A PASS, and why "the checkerboard is gone" is not enough.
// A shader program that fails to compile falls back SILENTLY, and the fallback
// also stops being a checkerboard, so absence of the artefact proves nothing on
// its own.  Two positive checks instead:
//
//   1. COLOUR.  mpa45's six cube faces average #702623..#9E2A1E -- red/orange.
//      Blue means the slab went nodraw and we are seeing sky138a THROUGH it,
//      which is the hl2_imposter 0 behaviour, not this one.
//   2. IT MUST CHANGE WITH YAW.  B, D and E are the same point at yaw 178, 358
//      and 88.  A cubemap sampled by view direction shows a different part of
//      itself at each; a flat fill (missing sampler, failed program) shows the
//      same colour at all three.  This is the check that distinguishes "drawing
//      the cubemap" from "drawing something that is merely not a checkerboard".
//
// r_showshader is the reading that does not depend on eyes: the generated
// material must say `program vmt/imposter` and carry a reflectcube.
//
// setpos does NOT noclip -- noclip ONCE, before the first setpos, never between
// (it is a toggle).  screenshot captures one step BEHIND, so every shot is taken
// twice and only the second of each pair is the real one.

log_enable 1
log_dir "logs"
log_name "imposter01"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
con_notifylines 0
developer 1
log_developer 1

wait 200
map surf_monolith
waitmap 2400
waitms 10000

echo ^5=== resolve counters (expect unchanged from mono04: 0 / 0) ===
hl2_unresolved
hl2_unresolved_visible
waitms 800

echo ^5=== the census lines Patch 263 added (imposter count, unknown classes) ===
hl2_imposter
waitms 500

echo ^5=== THE material.  expect program vmt/imposter + reflectcube mpa45 ===
r_showshader fakeskies/mpa45
waitms 800
r_shaderpasses fakeskies/mpa45
waitms 800

echo ^5=== control: a material this patch does not touch ===
r_showshader surf_minigolf/grid
waitms 800

sv_cheats 1
waitms 300
noclip
waitms 400

echo ^5=== A: spawn room, Patch 261's vantage -- MUST BE UNCHANGED ===
setpos 3856 -13872 13490 0 270 0
waitms 1600
screenshot imp01_a_x
waitms 700
screenshot imp01_a_spawn_yaw270
waitms 700

echo ^5=== B: the user's bonus-4 save, its own angles ===
setpos -10975.05 -5482.11 15936.03 0 178 0
waitms 1600
shader_here b_yaw178
waitms 400
screenshot imp01_b_x
waitms 700
screenshot imp01_b_bonus4
waitms 700

echo ^5=== C: bonus 4, looking UP -- the shot the report was about ===
setpos -10975.05 -5482.11 15936.03 -70 178 0
waitms 1600
screenshot imp01_c_x
waitms 700
screenshot imp01_c_bonus4_up
waitms 700

echo ^5=== D: same point, yaw 358.  must differ from B if it is a cubemap ===
setpos -10975.05 -5482.11 15936.03 0 358 0
waitms 1600
screenshot imp01_d_x
waitms 700
screenshot imp01_d_bonus4_back
waitms 700

echo ^5=== E: same point, yaw 88 ===
setpos -10975.05 -5482.11 15936.03 -20 88 0
waitms 1600
screenshot imp01_e_x
waitms 700
screenshot imp01_e_bonus4_side
waitms 700

echo ^5=== F: straight DOWN at the same point -- the cube's other pole ===
setpos -10975.05 -5482.11 15936.03 70 178 0
waitms 1600
screenshot imp01_f_x
waitms 700
screenshot imp01_f_bonus4_down
waitms 700

echo ^5=== imposter01 done ===
wait 30
quit
