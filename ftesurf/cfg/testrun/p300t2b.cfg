// FTESurf Patch 300 -- verification run 3: does the fix change the SPRITES, and
// by exactly the amount the arithmetic says?
//
// p300t2 proved the sprites left the program-less path (r_fog_progless stopped
// changing anything: B/C agreed to 0.01% of pixels).  p300bor proved that cvar
// is still alive (21.74 meanabs on the boreas clouds, reverting exactly) and
// that Patch 266 is not regressed.  Neither run showed the sprites actually
// getting BETTER, only that they moved.  This one does.
//
// hl2_additivefog is CVAR_SHADERSYSTEM -- "change flushes shaders" (cvar.h:133)
// -- so toggling it re-runs the VMT translator in ONE process.  That matters:
// the pixel noise floor is per-run, and a cross-process A/B would put a 7-18%
// swing underneath a real effect.
//
// ===================================================================
// THE PREDICTION, AND IT IS EXACT, NOT APPROXIMATE.
// ===================================================================
// Per fragment, for the same sprite texel c at the same depth:
//
//   fix OFF (fixed-function, mixes toward the fog colour):
//        out = c*fac + fogcolour*(1 - fac)
//   fix ON  (fog4additive, fades toward black):
//        out = c*fac
//
//   OFF - ON = fogcolour * (1 - fac)
//
// THE c*fac TERM CANCELS EXACTLY.  So the difference between the two arms is
// pure fog colour, and its CHANNEL RATIO is fixed at
//
//        41 : 66 : 90   =   1 : 1.610 : 2.195
//
// INDEPENDENT OF DEPTH, independent of which sprite, independent of how many
// quads overlap, and independent of how bright the glows are.  fac cancels out
// of the ratio even though it varies across the frame.
//
// That is the whole claim, and it is the same instrument that cracked the
// original diagnosis: the residue's channel RATIO, not its magnitude.  Nothing
// else in the renderer can produce a blue-dominant difference in that exact
// proportion -- a brightness or blend change can only scale the sprite's own
// colour, which is near-neutral.
//
//   PASS: (OFF - ON) is POSITIVE on all three channels and its ratio matches
//         1 : 1.61 : 2.20 to within a few percent over the sprite region.
//   FAIL: the ratio is neutral (then it is a brightness change, not fog), or
//         the sign is negative (then the arms are swapped or fac > 1), or the
//         difference is at the noise floor (then the cvar did not flush).
//
// Arm order is ON, OFF, ON so the second ON proves the flush is reversible and
// that nothing drifted.  The tensor2 settle is 25s, because p300t2 showed the
// scene was still converging at 20s and the whole of its arm A measured warm-up.
cfg_save_auto 0
exec cfg/testrun/_quiet.cfg
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "p300t2b"
scr_sshot_type png
cl_yieldcpu 0
vid_vsync 0
crosshair 0
fov 100
con_notifylines 0
con_notifytime 0.01
cl_maxfps 100

// Pin this: ftesurf.cfg currently saves r_fog_progless 0, and with the fix OFF
// the artefact only exists when the program-less fog path is ENABLED.  An arm
// that leaves it at 0 would show no difference and read as "the fix does
// nothing", which is the trap that wasted nine arms of b58box.
r_fog_progless 1
r_fog_linear 1
hl2_additivefog 1

waitms 2500
map surf_tensor2
waitmap 240
waitms 8000
sv_cheats 1
noclip
waitms 500

vbsp_sprites 1
vbsp_lightglow 1
vbsp_lightglow_scale 1
vbsp_sprite_source 1
r_renderscale 2
// show_fps OFF here: it draws a changing string every frame, and this run is
// measuring a channel ratio over the whole frame.
show_fps 0

setpos -10688.5 -1773.8 -8587.1 6.3 91.1 0
waitms 25000

echo "@@@ P300T2B state"
hl2_additivefog
r_fog_progless
r_fog_linear
waitms 1500

echo "@@@ P300T2B A. hl2_additivefog 1 -- the fix, fog4additive"
hl2_additivefog 1
waitms 4000
screenshot p300t2b_A_x
waitms 1200
screenshot p300t2b_A
waitms 1200
screenshot p300t2b_A_ctl
waitms 1200

echo "@@@ P300T2B B. hl2_additivefog 0 -- back to a pass, the artefact returns"
hl2_additivefog 0
waitms 4000
screenshot p300t2b_B_x
waitms 1200
screenshot p300t2b_B
waitms 1200

echo "@@@ P300T2B C. back to 1 -- must match A"
hl2_additivefog 1
waitms 4000
screenshot p300t2b_C_x
waitms 1200
screenshot p300t2b_C
waitms 1200

echo "@@@ P300T2B DONE"
waitms 1200
quit
