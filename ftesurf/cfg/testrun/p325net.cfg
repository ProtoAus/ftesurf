// Engine Patch 325 / QC build 74 -- the gap over a REAL NETWORK.  ARM 3 of 3.
//
// This is the reading the whole build exists to take, and the one arms 1 and 2
// explicitly could not give.
//
//   arm 1 (p325tick.cfg)  offline, no client, no run.  Proved the engine counts
//                         TICKS and not COMMANDS, at three configs the live game
//                         never runs.  Says nothing about a player.
//   arm 2 (p325live.cfg)  a listen server on LOOPBACK -- one process, no network,
//                         no contention, one client, a noclip flight.  Measured a
//                         gap of 1 tick on three of four readings, and its own
//                         header says that is "the easiest possible case... NOT a
//                         measurement of the gap on a real run over a real
//                         network."
//   arm 3 (this file)     a live public lobby, over the router, sharing a box with
//                         eleven other servers.
//
// WHY THE PATH MATTERS AND IS NOT COSMETIC.  The defect is that `time` in
// PlayerPostThink is sv.time, advanced ONCE PER SERVER FRAME, while PostThink
// itself runs ONCE PER PACKET.  Both halves of that are properties of how packets
// arrive and how the frame loop lands -- neither exists on loopback in the form a
// player meets.  A gap measured with no network is a lower bound by construction.
//
// WHAT IS DIFFERENT HERE BESIDES THE WIRE: this is a real server process that is
// not also rendering, at maxclients 32 rather than 1, on an 8-core box running
// twelve of them.  So `sv_cheats` is FALSE -- noclip, setpos and zone_goto are all
// unavailable, which is why this arm has to START THE RUN BY PLAYING: walk, dwell
// on the ground past run_t_dwell (0.25s), and jump inside the start box, which is
// what bhop_eazy's start actually requires.
//
// IT WILL NOT FINISH, AND THAT IS DELIBERATE.  A scripted jump loop does not clear
// a bhop course, so no end zone is crossed, SV_RecClose is never reached (it has
// exactly one call site, at the finish) and NO recording and NO board row are
// created.  This arm therefore writes nothing to the live leaderboard -- which is
// the property that makes it safe to run against a public lobby at all.
//
// PREDICTION, registered before the run:
//   `tick: not latched` before the start, then `counted` climbing with `frz 0`.
//   rate 0.01 (bhop mode), no MISMATCH -- same as arm 2, since the map is the same.
//   THE GAP IS THE MEASUREMENT AND IS NOT PREDICTED.  Arm 2 saw 1 tick on 3 of 4
//   readings with every advantage; the honest expectation here is "at least that,
//   possibly more", and the point is to find out which.  A gap that is LARGER than
//   loopback's confirms the packet/frame quantisation is the cause; a gap that is
//   the same says the defect is floor/rounding and the network adds nothing.
//   Either answer is informative and neither is assumed.
//
// FALSIFIED IF: `rate --/0.01 (no engine value)` (the Pi's engine is not 325, or
//          the field route does not survive the aarch64 build); or `counted` stays
//          0 while the timer is plainly running (the accumulate does not reach a
//          networked client, which loopback could not have shown).
//
// ---------------------------------------------------------------------------
// RUN 1 (build 74) MEASURED THE GAP *AND* FOUND A DEFECT IN THE INSTRUMENT.
//
//   counted/sampled, seven readings:  141/141  415/415  667/667  932/933
//                                     1197/1197  1448/1449  1749/1749
//
// So the gap is 1 tick on two of seven, rate 0.01, no mismatch.  Do NOT read the
// 2-of-7 here against loopback's 3-of-4 as "the network makes it rarer" -- four
// and seven samples cannot support that, and this file does not claim it.
//
// *** AND THE FIRST THING WRITTEN HERE WAS WRONG, ONE RUN TOO EARLY. ***
// This block originally said the gap "is never 2, never negative... that bounds
// the defect".  RUN 2, same script, same map, same lobby, minutes later, measured
// a gap of 2 (counted 1195 sampled 1197).  Eleven readings were not enough to
// assert a bound and the assertion should not have been made.  What the full
// eighteen readings across all three arms actually support is narrower:
//
//   * the gap is 0, 1 or 2 ticks -- observed max 2, and NOT known to be bounded
//     there, because the same claim at max 1 survived exactly one more run;
//   * sampled is ALWAYS >= counted; not one reading in eighteen went the other
//     way.  So the sampled clock has been handing players times that are too
//     LONG, and migrating to the counted clock makes every stored time slightly
//     faster rather than slower;
//   * the frequency is not stable between identical runs (2-of-7 then 6-of-7),
//     so no per-run rate should be quoted as a property of the system.
//
// The direction is the part Stage 2 can lean on.  The magnitude is not settled
// and wants readings from real players, not from this script.
//
// THE DEFECT, in the reading taken BEFORE the run started:
//
//   tick: counted 0 sampled 9033 gap 9033  frz 0  rate --/0.01 (no engine value)
//
// which should have read `not latched`.  run_t_starttick's -1 sentinel exists
// precisely because 0 is a legal counter value, and build 74 wrote that sentinel
// only in SV_TimerArm -- so a player who has never armed held the QC default of 0
// and the report invented a 9033-tick gap for a run that does not exist.  Build 75
// seeds it in SV_TimerIdle, where tearing an attempt down belongs.
//
// RUN 2 PREDICTION (build 75): the first reading reads `tick: not latched`, and
// every reading after the start is unchanged in character -- counted climbing,
// frz 0, rate 0.01, gap 0 or 1.  A `counted 0` before the start would mean the
// seed is not reached on the connect path.
//
// RUN 2 RESULT: `tick: not latched  rate 0.01` -- the seed IS reached on the
// connect path, so the sentinel now means what its essay says from the first
// frame of a life rather than from the first arm.  Note the rate reads 0.01 and
// not `no engine value` this time, which is the three-state report doing its job:
// in run 1 the same reading was taken before the mover had published anything,
// and a two-state check would have called that a MISMATCH on a healthy server.
//
//   142/143  414/415  664/665  929/930  1195/1197  1445/1446  1746/1746
//
// The `gap 0 or 1` half of the prediction FAILED at reading 5 (gap 2), which is
// the correction recorded above.  The fix is confirmed; the bound was not.
cfg_save_auto 0
log_enable 1
log_dir logs
developer 0

waitms 4000
connect play.proto.bar:27540
waitms 12000

echo ================================ P325NET -- connected, before the run
cmd timer
waitms 1500

echo ================================ P325NET -- walk, dwell, jump
+forward
waitms 2500
cmd timer
waitms 500

// Dwell: run_t_dwell is 0.25s, so a full second on the ground qualifies the hop.
-forward
waitms 1200
+jump
waitms 200
-jump
waitms 800

echo ================================ P325NET -- should be running now
cmd timer
waitms 500
+forward
waitms 2000

echo ================================ P325NET -- reading 1
cmd timer
waitms 2500
+jump
waitms 150
-jump
echo ================================ P325NET -- reading 2
cmd timer
waitms 2500
+jump
waitms 150
-jump
echo ================================ P325NET -- reading 3
cmd timer
waitms 2500
echo ================================ P325NET -- reading 4
cmd timer
waitms 2000
-forward
waitms 1000
echo ================================ P325NET -- reading 5 (stopped)
cmd timer
waitms 2000

echo ================================ P325NET done
disconnect
waitms 1000
quit
