cfg_save_auto 0
// Build 64: does the board say WHERE a run set here would go?
//
// THE REPORT: "I set a time on bhop_eazy and it didn't write my time to the
// public leaderboard. I see the fake times you put there, but not my time?"
//
// The run was on a listen server. Lobby_SubmitRun returns at its first gate --
// no lobby_master -- which is the "Ranked = official servers only" decision
// working. Nothing was broken; nothing said so either. Lobby_BoardState now
// publishes one serverinfo word and the scoreboard reads it back.
//
// THE STATE MACHINE IS WALKED IN ONE PROCESS, by moving the three cvars it
// reads. That is the only way to reach "noid" at all: it needs a server that
// has a master AND a key AND no sv_guidkey, which is a misconfiguration nobody
// would deliberately deploy and which is exactly why it must be testable.
//
// lobby_master POINTS AT A DEAD PORT ON PURPOSE (127.0.0.1:1). The state word
// is a function of the cvars being non-empty, not of anything answering, so a
// real directory is not needed -- and pointing a test at the live one would
// put a fake lobby in the players' picker.
//
// PREDICTIONS, registered before the run:
//   ARM A  untouched listen server -> board=local, "times set here stay on
//          this machine". This is the reported case, reproduced.
//   ARM B  lobby_master set, key still empty -> STILL local. A directory
//          without a key cannot rank, and Lobby_SubmitRun's second gate says
//          so; if this reads ranked the two disagree.
//   ARM C  + lobby_master_key -> noid, because a listen server never execs
//          cfg/lobby.cfg and so has no sv_guidkey. The amber fault state.
//   ARM D  + sv_guidkey -> ranked, "this server posts times".
//   ARM E  back to no master -> local again. The latch has to fall as well as
//          rise; a one-way latch would leave a stale "ranked" on screen after
//          an operator unset the master.
//
// FALSIFIED IF: any arm reports board= a word Scores_BoardNote does not
// recognise (printed as "-- no note drawn", which is the client-side half of
// the report and is why status prints BOTH); ARM B reads ranked; ARM E stays
// ranked; or the sentence overlaps the counts line above it in the shots.
//
// wall clock, not frames, before the first `map` -- see p313ruleset.cfg.
log_enable 1
log_dir logs
log_name b64where
waitms 5000

lobby_dir "http://192.168.1.102:8084"
vid_conwidth 1600
vid_conheight 900
hud_scale 2

map bhop_eazy
waitmap 45
waitms 4000

scores open
waitms 800

echo ==== ARM A: untouched listen server (expect board=local) ====
scores status
waitms 300
screenshot
waitms 800

echo ==== ARM B: master set, no key (expect board=local STILL) ====
lobby_master "http://127.0.0.1:1"
waitms 600
scores status
waitms 300
screenshot
waitms 800

echo ==== ARM C: master + key, no guidkey (expect board=noid) ====
lobby_master_key "not-a-real-key"
waitms 600
scores status
waitms 300
screenshot
waitms 800

echo ==== ARM D: + sv_guidkey (expect board=ranked) ====
sv_guidkey "test-guid-salt"
waitms 600
scores status
waitms 300
screenshot
waitms 800

echo ==== ARM D2: the LOCAL tab carries the same sentence ====
scores tab local
waitms 600
scores status
waitms 300
screenshot
waitms 800

echo ==== ARM E: master cleared (expect board=local again) ====
scores tab online
waitms 300
lobby_master ""
waitms 600
scores status
waitms 300
screenshot
waitms 800

echo ==== ARM F: narrow, does the sentence still fit ====
hud_scale 6
waitms 600
scores status
waitms 300
screenshot
waitms 1000

echo ==== done ====
waitms 500
quit
