// FTESurf build 59 -- does vbsp_glare_traces 40 actually restore the sweep rate,
// and does Patch 300 still hold on the OTHER session's -Full binary?
//
// Two questions, one run, because both need surf_tensor2 loaded and the second
// one costs nothing extra (the log carries the [shader] lines either way).
//
// ===================================================================
// QUESTION 1: the glare sweep rate.
// ===================================================================
// Sprite_Glare tests occlusion round-robin on a per-frame RAY budget. Build 58
// made each glare cost 5 rays instead of 1 without raising the budget, so:
//
//     traces  8, 5 rays ->  2 glares/frame -> 429/2  = 215 frames per sweep
//     traces 40, 5 rays ->  8 glares/frame -> 429/8  =  54 frames per sweep
//
// HOW TO SEE A SWEEP RATE IN SCREENSHOTS.  A glare keeps its last answer until
// the round-robin reaches it, so the observable is CONVERGENCE TIME after the
// occlusion relationships all change at once. setpos does that instantly and
// invalidates every glare's answer without touching anything else.
//
// So: converge at A, jump to B, and sample the frame every 100ms. The frame
// stops changing when the sweep completes. Do it twice over the SAME A->B jump,
// once at 40 and once at 8.
//
// PREDICTION, REGISTERED BEFORE THE RUN:
//   at 40: converged within ~54 frames
//   at  8: converged within ~215 frames, i.e. ~4x longer
// The ratio is the claim, not the absolute times -- those depend on the fps this
// machine happens to hit at this vantage, which I am not pinning because
// cl_maxfps 30 failed to pin the FPS counter in an earlier run and pinning it
// here would change the very thing being measured.
//
//   PASS: arm SLOW takes ~4x as many samples to stop changing as arm FAST.
//   FAIL: same convergence time -> the budget is not what gates the sweep and
//         the arithmetic above is wrong.
//
// Arm order is FAST then SLOW deliberately: if it were SLOW first, arm FAST
// would inherit an already-converged state from the tail of the previous arm
// and read as instant for the wrong reason. Each arm re-converges at A first.
//
// ===================================================================
// QUESTION 2: Patch 300 on a binary I did not build.
// ===================================================================
// The other session rebuilt with -Full at 20:46 and their binary carries P300
// from source. I verified P300 on MY build (9A2530A8567E) and must not claim it
// transitively. The log's [shader] lines answer it with no extra arms:
//   REQUIRED: sprites/light_glow03, xen_ray_3 and light_glow02_add_noz all read
//             `prog 1 ... bits0 0x22` -- program bound, ONE|ONE, and NO
//             SBITS_MISC_DEPTHWRITE (0x10000), which is the gl_shader.c guard.
cfg_save_auto 0
exec cfg/testrun/_quiet.cfg
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "b59glare"
scr_sshot_type png
cl_yieldcpu 0
vid_vsync 0
crosshair 0
fov 100
con_notifylines 0
con_notifytime 0.01
cl_maxfps 0

r_fog_progless 1
hl2_additivefog 1

waitms 2500
map surf_tensor2
waitmap 240
waitms 8000
sv_cheats 1
noclip
waitms 500

vbsp_sprites 1
vbsp_lightglow 1
vbsp_lightglow_scale 1
vbsp_sprite_source 1
vbsp_glare 1
vbsp_glare_rays 5
r_renderscale 1
show_fps 1

echo "@@@ B59 state -- vbsp_glare_traces should default to 40 now"
vbsp_glare_traces
vbsp_glare_rays
vbsp_glare_decay
waitms 1500

// ---- vantage A: converge here first ------------------------------------
setpos -10688.5 -1773.8 -8587.1 6.3 91.1 0
waitms 25000

echo "@@@ B59 FAST. vbsp_glare_traces 40, jump A->B"
vbsp_glare_traces 40
waitms 1000
// B: a different room, so every glare's occlusion answer is now stale.
setpos -9900 -1200 -8400 0 200 0
screenshot b59fast_00
waitms 100
screenshot b59fast_01
waitms 100
screenshot b59fast_02
waitms 100
screenshot b59fast_03
waitms 100
screenshot b59fast_04
waitms 100
screenshot b59fast_05
waitms 100
screenshot b59fast_06
waitms 100
screenshot b59fast_07
waitms 100
screenshot b59fast_08
waitms 100
screenshot b59fast_09
waitms 100
screenshot b59fast_10
waitms 100
screenshot b59fast_11
waitms 100
screenshot b59fast_12
waitms 100
screenshot b59fast_13
waitms 100
screenshot b59fast_14
waitms 100
screenshot b59fast_15
waitms 2000

// ---- back to A and re-converge, so the SLOW arm sees the same jump ------
setpos -10688.5 -1773.8 -8587.1 6.3 91.1 0
waitms 8000

echo "@@@ B59 SLOW. vbsp_glare_traces 8 (the build-58 default), same A->B"
vbsp_glare_traces 8
waitms 1000
setpos -9900 -1200 -8400 0 200 0
screenshot b59slow_00
waitms 100
screenshot b59slow_01
waitms 100
screenshot b59slow_02
waitms 100
screenshot b59slow_03
waitms 100
screenshot b59slow_04
waitms 100
screenshot b59slow_05
waitms 100
screenshot b59slow_06
waitms 100
screenshot b59slow_07
waitms 100
screenshot b59slow_08
waitms 100
screenshot b59slow_09
waitms 100
screenshot b59slow_10
waitms 100
screenshot b59slow_11
waitms 100
screenshot b59slow_12
waitms 100
screenshot b59slow_13
waitms 100
screenshot b59slow_14
waitms 100
screenshot b59slow_15
waitms 2000

echo "@@@ B59 DONE"
waitms 1200
quit
