// FTESurf p290d -- do the sprites face the camera now.
//
// The whole difference between vp_parallel and parallel_upright lives in the
// view's PITCH: at pitch 0 the two bases are the same vectors and the two
// pictures are identical.  So every vantage here is tilted, and the flat one is
// included on purpose as a negative control -- if orient 0 and orient 1 differ
// at pitch 0, the change is doing something it should not.
//
// vbsp_sprite_orient overrides at draw time, so this is a live A/B with no map
// reload between the arms: the only thing that differs between two shots is the
// one cvar.  Each vantage shoots the same setting twice first, so the animated
// scene's own noise floor is measured at that exact vantage before anything is
// compared against it.
//
// PASS: at a tilted vantage, 1 vs 0 moves far more than the control, and the
//   flat vantage moves nothing.
cfg_save_auto 0
exec cfg/testrun/_quiet.cfg
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "p290d"
scr_sshot_type png
cl_yieldcpu 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0

waitms 2500
map surf_tensor2
waitmap 240
waitms 8000
sv_cheats 1
noclip
waitms 500

echo "@@@ P290D ---- state ----"
vbsp_sprite_orient
waitms 600
vbsp_sprite_debug 1
waitms 1200

// ---------------------------------------------- V1: corridor, looking up hard
echo "@@@ P290D v1 pitch -40"
setpos 13312 5860 7204 -40 270 0
waitms 2500
vbsp_sprite_orient 1
waitms 1200
screenshot p290d_v1_par
waitms 1000
screenshot p290d_v1_par2
waitms 1000
vbsp_sprite_orient 0
waitms 1200
screenshot p290d_v1_up
waitms 1000

// ---------------------------------------------- V2: spawn, looking up
echo "@@@ P290D v2 pitch -30"
setpos -11684 -12864 13936 -30 0 0
waitms 2200
vbsp_sprite_orient 1
waitms 1200
screenshot p290d_v2_par
waitms 1000
screenshot p290d_v2_par2
waitms 1000
vbsp_sprite_orient 0
waitms 1200
screenshot p290d_v2_up
waitms 1000

// ---------------------------------------------- V3: the negative control
echo "@@@ P290D v3 pitch 0 -- must NOT differ"
setpos -11684 -12864 13936 0 0 0
waitms 2200
vbsp_sprite_orient 1
waitms 1200
screenshot p290d_v3_par
waitms 1000
vbsp_sprite_orient 0
waitms 1200
screenshot p290d_v3_up
waitms 1000

vbsp_sprite_orient 2
waitms 800
echo "@@@ P290D DONE"
waitms 1200
quit
