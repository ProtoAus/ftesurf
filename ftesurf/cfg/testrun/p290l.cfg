// FTESurf p290k -- is hl2_favour_ldr reaching the lump chooser at all.
//
// Evidence so far, all of it offline and none of it depending on the game:
//   * surf_tensor2 ships BOTH bakes, full size -- lump 8 LDR 5,798,390 bytes,
//     lump 53 HDR 5,793,844.
//   * they are genuinely different data: at stride 997 only 0.3% of sampled
//     bytes match, and the per-sample MEDIAN is LDR 0.2523 against HDR 0.1998,
//     so the HDR bake is about 1.26x darker.
//   * with hl2_favour_ldr 1 set before the first map load in a clean process,
//     light_here at save006 read `lightmap block: mean 0.2768` -- IDENTICAL to
//     four decimals to the run with it at 0.
//
// Two lumps that differ in 99.7% of sampled bytes cannot give a bit-identical
// mean on the same surface, so the switch is not switching.  Before saying that
// out loud, this run rules out the boring explanation: that the cvar simply is
// not 1 when the chooser reads it.
//
// "Using lightmap format ..." IS NOT THE INSTRUMENT and that is why the last two
// runs were read wrongly.  It is printed by r_surf.c:4258 from the ATLAS format
// the engine picks (E5BGR9 whenever the samples are HDR-capable), not from which
// BSP lump the plugin decoded.  The instrument is light_here's `lightmap block:
// mean`, which is the value the shader actually samples.
cfg_save_auto 0
exec cfg/testrun/_quiet.cfg
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "p290l"
scr_sshot_type png
cl_yieldcpu 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0

echo "@@@ P290L hl2_favour_ldr BEFORE it is set"
hl2_favour_ldr
waitms 800
hl2_favour_ldr 0
waitms 800
echo "@@@ P290L hl2_favour_ldr AFTER it is set, still before any map"
hl2_favour_ldr
waitms 1200

map surf_tensor2
waitmap 240
waitms 9000

echo "@@@ P290L hl2_favour_ldr AFTER the map load -- did it survive?"
hl2_favour_ldr
waitms 1000
sv_cheats 1
noclip
waitms 500

setpos -10727.2881 10045.7559 -9831.4062 -2.4445 89.8352 0
waitms 3000
hl2_colourcorrection 0
waitms 1000

echo "@@@ P290L light_here -- expect mean 0.2523-ish if LDR loaded, 0.2768 if not"
light_here
waitms 2000
screenshot p290l_hdr
waitms 1500

echo "@@@ P290L DONE"
waitms 1200
quit
