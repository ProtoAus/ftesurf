// cfg_save_auto 0: this run sets archived cvars (vid_*, cl_maxfps); never let it write them into ftesurf.cfg (cl_main.c:2535)
cfg_save_auto 0
// surf_boreas -- the baked .pcf: does the snow FALL, and do the children start.
// Instruments: the developer-1 "emit: psys ... vel ... jit" lines at load (the
// rotation's only headless witness), emit_list (bind + children), r_partinfo
// (its Running-effects list and totals are Con_Printf, so no developer
// needed), and two screenshots per arm with a same-arm pair for the floor.
// con_notifylines 0 for the whole run: every line still reaches the log and
// nothing scrolls through the frame the pixel diff reads.
log_dir  "logs"
log_name "psboreas"
log_enable 1
developer 1
log_developer 1
con_notifylines 0
con_notifytime 0
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000
cl_maxfps 0
cl_idlefps 0
cl_yieldcpu 0
sv_cheats 1
vbsp_emit 1
vbsp_emit_psys 1
// NOT vbsp_emit_psys_children here: a csprogs cvar does not exist until the
// first map loads, so a pre-map set is a silent no-op.  It is set before the
// second load below.  Dust off so the func_dustcloud's 801 frozen motes stay
// out of r_partinfo -- consulted per frame, so the two dust EMITTERS are still
// created and counted at load.
vbsp_emit_dust 0
wait 200
map surf_boreas
waitmap 600
waitms 6000
echo ^5=== 1  bind, children OFF: emit 11 emitters (2 dust + 9 psys); seen 9 created 9 off 0; psys 13 + 7 links
emit_list
waitms 500
developer 0
log_developer 0
noclip
waitms 500
// A: 4000 units BELOW the snow sheet (entity 6249.76 4096.5 7278.99; sheet X +-512 Y +-4096 at Z 7279),
// looking straight up.  The column is open from Z 7279 down to water at Z 29 and solid 500 above the
// sheet (BSP leaf walk, wf/ref_contents.py).  Only snow that FALLS reaches here: 4000 at 384 u/s is
// 10.4 s; the +-384 jitter spreads that.  Build 52's velocity (-384 0 0 world) keeps every flake near
// Z 7279 drifting along -X.
setpos 6249 4096 3279 -89 90 0
waitms 14000
echo ^5=== A  psys on, 4000 below the sheet, after 14 s
r_partinfo
waitms 1000
screenshot psboreas_a1_x
waitms 1000
screenshot psboreas_a1
waitms 1000
screenshot psboreas_a2_x
waitms 1000
screenshot psboreas_a2
waitms 1000
vbsp_emit_psys 0
waitms 17000
echo ^5=== B  same vantage, vbsp_emit_psys 0 (control; every parent has die <= 16)
r_partinfo
waitms 1000
screenshot psboreas_b_x
waitms 1000
screenshot psboreas_b
waitms 1000
vbsp_emit_psys 1
// D: the end zone with children OFF.  tendies_endparticle01 at 9744 12176 725.312 alone is six sparks
// at alpha 0.11.  Camera 1000 south of it facing +Y; open space (leaf walk); floor at about Z -300.
setpos 9744 11176 900 0 90 0
waitms 6000
echo ^5=== D  end zone, children off
r_partinfo
waitms 1000
screenshot psboreas_d_x
waitms 1000
screenshot psboreas_d
waitms 1000
// C: children ON.  Read once in Emit_LoadForMap, so bounce through another map (map x twice does not reload).
vbsp_emit_psys_children 1
developer 1
log_developer 1
map surf_anubis
waitmap 600
waitms 4000
map surf_boreas
waitmap 600
waitms 6000
echo ^5=== 2  bind, children ON: emit 22 emitters (2 dust + 20 psys); created 20; 11 child system(s)
emit_list
waitms 500
developer 0
log_developer 0
noclip
waitms 500
setpos 9744 11176 900 0 90 0
waitms 6000
echo ^5=== C  end zone, children on
r_partinfo
waitms 1000
screenshot psboreas_c_x
waitms 1000
screenshot psboreas_c
waitms 1000
vbsp_emit_psys_children 0
echo ^5=== END ===
waitms 500
quit
