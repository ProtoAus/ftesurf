// V268T -- Patch 268: fullscreen_toggle (F11) is windowed <-> BORDERLESS.
//
// cfg/default.cfg:675 already binds f11 to fullscreen_toggle (Patch 211 added the
// command because `bind f11 fullscreen` had been a silent no-op). What changes here
// is what it DOES: it used to be the same function as vid_toggle, which goes to
// whatever vid_fullscreen names -- so with vid_fullscreen 2 it would drop you into a
// real exclusive mode switch.
//
// INSTRUMENT: the log's mode line.
//   "Setting windowed mode W*H"     internal 0, windowed
//   "Setting fullscreen windowed"   internal 2, borderless
//   "Setting mode W*H bpp hz"       internal 1, exclusive
//
// T1  windowed -> fullscreen_toggle          -> "Setting fullscreen windowed"
// T2  borderless -> fullscreen_toggle        -> "Setting windowed mode"
// T3  vid_fullscreen 2 (exclusive), windowed -> fullscreen_toggle
//        -> MUST still be "Setting fullscreen windowed". This is the whole point:
//           the key never mode-switches the display no matter what the cvar says.
// T4  SAME STATE, vid_toggle instead         -> MUST be "Setting mode ...", exclusive.
//        T3 and T4 start identical and run different commands; if both log the same
//        mode then the split did nothing and this change is a no-op.

log_enable 1
log_dir "logs"
log_name "v268t"
developer 1
log_developer 1
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 0
con_notifytime 0
con_notifylines 0
con_notifytime_error 0

wait 200
echo ^5=== v268t: fullscreen_toggle ===

vid_fullscreen_order 1
vid_exclusive_desktopres 1
vid_winmaximize 1
vid_width 1280
vid_height 800
vid_fullscreen 0
vid_restart
waitms 5000

echo ^5----- T1: windowed -> fullscreen_toggle -> expect BORDERLESS -----
fullscreen_toggle
waitms 5000
screenshot v268t_x
waitms 900
screenshot v268t_1_toggled_borderless
waitms 1200

echo ^5----- T2: borderless -> fullscreen_toggle -> expect WINDOWED -----
fullscreen_toggle
waitms 5000
screenshot v268t_x
waitms 900
screenshot v268t_2_toggled_back
waitms 1200

echo ^5----- T3: vid_fullscreen 2 set, windowed -> fullscreen_toggle -> expect BORDERLESS anyway -----
vid_fullscreen 2
waitms 500
fullscreen_toggle
waitms 5000
screenshot v268t_x
waitms 900
screenshot v268t_3_f11_never_exclusive
waitms 1200

echo ^5----- back to windowed for the control -----
fullscreen_toggle
waitms 5000

echo ^5----- T4: SAME STATE, vid_toggle -> expect EXCLUSIVE -----
vid_toggle
waitms 6000
screenshot v268t_x
waitms 900
screenshot v268t_4_vidtoggle_exclusive
waitms 1200

echo ^5----- restoring -----
vid_fullscreen 1
vid_width 0
vid_height 0
vid_restart
waitms 4000

echo ^5=== v268t done ===
wait 30
quit
