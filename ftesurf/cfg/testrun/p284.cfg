// FTESurf Patch 284 -- does a JOINING client mount the map's dependency pack?
//
// THE CLAIM.  FS_AutoMountForMap had exactly one call site in the engine, inside
// the server's `map` command, so it ran when you started a map yourself and
// never when you connected to someone else's server.  data/mapdeps.txt says
// surf_utopia needs "steam:Team Fortress 2/tf" for its materials, so before this
// patch a joining player got an untextured map even though they own TF2.
//
// THE TEST.  Two connects to the SAME server on the SAME map, one with
// cl_automount 0 and one with 1, reading two engine-published values:
//
//   fs_automount_state   4 = "fs_automount did not run / does not know"
//                        1 = "this map's pack is mounted"
//                        3 = "it names a pack that is not installed"
//   hl2_unresolved       materials the VBSP loader could not find.  This is the
//                        number that becomes untextured surfaces on screen, so
//                        it is the one that actually answers the bug report.
//
// PASS: arm A reports state 4 and a NON-ZERO unresolved count; arm B reports
//       state 1, spec "steam:Team Fortress 2/tf", and unresolved 0.
// FAIL: arm B still reports state 4  -> the stage never ran; check that the
//       server is not this machine (the patch is deliberately inert on a listen
//       server, where `map` already did the mount).
//       Both arms 0 unresolved       -> surf_utopia's TF2 content is already
//       reachable some other way on this machine and the test proves nothing.
//       Pick a map from mapdeps.txt whose game is NOT in fs_addons.txt.
//
// Run:  ftesurf64.exe +exec cfg/testrun/p284.cfg
// The server must already be on surf_utopia:  rcon changelevel surf_utopia
//
// NO /* */ IN A .cfg -- cmd.c only understands //, and a block comment executes
// your prose as commands, silently.  (Learned the hard way; see the memory.)

log_dir logs
log_name p284
log_enable 1

// wait counts FRAMES, not milliseconds, so the frame rate has to be pinned or
// every wait below means something different on a different machine.
cl_maxfps 100

echo "=================================================="
echo "P284 arm A -- cl_automount 0 (today's behaviour)"
echo "=================================================="
set cl_automount 0
connect 192.168.1.102:27500
wait 900
echo "A: map            = $(serverkey map)"
echo "A: automount_state= $fs_automount_state   (expect 4 = did not run)"
echo "A: automount_spec = $fs_automount_spec"
echo "A: hl2_unresolved = $hl2_unresolved       (expect NON-ZERO)"
screenshot
wait 60
disconnect
wait 120

echo "=================================================="
echo "P284 arm B -- cl_automount 1 (the patch)"
echo "=================================================="
set cl_automount 1
connect 192.168.1.102:27500
wait 900
echo "B: map            = $(serverkey map)"
echo "B: automount_state= $fs_automount_state   (expect 1 = pack mounted)"
echo "B: automount_spec = $fs_automount_spec    (expect steam:Team Fortress 2/tf)"
echo "B: hl2_unresolved = $hl2_unresolved       (expect 0)"
screenshot
wait 60
disconnect
wait 120
echo "P284 done -- see ftesurf/logs/p284.log and ftesurf/screenshots/"
quit
