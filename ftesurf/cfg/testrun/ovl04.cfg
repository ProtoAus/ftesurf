// OVL04 -- ORIENTATION.  Counters cannot tell a correct decal from a mirrored
// one; a digit can.
//
// surf_rise paints wall numbers out of overlays/space_numbers_N_w, and it uses
// BOTH of the library's two texture conventions:
//
//     flU=(1,0) flV=(0,1)   #94 '5'   #97 '3'
//     flU=(0,1) flV=(1,0)   #91 '6'   #99 '2'
//
// My derivation says both must come out as upright, correctly-read digits: the
// engine's t axis always agrees with Source's v axis, and its s axis agrees
// with Source's u axis exactly when the overlay is not mirrored -- which for
// these four it is not.  If the derivation is wrong, one of the two families
// will be backwards, and a backwards 5, 3, 6 or 2 is impossible to miss.
//
// #99 is on a CEILING (pitch -90), so it also tests a non-vertical surface.
// setpos takes "x y z pitch yaw roll" and forces noclip itself -- `setang` is
// not a command, which is how the first attempt at this ended up pointing
// wherever the spawn happened to face.

log_enable 1
log_dir "logs"
log_name "ovl04"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
sv_cheats 1
con_notifytime 0

wait 200
map surf_rise
waitmap 1800
waitms 4000
toggleconsole
waitms 300

echo ^5=== #94 '5' -- flU=(1,0) flV=(0,1) ===
setpos 1088 -1362 -672 0 270 0
waitms 700
screenshot ovl04_94_five

echo ^5=== #97 '3' -- flU=(1,0) flV=(0,1) ===
setpos -1632 398 -96 0 270 0
waitms 700
screenshot ovl04_97_three

echo ^5=== #91 '6' -- flU=(0,1) flV=(1,0), the OTHER convention ===
setpos 2862 2944 -768 0 180 0
waitms 700
screenshot ovl04_91_six

echo ^5=== #99 '2' -- flU=(0,1) flV=(1,0), on a ceiling ===
setpos -1968 1968 1470 -90 180 0
waitms 700
screenshot ovl04_99_two

echo ^5=== #93+#94 as a pair, to check left-to-right order ===
setpos 1120 -1362 -560 0 270 0
waitms 700
screenshot ovl04_pair

echo ^5=== ovl04 done ===
wait 30
quit
