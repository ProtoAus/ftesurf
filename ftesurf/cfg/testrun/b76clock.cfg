// Build 76: the run clock is COUNTED now.  Does a whole recording come out the
// other end describing one clock, and does the padding ring still join?
//
// WHAT THIS ARM IS ACTUALLY FOR, because the headline claim is the easy half.
// "SV_TimerTicks returns the mover's tick count" is two lines and a compiler
// checks them.  The part that could ship broken and look fine is the PADDING
// RING: rec_pad_t[] stamps an absolute clock before the run exists and
// SV_RecOpen subtracts the run's origin from it at flush, so the stamp and the
// origin are two sites that must agree about which clock they are on.  Get that
// pair wrong and the first twenty samples of every recording carry
// seconds-since-map-load as negative pre-start time: large, plausible, and
// wrong.  reccheck.py is the falsifier -- it counts the negative-t samples
// against the trailer's `pad` and rejects a non-monotone `t` -- which is why
// this config's real assertion is "0 faults" rather than any number it echoes.
//
// AND THE FREEZE, which is the other half that cannot be checked by reading.
// The old clock stopped by re-deriving its ORIGIN every frozen tick; build 76
// stops by ACCUMULATING the frozen interval into run_t_frzticks and
// run_t_frzsec and having every reader subtract it.  Those are two accumulators
// fed from one delta, in two units, and if they drift the `t` column goes
// backwards across the hold -- which reccheck rejects and which is precisely
// the backwards-join defect build 17 found in the save file.  So this arm holds
// the clock in the middle of the run rather than taking a clean lap.
//
// THREE TRAPS ALREADY PAID FOR ELSEWHERE IN THIS TREE, all of which produce a
// MISSING FILE -- the same symptom a real failure would produce:
//
//   1. `cmd zone_goto 0` ARMS a run; it does not START one.  bhop_eazy starts
//      on a JUMP.  The flight below is continuous +forward under noclip, which
//      crosses the boundary and starts it.
//   2. `rec_enable`/`rec_stream` are registered in worldspawn, so a bare
//      `rec_enable 1` before `map` is `Unknown command` and the default stands.
//      It must be `set`.
//   3. SV_RecClose has exactly ONE call site, at the finish.  There is no
//      abandon path that writes a file, so this has to drive a real finish --
//      and the only way a config can cross an end zone is a noclip flight, so
//      the run lands TF_CHEAT and the file is `cheat.rec`.  That is fine: every
//      line under test is written by SV_RecOpen at the START or by the clock
//      itself, neither of which depends on how the run ended.
//
// The flight is borrowed verbatim from b66rec.cfg/b73hdr.cfg, where it is
// computed from zone_list rather than guessed: start box -352 -352 144, yaw
// 335.3 = atan2(-1376, 2992), ~3293 units on the zones' single z plane.
//
// PREDICTIONS, REGISTERED BEFORE THE RUN.  Written down first because a bound
// asserted after the fact is how build 75's log came to carry a claim that the
// next run falsified.
//
//   P1  Every `cmd timer` during the run ends `ranks counted`.  If it says
//       `sampled`, run_t_clock did not latch -- the engine is not publishing,
//       or SV_TimerStart's latch is not reached -- and everything below is
//       measuring the old clock.
//   P2  data/runs/bhop_eazy/main/cheat.rec exists and its first line is
//       `FTESURF-REC 5`, with `clock counted` and `movetickrate 0.01` in the
//       header.  0.01 and NOT 0.015: bhop_eazy's name prefix selects bhop mode.
//       A file reading 0.015 means the mode override did not take and every
//       time in it is out by 1.5x -- the build 64 defect, which is why
//       reccheck.py compares the two rates and faults.
//   P3  reccheck.py passes it with 0 faults.  This is the padding ring and the
//       freeze accounting, and it is the assertion that matters.
//   P4  The gap between the two clocks stays in 0..2 and sampled >= counted,
//       which is the band eighteen readings on the live fleet supported.  NOT
//       a bound -- the same claim was asserted at max 1 and falsified by the
//       next run -- so a 3 here is a reading to record, not a failure.
//   P5  Across the hold, `counted` does not advance while `sampled` does, and
//       the frz column's two numbers stay consistent with each other
//       (frzticks * 0.01 ~= frzsec, to within one tick).
//
// FALSIFIED IF: the header says 4, or says `sampled`; or reccheck faults on
//          monotonicity or on the pad count (the ring straddled two clocks);
//          or the counted clock advances during the hold (the freeze
//          accumulator is not being fed); or the run's finish time is the
//          sampled number.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name b76clock
developer 0

sv_cheats 0
set rec_enable 1
set rec_stream 1
set rec_runarchive 1

waitms 6000
map bhop_eazy
waitmap 45
waitms 3000

echo ================================ B76CLOCK -- idle, before any run
echo ==== build 75 shipped a defect here: an unlatched run read `counted 0 sampled 9033`
echo ==== expect `tick: not latched`, and `ranks sampled` because run_t_clock is torn down with the attempt
cmd timer
waitms 500

echo ================================ B76CLOCK -- zones, so the flight is computed not guessed
zone_list
waitms 500

echo ================================ B76CLOCK -- arm, aim, and go continuous
cmd zone_goto 0
waitms 1000
setpos -352 -352 144 0 335.3 0
waitms 1000
noclip
waitms 500

+forward
waitms 1500
echo ================================ B76CLOCK -- running: P1 and P4
cmd timer
waitms 1500
cmd timer
waitms 1500

echo ================================ B76CLOCK -- HOLD.  P5: counted must stop, sampled must not.
cmd sl_hold
waitms 500
cmd timer
waitms 2000
cmd timer
waitms 2000
cmd timer
waitms 500
cmd sl_holdoff
waitms 500

echo ================================ B76CLOCK -- thawed; the clock must resume from where it stopped
cmd timer
waitms 1500
cmd timer
waitms 3000
-forward
waitms 1500

echo ================================ B76CLOCK -- after the end zone
cmd timer
waitms 2500

echo ================================ B76CLOCK done -- the file is read by reccheck.py, not by this config
waitms 500
quit
