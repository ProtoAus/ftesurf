// Engine Patch 321 / QC build 73, ACROSS A REAL NETWORK.
//
// WHY THIS EXISTS WHEN p321map.cfg ALREADY PASSED.  That one ran on a listen
// server, where `ours` and `theirs` are read off THE SAME model_t -- so it
// proved the hash is computed and that both infokey subjects work, and it could
// not possibly have proved that two machines agree.  It also cannot produce a
// MISMATCH at all, which is the entire state TF_NOMAP exists for.
//
// Here the server is the NanoPi on aarch64 running its own copy of the BSP, and
// the client is this Windows machine running its own.  Two builds, two
// architectures, two files.
//
//   arm 1   the client's own clean copy of bhop_eazy  -> the two must AGREE
//   arm 2   a byte appended to the client's copy      -> they must DISAGREE
//
// Arm 2 is the falsifier that matters and arm 1 is its control: without arm 1,
// a disagreement in arm 2 could just as easily mean "aarch64 and x86-64 fold
// md4 differently" as "this client has a different map".  With arm 1 passing on
// the identical pair of machines, only the file changed.
//
// sv_mapcheck is 0 on the test server, deliberately -- otherwise arm 2's client
// is DROPPED at prespawn and never reaches `cmd timer`, and the run would
// measure the kick instead of the taint.
//
// PREDICTION, registered before arm 1 was run:
//   arm 1   mapcrc: ours "676de275"  theirs "676de275"  nomap 0  would 0
//   arm 2   mapcrc: ours "676de275"  theirs "<something else>"  nomap 0  would 1
//
// nomap stays 0 in BOTH: the bit is latched at SV_TimerStart and no run is
// started here, which is exactly why the pure predicate is reported as `would`
// beside it.  A `would 1` with `nomap 0` is the state a run start would convert
// into the taint.
//
// FALSIFIED IF: arm 1 disagrees (the two machines do not compute the same hash
//          for the same bytes, and the whole comparison is worthless);
//          or arm 2 agrees (the client did not load the modified file -- check
//          which copy won the search path before believing anything else);
//          or `theirs` is "" in either arm (the client's claim never reached
//          the server, i.e. prespawn does not carry it on this protocol).
cfg_save_auto 0
log_enable 1
log_dir logs
developer 0

name "^3Lex P321"

waitms 5000
connect 192.168.1.102:27599
waitms 22000

echo ================================ P321LIVE -- mapcrc across the wire
cmd timer
waitms 3000

echo ================================ P321LIVE done
disconnect
waitms 1500
quit
