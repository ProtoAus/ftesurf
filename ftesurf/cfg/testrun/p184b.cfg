// P184 fix 2: fs_load adopting an automounted pack must protect it from the drop pass.
//
// FS_Addon_Mount returns TRUE on its dup-skip path, so `fs_load` of a pack fs_automount
// already mounted succeeds, appends the line to fs_addons.txt and reports "auto-remounts
// next launch" -- while the stale fs_automounted[] record still said it was ours to
// throw away.  The next map dropped the game the user had just permanently added.
//
// Expected now: bhop_aberrant needs NO pack, so pre-fix it would drop TF2 and report
// 12 searchpaths.  With the fix FS_AutoUnmountStale sees TF2 in fs_addons.txt, leaves
// it mounted, and aberrant reports 17.
//
// THIS TEST WRITES TO fs_addons.txt.  The runner backs it up and restores it.
fs_loadstats 1
fs_automount 1
fs_autounmount 1
developer 0
waitms 4000
echo "=== P184-B: fs_load-adopted pack must survive the drop pass ==="
echo "--- 1. surf_utopia automounts TF2 ---"
map surf_utopia
waitms 25000
echo "--- 2. user adopts it permanently ---"
fs_load "steam:Team Fortress 2/tf"
waitms 2000
echo "--- 3. bhop_aberrant needs nothing: 17 = kept (fixed), 12 = wrongly dropped ---"
map bhop_aberrant
waitms 25000
echo "=== P184-B DONE ==="
waitms 1000
quit
