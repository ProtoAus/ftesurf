cfg_save_auto 0

// ===========================================================================
// BUILD 67, ARM SET B -- does Patch 315 stay OUT of the soundscape layer?
//
// WHY THIS FILE EXISTS.  b67a_stereo.cfg asserted, in its own header, that
// soundscapes "CANNOT BE AFFECTED BY THIS PATCH AND THAT IS WORTH STATING",
// reasoning that Snds_Frame plays every slot at ATTN_NONE, so dist_mult is 0,
// so snd_al.c:949 makes them srcrel, so the patch's `if (!srcrel)` guard
// excludes them by construction.
//
// THE REASONING WAS RIGHT ABOUT Snds_Frame AND WRONG ABOUT THE CODE.  b67a's
// own log, lines 1247-1248:
//
//     OpenAL: downmixed "ambient/rain_heavy_sc.wav" to mono so it can be positioned
//     OpenAL: downmixed "ambient/sea_breeze.wav" to mono so it can be positioned
//
// Both are surf_tensor2 soundscape samples, and both are stereo.  Snds_Apply
// CREATED each slot with `sound(e, SS_CHAN, wave, 0.01, attn, ...)` -- the
// rule's own attenuation -- and only Snds_Frame's soundupdate, one frame
// later, moved it to ATTN_NONE.  One frame with dist_mult != 0 is all the
// engine needs to decide a source wants positioning, and the mono fold is
// cached per sfx for the rest of the session.
//
// So a one-frame inconsistency that had no audible symptom of its own became a
// permanent stereo->mono downgrade of the layer the user had just described as
// "beautiful".  Build 67 makes the two call sites identical.
//
// THIS IS THE POINT OF A CONTROL THAT ASSERTS SOMETHING YOU BELIEVE IS
// IMPOSSIBLE.  The arm was written to confirm a guard, and it caught a bug in
// a different file instead -- one that no listening test would have found,
// because the loss is stereo width on an ambient bed.
//
// ---------------------------------------------------------------------------
// PRE-REGISTERED, and every figure is a count of DISTINCT SAMPLES (the fold is
// cached per sfx, so 21 emitters sharing a sample give ONE line):
//
//   B1  surf_tensor2, downmix ON
//         EXACTLY 2 downmix lines, and they are:
//             ambient/levels/citadel/field_loop3.wav
//             ambient/levels/canals/dam_water_loop2.wav
//         ZERO lines naming ambient/rain_heavy_sc.wav or ambient/sea_breeze.wav
//         -- those are the regression, and they are stereo, so if the guard
//         leaks they WILL appear exactly as they did in b67a.
//         snd_report must still resolve spawn_outside with its 3 loops.
//
//   B2  the inside point.  Walking between soundscapes allocates NEW slots
//         (spawn_inside adds ambient/atmosphere/indoor2.wav, which is STEREO
//         -- 2ch 11025Hz 8bit, confirmed from hl2_dir.vpk).  b67a never moved,
//         so it never exercised a slot allocated after map load.  Still zero.
//
//   B3  surf_kitsune.  No static ambients and no soundscapes: zero lines, and
//         build 63's entity I/O must still read 28 / 50 / 1.
//
// The run is muted.  Every assertion here is a line count in a log.
// ---------------------------------------------------------------------------
// RESULTS, 2026-09-13.  logs/b67b_scope.log.  csprogs.dat 2831998.
//
// THREE OF THREE.  The guard now holds where b67a proved it did not.
//
//   B1  surf_tensor2 spawn   2 downmix lines, both ambient_generic:
//                              ambient/levels/canals/dam_water_loop2.wav
//                              ambient/levels/citadel/field_loop3.wav
//                            ZERO naming rain_heavy_sc or sea_breeze.   PASS
//                            active: spawn_outside, 3 trace(s)
//                              rain_heavy_sc 0.40 / sea_breeze 0.30 /
//                              water_run1 0.10  -- unchanged from b66a
//                            sound: 30 static, 1 dynamic
//                            here: 0.00x full scale from 0 emitter(s)
//
//   B2  inside (1824u away) active: spawn_inside, 1 trace(s)
//                              indoor2 0.12 / rain_heavy_sc 0.20 /
//                              water_run1 0.05
//                            ZERO further downmix lines.               PASS
//                            ambient/atmosphere/indoor2.wav is STEREO and was
//                            allocated as a NEW slot at this point, which is
//                            the case b67a never reached -- so the guard is
//                            tested at slot-allocation time, not just at map
//                            load.
//
//   B3  surf_kitsune         0 downmix lines, 0 static, 1 dynamic,
//                            50 output(s) wired / 0 delivered -- byte for
//                            byte what b66a reported.                  PASS
//
// "here: 0.00x full scale from 0 emitter(s)" IS NOW A TRUE STATEMENT ABOUT THE
// SPEAKERS.  It always was a true statement about the arithmetic; before Patch
// 315 it was also completely disconnected from what the machine played, which
// is the single most expensive thing this whole sound effort has learned.
// ===========================================================================

log_enable 1
log_dir logs
log_name b67b_scope
developer 1
log_developer 1
cl_maxfps 100
con_notifylines 0

volume 0
bgmvolume 0

vbsp_sound 1
s_al_downmix3d 1

waitms 5000

echo ^5=== B1: surf_tensor2 at spawn -- expect EXACTLY 2 downmix lines, neither a soundscape ===
snd_restart
waitms 1500
map surf_tensor2
waitmap 60
waitms 10000
snd_report
waitms 1500
ent_io
waitms 1500

echo ^5=== B2: step inside -- new slots allocated, indoor2.wav is stereo, still expect none ===
setpos -11776 -11808 13832
waitms 6000
snd_report
waitms 2000

echo ^5=== B3: surf_kitsune -- 0 lines, 28/50/1 intact ===
snd_restart
waitms 1500
map surf_kitsune
waitmap 45
waitms 8000
ent_io
waitms 1500
snd_report
waitms 2500

echo ^5=== END OF RUN ===
quit
