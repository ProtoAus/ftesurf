// FTESurf b58pad2 -- the padding test again, with both instruments fixed.
//
// WHY b58pad's ANSWER WAS NOT AN ANSWER.  Arm B (r_font_linear 1) came back
// PIXEL-IDENTICAL to arm A across the whole measured region: 0 differing pixels,
// mean abs difference 0.000.  That is not a null result, it is a broken test,
// for two independent reasons found afterwards:
//
//  1. THE INSTRUMENT WAS THE WRONG FONT.  I measured the CSQC HUD block at top
//     right because its text is constant across arms.  But the HUD is drawn with
//     a font the QC loads itself, not the engine's console atlas, so
//     r_font_linear -- which only reaches fontplanes (gl_font.c:490) and the
//     console/conchars loads (:1735, :2061) -- cannot change it.  A cvar that
//     cannot reach the instrument will always measure zero.
//  2. vid_restart RELOADS THE MAP.  logs/b58pad.log at 17:28:42 shows
//     PScript_Shutdown and every model "no longer needed" immediately after the
//     arm A echo.  The map reloads and the player RESPAWNS, so the setpos above
//     it was discarded and all three restart arms photographed the spawn, not
//     the vantage the config asked for.  Harmless for a 2D measurement, fatal
//     for anything that thought it was controlling the view.
//
// THE FIX FOR EACH:
//  1. The instrument is the FPS COUNTER, which SCR_DrawFPS draws through
//     font_console (cl_screen.c:2110) -- the atlas r_font_linear does reach.
//     Its problem was that the digits change between arms, which made ink and
//     fringe counts incomparable and put the A-vs-C repeat at 8x the A/A_ctl
//     noise floor. cl_maxfps 30 pins it: the scene is muted, the machine holds
//     30 easily, and every arm reads "30.0 FPS" -- identical glyphs, identical
//     position, so a pixel diff between arms means something.
//  2. setpos is re-issued AFTER every vid_restart, not once at the top.
//
// STILL TRUE FROM THE LAST RUN, and the reason this test exists at all: the
// background quad is dead. In Lex's boxbug.png the '.' cell measured 28.37
// against a space-control of 31.44 -- DARKER by 3.07 -- so no advance x
// charheight quad is drawn behind a narrow glyph, and the lifted area tracks
// each glyph's BITMAP instead.  That points at the foreground quad sampling
// past its glyph, and gl_font.c:685 adds atlas padding ONLY when IF_LINEAR.
//
// CONFOUND I AM NOT PRETENDING AWAY: r_font_linear changes padding AND
// filtering together, so arm B differing from A does not by itself prove which.
// That is what arms D and E are for -- they change magnification only, with
// padding held at Lex's setting.
//
// PASS (packing):       B differs from A, C restores A.
// PASS (magnification): D (drawn at the 8px bake size, 1:1) differs from A.
// FAIL:                 every arm within the A/A_ctl noise floor.
cfg_save_auto 0
exec cfg/testrun/_quiet.cfg
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "b58pad2"
scr_sshot_type png
cl_yieldcpu 0
vid_vsync 0
crosshair 0
fov 100
con_notifylines 0
con_notifytime 0.01

// Pins the counter's glyphs.  Must be low enough that the muted scene always
// holds it, or the digits change and the instrument breaks again.
cl_maxfps 30

waitms 2500
map surf_tensor2
waitmap 240
waitms 8000
sv_cheats 1
noclip
waitms 500

con_textfont "gfx/fonts/GoogleMed.ttf"
con_textsize 16
hud_scale 2
r_renderscale 2
show_fps 1
vbsp_lightglow_scale 0
vbsp_sprites 0
waitms 2000

echo "@@@ B58PAD2 A. r_font_linear 0 -- zero atlas padding"
r_font_linear 0
vid_restart
waitms 7000
sv_cheats 1
noclip
setpos -10688.5 -1773.8 -8587.1 6.3 91.1 0
waitms 4000
screenshot b58p2_A_x
waitms 1200
screenshot b58p2_A
waitms 1200
screenshot b58p2_A_ctl
waitms 1200

echo "@@@ B58PAD2 B. r_font_linear 1 -- padding added at :685"
r_font_linear 1
vid_restart
waitms 7000
sv_cheats 1
noclip
setpos -10688.5 -1773.8 -8587.1 6.3 91.1 0
waitms 4000
screenshot b58p2_B_x
waitms 1200
screenshot b58p2_B
waitms 1200

echo "@@@ B58PAD2 C. back to 0 -- must match A"
r_font_linear 0
vid_restart
waitms 7000
sv_cheats 1
noclip
setpos -10688.5 -1773.8 -8587.1 6.3 91.1 0
waitms 4000
screenshot b58p2_C_x
waitms 1200
screenshot b58p2_C
waitms 1200

// Magnification only, padding held at 0.  No restart, so no reload and no
// respawn -- the view stays exactly where C left it.
echo "@@@ B58PAD2 D. con_textsize 8 -- the bake size, drawn 1:1"
con_textsize 8
waitms 2500
screenshot b58p2_D_x
waitms 1200
screenshot b58p2_D
waitms 1200

echo "@@@ B58PAD2 E. con_textsize 32"
con_textsize 32
waitms 2500
screenshot b58p2_E_x
waitms 1200
screenshot b58p2_E
waitms 1200

con_textsize 16
waitms 2000
echo "@@@ B58PAD2 A2. baseline again -- must match A"
screenshot b58p2_A2_x
waitms 1200
screenshot b58p2_A2
waitms 1200

echo "@@@ B58PAD2 DONE"
waitms 1200
quit
