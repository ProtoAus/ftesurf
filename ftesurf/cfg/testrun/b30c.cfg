// Build 30 Stage 2 verification -- ghost.
//
// WHAT EACH PICTURE HAS TO SHOW.
//
//   b30c-1-body      loaded a mid-surf save and let go.  Ordinary first person:
//                    no stand-in drawn, no `ghost` on the timer line.
//   b30c-2-ghost     `ghost`, one moment later.  The player.iqm stand-in must be
//                    visible AT THE BODY, standing 62 units tall (was 72 in this
//                    file until Patch 278 -- see the note in b30h.cfg), nose pointing
//                    the way the body was aiming.  The timer sub-label must read
//                    `ghost`.  The speedometer must still be reading the BODY --
//                    not zero, and not something derived from the camera.
//   b30c-3-flown     after flying backwards for a second.  The stand-in should
//                    now be some distance away AND HAVE MOVED ITSELF, because
//                    the body is still surfing.  The speedometer still reports it.
//   b30c-4-back      `ghost` again: first person, no stand-in, view restored to
//                    the body's aim.
//
// `ghost status` and `cmd timer` print the numbers behind all of that, including
// the new `ghost` / `ghosted` columns.

waitms 2000

echo ^5=== b30c: build 30 stage 2, ghost ===

hud_debug 1
hud_energy 1
scr_conalpha 0

map surf_kitsune
waitmap 400
wait 60

echo ^5--- put the body on a ramp and let go ---
cmd sl_goto 5
wait 10
cmd sl_load
cmd sl_hold
wait 20
cmd sl_holdoff
waitms 700

echo ^5--- first person, for the contrast ---
cmd timer
ghost status
wait 5
screenshot b30c-1-body
wait 20

echo ^5--- detach ---
ghost
wait 20

echo ^5--- ghost status while detached ---
ghost status
cmd timer
wait 5
screenshot b30c-2-ghost
wait 20

// Fly backwards so the stand-in comes into view.  +back is a real engine
// command, so this drives the same input_movevalues the flight controls read.
echo ^5--- fly back, the body keeps surfing ---
+back
waitms 1100
-back
wait 10

ghost status
wait 5
screenshot b30c-3-flown
wait 20

echo ^5--- re-attach ---
ghost
wait 20
ghost status
cmd timer
wait 5
screenshot b30c-4-back
wait 20

echo ^5=== b30c done ===
wait 30
quit
