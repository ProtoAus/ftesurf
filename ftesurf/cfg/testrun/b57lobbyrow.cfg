// B57LOBBYROW -- five public lobbies in ONE row of the create screen.
//
// WHAT IS UNDER TEST.  Build 57 raised LB_MAX from 3 to 5 and widened the panel
// so five lobby cells fit side by side at 1280 virtual.  Until today only three
// lobbies existed, so a fourth and fifth cell had never been drawn at all and
// the row was unprovable.  All five are live now (27510-27550).
//
// THE ROW IS FETCHED OVER THE NETWORK, SO IT MUST BE WAITED FOR.  Lob_Poll does
// a uri_get of lobby_dir + /lobbies.json and fills the row from the callback, so
// a run that opens the menu and screenshots two seconds later captures an EMPTY
// row -- which looks exactly like the five-cell layout failing.  This file
// waits, prints what arrived, and only then arms the bootcheck.  Measured from
// this PC: https://play.proto.bar/lobbies.json answers with all five.
//
// THE VIRTUAL SCREEN IS THE LEVER, NOT THE WINDOW -- b57menu720.cfg's reason,
// unchanged: ftesurf.cfg pins vid_width/vid_height to 0 (desktop), so +set and
// -width are both beaten, while m_draw lays out against vid_conwidth/conheight.
// The PNG stays physical-sized; that is correct, not a failed run.
//
// 1280x720 is the TIGHT case: build 57's plan measured the create screen with
// 0 px of vertical slack there, so if five cells fit anywhere they must fit here.
cfg_save_auto 0
log_enable 1
log_dir "logs"
log_name "b57lobbyrow"
developer 1
log_developer 1
cl_idlefps 0
cl_maxfps 100
fs_missingwarn 0
con_notifylines 0
sv_port 27600

set ui_bootcheck 0
set ui_bootterms 1

vid_conautoscale 0
vid_conwidth 1280
vid_conheight 720
waitms 1500
echo ^5=== virtual screen now: ===
vid_conwidth
vid_conheight
waitms 500

echo ^5=== the directory this client will poll ===
lobby_dir
waitms 300

togglemenu 1

// Give Lob_Poll time to issue the request AND receive the callback.  A public
// https fetch over the WAN is not instant, and this is the whole reason the
// earlier menu runs could not have proved the row either way.
waitms 6000

// THERE IS NO `lobby_list` COMMAND -- the first draft of this file called one
// and it would have printed "Unknown command" and proved nothing, silently.
// Nothing in src/menu or src/client registers any lobby command at all, and the
// bootcheck said nothing about the row either, so build 57 adds one bootcheck
// line reporting Lob_Ready/Lob_Count and each cell's port.  A COUNT IS WORTH
// MORE THAN MY READING OF A PICTURE: this session already spent four runs
// believing screenshots were 720p when they were 1920x1111.
echo ^5=== b57lobbyrow: expect FIVE lobbies, ports 27510 27520 27530 27540 27550 ===
waitms 800

// Armed LAST: m_draw tests cvar("ui_bootcheck") >= 2 every frame rather than
// latching it at init, so the screen can be set up first.
set ui_bootcheck 2
waitms 3000
