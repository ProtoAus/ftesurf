// B43ANG -- the approach has viewangles now, and the path reaches the end.
//
// Two build-43 fixes, both in cl_watch.qc, both checkable from `replay status`
// without a screenshot.
//
// ---- 1.  THE PRE-START ANGLES ------------------------------------------
//
// THE REPORT: "demos don't have the starting viewangles before they leave the
// start zone, the angle is looking at the direction of the demo when it leaves
// the start zone, and then viewangles play back correctly."
//
// The .view sidecar opens on the TF_RECORDING edge, which IS leaving the start
// zone, so it genuinely has no coverage before t=0.  Watch_Sample clamped the
// sidecar lookup tick to 0 for the whole negative window, which pinned the
// camera to the FIRST RECORDED FRAME's angle across the entire approach.  The
// .rec's own pad has carried real per-tick angles since build 18.
//
// surf_fiellu's pad is 129 samples of someone looking around before the start,
// so it is a loud test rather than a subtle one.  READ FROM THE FILE, and these
// are the numbers `ang` must print (nearest sample, no interpolation -- the
// reader picks a line rather than blending two, deliberately, because yaw wraps):
//
//     t = -1.9034    pitch  -1.4   yaw   -88.6
//     t = -1.6056    pitch  -5.1   yaw   -88.7
//     t = -1.3048    pitch  -5.1   yaw   -88.7
//     t = -1.0052    pitch   7.1   yaw   -83.3
//     t = -0.7039    pitch  45.4   yaw   -65.1
//     t = -0.4036    pitch  46.5   yaw   -91.0
//     t = -0.1049    pitch  52.3   yaw  -132.5
//
// FAIL LOOKS LIKE: all seven identical.  That is build 42, and the value they
// would all share is whatever the run's first rendered frame happened to hold.
// A partial pass -- some varying, some not -- would mean the branch is keyed off
// something other than the sign of the clock.
//
// The very first pad sample is the wrap check: the engine writes v_angle_y in
// whichever range it holds, and that one row says 270.0 where every row after it
// says about -89.  Both are the same angle; `ang` must report the negative form,
// or anything that differences yaw sees a 359.5-degree turn on the first frame.
//
// ---- 2.  THE PATH THAT STOPPED AT THE LAST 10% -------------------------
//
// Watch_BuildCurve's budget ignored its own per-span ceil, so it overran the
// 2048-point table and the overrun was dropped off the END of the run.  Twelve
// of the 58 recordings on disk truncated; this one drew 86.6%.
//
// `path <ctl> ctl -> <curve> curve` is the receipt.  tools/pathcheck.py models
// the same arithmetic outside the game and predicts THIS file at 757 controls
// and 2037 curve points.  So:
//     PASS      ctl 757, curve 2037, and curve is NOT exactly 2048
//     FAIL      curve exactly 2048 -- the cap fired and the tail is missing
//     SUSPECT   curve anywhere else -- the QC and the model disagree, and one
//               of them is wrong; do not accept either until they are made to
//               agree, because pathcheck.py is the gate for every other file.
//
// Single process, single map load.

log_enable 1
log_dir "logs"
log_name "b43ang"
developer 1
log_developer 1
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
sv_cheats 1
fs_missingwarn 0

wait 200
echo ^5=== b43ang: pre-start angles and the drawn path ===

map surf_fiellu
waitmap 1800
waitms 2500

replay data/runs/surf_fiellu/main/0003991_pb.rec
waitms 800
replay pause

echo ^5=== b43ang: the path budget.  Want ctl 757 -> curve 2037, NOT 2048 ===
replay status

echo ^5=== b43ang: the approach, seven points before t=0 ===
echo ^3--- want pitch -1.4  yaw -88.6
replay seek -1.9034
replay status
echo ^3--- want pitch -5.1  yaw -88.7
replay seek -1.6056
replay status
echo ^3--- want pitch -5.1  yaw -88.7
replay seek -1.3048
replay status
echo ^3--- want pitch 7.1  yaw -83.3
replay seek -1.0052
replay status
echo ^3--- want pitch 45.4  yaw -65.1
replay seek -0.7039
replay status
echo ^3--- want pitch 46.5  yaw -91.0
replay seek -0.4036
replay status
echo ^3--- want pitch 52.3  yaw -132.5
replay seek -0.1049
replay status

echo ^5=== b43ang: the first pad sample -- yaw must be about -90, NOT 270 ===
replay seek -999
replay status

echo ^5=== b43ang: and past t=0 the sidecar takes over again, as before ===
replay seek 0.5
replay status
replay seek 20
replay status

echo ^5=== b43ang: done ===
replay stop
waitms 400
quit
