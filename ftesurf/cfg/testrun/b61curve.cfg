// FTESurf build 61 -- THE WHOLE TRADE CURVE, so the operating point is a choice.
//
// WHY THIS RUN.  b61fps settled the mechanism: interleaved four times, interval
// 0.05 measured 653.6 fps against 396.2 at interval 0 (+65%, four paired deltas
// of +227/+262/+289/+252, all the same sign), with the picture unchanged and the
// deadline met.  But +65% at 0.05s is not automatically the right setting,
// because 50 ms is WORSE staleness than what is already shipped:
//
//     build 59, traces 40, no adaptive    11.2 frames @ ~405 fps  = 27.7 ms
//     build 60, traces 40, adaptive 8      3.7 frames @  397 fps  =  9.3 ms
//     build 61, interval 0.05             37.8 frames @  654 fps  = 48-58 ms
//
// Lex approved build 59's 27.7 ms explicitly ("vbsp_glare_traces 40 is the
// fix, do it"), so an interval near 0.025 should reproduce the latency he
// already accepted while keeping most of the framerate.  THAT IS AN
// EXTRAPOLATION FROM 27.1 us A RAY, and the last derived figure I trusted
// without checking (frames per sweep, divided by the wrong denominator) was
// wrong for a whole build and got reported to him.  So: measure the curve.
//
// THE STALENESS IS MEASURED IN MILLISECONDS, FROM THE CENSUS ALONE.  The quota
// is computed as spr_n * frametime / interval, so
//
//     frametime = quota * interval / 429     and    staleness = sweep * frametime
//
// Both terms are printed by the census, both are counted inside the frame loop,
// and neither needs show_fps or its averaging window.  Two samples an arm so
// the quota can be averaged.  show_fps is recorded as well, and if the two
// disagree about the ordering of the arms, no recommendation gets made.
//
// EVERY ARM IS PAIRED AGAINST interval 0, adjacent in time, because b61int's
// interval-0 arms drifted 426.9 -> 369.7 fps over 90 seconds on a warm machine.
// Paired deltas survive that; single numbers do not.
//
// ===================================================================
// PREDICTION, REGISTERED BEFORE THE RUN
// ===================================================================
// From 41.8 rays/frame at interval 0, 5.5 at 0.05, and a ray at 27.1 us, rays
// should scale with the quota and so inversely with the interval:
//
//   interval   expected rays/frame   expected staleness   expected fps
//    0.015           18.3                 15 ms              ~490
//    0.025           11.0                 25 ms              ~560
//    0.05             5.5                 50 ms              ~650
//    0.10             2.8                100 ms              ~690
//
//   PASS: measured staleness is within ~20% of the interval on every arm, and
//         fps is monotonic in the interval.
//   FAIL: any arm reports `stopped by THE RAY CEILING` -- at 0.015 the quota is
//         ~72 visits a frame and the rays it wants may exceed 40, in which case
//         that arm's real staleness is worse than asked and the measured sweep,
//         not the interval, is the truth.  This is the arm most likely to trip
//         it and it is in the run deliberately.
//   FAIL: staleness does not increase monotonically with the interval.
//
// STILL NOT MEASURED, and it decides which row anybody should pick: whether a
// given staleness is VISIBLE while turning.  A static camera converges -- 296
// of the 302 glares in frame are occluded and stay occluded -- so every arm of
// b61int and b61fps was pixel-identical by construction and none of them can
// answer it.  The curve below is a menu, not a recommendation.
cfg_save_auto 0
exec cfg/testrun/_quiet.cfg
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "b61curve"
scr_sshot_type png
cl_yieldcpu 0
vid_vsync 0
crosshair 0
fov 100
con_notifylines 0
con_notifytime 0.01
cl_maxfps 0

r_fog_progless 1
hl2_additivefog 1

waitms 2500
map surf_tensor2
waitmap 240
waitms 8000
sv_cheats 1
noclip
waitms 500

vbsp_sprites 1
vbsp_lightglow 1
vbsp_lightglow_scale 1
vbsp_sprite_source 1
vbsp_glare 1
vbsp_glare_rays 5
vbsp_glare_traces 40
vbsp_glare_cull 1.25
vbsp_glare_brush 2
vbsp_glare_adaptive 8
vbsp_glare_interval 0
r_renderscale 1
show_fps 1

setpos -10688.5 -1773.8 -8587.1 6.3 91.1 0
waitms 30000

echo "@@@ B61C ctl1 interval 0"
vbsp_glare_interval 0
waitms 6000
vbsp_sprite_debug 1
