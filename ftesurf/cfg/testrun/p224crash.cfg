// P224 -- minimal reproducer for the surf_kitsune load crash.
//
// Load the map, sit still, quit.  No setpos, no screenshots, no cvar changes
// beyond logging: the crash lands between "map load complete" and the first
// second or so of play, so everything after that is noise that only makes the
// repro slower and the log harder to read.

cfg_save_auto 0
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "p224crash"
cl_yieldcpu 0
vid_vsync 0
con_notifytime 0

waitms 2500
map surf_kitsune
waitmap 240
waitms 20000
echo "@@@ P224 SURVIVED"
waitms 1000
quit
