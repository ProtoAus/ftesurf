// BUILD 26 stage 1, second pass -- THE ENERGY ANCHOR ROUND TRIP, measured.
//
// The same shape build 25 used for the open segment's `dur`, because it is the
// same class of question and it has the same two far-apart outcomes.
//
// A config cannot read the `e` under the crosshair, but it can read what the
// save WROTE.  So: park the anchor at a known height, save, move far enough to
// trip the 512-unit guard, load, and save again.
//
//   restore WORKS   save002's anchor equals save001's, to four decimals
//   restore FAILS   save002's anchor is the height of wherever the load left
//                   us -- about 293 units higher
//
// WHY THE FIRST setpos IS ONLY 293 UNITS.  The guard fires above 512, so a
// short hop up keeps the anchor at the block we were standing on while making us
// airborne.  That is the state a real mid-flight save is in, and it is what
// makes the anchor worth restoring at all.  The SECOND setpos is deliberately
// ~580 units, past the guard, so the reference is provably destroyed before the
// load is asked to put it back.

developer 1
log_developer 1
cfg_save_auto 0

wait 200
map surf_aesthetic
waitmap 90

echo ""
echo "=== land on the start block: the anchor tracks the ground under us ==="
cmd zone_goto 0
wait 25
viewpos
wait 4
cmd timer
wait 4
echo "--- (must read a GROUND phase) ---"
echo ""

echo "=== 293 units up: airborne, INSIDE the 512 guard, anchor unchanged ==="
setpos -15744 0 1350
wait 20
viewpos
wait 4
echo ""

echo "=== save 1 ==="
cmd sl_save
wait 20
echo ""

echo "=== ~580 units away: PAST the guard.  The anchor is destroyed here. ==="
setpos -15200 200 1100
wait 20
viewpos
wait 4
echo ""

echo "=== load, then save again at once ==="
cmd sl_load
wait 8
cmd sl_save
wait 20
cmd sl_list
wait 6
echo ""

echo "=== the three save-lock commands the panel-down digits send ==="
echo "=== (the KEYS need a human; these are what they resolve to) ==="
cmd sl_first
wait 4
cmd sl_load
wait 6
cmd sl_del
wait 8
cmd sl_list
wait 6
echo ""

echo "=== b26b done -- saves left on disk deliberately ==="
wait 20
quit
