// FTESurf p290g -- the dark brushwork at save006, DIAGNOSTIC ONLY.
//
// Reported as "I placed a save infront of brush work, which for some reason is
// darker then it should be".  The vantage is save006's own, verbatim from
// data/saves/surf_tensor2/save006/state.txt:
//     origin -10727.2881 10045.7559 -9831.4062
//     angles -2.4445 89.8352
//
// Already ruled out offline, so this run is not looking for either: ray-casting
// that view against every submodel bbox hits NOTHING but worldspawn within 4000
// units, so it is not a brush entity; and the nearest faces ahead
// (CONCRETE/CONCRETEWALL007A at ~640 units) carry styles [0,255,255,255] -- one
// lightstyle -- so it is not a lightstyle bug either.
//
// What this run asks, in order of how much it would explain:
//   r_texdiag LM   -- `shift` and `overbright` per model.  A disagreement
//                     between worldspawn and a submodel is a factor of FOUR and
//                     would look exactly like this.
//   r_texdiag LUX  -- the mean luxel actually loaded, so a dark WALL can be told
//                     from a dark LIGHTMAP.
//   hl2_favour_ldr -- the map ships a full LDR bake (lump 8) AND a full HDR one
//                     (lump 53) and is drawing one of them.  If the two look
//                     different, that is the answer and it needs no theory.
//
// AND THE GRADE IS NOW LIVE, which it was not when this was reported.  Both
// arms are shot, because "too dark" measured against a graded frame is not the
// same claim the report made -- tensor2's LUT crushes shadows deliberately.
cfg_save_auto 0
exec cfg/testrun/_quiet.cfg
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "p290g"
scr_sshot_type png
cl_yieldcpu 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0

waitms 2500
map surf_tensor2
waitmap 240
waitms 9000
sv_cheats 1
noclip
waitms 500

setpos -10727.2881 10045.7559 -9831.4062 -2.4445 89.8352 0
waitms 3000

echo "@@@ P290G the vantage, graded (what you see today)"
hl2_colourcorrection 1
waitms 1500
screenshot p290g_graded
waitms 1200

echo "@@@ P290G the vantage, UNGRADED (what was reported)"
hl2_colourcorrection 0
waitms 1500
screenshot p290g_ungraded
waitms 1200

echo "@@@ P290G r_texdiag -- shift/overbright/LUX per model"
r_texdiag 1
waitms 2500
r_texdiag 0
waitms 1000

echo "@@@ P290G what is actually under the crosshair"
shader_here
waitms 1200
light_here
waitms 1200

echo "@@@ P290G hl2_favour_ldr 1 (the LDR bake)"
hl2_favour_ldr 1
waitms 800
map surf_tensor2
waitmap 240
waitms 9000
sv_cheats 1
noclip
waitms 500
setpos -10727.2881 10045.7559 -9831.4062 -2.4445 89.8352 0
waitms 3000
hl2_colourcorrection 0
waitms 1200
screenshot p290g_ldr_ungraded
waitms 1200
r_texdiag 1
waitms 2500
r_texdiag 0
waitms 1000
hl2_favour_ldr 0
waitms 500

echo "@@@ P290G DONE"
waitms 1200
quit
