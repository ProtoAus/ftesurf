// TINT11 -- Patch 240, the other half: does OnJump fire, and is
// "AddOutput basevelocity" implemented?
//
// Build 37 added a STATIC check that reports any output a map wires which
// nothing in the QC ever raises.  On bhop_futile it reported exactly one:
//
//     entity I/O: nothing fires 'OnJump' -- trigger_multiple's outputs on it
//                 are parsed and never run
//
// and, separately, ent_census listed `AddOutput basevelocity` as unimplemented.
// Those two lines ARE the "booster pads don't boost" report, stated by the game
// itself at load.  bhop_futile has six of these pads, each a trigger_multiple:
//
//     OnJump  !activator,AddOutput,basevelocity 0 0 <650..1140>,0,-1
//
// EXPECTED NOW: neither line appears.  OnJump is fired from SV_TriggerIOTouch
// (detected by comparing the pre-move ground state PlayerPreThink stamps against
// the post-move state, so it fires on the exact command the jump happens), and
// AddOutput basevelocity writes .run_basevelocity, which engine Patch 240 feeds
// to pmove.
//
// ent_census prints whatever is STILL unhandled, so it is the assertion: OnJump
// and basevelocity must be absent from it, and everything else must be unchanged.

log_enable 1
log_dir "logs"
log_name "tint11"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
sv_cheats 1

wait 200
echo ^5=== tint11: OnJump + AddOutput basevelocity on bhop_futile ===

map bhop_futile
waitmap 1800
waitms 4000

echo ^5=================== ent_census: what is STILL unhandled ==================
ent_census
waitms 800

echo ^5=========== and the same on surf_rise / bhop_arcane as controls ==========
map surf_rise
waitmap 1800
waitms 3000
ent_census
waitms 800

echo ^5=== tint11 done ===
wait 30
quit
