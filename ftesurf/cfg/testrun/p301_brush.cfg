cfg_save_auto 0
// Fault 4 -- surf_tensor2's func_brush *101 draws darker than CS:S.
//
// WHAT IS ALREADY RULED OUT, offline, from the map files:
//   - the entity is vanilla: rendermode 0, renderamt 255, rendercolor 255 255 255,
//     renderfx 0, and BYTE-IDENTICAL between the CS:S and Momentum builds.
//   - its three materials (concrete/concretewall064d, de_season/metaltrim01,
//     concrete/tunnel_concretewall_01b) are all LightmappedGeneric with surface
//     flags 0x00000000, and all three base textures are DXT1 with NO ALPHA
//     CHANNEL -- so Patch 299's fog*alpha bug cannot be this.
//   - all 31 faces are styles=(0,255,255,255): single-style.  So is the whole
//     map -- 0 multi-style faces in 29796.  No missing switchable light.
//   - lightofs & 3 == 0 on every face: not the Patch 281 misalignment.
//   - the STORED lightmap is not dark.  For concretewall064d (18 of the 31
//     faces) *101 stores [14.77 22.31 27.78] against the world's [8.54 12.80
//     17.07] for the same material -- *101 is 1.73x BRIGHTER in the file.
//
// So it is the draw path, and there is one specific candidate.
// MDLF_NEEDOVERBRIGHT has TWO consumers that must agree:
//   bake:  r_surf.c:67-76  Surf_LightmapShift() bakes luxels DARKER by
//          `shift` = gl_overbright when the flag is set on the model
//   draw:  gl_backend.c:4030-4038 and 4051-4059 multiply e_lmscale back UP by
//          (1<<gl_overbright), gated on curentity->model->engineflags -- and for
//          a func_brush that is the INLINE SUBMODEL, not the world.
// One of the two disagreeing is a factor of four, which r_surf.c:4842-4848 warns
// about in as many words.  mod_vbsp.c:9787 sets the flag on the world model and
// :10103 does `*mod = *wmod`, which ought to carry it -- ought to.
//
// r_texdiag 1 prints, per model, `shift=N overbright=N`.  That is the whole
// test: compare maps/surf_tensor2.bsp against *101:maps/surf_tensor2.bsp.
//
// PRE-REGISTERED:
//   If the two LM lines show the same shift= and the same overbright=, this
//   hypothesis is DEAD and no screenshot below can revive it.
//   B2/B3/B4 sweep gl_overbright live.  B5 MUST reproduce B1 exactly (cross-run
//   noise floor at this vantage measured 0.000% last session, so "exactly" is
//   meant literally).
//   B0 IS THE CONTROL THAT DECIDES WHETHER B2-B4 MEAN ANYTHING.  If the WORLD
//   does not change brightness between gl_overbright 0 and 2, the cvar is
//   latched and inert on a VBSP map, and B2-B4 must be DISCARDED rather than
//   read as "the brush does not respond to overbright".  (Last session
//   r_fullbright was exactly this kind of inert control and nearly got read as
//   a result.)
vid_fullscreen 0
vid_restart
waitms 3000
wait 200

developer 1
log_developer 1
log_enable 1
log_dir logs
log_name p301_brush
cl_maxfps 0
cl_idlefps 0
sv_cheats 1
con_notifylines 0
con_notifytime 0.01
r_drawviewmodel 0

// must be set BEFORE the map loads -- the LM/BAT lines are printed by
// Surf_BuildLightmaps, which runs once at load.
r_texdiag 1

map surf_tensor2
waitmap 600
waitms 9000
waitms 3000
noclip
waitms 1000

// *101 world bounds: X -13105..-8271, Y 9536..11161, Z -10624..-9877
// (model mins/maxs +-2417,+-812.7,+-373.5 about origin -10688 10348.6 -10250.5)
// vstage is Lex's save008: standing 88 units above the slab's top face.
alias vstage "setpos -10751.1777 9562.7969 -9789.3184 -0.0934 89.4342 0; waitms 2500"

echo ^5=== readback
gl_overbright
gl_overbright_all
r_lightmap_format
r_drawentities

echo ^5=== B1: as shipped
vstage
screenshot p301_b1_default

echo ^5=== B2: gl_overbright 0
gl_overbright 0
waitms 2500
vstage
screenshot p301_b2_ob0

echo ^5=== B3: gl_overbright 1
gl_overbright 1
waitms 2500
vstage
screenshot p301_b3_ob1

echo ^5=== B4: gl_overbright 2
gl_overbright 2
waitms 2500
vstage
screenshot p301_b4_ob2

echo ^5=== B5: back to 1 -- repeat control, must equal B1 if B1 was 1
gl_overbright 1
waitms 2500
vstage
screenshot p301_b5_repeat

echo ^5=== B6: gl_overbright_all 1 -- forces the shift for EVERY model
gl_overbright_all 1
waitms 2500
vstage
screenshot p301_b6_oball
gl_overbright_all 0
waitms 2000

// B7 is the isolation mask: r_drawentities 0 removes brush entities AND props,
// so |B7-B1| names every pixel that is not world brush.  *101 is the big slab
// straight ahead; the projected screen box is computed offline to confirm.
echo ^5=== B7: r_drawentities 0 -- isolation mask
r_drawentities 0
waitms 2500
vstage
screenshot p301_b7_noents
r_drawentities 1
waitms 2000

echo ^5=== B8: back to default -- second repeat control
vstage
screenshot p301_b8_repeat2

echo ^5=== END OF RUN ===
waitms 500
quit
