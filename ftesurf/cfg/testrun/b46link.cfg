// B46LINK -- the seven fields the ENGINE finds BY NAME still connect.
//
// ⚠ THIS FILE CANNOT ANSWER ITS OWN QUESTION, AND IS KEPT TO SAY SO.  It ran and
// reported `board: count 0` after five real jumps (`phase: jumps 5`), which by
// the rule written at the bottom of this header is the failure signature -- and
// it is not one.  pm_source.c only touches the board fields when the plane it
// clipped has |normal_z| between PMSRC_MIN_RAMP_NZ (0.1) and standable (0.7),
// i.e. a face you SURF.  bhop_eazy's ground is 1.0, so the branch never runs and
// a perfectly healthy link prints zero here too.  The map was the mistake, not
// the code.
//
// USE b46ramp.cfg INSTEAD -- surf_rise, where walking out of the start box puts
// you on a ramp, and where this same counter went 0 -> 1 with a real plane.
// Kept rather than deleted because a test that reads as a failure for the wrong
// reason is worse than no test, and the next person to reach for a bhop map to
// measure ramp telemetry should find this note first.  The selftest arms below
// are still worth running.
//
// THE ONE PART OF THE fs_ MOVE THAT THE COMPILER CANNOT CHECK.  sv_user.c does
// not include the QC; it asks for seven player fields by STRING through
// GetEdictFieldValue, and a name it cannot find simply returns NULL:
//
//   run_basevelocity   trigger_push / booster carry, handed to the pmove
//   run_forceduck      a save-lock restore forcing the ducked state
//   run_boardnormal    the plane of the last landing, for the board grade
//   run_boardvelocity  the velocity at that landing
//   run_boardcount     how many boards this ride has had
//   run_rampcontact    are we clipping a plane RIGHT NOW
//   run_rampnormal     which plane, for the strafe bar
//
// Rename the QC side alone and everything still COMPILES, everything still
// RUNS, and the strafe bar, the board grade, the booster pads and the save-lock
// duck all quietly stop working with no error anywhere.  That is the whole
// reason this file exists, and why the engine had to be rebuilt and redeployed
// rather than the QC shipped on its own.
//
// THE ASSERTION IS `board: count` MOVING OFF ZERO.  pm_source.c:1158 increments
// pmove.boardcount when a jump lands after enough air time, and sv_user.c is the
// only thing that copies it into QC.  So: walk out, jump repeatedly, and read
// the counter.  Non-zero means the engine resolved run_boardcount by its new
// name -- which it can only do against an engine built from the renamed source.
// Zero after real jumps means the link is broken and the deploy did not happen.
//
// `phase: jumps` IS THE CONTROL AND IT IS NOT THE SAME MEASUREMENT.  That one is
// counted in QC by SV_TimerJumpWatch off velocity_z, so it moves whether or not
// the engine link works.  jumps > 0 with count 0 is the failure this file is
// looking for; both zero just means the jumps never happened and the run says
// nothing either way.

log_enable 1
log_dir "logs"
log_name "b46link"
developer 1
log_developer 1
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 100
vid_fullscreen 0
sv_cheats 0
fs_missingwarn 0

wait 200
map bhop_eazy
waitmap 1800
waitms 2500

echo ^5=== b46link: selftests first ===
pm_selftest
waitms 400
zone_selftest
waitms 400

echo ^5=== b46link: armed, before any jump -- expect count 0 jumps 0 ===
cmd zone_goto 0 16.18 0
waitms 700
cmd viewpos
cmd timer
waitms 800

echo ^5=== b46link: walk out and jump five times ===
+forward
waitms 900
+jump
waitms 200
-jump
waitms 700
+jump
waitms 200
-jump
waitms 700
+jump
waitms 200
-jump
waitms 700
+jump
waitms 200
-jump
waitms 700
+jump
waitms 200
-jump
waitms 900
-forward
waitms 500

echo ^5=== b46link: THE ASSERTION -- board count must be non-zero ===
cmd viewpos
cmd timer
waitms 900

echo ^5=== b46link: done ===
waitms 600
quit
