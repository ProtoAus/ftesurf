// G10 -- the unvised maps, which are the ones VBSP_LoadVisibility was corrupting.
//
// 49 of the 1310 installed maps ship with a ZERO-LENGTH visibility lump (measured by
// decompressing lump 4 of every map): 46 at BSP v20, plus ahop_rainbow, df_cavernish and
// df_map at v25.  Before this fix the loader called GMalloc(0) -- which returns a non-NULL
// pointer to a zero-byte block -- and then byte-swapped `numclusters` through it, reading
// AND WRITING four bytes past the end and then swapping that garbage count times eight more.
// Heap corruption at load time, on 49 maps the user has installed.
//
// So these four maps are the fix's actual test, not a formality.  What must be true now:
//   - they load without crashing or corrupting the heap
//   - they RENDER (no vis must mean everything visible, never nothing)
//   - the log says "unvised" nowhere unexpected and prints no visibility warning, because a
//     zero-length lump is legitimate and is now handled silently rather than complained about
//
// kitsune is here as the regression arm: it is properly vised, so the guard must not have
// changed anything about it.  Its exit-hall numbers from earlier tonight are 261 world
// batches / ~288k indices at 0 -765 133 yaw 90, so a deviation is visible immediately.

cfg_save_auto 0
developer 1
log_developer 0
scr_sshot_type png
cl_yieldcpu 0
cl_maxfps 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0
r_speeds 2
vbsp_portal_render 1
r_portalscissor 1

waitms 2500

// ------------------------------------------------ unvised v25 maps (no VISIBILITY lump)
map df_cavernish
waitmap 240
waitms 7000
echo "@@@ UNVISED df_cavernish v25"
r_speeds_dump
waitms 400
screenshot_mega g10_df_cavernish 1280 720
waitms 600

map df_map
waitmap 240
waitms 7000
echo "@@@ UNVISED df_map v25"
r_speeds_dump
waitms 400
screenshot_mega g10_df_map 1280 720
waitms 600

map ahop_rainbow
waitmap 240
waitms 7000
echo "@@@ UNVISED ahop_rainbow v25"
r_speeds_dump
waitms 400
screenshot_mega g10_ahop_rainbow 1280 720
waitms 600

// ------------------------------------------------------------- an unvised v20 map too
map surf_pure
waitmap 240
waitms 8000
echo "@@@ UNVISED surf_pure v20"
r_speeds_dump
waitms 400
screenshot_mega g10_surf_pure 1280 720
waitms 600

// ------------------------------------------------------ regression: a properly vised map
map surf_kitsune
waitmap 240
waitms 7000
sv_cheats 1
setpos 0 -765 133 0 90 0
waitms 3000
echo "@@@ REGRESSION kitsune exit hall -- expect ~261 world batches / ~288k indices"
r_speeds_dump
waitms 400
screenshot_mega g10_kitsune_regression 1280 720
waitms 600

echo "@@@ G10 DONE"
waitms 800
quit
