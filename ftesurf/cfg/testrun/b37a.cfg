// BUILD 37a -- bhop_arcane: is the platform solid, and does it hold you?
//
// FROM THE MAP'S OWN ENTITY LUMP (LZMA-decompressed; a raw read sees nothing):
//   func_bhop *30         z 14272..14400   target stage1a   solidity 0
//   trigger_teleport *135 z 14272..14336   target stage1a
//   -> the teleport sits INSIDE the block's own lower half.
//   stage1a is at (1472, 0, 14416).
//
// The user's save-lock (data/saves/bhop_arcane/save001) is at
// (1665.03, -1.55, 14507.92) with velocity 0 0 -112: directly above the block.
//
// WHY THE TEST IS SPLIT IN TWO, and this is the trap worth stating.  A working
// func_bhop TELEPORTS YOU if you dwell on it -- that is the entity's whole
// purpose -- and it teleports you to stage1a, which is exactly where falling
// THROUGH it also puts you.  So "drop and read the resting place" cannot tell
// fixed from broken: both answers are stage1a.
//
// sv_bhop_time_limit is what separates them.  At 100 the dwell rule cannot
// fire, so the resting place is a pure solidity question:
//
//   BROKEN (build 36)  fall THROUGH the block into *135  -> rest at ~1472 0 14417
//   FIXED  (build 37)  land on top of the block          -> rest at ~1665 -2 14400
//
// and then at 0.1 (the shipped default, and what all 1122 blocks run on because
// not one of them writes a TimeLimit key) the dwell rule is tested on its own.
//
// The CONSOLE setpos does NOT touch movetype (that is the client-command one at
// sv_user.c:5591), so the player stays in MOVETYPE_WALK and simply falls.  An
// earlier revision of this file issued `noclip` after each setpos and inverted
// every drop: step 3 floated in mid-air and reported the save-lock position back.
//
// developer 0 deliberately: on a VBSP map developer logging costs ~50 s a run,
// and nothing here is a dprint.

log_enable 1
log_dir "logs"
log_name "b37a"
developer 0
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
sv_cheats 1

wait 200
echo ^5=== b37a: bhop_arcane ===

map bhop_arcane
waitmap 900
waitms 2000

echo ^5--- 1. the load report ---
echo ^5(expect "entity I/O: 23 output(s) wired".  arcane's outputs are ESC-separated,
echo ^5 so a comma-only parser would report 0 here rather than 23 -- this line IS the
echo ^5 proof that the ESC path works.  And "func_bhop: 1122 solid platform(s)".)
waitms 600

echo ^5--- 2. what is still unimplemented on this map ---
ent_census
waitms 800

echo ^5--- 3. SOLIDITY. dwell rule disabled, so the block can only hold or not hold. ---
sv_bhop_time_limit 100
setpos 1665.03 -1.55 14507.92
wait 200
echo ^5(expect x~1665 z~14400 = standing ON the block.
echo ^5 x~1472 z~14417 = we fell through it into the teleport.)
viewpos
waitms 800

echo ^5--- 4. and it is not a one-frame catch: still there 4 seconds later ---
wait 400
viewpos
waitms 800

echo ^5--- 5. THE DWELL RULE, on its own. limit back to the shipped 0.1. ---
sv_bhop_time_limit 0.1
setpos 1665.03 -1.55 14507.92
wait 250
echo ^5(expect stage1a, 1472 0 14417: we landed, stood too long, and were sent back.)
viewpos
waitms 800

screenshot b37a_arcane
waitms 800

echo ^5=== b37a done ===
wait 30
quit
