cfg_save_auto 0
// Build 64 STAGE 3: does a finish actually reach the leaderboard?
//
// THIS IS THE CLIENT HALF ONLY.  All it does is join the probe server on the
// Pi; the thing being measured happens over there, in /tmp/b64probe.log.
//
// WHY A PROBE AND NOT A REAL FINISH.  A finish cannot be scripted on a zoned
// map at all: zone_goto and setpos both route through SV_TimerWarped, which
// VOIDS the attempt, so SV_TimerFinish never runs and no config can reach it.
// That is measured, not assumed -- it cost four launches on 2026-09-12.  So
// the server carries `lobby_run_probe`, which submits ONE synthetic run the
// moment a player exists.
//
// IT SUBMITS WITH TF_CHEAT ON PURPOSE.  surfd refuses a cheated run a board
// entirely (204), so the probe CANNOT put a time on a leaderboard however it
// is invoked -- and surfd validates every field BEFORE deciding that, so a 204
// proves the whole request was well formed.  A 400 would name the bad field.
//
// PREDICTIONS, registered before the run:
//   1  the server says `board: probe armed -- waiting for a player to join`
//      while nobody is connected                                    [ALREADY SEEN]
//   2  on connect: `board: submitting bhop_eazy track 0 leg 0 -- 1234 ticks,
//      flags 256`
//   3  the engine trace shows PF_uri_post(.../api/run,<ODD>) while every
//      heartbeat id stays EVEN -- the two streams cannot collide
//   4  the reply routes to the RUN branch, not the heartbeat one:
//      `board: run has no board (practice or cheated) -- not an error`
//   5  the board is UNCHANGED afterwards -- no sixth row anywhere
//
// FALSIFIED IF: the reply prints as `lobby: directory returned 204` (the
// parity branch is not routing, and the heartbeat's status is now poisoned by
// a code it never produced); or the submission prints nothing (a gate is wrong
// -- no key, no directory, or sv_guidkey unset so infokey returned ""); or
// surfd answers 400 (a malformed field, and it will say which); or a row
// appears on any board (the 204 path does not mean what it says).
log_enable 1
log_dir logs
log_name b64submit
waitms 5000

connect 192.168.1.102:27610
waitms 20000

disconnect
waitms 1500
quit
