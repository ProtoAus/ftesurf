// FTESurf build 59 -- the glare sweep rate, second attempt.
//
// WHY THE FIRST ATTEMPT (b59glare.cfg) MEASURED NOTHING, recorded because it
// reported a clean "1.00x" and looked like a refutation:
//
//   1. IT JUMPED THE WRONG WAY. Vantage B (-9900 -1200 -8400) is a small
//      concrete room with about TWO glows in it -- I picked the coordinates
//      blind and did not open the screenshot until after the run. Arriving
//      there, the sweep has almost nothing to re-evaluate on screen, so both
//      arms converged instantly and the ratio was 1.00x for a reason that has
//      nothing to do with the budget. Third time tonight a guessed camera has
//      cost a run; the frame is now inspected first.
//
//   2. THE SAMPLING WINDOW WAS SHORTER THAN THE setpos LAG. Samples at t=0,
//      100 and 200ms were all still the OLD vantage; the view only landed at
//      300-400ms. So the window covered the teleport, not the sweep.
//
// THIS RUN FIXES BOTH, and adds the thing that makes it measurable at all:
//
//   * B -> A, not A -> B. Vantage A is Lex's own worst case, ~50 sprites in
//     view of 429 on the map, so arriving there forces a full re-evaluation
//     with plenty on screen to see it in.
//
//   * cl_maxfps 60. The sweep is counted in FRAMES, so its wall-clock length
//     depends on framerate -- uncapped, the FAST arm finishes in well under one
//     100ms sample and cannot be resolved at all. Pinning 60fps stretches both
//     arms into the sampling window and turns a frame count into a prediction
//     in milliseconds. r_renderscale 1 so 60 is actually reachable here (an
//     earlier run failed to pin 30fps at renderscale 2, where the machine only
//     manages 16.9).
//
//   * 200ms spacing, 24 samples = 4.8s per arm, comfortably past the slow arm.
//
// ===================================================================
// PREDICTION, IN MILLISECONDS, REGISTERED BEFORE THE RUN
// ===================================================================
//   429 glares, 5 rays each, at 60fps:
//     traces 40 -> 8 glares/frame -> 54 frames  -> ~0.90 s  (sample ~4-5)
//     traces  8 -> 2 glares/frame -> 215 frames -> ~3.58 s  (sample ~18)
//   plus ~0.3s of setpos lag on both, equally.
//
//   PASS: SLOW takes ~4x as long as FAST to stop changing.
//   FAIL: equal -> the budget does not gate the sweep and the build-59 comment
//         in cl_main.qc is wrong about why the lag exists.
//
// Arm order FAST then SLOW: reversed, the FAST arm would inherit an already
// converged state from the tail of the slow arm and read as instant for the
// wrong reason.
cfg_save_auto 0
exec cfg/testrun/_quiet.cfg
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "b59glare2"
scr_sshot_type png
cl_yieldcpu 0
vid_vsync 0
crosshair 0
fov 100
con_notifylines 0
con_notifytime 0.01

r_fog_progless 1
hl2_additivefog 1

waitms 2500
map surf_tensor2
waitmap 240
waitms 8000
sv_cheats 1
noclip
waitms 500

vbsp_sprites 1
vbsp_lightglow 1
vbsp_lightglow_scale 1
vbsp_sprite_source 1
vbsp_glare 1
vbsp_glare_rays 5
r_renderscale 1
show_fps 1
cl_maxfps 60

echo "@@@ B59G2 state"
vbsp_glare_traces
cl_maxfps
waitms 1500

// ---------------- FAST: converge at B, jump to A ------------------------
vbsp_glare_traces 40
setpos -9900 -1200 -8400 0 200 0
waitms 12000
echo "@@@ B59G2 FAST. traces 40, jump B->A"
