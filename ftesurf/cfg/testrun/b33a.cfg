// Build 33 -- the gfx_menu audit, checked rather than asserted.
//
// The claim being made to Lex has four parts, and each one has a check here
// that could fail:
//
//   1. The table is right.  23 rows, the two new ones present, Decals now
//      carrying its `*`, and every row's value name still lined up with its
//      value list.  `gfx_menu status` prints the whole thing in one go, which
//      is what a condump can be read against -- the menu itself only shows six
//      rows at a time and would need four screenshots to say the same thing.
//
//   2. THE GREYING IS CONDITIONAL, not decorative.  The three inert rows are
//      driven into and out of their inert state by changing the OTHER cvars
//      they depend on, and the reason text is read back each time.  A grey-out
//      that is always on would pass a single screenshot and fail this.
//
//   3. PERSISTENCE, which is the whole point of the build.  Rows are cycled
//      through the real Gfx_Cycle path (`gfx_menu cycle`, not `seta` typed by
//      hand -- typing seta would test seta, not the menu), then the game quits
//      and ftesurf.cfg is searched for them.  Nineteen of twenty-one rows
//      failed this before build 33, silently, which is exactly why it is here.
//
//   4. hl2_propdist still bites when driven from the menu.  Same method as
//      Patch 193's own sweep (r_speeds 2, opaque batches) so the numbers are
//      comparable to the ones quoted in the row's essay, rather than a new
//      measurement that agrees with nothing.
//
// surf_null on purpose: no HL2 content, so it loads with the plugin idle, and
// it has no sky_camera -- which makes it the map that proves the 3D skybox row
// greys out.  Part 4 needs a real Source map and is in b33b.cfg instead.
//
// NOTE cfg_save_auto stays at its default 1 for this file, unlike every other
// testrun cfg, because part 3 is *about* the config being written on quit.

// log_enable, not just log_name.  The first run of this file produced no log at
// all: log_name only NAMES the file, and without -condebug on the command line
// or this line here nothing ever opens it.  g13diag.cfg:27 records the same
// mistake being made and diagnosed once already, which is the argument for
// putting it in the file rather than relying on remembering the switch.
log_enable 1
log_name b33a
developer 0
scr_conalpha 0
con_notifytime 0
cl_idlefps 0
scr_sshot_type png

waitms 2000

echo ^5=== b33a: gfx_menu audit ===

map surf_null
waitmap 240
wait 60

// ---------------------------------------------------------------------------
echo ^5--- 1. the table, all 23 rows ---
// Read this against the essay in cl_gfx.qc.  Decals must show `*needs map load`
// and Prop distance / Animated must exist at all.
gfx_menu status
waitms 400

// ---------------------------------------------------------------------------
echo ^5--- 2. greying, driven both ways ---

// Dithered water: BOTH dither rows must come alive (no `inert`).
hl2_water 3
hl2_refract 0
hl2_dither_force 0
waitms 300
echo ^5(expect: rows 5 and 6 live, no inert marker)
gfx_menu status 5
gfx_menu status 6
waitms 300

// Dither level set: row 5 must now say it is overridden, row 6 stays live.
hl2_dither_force 0.5
waitms 300
echo ^5(expect: row 5 inert "set by Dither level", row 6 still live)
gfx_menu status 5
gfx_menu status 6
waitms 300

// Neither surface dithered: BOTH must go inert, and for the other reason.
hl2_water 0
hl2_refract 0
waitms 300
echo ^5(expect: rows 5 and 6 both inert "needs dithered")
gfx_menu status 5
gfx_menu status 6
waitms 300

// Glass alone is enough -- the condition is water OR refract, and testing only
// water would pass a version that had ANDed them.
hl2_refract 2
waitms 300
echo ^5(expect: rows 5 and 6 live again, on refract alone)
gfx_menu status 5
gfx_menu status 6
waitms 300

// surf_null has no sky_camera, so row 11 must be inert here.
echo ^5(expect: row 11 inert "no sky_camera")
gfx_menu status 11
waitms 300

// ---------------------------------------------------------------------------
echo ^5--- the four pages, as pictures ---
gfx_menu page 1
waitms 400
screenshot
waitms 400
gfx_menu page 2
waitms 400
screenshot
waitms 400
gfx_menu page 3
waitms 400
screenshot
waitms 400
gfx_menu page 4
waitms 400
screenshot
waitms 400
gfx_menu
waitms 300

// ---------------------------------------------------------------------------
echo ^5--- 3. persistence: cycle through the menu's own path ---
// One from each page, and one of each kind: a plugin cvar with no archive flag
// (hl2_water), a plugin cvar that was already archived (hl2_propdist), a CSQC
// cvar (vbsp_decals), and the engine's own (r_reflectcube).  If seta is reaching
// all four families, every row is covered by induction.
// Row 18 is the FIFTH and the interesting one: hl2_favour_ldr is CVAR_MAPLATCH,
// and a latched cvar keeps the new value in latched_string with ->string still
// holding the old one until the latch point.  So "does seta persist a LATCHED
// row, and which of the two values does it write?" is a genuinely open question
// that the other four cannot answer -- they carry no latch at all.  If it saves
// the OLD value, that is not a bug in this build so much as a limit on it, and
// the honest place to find out is here rather than from Lex.
echo ^5(before)
gfx_menu status 1
gfx_menu status 8
gfx_menu status 12
gfx_menu status 13
gfx_menu status 18
waitms 400

gfx_menu cycle 1
waitms 300
gfx_menu cycle 8
waitms 300
gfx_menu cycle 12
waitms 300
gfx_menu cycle 13
waitms 300
gfx_menu cycle 18
waitms 300

echo ^5(after -- these five values are what must survive the quit)
gfx_menu status 1
gfx_menu status 8
gfx_menu status 12
gfx_menu status 13
gfx_menu status 18
waitms 400

// What the cvar itself reports, straight from the engine, beside what the menu
// thinks -- a MAPLATCH row is exactly where those two could disagree.
echo ^5(engine's own view of the five)
hl2_water
r_reflectcube
vbsp_decals
hl2_propdist
hl2_favour_ldr
waitms 600

// The first run of this file cycled all five rows correctly and then wrote NO
// config at all on quit, which would have read as "seta did not work".  It is a
// separate question and it has to be asked separately: `cfg_save_auto` decides
// whether quitting saves, and CVAR_ARCHIVE decides what gets saved when it
// does.  Only the second one is what build 33 changed.
echo ^5(is auto-save even on?)
cfg_save_auto
waitms 300

// So save explicitly, which reads exactly the same archive flags the auto path
// would, and settles the flag question independently of the quit path.
echo ^5(explicit save)
cfg_save
waitms 800

echo ^5=== b33a done -- now grep ftesurf.cfg for seta hl2_water / r_reflectcube / vbsp_decals / hl2_propdist / hl2_favour_ldr ===
wait 30
quit
