cfg_save_auto 0
// Patch 308 -- the v21/Strata worldlights lump, and the 123 maps on which
// Patch 302 and Patch 304 have silently been doing nothing.
//
// WHY THIS RUN EXISTS.  Patch 302 refused any worldlights lump whose version is
// not 0, because the v21 record is 100 bytes instead of 88 and the extra 12 are
// undocumented.  Refusing beat guessing.  But 302's essay also claimed the
// refusal "costs nothing today, because v21 maps ship full .vhv bakes and take
// the baked path" -- and that is false.  The bake only suppresses this term for
// PROPS; players, viewmodels and every unbaked prop on those maps were left on
// bounce-only lighting.  Measured over the install: 1314 maps, 123 of them
// lumpversion 1, 39,641 lights refused.  surf_fantasy is one of them, which is
// why every measurement of 302 and 304 was made on tensor2 and boreas.
//
// The layout is DERIVED, not guessed.  surf_fantasy ships twice -- CS:S (v20,
// 88-byte) and Momentum (v21, 100-byte) -- with the same 777 lights, paired
// 777/777 by origin.  Scanning the v21 record for the offset that reproduces
// each v20 field gives a single 12-byte insertion after `normal` (Strata's
// shadow_cast_offset, zero on all 39,641 lights), everything below shifted +12.
//
// PRE-REGISTERED, from p308_pred.py, which reimplements the loader's four
// filters against the derived offsets.  These are the numbers the engine must
// print.  Needs developer 1 AND log_developer 1 -- the line is a Con_DPrintf.
//
//   surf_fantasy  worldlights HDR v1 (100-byte, Strata)
//                 767 of 777 usable (2 sky, 7 styled, 0 already in cube, 1 clusterless)
//   surf_tensor2  worldlights HDR v0 (88-byte)
//                 601 of 603 usable (2 sky, 0 styled, 0 already in cube, 0 clusterless)
//
// THE CLAIM, STATED SO IT CAN FAIL:
//   1. fantasy prints 767 of 777 with that exact drop breakdown.  A wrong layout
//      does not land on 767 by accident -- it would have to reproduce the type,
//      style, flags AND cluster filters simultaneously from mis-aligned bytes.
//   2. tensor2 is a v20 map and must print EXACTLY what the 304 build printed.
//      This patch must not touch the 88-byte path at all.
//   3. hl2_lt_wl21 0 restores the refusal: fantasy's line disappears and the
//      skip warning takes its place.  That is the falsifier.
//   4. `prop_census` on fantasy still reports its props as BAKED, so their level
//      must NOT move -- wl_suppress still gates the term for them.  The lights
//      reach players, viewmodels and unbaked props only.  If fantasy's props
//      change brightness, the suppression broke and that is a regression.
//
// A1 -- fantasy, patch on (default).
developer 1
log_developer 1
log_enable 1
echo ===== P308 A1 fantasy wl21 1 =====
hl2_lt_wl21 1
map surf_fantasy
wait
echo ----- A1 census -----
prop_census 0
echo ===== P308 A1 end =====
