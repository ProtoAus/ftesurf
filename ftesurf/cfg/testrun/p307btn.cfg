cfg_save_auto 0
// PATCH 307 -- FALSIFIER.  The injected mouse BUTTON: counted always, blocked on
// request.
//
// THE HOLE, in shipped code and not hypothetical.  in_win.c registers mouse raw
// input with dwFlags 0 -- RIDEV_NOLEGACY is written out in the source and
// deliberately not used -- so legacy WM_*BUTTONDOWN still flows beside WM_INPUT.
// An injected click's WM_INPUT is dropped at the hDevice test, which sits BEFORE
// the button stamping, so rawbuttondown[] is never set and rawbuttontime[] stays
// stale.  INS_MouseEvent's dedupe then sees a legacy press that raw did not
// account for and passes it through as a genuine K_MOUSE1.  That is enough for
// scroll-bhop, for jump timing and for the gate the sample cheat uses.
//
// WHY IT IS NOT SIMPLY CLOSED.  This tree already measured the cost, before this
// patch existed: a Windows precision touchpad is a HID DIGITIZER, not a
// RIM_TYPEMOUSE, so it emits no RI_MOUSE_BUTTON_* flags at all and the legacy
// message is the ONLY press it has.  RIDEV_NOLEGACY takes every mouse button
// from those users -- taps and press-and-hold alike -- and it presents as a dead
// hit-test rather than as missing input, which is what made it hard to find the
// first time.  So the block ships OFF by default as in_rawinput_nolegacy, and
// the counter -- which costs nothing and breaks nothing -- is the part that is
// always on.
//
// IT IS ALSO GRAB-SCOPED, and that is not only about cheating: NOLEGACY
// suppresses NON-CLIENT legacy messages too, which is how a windowed player
// drags, resizes and closes the window.  Applied while the mouse is free it
// would make the title bar dead, which is a worse bug than the one being fixed.
//
// PRE-REGISTERED, before the harness was run:
//   ARM A  nolegacy 0, NOTHING injected -> data/p307_A.hid
//          legacybtn MUST be 0 and there MUST be no 'b' record.  The control
//          that says the counter does not tick on its own.
//   ARM B  nolegacy 0, 20 injected clicks -> data/p307_B.hid
//          THE HOLE MUST BE DEMONSTRATED, not assumed: there MUST be 20 '+'
//          records for K_MOUSE1 -- the injected clicks really did reach the
//          game -- AND legacybtn MUST be 20, the counter seeing every one.
//   ARM C  nolegacy 1, 20 injected clicks -> data/p307_C.hid
//          There MUST be ZERO '+' records and legacybtn MUST be 0: the clicks
//          never arrive, so there is nothing to count.  The header's
//          `nolegacylive 1` MUST confirm the suppression actually took -- the
//          setting is grab-scoped and a run where the mouse was never grabbed
//          would produce the same zero for the wrong reason.
//   ARM D  nolegacy 0 again, 20 injected clicks -> data/p307_D.hid
//          MUST look like arm B again.  WITHOUT THIS ARM, arm C's zero is
//          equally well explained by the harness having died, and that is not a
//          hypothetical: the Patch 306 run lost three arms to a silently refused
//          SetForegroundWindow and each looked exactly like "the patch works".
//
// WHAT THIS TEST DOES NOT SHOW: the counter cannot name a cause.  An on-screen
// keyboard, a remote-desktop session, accessibility software and some vendor
// mouse utilities all click through the legacy path legitimately, and so does a
// precision touchpad.  A non-zero legacybtn is a reason to look, never an
// accusation, and hidcheck reports it as a note.

exec cfg/testrun/_quiet.cfg

developer 1
log_developer 1
log_enable 1
log_dir logs
log_name p307btn
cl_maxfps 100
cl_idlefps 0
sv_cheats 0
con_notifylines 0
con_notifytime 0.01
r_drawviewmodel 0

wait 200
map bhop_eazy
waitmap 600
waitms 5000

echo ^5=== P307: raw input state
in_rawinput
in_rawinput_nolegacy

echo ^5=== P307 ARM A: control, nolegacy 0, nothing injected
in_rawinput_nolegacy 0
waitms 500
in_journal_begin
waitms 2500
in_journal_note p307-arm-A-control
waitms 200
in_journal_end data/p307_A.hid
waitms 1500

echo ^5=== P307 ARM B: nolegacy 0, 20 injected clicks -- the hole
in_journal_begin
waitms 4500
in_journal_note p307-arm-B-open
waitms 200
in_journal_end data/p307_B.hid
waitms 1000

echo ^5=== P307 ARM C: nolegacy 1, 20 injected clicks -- the block
in_rawinput_nolegacy 1
waitms 500
in_journal_begin
waitms 4500
in_journal_note p307-arm-C-blocked
waitms 200
in_journal_end data/p307_C.hid
waitms 1000

echo ^5=== P307 ARM D: nolegacy 0 again -- the restore, proving C was the block
in_rawinput_nolegacy 0
waitms 500
in_journal_begin
waitms 4500
in_journal_note p307-arm-D-restored
waitms 200
in_journal_end data/p307_D.hid
waitms 1500

echo ^5=== END OF RUN ===
waitms 1000
quit

