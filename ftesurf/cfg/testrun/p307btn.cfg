// MEASURED -- engine\release\fteqw64.exe 66B0F51FCFF9, 2026-09-12/13.
// (Run 1 was 7F1B546C7C7D, before the 'g' record existed; kept as p307r1_*.)
//
// RUN 2 RESULT, against the pre-registration above:
//
//   arm  nolegacy  clicks fired   'b' sum   '+' recs   'g' changes  injected
//    A       0        0 (control)     0         0           0          0
//    B       0       20 confirmed    20        27           0         40
//    C       1       18 confirmed     0        10           8         38
//    D       0       18 confirmed    15        22           0         38
//
// ARM B DEMONSTRATES THE HOLE rather than assuming it.  Twenty synthesized
// clicks became twenty real K_MOUSE1 presses inside the game, and the counter
// saw all twenty.  This is shipped behaviour, not a contrived one.
//
// ARM C DEMONSTRATES THE BLOCK, and the clean argument is not "C had zero" --
// zero is also what a dead harness produces.  It is that THE CLICKS STILL
// ARRIVED: Patch 306's injected counter reads 38 in arm C, i.e. ~19 clicks x 2
// (down+up) of WM_INPUT with no device handle, almost exactly arm D's 38.  Same
// arrivals, same machine, minutes apart -- 0 accepted with the block on, 20 and
// 15 accepted with it off.  The cvar is the only thing that differed.
//
// ARM D IS WHY THERE ARE FOUR ARMS.  Without it, arm C's zero is equally well
// explained by the harness having stopped working, which is not hypothetical:
// the Patch 306 falsifier lost three of four runs to a silently refused
// SetForegroundWindow, and every one of them looked exactly like success.
//
// D's 15 against 18 confirmed-focused is EXPECTED and worth writing down: the
// INS_MouseEvent dedupe suppresses a legacy press within 100ms of a genuine raw
// button transition on the same button.  Arm D ran with 919 real input events
// (a hand on the mouse), so an injected click landing inside one of those
// windows is swallowed as a duplicate -- by the anti-duplicate logic, not by
// this patch.  The counter is therefore a FLOOR on injected clicks, never a
// ceiling, which is the safe direction for it to be wrong in.
//
// WHAT RUN 1 FOUND, and it changed the patch.  Arm C blocked the clicks but its
// header said `nolegacylive 0`, so the file could not prove the block was the
// cause.  The log showed why: the state flipped FOUR TIMES in three seconds.
// in_rawinput_nolegacy is grab-scoped -- it must be, because RIDEV_NOLEGACY also
// kills the non-client messages a windowed player needs to move their own window
// -- so every grab transition flips it, and the harness stealing focus flipped
// it repeatedly.  A header field is a snapshot and cannot describe something
// that changes.  Hence the 'g' record, which run 2 shows working: arm C has 8
// transitions logged, arms B and D have none (with the cvar off there is no
// state to change).  An auditor can now say WHICH SPANS of a run were open.
//
// That is the third patch running to land on the same lesson: 301 separated the
// cvar from the grant, 306 separated "not counted" from "counted zero", 307
// separates "true at the start" from "true throughout".
//
// THE COST IS REAL AND IS WHY THE DEFAULT IS 0.  A Windows precision touchpad is
// a HID digitizer with no RI_MOUSE_BUTTON_* reports whatsoever, so the legacy
// message is its ONLY press; in_rawinput_nolegacy 1 takes every mouse button
// from those users.  This tree found that the hard way once already (see the
// essay in INS_MouseEvent).  The counter, which costs nothing and breaks
// nothing, is the part that is always on.
//
// AND THE COUNT CANNOT NAME A CAUSE.  An on-screen keyboard, a remote-desktop
// session, accessibility software, some vendor mouse utilities and a precision
// touchpad all click through the legacy path legitimately.  hidcheck reports it
// as a NOTE pointing at the Patch 303 device table, never as a fault.
//
// hidcheck.py: 'b' and 'g' parsed, the trailer widened to 7/9/10 fields, the
// nolegacy header pair read, the two-way cross-check added, and FIVE new suite
// cases including one for the mid-run reopen that a header alone cannot answer.
// 45 checks, 0 failed.
// Arm A still faults with "no frame markers": the scripted-capture trap, not
// this patch.
//
// PRE-REGISTRATION CORRECTION, recorded rather than reworded.  Arm C was
// registered as "there MUST be ZERO '+' records".  It has TEN, and the
// registration was simply wrong: '+' counts EVERY key and button press,
// including the real ones from the hand that was on the mouse throughout (arms
// B/C/D carried 900-1600 genuine input events each).  '+' can never separate an
// injected click from a real one and should not have been named as the
// criterion.  The metric that does separate them is 'b' -- presses raw input
// could not corroborate -- which read 20 / 0 / 15 exactly as the patch predicts.
// The registration named a quantity that could not answer the question, which is
// a different error from getting the answer wrong, and a worse one.
