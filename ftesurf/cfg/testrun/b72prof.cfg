// Build 72: does the ranked input profile reach the server, and does it mark
// the ONE case a snapshot cannot see?
//
// WHAT IS ACTUALLY BEING TESTED is a client->server userinfo round trip plus a
// latch-and-difference across a run.  `cmd timer`'s new line prints all four
// numbers that decide it:
//
//     inprof:  key "<ver> <have> <raw> <filter> <accel> <bad> <grant>"
//              badat <latched at the start>  noprofile <latched>  would <live>
//
// BUILD 77 APPENDED <grant> AND BUMPED <ver> TO 2, so the trailing-token
// predictions below are STALE and describe a v1 key.  They are corrected in
// place rather than deleted: the last token is now the GRANT (2 on an ordinary
// Windows install), `bad` has moved one place left, and <have> reads 15 rather
// than 7 because IPH_GRANT joined the mask.  No arm in this file moves the
// grant -- arm 4 sets in_rawinput 0 with NO in_restart, and in_win.c only
// re-enumerates inside INS_RawInput_Init -- so the new clause never fires here
// and every would/noprofile prediction below still stands unchanged.  The arm
// that does exercise it is b77grant.cfg, which supersedes this file for the
// grant and leaves it the harness for the other three clauses.
//
// ONE LATENT FRAGILITY, recorded rather than fixed, because fixing it would
// change arms that have already been measured: this file never pins the grant
// the way b77grant.cfg's arm A does (`in_rawinput 1 ; in_restart`).  It is safe
// only because ftesurf.cfg ships `in_rawinput 1`, so enumeration succeeds at
// startup.  On an install where that archived value were 0, arm 1 would read
// would 1 under a perfectly correct build -- tripping this file's real
// falsification criterion for a reason that is not the thing it tests.
//
// `would` calls SV_ProfileBroken, the same pure predicate the latch calls, so
// the two can never drift and asking does not mark the run.  That is the only
// way to observe the FINISH half of this at all: a run cannot be finished from
// a config on a zoned map -- zone_goto and setpos both void via SV_TimerWarped
// -- which is the wall build 58 hit and p313qc.cfg wrote down.
//
// cfg_save_auto 0 IS PROTECTING REAL USER DATA.  All three cvars this pokes are
// CVAR_ARCHIVE (in_win.c:347, in_generic.c:15, in_generic.c:24), so a run that
// saved would write m_accel 1 / in_rawinput 0 into Lex's own ftesurf.cfg and
// leave them there.  Arm 6 restores them anyway -- belt and braces, because a
// crash before arm 6 must not cost somebody their mouse settings.
//
// PREDICTION:
//   arm 1  control.  key present, `bad` 0 (second-to-last token now), badat 0,
//          noprofile 0, would 0
//   arm 2  m_accel 1 BEFORE the arm      -> noprofile 1 (latched at the start)
//   arm 3  m_filter 1 before the arm     -> noprofile 1
//   arm 4  in_rawinput 0 before the arm  -> noprofile 1
//   arm 5  THE ONE THAT MATTERS.  Arm clean, set m_accel 1 mid-run, set it back
//          to 0, then ask.  The key's own fields all read clean -- this is the
//          snapshot -- but `bad` has stepped past `badat`, so would 1.
//   arm 6  restore.  `bad` reads 4 (arms 2,3,4 and 5 stepped it; 3 and 4 were
//          contiguous bad states so they count ONCE each only if the state
//          returned to good in between -- see the note at arm 6) and would 0.
//
// FALSIFIED IF: arm 1 shows would 1 (the check fires on a stock install and
//          everything below is worthless); or key is "" after arm 1 (the
//          setinfo never reached the server, i.e. the quoting is wrong); or
//          arm 5 shows would 0, which is the hole this design exists to close
//          and would mean the counter is not being latched or not stepped.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name b72prof
developer 0
sv_cheats 0

name "^3Lex Profile"

// Wall clock, not frames -- `wait N` counts FRAMES and a `map` issued before the
// engine has finished starting is dropped in silence.  See p313qc.cfg.
waitms 5000

map bhop_eazy
waitmap 45
waitms 4000

// ---------------------------------------------------------------- ARM 1
// CONTROL.  A clean armed run on a stock input profile.
echo ================================ B72PROF ARM 1 -- control, stock profile
m_accel 0
m_filter 0
in_rawinput 1
waitms 500
cmd zone_goto 0
waitms 1500
+forward
waitms 1200
cmd timer
waitms 1500
-forward
waitms 500

// ---------------------------------------------------------------- ARM 2
// m_accel BEFORE the arm, so the START latch is what marks it.
echo ================================ B72PROF ARM 2 -- m_accel 1 before the arm
m_accel 1
waitms 700
cmd zone_goto 0
waitms 1500
+forward
waitms 1200
cmd timer
waitms 1500
-forward
m_accel 0
waitms 700

// ---------------------------------------------------------------- ARM 3
// m_filter, the second of the three preconditions.
echo ================================ B72PROF ARM 3 -- m_filter 1 before the arm
m_filter 1
waitms 700
cmd zone_goto 0
waitms 1500
+forward
waitms 1200
cmd timer
waitms 1500
-forward
m_filter 0
waitms 700

// ---------------------------------------------------------------- ARM 4
// in_rawinput, the third.  NOTE this one is asymmetric in the predicate: raw
// must be POSITIVE to pass, where the other two must be non-zero to fail.
echo ================================ B72PROF ARM 4 -- in_rawinput 0 before the arm
in_rawinput 0
waitms 700
cmd zone_goto 0
waitms 1500
+forward
waitms 1200
cmd timer
waitms 1500
-forward
in_rawinput 1
waitms 700

// ---------------------------------------------------------------- ARM 5
// THE ARM THIS BUILD EXISTS FOR.  Arm and start CLEAN, go bad mid-run, come
// back clean, then ask.  Every current-state field in the key reads good at the
// moment `cmd timer` runs -- that is exactly the snapshot that cannot see this
// -- and the run is marked anyway because `bad` moved past `badat`.
//
// The first cut of this build shipped without the counter and with a comment
// claiming the edge-send covered it.  It did not.  This arm is that claim's
// falsifier.
echo ================================ B72PROF ARM 5 -- set and unset INSIDE the run
cmd zone_goto 0
waitms 1500
+forward
waitms 800
echo ---- going off-profile mid-run
m_accel 1
waitms 600
echo ---- and back, before anybody looks
m_accel 0
waitms 600
cmd timer
waitms 1000
-forward
waitms 500

// ---------------------------------------------------------------- ARM 6
// THE SECOND ARM THAT MATTERS, AND THE MORE DANGEROUS ONE.
//
// `bad` NEVER RESETS -- it counts for the life of the client, which is why the
// server latches it per run rather than reading it absolutely.  So this arm
// asks the question that decides whether the whole counter is safe to ship:
// after the count has moved, does a FRESH run come back CLEAN?
//
// If it does not, then one `m_accel 1` typed at any point in a session demotes
// every run for the rest of that session, and a player would have no way to
// find out why.  That is a far worse failure than the hole the counter closes,
// so it is measured rather than reasoned about.
//
// The mechanism it is checking: SV_TimerArm seeds run_t_pbad to -1, the start
// call latches the CURRENT count into it, and SV_ProfileBroken differences
// against that latch.  4 == 4 is clean.
//
// PREDICT: `bad` 4 (cumulative, unchanged), badat 4 -- the NEW latch, not
//          arm 5's 3 -- noprofile 0 and would 0.
// FALSIFIED IF: would 1 with all three cvars restored.  The counter is
//          poisoning every later run and this build must not ship.
echo ================================ B72PROF ARM 6 -- a FRESH run after the count moved
m_accel 0
m_filter 0
in_rawinput 1
waitms 1000
cmd zone_goto 0
waitms 1500
+forward
waitms 1200
cmd timer
waitms 1200
-forward
waitms 500
echo ---- the three cvars, for the record:
m_accel
m_filter
in_rawinput

echo ================================ B72PROF done
waitms 1000
disconnect
waitms 2000
quit
