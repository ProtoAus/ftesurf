// ***************************************************************************
//  BUILD 47 / ENGINE PATCH 269b -- THE JITTER SURVIVED THE FIX.
//
//  Patch 269 stopped the velocity blend and was verified: cl_predtrace read
//  pv->simvel as 0.0000 on 400/400 rendered frames, against 381/400 nonzero
//  with cl_predict_velblend 1.  The deployed exe demonstrably contains it (the
//  binary carries both new cvar strings).  The user reloaded the game and the
//  flicker is still there on surf_colin_blaster_69000 after a +forward tap.
//
//  So the verification was true and insufficient.  There are exactly two ways
//  that happens, and this run is built to tell them apart:
//
//    (1) THE REGIME.  jit05/jit06 ran a SECOND, UNFOCUSED instance with
//        cl_idlefps 0 and cl_maxfps 0 and reached ~19 rendered frames per
//        command.  The user runs FOCUSED with cl_maxfps 340 and cl_idlefps 60
//        -- about 5 rendered frames per command.  A defect measured at 19 was
//        not measured at 5.  Every cvar below is copied from the user's own
//        ftesurf.cfg for that reason.
//
//    (2) THE SAMPLE.  The Patch 269 fix is gated on `!nopred`.  A rendered
//        frame that takes the nopred path still runs the OLD blend -- and the
//        269 instrument never recorded which path a frame took, so a clean
//        dump could equally have meant "fixed" or "the bad frames exist and
//        were not among the ones I looked at".  269b adds `nopred` to every
//        record.  That is the hole, and section 2 is aimed straight at it.
//
//  cl_idlefps 0 is the ONE deliberate departure from the user's config, and it
//  is required to IMITATE them rather than to differ from them: this capture
//  window is unfocused, and cl_idlefps 60 would cap it at 60fps -- the regime
//  where the defect cannot occur.  jit01 already failed exactly that way.
//  cl_maxfps stays at the user's 340 so the frames-per-command ratio matches.
//
//  Every section prints frames-per-command as a self-check.  A section whose
//  ratio is near 1 has not tested anything, whatever its nonzero count says.
// ***************************************************************************

log_developer 1

waitms 2000

map surf_colin_blaster_69000
waitmap 240
wait 60

// ---- the user's regime, copied from ftesurf.cfg ------------------------
cl_maxfps 340           // user's value
cl_idlefps 0            // see the header: imitates a FOCUSED 340, does not differ from it
cl_netfps 66.6667       // user's value (the map corrects it anyway)
hud_predicted 1         // user's value -- so HUD_LiveVel returns pmove_vel
hud_update -1           // user's value -- latch once per clientcommandframe
hud_round 1             // user's value
hud_debug 1
hud_speed 1
hud_strafe 1
cl_predict_velblend 0   // the shipped Patch 269 behaviour
wait 120

echo ^5=== rendering rate, before anything is claimed about it
show_fps 1
wait 120

// ---------------------------------------------------------------------------
echo ^5=== 1: UNTOUCHED CONTROL.  Never pressed a key. Expect entirely clean.
// If this is dirty the whole "needs a prior tap" property is wrong and every
// conclusion drawn from it, in 269 and before it, has to be re-derived.
// ---------------------------------------------------------------------------
cl_predtrace 400
waitms 3000

// ---------------------------------------------------------------------------
echo ^5=== 2: THE REPRODUCTION.  Tap +forward, release, wait a full second,
echo ^5    then trace 400 frames of standing still at the USER'S framerate.
// waitms, not wait: `wait` counts FRAMES, so at 340fps a 20-frame tap is 59ms
// and can miss a 15ms command boundary entirely.
// ---------------------------------------------------------------------------
+forward
waitms 400
-forward
waitms 1000
cl_predtrace 400
waitms 3000

// ---------------------------------------------------------------------------
echo ^5=== 3: POSITIVE CONTROL at THIS framerate -- old blend back on.
// This is what makes section 2 readable.  If 3 flickers and 2 does not, then
// 340fps CAN show the defect and the fix is holding here, which means the
// user's number is coming from somewhere this trace does not look.  If 2 and 3
// BOTH flicker, the fix does not cover the user's regime and section 2's
// nopred column says why.  If NEITHER flickers, this capture failed to
// reproduce and proves nothing -- read frames-per-command before believing it.
// ---------------------------------------------------------------------------
cl_predict_velblend 1
+forward
waitms 400
-forward
waitms 1000
cl_predtrace 400
waitms 3000

// ---------------------------------------------------------------------------
echo ^5=== 4: back to the fix, and a LONGER wait -- 4 seconds after release.
// The user's words are "tap a direction key, and wait".  Section 2 waits one
// second.  If something re-arms on a slower clock -- a snapshot, a stat, a
// timeout -- one second may sit inside a window that four seconds leaves.
// ---------------------------------------------------------------------------
cl_predict_velblend 0
+forward
waitms 400
-forward
waitms 4000
cl_predtrace 400
waitms 3000

// ---------------------------------------------------------------------------
echo ^5=== 5: a STRAFE tap rather than forward, same regime.
// The user says "a direction key".  forwardmove and sidemove take different
// paths through the strafe code; if only one of them arms the defect that is
// a fact worth having before theorising.
// ---------------------------------------------------------------------------
+moveright
waitms 400
-moveright
waitms 1000
cl_predtrace 400
waitms 3000

// ---------------------------------------------------------------------------
echo ^5=== 6: the drawn HUD, photographed rather than described.
// hud_veltrace prints per rendered frame and therefore throttles the client --
// the trap that made the first cl_predtrace report a false pass -- so it is
// NOT used here.  A screenshot costs one frame and shows the actual pixels the
// user is looking at, which is the only thing that has been asserted about
// rather than observed.  Several, because the flicker is per-frame.
// ---------------------------------------------------------------------------
+forward
waitms 400
-forward
waitms 1000
screenshot jit07_hud_a
waitms 120
screenshot jit07_hud_b
waitms 120
screenshot jit07_hud_c
waitms 120
screenshot jit07_hud_d
waitms 500

echo ^5=== END OF RUN ===
wait 20
quit
