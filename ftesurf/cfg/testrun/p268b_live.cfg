// cfg_save_auto 0: this run sets archived cvars (vid_*, cl_maxfps); never let it write them into ftesurf.cfg (cl_main.c:2535)
cfg_save_auto 0
// Patch 268 B -- LIVE A/B, and it supersedes the three-process p268b_a/b/c arms as the
// primary evidence.
//
// WHY.  Comparing screenshots across separate PROCESSES was measuring engine load-order
// noise as well as the patch.  Two runs of the same binary with the same cfg differ by
// 7-18% of the centre crop at three of the seven vantages, flipping between two stable
// states -- the async texture/cubemap load race (VBSP_LoadCubemaps counts "32 whose baked
// VTF is missing" at load in every run, and whether a given cube finishes before the first
// frame is a coin toss).  Crucially the WITHIN-run floor at those vantages is near zero on
// two of the three, so three shots 700 ms apart does NOT expose it.  Measure the floor
// ACROSS RUNS, not just across frames.
//
// r_envcubemap is a plain runtime cvar read per batch in the permutation gate, so 1/0/1 at
// a FIXED setpos inside ONE process is a three-picture A/B with nothing else moving at all:
// same process, same map load, same texture states, same particle phase.  The middle shot
// is the pre-patch picture for every material Part B turns on.
//
// hl2_envcubemap and hl2_envmap_source are CVAR_SHADERSYSTEM and must be set BEFORE the
// map loads (they decide what is compiled into each material), so they are set once up
// here and never touched again.  Only r_envcubemap moves during the run.
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000
wait 200

developer 1
log_developer 1
log_enable 1
log_dir logs
log_name p268b_live
cl_maxfps 0
cl_idlefps 0
sv_cheats 1
con_notifylines 0
con_notifytime 0
con_notifytime_error 0
r_drawentities 1
r_lightstylescale 1

hl2_envcubemap 1
hl2_envmap_source 7
r_reflectcube_nosky 0
echo ^5=== LIVE A/B: hl2_envcubemap 1, hl2_envmap_source 7, toggling r_envcubemap

// ============================ surf_boreas ============================
// Lex picked these two vantages off the screen as the only ones worth using: the ramp_s1
// prop at 12672 1568 11840, in sunlight.  Its up-facing patch centroid is
// 12499.32 3632.00 11588.22, normal -0.78632 0 0.61782; the same plane carries
// ramp_wood01 (tint 0.1 0.2 0.2) as a border and ice_transparent (tint 0.66) inside.
map surf_boreas
waitmap 600
waitms 9000
noclip
waitms 1000

setpos 12243.8 3632 11789 38.16 0 0
waitms 2500
cmd viewpos
r_envcubemap 1
waitms 900
shader_here bor_ramp7_on1
screenshot p268b_live_bor_ramp7_on1
r_envcubemap 0
waitms 900
shader_here bor_ramp7_off
screenshot p268b_live_bor_ramp7_off
r_envcubemap 1
waitms 900
shader_here bor_ramp7_on2
screenshot p268b_live_bor_ramp7_on2

setpos 12349.3 3882 11738.2 27.2 -59 0
waitms 2500
cmd viewpos
r_envcubemap 1
waitms 900
screenshot p268b_live_bor_ramp7b_on1
r_envcubemap 0
waitms 900
screenshot p268b_live_bor_ramp7b_off
r_envcubemap 1
waitms 900
screenshot p268b_live_bor_ramp7b_on2

// ============================ surf_fantasy ============================
// Breadth, chosen by the library census (wf/envcubeprops.txt): VBSP v21 (boreas is v20),
// 247 baked cubemaps -- the only high-count map that really tests NEAREST-cubemap
// selection -- 921 qualifying prop instances, and the one candidate carrying all three
// mask states at once, so bit 1 (a provable no-op on boreas) is visible here.
// No vantage geometry for this map, so this is a SMOKE TEST at the spawn: it answers
// "does anything go wrong on a second map" (surfaces flat grey, a crash, the sentinel
// bound as a reflection) and "does the feature engage" via the envcube counter.
map surf_fantasy
waitmap 600
waitms 9000
waitms 3000
cmd viewpos
r_envcubemap 1
waitms 900
shader_here fan_spawn_on1
screenshot p268b_live_fan_spawn_on1
r_envcubemap 0
waitms 900
shader_here fan_spawn_off
screenshot p268b_live_fan_spawn_off
r_envcubemap 1
waitms 900
shader_here fan_spawn_on2
screenshot p268b_live_fan_spawn_on2

noclip
waitms 500
setpos 0 0 512 20 0 0
waitms 2500
cmd viewpos
r_envcubemap 1
waitms 900
screenshot p268b_live_fan_orig_on1
r_envcubemap 0
waitms 900
screenshot p268b_live_fan_orig_off
r_envcubemap 1
waitms 900
screenshot p268b_live_fan_orig_on2

echo ^5=== END OF RUN ===
waitms 500
quit
