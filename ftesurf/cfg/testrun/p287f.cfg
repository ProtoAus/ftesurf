// FTESurf p287f -- does r_portalareas fix the black doorway?  Both directions.
//
// THE DIAGNOSIS, from p287a-e:
//   * not scripts/common.shader   (A/B, pixel-identical with it moved aside)
//   * not the 03:41 engine        (the 21:55 build is byte-identical)
//   * not the FBO paint           (r_portalfbo 0 renders the doorway the same as
//                                  vbsp_portal_render 0 -- i.e. NOTHING is drawn
//                                  on either path; the white band was the wall
//                                  behind the door all along, which is why the
//                                  apertures-off control mattered)
//   * the far view is queueing ZERO surfaces:
//         [world] recurse 1: area 11 cluster 131 vis yes -> 0 meshes in 0 batches
//     with a real cluster and `vis yes`, while the near view reports
//         area 6 of 13: 1 area(s) reachable
//     Area 11 is not reachable from area 6, and GLR_DrawPortal never cleared
//     areabitsknown, so the far side was culled by the NEAR side's areas.
//
// PASS: with r_portalareas 1 the doorway shows the far room, and the log's
//       recurse line for area 11 reports a NON-ZERO mesh count.
// FAIL: 0 meshes at 1 as well -- then areas were not the mechanism and the cvar
//       goes back to 0 and does not ship.
//
// Both directions in ONE run, because "it looks different" is only worth
// something if the old behaviour reproduces on demand at the same vantage.  The
// mesh count in the log is the mechanical half and the picture is the human
// half; neither alone would be enough.
cfg_save_auto 0
exec cfg/testrun/_quiet.cfg
developer 1
log_developer 1
log_dir "logs"
log_name "p287f"
scr_sshot_type png
cl_yieldcpu 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0

waitms 2500

map surf_kitsune
waitmap 240
waitms 8000
sv_cheats 1

// -------------------------------------------------- OFF: today's behaviour
echo "@@@ P287F r_portalareas 0 -- expect the black doorway and 0 meshes"
r_portalareas 0
setpos 0 -765 133 0 90 0
waitms 3000
screenshot_mega p287f_areas_off 1280 720
waitms 800

// -------------------------------------------------- ON: the patch
echo "@@@ P287F r_portalareas 1 -- expect the far room and a non-zero mesh count"
r_portalareas 1
waitms 2000
setpos 0 -765 133 0 90 0
waitms 3000
screenshot_mega p287f_areas_on 1280 720
waitms 800

echo "@@@ P287F oblique at 45, areas ON -- parallax proves it is a projection"
setpos 0 -765 133 0 45 0
waitms 2500
screenshot_mega p287f_areas_on_oblique 1280 720
waitms 800

// -------------------------------------------------- back OFF: reproduce on demand
echo "@@@ P287F r_portalareas 0 again -- the black must come back"
r_portalareas 0
waitms 2000
setpos 0 -765 133 0 90 0
waitms 3000
screenshot_mega p287f_areas_off2 1280 720
waitms 800

echo "@@@ P287F DONE"
waitms 1000
quit
