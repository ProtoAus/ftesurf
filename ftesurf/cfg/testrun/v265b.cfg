// V265B -- the hl2_hidetools 0 control for v265a's fix 2.
//
// hl2_hidetools is CVAR_MAPLATCH, so it must be set BEFORE the first map load
// and cannot be toggled inside a session; and `map <same map>` twice does not
// reload the world model, so this cannot share v265a's process.  Own run.
//
// With hidetools 0 the SURF_TRIGGER -> TI_NODRAW mapping is inert, so the
// func_dustmotes slab must be BACK at save011 -- i.e. v265b_d must match the
// pre-patch picture and differ from v265a_d_011_noslab.
//
// That is the proof that the flag path is what removed it, rather than
// something else about this build.  It is also the user-facing escape hatch,
// the same shape as Source's own showtriggers_toggle, so it is worth knowing
// it still works.

log_enable 1
log_dir "logs"
log_name "v265b"
developer 1
log_developer 1
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 0
vid_fullscreen 0
con_notifytime 0
con_notifylines 0
con_notifytime_error 0

hl2_hidetools 0

wait 200
echo ^5=== v265b: hl2_hidetools 0 control ===
hl2_hidetools

map surf_boreas
waitmap 1800
waitms 9000
sv_cheats 1
waitms 300
noclip
waitms 300
developer 0
waitms 300

echo ^5========== D': save011, skyroom 1, hidetools 0 -- slab must be BACK ==========
setpos 13826.6 -2739.2 12105.6 16.3367 163.2788 0
waitms 2500
vbsp_skyroom 1
waitms 2500
screenshot v265b_x
waitms 800
screenshot v265b_d_011_slabback
waitms 800

echo ^5========== A': save009, skyroom 1 -- sky fix is independent of hidetools ==========
setpos 10229.4 5262.8 14725.9 17.2046 139.3616 0
waitms 2500
screenshot v265b_x
waitms 800
screenshot v265b_a_009
waitms 800

echo ^5=== v265b done ===
wait 30
quit
