// Build 70: does picking a map put a REAL client on a REAL public server?
//
// Everything before this ran against a throwaway surfd on :8085 and a throwaway
// lobby on :27599.  This one runs against play.proto.bar and the live fleet --
// the same URL FS_LOBBY_DIR_DEFAULT ships to every player -- because the whole
// class of bug this build fixed was "verified on loopback, 404 for everyone".
//
// WHAT IT CANNOT PROVE: the BUTTON.  Start is a sui element and no cfg in this
// tree drives a cursor.  `ui_join <map>` is its twin from Lob_JoinAsk onward --
// same request, same callback, same ui_join_tick, same two address gates, same
// fallback -- and skips only the pick plus ui_launch's one-line ui_play_online
// test.
//
// surf_aesthetic DELIBERATELY: it is the map Lex reported could not post public
// runs, and no lobby is sitting on it, so this exercises the CLAIM path (an idle
// lobby is moved) rather than the cheap reuse path.
//
// PREDICTION:
//   arm 1  ui_join reports state 0, lobby_dir https://play.proto.bar, terms ok
//   arm 2  "asking ... for a server on surf_aesthetic", then READY with an
//          address of the form play.proto.bar:275N0, then an actual connect
//   arm 3  `status` shows a connection to that address, NOT a listen server --
//          the tell is a real IP:port rather than "localhost"
//
// FALSIFIED IF: it starts a LOCAL map instead (the build-66 behaviour); or
// ui_join never leaves state 1 (ASK); or the address is refused by
// ui_host_allowed; or any "QC"/"PR_ExecuteProgram"/"runaway" line appears.
cfg_save_auto 0
log_enable 1
log_dir logs
log_name b70live
log_developer 1
developer 1

name "^3Lex Live"

// FORTY SECONDS, THEN menu_restart.  menu.dat loads LAZILY and nothing in a
// scripted run needs a menu, so without this every arm prints
// `Unknown command "ui_join"` and the log puts `Initializing menu.dat` after
// the last one.  cfg/testrun/b67ctl.cfg is the control that settles it.
waitms 40000
menu_restart
waitms 4000

echo ^5==== b70live arm 1: what this client is configured to ask ====
ui_join
waitms 500

echo ^5==== b70live arm 2: ask the REAL directory for surf_aesthetic ====
ui_join surf_aesthetic
waitms 2000
ui_join
waitms 12000
ui_join

echo ^5==== b70live arm 3: am I actually on a public server? ====
status
waitms 3000
status

echo ^5==== b70live: done ====
waitms 1000
disconnect
waitms 2000
quit
