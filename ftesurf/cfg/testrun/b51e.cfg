// b51e -- WHO unloads the effect set after the map-load exec.
//
// ANSWERED (second run, 16:29, with engine Patch 272's per-frame census):
//     loaded types 0 -> 35 of 35, at frame
//     r_particledesc callback: "classic" -> "classic" (cls.state 3)
//     R_Particles_KillAllEffects: unloading 35 types
//     Sending stringcmd prespawn 1 0 0
//     loaded types 35 -> 0 of 35, at frame
// cl_parse.c forces the callback once the world is loaded, by the cvar's
// ALIAS r_particlesdesc.  The file now doubles as the regression test for the
// fix: with r_part_keepuser 1 every P1 probe must read "exists", S5 must read
// "exists", and S6 (r_part_keepuser 0) must read "".
//
// (p_script.c line numbers below predate Patch 272, which inserted about
// ninety lines of census and prints above R_ParticleDesc_Callback -- search
// by symbol.)
//
// b51d proved the shape of the fault: the CSQC exec at CSQC_WorldLoaded parses
// (the ftesurf_dot_blend shader gets built in the same second), and eleven
// seconds later r_exportalleffects dumps all 35 types with their names intact
// and EMPTY bodies -- loaded == 0 (p_script.c:2372).  Names intact rules out
// PScript_Shutdown (it frees the table).  The only writer that zeroes loaded on
// every type and keeps the names is R_Particles_KillAllEffects (:3776), whose
// only live caller is the r_particledesc callback (:3821), which Cvar_SetCore
// runs ONLY when the value changes (cvar.c:1019-1046).  Nothing found so far
// changes it.  So: measure instead of arguing.
//
// TWO INSTRUMENTS THAT DO NOT LIE.
//   cvarwatch <cvar>  prints "Cvar Set: <cvar> to <value>" at the TOP of
//                     Cvar_SetCore (cvar.c:909), before the changed check --
//                     so it catches an unchanged re-set too, and it prints
//                     BEGIN/END for every exec (cmd.c:1058, :1170).  BUT IT IS
//                     BLIND TO Cvar_ForceCallback (cvar.c:1753), which never
//                     enters Cvar_SetCore -- and that is exactly the path that
//                     was killing the set.  Its silence in the first run of
//                     this file was not evidence.  The instrument that sees a
//                     forced callback is the engine's census (developer 2,
//                     Patch 272), so `developer 2` above is not optional.
//   emit_test <Name>  with a fresh CASING each time.  The CSQC precache list
//                     matches names with strcmp (pr_csqc.c:3844), so a new
//                     casing takes a new slot and calls P_FindParticleType
//                     fresh (:3858), whose dotless arm compares with stricmp
//                     (p_script.c:654) and refuses a type whose loaded is 0
//                     (:662).  Same casing twice would read the STALE slot.
//
// vbsp_emit_heal 0 is build 51b exactly: exec once at map load and never
// repair.  With the heal on, every kill is patched within a second and the
// probes below would read "exists" whatever happened.
//
// PHASE 1  the map-load window, probed every 500 ms.
// PHASE 2  settled state, one trigger at a time, each followed by a probe:
//   S1 flushshaders         Shader_NeedReload(true) -> Shader_DoReload
//   S2 kill                 respawn: PutClientInServer, whatever the SSQC
//                           re-publishes to serverinfo
//   S3 serverinfo emtest 1  one svc_serverinfo -> CL_CheckServerInfo ->
//                           Cvar_ForceCheatVars
//   S4 r_particledesc classic   an UNCHANGED set (control: must not kill)
//   S5 r_particledesc ""        a CHANGED set (control: MUST kill, and the
//                               probe must read "" -- proves the probe)

log_dir  "logs"
log_name "b51e"
log_enable 1

developer 2
log_developer 1
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000
cl_maxfps 0
cl_idlefps 0
cl_yieldcpu 0
sv_cheats 1

// `set`, not a bare name: the CSQC registers this cvar at map load, and the
// first run of this file used the bare form before default.cfg created the
// cvar at boot -- "Unknown command", and the whole point of the run was lost.
// `set` works whether or not something has created it, and registercvar
// keeps the value.
set vbsp_emit_heal 0
cvarwatch r_particledesc
cvarwatch r_particlesystem

map surf_anubis
waitmap 600

echo ^5=== P1 T+0
emit_test Dustmote_0 1
waitms 500
echo ^5=== P1 T+500
emit_test DUstmote_0 1
waitms 500
echo ^5=== P1 T+1000
emit_test DUSTmote_0 1
waitms 500
echo ^5=== P1 T+1500
emit_test DUSTMote_0 1
waitms 500
echo ^5=== P1 T+2000
emit_test DUSTMOte_0 1
waitms 500
echo ^5=== P1 T+2500
emit_test DUSTMOTe_0 1
waitms 500
echo ^5=== P1 T+3000
emit_test DUSTMOTE_0 1
waitms 1000
echo ^5=== P1 T+4000
emit_test dUstmote_0 1
waitms 1000
echo ^5=== P1 T+5000
emit_test duStmote_0 1
waitms 1000
echo ^5=== P1 T+6000
emit_test dusTmote_0 1
waitms 2000
echo ^5=== P1 T+8000
emit_test dustMote_0 1
waitms 1000
echo ^5=== P1 dump
r_exportalleffects
waitms 1000

echo ^5=== S0 console exec at RESTRICT_LOCAL, then probe
exec particles/ftesurf.cfg
waitms 1500
emit_test dustmOte_0 1
waitms 1000

echo ^5=== S1 trigger: flushshaders
flushshaders
waitms 2500
emit_test dustmoTe_0 1
waitms 1000

echo ^5=== S2 trigger: kill
kill
waitms 2500
emit_test dustmotE_0 1
waitms 1000

echo ^5=== S3 trigger: serverinfo emtest 1
serverinfo emtest 1
waitms 2500
emit_test dUSTMOTE_0 1
waitms 1000

echo ^5=== S4 trigger: r_particledesc classic (unchanged set)
r_particledesc classic
waitms 2500
emit_test duSTMOTE_0 1
waitms 1000

// no semicolons inside an echo: the cbuf splits on them, and the first run of
// this line produced `Unknown command "with"`.
echo ^5=== S5 trigger: r_particledesc "" (changed set -- the callback MUST fire, and with Patch 272 it must NOT unload ours)
r_particledesc ""
waitms 2500
emit_test dusTMOTE_0 1
waitms 1000
r_particledesc classic
waitms 1000

echo ^5=== S6 control: r_part_keepuser 0 then the same changed set -- the old engine, MUST unload ours
r_part_keepuser 0
r_particledesc ""
waitms 2500
emit_test DUstMOTE_0 1
waitms 1000
r_particledesc classic
r_part_keepuser 1
waitms 1000

// The actual site, bisected on ONE binary.  S6 only bisects the changed-set
// analogue at ca_active; this is the map-load pass at cl_parse.c:1903.
//   P2  r_part_keepuser 0 + a map change: the 16:29 picture again --
//       `unloaded 35, kept 0 (r_part_keepuser 0)`, probe "".  (The census
//       may not print 0 -> 35 -> 0 here: the parse and the kill can land in
//       the same frame.)
//   P3  r_part_keepuser 1 + another map change: `unloaded 0, kept 35` (once
//       -- P2 left them dead, so the cls.state 2 pass at CL_ClearState has
//       nothing to keep; b51b.log's map changes show that pass keeping 35
//       when they are alive), census 0 -> 35, the CSQC re-exec redefines
//       them without a `discarded` line, probe exists.
// Different maps each time: `map x` twice on the same map does not reload.
echo ^5=== P2 r_part_keepuser 0 and a map change -- the old engine at the real site
r_part_keepuser 0
map surf_boreas
waitmap 600
waitms 2500
emit_test dUSTmote_0 1
waitms 1000
echo ^5=== P3 r_part_keepuser 1 and another map change -- kept, redefined, alive
r_part_keepuser 1
map surf_anubis
waitmap 600
waitms 2500
emit_test dusTMote_0 1
waitms 1000

// The dump used to run straight after S6, which had just unloaded the set, so
// export.cfg was always 35 empty bodies whatever the engine did.  After P3 the
// set is alive again and the file on disk is the live set.
echo ^5=== END
r_exportalleffects
waitms 1000
quit
