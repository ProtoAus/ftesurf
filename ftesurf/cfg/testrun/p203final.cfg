// Patch 203 verification.  One launch, three maps.
cfg_save_auto 0
developer 0
log_developer 1
cl_yieldcpu 0
cl_maxfps 0
vid_vsync 0
r_drawviewmodel 0
con_notifytime 0
crosshair 0

waitms 1500

// ---- 1. surf_kitsune: the crossing, at map speed --------------------------
map surf_kitsune
waitmap 120
waitms 1200
echo "### FINAL kitsune-loaded"
r_speeds 2
waitms 300
wait 120
r_speeds_dump
clear
r_speeds 0
waitms 200

cmd sl_goto 1
waitms 80
echo "### FINAL kitsune-crossing"
cmd setpos
waitms 200
cmd setpos
waitms 400
screenshot p203f_kitsune_exit
waitms 400
echo "### FINAL kitsune-done"

// ---- 2. surf_tripportals: 116 doors, the stress case ----------------------
map surf_tripportals
waitmap 180
waitms 1500
echo "### FINAL trip-loaded"
r_speeds 2
waitms 300
wait 120
r_speeds_dump
clear
r_speeds 0
waitms 300
screenshot p203f_tripportals
waitms 400
echo "### FINAL trip-done"

// ---- 3. surf_demise: a map with no portals at all, unchanged --------------
map surf_demise
waitmap 180
waitms 1500
echo "### FINAL demise-loaded"
r_speeds 2
waitms 300
wait 120
r_speeds_dump
clear
r_speeds 0
waitms 300
screenshot p203f_demise
waitms 400
echo "### FINAL demise-done"

waitms 400
quit
