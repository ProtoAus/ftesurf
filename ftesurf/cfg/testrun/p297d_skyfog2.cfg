cfg_save_auto 0
// Patch 297d -- REDO of p297c, whose vantage had no skyroom pixels in it.
//
// WHY 297c WAS VOID, by its own pre-registered read-out: arm 3 (vbsp_skyroom 0)
// matched arm 1 within the noise, i.e. there was no skyroom on screen at all --
// the camera was in an enclosed courtyard in the RAIN, and the rain put the
// repeat-control floor at 29.57% of pixels.  Guessed vantage, void run.
//
// THESE VANTAGES ARE DERIVED, NOT GUESSED: the three largest sky-flagged faces
// on the world model, with the camera 900 units in front of each along the
// face's own plane normal, looking straight at it.  Sky fills the frame by
// construction, so the skyroom must be on screen.
//
// WHAT ARM 2 ACTUALLY MODELS.  `skyroomfog 0` sets density 0, which makes
// R_DrawSkyroom's guard (gl_warp.c:368) fail, and the skyroom then INHERITS the
// main view's fog -- 15000 end / -2500 start.  At the skybox room's real range
// (nearest face 264u, median 3510u from the sky_camera) that leaves the town
// 63-84% visible.  Which is exactly the reported picture.  So:
//
//   ARM1 != ARM2  -> skyroom fog works; what Lex sees is something else.
//   ARM1 == ARM2  -> the skyroom fog is inert even though the renderer holds it
//                    (`Current skyroomfog 23.4375 ... bias 11.7188`), and arm 2
//                    IS the bug, reproduced on purpose.
//
// Judged on MEAN COLOUR, not a pixel diff: fully-fogged skybox is a flat
// 41 66 90 (lum 62.4), so the arms separate in the mean even with rain in
// frame.  Arm 4 restores arm 1 and is the floor for every claim above.
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000
wait 200

developer 1
log_developer 1
log_enable 1
log_dir logs
log_name p297d_skyfog2
cl_maxfps 0
cl_idlefps 0
sv_cheats 1
con_notifylines 0
con_notifytime 0.01
r_drawviewmodel 0

map surf_tensor2
waitmap 600
waitms 9000
waitms 3000
noclip
waitms 1000

alias v1 "setpos -13436 -13312 -3976 0 180 0; waitms 2500"
alias v2 "setpos -2940 -11673.6 6080 0 180 0; waitms 2500"
alias v3 "setpos -9212 -12774.4 -3929.6 0 180 0; waitms 2500"

// ---- ARM 1: default ----
echo ^5=== ARM 1: default (skyroomfog 23.4375 live)
v1
screenshot p297d_a1_default_v1
v2
screenshot p297d_a1_default_v2
v3
screenshot p297d_a1_default_v3

// ---- ARM 2: skyroom fog off -> skyroom inherits the MAIN fog ----
skyroomfog 0
echo ^5=== ARM 2: skyroomfog 0 -- models the reported bug
v1
screenshot p297d_a2_nofog_v1
v2
screenshot p297d_a2_nofog_v2
v3
screenshot p297d_a2_nofog_v3

// ---- ARM 3: no skyroom at all -- proves skyroom pixels exist ----
vbsp_skyroom 0
echo ^5=== ARM 3: vbsp_skyroom 0 -- MUST differ from ARM 1 or the vantage is void again
v1
screenshot p297d_a3_noskyroom_v1
v2
screenshot p297d_a3_noskyroom_v2
v3
screenshot p297d_a3_noskyroom_v3

// ---- ARM 4: repeat control ----
vbsp_skyroom 1
skyroomfog 23.4375 0.160784 0.258824 0.352941 1 11.7188
echo ^5=== ARM 4: restored -- repeat control for ARM 1
v1
screenshot p297d_a4_repeat_v1
v2
screenshot p297d_a4_repeat_v2
v3
screenshot p297d_a4_repeat_v3

echo ^5=== END OF RUN ===
waitms 500
quit
