// Build 51b -- does the emitter subsystem draw anything at all, ever.
//
// THE ONE QUESTION.  particles/ftesurf.cfg is now loaded by cl_emit.qc's
// Emit_LoadForMap via localcmd at map load, instead of by `exec` from
// cfg/default.cfg at boot.  The boot exec created zero effects because a
// config handed to the particle system before Renderer_Start has run is
// discarded in silence (p_script.c:1141-1170; r_part.c:684 says it is
// deliberate; cl_main.c:8127 drains default.cfg, :8236 starts the renderer).
//
// r_partinfo is the instrument.  emit_list's counters are LOAD-time and can
// report hundreds of healthy emitters into a dead pool -- they already did,
// for three builds.  The number that cannot lie is the free count: 65536 means
// nothing was ever allocated.
//
// VANTAGE A IS NOT CHOSEN BY EYE.  -307 -558 -5184 on surf_anubis puts 33
// env_smokestack within 1500 units, counted out of the entity lump by
// ftesurf-3d after my own first "control" turned out to have a MAX of 0
// emitters in range and read as a dead system.

log_dir  "logs"
log_name "b51b"
log_enable 1

developer 1
log_developer 1
vid_fullscreen 0
vid_width 1280
vid_height 720
vid_restart
waitms 3000
cl_maxfps 0
cl_idlefps 0
cl_yieldcpu 0
sv_cheats 1

// ---- 0: the twenty-line proof, before anything else ----------------------
// emit_test bypasses the whole emitter file -- no lump walk, no cull, no
// budget, no accumulator.  One handle, one pointparticles at your feet.
//   "EFFECT DOES NOT EXIST" -> the load still is not reaching the engine.
//   "effect exists" + particles -> the diagnosis was right and the fix works.
map surf_anubis
waitmap 600
waitms 8000
noclip
waitms 1000
setpos -307 -558 -5184 0 90 0
waitms 4000

echo ^5=== 0  emit_test dustmote_0, then fire, then stackjet_0
emit_test dustmote_0 400
waitms 500
emit_test fire 200
waitms 500
emit_test stackjet_0 200
waitms 1500
r_partinfo
waitms 1000
screenshot b51b_test_x
waitms 1000
screenshot b51b_test
waitms 1500

// ---- A: 33 torches in frame, drawn by the real emitters ------------------
// Reload so the emit_test particles are gone and only Emit_Frame's own output
// is in the pool.  `map` twice on the SAME map does not reload -- go via
// another map first.
map surf_boreas
waitmap 600
waitms 6000
echo ^5=== B  surf_boreas spawn -- the snow, and it has never been seen
emit_list
waitms 500
r_partinfo
waitms 1500
screenshot b51b_boreas_x
waitms 1000
screenshot b51b_boreas
waitms 1500

map surf_anubis
waitmap 600
waitms 8000
noclip
waitms 1000
setpos -307 -558 -5184 0 90 0
waitms 6000
echo ^5=== A  surf_anubis, 33 env_smokestack within 1500 -- the torches
emit_list
waitms 500
r_partinfo
waitms 1500
screenshot b51b_anubis_x
waitms 1000
screenshot b51b_anubis
waitms 1500

echo ^5=== END ===
waitms 500
quit
