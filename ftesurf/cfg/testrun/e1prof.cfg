cfg_save_auto 0
// E1, follow-up: how many ways past the ranked input profile, and which of them
// need the client to lie.
//
// e1strafe.cfg measured arm D -- in_rawinput 0 ; in_restart ; in_rawinput 1
// leaves the cvar reading 1 with rawmicecount 0, the legacy path live, injected
// motion landing in full, and the server reporting `noprofile 0 would 0`.  That
// one needs NO lie: the client reports its cvar honestly and the fact that
// matters (the GRANT) is simply not on the wire.
//
// This file measures the other two, which do need a lie, and it needs no
// injection and no window focus -- it asks the server directly.
//
// SV_ProfileBroken (sv_timer.qc:5423) parses the client's `inprof` userinfo and
// hands fields 1..4 to FS_ProfileBroken (sh_defs.qc:1491), which is:
//
//     if (have & IPH_RAW)    if (raw <= 0)  return TRUE;
//     if (have & IPH_FILTER) if (filt != 0) return TRUE;
//     if (have & IPH_ACCEL)  if (acc != 0)  return TRUE;
//     return FALSE;
//
// EVERY ARM IS BEHIND `have`, AND `have` IS FIELD 1 OF A STRING THE CLIENT SENT.
// So have = 0 skips all three tests whatever the other fields say.  The mask is
// not an oversight -- in_rawinput is registered in in_win.c and nowhere else, so
// a Linux/SDL client genuinely has none of the three cvars and a sentinel could
// not express that (-1 is a legal m_accel).  sh_defs.qc:1295 says so outright:
// "AND IT IS CLIENT-ASSERTED, WHICH IS THE HONEST LIMIT OF IT."  What this arm
// measures is how wide that limit actually is.
//
// PRE-REGISTERED:
//   ARM 1  in_rawinput 0, client reports honestly.  The key should read
//          "1 7 0 0 0 <bad>" and `cmd timer` MUST report would 1 -- the check
//          working.  Without this arm the next one proves nothing.
//   ARM 2  same cvars, one console command: setinfo inprof "1 0 0 0 0 <bad>".
//          `cmd timer` MUST report would 0.  Raw input is still off; only the
//          mask changed.
//   ARM 3  setinfo inprof "" -- the empty key, which SV_ProfileBroken returns
//          FALSE for at :5428 so a client predating build 72 is not demoted.
//          MUST also report would 0.
//   ALL    CSQC must not overwrite the forged key.  Rec_ProfileReport sends on
//          CHANGE only (cl_replay.qc:451-456), so with no cvar touched after the
//          setinfo the forgery should stand -- if it does not, the window is
//          narrow rather than closed, and that is a different finding worth
//          having.
//
// FALSIFIED IF arm 1 reports would 0 (the check never worked and arms 2-3 mean
// nothing) or if arm 2 reports would 1 (the mask is validated somewhere I did
// not find).

exec cfg/testrun/_quiet.cfg

developer 1
log_developer 1
log_enable 1
log_dir logs
log_name e1prof
cl_maxfps 100
sv_cheats 0
con_notifylines 0
con_notifytime 0.01

wait 200
map bhop_eazy
waitmap 600
waitms 5000

echo ^5=== E1PROF: baseline, whatever this install is set to
cmd timer
waitms 1000

echo ^5=== E1PROF ARM 1: in_rawinput 0, reported honestly.  Expect would 1.
in_rawinput 0
in_restart
waitms 2500
cmd timer
waitms 1500

echo ^5=== E1PROF ARM 2: same cvars, have mask forged to 0.  Expect would 0.
setinfo inprof "1 0 0 0 0 0"
waitms 2000
cmd timer
waitms 1500

echo ^5=== E1PROF ARM 3: the empty key.  Expect would 0.
setinfo inprof ""
waitms 2000
cmd timer
waitms 1500

// Put raw input back properly -- the cvar alone does not re-enumerate.
in_rawinput 1
in_restart
waitms 1500
cmd timer
waitms 1000

echo ^5=== END OF RUN ===
waitms 1000
quit
