// FTESurf build 21 -- the hopped-start RE-ARM, both arms in one session.
//
// The thing being shown is a difference, not a state, so both arms run the
// IDENTICAL gesture and only run_rearmhop changes.  Arm B is the control and it
// must reproduce build 20 exactly -- a test that reproduces the OLD behaviour is
// worth more than one that shows the new.
//
// The gesture, four steps, and each one is load-bearing:
//   1. zone_goto 0     arm in the start box.  surf_666 spawns you OUTSIDE every
//                      start zone (arm zone -1), so walking from spawn never
//                      arms and the whole test would run against an idle timer.
//   2. stand ~0.9s     so the FIRST jump is a legal initial jump (dwell >= 0.25)
//                      and cannot itself be what taints the attempt.
//   3. +jump ~1.4s     pm_autobunny re-jumps on the landing tick, so the server
//                      never observes FL_ONGROUND: run_t_groundat stays 0, dwell
//                      reads 0, and every hop after the first is flagged.
//                      => "hopped start", hopped 1
//   4. stand ~1.2s     the re-arm.  Arm A must clear it; arm B must not.
//   5. +back ~1.6s     OUT of the box, which starts the run.  surf_666's start
//                      zone reaches further in +x than -x, so +back is the
//                      direction that actually leaves it (build 20 found this
//                      the hard way with +forward).
//
// practice at step 5 is the payoff and the only line that matters to a player:
// A must read 0, B must read 1.
//
// run_rearmhop is latched per map in SV_TimerMapInit, so the two arms need a map
// RELOAD between them -- setting it mid-map would change nothing and the test
// would quietly measure the same arm twice.
//
// cmd round-trips to the server while echo is client-side and immediate, so
// every report gets a waitms after it: section banners are not a timeline.

cfg_save_auto 0
log_name b21a
developer 0
con_notifytime 0

pm_autobunny 1

// ===========================================================================
echo "=========== ARM A -- run_rearmhop 1 ==========="
// ===========================================================================
set run_rearmhop 1

wait 200
map surf_666
waitmap 60
waitms 500

echo "--- A0: cvars as booted (all four must be 1 / 0.25, none of them empty) ---"
run_rearmhop
run_starthop
run_starthop_strict
run_prestrafe_time
waitms 300

cmd zone_goto 0
waitms 900

echo "--- A1: armed, nothing done yet.  expect armed / hopped 0 ---"
cmd timer
waitms 600

+jump
waitms 1400
-jump
waitms 400

echo "--- A2: bhopped in the box.  expect hopped 1, jumps > 1 ---"
cmd timer
waitms 600

waitms 1200

echo "--- A3: stood still.  expect hopped 0 and 'start re-armed' above ---"
cmd timer
waitms 600

+back
waitms 1600
-back
waitms 400

echo "--- A4: walked out.  expect running / practice 0 ---"
cmd timer
waitms 800

// ===========================================================================
echo "=========== ARM B -- run_rearmhop 0 (build 20 control) ==========="
// ===========================================================================
set run_rearmhop 0

map surf_666
waitmap 60
waitms 500

echo "--- B0: cvar ---"
run_rearmhop
waitms 300

cmd zone_goto 0
waitms 900

echo "--- B1: armed ---"
cmd timer
waitms 600

+jump
waitms 1400
-jump
waitms 400

echo "--- B2: bhopped in the box.  expect hopped 1 ---"
cmd timer
waitms 600

waitms 1200

echo "--- B3: stood still.  expect hopped STILL 1 -- no re-arm ---"
cmd timer
waitms 600

+back
waitms 1600
-back
waitms 400

echo "--- B4: walked out.  expect running / practice 1 ---"
cmd timer
waitms 800

echo "=========== done ==========="
waitms 500
quit
