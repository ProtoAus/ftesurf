// ***************************************************************************
//  PATCH 269c -- verify BOTH properties, in all THREE modes.
//
//  269 fixed the speed readout and broke the energy readout, and it was
//  reported as done because only the speed was measured.  So this run refuses
//  to check one thing.  Six sections, a 3x2 matrix, one map, one session:
//
//                        speed after a tap        energy across a jump
//     velblend 0 (269)   clean                    climbs ~4 units    <- shipped, wrong
//     velblend 1 (pre)   sweeps 0..4              flat to 0.02       <- old, wrong
//     velblend 2 (269c)  clean                    flat to 0.02       <- claim
//
//  A run that produces that whole table is the evidence.  Any cell that comes
//  out the same in all three modes means the mode switch is not reaching the
//  code and the run proves nothing -- the two WRONG rows are as load-bearing
//  as the right one, because they are what shows the measurement can see a
//  difference at all.
//
//  Energy is not read off a HUD row here; it is computed from the dump as
//  E = simorg_z + |simvel|^2 / (2*800), which is Strafe_Energy exactly, and
//  the number that matters is its SPREAD WITHIN ONE COMMAND FRAME -- that is
//  the flicker a player sees, and it is invisible to any per-command sample.
// ***************************************************************************

log_developer 0

waitms 2000

map surf_colin_blaster_69000
waitmap 240
wait 60

cl_maxfps 0
cl_idlefps 0
cl_yieldcpu 0
cl_netfps 66.6667
hud_predicted 1
hud_update -1
hud_round 1
hud_debug 1
hud_speed 1
hud_energy 1
hud_energy_ref 1
wait 200

// ===========================================================================
echo ^5=== A0: velblend 0 -- STAND after a tap.  Expect CLEAN (269's win).
// ===========================================================================
cl_predict_velblend 0
+forward
waitms 400
-forward
waitms 1000
cl_predtrace 1200
waitms 16000

// ===========================================================================
echo ^5=== B0: velblend 0 -- JUMP.  Expect energy to CLIMB ~4 units.
// ===========================================================================
cl_predict_velblend 0
waitms 800
cl_predtrace 1200
+jump
waitms 120
-jump
waitms 16000

// ===========================================================================
echo ^5=== A1: velblend 1 -- STAND after a tap.  Expect the 0..4 SWEEP.
// ===========================================================================
cl_predict_velblend 1
+forward
waitms 400
-forward
waitms 1000
cl_predtrace 1200
waitms 16000

// ===========================================================================
echo ^5=== B1: velblend 1 -- JUMP.  Expect energy FLAT.
// ===========================================================================
cl_predict_velblend 1
waitms 800
cl_predtrace 1200
+jump
waitms 120
-jump
waitms 16000

// ===========================================================================
echo ^5=== A2: velblend 2 (269c) -- STAND after a tap.  Expect CLEAN.
// ===========================================================================
cl_predict_velblend 2
+forward
waitms 400
-forward
waitms 1000
cl_predtrace 1200
waitms 16000

// ===========================================================================
echo ^5=== B2: velblend 2 (269c) -- JUMP.  Expect energy FLAT.  THE CLAIM.
// ===========================================================================
cl_predict_velblend 2
waitms 800
cl_predtrace 1200
+jump
waitms 120
-jump
waitms 16000

// ===========================================================================
echo ^5=== C2: velblend 2 -- STRAFE-JUMP, so the blend has HORIZONTAL work too.
// A jump only exercises v_z.  Moving while airborne means both halves of the
// blend are changing in x and y as well, which is the case a fix that only
// happens to work for vertical motion would fail.
// ===========================================================================
cl_predict_velblend 2
waitms 800
+forward
cl_predtrace 1200
+jump
waitms 120
-jump
waitms 900
-forward
waitms 16000

cl_predict_velblend 2
echo ^5=== END OF RUN ===
wait 20
quit
