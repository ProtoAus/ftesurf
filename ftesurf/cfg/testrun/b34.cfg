// BUILD 34 -- the three QC reports, on a map that can answer all of them.
//
//   A  the top-right block.  surf_kitsune's mapmeta row is
//        meta surf_kitsune 1 0 9 1 4 115 <uuid> 1 rank
//      i.e. tier 1, NOT linear, 9 stages, from a ranked leaderboard -- so the
//      block has to read "FTESurf / surf_kitsune / Tier 1 / 9 stages", with no
//      "?" or "~" suffix because the tier is a ranking rather than an estimate.
//      The stage count is checked against the ZONE file rather than that row:
//      Zone_TrackSegs(0) is what the HUD reads and mapmeta is only its fallback.
//
//   B  the demo player.  Paused is the longest string it can draw, and it is the
//      one that used to run under the close button.  Photographed at three
//      scales, because the overflow only ever showed above hud_scale 1 and a fix
//      that only works at one scale is not a fix.
//
//   C  the live segment rows.  A saveloc drops the player back onto a ramp at
//      speed, which is the only way a config can reach ramp contact -- the stat
//      comes from the engine's pmove and there is nothing to fake.
//
// developer 0 deliberately: see the note in p226.cfg.  A VBSP entity lump raises
// 4033 "is not a field" warnings and logging them turns a 3s load into 40s.

log_enable 1
log_dir "logs"
log_name "b34"
cfg_save_auto 0
vid_fullscreen 0
scr_sshot_type png

wait 200
map surf_kitsune
waitmap 400
waitms 4000

echo ""
echo "=== the new cvars ==="
hud_mapinfo
hud_mapinfo_x
hud_mapinfo_y
hud_seq_live
hud_watch_scale
con_completionenter
con_completiondown
wait 6

echo ""
echo "=== A: what the serverinfo says the map is ==="
echo "--- (maptier must be 1, mapstages 9, maplinear 0, maptiersrc rank) ---"
serverinfo
wait 6

// ------------------------------------------------------------------ A --------
crosshair 1
waitms 1500
screenshot b34_a_mapinfo
waitms 1500

// ------------------------------------------------------------------ B --------
// `replay` on its own wants data/runs/<map>/main/, and this map has only stage
// legs recorded -- so it must be asked for one by name or it finds nothing and
// the chrome never opens.  (That is what the first run of this cfg photographed:
// a live player, not a replay.)
replay stage 2
waitms 2500
replay pause
waitms 1200
screenshot b34_b_paused_scale1
waitms 1200

hud_watch_scale 2
waitms 1200
screenshot b34_b_paused_scale2
waitms 1200

hud_watch_scale 3
waitms 1200
screenshot b34_b_paused_scale3
waitms 1200

hud_watch_scale 1
replay stop
waitms 1000

// ------------------------------------------------------------------ C --------
// A saveloc is the only way a config can reach ramp contact: the stat comes from
// the engine's pmove and there is nothing to fake.  save004 was taken mid-surf at
// 1216 u/s, so the player is put back in flight there and lands on a plane a
// moment later -- which moment is not predictable, so this samples a burst rather
// than guessing one.
//
// A LIVE ROW IS IDENTIFIABLE ON SIGHT: the board row is the only row in the
// column that carries the word "board", and the ramp row under it has a duration
// with no percentage beside it.  Both are drawn dimmer than a committed row.
sv_cheats 1
cmd sl_load
waitms 200
screenshot b34_c_ride_0
waitms 250
screenshot b34_c_ride_1
waitms 250
screenshot b34_c_ride_2
waitms 250
screenshot b34_c_ride_3
waitms 250
screenshot b34_c_ride_4
waitms 250
screenshot b34_c_ride_5
waitms 250
screenshot b34_c_ride_6
waitms 250
screenshot b34_c_ride_7
waitms 500

echo ""
echo "=== b34 done ==="
wait 20
quit
