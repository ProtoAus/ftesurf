// FOG03 -- why did surf_legends show ZERO pixel change between fog on and off?
//
// fog02 read back `Current fog 2700 (grey .753, a 1, bias 0)` on surf_legends and
// then the on/off screenshot pair diffed to 0.0% of pixels outside the HUD --
// byte-identical scene.  bhop_bowling diffed 99.8% and surf_sidistic 14.6% with
// the same code, so it is not "fog never works".
//
// Two candidates and they need separating, because they have opposite fixes:
//   (a) fog is not DRAWN on this map -- the toggle worked, both shots unfogged
//   (b) fog is not turned OFF by the toggle here -- both shots fogged
// fog02 never printed `fog` after the toggle, so it cannot tell them apart.
//
// So: print the state at every step, and drive the engine DIRECTLY with a fog
// nobody could miss -- bright red, ending at 800 units.  If red does not appear,
// the engine is not drawing fog on this map and the gamecode is innocent.  If it
// does, the gamecode's toggle is at fault.
//
// surf_legends is also the only one of the three with a sky_camera, so the
// skyroom pass is the obvious suspect for a map-specific difference -- hence the
// vbsp_skyroom 0 step.  (R_DrawSkyRoom does `r_refdef = oldrefdef` on the way
// out, which should restore globalfog, but "should" is what is being tested.)

log_enable 1
log_dir "logs"
log_name "fog03"
cfg_save_auto 0
cl_idlefps 0
cl_maxfps 0
vid_fullscreen 0
con_notifytime 0
con_notifylines 0
con_notifytime_error 0
vbsp_fog 1
wait 200

map surf_legends
waitmap 1800
waitms 9000

echo ^5--- step 1: as the map loads it (expect 2700, a 1, bias 0)
fog
waitms 400
screenshot fog03_1_mapfog
waitms 800

echo ^5--- step 2: vbsp_fog 0, then PRINT to prove the toggle landed
vbsp_fog 0
waitms 1500
fog
waitms 400
screenshot fog03_2_toggledoff
waitms 800

echo ^5--- step 3: engine driven directly -- RED fog ending at 800 units
echo ^3--- if this frame is not obviously red, the engine is not drawing fog here
fog 800 1 0 0 1 0
waitms 1200
fog
waitms 400
screenshot fog03_3_redfog
waitms 800

echo ^5--- step 4: same red fog with the 3D skybox off
vbsp_skyroom 0
waitms 1500
fog 800 1 0 0 1 0
waitms 1200
screenshot fog03_4_redfog_noskyroom
waitms 800
vbsp_skyroom 1
waitms 1000

echo ^5--- step 5: control -- bhop_bowling, which DID show fog, same red probe
map bhop_bowling
waitmap 1800
waitms 9000
fog 800 1 0 0 1 0
waitms 1200
screenshot fog03_5_bowling_redfog
waitms 800

echo ^5=========== done ==================================================
log_enable 0
