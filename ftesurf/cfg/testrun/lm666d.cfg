// LM666D -- light_here on the two groups the r_fullbright A/B separated.
//
// From the user's own save005 vantage, lm666.cfg measured seven screen regions
// under r_fullbright 1 and gl_overbright 0 and got two clean populations:
//
//   group A  brown walls, tiled floor, ceiling
//            r_fullbright multiplies them 4.0x - 6.6x, gl_overbright 0 does nothing
//   group B  the pale panel and the speckled brick
//            r_fullbright does NOTHING (ratio 0.97-1.01), gl_overbright 0 halves
//            them EXACTLY (223.0->112.9, 141.7->71.0, 130.8->66.1)
//
// Group B behaves as though the only lighting term on it is the overbright
// constant -- which is what a surface sampling a white lightmap looks like.
// r_texdiag says neither reported material is denied one, so light_here is here
// to read the fields that claim decides on: lightmaptexturenums[0], the styles,
// and the decoded mean of the surface's own lightmap block.
//
// The yaws are derived from the screenshot: 1920px at 90 degrees horizontal FOV,
// so a feature 540px right of centre is 29 degrees right of the view yaw, and in
// Quake angles right is DECREASING yaw.  Each probe prints the texture it hit, so
// the aim is checked by the output rather than trusted.

log_enable 1
log_dir "logs"
log_name "lm666d"
cfg_save_auto 0
cl_idlefps 0
vid_fullscreen 0
developer 1
log_developer 1
con_notifytime 0
con_notifylines 0
con_notifytime_error 0

wait 200

map surf_666
waitmap 1800
waitms 9000
sv_cheats 1
waitms 400
noclip
waitms 400
setpos -100.325 -13112.070 11281.580 3.148 -130.446 0
waitms 2000

echo ^5########## GROUP B -- the surfaces that ignore r_fullbright ########
setpos -100.325 -13112.070 11281.580 3.0 -160.0 0
waitms 900
light_here B-brick-right
waitms 400
setpos -100.325 -13112.070 11281.580 20.0 -163.0 0
waitms 900
light_here B-brick-lower
waitms 400
setpos -100.325 -13112.070 11281.580 -10.0 -105.0 0
waitms 900
light_here B-pale-panel
waitms 400

echo ^5########## GROUP A -- the surfaces that respond normally ###########
setpos -100.325 -13112.070 11281.580 3.0 -95.0 0
waitms 900
light_here A-brown-wall
waitms 400
setpos -100.325 -13112.070 11281.580 30.0 -120.0 0
waitms 900
light_here A-tiled-floor
waitms 400
setpos -100.325 -13112.070 11281.580 -20.0 -130.0 0
waitms 900
light_here A-ceiling
waitms 400

echo ^5########## a sweep, in case the aims above missed ###################
setpos -100.325 -13112.070 11281.580 0.0 -140.0 0
waitms 700
light_here sweep-140
waitms 300
setpos -100.325 -13112.070 11281.580 0.0 -150.0 0
waitms 700
light_here sweep-150
waitms 300
setpos -100.325 -13112.070 11281.580 0.0 -170.0 0
waitms 700
light_here sweep-170
waitms 300
setpos -100.325 -13112.070 11281.580 0.0 -180.0 0
waitms 700
light_here sweep-180
waitms 300
setpos -100.325 -13112.070 11281.580 10.0 -175.0 0
waitms 700
light_here sweep-175d
waitms 300

echo ^5=== lm666d done ===
wait 30
quit
