cfg_save_auto 0
// Build 64 -- SMOKE TEST AGAINST THE LIVE SERVICE, after deploying stage 3.
//
// Not a feature test.  The five lobbies were just restarted onto a new
// qwprogs.dat and csprogs.dat and had sv_guidkey added, and the only
// responsible next step is to check that a client can still JOIN one before
// telling anybody it is ready.
//
// It joins lobby 4 (bhop_eazy, 27540), which is the map the board already has
// rows on -- so the scoreboard it opens is fetching the REAL directory for the
// REAL map from a REAL lobby, which is the whole chain end to end bar a finish.
//
// PREDICTIONS, registered before the run:
//   1  the client connects and spawns (a broken progs deploy shows up here as
//      a disconnect or a QC error, which is the point of running this at all)
//   2  the Online tab fetches and shows Bob 0:52.500 then Alice 1:01.620 --
//      the same rows stage 2 measured, but now via a live lobby rather than a
//      local map load, so serverkey("map") and lobby_dir are both coming from
//      the live service
//   3  the Segmented tab shows Dave 0:46.500
//
// FALSIFIED IF: the connect fails or the client is dropped (the deploy broke
// the live service and must be rolled back -- the rollback copies are on the
// Pi as qwprogs.dat.b64rollback-*); or the board reads "asking the
// leaderboard..." and never resolves (lobby_dir is not reaching surfd from a
// client that is not on the LAN path the seeded test used).
log_enable 1
log_dir logs
log_name b64live
waitms 5000

// menu_restart, AND THE FIRST CUT OF THIS ARM DIED WITHOUT IT.
//
// FTE initialises menu.dat lazily -- the first time a menu is actually needed
// -- so a config that connects straight away leaves it uninitialised and the
// ENGINE's built-in fallback menu (Join server / Options / Updates / Mods /
// Quit) sits on screen for the whole run.  Unlike menu.dat's own menu, nothing
// closes it on connect.
//
// THAT SILENTLY BLANKS THE ENTIRE HUD, because CSQC_UpdateView gates its whole
// 2D pass on `notmenu` (cl_main.qc:1400 -- the comment there names this as one
// of two things that can blank the HUD).  With a menu up, notmenu is 0 and
// HUD_Draw, Watch_Draw and Scores_Draw are all skipped.
//
// So the run came back with the world rendering, no HUD, no board, and
// `cols 0` in the status line -- which reads exactly like "the deploy broke
// CSQC" and is in fact the harness never taking the menu down.  The log said
// `FTESurf CSQC loaded` the whole time.
menu_restart
waitms 1500

lobby_dir "http://192.168.1.102:8084"
vid_conwidth 1600
vid_conheight 900
hud_scale 2

connect play.proto.bar:27540
waitms 18000

// ...AND THEN TAKE THE MENU DOWN, which menu_restart alone does NOT do.
//
// menu_restart fixes WHICH menu is up (menu.dat's own rather than the engine's
// fallback) and that is worth having, but it leaves it UP -- the screenshot
// after the second cut still showed the FTESurf menu, captioned, in its own
// words, "esc: back to bhop_eazy".  notmenu stays 0 either way and the HUD and
// the board stay skipped.
//
// Two separate causes, one symptom, and fixing only the first looks exactly
// like fixing nothing: both runs printed `cols 0` and neither drew a board.
togglemenu
waitms 1500

echo ==== LIVE 1: connected, default Online tab ====
scores open
waitms 3000
scores status
waitms 500
screenshot
waitms 1200

echo ==== LIVE 2: segmented tab (expect Dave 0:46.500) ====
scores tab segmented
waitms 3000
scores status
waitms 500
screenshot
waitms 1200

echo ==== END ====
scores close
waitms 500
disconnect
waitms 1000
log_enable 0
waitms 500
quit
