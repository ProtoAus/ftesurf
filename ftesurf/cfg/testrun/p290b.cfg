// FTESurf p290b -- the grade compiles (prog 1 passes 3), both LUTs load
// (32x32x32), and the output is the scene bit-for-bit.  Two candidates and one
// console test that separates them without a rebuild:
//
//   the STAGE is not running   -- RDF_COLOURCORRECT set but never consumed
//   the SHADER is a no-op      -- W0/W1 or cvar_hl2_colourcorrection reaching it
//                                 as zero, either of which folds the maths to
//                                 out = scene exactly
//
// r_postprocshader is a stage that demonstrably works (it is where postproc_ascii
// lives), and it takes any shader name.  Point it at the SAME generated shader
// with the colour-correction stage switched off:
//
//   B differs from A -> the shader is fine and my stage is the bug
//   B equals A       -> the stage is fine and the shader is the bug
//
// C is the sanity check that the postproc path itself is alive at all on this
// machine, because "both arms identical" is also what a dead stage looks like:
// r_graphics 0 puts postproc_ascii up, which is unmistakable.
cfg_save_auto 0
exec cfg/testrun/_quiet.cfg
developer 1
log_enable 1
log_developer 1
log_dir "logs"
log_name "p290b"
scr_sshot_type png
cl_yieldcpu 0
vid_vsync 0
r_drawviewmodel 0
crosshair 0
con_notifytime 0

waitms 2500
map surf_tensor2
waitmap 240
waitms 8000
sv_cheats 1
noclip
waitms 500

setpos -11684 -12864 13936 0 0 0
waitms 2500

echo "@@@ P290B A -- the map's own grade through my stage"
waitms 1200
screenshot_mega p290b_a 1280 720
waitms 1200

echo "@@@ P290B B -- the same shader through r_postprocshader"
r_colourcorrection ""
waitms 800
r_postprocshader "ftesurf/cc/surf_tensor2_ef3661e2"
waitms 2000
screenshot_mega p290b_b 1280 720
waitms 1200

echo "@@@ P290B C -- is the postproc path alive at all"
r_postprocshader ""
r_graphics 0
waitms 2000
screenshot_mega p290b_c_ascii 1280 720
waitms 1200
r_graphics 1
waitms 1000

echo "@@@ P290B DONE"
waitms 1200
quit
