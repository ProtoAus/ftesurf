cfg_save_auto 0
// Patch 304 -- which end of the ramp the flat base sits at.
//
// WHY THIS RUN EXISTS.  Patch 302 put VRAD's direct light into the leaf ambient
// cube and the target prop went 0.38 -> 1.19 against CS:S's 0.99.  The residual
// 1.19 was traced to the FOLD: res_diffuse (the shader's flat base, applied to
// every vertex regardless of facing) was the mean PLUS the deviation toward the
// light -- roughly the BRIGHTEST face -- so a face turned away from every light
// in the map received the bright-side level.  Measured offline against what VRAD
// would have baked, that prop spanned 0.99 on its best face to 13.6 on its
// worst, which is why no global scale could ever have fixed it.
//
// 304 anchors the base at the UNLIT end and ramps with a HALF-lambert, which is
// what Source does on models.  One cvar drives both halves (the C fold and
// vertexlit.glsl's ramp) so they cannot disagree.
//
// PRE-REGISTERED, from p304pred.py against the real 18 worldlights and the real
// ambient cube at this sample point.  `prop_census stage2_detail02` prints a
// "solved level" line as of this patch; these are the numbers it must print.
//
//   hl2_lt_fold 0 (the falsifier, = pre-304 exactly)
//       base         89.0 107.6 120.4
//       directional  54.0  65.5  74.2
//       lit end     143.0 173.1 194.6      dir  -0.33  0.93 -0.13
//
//   hl2_lt_fold 1 (default)
//       base         13.0  16.9  19.6
//       directional 102.6 121.6 134.1
//       lit end     115.6 138.4 153.7      dir   0.12 -0.99 -0.05
//
// THE CLAIM, STATED SO IT CAN FAIL:
//   1. The BASE FALLS HARD (89 -> 13) and the LIT END ROUGHLY HOLDS (143 -> 116).
//      That is the whole patch: the ramp is being re-anchored, not the model
//      dimmed.  If BOTH fall proportionally this is a global darkening wearing a
//      fold's clothes, and the patch is falsified as stated.
//   2. The direction REVERSES between the arms (+0.93y -> -0.99y).  Fold 1 takes
//      the signed direction unconditionally, so...
//   3. ...toggling hl2_lt_dirsign must NOT move fold 1's numbers AT ALL, while it
//      does move fold 0's.  That is arm G5/G6.
//   4. G3 must reproduce G1 exactly -- proof the live invalidation covers BOTH
//      the C fold and the shader recompile.  If the picture changes but the
//      numbers do not, the shader reloaded and the cache did not, which is the
//      one state this cvar exists to make unreachable.
//   5. The left WALL must not move in any arm.  It is a lightmapped world brush
//      and nothing here can reach it.
vid_fullscreen 0
vid_restart
waitms 3000
wait 200

developer 1
log_developer 1
log_enable 1
log_dir logs
log_name p304a_fold
cl_maxfps 0
cl_idlefps 0
sv_cheats 1
con_notifylines 0
con_notifytime 0.01
r_drawviewmodel 0

map surf_tensor2
waitmap 600
waitms 9000
waitms 3000
noclip
waitms 1000

alias vs12 "setpos -12300.9990 10799.1201 -9654.1191 3.1311 43.4784 0; waitms 2500"

echo ^5=== G1: hl2_lt_fold 1, dirsign 0 -- the shipping pair
hl2_lt_worldlight 1
hl2_lt_dirsign 0
hl2_lt_fold 1
waitms 2500
vs12
screenshot p304a_g1_fold1
waitms 1200
prop_census stage2_detail02
waitms 600

echo ^5=== G2: hl2_lt_fold 0 -- the falsifier, must be pre-304 exactly
hl2_lt_fold 0
waitms 2500
vs12
screenshot p304a_g2_fold0
waitms 1200
prop_census stage2_detail02
waitms 600

echo ^5=== G3: back to 1 -- reversibility of BOTH halves
hl2_lt_fold 1
waitms 2500
vs12
screenshot p304a_g3_fold1_again
waitms 1200
prop_census stage2_detail02
waitms 600

echo ^5=== G4: a SECOND prop, not the one the fold was designed against
prop_census stage2_detail01
waitms 600

echo ^5=== G5: fold 1 + dirsign 1 -- must be IDENTICAL to G1
hl2_lt_dirsign 1
waitms 2500
vs12
screenshot p304a_g5_fold1_dirsign1
waitms 1200
prop_census stage2_detail02
waitms 600

echo ^5=== G6: fold 0 + dirsign 1 -- dirsign DOES move the legacy fold
hl2_lt_fold 0
waitms 2500
vs12
screenshot p304a_g6_fold0_dirsign1
waitms 1200
prop_census stage2_detail02
waitms 600

echo ^5=== G7: worldlight 0 + fold 1 -- the fold re-folds BOUNCE too
hl2_lt_dirsign 0
hl2_lt_fold 1
hl2_lt_worldlight 0
waitms 2500
vs12
screenshot p304a_g7_nowl_fold1
waitms 1200
prop_census stage2_detail02
waitms 600

echo ^5=== G8: worldlight 0 + fold 0 -- the pre-302 baseline for G7
hl2_lt_fold 0
waitms 2500
vs12
screenshot p304a_g8_nowl_fold0
waitms 1200
prop_census stage2_detail02
waitms 600

echo ^5=== END OF RUN ===
waitms 500
quit
