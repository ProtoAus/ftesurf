// ***************************************************************************
// SUPERSEDED BY jit05/jit06 AND ENGINE PATCH 269.  Its A/B RESULT stands --
// hud_predicted 0 really is clean and hud_predicted 1 really does flicker,
// 100/0/104 over three sections -- but the conclusion drawn from it below does
// not.  That A/B identifies which SOURCE the number came from; it does not
// identify the mechanism, and this file treats the two as the same claim.
//
// The mechanism is NOT the extrapolation: cl_predtrace showed that block runs
// ZERO times in 3,200 traced frames.  It is the velocity blend at the end of
// CL_PredictMovePNum, against a network field that is not maintained for your
// own player.  hud_predicted 0 worked because STAT_FS_VELOCITY is the server's
// true velocity and bypasses that blend entirely.
// ***************************************************************************

// BUILD 47 -- the jitter: which SOURCE of velocity is lying?
//
// jit02 REPRODUCED it and pinned the shape.  Standing still after a tap, at
// ~130 fps, for as long as you care to wait:
//
//     vel cmd 734: spd 0.5873   oxy -32713.285 -21504.000
//     vel cmd 734: spd 0.0000   oxy -32713.285 -21504.000
//     vel cmd 736: spd 0.7174   oxy -32713.285 -21504.000
//     vel cmd 736: spd 0.0000   oxy -32713.285 -21504.000
//
// The POSITION is frozen -- identical to three decimals, forever.  The VELOCITY
// flickers.  So the two halves of the predicted state disagree, and it never
// settles; it is still doing it 20 command frames later.  The non-zero sample is
// always the FIRST rendered frame of a command frame, which is why hud_update -1
// cannot fix it: latching per clientcommandframe samples exactly that frame.
//
// Two things are already ruled out by measurement, not by reading:
//   * the input layer -- hud_wishtrace shows fore decaying 179/38/16/0 within
//     four frames of a release and 0 forever after (jit01).
//   * the display latch -- see above.
//
// WHAT IS LEFT is the engine's per-rendered-frame extrapolation: cl_pred.c runs
// one extra PARTIAL command per rendered frame, and pmove_vel comes back from it
// carrying a velocity that produced no displacement.  A player at rest, with
// zero input, cannot gain 0.6 u/s from a partial tick of friction and zero
// acceleration -- so that value is an artifact of the partial tick, not a speed
// the player has.
//
// THIS RUN ASKS THE ONE REMAINING QUESTION: is there a source that does not lie?
// hud_predicted 0 switches HUD_LiveVel from pmove_vel to STAT_FS_VELOCITY -- the
// server's own authoritative velocity, one tick old, with no extrapolation in it
// at all.  If A flickers and B does not, the workaround is one cvar and the
// engine bug is isolated to the extrapolation rather than to the mover.

log_developer 1

waitms 2000

map surf_colin_blaster_69000
waitmap 240
wait 60

cl_idlefps 0
cl_maxfps 0
hud_debug 1
hud_speed 1
wait 60

echo ^5=== A: hud_predicted 1 (shipped) -- the predicted pair, expect the flicker
hud_predicted 1
wait 30
+forward
wait 20
-forward
wait 120
hud_veltrace 300
wait 400

echo ^5=== B: hud_predicted 0 -- the server stat, expect a clean 0
hud_predicted 0
wait 30
+forward
wait 20
-forward
wait 120
hud_veltrace 300
wait 400

echo ^5=== C: back to A, to show B was the variable and not the passage of time
hud_predicted 1
wait 30
+forward
wait 20
-forward
wait 120
hud_veltrace 300
wait 400

echo ^5=== END OF RUN ===
wait 20
quit
