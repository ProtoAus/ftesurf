// ===========================================================================
//  FTESurf -- default.cfg
//  Exec'd before ftesurf.cfg (the saved config), so everything here is a
//  DEFAULT you can override in-game; the saved config wins.
//  Loaded via the cfg/ preference in cl_main.c:7852.
// ===========================================================================

cfg_save_name ftesurf
cfg_save_auto 1

// DO NOT persist serverinfo, and this is not a style preference.
//
// sv_main.qc's SV_UpdateMovementServerInfo mirrors six movement cvars into
// serverinfo every frame so the HUD can read them.  With this at 1 those
// mirrors were written into ftesurf.cfg -- and a saved `serverinfo <key>
// <value>` line SETS THE CVAR when it is exec'd (sv_ccmds.c:2856), from a file
// that execs AFTER this one.  So whatever the six happened to be at the last
// save became their permanent boot value, silently overriding every default
// below.  That loop had sv_airaccelerate frozen at an experimental 10000 for
// an unknown number of builds.
//
// Nothing is lost: the QC regenerates all six on the first frame of every map,
// and FTESurf has no userinfo or localinfo worth keeping (names and colours
// are ordinary archived cvars).
cfg_save_infos 0

// ===========================================================================
//  Where the gamedir's own droppings go (build 21)
//
//  Three kinds of file this game writes on its own, and they should land in
//  three folders rather than in the gamedir root:
//
//      ftesurf/screenshots/    F9 and the `screenshot` command
//      ftesurf/logs/           -condebug, and every scripted test run
//      ftesurf/cfg/testrun/    throwaway configs -- a convention, not a cvar
//
//  Screenshots already went to the right FOLDER: scr_sshot_prefix defaults to
//  "screenshots/fte-" (renderer.c:433), and the folder is part of it.
//
//  Build 27 changes the NAME.  scr_sshot_mapname 1 (engine patch 211) makes an
//  unnamed screenshot <map>_000.png, counting up per map -- and the counter is
//  the engine's existing free-name probe rather than stored state, so it needs
//  no reset on a map change, survives a restart, and refills a gap if you delete
//  one.  `menu` is used when no map is loaded.
//
//  The prefix loses its "fte-" stem because <map> IS the stem now; what is left
//  of it is the directory, which is all the mapname path reads.  A NAMED
//  screenshot follows: `screenshot foo` -> screenshots/foo.png.
//  scr_sshot_mapname 0 restores the stock <date>-<n> form byte for byte.
//
//  Not archived (CVAR_NOTFROMSERVER, no CVAR_ARCHIVE), so this line is the whole
//  story -- ftesurf.cfg cannot override it the way it can con_textfont.
set scr_sshot_prefix      "screenshots/"
set scr_sshot_mapname     1
//
//  Logs did not.  log_name defaults to "qconsole", which is a bare filename and
//  lands at the gamedir root.  log_dir is the engine's own answer -- log.c:292
//  builds "<log_dir>/<log_name>.log" -- so setting it once redirects every log
//  including the per-run ones a test config asks for by name, and log_name stays
//  a NAME rather than becoming a path.  Its callback rejects "..", ":" and
//  leading or trailing slashes, so "logs" is the whole of what it wants; a
//  leading "./" would mean the exe's directory instead of the gamedir.
//
//  This is exec'd after -condebug has already opened a log, so the first few
//  lines of a launch still land in the root qconsole.log before the reopen.
//  Pass `+set log_dir logs` on the command line to catch those too.
// ===========================================================================
set log_dir            logs

// ===========================================================================
//  Counter-Strike: Source movement
//
//  Authority, in order: Momentum Mod's CMomentumGameMovement, from the public
//  archive at github.com/momentum-mod/game; then the values measured in-engine
//  and recorded per build in ENGINE_PATCHES.md (see ENGINE.txt).  A separate
//  reference set of test vectors exists, but its *tunings* are CS:GO-flavoured
//  and are NOT used here.
// ===========================================================================

// ---------------------------------------------------------------------------
//  THE RULESET LOCK.  Read this before changing anything below it.
//
//  With this on, every cvar in this file that feeds the mover is restored to
//  the value written here at each map load, and refused afterwards unless
//  sv_cheats is 1.  A timed game whose physics can be retuned from the console
//  is a game with no times in it, so the numbers below are the ruleset rather
//  than a starting point -- and departing from them stays possible, but has to
//  be said out loud.
//
//  "The value written here" is literal: `exec cfg/default.cfg` is followed by
//  an automatic `cvar_lockdefaults 1`, so every `set` in this file becomes that
//  cvar's default, and the lock restores defaults.  Edit a line here and the
//  lock enforces the new number on the next launch.  There is no second copy
//  of these values in the engine to fall out of step with this one.
//
//  Turning sv_cheats back off restores them immediately; you do not have to
//  reload the map to get back to a legal configuration.
// ---------------------------------------------------------------------------
set pm_lockmovement       1

// ---------------------------------------------------------------------------
//  ...AND THE RULESET IS PER GAMEMODE.  Patch 224.
//
//  Everything below is the SURF ruleset.  It used to be the only one, and it
//  was applied to every map in the library -- which meant 531 bhop maps and
//  299 climb maps ran 66.667 Hz and surf's air numbers, because nothing
//  anywhere read the map and picked anything else.  A bhop map is not a surf
//  map with different geometry; it was built against a CS:S server running
//  -tickrate 100, and the tick rate IS the air acceleration rate.
//
//  So at each map load the engine now resolves a gamemode and, if there is a
//  ruleset for it, applies it ON TOP of this file:
//
//    cfg/mode_<mode>.cfg      e.g. cfg/mode_bhop.cfg
//
//  Each line in there becomes that cvar's canonical value for the map -- the
//  lock above restores to IT, not to the number here -- and leaving the map
//  puts everything back to this file.  There is no mode_surf.cfg on purpose:
//  surf is this file, and a second copy would be free to disagree with it.
//
//  HOW THE MODE IS DECIDED, best evidence first:
//    1. sv_gamemode, if you set it to a mode name.  "none" turns the whole
//       thing off and restores the pre-224 behaviour on every map.
//    2. data/mapmeta.txt column 9 -- Momentum's own gamemode id, already
//       shipped for 2271 maps and already used by the map browser.  A lookup,
//       so it is right about maps whose name lies.
//    3. the map name prefix (surf_, bhop_, kz_, ahop_, rj_, ...), for the ~700
//       installed maps Momentum has never indexed.  A guess, but the same
//       prefix set the browser censused.
//
//  `movement` in the console says which of the three answered, what it
//  answered, and every cvar the mode changed with its value beside this
//  file's.  A ruleset may not set sv_cheats, pm_lockmovement, or any cheat
//  cvar -- a ruleset that could switch the lock off would not be one.
//
//  Only mode_bhop.cfg ships today.  climb/kz, ahop, rj, sj, conc and defrag
//  resolve correctly and then run this file, because inventing numbers for
//  them would be worse than leaving them alone; writing cfg/mode_kz.cfg is
//  the whole of what adding one takes.
// ---------------------------------------------------------------------------
set sv_gamemode          ""

// THE switch.  0 = FTE's QuakeWorld pmove.c, 1 = engine/common/pm_source.c.
set pm_physicsmode        1

// 66.666... Hz.  0.015 s is 15 ms EXACTLY, which is the reason this tick
// rate and not 64: usercmd_t.msec is an integer number of milliseconds, so a
// 15 ms command survives the round trip losslessly.  64-tick's 15.625 would
// not.  cl_netfps is matched to it in default.fmf.
set pm_ticrate        0.015

// sqrt(2*800*57) = Momentum's CGameModeBase::GetJumpFactor(), which surf, bhop
// and KZ all inherit (mom_system_gamemode.cpp:61-65 -- CGameMode_Surf does not
// override it).  Apex 57; with pm_jumpzoffset 1.5 and the 8.5 mid-air duck
// shift, a crouch-jump reaches 67 and clears a 64-unit wall with room to spare.
//
// Builds up to 40 shipped CS:S's 268.3281572999747 (apex 45) and dismissed this
// number in this very comment as "CS:GO's sv_jump_impulse -- a different game".
// It is not; it is Momentum's, and using 45 made every PLAIN jump 9.76 units
// lower than Momentum's, which is a much bigger deal than the 64 wall was.
set pm_jumpvelocity 301.9933774

// ---------------------------------------------------------------------------
//  Jump height.  Momentum's mom_mv_normalize_jump_height, which ships at 1.
//
//  Stock Source does NOT give you a constant jump.  It ADDS the impulse when
//  you are standing and ASSIGNS it when you are ducked or mid-duck, and it
//  charges the second half of gravity twice on a jump tick.  Work that
//  through at 800/66.67Hz and a standing jump reaches 43.01 units against a
//  crouch-jump's 45.00 -- and 45.00 is the honest number, because it is
//  exactly the impulse's own apex, pm_jumpvelocity^2 / (2*sv_gravity).
//
//  Those two units are the reason a jump that lands in Momentum misses here.
//  With this set, every jump reaches the ideal apex regardless of duck state
//  and regardless of pm_ticrate, and still ADDS to whatever vertical speed a
//  ramp gave you.  pm_normalizejump 0 restores stock Source exactly.
set pm_normalizejump      1
// ---------------------------------------------------------------------------
//  Momentum's sv_jump_z_offset, and it is NOT an extra rise.
//
//  It reads like one -- "instantaneous height increase when the player jumps"
//  -- and Build 15 implemented it that way.  The source says otherwise
//  (mom_gamemovement.cpp:1596-1616): it traces DOWN to the ground and then UP
//  by this amount, and puts you there.  It PINS the takeoff height.
//
//  Which is the point, because of pm_groundtracedist below.  You count as
//  standing on a surface anywhere within that band without touching it, so
//  stock Source's takeoff height -- and therefore its apex -- varies by up to
//  two units depending on nothing you did.  Normalising the impulse fixes the
//  duck-state variation; this fixes the standing-height variation, and they
//  are different bugs.  Adding a constant would have kept every bit of it.
//
//  So: 45.0 units above the SURFACE plus this, every jump, instead of 45.0
//  above wherever in the band you happened to be floating.  1.5 is Momentum's,
//  giving 46.5 -- which is why a marginal jump lands there and misses here.
//  0 disables the pinning and restores the jitter.
set pm_jumpzoffset      1.5

// Source's GetAirSpeedCap.  The entire budget air-strafing has to work with.
set pm_maxairspeed       30

// ---------------------------------------------------------------------------
//  Ground detection, all four of them Momentum's and all four previously
//  hardcoded here.
//
//    pm_groundtracedist   mom_mv_considered_on_ground.  How far below you the
//                         ground trace looks.  2 is stock Source and today's
//                         Momentum; the 0.8.7 source shipped 1.0, so treat it
//                         as a real parameter rather than a constant.  See
//                         pm_jumpzoffset above for what its width costs you.
//    pm_bumpcount         sv_ramp_bumpcount.  Collide-and-slide iterations per
//                         tick.  Source ships 4; Momentum ships 8, because
//                         four is not enough budget to both recover from a
//                         bad ramp trace and still finish the move.  Clamped
//                         to 4..16 in the engine.
//    pm_snaptoground      mom_mv_snap_to_ground.  Off, you take a series of
//                         tiny hops going downhill instead of staying glued,
//                         and each one is a ground transition.
//    pm_groundquadrants   mom_mv_check_ground_quadrants.  When the ground
//                         trace finds nothing standable, retest with four
//                         sub-boxes in case a shallower slope is under one
//                         corner of the hull.  Source's own behaviour; the
//                         switch is for bisecting, not for taste.
// 1, not stock Source's 2: Momentum sets sv_considered_on_ground to 1 for every
// CS-based mode (CGameModeBase::SetGameModeVars).  It is also the width of the
// band your takeoff height can vary within before pm_jumpzoffset pins it, so
// halving it halves that variance before normalisation even runs.
set pm_groundtracedist    1
set pm_bumpcount          8
set pm_snaptoground       1
set pm_groundquadrants    1

//  Landing.  Finding a standable plane under you and LANDING on it are two
//  different questions, and stock Source only ever asks the first.  That is
//  the largest single source of surf RNG: whether you land on a ramp or keep
//  riding it comes down to where inside pm_groundtracedist's band the tick
//  boundary happened to fall, which is not something you did.
//
//  Momentum answers the second question by simulating one tick ahead.  Both
//  of these run only on the airborne->grounded transition, so nothing about
//  walking, prestrafe or standing still is affected by either.
//
//    pm_fixslopes   sv_slope_fix, which is both of Momentum's
//                   mom_mv_fix_uphill_slopes and _downhill_slopes -- one test
//                   covers both.  Clip next tick's velocity against the plane
//                   you would land on, then:
//                     * it GAINS horizontal speed -> downhill.  The collision
//                       converts your fall into forward motion; keep it.
//                     * it would still throw you up at over 140 u/s -> uphill.
//                       That is a ramp you are riding, not a floor you landed
//                       on, so do not land, and keep the speed stock Source
//                       would have taken off you.
//    pm_fixedges    sv_edge_fix.  Simulate the fall, the clip and the slide,
//                   then look for ground under where that ended up.  None
//                   means you were about to land on a lip and drop straight
//                   off it -- an edgebug -- so stay airborne instead.  Removes
//                   the coin flip in both directions: a deliberate edgebug
//                   becomes repeatable, an accidental one stops happening.
//                   Skipped while you hold jump with pm_autobunny on, since
//                   you have already said you do not want to be grounded.
//
//  Setting both to 0 restores exactly the pre-Patch-176 behaviour, which is
//  stock Source.  That is deliberate, so a regression can be bisected.
set pm_fixslopes          1

// 0 for Momentum parity: it ships sv_edge_fix FALSE, with the source comment
// "MOM_TODO Let people test the edge fix so we can get their opinions".  So this
// is undecided upstream rather than settled, and it is the FIRST thing to put
// back to 1 if ramps feel different after build 41 -- one cvar, no rebuild.
set pm_fixedges           0

//  The ramp fix.  A surfer is a box riding a plane at several hundred units a
//  second, and one tick of clipping leaves you a fraction of a unit INSIDE
//  that plane often enough that it is the normal case, not the error case.
//  Stock Source has one answer for a movement trace that starts solid: stop.
//  That is the dead stop on a seam, and the variant where the engine's own
//  push-out happens to point the wrong way is the launch.
//
//    pm_fixrampbugs  sv_ramp_fix.  Recover instead of stopping.  Look for a
//                    plane to push away from -- the failed trace's own normal
//                    first, then the planes already clipped this tick newest
//                    first, then a 27-direction search with a grown hull --
//                    step out along it, and re-trace.  The working origin is
//                    kept separate from the player's, so a recovery that finds
//                    nothing costs a bump and cannot move you.
//
//                    It also fixes the vertical rampbug: two clip planes that
//                    are the SAME plane mean you have sunk into the face, not
//                    that you are wedged in a crease, and the crease maths
//                    would zero your speed mid-ride.  Push out in x/y instead
//                    (never z -- that would be a free boost proportional to
//                    how badly you happened to clip).
//
//    pm_rampretrace  sv_ramp_initial_retrace_length.  How far out that step
//                    is, and the amount the search grows by each attempt.
//                    0.2 is Momentum's.  Bigger is not better: this is a
//                    distance you are teleported by, once per bump.
//
//  This needs the bump budget above.  Recovery spends bumps re-tracing, and at
//  Source's 4 there is not enough left to both recover and finish the move --
//  which is exactly why Momentum ships 8.
//
//  0 restores the pre-Patch-177 build, the same bisection rule as above.
set pm_fixrampbugs        1
set pm_rampretrace      0.2

// normal.z below this leaves you airborne and sliding.  This one number is
// the whole of surfing.
set pm_standablenormal  0.7

// 0 == follow sv_maxvelocity, which is the ONLY velocity cvar Momentum has
// (CGameModeBase::SetGameModeVars sets it to 3500).  Set this non-zero only to
// make the player's clamp differ from every other entity's.  See sv_maxvelocity
// further down for the per-axis story.
set pm_maxvelocity        0

// Momentum's g_ViewVectorsMom (mom_gamerules.cpp:34-40), NOT CS:S's 72/54/46.
// The hull shrinks by 62-45 = 17 when you duck.
set pm_standheight       62
set pm_duckheight        45
set pm_duckspeed       0.34      // 250 * 0.34 = 85 u/s crouched
set pm_sourcebounce       0      // sv_bounce

// Momentum's IGameMode::GetViewScale(), 0.5 for every CS-based mode.  A MID-AIR
// duck moves the origin by this fraction of the 17-unit shrink -- 8.5 -- so the
// box loses 8.5 off the bottom AND 8.5 off the top.  Builds up to 40 used the
// whole 17, which lifted the feet and left the crown still.
//
// This is the fix for "when you're in the air and duck, you lose hull from the
// top and bottom", which Patch 241 wrongly answered "it does not" after reading
// Momentum's BASE class instead of CMomentumGameMovement::FinishDuck.
set pm_viewscale        0.5

// Eye height.  Source VEC_VIEW / VEC_DUCK_VIEW.  The eye does NOT snap
// between these: it slides on a SimpleSpline over TIME_TO_DUCK (0.4s) going
// down and TIME_TO_UNDUCK (0.2s) coming up, while the hull snaps at the end.
// That slide is the crouch camera smoothing.
//
// In mid-air the change is instant and IS visible, unlike builds up to 40: the
// origin rises 8.5 while the eye offset drops the full 17, so the eye falls by
// 8.5 -- exactly as the crown does.  That dip is correct, not a bug.
//
// 64 is measured-correct and matches Momentum; hud_debug's `eye` row prints the
// live camera height above the traced floor if you want to check it.
set pm_viewheight        64
set pm_duckviewheight    47

// ---------------------------------------------------------------------------
//  Stamina.  CS:S's stamina constants, as observed in-game.
//
//  Jumping and landing fill a pool that drains in real time; while it is
//  full, maxspeed and jump height are scaled down.  A jump costs 25% and
//  recovers over 25/19 = 1.32s; a landing costs 20% over 1.05s.
//
//  This is what makes a landing BLEED SPEED instead of holding it.  It does
//  not slow you down directly -- it lowers the speed ground friction is
//  pulling you toward, so you drop to ~200 and climb back over the next
//  second.  Without it the ground feels frictionless in a way no amount of
//  sv_friction tuning fixes, because friction was never the missing part.
//
//  Air acceleration is NOT affected: AirAccelerate measures against the 30
//  u/s air cap and the rate stays far above it at a 0.75 ratio.  Surfing is
//  untouched, which is exactly why CS:S can afford to do this.
//
//  ⚠ OFF BY DEFAULT SINCE BUILD 12, and this is a deliberate departure from
//  retail CS:S.  With pm_autobunny 1 (below) holding +jump re-jumps the tick
//  you land, and every one of those jumps is scaled by a pool the landing
//  itself just charged 20 into -- so held-jump hops come SOONER and LOWER,
//  which is exactly what a surf/bhop player notices first and is not what any
//  surf server does.  Momentum has no stamina; CS:S surf servers zero it with
//  a plugin.  The engine's own default for pm_stamina is 0 too; only this file
//  ever turned it on.
//
//  To get retail CS:S back, one line:   pm_stamina 1
//  Or keep the landing penalty and let repeated jumps reach full height with
//  pm_staminajumpcost 0.
// ---------------------------------------------------------------------------
set pm_stamina            0      // was 1; see above
set pm_staminajumpcost   25
set pm_staminalandcost   20
set pm_staminarecovery   19

// The walk key, where CS:S keeps it: holding +speed scales maxspeed by this
// SERVER-SIDE, so walk is 0.52 * 260 = 135.2 u/s and stays 0.52 of whatever
// sv_maxspeed becomes.  It also compounds with the duck crop the way Source's
// does, since ducking crops the move values afterwards.
//
// This replaces `cl_movespeedkey 0.52`, which was Quake's clientside walk and
// only produced the right number while cl_forwardspeed happened to equal
// maxspeed.  See the move-values block further down for why that stopped.
set pm_walkspeed       0.52

// Noclip: 4x sv_maxspeed = 1000 u/s, doubled to 2000 while +speed is held.
// The DIRECTION comes from the move keys but the SPEED does not, and it scales
// off the BASE sv_maxspeed rather than the walked/stamina'd one -- otherwise
// +speed would multiply by 0.52 and by 2 at the same time.
set pm_noclipspeed        4
// ...and this is what lets the server see +speed at all: it makes the client
// set usercmd button bit 7 alongside +button8.  Off by default in the engine
// because it collides with +button8 for mods that use it; FTESurf does not.
// pm_walkspeed needs it too: without it the walk key never reaches the server.
set in_speedbutton        1

set sv_gravity          800
set sv_friction           4
set sv_stopspeed         75      // CS:S.  Source's own base is 100.
set sv_accelerate         5      // CS:S.  HL2 is 10.
set sv_airaccelerate    150      // surf standard.  Stock CS:S is 10.
// MOMENTUM'S GROUND SPEED IS 260, NOT CS:S'S 250, AND THAT IS THE WHOLE OF THE
// PRESTRAFE GAP.  Turning at cl_yawspeed 120 with one strafe key held settles
// at 289 in Momentum and used to settle at 278 here -- the same 1.11286x either
// side, applied to a different base.
//
// Where the 1.11286 comes from: at 120 deg/s the accelerate cap is never the
// binding constraint (the tick needs 11.5 u/s and sv_accelerate 5 offers
// 18.75), so every tick ends with exactly maxspeed along wishdir and the whole
// fixed point is the perpendicular remainder.  With f = 1 - sv_friction*dt and
// t = the per-tick turn, that remainder is  q = f*M*sin(t)/(1 - f*cos(t)),  and
// the speed is hypot(M, q) -- proportional to M, and free of sv_accelerate
// entirely.  Which is why no value of sv_accelerate reaches 289 from 250: 5,
// 150 and 10000 all give 278.216.
//
//   250 -> 278.216      260 -> 289.344
//
// Inverting 289 gives 259.24..260.14, and 260 is the only integer in it.
//
// SETTING THIS CVAR NOW ACTUALLY CHANGES YOUR PRESTRAFE.  It did not before
// Build 15: PutClientInServer pinned `.maxspeed` to a compile-time constant and
// the mover reads `.maxspeed`, never the cvar (sv_user.c:7883).  PlayerPreThink
// now tracks this cvar per frame, so this line is the one number that matters
// and PM_RUN_SPEED in src/shared/sh_defs.qc is only its fallback.
set sv_maxspeed         260      // Momentum Mod's ground speed
// THE velocity cap, and the only one Momentum has (CGameModeBase::SetGameModeVars).
// Clamped PER AXIS under pm_physicsmode 1, exactly as Source's CheckVelocity does,
// so diagonal speed may legitimately exceed it.
//
// It was NOT per-axis before build 41: WPhys_CheckVelocity's radial branch was
// scaling the whole vector on the player every usercmd, so gaining downward speed
// while at the cap silently deleted horizontal speed -- 628 u/s of it at 3500 and
// falling 2000.  The comment here claimed "per axis" and was simply wrong.
//
// Raising this past 4096 on an axis used to invert the sign on the wire and make
// the player flicker; that is fixed too (PEXT2_BIGVELOCITY), so maps that want
// more than 3500 now work.  pm_lockmovement still guards it -- sv_cheats 1 to change.
set sv_maxvelocity     3500
set sv_wateraccelerate   10
set sv_waterfriction      1

// Step height.  Source's m_flStepSize.
set sv_stepheight        18

// ---------------------------------------------------------------------------
//  Anti-bunnyhop measures FTE ships on by default -- all must be off.
// ---------------------------------------------------------------------------
set pm_bunnyspeedcap      0      // caps horizontal speed on air turns.  Kills surf.
set pm_bunnyfriction      0      // forces >=1 friction frame per jump
set pm_edgefriction       1      // CS:S has no edgefriction; FTE defaults to 2
set pm_ktjump             0      // KTeams jump blend, not a Source behaviour
set pm_walljump           0
set pm_autobunny          1      // autohop; CS:S surf servers run a bhop plugin

// ---------------------------------------------------------------------------
//  Ramp behaviour.
//  These only affect FTE's stock QuakeWorld pmove, which is what runs until
//  pm_source.c lands.  They make surf maps traversable in the meantime; once
//  pm_physicsmode 1 exists these are inert (the Source module ignores them).
// ---------------------------------------------------------------------------
set pm_slidefix           1      // keep gravity applied on slopes, don't hard-zero Z
set pm_slidyslopes        1      // slide down steep faces instead of sticking
set pm_pground            0
set pm_stepdown           1
set pm_airstep            0      // Source has no air-stepping

// ---------------------------------------------------------------------------
//  Networking / prediction.  The tick is set in default.fmf
//  (sv_mintic/sv_maxtic 0.015, cl_netfps 66.6667).
//
//  THAT LINE DOES NOT PROTECT ANYTHING, AND USED TO CLAIM IT DID.  It said "so
//  a stale saved config can't desync the physics", which is exactly backwards:
//  cl_netfps is CVAR_ARCHIVE (cl_input.c:40), the engine writes it into
//  ftesurf.cfg on exit, and ftesurf.cfg is exec'd AFTER the manifest.  A stale
//  saved config wins every launch.  An archived cvar cannot be forced from a
//  file that runs first -- that is true of every archived cvar named here.
//
//  It cost a real bug.  cfg/mode_bhop.cfg sets cl_netfps 100 (correctly -- it
//  also moves pm_ticrate/sv_mintic/sv_maxtic to 0.01, so a bhop map matches),
//  but it is a CLIENT cvar and the gamemode overlay is applied server-side, and
//  there is no mode_surf.cfg to put it back.  So ONE bhop map archived 100 and
//  every surf map after it ran 10 ms usercmds into a 15 ms mover.  PMSrc runs
//  whole ticks and carries the remainder, so every third command moved the
//  player ZERO units -- a 33 Hz stall in position, with the mouse unaffected
//  because view angles never pass through the tick.  Measured on surf_rise:
//  101101101101... , 117 of 351 commands with no motion at all.
//
//  Patch 252 removes the coupling from configs entirely: the client now rounds
//  its usercmd interval to a whole number of movevars.ticrate ticks, so
//  cl_netfps is a request for a packet RATE and can no longer be a physics bug.
//  cl_netfps_snap 0 restores the old behaviour for bisection.
// ---------------------------------------------------------------------------
set cl_nopred             0
set cl_predict_extrapolate 0
set sv_nqplayerphysics    0

// ---------------------------------------------------------------------------
//  TWO slots, and the reason is the console, not multiplayer.
//
//  SV_Frame freezes the whole simulation whenever a key destination other than
//  the game owns the keyboard -- console, menu, or messagemode -- but ONLY when
//  the server has exactly one allocated slot:
//
//      isidle = !isDedicated && sv.allocated_client_slots == 1
//               && (Key_Dest_Has(~kdm_game) || ...)     sv_main.c:5583
//
//  and it then advances sv.starttime so sv.time never moves (sv_main.c:5635)
//  and skips SV_Physics entirely (sv_main.c:5707).  There is no cvar for it and
//  the "Paused" graphic is deliberately suppressed for this case
//  (cl_screen.c:2151), so it presents as the world silently stopping the
//  instant you press ESC mid-flight.
//
//  sv_playerslots wins outright over maxclients (sv_init.c:1401), so two here
//  is the whole fix.  The menu already passed maxclients 2 for this reason;
//  loading a map from the console did not, which is why it still happened.
//
//  This is also the knob that has to go up for the peer-to-peer idea, so it is
//  moving in the right direction anyway.
// ---------------------------------------------------------------------------
set sv_playerslots        2

// Float network coordinates.  Source runs on unquantized float origins and
// pm_source.c deliberately does not call PM_NudgePosition (which snaps to
// 1/8 unit).  Without bigcoords the origin the client replays from is a
// rounded copy of the server's, so every ramp would show a small permanent
// prediction offset.
set sv_bigcoords          1

// ---------------------------------------------------------------------------
//  Source content
// ---------------------------------------------------------------------------
set r_builtinpalette      1      // don't let a mounted game's palette win (Patch 7)
// Note since build 33: the graphics menu now writes its rows with `seta`, so a
// value you pick there lands in ftesurf.cfg -- which execs AFTER this file and
// therefore wins over this line.  That is the intended order; this stays as the
// out-of-the-box default for someone who has never opened the menu.
set hl2_favour_ldr        0      // prefer the HDR lightmaps surf maps ship

// fteplug_hl2 owns the VBSP loader, VPK mounting, VTF/VMT and Source .mdl.
// Without it every surf map dies with "Unrecognised model format VBSP".
//
// plug_loaddefault 1 (the engine default) loads ONLY plugins the package
// manager has registered in installed.lst -- and a hand-placed DLL gets
// written there as stale=1 and skipped.  Bit 2 makes Plug_Initialise scan
// FS_BINARYPATH for fteplug_*_x64.dll instead (plugin.c:1276-1290), which is
// what a self-contained install wants.  3 = scan + built-ins.
set plug_loaddefault      3
// ...and load it explicitly too: the scan above only runs on the non-gamedir
// pass of Plug_Initialise, which has already happened by the time this
// config execs on a first boot.  Plug_Load is idempotent (plugin.c:218-222),
// so on later boots this is a no-op.
plug_load hl2

// ---------------------------------------------------------------------------
//  The graphics menu, audited (build 33)
// ---------------------------------------------------------------------------
//  `gfx_menu` (bound to x below) is the front end for the Source content
//  plugin's cvars.  Build 33 audited all of it twice -- once by reading
//  VBSP_Init, where every hl2_* cvar in existence is registered, and once by
//  pulling the cvar names straight out of the shipped fteplug_hl2_x64.dll so
//  the list could not be a source-tree fiction.  Four things came out of it.
//
//  1. NOTHING IN THE MENU WAS BROKEN.  The brief was "remove the ones that
//     don't work"; every row's cvar turned out to have a live read.  There was
//     nothing to remove.
//
//  2. BUT NINETEEN OF THE TWENTY-ONE ROWS WERE THROWN AWAY ON QUIT.
//     hl2_propdist is the only cvar in the whole hl2_* family registered
//     CVAR_ARCHIVE.  Everything else reverted to the plugin's compiled-in
//     default on the next launch -- silently, with the menu redrawing the value
//     you had not chosen.  The menu now writes `seta`, so its rows persist.
//     Two knock-on effects worth knowing:
//       - your ftesurf.cfg will start growing `seta hl2_*` lines as you use it;
//       - a row you never touch stays unwritten and keeps the plugin default,
//         which is why this file still seeds nothing but hl2_favour_ldr.
//
//  3. TWO REAL SETTINGS WERE MISSING, and are now rows 4 and 13:
//       hl2_animated   Source's AnimatedTexture proxy (Patch 195).  Defaults
//                      to 0, so until now the feature was both off AND
//                      unreachable without typing the cvar.
//       hl2_propdist   static-prop draw distance (Patch 193), and the largest
//                      framerate dial in the family.  surf_demise's 2350 props
//                      all declare FadeMaxDist 0 and cost 4.11M of the frame's
//                      5.2M draw indices; the row's five values measured 27163
//                      / 20227 / 15618 / 11590 / 5923 opaque batches.
//
//  4. ONE ROW LIED.  Decals was unmarked, meaning instant, but vbsp_decals is
//     read during the map-load entity walk.  It now carries `*`.
//
//  THREE ROWS GO GREY WHEN THEY CANNOT DO ANYTHING, which is new.  A setting
//  that appears not to work is indistinguishable from a broken one, so instead
//  of showing you a value that is not being consulted, the row dims and says
//  why:
//    Dither scale / Dither level  need Water on "Dithered" or Glass on
//      "Dithered" -- in any other mode the dither code is never reached.
//    Dither scale  additionally goes grey whenever Dither level is above 0,
//      because Dither level then replaces the per-material alpha outright.
//      Two rows, one of which silently wins; now it says so.
//    3D skybox  needs the map to contain a sky_camera.  Most do not.
//
//  ONE CAVEAT THAT IS NOT SHOWN ON SCREEN, because the row genuinely works:
//  Bump maps does NOT apply to Water or Glass surfaces.  The plugin excludes
//  those two material types by name, so they keep their normal maps whatever
//  the row says.  It is live on every ordinary material, and dimming a working
//  row would have put a new lie where this build removed an old one.
//
//  Reflections / Env maps / Cubemaps are three different things and are still
//  the most confusing corner of this menu -- see the build 20 essay further
//  down, beside `set r_reflectcube`, which measured it on surf_spectra.
//
//  Deliberately NOT exposed, so "all the HL2 settings" has a defensible edge:
//  hl2_lt_face (its description and its group are both the string "TEST"),
//  hl2_displacement_scale (cheat-flagged), hl2_contents_remap (a bit-name
//  table, not a cyclable value), hl2_unresolved/_first (status outputs, already
//  read by the missing-material banner), and r_novis / r_texdiag, which the
//  plugin borrows from the engine rather than owning.
// ---------------------------------------------------------------------------

// ---------------------------------------------------------------------------
//  Binds
// ---------------------------------------------------------------------------
// +duck is named after CS:S's own bind and is a real engine command
// (cl_input.c), not an alias: cmd.c:3125 refuses to forward the keynum to an
// alias whose body starts with '+', which breaks two-key hold/release --
// hold CTRL, tap c, and you would pop up.  It ORs into cmd.buttons bit 3,
// the value 8 that pm_source.c reads as Source's IN_DUCK.  Deliberately NOT
// +movedown: upmove is the swim axis and pm_source ignores it for ducking.
bind w        +forward
bind s        +back
bind a        +moveleft
bind d        +moveright
bind SPACE    +jump
bind CTRL     +duck
bind c        +duck
bind e        +use
bind SHIFT    +speed
bind v        noclip
bind q        +right
// BUILD 40 FOUND THIS AND IS DELIBERATELY NOT SILENTLY CHANGING IT.  `e` is
// bound twice -- +use six lines up, then +left here -- and the last bind wins,
// so +use is currently unbound and e is a turn key.  That may well be the
// intent (q/e as a turn pair is a normal surf setup), which is why it stands.
// It matters to the strafe widget: +left/+right have NO usercmd movement
// component at all (cl_input.c:1480-1481, gated on +strafe, which nothing here
// binds), so holding q or e is genuinely not strafing and the readout now says
// so in those words rather than "no strafe key".  If +use is wanted back, move
// this to another key rather than deleting the line above.
bind e        +left
bind `        toggleconsole
// Build 33: this menu had no bind anywhere in this file -- `bind x "gfx_menu"`
// existed only in a hand-edited ftesurf.cfg, so a fresh install shipped the
// menu with no key to reach it.  x is the key that was already being used for
// it.  saveloc_menu and hud_edit remain console-only by choice; this one is the
// odd case because it is a settings screen rather than a working tool.
bind x        gfx_menu
// F9/F10/F11 have been bound since build 21 and F11 named a command that does
// not exist: `fullscreen` is nowhere in this engine (the only hit in the whole
// tree is sys_plugfte.c's browser-plugin parameter table, which maps the WORD
// onto the vid_fullscreen cvar and never reaches the console).  So F11 has been
// a silent no-op for six builds.  Engine patch 211 registers fullscreen_toggle
// beside FTE's own vid_toggle -- same function, a findable name.
//
// `quit` no longer has any path to a prompt at all (patch 211 deleted the
// forcesaveprompt branch), and `exit` is now registered as a second name for the
// same function.  Archived cvars are still written on the way out.
bind f9       screenshot
bind f10      quit
bind f11      fullscreen_toggle

// Momentum's two, on Momentum's keys.  Both go through the server because they
// have to move the player, and both have chat equivalents (!r and !m) parsed in
// SV_ParseClientCommand.  `r` was `kill`, which on a surf map is a slower way of
// doing very nearly this and loses your position instead of choosing it.
bind r        "say !r"      // start of the stage or bonus you are on
bind m        "say !m"    // start of the map
bind MWHEELUP    +jump
bind MWHEELDOWN  +jump
bind MOUSE1   +duck
bind MOUSE2   +jump

// ---------------------------------------------------------------------------
//  Move values.  The client sends forwardmove/sidemove in UNITS and pm_source
//  clamps their MAGNITUDE to maxspeed, so a move value below maxspeed is a cap
//  on your speed -- silently, and only on the axes you are actually pressing.
//
//  At 250 with maxspeed 260, one key gave 250 and two keys gave 260, so
//  forward-only running and prestrafe were both 10 u/s short while diagonals
//  were correct.  Anything >= maxspeed removes the cap entirely; Momentum uses
//  450 and the exact number is not load-bearing beyond that.
//
//  These are NOT the walk key any more.  CS:S walks by reducing maxspeed
//  server-side (CS_PLAYER_SPEED_WALK_MODIFIER), which is pm_walkspeed above;
//  doing it Quake's way with cl_movespeedkey only worked while these values
//  happened to equal maxspeed, and 0.52 * 450 would have been a 234 u/s
//  "walk".  cl_movespeedkey 1 takes the client out of it entirely.
// ---------------------------------------------------------------------------
set cl_forwardspeed     450
set cl_backspeed        450
set cl_sidespeed        450
set cl_upspeed          450
set cl_movespeedkey       1      // walk is pm_walkspeed now, not this
set cl_run                0

// ---------------------------------------------------------------------------
//  Mouse -- CS defaults.  m_yaw 0.022 deg/count is the Source constant.
// ---------------------------------------------------------------------------
set m_yaw             0.022
set m_pitch           0.022
set sensitivity         0.3
set m_filter              0
set cl_pitchspeed         0
set cl_yawspeed          60
//
//  in_rawinput is NOT set here, and that is deliberate as of Patch 204.  It now
//  defaults to 1 in the engine and is archived, so it is a setting the player
//  owns: asserting it in this file would exec BEFORE the archived config and
//  overwrite their own choice with ours every launch.  It also answers to
//  "m_rawinput", which is what Source calls it.
//
//  At 0 the engine reads the mouse through GetCursorPos/SetCursorPos, which
//  hands over one already-summed, already-accelerated, screen-pixel-quantised
//  delta per call.  At 1 it reads the device's own reports.  Turning it ON from
//  the console needs a vid_restart -- the raw devices are registered once, in
//  INS_ReInit -- so change it and restart rather than trusting it took.

// ---------------------------------------------------------------------------
//  View pitch.  Quake's limits are -70 up / +80 down and they are NOT a render
//  clamp -- the server rewrites v_angle at sv_user.c:8069-8074, so looking
//  further simply does not happen.  Source's are cl_pitchup/cl_pitchdown 89,
//  and on a steep ramp that difference is the whole ramp.
//
//  These are the sanctioned QuakeWorld knobs (minpitch/maxpitch, aliases
//  sv_minpitch/sv_maxpitch): CVAR_SERVERINFO, read by the server for the clamp
//  and by the client at cl_main.c:3269-3272 for its own, so both ends agree
//  without a cl_fullpitch-style client-only override that a server can undo.
//  FTE hard-bounds them to +-89.9 regardless, so 89 is the practical maximum
//  and is exactly Source's.
//
//  Not part of the movement lock: pitch cannot change where you go.
//  PMSrc_WishDir flattens forward and right onto the horizontal plane before
//  building wishdir, so ground and air movement are identical at any pitch.
//  It only moves the camera -- and noclip, which is already practice-only.
// ---------------------------------------------------------------------------
set minpitch            -89
set maxpitch             89

// ---------------------------------------------------------------------------
//  UI scale -- exactly 1:1.
//
//  R2D_Console_Resize (r_2d.c:1362-1436): when vid_conautoscale > 0 it
//  OVERRIDES conwidth/conheight with the framebuffer size and multiplies by
//  1/scale.  At 1 that makes the virtual 2D screen identical to the
//  framebuffer -- one drawn unit per physical pixel, which is what menu.dat
//  is laid out against.  Leaving all three at 0 (the old state) instead takes
//  the "infer a 480-tall screen" branch at r_2d.c:1387 and upscales everything.
// ---------------------------------------------------------------------------
set vid_conautoscale      1
set vid_conwidth          0
set vid_conheight         0
set vid_fullscreen        0

// NEAREST font filtering.  FTE builds the default font's glyph atlas at
// exactly 8 px (r_2d.c:1300, Font_LoadFont(gl_font.string, 8, ...)) and
// rescales it at draw time, so at r_font_linear 1 -- the engine default --
// every glyph drawn larger than 8 px is bilinearly interpolated.  With this
// off and every font size in the menu and HUD a whole multiple of 8, the
// atlas is sampled 1:1, 2:1 or 3:1 and the text is pixel-exact.
set r_font_linear         0

// ---------------------------------------------------------------------------
//  The console's own font (build 25)
// ---------------------------------------------------------------------------
//  The same face the HUD's number columns use -- Google Sans Code Medium, which
//  has been in gfx/fonts/ since build 21.  Every glyph in it advances exactly
//  0.6 em, so a console listing lines up in columns the way a terminal does; the
//  engine's built-in 8x8 atlas does not, and `dir`, cvarlist and the timer
//  report are all column output.
//
//  16 rather than the engine's 8 because con_textsize is in VIRTUAL pixels and
//  a TTF face needs about twice the height of a bitmap one to read as cleanly --
//  the engine's own gl_font help says as much ("you will likely need to scale
//  text to at least 150%").
//
//  ONE OF THESE TWO IS ARCHIVED AND THE OTHER IS NOT, which decides what setting
//  them here actually does:
//
//    con_textfont   CVARAFD, i.e. ARCHIVED (renderer.c:560).  ftesurf.cfg execs
//                   after this file, so a value saved there WINS -- and that is
//                   correct, because a saved value is the player's own choice.
//                   What this line does is make it the default, so a fresh
//                   install or a deleted config gets the good face rather than
//                   the built-in one.
//    con_textsize   CVARD, NOT archived (console.c:78).  Nothing else ever
//                   writes it, so this line is the whole story.
//
//  Build 23 hit the other half of that rule with in_rawinput and the lesson is
//  the same: a cvar that is both archived and asserted here can never be changed
//  by the player, so assert it only where being overridden is the right outcome.
set con_textfont          "gfx/fonts/GoogleMed.ttf"
set con_textsize         16

// ---------------------------------------------------------------------------
//  The on-screen console -- what you see WITHOUT opening it.  Patch 242.
//
//  With con_window 1 (below) a closed console is drawn by Con_DrawNotifyOne at
//  the HUD's top-left, and that surface is what these control.  Most of this
//  already existed and was simply never set: the fade, the line count, the
//  position and the per-line ageing are all stock FTE.  What did not exist is
//  the ORDER -- every notify surface in the engine drew oldest-first, so new
//  lines appeared at the BOTTOM and pushed older ones up off the top.
//
//    con_notifystyle 0   classic: oldest at the top, newest at the bottom
//                    1   newest at the TOP, older sliding down beneath it
//                    2   newest at the BOTTOM, older pushed up, bottom-anchored
//
//  1 is the default because a burst of errors then reads top-down in the order
//  you would read anything else, and the newest line is always in the same
//  place instead of moving as the block grows.
//
//  Errors and warnings hold four times as long as ordinary prints.  The engine
//  now marks a line at print time if its text begins with the CON_ERROR or
//  CON_WARNING colour marker, which is how all 438 of the engine's error sites
//  already spell themselves -- so this needs no cooperation from the code that
//  is failing.
//
//  The cap is con_notifylines, and the engine's own ceiling is 64.
// ---------------------------------------------------------------------------
set con_notifystyle       1
set con_notifylines     100
set con_notifytime        6      // ordinary prints hold this long...
set con_notifytime_error 20      // ...errors and warnings hold this long
set con_notifyfade        2      // and then fade out over this long
set con_notify_x          0
set con_notify_y          0

alias notify_topleft     "con_notifystyle 1; con_notify_y 0.00"
alias notify_bottomleft  "con_notifystyle 2; con_notify_y 0.70"

set fov                  90
set cl_bob                0
set v_bobcycle            0
set cl_rollangle          0
set crosshair             1
set crosshairsize         1

// ---------------------------------------------------------------------------
//  Performance -- this is a training tool; latency beats prettiness.
// ---------------------------------------------------------------------------
// On a LISTEN server this is the server's frame rate too.  SV_Frame is called
// exactly once per Host_Frame and its return value -- the sleep hint the
// dedicated loops use -- is discarded here (cl_main.c:7470).  sv_mintic and
// sv_maxtic (both 0.015, forced in default.fmf) only set the SIZE of each
// physics step; how often the accumulator is looked at is this.
//
// At 1000 the 0.015 tick fires within a millisecond of its boundary instead of
// being quantised to a ~4 ms client frame at the old default of 250.  Bounded
// rather than 0/uncapped so sys_framepacing still has something to pace.
set cl_maxfps          1000
alias fps_max cl_maxfps         // the Source name.  Cmd_ExecuteString forwards
                                // an alias's arguments to a bare cvar name
                                // (cmd.c:3124-3130), so `fps_max 300` works.

set vid_wait              0
set r_dynamic             0
set sys_framepacing       1

// ---------------------------------------------------------------------------
//  Noclipping in the void (engine, build 17)
// ---------------------------------------------------------------------------
//  Step outside the map and the renderer has no visibility data to work with:
//  r_viewcluster goes to -1, so vis and the frustum test both stop applying and
//  the whole world is drawn at once.  On surf_666 that is 35,302 faces and 653
//  static props against the 1.6% an average cluster actually sees, which is why
//  Patch 138 keeps the last cluster that resolved instead -- fall into the void
//  during a run and the frame rate survives it.
//
//  That is right for falling in and wrong for flying out.  When you noclip into
//  the void deliberately you are out there to LOOK at the map and pick somewhere
//  to go, and the map is precisely what Patch 138 hides.  So this reverses it,
//  for noclip only.
//
//  THE ENTITIES ARE NOT WHERE THE COST IS, which was worth measuring before
//  believing.  Dropping them and leaving the cluster at -1 read 27.6 fps on
//  surf_666 -- i.e. the reversal on its own reintroduced exactly the frame rate
//  Patch 138 exists to prevent.  What costs is the world drawn with no frustum
//  test: everything behind the camera, every frame.  So the world is handed an
//  all-bits-set PVS instead, which keeps the frustum and area tests and drops
//  only the test that has no answer out there.  Same vantage, after: 1303 fps.
//
//    0  Patch 138 as shipped.  Exactly the pre-build-17 build, so this stays a
//       one-command A/B if the void ever feels wrong.
//    1  Full world, with the frustum and area culls kept.
//
//  The two entity-dropping modes this used to document are GONE as of build 19,
//  and any nonzero value still means on, so a config carrying `2` is unchanged.
//  Aimed across the map from 1,640 units up they measured `entities 0 (brush 0)`
//  at every setting INCLUDING 0, where no gate runs at all: VBSP culls its props
//  before they ever become entities, so both gates were filtering an empty list.
//  Mode 2 was also an early return that skipped the pass converting CSQC
//  polygons, particles and beams into batches -- it dropped every scene triangle
//  in the frame, which is why the zone markers vanished with it.
//
//  It does nothing at all anywhere else -- the gate is "in the void" AND
//  "noclipping", and both halves are load-bearing.  Measured in all four states:
//  inside the map it is flat across 0/1/2 whether or not you are noclipping, and
//  in the void with noclip off it is flat too.  `developer 1` prints the gate's
//  own inputs (cluster, pmovetype, which way it went) whenever they change.
set r_voidvis             1

// ---------------------------------------------------------------------------
//  Cubemap reflections, with an off switch that actually works (build 20)
// ---------------------------------------------------------------------------
//  The graphics menu's "Env maps" and "Cubemaps" both act while something is
//  being BUILT -- one clears $envmap as a material is generated, the other
//  decides what the BSP parse loads.  Neither can reach a thing that is already
//  built, and on the common case neither can reach the reflection at all: a
//  Source map's shine usually comes from its own BAKED cubemaps, bound per
//  surface, which "Env maps off" is not able to touch by design and "Cubemaps
//  off" can only remove through a map load.
//
//  Measured on surf_spectra, reflection batches per ~1.5s at the spawn:
//
//      everything on                          12544
//      hl2_envmap 0   (regenerated, no reload) 14616   <- unchanged
//      r_reflectcube 0 (same frame, no reload)     0
//      hl2_cubemaps 0 + a full map reload          0
//
//  For scale, the same measurement elsewhere: surf_666 400, surf_utopia 1900.
//  surf_spectra really is about thirty times shinier than the everyday map,
//  which is why it is the one anyone notices.
//
//  This one sits in the renderer at the point of USE, so it applies to the next
//  frame and cannot be outrun by a cached map or a stale shader.  1 is the
//  previous build byte-for-byte.
// ---------------------------------------------------------------------------
set r_reflectcube         1

// ---------------------------------------------------------------------------
//  Source fog (Patch 254).  Both of these are REQUIRED for map fog to be right,
//  and neither is a preference.
//
//  r_fog_linear 1
//    Source's fog is linear -- a start distance, an end distance and a maximum
//    density.  FTE's default is exponential-by-density, which cannot express a
//    start distance at all.  Its linear branch can, exactly: in that mode the
//    `density` field IS the fog end distance and `depthbias` IS the start, so
//    the map's own numbers go in untouched.  Set once here, at startup, rather
//    than toggled per map: the shader `#include "cvar/r_fog_linear"` marks the
//    cvar CVAR_SHADERSYSTEM the first time a fog shader compiles, so setting it
//    before any of them exist sidesteps the question of flush ordering
//    entirely.  FTESurf only ever loads Source maps, so there is nothing this
//    can mean the wrong thing for.
//
//  r_skyfog 0
//    NOT optional, and the reason is easy to miss.  r_skyfog defaults to 0.5 and
//    was set in no config, so the moment fog switches on, every skybox gets
//    mix(sky, fogcolour, 0.5*fogalpha) -- a 50% wash toward the fog colour, on
//    all ~201 fogged maps.  Source does not fog the 2D skybox; it fogs the 3D
//    skybox's CONTENTS, which is what skyroomfog does instead.  Without this
//    line the fog work reads as "the sky is broken".
// ---------------------------------------------------------------------------
set r_fog_linear          1
set r_skyfog              0

// ---------------------------------------------------------------------------
//  Overlays and decals get the lightmap of the surface they sit on (Patch 251)
// ---------------------------------------------------------------------------
//  THE REPORT.  On surf_666, two ordinary wall materials "appear fullbright" --
//  flat, bright, high-frequency, against a room the lightmap keeps dim.
//
//  They are not the surfaces being looked at.  Parsing LUMP_OVERLAYS puts both
//  probe points at plane-distance 0.00 INSIDE an info_overlay footprint, and the
//  pair is crossed: a 666/brickwall004a_overlay lies on the concrete face and a
//  666/dev_concretefloor006a_overlay on the brick one.  So shader_here names the
//  wrong material, and it cannot do better -- it reports
//  Mod_GetSurfaceNearPoint(cl.worldmodel)'s face, and an overlay is scenetris
//  with no msurface_t at all.  A 512px texture tiled 14x9 across a 1792x1280
//  quad and drawn unlit IS that "noise".
//
//  WHY UNLIT.  Both overlay VMTs are LightmappedGeneric + $decal 1 with no
//  $translucent, so they draw OPAQUE over the base face, and hl2_decallit
//  correctly keeps them on vmt/lightmapped.  But the decal BATCH has no lightmap
//  page: CL_Decal_SetupCtx takes ctx->dolm from r_decal_lightmap
//  (cl_ents.c:3722), adddecal_static then stores lightmap[0] = -1, and
//  gl_backend.c:1405 reads
//      if ((unsigned short)curbatch->lightmap[0] >= numlightmaps) t = r_whiteimage;
//  (unsigned short)-1 is 65535, so s_lightmap binds WHITE and lightmapped.glsl
//  multiplies the albedo by 1.0 * e_lmscale.  All 319 placed overlays, every map.
//
//  THIS FINISHES PATCH 246 rather than rediscovering the bug.  That patch is
//  titled "230 maps ship baked decals the loader never read, and every Source
//  decal was fullbright", and its section 2 IS this fault.  It replaced the
//  game-id gate (cl_ents.c:3713-3721 -- VBSP is fg_new and was never in the list)
//  with the two properties the interpolation needs, lightmaps.surfstyles > 0 and
//  lightmaps.count > 0, chosen so Source worlds would be admitted and Doom 3 still
//  excluded; and it fixed the three defects that only matter once decals are lit
//  -- DecalLM_Interp's hardcoded trifan winding (wrong on 640 of 9557 overlays),
//  an unguarded NULL deref, and unclamped negative vertex alpha.  Then the whole
//  thing stayed switched off, because ctx->dolm is `r_decal_lightmap.ival && ...`
//  and that default is "0".  This is the line that turns on what 246 built.
//
//  That default lives in the engine tree this game SHARES with nettest
//  (r_part.c:603), so it is set here rather than there.
//
//  MEASURED, same frame, same vantage (the user's own save005), mean luminance:
//
//                              r_decal_lightmap 1    0 (shipped)
//      overlay, brick right           21.9           141.7
//      overlay, brick low             22.6           130.8
//      overlay, pale panel            36.1           223.0
//      world, brown wall              54.2            54.2   <- untouched
//      world, tiled floor             53.9            53.9   <- untouched
//      world, ceiling                 31.4            32.7   <- untouched
//
//  34.25% of the frame changes and every bit of it is inside an overlay
//  footprint, which is the shape a correct fix has.  Read at PLACEMENT time, not
//  at draw time -- setting it after a map is loaded needs a vid_restart to
//  re-clip, which looks exactly like the cvar doing nothing.
// ---------------------------------------------------------------------------
set r_decal_lightmap      1

// ---------------------------------------------------------------------------
//  hl2_animated -- AnimatedTexture flipbooks, finally switched on.  (Patch 253)
//
//  Source's AnimatedTexture proxy is a flipbook whose frames all live inside one
//  VTF.  hl2_animated has defaulted to 0 since Patch 195 built the feature, so
//  every one of them has drawn frame 0 forever: surf_demise's smoke is one still
//  frame of a 331-frame 24 fps loop, and surf_the_internet's screens are 34
//  paused videos.
//
//  PATCH 250 LEFT IT OFF FOR A REASON THAT TURNED OUT TO BE A MIS-MEASUREMENT.
//  It took six screenshots 250 ms apart, found 0.00%-0.35% of pixels moving with
//  maxdelta as low as 8, and concluded the flipbook "selects a frame and then
//  never advances".  250 ms at 24 fps is SIX frames of soft grey smoke, which
//  genuinely does look identical -- and maxdelta 8 is not zero.  Re-measured at a
//  3.5 s baseline (84 frames) WITH the control that run never took, since
//  elly/animated_smoke also carries #SCROLL and is moving either way:
//
//                                consecutive-shot diff, same vantage, same 3.5 s
//      hl2_animated 1            99.70% / 11.59% of pixels, mean delta 9.559
//      hl2_animated 0            0.09%  /  0.05%,           mean delta 0.064
//                                                           ratio 87x
//
//  It advances.  Its suspect was wrong too: img_vtf.c:398's `depth = faces` is in
//  the NON-array branch; the array branch (:407-419) sets depth = numframes, and
//  r_imagelist confirms the texture reaches the GPU as `Array 256*256*331`.
//
//  THE DEFECT THAT WAS REAL, and it was not the one anybody suspected.  Of the
//  927 materials this reroutes across 269 maps, 456 -- 49% -- are UnlitGeneric,
//  and mat_vmt.c draws an unrouted one as a plain PASS with no lightmap, because
//  unlit means unlit.  vmt/animated sampled one unconditionally, and `!!samps
//  lightmap` is not a passive declaration: it sets SHADER_HASLIGHTMAP, which is
//  the flag Mod_LightmapAllocSurf gates on, so the surface was HANDED a real page
//  with the room's real lighting.  Every animated sign, screen and ad in the
//  library would have gone dark, and it would have read as "the flipbook is too
//  dim" rather than as a lighting bug.  Patch 253 gates the declaration itself on
//  !UNLIT.  Verified two-sided inside one build, both permutations of the one
//  shader:
//      tiktok/videos/dance11   vmt/animated#ANIMRATE=6#UNLIT   haslightmap=0, lmpage -1
//      elly/animated_smoke     vmt/animated#...#ANIMRATE=24    haslightmap=1, lmpage 221
//
//  WHAT IT COSTS: nothing measurable.  Three interleaved OFF/ON pairs at each of
//  two vantages on surf_demise, the worst map for it (552 smoke displacements in
//  a shell around the whole map, additive and blended):
//      vantage A   OFF 430.0 fps   ON 452.5     (ON 5.2% faster)
//      vantage B   OFF 515.2 fps   ON 501.5     (ON 2.7% slower)
//  The sign flips between vantages and both gaps sit inside a within-condition
//  spread of ~70 fps, so this is below the noise floor, not free.  53% and 39% of
//  pixels change when the cvar flips at those two vantages, so the feature really
//  was in the frames being timed.
//
//  WHAT IT LOSES, honestly.  vmt/animated is deliberately narrow -- no cubemap, no
//  normal map, no selfillum.  Of 668 distinct routed materials, 407 are unlit and
//  lose NOTHING, because the pass path they use today cannot sample s_reflectcube
//  either (mat_vmt.c:1609 says so) and an unlit surface has no lighting for a
//  normal map to perturb.  The real cost is confined to the 261 lightmapped ones:
//      205  lose nothing -- a pure flipbook
//       27  $selfillum        24  $envmap        24  $bumpmap        5  $detail
//  So ~56 materials trade a secondary shading term for an animation that was
//  always meant to play.  Set hl2_animated 0 to put every flipbook back on frame
//  0 exactly as it shipped.
//
//  Set here rather than in the plugin: fteplug_hl2 is deployed to nettest too.
// ---------------------------------------------------------------------------
set hl2_animated          1

// ---------------------------------------------------------------------------
//  A sky for a map that declares none (build 27 / engine patch 211)
// ---------------------------------------------------------------------------
//  surf_colin_blaster_69000 has NO worldspawn `skyname` key at all.  Its only
//  sky asset is its own packed materials/tools/toolsskybox2d -- an UnlitGeneric
//  %compile2Dsky with one flat 256x256 image and no cubemap.  The faces are
//  genuinely sky faces (the VBSP plugin maps TIHL2_SKYBOX -> SURF_DRAWSKY), but
//  with no name R_SetSky leaves forcedsky NULL and the sky chain falls through
//  to that surface's own shader -- so one picture ends up on all six faces, and
//  the top is where that reads as obviously wrong.
//
//  Censused over the 1084 installed cstrike maps: 1074 declare a skyname, 10 do
//  not.  So this fills a hole on about 1% of the library and is inert on the
//  rest.  r_skybox still overrides BOTH this and a map that declares its own;
//  this only ever applies where there was nothing.
//
//  The name itself is set further down, in the Skybox block, beside the essay
//  about why it stopped being a QC-side cvar.  Nothing to set here.

// Source-style floating console window rather than the top-of-screen slab.
set con_window            1

// ---------------------------------------------------------------------------
//  The console window itself (build 27 / engine patch 211)
// ---------------------------------------------------------------------------
//  Everything below is a cvar rather than a rebuild, because every one of them
//  is taste and none of them persists: the window geometry resets on each
//  launch, so re-tuning it must not mean re-tuning the engine.
//
//  con_window_rect is read ONCE, when the console is created, so a change here
//  lands on the next launch.  "0 0 640 480" is the stock corner-anchored window.
//  960x640 is +50% wide, +33% tall, 3:2, and 64 off both walls.
set con_window_rect "64 64 960 640"

//  The title bar is the drag handle.  Its height is the console font's height
//  plus this padding top and bottom -- so at con_textsize 16 it is about 22px
//  against the engine's flat 8, which is the whole of why it was hard to hit.
//  The title now reads "Console", is left-aligned, and is drawn in the SAME
//  face as the console text (font_console) rather than the engine's 8px bitmap.
set con_window_titlepad   3

//  The scrollbar. 8 is the engine's width; 16 is twice that.
set con_scrollwidth      16

//  The RIGHT and BOTTOM resize grips.  8 is the engine's; 16 is twice that, and
//  the bottom-right corner is both at once -- so the corner you actually reach
//  for goes from an 8x8 target to a 16x16 one, four times the area.
//
//  The scrollbar moves inward with this rather than being eaten by it: the grip
//  is outside everything else, so widening it does not take back the clickable
//  width the line above just bought.  The LEFT grip is deliberately still 8 --
//  the request was the right side and the bottom, and a window you resize from
//  its bottom-right corner does not need a fat left edge.
set con_gripsize         16

//  The console was blue: SRGBA(0, 0.05, 0.1), a navy with literally zero red.
//  Two colours now, and the title bar, the resize edges, the scrollbar track and
//  its thumb are all derived from them.  con_colour_back "0 0.05 0.1" restores
//  the previous look exactly.
set con_colour_back "0.10 0.10 0.13"
set con_colour_accent "0.62 0.74 0.94"

//  THE ^-CODE PALETTE, AND IT REACHES FURTHER THAN THE CONSOLE.  consolecolours[]
//  is the CGA RGBI table and it is read by gl_font.c for EVERY ^N glyph the
//  engine draws -- the console, chat, Con_Printf, Draw_FunString -- and by
//  m_items.c for the built-in menus.  So this also recolours the timer's
//  ^3practice^7 and every coloured console line.  It does NOT touch anything
//  drawn from an explicit colour vector, which is most of the FTESurf HUD
//  (Timer_Color, HUD_QualityColor, the segment column): those are unchanged.
//
//  `con_palette 0` puts all of it back in one command, live, no restart.
set con_palette           1

//  The completion dropdown.  2 opens the list as you type, as a scrollable
//  vertical column; 1 is the engine's behaviour (only after Tab, and wrapped
//  into one line); 0 is off.
//
//  Nothing is highlighted until you press Up/Down/Tab, and that is deliberate
//  rather than incidental: con_commandmatch is the same variable ENTER tests, so
//  a list that merely APPEARS cannot change what ENTER does to a line you typed
//  in full.  Once you navigate, ENTER takes the highlighted row.
//
//  UP AND DOWN WALK THE DROPDOWN, not the console history, whenever the dropdown
//  is showing rows under a line you typed (Patch 213).  Up starts at the row
//  furthest from the input line, Down at the nearest.  History is not lost: the
//  arrows are history's again on an empty line, and once you HAVE walked into
//  history they stay history's until you press Enter -- so recalling a line and
//  pressing Up again still does what it always did.
//
//  Patch 215 corrected the DIRECTION.  The rows were being built in descending
//  index order, so Up walked toward the bottom of the screen and Down toward the
//  top -- the list read backwards and so did the arrows.  They now read and walk
//  top-to-bottom, and the "N more" marker sits at the bottom with the entries it
//  is counting rather than at the top away from them.
//
//  While the dropdown is open the mouse wheel walks it instead of the
//  scrollback.  The scrollback is still on the (now twice as wide) scrollbar and
//  on PGUP/PGDN, and the wheel goes back to scrolling as soon as the input line
//  has nothing to complete.
set con_displaypossibilities 2
set con_completionrows   12

//  Where the list is drawn.
//
//    0  above the input line, a drop-UP.  Builds 27 and 28.
//    1  below it, INSIDE the console.  Patch 215.
//    2  below it, as a floating popup OUTSIDE the console.  Patch 226, and the
//       default here.
//
//  WHY 1 WAS NOT THE ANSWER, and this is the report that got 2 written:
//
//      "the real dream is to have it part of an actual drop down, separate from
//       the console, so that the console text enter bar never has to shift"
//
//  The console is drawn from the bottom up, so at 1 there is nothing under the
//  input line to draw into and the list has to claim the bottom band with the
//  input line moving up above it.  The field therefore shifts every time the
//  match count changes -- patch 215 said so out loud and could not avoid it: a
//  bottom-anchored console can pin the field or put the list under it, not both.
//
//  Patch 215 also said a true overlay was impossible, because a console window is
//  scissored to its own rect and anything hanging below it would be clipped away.
//  That was right about the scissor and wrong about the conclusion -- the scissor
//  is released a few lines later and the console has nothing left to draw by
//  then, so the popup lifts the clip, paints, and puts it back.  The list is out
//  of the console's vertical budget entirely, which is the thing that pins the
//  field: at 2 the input line is on the same scanline with 0, 3, 12 or 21
//  matches showing.
//
//  It flips above the input line when there is no room below, the way any
//  combobox near the bottom of a screen does, and it is opaque, because it hangs
//  over the game and a list of map names read against a moving skybox is not a
//  list.
set con_completiondown    2

// ---------------------------------------------------------------------------
//  What ENTER does once you have arrowed onto a row.
//
//      "when you type 'map kits' and then arrow down to 'map surf_kitsune' I
//       want the first enter to submit the map, it simply types it out for you
//       in the text box instead of loading directly into the map."
//
//  0 is the engine's two-step: the first ENTER types the row into the line and a
//  second one runs it.  1 runs it outright.
//
//  TAB takes over the half ENTER gives up -- with a row highlighted it fills that
//  row into the line and leaves the cursor there, which is the "types it out for
//  you" gesture ENTER used to be.  SHIFT+ENTER does the same and always did.
//  ESCAPE still closes the list without touching the line.
set con_completionenter   1

// ---------------------------------------------------------------------------
//  `map` completion matches anywhere in the name, not just at the front.
//
//  Every map here is called surf_<something>, so a prefix match means the first
//  thing you can usefully type is "surf_" and the part you actually remember --
//  kitsune -- can never find anything.  At 1, `map kits` offers surf_kitsune and
//  surf_kitsune_mom.
//
//  It applies to the map name only.  The subdirectory form (maps/<dir>/) still
//  prefix-matches, because there the typed text names a DIRECTORY and the engine
//  opens every directory that matches -- widening that to "contains" would buy
//  nothing and walk more of the disk.  Tab still completes to the longest common
//  prefix of the matches, and will now decline rather than SHORTEN what you
//  typed: `map a` matches most of the library, whose common prefix is nothing.
set sv_mapcompletion      1

// ---------------------------------------------------------------------------
//  Momentum timer zones.
//
//  Read from maps/zones/{local,online}/<map>.json -- external files written
//  by Momentum's zone editor, NOT entities in the BSP.  The zone_* classnames
//  in momentum.fgd are Hammer-authoring-only and appear in no shipped map.
//  535 of the 1308 Momentum maps have a zone file; seventeen older ones carry
//  trigger_momentum_timer_* brushes instead and are read from those.  Maps
//  with neither -- including every CS:S map -- draw nothing, silently.
//
//  Colours are Momentum's own shipped defaults (momentum/cfg/config.cfg) so
//  muscle memory transfers, and are accepted in 0-255 or 0-1.  Momentum's
//  overbounce colour collides with its bhop colour, so yellow is used here.
//
//  cancel/bhop/overbounce start OFF: allowBhop reaches 68 regions on one map
//  and would bury the timer zones.
//
//  BUILD 26: !r, !m, !s AND !b NOW AIM YOU, on every map that says where.
//
//  A leg's destination is an info_teleport_destination named by the zone file
//  (505 of the library's 530 main-track starts) or an explicit teleDestPos (the
//  other 25), and the reset used to take that entity's yaw ONLY IF IT WAS
//  NON-ZERO -- so on a map whose start marker points north you kept whatever
//  angle you happened to have.  Build 13 fixed exactly this for the map's own
//  trigger_teleport, with a census ("6,635 of the library's 17,188
//  info_teleport_destination entities point at yaw 0 -- deliberately, since
//  north is a direction"), and left the reset behind.  Two spellers of one rule.
//
//  Measured over the 400 installed maps whose start names a destination:
//
//      227   yaw nonzero    -- reset already aimed you
//      173   angles 0 0 0   -- reset did NOTHING, and now aims you north
//
//  The pitch is levelled to 0 either way, which is what trigger_teleport_touch
//  already does and for the reason it gives: a destination is a yaw marker and
//  pitch on one is authoring noise.
//
//  zone_list  what parsed, before believing anything you see
//  zone_reload  re-read after editing a local .json
//  zone_goto <n>  stand in zone n
//  zone_dests  every leg's destination AND ITS YAW.  `yaw --` now means the
//              region declares no destination at all; a `yaw 0` row is a reset
//              that will aim you north.  Before build 26 those two were one
//              string and you could not tell them apart.
// ---------------------------------------------------------------------------
set zone_draw             1
//  Build 40: was 4096 -- about 78 metres, on maps tens of thousands of units
//  long, so the end zone and every stage past the first were never drawn.
//  0 has always meant "no limit" to the gate in Zone_Draw, and the overlay is
//  one or two batches whatever the count, so nothing is being paid for this.
set zone_draw_dist        0
set zone_alpha          0.9
set zone_bonus            1
set zone_lines            1      // GL_LINES; 0 uses camera-facing quads instead
set zone_thickness      1.5      // world units, zone_lines 0 only
set gl_line_width         2

//  Build 40 -- the other half of "make the zones fully visible".
//
//  zone_xray 1   draw them THROUGH the world (scripts/zones.shader).  Off by
//                default: being hidden by walls is what makes the overlay read
//                as part of the map rather than as an annotation floating over
//                it, and with no depth test two overlapping zones resolve by
//                table order, which on a map whose bonus start sits on top of
//                its main start will look like z-fighting.
//  zone_fill 1   add the side faces, i.e. Momentum's translucent volume rather
//                than a wire cage.  zone_fill_alpha is much lower than
//                zone_alpha on purpose: a face covers hundreds of times the
//                pixels an edge does.
//
//  THERE IS NO zone_pvs, and that is a measured result rather than an omission.
//  PVS was never what was hiding these: the zones are not entities and are
//  never networked, so no server-side PVS test has ever touched one.  A
//  client-side gate was built on checkpvs and removed again -- it culled every
//  zone on the map including the four in front of the camera, in both the
//  SOLID_NOT and SOLID_BBOX forms.  See cl_zones.qc for what to chase if it is
//  ever wanted.
set zone_xray             0
set zone_fill             0
set zone_fill_alpha    0.10

set zonetype_start_draw   1
set zonetype_end_draw     1
set zonetype_stage_draw   1
set zonetype_checkpoint_draw 1
set zonetype_cancel_draw  0
set zonetype_bhop_draw    0
set zonetype_overbounce_draw 0


// ---------------------------------------------------------------------------
//  Source areaportals
//
//  VBSP compiles func_areaportal into an area/portal graph, and the portals
//  START CLOSED -- the plugin's own help text says so: "Normally these start
//  closed and are opened by doors when they move, but this requires the
//  gamecode to signal this."  Source's gamecode does that through entity I/O.
//  We have no entity I/O, so nothing ever opens them, and everything on the
//  far side of one is culled: you get a hole into the void that fills in
//  again once you walk through it, because standing in the void puts you in a
//  different area and the flood-fill flips.
//
//  func_areaportal is in 16.3% of the 1308 installed maps.  surf_sandtrap2
//  has nine.  CVAR_RENDERERLATCH, so it has to be set before the map loads --
//  which is what this file is for.
//
//  map_noareas 1 is the heavier hammer (it also bypasses the server-side area
//  check) and is not needed unless a map still culls wrongly.
// ---------------------------------------------------------------------------
set map_autoopenportals   1

// ---------------------------------------------------------------------------
//  Skybox
//
//  A map names its sky in worldspawn's "skyname".  Some do not -- every
//  Strata (VBSP v25) map checked, surf_colin_blaster_69000 among them, leaves
//  the key out entirely and textures its sky faces TOOLS/TOOLSSKYBOX2D.  With
//  nothing named there is nothing to load and the sky renders as void.
//
//  BUILD 27 MOVED THIS INTO THE ENGINE and the move is worth reading, because
//  the old shape had a bug nobody had tripped yet.  cl_main.qc used to read the
//  entity lump itself and, when the key was absent, write the name into
//  `r_skybox` -- which is the USER'S override cvar, the one gl_warp.c calls
//  "the user's preference" and which beats even a map that names its own sky.
//  Using it as the fallback slot meant the fallback and the override were one
//  variable, so the QC had to CLEAR r_skybox on every map that did name a sky --
//  quietly throwing away any r_skybox the player had set, on the next map load.
//
//  r_skybox_default (engine patch 211) fills the hole inside R_SetSky, which
//  already knows the map named nothing, and is ordered BELOW r_skybox so an
//  explicit override still wins.  `sky` reports which of the three is in force.
//
//  sky_cape_hill is kept as the name: it ships as six loose faces in the
//  Momentum mount, so it resolves without depending on a VPK.  Note its `up`
//  face needed engine patch 211's VMT cross-check to draw correctly -- Momentum
//  ships sky_cape_hillup.vmt naming the LEFT face in $hdrcompressedtexture,
//  which is exactly the "the top uses a side sky texture" report.
// ---------------------------------------------------------------------------
set r_skybox_default sky_cape_hill

// ---------------------------------------------------------------------------
//  HUD
//
//  hud_debug is the left-hand physics column.  It is a debugger rather than
//  part of the HUD, so it is OFF -- `hud_debug 1` brings it back with every
//  line it ever had.
//
//  hud_energy is the small line under the speedometer:
//
//      E = (your feet - the anchor) + |v|^2 / (2*sv_gravity)
//
//  in world units, which is Momentum's number and reads the same in both
//  games -- 52 at a 289 prestrafe on the flat, 45 more than that at the top
//  of a jump.  The full 3D speed goes in, deliberately: vertical speed is
//  height you have not spent yet, and leaving it out would make every arc
//  look like it lost energy on the way up and found it again coming down.
//    1  energy, in units.  The default.
//    2  the same energy written back as the horizontal speed it is WORTH,
//       sqrt(2*g*E).  That is the inverse of the term that built it, so on
//       flat ground it prints the speedometer's own number back at you --
//       which is exactly what it did for every build before this one.
//    0  off.
//
//  hud_energy_ref is WHERE THE ZERO IS, and it is quoted from Momentum's own
//  API documentation, momentum/panorama/scripts/types-mom/apis.d.ts:158 --
//  "the height (in units) reachable above their last jump position".
//    1  the ground you last jumped from.  Momentum's, and the default: the
//       same test in both games has to give the same number or it is not a
//       measurement.  It also always has an answer, including on a map with
//       no zone file.  Walking off a ledge does not move it; only a jump.
//    0  the floor of the start zone of the leg you are on.  Energy against
//       the START, which is the run-long budget -- a different and useful
//       question, and the one the board and the split list are built on.
//  On a surf map the two agree for the whole run: you jump off the block once
//  and never touch ground again.  They diverge exactly where you land.
//  `ui_anchor` pins the zero to where you stand and outranks both;
//  `ui_anchor clear` releases it.  That is also how you measure a jump by
//  hand: anchor, jump, read it -- energy is conserved in flight, so the
//  number is constant the whole way up and down.
//
//  The two windows are in SECONDS rather than frames, deliberately: a frame
//  count means two different windows at 60fps and 300fps, while the movement
//  being measured runs at a fixed 66.7Hz regardless of either.
//    hud_strafe_smooth  the turn-rate window.  0.2 is about thirteen ticks.  It
//                       is a WINDOW AVERAGE of the yaw path now, not a filter on
//                       a per-frame ratio, so every sample in it counts equally
//                       and a short one keeps the sampling noise it exists to
//                       remove.  Half a strafe half-cycle is about 0.33s.
//    hud_strafe_window  the efficiency window.  Shorter than ~2s measures the
//                       ramp you happen to be on rather than how you strafe.
//    hud_strafe_band    full deflection of the bar, as a fraction off ideal.
//                       1.0, and it is not a taste: Strafe_Quality is defined
//                       and non-zero over r in [0,2], i.e. |err| <= 1.  At the
//                       old 0.5 the bar reached its stop while the grade was
//                       still 0.75, so three quarters of the grading range sat
//                       off the end of the scale and a real hand was pinned.
//                       Now the bar ends exactly where the grade reaches zero.
//    hud_strafe_curve   shape of that axis.  1 = linear.  It used to be a
//                       hard-coded signed square root, which at band 0.5 spent
//                       a fifth of the bar's travel on the first 2% of error --
//                       inside a hand's own noise.  0.5 restores it exactly.
//    hud_strafe_minspeed  AIR only -- the air ideal diverges as speed falls.
//                       The ground formula goes to zero instead, so the bar
//                       grades you standing still now, and correctly.
// ---------------------------------------------------------------------------
set hud_scale             2
set hud_speed             1
set hud_energy            1
set hud_energy_ref        1
set hud_strafe            1
set hud_board             1
set hud_keys              1
set hud_debug             0
set hud_board_fade        3
set hud_strafe_smooth   0.2
set hud_strafe_window     2
set hud_strafe_band     1.0
set hud_strafe_curve      1
set hud_strafe_minspeed 200      // below this the ideal rate is a spin, not a strafe
set hud_speed_x         0.5
set hud_speed_y        0.68
set hud_strafe_x        0.5
set hud_strafe_y       0.42
set hud_keys_x            0      // 0 = auto: right gap matches the floor gap
set hud_keys_y         0.84

// ---------------------------------------------------------------------------
//  BUILD 34 -- THE COLUMN SHOWS THE RAMP YOU ARE ON, not just the ones you left
// ---------------------------------------------------------------------------
//      "when you board, present the board energy display on the energy loss/gain
//       display as soon as you make contact and it's recorded, for some reason it
//       waits for you to leave the ramp, which you shouldn't need to do to see
//       the calculations."
//
//  It did wait, and for a reason that was about BOOKKEEPING rather than about
//  display: the touchdown's row is held until the ramp segment closes, because a
//  board row committed at the boundary would sit between two air rows and stop
//  them merging, and a ramp too short to become a row would leave junk behind.
//  All of that still holds.
//
//  The numbers were never the thing that was waiting.  The touchdown's cost is
//  final on the frame you touch -- it is -(v.n)^2/2g, the bite the plane took --
//  and the ride's running total is one subtraction away on every frame after it.
//  So at 1 the column draws a PROVISIONAL pair, dimmer, outside the ring:
//
//      board  -34 e         frozen at contact
//      ramp   +17 e  0.41s  live, ticking up as you carry
//
//  They are replaced by the identical committed rows when you leave the ramp --
//  same numbers, same two lines of arithmetic -- so the swap reads as one thing
//  settling rather than two things happening.  The single-line readout under the
//  strafe bar follows the same rule, because two readouts of one measurement
//  disagreeing would be worse than either of them being late.
//
//  0 is build 33 byte for byte.  It is also the switch to reach for if a live row
//  ever disagrees with the committed row that replaces it.
set hud_seq_live          1

// ---------------------------------------------------------------------------
//  BUILD 34 -- what map this is, top right: FTESurf / name / tier / stages
// ---------------------------------------------------------------------------
//  The tier comes from data/mapmeta.txt by way of the SERVER, which publishes it
//  as serverinfo at map load (engine patch 227).  That file was only ever read by
//  the map browser, and the browser is menu.dat while the HUD is csprogs.dat --
//  two separate progs with no way to hand a value between them.  Going through
//  the server also makes it right in a demo and right for a client whose own copy
//  of mapmeta.txt does not match the server's, which is the case that starts
//  mattering once sessions are peer to peer.
//
//  "Tier 4?" is a submitter's SUGGESTION and "Tier 4~" is inherited from the same
//  map without its port suffix; both are estimates.  "Tier --" means nothing
//  knows, which is the honest answer for the 649 CS:S-only maps Momentum has
//  never indexed -- and is not the same as tier 0, of which there is no such
//  thing.
//
//  The stage count comes from the map's own zone file, not from mapmeta: the zone
//  file describes the map that is actually loaded.  mapmeta answers only when
//  there is no zone file at all.
//
//  x is the block's RIGHT edge and y is its TOP, because it is right-aligned and
//  grows downward.  0.99 leaves the longest line a margin off the screen edge.
//  `hud_edit` lists it as "Map info" and will drag it anywhere.
set hud_mapinfo           1
set hud_mapinfo_x      0.99
set hud_mapinfo_y      0.02

// ---------------------------------------------------------------------------
//  The air-strafe percentage on the segment column (build 18)
// ---------------------------------------------------------------------------
//  Each yellow air row in the column left of the crosshair gains a "% of what
//  you could have got".  100% is a perfect strafe for the whole airtime.
//
//  IT IS A PERCENTAGE OF ENERGY, not of the u/s printed beside it, and that is
//  deliberate.  The optimum in free air is a fixed angle -- wishdir exactly
//  perpendicular to velocity, because AirMove flattens the move vectors before
//  building wishdir -- so the best any tick can do is a^2/2g, with `a` the
//  accelspeed the air cap allows.  At these settings that is a flat 37.5 units
//  of height per second.  Speed is a nonlinear function of energy, so a SPEED
//  percentage would compress at the top: at 1500 u/s a sloppy strafe and a
//  clean one both read above 90%.  Energy is additive, so 50% is half as good.
//
//  Air rows only.  The ramp optimum has no closed form (the perpendicular
//  heading is generally unreachable on a plane) and has to be searched for, so
//  a ramp row shows the gain and no percentage rather than an estimate.
// ---------------------------------------------------------------------------
set hud_seq_pct           1

// ---------------------------------------------------------------------------
//  What the segment rows are measured in (build 20)
// ---------------------------------------------------------------------------
//      0   u/s -- what that energy was WORTH at the speed you left with, which
//          is the build 19 reading and the honest way to compare a gain against
//          a speedometer
//      1   energy, in world units of height
//
//  Energy is the default because it is what the row is actually made of.  The
//  percentage beside it has always been an energy ratio (see hud_seq_pct above),
//  so the figure to its left is now literally that fraction's numerator: a row
//  reading `+52 e  2.14s  68%` says 52 out of the 76 that were available.
//  Before this the row printed a speed next to a percentage of an energy and
//  invited you to relate them, which cannot be done.
//
//  It is the same unit as the `e` readout by the crosshair at hud_energy 1, so
//  the two can be added.  It covers the single-line ramp/air readout under the
//  strafe bar as well -- two readouts of one measurement disagreeing about their
//  unit would be worse than either choice of unit.
//
//  An air segment that ends by LANDING reads about -37 e, which is exactly the
//  height of the jump you just gave back.  In u/s the same fact reads -30 and
//  means nothing.
// ---------------------------------------------------------------------------
set hud_seq_units         1

// ---------------------------------------------------------------------------
//  Joining rows that were one thing (build 20)
// ---------------------------------------------------------------------------
//      0   off; build 19 exactly
//      1   join across an ARTIFACT only
//      2   join always, so the column strictly alternates air/ramp/air/ramp
//
//  "Follow a ramp around a bend and you get two board reports in a row."  The
//  state machine cannot emit two of a kind directly -- the transition is guarded
//  on the kind actually changing.  What happens is that the segment between them
//  was REFUSED (a few ticks of lost ramp contact, a bounce off a lip, anything
//  under 0.10s) and its two neighbours ended up adjacent with nothing between.
//  Mode 1 repairs exactly that and no more.
//
//  It stops at a real gap -- a genuine grounded phase, or a teleport.  The merge
//  exists to put back a row that was LOST, and a grounded phase is not lost, it
//  is deliberately excluded (the ground has its own readout under the bar).
//  Sewing across it would swallow a landing and a jump into one row claiming to
//  be one thing.  Mode 2 is for anyone who wants the alternation more than that.
//
//  A refused segment's energy is no longer dropped either way: it is carried
//  into the next row, so the column sums to the run's airborne+riding energy
//  change.  It never did before, which only became visible once the column
//  started printing energy.
// ---------------------------------------------------------------------------
set hud_seq_merge         1

// ---------------------------------------------------------------------------
//  The touchdown gets its own row (build 25)
// ---------------------------------------------------------------------------
//      0   build 24 exactly: the landing's cost is folded into the ramp row
//      1   air / board / ramp, three rows
//
//  Boarding a ramp at less than a perfect angle costs energy in ONE TICK, in one
//  call to ClipVelocity, and that is a different thing to practise from the line
//  you take down the face afterwards.  Build 19 moved the cost off the air row
//  and onto the ramp row, which was right -- a perfect strafe into a bad landing
//  should not read as a bad air time -- but it left the two indistinguishable:
//  a ramp row of -12 was either a landing you could have fixed or a bad line.
//
//  The split moves ONE value.  Build 19 used the pre-clip energy twice, to close
//  the air segment and to open the ramp segment; the ramp now opens at the POST-
//  clip energy instead and the step between them is the new row.  So the three
//  rows sum to exactly what the two summed to -- the column still adds up to the
//  run's airborne+riding energy -- and only the resolution changes.
//
//  The number is -(v.n)^2 / 2g, which is what the board panel under the strafe
//  bar has drawn as `cost` since build 6.  At hud_seq_units 1 that panel now
//  says it in the same unit as the row, so the two agree by construction.
//
//  It does NOT break the merge above.  The cost is held until the ramp it
//  belongs to closes: a ramp too short to be a row carries its landing into the
//  carry with it, so two air rows either side of a blip still merge into one.
// ---------------------------------------------------------------------------
set hud_seq_board         1

// ---------------------------------------------------------------------------
//  retry (build 18)
// ---------------------------------------------------------------------------
//  `retry` restarts the map -- every door, platform, button and trigger back to
//  its spawn state -- and puts you back exactly where you were, with your
//  angle, your velocity, your run clock, your splits, your checkpoints and your
//  recording intact.  The run is NOT marked practice: nothing moved you, the
//  map reset around you.
//
//  0 gives you Patch 167's behaviour instead -- restart and respawn at the map's
//  spawn point, run discarded -- which is exactly the pre-build-18 build, so
//  this stays a one-command A/B.
//
//  It refuses with more than one player connected, because a retry restarts the
//  map for everyone and "whose position is restored" then has no good answer.
// ---------------------------------------------------------------------------
set rec_retry             1

// ---------------------------------------------------------------------------
//  The start may not be hopped (build 19)
// ---------------------------------------------------------------------------
//  A run counts if you WALKED out of the start zone, or left it on ONE initial
//  jump.  Hop out and the run is marked practice.
//
//  "Initial jump" is not a new idea here: it is the same test that already
//  decides whether the game releases +forward for you -- a jump taken from a
//  ground phase of at least run_prestrafe_time.  So the rule is legible before it
//  is enforced: if the game released your +forward, that was an initial jump; if
//  it did not, it was a hop.  The server owns the number and publishes it over
//  serverinfo, so the rule and the assist cannot drift apart.
//
//  A ground DWELL and not a jump count, deliberately, because the start box is
//  not always the platform: land one unit outside it and a zone-based rule would
//  let you keep hopping for free.  A dwell does not care where you are standing.
//
//  It is also not a ground-flag edge, which is the obvious detector and cannot
//  see a bhop at all -- CategorizePosition sets FL_ONGROUND and CheckJumpButton
//  clears it inside the same tick, so a perfectly timed hop never appears
//  grounded to the gamecode.  See SV_TimerJumpWatch.
//
//  0 restores the previous build exactly.  A bhop or KZ map wants 0: hopping is
//  the whole game there.
// ---------------------------------------------------------------------------
set run_starthop          1

// ---------------------------------------------------------------------------
//  ...and the line that makes the rule above actually fire (build 20)
// ---------------------------------------------------------------------------
//  run_starthop shipped at 1 in build 19 and did nothing, on every start anyone
//  actually makes.  SV_TimerArm reset the flag that gates the rule but not the
//  AIR-PHASE CLOCK the rule settles on, and that clock is written in exactly one
//  place -- so it survived the arm carrying the timestamp of whatever fall came
//  before it.  Every ordinary route to a start zone follows a fall (!r, !s, !b,
//  zone_goto, a map fall-off trigger), so the tick after the arm read an air
//  phase seconds old, satisfied the settle, and closed the window before the
//  player had touched the keyboard.
//
//  Measured, same gesture, arming after a 1.7s fall:
//
//      run_starthop_strict 0    start: ok 1     <- build 19; rule already dead
//      run_starthop_strict 1    start: ok 0     <- window open
//
//  It also stops the settle closing while you are still standing in the box: a
//  ramp clip or an airborne phase THERE is not the launch being over, it is the
//  launch not having happened.  And it exempts a stage handover, which begins
//  airborne at 2000 u/s and would otherwise be marked practice on its own
//  first jump.
//
//  0 is build 19 byte-for-byte -- which means "the rule never fires", so 0 is
//  also the setting for allowing hopped starts without turning the rule off.
// ---------------------------------------------------------------------------
set run_starthop_strict   1

// ---------------------------------------------------------------------------
//  The clock stops instead of going back to zero (build 20)
// ---------------------------------------------------------------------------
//  Build 19 kept a cancelled time on screen in grey, but only for the routes
//  that pass through SV_TimerVoid -- `!r`, a cancel zone.  (setpos was one of
//  them until build 24 made it mark the run practice instead, which keeps the
//  clock running rather than latching a stopped one.)  Walking or
//  falling back into the start box, or being put there by a map
//  trigger_teleport, reaches the arm through SV_TimerTryArm with no void
//  anywhere on the path, so there was nothing to latch and the readout snapped
//  to 0:00.000.  Now it holds, greyed, and says `stopped`.
//
//  0 restores the snap-to-zero.
// ---------------------------------------------------------------------------
set run_rearmstops        1

// ---------------------------------------------------------------------------
//  A map teleport tells the timer it happened (build 20)
// ---------------------------------------------------------------------------
//  trigger_teleport has never called SV_TimerWarped, so run_t_lastorg stayed at
//  the departure point and the next tick's SWEPT zone test ran a segment across
//  the whole map -- firing every stage, checkpoint and END zone on the line
//  between the two ends.  That can silently FINISH a run.  SV_ZoneMove has
//  solved this since build 10, three lines after its own setorigin; the map's
//  own teleports never got the same call.
//
//  It warps only.  It does not void and does not taint: plenty of surf maps
//  teleport you legitimately mid-route, and a teleport that lands you in a start
//  zone is caught one tick later by the rule above instead.
//
//  0 is the old behaviour, for bisecting a map that somehow depended on it.
// ---------------------------------------------------------------------------
set run_teleport_warp     1

// ---------------------------------------------------------------------------
//  Source entity I/O -- the wiring BETWEEN entities (build 37)
// ---------------------------------------------------------------------------
//  A Source map expresses everything that is not a property of a single brush
//  as an OUTPUT: one keyvalue per connection, naming a target, an input, a
//  parameter, a delay and a fire count.  FTESurf modelled none of it until
//  build 37, and two bhop maps are unplayable for exactly that reason --
//  bhop_futile renames the player as they cross each platform and gates each
//  platform's reset teleport on that name, so with the renames missing the
//  first platform you land on sends you back to the start.
//
//  1 reads them.  0 is the bisection switch: no outputs are materialised, so
//  every trigger behaves precisely as it did in build 36.
//
//  Turning it OFF does not restore the 4,033 `'X' is not a field` warnings per
//  VBSP map load -- those are suppressed by the ED_ParseUnknownEpair hook
//  merely EXISTING, which is an engine-side test this cvar cannot reach.  That
//  is deliberate: under `developer 1` those warnings turned an 8.3 s map load
//  into 60.7 s, and nobody bisecting an entity bug wants that back.
//
//  Map-run console commands are ALLOW-LISTED to say/echo/print, and that is
//  not theoretical caution: bhop_futile's logic_auto fires
//  `sv_airaccelerate 150` at map spawn.  A map that can set the movement cvars
//  can rewrite the physics your leaderboard time was set under.  Refusing it
//  costs that map nothing -- cfg/mode_bhop.cfg already sets 1000, and the
//  movement lock reverts any live write anyway -- and the refusal is printed
//  at developer 1 rather than being silent.
// ---------------------------------------------------------------------------
set vbsp_entity_io        1

// ---------------------------------------------------------------------------
//  Displacement collision winding (patch 256)
// ---------------------------------------------------------------------------
//  A BIH collision triangle is a ONE-SIDED prism: com_bih.c builds its face
//  plane from the triangle's winding and then puts four units of solid behind
//  that plane.  Which way the plane points therefore decides whether those four
//  units are buried under the terrain or stacked on top of it, and nothing in
//  the displacement loader ever told it.  The winding follows the parent face,
//  and Source winds a face around its OUTWARD normal -- which is the reverse of
//  the plane's on any dface_t with `side` set (SURF_PLANEBACK).
//
//  Measured by reimplementing the loader over the WHOLE map library -- all 627
//  maps that have displacements, 178459 displacements, 20.48M collision tris:
//
//      side==0  129219 disps  14722027 tris outward (99.38%),   92491 inverted
//      side==1   49240 disps     60379 tris outward  (1.06%), 5625203 INVERTED
//
//  Not a tendency -- the discriminator.  side==1 is 27.6% of every displacement
//  in the library, and on all of them the player has been standing 4/|n_z|
//  units above the visible surface (4 flat, 5.7 on a 45 degree face) with a
//  perfectly standable up normal, so nothing about it reads as a collision
//  bug.  Where such a displacement meets a correctly wound one, that is a 4-6
//  unit invisible step: the seam snag.
//
//  Collision only.  The render mesh keeps the original winding -- 0 aliases the
//  two arrays again and reproduces every build before this one exactly.
// ---------------------------------------------------------------------------
set hl2_dispwinding       1

// ---------------------------------------------------------------------------
//  WindowImposter -- Source's fake second skybox (patch 263)
// ---------------------------------------------------------------------------
//  A Source map gets ONE skybox.  Mappers who want a second one in a single
//  room lay a thin brush across the opening with a WindowImposter material,
//  which draws its $envmap cubemap sampled by the VIEW DIRECTION, ignoring the
//  face's own orientation.  That last part is the trick: a flat ceiling drawn
//  that way reads as open sky rather than as a mirror.
//
//  surf_monolith is the report that found it -- "b4 ... missing sky texture".
//  Bonus 4 is roofed and walled by a 2-unit slab of fakeskies/mpa45, laid FOUR
//  UNITS under the map's real sky brush, so the room shows a red sky while the
//  rest of the map shows sky138a.  The map's own skybox was never broken; it
//  was hidden.
//
//  The class was unimplemented, and the parser's unknown-class arm was silent,
//  so the material fell through to vmt/unlit.  With no $basetexture to use, the
//  default-fill handed it the material's own path -- which resolves to the
//  CUBEMAP file, loaded as PTI_CUBE.  A cube texture is not a 2D base, so the
//  backend substituted missing_texture: a 16x16 checkerboard of black and
//  palette index 255, and index 255 is 159,91,83.  That dusty salmon stretched
//  across a room is what was reported as a missing sky.
//
//  155 materials across 59 of the 1310 maps.  All 155 carry an $envmap, none
//  carries a $basetexture, and every one of them resolves inside the map's own
//  pakfile.  surf_polytron (22), bhop_angst (13) and surf_angst (11) are the
//  heaviest users.
//
//  0 draws them nodraw instead, which is the way to see what a slab is hiding
//  (on monolith, the real sky138a).  It is not the old behaviour -- a
//  checkerboard is not a fallback worth keeping.
// ---------------------------------------------------------------------------
set hl2_imposter          1

// ---------------------------------------------------------------------------
//  Triangle collision bevels (patch 258)
// ---------------------------------------------------------------------------
//  Patch 256 was a real bug and it was NOT the seam snag.  With the winding
//  fixed the snag survived, and pm_dispprobe said why in one line:
//
//    frac 0.0000 norm 0.506 -0.759 0.411  ss 0 as 0  org 10529.1 -324.1 5357.3
//      via plane 4 edge p3p1 of tri (...)  face norm 0.063 0.508 0.859
//
//  Sweeping a box against a triangle is a point query against the Minkowski sum
//  of the two, whose faces are the 2 triangle planes, the 6 box planes, and one
//  plane per triangle-edge x box-axis pairing -- nine.  com_bih.c built the
//  first two groups and, in place of the nine, three IN-PLANE edge planes with a
//  `//FIXME: use adjacency info` beside them.  Those three never over-tighten,
//  but they leave the swept volume a strict SUPERSET bulging along every edge.
//
//  So on bhop_monster_jam displacement #89 the player is stopped dead by a plane
//  that lies IN the plane of a triangle whose own face normal is z 0.859 --
//  walkable ground.  The reported normal's z of 0.411 is below the standable
//  threshold, so the step-down is refused as well, and you are wedged.  An exact
//  separating-axis test puts the box 0.11 units CLEAR of that triangle and names
//  the separating axis: edge2 x Y, one of the nine that were missing.
//
//  Measured in the engine, same map load, same start, deterministic (each state
//  run twice, identical to the decimal):
//
//      in-plane edge-plane contacts   111 -> 0
//      unstandable normals reported   134 -> 3
//      step-down rejections            47 -> 3
//      forward progress in 1.5s       173 -> 406 units
//
//  Each bevel supports the whole four-unit PRISM, not just the triangle, so it
//  cannot shave the slab's corners -- a plane that cuts the solid volume is a
//  false exclusion, which is falling through the world.
//
//  0 restores the old 11-plane set exactly, for A/B against recorded times.  It
//  does not restore correctness, and it changes collision on every trisoup in
//  the game -- displacements, static prop meshes, Q3 patches.
// ---------------------------------------------------------------------------
set pm_trisoup_bevels     1

// ---------------------------------------------------------------------------
//  Ladders (patch 260)
// ---------------------------------------------------------------------------
//  Source movement has never had ladders here.  The contents were always
//  arriving -- 1750 brushes across 242 library maps carry CONTENTS_LADDER, and
//  a probe at a real ladder face reads 0x10034000 LADDER|PLAYERCLIP|MONSTERCLIP
//  back from an ordinary MASK_PLAYERSOLID trace -- but pm_source.c never looked.
//  This is CMomentumGameMovement::LadderMove, hooked after the duck, as Source
//  hooks it.
//
//  ON BY DEFAULT.  Ladders are intended map content -- a mapper who textured a
//  brush with CONTENTS_LADDER and dropped an info_ladder beside it meant it to be
//  climbable, and 242 library maps did.  Shipping this at 0 would keep honouring
//  a bug.  The mover is transcribed from Momentum and verified in-engine: climbs
//  the full 188-unit ladder, descends it, jumps off mid-climb without sticking,
//  hangs still when no key is held, and does NOT attach on open ground.
//
//  What that verification does NOT cover: it ran on one map, not on all 242.  The
//  failure mode to watch for is a ladder that grabs you when you did not want it
//  -- set this to 0 and the mover is bypassed entirely, restoring old behaviour
//  exactly.
//
//  This changes what a run MEANS on maps where a ladder is a shortcut: routes
//  that were impossible become possible.  Times recorded either side of this
//  switch are not comparable on those maps.
//
//  KNOWN GAP, and it is not a setting.  About 10% of the library's ladder
//  brushes belong to brush-entity submodels rather than the world, and those the
//  QC forces non-solid (func_illusionary, func_simpleladder, func_brush with
//  Solidity "Never Solid") are in no collision tree a player trace walks and in
//  no physent -- no value of this cvar can reach them.  Eight maps have no
//  world-reachable ladder brush at all, among them surf_fungus, bhop_collective
//  and bhop_rpg.  Fixing those is QC work, not a pmove change.
//
//  The other two are Momentum's sv_ladder_dampen / sv_ladder_angle and want
//  their stock values: they damp sideways motion when you meet the rungs at a
//  glancing angle, so you climb instead of skating along the ladder's face.
// ---------------------------------------------------------------------------
set pm_ladders            1
set pm_ladderdampen       0.2
set pm_ladderangle       -0.707

// ---------------------------------------------------------------------------
//  trigger_setspeed (patch 256)
// ---------------------------------------------------------------------------
//  372 volumes across 94 maps that have spawned INERT since the beginning, and
//  silently: with no spawn function they took the `trigger_` prefix arm of
//  SV_OnEntityNoSpawnFunction, which returns before the "unknown classname"
//  warning, so the only symptom was a booster that did nothing.
//
//  Two dialects are live and both are handled -- the mode dialect from the
//  shipped FGD (205 entities, 83 maps) and the older boolean one (174, 12).
//
//  This WRITES VELOCITY, so 0 is worth having: on those 94 maps a wrong decode
//  is a dead stop or a launch.  It also changes what a recorded run means --
//  surf_bossfight's start-line pads are 5000 u/s -- so runs set either side of
//  this build are not comparable on them.  StrictMode is counted, not built.
// ---------------------------------------------------------------------------
set run_setspeed          1

// ---------------------------------------------------------------------------
//  Booster pads: what a boost was worth (patch 249)
// ---------------------------------------------------------------------------
//  2004 `AddOutput basevelocity` outputs across 298 of the 1310 maps are the
//  boost pads, and until patch 249 every one of them delivered about 1.5% of
//  its number -- the carrier was being ridden and drained by gravity instead
//  of being cashed out into velocity.  Set this to 1 and every cash-out prints
//  what was held and what it moved the speed by, so a pad authored
//  `basevelocity 0 0 650` can be checked to be worth 654.9 rather than 9.8.
// ---------------------------------------------------------------------------
set run_bv_debug          0

// ---------------------------------------------------------------------------
//  How long you may stand on a bhop block (build 37)
// ---------------------------------------------------------------------------
//  A func_bhop teleports you if you dwell on it. Momentum's own key for this
//  is TimeLimit, per block, and "if this is 0, then use sv_bhop_time_limit".
//
//  This number is what bhop_arcane actually runs on: none of its 1122 blocks
//  writes a TimeLimit at all, so every one of them falls through to here.
//  0.1 is momentum.fgd's own default for the key.
//
//  Raise it if blocks feel like they drop you too eagerly; it is the single
//  knob for the whole class.
// ---------------------------------------------------------------------------
set sv_bhop_time_limit  0.1

// ---------------------------------------------------------------------------
//  A fluffed start can be taken back (build 21)
// ---------------------------------------------------------------------------
//  Hop twice out of the box instead of once and build 20 marked the attempt
//  practice until you physically walked back into the start zone -- SV_TimerArm
//  was the only thing that cleared the taint.  Now stopping is enough: stand on
//  the ground for run_prestrafe_time and the hop is forgiven, so the next jump is
//  judged as a fresh initial jump.  Chat says `start re-armed`.
//
//  THE DETECTION IS THE ONE YOU CAN ALREADY FEEL.  It is the same dwell that
//  makes the game release +forward for you, which is the same dwell the hop rule
//  judges a jump by -- so if the game let go of W, you have re-armed.  One
//  number, three places, and no new feedback needed to make it legible.
//
//  INSIDE THE START ZONE ONLY, and the boundary is load-bearing.  While armed
//  there is no clock to rewind and no ground to skip, so forgiveness is free.
//  Out on the platform it would not be: 0.25 s of ground friction sheds only
//  about 64% of your speed, so a 1500 u/s bhop would still leave at ~535 against
//  a legal pre-strafe of ~289, and the run would have to restart from wherever
//  you stopped -- a route skip on any map with a run-up.  That is exactly the
//  hole build 20 was asked to close.  From out there, walk back into the box.
//
//  0 is build 20 byte-for-byte.
// ---------------------------------------------------------------------------
set run_rearmhop          1

// ---------------------------------------------------------------------------
//  A stage can be failed, and it is armed like a run start (build 43)
// ---------------------------------------------------------------------------
//  "only record the stage time/demo/line that actually completes, don't record
//  every fail of the stage, every fail should cause a time reset for timing of
//  that stage."
//
//  Until build 43 a stage was timed from the tick its boundary PLANE was
//  crossed, and that crossing could not be taken back.  So a stage you fell out
//  of and walked back up to was still being timed from the first attempt: the
//  "stage time" written at the next boundary contained the failed attempt, the
//  walk back and the good run, and it was the only number the stage board saw.
//
//  A stage boundary is now an ARM and a START, in the same three beats the run
//  start has always used:
//
//      run_stagefail   re-entering the stage's own zone resets that stage.  The
//                     RUN clock is untouched and keeps counting -- you already
//                     paid for the failed attempt in the total, which is the
//                     whole penalty and an honest one.  A `restart` record goes
//                     into the .rec, the HUD flashes `stage N reset` and shows
//                     `attempt N`, and `cmd timer` counts it.
//      run_stagearm    the stage is timed from when you LEAVE the boundary box,
//                     not from the plane crossing.  This is what "counted with
//                     no pre-speed, so jump start, or walking out" asks for.
//
//  run_stagearm IS A MEASUREMENT CHANGE AND IT RETIRES OLD STAGE TIMES.  Every
//  stage recording written before build 43 was measured plane-to-plane; from
//  here a stage that is a PLATFORM is measured exit-to-plane, which is shorter
//  by however long you stood on it.  31 of the 33 stage files on disk and 22
//  best.pb rows are in the old convention and will be beaten on the first lap.
//  That is deliberate -- it fixes surf_kitsune/stage_3, which currently ranks a
//  deliberate stage run against two lifted ones in one list, comparing two
//  different measurements in one run_pb_ticks slot.  `run_stagearm 0` keeps the
//  old measurement with the fail rule still on, if it needs taking back.
//
//  A BOUNDARY YOU FLY THROUGH IS UNAFFECTED at either setting.  Nothing arms
//  unless you are actually observed inside the box, so a plane crossed at 2000
//  u/s keeps build 24's measurement exactly.  On the shipped maps that is most
//  boundaries.
//
//      run_stageclean  the stage board asks whether THIS STAGE was clean rather
//                     than whether the run around it was: "if a stage is done in
//                     practice mode, but the next one has been started legit,
//                     then that stage should be counted as legit and recorded."
//                     Noclip in stage 2 no longer costs you stages 3, 4 and 5.
//                     Holding noclip ACROSS the boundary still taints the stage
//                     you hold it into -- the watcher reads the state every tick
//                     and not just the edge.  A ghosted stage is refused
//                     outright, which is new.  0 restores build 42's run-level
//                     test.
//      run_stagehop    a bhop out of a boundary box is a legal stage start.  1 is
//                     build 24's rule and keeps the stage boards populated on
//                     bhop maps; 0 requires the same pre-strafe dwell that a run
//                     start does.  bhop_eazy is the map to decide it on -- it
//                     has the most lifted stage slices on disk, and getting this
//                     wrong empties its three stage boards.
// ---------------------------------------------------------------------------
set run_stagefail         1
set run_stagearm          1
set run_stageclean        1
set run_stagehop          1

// ---------------------------------------------------------------------------
//  Segmented, cheated, or practice -- three words where there was one (build 44)
// ---------------------------------------------------------------------------
//  "stitched runs are legit settings but save locked, anything else cheated,
//  sv_cheats, noclipped is a cheated run." ... "that needs to be labeled
//  'cheated run' not segmented."
//
//  Until build 44 there was ONE taint and the leaderboard drew one word for it --
//  `stitched` -- over noclip, setpos, sv_cheats, a save-lock load and a hopped
//  start alike.  Two of those are somebody practising with the ruleset's own
//  physics and the rest are not.  Now:
//
//      cheated    sv_cheats, noclip or setpos.  Red on the clock and on the row.
//      segmented  a save state was used: legal settings, stitched together.
//      practice   the residual, and it is honest -- today that is a hopped start
//                 and every recording written before this build, where a noclip
//                 and a save-load are genuinely indistinguishable in the file.
//                 Those are NOT guessed into one of the other two.
//
//  NOTHING ABOUT RANKING CHANGED, AND NO GESTURE NEWLY COSTS YOU A RUN.  Both
//  new words still mean `practice` to the filter that decides a personal best,
//  because both bits imply it -- and every gesture they name was already a taint
//  before this build, including holding the save-lock, which has stopped the
//  clock and marked the run since build 18.  What changed is what the board, the
//  clock and the replay panel CALL the run.
//
//  `run_class 0` writes neither new word: every taint reads `practice` again.
//  It bisects the words, not the rules -- and BUILD 46 is what made the second
//  half of that sentence true.  It used to read "build 43 exactly", which it
//  was, and build 43 did not watch sv_cheats at all: so at 0 an sv_cheats run
//  came out clean and RANKED.  A cvar named after the vocabulary was deciding
//  the ruleset.  sv_cheats is now a taint at every setting of it.
//
//  Read this as a development switch for bisecting the classification code and
//  not as a knob.  At 0 a cheated run also goes back to overwriting last.rec,
//  because the `cheat.rec` name is derived from the very bit the cvar withholds
//  -- there is no setting that keeps the bisection and the filename both.
//
//  ---- and what "cheats were off" is actually claiming -----------------------
//  The authoritative question is whether the physics were LOCKED, and the engine
//  answers it with pm_lockmovement's DEFAULT value and sv_cheats together (see
//  the ruleset lock at the top of this file).  The gamecode can only see the
//  second half.  So this stamp means "cheats were off", not "the ruleset was
//  locked", and closing that gap is a one-line engine change publishing the
//  engine's own answer as a serverinfo key.  Written down rather than assumed.
//
//  run_cheatwatch 0 does NOT mean cheats stop being marked.  It makes EVERY run
//  practice instead: an install that is not watching cannot certify anything as
//  clean, and pretending otherwise would turn one cvar into a way onto the clean
//  board with the physics unlocked.  That is what keeps it a bisection.
// ---------------------------------------------------------------------------
set run_class             1
set run_cheatwatch        1

// ---------------------------------------------------------------------------
//  The raw input journal, and the terms that gate it (build 22)
// ---------------------------------------------------------------------------
//  Every timed run has been recorded twice since build 17: a .rec of position
//  and velocity at ~66 Hz, written by the server, and a .view of view angles and
//  held keys at RENDER rate, written by the client.  Build 22 adds an optional
//  third file, a .hid, holding the individual mouse and keyboard events as the
//  engine received them -- before in_generic.c sums them into one delta per
//  frame and before cl_input.c averages those into a usercmd.
//
//  IT IS AN ANTI-CHEAT INSTRUMENT AND NOT A REPLAY ONE.  The .rec positions are
//  authoritative and the .view angles at 300 Hz are already finer than 66.7 Hz
//  physics can express, so there is no fidelity to be gained; a replay will
//  never read this file.  What it is for is that a script's mouse deltas are
//  uniform and unjittered where a hand's are not, that the report rate is
//  visible, and that three independent recordings of one run all have to agree.
//
//  ON THE TIMESTAMPS, because the file is easy to over-read.  Windows delivers
//  raw input as messages and the engine drains a frame's worth in one pump, so a
//  stamp says when the ENGINE saw a report, not when the mouse produced it.
//  Per-frame timing is real; spacing WITHIN one frame is a pump artifact.  The
//  file records which input mode produced it so a reader cannot forget.
//
//  WHAT IS NOT RECORDED, and this is not negotiable: no keystroke identity while
//  the console or a menu has focus, and never the unicode.  The timing and the
//  count of those presses survive -- a macro fired with the console open still
//  shows -- but a password typed there cannot reach the file.  data/ is readable
//  by any CSQC on any server you join, so this matters.
//
//  0 stops the journal.  Runs recorded without one say so in their own .view
//  header (`hid 0`) rather than passing as runs that had one.
set rec_hid               1

//  ---- and the consent gate -------------------------------------------------
//  None of the above runs until the recording terms have been accepted.  The
//  menu shows them on first launch and writes data/consent.txt; rec_terms mirrors
//  the accepted version for the other two VMs.  DO NOT SET rec_terms BY HAND:
//  it is derived from that file at every launch, and setting it here would be a
//  claim that somebody agreed to something, made by a config file.
//
//  The gate that does the work is in the client, at the one place a journal can
//  start, so it also covers reaching a map by the console or by +map -- routes a
//  menu button could never see.  Bumping FS_TERMS_VERSION in
//  src/shared/sh_defs.qc invalidates every acceptance and asks again.
//
//  It is a record, not a lock, and the terms screen says so: anyone who can edit
//  consent.txt could edit the binary.  Its job is to be honest.

//  ---- the engine side ------------------------------------------------------
//  in_journal_maxkb caps the journal, in kilobytes, at about 1.15 MB per minute
//  of real 1000 Hz input -- so the 8192 default is roughly seven minutes, past
//  which the file writes a `truncated` marker and stops.  It is an ENGINE cvar
//  (Patch 202) and is left at its default here rather than restated, because a
//  truncated journal is an un-auditable run and the number should be changed
//  deliberately, not inherited from a config nobody reads.
//
//  in_rawinput (alias m_rawinput) now defaults to 1 in the engine as of Patch
//  204, and it matters here: at the old default of 0 the mouse column is one
//  OS-summed delta per call instead of one per report, and no timing conclusion
//  can be drawn from it.  The journal records the mode it was taken under in its
//  own header, as `rawinput`, so a file taken at 0 is marked rather than
//  silently weaker.

// ---------------------------------------------------------------------------
//  Where recordings live, and how many are kept (build 23)
// ---------------------------------------------------------------------------
//      data/runs/<map>/main/0004108_pb.rec       .view and .hid beside it
//      data/runs/<map>/main/last.rec
//      data/runs/<map>/main/cheat.rec            (build 45)
//      data/runs/<map>/stage_3/0000512_pb.rec
//      data/runs/<map>/bonus_1/0001204_shadow.rec
//      data/runs/<map>/best.pb
//
//  It replaces the flat data/runs/<map>_t0_s0_pb.rec, which put every recording
//  for every map in one directory and kept exactly three per leg, because the
//  tag was the whole name and a new run overwrote the old one.
//
//  THE NUMBER IS THE RUN'S TIME IN TICKS, zero-padded to seven digits, and the
//  padding is load-bearing rather than tidy: an ascending filename sort is
//  therefore an ascending TIME sort, so the leaderboard needs no index file and
//  the pruner below can never pick the personal best.
//
//  `last` is deliberately unstamped.  pb and shadow are archive classes and a
//  new one must not overwrite an older one; `last` means "the attempt I just
//  did", and stamping it would write a file per attempt -- forty an hour at a
//  megabyte each, for runs nobody will ever open.
//
//  BUILD 45 ADDED A SECOND UNSTAMPED SLOT, `cheat`, and it is a bug fix rather
//  than a feature.  A cheated run is practice, so it is never a personal best;
//  it is not a shadow unless a save was also loaded; so it used to be written as
//  `last` and it OVERWROTE the most recent ordinary attempt on that leg.  Five
//  seconds of noclip cost you the recording of the run before it.  Cheated runs
//  now land in `cheat.rec` and `last.rec` is left alone.  Unstamped for the same
//  reason `last` is: there is no version of "keep every cheated run" anyone
//  wants, so the next one replaces it.  A run that is BOTH cheated and a shadow
//  is filed as cheated, matching what the leaderboard calls it.
//
//  rec_runs_keep is how many of each archived class survive per leg.  Slowest
//  first, per tag class -- a shared quota would let an evening of practice
//  shadow runs evict a year of real personal bests.  0 disables pruning
//  entirely, which is the setting for anyone who would rather run out of disk
//  than lose a recording.
set rec_runs_keep        25
//
//  Runs recorded by an earlier build are in the old flat layout and the game
//  cannot see them.  QC cannot move a file, so:
//      python tools\migrate_runs.py            (shows what it would do)
//      python tools\migrate_runs.py --apply
//  It reads each run's time out of the .rec's own `end` trailer rather than
//  guessing, and refuses to move anything whose time it cannot read.

// ---------------------------------------------------------------------------
//  Watching a recording back (build 24)
// ---------------------------------------------------------------------------
//  Every run has been written to disk since build 9 and nothing had ever read
//  one back.  `replay` does.
//
//      replay                     this map's best main-track run
//      replay pb | last | shadow | cheat
//                                 that tag on the main track
//      replay stage 3             that stage's best
//      replay bonus 1 0           that bonus track's best
//      replay <path>              any .rec, for a file no list offers
//      replay stop                (and so does ESC, and the X in the corner)
//
//  While one is playing: SPACE pauses, LEFT/RIGHT seek five seconds, the bar at
//  the top scrubs and the slider beside it runs 0.1x to 4x with 1x in the
//  middle.  The mouse is a cursor, and MOUSE1/MOUSE2 do not duck and jump.
//
//  You are FROZEN while watching -- position and clock both -- so opening a
//  replay mid-attempt costs you nothing and cannot trigger anything on the map.
//  That is a real server-side pin (MOVETYPE_NONE), not just an input block.
//
//  WHAT IS REPLAYED, WHICH IS NOW EVERYTHING -- FOR A RUN RECORDED FROM HERE ON.
//
//  Build 24's first cut drew no strafe bar, no board panel and no segment column
//  and said so on screen: the three are decided by the ramp contact and the
//  PRE-CLIP velocity, and the recording carried neither.  Deriving a ramp contact
//  from the ground flag would have produced a bar indistinguishable from a
//  measured one, so it refused instead.
//
//  The fix was to record them.  FTESURF-REC 4 adds one flags bit for the ramp
//  contact, the plane under you in every sample, and a `board` record carrying the
//  arrival plane and the pre-clip velocity on the tick the engine's board counter
//  moves.  All three panels now replay from measurement rather than from a guess.
//
//  A RUN FROM BEFORE THIS BUILD IS REC 3 AND STILL REFUSES.  Every recording on
//  disk today is one, so this is the case you will see first -- the replay says so
//  in the console when it opens the file, and the three panels stay off.  The
//  camera, the keys, the clock, the splits, the checkpoints, the speedometer and
//  the energy readout were always exact and are exact on both versions.
//
//  The segment column is built ONCE when the file loads, by running the real
//  segment machine over the sample stream, so scrubbing backwards puts the rows
//  back rather than replaying them forwards -- and your OWN column is snapshotted
//  and handed back when the replay stops.
//
//  THE ROUTE, as a curved ribbon in the world.  Bright behind the camera, dim
//  ahead, coloured by the speed you were carrying.
//
//  It is a Catmull-Rom spline through the recorded positions rather than a
//  polyline between them -- the spline passes exactly THROUGH each control point
//  and is smooth in between, so there is no corner every ninety units.  Control
//  points are chosen where the path actually turns rather than every Nth tick,
//  which is what puts them densely on a transition and sparsely on a long arc.
set hud_watch_path        1
//  BUILD 43 -- WHICH DRAWER.  1 is the ribbon described above.  2 projects the
//  path to the screen first and draws it as a thin, constant-width, crisp line,
//  which is what was asked for.
//
//  BUILD 45 MAKES 2 THE DEFAULT.  It shipped switched off for two builds
//  because it drew nothing: the quads were wound the opposite way round from
//  every other 2D polygon in the engine and the whole line was backface-culled.
//  One sign.
//
//  1 IS STILL WORTH HAVING and is not deprecated.  The two differ in more than
//  looks: the ribbon is drawn into the world before the scene and is hidden by
//  walls, while a screen-space line is drawn after it and shows THROUGH walls.
//  Seeing the route through the geometry is usually what you want on a surf
//  map and is sometimes exactly what you do not want on a bhop one.
set hud_watch_path_mode   2
//  Its thickness in PIXELS when mode 2 is used.  Separate from
//  hud_watch_path_width below, which is world units: sharing one name would have
//  silently turned every existing config into a six-PIXEL line.
set hud_watch_path_px     3
//  0 draws only the part already played, if knowing what is coming spoils it.
set hud_watch_path_ahead  1
//  Its thickness, in world units at 512 units of range.
set hud_watch_path_width  6
//  Whether that thickness follows the distance to the camera.  1 is a fixed
//  ANGULAR size, so the line reads the same all the way down the map; 0 is a
//  fixed WORLD size, which is honest geometry and thins to a hairline at range.
//  Either way it is computed per VERTEX and the ribbon is one continuous mitred
//  strip -- the first cut computed it per SEGMENT, which is why it looked like a
//  row of slugs rather than a line.
set hud_watch_path_scale  1

//  BUILD 43 -- THE DEAD AIR: the parts of a run where you were not moving.
//
//  "mark parts where the player doesn't move as red, and have a selectable
//   option that simply skips those parts during playback."
//
//  The stretches are found ONCE when the file loads, inside the pass that
//  already reads every sample, and the scrub bar draws them in red -- over the
//  progress fill, so they are visible in the played half as well as the unplayed
//  one.  The panel carries a clickable `skip still (N)` toggle beside the hint,
//  because a switch that changes what playback DOES is a bad thing to hide.
//
//  A SAVE-LOCK HOLD NEVER SHOWS UP HERE, and that is correct rather than a gap:
//  the recorder freezes with the clock, so a hold costs the file no samples at
//  all.  Only standing still WHILE THE CLOCK RUNS is marked -- which is the only
//  kind that costs you a time.
//
//  Both thresholds are read when the file loads, so changing one takes effect on
//  the next `replay` rather than the one already open.
//
//  Horizontal speed under which the run counts as parked, in units/sec.
set hud_watch_idle_speed 20
//  ...and how long it has to stay under it.  0.5s is deliberate standing still;
//  a tenth of a second is a landing, a crouch or a bad tick.
set hud_watch_idle_time 0.5
//  Whether the pre-start approach counts.  Off: the walk up to the start box is
//  MEANT to be slow, and marking it red says something false about the run.  The
//  bar already marks t=0 with its own amber gradation.
set hud_watch_idle_pad    0
//  Skip them during playback.  Only while playing -- a pause or a scrub INTO a
//  stretch stays where you put it, which is what the marks on the bar are for.
set hud_watch_skipidle    1

//  What the recording IS, on screen, while it plays (build 25).
//
//  Off by default -- it covers a third of the left of the screen and the ride is
//  what a replay is for.  `replay status` prints the same numbers to the console
//  and always has; this exists for the three of them that MOVE and therefore
//  cannot be sampled by a console line:
//
//    run fps now   the .view sidecar is one line per RENDERED frame, and the
//                  reader already brackets the lines belonging to the tick it is
//                  drawing.  That count over the tick length is the frame rate
//                  the run was really being played at AT THIS MOMENT -- watch it
//                  against the scrub and you can see where that machine hitched.
//    rec rate      samples per second of the .rec, MEASURED.  Nominally 66.67,
//                  and the recorder's own comment measures 65, 64.6 and 43.5 on
//                  real files, because a sample is written per received PACKET
//                  and a packet can carry several usercmds.  Which one you are
//                  watching decides how much of the smoothness is interpolation.
//    your fps      so the first two are distinguishable from your own machine.
//
//  BUILD 26: IT ALSO SAYS WHAT THE FILE IS, and it now tells you it exists.
//
//  This shipped in build 25 and was asked for again in build 26, because
//  nothing anywhere named it: not the replay chrome, not the console, not this
//  file.  A feature that cannot be found has not shipped.  The chrome's hint
//  line carries `hud_watch_info 1` now, and `replay` prints it when opening a
//  recording with the panel off.
//
//  The rows about the file itself, all of them from keys that were already in
//  every .rec and simply never read back:
//
//    map           and whether it is the map you are standing on.  A replay of
//                  another map's run flies the camera through nothing, which
//                  used to be a console warning that scrolled away.
//    tag           pb / shadow / last, from the filename.
//    recorded      out of the `runid` header key, which has been
//                  strftime("%Y%m%d-%H%M%S") plus the slot since v3 -- so the
//                  date needed no format change to become readable.
//    tick          the rate the run was SIMULATED at.  A 100Hz bhop recording
//                  and a 66.7Hz surf one are otherwise identical on screen.
//    pad           the trailer's OWN count of pre-start samples, not a count
//                  derived from t0.  Build 25's stage-slice bug was exactly a
//                  trailer disagreeing with its body about that number.
//    file          whole-file line counts for the .rec and the .view.  The
//                  difference against `samples` is the header plus every split,
//                  checkpoint and board record.
set hud_watch_info        0

// ---------------------------------------------------------------------------
//  BUILD 34 -- how big the playback panel is, on top of hud_scale
// ---------------------------------------------------------------------------
//      "when I pause the demo, the text in the demo player extends to the point
//       where the word pause is off the UI.  can you extend the size of the demo
//       player?"
//
//  Two things, and the first was a bug rather than a size.  The panel asked for a
//  width in CHARACTERS with a magic 46 in it, which assumed a 34-character status
//  line and reserved nothing for the close button.  The line is 27 characters
//  running and 35 PAUSED -- 37 past ten minutes, 41 past an hour -- so at
//  hud_scale 2 the word ran under the X and off the border.  Both lines are now
//  measured with stringwidth before the panel is sized, so nothing it draws can
//  overflow it, whatever a future label says.
//
//  hud_watch_scale is the size, and it is separate from hud_scale because this is
//  a CONTROL rather than a readout: making it reachable with a mouse should not
//  drag every other panel up with it.  It multiplies both font sizes, the padding,
//  the row gaps, the track and the slider knobs, so the panel keeps its
//  proportions.  Clamped 0.5 to 4.
set hud_watch_scale       1

// ---------------------------------------------------------------------------
//  Stage records from a main run (build 24)
// ---------------------------------------------------------------------------
//  You complete every stage of a map on the way through it, and until now none
//  of those counted: the only way to get a row in data/runs/<map>/stage_N/ was
//  to arm at that stage's own zone and run it deliberately.  So the stage boards
//  on a map you had been grinding for an hour were empty.
//
//  Now a stage finished inside a main run writes its own record and its own
//  demo -- the .rec sliced out of the run's own buffer with its timestamps
//  rebased, and the .view sliced to match -- whenever it beats that stage's best.
//
//  ONLY STAGES THAT BEGAN WITH A JUMP.  On a staged surf map some boundaries are
//  a platform you land on and jump off; those are real stage starts and their
//  times are comparable with a deliberate stage run.  Others are a plane you fly
//  through at 2000 u/s, which is a checkpoint wearing a stage's clothes -- timing
//  "your stage 4" from there would measure how fast you arrived and nothing else.
//
//  The test is narrow on purpose: a jump, from a ground phase, with NO ramp
//  contact since the boundary.  That last clause is the discriminator -- if you
//  have already been on a ramp since crossing the plane, you flew through it and
//  whatever you do next is not the beginning of anything.
//
//  `cmd timer` prints the decision while it is being made:
//
//      stage: leg 3  from 0:41.220  jump 1  ramp 0  line 2841  wrote 2
//
//  jump 1 ramp 0 is a stage that WILL be recorded at the next boundary; jump 0
//  ramp 1 is one you surfed into and will not be.
//
//  A practice run writes no stage records either, and that falls out rather than
//  being a separate rule: a tainted run cannot set a personal best, so it cannot
//  pass the improvement test that gates the write.

// ---------------------------------------------------------------------------
//  The leaderboard, on TAB (build 24)
// ---------------------------------------------------------------------------
//  +showscores -- TAB, already bound -- opens a board of every run on the map.
//  Press it again, or ESC, to close it.  It TOGGLES rather than being held: a
//  scoreboard you have to keep a key down for is one you cannot click a row in,
//  and clicking a row is the whole feature -- it hands the file to `replay`.
//
//  The legs are down the left, taken from the map's ZONE FILE and not from the
//  runs folder, so a stage you have never finished still gets a row.  The runs
//  are on the right, in time order, which is also filename order -- the times are
//  zero-padded into the names precisely so that the two are the same sort and the
//  board needs no index file to keep in step with the disk.
//
//  CLEAN vs STITCHED is the filter, and it has three states rather than two:
//
//      clean       one take, nothing marked practice
//      stitched    a save-load, a setpos, noclip or a hopped start touched it
//      --          the file cannot answer
//
//  The third is not a hedge.  A run recorded before this build has no such field,
//  so `pb` is known clean (a practice run cannot set a personal best), `shadow` is
//  known stitched (it only exists on a save resume), and `last` genuinely says
//  nothing.  An unanswerable row shows under BOTH settings rather than being
//  hidden by either -- a filter that quietly drops what it cannot classify is one
//  that lies about how many runs there are.
//
//  A console handle, because a board reached only by a keypress is one no test
//  can ever check:
//
//      scores                     toggle it, then print what it is showing
//      scores open | close
//      scores legs                the derived leg table, with its folders
//      scores leg <n>             select one
//      scores filter clean | stitched | all
//      scores watch <n>           open row n, the same as clicking it

// ---------------------------------------------------------------------------
//  setpos sets, viewpos views (build 24)
// ---------------------------------------------------------------------------
//      viewpos                    prints where you are, as a setpos line
//      setpos <x> <y> <z> [p] [y] [r]   puts you exactly there
//
//  One verb each.  `setpos` with no arguments used to print the position, which
//  is the engine's own convention and is genuinely confusing: the command called
//  "set" was the only way to "get".  viewpos prints in setpos's argument order,
//  so the line still pastes straight back in -- which is the whole point of it.
//
//  AND setpos NOW MARKS THE RUN PRACTICE RATHER THAN VOIDING IT.  Voiding threw
//  the attempt away, which made it useless for the thing it is actually reached
//  for mid-run: "put me at that ramp and let me try the next section".  Practice
//  keeps the clock, the splits and the checkpoints exactly as they were and only
//  refuses to KEEP the result -- the same bargain a save-lock load and a stage
//  restart already make.  The taint lasts the rest of the attempt; the next arm
//  clears it, so a run cannot be laundered by teleporting and then finishing.

// ---------------------------------------------------------------------------
//  The split list's speed and energy columns (build 19)
// ---------------------------------------------------------------------------
//  Every row down the left -- stage, CHECKPOINT and finish -- now carries what
//  you were carrying as you crossed: the speedometer's speed and the `e`
//  readout's energy, sampled at the crossing rather than after it.
//
//  That timing is the point on a staged map.  Many stages teleport you to the
//  stage end, and there this is what you ARRIVED with; some let you surf
//  straight through, and there it is what you carried out.  Both are worth
//  reading and neither was available anywhere before.
//
//  Checkpoints joined the list in the same build.  A linear map like
//  surf_utopia has no stages at all, so its checkpoints are the only structure
//  the run has, and the list used to sit empty from the start zone to the
//  finish.
//
//  0 puts the block back to three columns, which is the pre-19 width.
// ---------------------------------------------------------------------------
set hud_splits_speed      1

// ---------------------------------------------------------------------------
//  Prop collision shape.
//
//  A prop marked "Use VPhysics" in Hammer becomes SOLID_PHYSICS_TRIMESH here,
//  and this cvar chooses the SHAPE the player's swept box collides against:
//      0  oriented box      2  convex hull (engine default)
//      1  per-triangle mesh  3  convex decomposition
//
//  It has to be 1 for us, and the reason is which props surf maps actually
//  make solid.  Counting them across all 1308 maps, the solid props whose
//  models are load-bearing rather than scenery are overwhelmingly HANDRAILS,
//  RAILINGS and FENCES -- de_train/handrail_singlespan_128 (255 of them),
//  de_inferno/railingspikedgate (200), props_c17/handrail04_long (81),
//  surf_minigolf/fencing_fine (44).  Those are thin, hollow and open, and
//  they are exactly the shape a box or a convex hull gets catastrophically
//  wrong: the hull of a handrail is a SLAB, so a railing you should be able
//  to see and shoot through becomes a solid wall across the route.
//
//  Modes 2 and 3 would be the better answer if the shapes suited them -- and
//  they are unavailable anyway: nothing builds hull planes for Source models
//  (mod_hl2.c only calls BIH_BuildAlias), so mode 2 silently falls through to
//  an oriented box.  Building them is NOT a safe afternoon's work either --
//  see Patch 103, which tried exactly that for Quake/GoldSrc models and is
//  disabled in the tree with a STATUS_HEAP_CORRUPTION crash unaccounted for.
//
//  This is set here rather than changed in the engine because the cvar is
//  shared with the other game in this tree, which wants 2.
// ---------------------------------------------------------------------------
set sv_prop_collision     1

// ---------------------------------------------------------------------------
//  r_portalrecursion -- how many portals deep the renderer will go.
//
//  Patch 205 makes linked_portal_door a real portal, and surf_kitsune puts
//  its doors where you can see one through another.  2 draws that second one.
//
//  PATCH 207 CORRECTS WHAT USED TO BE WRITTEN HERE.  This block claimed that
//  at recursion 1 the far portal "renders as a hole -- black, or whatever the
//  depth buffer last held".  It does not, and believing it was what made this
//  setting look mandatory.  Past the limit GLBE_SubmitMeshes does not call
//  GLBE_SubmitMeshesPortals at all (gl_backend.c:6119), so neither a scene NOR
//  a depth mask is emitted; the batch falls through to the ordinary sort list,
//  a zero-pass portal shader draws nothing, and the wall behind it survives.
//  A portal past the limit renders CLOSED, which is what it should look like,
//  and it is free.
//
//  It is not raised further because each level is a COMPLETE extra scene
//  render of everything visible through that aperture, and the cost
//  multiplies rather than adds.  surf_tripportals has 116 doors.
// ---------------------------------------------------------------------------
set r_portalrecursion     2

// ---------------------------------------------------------------------------
//  Portal cost (Patches 206 and 207)
// ---------------------------------------------------------------------------
//  r_portalrecursion bounds the DEPTH of the portal tree.  Nothing bounded its
//  WIDTH until Patch 206, so the cost was (portals visible) ^ depth complete
//  scene renders per frame -- and a scene render here is the whole frame path:
//  world walk, batch generation, lighting, all of it.  Measured on
//  surf_kitsune, standing in the hub where the route comes out:
//
//      apertures off    1.1 ms/frame    57 world batches
//      apertures on    18.9 ms/frame   720 world batches
//
//  Fourteen times the rest of the scene put together, which is the "laggy"
//  these cvars exist to fix.
//
//  r_portalmaxviews  how many portals may be rendered as portals in any ONE
//                    view, largest-on-screen first.  The rest render closed.
//                    Applied per view rather than per frame, which is what
//                    gives the intended look: the portal you see THROUGH a
//                    portal is scored from the recursed camera, where it is
//                    large, so the next room's door is open and everything past
//                    it is closed.  0 removes the limit and restores the
//                    quadratic pre-206 cost.
//  vbsp_portal_dist    beyond this many units a door is not offered to the
//                    renderer at all (client side, in the predraw).
//  vbsp_portal_render  0 turns the apertures off completely while leaving the
//                    PHYSICS working -- you still cross, you just do not see
//                    through.  A real switch, not a debug mode.
//  vbsp_portal_debug   1 names each door as it is offered, with its distance.
// ---------------------------------------------------------------------------
set r_portalmaxviews      2
set vbsp_portal_render    1
set vbsp_portal_dist   3000
set vbsp_portal_debug     0

// ---------------------------------------------------------------------------
//  r_portalscissor -- the doorway is the window (Patch 208)
// ---------------------------------------------------------------------------
//  FTE renders a portal's far scene over the WHOLE SCREEN, with no scissor and
//  no stencil, and relies on the ordinary world being drawn afterwards to paint
//  back over everything except the hole -- portals sort at 3 and the opaque
//  world at 5, so there is a repaint due.  On surf_kitsune that repaint does
//  not happen for the wall the doorway is set into, and the far room keeps the
//  whole wall.  That is what "it projects the whole wall, not just the doorway"
//  was.
//
//  Patch 206 could not find the repaint failure and said so: the depth mask,
//  the mask's size, polygonoffset, the oblique near clip, the view budget, the
//  inner mask loop, PVS and brush entities were each ruled out by their own
//  run.  Patch 208 stops hunting for it and removes its ability to matter
//  instead -- the recursed frame is clipped to the aperture's projected
//  rectangle, so the far side cannot paint outside the doorway whether the
//  world repaints or not.  What showed this was the right lever: r_portaldebug
//  1, which skips the recursed scene and changes nothing else, brings the
//  entire missing wall straight back.
//
//  1 clips.  0 is the old full-screen render, kept deliberately, because this
//  CONTAINS the repaint bug rather than curing it and 0 is how you get the raw
//  symptom back to look at.
//
//  A rectangle is a bounding box, so a door at an angle can still leak into the
//  corners of its own projected trapezoid.  Masking the exact shape needs a
//  stencil, and this backend tracks neither scissor nor stencil state while
//  stencil shadows contend for the buffer inside the same recursion -- so the
//  corners are left as a known, bounded residue rather than paid for with that
//  risk.
// ---------------------------------------------------------------------------
set r_portalscissor       1

// ---------------------------------------------------------------------------
//  The save-lock menu (build 25, revised 26) -- Momentum's layout, one cursor
// ---------------------------------------------------------------------------
//      PANEL UP                             PANEL DOWN
//      z   open / close                     z   open / close
//      1   Create Save      5  Go to First   1   Create Save
//      2   Load Save        6  Go to Last    2   Load Save
//      3   Go to next       7  Remove Save   4   Remove Save
//      4   Go to previous   8  Delete All
//                           0  Close menu
//
//  EVERY KEY ACTS ON THE CURSOR -- the "3/7" in the panel header -- and the
//  three panel-down keys send the SAME THREE COMMANDS the panel-up ones do.
//  That is the fix for "pressing 2 loads the current save, not the one I
//  selected", and it is worth being precise about what the fault was, because
//  the keys are back and the fault is not: the closed state used to have its
//  own commands, sl_loadlast and sl_dellast, which read the list's LENGTH
//  rather than the cursor.  Stepping to save 2 of 5 and pressing 2 could load
//  save 5.  Build 25 deleted both commands from the server; build 26 brings the
//  three keys back pointed at sl_save / sl_load / sl_del, every one of which
//  reads the cursor, so there is no longer a command that could disagree.
//
//  4 IS ASYMMETRIC AND IT IS MEANT TO BE: previous with the panel up, remove
//  with it down.  Momentum's layout where you can see it, where your hand
//  already is where you cannot.
//
//  8 IS NOT REACHABLE WITH THE PANEL DOWN.  Its confirmation is a row of text on
//  a panel that is not being drawn, and a single invisible keypress that erases
//  every save on the map is not a thing to offer.
//
//  Any other digit with the panel down goes to the engine's own binds untouched.
//
//  3/4/5/6 TELEPORT as well as moving the cursor, which is what they did before
//  and what Momentum does.  `2` is then the key that loads the one you are
//  already on -- and the key you HOLD to park there while you study the approach.
//
//  BUILD 26: A LOAD NO LONGER FORGETS YOUR ENERGY ANCHOR.  hud_energy_ref 1 --
//  the default, and Momentum's -- measures `e` from the ground you last jumped
//  off, and that reference re-bases whenever you move more than 512 units in a
//  frame, which a save-lock load always does.  So `e` read about zero after
//  every load and the readout you took the save to watch was the one thing the
//  save destroyed.  The reference now travels in the save's own seq.txt beside
//  the segment list, warm and cold, and comes back with it -- including through
//  `retry`, which restores everything else verbatim already.
//
//  8 asks twice because it is the only action here with nothing to undo it and
//  it is next to 7.  From the console, `cmd sl_delall` does not ask.
//
//  Console handles, all of them: sl_save, sl_load, sl_del, sl_delall, sl_prev,
//  sl_next, sl_first, sl_last, sl_goto <n>, sl_list, sl_hold / sl_holdoff.
//
//  UP TO 999 SAVES PER MAP, up from 32.  The folder is data/saves/<map>/saveNNN/
//  -- three digits now, not two, and there is no reader for the old width: the
//  build that widened it deleted the save states rather than teaching the scan
//  both, because the archive was development scratch.  999 is not arbitrary, it
//  is what the rest of the design already supported: the folder name, the
//  directory scan and the save/load event stat all cap there together.
//
//  BUILD 30: THE NUMBERS ARE RIGHT ON THE PRESS NOW, not on the release.
//
//  Two separate faults, and neither had a cvar because neither was a choice.
//
//  1.  THE SPEEDOMETER READ 0 AND `e` READ THE WRONG THING WHILE 2 WAS HELD.
//      The hold is a real freeze -- MOVETYPE_NONE, and .velocity zeroed on the
//      press and re-zeroed every tick -- so the velocity stat genuinely was
//      zero, and the HUD read it straight.  `e` did not merely go stale with
//      it: energy is (height + |v|^2/2g), so losing the velocity term left the
//      readout printing bare HEIGHT while still calling itself energy.
//
//      The velocity is still zeroed -- the freeze depends on it, and the build
//      that kept the player moving instead is the one whose snapping this
//      design replaced.  What is new is that the save's velocity is PUBLISHED
//      alongside the zero (STAT_FS_HOLD / STAT_FS_HOLDVEL) and the HUD prefers
//      it while parked.  One substitution at the single point every panel takes
//      its velocity from, so the speedometer, `e`, the strafe bar, the split
//      sampler and the segment machine all agree without any of them knowing
//      what a hold is.  Release is then genuinely a no-op on screen, where it
//      used to be where all the numbers arrived.
//
//  2.  A LOAD KEPT THE LAST RAMP'S CONTACT READING FOR THREE SECONDS.
//      "Load while touching a ramp and it shows surface contact and an energy
//      reading that is wrong until you touch a ramp again."  Board_Warped, the
//      function a load reaches, killed the open SEGMENT and deliberately
//      nothing else -- so the board panel's grade / `contact` / `cost` /
//      `leaving` rows, the 0.25 s held ramp PLANE and the two-second energy
//      ring all survived the teleport.  Every one of those was reachable only
//      from a map change.  The plane was the one that actually mattered: it
//      feeds the strafe bar's target, so for a quarter second after a load the
//      bar graded you against a ramp you were no longer anywhere near.
//
//      A load now clears them together.  A SAVE does not, because writing one
//      does not move you.
//
//  `hud_debug 1` gained three rows to make both of these visible: `hold` says
//  `park` while the substituted velocity is in use, `ramp` is the age of the
//  held plane, and `ehist` is the depth of the energy ring.
// ---------------------------------------------------------------------------
set rec_savelock          1
set hud_saveloc_x     0.018
set hud_saveloc_y      0.34

// ---------------------------------------------------------------------------
//  ghost -- look at the map without stopping (build 30)
// ---------------------------------------------------------------------------
//      ghost              detach the camera / come back
//      ghost status       where the body is, where the camera is, what is armed
//      ghost speed <n>    fly speed, live; same as ghost_speed
//
//  YOUR BODY DOES NOT STOP.  It keeps running real physics from the velocity it
//  had when you left it -- gravity, friction, ramp clipping, pushers and map
//  teleports all still apply -- so ghosting mid-ride means coming back to a body
//  that has gone wherever a body with nobody steering it goes.  That is the
//  feature.  The mode that freezes you already exists and is called `replay`.
//
//  It is also what makes ghosting close to self-policing: on most maps a ghost
//  of any length ends the attempt by itself, because your hands are not on it.
//
//  WHY IT KEEPS MOVING AT ALL is worth knowing, because the obvious
//  implementation does the opposite.  A client of this mod is `isindependant`
//  (sv_user.c:8507) and sv_phys.c skips those entirely -- a player advances once
//  per RECEIVED usercmd and never otherwise.  So a ghost cannot stop sending; it
//  sends the same usercmds with the movement and buttons emptied and the angles
//  pinned to the aim you left.  msec is untouched, and msec is what ticks the
//  body.  A replay does stop sending, which is why it freezes.
//
//  NOTHING ON THE MAP FIRES WHILE YOU ARE AWAY.  Two halves.  The camera is not
//  an entity at all -- it is two setproperty calls over the refdef, the same
//  mechanism the replay camera uses -- so it has no hull and no touch function
//  and cannot trigger anything by construction.  The BODY is a real player at a
//  real origin, so SV_TimerFrame skips every zone test while you are detached,
//  and warps the swept test's far end each tick so re-attaching cannot draw a
//  segment across the map and fire everything on the line.
//
//  THE RUN STAYS VALID.  Ghosting does NOT mark the attempt practice.  It is
//  MARKED instead: TF_GHOST in the .rec header, and a `ghost 1` / `ghost 0`
//  record at each edge in both the .rec and the .view.  That is not bookkeeping
//  -- a ghost window is otherwise indistinguishable from letting go of every
//  key, and reccheck.py's rule that the key mask agrees with the movement
//  columns is satisfied by zeros agreeing with zeros.  It would have passed
//  silently.  The .view keeps recording the GHOST CAMERA's angles, so across
//  the window the two files legitimately disagree about where you were looking
//  for the first time in this format's life; both carry the markers so either
//  can be read alone.  reccheck.py checks that a declared window actually
//  CONTAINS what a ghost looks like, which is the direction that could be
//  abused -- claiming a stretch of real play was unattended.
//
//  The timer line says `ghost` while you are detached.  It is added to
//  `practice`, not instead of it: they are different facts and a run can be
//  both.  `cmd timer` gains two columns -- `ghost` (right now) and `ghosted`
//  (this attempt ever has been).
//
//  Flight is WASD + mouse from wherever you are looking, jump/duck for up and
//  down, +speed to sprint, through whatever those are bound to -- the controls
//  are read out of the usercmd the engine already built, so a rebind needs no
//  second opinion here.  It passes through geometry and collides with nothing.
//
//  BUILD 32 -- ghost_speed 0 MEANS "WHATEVER NOCLIP DOES", and that is now the
//  shipped setting.  Build 30 flew at a flat 900 with no modifier key, and both
//  halves of that were a number picked in cl_ghost.qc and nowhere else.  The
//  engine had already settled the question: PMSrc_NoClipMove flies at
//  pm_noclipspeed x sv_maxspeed and doubles it while +speed is held, which with
//  the values above is 4 x 260 = 1040 u/s and 2080 sprinting.  Ghost matches it
//  exactly, so the two ways of crossing a map feel like one thing, and it
//  tracks the server rather than a constant.  A positive ghost_speed still
//  overrides outright and keeps the doubling; `ghost speed 0` returns to the
//  leash; `ghost status` says which mode it is in and what the number resolves
//  to.  Note that +speed WALKS you on the body (pm_walkspeed) and SPRINTS you
//  off it -- that split is the engine's, not this feature's, and it needs
//  in_speedbutton set to reach either.
//
//  BUILD 32 -- A TELEPORT NO LONGER SPINS THE GHOST CAMERA.  A destination that
//  is a yaw marker snaps your aim to it, the engine delivers that as an
//  svc_setangle, and the client obeys it by writing the very angles the ghost
//  camera is flown with.  So the body being teleported threw the camera, from
//  wherever you had taken it.  The snap is not suppressed -- it is delivered to
//  the body instead, which is who it was addressed to: the camera holds still,
//  the body's pinned aim adopts the new heading, and re-attaching puts you
//  facing the way the map intended.  `ghost status` counts them on the
//  `angles absorbed` row.
//
//  ghost_body 0 stops drawing the stand-in.  The model is models/player.iqm,
//  regenerated in build 30 to the real 72-unit hull (it was 48, two thirds of
//  the body it represents), with models/player_duck.iqm at 54 for the ducked
//  hull and a swap between them on PMF_DUCKED.  Both are cut from one
//  description by tools/mkplayermodel.py -- `--selftest` re-cuts the original at
//  its own height and compares, which is how the writer is checked rather than
//  trusted.
// ---------------------------------------------------------------------------
set ghost_speed           0      // 0 = match noclip (pm_noclipspeed x sv_maxspeed)
set ghost_body            1
set ghost_alpha        0.55

// ---------------------------------------------------------------------------
//  `hud_edit` -- the layout editor (build 31)
// ---------------------------------------------------------------------------
//  Ten panels have had hud_*_x / hud_*_y cvars since build 13 and there has
//  never been a way to move one except by typing a cvar name you had to already
//  know, guessing a fraction, and looking.  `hud_edit` makes the layout the
//  thing you manipulate.
//
//  Type `hud_edit`.  The world stays visible -- you are laying a HUD out against
//  what it goes over -- every panel gets an outline, and you drag them.  ESC,
//  `done` or `hud_edit` again finishes.  `hud_edit status` prints every panel's
//  cvars and whether it drew this frame; `hud_edit reset` puts all ten back.
//
//  A PANEL YOU CANNOT SEE IS STILL DRAGGABLE.  Anything switched off, faded out
//  or (like the two menus) simply not open draws as a dim placeholder at its
//  cvars' own position, because being unable to move a panel BECAUSE it is
//  invisible is exactly the situation an editor exists to fix.
//
//  SNAPPING is to the four screen edges inset by 64, the two centre axes, and
//  the edges and centres of every other panel on screen.  The dragged panel
//  offers its own two edges and its centre, so you can align by whichever
//  feature you were thinking about, and the line it caught is drawn.  Hold
//  SHIFT to suspend it; hud_edit_snap 0 turns it off for good.
//
//  The side panel's name chips switch panels on and off.  Below them are the
//  unit switches -- including hud_seq_units, which has existed since build 20
//  and has never been reachable without typing it, and which is what "put the
//  energy readings back to u/s" means.
//
//  IT SAVES.  Every write goes out as `seta`, which is the only thing that adds
//  CVAR_ARCHIVE to a cvar this file already created -- registercvar cannot,
//  because it declines to touch a cvar that exists, and this file runs before
//  the CSQC VM loads.  ftesurf.cfg is written on close and on quit, and is
//  exec'd after this file next launch, so your layout wins.  Which also means:
//  the numbers below are the SHIPPED layout, not necessarily yours.
//
//    hud_edit_snap    snap distance in PIXELS.  Pixels and not hud_scale units,
//                     because it is a mouse tolerance and a mouse does not know
//                     what hud_scale is -- scaling it would make snapping
//                     sticky at hud_scale 3 and useless at 1.
// ---------------------------------------------------------------------------
set hud_edit_snap         8

//  Where the editor's own tool panel sits, as screen fractions.  It is
//  draggable by its title bar and the position is saved, because the panel has
//  to block clicks -- one that fell through would start dragging whatever was
//  behind it -- and four of the ten elements live in the left margin where it
//  starts.  Every edge of the screen is spoken for by something, so there is no
//  free corner to park it in; moving it is the answer.
set hud_edit_panel_x  0.010
set hud_edit_panel_y  0.080

// ---------------------------------------------------------------------------
//  The board panel's own position (build 31)
// ---------------------------------------------------------------------------
//  It never had one: it is drawn at hud_strafe_x, at whatever y the strafe bar
//  finished on.  That is the right default and was the only option.
//
//  -1 IS A SENTINEL, NOT A COORDINATE, and it means "stay stacked under the
//  bar" -- build 30's behaviour exactly, including the part that matters, which
//  is that the panel follows the bar's own bottom edge as the bar changes height
//  rather than sitting at a constant offset from it.  The bar grows and shrinks
//  as its two rate cells and its `best` line come and go, and a constant offset
//  would make this block twitch every time it did.
//
//  Anything else is a plain screen fraction like every other panel, and the
//  panel stops following the bar.  Dragging it in `hud_edit` writes real values;
//  that panel's `reset` chip puts the sentinel back.  Both axes are tested
//  together, because half-detached is not a state worth being able to reach.
// ---------------------------------------------------------------------------
set hud_board_x          -1
set hud_board_y          -1

// ---------------------------------------------------------------------------
//  Calm numbers (build 31)
// ---------------------------------------------------------------------------
//  "The energy and velocity numbers are a blur at 1000fps."  They are, and ONE
//  CORRECTION IS WORTH STATING FIRST, because it changes what the fix has to be:
//  velocity and energy are NOT per-frame data and never were.  Both come from
//  STAT_FS_VELOCITY, delivered at cl_netfps 66.6667, so they already change at
//  most 66.7 times a second however fast you draw.  Sampling them per tick
//  removes nothing.  67 changes a second IS the blur.
//
//  So there are two knobs, because there are two different causes.
//
//    hud_round    QUANTISATION, and the fix for velocity and energy.  A number
//                 that steps in 5s is legible at any rate; one that steps in 1s
//                 is not, however slowly you sample it.
//                   0  off
//                   1  default -- and a NO-OP, since every readout it touches
//                      already prints through rint.  It ships changing nothing.
//                   2 / 5  the ones worth trying.  Anything else falls back to
//                      1, because a step of 3 produces a sequence that reads as
//                      a fault in the game rather than as a setting.
//                 The "+N.N u/s per tick at best" line drops its decimal at 1
//                 and above: a quantised number printing a dead .0 looks like a
//                 precise one that has stopped moving.
//
//    hud_update   CADENCE, and the fix for the two rate cells above the strafe
//                 bar and the `best` line, which genuinely ARE recomputed every
//                 rendered frame from time-windowed rings.
//                   0   every rendered frame -- build 30 exactly
//                  -1   default.  Once per server snapshot, i.e. the same
//                       66.7 Hz the stats themselves arrive at, so all four
//                       numbers change together instead of two running ahead.
//                   N   N times a second.  10 to 30 is the useful range.
//                 There is a 0.25s floor underneath all of it: a demo or a
//                 disconnect stops the snapshot counter, and without the floor
//                 every latched number would freeze with nothing saying why.
//
//  WHAT IS DELIBERATELY NOT GATED is the computation -- only the displayed value
//  is held.  Gating Strafe_PlaneBest's heading search to the latch looked like
//  free performance and is wrong: the same call returns the scale the strafe
//  BAR's error term is normalised by, so latching the search would make the bar
//  step 67 times a second.  The ask was calm numbers over a live bar.
//
//  There is no measurable frame cost either way.  The HUD still draws every
//  frame; only sampling and formatting are gated, and those are a handful of
//  float ops next to the draw calls.  Readability is the reason, not fps.
// ---------------------------------------------------------------------------
set hud_update           -1
set hud_round             1
