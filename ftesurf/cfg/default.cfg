// FTESurf default.cfg -- THE RULESET. Exec'd, then locked by cvar_lockdefaults: every `set` is
// that cvar's enforced default, so editing a movement value changes the game and its times.
// cfg/mode_<mode>.cfg overlays it per map. It also configures the dedicated/Pi servers: adding
// a cfg/server.cfg would silently stop it running there. The saved ftesurf.cfg runs AFTER it,
// so archived player-owned cvars (in_rawinput) are not set here.
// Long-form notes: git show df76935:ftesurf/cfg/default.cfg; old default.cfg:NNN refs mean that.

cfg_save_name ftesurf
cfg_save_auto 1
// 0: a saved `serverinfo k v` line re-sets cvar k at boot, after this file (it once froze
// sv_airaccelerate at 10000). QC republishes its serverinfo keys every map.
cfg_save_infos 0

// --- Output folders ---
// Not archived, so these lines are the whole story: F9 writes screenshots/<map>_000.png.
set scr_sshot_prefix      "screenshots/"
set scr_sshot_mapname     1
// Logs go to <log_dir>/<log_name>.log. A -condebug launch's first lines still land in the root.
set log_dir            logs

// --- Movement: CS:S as Momentum Mod plays it (CMomentumGameMovement) ---
// The lock: movement cvars are restored to these values at every map load and refused
// afterwards unless sv_cheats is 1. Turning sv_cheats off restores them at once.
set pm_lockmovement       1
// Per-map overlay cfg/mode_<mode>.cfg: sv_gamemode, else mapmeta column 9, else the map prefix
// (`movement` reports). No mode_surf.cfg on purpose: surf is this file. A mode file may not set
// sv_cheats, pm_lockmovement or a cheat cvar. "none" = this file on every map.
set sv_gamemode          ""
// 0 = FTE's QuakeWorld pmove.c, 1 = pm_source.c.
set pm_physicsmode        1
// 15 ms exactly: usercmd msec is an integer, so 64-tick's 15.625 would not survive the trip.
set pm_ticrate        0.015
// sqrt(2*800*57): Momentum's GetJumpFactor (apex 57), not CS:S's 268.33 (apex 45).
set pm_jumpvelocity 301.9933774
// Every jump reaches the impulse's own apex whatever the duck state or tick rate. 0 = stock
// Source, where a standing jump peaks about 2 units below a crouch-jump.
set pm_normalizejump      1
// Momentum's sv_jump_z_offset: PINS the takeoff height above the surface. It is not extra rise.
set pm_jumpzoffset      1.5
// Source's GetAirSpeedCap: the whole budget air-strafing works with.
set pm_maxairspeed       30
// groundtracedist 1 is Momentum's CS modes (stock Source 2). bumpcount 8 (Source 4) is the
// budget pm_fixrampbugs needs to recover and still finish the move.
set pm_groundtracedist    1
set pm_bumpcount          8
set pm_snaptoground       1
set pm_groundquadrants    1
// Landing fixes (sv_slope_fix, sv_edge_fix); both 0 = stock Source. fixedges 0 is Momentum
// parity, undecided upstream, and the first thing to flip if ramps feel off.
set pm_fixslopes          1
set pm_fixedges           0
// Ramp-bug recovery (sv_ramp_fix, retrace 0.2 = Momentum's). 0 = stock Source.
set pm_fixrampbugs        1
set pm_rampretrace      0.2
// normal.z below this is a surf ramp, not ground.
set pm_standablenormal  0.7
// 0 = follow sv_maxvelocity.
set pm_maxvelocity        0
// Momentum's hull (g_ViewVectorsMom), not CS:S's 72/54. A mid-air duck moves the origin by
// pm_viewscale of the 17-unit shrink: 8.5 off the bottom and 8.5 off the top.
set pm_standheight       62
set pm_duckheight        45
set pm_duckspeed       0.34      // 250 * 0.34 = 85 u/s crouched
set pm_sourcebounce       0      // sv_bounce
set pm_viewscale        0.5
// Eye heights (Source VEC_VIEW / VEC_DUCK_VIEW); 64 is measured against Momentum (hud_debug `eye`).
set pm_viewheight        64
set pm_duckviewheight    47
// CS:S stamina, off like Momentum and surf servers: with pm_autobunny it makes held-jump hops
// come sooner and lower. pm_stamina 1 = retail CS:S.
set pm_stamina            0
set pm_staminajumpcost   25
set pm_staminalandcost   20
set pm_staminarecovery   19
// Walk (+speed) scales maxspeed server-side: 0.52 * 260 = 135.2 u/s.
set pm_walkspeed       0.52
// Noclip speed in multiples of sv_maxspeed, doubled while +speed is held.
set pm_noclipspeed        4
// Sends +speed to the server (usercmd bit 7). Without it the walk key never reaches it.
set in_speedbutton        1
set sv_gravity          800
set sv_friction           4
set sv_stopspeed         75      // CS:S.  Source's own base is 100.
set sv_accelerate         5      // CS:S.  HL2 is 10.
set sv_airaccelerate    150      // surf standard.  Stock CS:S is 10.
// Momentum's ground speed (CS:S has 250), and the prestrafe: a 120 deg/s turn settles at 1.11286x
// maxspeed whatever sv_accelerate is, so 250 -> 278.216 and 260 -> 289.344 (Momentum's 289; 260 is
// the only integer in 259.24..260.14). The mover reads this cvar; PM_RUN_SPEED is a fallback.
set sv_maxspeed         260
// The only velocity cap (Momentum's 3500), clamped PER AXIS as Source does.
set sv_maxvelocity     3500
set sv_wateraccelerate   10
set sv_waterfriction      1
set sv_stepheight        18
// FTE's anti-bunnyhop measures: all must stay off.
set pm_bunnyspeedcap      0      // caps horizontal speed on air turns.  Kills surf.
set pm_bunnyfriction      0      // forces >=1 friction frame per jump
set pm_edgefriction       1      // CS:S has no edgefriction; FTE defaults to 2
set pm_ktjump             0      // KTeams jump blend, not a Source behaviour
set pm_walljump           0
set pm_autobunny          1      // autohop; CS:S surf servers run a bhop plugin
// QuakeWorld-pmove ramp settings; inert under pm_physicsmode 1.
set pm_slidefix           1
set pm_slidyslopes        1
set pm_pground            0
set pm_stepdown           1
set pm_airstep            0

// --- Networking / prediction ---
// The tick is in default.fmf. cl_netfps is archived, so CSQC's Net_MatchTicrate fixes it per map.
set cl_nopred             0
set cl_predict_extrapolate 0
set sv_nqplayerphysics    0
// Past this many units between two poses an entity snaps instead of lerping. 512 keeps 15 Hz
// lobby bodies smooth to 7680 u/s (engine 200 = 3000); the cost is that teleports under 512
// units slide. The CSQC body stream (lobby_av_stream 1) does not use it.
set cl_lerp_maxdistance 512
// Joining other servers (engine defaults are 0): say why the CSQC HUD failed instead of silently
// showing Quake's sbar; re-download a mismatched cached csprogs once; wait up to 2 s for the
// *csprogs key, which arrives after the load decision; mount a map's Steam game on connect too.
set csqc_warnfail 1
set cl_download_csprogs_selfheal 1
set cl_csqc_waitforserverinfo 2
set cl_automount 1
// Client prediction and the server agree about portals (surf_kitsune's doors).
set pm_portalcsg_scanall 1
set pm_skipent_portals 1
// 2, not 1: with a single slot a listen server freezes whenever the console or a menu is open.
set sv_playerslots        2
// Float origins: pm_source skips PM_NudgePosition, so quantised coords would skew prediction.
set sv_bigcoords          1
// The win64 build also carries GnuTLS, which fails and reprints on every https request; naming
// SChannel skips it. Guarded because the Linux servers need GnuTLS.
if $sys_platform == Win tls_provider SChannel
// Linux: GLX, the input path the raw-input evidence covers (XInput2); Wayland is the fallback.
if $sys_platform == Linux set vid_renderer gl

// --- Source content ---
set r_builtinpalette      1      // don't let a mounted game's palette win
set hl2_favour_ldr        0      // prefer the HDR lightmaps surf maps ship
// fteplug_hl2 (VBSP, VPK, VTF/VMT, .mdl). 3 = scan the exe dir + built-ins (1 skips a hand-placed
// DLL). plug_load as well: on a first boot the scan has already run before this file.
set plug_loaddefault      3
plug_load hl2

// --- Binds ---
// +duck is an engine command (IN_DUCK); an alias starting with '+' breaks two-key hold/release.
bind w        +forward
bind s        +back
bind a        +moveleft
bind d        +moveright
bind SPACE    +jump
bind CTRL     +duck
bind c        hud_edit
bind e        +use
bind SHIFT    +speed
bind tab      +showscores
bind enter    say
bind v        noclip
bind q        +right
bind g        ghost
// e is bound twice on purpose: the last bind wins, so q/e turn and +use is unbound.
bind e        +left
bind `        toggleconsole
bind x        gfx_menu
bind f9       screenshot
bind f10      quit
bind f11      fullscreen_toggle
bind r        "say !r"      // start of the stage or bonus you are on
bind m        "say !m"    // start of the map
bind MWHEELUP    +jump
bind MWHEELDOWN  +jump
bind MOUSE1   +duck
bind MOUSE2   +jump

// --- Input ---
// Move values >= maxspeed so they cap nothing (pm_source clamps to maxspeed; Momentum uses 450).
set cl_forwardspeed     450
set cl_backspeed        450
set cl_sidespeed        450
set cl_upspeed          450
set cl_movespeedkey       1      // walk is pm_walkspeed now, not this
set cl_run                0
// CS mouse defaults; m_yaw 0.022 is Source's.
set m_yaw             0.022
set m_pitch           0.022
set sensitivity         0.3
set m_filter              0
set cl_pitchspeed         0
set cl_yawspeed          60
// Source's pitch limits. Serverinfo, so the client and the server clamp alike.
set minpitch            -89
set maxpitch             89

// --- Display ---
// 2D drawn 1:1 with the framebuffer, which menu.dat is laid out against.
set vid_conautoscale      1
set vid_conwidth          0
set vid_conheight         0
set vid_fullscreen        0
// Nearest filtering: font sizes are whole multiples of the 8 px atlas, so text is pixel-exact.
set r_font_linear         0
// Monospaced console font. con_textfont is archived (a saved value wins); con_textsize is not.
set con_textfont          "gfx/fonts/GoogleMed.ttf"
set con_textsize         16
// Notify lines of the closed console: 1 = newest at the top, 0 = classic, 2 = newest at the bottom.
set con_notifystyle       1
set con_notifylines     100
set con_notifytime        6      // ordinary prints hold this long...
set con_notifytime_error 20      // ...errors and warnings hold this long
set con_notifyfade        2      // and then fade out over this long
set con_notify_x          0
set con_notify_y          0

alias notify_topleft     "con_notifystyle 1; con_notify_y 0.00"
alias notify_bottomleft  "con_notifystyle 2; con_notify_y 0.70"

set fov                  100
set cl_bob                0
set v_bobcycle            0
set cl_rollangle          0
set crosshair             1
set crosshairsize         1

// --- Performance ---
// On a listen server this is also how often the 15 ms physics tick is checked. Bounded so
// sys_framepacing has something to pace.
set cl_maxfps          1000
// Source's names; a one-token alias passes its arguments on (`fps_max 300`).
alias fps_max cl_maxfps
alias cl_showfps show_fps
set vid_wait              0
set r_dynamic             0
set sys_framepacing       1

// --- Renderer ---
// Noclipping in the void draws the whole world with frustum and area culls kept (0 = keep the
// last cluster, which is right for falling into the void and hides the map when flying out).
set r_voidvis             1
// Live switch for baked-cubemap reflections (hl2_envmap and hl2_cubemaps only act at build time).
set r_reflectcube         1
// $envmap "env_cubemap" reflects the nearest baked cubemap; 7 = Source's envmap arithmetic.
// r_envcubemap is the live A/B; nosky 1 draws grey where a baked cubemap is missing.
set hl2_envcubemap        1
set hl2_envmap_source     7
set r_envcubemap          1
set r_reflectcube_nosky   0
// Source fog is linear (start/end) and does not fog the 2D skybox. Set before any fog shader.
set r_fog_linear          1
set r_skyfog              0
// Overlays and decals take their surface's lightmap instead of drawing fullbright. Read at placement.
set r_decal_lightmap      1
// AnimatedTexture flipbooks play (0 = frame 0 forever).
set hl2_animated          1

// --- Console ---
set con_window            1
// Read once, when the console is created.
set con_window_rect "64 64 960 640"
set con_window_titlepad   3
set con_scrollwidth      16
set con_gripsize         16
// con_colour_back "0 0.05 0.1" is the old navy.
set con_colour_back "0.10 0.10 0.13"
set con_colour_accent "0.62 0.74 0.94"
// Recolours the ^-code palette wherever the engine draws it (console, chat, menus). 0 = CGA.
set con_palette           1
// Completion: 2 = list as you type (1 = after Tab), Up/Down walk it; completiondown 2 = a popup
// below the console so the input line never moves; completionenter 1 = ENTER runs the row.
set con_displaypossibilities 2
set con_completionrows   12
set con_completiondown    2
set con_completionenter   1
// `map` completion matches anywhere in the name (`map kits` finds surf_kitsune).
set sv_mapcompletion      1

// --- Timer zones (maps/zones/{local,online}/<map>.json; Momentum's colours) ---
// zone_list, zone_reload, zone_goto <n>, zone_dests. zone_draw_dist 0 = no limit.
set zone_draw             1
set zone_draw_dist        0
set zone_alpha          0.9
set zone_bonus            1
set zone_lines            1      // GL_LINES; 0 uses camera-facing quads instead
set zone_thickness      1.5      // world units, zone_lines 0 only
set gl_line_width         2
// xray = draw through walls; fill = translucent side faces.
set zone_xray             0
set zone_fill             0
set zone_fill_alpha    0.10
// cancel/bhop/overbounce are off: allowBhop alone reaches 68 regions on one map.
set zonetype_start_draw   1
set zonetype_end_draw     1
set zonetype_stage_draw   1
set zonetype_checkpoint_draw 1
set zonetype_cancel_draw  0
set zonetype_bhop_draw    0
set zonetype_overbounce_draw 0

// Source areaportals start closed until gamecode opens them; open them all. Renderer-latched, so
// it has to be set before a map loads.
set map_autoopenportals   1
// Sky for the ~1% of maps that name none. r_skybox still overrides; `sky` reports.
set r_skybox_default sky_cape_hill

// --- HUD (hud_edit moves and saves it; a saved layout wins over these) ---
// hud_energy 1 = E = height above the anchor + v^2/2g in units (Momentum's), 2 = as a speed.
// hud_energy_ref 1 = anchored where you last jumped (Momentum's), 0 = the leg's start zone.
// Strafe windows are seconds, not frames. band 1.0 ends the bar where the grade reaches zero.
set hud_scale             2
set hud_speed             1
set hud_energy            1
set hud_energy_ref        1
set hud_strafe            1
set hud_board             1
set hud_keys              1
set hud_debug             0
set hud_board_fade        3
set hud_strafe_smooth   0.2
set hud_strafe_window     2
set hud_strafe_band     1.0
set hud_strafe_sens       1      // bar travel per unit of error; 4 = the old bar
set hud_strafe_curve      1
set hud_strafe_minspeed 200      // below this the ideal rate is a spin, not a strafe
set hud_speed_x         0.5
set hud_speed_y        0.68
set hud_strafe_x        0.5
set hud_strafe_y       0.42
set hud_keys_x            0      // 0 = auto: right gap matches the floor gap
set hud_keys_y         0.84
// Mouse pad left of the keys: the dot moves by the turn the mouse is worth (m_accel is not
// modelled) and wraps. -1/-1 = attached to the keys.
set hud_mouse             1
set hud_mouse_x          -1
set hud_mouse_y          -1
set hud_mouse_span       90      // degrees of turn edge to edge; the height is 10/16 of it
set hud_mouse_trail     0.5      // seconds; 0 = the dot only
// The ramp you are on shows as a dim provisional row before you leave it.
set hud_seq_live          1
// Map info, top right: x is its right edge, y its top. timeleft adds the map clock and next map.
set hud_mapinfo           1
set hud_mapinfo_x      0.99
set hud_mapinfo_y      0.02
set hud_mapinfo_timeleft  1
// Air rows: % of the best possible ENERGY gain, not of speed (energy is additive).
set hud_seq_pct           1
// Segment rows: 1 = energy (e), 0 = u/s, 2 = both.
set hud_seq_units         1
// Join rows split by a refused blip: 1 = across artifacts only, 2 = always, 0 = off.
set hud_seq_merge         1
// The touchdown's cost gets its own Board row between the air and ramp rows.
set hud_seq_board         1
// `retry` restarts the map and puts you back exactly, run intact. 0 = respawn, run discarded.
set rec_retry             1

// --- Run rules ---
// Leaving the start on more than one jump makes the run practice. Bhop/KZ want 0 (mode_bhop.cfg).
set run_starthop          1
// Resets the air-phase clock at the arm; at 0 the hop rule never fires.
set run_starthop_strict   1
// Re-entering the start box stops the clock (greyed) instead of zeroing it.
set run_rearmstops        1
// Map teleports warp the swept zone test, which could otherwise fire every zone on the line.
set run_teleport_warp     1
// GAME RULE, announced: when the clock starts the server moves you a random distance of up to N
// units horizontally (never into a wall or back into the zone; your .rec header records it). It
// defeats replayed input streams, not a live aim assist. 0 = off.
set run_startjitter       2

// --- Source map entities ---
// Entity I/O. Map-run console commands are allow-listed to say/echo/print.
set vbsp_entity_io        1
// Displacement collision wound by the face's side flag (else 4-6 unit invisible seam steps).
set hl2_dispwinding       1
// WindowImposter materials draw their cubemap (0 = nodraw).
set hl2_imposter          1
// The full box-vs-triangle bevel set for trisoup collision (0 = the old set, which wedges you).
set pm_trisoup_bevels     1
// Ladders. Times either side of this are not comparable on maps where a ladder is a shortcut.
set pm_ladders            1
set pm_ladderdampen       0.2
set pm_ladderangle       -0.707
// func_slide faces are never ground. Serverinfo, and in the ruleset lock.
set pm_slide              1
// trigger_setspeed boosters (0 = inert).
set run_setspeed          1
// 1 prints each booster cash-out.
set run_bv_debug          0
// func_bhop dwell for blocks with no TimeLimit (momentum.fgd's 0.1).
set sv_bhop_time_limit  0.1

// --- Run rules: starts and stages ---
// Standing run_prestrafe_time inside the start zone forgives a hopped start.
set run_rearmhop          1
// fail: re-entering a stage's zone resets its time (the run clock keeps counting). arm: timed
// from leaving the box. clean: judged per stage. hop: a bhop out of the box is a legal start.
set run_stagefail         1
set run_stagearm          1
set run_stageclean        1
set run_stagehop          1
// stageghost: a ghosted stage is written. runarchive: a clean run that beat nothing is kept
// (stamped) instead of overwriting last.rec.
set run_stageghost        1
set rec_runarchive        1
// Zones test the standing HULL as Source triggers do (2 = occupancy too). hull_live 0: a ducked
// hull would make timing a function of a button.
set run_zone_hull         1
set run_zone_hull_live    0
set run_zone_swept        1
// Labels cheated / segmented / practice (0 = all practice). cheatwatch 0 makes every run practice.
set run_class             1
set run_cheatwatch        1
// Lobby stage fill-in posts a stage only if it started from a prime at <= run_stagecap u/s.
// An abandoned run that posted stages keeps its .rec in data/evidence/ for this many days.
set run_stagecap          290
set run_evidence_days     30

// --- Recording ---
// The .hid input journal (anti-cheat, not replay). Runs only after the recording terms are
// accepted (data/consent.txt); never set rec_terms by hand. Size cap: in_journal_maxkb.
set rec_hid               1
// data/runs/<map>/<leg>/NNNNNNN_<tag>.rec: the 7-digit zero-padded tick time makes filename order
// time order, which the board and the pruner rely on. Kept per leg per tag class, slowest pruned
// first; 0 = never prune. The old flat layout: python tools\migrate_runs.py.
set rec_runs_keep        25

// --- Replay ---
// Route: mode 2 = a px-wide screen-space line (shows through walls), 1 = a world ribbon `width`
// units wide at 512 range (scale 1 = constant on-screen size). ahead 0 = only the played part.
set hud_watch_path        1
set hud_watch_path_mode   2
set hud_watch_path_px     3
set hud_watch_path_ahead  1
set hud_watch_path_width  6
set hud_watch_path_scale  1
// Stretches under idle_speed u/s for idle_time s are marked red and skipped in playback.
set hud_watch_idle_speed 20
set hud_watch_idle_time 0.5
set hud_watch_idle_pad    0
set hud_watch_skipidle    1
// Info panel: run fps, rec rate, file facts (`replay status` prints the same).
set hud_watch_info        0
set hud_watch_scale       1

// --- Splits, results, banner ---
set hud_splits_speed      1
set hud_splits_energy     1
// Split-row gutter mark: ! cheated, ~ not recorded.
set hud_splits_class      1
// The clock turns green/red against your PB at each gate. Needs a PB; lobbies publish none.
set hud_timer_pace        1
set hud_results           1
set hud_results_rank      1
set hud_results_toast     1
set hud_results_toast_time 3.5
// size 0 = 32 * hud_scale. No sounds ship: drop complete/pb/wr.wav into sound/ftesurf/ (a missing
// file is skipped). `banner` reports.
set hud_banner            1
set hud_banner_stages     1
set hud_banner_hold       3.5
set hud_banner_x          0.5
set hud_banner_y          0.25
set hud_banner_size       0
set hud_banner_sound      1
set hud_banner_chat       1
set hud_banner_snd_end    "sound/ftesurf/complete.wav"
set hud_banner_snd_pb     "sound/ftesurf/pb.wav"
set hud_banner_snd_wr     "sound/ftesurf/wr.wav"
// A refused save-lock load; "" = silent.
set hud_snd_error         "sound/ftesurf/error.wav"

// --- Props and portals ---
// Per-triangle prop collision: surf maps' solid props are handrails and fences, which a hull or
// box turns into walls (mode 2 has no Source hulls and falls back to a box).
set sv_prop_collision     1
// Each level is a full extra scene render; past the limit a portal renders closed.
set r_portalrecursion     2
// Portals rendered per view, largest first (0 = unlimited). Doors past portal_dist are not offered.
set r_portalmaxviews      2
set vbsp_portal_render    1
set vbsp_portal_dist   3000
set vbsp_portal_debug     0
// Clip the far scene to the doorway's screen rectangle.
set r_portalscissor       1
// Recompute areas from the portal's far side (surf_kitsune's doorways draw black at 0).
set r_portalareas         1

// --- Save-lock menu (z) and vote box ---
// On a clean run on the clock the load keys are refused; practice runs and `cmd sl_load` still load.
set rec_savelock          1
set hud_saveloc_x     0.018
set hud_saveloc_y      0.34
set hud_vote_x        0.018
set hud_vote_y         0.30

// --- ghost / spectate ---
// ghost detaches the camera; the body keeps running physics and the run stays valid (marked).
set ghost_speed           0      // 0 = match noclip (pm_noclipspeed x sv_maxspeed)
set ghost_body            1
set ghost_alpha        0.55
set spec_dist           110

// --- hud_edit ---
// Snap distance in pixels (a mouse tolerance, not hud_scale units).
set hud_edit_snap         8
set hud_edit_panel_x  0.010
set hud_edit_panel_y  0.080
// -1/-1 = stacked under the strafe bar (a sentinel, not a coordinate).
set hud_board_x          -1
set hud_board_y          -1
// update: rate-cell cadence, -1 = per server snapshot, 0 = every frame, N = N/s.
// round: step the speed/energy readouts (1 = no-op; 2 or 5).
set hud_update           -1
set hud_round             1
// Text sizes: 0 = the drawer's own (listed at hud_scale 2); non-zero is absolute pixels.
set hud_timer_size        0      // display face; 64 px at hud_scale 2
set hud_timer_sub_size    0      // mono;         16
set hud_splits_size       0      // mono;         14
set hud_seq_size          0      // mono;         16
set hud_strafe_size       0      // mono;         20
set hud_board_size        0      // mono;         20
set hud_boarding_size     0      // mono;         20
set hud_speed_size        0      // display;      48
set hud_energy_size       0      // display;      32
set hud_debug_size        0      // UI;           16
set hud_mapinfo_size      0      // mono;         16
// Segment row columns: label, absolute energy, delta, duration.
set hud_seq_name          1
set hud_seq_abs           1
set hud_seq_delta         1
set hud_seq_time          1
// A landing breaks the merge, so each bhop is its own row.
set hud_seq_hopbreak      1
// Air rows entered from the ground read Jump/Bhop (split at run_prestrafe_time).
set hud_seq_hopname       1
// The bar takes the ground regime only after this long grounded, so hops do not flicker it.
set hud_strafe_groundhold 0.12
// Boarding window (enter/leave). -1/-1 = stacked under Board; units 0 u/s, 1 energy, 2 both.
set hud_boarding          1
set hud_boarding_x       -1
set hud_boarding_y       -1
set hud_boarding_units    2
set hud_boarding_fade     3
set hud_boarding_enter    1
set hud_boarding_leave    1
// -1 = the engine's crosshair, 0 = off, 1-3 = gfx/crosshairs/xhairN (32x32; not hud_scale'd).
set hud_crosshair         1
set hud_crosshair_size   32
set hud_crosshair_alpha   1
// Strafe bar text: rates = digits above, why = reason when no target, best = line below (0/1/2).
set hud_strafe_rates      1
set hud_strafe_why        1
set hud_strafe_best       2
// Board panel parts; words 0 drops the labels. A row switched off stays blank so nothing moves.
set hud_board_seg         1
set hud_board_grade       1
set hud_board_kept        1
set hud_board_cost        1
set hud_board_ramp        1
set hud_board_words       1

// --- Emitters (vbsp_emit_*) ---
// Effects live in particles/ftesurf.cfg, loaded by cl_emit.qc Emit_LoadForMap. Never exec it or set
// r_particledesc here: this file runs before the particle system exists and FTE silently drops
// r_part blocks. Needs r_particlesystem "script" and r_part_sparks 1 (engine defaults).
set vbsp_emit             1
set vbsp_emit_dust        1
set vbsp_emit_embers      1
set vbsp_emit_bubbles     1
set vbsp_emit_fire        1
set vbsp_emit_spark       1
// func_smokevolume is a static haze the particle model can only approximate: opt-in.
set vbsp_emit_smoke       0
// env_smokestack: torch and chimney jets, a different class.
set vbsp_emit_stack       1
// info_particle_system (.pcf baked by tools/pcf.py into particles/<map>.cfg).
set vbsp_emit_psys        1
// Spawns/s across all emitters, met by scaling density (surf_shade's 339 dust emitters would
// otherwise hold ~54k particles live). 0 = unlimited.
set vbsp_emit_budget   2000
set vbsp_emit_ratemax  200
set vbsp_emit_psys_children 0
// Multiplier on each entity's DistMax (0 = unlimited).
set vbsp_emit_dist        1
// Dlights on env_fire, N at a time. Off: the dlight pool is 64 and never reused, and
// surf_stonework4 has 531 fires.
set vbsp_emit_lights      0
// Re-exec the effect set if it has gone (vid_restart, r_part_keepuser 0).
set vbsp_emit_heal        1
