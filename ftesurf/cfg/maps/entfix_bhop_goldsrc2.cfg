// bhop_goldsrc2 -- entity fix (Patch 1043, Stripper:Source syntax; see entfix_surf_network2008_final.cfg).
// Lex, 26 Oct: "Disable these func_physboxes for now, we don't have the box3d plugin loaded."  The map's
// 39 func_physbox are movable crates (none motion-disabled or asleep), so Source drops them at spawn; here
// they hung frozen and solid where they were placed (24 in a closed pit under a teleport, 15 in the air
// over stage 8).  Removed until physics exists; none is named or wired.  This removes solid entities, so
// the physent digest moves and earlier goldsrc2 runs are refused (beta, Lex 26 Oct).

filter:
{
	"classname" "func_physbox"
}
