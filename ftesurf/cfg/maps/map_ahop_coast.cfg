// ahop_coast -- per-map ruleset: Momentum's bhop numbers (cfg/lobby/mode_bhop.cfg).
//
// Momentum indexes this map as gamemode 2, bhop (data/mapmeta.txt), and an install
// that ships mapmeta.txt already plays it that way. The lobbies have no mapmeta.txt,
// so the `ahop_` prefix picked mode ahop, which has no file here: surf's base
// ruleset (66.7 Hz, airaccelerate 150) -- Lex, 7 Nov: uphill bhops felt harder
// than in Momentum. The six lines below are mode_bhop.cfg's.

pm_ticrate                0.01
sv_mintic                 0.01
sv_maxtic                 0.01
cl_netfps                 100
sv_airaccelerate          1000
run_starthop              0
