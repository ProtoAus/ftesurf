// bhop_badwater -- per-map ruleset: Momentum's bhop numbers (cfg/lobby/mode_bhop.cfg).
//
// Momentum files this map as ahop, gamemode 9 (data/mapmeta.txt), which has no ruleset
// file here, so it would run surf's base ruleset (66.7 Hz, airaccelerate 150). Lex, 7 Nov:
// every bhop map runs 100 tick, airaccelerate 1000. A map cfg cannot set the mode, so the
// published gamemode -- and the timer start, sv_timer.qc run_t_bhopjump -- stays Momentum's.
// The six lines below are mode_bhop.cfg's.

pm_ticrate                0.01
sv_mintic                 0.01
sv_maxtic                 0.01
cl_netfps                 100
sv_airaccelerate          1000
run_starthop              0
