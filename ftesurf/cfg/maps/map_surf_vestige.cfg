// surf_vestige -- per-map ruleset, generated from the map's own entity lump.
//
// The map asks for this itself, through a Source entity output that this
// game refuses to run: a BSP is untrusted content and `Command` is remote
// code execution by map (see SV_IOCommand in src/server/sv_entities.qc).
// Momentum honours it -- sv_maxvelocity is on its own point_servercommand
// whitelist, mom_gamerules.cpp -- so the value is read out offline and
// shipped here as data instead, where it is diffable and `movement` names
// the file it came from.
//
// WHAT THE MAP SAYS:
//   logic_relay   OnSpawn     serverSettings,Command,sv_maxvelocity 5000,0,1
//
// NOT AN OnMapSpawn -- it fires from OnSpawn.  Applying it from map load is
// therefore an approximation: in Source the ceiling would rise only once
// that output actually ran.  Delete this file to get the base 3500 back.

set sv_maxvelocity 5000
