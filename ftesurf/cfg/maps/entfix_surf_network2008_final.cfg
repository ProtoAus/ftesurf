// surf_network2008_final -- entity fix (Patch 890, Stripper:Source syntax; the engine applies it
// as the map loads).  The CS:S round sends a fall to a separation room and on to a team jail,
// released every 20 s, and 30 s after map load its timer turns the start's own fall box into the
// jail too.  On a timer every fall goes back to the start: the zone file's teleDestPos and yaw,
// stopped dead (velocitymode 1, as !r) so a fall cannot carry its speed into the start.  The
// teleports into the spawn room beside the start (fall1, fall2, telect, telet: a fall box's, the
// end zone's and the jails') keep their targets and stop dead too.  Two round-over relays lose the
// outputs that open those triggers, so one player cannot reset everyone: AllToJailRelay (fired by anyone leaving the
// end room's door) opened the course-wide AllToJail for 0.5 s, and the 666 kill button opened
// alltojail_pro over the leet area for good.
// Teleport targets and one added destination only -- no solid entity changes, so no physent
// digest moves.

add:
{
	"classname" "info_teleport_destination"
	"targetname" "entfix_start"
	"origin" "1856 3680 5153"
	"angles" "0 135 0"
}

modify:
{
	match:
	{
		"classname" "trigger_teleport"
		"target" "seperation1"
	}
	replace:
	{
		"target" "entfix_start"
	}
	insert:
	{
		"velocitymode" "1"
	}
}

modify:
{
	match:
	{
		"classname" "trigger_teleport"
		"target" "mid_seperation"
	}
	replace:
	{
		"target" "entfix_start"
	}
	insert:
	{
		"velocitymode" "1"
	}
}

modify:
{
	match:
	{
		"classname" "trigger_teleport"
		"target" "fall1"
	}
	insert:
	{
		"velocitymode" "1"
	}
}

modify:
{
	match:
	{
		"classname" "trigger_teleport"
		"target" "fall2"
	}
	insert:
	{
		"velocitymode" "1"
	}
}

modify:
{
	match:
	{
		"classname" "trigger_teleport"
		"target" "telect"
	}
	insert:
	{
		"velocitymode" "1"
	}
}

modify:
{
	match:
	{
		"classname" "trigger_teleport"
		"target" "telet"
	}
	insert:
	{
		"velocitymode" "1"
	}
}

modify:
{
	match:
	{
		"targetname" "AllToJailRelay"
	}
	delete:
	{
		"OnTrigger" "/AllToJail*/"
	}
}

modify:
{
	match:
	{
		"targetname" "killButtonRelay666"
	}
	delete:
	{
		"OnTrigger" "/alltojail_pro*/"
	}
}
