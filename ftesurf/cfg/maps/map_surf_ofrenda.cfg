// surf_ofrenda -- per-map ruleset, generated from the map's own entity lump.
//
// The map asks for this itself, through a Source entity output that this
// game refuses to run: a BSP is untrusted content and `Command` is remote
// code execution by map (see SV_IOCommand in src/server/sv_entities.qc).
// Momentum honours it -- sv_maxvelocity is on its own point_servercommand
// whitelist, mom_gamerules.cpp -- so the value is read out offline and
// shipped here as data instead, where it is diffable and `movement` names
// the file it came from.
//
// WHAT THE MAP SAYS:
//   logic_auto    OnMapSpawn  sv,Command,sv_maxvelocity 6000,0,-1
//   logic_auto    OnMapSpawn  maxvel,Command,sv_maxvelocity 5000,0,-1
//   logic_auto    OnMapSpawn  command,Command,sv_maxvelocity 6000,0,-1
//
// IT DISAGREES WITH ITSELF -- 5000 / 6000.  Taking the highest: the firing
// order between same-delay outputs is not defined, so there is no correct
// one to pick, and the higher ceiling is the one that cannot clip a run
// the map's own author expected to be possible.

set sv_maxvelocity 6000
