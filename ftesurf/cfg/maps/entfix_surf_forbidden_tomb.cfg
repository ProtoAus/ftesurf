// surf_forbidden_tomb -- entity fix (Patch 1562, Stripper:Source syntax; the engine applies it as the
// map loads).  The CS:S round jails everyone: jail1tele/jail2tele (16 trigger_teleports, one per level,
// lvl1's covering the start room) start disabled and are switched on map-wide by the logic_timer
// "Timer" 420 s after load and every 420 s after, by the finish's trigger_once *37, and by
// Maths_counter 11 s after the eighth secret.  With no rounds nothing turns them off again, so every
// !r, !s and zone teleport lands in the jail.  Outputs only: no entity is removed or renumbered.

modify:
{
	match:
	{
		"targetname" "Timer"
	}
	delete:
	{
		"OnTimer" "/jail1tele*/"
	}
}

modify:
{
	match:
	{
		"classname" "trigger_once"
		"model" "*37"
	}
	delete:
	{
		"OnTrigger" "/jail1tele*/"
	}
}

modify:
{
	match:
	{
		"targetname" "Maths_counter"
	}
	delete:
	{
		"OnHitMax" "/jail2tele*/"
	}
}
