// surf_1day -- entity fix (Patch 1562, Stripper:Source syntax; the engine applies it as the map loads).
// KSF's surf_1day demos (two stage-6 records and the four fastest main runs, measured 15 Nov 2026) ride
// stage 6's booster *125 at 2100 u/s, not the lump's 1000 (out speed +2115.75 = 1.0075 x 2100, the
// basevelocity cash-out), and pass through stage 8's *82 (500 u/s along +Y) with no carrier at all.
// Every other push those runs cross matches the lump 1:1, and the CS:S and Momentum builds are
// byte-identical, so KSF changed these two on its side; this matches KSF's boards.

modify:
{
	match:
	{
		"classname" "trigger_push"
		"hammerid" "119710"
	}
	replace:
	{
		"speed" "2100"
	}
}

modify:
{
	match:
	{
		"classname" "trigger_push"
		"hammerid" "118816"
	}
	replace:
	{
		"startdisabled" "1"
	}
}
