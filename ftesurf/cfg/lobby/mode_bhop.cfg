// ===========================================================================
//  cfg/mode_bhop.cfg -- the movement ruleset for bunnyhop maps.
//
//  Loaded by the engine (Patch 224) at map load, for any map whose gamemode
//  resolves to bhop: Momentum gamemode 2 (bhop) or 3 (bhop-hl1) out of
//  data/mapmeta.txt column 9, and any `bhop_` map the index has never heard
//  of.  531 of the 2194 indexed maps are one of those two ids -- the second
//  largest gamemode in the library after surf's 557, and every one of them was
//  running surf's numbers until this file existed.
//
//  WHAT THIS FILE IS.  A list of `<cvar> <value>` lines, nothing else -- no
//  aliases, no binds, no commands.  Each one becomes this map's CANONICAL
//  value: the movement lock (Patch 170) restores to it rather than to
//  cfg/default.cfg's number, and reverts anything you type over it.  Leaving
//  a map puts every cvar named here back to default.cfg's value, so the file
//  cannot leak into the next map.  `set` is accepted and ignored, so a line
//  can be moved to or from default.cfg unchanged.
//
//  There is deliberately NO mode_surf.cfg.  Surf IS the base ruleset in
//  cfg/default.cfg; a second copy of it here would be free to disagree with
//  the first, and one of the two would then be wrong without anyone noticing.
//
//  `movement` in the console prints what loaded, where the gamemode came
//  from, and every line below with its live value beside default.cfg's.
// ===========================================================================


// ---------------------------------------------------------------------------
//  100 Hz.  This is the whole ruleset; the rest is consequence.
//
//  CS:S bhop servers ran `-tickrate 100`, and these maps were built, timed and
//  routed against that.  At 66.667 Hz a bhop map is not "the same map, slower
//  to simulate" -- air acceleration is applied ONCE PER TICK against a fixed
//  30 u/s cap (pm_maxairspeed, Source's GetAirSpeedCap), so the tick rate IS
//  the acceleration rate.  100 ticks a second is 50% more gains per second
//  than 66.667, and a jump's hang time does not change to compensate.  That is
//  the difference between a block being reachable and not.
//
//  0.01 s is 10 ms EXACTLY, which is the same reason 0.015 was chosen over
//  64-tick's 15.625 (see the pm_ticrate essay in default.cfg): usercmd_t.msec
//  is an integer number of milliseconds, so a 10 ms command survives the round
//  trip losslessly and the client's replay cannot drift from the server's.
//
//  JUMP HEIGHT DOES NOT MOVE, and that is not luck -- pm_normalizejump 1
//  (default.cfg) makes every jump reach pm_jumpvelocity^2/(2*sv_gravity)
//  "regardless of duck state and regardless of pm_ticrate", which is exactly
//  the property that makes a tick change safe here.  With pm_normalizejump 0
//  this file would silently change how high you jump as well.
// ---------------------------------------------------------------------------
pm_ticrate                0.01

// The server frame has to keep up with the physics tick or the two disagree
// about what a second is.  These are forced to 0.015 in default.fmf ("so a
// stale ftesurf.cfg can never desync the physics"), which is the right default
// and the wrong number for this mode.
sv_mintic                 0.01
sv_maxtic                 0.01

// ...and so does the rate the client SENDS input at.  66.667 usercmds a second
// feeding a 100 Hz mover means most commands step one tick and some step two,
// which is survivable -- pmove.msec_carry carries the remainder and is part of
// predicted state -- but it is not what the maps were played on.
//
// The serverinfo `maxfps` ceiling that used to clamp this to 71.4 was fixed in
// build 25 (sv_timer.qc publishes 1000 unconditionally, "because it is a
// CEILING and not a target"), so this line reaches the value it asks for.
//
// KNOWN LIMIT: this is a client cvar, and the ruleset is applied server-side.
// On the listen server that is this game today it lands on the only client
// there is.  A remote client in a future P2P session keeps its own cl_netfps
// and would send at that rate instead.
cl_netfps                 100

// ---------------------------------------------------------------------------
//  sv_airaccelerate 1000 -- the CS:S bhop number, and INERT on this engine's
//  keyboard path.  It is set anyway; here is exactly what it does and does not
//  do, so nobody spends an evening tuning it again.
//
//  Source clamps air acceleration twice (PMSrc_AirAccelerate, pm_source.c):
//
//      addspeed   = min(wishspeed, 30) - (velocity . wishdir)
//      accelspeed = airaccel * wishspeed * frametime * surfacefriction
//      gain       = min(accelspeed, addspeed)
//
//  `addspeed` is the 30 u/s air cap and is what SHOULD bind.  airaccelerate
//  only ever matters when it is small enough that `accelspeed` binds first --
//  and the threshold is far below either number in play here:
//
//                                   saturates at          150 gives
//      flat, 66.7Hz, wish 260         airaccel >= 7.7        585
//      rising, 100Hz, wish 260        airaccel >= 46.2        97.5
//      rising, 100Hz, walking (135)   airaccel >= 88.8        50.7   <- worst
//
//  "Rising" is the quarter-friction phase: CategorizePosition drops
//  surfacefriction to 0.25 while airborne and moving up (cpp:3868), which is
//  most of every hop and is why the second and third rows are the ones that
//  matter.  wishspeed cannot get smaller than the third row from a keyboard:
//  cl_forwardspeed is 450 and is clamped to maxspeed, so the only reduction
//  available is +speed's 0.52.  (Ducking does NOT reduce it -- the duck speed
//  crop is `ducked && onground`, so it cannot apply while you are rising.)
//
//  So 150 already saturates in every case you can reach with keys, at both
//  tick rates, and 1000 changes nothing you can feel.  What the tick change
//  spends is MARGIN: the worst case goes from 2.5x clear of the threshold to
//  1.7x.  1000 restores it to 11x, and covers reduced-magnitude input -- an
//  analog stick, or a lowered cl_forwardspeed -- where wishspeed can be small
//  enough that the rate genuinely binds (below 30 u/s of wish it needs 400).
//
//  It is also simply what CS:S bhop servers ran, which is worth matching in a
//  file whose whole job is to reproduce them.
//
//  The corollary, which is the useful half: typing `sv_airaccelerate 1000` at
//  the console has never done anything, on any map, for two independent
//  reasons -- this one, and the movement lock reverting it on the spot.
// ---------------------------------------------------------------------------
sv_airaccelerate          1000

// ---------------------------------------------------------------------------
//  Hopping out of the start box is the sport, not a fluffed start.
//
//  default.cfg's own run_starthop essay says so in as many words: "A bhop or KZ
//  map wants 0: hopping is the whole game there."  It has said that since
//  build 19 and there has been no way to act on it, because there was no such
//  thing as knowing you were on a bhop map.  Now there is.
//
//  This is a gamecode cvar rather than an engine one, which the ruleset
//  mechanism does not care about -- it sets cvars, not movement specifically.
//  It is not part of the locked table, so it is not policed while you play;
//  it is set here and restored to 1 when you leave.
// ---------------------------------------------------------------------------
run_starthop               0


// ---------------------------------------------------------------------------
//  Deliberately NOT set here, with reasons, because an empty line is not
//  evidence that anyone thought about it:
//
//    pm_maxairspeed    30 is Source's GetAirSpeedCap and is the same number in
//                      every Source movement gamemode.  Raising it is a
//                      different game, not a different mode.
//    pm_autobunny      already 1 in default.cfg -- surf servers run a bhop
//                      plugin too, so autohop is not a bhop-mode setting here.
//    pm_stamina        already 0, and default.cfg explains at length why.
//    sv_maxspeed       260 is Momentum's ground speed and bhop servers did not
//                      change it; the speed comes from the air, not the run-up.
//    sv_gravity        800 both.  Changing it would change jump height, which
//                      is the one thing about these maps that must not move.
//    sv_maxvelocity    3500 is CS:S's own per-axis clamp.  Some bhop servers
//                      raised it; without a map that actually reaches it, that
//                      would be a number copied rather than a number chosen.
// ---------------------------------------------------------------------------
