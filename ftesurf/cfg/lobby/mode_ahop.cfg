// cfg/lobby/mode_ahop.cfg -- Momentum's ahop (accelerated hop, gamemode 9) ruleset.
//
// Loaded for any map whose gamemode resolves to ahop, on a listen server as well as a lobby
// (SV_LoadGamemodeRuleset; mode_bhop.cfg's header says how a mode file works). Values from
// Momentum's CGameMode_Ahop (mom_system_gamemode.cpp/.h), view vectors g_ViewVectorsAhop
// (mom_gamerules.cpp) and the ahop branches of mom_gamemovement.cpp, public game repo, read
// 20 Nov 2026; the same HL2 numbers as the engine's hl2-* profiles (SV_ApplyMovementProfile).

// Momentum's default interval (CGameModeBase::GetIntervalPerTick); ahop does not override it.
pm_ticrate                0.015

sv_gravity                600
sv_accelerate             10
sv_airaccelerate          10
sv_stopspeed              100
// AHOP_NORM_SPEED. Momentum sets sv_maxspeed 320 as a ceiling; the player's speed is 190, 320
// sprinting (+speed) and 150 walking (+walk, not carried here).
sv_maxspeed               190
// +speed is ahop's SPRINT, 320/190 of maxspeed, not CS:S's 0.52 walk. Momentum also refuses a
// sprint ducked on the ground; this does not. Drop this line if mode ahop ever gets the hl2-*
// mover kind, whose own sprint (pm_source.c PMSrc_MaxSpeedForInputs) would compound with it.
pm_walkspeed              1.68421053
// CGameMode_Ahop::GetJumpFactor; with pm_normalizejump every jump peaks at 160^2/1200 = 21.3.
pm_jumpvelocity           160
// sv_jump_z_offset is CS-mode only (mom_gamemovement.cpp CheckJumpButton).
pm_jumpzoffset            0
// sv_considered_on_ground 2.
pm_groundtracedist        2
// The slope fix skips ahop (TryPlayerMove's `!GameModeIs(GAMEMODE_AHOP)`).
pm_fixslopes              0

// g_ViewVectorsAhop (HL2's): hull 72/36, eyes 64/28; GetViewScale 1.0 (full-delta air duck);
// the base class's duck crop, 0.33333333.
pm_standheight            72
pm_duckheight             36
pm_viewheight             64
pm_duckviewheight         28
pm_viewscale              1
pm_duckspeed              0.33333333

// Hopping is the mode: leaving the start on a hop is not a practice run (as mode_bhop.cfg).
run_starthop              0

// Not expressible as cvars here, so not matched: the HL2 jump boost along the view axis that
// makes ABH (CheckJumpButton; only the hl2-pre/hl2-post profiles have it), HL2 Duck/Friction
// and the no-jump-while-unducking rule. Autobhop is on in Momentum's ahop (PlayerHasAutoBhop
// is the base class's), as pm_autobunny 1 in default.cfg.
