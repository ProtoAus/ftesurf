// ---------------------------------------------------------------------------
//  cfg/lobby7.cfg -- an OPEN lobby.  QC build 68.
//  See cfg/lobby1.cfg for why the port is the identity and why they are spaced
//  by ten; only the three per-lobby values live here.
//
//  "OPEN" RATHER THAN A TIER, AND THE ROTATION IS A PARKING SPOT.  Lobbies 1-5
//  predate /api/join and their rotations are curated because the rotation was
//  the ONLY way a player reached a map on them.  Since build 67 the directory
//  moves any idle lobby to whatever map is asked for, so what is listed below
//  decides only where this server sits while nobody wants anything -- it is a
//  default, not a programme, and changing it breaks nothing.
//
//  The list is still all TIMEABLE maps (a BSP and an online zone file, checked
//  against the library when this file was generated) and shares no entry with
//  any other lobby, so an idle fleet shows a spread of the library rather than
//  seven rows of the same map.
//
//  NOT STARTED BY DEFAULT.  This file existing costs nothing; the unit is what
//  costs RAM.  See surfd/README.md for the one command that enables it, and do
//  not enable more lobbies than there is demand for -- an idle row in the map
//  picker makes the game look emptier, not fuller.
// ---------------------------------------------------------------------------
set sv_port     27570
set hostname    "FTESurf -- open 2"

set lobby_maps  "surf_2525 surf_8bit surf_agony surf_anoobis surf_aquaflow surf_atonement surf_barbies_malibu_adventure surf_beyer2"
set lobby_cycle 1800
