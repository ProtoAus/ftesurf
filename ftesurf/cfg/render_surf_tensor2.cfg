// surf_tensor2 -- per-map CLIENT render overrides.
//
// Exec'd by CSQC_WorldLoaded after cfg/render_default.cfg, so only the lines
// that DIFFER from the baseline belong here.  Rendering only: nothing in this
// file may touch movement, prediction, or anything a run's time or class
// depends on -- that is cfg/map_<mapname>.cfg's job and a different trust
// boundary entirely.

// ---- glare occlusion tracing -------------------------------------------
//  Asked for directly: "0.025 is fine for most maps, but I sort of want
//  vbsp_glare_interval 0.2 on tensor2 because of the fps savings."
//
//  MEASURED AT `!s 1` (the start box, zone index 0), four interleaved pairs
//  against 0.025, every paired delta positive:
//
//      interval   rays/frame   sweep         staleness   fps
//        0            40       11.5 frames    28.5 ms    269-337
//        0.025        40       12.2 frames    30.2 ms    328.5
//        0.2          ~2      141   frames   197   ms    597.4
//
//  +82%, and the four deltas were +263/+280/+276/+247 against a same-setting
//  spread of 18.7 fps.  The frame is byte-identical between all three at a
//  static camera.
//
//  AND 0.025 IS INERT ON THIS MAP AT THIS VANTAGE, which is the real reason a
//  per-map value is needed rather than a global compromise.  429 glares with
//  415 of them IN FRAME leaves almost nothing for the frustum cull to skip, so
//  a visit costs ~1.05 rays instead of the ~0.35 it costs at a normal vantage,
//  and the quota stops fitting under the 40-ray ceiling: it asked for 40-49
//  visits, got 28-45, and the census reported
//  `stopped by THE RAY CEILING (interval not met)` on 7 of 9 samples.  So the
//  sweep is 12 frames whether you ask for 25 ms or leave the deadline off
//  entirely -- 0.025 buys nothing here, and only an interval large enough to
//  bring the quota back under the ceiling buys anything at all.
//
//  THE TRADE THIS ACCEPTS, stated plainly because it is not free: 197 ms is 7x
//  the 27.7 ms Lex approved at build 59, and 4x the 50 ms decay ramp, so a
//  glare can hold a stale answer for about a fifth of a second. Every
//  measurement above is from a STATIC camera, which converges and therefore
//  cannot show that; whether it is visible while turning is a judgement no
//  script can make. If it reads as lag when spinning, lower this -- the
//  crossover where the quota stops hitting the ray ceiling is near 0.025 at
//  this vantage, so anything above ~0.05 should still buy most of the fps.
set vbsp_glare_interval 0.2
