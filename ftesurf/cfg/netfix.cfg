// NETFIX -- cl_netfps must equal 1/pm_ticrate, and on surf maps it does not.
// `exec cfg/netfix.cfg`, then `net_surf`.
//
// ===========================================================================
//  THE BUG
// ===========================================================================
// PMSrc_PlayerMove (pm_source.c:2984) accumulates
//
//     avail = msec_carry + cmd.msec
//
// and runs WHOLE ticks only, carrying the remainder.  A usercmd therefore moves
// you a whole number of ticks or not at all.  With 10 ms commands against a
// 15 ms tick the cycle is forced and periodic:
//
//     avail 0.010 -> 0 ticks, carry 0.010
//     avail 0.020 -> 1 tick,  carry 0.005
//     avail 0.015 -> 1 tick,  carry 0.000   -> repeats, forever
//
// MEASURED, on this build, surf_rise, cl_netfps 100 / pm_ticrate 0.015, from the
// .rec's own origin+velocity columns:
//
//     packet interval : 10.00 ms
//     motion in ticks : 101101101101101101101101101101101101...
//     117 of 351 usercmds moved the player ZERO units
//     distance to the nearest whole tick: 0.003   (the wall clock's: 0.333)
//
// That is a 33 Hz stop-go in POSITION.  View angles never pass through the tick
// -- they come off the usercmd every frame -- which is exactly why the mouse
// feels smooth while moving does not.
//
// ===========================================================================
//  WHERE THE 100 CAME FROM, AND WHY IT STICKS
// ===========================================================================
// cfg/mode_bhop.cfg is right to set cl_netfps 100: it also sets pm_ticrate,
// sv_mintic and sv_maxtic to 0.01, so on a bhop map all four match and the
// motion reads 1111.  (Its own header already works through this arithmetic in
// the other direction -- "66.667 usercmds a second feeding a 100 Hz mover means
// most commands step one tick and some step two".)
//
// But cl_netfps is a CLIENT cvar with CVAR_ARCHIVE (cl_input.c:40), and the
// gamemode overlay is applied server-side (SV_ApplyModeFile, sv_phys.c:3399
// force-sets it).  mode_bhop.cfg's own header flags the hole:
//
//     "KNOWN LIMIT: this is a client cvar, and the ruleset is applied
//      server-side."
//
// So: load one bhop map -> cl_netfps becomes 100 -> the engine writes it into
// ftesurf.cfg on exit -> every launch after that loads 100 over the top of
// default.fmf's forced 66.6667, because the saved config runs LAST.  Surf has
// no mode_surf.cfg to set it back (default.cfg:116 says so on purpose: "surf is
// this file").  Nothing ever restores it.
//
// That also makes default.cfg:473-475 false where it says the tick is forced by
// default.fmf "so a stale saved config can't desync the physics".  A stale saved
// config is precisely what does it, and an archived cvar cannot be forced from a
// file that runs first.
//
// ===========================================================================
//  THE RULE
// ===========================================================================
// cl_netfps == 1/pm_ticrate.  Surf: 0.015 -> 66.6667.  Bhop: 0.01 -> 100.
// `movement` in the console prints the mode and every cvar it changed;
// `pm_ticrate` prints the tick.  If they disagree, so does your camera.
//
// SET IT AFTER THE MAP IS UP if you script this.  A cl_netfps set from a +exec
// cfg is overwritten by ftesurf.cfg loading afterwards -- the first attempt at
// measuring this printed `"cl_netfps" is "100"` immediately after setting it to
// 66.6667 and produced a null result.  Same override, one level up.

alias net_surf  "cl_netfps 66.6667; echo ^2net: 66.6667 -- 15 ms commands, matches pm_ticrate 0.015 (SURF)"
alias net_bhop  "cl_netfps 100;     echo ^2net: 100 -- 10 ms commands, matches pm_ticrate 0.01 (BHOP)"
alias net_show  "echo ^5---; cl_netfps; pm_ticrate; cl_maxfps; movement"

// The frame cap decides whether a command lands ON the threshold or overshoots
// to the next frame boundary, because commands are only emitted on render
// frames: the real interval is ceil(threshold / frame_period) * frame_period.
// For a 15 ms threshold, periods that divide 15 land exactly.
alias fps_200   "cl_maxfps 200;  echo ^25 ms frames -- 3 per 15 ms command, exact"
alias fps_333   "cl_maxfps 333;  echo ^23 ms frames -- 5 per 15 ms command, exact"
alias fps_1000  "cl_maxfps 1000; echo ^21 ms frames -- 15 per 15 ms command, exact"
alias fps_free  "cl_maxfps 0;    echo ^3uncapped -- the interval is whatever the frame grid rounds to"

// What to try on surf_4am.
alias net_fix   "cl_netfps 66.6667; cl_maxfps 333; echo ^2netfix: 15 ms commands, 3 ms frames, one tick each"

echo ^5netfix loaded.
echo ^7  net_fix     <- try this on surf_4am, then flip net_bhop to bring the judder back
echo ^7  net_surf / net_bhop / net_show
echo ^7  fps_200 / fps_333 / fps_1000 / fps_free
echo ^7
echo ^7  ^1Do not leave net_surf set while playing bhop maps^7 -- they run a 10 ms
echo ^7  tick and want 100.  This is a diagnosis aid, not the real fix.
echo ^7  Nothing here is saved -- it all dies with the session.
// A ';' inside an echo is a COMMAND SEPARATOR, not punctuation: the first
// version of this file ended "...is saved; it all dies with the session." and
// the console answered `Unknown command "it"`.  Same for the aliases above --
// there the semicolons are deliberate, which is why they are inside quotes.
