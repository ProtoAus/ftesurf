cfg_save_auto 0
// Optional runtime smoke: use an ISOLATED basedir with the full product progs,
// content/addons and P523 engine/plugin. This changes cvars, not owner configs.
// Camera/index/capture controls and save/fresh-process tests are separate gates.
log_name p523water
log_dir logs
log_enable 1
log_developer 1
con_notifytime 0
cl_idlefps 0
cl_maxfps 100
hl2_dither_alpha 1
hl2_dither_force 0
r_glsl_turbscale_reflect 1
r_glsl_turbscale_refract 1
r_envcubemap 1
r_reflectcube_nosky 1
r_refractreflect_scale 0.5
r_waterwarp 0
hl2_water 3
map surf_tensor2
waitmap 45
waitms 5000
menu_restart
waitms 500
ui_close
gfx_menu page 1
gfx_menu status
echo P523_DEFAULT_3
hl2_water
gfx_menu cycle 1
waitms 1500
echo P523_MENU_BUDGET_4
hl2_water
r_shaderpasses ocean/dark
screenshot p523water_budget
gfx_menu cycle 1
waitms 1000
echo P523_FLAT_0
hl2_water
gfx_menu cycle 1
waitms 1000
echo P523_CHEAP_1
hl2_water
r_shaderpasses ocean/dark
gfx_menu cycle 1
waitms 1000
echo P523_FULL_2
hl2_water
r_shaderpasses ocean/dark
gfx_menu cycle 1
waitms 1000
echo P523_DITHER_3
hl2_water
gfx_menu status
echo P523_MENU_CYCLE_COMPLETE
