# surfd drop-in: /etc/systemd/system/surfd.service.d/20-hid-evidence.conf
# surfd/hidupload.py stores each journal beside its receipt, <evidence>/<map>/<runid>.hid.
# ProtectSystem=strict mounts /srv/nvme read-only for surfd, so without this every
# POST /api/hid answers 503 (EROFS). Last stored journal before it: 26 Oct 2026.
[Service]
ReadWritePaths=/srv/nvme/ftesurf-server/game/ftesurf/data/evidence
